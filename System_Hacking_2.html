<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEH v13 — System Hacking Trainer</title>
<style>
:root{--bg:#0d1117;--bg2:#010409;--card:#161b22;--border:#30363d;--txt:#e6edf3;--muted:#8b949e;
--acc:#58a6ff;--acc2:#79c0ff;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--purple:#bc8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#0d1117 0%,#010409 100%);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
line-height:1.5;padding:20px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:32px;padding:24px;background:linear-gradient(135deg,rgba(88,166,255,.08),rgba(188,140,255,.08));
border:1px solid var(--border);border-radius:16px}
header h1{font-size:1.9rem;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--purple));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
header .sub{color:var(--muted);font-size:.95rem}
header .badge{display:inline-block;margin-top:12px;padding:4px 12px;background:rgba(88,166,255,.15);
color:var(--acc2);font-size:.75rem;font-weight:600;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:1.5rem;margin-bottom:4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;
box-shadow:0 4px 20px rgba(0,0,0,.3)}
.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:16px}
.serie{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px 14px;
cursor:pointer;transition:.2s;text-align:center;position:relative;overflow:hidden}
.serie::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
background:linear-gradient(90deg,var(--acc),var(--purple));opacity:0;transition:.2s}
.serie:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 8px 24px rgba(88,166,255,.15)}
.serie:hover::before{opacity:1}
.serie .n{font-size:1.6rem;font-weight:800;color:var(--acc)}
.serie .lbl{font-size:.8rem;color:var(--muted);margin-top:2px}
.serie .pct{margin-top:10px;font-size:1rem;font-weight:700}
.serie.done{border-color:rgba(63,185,80,.5)}
.serie.done .n{color:var(--ok)}
.serie.done::before{background:linear-gradient(90deg,var(--ok),#56d364);opacity:1}
.serie.mid{border-color:rgba(210,153,34,.5)}
.serie.mid .n{color:var(--warn)}
.serie.mid::before{background:linear-gradient(90deg,var(--warn),#e3b341);opacity:1}
.serie.bad{border-color:rgba(248,81,73,.5)}
.serie.bad .n{color:var(--bad)}
.serie.bad::before{background:linear-gradient(90deg,var(--bad),#ff7b72);opacity:1}

/* Quiz header */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.qhead .stats{display:flex;gap:18px;font-size:.85rem}
.qhead .stats>span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.g{background:var(--ok)}.dot.b{background:var(--bad)}.dot.n{background:var(--acc)}

.bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin:12px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--purple));transition:.3s;width:0}
.tag{display:inline-block;font-size:.7rem;background:rgba(88,166,255,.15);color:var(--acc2);
padding:4px 12px;border-radius:20px;margin-bottom:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.q{font-size:1.15rem;font-weight:600;margin-bottom:20px;line-height:1.45}
.opt{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
margin-bottom:10px;cursor:pointer;transition:.15s;display:flex;gap:14px;align-items:flex-start;
position:relative;user-select:none}
.opt:hover:not(.locked){border-color:var(--acc);background:rgba(88,166,255,.05);transform:translateX(2px)}
.opt .k{font-weight:800;color:var(--acc);min-width:22px;font-size:.95rem;flex-shrink:0}
.opt .o{flex:1}
.opt .hint{font-size:.7rem;color:var(--muted);margin-left:auto;padding:2px 8px;background:#21262d;border-radius:4px;flex-shrink:0}
.opt.correct{border-color:var(--ok);background:rgba(63,185,80,.1)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:rgba(248,81,73,.1)}
.opt.wrong .k{color:var(--bad)}
.opt.locked{cursor:default}
.opt.locked .hint{display:none}
.expl{margin-top:16px;padding:16px;border-radius:10px;font-size:.92rem;border-left:4px solid;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.expl.ok{background:rgba(63,185,80,.08);border-color:var(--ok)}
.expl.no{background:rgba(248,81,73,.08);border-color:var(--bad)}
.expl b{display:block;margin-bottom:8px;font-size:1rem}
.btn{background:linear-gradient(135deg,var(--acc),#4a9eff);color:#fff;border:none;border-radius:8px;
padding:12px 24px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 4px 12px rgba(88,166,255,.2)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(88,166,255,.3)}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--border);box-shadow:none}
.btn.sec:hover{border-color:var(--acc);color:var(--acc2);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#f85149,#da3633)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.score{font-size:3.5rem;font-weight:900;text-align:center;margin:20px 0;letter-spacing:-2px}
.score.ok{color:var(--ok)}.score.mid{color:var(--warn)}.score.bad{color:var(--bad)}
.res-stats{display:flex;justify-content:center;gap:32px;margin:20px 0;flex-wrap:wrap}
.res-stat{text-align:center}
.res-stat .v{font-size:1.6rem;font-weight:800}
.res-stat .l{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.res-stat.ok .v{color:var(--ok)}
.res-stat.bad .v{color:var(--bad)}
.rev{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;
margin-bottom:10px;font-size:.88rem}
.rev .qq{font-weight:600;margin-bottom:8px}
.rev .cc{color:var(--ok);font-size:.85rem;margin-top:4px}
.rev .ww{color:var(--bad);font-size:.85rem;margin-top:4px}
.rev .ee{color:var(--muted);margin-top:8px;font-size:.83rem;padding-top:8px;border-top:1px solid var(--border)}
.kbd{display:inline-block;padding:2px 7px;background:#21262d;border:1px solid var(--border);
border-radius:4px;font-size:.75rem;font-family:monospace;color:var(--acc2)}
.kbd-hint{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">

<header id="topHeader">
  <h1>🛡️ CEH v13 — System Hacking Trainer</h1>
  <div class="sub">Module 06 · Gaining Access → Escalating → Maintaining → Clearing Tracks</div>
  <div class="badge" id="hdrBadge">Exam 312-50</div>
</header>

<div id="home">
  <div class="card">
    <div id="homeInfo">Chargement…</div>
    <div class="series-grid" id="seriesGrid"></div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn sec" id="resetBtn">♻️ Réinitialiser la progression</button>
      <button class="btn sec" id="shuffleBtn">🎲 Remélanger la banque</button>
    </div>
  </div>
</div>

<div id="quiz" class="hidden">
  <div class="card">
    <div class="qhead">
      <button class="btn sec" id="menuBtn" style="padding:8px 14px;font-size:.85rem">← Menu</button>
      <div class="stats">
        <span><span class="dot n"></span><span id="qCounter">Q 1/50</span></span>
        <span><span class="dot g"></span><span id="qGood">0</span></span>
        <span><span class="dot b"></span><span id="qBad">0</span></span>
        <span style="font-weight:700" id="qPct">0%</span>
      </div>
    </div>
    <div class="bar"><i id="progBar"></i></div>
    <div style="margin-top:18px">
      <span class="tag" id="qCat">—</span>
      <div class="q" id="qText">—</div>
      <div id="opts"></div>
      <div id="feedback"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn hidden" id="nextBtn">Question suivante →</button>
      </div>
      <div class="kbd-hint">
        <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> <span class="kbd">4</span> pour répondre · <span class="kbd">Entrée</span> pour continuer
      </div>
    </div>
  </div>
</div>

<div id="result" class="hidden">
  <div class="card">
    <h1 style="text-align:center;margin-bottom:8px" id="resTitle">Résultat</h1>
    <div class="score" id="resScore">0%</div>
    <div class="res-stats">
      <div class="res-stat ok"><div class="v" id="resGood">0</div><div class="l">Bonnes</div></div>
      <div class="res-stat bad"><div class="v" id="resBad">0</div><div class="l">Mauvaises</div></div>
      <div class="res-stat"><div class="v" id="resTotal">0</div><div class="l">Total</div></div>
    </div>
    <div class="btn-row" style="justify-content:center;margin:20px 0">
      <button class="btn sec" id="homeBtn">← Accueil</button>
      <button class="btn" id="retryBtn">Refaire cette série</button>
    </div>
    <h3 style="margin-bottom:12px;margin-top:20px">📋 Revue détaillée</h3>
    <div id="review"></div>
  </div>
</div>

</div>

<script>
/* ============================================================
   BANQUE DE QUESTIONS — CEH v13 System Hacking (~440 questions)
   ============================================================ */
const BANK = [
/* ---------- PASSWORD CRACKING / AUTH ---------- */
{c:"Auth",q:"Which Windows component stores LM/NTLM password hashes locally on a workstation?",o:["NTDS.dit","SAM database","LSASS memory cache","The SECURITY registry hive"],a:1,e:"Le SAM stocke les hashs LM/NTLM locaux. NTDS.dit = base AD sur le DC."},
{c:"Auth",q:"What is the primary role of SYSKEY in Windows authentication?",o:["Generates the NTLM challenge","Partially encrypts the SAM database hashes","Replaces NTLM with Kerberos","Signs Kerberos TGTs"],a:1,e:"SYSKEY (NT 4.0+) chiffre partiellement les hashs du SAM."},
{c:"Auth",q:"What is a key limitation of the LM hashing algorithm?",o:["It only supports passwords under 8 characters","It cannot compute a hash for passwords longer than 14 characters, using a dummy value instead","It requires Kerberos to function","It stores passwords in cleartext"],a:1,e:"LM découpe en deux blocs de 7. Au-delà de 14 caractères → valeur factice."},
{c:"Auth",q:"How many distinct steps does the NTLM challenge-response authentication process involve in the CEH model?",o:["3","4","6","8"],a:2,e:"6 étapes : utilisateur tape mdp, Windows hash, demande DC, challenge, réponse, comparaison."},
{c:"Auth",q:"Within the Kerberos KDC, which two services cooperate to issue tickets?",o:["AS and TGS","AS and LDAP","TGS and DNS","KDC and PDC"],a:0,e:"AS délivre le TGT, TGS délivre les tickets de service."},
{c:"Auth",q:"Which ticket does the Authentication Server (AS) return to a client during Kerberos authentication?",o:["A service ticket for the requested SPN","A Ticket Granting Ticket (TGT)","A golden ticket","An AS-REP hash"],a:1,e:"L'AS renvoie un TGT via KRB_AS_REP."},
{c:"Password Cracking",q:"AS-REP Roasting specifically targets accounts that...",o:["Have Service Principal Names registered","Have 'Do not require Kerberos preauthentication' enabled","Are members of Domain Admins","Have a password older than 90 days"],a:1,e:"Comptes sans pré-auth Kerberos → AS-REP chiffré → crack offline."},
{c:"Password Cracking",q:"In a Kerberoasting attack, what does the attacker actually crack offline?",o:["The KRBTGT NTLM hash","A TGS ticket encrypted with the service account's password hash","The client's TGT","The DC's machine account password"],a:1,e:"TGS chiffré avec le hash du compte de service → crack offline."},
{c:"Password Cracking",q:"What distinguishes password spraying from a classic brute-force attack?",o:["It uses a rainbow table instead of a wordlist","It tries one common password across many accounts to avoid lockout","It only targets local accounts","It requires the SAM file to be copied first"],a:1,e:"Spraying = UN mot de passe sur BEAUCOUP de comptes."},
{c:"Password Cracking",q:"Which tool is the de-facto standard for LLMNR/NBT-NS poisoning on Windows networks?",o:["Responder","Hashcat","Rubeus","Impacket"],a:0,e:"Responder empoisonne LLMNR/NBT-NS pour capturer NTLMv2-SSP."},
{c:"Password Cracking",q:"What is the core principle behind a rainbow table attack?",o:["Generating hashes on the fly with GPU acceleration","Using precomputed password→hash chains to trade storage for speed","Intercepting NTLM challenges on the wire","Injecting hashes directly into LSASS"],a:1,e:"Précalcul hashs en chaînes : stockage vs vitesse."},
{c:"Password Cracking",q:"Which RainbowCrack command actually performs the cracking (lookup) step?",o:["rtgen","rtsort","rcrack","hashcat"],a:2,e:"rtgen génère, rtsort trie, rcrack recherche."},
{c:"Password Cracking",q:"In John the Ripper, which mode uses information from the account itself (username, GECOS) as password guesses?",o:["Single crack mode","Wordlist mode","Incremental mode","External mode"],a:0,e:"Single crack = variations depuis username/GECOS."},
{c:"Password Cracking",q:"Why is the unshadow utility used before running John on Linux hashes?",o:["It decrypts /etc/shadow","It merges /etc/passwd and /etc/shadow into a single file John can parse","It generates rainbow tables","It converts NTLM to LM"],a:1,e:"unshadow combine passwd + shadow."},
{c:"Password Cracking",q:"The concept that two different inputs can produce the same hash, made likely sooner than intuition suggests, is called...",o:["Rainbow chaining","The birthday paradox / collision","Salting","Hash injection"],a:1,e:"Collision + paradoxe des anniversaires."},
{c:"Password Cracking",q:"What does a Distributed Network Attack (DNA) use to crack passwords?",o:["A single GPU workstation with rainbow tables","A DNA Server managing a job queue plus DNA clients across multiple machines","A botnet exclusively on Linux","Only cloud-based FPGAs"],a:1,e:"DNA Server + DNA Client distribué."},
{c:"Password Cracking",q:"Which technique splits password database entries into 2–3 character syllables to build probable words before a dictionary attack?",o:["Markov-chain attack","GPU-based attack","Rule-based attack","Mask attack"],a:0,e:"Markov-chain : n-grams → nouveaux mots probables."},
{c:"Password Cracking",q:"What defines a passive online password attack?",o:["The attacker communicates directly with the victim machine","The attacker does not communicate with the authorizing party — e.g. wire sniffing or MITM","The attacker copies the SAM file and cracks locally","The attacker uses only social engineering"],a:1,e:"Passive online = pas de contact avec l'autorité d'auth."},
{c:"Password Cracking",q:"Which of the following is a NON-electronic password attack?",o:["Replay attack","Shoulder surfing","LLMNR poisoning","Rainbow table lookup"],a:1,e:"Non-electronic : shoulder surfing, social engineering, dumpster diving."},
{c:"Password Cracking",q:"Which port combination is commonly targeted during password spraying?",o:["MSSQL 1433, SSH 22, FTP 21, SMB 445","HTTP 80, HTTPS 443, DNS 53","RDP 3389 only","Kerberos 88 only"],a:0,e:"MSSQL/SSH/FTP/SMB/Telnet/Kerberos."},
{c:"Password Cracking",q:"Which Windows countermeasure directly prevents Responder-style LLMNR/NBT-NS poisoning?",o:["Enabling SYSKEY","Disabling LLMNR and NBT-NS via registry/Group Policy","Blocking port 445 only","Requiring 30-day password changes"],a:1,e:"Désactiver LLMNR/NBT-NS neutralise Responder."},
{c:"Password Cracking",q:"Which tool is preferred to extract TGS tickets for Kerberoasting?",o:["Rubeus","Wireshark","hashID","Patator"],a:0,e:"Rubeus (ou Impacket GetUserSPNs)."},
{c:"Password Cracking",q:"Which mimikatz command leverages a compromised DC to retrieve the KRBTGT hash remotely?",o:["sekurlsa::logonpasswords","lsadump::dcsync /user:krbtgt","kerberos::golden","privilege::debug"],a:1,e:"DCSync simule la réplication AD pour extraire KRBTGT."},
{c:"Password Cracking",q:"Which file holds password hashes on modern Linux systems?",o:["/etc/passwd","/etc/shadow","/etc/security/opasswd","/var/log/auth.log"],a:1,e:"/etc/shadow : lisible root uniquement."},
{c:"Password Cracking",q:"In Meterpreter, which command dumps Windows SAM hashes directly?",o:["hashdump","sysinfo","creds_all","kiwi"],a:0,e:"hashdump : username, RID, hash du SAM."},
{c:"Password Cracking",q:"The Meterpreter 'kiwi' module replaces which classic tool?",o:["Responder","mimikatz","hashcat","John the Ripper"],a:1,e:"kiwi = mimikatz modernisé."},
{c:"Password Cracking",q:"Which kiwi command would you use to specifically retrieve NTLM hashes from the MSV package?",o:["creds_all","creds_msv","creds_kerberos","lsa_dump_secrets"],a:1,e:"creds_msv = MSV authentication package (NTLM)."},
{c:"Password Cracking",q:"What type of hashes does Responder primarily capture?",o:["NTLMv2-SSP","LM","Kerberos TGT","MD5 salted"],a:0,e:"Responder capture des NTLMv2-SSP."},
{c:"Password Cracking",q:"Which attack abuses a browser's OpenGL API access to steal passwords via side-channel leaks?",o:["Markov-chain attack","GPU-based attack","Replay attack","Mask attack"],a:1,e:"GPU-based attack exploite OpenGL."},
{c:"Password Cracking",q:"What is the primary defense against hash collisions?",o:["Using a shorter hash","Enlarging the hash space (and salting)","Disabling SYSKEY","Switching to LM hashing"],a:1,e:"Espace plus grand + salage."},
{c:"Password Cracking",q:"Which of the following is an ACTIVE online attack?",o:["Wire sniffing","Replay attack","Password spraying","Rainbow table lookup"],a:2,e:"Spraying = active online."},
{c:"Password Cracking",q:"Which command in Hydra tries a single password across a list of usernames against FTP?",o:["hydra -l admin -p password ftp://target","hydra -L logins.txt -p test ftp://target","hydra -l admin -P passwords.txt ftp://target","hydra -L logins.txt -P passwords.txt ftp://target"],a:1,e:"-L liste users, -p un seul password."},
{c:"Password Cracking",q:"Why can a simple dictionary attack fail against a passphrase?",o:["Because passphrases are always hashed with SHA-512","Because dictionary words are single tokens — a multi-word passphrase won't match","Because passphrases bypass authentication entirely","Because Kerberos rejects them"],a:1,e:"Passphrase = plusieurs mots, pas un mot isolé."},
{c:"Auth",q:"Which Kerberos message type carries the client's request for a service ticket?",o:["KRB_AS_REQ","KRB_AS_REP","KRB_TGS_REQ","KRB_AP_REQ"],a:2,e:"KRB_TGS_REQ : client → TGS."},
{c:"Auth",q:"What is a Service Principal Name (SPN) in Kerberos?",o:["A unique identifier for a service instance an account can run","The domain's NetBIOS name","A synonym for the TGT","A type of AS-REP hash"],a:0,e:"SPN identifie une instance de service."},
{c:"Password Cracking",q:"The Internal Monologue attack allows an attacker to...",o:["Relay NTLM hashes over the network","Retrieve NTLM hashes using the NTLM internal monologue feature without touching LSASS","Crack Kerberos TGTs offline","Bypass UAC without notification"],a:1,e:"Internal Monologue : hash NTLM sans toucher LSASS."},
{c:"Password Cracking",q:"Which is a valid Kerberos-cracking scenario?",o:["Request an AS-REP for an account without pre-auth and crack it offline","Sniff the TGT and decrypt it with a rainbow table","Intercept the KRB_AS_REQ in cleartext","Replay the KRB_AP_REP to the TGS"],a:0,e:"AS-REP Roasting."},
{c:"Password Cracking",q:"Which of the following best describes 'cracking'?",o:["Decrypting a ciphertext","Finding an input that produces the same hash as the stored one","Stealing the SAM file","Enabling SYSKEY"],a:1,e:"Cracker = trouver une préimage."},
{c:"Password Cracking",q:"What is the recommended password change policy per CEH?",o:["Every 7 days","Every 30 days","Every 90 days","Never"],a:1,e:"CEH recommande ~30 jours."},
{c:"Password Cracking",q:"Which hash is weaker by design: LM or NTLM?",o:["LM (7-char blocks, uppercase, no salt)","NTLM (case-sensitive, MD4)","They are equivalent","Kerberos is weaker than both"],a:0,e:"LM est beaucoup plus faible que NTLM."},
{c:"Password Cracking",q:"Which tool dumps Windows SAM hashes offline from a copied SAM/SYSTEM hive?",o:["pwdump7","Responder","Rubeus","certipy"],a:0,e:"pwdump7 extrait les hashs du SAM."},
{c:"Password Cracking",q:"Why is Kerberos considered stronger than NTLM?",o:["It provides mutual authentication and uses time-stamped tickets","It uses shorter keys","It does not rely on encryption","It stores passwords in cleartext"],a:0,e:"Kerberos = auth mutuelle + tickets horodatés."},
{c:"Password Cracking",q:"What is a key advantage of pass-the-hash?",o:["It does not require cracking the plaintext password","It works only on Linux","It uses rainbow tables","It bypasses MFA"],a:0,e:"Le hash NTLM suffit pour s'authentifier."},
{c:"Password Cracking",q:"Which statement best describes credential dumping?",o:["Extracting credentials from memory, disk, or network to reuse them","Cracking passwords with a GPU","Encrypting credentials","Rolling back credentials"],a:0,e:"Credential dumping : LSASS, SAM, tickets, etc."},
{c:"Password Cracking",q:"Which is a legitimate weakness of password spraying?",o:["It can trigger account lockouts if not carefully paced","It always fails against AD","It requires physical access","It cannot be detected"],a:0,e:"Spraying doit rester sous le seuil de lockout."},
{c:"Password Cracking",q:"Which tool is a password cracker for NTLM hashes with GPU acceleration?",o:["Hashcat","Wireshark","Impacket","Nmap"],a:0,e:"Hashcat = crack GPU."},
{c:"Password Cracking",q:"What does the 'rockyou.txt' wordlist contain?",o:["Millions of leaked real-world passwords","All Kerberos tickets","SAM dumps","Hashcat rules"],a:0,e:"rockyou.txt = fuite de mots de passe réels."},
{c:"Password Cracking",q:"Which password attack requires the attacker to have precomputed tables specific to the target hash type?",o:["Rainbow table attack","Dictionary attack","Brute force","Password spraying"],a:0,e:"Rainbow = tables spécifiques au hash + charset."},
{c:"Password Cracking",q:"Which of the following is NOT a Kerberos ticket type?",o:["TGT (Ticket Granting Ticket)","TGS (service ticket)","Golden ticket","LM ticket"],a:3,e:"LM ticket n'existe pas."},
{c:"Password Cracking",q:"Which tool can perform password spraying across SMB, SSH and other services?",o:["Hydra","John the Ripper","Responder","GMER"],a:0,e:"Hydra couvre de nombreux protocoles."},
{c:"Password Cracking",q:"Why is NTLMv2 stronger than NTLMv1?",o:["It uses HMAC-MD5 and a client challenge","It uses shorter keys","It avoids hashing","It uses LM as fallback"],a:0,e:"NTLMv2 = HMAC-MD5 + client challenge."},

/* ---------- VULN EXPLOITATION / BUFFER OVERFLOW ---------- */
{c:"Buffer Overflow",q:"A buffer overflow occurs when...",o:["A program reads more data than it allocated, overwriting adjacent memory","A firewall drops packets beyond its buffer","A hash exceeds 14 characters","A Kerberos ticket expires"],a:0,e:"Écrire plus que prévu → écrasement mémoire voisine."},

/* ---------- AUTH / KERBEROS AVANCÉ ---------- */
{c:"Auth",q:"What does the Kerberos KRB_AP_REP message contain?",o:["The client's initial request","The server's response confirming (or denying) access to the requested service","The user's password hash","The domain SID"],a:1,e:"KRB_AP_REP = réponse du serveur applicatif : accès autorisé ou refusé."},
{c:"Auth",q:"Why are Kerberos messages between the client and the KDC encrypted?",o:["To prevent eavesdropping and impersonation — the encryption key is derived from the user's password","To save bandwidth","To speed up authentication","To compress the tickets"],a:0,e:"Le chiffrement avec une clé dérivée du mot de passe protège les échanges KRB_AS_REQ/REP."},
{c:"Auth",q:"What is the difference between the AS and the TGS in a KDC?",o:["AS authenticates the user and issues the TGT; TGS issues service tickets based on the TGT","AS issues service tickets; TGS authenticates the user","They are the same service","AS is on Linux; TGS is on Windows"],a:0,e:"AS = authentification initiale (TGT). TGS = tickets de service."},
{c:"Auth",q:"Which Kerberos preauthentication flaw makes AS-REP Roasting possible?",o:["Some accounts are configured with 'Do not require Kerberos preauthentication'","Kerberos uses MD4 which is reversible","The KDC leaks its private key","The TGT is sent in cleartext"],a:0,e:"Sans pré-auth, le KDC renvoie un AS-REP chiffré avec la clé du compte → crack offline."},
{c:"Auth",q:"What is a Kerberos SPN (Service Principal Name)?",o:["A unique identifier mapping a service instance to an account","A type of ticket","The KDC's hostname","A password policy"],a:0,e:"SPN = service/host. Ex : MSSQLSvc/sql01.domain.local:1433."},
{c:"Auth",q:"Which Kerberos ticket does the client present to a service for access?",o:["The TGT","The service ticket (TGS)","The AS-REP","The KRBTGT hash"],a:1,e:"Le client présente le ticket de service (TGS) au serveur applicatif (KRB_AP_REQ)."},
{c:"Auth",q:"Why is NTLM considered a legacy protocol in modern Windows environments?",o:["Kerberos is more secure (mutual auth, time-bound tickets) and is the default in AD","NTLM is faster","NTLM requires Linux","NTLM is not supported on Windows"],a:0,e:"Kerberos est par défaut et plus sûr. NTLM reste pour compatibilité."},
{c:"Auth",q:"What is the role of SYSKEY's startup key in Windows?",o:["Encrypt part of the SAM to protect hashes at rest","Generate Kerberos TGTs","Sign NTLM challenges","Enable BitLocker"],a:0,e:"SYSKEY chiffre partiellement les hashs du SAM avec une clé dérivée."},
{c:"Auth",q:"Which registry hive contains the SAM?",o:["HKLM\\SAM","HKLM\\SYSTEM","HKCU\\SAM","HKLM\\SOFTWARE"],a:0,e:"HKLM\\SAM (monté depuis %SystemRoot%\\system32\\config\\SAM)."},
{c:"Auth",q:"Why is the SAM file locked while Windows is running?",o:["An exclusive filesystem lock prevents copying while Windows uses it","Antivirus blocks it","SYSKEY encrypts it at runtime","BitLocker locks it"],a:0,e:"Lock exclusif → les attaquants utilisent des techniques offline ou l'extraction via LSASS/hashdump."},

{c:"Password Cracking",q:"What is the 'NT' format in John the Ripper used for?",o:["Cracking Windows NTLM hashes","Cracking Linux shadow hashes","Cracking Kerberos tickets","Cracking MD5 web hashes"],a:0,e:"--format=NT cible les hashs NTLM."},
{c:"Password Cracking",q:"Which John the Ripper mode is the SLOWEST but most thorough?",o:["Single crack","Wordlist","Incremental","Rule-based"],a:2,e:"Incremental = brute-force complet (toutes les combinaisons)."},
{c:"Password Cracking",q:"What does '--rules' do in John the Ripper?",o:["Applies mangling rules to wordlist entries (uppercase, append digits, etc.)","Sorts the wordlist","Encrypts the wordlist","Downloads more words"],a:0,e:"--rules applique des transformations (mangling) aux mots du dictionnaire."},
{c:"Password Cracking",q:"Why is a GPU better than a CPU for password cracking?",o:["GPUs have thousands of cores optimised for parallel hash computations","GPUs use less electricity","GPUs run Windows only","GPUs bypass antivirus"],a:0,e:"GPU = milliers de cœurs, parfait pour hashcat/brute force parallèle."},
{c:"Password Cracking",q:"Which hash type does Hashcat mode -m 1000 target?",o:["NTLM","MD5","SHA1","bcrypt"],a:0,e:"-m 1000 = NTLM. -m 0 = MD5. -m 100 = SHA1. -m 3200 = bcrypt."},
{c:"Password Cracking",q:"What is the purpose of 'mask attack' in password cracking?",o:["Crack passwords matching a known pattern (e.g. ?u?l?l?l?d?d)","Try every possible password","Use a rainbow table","Replay NTLM hashes"],a:0,e:"Mask = motif connu (majuscules/minuscules/chiffres) → beaucoup plus rapide que brute force complet."},
{c:"Password Cracking",q:"What is 'credential stuffing'?",o:["Trying known username/password pairs from a breach against other services","Filling the SAM with dummy hashes","Injecting credentials into LSASS","Replaying Kerberos tickets"],a:0,e:"Stuffing = réutilisation de creds fuitées sur d'autres services."},
{c:"Password Cracking",q:"Why is MFA a strong countermeasure against password attacks?",o:["It requires a second factor beyond the password, defeating stolen or cracked credentials","It encrypts the SAM","It disables LM","It forces Kerberos"],a:0,e:"Même avec le mot de passe, l'attaquant ne peut pas s'authentifier sans le second facteur."},
{c:"Password Cracking",q:"What is the goal of a 'hash length extension' attack?",o:["Forge a valid hash for a modified message given the original hash and length (MD5/SHA1 with secret prefix)","Extend a rainbow table","Extend the SAM","Extend the TGT lifetime"],a:0,e:"Attaque sur constructions naïves : hash(secret||message). Contre-mesure : HMAC."},
{c:"Password Cracking",q:"Why do organisations use account lockout thresholds?",o:["To slow down brute-force and spraying attacks","To speed up login","To encrypt passwords","To enable MFA"],a:0,e:"Lockout complique les attaques online. Contre-mesure classique."},
{c:"Password Cracking",q:"What is a 'password audit' in the CEH context?",o:["Periodically testing password strength against best practices","Deleting all passwords","Rotating encryption keys","Scanning for open ports"],a:0,e:"Audit régulier des mots de passe (politique, robustesse)."},

{c:"Concepts",q:"Why is 'order of volatility' important in forensics?",o:["You collect the most volatile data first (RAM before disk)","You collect the largest first","You collect the oldest first","You collect the newest first"],a:0,e:"RAM (volatile) → disque → backups (non-volatile)."},
{c:"Concepts",q:"What does 'RFC 3227' cover?",o:["Guidelines for evidence collection and archiving","AES encryption","Kerberos","DNS tunneling"],a:0,e:"RFC 3227 = principes de collecte de preuves."},
{c:"Concepts",q:"Which hash algorithms are commonly used for digital evidence integrity?",o:["MD5 and SHA-1/SHA-256","LM and NTLM","Kerberos and TGT","AES and RSA"],a:0,e:"MD5 + SHA-1/256 = empreintes d'intégrité pour preuves."},
{c:"Concepts",q:"What is 'anti-forensics'?",o:["Techniques used by attackers to hinder forensic analysis","Malware analysis","Network scanning","Password auditing"],a:0,e:"Anti-forensics = timestomping, log cleaning, encryption, obfuscation."},
{c:"Concepts",q:"Why might attackers use full-disk encryption on victim machines?",o:["To prevent forensics — data is inaccessible without the key","To speed up the disk","To enable Kerberos","To disable MFA"],a:0,e:"FDE = anti-forensics puissant (utilisé par ransomware aussi)."},
{c:"Concepts",q:"What is 'memory forensics'?",o:["Analyzing RAM dumps for malware, keys, credentials","Analyzing disk images","Analyzing network traffic","Analyzing cloud logs"],a:0,e:"Memory forensics (Volatility) = RAM analysis."},
{c:"Concepts",q:"Why is RAM forensically valuable?",o:["It contains volatile artifacts (running processes, keys, credentials, network connections) lost at shutdown","It is encrypted","It is permanent","It stores SAM"],a:0,e:"RAM = artefacts volatils précieux (mais facilement perdus)."},
{c:"Concepts",q:"Which is a common Cloud attack vector in CEH v13 scope?",o:["Misconfigured S3 buckets / exposed cloud metadata (IMDS)","Kernel exploits only","Kerberos only","LM hashing"],a:0,e:"Cloud : buckets exposés, IMDS SSRF, IAM mal configurés."},
{c:"Concepts",q:"What is 'IMDS' abuse in cloud environments?",o:["Exploiting the Instance Metadata Service (169.254.169.254) to steal IAM credentials","Abusing Kerberos","Disabling MFA","Cracking LM"],a:0,e:"IMDS = endpoint interne exposant les creds IAM (SSRF)."},
{c:"Concepts",q:"What is 'serverless' abuse in cloud security?",o:["Exploiting misconfigured Lambda/Functions with excessive IAM rights","Kernel exploits","Kerberos attacks","LM hashing"],a:0,e:"Functions avec rôles trop permissifs = privesc cloud."},
{c:"Concepts",q:"Which is a common misconfiguration in cloud storage?",o:["Public S3 buckets exposing sensitive data","Encrypted buckets","Private buckets","Versioned buckets"],a:0,e:"Buckets publics = fuite de données classique."},
{c:"Concepts",q:"What is 'container escape'?",o:["Breaking out of a container to access the host system","Escaping a Kerberos realm","Escaping a firewall","Escaping a sandbox VM only"],a:0,e:"Container escape = abus de capabilities/kernel pour atteindre l'hôte."},
{c:"Concepts",q:"Which is a common Kubernetes misconfiguration?",o:["Anonymous access to the API server or excessive RBAC","Enabling MFA","Encrypting secrets","Network policies"],a:0,e:"K8s : API server exposé, RBAC trop permissif, secrets en clair."},
{c:"Concepts",q:"What does 'east-west' traffic refer to in a datacenter?",o:["Traffic between internal services","Traffic to the internet","Traffic to end users","Traffic to backups"],a:0,e:"East-west = interne. North-south = internet ↔ datacenter."},

/* ---------- SCÉNARIOS D'EXAMEN TYPE CEH ---------- */
{c:"Scenario",q:"A pentester captures NTLMv2-SSP hashes on a Windows network without credentials. Which is the most likely method used?",o:["Responder poisoning LLMNR/NBT-NS","Kerberoasting","DCSync","Golden Ticket"],a:0,e:"Responder → LLMNR/NBT-NS poison → NTLMv2-SSP capture."},
{c:"Scenario",q:"An attacker with a valid low-priv domain account requests service tickets for many SPNs, then cracks them offline. What attack is this?",o:["Kerberoasting","AS-REP Roasting","Golden Ticket","Pass-the-Hash"],a:0,e:"Kerberoasting : demande de TGS pour comptes de service."},
{c:"Scenario",q:"An attacker extracts the KRBTGT hash and forges a TGT valid for 10 years. Which attack is this?",o:["Golden Ticket","Silver Ticket","Skeleton Key","Kerberoasting"],a:0,e:"Golden Ticket via KRBTGT."},
{c:"Scenario",q:"A low-priv user creates a named pipe server, tricks SYSTEM into connecting, and gains SYSTEM. Which technique is this?",o:["Named Pipe Impersonation","DLL Hijacking","UAC Bypass","DCSync"],a:0,e:"Pipe server faible privilège + client SYSTEM → impersonation."},
{c:"Scenario",q:"An attacker places a malicious DLL next to a legitimate application that loads DLLs without full paths. What technique is this?",o:["DLL Hijacking / Search Order Hijacking","Named Pipe Impersonation","Kerberoasting","DCSync"],a:0,e:"DLL hijack exploite l'ordre de recherche DLL."},
{c:"Scenario",q:"An attacker obtains a shell as www-data and needs root to read /etc/shadow. Which phase applies?",o:["Escalating Privileges","Gaining Access","Maintaining Access","Clearing Tracks"],a:0,e:"Escalating Privileges : user → root."},
{c:"Scenario",q:"An attacker dumps LSASS memory on a Windows host and extracts NTLM hashes. Which tool is most associated with this?",o:["mimikatz/kiwi","Responder","Rubeus","Nmap"],a:0,e:"mimikatz/kiwi : dump LSASS → creds."},
{c:"Scenario",q:"An attacker creates a WMI event subscription to run a payload at every user logon. Which phase?",o:["Maintaining Access / Persistence","Gaining Access","Reconnaissance","Clearing Tracks"],a:0,e:"Persistance via WMI Event Subscription."},
{c:"Scenario",q:"An attacker uploads a Meterpreter payload as an alternate data stream inside a legitimate .txt file. Which hiding technique is this?",o:["NTFS ADS","Timestomping","Steganography in images","Dot files"],a:0,e:"ADS NTFS : fichier dans un fichier, taille apparente inchangée."},
{c:"Scenario",q:"An attacker hides a message inside a PNG image by modifying the least significant bits of pixels. Which technique is this?",o:["LSB Image Steganography","NTFS ADS","Timestomping","DNS tunneling"],a:0,e:"LSB insertion dans les pixels."},
{c:"Scenario",q:"An attacker uses wevtutil cl Security on a Windows server after exploiting it. Which phase?",o:["Clearing Tracks","Gaining Access","Escalating Privileges","Maintaining Access"],a:0,e:"Effacement de logs = Clearing Tracks."},
{c:"Scenario",q:"A pentester uses msfvenom to generate a reverse_tcp payload with shikata_ga_nai encoding. What is the goal of the encoding?",o:["Evade AV/IDS signature detection","Increase speed","Enable Kerberos","Disable logging"],a:0,e:"Encoder = obfuscation / évasion."},
{c:"Scenario",q:"An attacker compiles a 32-bit exploit on a 64-bit Linux host for a 32-bit target. What is the correct next step after compilation?",o:["Host the binary on a web server and transfer it to the target","Run it directly on the host","Delete it","Encrypt it"],a:0,e:"Transfert via serveur web (HTTP) vers la cible."},
{c:"Scenario",q:"An attacker uses 'route add' in Meterpreter to reach a new subnet. Which phase/technique is this?",o:["Pivoting","Escalation","Persistence","Clearing Tracks"],a:0,e:"Pivoting = atteindre d'autres réseaux."},
{c:"Scenario",q:"An attacker uploads a web shell to a public-facing web server. Which phase does this fall under?",o:["Maintaining Access / Persistence","Reconnaissance","Scanning","Reporting"],a:0,e:"Web shell = persistance/accès durable."},
{c:"Scenario",q:"A pentester uses searchsploit 'eternalblue' and finds MS17-010. What CVE matches it?",o:["CVE-2017-0144","CVE-2021-44228","CVE-2014-0160","CVE-2019-0708"],a:0,e:"MS17-010 = CVE-2017-0144 (SMBv1 RCE). CVE-2019-0708 = BlueKeep (RDP)."},
{c:"Scenario",q:"An attacker exploits an unquoted service path in Windows. Which phase?",o:["Escalating Privileges","Gaining Access","Clearing Tracks","Reconnaissance"],a:0,e:"Unquoted service path = privesc."},
{c:"Scenario",q:"An attacker uses sudo -l on a Linux host and finds that 'nmap' can be run as root. What is the next step?",o:["Abuse nmap's --interactive mode to spawn a root shell (GTFOBins)","Run nmap normally","Report to sysadmin","Reboot the host"],a:0,e:"GTFOBins : nmap --interactive → shell root si autorisé via sudo."},
{c:"Scenario",q:"A forensic analyst finds an MFT record whose timestamps are inconsistent (Modified < Created). What is the most likely explanation?",o:["Timestomping by an attacker","Disk corruption","Antivirus update","Kernel panic"],a:0,e:"Timestomping = incohérences de timestamps."},
{c:"Scenario",q:"An attacker captures a Kerberos TGT and reuses it on another machine to authenticate. Which attack is this?",o:["Pass-the-Ticket","Pass-the-Hash","Kerberoasting","AS-REP Roasting"],a:0,e:"Pass-the-Ticket : réutilisation du TGT."},
{c:"Scenario",q:"A pentester uses 'IEX (New-Object Net.WebClient).DownloadString()' on Windows. What is the main advantage?",o:["Fileless execution — no file on disk","It bypasses MFA","It encrypts the SAM","It disables Kerberos"],a:0,e:"Exécution en mémoire → peu de traces disque."},
{c:"Scenario",q:"An attacker adds a registry Run key pointing to a payload in %APPDATA%. Which technique is this?",o:["Persistence via Registry Run key","Persistence via WMI","Persistence via cron","Persistence via web shell"],a:0,e:"Run key : persistance au login utilisateur."},
{c:"Scenario",q:"An attacker uses BITS to download and execute a payload. Why is this stealthy?",o:["BITS is a legitimate Windows service used for updates","It bypasses Kerberos","It requires root","It encrypts the SAM"],a:0,e:"BITS = service légitime, discret."},
{c:"Scenario",q:"An attacker abuses DPAPI by obtaining the DC's master key. What do they gain?",o:["Ability to decrypt DPAPI-protected files across the domain","Root on Linux","A Kerberos TGT","The SAM hash"],a:0,e:"DPAPI master key = déchiffrement des secrets protégés."},
{c:"Scenario",q:"A SOC analyst sees Event ID 1102 on a domain controller. What should they suspect?",o:["An attacker cleared the audit log","A successful logon","A failed logon","A service started"],a:0,e:"1102 = log effacé, signal fort d'activité malveillante."},
{c:"Scenario",q:"An attacker uses 'certipy find -vulnerable' and finds a misconfigured template. Which escalation path is this?",o:["ADCS abuse","Kerberoasting","Pass-the-Hash","DCSync"],a:0,e:"ADCS templates vulnérables = escalade domaine."},
{c:"Scenario",q:"A pentester uses BloodHound and discovers a user with DCSync rights. What can they do?",o:["Pull password hashes from the DC via replication","Crack SAM offline","Bypass UAC","Disable Kerberos"],a:0,e:"DCSync rights = extraire des hashs (KRBTGT notamment)."},
{c:"Scenario",q:"An attacker hides a payload in an alternate data stream of a .txt file. Why is this problematic for defenders?",o:["The file size and name appear unchanged — impossible to spot with native tools","The file is encrypted","The file is deleted","The file is compressed"],a:0,e:"ADS invisibles au natif."},
{c:"Scenario",q:"An attacker injects code into explorer.exe to hide their process. Which technique is this?",o:["Process Injection","Timestomping","DLL Hijacking","Kerberoasting"],a:0,e:"Process injection = code dans un process légitime."},
{c:"Scenario",q:"A defender sees a new scheduled task running a PowerShell one-liner from a temp directory. Which technique is this?",o:["Persistence via Scheduled Task","Pass-the-Hash","Kerberoasting","DCSync"],a:0,e:"Scheduled task = persistance classique."},
{c:"Scenario",q:"An attacker compiles a Linux kernel exploit on their machine and uploads it to the target. Which phase does this belong to?",o:["Escalating Privileges","Reconnaissance","Scanning","Clearing Tracks"],a:0,e:"Kernel exploit = privesc."},
{c:"Scenario",q:"A pentester uses 'autopsy' on a disk image. Which phase is this?",o:["Forensics / post-mortem analysis","Gaining Access","Escalating Privileges","Persistence"],a:0,e:"Autopsy = analyse forensique (blue side)."},
{c:"Scenario",q:"An attacker uses 'shred' on Linux to overwrite a file. Which phase?",o:["Clearing Tracks","Gaining Access","Reconnaissance","Escalation"],a:0,e:"shred = effacement sécurisé = clearing tracks."},
{c:"Scenario",q:"An attacker uses DNS tunneling to exfiltrate data. Which phase is most associated?",o:["Clearing Tracks / Covert Channels","Gaining Access","Escalating Privileges","Reconnaissance only"],a:0,e:"DNS tunnel = canal caché (exfiltration, C2)."},
{c:"Scenario",q:"A defender wants to detect lateral movement via PsExec. Which artifact should they look for?",o:["Service creation events (7045) and PSEXESVC on the target","Event 4624 only","Event 1102","Event 4672"],a:0,e:"PsExec crée un service PSEXESVC + Event 7045 (service installé)."},
{c:"Scenario",q:"An attacker uses 'reg save HKLM\\SAM' and 'reg save HKLM\\SYSTEM'. Why?",o:["To extract hashes offline from the hives","To disable UAC","To enable Kerberos","To clear logs"],a:0,e:"reg save = copie des hives pour extraction hors ligne."},
{c:"Scenario",q:"An attacker captures a Kerberos ticket hash in Wireshark after spoofing DNS. Which attack family is this?",o:["Kerberos manipulation / MITM","Buffer overflow","ADS","Timestomping"],a:0,e:"MITM Kerberos = interception de tickets."},
{c:"Scenario",q:"A pentester uploads a payload with 'certutil -urlcache -f http://...'. Which LOLBin technique is this?",o:["File download via certutil","DLL hijack","Kerberoasting","DCSync"],a:0,e:"certutil = LOLBin pour téléchargement."},
{c:"Scenario",q:"An attacker uses a malicious LNK file inside a ZIP. Which vector is this?",o:["Client-side / phishing vector","Server-side RCE","Kerberos attack","Buffer overflow in SMB"],a:0,e:"LNK malveillant = vecteur client-side."},
{c:"Scenario",q:"An attacker uses HTML smuggling to deliver a payload. Which advantage does this give?",o:["Bypasses email/URL filters that don't detect reconstructed payloads","Enables Kerberos","Disables UAC","Cracks SAM"],a:0,e:"HTML smuggling contourne les filtres de contenu."},
{c:"Scenario",q:"A defender observes a process with a parent-child relationship that is unusual (e.g., winword.exe → powershell.exe). Which technique is likely?",o:["Malicious macro client-side execution","Kerberoasting","DCSync","Buffer overflow"],a:0,e:"Macro Office → PowerShell = chaîne classique de phishing."},
{c:"Scenario",q:"An attacker uses 'schtasks /create /sc onlogon' on a compromised Windows host. Which phase?",o:["Persistence","Reconnaissance","Scanning","Reporting"],a:0,e:"Tâche planifiée = persistance."},
{c:"Scenario",q:"A pentester runs 'net user /domain' after gaining an initial foothold. Which phase?",o:["Post-exploitation enumeration","Initial access","Reconnaissance externe","Reporting"],a:0,e:"Énumération post-exploitation du domaine."},
{c:"Scenario",q:"An attacker uses 'SharpHound' to collect AD data. Which tool consumes that data?",o:["BloodHound","Responder","Nmap","Hashcat"],a:0,e:"SharpHound → BloodHound."},
{c:"Scenario",q:"A defender finds a suspicious binary with timestamps identical to regedit.exe. Which technique is likely?",o:["Timestomping","DLL hijack","Kerberoasting","Golden Ticket"],a:0,e:"Timestomp -f a copié les timestamps de regedit.exe."},
{c:"Scenario",q:"An attacker uses 'regsvr32 /s /u /i:http://... scrobj.dll'. What is this technique?",o:["Remote scriptlet execution via a LOLBin","Pass-the-Hash","Kerberoasting","DCSync"],a:0,e:"regsvr32 + scrobj.dll = exécution distante sans fichier."},
{c:"Scenario",q:"An attacker uses 'mshta http://...' on Windows. Which LOLBin is being abused?",o:["mshta (HTML Application host)","certutil","wmic","regsvr32"],a:0,e:"mshta exécute des HTA distants/local."},
{c:"Scenario",q:"An attacker uses 'bitsadmin /transfer' to download a payload. Which LOLBin is being abused?",o:["bitsadmin","certutil","mshta","wmic"],a:0,e:"bitsadmin = téléchargement via BITS."},
{c:"Scenario",q:"A defender notices 'wmic process call create' spawning a suspicious command. Which technique is being used?",o:["Lateral movement / remote execution via WMI","Kerberoasting","DCSync","ADS hiding"],a:0,e:"wmic process call create = exécution distante (lat move)."},
{c:"Scenario",q:"An attacker uses 'Invoke-Obfuscation' on a PowerShell script. Why?",o:["To evade AMSI, script block logging and signature-based detection","To enable Kerberos","To disable UAC","To clear logs"],a:0,e:"Invoke-Obfuscation contourne les détections PowerShell."},
{c:"Scenario",q:"An attacker exploits SMB via EternalBlue to gain SYSTEM on a Windows host. Which phase?",o:["Gaining Access + Escalating Privileges","Reconnaissance","Reporting","Clearing Tracks"],a:0,e:"MS17-010 donne SYSTEM directement = gaining + escalation."},
{c:"Scenario",q:"An attacker uses 'ntlmrelayx' after Responder. What are they doing?",o:["Relaying captured NTLM auth to another service","Cracking hashes offline","Creating Kerberos tickets","Timestomping files"],a:0,e:"Relay NTLM : authentification relayée vers SMB/LDAP/etc."},
{c:"Scenario",q:"A defender observes an event 7045 creating a service with a path outside System32. What is the most likely cause?",o:["Persistence or lateral movement (e.g., PsExec)","A legitimate update","A Kerberos renewal","A DNS query"],a:0,e:"Service suspect = persistance/lat move (PsExec)."},
{c:"Scenario",q:"An attacker uses 'overpass-the-hash' to obtain a TGT. What did they use as input?",o:["The NTLM hash","The plaintext password","The SAM database","A rainbow table"],a:0,e:"Overpass-the-Hash : hash NTLM → TGT Kerberos."},
{c:"Scenario",q:"An attacker uses 'impacket-psexec' against a Windows host. Which protocol does it primarily use?",o:["SMB","Kerberos","HTTP","FTP"],a:0,e:"psexec = SMB (via services/admin shares)."},
{c:"Scenario",q:"An attacker uses 'impacket-wmiexec' against a Windows host. Which protocol does it primarily use?",o:["WMI (DCOM)","SMB only","RDP","SSH"],a:0,e:"wmiexec = WMI/DCOM."},
{c:"Scenario",q:"A defender observes a suspicious DNS query volume from one internal host. Which attack should they suspect?",o:["DNS tunneling / exfiltration","Kerberoasting","DCSync","Timestomping"],a:0,e:"Volume DNS anormal = tunneling."},
{c:"Scenario",q:"An attacker uses 'Invoke-Mimikatz' in memory. Why is this stealthy?",o:["Nothing is written to disk — it runs entirely in memory","It disables AV","It requires SYSTEM","It uses Kerberos"],a:0,e:"Invoke-Mimikatz = version PowerShell in-memory."},
{c:"Scenario",q:"A pentester finds 'WinPEAS' output indicating AlwaysInstallElevated is enabled. What can they do?",o:["Install an MSI with SYSTEM privileges","Bypass Kerberos","Clear logs","Timestomp files"],a:0,e:"AlwaysInstallElevated = MSI en SYSTEM."},
{c:"Scenario",q:"An attacker creates a Golden Ticket with a 10-year validity. What is the primary goal?",o:["Long-term, stealthy persistence with full domain control","Crack SAM offline","Disable UAC","Enable Kerberos"],a:0,e:"Golden Ticket = persistance longue + contrôle domaine."},
{c:"Scenario",q:"A defender sees a process 'svchost.exe' with a non-standard path and unusual parent. What might this indicate?",o:["Process injection or masquerading (rootkit/malware)","A normal Windows update","A Kerberos renewal","A password change"],a:0,e:"Masquerading svchost = indicateur d'injection/malware."},
{c:"Scenario",q:"An attacker uses 'BloodHound' to find a Kerberoastable user. What do they do next?",o:["Request TGS tickets for that user's SPNs and crack them offline","Crack SAM offline","Timestomp files","Clear logs"],a:0,e:"Kerberoast → crack offline des TGS."},
{c:"Scenario",q:"An attacker finds a sudo -l entry allowing '/usr/bin/vim'. What can they do?",o:["Spawn a root shell via vim's ':!sh' (GTFOBins)","Read /etc/shadow only","Disable UAC","Enable Kerberos"],a:0,e:"vim via sudo = shell root (GTFOBins)."},
{c:"Scenario",q:"An attacker uploads a web shell to a Java-based server. Which file extension is most common?",o:[".jsp",".php",".aspx",".py"],a:0,e:"Java = .jsp. PHP = .php. ASP.NET = .aspx."},
{c:"Scenario",q:"A defender finds 'AppInit_DLLs' modified in the registry. What is this?",o:["A persistence technique injecting a DLL into every user process","A Kerberos setting","A password policy","A firewall rule"],a:0,e:"AppInit_DLLs = injection globale."},
{c:"Scenario",q:"An attacker uses 'Invoke-WebRequest' to download a payload. Which LOLBin/technique is this?",o:["PowerShell download cradle","DLL hijack","Kerberoasting","DCSync"],a:0,e:"PowerShell = download cradle classique."},
{c:"Scenario",q:"A defender observes an unusually high volume of Kerberos TGS requests from one user. What should they suspect?",o:["Kerberoasting","DNS tunneling","Timestomping","Log clearing"],a:0,e:"Volume TGS = signature de Kerberoasting."},
{c:"Scenario",q:"An attacker exfiltrates data over HTTPS to a legitimate-looking domain. Which technique is this?",o:["Covert channel / domain fronting","Kerberoasting","DCSync","Buffer overflow"],a:0,e:"Covert channel via HTTPS/domain fronting."},
{c:"Scenario",q:"A pentester uses 'volatility' on a RAM dump. Which phase is this?",o:["Forensic analysis (defensive)","Gaining Access","Persistence","Clearing Tracks"],a:0,e:"Volatility = analyse mémoire (blue side)."},
{c:"Scenario",q:"An attacker attempts to bypass AMSI in PowerShell. Why?",o:["To evade runtime script inspection and run malicious content","To enable Kerberos","To disable UAC","To clear logs"],a:0,e:"AMSI = inspection runtime; bypass = évasion."},
{c:"Scenario",q:"An attacker uses 'schtasks /create /sc onstart' for SYSTEM-level persistence. Why is this effective?",o:["It runs at boot before user interaction","It encrypts the SAM","It disables AV","It enables Kerberos"],a:0,e:"Task onstart = exécution au démarrage."},
{c:"Scenario",q:"An attacker uses 'WMI event subscription' for persistence. Which advantage does this give?",o:["Very stealthy — no file or service needed","It requires SYSTEM","It bypasses MFA","It encrypts logs"],a:0,e:"WMI subscription = furtivité (composant légitime)."},

{c:"Concepts",q:"Which is the best defense against steganography in outbound traffic?",o:["DLP + traffic anomaly detection + content inspection","Disable HTTPS","Disable MFA","Enable LM"],a:0,e:"DLP + analyse d'anomalies."},

/* ============================================================
   APP LOGIC
   ============================================================ */
const SERIES_SIZE=50;
const LS_KEY='ceh_syshack_v2';
let state={series:[], current:null, idx:0, score:0, answers:[], results:{}, qs:[]};

function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}

function buildSeries(){
  const total=Math.ceil(BANK.length/SERIES_SIZE);
  const arr=[];
  for(let s=0;s<total;s++){
    const qs=BANK.slice(s*SERIES_SIZE,(s+1)*SERIES_SIZE).map((q,i)=>({...q}));
    arr.push(qs);
  }
  return arr;
}

function loadResults(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};}}
function saveResults(r){try{localStorage.setItem(LS_KEY,JSON.stringify(r));}catch(e){}}

function renderHome(){
  state.series=buildSeries();
  state.results=loadResults();
  const g=document.getElementById('seriesGrid');
  g.innerHTML='';
  document.getElementById('homeInfo').innerHTML=
    `📚 <b>${BANK.length}</b> questions uniques · <b>${state.series.length}</b> séries de ${SERIES_SIZE} · tirage aléatoire, options mélangées, clavier <span class="kbd">1</span>-<span class="kbd">4</span> + <span class="kbd">Entrée</span>.`;
  state.series.forEach((s,i)=>{
    const done=state.results[i];
    let cls='serie';
    if(done!==undefined)cls+=done>=80?' done':done>=60?' mid':' bad';
    const d=document.createElement('div');
    d.className=cls;
    d.innerHTML=`<div class="n">${i+1}</div><div class="lbl">${s.length} questions</div>`+
      (done!==undefined?`<div class="pct" style="color:inherit">${done}%</div>`:'');
    d.onclick=()=>startSeries(i);
    g.appendChild(d);
  });
  document.getElementById('hdrBadge').textContent=`Exam 312-50 · ${BANK.length} Q`;
}

function startSeries(i){
  state.current=i; state.idx=0; state.score=0; state.answers=[];
  state.qs=shuffle(state.series[i]);
  document.getElementById('home').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  const q=state.qs[state.idx];
  const correctText=q.o[q.a];
  const opts=shuffle(q.o);
  q._correctIdx=opts.indexOf(correctText);
  q._shuffledOpts=opts;

  document.getElementById('qCounter').textContent=`Q ${state.idx+1}/${state.qs.length}`;
  const good=state.answers.filter(a=>a.isRight).length;
  const bad=state.answers.filter(a=>!a.isRight).length;
  document.getElementById('qGood').textContent=good;
  document.getElementById('qBad').textContent=bad;
  const pct=state.answers.length?Math.round(good/state.answers.length*100):0;
  document.getElementById('qPct').textContent=pct+'%';
  document.getElementById('progBar').style.width=((state.idx)/state.qs.length*100)+'%';
  document.getElementById('qCat').textContent=q.c||'General';
  document.getElementById('qText').textContent=q.q;

  const box=document.getElementById('opts');
  box.innerHTML='';
  const letters=['A','B','C','D'];
  opts.forEach((o,idx)=>{
    const el=document.createElement('div');
    el.className='opt';
    el.innerHTML=`<span class="k">${letters[idx]}</span><span class="o">${o}</span><span class="hint">${idx+1}</span>`;
    el.onclick=()=>answer(idx);
    box.appendChild(el);
  });
  document.getElementById('feedback').innerHTML='';
  document.getElementById('nextBtn').classList.add('hidden');
}

function answer(selected){
  const q=state.qs[state.idx];
  const opts=q._shuffledOpts;
  const correctIdx=q._correctIdx;
  const box=document.getElementById('opts');
  const els=box.querySelectorAll('.opt');
  els.forEach((el,i)=>{
    el.classList.add('locked');
    if(i===correctIdx)el.classList.add('correct');
    else if(i===selected)el.classList.add('wrong');
    el.onclick=null;
  });
  const isRight=(selected===correctIdx);
  if(isRight)state.score++;
  state.answers.push({q,selected,correctIdx,isRight});

  const fb=document.getElementById('feedback');
  fb.innerHTML=`<div class="expl ${isRight?'ok':'no'}">
    <b>${isRight?'✅ Correct':'❌ Incorrect'} — Réponse : ${['A','B','C','D'][correctIdx]}</b>
    ${q.e||''}
  </div>`;

  const good=state.answers.filter(a=>a.isRight).length;
  const bad=state.answers.filter(a=>!a.isRight).length;
  document.getElementById('qGood').textContent=good;
  document.getElementById('qBad').textContent=bad;
  document.getElementById('qPct').textContent=Math.round(good/state.answers.length*100)+'%';
  document.getElementById('progBar').style.width=((state.idx+1)/state.qs.length*100)+'%';

  const nb=document.getElementById('nextBtn');
  nb.classList.remove('hidden');
  nb.textContent=(state.idx+1<state.qs.length)?'Question suivante → (Entrée)':'Voir le résultat → (Entrée)';
  nb.onclick=nextQuestion;
}

function nextQuestion(){
  state.idx++;
  if(state.idx<state.qs.length)renderQuestion();
  else finishSeries();
}

function finishSeries(){
  const good=state.answers.filter(a=>a.isRight).length;
  const bad=state.answers.length-good;
  const pct=Math.round(good/state.qs.length*100);
  state.results[state.current]=pct;
  saveResults(state.results);

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('resTitle').textContent=`Série ${state.current+1} — Terminée`;
  const sc=document.getElementById('resScore');
  sc.textContent=pct+'%';
  sc.className='score '+(pct>=80?'ok':pct>=60?'mid':'bad');
  document.getElementById('resGood').textContent=good;
  document.getElementById('resBad').textContent=bad;
  document.getElementById('resTotal').textContent=state.qs.length;

  const rev=document.getElementById('review');
  rev.innerHTML='';
  state.answers.forEach((a,i)=>{
    const letters=['A','B','C','D'];
    const d=document.createElement('div');
    d.className='rev';
    d.innerHTML=`<div class="qq">${i+1}. ${a.q.q}</div>
      <div class="${a.isRight?'cc':'ww'}">
        ${a.isRight?'✓':'✗'} Ta réponse : ${a.q._shuffledOpts[a.selected]} (${letters[a.selected]})
      </div>
      ${!a.isRight?`<div class="cc">Bonne réponse : ${a.q._shuffledOpts[a.correctIdx]} (${letters[a.correctIdx]})</div>`:''}
      <div class="ee">${a.q.e||''}</div>`;
    rev.appendChild(d);
  });
  window.scrollTo(0,0);
}

/* ---------- Buttons ---------- */
document.getElementById('homeBtn').onclick=()=>{
  document.getElementById('result').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderHome();
};
document.getElementById('menuBtn').onclick=()=>{
  if(confirm('Retourner au menu ? La progression de cette série sera perdue.')){
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('home').classList.remove('hidden');
    renderHome();
  }
};
document.getElementById('retryBtn').onclick=()=>startSeries(state.current);
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Effacer la progression des séries ?')){localStorage.removeItem(LS_KEY);renderHome();}
};
document.getElementById('shuffleBtn').onclick=()=>{
  const s=shuffle(BANK);
  BANK.length=0;BANK.push(...s);
  renderHome();
};

/* ---------- Keyboard controls ---------- */
document.addEventListener('keydown',(e)=>{
  if(document.getElementById('quiz').classList.contains('hidden'))return;
  if(e.key>='1'&&e.key<='4'){
    const idx=parseInt(e.key)-1;
    const opts=document.querySelectorAll('#opts .opt');
    if(opts[idx] && !opts[idx].classList.contains('locked')){
      answer(idx);
      e.preventDefault();
    }
  }
  if(e.key==='Enter'){
    const nb=document.getElementById('nextBtn');
    if(!nb.classList.contains('hidden')){
      nextQuestion();
      e.preventDefault();
    }
  }
});

renderHome();
</script>
