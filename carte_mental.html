n clair."},{"name":"HSTS","desc":"Ajouter l’en-tête HSTS pour demander au navigateur de ne plus revenir vers HTTP et réduire les attaques de downgrade."},{"name":"Valider les certificats","desc":"Vérifier période de validité, usage prévu, statut de révocation, clé publique et chaîne jusqu’à une autorité racine de confiance."},{"name":"Renouvellement automatique TLS","desc":"Automatiser le renouvellement des certificats afin d’éviter l’expiration d’un service critique ou le recours précipité à une configuration non fiable."},{"name":"Rate Limiting TLS","desc":"Limiter le rythme de certaines opérations peut réduire l’impact d’un abus massif du handshake TLS ou d’autres ressources coûteuses."},{"name":"WAF","desc":"Déployer un Web Application Firewall pour détecter ou bloquer des requêtes correspondant à des attaques Web connues. Il doit compléter le code sécurisé et le hardening, pas les remplacer."},{"name":"mod_security — inspection par phases","desc":"Inspecter request headers, request body, response headers, response body puis journaliser permet d’appliquer des règles à plusieurs étapes du cycle HTTP."},{"name":"Input Validation","desc":"Valider les données utilisées pour construire des chemins, en-têtes, URLs et paramètres avant de les transmettre au serveur ou au système de fichiers."},{"name":"SFTP au lieu de FTP","desc":"Utiliser SFTP pour les transferts administratifs sensibles afin d’éviter l’exposition des credentials et contenus en clair."}]},{"g":"Logs, audit & patch management","items":[{"name":"Activer un niveau minimal d’audit","desc":"Journaliser les opérations importantes afin de pouvoir détecter des anomalies et reconstruire une activité après incident."},{"name":"Protéger les logs","desc":"Appliquer des permissions restrictives aux journaux et conserver les activités de façon protégée afin qu’un attaquant ne puisse pas facilement les modifier ou les effacer."},{"name":"Logs d’activité chiffrés","desc":"Conserver les traces d’activité utilisateur dans un stockage protégé, notamment contre la lecture et la modification non autorisées."},{"name":"Patch Management","desc":"Appliquer régulièrement les correctifs du système, du serveur Web, de ses modules et des dépendances afin de réduire l’exposition aux vulnérabilités connues."},{"name":"Scanners de configuration","desc":"Utiliser les outils de sécurité fournis avec les serveurs ou des scanners de vulnérabilités pour automatiser une partie du contrôle de configuration et repérer les écarts."}]},{"g":"Défense contre DNS Hijacking","items":[{"name":"Registrar ICANN + Registrar-Lock","desc":"Utiliser un registrar accrédité et activer un verrouillage de domaine pour réduire les modifications ou transferts DNS non autorisés."},{"name":"Protéger le compte du registrant","desc":"Sécuriser les credentials et informations du compte permettant de modifier les enregistrements ou la délégation du domaine."},{"name":"Plan IR / Business Continuity DNS","desc":"Prévoir explicitement le DNS hijacking dans les procédures de réponse à incident et de continuité pour restaurer rapidement les enregistrements légitimes."},{"name":"DNS Monitoring","desc":"Surveiller l’adresse et les changements du service DNS et générer des alertes lorsque les mappings ou paramètres attendus sont modifiés."},{"name":"Restreindre les transferts de zone","desc":"N’autoriser les transferts DNS qu’aux serveurs secondaires légitimes afin de limiter l’exposition des informations de zone et les abus.","xref":[4]},{"name":"DNSSEC","desc":"Signer les données DNS afin de permettre la validation de leur authenticité et de leur intégrité par les résolveurs compatibles."},{"name":"Changer les mots de passe par défaut","desc":"Les routeurs et équipements impliqués dans la résolution ou la connectivité ne doivent pas conserver leurs credentials d’usine."},{"name":"Antivirus & téléchargements de confiance","desc":"Maintenir une protection antimalware et éviter les codecs/downloaders provenant de sources non fiables afin de réduire la compromission locale pouvant modifier la résolution DNS."},{"name":"SLA & sécurité du fournisseur DNS","desc":"Définir avec le prestataire DNS des engagements de sécurité et de disponibilité adaptés à la criticité du domaine."}]}]}}},{"n":14,"t":"Hacking d'applications web"},{"n":15,"t":"Injection SQL"},{"n":16,"t":"Réseaux sans fil","data":{"concept":{"groups":[{"g":"Fondamentaux radio & 802.11","items":[{"name":"Pourquoi le Wi-Fi est exposé","desc":"Le média est l’air : les ondes radio dépassent les murs et les limites physiques d’un bâtiment. Tout récepteur situé à portée peut recevoir le signal, contrairement à un réseau filaire qui exige un accès au câble.","exam":"Wireless = pas de frontière physique ; la portée radio fait partie de la surface d’attaque."},{"name":"SSID vs BSSID","desc":"Le SSID est le nom logique du réseau Wi-Fi. Plusieurs points d’accès peuvent annoncer le même SSID ; le BSSID identifie un Basic Service Set précis et correspond à l’adresse MAC du point d’accès.","exam":"SSID = nom du WLAN ; BSSID = MAC de l’AP."},{"name":"Association Wi-Fi","desc":"Après la découverte du réseau, le client s’authentifie puis s’associe à l’AP. Pendant l’association, le client et l’AP négocient leurs capacités de communication ; une authentification utilisateur 802.1X peut ensuite s’ajouter."},{"name":"Beacon vs Probe","desc":"Un point d’accès émet périodiquement des beacon frames pour annoncer sa présence. Un client envoie des probe requests pour rechercher des réseaux ; un AP peut répondre par probe response."},{"name":"Monitor mode","desc":"En mode monitor, l’interface Wi-Fi ne se limite plus aux trames qui lui sont destinées : elle observe les beacons, probes, authentifications et autres frames présentes sur le canal. C’est le mode utilisé pour la capture radio.","syntax":"airmon-ng start wlan0","exam":"Managed = client normal ; Monitor = capture des frames 802.11 dans l’air."},{"name":"ISM Band","desc":"Les bandes ISM (Industrial, Scientific and Medical) sont des bandes de fréquences utilisées par de nombreuses technologies radio sans licence individuelle, notamment Wi-Fi et Bluetooth."},{"name":"Canaux 2.4 GHz","desc":"Un canal est une plage de fréquences utilisée pour transmettre. En 2.4 GHz, les canaux 1, 6 et 11 sont les trois canaux non chevauchants à retenir dans le Chapter 11 ; les autres se recouvrent et augmentent les interférences.","exam":"2.4 GHz : 1 / 6 / 11."},{"name":"5 GHz et 6 GHz","desc":"Le 5 GHz offre davantage de canaux et moins de congestion que 2.4 GHz. Le Chapter 11 associe Wi-Fi 6E à l’utilisation de 6 GHz en plus de 2.4 et 5 GHz."},{"name":"Portée et environnement","desc":"La portée dépend du standard, de la puissance, de l’antenne et des obstacles. Les murs en béton ou maçonnerie atténuent fortement le signal alors que le verre laisse davantage passer les ondes."},{"name":"Ad hoc vs Infrastructure","desc":"Ad hoc : les appareils communiquent directement entre eux sans AP central. Infrastructure : un point d’accès centralise les communications et joue un rôle comparable à un switch pour le média radio.","exam":"Ad hoc = peer-to-peer ; Infrastructure = AP central."},{"name":"Directional vs Omnidirectional","desc":"Une antenne omnidirectionnelle rayonne sur 360° horizontalement. Une antenne directionnelle concentre le signal dans une direction, ce qui améliore la portée dans cet axe mais exige un bon alignement."},{"name":"Parabolic Grid Antenna","desc":"Antenne directionnelle en grille semi-parabolique concentrant le faisceau radio sur de longues distances. La forte directivité améliore la portée d’une liaison, mais peut aussi étendre la distance depuis laquelle le signal est observé."},{"name":"Signal strength en dBm","desc":"La puissance reçue est exprimée en dBm. Dans le Chapter 11, -10 dBm correspond à un signal extrêmement fort, environ -19 à -67 dBm à une plage utilisable, et autour de -100 dBm au seuil de détection.","exam":"Plus la valeur est proche de 0, plus le signal est fort."},{"name":"War-driving / Wireless Footprinting","desc":"Le wireless footprinting consiste à identifier les réseaux présents dans une zone et à estimer leurs limites. Le war-driving ajoute la mobilité : on parcourt une zone en collectant les SSID/BSSID, canaux et niveaux de signal."},{"name":"OFDM / OFDMA / MIMO","desc":"OFDM répartit les données sur plusieurs sous-porteuses orthogonales. MIMO utilise plusieurs antennes/flux pour augmenter les performances. OFDMA, associé au Wi-Fi 6 dans le cours, répartit les sous-porteuses entre plusieurs utilisateurs."},{"name":"DSSS / FHSS","desc":"DSSS étale le signal à l’aide d’un code pseudo-aléatoire. FHSS change rapidement de fréquence porteuse selon une séquence de saut. Ce sont deux techniques historiques d’étalement de spectre."}]},{"g":"Authentification & gestion des clés","items":[{"name":"802.1X","desc":"Standard IEEE d’authentification d’accès réseau utilisé aussi bien en filaire qu’en Wi-Fi. Dans un déploiement Enterprise, il permet de contrôler l’accès avant d’autoriser pleinement le client sur le réseau."},{"name":"RADIUS","desc":"Backend d’authentification couramment utilisé avec 802.1X. L’AP ou l’équipement d’accès relaie l’authentification vers le serveur RADIUS plutôt que de stocker localement tous les comptes."},{"name":"Personal vs Enterprise","desc":"WPA/WPA2 Personal repose sur une PSK partagée. Enterprise utilise 802.1X/EAP avec un backend comme RADIUS et permet une authentification utilisateur individuelle.","exam":"Personal = PSK ; Enterprise = 802.1X/EAP/RADIUS."},{"name":"LEAP","desc":"LEAP (Lightweight EAP) est une variante Cisco historique d’EAP. Le Chapter 11 la présente comme faible par rapport aux variantes plus modernes."},{"name":"PEAP","desc":"PEAP (Protected EAP) encapsule les échanges EAP dans un tunnel TLS afin de protéger l’authentification."},{"name":"EAP-TLS","desc":"EAP-TLS réalise une authentification mutuelle par certificats. Parmi LEAP, PEAP et EAP-TLS, le Chapter 11 le présente comme le plus fort.","exam":"EAP-TLS = certificats des deux côtés / mutual authentication."},{"name":"PMK","desc":"Pairwise Master Key. Clé maître conservée et protégée qui sert de base à la dérivation des clés de session WPA2."},{"name":"PTK","desc":"Pairwise Transient Key. Clé de session dérivée de la PMK et des valeurs échangées pendant le 4-way handshake."},{"name":"GTK","desc":"Group Temporal Key. Clé utilisée pour le trafic broadcast/multicast et partagée avec les stations du groupe."},{"name":"4-Way Handshake","desc":"Échange de quatre messages qui permet à l’AP et au client de prouver qu’ils possèdent la PMK et d’installer les clés de session. Le WPA2 handshake transporte notamment ANonce, SNonce, MIC et GTK.","flow":"M1: ANonce → M2: SNonce + MIC → M3: GTK + MIC → M4: ACK","exam":"KRACK abuse surtout de la retransmission/réinstallation du message 3."},{"name":"ANonce / SNonce","desc":"ANonce est le nonce généré par l’AP ; SNonce celui généré par la station. Ils participent à la dérivation de la PTK pendant le 4-way handshake."},{"name":"SAE","desc":"Simultaneous Authentication of Equals est le mécanisme d’authentification WPA3 Personal décrit dans le Chapter 11. Les deux côtés échangent des messages commit puis confirm afin de dériver une PMK sans exposer une PSK réutilisable.","exam":"WPA3 Personal → SAE."},{"name":"Forward Secrecy WPA3","desc":"Le Chapter 11 associe WPA3 à la forward secrecy : la compromission ultérieure du mot de passe ne doit pas permettre de déchiffrer les anciennes sessions capturées."},{"name":"WPS","desc":"Wi-Fi Protected Setup simplifie l’association via bouton ou PIN. Le PIN est faible car sa validation en deux parties réduit fortement l’espace de recherche ; le cours recommande de désactiver WPS.","exam":"WPS PIN → Reaver."}]},{"g":"WEP / WPA / WPA2 / WPA3","items":[{"name":"WEP","desc":"WEP utilise RC4, un IV de 24 bits, des clés de 40/104 bits et CRC-32 pour l’intégrité. Il ne définit pas de vraie gestion de clés et souffre de réutilisation/IV faibles.","exam":"WEP = RC4 + 24-bit IV + CRC-32."},{"name":"Pourquoi WEP est cassé","desc":"L’IV est court et peut être réutilisé avec la même clé ; RC4 est employé dans un contexte trop prévisible et les PSK changent rarement. Avec suffisamment de trafic, ces faiblesses permettent de retrouver la clé."},{"name":"FMS Attack","desc":"L’attaque Fluhrer-Mantin-Shamir exploite des faiblesses du Key Scheduling Algorithm de RC4 combinées aux IV faibles de WEP pour faciliter la récupération de la clé.","exam":"FMS → WEP."},{"name":"WPA","desc":"WPA est un remplacement transitoire de WEP utilisant toujours RC4 mais avec TKIP, IV 48 bits, clé 128 bits, 4-way handshake et intégrité Michael + CRC-32.","exam":"WPA = RC4 + TKIP."},{"name":"TKIP","desc":"Temporal Key Integrity Protocol améliore WEP en mélangeant la clé et en utilisant une clé par paquet. Il reste lié à RC4 et est aujourd’hui considéré comme faible."},{"name":"Michael / MIC","desc":"Michael est le mécanisme d’intégrité associé à WPA/TKIP dans le Module 16. Il sert de Message Integrity Check, complété par CRC-32 dans le tableau du cours."},{"name":"WPA2","desc":"WPA2 remplace RC4/TKIP par AES-CCMP, utilise un IV 48 bits, une clé 128 bits et le 4-way handshake. Le Module 16 associe son intégrité à CBC-MAC.","exam":"WPA2 = AES-CCMP + 4-way handshake."},{"name":"CCMP","desc":"CCMP est le protocole de chiffrement basé sur AES utilisé par WPA2. Il combine Counter Mode pour la confidentialité et CBC-MAC pour l’intégrité/authenticité."},{"name":"WPA3","desc":"WPA3 améliore l’authentification et la protection contre les attaques dictionnaire hors ligne grâce à SAE. Il apporte également des paramètres cryptographiques plus forts et une meilleure protection des sessions."},{"name":"WPA3 — nuance entre tes deux supports","desc":"Le Module 16 officiel associe WPA3 à AES-GCMP-256, une clé 192 bits, ECDH/ECDSA et BIP-GMAC-256. Le Chapter 11 résume WPA3 comme AES-256/CCMP + SHA-384 et insiste surtout sur SAE et la forward secrecy. Pour les QCM CEH basés sur le module officiel, mémorise en priorité le tableau officiel ; utilise le Chapter pour comprendre SAE et la logique.","exam":"Ne mélange pas les deux tableaux : le support officiel reste la référence pour les valeurs CEH."},{"name":"WEP → WPA → WPA2 → WPA3","desc":"Progression à retenir : WEP/RC4 très faible → WPA/TKIP transition → WPA2/AES-CCMP → WPA3/SAE et paramètres renforcés.","flow":"WEP (RC4) → WPA (RC4+TKIP) → WPA2 (AES-CCMP) → WPA3 (SAE + crypto renforcée)"}]},{"g":"5 catégories de menaces Wi-Fi","items":[{"name":"Access Control Attacks","desc":"Cherchent à contourner les contrôles permettant de décider qui peut rejoindre le WLAN : MAC spoofing, AP mal configuré, associations non autorisées, client mis-association."},{"name":"Integrity Attacks","desc":"Modifient, injectent ou rejouent des frames 802.11 ou des messages d’authentification : data-frame injection, bit flipping, replay, RADIUS replay, IV replay."},{"name":"Confidentiality Attacks","desc":"Visent à lire ou intercepter des informations : eavesdropping, traffic analysis, WEP cracking, evil twin/honeypot AP, session hijacking ou MITM."},{"name":"Availability Attacks","desc":"Empêchent le service sans fil de fonctionner : disassociation/deauthentication, beacon flood, authentication flood, jamming, TKIP MIC exploit, routing attacks."},{"name":"Authentication Attacks","desc":"Visent l’identité ou les secrets d’authentification : PSK cracking, LEAP cracking, VPN/domain login cracking, KRACK, identity theft, password speculation."}]},{"g":"Access control & intégrité","items":[{"name":"MAC Spoofing","desc":"L’attaquant change l’adresse MAC de son interface pour imiter un appareil ou un AP autorisé. Le filtrage basé uniquement sur la MAC est donc faible."},{"name":"AP Misconfiguration","desc":"Une mauvaise configuration de l’AP peut exposer le WLAN : mots de passe faibles, paramètres de sécurité incorrects, services inutiles ou paramètres par défaut."},{"name":"Client Mis-association","desc":"Un rogue AP imite le SSID d’un réseau attendu afin qu’un client s’y associe. Une fois connecté au faux AP, l’attaquant peut intercepter ou manipuler le trafic."},{"name":"Unauthorized Association","desc":"Une station rejoint un réseau qu’elle ne devrait pas utiliser, accidentellement ou volontairement. Le cours mentionne aussi le soft AP malveillant créé sur un laptop."},{"name":"Data-Frame Injection","desc":"Construction puis émission de frames 802.11 forgées afin d’influencer ou perturber la communication. Les outils cités incluent Airpwn-ng et Wperf."},{"name":"WEP Injection","desc":"Injection de frames liées à WEP après récupération ou dérivation des éléments nécessaires, afin de générer du trafic exploitable ou falsifié."},{"name":"Bit-Flipping Attack","desc":"L’attaquant capture une trame, modifie des bits du payload, ajuste l’ICV puis renvoie la trame. Cette attaque exploite l’intégrité faible de mécanismes anciens."},{"name":"EAP Replay","desc":"Capture de messages 802.1X/EAP tels que Identity, Success ou Failure pour les rejouer plus tard dans le but de tromper le processus d’authentification."},{"name":"Data Replay","desc":"Des frames 802.11 sont capturées puis rejouées, éventuellement après modification, afin de provoquer un comportement ou reproduire une transaction."},{"name":"IV Replay","desc":"Réutilise des vecteurs d’initialisation et des éléments de trafic connus afin d’obtenir ou réutiliser un keystream dans les protocoles faibles."},{"name":"RADIUS Replay","desc":"Capture puis réutilisation de messages RADIUS Access-Accept/Reject sur le réseau filaire afin de tenter de tromper un processus d’accès."}]},{"g":"Confidentialité & disponibilité","items":[{"name":"Eavesdropping","desc":"Écoute passive du trafic radio à portée. Même sans déchiffrement du payload, les métadonnées radio et réseau peuvent révéler SSID, BSSID, canaux, appareils et patterns de communication."},{"name":"Traffic Analysis","desc":"Analyse des volumes, timings, destinations et comportements des stations afin de déduire l’activité du réseau même lorsque le contenu n’est pas lisible."},{"name":"Evil Twin / Honeypot AP","desc":"Rogue AP utilisant le même SSID qu’un réseau légitime. Un signal plus fort ou une désauthentification du vrai AP peut pousser les clients à s’y connecter automatiquement.","exam":"Evil Twin = faux AP qui imite le réseau attendu."},{"name":"Wireless MITM","desc":"Après avoir attiré ou forcé le client vers l’infrastructure contrôlée par l’attaquant, celui-ci se place entre le client et sa destination pour observer ou modifier les échanges."},{"name":"Disassociation Attack","desc":"Envoie ou forge des frames qui rompent l’association entre le client et l’AP, forçant une nouvelle association."},{"name":"Deauthentication Flood","desc":"Flood de frames de désauthentification/disassociation forgées afin de déconnecter des clients. Peut servir de DoS ou à forcer une nouvelle authentification pour capturer un handshake."},{"name":"Beacon Flood","desc":"Émission de milliers de beacon frames forgés pour faire apparaître de nombreux faux réseaux et encombrer le processus de découverte."},{"name":"Authentication Flood","desc":"Envoi massif de demandes d’authentification depuis des MAC aléatoires afin de remplir la table d’association de l’AP."},{"name":"RF Jamming","desc":"Émission volontaire d’énergie radio afin de rendre le canal occupé ou inutilisable. C’est une attaque de disponibilité au niveau radio/physique."},{"name":"Power-Saving Attack","desc":"Spoofing de TIM/DTIM ou autres éléments liés au mode économie d’énergie pour perturber la façon dont un client endormi reçoit ses données."},{"name":"TKIP MIC Exploit","desc":"Génère suffisamment d’erreurs MIC TKIP pour dépasser le seuil de sécurité de l’AP et provoquer une suspension temporaire du WLAN."},{"name":"Routing Attacks wireless","desc":"Manipulent les informations de routage de protocoles tels que RIP, AODV ou DSR ; le cours cite notamment wormhole et sinkhole comme vecteurs."}]},{"g":"Attaques d’authentification","items":[{"name":"PSK Cracking","desc":"L’attaquant capture les échanges nécessaires puis teste hors ligne des mots de passe candidats afin de retrouver la PSK. La difficulté dépend fortement de la qualité du mot de passe.","exam":"WPA/WPA2 PSK : capture courte près de l’AP, cracking ensuite hors ligne."},{"name":"Offline Handshake Attack","desc":"Une fois le handshake capturé, l’attaquant n’a plus besoin de rester près de l’AP pour tester sa wordlist. C’est une attaque hors ligne : les essais ne passent plus par l’AP."},{"name":"Deauth pour recapturer un handshake","desc":"Si aucun client ne s’authentifie au moment de la capture, des frames de deauthentication peuvent forcer une reconnexion afin de récupérer les échanges d’authentification."},{"name":"LEAP Cracking","desc":"Capture d’échanges 802.1X LEAP puis cracking du secret associé. Les outils cités sont Asleap et THC-LEAPcracker."},{"name":"VPN Login Cracking","desc":"Recherche de secrets liés à des accès VPN tels que PPTP ou IPsec PSK via outils de découverte et de brute force cités dans le module."},{"name":"Domain Login Cracking","desc":"Récupération et cracking de hashes d’authentification de domaine avec des outils comme John the Ripper, L0phtCrack ou THC-Hydra."},{"name":"Identity Theft 802.1X","desc":"Capture d’identités utilisateurs transportées dans des messages d’Identity Response non protégés afin de préparer des attaques de mot de passe ou d’usurpation."},{"name":"Shared Key Guessing","desc":"Essais de clés partagées ou de clés WEP par défaut/connues afin de réussir une authentification 802.11 Shared Key."},{"name":"Password Speculation","desc":"Réutilise une identité capturée puis tente des mots de passe probables ou un dictionnaire contre le mécanisme 802.1X."},{"name":"Application Login Theft","desc":"Capture de credentials transmis par des applications en clair sur le réseau sans fil. Le chiffrement Wi-Fi ne remplace pas le chiffrement applicatif."}]},{"g":"KRACK, LTE & coexistence","items":[{"name":"KRACK","desc":"Key Reinstallation Attack exploite le 4-way handshake WPA/WPA2 en rejouant le message 3 pour forcer la réinstallation d’une clé déjà utilisée. Cela peut réinitialiser nonce et replay counters et permettre replay, déchiffrement ou forgery selon le cas.","exam":"KRACK = WPA/WPA2 4-way handshake + nonce reuse."},{"name":"KRACK — rôle du message 3","desc":"Le message 3 transporte des informations permettant l’installation de la clé. En le rejouant, un client vulnérable peut réinstaller la même clé et remettre à zéro des compteurs qui ne devraient jamais être réutilisés."},{"name":"Nonce Reuse","desc":"Un nonce doit être utilisé de manière unique avec certains modes cryptographiques. Sa réutilisation détruit une propriété de sécurité essentielle et peut rendre le trafic déchiffrable ou falsifiable."},{"name":"aLTEr Attack","desc":"Attaque de couche 2 contre LTE/4G dans le cours. Elle profite du chiffrement AES-CTR du user plane sans protection d’intégrité et intercale une fausse tour de communication pour rediriger le trafic, notamment via DNS.","exam":"aLTEr = LTE/4G + fake tower + Layer 2."},{"name":"aLTEr — 2 phases","desc":"Phase 1 : collecte passive et fingerprinting. Phase 2 : insertion de la fausse tour, interception et redirection des requêtes vers une ressource contrôlée."},{"name":"Inter-Chip Privilege Escalation","desc":"Exploite des failles dans des combo chips gérant plusieurs radios, par exemple Bluetooth et Wi-Fi. Une vulnérabilité dans un composant peut permettre d’atteindre ou manipuler les données d’un autre."}]},{"g":"Méthodologie Hacking Wireless","items":[{"name":"Méthodologie en 5 étapes","desc":"Le Module 16 organise le workflow en cinq phases : découverte Wi-Fi, analyse du trafic sans fil, lancement d’attaques, cracking du chiffrement puis compromission du réseau.","flow":"1 Discovery → 2 Traffic Analysis → 3 Launch Attacks → 4 Encryption Cracking → 5 Network Compromising","exam":"Ordre CEH à mémoriser."},{"name":"Passive Footprinting","desc":"Découvre les AP en écoutant les ondes sans se connecter ni injecter de données. C’est le mode le plus discret."},{"name":"Active Footprinting","desc":"Le client émet des probe requests, avec SSID connu ou SSID vide, afin d’obtenir une réponse des AP présents."},{"name":"Wireless Traffic Analysis","desc":"Observe canaux, beacons, probes, trames d’authentification, signal et trafic. L’objectif est de comprendre le WLAN avant de choisir une technique."},{"name":"MAC Spoofing — workflow","desc":"L’interface est désactivée, son adresse MAC est modifiée puis l’interface est réactivée. Cette technique sert à imiter une station ou un AP autorisé.","syntax":"ifconfig wlan0 down\nifconfig wlan0 hw ether 02:25:ab:4c:2a:bc\nifconfig wlan0 up"},{"name":"MITM wireless — logique","desc":"L’attaquant identifie BSSID/ESSID/canal, déconnecte la victime du vrai AP puis lui présente une infrastructure contrôlée. Le succès repose sur la reconnexion du client vers le faux AP."},{"name":"Rogue AP avec MANA","desc":"Le MANA Toolkit permet de configurer un point d’accès rogue et de fournir une connectivité en NAT afin que l’expérience reste crédible pour la victime.","syntax":"bash /usr/share/mana-toolkit/run-mana/start-nat-simple.sh"},{"name":"KARMA Attack","desc":"Un rogue AP répond à de nombreux probe requests comme s’il représentait les réseaux déjà connus du client. Le cours associe cette logique à hostapd-wpe."},{"name":"Cracking WPA/WPA2 — logique","desc":"1) passer l’interface en monitor, 2) capturer le handshake, 3) éventuellement forcer une reconnexion, 4) convertir la capture si nécessaire, 5) tester une wordlist hors ligne."},{"name":"WPS PIN Cracking","desc":"Le WPS PIN peut être testé systématiquement. Une fois le PIN trouvé, l’outil peut récupérer les informations permettant l’accès au réseau.","exam":"Reaver = WPS PIN."},{"name":"Wi-Fi Network Compromising","desc":"Dernière phase : après récupération des éléments d’authentification ou exploitation du mécanisme d’accès, l’attaquant obtient la connectivité au WLAN et peut atteindre les ressources permises par la segmentation."}]},{"g":"Bluetooth — Wireless Security","items":[{"name":"Bluetooth","desc":"Technologie radio courte portée opérant dans la bande ISM 2.4 GHz. Les attaques Bluetooth exigent généralement une proximité physique, car la portée est limitée."},{"name":"Bluetooth Classes","desc":"Le Chapter 11 donne trois classes de portée : Class A jusqu’à 100 m, Class B jusqu’à 10 m (la plus courante) et Class C jusqu’à 1 m."},{"name":"Bluetooth Profiles","desc":"Les profils définissent les capacités supportées par un appareil : audio, transfert de fichiers, périphérique d’entrée, port série, etc. Deux appareils appairés échangent les profils qu’ils savent utiliser."},{"name":"Pairing / Bond","desc":"Le pairing crée une relation de confiance entre deux appareils. Les anciens mécanismes reposaient souvent sur un PIN ; certains périphériques sans clavier utilisent des PIN codés en dur comme 0000 ou 1234."},{"name":"Secure Simple Pairing (SSP)","desc":"Bluetooth 2.1 introduit SSP avec quatre méthodes : Just Works, Numeric Comparison, Passkey Entry et Out-of-Band. Elles choisissent une méthode adaptée aux capacités d’entrée/sortie des appareils."},{"name":"Just Works","desc":"Appairage sans vérification interactive. C’est la méthode SSP la moins sûre car l’utilisateur ne valide pas un secret ou une comparaison."},{"name":"Numeric Comparison","desc":"Les deux appareils affichent le même nombre à six chiffres ; l’utilisateur vérifie qu’ils correspondent avant d’accepter l’appairage."},{"name":"Passkey Entry","desc":"Un appareil affiche une valeur et l’autre permet de la saisir. La validation humaine relie l’appairage aux deux appareils présents."},{"name":"Out-of-Band Pairing","desc":"Utilise un autre canal, par exemple NFC, pour échanger ou confirmer les données nécessaires à l’appairage Bluetooth."},{"name":"Bluejacking","desc":"Envoi de données non sollicitées, par exemple message ou image, via OBEX sans passer par un pairing normal. L’impact est surtout l’intrusion/annoyance, pas le vol de données.","exam":"Bluejacking = SEND."},{"name":"Bluesnarfing","desc":"Accès ou extraction de données depuis un appareil Bluetooth, notamment contacts, messages ou fichiers, souvent via OBEX/FTP.","exam":"Bluesnarfing = STEAL data."},{"name":"Bluebugging","desc":"Prend le contrôle de fonctions téléphoniques afin de placer un appel ou écouter à distance. L’initiation nécessite la proximité ; une fois l’appel établi, il peut continuer même si l’attaquant s’éloigne.","exam":"Bluebugging = CONTROL / place call."},{"name":"Bluedump","desc":"Spoofe le BDADDR d’un appareil déjà approuvé et provoque la suppression de la clé existante afin de forcer un nouveau pairing que l’attaquant tente de prendre en charge.","exam":"Bluedump = trust/pairing abuse."},{"name":"Bluesmack","desc":"Déni de service Bluetooth utilisant L2CAP et des paquets de taille anormale afin de rendre l’appareil inutilisable.","exam":"Bluesmack = DoS via L2CAP."},{"name":"Long-distance Bluesnarfing","desc":"Même objectif que le bluesnarfing, mais à plus grande distance grâce à une antenne directionnelle à gain élevé."}]}]},"outil":{"groups":[{"g":"Découverte & capture Wi-Fi","items":[{"name":"airmon-ng","desc":"Utilitaire de la suite Aircrack-ng utilisé pour activer le mode monitor sur une interface Wi-Fi. L’interface devient généralement wlan0mon ou équivalent.","syntax":"airmon-ng start wlan0","cheat":[{"title":"Commandes","rows":[["start <iface>","Active le mode monitor sur l’interface choisie."],["stop <monitor_iface>","Arrête le mode monitor et restaure l’usage normal."]],"words":1}],"exam":"Monitor mode avant airodump-ng / aireplay-ng."},{"name":"airodump-ng","desc":"Outil de capture/reconnaissance Wi-Fi. Affiche AP, BSSID, canal, clients et trafic ; peut cibler un AP précis et écrire une capture sur disque.","syntax":"airodump-ng wlan0mon\nairodump-ng --bssid <BSSID> --channel <CH> --write capture wlan0mon","cheat":[{"title":"Options","rows":[["--bssid <BSSID>","Cible un AP précis."],["--channel <CH> / -c <CH>","Verrouille la capture sur un canal."],["--write <prefix> / -w <prefix>","Écrit les captures dans des fichiers."]],"words":1}]},{"name":"Wireshark","desc":"Analyseur graphique de paquets utilisé pour examiner les trames radio, les headers 802.11, les canaux, signaux et échanges d’authentification enregistrés dans une capture."},{"name":"tcpdump","desc":"Capture en ligne de commande. Le Chapter 11 l’utilise sur une interface en monitor pour enregistrer les trames dans un fichier PCAP.","syntax":"tcpdump -i wlan0mon\ntcpdump -w radio.pcap -i wlan0mon","cheat":[{"title":"Options","rows":[["-i <iface>","Interface à écouter."],["-w <file>","Écrit la capture dans un fichier PCAP."]],"words":1}]},{"name":"Kismet","desc":"Outil de wireless footprinting/war-driving cité pour Linux. Sert à découvrir les réseaux et collecter des informations radio sans nécessiter d’association normale."},{"name":"WiFi Explorer","desc":"Outil de découverte Wi-Fi cité pour macOS dans le Chapter 11."},{"name":"inSSIDer","desc":"Outil de Wi-Fi discovery permettant d’identifier les réseaux présents et leurs paramètres radio."},{"name":"NetSurveyor","desc":"Outil de survey/découverte Wi-Fi cité dans la phase Wireless Network Footprinting."},{"name":"Sparrow-wifi","desc":"Outil de découverte Wi-Fi 2.4/5 GHz avec fonctions de spectral awareness et intégrations citées avec HackRF, Ubertooth et GPS."},{"name":"RF spectrum analyzers","desc":"Famille d’outils de monitoring radio cités : Chanalyzer, AirCheck G3 Pro, Spectraware S1000, RSA306B, RF Explorer 6G, RFXpert, Monics, Signal Hound et FieldSENSE."}]},{"g":"Attaques & cracking Wi-Fi","items":[{"name":"aireplay-ng","desc":"Outil Aircrack-ng d’injection/attaque de trames. Dans le cours, il sert surtout à envoyer des deauthentication frames afin de forcer un client à se reconnecter.","syntax":"aireplay-ng --deauth 10 -a <BSSID> -c <Client_MAC> wlan0mon","cheat":[{"title":"Options","rows":[["--deauth <N>","Nombre de frames de deauthentication à envoyer."],["-a <BSSID>","BSSID du point d’accès."],["-c <MAC>","Client ciblé ; omis = tous les clients."]],"words":1}],"exam":"Deauth → forcer un nouveau handshake."},{"name":"aircrack-ng","desc":"Outil de cracking de clés Wi-Fi à partir d’une capture et d’une wordlist. Le Chapter 11 donne l’usage direct sur un fichier .cap.","syntax":"aircrack-ng capture.cap -w wordlist.txt","cheat":[{"title":"Options","rows":[["-w <wordlist>","Fichier de mots de passe candidats."],["capture.cap","Capture contenant les échanges utiles."]],"words":1}]},{"name":"hashcat","desc":"Cracker hors ligne utilisé dans le Module 16 après conversion de la capture. Le mode fourni pour les captures WPA/WPA2/WPA3 est 22000.","syntax":"hashcat -m 22000 capture.hc22000 <wordlist.txt>","cheat":[{"title":"Options","rows":[["-m 22000","Mode WPA-PBKDF2-PMKID+EAPOL dans le workflow fourni."],["<wordlist>","Liste de mots de passe candidats."]],"words":1}],"exam":"CEH : -m 22000."},{"name":"hcxpcapngtool","desc":"Convertit une capture Wi-Fi en format exploitable par hashcat dans le workflow fourni.","syntax":"hcxpcapngtool -o capture.hc22000 <capture>.cap","cheat":[{"title":"Options","rows":[["-o <file>","Fichier de sortie."],["capture.cap","Capture source."]],"words":1}]},{"name":"Reaver","desc":"Outil de brute force du PIN WPS. Il teste les PIN WPS contre un AP cible.","syntax":"reaver -i wlan0mon -b <BSSID> -vv","cheat":[{"title":"Options","rows":[["-i <iface>","Interface en monitor mode."],["-b <BSSID>","BSSID du point d’accès cible."],["-vv","Sortie très verbeuse."]],"words":1}],"exam":"Reaver = WPS PIN."},{"name":"Wifite","desc":"Outil d’automatisation de tests Wi-Fi cité pour le cracking/shared-key et comme outil d’audit wireless."},{"name":"Fern Wifi Cracker","desc":"Outil cité pour le cracking WEP et WPA PSK."},{"name":"Cowpatty","desc":"Outil cité pour le cracking de WPA PSK à partir de données capturées."},{"name":"mdk4","desc":"Outil de tests wireless pour beacon flood, authentication DoS, deauthentication et autres scénarios. Nécessite une interface en monitor mode.","syntax":"sudo mdk4 wlan0mon a\nsudo mdk4 wlan0mon p -e WifiName","cheat":[{"title":"Modes cités","rows":[["a","Attaque tous les SSID dans l’exemple du Chapter."],["p -e <SSID>","Probe sur un réseau précis."]],"words":1}]},{"name":"AirJack","desc":"Outil cité pour deauthentication flood et authentication flood."},{"name":"Airpwn-ng / Wperf","desc":"Outils cités pour les attaques de data-frame injection."}]},{"g":"Rogue AP, MITM & spoofing","items":[{"name":"MANA Toolkit","desc":"Toolkit utilisé pour mettre en place un rogue AP avec connectivité NAT. Le script fourni configure l’interface radio et l’interface upstream.","syntax":"bash /usr/share/mana-toolkit/run-mana/start-nat-simple.sh"},{"name":"hostapd-wpe","desc":"Outil associé dans le cours aux rogue AP/KARMA et aux scénarios d’authentification Wi-Fi Enterprise."},{"name":"dnsmasq","desc":"Service léger DNS/DHCP utilisé avec des rogue AP pour fournir adressage et résolution aux clients connectés."},{"name":"wifiphisher","desc":"Framework automatisant des scénarios rogue AP/evil twin et phishing Wi-Fi. Il peut imiter un SSID, perturber le vrai AP et présenter un portail contrôlé."},{"name":"airgeddon","desc":"Framework multi-attaque Wi-Fi combinant evil twin, sniffing, sslstrip et plusieurs composants réseau. Le Chapter 11 indique qu’un scénario evil twin complet peut utiliser deux interfaces Wi-Fi.","syntax":"sudo bash airgeddon.sh"},{"name":"bettercap","desc":"Framework de spoofing/MITM cité pour des attaques réseau et wireless après positionnement entre la victime et sa destination."},{"name":"Technitium MAC Address Changer","desc":"Outil Windows cité pour modifier la MAC d’une interface afin de tester le MAC spoofing."},{"name":"SMAC","desc":"Outil de MAC spoofing cité dans la catégorie Access Control Attacks."},{"name":"LizardSystems Change MAC Address","desc":"Outil cité pour modifier l’adresse MAC d’une interface lors de tests wireless."}]},{"g":"Enterprise, VPN & authentification","items":[{"name":"Asleap","desc":"Outil cité pour le cracking de LEAP à partir de captures 802.1X."},{"name":"THC-LEAPcracker","desc":"Outil cité pour récupérer/cracker des credentials LEAP."},{"name":"ike-scan / IKECrack","desc":"Outils cités pour la découverte et l’attaque de secrets liés à IPsec/IKE dans les scénarios VPN login cracking."},{"name":"Anger / THC-pptp-bruter","desc":"Outils cités pour des scénarios de cracking d’authentification VPN/PPTP."},{"name":"John the Ripper","desc":"Outil de cracking de mots de passe cité pour des scénarios de Domain Login Cracking."},{"name":"L0phtCrack / THC-Hydra","desc":"Outils cités pour le cracking ou les essais de credentials de domaine dans le Module 16."}]},{"g":"RFID & Bluetooth","items":[{"name":"iCopy-X","desc":"Outil de clonage RFID cité dans le Module 16."},{"name":"RFIDler","desc":"Outil cité pour l’analyse/clonage RFID."},{"name":"Flipper Zero","desc":"Outil multi-radio cité parmi les outils de clonage RFID dans le Module 16."},{"name":"RFID Mifare Cloner / Boscloner Pro","desc":"Autres outils de clonage RFID cités dans le Module 16."},{"name":"btscanner","desc":"Outil de découverte Bluetooth avec deux modes décrits dans le Chapter 11 : inquiry scan et brute force scan.","cheat":[{"title":"Modes","rows":[["Inquiry scan","Écoute les appareils en découverte sur plusieurs canaux."],["Brute force scan","Envoie activement des requêtes vers des adresses connues pour déterminer les appareils."]],"words":1}]}]},{"g":"Audit & défense wireless","items":[{"name":"RFProtect","desc":"Outil d’audit/sécurité wireless cité dans le Module 16."},{"name":"OSWA-Assistant","desc":"Outil d’audit wireless cité dans la liste des Wireless Security Auditing Tools."},{"name":"BoopSuite","desc":"Outil d’audit wireless cité par le Module 16."},{"name":"WatchGuard Wi-Fi Cloud WIPS","desc":"WIPS qui surveille l’environnement radio, détecte les rogue AP/evil twin et peut bloquer des comportements non autorisés."},{"name":"Cisco Adaptive Wireless IPS","desc":"Solution WIPS de Cisco associée au Wireless Control System pour remonter les alarmes, notamment les rogue AP."}]}]},"port":{"groups":[{"g":"Standards IEEE & fréquences","items":[{"name":"802.11 / Wi-Fi","desc":"Famille IEEE définissant le Wi-Fi aux couches Physical et Data Link : fréquences, modulation, canaux et règles MAC."},{"name":"802.11a","desc":"5 GHz, OFDM, jusqu’à 54 Mbps dans le Module 16.","exam":"802.11a = 5 GHz + OFDM."},{"name":"802.11b","desc":"2.4 GHz, DSSS, jusqu’à 11 Mbps.","exam":"802.11b = 2.4 GHz + DSSS."},{"name":"802.11g","desc":"2.4 GHz, OFDM, jusqu’à 54 Mbps."},{"name":"802.11n / Wi-Fi 4","desc":"2.4 et 5 GHz ; introduit MIMO selon le Chapter 11. Le Module 16 donne MIMO-OFDM et jusqu’à 600 Mbps."},{"name":"802.11ac / Wi-Fi 5","desc":"5 GHz, haut débit et davantage de canaux."},{"name":"802.11ax / Wi-Fi 6/6E","desc":"Le Module 16 associe 802.11ax à OFDMA et jusqu’à 9.6 Gbps ; le Chapter 11 ajoute 2.4/5/6 GHz pour Wi-Fi 6/6E."},{"name":"802.11be / Wi-Fi 7","desc":"Le Module 16 associe Wi-Fi 7 à MLO et jusqu’à 30 Gbps."},{"name":"802.11d","desc":"Extension 802.11a/b pour la portabilité entre domaines réglementaires."},{"name":"802.11e","desc":"Ajoute la QoS au niveau MAC pour voix, VoIP et vidéo."},{"name":"802.11i","desc":"Améliore la sécurité WLAN, introduit les mécanismes associés à WPA2 et AES/CCMP."},{"name":"802.11ad","desc":"Standard utilisant le spectre 60 GHz avec une nouvelle couche physique."},{"name":"802.11ah / Wi-Fi HaLow","desc":"Autour de 900 MHz dans le Module 16 ; vise portée étendue et usages IoT."},{"name":"802.15.1 / Bluetooth","desc":"Standard Bluetooth en bande 2.4 GHz. Le Module 16 associe GFSK, π/4-DPSK et 8DPSK."},{"name":"802.15.4 / ZigBee","desc":"Standard faible débit utilisé pour IoT ; le Module 16 cite 868 MHz, 915 MHz et 2.4 GHz."},{"name":"802.16 / WiMAX","desc":"Standard broadband wireless cité entre 2 et 11 GHz dans le Module 16."}]},{"g":"Protocoles de sécurité Wi-Fi","items":[{"name":"WEP","desc":"Protocole de sécurité Wi-Fi historique basé sur RC4 et IV 24 bits. Considéré cassé."},{"name":"WPA / TKIP","desc":"WPA conserve RC4 mais ajoute TKIP, IV 48 bits, clés par paquet et MIC Michael."},{"name":"WPA2 / AES-CCMP","desc":"WPA2 utilise AES-CCMP et le 4-way handshake."},{"name":"WPA3 / SAE","desc":"WPA3 Personal utilise SAE selon le Chapter 11 ; le Module 16 fournit son propre tableau cryptographique CEH avec GCMP-256/BIP-GMAC-256."},{"name":"802.1X","desc":"Contrôle d’accès réseau utilisant EAP et généralement un serveur RADIUS en environnement Enterprise."},{"name":"EAP","desc":"Extensible Authentication Protocol : cadre d’authentification utilisé avec 802.1X ; variantes citées LEAP, PEAP et EAP-TLS."},{"name":"RADIUS","desc":"Protocole/backend AAA utilisé pour l’authentification 802.1X Enterprise."},{"name":"WPS","desc":"Wi-Fi Protected Setup : mécanisme d’enrôlement simplifié par bouton ou PIN."},{"name":"CCMP","desc":"Counter Mode with CBC-MAC Protocol, mécanisme AES de WPA2."},{"name":"GCMP","desc":"Galois/Counter Mode Protocol ; le Module 16 l’associe à WPA3 dans son tableau officiel."},{"name":"EAPOL Key Replay Counter","desc":"Compteur utilisé dans les échanges EAPOL-Key ; le module le cite comme mesure contre la réinstallation/relecture d’anciens messages dans KRACK."}]},{"g":"Frames, Bluetooth & radio","items":[{"name":"Beacon Frame","desc":"Frame de management envoyée périodiquement par l’AP pour annoncer le WLAN."},{"name":"Probe Request / Response","desc":"Frames de découverte utilisées par les clients pour rechercher des réseaux et par les AP pour répondre."},{"name":"Deauthentication / Disassociation","desc":"Frames de management qui rompent une authentification ou association. Leur abus sert aux attaques de deauth/disassociation."},{"name":"OBEX","desc":"Object Exchange protocol utilisé pour l’échange de données Bluetooth ; associé à bluejacking et bluesnarfing."},{"name":"L2CAP","desc":"Logical Link Control and Adaptation Protocol de Bluetooth ; le Chapter 11 l’associe à l’attaque Bluesmack."},{"name":"HCI","desc":"Host Controller Interface. Dans Bluedump, l’attaquant exploite notamment le comportement lié à HCI_Link_Key_Request_Negative_Reply."},{"name":"SSP","desc":"Secure Simple Pairing de Bluetooth 2.1+ : Just Works, Numeric Comparison, Passkey Entry, Out-of-Band."},{"name":"BDADDR","desc":"Bluetooth Device Address, adresse matérielle Bluetooth comparable à une MAC et utilisée dans les scénarios de confiance/pairing."},{"name":"AES-CTR en LTE","desc":"Mode de chiffrement cité dans l’aLTEr attack ; le problème décrit est l’absence d’intégrité du user plane."},{"name":"DNS over HTTPS / TLS / DTLS","desc":"Le Module 16 cite le chiffrement des requêtes DNS via HTTPS, DoT ou DoDTLS comme contre-mesure contre les redirections de type aLTEr."},{"name":"DNSCrypt","desc":"Protocole cité comme protection supplémentaire pour sécuriser les requêtes DNS dans les contre-mesures aLTEr."}]}]},"contre":{"groups":[{"g":"6 couches de sécurité wireless","items":[{"name":"1. Wireless Signal Security","desc":"Surveiller le spectre RF avec un WIDS afin de détecter les appareils non autorisés, rogue AP et comportements radio anormaux."},{"name":"2. Connection Security","desc":"Protéger l’établissement de la connexion avec authentification par frame/paquet et mécanismes d’accès robustes pour réduire MITM et associations frauduleuses."},{"name":"3. Data Protection","desc":"Protéger les données avec WPA3 ou, à défaut, WPA2 + AES/CCMP. Éviter WEP, WPA/TKIP."},{"name":"4. Device Security","desc":"Maintenir AP, clients et équipements radio à jour : patch management, réduction des services inutiles et correction des vulnérabilités."},{"name":"5. Network Protection","desc":"Utiliser une authentification forte, segmentation et contrôles d’accès pour limiter ce qu’un client Wi-Fi peut atteindre après association."},{"name":"6. End-user Protection","desc":"Conserver une protection hôte, notamment firewall par utilisateur, afin qu’une association au WLAN ne donne pas automatiquement accès aux ressources du poste."}]},{"g":"Configuration AP, SSID & accès","items":[{"name":"Désactiver WPS","desc":"Le WPS PIN réduit l’espace de brute force et doit être désactivé lorsqu’il n’est pas nécessaire."},{"name":"WPA3 ou WPA2 + AES","desc":"Privilégier WPA3. Si non supporté, utiliser WPA2 avec AES/CCMP et éviter WPA/TKIP."},{"name":"802.1X + RADIUS","desc":"Pour l’entreprise, utiliser 802.1X avec RADIUS afin d’avoir une authentification individuelle plutôt qu’une PSK commune."},{"name":"Guest Network séparé","desc":"Créer un SSID/réseau invité isolé du réseau interne afin que les utilisateurs non fiables n’accèdent pas directement aux ressources sensibles."},{"name":"VLAN Segmentation","desc":"Séparer les types d’utilisateurs et de ressources par VLAN afin de réduire l’impact d’une compromission Wi-Fi."},{"name":"Réduire la puissance d’émission","desc":"Ajuster la puissance de l’AP au besoin réel afin de limiter le débordement du signal au-delà des locaux."},{"name":"Fermer services/ports inutiles","desc":"Désactiver les services non requis sur routeurs/AP et fermer les ports inutiles pour réduire la surface d’attaque."},{"name":"Firewall entre WLAN et Intranet","desc":"Placer un firewall ou packet filter entre le réseau sans fil et le réseau interne afin de contrôler les flux autorisés."},{"name":"SSID non descriptif","desc":"Éviter SSID par défaut, nom de société ou informations trop prédictibles. Le SSID ne doit pas servir de mot de passe ou indice sur le secret."},{"name":"SSID cloaking","desc":"Le Module 16 recommande le masquage du broadcast SSID comme bonne pratique de configuration, sans le présenter comme une authentification forte."},{"name":"Séparer les SSID","desc":"Utiliser des SSID distincts pour collaborateurs, invités ou autres usages afin d’appliquer des politiques réseau différentes."},{"name":"Changer SSID et mots de passe périodiquement","desc":"Le Module 16 recommande de renouveler périodiquement les identifiants et secrets du réseau sans fil."},{"name":"VPN pour accès interne BYOD","desc":"Le Chapter 11 recommande d’isoler le wireless comme un réseau externe et de forcer l’accès aux ressources internes via VPN pour les appareils BYOD."}]},{"g":"Rogue AP, WIDS & WIPS","items":[{"name":"WIDS","desc":"Wireless Intrusion Detection System : surveille en continu le spectre radio et alerte sur rogue AP, appareils non autorisés ou anomalies."},{"name":"WIPS","desc":"Wireless Intrusion Prevention System : ajoute des capacités de blocage/containment automatisé aux fonctions de détection radio."},{"name":"Bloquer le switch port du rogue AP","desc":"Si le rogue AP est relié au réseau filaire, désactiver le port du switch ou retirer physiquement l’équipement."},{"name":"ACL / whitelist MAC","desc":"Peut limiter l’accès à des appareils connus, mais la MAC est spoofable : à utiliser comme couche supplémentaire, pas comme authentification principale."},{"name":"Surveillance continue des rogue AP","desc":"Scanner régulièrement l’environnement radio et maintenir une liste des AP autorisés afin de détecter rapidement toute infrastructure non approuvée."},{"name":"Segmentation après rogue association","desc":"Même si un client se connecte par erreur à un AP ou réseau compromis, la segmentation limite l’accès aux ressources critiques."}]},{"g":"Contre-mesures KRACK","items":[{"name":"Patcher clients et AP","desc":"KRACK exploite le comportement du 4-way handshake. La mesure centrale est de mettre à jour les clients, AP, routeurs et IoT concernés."},{"name":"WPA3","desc":"Le Module 16 recommande WPA3 pour éviter les faiblesses associées aux anciens mécanismes."},{"name":"EAPOL-Key Replay Counter","desc":"N’accepter que la valeur de compteur la plus récente aide à empêcher le replay d’anciens messages EAPOL-Key."},{"name":"HTTPS et VPN","desc":"Même si le Wi-Fi est compromis, du chiffrement applicatif ou un VPN réduit la valeur du trafic intercepté."},{"name":"2FA","desc":"L’authentification multi-facteur réduit l’impact de credentials récupérés après interception."},{"name":"Désactiver 802.11r temporairement","desc":"Le Module 16 cite la désactivation temporaire de fast roaming/802.11r dans le contexte des contre-mesures KRACK."},{"name":"Network Segmentation","desc":"Limiter ce qu’un client Wi-Fi compromis peut atteindre sur le réseau interne."},{"name":"Connexion filaire de secours","desc":"Le Module 16 recommande d’utiliser Ethernet lorsqu’une vulnérabilité KRACK non corrigée est identifiée."}]},{"g":"Contre-mesures aLTEr / DNS","items":[{"name":"DNS chiffré","desc":"Chiffrer les requêtes DNS et utiliser des résolveurs de confiance réduit les possibilités de redirection DNS dans un scénario aLTEr."},{"name":"DoH / DoT / DoDTLS","desc":"Le Module cite DNS over HTTPS, DNS over TLS et DNS over DTLS comme moyens de protéger les requêtes et réponses DNS."},{"name":"HTTPS","desc":"Utiliser uniquement des sites HTTPS évite qu’une simple redirection réseau fournisse un canal applicatif entièrement en clair."},{"name":"Message Authentication Code sur user plane","desc":"Ajouter une protection d’intégrité/MAC aux paquets du user plane répond directement au problème d’intégrité décrit dans aLTEr."},{"name":"DNSCrypt","desc":"Autre mécanisme cité pour protéger les échanges DNS contre l’altération ou l’observation."}]},{"g":"Bluetooth / bonnes pratiques","items":[{"name":"Privilégier SSP avec vérification","desc":"Lorsque l’appareil le permet, Numeric Comparison, Passkey Entry ou OOB fournissent une vérification plus forte que Just Works."},{"name":"Éviter les PIN par défaut","desc":"Les périphériques utilisant des PIN codés en dur comme 0000/1234 sont plus faciles à deviner ; remplacer ces secrets lorsque le matériel le permet."},{"name":"Limiter la découvrabilité","desc":"Réduire le temps pendant lequel un appareil est visible/découvrable diminue l’exposition aux scans à proximité."},{"name":"Bluebugging : interrompre l’appel","desc":"Le Chapter 11 indique que la victime peut mettre fin au contrôle de type Bluebugging en raccrochant l’appel en cours."}]}]}}},{"n":17,"t":"Hacking Mobile Platforms","data":{"concept":{"groups":[{"g":"Écosystème mobile & surface d’attaque","items":[{"name":"Surface d’attaque mobile","desc":"Un smartphone communique par plusieurs canaux : 3G/4G/5G, Wi‑Fi, Bluetooth et liaison filaire/USB. Les données peuvent ensuite traverser Internet, une passerelle VPN d’entreprise, l’intranet, un App Store ou un service web. Chaque étape ajoute une surface d’attaque : terminal, application, réseau radio, opérateur, navigateur, backend et stockage.","exam":"Raisonner sur toute la chaîne : appareil → réseau → Internet/VPN → services d’entreprise / App Store / Web."},{"name":"Android — fragmentation","desc":"Android est développé par Google mais utilisé par de nombreux constructeurs. Chaque fabricant peut modifier le système, ajouter des composants et gérer ses propres cycles de mise à jour. Résultat : plusieurs versions et personnalisations coexistent, avec des niveaux de correctifs parfois très différents.","exam":"Android fragmentation = nombreux vendors + versions → patching hétérogène."},{"name":"iOS — modèle centralisé","desc":"iOS est développé par Apple pour l’iPhone et l’iPad et dérive de macOS. Apple contrôle davantage l’écosystème logiciel et pousse fortement les utilisateurs vers les versions récentes, ce qui réduit la fragmentation et accélère l’adoption des correctifs par rapport à un écosystème multi‑constructeurs."},{"name":"App marketplaces","desc":"Les applications constituent un vecteur majeur d’attaque mobile. Android s’appuie principalement sur Google Play mais autorise aussi le sideloading et des stores tiers. iOS s’appuie principalement sur l’App Store et impose davantage de restrictions à l’installation d’applications extérieures selon la plateforme et la région."},{"name":"Sideloading","desc":"Le sideloading consiste à installer une application depuis une source autre que le magasin officiel. Il augmente le risque de logiciels malveillants ou modifiés, car l’application peut ne pas avoir subi les contrôles du store officiel."},{"name":"Vetting des applications","desc":"Le vetting est l’ensemble des tests et analyses réalisés avant qu’une application soit acceptée dans un magasin. Il vise à détecter du code malveillant, des comportements suspects et des problèmes de sécurité avant distribution."},{"name":"Applications malveillantes","desc":"Une application présentée comme légitime peut contenir du malware, exfiltrer des données ou demander des permissions excessives. Les stores tiers et les applications repackagées augmentent ce risque, surtout lorsque l’utilisateur contourne les mécanismes de validation du système.","exam":"Vecteur mobile majeur : application tierce/malveillante."},{"name":"Rogue network access","desc":"Un faux réseau Wi‑Fi dans un lieu public peut attirer automatiquement des appareils mobiles qui reconnaissent un SSID connu. Une fois connecté, le trafic peut être observé, redirigé ou manipulé selon les protections utilisées. Ce risque explique l’importance de traiter les réseaux publics comme non fiables.","xref":[16]},{"name":"Phishing / SMiShing sur mobile","desc":"Les écrans mobiles affichent moins d’informations sur l’URL et les utilisateurs interagissent rapidement avec les notifications, liens et SMS. Cela augmente l’efficacité du phishing et du SMiShing, notamment lorsqu’un message demande une action urgente ou renvoie vers une fausse page de connexion.","xref":[9]},{"name":"Bad programming","desc":"Une application peut être vulnérable sans qu’un attaquant ait installé de malware : mauvaise gestion des sessions, stockage local non sécurisé, chiffrement mal implémenté, validation insuffisante ou permissions excessives créent directement une surface d’attaque."}]},{"g":"OWASP Mobile Top 10 — 2024","items":[{"name":"M1 — Improper Credential Usage","desc":"Mauvaise gestion des identifiants, secrets et tokens : credentials codés en dur, stockage non protégé, transmission non chiffrée ou méthodes d’authentification faibles. Une compromission de ces éléments peut permettre l’usurpation de l’utilisateur ou de l’application.","exam":"M1 = credentials/tokens mal protégés ou codés en dur."},{"name":"M2 — Inadequate Supply Chain Security","desc":"Risque lié aux bibliothèques, composants tiers, processus de build ou mécanismes de distribution insuffisamment contrôlés. Un composant obsolète ou compromis peut introduire une faiblesse même si le code principal de l’application est correct."},{"name":"M3 — Insecure Authentication/Authorization","desc":"Authentification ou autorisation insuffisante : mots de passe faibles, mauvaise gestion des tokens, contrôles d’accès mal conçus ou vérifications côté client uniquement. Le serveur doit vérifier l’identité et les permissions pour chaque opération sensible."},{"name":"M4 — Insufficient Input/Output Validation","desc":"Les données fournies par l’utilisateur ou reçues d’un autre composant doivent être validées avant traitement. Une validation insuffisante peut mener à des injections SQL, commandes, XSS ou autres comportements inattendus."},{"name":"M5 — Insecure Communication","desc":"Communication utilisant des protocoles obsolètes, une configuration TLS incorrecte ou des certificats mal validés. Un canal réseau mobile non correctement protégé peut exposer identifiants, données personnelles et sessions à l’interception ou à la modification."},{"name":"M6 — Inadequate Privacy Controls","desc":"Protection insuffisante des données personnelles telles que nom, adresse, données financières ou autres informations identifiantes. Le risque concerne la collecte, l’accès, le stockage, la transmission et l’exposition excessive de ces données."},{"name":"M7 — Insufficient Binary Protections","desc":"L’application binaire manque de protections contre la modification, l’analyse et le reverse engineering. Cela facilite le tampering, le repackaging, la création d’applications contrefaites et l’extraction de logique ou de secrets.","exam":"M7 = tampering / reverse engineering / counterfeit apps."},{"name":"M8 — Security Misconfiguration","desc":"Paramètres faibles ou dangereux : chiffrement ou hachage mal configuré, stockage exposé, contrôles d’accès incorrects, debug actif en production ou permissions inutiles. Ces erreurs créent une surface d’attaque sans nécessiter de vulnérabilité complexe."},{"name":"M9 — Insecure Data Storage","desc":"Les données sensibles sont stockées en clair, dans une base non sécurisée ou dans un emplacement trop accessible. La protection locale doit tenir compte des permissions, du chiffrement et des mécanismes sécurisés du système."},{"name":"M10 — Insufficient Cryptography","desc":"Utilisation d’algorithmes faibles ou obsolètes, gestion incorrecte des clés, fonctions de hachage inadéquates ou génération aléatoire insuffisante. Même si une application « chiffre » ses données, une mauvaise crypto peut rendre la protection inefficace.","exam":"M10 = algorithmes/clé/hash/RNG insuffisants."}]},{"g":"Vecteurs d’attaque mobiles","items":[{"name":"Baseband Attack","desc":"Le baseband est le composant qui gère les communications cellulaires GSM/3GPP et les échanges radio avec les antennes opérateur. Une vulnérabilité dans ce processeur ou son firmware peut être exploitée via les communications radio sans passer par une application classique."},{"name":"SMiShing","desc":"Phishing utilisant les SMS pour pousser la victime à cliquer sur un lien, appeler un numéro ou fournir des informations sensibles. Son efficacité vient notamment du taux d’ouverture élevé des SMS, de la confiance accordée au canal et de l’espace d’affichage limité sur mobile.","exam":"SMiShing = SMS phishing.","xref":[9]},{"name":"Sensitive Data Storage","desc":"Une application peut enregistrer localement des identifiants, tokens, PII ou données métier dans un emplacement trop accessible ou en clair. La compromission du terminal ou d’une autre application peut alors exposer directement ces données."},{"name":"No / Weak Encryption","desc":"Des données sensibles protégées par un chiffrement faible, mal configuré ou absent restent exploitables si elles sont interceptées ou extraites du terminal. Le problème peut concerner le stockage comme les communications."},{"name":"Improper SSL Validation","desc":"Une application qui accepte un certificat invalide ou ne vérifie pas correctement l’identité du serveur peut permettre à un intermédiaire de présenter un faux certificat et d’intercepter la communication."},{"name":"Configuration Manipulation","desc":"Une application mobile dépend souvent de fichiers, préférences ou paramètres locaux. Si ces réglages peuvent être modifiés sans contrôle d’intégrité ou d’autorisation, le comportement de l’application peut être détourné."},{"name":"Dynamic Runtime Injection","desc":"Injection de code ou modification du comportement d’une application pendant son exécution. L’objectif est d’agir sur les fonctions en mémoire, les appels ou les données au moment où l’application tourne."},{"name":"Unintended Permissions","desc":"Une application demande ou obtient des permissions supérieures à ce qui est nécessaire à son fonctionnement. Ces droits supplémentaires augmentent l’impact potentiel d’une compromission."},{"name":"Escalated Privileges","desc":"Une faiblesse permet à une application ou à un utilisateur d’obtenir davantage de privilèges que prévu. Sur mobile, cela peut contourner des restrictions du sandbox ou du système et étendre l’accès aux ressources."},{"name":"UI Overlay / PIN Stealing","desc":"Une interface malveillante se superpose à une interface légitime pour tromper l’utilisateur et lui faire saisir un PIN ou d’autres secrets dans une vue contrôlée par l’attaquant."},{"name":"Third-party Code","desc":"Bibliothèques et SDK tiers peuvent introduire des vulnérabilités, comportements non désirés ou dépendances obsolètes dans une application pourtant correctement développée."},{"name":"Intent Hijacking","desc":"Android utilise des intents pour faire communiquer des composants. Une mauvaise exposition ou validation de ces messages peut permettre à une application non prévue d’intercepter ou de déclencher une action."},{"name":"Zip Directory Traversal","desc":"Lors de l’extraction d’une archive, des chemins mal validés peuvent sortir du répertoire prévu et écrire des fichiers ailleurs. C’est une forme de directory traversal appliquée au traitement des archives."},{"name":"Clipboard Data","desc":"Le presse-papiers peut contenir des mots de passe, codes, tokens ou autres données sensibles. Une application qui y laisse des secrets augmente le risque d’exposition à d’autres composants ou utilisateurs."},{"name":"URL Schemes","desc":"Les applications mobiles peuvent s’enregistrer pour gérer certains schémas d’URL. Une mauvaise validation des paramètres reçus par ces liens peut déclencher des actions non prévues ou transmettre des données sensibles."},{"name":"GPS Spoofing","desc":"Manipulation des informations de localisation afin de faire croire à l’application que l’appareil se trouve dans un autre emplacement. Le risque dépend des décisions de sécurité ou métier prises à partir de la position."},{"name":"Weak / No Local Authentication","desc":"Une application sensible qui ne demande pas d’authentification locale ou repose sur une protection faible peut rester accessible à une personne qui obtient physiquement le terminal."},{"name":"Tampering / Repackaging","desc":"Une application légitime est modifiée puis redistribuée sous une apparence similaire. Du code malveillant ou publicitaire peut être ajouté sans que l’utilisateur distingue facilement la version falsifiée."},{"name":"Side-channel Data Leakage","desc":"Des informations sensibles peuvent apparaître indirectement dans logs, caches, notifications, captures d’écran, fichiers temporaires ou autres canaux secondaires, même si le stockage principal est protégé."},{"name":"Framing","desc":"Une page ou interface légitime est incorporée dans une page contrôlée par l’attaquant, par exemple via un iFrame. L’utilisateur peut croire qu’il interagit directement avec le service alors que l’environnement visuel est manipulé."},{"name":"Clickjacking","desc":"Attaque de redressage d’interface : l’utilisateur pense cliquer sur un élément visible alors que son clic agit sur un autre élément superposé ou masqué.","xref":[14]},{"name":"Man-in-the-Mobile","desc":"Code malveillant présent sur le téléphone intercepte ou relaie des informations d’authentification, notamment des OTP, afin de contourner une vérification additionnelle et transmettre les données à l’attaquant."},{"name":"Data Caching","desc":"Les navigateurs et applications peuvent conserver localement des données temporaires. Si des informations sensibles restent dans ces caches, elles peuvent être récupérées après la session."},{"name":"Web-server / network attacks","desc":"Le backend mobile reste exposé aux attaques classiques : mauvaise configuration serveur, XSS, CSRF, validation faible, brute force, CORS mal configuré, side channels ou attaques contre l’infrastructure."},{"name":"Database attacks","desc":"Une application mobile peut transmettre des entrées non validées à une base de données. Une injection SQL permet alors de modifier la logique de requête et d’accéder à des données non prévues.","xref":[15]}]},{"g":"Attaques nommées & scénarios CEH","items":[{"name":"Agent Smith Attack","desc":"Une application malveillante téléchargée depuis un store tiers remplace ou infecte des applications légitimes telles que WhatsApp, SHAREit ou MX Player. Les versions modifiées reçoivent des commandes C2, affichent des publicités indésirables et peuvent servir à voler des informations.","exam":"Agent Smith = application malveillante qui remplace/infecte des apps légitimes."},{"name":"Simjacker","desc":"Une commande malveillante est envoyée par SMS et traitée par la SIM. Elle peut demander au terminal de récupérer sa localisation et son Cell-ID, puis envoyer ces informations par SMS vers un autre appareil.","exam":"Simjacker = SMS → SIM traite le code → localisation/Cell-ID exfiltrés."},{"name":"OTP Hijacking","desc":"L’objectif est de détourner le second facteur ou un OTP envoyé au téléphone. Le contrôle peut être obtenu par social engineering auprès de l’opérateur, réattribution de numéro ou malware capable de lire/intercepter les messages."},{"name":"SIM Swapping","desc":"L’attaquant convainc l’opérateur de transférer le numéro de la victime vers une SIM qu’il contrôle. Les SMS et appels liés à ce numéro peuvent alors arriver sur l’appareil de l’attaquant, ce qui compromet notamment les mécanismes MFA basés sur SMS.","exam":"SIM swapping = social engineering de l’opérateur pour transférer le numéro.","xref":[9]},{"name":"SIM Jacking Malware","desc":"Un malware mobile peut lire ou intercepter les OTP et autres messages d’authentification sur le terminal. L’attaque vise le canal de réception du second facteur plutôt que l’algorithme cryptographique du service."},{"name":"Mobile malware","desc":"Trojans, spyware et ransomware peuvent être livrés via applications, liens ou téléchargements. Sur mobile, les permissions et l’accès aux SMS, appels, stockage, caméra ou localisation peuvent fortement augmenter leur impact.","xref":[7]}]},{"g":"Android — architecture & stockage","items":[{"name":"Android Architecture","desc":"La pile Android va des System Apps vers le Java API Framework, les bibliothèques natives C/C++ et Android Runtime (ART), puis la Hardware Abstraction Layer (HAL), le noyau Linux et la gestion d’énergie. Chaque couche fournit des services à la couche supérieure.","exam":"Android : Apps → Java API → Native/ART → HAL → Linux Kernel → Power Management."},{"name":"System Apps","desc":"Applications système telles que Dialer, Email, Calendar ou Camera. Elles utilisent les API de la plateforme et servent d’exemple des composants visibles au niveau utilisateur."},{"name":"Java API Framework","desc":"Couche offrant les services de haut niveau aux applications : Content Providers, Activity/Location/Package/Notification/Resource/Telephony/Window Managers et système de vues."},{"name":"Native C/C++ Libraries","desc":"Bibliothèques natives telles que libc, media framework, OpenGL ES ou composants web. Elles fournissent des fonctions bas niveau utilisées par le framework et les applications."},{"name":"Android Runtime — ART","desc":"Environnement d’exécution Android associé aux Core Libraries. Il permet aux applications Android d’exécuter leur code dans l’environnement prévu par la plateforme."},{"name":"HAL — Hardware Abstraction Layer","desc":"Couche d’abstraction permettant au système d’accéder à des fonctions matérielles comme audio, Bluetooth, caméra et capteurs sans que les couches supérieures dépendent directement du matériel."},{"name":"Linux Kernel Android","desc":"Base du système qui gère notamment les pilotes audio, affichage, clavier, Bluetooth, Wi‑Fi, USB, caméra, mémoire partagée ainsi que Binder/IPC."},{"name":"Binder / IPC","desc":"Mécanisme de communication inter-processus mentionné dans la couche noyau Android. Il permet aux composants du système et applications de communiquer entre processus."},{"name":"Shared Preferences","desc":"Stockage Android de petites données primitives sous forme clé‑valeur. Il convient aux préférences de l’application mais ne doit pas être considéré comme un coffre-fort pour secrets sensibles."},{"name":"Internal Storage","desc":"Stockage interne privé de l’application sur l’appareil. Il offre une isolation supérieure au stockage partagé, sous réserve des permissions et de l’état de sécurité du terminal."},{"name":"External Storage","desc":"Espace de stockage partagé ou public. Les données qui y sont placées sont plus exposées et ne conviennent pas aux secrets sans protection supplémentaire."},{"name":"SQLite Database","desc":"Base locale structurée utilisée par Android pour stocker des données applicatives. Sa sécurité dépend de l’emplacement, des permissions et de la protection des données qu’elle contient."},{"name":"Network Storage / Server","desc":"Une application peut conserver les données sur son propre serveur plutôt que localement. Le risque se déplace alors vers la communication réseau, l’authentification et la sécurité du backend."}]},{"g":"Android — rooting, FRP & analyse","items":[{"name":"Android Rooting","desc":"Le rooting vise à obtenir le contrôle privilégié « root » dans le sous-système Android. Le processus exploite des faiblesses du firmware, place le binaire su dans le PATH — par exemple `/system/xbin/su` — puis lui attribue des permissions d’exécution.","exam":"Rooting Android → binaire su dans le PATH."},{"name":"Ce que permet le rooting","desc":"Avec les privilèges root, l’utilisateur peut modifier ou supprimer des fichiers système, ROMs, kernels et modules, retirer des applications constructeur, accéder davantage au matériel ou modifier le comportement du terminal. Cette liberté contourne aussi des protections du modèle de sécurité normal."},{"name":"Rooting — impact sécurité","desc":"Le root supprime des barrières prévues par Android et augmente l’impact d’une application malveillante ou d’une erreur. Pour cette raison, les recommandations de durcissement demandent de ne pas rooter les terminaux utilisés normalement."},{"name":"FRP — Factory Reset Protection","desc":"Fonction de protection Android destinée à empêcher l’accès non autorisé à un appareil perdu ou volé après une réinitialisation. Le contournement de FRP vise à supprimer ce verrou afin de réutiliser l’appareil sans le compte attendu.","exam":"FRP protège les Android perdus/volés après reset."},{"name":"Static APK Analysis","desc":"Analyse du code et des propriétés d’une application Android sans l’exécuter. Elle peut révéler permissions, composants exposés, certificats, caractéristiques malveillantes et vulnérabilités avant toute exécution."},{"name":"Dynamic Mobile Analysis","desc":"Analyse d’une application pendant son exécution afin d’observer ses comportements. MobSF est présenté comme capable d’automatiser aussi bien l’analyse statique que dynamique de formats mobiles."},{"name":"APK / XAPK","desc":"Formats d’application Android pris en charge par des outils d’analyse comme MobSF. L’analyse peut extraire permissions, activités browsables et informations de signature."}]},{"g":"iOS — architecture","items":[{"name":"iOS Architecture","desc":"La pile iOS comprend Cocoa au niveau application, puis Media Layer, Core Services, Core OS et enfin Kernel & Device Drivers. Les couches basses fournissent les mécanismes de sécurité, réseau, système de fichiers et accès matériel nécessaires aux couches supérieures.","exam":"iOS : Cocoa → Media → Core Services → Core OS → Kernel/Drivers."},{"name":"Cocoa","desc":"Couche application située au sommet de l’architecture iOS. Elle fournit les frameworks utilisés directement par les applications et l’interface utilisateur."},{"name":"Media Layer","desc":"Couche dédiée aux fonctions multimédia et graphiques : AV Foundation, Core Animation, Core Audio, Core Image, Core Text, OpenAL, OpenGL et Quartz."},{"name":"Core Services","desc":"Services fondamentaux de l’OS : Address Book, Core Data, Core Foundation, Foundation, Quick Look, Social, Security et WebKit."},{"name":"Core OS","desc":"Couche basse fournissant des fonctions système essentielles : Accelerate, Directory Services, Disk Arbitration, OpenCL et System Configuration. Elle soutient les mécanismes utilisés par les technologies supérieures."},{"name":"Kernel & Device Drivers","desc":"Couche la plus basse contenant le kernel, les pilotes, BSD, le système de fichiers et l’infrastructure réseau. Les mécanismes de bas niveau de l’appareil reposent sur cette couche."}]},{"g":"iOS — Jailbreaking","items":[{"name":"Jailbreaking","desc":"Le jailbreaking contourne les restrictions d’iOS afin d’obtenir davantage de contrôle sur le système et d’exécuter des composants normalement interdits. Comme le rooting Android, il affaiblit certaines protections natives et modifie le modèle de confiance de l’appareil."},{"name":"Userland Exploit","desc":"Exploite une faille dans une application ou composant de l’espace utilisateur. Il donne un accès au niveau user mais pas à iBoot. Une mise à jour du firmware peut corriger la vulnérabilité.","exam":"Userland = user-level seulement ; firmware peut patcher."},{"name":"iBoot Exploit","desc":"Exploite une faiblesse d’iBoot, présenté comme le troisième bootloader. Il permet un accès user-level et iBoot-level. Une mise à jour du firmware peut le corriger.","exam":"iBoot exploit = user + iBoot ; patchable par firmware."},{"name":"Bootrom Exploit","desc":"Exploite SecureROM, premier bootloader. Il peut désactiver les contrôles de signature et permettre de charger un firmware modifié. Une mise à jour logicielle ne peut pas corriger ce type de faille ; il faut une correction matérielle du bootrom.","exam":"Bootrom exploit = non patchable par firmware ; correction matérielle."},{"name":"Untethered Jailbreaking","desc":"Après redémarrage, l’appareil démarre complètement avec le kernel patché et reste jailbreaké sans assistance d’un ordinateur."},{"name":"Semi-tethered Jailbreaking","desc":"Après redémarrage, l’appareil démarre et reste utilisable, mais le kernel n’est pas patché. Un outil de jailbreak est nécessaire pour retrouver les extensions ou fonctions liées au jailbreak."},{"name":"Tethered Jailbreaking","desc":"Le terminal ne dispose pas d’un kernel patché lorsqu’il démarre seul et peut rester partiellement bloqué. Il doit être reconnecté à un ordinateur et « boot tethered » à chaque redémarrage.","exam":"Tethered = ordinateur requis à chaque reboot."},{"name":"Semi-untethered Jailbreaking","desc":"Après redémarrage, le kernel n’est pas patché, mais une application déjà installée sur l’appareil peut réappliquer le jailbreak sans ordinateur."},{"name":"Rooting vs Jailbreaking","desc":"Rooting désigne l’obtention de privilèges root sur Android ; jailbreaking désigne le contournement des restrictions iOS. Les deux donnent davantage de contrôle à l’utilisateur mais diminuent certaines protections du système.","exam":"Android = rooting ; iOS = jailbreaking."}]},{"g":"iOS — accès shell & instrumentation","items":[{"name":"Default iOS shell credentials","desc":"Dans le contexte d’un appareil jailbreaké exposant OpenSSH, les comptes `root` et `mobile` sont associés au mot de passe par défaut `alpine`. Conserver ces identifiants par défaut crée un risque évident d’accès non autorisé.","exam":"iOS shell par défaut : root/mobile + alpine."},{"name":"Shell iOS via Wi‑Fi","desc":"Avec OpenSSH installé et le terminal sur le même réseau, un shell peut être ouvert vers l’adresse IP de l’appareil. Ce type d’accès illustre pourquoi les identifiants par défaut doivent être changés immédiatement."},{"name":"Shell iOS via USB","desc":"Quand le Wi‑Fi n’est pas utilisable, usbmuxd/iproxy peut rediriger une connexion locale vers le service SSH de l’iPhone. La connexion est ensuite ouverte avec `ssh -p 2222 root@localhost`."},{"name":"USB Restricted Mode","desc":"iOS limite les connexions de données USB lorsque l’appareil est verrouillé depuis plus d’une certaine durée. Cela réduit les possibilités d’accès ou d’instrumentation via câble sur un terminal verrouillé."},{"name":"Frida — app enumeration","desc":"Frida peut interagir avec un appareil iOS connecté pour lister les applications et instrumenter leur exécution. La commande `frida-ps -Uai` est utilisée pour afficher les applications installées."},{"name":"rvictl / rvi0","desc":"rvictl crée une Remote Virtual Interface associée à un appareil iOS. L’interface `rvi0` peut ensuite servir à l’observation réseau du trafic du terminal depuis le poste d’analyse."}]},{"g":"MDM & BYOD","items":[{"name":"MDM — Mobile Device Management","desc":"Plateforme d’administration permettant de distribuer à distance applications, données et paramètres de configuration à des terminaux mobiles. Elle sert à appliquer des politiques d’entreprise sur des appareils détenus par l’organisation ou dans un contexte BYOD.","exam":"MDM = distribution + configuration + politiques + suivi des terminaux."},{"name":"MDM — architecture","desc":"Les terminaux rejoignent l’infrastructure MDM via le réseau. L’architecture comprend typiquement Internet, firewall/DMZ, serveur MDM, console administrative et systèmes d’entreprise tels que fichiers, annuaires et bases de données."},{"name":"Passcode Enforcement","desc":"Le MDM peut imposer un code de verrouillage afin de réduire le risque d’accès local non autorisé à un appareil perdu, volé ou laissé sans surveillance."},{"name":"Remote Lock","desc":"Fonction MDM permettant de verrouiller à distance un terminal perdu ou suspect afin d’empêcher son utilisation immédiate."},{"name":"Remote Wipe","desc":"Fonction permettant d’effacer à distance les données d’un appareil perdu ou volé. Elle est particulièrement utile lorsque des informations professionnelles sont stockées localement."},{"name":"Root / Jailbreak Detection","desc":"Le MDM peut détecter les terminaux rootés ou jailbreakés afin d’appliquer une politique différente, de bloquer l’accès ou de déclencher une remédiation."},{"name":"Policy Enforcement & Inventory","desc":"Le MDM centralise les règles de sécurité et l’inventaire des appareils. Il aide à vérifier la conformité et à connaître les terminaux présents dans l’environnement."},{"name":"Real-time Monitoring & Reporting","desc":"Le MDM fournit un suivi et des rapports sur l’état des terminaux, ce qui aide à détecter les écarts de configuration et à appliquer les politiques."},{"name":"BYOD","desc":"Bring Your Own Device autorise l’utilisation d’appareils personnels pour accéder aux ressources de l’entreprise. Cela réduit certains coûts et augmente la mobilité, mais oblige à séparer clairement exigences professionnelles et usage privé.","exam":"BYOD = appareil personnel + accès entreprise → besoin de politiques et contrôle."},{"name":"BYOD — unsecured networks","desc":"Un terminal personnel peut transmettre des données confidentielles via un réseau non sécurisé. Les connexions publiques doivent être considérées comme non fiables et protégées par des mécanismes de chiffrement adaptés."},{"name":"BYOD — data leakage","desc":"Un mobile est un endpoint connecté au cloud et aux réseaux d’entreprise. La perte du terminal, une application malveillante ou une mauvaise configuration peut exposer les données professionnelles."},{"name":"BYOD — device disposal","desc":"Un appareil mis au rebut sans effacement correct peut encore contenir données financières, contacts, données d’entreprise et autres informations sensibles."},{"name":"BYOD — support complexity","desc":"La diversité des constructeurs, versions et configurations augmente la charge de support et complique l’application homogène des contrôles de sécurité."},{"name":"BYOD — mélange perso/pro","desc":"Mélanger données personnelles et professionnelles complique le chiffrement, les sauvegardes et le remote wipe. Une séparation logique permet d’appliquer des contrôles ciblés sans effacer inutilement les données privées."},{"name":"BYOD — isolation réseau","desc":"Un réseau wireless utilisé par des appareils personnels peut être isolé comme un réseau externe à l’entreprise. L’accès aux ressources internes passe alors par un VPN ; un réseau invité séparé suit la même logique de cloisonnement."}]},{"g":"Stockage sécurisé des secrets","items":[{"name":"Android KeyStore","desc":"Mécanisme de stockage de clés Android pouvant être soutenu par le matériel. L’accès peu
