ion <target>\nnmap -sU -p 53 --script dns-nsec-enum --script-args dns-nsec-enum.domains=<domain> <target>","cheat":[{"words":1,"title":"Scripts","rows":[["broadcast-dns-service-discovery","services DNS"],["dns-brute","brute-force de sous-domaines"],["dns-recursion","tester la récursion"],["dns-nsec-enum","NSEC zone walking"]]}]},{"name":"DNSRecon","desc":"DNSRecon peut effectuer plusieurs formes d’énumération DNS. L’option montrée pour le zone walking DNSSEC est -z.","syntax":"dnsrecon -d <domain> -z","cheat":[{"words":1,"title":"Options","rows":[["-d <domain>","domaine cible"],["-z","DNSSEC zone walk"]]}],"xref":[2]},{"name":"ldns-walk","desc":"Outil LDNS utilisé pour parcourir une zone DNSSEC à partir des enregistrements NSEC/NSEC3 lorsqu’ils permettent le zone walking.","syntax":"ldns-walk @<DNS-server-IP> <domain>"},{"name":"ike-scan","desc":"Outil dédié à l’énumération des VPN IPsec/IKE. Il permet de détecter un service IKE et d’observer les propositions cryptographiques renvoyées.","syntax":"ike-scan <target>"},{"name":"Nmap — IKE","desc":"Nmap vérifie la présence d’IKE sur UDP 500 et le script ike-version peut fournir des informations sur la version et les paramètres du service.","syntax":"nmap -sU -p 500 <target>\nnmap -sU -p 500 --script=ike-version <target>"},{"name":"Svmap","desc":"Scanner SIP utilisé pour identifier les équipements et serveurs PBX/VoIP sur de grandes plages réseau, y compris sur des ports SIP non standards.","exam":"Svmap = découverte de devices/PBX SIP."},{"name":"Metasploit — SIP","desc":"Metasploit contient des modules auxiliaires sous auxiliary/scanner/sip/* pour l’énumération et l’interrogation des services SIP.","syntax":"search auxiliary/scanner/sip"}]},{"g":"Web & Unix/Linux","items":[{"name":"rusers","desc":"Commande Unix permettant de lister les utilisateurs connectés sur des machines locales ou distantes du réseau.","syntax":"/usr/bin/rusers [-a] [-l] [-u] [-h] [-i] [Host ...]","cheat":[{"words":1,"title":"Options","rows":[["-a","inclure machines sans utilisateur"],["-l","listing long"],["-u","trier par nombre d’utilisateurs"],["-h","trier par hostname"],["-i","trier par idle time"]]}]},{"name":"rwho","desc":"Commande Unix qui affiche les utilisateurs connectés aux hôtes du réseau local.","syntax":"rwho [-a]","cheat":[{"words":1,"title":"Option","rows":[["-a","option citée par la syntaxe du cours"]]}]},{"name":"finger","desc":"finger affiche des informations sur les utilisateurs : login, nom réel, terminal, idle time, heure de connexion et parfois coordonnées.","syntax":"finger [-l] [-m] [-p] [-s] [user ...] [user@host ...]","cheat":[{"words":1,"title":"Options citées","rows":[["-l","format long"],["-m","matching du nom"],["-p","masquer plan/project"],["-s","format court"]]}]},{"name":"dirb","desc":"Scanner de répertoires web basé sur une wordlist. Il teste des chemins et interprète les réponses du serveur pour découvrir des dossiers non liés publiquement.","syntax":"dirb http://<target>"},{"name":"Metasploit — brute_dirs","desc":"Module HTTP qui fuzz/bruteforce les noms de répertoires à partir d’une liste.","syntax":"use auxiliary/scanner/http/brute_dirs"},{"name":"Metasploit — wordpress_login_enum","desc":"Module permettant d’énumérer des utilisateurs WordPress. La commande loot affiche les informations collectées dans msfconsole.","syntax":"use auxiliary/scanner/http/wordpress_login_enum\nloot"},{"name":"WPScan","desc":"Outil spécialisé WordPress capable d’énumérer utilisateurs, plugins, thèmes et vulnérabilités connues associées.","syntax":"wpscan --url https://<target>"}]}]},"port":{"groups":[{"g":"Windows & annuaire","items":[{"name":"135 — Microsoft RPC Endpoint Mapper","desc":"Port TCP/UDP cité pour Microsoft RPC Endpoint Mapper. Il aide les clients à localiser des services RPC Windows."},{"name":"137 — NetBIOS Name Service","desc":"UDP 137 : résolution et annonces de noms NetBIOS."},{"name":"138 — NetBIOS Datagram Service","desc":"UDP 138 : datagrammes NetBIOS."},{"name":"139 — NetBIOS Session Service","desc":"TCP 139 : sessions NetBIOS, historiquement utilisées par SMB."},{"name":"445 — SMB Direct Host","desc":"TCP 445 : SMB directement sur TCP, sans couche NetBIOS."},{"name":"389 — LDAP","desc":"Port LDAP par défaut cité dans le module pour accéder à l’annuaire."},{"name":"3268 — Global Catalog","desc":"Global Catalog Service utilisé pour rechercher des objets à l’échelle de la forêt Active Directory."}]},{"g":"Infrastructure & management","items":[{"name":"53 — DNS","desc":"TCP/UDP 53 : DNS. L’énumération peut cibler AXFR, recursion, cache snooping et DNSSEC."},{"name":"111 — rpcbind / portmapper","desc":"TCP/UDP 111 : répertoire Sun RPC qui associe programmes RPC et ports dynamiques."},{"name":"123 — NTP","desc":"UDP 123 : synchronisation temporelle et énumération des peers/clients."},{"name":"161 — SNMP Agent","desc":"UDP 161 : requêtes de management vers l’agent SNMP."},{"name":"162 — SNMP Trap","desc":"Port de réception des traps/notifications SNMP cité dans le module."},{"name":"2049 — NFS","desc":"TCP 2049 : Network File System."},{"name":"1099 — Java RMI Registry","desc":"Port par défaut de rmiregistry pour les objets RMI Java."}]},{"g":"Mail, VPN & VoIP","items":[{"name":"25 — SMTP","desc":"TCP 25 : SMTP serveur-à-serveur et port classique pour les commandes VRFY/EXPN/RCPT TO."},{"name":"465 — SMTPS","desc":"Port SMTPS cité dans le chapitre pour une variante SMTP chiffrée."},{"name":"587 / 2525 — SMTP","desc":"Ports SMTP supplémentaires cités pour submission/alternatives selon les environnements."},{"name":"500 — ISAKMP / IKE","desc":"UDP 500 : négociation IKE/ISAKMP pour IPsec."},{"name":"5060 — SIP","desc":"TCP/UDP 5060 : SIP non chiffré."},{"name":"5061 — SIP TLS","desc":"TCP/UDP 5061 : SIP protégé par TLS."},{"name":"2000 / 2001 — VoIP","desc":"Ports VoIP/SIP supplémentaires cités dans le module."}]},{"g":"Autres services à reconnaître","items":[{"name":"20 / 21 — FTP","desc":"TCP 20/21 : FTP data/control, services pouvant être énumérés lorsqu’exposés."},{"name":"22 — SSH / SFTP","desc":"TCP 22 : SSH/SFTP ; scripts NSE peuvent énumérer les algorithmes SSH."},{"name":"23 — Telnet","desc":"TCP 23 : Telnet, avec identifiants transmis en clair."},{"name":"69 — TFTP","desc":"UDP 69 : Trivial FTP."},{"name":"179 — BGP","desc":"TCP 179 : Border Gateway Protocol."}]}]},"contre":{"groups":[{"g":"Principes généraux","items":[{"name":"Limiter l’accès au service","desc":"La défense la plus efficace contre l’énumération est d’empêcher un client non autorisé d’atteindre le service : firewall, ACL, segmentation et filtrage par source. Si aucune connexion n’est possible, aucune requête d’énumération ne peut être envoyée."},{"name":"Exiger une authentification","desc":"Éviter que les services retournent des informations riches à une connexion anonyme. L’authentification réduit fortement la quantité de métadonnées accessibles avant identification."},{"name":"Réduire les bannières et erreurs","desc":"Supprimer ou rendre génériques les versions, hostnames internes et détails techniques présents dans les bannières et messages d’erreur. Cela diminue la valeur de -sV, du banner grabbing et des scripts NSE."}]},{"g":"NetBIOS / SMB","items":[{"name":"Désactiver SMBv1","desc":"SMBv1 est ancien et vulnérable. Utiliser SMBv3 ou une version moderne et supprimer SMBv1 lorsque les applications ne l’exigent pas."},{"name":"Bloquer SMB/NetBIOS en périphérie","desc":"Filtrer 445 et les ports NetBIOS 137–139 sur les frontières où ils ne sont pas nécessaires. Les serveurs Internet-facing, notamment web et DNS, ne devraient pas exposer SMB."},{"name":"Bloquer les Null Sessions","desc":"Restreindre l’accès anonyme aux named pipes et aux partages. Le module cite le paramètre RestrictNullSessAccess sous HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters."},{"name":"Désactiver NetBIOS si inutile","desc":"Désactiver NetBIOS over TCP/IP et les fonctions de partage là où elles ne sont pas nécessaires afin de réduire les informations accessibles sur le LAN."}]},{"g":"SNMP & LDAP","items":[{"name":"Durcir SNMP","desc":"Désactiver SNMP si inutile. Sinon préférer SNMPv3, imposer authentification et chiffrement, filtrer UDP 161, placer le management sur un VLAN sécurisé et journaliser les accès."},{"name":"Changer les community strings","desc":"Pour SNMPv1/v2c, remplacer public/private par des secrets uniques et complexes et éviter les droits read-write lorsqu’ils ne sont pas nécessaires."},{"name":"Éviter NoAuthNoPriv","desc":"Le mode sans authentification ni confidentialité ne protège pas correctement les échanges. Les accès SNMP doivent être protégés par authentification, ACL/RBAC et, avec v3, chiffrement."},{"name":"Durcir LDAP","desc":"Désactiver les anonymous binds, limiter le trafic LDAP aux systèmes autorisés, utiliser des ACL, activer l’authentification adaptée et journaliser les accès à l’annuaire."},{"name":"Chiffrer LDAP","desc":"Le trafic LDAP non protégé expose les échanges. Utiliser SSL/STARTTLS selon l’architecture pour chiffrer les communications entre clients et annuaire."},{"name":"Canary accounts & decoy groups","desc":"Le module propose des comptes canaris et des groupes administrateurs leurres afin de détecter ou tromper une énumération ciblant les objets sensibles."}]},{"g":"NFS, SMTP & DNS","items":[{"name":"Durcir NFS","desc":"Restreindre les exports aux utilisateurs/hôtes nécessaires, conserver root_squash, migrer vers NFSv4 avec mécanismes Kerberos, filtrer 2049 et éviter les fichiers suid/sgid sur les exports."},{"name":"Désactiver VRFY / EXPN","desc":"Désactiver ou restreindre VRFY et EXPN. Pour RCPT TO, renvoyer des réponses aussi uniformes que possible afin de ne pas confirmer l’existence d’un compte."},{"name":"Désactiver l’Open Relay","desc":"Un serveur SMTP ne doit pas relayer arbitrairement des messages pour des clients non autorisés. Limiter également le nombre de connexions par source et les informations révélées dans les réponses."},{"name":"SPF / DKIM / DMARC & TLS","desc":"SPF, DKIM et DMARC renforcent la sécurité du domaine mail ; TLS protège les communications SMTP."},{"name":"Restreindre AXFR","desc":"Autoriser les transferts de zone DNS uniquement vers les serveurs secondaires prévus. Un AXFR ouvert donne une cartographie directe des hostnames et IP."},{"name":"Durcir les résolveurs DNS","desc":"Limiter la récursion aux clients autorisés, séparer fonctions authoritative et recursive, patcher les nameservers et éviter d’exposer un resolver ouvert."},{"name":"DNSSEC & gouvernance DNS","desc":"Utiliser DNSSEC pour signer les données DNS, auditer les zones et protéger l’administration DNS par des contrôles forts, y compris verrouillage des changements et authentification renforcée."}]}]}}},{"n":5,"t":"Analyse de vulnérabilités","data":{"concept":{"groups":[{"g":"Fondamentaux de la Vulnerability Analysis","items":[{"name":"Vulnerability Assessment","desc":"Une vulnerability assessment est une démarche visant à identifier les faiblesses de sécurité présentes dans les réseaux, l’infrastructure de communication et les systèmes d’une organisation. Elle cherche à repérer les défauts avant qu’ils ne soient exploités, puis à fournir les informations nécessaires pour les analyser et les corriger. Elle ne se limite donc pas à lancer un scanner : elle comprend aussi le contexte, l’analyse des résultats, la priorisation et le suivi des corrections.","flow":"Identifier les actifs → rechercher les faiblesses → analyser leur importance → corriger → vérifier → surveiller","exam":"Vulnerability Assessment = identifier et analyser des faiblesses. Le module la place en Phase 2 du processus de hacking."},{"name":"Ce qu’un scan de vulnérabilités peut trouver","desc":"Un scanner de vulnérabilités recherche des problèmes connus ou observables sur les systèmes et les applications. Il peut notamment détecter des mots de passe faibles, des permissions trop larges, des services installés par défaut, des mauvaises configurations, des logiciels EOL/EOS, des correctifs manquants, des ports risqués ou encore des équipements oubliés dans l’inventaire.","cheat":[{"words":1,"title":"Exemples importants","rows":[["Comptes","mots de passe faibles ou configuration de comptes risquée"],["Fichiers / dossiers","permissions trop permissives"],["Logiciels","services inutiles, versions vulnérables, EOL/EOS, patches manquants"],["Réseau","ports/services exposés ou configurations faibles"],["Inventaire","actifs présents mais absents de l’inventaire officiel"]]}]},{"name":"Vulnérabilité ≠ exploitabilité automatique","desc":"La présence d’une vulnérabilité identifiée par un outil ne signifie pas automatiquement qu’elle est exploitable dans le contexte réel. Un scanner travaille à partir de signatures, de versions, de configurations et de règles ; ses résultats doivent donc être analysés et, pour les éléments importants, confirmés avant d’être présentés comme des findings définitifs.","exam":"Un scanner peut produire des faux positifs et des faux négatifs. Les résultats importants doivent être validés."},{"name":"5 grandes classes de vulnérabilités","desc":"Le module regroupe les vulnérabilités en cinq familles principales. Cette classification aide à comprendre l’origine d’une faiblesse : configuration, code applicatif, absence de correctif, défaut de conception ou dépendance à un tiers.","cheat":[{"words":1,"title":"Classification","rows":[["Misconfigurations / Weak Configurations","paramètres dangereux : services inutiles, ports ouverts, chiffrement faible, permissions incorrectes"],["Application Flaws","défauts du logiciel : buffer overflow, memory leak, integer overflow, race condition, mauvais input handling…"],["Poor Patch Management","OS, firmware ou applications non corrigés"],["Design Flaws","faiblesse logique dans la conception, par exemple validation insuffisante ou mauvais usage du chiffrement"],["Third-Party Risks","risque introduit par fournisseurs, sous-traitants, cloud, stockage ou chaîne d’approvisionnement"]]}],"exam":"Savoir rattacher un scénario à sa famille de vulnérabilité."},{"name":"Misconfiguration / Weak Configuration","desc":"Une mauvaise configuration transforme un système ou une application légitime en point d’entrée. Exemples cités : protocoles non sécurisés, ports/services inutilement exposés, erreurs de configuration, chiffrement faible, permissions ouvertes ou compte root insuffisamment protégé. Ici, le problème n’est pas forcément un bug du produit : c’est la manière dont il a été déployé ou administré."},{"name":"Application Flaws","desc":"Les failles applicatives sont des défauts dans le fonctionnement du logiciel. Le module cite notamment buffer overflow, memory leak, resource exhaustion, integer overflow, null pointer/object dereference, DLL injection, race condition, erreurs de validation des entrées, gestion d’erreurs insuffisante et faiblesse de code signing. Selon le défaut, l’impact peut aller du crash à l’exécution de code ou à l’altération de données."},{"name":"Poor Patch Management","desc":"Les éditeurs publient des correctifs pour supprimer des vulnérabilités connues. Un serveur, un firmware, un système d’exploitation ou une application qui n’est pas maintenu à jour reste exposé à des failles pour lesquelles une correction existe déjà. La gestion des vulnérabilités doit donc être reliée au processus de patch management."},{"name":"Design Flaws","desc":"Un design flaw est une faiblesse logique introduite dès la conception du système. Le produit peut être parfaitement installé et à jour tout en restant vulnérable parce que le mécanisme lui-même a été mal pensé, par exemple avec un chiffrement inadapté ou une validation des données insuffisante."},{"name":"Third-Party Risks","desc":"Une organisation peut être exposée par des prestataires ou composants externes disposant d’accès privilégiés ou manipulant ses données. Le module cite la gestion fournisseur, les risques supply-chain, le développement externalisé, le stockage de données et les différences de responsabilité entre cloud et on-premises. Une faiblesse chez le tiers peut donc devenir une faiblesse de l’organisation."}]},{"g":"Failles applicatives & catégories particulières","items":[{"name":"Memory Leak","desc":"Une memory leak apparaît lorsqu’un programme réserve de la mémoire mais ne la libère pas correctement. Au fil du temps, les ressources disponibles diminuent jusqu’à provoquer instabilité ou déni de service. Le module indique également qu’une mauvaise gestion mémoire peut contribuer à des scénarios d’injection de code ou de détournement du flux de contrôle.","exam":"Valgrind est l’outil cité pour rechercher les memory leaks sous Unix/Linux."},{"name":"Resource Exhaustion","desc":"Le resource exhaustion consiste à consommer les ressources limitées d’un système — mémoire, CPU, connexions ou autres capacités — jusqu’à dégrader fortement son fonctionnement ou le faire tomber. Le module le rapproche d’un scénario de Denial of Service : la ressource n’est plus disponible pour les utilisateurs légitimes."},{"name":"Integer Overflow","desc":"Un integer overflow se produit lorsqu’une opération arithmétique produit une valeur trop grande pour l’espace réservé au type numérique. Le résultat peut être tronqué ou se comporter de manière inattendue. Cette erreur peut ensuite perturber les calculs de taille et contribuer à d’autres vulnérabilités, notamment des buffer overflows ou de l’exécution de code."},{"name":"Null Pointer / Object Dereference","desc":"Un null pointer ou object dereference survient lorsqu’un programme tente d’utiliser une référence qui ne pointe vers aucun objet valide. Déclenché volontairement, ce comportement peut faire planter l’application, contourner une logique de sécurité ou provoquer l’affichage d’informations de debug utiles à un attaquant."},{"name":"Zero-Day Vulnerability","desc":"Une zero-day est une vulnérabilité pour laquelle aucune correction exploitable par les défenseurs n’est encore disponible au moment considéré. Elle peut être inconnue de l’éditeur ou nouvellement divulguée et exploitée avant la publication d’un correctif. Le terme décrit donc surtout l’état de connaissance et de correction, pas automatiquement son niveau CVSS."},{"name":"Legacy Platform Vulnerabilities","desc":"Les plateformes anciennes ou non supportées continuent souvent à exécuter du code vulnérable sans recevoir de correctifs. Cela concerne aussi bien OS, bases de données, firewalls, IDS, smartphones ou IoT. Plus un actif reste en production après sa fin de support, plus sa maintenance et sa sécurisation deviennent difficiles."},{"name":"System Sprawl / Undocumented Assets","desc":"Le system sprawl apparaît lorsque les systèmes, serveurs et connexions se multiplient sans inventaire ni documentation suffisante. Ces actifs oubliés sont plus difficiles à maintenir, scanner et patcher. Ils peuvent rester exposés longtemps parce que personne ne sait clairement qu’ils existent ou qui en est responsable."},{"name":"Improper Certificate & Key Management","desc":"Des clés cryptographiques ou certificats mal stockés et mal gérés peuvent faciliter le vol de secrets, l’usurpation ou l’exfiltration de données. Le module insiste sur la protection des clés : elles doivent être stockées de manière chiffrée et dans un environnement protégé."},{"name":"Weak / Default Passwords","desc":"Les mots de passe faibles ou laissés à leur valeur par défaut restent une vulnérabilité fréquente. Ils peuvent être recherchés par brute force ou attaque par dictionnaire et permettent parfois d’obtenir un accès sans exploiter de faille logicielle complexe.","xref":[6]}]},{"g":"CVSS & référentiels de vulnérabilités","items":[{"name":"CVSS — Common Vulnerability Scoring System","desc":"CVSS est un cadre ouvert destiné à communiquer la sévérité technique d’une vulnérabilité de manière standardisée. Il produit un score de 0 à 10 et un vector string décrivant les métriques utilisées. Le score aide notamment à comparer les vulnérabilités et à prioriser les activités de remédiation.","flow":"Métriques CVSS → vector string → score 0–10 → niveau de sévérité","exam":"CVSS sert à mesurer et communiquer la sévérité d’une vulnérabilité."},{"name":"CVSS v4 — 4 groupes de métriques","desc":"CVSS v4 organise ses métriques en quatre groupes. Les Base Metrics décrivent les caractéristiques intrinsèques de la vulnérabilité ; les Threat Metrics ajoutent le contexte de menace ; les Environmental Metrics adaptent le score à l’environnement de l’organisation ; les Supplemental Metrics fournissent du contexte supplémentaire.","cheat":[{"words":1,"title":"Groupes","rows":[["Base","exploitability + impact ; caractéristiques intrinsèques"],["Threat","Exploit Maturity ; peut évoluer dans le temps"],["Environmental","métriques modifiées + exigences CIA propres au contexte"],["Supplemental","Automatable, Recovery, Safety, Value Density, Vulnerability Response Effort, Provider Urgency"]]}],"exam":"CVSS v4 = Base, Threat, Environmental, Supplemental."},{"name":"CVSS v4 — Base Exploitability Metrics","desc":"La partie exploitability des Base Metrics décrit les conditions nécessaires pour réussir l’exploitation. Elle utilise Attack Vector, Attack Complexity, Attack Requirements, Privileges Required et User Interaction. Ensemble, ces métriques indiquent d’où l’attaque doit être menée et quelles contraintes ou interactions sont nécessaires.","cheat":[{"words":1,"title":"Exploitability","rows":[["AV — Attack Vector","où l’attaquant doit se situer pour exploiter"],["AC — Attack Complexity","complexité technique supplémentaire"],["AT — Attack Requirements","conditions préalables particulières"],["PR — Privileges Required","privilèges nécessaires avant l’exploitation"],["UI — User Interaction","interaction d’un utilisateur nécessaire ou non"]]}]},{"name":"CVSS v4 — Base Impact Metrics","desc":"Les métriques d’impact décrivent ce que l’exploitation réussie peut compromettre. CVSS v4 distingue l’impact sur le système vulnérable — Confidentiality, Integrity, Availability — et l’impact éventuel sur un système ultérieur affecté par la compromission.","cheat":[{"words":1,"title":"Impact","rows":[["VC / VI / VA","Vulnerable System Confidentiality / Integrity / Availability"],["SC / SI / SA","Subsequent System Confidentiality / Integrity / Availability"]]}]},{"name":"CVSS Vector String","desc":"Le vector string est la représentation textuelle des métriques choisies. Il permet de comprendre comment le score a été obtenu, au lieu de ne conserver qu’un nombre final.","syntax":"CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H","exam":"Le module donne cet exemple avec un score de 9.4 / Critical."},{"name":"CVSS — plages de sévérité","desc":"Le score numérique CVSS est converti en catégories de sévérité. Ces bornes sont à mémoriser car elles permettent de reconnaître immédiatement la catégorie correspondant à un score.","cheat":[{"words":1,"title":"Score → sévérité","rows":[["0.0","None"],["0.1 – 3.9","Low"],["4.0 – 6.9","Medium"],["7.0 – 8.9","High"],["9.0 – 10.0","Critical"]]}],"exam":"Critical = 9.0–10.0 ; High = 7.0–8.9."},{"name":"CVE — Common Vulnerabilities and Exposures","desc":"CVE fournit des identifiants standardisés permettant à différents outils et bases de parler de la même vulnérabilité avec le même nom. Chaque entrée possède un CVE ID et une description standardisée. Les identifiants sont attribués par des CNA — CVE Numbering Authorities.","cheat":[{"words":1,"title":"À retenir","rows":[["Nature","liste / dictionnaire public d’identifiants"],["But","normaliser le nom d’une vulnérabilité entre outils et bases"],["Attribution","CNA — CVE Numbering Authorities"]]}],"exam":"Piège CEH : CVE est présenté comme un dictionnaire/liste d’identifiants, pas comme la base analytique enrichie."},{"name":"NVD — National Vulnerability Database","desc":"NVD est le référentiel gouvernemental américain de données de vulnerability management. Il analyse et enrichit les CVE publiées et associe notamment des informations CVSS, CWE et CPE. Il utilise SCAP pour structurer et automatiser l’échange de contenu de sécurité.","cheat":[{"words":1,"title":"Relation","rows":[["CVE","identifiant standardisé de la vulnérabilité"],["NVD","analyse/enrichit les CVE"],["CVSS","sévérité"],["CWE","type de faiblesse"],["CPE","plateformes/produits concernés"]]}],"exam":"NVD ne réalise pas elle-même des tests de vulnérabilité ; elle s’appuie sur les informations publiées par éditeurs, chercheurs et coordinateurs."},{"name":"CWE — Common Weakness Enumeration","desc":"CWE classe les catégories de faiblesses logicielles. Contrairement à un CVE qui désigne une vulnérabilité précise dans un produit précis, un CWE décrit le type de faiblesse à l’origine de nombreuses vulnérabilités différentes.","exam":"CVE = occurrence/identifiant d’une vulnérabilité ; CWE = catégorie de faiblesse. Le module mentionne plus de 600 catégories CWE."},{"name":"CPE & SCAP","desc":"CPE — Common Platform Enumeration — sert à représenter les plateformes ou produits auxquels une vulnérabilité peut s’appliquer. SCAP — Security Content Automation Protocol — regroupe des mécanismes utilisés pour automatiser et standardiser le contenu de sécurité ; le module indique que NVD l’utilise.","exam":"NVD associe notamment CVSS, CWE et CPE aux CVE."}]},{"g":"Vulnerability Management Lifecycle","items":[{"name":"Lifecycle — vue d’ensemble","desc":"Le vulnerability management est un cycle continu en huit étapes. Il commence par connaître les actifs et établir une baseline, poursuit avec le scan et l’analyse, puis traite le risque par remédiation, vérification et monitoring. Une fois le monitoring en place, le cycle recommence avec de nouvelles données et de nouvelles vulnérabilités.","flow":"1 Identify Assets → 2 Create Baseline → 3 Vulnerability Scan → 4 Vulnerability Analysis → 5 Risk Assessment → 6 Remediation → 7 Verification → 8 Monitoring → repeat","exam":"Après Remediation viennent Verification puis Monitoring."},{"name":"1. Identify Assets","desc":"La première étape consiste à identifier les actifs à protéger et leur rôle dans les processus métier. Sans inventaire fiable, il est impossible de savoir si toute l’infrastructure est couverte par les scans ou de prioriser correctement les résultats."},{"name":"2. Create a Baseline","desc":"Créer une baseline signifie documenter ce qui est normalement attendu : processus métier, applications, données, services, logiciels approuvés, drivers, configurations, actifs, architecture réseau, contrôles existants, politiques et périmètre. Cette référence permet ensuite de détecter les écarts et d’organiser l’évaluation.","cheat":[{"words":1,"title":"Baseline","rows":[["Business","processus et criticité"],["Technology","applications, données, services, logiciels, drivers"],["Assets","inventaire et priorisation"],["Architecture","cartographie réseau et contrôles"],["Governance","scope, politiques et procédures de protection"]]}]},{"name":"3. Vulnerability Scan","desc":"Le scan de vulnérabilités utilise des outils automatisés pour rechercher des faiblesses connues sur les actifs inclus dans le périmètre. Cette étape produit des résultats bruts qui doivent encore être analysés."},{"name":"4. Vulnerability Analysis","desc":"L’analyse transforme les résultats bruts du scanner en informations exploitables. On détermine si la vulnérabilité est réellement applicable, son impact potentiel et sa pertinence dans le contexte de l’organisation."},{"name":"5. Risk Assessment","desc":"Le risk assessment caractérise et classe les risques associés aux vulnérabilités. L’équipe évalue notamment la criticité, l’impact et le niveau de risque afin de décider ce qui doit être traité en priorité."},{"name":"6. Remediation","desc":"La remédiation applique les corrections destinées à réduire l’impact ou la sévérité : patches, changements de configuration et autres fixes. Le module demande une approche SMART — Specific, Measurable, Attainable, Relevant, Time-bound — ainsi qu’un plan d’action, une root-cause analysis et un traitement des exceptions/risk acceptance.","cheat":[{"words":1,"title":"Actions","rows":[["Prioritize","ordonner selon le risque"],["Action plan","planifier les corrections"],["Root cause","comprendre la cause profonde"],["Fix","patches et changements"],["Exception","documenter l’acceptation du risque si non corrigeable"],["Learning","retour d’expérience et sensibilisation"]]}]},{"name":"7. Verification","desc":"Après correction, l’équipe ne suppose pas que le problème est résolu : elle vérifie. Cela passe notamment par un rescan, une analyse dynamique si nécessaire et une nouvelle revue de l’attack surface pour confirmer que le correctif est efficace."},{"name":"8. Monitoring","desc":"Le monitoring maintient le programme dans le temps. De nouvelles vulnérabilités apparaissent, l’environnement change et des actifs peuvent être ajoutés. Le module cite les scans périodiques ainsi que IDS/IPS, SIEM et firewalls pour suivre les menaces et détecter de nouvelles expositions."}]},{"g":"Scanning — méthodes & profondeur","items":[{"name":"Active vs Passive Vulnerability Scanning","desc":"Un scan actif interagit directement avec la cible en envoyant des probes ou requêtes conçues pour détecter une faiblesse. Un scan passif évite cette interaction et observe plutôt les communications normales pour inférer versions d’OS, applications, services ou vulnérabilités potentielles.","cheat":[{"words":1,"title":"Différence","rows":[["Active","trafic volontaire vers la cible ; simule davantage une attaque"],["Passive","observation des communications existantes ; pas de requête directe à la cible"]]}],"exam":"Passive scanning n’est pas synonyme de non-credentialed scanning : ce sont deux classifications différentes."},{"name":"9 types de Vulnerability Scanning","desc":"Le module décrit neuf types de scans qui correspondent à plusieurs axes de comparaison : position du scanner, niveau technique visé, présence ou non de credentials et degré d’automatisation.","cheat":[{"words":1,"title":"Les 9 types","rows":[["1","External"],["2","Internal"],["3","Host-based"],["4","Network-based"],["5","Application"],["6","Credentialed"],["7","Non-Credentialed"],["8","Manual"],["9","Automated"]]}],"exam":"Credentialed = le scanner se connecte avec des identifiants valides."},{"name":"External Scanning","desc":"L’external scanning observe l’organisation depuis l’extérieur, comme un attaquant Internet. Il cherche les services exposés, ports ouverts, niveaux de patch, informations DNS, protections périmétriques et vulnérabilités des applications accessibles publiquement."},{"name":"Internal Scanning","desc":"L’internal scanning part du réseau interne. Il cherche les services et faiblesses accessibles après franchissement du périmètre : vulnérabilités OS/serveur, patch levels, malware, partages NFS/SMB, configurations des équipements et efficacité des protections internes."},{"name":"Host-Based Scanning","desc":"Le host-based scanning examine en profondeur un système particulier et sa configuration locale. Il peut contrôler les tables de configuration natives, utilisateurs, permissions de fichiers, registry settings et erreurs de configuration logicielle."},{"name":"Network-Based Scanning","desc":"Le network-based scanning observe ce qui est accessible à travers le réseau. Il identifie ports ouverts, services exposés et vulnérabilités associées afin de déterminer les points d’entrée et chemins d’attaque possibles."},{"name":"Application Scanning","desc":"L’application scanning se concentre sur les éléments d’une infrastructure applicative, en particulier web : mauvaises configurations, composants obsolètes et vulnérabilités connues. Il complète les scans réseau qui ne comprennent pas toujours la logique de l’application."},{"name":"Credentialed Scanning","desc":"Dans un scan credentialed/authenticated, le scanner reçoit des identifiants valides et se connecte au système. Il peut alors inspecter des informations locales invisibles depuis le réseau et produire une vue plus complète des patches, configurations et logiciels installés.","exam":"Credentialed = plus de profondeur grâce à une authentification valide."},{"name":"Non-Credentialed Scanning","desc":"Un scan non-credentialed n’utilise aucun compte valide sur la cible. Il se limite à ce qu’un acteur sans accès authentifié peut observer et sert donc à représenter la surface visible depuis l’extérieur ou depuis un point réseau non privilégié."},{"name":"Manual Scanning","desc":"Le manual scanning repose sur l’analyse humaine : revue de code, vérification de configuration, validation d’un finding ou tests ciblés. Il permet de détecter des erreurs de logique et des faiblesses difficiles à reconnaître avec une signature automatique."},{"name":"Automated Scanning","desc":"L’automated scanning utilise des outils comme Nessus, Qualys ou GFI LanGuard pour exécuter systématiquement un grand nombre de contrôles à partir de règles et bases de vulnérabilités. Il apporte rapidité et répétabilité, mais ses résultats doivent rester analysés."},{"name":"Limites d’un Vulnerability Scanner","desc":"Un scanner fournit une photographie à un instant donné et dépend de la qualité de ses plugins, signatures et mises à jour. Il peut manquer une vulnérabilité ou signaler un problème inexistant. Le module souligne aussi qu’un scanner ne mesure pas à lui seul la solidité globale des contrôles de sécurité.","cheat":[{"words":1,"title":"Limites","rows":[["Point-in-time","résultat valable pour l’état observé au moment du scan"],["Updates","doit connaître les nouvelles vulnérabilités"],["Maintenance","efficacité dépend du suivi éditeur/admin"],["Controls","ne mesure pas directement la force de tous les contrôles de sécurité"]]}]}]},{"g":"Approches VA & choix d’une solution","items":[{"name":"Product-Based Solution","desc":"Une solution product-based est installée dans le réseau de l’organisation. Elle peut scanner des actifs privés/non routables ou exposés à Internet. Sa position influence toutefois ce qu’elle voit : placée derrière un firewall, elle ne reproduit pas forcément la perspective d’un attaquant externe."},{"name":"Service-Based Solution","desc":"Une solution service-based est fournie par un tiers, par exemple une société d’audit ou de conseil. Le service peut être hébergé à l’intérieur ou à l’extérieur de l’environnement selon l’objectif du scan."},{"name":"Tree-Based Assessment","desc":"Dans une approche tree-based, l’auditeur choisit une stratégie ou un scanner différent selon le type de machine ou de composant. Le choix dépend fortement des informations de départ fournies par l’administrateur et les tests ne sont pas nécessairement adaptés dynamiquement aux nouvelles informations découvertes."},{"name":"Inference-Based Assessment","desc":"L’inference-based assessment commence par inventorier les protocoles et services présents sur une machine. La solution déduit ensuite quels tests sont pertinents pour cet actif et n’exécute que les contrôles correspondants. Cela évite de lancer inutilement tous les tests contre toutes les machines.","flow":"Identifier protocoles → associer ports/services → sélectionner les vulnérabilités pertinentes → exécuter les tests adaptés","exam":"Inference-based = découvrir d’abord l’environnement, puis choisir les tests pertinents."},{"name":"Caractéristiques d’une bonne solution VA","desc":"Une bonne solution de vulnerability assessment doit couvrir différents types d’actifs, fournir des résultats précis, maintenir ses bases à jour et proposer des rapports exploitables. Elle doit également limiter les faux positifs/faux négatifs, supporter plusieurs réseaux, proposer des remédiations et s’intégrer aux processus d’automatisation de sécurité.","cheat":[{"words":1,"title":"Qualités","rows":[["Coverage","réseaux, serveurs, endpoints, web apps, cloud"],["Accuracy","tests corrects et peu de false positives/negatives"],["Freshness","base mise à jour fréquemment"],["Reporting","rapports courts, personnalisables, actionnables, avec tendances"],["Remediation","recommandations / workarounds"],["Automation","scheduling et intégration aux outils d’orchestration"]]}]},{"name":"Critères de choix d’un outil VA","desc":"Le choix d’un scanner ne doit pas reposer uniquement sur le nombre de signatures. Le module demande d’évaluer la couverture des vulnérabilités, la capacité à scanner tous les systèmes prévus, la qualité des rapports, les performances, la possibilité d’écrire ses propres tests, le scheduling, le throttling et la capacité à traiter des systèmes fragiles ou atypiques.","cheat":[{"words":1,"title":"Critères","rows":[["Coverage","types de vulnérabilités et actifs supportés"],["Completeness","tous les systèmes sélectionnés réellement testés"],["Reports","clairs, précis, avec guidance de mitigation"],["Efficiency","temps et ressources consommées par hôte"],["Custom tests","écrire un test lorsqu’aucune signature n’existe"],["Scheduling","scanner aux heures adaptées"],["Throttling","contrôler l’intensité / éviter de perturber les cibles"],["Fragile assets","adapter le niveau de test aux systèmes sensibles"]]}]}]},{"g":"Vulnerability Research & Reporting","items":[{"name":"Vulnerability Research","desc":"La vulnerability research consiste à utiliser des ressources, outils et plateformes pour découvrir, analyser et partager des informations sur les vulnérabilités. Elle aide les administrateurs et ethical hackers à suivre les nouvelles failles, tendances d’attaque, correctifs et techniques afin d’anticiper le risque et de prioriser les patches."},{"name":"Vulnerability Research — activités","desc":"Le module cite plusieurs activités : rechercher des défauts de conception, suivre les nouveaux produits et technologies, lire les nouvelles liées aux exploits, consulter les alertes de sécurité, surveiller des sources deep/dark web et anticiper les nouveaux attack vectors. La finalité est de renforcer les défenses et d’adapter les contrôles au profil de risque de l’organisation."},{"name":"Classification de la recherche","desc":"Les vulnérabilités recherchées peuvent être classées selon leur niveau de sévérité — low, medium, high dans cette partie du module — et selon leur portée d’exploitation, locale ou distante. Ces axes aident à organiser l’analyse et la priorité de traitement."},{"name":"Vulnerability Assessment Report","desc":"Le rapport transforme les résultats techniques de l’évaluation en plan d’action. Il doit permettre aux parties prenantes de comprendre quelles faiblesses ont été trouvées, quels systèmes sont affectés, quel est l’impact attendu, quelle est la sévérité et comment corriger le problème."},{"name":"Finding — informations à inclure","desc":"Pour chaque vulnérabilité, le module demande notamment le nom, le CVE associé, la date de découverte, un score issu des référentiels de vulnérabilités, une description détaillée, l’impact, les systèmes concernés, le processus de correction et, lorsque possible, une Proof of Concept.","cheat":[{"words":1,"title":"Finding","rows":[["Identification","nom + CVE ID + date"],["Severity","score / niveau"],["Technical","description détaillée"],["Impact","conséquences potentielles"],["Scope","systèmes affectés"],["Remediation","patch, configuration, ports à bloquer…"],["Evidence","PoC si possible"]]}]},{"name":"Security Vulnerability Report vs Summary","desc":"Le Security Vulnerability Report est une vue combinée de l’ensemble des équipements ou serveurs scannés. Il synthétise les nouvelles vulnérabilités, ports/services et corrections proposées. Le Security Vulnerability Summary est produit par équipement ou serveur et montre son état de sécurité, les catégories de failles, les nouvelles détections et les vulnérabilités résolues.","exam":"Report = vue combinée de tous les systèmes ; Summary = vue par système/serveur."},{"name":"Structure d’un rapport VA","desc":"Un rapport complet doit servir à la fois au management et aux équipes techniques. Il commence par une synthèse et le périmètre, détaille ensuite les findings et le risque, puis fournit les recommandations, annexes, conclusion et actions de suivi.","cheat":[{"words":1,"title":"Sections","rows":[["Executive Summary","scope, objectifs, contexte de test et synthèse des findings"],["Assessment Overview","vue générale de l’évaluation"],["Findings","détail des vulnérabilités"],["Risk Assessment","classification et impact"],["Recommendations","root cause, patches/fixes, lessons learned, awareness, contrôles"],["Appendices","logs, configurations, références"],["Conclusion","messages clés"],["Follow-Up","timeline, re-assessment et suivi de remédiation"],["Glossary","définitions pour les lecteurs non techniques"]]}]}]}]},"outil":{"groups":[{"g":"Scanners réseau / hôtes","items":[{"name":"Nessus Essentials","desc":"Nessus Essentials est cité comme solution d’évaluation permettant d’identifier vulnérabilités, erreurs de configuration et certaines traces de malware exploitables pour pénétrer un réseau. Il appartient à la famille des scanners automatisés utilisés pour des évaluations réseau et hôte.","cheat":[{"words":1,"title":"Rôle","rows":[["Type","scanner automatisé de vulnérabilités"],["Cherche","vulnérabilités, configuration issues, malware"],["Usage","network/host vulnerability assessment"]]}]},{"name":"OpenVAS","desc":"OpenVAS est un framework composé de plusieurs services et outils pour le vulnerability scanning et le vulnerability management. Il sert à automatiser l’identification de faiblesses sur des systèmes et réseaux, puis à exploiter les résultats dans un processus de gestion des vulnérabilités.","cheat":[{"words":1,"title":"Rôle","rows":[["Type","framework de vulnerability assessment"],["Fonction","scanning + vulnerability management"],["Positionnement","solution automatisée réseau/hôte"]]}]},{"name":"Qualys","desc":"Qualys est présenté comme une solution automatisée de vulnerability scanning. Il permet d’exécuter des évaluations à grande échelle afin de détecter et suivre les vulnérabilités sur les actifs couverts par la plateforme.","cheat":[{"words":1,"title":"Rôle","rows":[["Type","solution automatisée"],["Usage","vulnerability scanning / assessment"]]}]},{"name":"GFI LanGuard","desc":"GFI LanGuard scanne les systèmes et équipements du réseau pour détecter et évaluer les vulnérabilités. Le module souligne également sa capacité à participer à la correction des problèmes détectés, ce qui le rapproche d’un outil de gestion de vulnérabilités plutôt que d’un simple moteur de détection.","cheat":[{"words":1,"title":"Rôle","rows":[["Scan","détecte les faiblesses"],["Assess","évalue les vulnérabilités"],["Rectify","peut aider à corriger/remédier"]]}]}]},{"g":"Web & analyse ciblée","items":[{"name":"Nikto","desc":"Nikto est un outil d’évaluation de serveurs web. Il examine le serveur à la recherche de problèmes de sécurité et vulnérabilités potentielles. Dans le module, il est classé comme outil spécialisé web server assessment plutôt que comme scanner généraliste de tout le réseau.","exam":"Nikto = web server vulnerability assessment."},{"name":"Skipfish","desc":"Skipfish est un scanner automatisé d’applications web. L’exemple du module écrit le rapport dans un répertoire avec -o puis scanne l’URL fournie. Les résultats peuvent inclure des vecteurs d’injection, XSS, formulaires sans protection XSRF, formulaires de mot de passe exposés au brute force ou fichiers/répertoires cachés.","syntax":"skipfish -o /tmp/skipfish_output http://testphp.vulnweb.com","cheat":[{"words":1,"title":"Option montrée","rows":[["-o <directory>","répertoire de sortie du rapport"]]}],"exam":"Dans le module, Skipfish est l’exemple de web application scanning assisté par IA."},{"name":"Valgrind","desc":"Valgrind est cité pour analyser les erreurs de gestion mémoire sous Unix/Linux, notamment les memory leaks. Il sert donc ici à investiguer une catégorie de vulnérabilité applicative précise plutôt qu’à scanner un réseau complet.","exam":"Valgrind = memory leak detection sous Unix/Linux."}]},{"g":"Recherche & référentiels","items":[{"name":"MSRC — Microsoft Security Response Center","desc":"MSRC est la ressource Microsoft chargée d’enquêter sur les signalements de vulnérabilités touchant les produits et services Microsoft. Dans un workflow de vulnerability research, il sert à suivre les informations publiées par l’éditeur et les réponses associées."},{"name":"CVE / NVD / CWE / CPE","desc":"Ces référentiels ne remplacent pas un scanner mais donnent le langage commun nécessaire pour interpréter ses résultats : CVE identifie une vulnérabilité, NVD enrichit les données, CWE décrit la catégorie de faiblesse et CPE représente les plateformes concernées.","flow":"Finding → CVE → NVD enrichment → CVSS / CWE / CPE"}]}]},"port":{"groups":[{"g":"Principe","items":[{"name":"Pas de port unique pour la Vulnerability Analysis","desc":"La vulnerability analysis n’est pas attachée à un service réseau unique. Un scanner interroge les ports et protocoles correspondant aux services réellement présents sur la cible — web, SMB, SSH, bases de données, etc. Le choix des ports dépend donc du périmètre et des actifs à évaluer.","exam":"Ne cherche pas un ‘port du vulnerability scanning’ : le scanner teste les services exposés par la cible."},{"name":"Port coverage","desc":"Limiter un scan à quelques ports accélère l’évaluation mais peut masquer des services accessibles sur des ports moins courants. Une évaluation complète doit donc définir explicitement quels ports, protocoles et actifs sont couverts afin que les résultats soient interprétés avec le bon périmètre."}]}]},"contre":{"groups":[{"g":"Préparer & réduire l’exposition","items":[{"name":"Asset Inventory","desc":"Maintenir un inventaire complet des systèmes, applications, données et services est la base du vulnerability management. Un actif inconnu ou non documenté peut rester hors des scans et accumuler des vulnérabilités sans être traité."},{"name":"Baseline & Scope","desc":"La baseline décrit l’état attendu des systèmes et le scope définit ce qui doit être évalué. Ensemble, ils permettent de repérer les écarts, d’éviter les zones oubliées et de comparer les résultats entre plusieurs campagnes de scans."},{"name":"Patch Management","desc":"Appliquer les correctifs aux OS, firmware, applications et composants tiers réduit l’exposition aux vulnérabilités connues. Les produits EOL/EOS qui ne reçoivent plus de correctifs doivent être identifiés afin de planifier leur remplacement ou leur traitement compensatoire."},{"name":"Secure Configuration","desc":"Réduire les mauvaises configurations fait partie de la prévention : désactiver les services inutiles, corriger les permissions excessives, supprimer les réglages par défaut et utiliser des configurations de sécurité adaptées limite le nombre de findings et l’attack surface."}]},{"g":"Prioriser, corriger, vérifier","items":[{"name":"Risk-Based Remediation","desc":"La remédiation doit être priorisée à partir du risque et non uniquement du nombre de vulnérabilités. Le module demande de classer les risques, d’évaluer l’impact puis de développer un plan d’action pour les corrections les plus importantes."},{"name":"Root-Cause Analysis","desc":"Corriger uniquement le symptôme peut laisser le même type de faiblesse réapparaître. La root-cause analysis cherche pourquoi la vulnérabilité a été introduite — processus, configuration, patching ou conception — afin que la remédiation soit durable."},{"name":"Exception Handling / Risk Acceptance","desc":"Certaines vulnérabilités ne peuvent pas être corrigées immédiatement. Le module prévoit alors un processus d’exception ou de risk acceptance : le risque reste identifié, documenté et accepté plutôt que simplement ignoré."},{"name":"Verification / Rescanning","desc":"Après correction, un rescan vérifie que le finding a réellement disparu. La vérification peut être complétée par une analyse dynamique et une revue de l’attack surface. Fermer un ticket sans contrôle de l’efficacité du correctif laisse un risque de fausse remédiation."},{"name":"Continuous Monitoring","desc":"Le vulnerability management est continu : scans périodiques, suivi des nouvelles vulnérabilités et monitoring via IDS/IPS, SIEM et firewalls permettent de détecter les changements entre deux campagnes et de relancer le cycle de traitement."}]},{"g":"Qualité des résultats","items":[{"name":"Maintenir les scanners à jour","desc":"Un scanner ne peut détecter correctement que les vulnérabilités qu’il sait reconnaître. Les bases, signatures et règles doivent donc être mises à jour lorsque de nouvelles vulnérabilités sont publiées."},{"name":"Credentialed Scanning quand pertinent","desc":"Fournir des credentials valides permet d’inspecter l’état interne d’un système et d’obtenir une analyse plus approfondie que la seule observation réseau. Cette approche est particulièrement utile pour vérifier les patches, logiciels et configurations locales."},{"name":"Validation manuelle des findings","desc":"Les résultats critiques ou importants doivent être analysés par un humain avant d’être présentés. Cette validation réduit les false positives, vérifie l’applicabilité réelle de la vulnérabilité et améliore la qualité du rapport final."}]}]}}},{"n":6,"t":"System Hacking","data":{"concept":{"groups":[{"g":"Gaining Access — authentification & mots de passe","items":[{"name":"SAM Database","desc":"La SAM (Security Accounts Manager) est la base Windows qui conserve les hashes des mots de passe locaux. Le fichier se trouve sous %SystemRoot%\\system32\\config\\SAM et est monté dans le registre sous HKEY_LOCAL_MACHINE\\SAM. Pendant l'exécution de Windows, il est verrouillé par le système, ce qui oblige généralement un attaquant à obtenir des privilèges élevés ou à utiliser des mécanismes de post-exploitation pour extraire les hashes.","cheat":[{"words":1,"title":"À retenir","rows":[["Contenu","hashes LM/NTLM des comptes locaux"],["Emplacement","%SystemRoot%\\system32\\config\\SAM"],["Protection","fichier verrouillé pendant que Windows fonctionne"],["SYSKEY","utilisé historiquement pour protéger partiellement les hashes"]]}],"exam":"Windows local password hashes → SAM. Les credentials en mémoire relèvent plutôt de LSASS/kiwi."},{"name":"NTLM Authentication","desc":"NTLM est un mécanisme challenge-response. Le mot de passe n'est pas envoyé directement au contrôleur de domaine : le client calcule une réponse à partir du secret et d'un challenge fourni par le serveur/DC. Le serveur valide ensuite la réponse attendue. Ce mécanisme explique pourquoi des hashes ou réponses NTLM capturés peuvent être intéressants pour un attaquant sans que le mot de passe en clair ait été transmis.","flow":"Mot de passe → hash côté client → demande de connexion → challenge → réponse calculée → validation côté DC","exam":"NTLM = challenge-response ; Kerberos est le mécanisme par défaut et plus moderne dans Active Directory."},{"name":"Kerberos — vue d'ensemble","desc":"Kerberos est le mécanisme d'authentification par tickets utilisé par Active Directory. Le KDC (Key Distribution Center) contient deux services principaux : l'AS (Authentication Service), qui délivre un TGT après authentification, et le TGS (Ticket Granting Service), qui délivre ensuite un ticket pour un service précis identifié par un SPN. Le client présente enfin ce ticket au service cible.","flow":"AS_REQ → AS_REP/TGT → TGS_REQ (SPN) → TGS_REP/service ticket → AP_REQ vers le service","cheat":[{"words":1,"title":"Objets Kerberos","rows":[["KDC","serveur Kerberos"],["AS","authentifie l'utilisateur et délivre le TGT"],["TGT","ticket permettant ensuite de demander des tickets de service"],["TGS","délivre un ticket pour un service"],["SPN","identifiant du service demandé"]]}],"exam":"AS-REP Roasting et Kerberoasting ciblent deux étapes différentes de Kerberos."},{"name":"4 familles d'attaques de mot de passe","desc":"Le module distingue quatre grandes familles selon la manière dont le secret est obtenu. Une attaque non électronique repose sur l'humain ou l'environnement physique. Une attaque online interagit avec le système ou observe une authentification en cours. Une attaque offline travaille sur des hashes copiés localement, sans générer de nouvelles tentatives contre la cible.","cheat":[{"words":1,"title":"Classification","rows":[["Non-Electronic","shoulder surfing, social engineering, dumpster diving"],["Active Online","dictionary, brute force, spraying, LLMNR poisoning, Kerberos attacks…"],["Passive Online","sniffing, MITM, replay"],["Offline","rainbow tables, cracking distribué après récupération des hashes"]]}],"exam":"Offline = le fichier/hash est déjà récupéré ; le cracking ne touche plus le service d'authentification."},{"name":"Dictionary Attack","desc":"Une dictionary attack essaie des mots ou mots de passe issus d'une liste plutôt que toutes les combinaisons possibles. Elle devient beaucoup plus efficace lorsque la wordlist est adaptée à la cible ou enrichie par des règles de transformation. Elle reste limitée si le mot de passe est réellement aléatoire ou si la phrase secrète n'est pas représentée par les candidats testés."},{"name":"Brute Force","desc":"Le brute force essaie systématiquement les combinaisons possibles jusqu'à trouver un secret compatible. Contrairement au dictionnaire, il ne dépend pas d'une liste de mots connus. Son coût augmente très rapidement avec la longueur du mot de passe et la taille de l'alphabet utilisé ; c'est pour cela que les attaques offline utilisent souvent GPU, parallélisation ou techniques de réduction de l'espace de recherche."},{"name":"Password Spraying","desc":"Le password spraying inverse la logique du brute force classique : au lieu de tester beaucoup de mots de passe sur un seul compte, l'attaquant teste un même mot de passe probable sur de nombreux comptes. Cela permet de rester sous certains seuils de verrouillage tout en cherchant des utilisateurs ayant choisi un secret courant.","flow":"1 mot de passe fréquent → compte A → compte B → compte C → pause/rotation → nouveau mot de passe","cheat":[{"words":1,"title":"Services cités","rows":[["FTP","21/TCP"],["SSH","22/TCP"],["Telnet","23/TCP"],["Kerberos","88/TCP"],["SMB","445/TCP"],["MSSQL","1433/TCP"]]}],"exam":"Spraying = un password contre beaucoup de comptes ; brute force classique = beaucoup de passwords contre un compte."},{"name":"LLMNR / NBT-NS Poisoning","desc":"Lorsqu'une machine Windows n'arrive pas à résoudre un nom normalement, elle peut diffuser une requête LLMNR ou NBT-NS sur le réseau local. Un attaquant présent sur le même réseau peut répondre à la place du système recherché et inciter la victime à lui envoyer une authentification NTLMv2-SSP. Responder automatise ce mécanisme et capture les réponses, qui peuvent ensuite être analysées ou crackées offline.","flow":"Résolution DNS échoue → broadcast LLMNR/NBT-NS → faux serveur répond → victime s'authentifie → réponse NTLMv2 capturée","exam":"Défense clé : désactiver LLMNR/NBT-NS lorsque possible."},{"name":"AS-REP Roasting","desc":"AS-REP Roasting cible les comptes Kerberos configurés avec l'option permettant de ne pas exiger de pré-authentification. L'attaquant peut demander une réponse AS-REP pour ce compte, récupérer une partie chiffrée avec une clé dérivée du mot de passe de l'utilisateur, puis tenter de retrouver ce mot de passe offline.","cheat":[{"words":1,"title":"À retenir","rows":[["Cible","compte sans Kerberos pre-authentication"],["Objet récupéré","AS-REP"],["Cracking","offline"],["Droit préalable","pas nécessairement un compte service/SPN"]]}],"exam":"AS-REP Roasting ≠ Kerberoasting : absence de pré-auth vs service account/SPN."},{"name":"Kerberoasting","desc":"Kerberoasting cible les comptes de service associés à des SPN. Un utilisateur du domaine peut demander un ticket de service (TGS) pour un SPN. Le ticket contient une partie protégée avec une clé dérivée du mot de passe du compte de service ; elle peut être récupérée puis attaquée offline pour retrouver le secret du compte de service.","flow":"Compte domaine valide → obtenir/posséder un TGT → demander TGS pour un SPN → extraire le ticket → cracking offline du compte de service","cheat":[{"words":1,"title":"Repères","rows":[["Cible","service account avec SPN"],["Objet","TGS / service ticket"],["Prérequis","foothold / compte domaine valide"],["Outils cités","Rubeus, Hashcat, John ; GetUserSPNs est également cité dans le chapitre"]]}],"exam":"Kerberoasting = SPN + TGS + compte de service + cracking offline."},{"name":"Rainbow Table","desc":"Une rainbow table accélère le cracking en pré-calculant des chaînes de valeurs plutôt qu'en recalculant chaque hash au moment de l'attaque. Elle échange donc de l'espace disque contre du temps de calcul. Les chaînes utilisent une fonction de réduction qui transforme un hash en nouveau candidat plaintext pour limiter la taille du stockage.","exam":"Rainbow table ≠ wordlist hashing. Les tables sont pré-calculées pour un espace de clés donné."},{"name":"Markov-Chain Attack","desc":"Une attaque par chaîne de Markov apprend les séquences de caractères ou syllabes qui apparaissent fréquemment dans les mots de passe, puis génère en priorité les candidats statistiquement les plus plausibles. Elle cherche à éviter de parcourir uniformément tout l'espace de brute force."},{"name":"Distributed Network Attack","desc":"Le cracking distribué partage un travail de recherche entre plusieurs machines. Le modèle cité utilise un serveur qui distribue les jobs et plusieurs clients qui calculent des candidats en parallèle. L'objectif est d'augmenter fortement la puissance totale disponible pour une attaque offline."},{"name":"Hash collision","desc":"Une collision existe lorsque deux entrées différentes produisent la même valeur de hash. Le phénomène est possible parce que l'espace de sortie d'une fonction de hachage est fini ; le birthday paradox explique pourquoi des collisions deviennent probables plus tôt qu'une intuition naïve ne le suggère. Pour le cracking de mots de passe, le but pratique reste surtout de trouver une valeur acceptée par la comparaison de hash."}]},{"g":"Exploitation — exploit, shellcode & fuzzing","items":[{"name":"Exploit vs PoC vs Shellcode","desc":"Un exploit est le mécanisme qui déclenche une vulnérabilité afin de détourner le comportement normal du programme. Un Proof of Concept démontre de manière contrôlée que la vulnérabilité existe et quel impact elle peut avoir. Le shellcode est le code machine injecté/exécuté après exploitation pour obtenir une action utile, souvent un shell ou une connexion vers l'attaquant.","cheat":[{"words":1,"title":"Différences","rows":[["PoC","démontre la vulnérabilité et son impact"],["Exploit","déclenche la faille et détourne l'exécution"],["Shellcode","payload en code machine exécuté après le détournement"],["Delivery","fait arriver le shellcode au bon endroit et provoque son exécution"]]}],"exam":"Le shellcode doit correspondre à l'OS et à l'architecture du processeur cible."},{"name":"Vulnerability Exploitation — 7 étapes","desc":"Le processus présenté part d'une vulnérabilité déjà identifiée et va jusqu'à l'accès distant. Il faut d'abord confirmer la faiblesse et son risque, choisir ou développer un exploit, sélectionner un moyen de livraison, générer un payload adapté puis exécuter l'ensemble de façon contrôlée.","flow":"1 Identifier → 2 Évaluer le risque → 3 Déterminer la capacité → 4 Développer/choisir l'exploit → 5 Choisir la livraison → 6 Générer/livrer le payload → 7 Obtenir l'accès","exam":"PoC = preuve contrôlée ; exploitation = déclenchement réel de la vulnérabilité."},{"name":"Metasploit — architecture des modules","desc":"Metasploit organise ses fonctions en modules. Les exploit modules encapsulent des exploits, les payloads définissent ce qui s'exécute après succès, les encoders transforment un payload, les NOPs génèrent des instructions de remplissage, les evasion modules modifient le comportement pour éviter certaines détections et les post modules interviennent après compromission pour collecter des informations ou gérer la session.","cheat":[{"words":1,"title":"Modules","rows":[["Exploit","déclenche une vulnérabilité"],["Payload","action exécutée après exploitation"],["Auxiliary","scanners et autres fonctions sans exploitation directe"],["Encoder","transforme/encode le payload"],["Evasion","modifie le comportement pour réduire la détection"],["NOP","génère un NOP sled/remplissage"],["Post","post-exploitation : collecte, privesc, pivot, persistence"]]}]},{"name":"Reverse Shell","desc":"Une reverse shell inverse le sens de la connexion : au lieu que l'attaquant se connecte directement à un port d'écoute sur la victime, c'est la victime compromise qui initie une connexion sortante vers un listener contrôlé par l'attaquant. Cela peut contourner des politiques qui bloquent les connexions entrantes mais autorisent davantage de trafic sortant.","flow":"Attaquant démarre un listener → payload exécuté sur la cible → cible appelle LHOST:LPORT → session obtenue"},{"name":"Client-Side Vulnerability","desc":"Une vulnérabilité client-side existe sur le poste utilisateur et n'est généralement pas exploitable à distance sans action du client. L'attaque nécessite donc que l'utilisateur ouvre un fichier, un e-mail ou une page qui déclenche la faiblesse. C'est pour cela que les vulnérabilités des navigateurs, lecteurs de documents ou clients mail sont souvent combinées avec du social engineering."},{"name":"Living Off the Land (LOTL)","desc":"Living off the land consiste à utiliser les outils légitimes déjà présents sur le système plutôt qu'à déposer de nouveaux binaires offensifs. Ces programmes sont appelés LOLBins lorsqu'ils sont détournés de leur usage normal. L'intérêt est de se fondre dans une activité d'administration légitime et de réduire les artefacts malveillants déposés sur disque.","cheat":[{"words":1,"title":"Exemples","rows":[["Windows","PowerShell et autres outils natifs"],["Linux","shell et binaires système"],["LOLBins","binaries légitimes détournés pour une action offensive"]]}],"exam":"LOTL = utiliser les outils natifs ; PowerShell peut exécuter des actions en mémoire mais peut aussi être journalisé."},{"name":"Fuzzing","desc":"Le fuzzing consiste à envoyer à une application des entrées inattendues, malformées ou excessivement longues et à observer sa réaction. Une bonne gestion produit une erreur contrôlée ; un crash indique un bug qui peut être seulement un DoS ou le point de départ d'une vulnérabilité exploitable. Le fuzzing peut viser un protocole réseau ou un format de fichier local.","flow":"Input valide → mutations répétées → erreur/crash observé → reproduction → analyse de l'exploitabilité"},{"name":"Network vs File Fuzzing","desc":"Le network fuzzing envoie des données modifiées à un service via le réseau, tandis que le file fuzzing génère ou modifie des fichiers qui seront ouverts localement par une application. Certaines vulnérabilités n'existent que dans le parsing d'un fichier et ne peuvent donc pas être déclenchées à distance par un protocole réseau."},{"name":"Peach — modèle de fuzzing","desc":"Peach décrit un fuzzing à l'aide de plusieurs blocs. Le Data Model définit les données et les champs mutables ; le State Model décrit l'enchaînement des actions ; le Publisher définit comment les données sont livrées à l'application ; le Logger conserve les preuves et résultats du test.","cheat":[{"words":1,"title":"4 éléments","rows":[["Data Model","données + champs à muter"],["State Model","séquence logique de l'échange"],["Publisher","canal d'envoi : réseau, fichier…"],["Logger","preuves, crashes et résultats"]]}]}]},{"g":"Buffer Overflow & protections mémoire","items":[{"name":"Buffer Overflow","desc":"Un buffer overflow apparaît lorsqu'un programme écrit plus de données qu'un espace mémoire réservé ne peut en contenir. Les octets supplémentaires écrasent alors la mémoire adjacente. Si cette zone contient des pointeurs ou une adresse de retour, un attaquant peut parfois contrôler le flux d'exécution au lieu de provoquer seulement un crash.","cheat":[{"words":1,"title":"Causes citées","rows":[["Bounds checking","absence de contrôle de taille"],["Unsafe functions","fonctions qui copient sans limite"],["Input validation","filtrage ou sanitation insuffisants"],["Memory allocation","allocation ou gestion mémoire incorrecte"]]}]},{"name":"Stack vs Heap Overflow","desc":"Un stack-based overflow affecte des buffers situés dans la pile d'exécution ; il est classique dans les exemples où une copie non bornée écrase l'adresse de retour. Un heap-based overflow corrompt des objets ou métadonnées alloués dynamiquement dans le tas. Les deux sont des corruptions mémoire, mais les structures et techniques d'exploitation diffèrent."},{"name":"Stack — LIFO","desc":"La stack fonctionne en LIFO : le dernier élément ajouté est le premier retiré. PUSH ajoute une valeur sur la pile et POP la retire. Dans un overflow classique, le buffer local, les pointeurs de frame et l'adresse de retour se trouvent proches les uns des autres, ce qui permet à une écriture trop longue d'atteindre des données de contrôle."},{"name":"EIP / ESP / EBP","desc":"Les registres x86 de la pile permettent de comprendre l'exploitation classique d'un buffer overflow. EIP contient l'adresse de la prochaine instruction à exécuter ; contrôler EIP permet donc de rediriger le programme. ESP pointe vers le sommet de la pile et EBP sert de base au stack frame courant.","cheat":[{"words":1,"title":"Registres","rows":[["EIP","Extended Instruction Pointer : prochaine instruction ; cible principale de l'overflow classique"],["ESP","Extended Stack Pointer : sommet/position courante de la stack"],["EBP","Extended Base Pointer : base du stack frame"],["ESI","source index pour opérations de chaîne"],["EDI","destination index pour opérations de chaîne"]]}],"exam":"EIP = registre clé à contrôler dans le scénario de buffer overflow x86 du CEH."},{"name":"Spiking","desc":"Le spiking envoie des données spécialement construites à une fonction ou commande précise d'un service afin de voir si cette zone de traitement est susceptible de provoquer un crash. Il sert à réduire le périmètre : au lieu de fuzzing aveugle de tout le protocole, on identifie d'abord les entrées qui méritent une analyse approfondie."},{"name":"Fuzzing d'un Buffer Overflow","desc":"Une fois la zone suspecte identifiée, le fuzzing augmente progressivement ou modifie l'entrée jusqu'à provoquer un crash reproductible. Le but est d'estimer la longueur à laquelle la mémoire de contrôle est écrasée et de disposer d'un point de départ stable pour l'analyse sous debugger."},{"name":"Offset","desc":"L'offset est le nombre exact d'octets entre le début de l'entrée contrôlée et la valeur qui atteint l'adresse de retour/EIP. Le connaître permet de construire un payload où le remplissage occupe exactement cette longueur, puis où les octets suivants remplacent EIP de manière déterministe.","flow":"Pattern envoyé → crash → valeur observée dans EIP → retrouver la position du pattern → offset exact"},{"name":"Overwrite EIP","desc":"Après avoir calculé l'offset, l'attaquant vérifie qu'il contrôle bien EIP en plaçant une valeur reconnaissable à l'emplacement exact de l'adresse de retour. Cette étape ne donne pas encore un shell : elle prouve seulement que le flux d'exécution peut être redirigé vers une adresse choisie."},{"name":"Bad Characters","desc":"Certains octets sont modifiés, tronqués ou interprétés spécialement par le protocole ou l'application. Ils ne doivent donc pas apparaître dans les adresses ou le shellcode. L'identification des bad characters consiste à envoyer une séquence de valeurs puis à comparer ce qui arrive réellement en mémoire afin d'exclure les octets problématiques."},{"name":"Right Module / JMP ESP","desc":"Le scénario classique cherche un module chargé dans le processus qui ne possède pas certaines protections mémoire et qui contient une instruction utilisable pour rediriger l'exécution vers le payload, par exemple un chemin vers ESP. Le script mona.py dans Immunity Debugger est cité pour examiner les modules et leurs protections."},{"name":"Shellcode Generation","desc":"Une fois l'adresse de redirection stable et les bad characters connus, le shellcode doit être généré pour l'OS et l'architecture de la cible en excluant les octets interdits. Le payload est ensuite placé dans la zone mémoire vers laquelle l'exécution est redirigée."},{"name":"ASLR","desc":"ASLR (Address Space Layout Randomization) randomise les adresses de zones mémoire et de modules afin qu'une adresse utile observée lors d'un test ne reste pas prévisible à chaque exécution. Cela complique les exploits qui dépendent d'adresses fixes."},{"name":"DEP","desc":"DEP (Data Execution Prevention) empêche l'exécution de code dans certaines régions mémoire destinées aux données. Déposer simplement du shellcode dans un buffer n'est alors plus suffisant si la région n'est pas exécutable."},{"name":"ROP","desc":"Return-Oriented Programming contourne les restrictions d'exécution en réutilisant de petits fragments de code déjà présents dans les modules du programme. Ces fragments, appelés gadgets, se terminent généralement par une instruction RET et sont chaînés pour obtenir le comportement désiré sans injecter un bloc de code exécutable classique."},{"name":"Heap Spraying","desc":"Le heap spraying remplit de grandes portions du heap avec de nombreuses copies d'un contenu contrôlé afin d'augmenter la probabilité qu'une redirection de flux tombe sur une zone utile. Il est cité comme technique permettant de rendre plus prévisible la localisation de données malveillantes en mémoire."},{"name":"JIT Spraying","desc":"Le JIT spraying exploite le comportement d'un compilateur Just-In-Time, notamment dans les navigateurs, pour provoquer la génération en mémoire d'instructions ou données dans des zones relativement prévisibles. L'objectif est de contourner certaines protections qui compliquent l'injection directe de shellcode."},{"name":"Exploit Chaining","desc":"L'exploit chaining combine plusieurs vulnérabilités ou techniques successives parce qu'une faille isolée ne suffit pas à atteindre l'objectif final. Un premier bug peut donner un accès faible, un second permettre une élévation de privilèges, puis un troisième fournir la persistance ou l'accès à une ressource plus sensible."}]},{"g":"Privilege Escalation","items":[{"name":"Privilege Escalation","desc":"Après un accès initial avec des droits limités, l'attaquant cherche à obtenir des privilèges supplémentaires afin d'accéder à davantage de ressources ou de fonctions. Les chemins de privesc reposent souvent sur des erreurs de configuration, des permissions excessives, des vulnérabilités locales ou l'abus de mécanismes légitimes du système."},{"name":"Horizontal vs Vertical Escalation","desc":"L'escalade horizontale consiste à accéder aux ressources d'un autre utilisateur possédant un niveau de privilège comparable. L'escalade verticale consiste à passer à un niveau supérieur, par exemple d'un utilisateur standard vers Administrator, SYSTEM ou root.","cheat":[{"words":1,"title":"Différence","rows":[["Horizontal","User A → données/fonctions de User B au même niveau"],["Vertical","User standard → fonctions administratives/root"]]}],"exam":"Horizontal = latéral entre comptes de niveau similaire ; Vertical = augmentation du niveau de privilège."},{"name":"DLL Hijacking","desc":"Lorsqu'une application Windows charge une DLL sans chemin complet, le système recherche cette bibliothèque dans plusieurs emplacements. Si un attaquant peut écrire dans un emplacement recherché avant la DLL légitime, il peut y placer une bibliothèque du même nom afin qu'elle soit chargée par l'application. L'impact dépend des privilèges avec lesquels le programme s'exécute."},{"name":"Dylib Hijacking","desc":"Le principe est similaire sous macOS avec les dynamic libraries. Une application peut charger une dylib depuis un chemin contrôlable par l'attaquant ; une bibliothèque malveillante placée au bon emplacement est alors exécutée dans le contexte du programme."},{"name":"Named Pipe Impersonation","desc":"Les named pipes sont un mécanisme IPC Windows. Si un processus peu privilégié contrôle un serveur de pipe et qu'il peut attirer un client plus privilégié, il peut tenter d'usurper le security context de ce client. Le résultat peut être une élévation vers un contexte administratif/SYSTEM."},{"name":"Unquoted Service Path","desc":"Un service Windows dont le chemin d'exécutable contient des espaces mais n'est pas entouré de guillemets peut être interprété de manière ambiguë. Si l'attaquant peut écrire dans un des emplacements testés par Windows, il peut y déposer un exécutable qui sera lancé à la place du binaire attendu, potentiellement avec les privilèges du service."},{"name":"Service Object Permissions","desc":"Des permissions trop larges sur un service Windows peuvent permettre à un utilisateur non privilégié de modifier son binaire, sa configuration ou d'autres attributs. Si ce service s'exécute ensuite avec un compte puissant, la modification contrôlée peut conduire à une élévation de privilèges."},{"name":"Unattended Install Credentials","desc":"Les installations Windows automatisées peuvent laisser des fichiers de configuration tels que Unattend.xml contenant des paramètres sensibles, parfois des credentials. La recherche de ces artefacts est une technique de post-exploitation car des secrets oubliés peuvent fournir directement un compte plus privilégié."},{"name":"Misconfigured NFS","desc":"Un export NFS mal configuré peut donner à un utilisateur faible des droits trop importants sur des fichiers montés à distance. Les problèmes de mapping des identités et de privilèges peuvent permettre de créer ou modifier des fichiers qui seront ensuite exécutés avec des droits plus élevés."},{"name":"UAC Bypass","desc":"User Account Control limite l'élévation silencieuse des processus Windows, mais certains binaires ou mécanismes de confiance peuvent être détournés pour exécuter du code avec un niveau élevé sans afficher le prompt attendu. Les techniques citées incluent des modules Metasploit ainsi que FodHelper, Eventvwr et COM handler hijacking."},{"name":"ADCS Abuse","desc":"Active Directory Certificate Services peut devenir un chemin d'escalade lorsque des templates ou permissions de certificats sont mal configurés. Un attaquant disposant d'un compte peut rechercher les templates vulnérables, obtenir un certificat utilisable pour une identité plus privilégiée ou créer un mécanisme de persistance basé sur les certificats."},{"name":"Kernel Exploit","desc":"Une vulnérabilité du noyau ou d'un composant privilégié peut permettre à un utilisateur local d'obtenir root/SYSTEM. La première étape consiste à identifier précisément l'OS, la version du kernel et l'architecture afin de rechercher un exploit compatible, puis à le valider dans le contexte de la cible."},{"name":"PATH Hijacking — '.' dans PATH","desc":"Si le répertoire courant '.' apparaît dans le PATH d'un utilisateur privilégié, un attaquant peut déposer un faux programme portant le nom d'une commande courante. Lorsque l'utilisateur lance cette commande sans chemin absolu depuis le mauvais répertoire, le script de l'attaquant peut être exécuté avant le binaire légitime."},{"name":"setuid (Linux)","desc":"Un binaire setuid s'exécute avec l'identité du propriétaire du fichier, souvent root, plutôt qu'avec celle de l'utilisateur qui le lance. Un binaire setuid vulnérable ou abusif constitue donc un chemin direct de privilege escalation."},{"name":"Access Token Manipulation","desc":"Les access tokens Windows représentent le contexte de sécurité d'un processus ou utilisateur. Leur manipulation ou duplication peut permettre d'exécuter des actions avec l'identité d'un autre compte lorsque l'attaquant possède les droits nécessaires pour accéder ou impersonate le token."},{"name":"Sudo Misconfiguration","desc":"Sous Linux, sudo délègue certaines commandes avec des privilèges élevés. Une règle trop permissive, une commande permettant l'exécution arbitraire ou un cache de mot de passe trop long peut transformer un accès limité en root. Les droits sudo doivent donc être réduits au strict nécessaire et surveillés."}]},{"g":"Post-Exploitation, Pivoting & Persistence","items":[{"name":"Post-Exploitation","desc":"La post-exploitation commence après l'accès initial. Les objectifs sont d'identifier le système compromis, collecter des credentials, élever les privilèges, découvrir d'autres réseaux, pivoter, établir une persistance et éventuellement réduire les traces laissées. La session initiale n'est donc qu'un point de départ."},{"name":"Credential Dumping — Windows","desc":"Sur Windows, les credentials peuvent provenir de plusieurs sources. Les hashes locaux résident dans la SAM ; les secrets et informations d'authentification de sessions actives sont accessibles via LSASS lorsque les privilèges le permettent. Meterpreter propose hashdump pour la SAM et kiwi pour les opérations liées à Mimikatz/LSA."},{"name":"Credential Dumping — Linux","desc":"Sur Linux moderne, /etc/passwd contient les informations de comptes mais pas les hashes de mots de passe ; ceux-ci se trouvent dans /etc/shadow, généralement lisible uniquement par root. L'attaquant doit donc obtenir les privilèges nécessaires avant de pouvoir récupérer les hashes puis les attaquer offline."},{"name":"Pivoting","desc":"Le pivoting consiste à utiliser une machine compromise comme route vers un réseau que l'attaquant ne pouvait pas atteindre directement. Une cible possédant plusieurs interfaces réseau est particulièrement intéressante : la session compromise devient un point de transit permettant d'utiliser des modules contre le subnet interne.","flow":"Compromettre un hôte → identifier ses interfaces → ajouter une route via la session → scanner/attaquer le réseau interne"},{"name":"Persistence","desc":"La persistence vise à conserver l'accès après reboot, logoff ou correction de la vulnérabilité initiale. Elle évite de devoir ré-exploiter le même bug à chaque retour. Le module cite notamment la création d'un utilisateur, les reverse shells persistantes, les clés/entrées de registre, BITS, DLL hijacking, WMI event subscriptions et d'autres mécanismes de démarrage automatique."},{"name":"Registry Persistence","desc":"Sous Windows, certaines clés ou mécanismes de registre permettent d'exécuter automatiquement un programme lors du démarrage ou de la connexion. Metasploit fournit un module de registry persistence qui associe un payload à une session déjà compromise afin que l'accès survive au reboot."},{"name":"BITS Persistence","desc":"BITS (Background Intelligent Transfer Service) est un service Windows légitime utilisé pour des transferts en arrière-plan. Un attaquant peut abuser des jobs BITS pour télécharger ou exécuter un contenu de façon persistante tout en se fondant dans un composant système normalement approuvé."},{"name":"WMI Event Subscription","desc":"Une subscription WMI peut associer un événement système à un consumer qui exécute une commande ou un programme. Comme la configuration est persistante et intégrée à WMI, elle peut survivre aux reboots et servir de mécanisme de persistence sans créer une tâche visible dans les emplacements classiques."},{"name":"Network Logon / RC Scripts / Startup Items","desc":"Les scripts exécutés lors d'une connexion réseau, les fichiers rc.common/rc.local sous Unix ou les Startup Items sous macOS peuvent être détournés pour lancer automatiquement un payload. Le principe commun est de placer le code dans un mécanisme de démarrage déjà prévu par le système."},{"name":"Process Injection","desc":"La process injection place du code dans un processus légitime déjà en cours d'exécution plutôt que de lancer un nouveau processus clairement identifiable. Sur Windows, cela implique l'accès au processus,
