fication"]]}],"xref":[3,10]},{"name":"ICMP","desc":"ICMP est un protocole de couche 3 utilisé pour les messages d'erreur et de contrôle réseau. Il est encapsulé dans IP et n'utilise pas de ports. Ping repose sur les messages Echo Request/Reply, tandis que traceroute exploite notamment le fait qu'un routeur renvoie Time Exceeded lorsque le TTL atteint zéro.","tr":"n/a","cheat":[{"words":1,"title":"Types cités","rows":[["0","Echo Reply"],["3","Destination Unreachable ; code 3 = port unreachable"],["5","Redirect"],["8","Echo Request"],["11","Time Exceeded"],["13 / 14","Timestamp Request / Reply"]]}],"exam":"ICMP n'a pas de port. IP protocol number = 1.","xref":[3,10]},{"name":"IP Protocol Numbers 1 / 6 / 17","desc":"Le champ Protocol de l'en-tête IPv4 indique quel protocole est encapsulé dans le paquet. Ces valeurs ne sont pas des numéros de port : 1 = ICMP, 6 = TCP, 17 = UDP.","tr":"n/a","cheat":[{"words":1,"title":"Valeurs","rows":[["1","ICMP"],["6","TCP"],["17","UDP"]]}],"exam":"1/6/17 = numéros de protocole IP, pas ports."}]},{"g":"VPN, TLS & logging","items":[{"name":"443 — TLS / HTTPS / TLS VPN","desc":"TCP 443 est utilisé par HTTPS et par de nombreux VPN basés sur TLS. Un VPN TLS ressemble à une connexion HTTPS classique, ce qui lui permet généralement de traverser plus facilement pare-feu, proxies et NAT qu'un tunnel IPSec.","tr":"tcp","exam":"TLS VPN / HTTPS → TCP 443.","xref":[2,3]},{"name":"500 / 4500 — IKE / IPSec NAT-T","desc":"IPSec utilise IKE pour la négociation et l'échange de clés. UDP 500 est utilisé pour IKE ; UDP 4500 intervient lorsqu'IPSec traverse un NAT via NAT-T.","tr":"udp","cheat":[{"words":1,"title":"Repères","rows":[["UDP 500","IKE — négociation IPSec"],["UDP 4500","NAT Traversal (NAT-T) pour IPSec"]]}],"exam":"IKE = 500/UDP ; NAT-T = 4500/UDP."},{"name":"514 — Syslog","desc":"Syslog transporte des messages de journalisation, historiquement en UDP 514, avec aussi des variantes TCP et TLS. La journalisation distante permet de conserver une copie centrale des événements même si les logs locaux sont effacés.","tr":"udp","cheat":[{"words":1,"title":"Syslog","rows":[["Transport classique","UDP 514"],["Centralisation","envoyer les événements vers un collecteur distant"],["Severities","emergency, alert, critical, error, warning, notice, informational, debug"],["Facilities","auth, cron, mail, kern… indiquent le sous-système émetteur"]]}],"exam":"Syslog classique → UDP 514."}]}]},"contre":{"groups":[{"g":"Architecture & réduction d'exposition","items":[{"name":"Defense in Depth","desc":"La défense en profondeur consiste à superposer plusieurs contrôles afin qu'une seule défaillance ne suffise pas à exposer l'actif. Son but n'est pas uniquement de bloquer l'attaquant : elle cherche aussi à le ralentir et à produire des artefacts — logs, alertes, traces — qui rendent son activité détectable. Les contrôles doivent être redondants sur plusieurs couches.","cheat":[{"words":1,"title":"Couches de défense","rows":[["1","Policies, Procedures & Awareness"],["2","Physical Security"],["3","Perimeter — firewall, DMZ"],["4","Internal Network — IDS/IPS, segmentation"],["5","Host — hardening, endpoint protection"],["6","Application — input validation, secure coding"],["7","Data — encryption, access control, DLP"]]}],"exam":"Principe : plusieurs couches indépendantes, pour éviter qu'un seul contrôle défaillant expose tout."},{"name":"Defense in Breadth","desc":"La défense en largeur complète la défense en profondeur en élargissant ce qui est protégé. Au lieu d'empiler uniquement des contrôles sur le même chemin réseau, elle considère le cycle de vie complet et les autres surfaces : développement logiciel, supply chain, tiers, cloud, mobile et utilisateurs. Elle rejoint l'approche DevSecOps et l'idée qu'il faut investir dans la détection et la réponse en plus de la prévention.","cheat":[{"words":1,"title":"Idée","rows":[["Depth","plusieurs couches sur un chemin de défense"],["Breadth","couverture de l'ensemble de la surface d'attaque et du cycle de vie"],["DevSecOps","intégrer la sécurité dans le développement et le déploiement, pas seulement au périmètre"],["Detection & response","prévoir que certaines préventions échoueront et investir aussi dans la détection/réponse"]]}]},{"name":"Default Deny","desc":"Une politique default deny bloque tout trafic qui n'est pas explicitement autorisé. Elle limite la surface exposée en obligeant l'organisation à ouvrir seulement les flux réellement nécessaires. Sur un pare-feu, l'ordre des règles reste essentiel : elles sont évaluées de haut en bas et la première correspondance détermine l'action.","cheat":[{"words":1,"title":"À appliquer","rows":[["Principe","deny by default, allow by exception"],["Rules","placer les règles spécifiques et nécessaires dans un ordre cohérent"],["But","réduire les services et chemins accessibles par défaut"]]}],"xref":[12]},{"name":"Segmentation & DMZ","desc":"La segmentation limite les conséquences d'une compromission en séparant les zones selon leur exposition et leur sensibilité. Les systèmes accessibles depuis Internet sont placés en DMZ et les contrôles réseau doivent empêcher cette zone d'initier librement des connexions vers le réseau interne. Des enclaves ou de la microsegmentation peuvent appliquer le même principe à des environnements spécialisés.","cheat":[{"words":1,"title":"Objectif","rows":[["Containment","un serveur exposé compromis ne doit pas donner automatiquement accès au LAN"],["Least connectivity","n'autoriser entre zones que les flux nécessaires"],["Enclaves","isoler les données/populations sensibles dans des segments dédiés"]]}],"xref":[12]},{"name":"VPN & chiffrement des accès distants","desc":"Les accès distants traversent un réseau non fiable et doivent donc être protégés par un tunnel chiffré. Les sources présentent IPSec comme solution typique pour le site-to-site et TLS comme solution fréquente pour les utilisateurs distants. Le choix dépend du type d'accès, du périmètre à protéger et des contraintes NAT/pare-feu.","cheat":[{"words":1,"title":"Choix typique","rows":[["Site-to-site","IPSec, souvent en tunnel mode"],["Remote user","TLS VPN sur 443, souvent plus simple à travers NAT/proxies/firewalls"],["MPLS","ne pas le confondre avec du chiffrement : l'isolation opérateur n'est pas une protection cryptographique"]]}]}]},{"g":"Visibilité, logs & détection","items":[{"name":"Centraliser les logs","desc":"Une copie locale des journaux peut être effacée par un attaquant qui cherche à couvrir ses traces. Expédier rapidement les événements vers un collecteur central crée une copie indépendante plus difficile à supprimer depuis l'hôte compromis. Cette centralisation facilite également la corrélation et l'investigation à l'échelle de l'organisation.","cheat":[{"words":1,"title":"Pourquoi","rows":[["Tamper resistance","l'effacement local ne détruit pas nécessairement la copie distante"],["Correlation","plusieurs sources peuvent être rapprochées dans un SIEM"],["Investigation","conserver une chronologie exploitable après l'incident"]]}],"xref":[6]},{"name":"Activer et configurer l'audit","desc":"Il ne suffit pas de posséder un système de logs : il faut décider quels événements de sécurité doivent réellement être enregistrés. Sous Windows, cela passe par l'Audit Policy locale ou les GPO ; sous Linux, par le sous-système auditd/auditctl. L'audit bien configuré produit les traces nécessaires à la responsabilité et à la preuve.","cheat":[{"words":1,"title":"Exemples","rows":[["Windows","activer les événements de succès/échec pertinents dans l'Audit Policy"],["Linux","surveiller fichiers, exécutions et syscalls via auditctl/auditd"],["Validation","vérifier que les événements attendus apparaissent réellement dans les journaux"]]}]},{"name":"Déployer IDS/IPS avec tuning","desc":"IDS et IPS n'apportent de valeur que si leurs capteurs sont placés là où le trafic pertinent est visible et si les règles sont correctement réglées. Les signatures détectent les attaques connues mais peuvent manquer des comportements nouveaux ; l'anomalie détecte des écarts mais génère davantage de faux positifs. Les règles IPS doivent être testées afin d'éviter de bloquer des clients ou partenaires légitimes.","cheat":[{"words":1,"title":"Bon usage","rows":[["Placement","NIDS hors bande via SPAN/TAP ; IPS inline si blocage nécessaire"],["Tuning","ajuster les règles au contexte et au trafic réel"],["Detect-only","valider certaines règles avant passage en blocage"],["Investigation","traiter les alertes même lorsqu'un IPS a bloqué l'action"]]}],"xref":[12]}]},{"g":"Gouvernance & préparation","items":[{"name":"Policies, standards & awareness","desc":"Les contrôles administratifs structurent le comportement de l'organisation. Les policies fixent les attentes et doivent être soutenues par la direction ; les standards traduisent ces attentes en exigences ; les procédures expliquent comment les appliquer. La formation et la sensibilisation complètent ces documents afin que les utilisateurs comprennent les comportements attendus.","cheat":[{"words":1,"title":"Pourquoi c'est une contre-mesure","rows":[["Management sponsorship","donne du poids aux politiques"],["Consistency","standards et procédures rendent les exigences applicables et répétables"],["People","formation et sensibilisation réduisent les erreurs et comportements à risque"]]}]},{"name":"Risk treatment","desc":"La réduction technique n'est qu'une des réponses possibles à un risque. Pour chaque risque identifié, l'organisation choisit explicitement de l'accepter, le transférer, le mitiger ou l'éviter. Cette décision doit tenir compte de l'impact, de la probabilité et de l'appétence au risque, puis être revue après la mise en place des contrôles pour évaluer le risque résiduel.","cheat":[{"words":1,"title":"Cycle de décision","rows":[["Identify","comprendre la menace, la vulnérabilité et l'impact"],["Choose","accept / transfer / mitigate / avoid"],["Implement","appliquer les contrôles ou la décision choisie"],["Review","réévaluer le risque résiduel"]]}]},{"name":"Incident preparedness","desc":"La préparation précède l'incident. Elle consiste à définir politiques, procédures, outils, équipe, responsabilités et plans de communication avant qu'une compromission survienne. Pendant l'incident, l'organisation suit ensuite un processus cohérent : triage, notification, containment, collecte de preuves, eradication, recovery puis retour d'expérience.","cheat":[{"words":1,"title":"Préparer à l'avance","rows":[["People","équipe et rôles définis"],["Process","procédures et communication prévues"],["Tools","outils nécessaires disponibles et testés"],["Post-incident","documenter et améliorer politiques/processus après chaque incident"]]}]},{"name":"Predict → Protect → Detect → Respond","desc":"Une stratégie adaptative évite de considérer la sécurité comme un projet terminé une fois les contrôles installés. L'organisation prédit les risques et évolutions de la menace, protège ses actifs, détecte les anomalies puis répond aux incidents. Les informations issues de la détection et de la réponse doivent ensuite améliorer les protections et les évaluations futures.","flow":"Predict → Protect → Detect → Respond → Predict…","cheat":[{"words":1,"title":"Boucle","rows":[["Predict","risque, vulnérabilités, surface d'attaque, threat intelligence"],["Protect","contrôles préventifs et défense en profondeur"],["Detect","monitoring et identification des anomalies"],["Respond","investigation, containment, mitigation, eradication"]]}]}]}]}}},{"n":2,"t":"Footprinting et reconnaissance","data":{"concept":{"groups":[{"g":"Fondamentaux du footprinting","items":[{"name":"Footprinting / Reconnaissance","desc":"Le footprinting est la phase préparatoire où l'on cherche à construire le profil d'une cible avant toute exploitation. L'objectif n'est pas encore d'entrer dans le système, mais de comprendre l'organisation, son infrastructure, ses personnes et les informations qu'elle expose. Les résultats servent à définir la surface d'attaque et à préparer les étapes suivantes.","cheat":[{"words":1,"title":"Ce que le footprinting produit","rows":[["Organisation","employés, contacts, implantations, partenaires, documents publics et structure"],["Réseau","domaines, sous-domaines, netblocks, DNS, IP joignables et éléments de topologie"],["Systèmes","OS/serveurs exposés, technologies web, adresses mail et parfois identifiants divulgués"]]}],"exam":"Réflexe CEH : footprinting = collecte préparatoire et profil de la cible ; scanning = sondes réseau plus directes sur les hôtes et ports.","xref":[1,3]},{"name":"OSINT vs Footprinting","desc":"OSINT signifie Open Source Intelligence : collecte d'informations à partir de sources librement accessibles. C'est une forme de reconnaissance passive lorsqu'on exploite uniquement des informations déjà publiques, sans envoyer de trafic vers les systèmes de la cible. Le footprinting est plus large : il peut être passif ou actif.","cheat":[{"words":1,"title":"Différence","rows":[["OSINT","sources ouvertes/publiques ; pas de contact direct avec les systèmes de la cible"],["Footprinting","ensemble de la reconnaissance préparatoire ; peut être passive ou active"]]}],"exam":"Ne confonds pas « OSINT » avec toute la reconnaissance : dans ces sources, OSINT = partie passive du footprinting."},{"name":"Passive vs Active Footprinting","desc":"La différence repose sur l'interaction avec la cible. En passif, on consulte des informations déjà disponibles et la cible ne reçoit pas de trafic provenant directement de l'investigateur. En actif, on interroge ou contacte directement des ressources ou des personnes de la cible ; l'activité peut donc laisser des traces ou déclencher des alertes.","cheat":[{"words":1,"title":"Classification des sources","rows":[["Passive","moteurs de recherche, bases publiques, Whois, réseaux sociaux, services de recherche"],["Active","interrogation DNS, traceroute, suivi d'e-mail, ingénierie sociale ; le module cite aussi scanning et user enumeration"]]}],"exam":"Question classique : passif = aucune interaction directe ; actif = contact direct et potentiellement détectable."},{"name":"Black box et OSINT","desc":"En black box, peu ou aucune information n'est fournie au pentester : l'OSINT permet donc de reconstruire progressivement le contexte de la cible. En white box, une grande partie de ces informations est déjà fournie, ce qui réduit le besoin de découverte externe.","cheat":[{"words":1,"title":"Idée","rows":[["Black box","peu d'informations au départ → l'OSINT apporte beaucoup de valeur"],["White box","informations fournies par le client → moins de besoin de reconstruire le contexte"]]}],"exam":"Black box = OSINT particulièrement utile ; white box = informations déjà fournies."},{"name":"Informations recherchées","desc":"Le footprinting ne cherche pas seulement des adresses IP. Il rassemble des données qui permettent ensuite de relier des personnes, des technologies et des actifs. La valeur vient souvent du croisement : une offre d'emploi peut révéler une technologie, Whois un netblock, LinkedIn les équipes, DNS les noms d'hôtes.","cheat":[{"words":1,"title":"3 familles","rows":[["Organisation","noms, contacts, téléphones, sites, partenaires, documents, brevets, presse"],["Réseau","domaines, sous-domaines, blocs IP, routeurs/firewalls de confiance, Whois et DNS"],["Système","OS/serveur web, localisation, e-mails publics, noms d'utilisateurs ou mots de passe exposés"]]}]},{"name":"Menaces liées au footprinting","desc":"Une organisation qui expose beaucoup d'informations facilite les attaques suivantes, même sans vulnérabilité technique immédiate. Les informations récoltées peuvent alimenter l'ingénierie sociale, aider à identifier des systèmes vulnérables, révéler des données confidentielles ou donner un avantage à un concurrent.","cheat":[{"words":1,"title":"Conséquences citées","rows":[["Social engineering","construire des prétextes crédibles à partir d'informations réelles"],["System / network attacks","identifier technologies et configurations à cibler"],["Information leakage / privacy loss","données sensibles ou personnelles exposées"],["Corporate espionage","secrets commerciaux, produits ou stratégie"],["Business loss","impact financier ou opérationnel"]]}],"xref":[9]},{"name":"Méthodologie générale","desc":"Le module organise la reconnaissance autour de plusieurs sources complémentaires. Les moteurs de recherche, services de recherche, réseaux sociaux et Whois constituent surtout la collecte passive. DNS, réseau/e-mail et ingénierie sociale introduisent des interactions actives. La bonne approche consiste à commencer large, puis à pivoter sur les informations trouvées.","flow":"Moteurs / OSINT → Entreprise & personnes → Whois / DNS → Réseau & e-mail → Website intelligence → Corrélation","exam":"Le module attend surtout que tu saches reconnaître la source ou la technique adaptée à l'information recherchée."}]},{"g":"Moteurs de recherche & Google dorking","items":[{"name":"Search Engine Footprinting","desc":"Les moteurs de recherche sont une source majeure de reconnaissance parce qu'ils indexent pages, documents, portails, profils et erreurs laissés publics. Ils peuvent révéler des technologies, des coordonnées d'employés, des pages de connexion ou des documents internes accidentellement exposés.","cheat":[{"words":1,"title":"Sources citées","rows":[["Moteurs","Google, Bing, Yahoo, DuckDuckGo, Baidu, Yandex"],["Ce qu'on cherche","technologies, employés, login pages, intranet portals, contacts et documents"]]}]},{"name":"Google Dorking","desc":"Le Google dorking consiste à combiner des opérateurs avancés pour réduire précisément les résultats et faire ressortir des informations difficiles à trouver avec une recherche normale. La syntaxe importante est opérateur:terme, sans espace après les deux-points.","syntax":"site:example.com filetype:pdf intext:\"confidential\"","cheat":[{"words":1,"title":"Opérateurs essentiels","rows":[["site:","limiter la recherche à un domaine"],["inurl: / allinurl:","chercher un ou plusieurs termes dans l'URL"],["intitle: / allintitle:","chercher dans le titre de la page"],["intext:","chercher dans le contenu de la page"],["filetype: / ext:","limiter à une extension"],["cache:","version mise en cache"],["-terme","exclure un terme des résultats"]]}],"exam":"À connaître en priorité : site:, inurl:, intitle:, filetype:, intext:, cache:."},{"name":"Dorks à reconnaître","desc":"Le but n'est pas de mémoriser des centaines de requêtes, mais de comprendre ce que la combinaison d'opérateurs recherche. Les exemples du module montrent des pages d'administration, des fichiers de configuration, des index de répertoires et des clés exposées.","syntax":"inurl:admin intitle:login\nfiletype:cfg OR filetype:conf intext:password\nintitle:\"index of\" inurl:ftp\n\"-----BEGIN OpenVPN Static key V1-----\" ext:key","exam":"intitle:\"index of\" est l’exemple classique pour repérer un directory listing."},{"name":"GHDB — Google Hacking Database","desc":"La GHDB est une base de Google dorks déjà préparés, intégrée à Exploit-DB. Elle aide à rechercher des répertoires sensibles, fichiers contenant des identifiants, messages d'erreur, portails de connexion ou systèmes vulnérables qui ont été indexés publiquement.","cheat":[{"words":1,"title":"Catégories typiques","rows":[["Footholds","points d'entrée ou pages intéressantes"],["Sensitive Directories / Files","répertoires ou fichiers exposés"],["Passwords / Usernames","documents contenant des identifiants"],["Error Messages","erreurs révélant configuration ou versions"],["Login Portals / Vulnerable Servers","interfaces d'authentification ou systèmes vulnérables"]]}],"exam":"GHDB fait partie d'Exploit-DB. SearchSploit est le client CLI d'Exploit-DB, utilisable hors ligne."},{"name":"Shodan et Censys","desc":"Shodan et Censys indexent des systèmes exposés sur Internet plutôt que des pages web classiques. Les résultats peuvent montrer ports, services, bannières, localisation et caractéristiques des équipements. Le module insiste particulièrement sur Shodan pour les appareils connectés, VPN, VoIP et systèmes industriels.","cheat":[{"words":1,"title":"Comparaison simple","rows":[["Shodan","moteur d'équipements Internet ; ports, services, bannières, localisation, IoT/ICS"],["Censys","service similaire cité pour OS, services, ports et localisation"]]}],"xref":[18,19]}]},{"g":"Recherche Internet & sources publiques","items":[{"name":"Job Sites & LinkedIn","desc":"Les offres d'emploi et profils professionnels divulguent indirectement la pile technique et la structure interne d'une entreprise. Les compétences demandées indiquent ce qui est probablement déployé ; les intitulés et lignes hiérarchiques aident à comprendre les équipes et à identifier des cibles d'ingénierie sociale.","cheat":[{"words":1,"title":"Sources citées","rows":[["LinkedIn","employés, postes, structure et technologies"],["Glassdoor / Monster / Indeed","compétences recherchées, outils et tendances de recrutement"]]}],"xref":[9]},{"name":"EDGAR & données d'entreprise","desc":"EDGAR est la base de la SEC pour les sociétés américaines cotées. Elle fournit notamment la structure organisationnelle, des informations financières et des déclarations réglementaires. La Schedule 14A correspond au proxy statement et inclut notamment des informations destinées aux actionnaires.","cheat":[{"words":1,"title":"À retenir","rows":[["EDGAR","base SEC des sociétés US publiques/cotées"],["Schedule 14A","proxy statement ; informations sur gouvernance et rapport annuel"],["Limite","ne couvre pas toutes les entreprises du monde"]]}],"exam":"EDGAR = sociétés américaines publiques/cotées."},{"name":"People Search Services","desc":"Les services de recherche de personnes agrègent des informations publiques pour retrouver noms, adresses, téléphones, e-mails, proches ou profils sociaux. Ils sont particulièrement utiles pour pivoter à partir d'une identité, mais plusieurs services cités sont payants et surtout orientés États-Unis.","cheat":[{"words":1,"title":"Services cités","rows":[["Spokeo / Pipl / BeenVerified","agrégation de données personnelles publiques"],["Intelius / US Search / Whitepages","autres services de recherche de personnes"],["PeekYou","présence sur les réseaux sociaux, recherche par username"]]}]},{"name":"Wayback Machine / archive.org","desc":"La Wayback Machine conserve des versions historiques de sites web. Une page supprimée aujourd'hui peut donc rester consultable dans une ancienne capture : ancien annuaire, vieux portail de connexion, document supprimé ou information qui n'est plus publiée sur le site actuel.","cheat":[{"words":1,"title":"Ce qu'on peut retrouver","rows":[["Pages supprimées","contenu qui n'existe plus sur le site actuel"],["Anciens employés / annuaires","informations historiques sur l'organisation"],["Anciennes interfaces","portails ou technologies précédemment exposés"],["Documents archivés","fichiers qui restent accessibles dans des snapshots"]]}],"exam":"Contre-mesure citée : demander la suppression directement à archive.org."},{"name":"Competitive Intelligence","desc":"Les sources d'intelligence économique et commerciale complètent la reconnaissance technique. Elles peuvent révéler marché, produits, brevets, marques, ratios financiers et positionnement concurrentiel, ce qui aide à comprendre le contexte métier de la cible.","cheat":[{"words":1,"title":"Sources citées","rows":[["SEMRush","mots-clés et analyse concurrentielle"],["Euromonitor","études de marché"],["Experian","données consommateurs"],["The Search Monitor","veille marque/concurrence"],["USPTO","brevets et marques"],["BizStats","ratios financiers sectoriels"]]}]},{"name":"Dark Web Footprinting","desc":"Le module cite Tor Browser pour rechercher sur le dark web des informations déjà compromises : bases d'identifiants fuités, documents sensibles, données personnelles volées ou informations sur des brèches précédentes. Le principe reste la collecte d'informations existantes, pas l'exploitation d'un système.","cheat":[{"words":1,"title":"Informations recherchées","rows":[["Credential leaks","identifiants provenant de fuites"],["Documents","documents internes ou sensibles divulgués"],["PII","données personnelles d'employés"],["Previous breaches","traces ou informations sur des compromissions passées"]]}]},{"name":"Monitoring par alertes","desc":"Les alertes transforment le footprinting ponctuel en veille continue : une notification est déclenchée lorsqu'un nouveau contenu lié à la cible apparaît. Exemples : Google Alerts, X Alerts et Giga Alerts.","cheat":[{"words":1,"title":"Outils","rows":[["Google Alerts","mentions sur le web"],["X Alerts","mentions sur le réseau social"],["Giga Alerts","surveillance web plus large"]]}]},{"name":"Public Code Repositories","desc":"Les dépôts publics GitHub, GitLab et Bitbucket peuvent exposer par erreur des clés d'API, tokens, mots de passe, adresses e-mail, noms d'utilisateurs ou détails d'architecture. Les fichiers Terraform ou Ansible peuvent également révéler la manière dont l'infrastructure est organisée.","cheat":[{"words":1,"title":"Fuites possibles","rows":[["Secrets","API keys, tokens, mots de passe commités"],["Identités","handles et e-mails d'employés"],["Architecture","noms internes, chemins, services"],["Infrastructure as Code","Terraform, Ansible et configurations"]]}],"xref":[14]}]},{"g":"Réseaux sociaux & personnes","items":[{"name":"Social Media Footprinting","desc":"Les réseaux sociaux exposent des relations, intérêts, événements, coordonnées et habitudes. Pour une organisation, les publications et interactions peuvent révéler produits, support, recrutement et éléments de stratégie. L'intérêt offensif vient surtout de la possibilité de construire des prétextes crédibles et d'identifier les bonnes personnes.","cheat":[{"words":1,"title":"Exemples de fuites","rows":[["Profil personnel","coordonnées, localisation, centres d'intérêt"],["Photos / événements","famille, déplacements et habitudes"],["Support / recrutement","outils, technologies et fonctionnement interne"],["Réseau de contacts","relations de confiance exploitables"]]}],"xref":[9]},{"name":"LinkedIn & CrossLinked","desc":"LinkedIn est particulièrement utile pour le contexte professionnel : employés, intitulés de postes, technologies et organisation des équipes. CrossLinked peut aider à récupérer des noms d'employés ; InSpy est un ancien outil aujourd'hui largement inopérant.","syntax":"crosslinked \"Company Name\"","exam":"LinkedIn → employés + postes + technologies ; CrossLinked est l'outil cité pour automatiser la collecte."},{"name":"Username Pivoting","desc":"Un pseudonyme peut être réutilisé sur plusieurs plateformes. En partant d'un username, on peut retrouver différents comptes et reconstruire une présence en ligne plus large. Sherlock est l'outil cité pour automatiser cette recherche.","syntax":"sherlock SundarPichai --output recon2","exam":"Sherlock = recherche d'un même username sur de nombreuses plateformes."},{"name":"Social Graph & Relations","desc":"La valeur des réseaux sociaux ne vient pas seulement des profils individuels : les liens entre personnes permettent de comprendre qui connaît qui et quelles relations sont crédibles. Maltego est particulièrement adapté à cette représentation sous forme de graphe.","xref":[9]}]},{"g":"Whois, registres & adressage public","items":[{"name":"Whois","desc":"Whois est un protocole de requête-réponse utilisé pour interroger les informations d'enregistrement de ressources Internet : domaines, blocs d'adresses IP et systèmes autonomes. Il peut fournir registrar, contacts, serveurs de noms, dates et surtout le netblock associé à une organisation.","cheat":[{"words":1,"title":"Informations fréquentes","rows":[["Domaine","registrar, statut, dates de création/expiration"],["Contacts","administratif et technique lorsque non masqués"],["DNS","name servers déclarés"],["IP / ASN","NetRange, ASN, historique et parfois localisation"]]}],"exam":"Whois utilise TCP 43.","tr":"tcp"},{"name":"ICANN, IANA et Registrars","desc":"ICANN coordonne les noms et la numérotation d'Internet. IANA gère notamment l'allocation des ressources de numérotation et délègue des plages d'adresses aux registres régionaux (RIR). Les registrars sont les sociétés auprès desquelles les clients enregistrent leurs noms de domaine.","cheat":[{"words":1,"title":"Qui fait quoi ?","rows":[["ICANN","responsabilité générale des noms et de la numérotation"],["IANA","allocation des ressources d'adressage IP"],["Registrar","enregistre les domaines pour les titulaires"],["RIR","alloue les blocs d'adresses aux organisations de sa région"]]}]},{"name":"Les 5 RIR","desc":"Les Regional Internet Registries gèrent les allocations d'adresses dans différentes régions. Un Whois sur une IP peut montrer quel bloc appartient à l'organisation, information importante pour définir les plages qui pourront être étudiées ensuite.","cheat":[{"words":1,"title":"RIR → région","rows":[["ARIN","États-Unis, Canada, Antarctique et parties des Caraïbes"],["RIPE NCC","Europe, Russie, Groenland, Moyen-Orient et partie de l'Asie centrale"],["APNIC","Asie-Pacifique, Australie, Nouvelle-Zélande et voisins"],["LACNIC","Amérique latine et parties des Caraïbes"],["AFRINIC","Afrique"]]}],"exam":"L'intérêt pratique : le netblock Whois définit le périmètre d'adresses publiques à investiguer ensuite.","xref":[3]},{"name":"Whois et confidentialité","desc":"Les informations de titulaire et de contact sont aujourd'hui souvent masquées ou redacted. Une requête Whois peut donc ne rien fournir de directement exploitable sur une personne, même si les informations techniques sur le domaine ou le bloc IP restent utiles.","exam":"Ne suppose pas qu'un Whois retourne toujours nom, adresse et téléphone du propriétaire."},{"name":"IP Geolocation","desc":"La géolocalisation IP estime la localisation associée à une adresse : pays, région, ville et fournisseur d'accès. Outils courants : IP2Location, MaxMind et ipinfo.io. Le résultat reste une estimation fondée sur l'adresse IP et ne correspond pas forcément à la position physique exacte de l'utilisateur.","cheat":[{"words":1,"title":"Outils","rows":[["IP2Location","géolocalisation d'IP"],["MaxMind","base de géolocalisation"],["ipinfo.io","informations IP, localisation et opérateur"]]}]}]},{"g":"DNS Footprinting","items":[{"name":"DNS, FQDN et hiérarchie","desc":"DNS transforme des noms pleinement qualifiés en adresses IP. Un FQDN se lit de droite à gauche : la racine implicite, le TLD, le domaine de second niveau, les sous-domaines puis le nom d'hôte. Comprendre cette hiérarchie permet de savoir ce que représentent les enregistrements et où chercher les informations.","cheat":[{"words":1,"title":"www.labs.domain.com.","rows":[["Root","le point final implicite"],["TLD",".com"],["SLD","domain"],["Subdomain","labs"],["Hostname","www"],["FQDN","l'ensemble du nom complet"]]}]},{"name":"Résolution DNS & cache","desc":"Lors d'une première résolution, le poste interroge son résolveur récursif. Celui-ci suit les délégations : serveur racine, serveur TLD puis serveur faisant autorité pour obtenir la réponse. Les résultats sont mis en cache pendant la durée du TTL, ce qui évite de refaire toute la résolution à chaque requête.","flow":"Client → Resolver → Root → TLD → Authoritative NS → réponse → cache selon TTL","exam":"Le serveur autoritaire possède la réponse pour la zone ; le résolveur récursif fait le travail de recherche pour le client."},{"name":"DNS Record Types","desc":"Les enregistrements DNS décrivent différents types de ressources. Pour le CEH, il faut surtout savoir associer immédiatement chaque type à son rôle, car le footprinting consiste justement à interroger ces enregistrements pour reconstruire l'infrastructure.","cheat":[{"words":1,"title":"Records essentiels","rows":[["A","hostname → IPv4"],["AAAA","hostname → IPv6"],["MX","serveur de messagerie du domaine"],["NS","serveur de noms faisant autorité"],["CNAME","alias vers un autre FQDN"],["SOA","informations de zone : serveur primaire, contact, serial et timers"],["PTR","IP → hostname, reverse DNS"],["TXT","texte libre, notamment SPF/DKIM/DMARC et validation de domaine"],["SRV","localisation d'un service"],["RP / HINFO","responsable / informations hôte CPU et OS"]]}],"exam":"À connaître en priorité : A, AAAA, MX, NS, CNAME, SOA, PTR."},{"name":"Forward vs Reverse DNS","desc":"Une résolution normale part d'un nom pour obtenir une adresse IP. La résolution inverse part d'une IP et cherche un enregistrement PTR pour retrouver un nom d'hôte. Le reverse lookup peut révéler des conventions de nommage et les noms de serveurs d'une plage.","syntax":"dig -x 162.241.216.11\nnslookup 162.241.216.11\nhost 21.25.65.110","exam":"Un NXDOMAIN lors d'un reverse lookup signifie qu'aucun PTR n'existe ; cela ne prouve pas que l'adresse IP est inutilisée."},{"name":"DNS Zone Transfer — AXFR","desc":"AXFR est un mécanisme légitime de réplication d'une zone DNS entre serveurs autoritaires, par exemple du primaire vers un secondaire. S'il est accessible à n'importe qui, il peut fournir en une seule requête une grande partie des noms d'hôtes et adresses publiés dans la zone.","syntax":"dig axfr @ns1.example.com example.com","cheat":[{"words":1,"title":"Pourquoi c'est important","rows":[["Usage légitime","synchroniser les serveurs DNS autoritaires"],["Mauvaise configuration","un client non autorisé peut récupérer toute la zone"],["Impact","hôtes, sous-domaines et adresses révélés en masse"]]}],"exam":"AXFR = transfert de zone. Contre-mesure : autoriser uniquement les serveurs secondaires prévus.","xref":[4]},{"name":"DNS Brute Force","desc":"Quand le transfert de zone est refusé, une autre méthode consiste à tester des noms d'hôtes probables à partir d'une wordlist. DNSRecon est cité pour automatiser ces requêtes et découvrir progressivement des sous-domaines ou hôtes valides.","syntax":"dnsrecon -d domain.com -D /usr/share/wordlists/dnsmap.txt -t brt"},{"name":"Passive DNS / Cache local","desc":"Le DNS passif exploite des informations DNS déjà observées ou mises en cache sans envoyer de nouvelle requête vers la cible. Sur un poste interne, le cache DNS peut révéler des noms internes, des blocs d'adresses ou des domaines .local invisibles depuis Internet.","syntax":"ipconfig /displaydns","cheat":[{"words":1,"title":"Limites","rows":[["Windows","ipconfig /displaydns permet de voir le cache"],["Linux","un service de cache comme dnsmasq ou nscd doit être présent"],["Externe","peu utile si l'on n'a pas accès à un cache pertinent"],["Interne","peut révéler nomenclature et ressources internes"]]}]},{"name":"Split DNS","desc":"Le split DNS consiste à maintenir une vue externe limitée et une vue interne plus complète du même espace de noms. Ainsi, les utilisateurs internes peuvent résoudre les ressources privées sans que ces enregistrements soient publiés à l'extérieur.","exam":"Dans ce module, split DNS est la contre-mesure de référence contre la fuite de nomenclature DNS interne et complète la restriction des AXFR."},{"name":"URI vs URL","desc":"Une URI identifie une ressource. Une URL est une URI qui indique également où se trouve la ressource et comment y accéder. Toute URL est donc une URI, mais une URI n'est pas nécessairement une URL.","exam":"URL ⊂ URI : toute URL est une URI, mais l'inverse n'est pas toujours vrai."}]},{"g":"Réseau & e-mail","items":[{"name":"Localiser la plage réseau","desc":"Whois sur une adresse IP ou un domaine peut aider à identifier les blocs publics associés à l'organisation. Ces netblocks servent ensuite à délimiter les plages pertinentes pour les étapes de scanning. Les plages privées RFC1918 ne constituent pas des blocs publics routables sur Internet.","cheat":[{"words":1,"title":"Plages privées rappelées dans le module","rows":[["10.0.0.0/8","10.0.0.0 – 10.255.255.255"],["172.16.0.0/12","172.16.0.0 – 172.31.255.255"],["192.168.0.0/16","192.168.0.0 – 192.168.255.255"]]}],"xref":[1,3]},{"name":"Traceroute","desc":"Traceroute cartographie les sauts intermédiaires entre l'investigateur et la destination. Il aide à comprendre le chemin réseau, l'ISP, certains éléments de topologie et les endroits où le trafic semble filtré. Il repose sur l'expiration progressive du TTL et les réponses générées en chemin.","syntax":"tracert target.example          # Windows\ntraceroute target.example       # Linux\nsudo tcptraceroute target.example","cheat":[{"words":1,"title":"Variantes de traceroute","rows":[["Windows tracert","ICMP"],["Linux traceroute","UDP par défaut sous Linux"],["TCP traceroute","tcptraceroute ; utile quand l'ICMP est filtré"],["* *","absence de réponse sur un saut, souvent due au filtrage"]]}],"exam":"Windows tracert utilise ICMP ; Linux traceroute utilise UDP par défaut.","xref":[1,3]},{"name":"Email Header Footprinting","desc":"Les en-têtes d'un e-mail décrivent son trajet et une partie de l'infrastructure de messagerie. Selon ce qui est présent, ils peuvent révéler le serveur d'origine, les relais traversés, des horodatages, le logiciel de messagerie et les décisions prises par les filtres anti-spam.","cheat":[{"words":1,"title":"Informations possibles","rows":[["Origin","IP ou serveur de messagerie d'origine"],["Route","succession des serveurs ayant traité le message"],["Software","MTA et parfois version"],["Timestamps","heure/date à chaque étape"],["Filtering","résultats ou décisions antispam"]]}]},{"name":"Email Tracking","desc":"Le suivi d'e-mail cherche à déterminer si un message a été ouvert ou si un lien a été cliqué, et peut associer ces événements à des informations de connexion ou de localisation. Exemples d'outils : eMailTrackerPro, IP2LOCATION Email Header Tracer et Read Notify.","xref":[9]}]},{"g":"Website Intelligence","items":[{"name":"Website Technology Intelligence","desc":"L'analyse d'un site cherche à identifier les différentes couches techniques visibles : hébergement, système d'exploitation, serveur web, frameworks, CMS et bibliothèques. Les informations peuvent provenir des réponses HTTP, du comportement du site, des technologies côté navigateur ou de services externes.","flow":"Hosting / netblock → OS → Web server → Framework / CMS → Client-side technologies","xref":[13,14]},{"name":"Hosting History","desc":"Netcraft est cité pour l'historique d'hébergement d'un site. Il peut fournir le propriétaire du netblock contenant l'adresse IP, le système d'exploitation et parfois des détails sur le serveur web ou ses modules. L'historique permet également de voir des changements d'infrastructure.","xref":[13]},{"name":"Technology Fingerprinting","desc":"Wappalyzer et whatweb identifient les technologies utilisées par un site : serveur web, framework, CMS, bibliothèques JavaScript, trackers ou autres composants visibles. Cette information sert ensuite à orienter la recherche de vulnérabilités et les tests.","cheat":[{"words":1,"title":"Outils","rows":[["Wappalyzer","extension/interface de détection de technologies web"],["whatweb","outil en ligne de commande pour identifier les technologies"]]}],"xref":[13,14]},{"name":"Website Mirroring","desc":"HTTrack copie les ressources accessibles d'un site pour permettre une analyse hors ligne. Une fois la copie réalisée, on peut examiner localement les pages récupérées sans continuer à solliciter le serveur. La limite explicitement citée est que le contenu serveur et certains éléments dynamiques ne sont pas reproduits.","syntax":"httrack \"https://example.com\" -O ./mirror","exam":"Le mirroring n'embarque pas toute la logique serveur : les éléments dynamiques côté serveur peuvent manquer.","xref":[13]},{"name":"Document Metadata","desc":"Les documents publics peuvent contenir des métadonnées invisibles dans le contenu affiché : noms d'utilisateurs, logiciels utilisés, chemins internes, imprimantes ou informations sur l'environnement de création. FOCA permet d'extraire ces métadonnées.","exam":"FOCA = extraction de métadonnées de documents."}]},{"g":"Social engineering en reconnaissance","items":[{"name":"Eavesdropping","desc":"L'eavesdropping consiste à écouter des conversations pour recueillir des informations sensibles. Dans le contexte du footprinting, le but est la collecte préalable d'informations qui pourront ensuite servir à cibler une personne ou un système.","xref":[9]},{"name":"Shoulder Surfing","desc":"Le shoulder surfing consiste à observer physiquement une personne pour voir ce qu'elle saisit ou consulte, par exemple un mot de passe ou un code PIN. C'est une technique de proximité et une forme active de collecte selon le module.","xref":[9]},{"name":"Dumpster Diving","desc":"Le dumpster diving consiste à fouiller les déchets pour récupérer des documents, supports ou informations jetés : impressions, listes internes, étiquettes, notes ou matériels. La faiblesse exploitée est une mauvaise destruction de l'information.","xref":[9]},{"name":"Impersonation","desc":"L'impersonation consiste à se faire passer pour une personne crédible — support informatique, fournisseur ou employé — afin d'obtenir volontairement des informations de la victime. Les données OSINT récupérées auparavant rendent généralement le prétexte plus convaincant.","xref":[9]}]},{"g":"IA & automatisation v13","items":[{"name":"AI-Powered OSINT","desc":"Le module v13 présente l'IA comme un moyen d'accélérer la collecte, d'élargir le nombre de sources examinées et de corréler des informations dispersées. L'intérêt mis en avant est l'automatisation de tâches répétitives, pas le remplacement du raisonnement de l'investigateur.","cheat":[{"words":1,"title":"Bénéfices cités","rows":[["Efficiency","automatiser scraping et extraction"],["Greater scope","surface web, deep web et dark web"],["Visibility","relier des données dispersées"],["Investigator safety","réduire l'exposition manuelle lors de recherches sensibles"]]}],"xref":[20]},{"name":"AI OSINT Tools","desc":"Les outils OSINT assistés par IA servent notamment à collecter et organiser des actualités, agréger plusieurs bases, analyser des PDF, automatiser la collecte web, rechercher dans des bases fuitées ou accélérer une investigation OSINT.","cheat":[{"words":1,"title":"Outils cités","rows":[["Taranis AI","collecte et organisation de news/threat intel par NLP/IA"],["Cylect.io","agrégation de plusieurs bases de données OSINT"],["ChatPDF","analyse de documents PDF"],["Bardeen.ai","automatisation de collecte depuis des sources en ligne"],["DarkGPT","interrogation de bases de données fuitées"],["PenLink Cobwebs","investigations cybersécurité orientées OSINT"],["Explore AI","recherche YouTube assistée par IA"]]}]},{"name":"ShellGPT & automatisation","desc":"ShellGPT est utilisé dans le module pour transformer une consigne en langage naturel en commande ou pipeline de reconnaissance. L'exemple fourni automatise une recherche Google avec filetype puis stocke les résultats dans un fichier.","syntax":"sgpt --chat footprint --shell \"Use filetype search operator to obtain pdf files on the target website eccouncil.org and store the result in recon1.txt\"","exam":"Le point important est l'automatisation de tâches de footprinting via une interface IA en ligne de commande."},{"name":"Script Python de Footprinting","desc":"Le module montre également un script généré par IA qui enchaîne plusieurs familles de reconnaissance sur un domaine. La logique à retenir est le pipeline : effectuer une résolution DNS, récupérer les informations Whois puis lancer une collecte d'e-mails avec theHarvester.","flow":"Domain → DNS lookup → Whois lookup → Email enumeration → résultats"}]}]},"outil":{"groups":[{"g":"OSINT généraliste","items":[{"name":"Maltego","desc":"Maltego automatise la découverte de relations entre personnes, organisations, domaines, adresses IP, e-mails et autres entités. Sa valeur principale est la représentation visuelle : on part d'une entité puis on applique des transforms pour faire apparaître de nouvelles entités et leurs liens.","cheat":[{"words":1,"title":"Vocabulaire Maltego","rows":[["Entity","objet de départ ou résultat : personne, domaine, IP, e-mail…"],["Transform","action qui prend une entité et retourne de nouvelles informations"],["Graph","vue des entités et des relations"],["Use case","corréler des informations dispersées visuellement"]]}],"exam":"Question typique : représentation visuelle des relations OSINT → Maltego."},{"name":"Recon-ng","desc":"Recon-ng est un framework OSINT modulaire. On travaille dans un workspace, on charge un module, on définit la source ou la cible, puis les résultats sont stockés dans la base du workspace. De nombreux modules s'appuient sur des services externes et nécessitent donc une clé d'API.","syntax":"recon-ng\n> workspaces create cible\n> workspaces load cible\n> marketplace search\n> marketplace install <module>\n> modules load <module>\n> options set SOURCE cible.com\n> run\n> show hosts","cheat":[{"title":"Commandes principales","rows":[["workspaces create <nom>","crée un espace de travail séparé pour la cible"],["workspaces load <nom>","charge un workspace existant"],["marketplace search <terme>","cherche un module disponible"],["marketplace info <module>","affiche dépendances, clés API et informations du module"],["marketplace install <module>|all","installe un module ou tous les modules"],["modules search <terme>","cherche parmi les modules installés"],["modules load <module>","charge le module choisi"],["info","affiche les options et détails du module chargé"],["options set SOURCE <cible>","définit la source/cible lorsque le module utilise SOURCE"],["run","exécute le module"],["show hosts|contacts|domains","affiche les données collectées dans le workspace"],["keys add <service> <clé>","ajoute une clé API nécessaire à certains modules"],["snapshots","sauvegarde/restaure l’état de la base du workspace"]]}]},{"name":"theHarvester","desc":"theHarvester automatise la collecte d'informations liées à un domaine depuis différentes sources : adresses e-mail, noms d'employés, sous-domaines, hôtes et autres éléments utiles à la reconnaissance.","syntax":"theHarvester -d example.com -b crtsh,certspotter -l 500\ntheHarvester -d example.com -b all -f rapport\ntheHarvester -d example.com -b all -c -n","cheat":[{"title":"Options essentielles","rows":[["-d / --domain","domaine ou nom d’entreprise cible — obligatoire"],["-b / --source","source(s) OSINT à interroger ; plusieurs sources peuvent être séparées par des virgules"],["-l / --limit","limite du nombre de résultats récupérés"],["-f / --filename","enregistre/exporte les résultats dans des fichiers de rapport"],["-n / --dns-lookup","effectue des recherches DNS supplémentaires sur les résultats découverts"],["-c / --dns-brute","lance une brute force DNS des sous-domaines"],["-e / --dns-server","utilise un serveur DNS précis"]]},{"title":"Options utiles / avancées","rows":[["-S / --start","commence à partir du résultat numéro X dans les versions actuelles"],["-r / --dns-resolve","résout les sous-domaines avec une liste de resolvers"],["-s / --shodan","enrichit les hôtes découverts avec Shodan dans les versions actuelles"],["-p / --proxies","utilise les proxies définis dans la configuration"],["-t / --take-over","vérifie les risques de subdomain takeover"],["--screenshot <dossier>","prend des captures des domaines résolus"],["-w / --wordlist","spécifie une wordlist pour l’API endpoint scanning"],["-a / --api-scan","recherche des endpoints API"],["-q / --quiet","réduit certains avertissements, notamment liés aux clés API"],["Anciennes versions CEH","option dépendante de la version ; vérifier `theHarvester -h` car le rôle de `-s` a changé selon les versions"]]}],"exam":"À retenir pour le CEH : -d = cible, -b = source, -l = limite. theHarvester sert surtout à récolter e-mails, personnes, hôtes et sous-domaines depuis des sources publiques."},{"name":"OSINT Framework","desc":"OSINT Framework est une arborescence de ressources OSINT classées par catégorie. Le module associe aussi des indicateurs aux liens afin de préciser le mode d'utilisation de l'outil.","cheat":[{"words":1,"title":"Indicateurs","rows":[["(T)","outil à installer localement"],["(D)","Google dork"],["(R)","inscription requise"],["(M)","URL à modifier manuellement"]]}],"exam":"T / D / R / M sont explicitement donnés dans le module."},{"name":"Sherlock","desc":"Sherlock recherche un même nom d'utilisateur sur de nombreuses plateformes pour retrouver les comptes associés. Il sert à pivoter d'un simple pseudo vers une présence numérique plus large.","syntax":"sherlock SundarPichai --output recon2.txt\nsherlock --fo smithsearch jsmith smith johnsmith","cheat":[{"title":"Options utiles","rows":[["--output <fichier>","écrit le résultat dans un fichier"],["--fo <nom>","préfixe/nom de sortie pour une recherche portant sur plusieurs pseudos"],["<username>","un ou plusieurs pseudos à rechercher sur les plateformes prises en charge"]]}]},{"name":"CrossLinked","desc":"CrossLinked automatise la recherche de noms d'employés associés à une entreprise via des données publiques liées à LinkedIn. Il remplace dans la pratique d'anciens outils comme InSpy.","syntax":"crosslinked \"Company Name\""},{"name":"PGP Key Servers","desc":"Les serveurs de clés PGP peuvent révéler les adresses e-mail associées à des clés publiques. Ils sont surtout utiles lorsqu'on recherche des informations sur une personne précise plutôt que sur une entreprise entière."},{"name":"BuzzSumo / Trends / Hashatit","desc":"Le module cite plusieurs services pour analyser contenus et tendances sociales. BuzzSumo recherche les contenus les plus partagés par sujet, auteur ou domaine ; Google Trends suit l’évolution des recherches ; Hashatit suit des hashtags ; Ubersuggest apporte des données SEO et sociales.","cheat":[{"title":"Outils","rows":[["BuzzSumo","contenus les plus partagés"],["Google Trends","tendances de recherche"],["Hashatit","suivi de hashtags"],["Ubersuggest","données SEO et sociales"]]}]},{"name":"Outils de reconnaissance groupés","desc":"Le module CEH cite aussi plusieurs outils multifonctions à reconnaître en QCM, même s’ils ne nécessitent pas tous une maîtrise détaillée en ligne de commande.","cheat":[{"title":"Outils cités","rows":[["BillCipher","collecte d’informations sur un site ou une IP"],["Recon-Dog","recon automatisée avec plusieurs intégrations/API"],["Raccoon","outil de reconnaissance offensive multifonction"],["OSINT.SH","services OSINT en ligne"],["Batch IP Converter","informations IP / hôte / domaine en masse"]]}]}]},{"g":"DNS, Whois & sous-domaines","items":[{"name":"whois","desc":"Le client whois interroge les registres ou registrars pour un domaine ou une adresse IP. Sur une IP, il est particulièrement utile pour retrouver le netblock et l'organisation associée ; sur un domaine, il fournit les informations d'enregistrement encore publiques.","syntax":"whois google.com\nwhois 63.12.58.112","exam":"Whois = TCP 43.","cheat":[{"title":"Usages utiles","rows":[["whois <domaine>","informations d’enregistrement d’un nom de domaine"],["whois <IP>","netblock, RIR et organisation associée à une adresse IP"],["whois AS<numéro>","recherche sur un numéro de système autonome lorsque le client/registre le permet"],["-h <serveur>","interroge explicitement un serveur Whois précis"]]}]},{"name":"IP Geolocation","desc":"Les services de géolocalisation IP estiment pays, région, ville et fournisseur d’accès associés à une adresse IP. Ce sont des estimations basées sur des bases d’allocation et de géolocalisation, pas une position GPS précise.","cheat":[{"title":"Services cités","rows":[["IP2Location","géolocalisation IP"],["MaxMind","base GeoIP"],["ipinfo.io","informations IP et ASN"]]}]},{"name":"dig","desc":"dig est un client DNS détaillé et scriptable. Il permet d'interroger un type d'enregistrement précis, de choisir le serveur DNS interrogé, d'effectuer une résolution inverse et de tester un transfert de zone.","syntax":"dig domain.com\ndig domain.com MX\ndig +short domain.com\ndig -x 162.241.216.11\ndig axfr @ns1.example.com example.com","cheat":[{"title":"Options principales","rows":[["@<serveur>","interroge un serveur DNS précis"],["A / AAAA / MX / NS / TXT / SOA / ANY","demande un type d’enregistrement précis"],["AXFR","tente un transfert de zone complet"],["-x <IP>","résolution DNS inverse via PTR"],["+short","affiche uniquement la réponse utile"],["+trace","suit la délégation depuis les serveurs racine jusqu’au serveur autoritaire"],["+noall +answer","masque le reste et n’affiche que la section Answer"],["+nocmd","supprime l’en-tête de commande dans la sortie"]]}],"exam":"dig = outil de choix pour des requêtes DNS détaillées, scriptables et les tests AXFR."},{"name":"nslookup","desc":"nslookup est disponible notamment sous Windows et propose un mode interactif pour changer le type d'enregistrement ou le serveur DNS interrogé. Il convient aux requêtes simples et aux exercices où l'environnement Windows est mis en avant.","syntax":"nslookup domain.com\nnslookup -type=MX domain.com\n\nnslookup\n> set type=ns\n> server ns1.example.com\n> set type=any\n> example.com","cheat":[{"title":"Commandes / options principales","rows":[["set type=A|AAAA|MX|NS|SOA|TXT|any","choisit le type d’enregistrement demandé"],["-type=MX <cible>","équivalent non interactif pour un type précis"],["server <dns>","change le serveur DNS interrogé"],["set debug","affiche une réponse plus détaillée"],["ls -d <domaine>","tentative historique de listing/transfert de zone si le serveur l’autorise"],["<adresse IP>","effectue une résolution inverse"]]}]},{"name":"host","desc":"host est un client DNS simple pour les vérifications rapides. Avec un nom, il effectue une résolution directe vers une adresse IP ; avec une IP, il tente une résolution inverse via l'enregistrement PTR.","syntax":"host www.domain.com\nhost 21.25.65.110","exam":"host = rapide ; nslookup = très disponible/Windows + interactif ; dig = détail et scripting."},{"name":"DNSRecon","desc":"DNSRecon regroupe plusieurs techniques d'énumération DNS : récupération d'enregistrements standards, brute force de noms d'hôtes et tentative de transfert de zone.","syntax":"dnsrecon -d certifiedhacker.com -t std\ndnsrecon -d domain.com -D wordlist.txt -t brt\ndnsrecon -d domain.com -D wordlist.txt -t std,brt,axfr","cheat":[{"title":"Options principales","rows":[["-d <domaine>","domaine cible"],["-D <wordlist>","dictionnaire utilisé pour la brute force"],["-t std","énumération DNS standard"],["-t brt","brute force de noms d’hôtes/sous-domaines"],["-t axfr","tentative de transfert de zone"],["-t rvl","reverse lookup / balayage inverse d’une plage lorsque pertinent"],["-t std,brt,axfr","enchaîne plusieurs types de tests dans une même commande"]]}]},{"name":"Subdomain Enumeration","desc":"Plusieurs outils sont cités pour découvrir des sous-domaines ou hôtes associés à un domaine. L'objectif est de trouver des surfaces moins visibles que le site principal et d'étendre la cartographie de la cible.","cheat":[{"title":"Outils cités","rows":[["subfinder","énumération passive rapide de sous-domaines"],["Sublist3r","énumération de sous-domaines via sources OSINT"],["DNSdumpster","service web découvrant des hôtes liés à un domaine"],["Sudomy","outil de subdomain enumeration"],["SecurityTrails / Fierce / zdns","autres sources/outils DNS cités dans le module"]]},{"title":"Options à retenir","rows":[["subfinder -d <domaine>","définit le domaine cible"],["subfinder -o <fichier>","sauvegarde les résultats"],["sublist3r -d <domaine>","définit le domaine cible"],["sublist3r -o <fichier>","sauvegarde la liste des sous-domaines"]]}],"syntax":"subfinder -d certifiedhacker.com\nsublist3r -d eccouncil.org -o subdomains.txt"}]},{"g":"Search, Internet & entreprise","items":[{"name":"Shodan","desc":"Shodan indexe les bannières et caractéristiques de services exposés sur Internet. Il est utilisé pour repérer équipements, ports, services, versions, localisation et organisations associés à des appareils connectés.","exam":"Shodan = moteur de recherche d'équipements connectés, pas moteur de pages web classique.","xref":[18,19],"cheat":[{"title":"Filtres de recherche importants","rows":[["port:","filtre sur un port exposé"],["country: / city:","filtre géographique"],["org: / net:","organisation ou plage réseau"],["os:","système d’exploitation détecté"],["product:","produit/service identifié"],["hostname:","nom d’hôte"],["has_screenshot:true","résultats disposant d’une capture d’écran"],["vuln:","filtre sur une vulnérabilité/CVE lorsque la fonctionnalité est disponible"]]}]},{"name":"Censys","desc":"Censys est un moteur de recherche d'actifs Internet comparable à Shodan. Il permet de retrouver des hôtes, services, ports, certificats et autres caractéristiques exposées sur Internet."},{"name":"Netcraft","desc":"Netcraft fournit des informations sur l'hébergement et les technologies d'un site : sous-domaines, hébergeur, propriétaire du netblock, système d'exploitation et parfois serveur web/version. Il est donc utile à la fois pour la découverte de sous-domaines et l'intelligence sur le site.","xref":[13]},{"name":"EDGAR","desc":"EDGAR est la base de la SEC contenant les déclarations publiques des sociétés américaines cotées. Elle sert à retrouver informations financières, structure organisationnelle et documents de gouvernance.","exam":"EDGAR = US public companies."},{"name":"People Search Services","desc":"Spokeo, Pipl, BeenVerified, Intelius, US Search et Whitepages sont cités comme services agrégeant des données personnelles publiques. PeekYou se concentre davantage sur la présence sociale et les usernames."},{"name":"Wayback Machine","desc":"archive.org / Wayback Machine permet de consulter des versions historiques de sites pour retrouver pages, annuaires ou documents supprimés depuis.","exam":"Le module cite la demande de suppression à archive.org comme contre-mesure."},{"name":"Alertes de surveillance","desc":"Des services d’alertes permettent de surveiller dans le temps les nouvelles mentions de la cible au lieu de refaire manuellement la même recherche.","cheat":[{"title":"Services cités","rows":[["Google Alerts","mentions sur le Web"],["X Alerts","mentions sur X / réseaux sociaux"],["Giga Alerts","surveillance web plus large"]]}]},{"name":"SearchSploit","desc":"SearchSploit est le client en ligne de commande d'Exploit-DB. Dans ce module il est mentionné parce que la GHDB appartient à Exploit-DB et que SearchSploit permet une recherche hors ligne dans cette base.","syntax":"searchsploit apache 2.4\nsearchsploit -m <EDB-ID>\nsearchsploit --update","xref":[5],"cheat":[{"title":"Options utiles","rows":[["<termes>","recherche dans la base locale Exploit-DB"],["-m <EDB-ID>","copie localement l’exploit correspondant"],["--update","met à jour la base SearchSploit"]]}]}]},{"g":"Web & métadonnées","items":[{"name":"HTTrack","desc":"HTTrack crée une copie locale des ressources accessibles d'un site afin de les examiner hors ligne. Les éléments dynamiques et la logique exécutée côté serveur ne sont pas reproduits : on copie surtout ce que le serveur rend accessible au client.","syntax":"httrack \"https://example.com\" -O ./mirror\nwget --mirror --convert-links --page-requisites https://example.com","xref":[13],"cheat":[{"title":"Options / réflexes utiles","rows":[["-O <dossier>","dossier de sortie du miroir"],["URL cible","point de départ du site à copier"],["Limite","le contenu serveur et certains éléments dynamiques ne sont pas reproduits localement"]]}]},{"name":"Wappalyzer","desc":"Wappalyzer identifie les technologies visibles d'un site : serveur web, frameworks, CMS, bibliothèques JavaScript, trackers et autres composants.","xref":[13,14]},{"name":"whatweb","desc":"whatweb remplit le même objectif général que Wappalyzer depuis la ligne de commande : identifier les technologies utilisées par un site.","syntax":"whatweb https://example.com\nwhatweb -a 3 https://example.com","xref":[13,14],"cheat":[{"title":"Options utiles","rows":[["-a <niveau>","niveau d’agressivité de la détection ; une valeur plus élevée augmente la quantité de tests effectués"],["<URL>","site dont on veut identifier CMS, frameworks, serveur et autres technologies"]]}]},{"name":"FOCA","desc":"FOCA est cité pour extraire les métadonnées de documents publiés. Ces métadonnées peuvent révéler utilisateurs, chemins internes, versions logicielles ou autres informations sur l'environnement."},{"name":"Browser Developer Tools","desc":"Firebug était un outil d'inspection approfondie des pages web. Ses fonctions sont aujourd'hui intégrées aux DevTools des navigateurs : inspection du DOM, scripts, stockage, console et requêtes réseau.","xref":[14]},{"name":"Recon — Browser Plugin","desc":"Recon est une extension de navigateur destinée à obtenir rapidement des informations sur un site pendant la navigation."}]},{"g":"Réseau, e-mail & passif","items":[{"name":"traceroute / tracert / tcptraceroute","desc":"Ces outils cartographient le chemin réseau vers une destination. Windows `tracert` utilise des sondes ICMP, Linux `traceroute` utilise généralement UDP par défaut, et `tcptraceroute` envoie des sondes TCP afin de traverser certains filtrages qui bloquent ICMP/UDP.","syntax":"tracert target.example              # Windows : ICMP\ntraceroute target.example           # Linux : UDP par défaut\ntraceroute -I target.example        # force ICMP sous Linux\nsudo tcptraceroute target.example 443  # sondes TCP","xref":[3],"cheat":[{"title":"Variantes à connaître","rows":[["tracert <cible>","Windows : sondes ICMP"],["traceroute <cible>","Linux, UDP par défaut"],["traceroute -I <cible>","force l’utilisation d’ICMP sous Linux"],["tcptraceroute <cible> [port]","utilise TCP, utile lorsque l’ICMP est filtré"],["* * *","le saut n’a pas répondu / est filtré ; ce n’est pas une preuve absolue qu’un firewall se trouve précisément là"]]}]},{"name":"Traceroute GUI / suites","desc":"Le module cite NetScanTools Pro, PingPlotter et Traceroute NG comme outils enrichissant le traceroute avec visualisation, historique ou informations supplémentaires sur les sauts."},{"name":"eMailTrackerPro","desc":"eMailTrackerPro trace le chemin d'un message et présente les informations de serveur et de localisation. Le module cite aussi IP2LOCATION Email Header Tracer et Read Notify."},{"name":"p0f","desc":"p0f réalise une empreinte d'OS passive en observant des caractéristiques du trafic réseau — TTL, fenêtre TCP, options, etc. — sans envoyer de sonde à la cible. L'outil est ancien, mais reste important à reconnaître pour la notion de passive OS fingerprinting.","exam":"Passive OS fingerprinting → p0f.","xref":[3,8]},{"name":"Wireshark","desc":"Wireshark capture et analyse les paquets en détail. Dans le contexte de ce chapitre, il est considéré comme passif tant qu'on se contente d'observer le trafic sans injecter de paquets.","xref":[8]}]},{"g":"IA & automatisation","items":[{"name":"ShellGPT","desc":"ShellGPT transforme une consigne en langage naturel en commande shell. Le module l'utilise pour automatiser un Google dork et le stockage des résultats.","syntax":"sgpt --chat footprint --shell \"Use filetype search operator to obtain pdf files on the target website eccouncil.org and store the result in recon1.txt\"","cheat":[{"title":"Éléments de commande vus dans le module","rows":[["--chat <nom>","utilise/conserve un contexte de conversation nommé"],["--shell","demande une sortie orientée commande shell"],["prompt en langage naturel","décrit la tâche de footprinting à générer"]]}]},{"name":"AI OSINT Toolkit","desc":"Le module cite Taranis AI, Cylect.io, ChatPDF, Bardeen.ai, DarkGPT, PenLink Cobwebs et Explore AI. L'examen peut surtout demander de reconnaître leur domaine d'usage plutôt que leur syntaxe.","cheat":[{"words":1,"title":"Association outil → usage","rows":[["Taranis AI","news / threat intelligence"],["Cylect.io","agrégation de bases OSINT"],["ChatPDF","analyse de PDF"],["Bardeen.ai","automatisation de collecte web"],["DarkGPT","bases fuitées"],["PenLink Cobwebs","investigations OSINT"],["Explore AI","recherche YouTube"]]}],"xref":[20]},{"name":"Python Recon Automation","desc":"Le script exemple du module orchestre plusieurs commandes depuis Python, notamment dig, whois et theHarvester. Le point pédagogique est l'automatisation d'un workflow de reconnaissance répétable plutôt qu'une nouvelle technique de collecte."}]}]},"port":{"groups":[{"g":"Ports à connaître dans ce module","items":[{"name":"43 — WHOIS","desc":"Le protocole Whois utilise TCP 43 pour interroger les informations d'enregistrement de domaines, blocs IP et autres ressources Internet.","tr":"tcp","exam":"WHOIS = TCP 43."},{"name":"53 — DNS","desc":"DNS utilise le port 53. Les requêtes DNS courantes utilisent principalement UDP ; TCP est notamment utilisé pour les transferts de zone AXFR et lorsque la réponse nécessite une connexion TCP.","tr":"both","exam":"Réflexe CEH : DNS = 53 ; AXFR = TCP 53.","xref":[3,4]},{"name":"80 / 443 — HTTP(S)","desc":"Les sites et applications web exposés sur HTTP/HTTPS sont une source majeure d'intelligence : pages, réponses du serveur, technologies, documents et contenu historique.","tr":"tcp","xref":[13,14]},{"name":"25 — SMTP","desc":"SMTP transporte les e-mails entre serveurs. En footprinting, l'infrastructure de messagerie, les en-têtes et les serveurs SMTP peuvent révéler des adresses IP, logiciels, routes et informations d'organisation.","tr":"tcp","xref":[4]}]}]},"contre":{"groups":[{"g":"Réduire l'exposition humaine","items":[{"name":"Politiques & sensibilisation","desc":"Encadrer ce que les employés peuvent publier ou communiquer à des tiers et les former contre l'ingénierie sociale. Le module recommande aussi de désactiver les comptes des personnes ayant quitté l'organisation et de limiter l'accès aux réseaux sociaux lorsque la politique l'exige.","cheat":[{"words":1,"title":"Mesures citées","rows":[["Security policies","définir les informations qui ne doivent pas être divulguées"],["Awareness","former contre social engineering et collecte d'informations"],["Leavers","désactiver ou supprimer les comptes après départ"],["Social networks","restreindre l'accès selon la politique interne"],["MFA","ajouter une couche de protection sur les comptes"]]}],"xref":[1,9]},{"name":"Limiter les informations publiques","desc":"Réduire les détails inutiles publiés sur le site, dans les communiqués, rapports, catalogues, blogs ou tableaux d'affichage. Les documents les plus critiques doivent rester hors ligne lorsqu'ils n'ont aucune raison d'être exposés.","cheat":[{"words":1,"title":"Réflexe","rows":[["Website","ne publier que ce qui est nécessaire"],["Press / annual reports","éviter les détails critiques non requis"],["Physical displays","aucune information sensible sur murs ou notice boards"],["Critical documents","garder hors ligne quand c'est possible"]]}]}]},{"g":"DNS, domaines & réseau","items":[{"name":"Split DNS & AXFR restriction","desc":"Séparer la vue DNS interne de la vue externe et n'autoriser les transferts de zone qu'entre serveurs DNS autorisés. L'objectif est d'empêcher un client externe de récupérer la nomenclature interne ou l'ensemble des enregistrements.","exam":"Contre-mesure AXFR : transfert uniquement vers les secondaires autorisés.","xref":[4]},{"name":"Réduire les services exposés","desc":"Le module recommande de ne pas activer de protocoles inutiles, de désactiver le directory listing et d'utiliser les mécanismes de filtrage appropriés dans une logique de défense en profondeur.","xref":[1,12]},{"name":"Masquer l'adresse source si nécessaire","desc":"Un VPN ou un proxy sécurisé peut masquer l'adresse IP publique d'origine vis-à-vis des services consultés et réduire l'exposition directe de l'utilisateur pendant certaines activités de navigation."}]},{"g":"Web, Whois & historique","items":[{"name":"Réduire la fuite du serveur web","desc":"Configurer les serveurs pour ne pas divulguer inutilement versions, détails techniques ou messages d'erreur trop verbeux. Le module cite également la réduction des informations exposées par banner grabbing.","xref":[13]},{"name":"Whois Privacy","desc":"Utiliser les mécanismes de confidentialité proposés par les registrars et éviter de publier des coordonnées directes lorsqu'elles ne sont pas nécessaires. L'objectif est de réduire les informations exploitables pour la reconnaissance et l'ingénierie sociale."},{"name":"Search Engine & Archive Exposure","desc":"Le module cite robots.txt / meta noindex pour limiter l'indexation ou la mise en cache de certaines pages, ainsi que la possibilité de demander la suppression d'un historique auprès d'archive.org.","exam":"Wayback Machine : suppression à demander à archive.org."}]},{"g":"Réseaux sociaux & données","items":[{"name":"Réduire l'empreinte numérique","desc":"L'organisation peut utiliser ses propres techniques de footprinting pour rechercher les informations sensibles déjà exposées puis les retirer lorsque possible. Le module recommande aussi d'éviter les cross-links inutiles entre domaines critiques.","cheat":[{"words":1,"title":"Mesures","rows":[["Self-footprinting","chercher ce qu'un attaquant peut déjà voir"],["Removal","retirer ou corriger les informations exposées"],["Cross-linking","éviter de relier inutilement des actifs sensibles"],["Captcha / rate limiting","limiter certaines collectes automatisées sur services publics"]]}]},{"name":"Géolocalisation & déplacements","desc":"Désactiver le geotagging lorsque inutile, limiter l'accès des applications à la géolocalisation et éviter de publier les déplacements ou projets de voyage. Ces informations peuvent être exploitées pour suivre une personne ou construire un scénario de social engineering."},{"name":"Protection de l'information","desc":"Le module recommande de chiffrer et protéger par mot de passe les informations sensibles afin qu'une exposition ou récupération du fichier ne fournisse pas immédiatement le contenu."}]},{"g":"Détection","items":[{"name":"Honeypots / Honeynets","desc":"Des honeypots ou honeynets peuvent être déployés pour attirer et détecter certaines activités de reconnaissance ou d'interaction avec des services leurres. Ils ne suppriment pas l'empreinte publique, mais peuvent fournir de la visibilité sur l'activité hostile.","xref":[12]}]}]}}},{"n":3,"t":"Scan de réseaux","data":{"concept":{"groups":[{"g":"Fondamentaux du scanning","items":[{"name":"Du footprinting au scanning","desc":"Le scanning part des informations obtenues pendant le footprinting : plages IP, domaines et systèmes potentiels. L'objectif est ensuite de vérifier activement ce qui existe réellement : quels hôtes répondent, quels ports sont accessibles, quels services écoutent et quelles versions sont utilisées. Ces résultats servent ensuite à rechercher des vulnérabilités pertinentes.","flow":"Footprinting → hôtes actifs → ports ouverts → services / versions → vulnérabilités potentielles","exam":"Le scanning nécessite une cible issue de la reconnaissance. Un port ouvert est un point de départ, pas une vulnérabilité en soi.","xref":[2,5]},{"name":"Network Scanning — définition & objectifs","desc":"Le network scanning est une reconnaissance active : l'attaquant envoie des sondes TCP/IP et analyse les réponses pour construire un profil technique de la cible. Il cherche les hôtes actifs, adresses IP, ports ouverts, services, versions, système d'exploitation, architecture et topologie afin d'identifier des points d'entrée et de préparer la suite du test.","cheat":[{"words":1,"title":"Objectifs","rows":[["Live hosts","quels systèmes sont actifs"],["Ports","quels points d'entrée réseau sont accessibles"],["Services / versions","quel logiciel écoute derrière chaque port"],["OS / architecture","fingerprinting du système cible"],["Vulnérabilités","faiblesses possibles associées aux composants détectés"],["Topologie","routeurs, switches, segments et interconnexions"]]}],"xref":[2,4,5]},{"name":"3 types de scanning","desc":"Le scanning se divise en trois objectifs. Le port scanning recherche les ports et services exposés. Le network scanning cherche d'abord les hôtes et adresses actives. Le vulnerability scanning va plus loin en recherchant des faiblesses connues sur les composants découverts.","cheat":[{"words":1,"title":"À distinguer","rows":[["Port scanning","ports ouverts et services en écoute"],["Network scanning","hôtes actifs et adresses IP"],["Vulnerability scanning","vulnérabilités connues et exploitabilité potentielle"]]}],"exam":"Ne pas confondre port ouvert et vulnérabilité : un service peut être exposé et correctement sécurisé."},{"name":"Plages de ports","desc":"Un port est un identifiant de couche 4 utilisé par le système d'exploitation pour remettre le trafic à l'application qui écoute. Un numéro de port tient sur 16 bits : il existe donc 65 536 valeurs possibles, de 0 à 65535.","cheat":[{"words":1,"title":"Catégories IANA","rows":[["0–1023","well-known / système"],["1024–49151","registered"],["49152–65535","dynamic / private / éphémères"]]}],"exam":"0–1023 / 1024–49151 / 49152–65535."},{"name":"Drapeaux TCP","desc":"Les scans TCP reposent sur la manière dont une pile réseau réagit à certaines combinaisons de drapeaux. SYN et ACK servent surtout à l'établissement et au suivi d'une connexion ; RST l'abandonne ; FIN termine proprement ; PSH pousse les données vers l'application ; URG indique des données prioritaires.","cheat":[{"words":1,"title":"Les 6 flags","rows":[["SYN","Synchronize — initie une connexion"],["ACK","Acknowledgement — confirme la réception"],["RST","Reset — interrompt/réinitialise la connexion"],["FIN","Finish — fin propre de transmission"],["PSH","Push — transmet immédiatement les données à l'application"],["URG","Urgent — le pointeur urgent est significatif"]]}],"exam":"SYN, ACK et RST sont les trois drapeaux les plus importants pour comprendre le port scanning.","xref":[1]},{"name":"3-Way Handshake & fermeture TCP","desc":"TCP est orienté connexion. Avant l'échange de données, le client envoie SYN avec son numéro de séquence ; le serveur répond SYN+ACK ; le client confirme par ACK. Une fermeture normale utilise quatre échanges car chaque sens se ferme indépendamment : FIN → ACK → FIN → ACK. Un RST coupe la session brutalement.","flow":"Ouverture : SYN → SYN/ACK → ACK\nFermeture : FIN → ACK → FIN → ACK","exam":"Toute la logique des scans SYN, Connect, FIN, Xmas et NULL découle de la réponse de la pile TCP à des paquets normaux ou anormaux.","xref":[1]},{"name":"États de ports Nmap","desc":"Nmap ne renvoie pas seulement open ou closed. Quand un filtre ou l'absence de réponse empêche de conclure, il utilise des états intermédiaires. L'état dépend du type de scan : un ACK scan, par exemple, sert à distinguer filtered/unfiltered et non open/closed.","cheat":[{"words":1,"title":"États","rows":[["open","une application écoute et accepte le type de sonde"],["closed","l'hôte répond mais aucun service n'écoute"],["filtered","un filtre empêche Nmap de déterminer l'état"],["unfiltered","port joignable mais open/closed indéterminé — typique ACK"],["open|filtered","silence : impossible de distinguer ouvert de filtré"],["closed|filtered","rare : impossible de distinguer fermé de filtré"]]}],"exam":"ACK scan → filtered/unfiltered ; Xmas/FIN/NULL donnent souvent open|filtered quand la cible reste silencieuse."},{"name":"Timing Nmap — T0 à T5","desc":"Les templates de timing règlent l'agressivité du scan. Les valeurs faibles ralentissent fortement les sondes et peuvent réduire la visibilité, tandis que les valeurs élevées accélèrent le scan au prix de davantage de bruit et parfois de fiabilité. T3 est le comportement normal par défaut.","cheat":[{"words":1,"title":"Templates","rows":[["T0 — paranoid","très lent"],["T1 — sneaky","lent / low-and-slow"],["T2 — polite","charge réduite"],["T3 — normal","défaut"],["T4 — aggressive","rapide, souvent utilisé sur réseau fiable"],["T5 — insane","très rapide, plus bruyant et moins tolérant aux pertes"]]}],"exam":"Low-and-slow = T0/T1 ; T3 = défaut ; T4 accélère nettement un scan sur un réseau fiable."}]},{"g":"Host Discovery","items":[{"name":"Host Discovery — principe","desc":"Avant de lancer un scan de ports coûteux, on cherche quels systèmes sont réellement actifs. Un hôte peut être découvert avec ARP, ICMP, TCP, UDP ou même des sondes de protocole IP. L'absence de réponse ne prouve pas qu'il est éteint : un firewall peut simplement bloquer la sonde.","exam":"Découverte d'hôte ≠ port scan. Ici, une réponse indiquant même un port fermé peut suffire à prouver que la machine est vivante."},{"name":"ARP Ping Scan","desc":"Sur le même segment Ethernet, Nmap envoie une requête ARP. Si une réponse ARP revient, l'hôte est actif. Comme ARP fonctionne en couche 2, ce mécanisme reste fiable même si l'ICMP est filtré. Nmap l'utilise par défaut sur un réseau local et peut aussi afficher la MAC et le constructeur.","syntax":"nmap -sn -PR 10.10.1.0/24","exam":"Sur un LAN local, ARP ping est le choix le plus fiable pour savoir si un hôte est présent."},{"name":"ICMP Ping & Ping Sweep","desc":"Le ping classique envoie un ICMP Echo Request (type 8) et attend un Echo Reply (type 0). Un ping sweep applique cette logique à une plage d'adresses. C'est simple mais pas infaillible : si l'ICMP est bloqué au périmètre, un hôte vivant peut sembler absent.","syntax":"nmap -sn -PE 10.10.1.11\nnmap -sn -PE 10.10.1.0/24","exam":"Echo Request = type 8 ; Echo Reply = type 0. Silence ne signifie pas nécessairement 'host down'."},{"name":"ICMP Timestamp & Address Mask","desc":"Nmap peut utiliser d'autres requêtes ICMP lorsque l'Echo est filtré. -PP envoie une requête Timestamp et -PM une requête Address Mask. Le but reste identique : obtenir une réponse qui prouve que la pile IP de la cible est active.","syntax":"nmap -sn -PP 10.10.1.11\nnmap -sn -PM 10.10.1.11"},{"name":"TCP SYN Ping","desc":"Un SYN ping ne cherche pas d'abord à classer le port : il cherche à prouver que l'hôte existe. Nmap envoie un SYN, généralement vers le port 80 par défaut. SYN/ACK si le port est ouvert ou RST s'il est fermé : dans les deux cas, la machine a répondu et est donc vivante.","syntax":"nmap -sn -PS 10.10.1.11\nnmap -sn -PS22-25,80,113,1050,35000 10.10.1.11","exam":"SYN/ACK OU RST = hôte vivant. Ici on ne cherche pas encore l'état du port."},{"name":"TCP ACK Ping","desc":"Nmap envoie un ACK non sollicité vers la cible. Une pile TCP active répond normalement par RST, ce qui confirme que l'hôte existe. Cette technique peut traverser certains filtres stateless qui bloquent les SYN entrants mais laissent passer des paquets ressemblant à du trafic de retour.","syntax":"nmap -sn -PA 10.10.1.11","xref":[12]},{"name":"UDP Ping","desc":"Une sonde UDP peut également servir à la découverte d'hôtes. Une réponse UDP ou certains messages d'erreur ICMP prouvent que la pile IP est active. Nmap utilise le port UDP 40125 par défaut pour cette sonde.","syntax":"nmap -sn -PU 10.10.1.11","exam":"UDP ping Nmap : port de sonde par défaut = 40125."},{"name":"IP Protocol Ping","desc":"Au lieu de sonder un port TCP ou UDP, Nmap peut envoyer des paquets correspondant à différents numéros de protocoles IP. Une réponse associée à l'un de ces protocoles permet de conclure que l'hôte est vivant.","syntax":"nmap -sn -PO 10.10.1.11"}]},{"g":"Port Scanning & réponses","items":[{"name":"Lecture des réponses TCP vs UDP","desc":"En TCP, une sonde SYN donne une réponse très nette : SYN/ACK signifie qu'un service accepte la connexion ; RST signifie qu'aucun service n'écoute. En UDP, il n'y a pas de handshake : une réponse applicative confirme l'ouverture, ICMP Port Unreachable confirme la fermeture, mais le silence reste ambigu.","cheat":[{"words":1,"title":"Réponses essentielles","rows":[["TCP ouvert","SYN → SYN/ACK"],["TCP fermé","SYN → RST"],["UDP ouvert","réponse applicative possible, parfois silence"],["UDP fermé","ICMP Destination Unreachable / Port Unreachable"]]}],"exam":"UDP est plus
