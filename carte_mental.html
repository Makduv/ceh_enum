t dépendre d’une authentification locale telle que PIN, mot de passe, pattern ou biométrie. Les clés restent dans un stockage non lisible directement par l’application."},{"name":"iOS Keychain","desc":"Mécanisme iOS pour stocker de petites quantités de données sensibles et des clés. Il est associé à un stockage matériel chiffré AES‑256, à l’authentification Touch ID/Face ID/passcode et à des ACL définissant quelles applications peuvent accéder aux éléments."},{"name":"KeyStore vs Keychain","desc":"Les deux fournissent un mécanisme système dédié aux secrets plutôt qu’un simple fichier applicatif. Android KeyStore se concentre sur la création/importation et l’accès authentifié aux clés ; iOS Keychain associe stockage de petits secrets, chiffrement matériel et contrôle d’accès applicatif.","exam":"Secrets mobiles → utiliser KeyStore/Keychain plutôt qu’un stockage en clair."}]}]},"outil":{"groups":[{"g":"Android — contrôle & exploitation","items":[{"name":"Kali NetHunter","desc":"Plateforme de penetration testing mobile. Les fonctions citées incluent MAC Changer, HID attacks, Bad USB MITM, MANA Wireless Toolkit et outils MITM.","xref":[16]},{"name":"KingoRoot","desc":"Outil de rooting Android disponible en mode PC ou directement sur l’appareil. Le workflow avec PC passe par USB debugging ; sans PC, l’APK est installé puis l’option de root est lancée."},{"name":"4ukey","desc":"Outil cité pour contourner Factory Reset Protection sur Android. Le workflow consiste à connecter le terminal verrouillé, sélectionner la suppression du Google Lock/FRP puis suivre les étapes propres à la version Android."},{"name":"Octoplus FRP","desc":"Outil cité pour le contournement de FRP sur des appareils Android."},{"name":"msfvenom","desc":"Générateur de payloads Metasploit cité parmi les outils Android. Il peut produire différents formats et types de payloads selon la plateforme.","xref":[6,7]},{"name":"LOIC mobile","desc":"Application mobile citée pour générer du trafic DoS/DDoS UDP, HTTP tion centralisée des appareils mobiles."},{"name":"ManageEngine Mobile Device Manager Plus","desc":"Solution MDM citée pour la gestion des terminaux mobiles."},{"name":"Microsoft Intune","desc":"Solution MDM citée pour l’application de politiques, la gestion et le suivi de terminaux."},{"name":"SOTI MobiControl","desc":"Solution MDM citée pour l’administration de la flotte mobile."},{"name":"AppTec360","desc":"Solution MDM citée pour la gestion des terminaux."},{"name":"Jamf Pro","desc":"Solution MDM citée, particulièrement associée à la gestion d’appareils Apple."}]},{"g":"Protection mobile — outils","items":[{"name":"Malwarebytes Mobile Security","desc":"Solution de sécurité mobile citée pour iOS."},{"name":"Norton Mobile Security for iOS","desc":"Solution de sécurité mobile citée pour iOS."},{"name":"McAfee Mobile Security","desc":"Solution de sécurité mobile citée pour iOS."},{"name":"Trend Micro Mobile Security","desc":"Solution de sécurité mobile citée pour iOS."},{"name":"AVG Mobile Security","desc":"Solution de sécurité mobile citée pour iOS."},{"name":"Kaspersky Standard / Antivirus","desc":"Solution de sécurité mobile citée dans les recommandations Android/iOS."}]}]},"port":{"groups":[{"g":"Connectivité mobile & radio","items":[{"name":"3G / 4G / 5G","desc":"Réseaux cellulaires faisant partie de la surface d’attaque et des canaux de transmission d’un smartphone."},{"name":"GSM / 3GPP baseband","desc":"Pile/processeur radio du téléphone utilisée pour les communications avec les antennes cellulaires ; cible des baseband attacks."},{"name":"SMS","desc":"Canal de messagerie mobile utilisé notamment dans le SMiShing, Simjacker et l’envoi d’OTP."},{"name":"SIM","desc":"Module d’identité de l’abonné mobile. Il intervient dans des scénarios comme Simjacker, le transfert de numéro et l’interception de codes d’authentification envoyés au téléphone."},{"name":"Wi‑Fi","desc":"Canal réseau mobile majeur ; le risque principal traité ici est l’usage de réseaux publics/ro ,{"name":"XAPK","desc":"Format Android pris en charge par MobSF."},{"name":"IPA","desc":"Format d’application iOS pris en charge par MobSF."},{"name":"APPX","desc":"Format d’application pris en charge par MobSF."},{"name":"SQLite","desc":"Base locale structurée utilisée par Android pour le stockage applicatif."},{"name":"Android KeyStore","desc":"Service système Android de gestion/stockage sécurisé des clés."},{"name":"iOS Keychain","desc":"Service iOS dédié au stockage de petits secrets et clés avec contrôle d’accès."}]}]},"contre":{"groups":[{"g":"OWASP Mobile Top 10 — remédiations","items":[{"name":"M1 — protéger les credentials","desc":"Ne pas coder les identifiants en dur ; chiffrer les credentials pendant leur transmission ; utiliser des access tokens révocables et des protocoles d’authentification robustes."},{"name":"M2 — sécuriser la supply chain","desc":"Utiliser une signature et une distribution d’applications sécurisées et n’intégrer que des bibliothèques tierces approuvées et validées."},{"name":"M3 — renforcer AuthN/AuthZ","desc":"Éviter les schémas d’authentification faibles et renforcer les contrôles côté serveur pour vérifier identité et autorisation."},{"name":"M4 — valider les entrées/sorties","desc":"Appliquer une validation stricte des entrées et sorties, des contrôles d’intégrité et des pratiques de développement sécurisé."},{"name":"M5 — sécuriser les communications","desc":"Utiliser des certificats émis par une autorité de confiance, vérifier leur validité et faire échouer la connexion lorsqu’une vérification ne passe pas."},{"name":"M6 — protéger la vie privée","desc":"Contrôler l’accès aux PII avec AuthN/AuthZ adaptées et utiliser des outils d’analyse statique/dynamique pour vérifier les fuites de données."},{"name":"M7 — protéger les binaires","desc":"Utiliser obfuscation, anti-tampering, contrôles d’intégrité et validation côté backend plutôt que de faire confiance au seul binaire local."},{"name":"M8 — corriger les mauvaises configurations","desc":"Supprimer les credentials par défaut codés en dur et désactiver les fonctions de debug en production."},{"name":"M9 — sécuriser le stockage","desc":"Stocker les informations sensibles dans des emplacements à accès restreint et maintenir bibliothèques, frameworks et dépendances à jour."},{"name":"M10 — crypto robuste","desc":"Utiliser des algorithmes de chiffrement robustes avec des longueurs de clés suffisantes et des fonctions de hachage adaptées telles que SHA‑256 ou bcrypt selon l’usage."}]},{"g":"Android — durcissement","items":[{"name":"Activer un écran de verrouillage","desc":"Utiliser PIN, mot de passe, pattern ou biométrie afin de limiter l’accès physique au terminal."},{"name":"Ne pas rooter le terminal","desc":"Éviter le rooting sur les appareils utilisés normalement : il contourne le modèle de privilèges et augmente l’impact d’une compromission."},{"name":"Utiliser le store officiel","desc":"Installer les applications depuis le marché officiel et éviter les APK obtenus directement depuis des sources non approuvées."},{"name":"Mettre Android à jour","desc":"Appliquer régulièrement les mises à jour du système pour réduire l’exposition aux vulnérabilités connues."},{"name":"Activer le chiffrement","desc":"Utiliser les fonctions de chiffrement du terminal pour protéger les données stockées localement."},{"name":"Protection antimalware","desc":"Maintenir une solution de sécurité mobile à jour lorsque la politique de l’organisation l’exige."},{"name":"Protéger les applications sensibles","desc":"Ajouter une authentification locale ou des protections supplémentaires aux applications contenant SMS, email ou données sensibles."},{"name":"Informations de propriétaire écran verrouillé","desc":"Configurer l’écran verrouillé avec des informations permettant le retour d’un appareil perdu sans exposer de données sensibles."}]},{"g":"iOS — durcissement","items":[{"name":"Find My iPhone + remote wipe","desc":"Activer Find My iPhone et utiliser l’effacement à distance lorsqu’un terminal est perdu ou volé."},{"name":"Jailbreak detection","desc":"Détecter les appareils jailbreakés afin de bloquer ou limiter leur accès aux ressources sensibles."},{"name":"Contrôler iCloud pour les données entreprise","desc":"Désactiver les services iCloud lorsque des données d’entreprise ne doivent pas être sauvegardées dans le cloud."},{"name":"Ask to Join Networks","desc":"Activer la demande avant connexion à un nouveau réseau pour limiter les associations automatiques à des réseaux non approuvés."},{"name":"Mises à jour iOS","desc":"Appliquer régulièrement les correctifs et nouvelles versions du système."},{"name":"Erase Data après 10 échecs","desc":"Configurer l’effacement de l’appareil après dix tentatives de code échouées lorsque la politique de risque le justifie."},{"name":"Désactiver Voice Dial","desc":"Désactiver les fonctions vocales accessibles depuis l’écran verrouillé lorsqu’elles ne sont pas nécessaires."},{"name":"Effacer Keyboard Cache","desc":"Réinitialiser le dictionnaire/clavier lorsqu’il existe un risque que des données sensibles aient été apprises ou conservées."},{"name":"Désactiver Geotagging","desc":"Empêcher l’ajout automatique d’informations de localisation aux photos lorsqu’elles ne sont pas nécessaires."},{"name":"Durcir Safari","desc":"Activer les protections de navigateur appropriées : blocage des pop-ups, contrôle d’AutoFill et avertissement de site frauduleux."},{"name":"Désactiver Bluetooth/Wi‑Fi inutilisés","desc":"Réduire la surface radio en coupant les interfaces lorsqu’elles ne sont pas nécessaires."},{"name":"Désactiver Siri / AutoFill si nécessaire","desc":"Limiter les fonctions accessibles depuis l’écran verrouillé et la saisie automatique selon la politique de l’organisation."}]},{"g":"MDM & BYOD — contrôles","items":[{"name":"Passcode Enforcement","desc":"Imposer un code de verrouillage conforme à la politique de l’entreprise."},{"name":"Remote Lock","desc":"Pouvoir verrouiller à distance un appareil perdu ou suspect."},{"name":"Remote Wipe","desc":"Pouvoir effacer à distance les données d’un terminal perdu/volé."},{"name":"Root/Jailbreak Detection","desc":"Détecter les terminaux qui ont contourné les protections du système et appliquer une politique adaptée."},{"name":"Policy Enforcement & Inventory","desc":"Maintenir un inventaire centralisé et appliquer automatiquement les politiques de configuration."},{"name":"Monitoring & Reporting","desc":"Surveiller l’état des terminaux et produire des rapports de conformité en temps réel."},{"name":"Séparer données personnelles / professionnelles","desc":"Utiliser des mécanismes de séparation afin que le chiffrement ou le remote wipe puissent cibler les données d’entreprise sans effacer inutilement les données privées."},{"name":"Réseau BYOD isolé","desc":"Traiter les appareils BYOD comme externes et isoler leur réseau ; l’accès aux ressources internes peut être réalisé via VPN."},{"name":"Éviter les réseaux publics non sûrs","desc":"Privilégier le réseau cellulaire ou un VPN lorsque le Wi‑Fi public ne peut pas être considéré comme fiable."},{"name":"Effacement avant mise au rebut","desc":"S’assurer que les données professionnelles sont réellement supprimées avant revente, recyclage ou changement d’utilisateur."}]},{"g":"Protection des données & usages","items":[{"name":"Android KeyStore","desc":"Stocker les clés dans le mécanisme sécurisé du système plutôt que dans des fichiers accessibles à l’application."},{"name":"iOS Keychain","desc":"Utiliser le Keychain pour les petits secrets et clés avec contrôle d’accès et authentification locale."},{"name":"Masquer les notifications verrouillées","desc":"Empêcher l’affichage de données sensibles, OTP ou contenus métier sur l’écran verrouillé."},{"name":"Configurer AutoFill prudemment","desc":"Limiter la saisie automatique afin d’éviter l’exposition involontaire de credentials ou données sensibles."},{"name":"Limiter diagnostics / usage data","desc":"Désactiver la collecte de diagnostics ou données d’usage lorsque la politique de confidentialité l’exige."},{"name":"Durcir les permissions navigateur","desc":"Configurer les autorisations du navigateur selon les besoins métiers et refuser les accès non nécessaires."},{"name":"Contrôler appareils & applications","desc":"Définir quelles applications et quels périphériques peuvent être utilisés avec les données professionnelles ; les clés USB peuvent notamment être interdites par politique."},{"name":"Verrouiller l’appareil","desc":"Utiliser le bouton de verrouillage lorsque le terminal n’est pas utilisé afin de réduire l’exposition physique."},{"name":"Vérifier l’emplacement des impressions","desc":"Pour les données sensibles, s’assurer que l’impression arrive sur le bon équipement et n’est pas laissée sans surveillance."},{"name":"MFA","desc":"Imposer une authentification multifacteur pour réduire l’impact d’un mot de passe compromis."},{"name":"Se déconnecter des applications","desc":"Fermer explicitement les sessions applicatives après usage afin de limiter la réutilisation d’une session active."},{"name":"Utiliser TLS","desc":"Protéger les communications sensibles avec des protocoles chiffrés et correctement validés."},{"name":"VPN sur réseau non fiable","desc":"Éviter les Wi‑Fi publics sans protection supplémentaire ; utiliser un VPN pour l’accès aux ressources sensibles."}]}]}}},{"n":18,"t":"IoT et OT (fondations partielles)","partial":true,"data":{"concept":{"groups":[{"g":"Fondations","items":[{"name":"IoT — définition","desc":"Objets du quotidien avec logiciel embarqué + accès réseau : caméras, thermostats, appareils domestiques, DVR, etc."},{"name":"Faiblesses IoT","desc":"Identifiants par défaut/hardcodés, absence de mécanisme de patch, longue durée de vie et faible visibilité après déploiement."},{"name":"IoT botnets","desc":"Les objets vulnérables deviennent des cibles privilégiées pour les botnets ; Mirai est l'exemple cité."},{"name":"OT / ICS / SCADA","desc":"Équivalent industriel : vulnérabilités similaires mais avec potentiel de conséquences physiques."}]}]},"outil":{"groups":[{"g":"Plateforme citée","items":[{"name":"Azure IoT Hub","desc":"Exemple de hub cloud pour connecter, gérer et analyser des objets IoT."}]}]},"port":{"groups":[{"g":"Ports & protocoles","items":[]}]},"contre":{"groups":[{"g":"Source actuelle","items":[]}]}}},{"n":19,"t":"Cloud computing (fondations partielles)","partial":true,"data":{"concept":{"groups":[{"g":"Service models","items":[{"name":"STaaS","desc":"Storage as a Service : stockage distant, par ex. iCloud, Google Drive, Dropbox, S3.","exam":"STaaS ≠ SaaS."},{"name":"IaaS","desc":"Le fournisseur gère infrastructure/virtualisation/réseau ; le client gère OS, runtime, applications et données."},{"name":"PaaS","desc":"Le fournisseur gère aussi OS/runtime/middleware ; le client déploie surtout applications et données."},{"name":"SaaS","desc":"Application finie fournie via le réseau ; le client gère essentiellement ses données et accès."}]},{"g":"Responsabilité & déploiement","items":[{"name":"Shared responsibility model","desc":"Le fournisseur sécurise l'infrastructure du cloud ; le client reste responsable de ses données, identités et configurations."},{"name":"Deployment models","desc":"Public, private, hybrid, community."}]}]},"outil":{"groups":[{"g":"Exemples de services","items":[{"name":"IaaS examples","desc":"Amazon EC2, Microsoft Azure, Google Cloud, DigitalOcean."},{"name":"PaaS examples","desc":"Azure SQL, Heroku, App Engine, RDS."},{"name":"SaaS examples","desc":"Google Docs, Office Online, Salesforce, Microsoft 365."}]}]},"port":{"groups":[{"g":"Ports & protocoles","items":[]}]},"contre":{"groups":[{"g":"Responsabilité client","items":[{"name":"Éviter les mauvaises configurations","desc":"Le Chapter cite notamment buckets ouverts, ports de management exposés et rôles IAM trop permissifs comme causes fréquentes de compromission cloud."}]}]}}},{"n":20,"t":"Cryptographie"}];

}

function categoryNode(gN,cat,x,y,total,expanded=false,w=310,h=76){
  const g=el("g",{class:"node cat",tabindex:"0",role:"button","aria-expanded":String(expanded)},gN);
  el("rect",{x:x-w/2,y:y-h/2,width:w,height:h,fill:cat.color,class:"frame"},g);
  el("text",{x:x-w/2+20,y:y-3},g).textContent=cat.label;
  el("text",{x:x-w/2+20,y:y+18,class:"card-sub"},g).textContent=total+" fiche"+(total>1?"s":"");
  el("text",{x:x+w/2-20,y:y+7,"text-anchor":"end",class:"count"},g).textContent=expanded?"−":"+";
  return g;
}

function itemNode(gN,it,cat,x,y,w=350,h=48){
  const rawLabel=(it.exam?"★ ":"")+it.name;
  const label=rawLabel.length>44?rawLabel.slice(0,43)+"…":rawLabel;
  const suffix=(it.xref?"↔ ":"")+(it.tr?TR[it.tr].t:"");
  const q=state.query.toLowerCase(),match=q&&blobOf(it).includes(q);
  let cls="node leaf";
  if(state.sel===it)cls+=" sel";
  if(q)cls+=match?" match":" dim";
  const g=el("g",{class:cls,tabindex:"0",role:"button","aria-label":it.name},gN);
  el("rect",{x:x-w/2,y:y-h/2,width:w,height:h,class:"frame"},g);
  el("text",{x:x-w/2+14,y:y+5},g).textContent=label;
  if(suffix){
    const t=el("text",{x:x+w/2-12,y:y+5,"text-anchor":"end",class:"tag"},g);
    t.textContent=suffix;
    t.setAttribute("fill",state.sel===it?"var(--paper)":(it.tr?TR[it.tr].c:"var(--ink-faint)"));
  }
  const open=()=>{state.sel=it;showDetail(it,cat);draw()};
  g.onclick=open;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}};
  return g;
}

function draw(){
  $map.innerHTML=""; stat();
  const m=modByN(state.mod);
  const openCat=[...state.open][0]||null;
  const deep=!!state.group;
  const cat=CATS.find(c=>c.key===openCat);
  $back.classList.toggle("on",!!openCat);
  $back.textContent=deep?"← Revenir aux groupes":"← Revenir aux 4 catégories";

  if(!m.data){
    setView(1400,860);
    const gN=el("g",{},$map);
    coreNode(gN,m,700,400);
    el("text",{x:700,y:520,"text-anchor":"middle",fill:"var(--ink-faint)","font-size":"14"},gN)
      .textContent="Module non encore alimenté — ajoute le cours correspondant.";
    return;
  }

  const gE=el("g",{},$map),gN=el("g",{},$map);

  // NIVEAU 1 — uniquement le module + les 4 catégories.
  if(!openCat){
    setView(1400,860);
    const cx=700,cy=430;
    coreNode(gN,m,cx,cy,330,86);

    const pos={
      concept:[270,205],
      outil:[1130,205],
      port:[270,655],
      contre:[1130,655]
    };
    CATS.forEach(c=>{
      const [x,y]=pos[c.key],total=allItems(m.data[c.key]).length;
      // orthogonal connector, intentionally simple and non-overlapping
      const dir=x<cx?-1:1, vdir=y<cy?-1:1;
      const sx=cx+dir*165, sy=cy+vdir*18;
      const ex=x-dir*155, ey=y;
      const midx=(sx+ex)/2;
      el("path",{class:"edge",d:`M${sx},${sy} H${midx} V${ey} H${ex}`},gE);
      const node=categoryNode(gN,c,x,y,total,false,310,82);
      const act=()=>{state.open=new Set([c.key]);state.group=null;state.sel=null;closePanel();draw()};
      node.onclick=act; node.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}};
    });
    el("text",{x:700,y:785,"text-anchor":"middle",class:"grid-note"},gN)
      .textContent="Clique une catégorie pour ouvrir ses groupes · aucune branche n'est déployée au départ";
    return;
  }

  const raw=m.data[openCat];
  const grouped=isGrouped(raw);
  const groups=grouped?raw.groups:null;

  // NIVEAU 2 — catégorie → groupes (ou fiches si catégorie non groupée)
  if(!deep){
    const entries=grouped?groups:raw;
    const cols=grouped?3:3;
    const rows=Math.ceil(entries.length/cols);
    const H=Math.max(820,360+rows*(grouped?112:78));
    setView(1500,H);
    coreNode(gN,m,750,68,330,68);
    el("path",{class:"edge on",d:"M750,102 V140"},gE);
    const catNode=categoryNode(gN,cat,750,188,allItems(raw).length,true,350,76);
    const closeCat=()=>{state.open.clear();state.group=null;state.sel=null;closePanel();draw()};
    catNode.onclick=closeCat;catNode.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();closeCat()}};

    const left=150,top=330,gapX=430,stepY=112;
    if(grouped){
      const trunkY=278;
      el("path",{class:"edge on",d:`M750,226 V${trunkY}`},gE);
      entries.forEach((grp,i)=>{
        const col=i%cols,row=Math.floor(i/cols),x=left+190+col*gapX,y=top+row*stepY;
        el("path",{class:"edge",d:`M750,${trunkY} H${x} V${y-34}`},gE);
        const w=380,h=64;
        const node=el("g",{class:"node grp",tabindex:"0",role:"button"},gN);
        el("rect",{x:x-w/2,y:y-h/2,width:w,height:h,stroke:cat.color,class:"frame"},node);
        const lbl=grp.g.length>39?grp.g.slice(0,38)+"…":grp.g;
        const t=el("text",{x:x-w/2+16,y:y-4},node);t.textContent=lbl;t.setAttribute("fill",cat.color);
        const sub=el("text",{x:x-w/2+16,y:y+18,class:"count"},node);sub.textContent=grp.items.length+" fiches";sub.setAttribute("fill",cat.color);
        const arrow=el("text",{x:x+w/2-18,y:y+6,"text-anchor":"end",class:"count"},node);arrow.textContent="→";arrow.setAttribute("fill",cat.color);
        const go=()=>{state.group={cat:cat.key,i};state.sel=null;closePanel();draw()};
        node.onclick=go;node.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
      });
    }else{
      entries.forEach((it,i)=>{
        const col=i%cols,row=Math.floor(i/cols),x=180+190+col*430,y=top+row*78;
        itemNode(gN,it,cat,x,y,390,50);
      });
    }
    return;
  }

  // NIVEAU 3 — groupe → fiches en grille régulière.
  const grp=groups[state.group.i],items=grp.items;
  const cols=4,rows=Math.ceil(items.length/cols);
  const H=Math.max(850,430+rows*78);
  setView(1800,H);
  coreNode(gN,m,900,60,340,64);
  el("path",{class:"edge on",d:"M900,92 V128"},gE);
  categoryNode(gN,cat,900,164,allItems(raw).length,true,340,64);
  el("path",{class:"edge on",d:"M900,196 V224"},gE);

  const gw=500,gh=66,gy=260;
  const gn=el("g",{class:"node grp open"},gN);
  el("rect",{x:900-gw/2,y:gy-gh/2,width:gw,height:gh,stroke:cat.color,class:"frame"},gn);
  el("text",{x:900,y:gy-4,"text-anchor":"middle"},gn).textContent=grp.g;
  el("text",{x:900,y:gy+18,"text-anchor":"middle",class:"count"},gn).textContent=items.length+" fiches";
  const backGroup=()=>{state.group=null;state.sel=null;closePanel();draw()};
  gn.onclick=backGroup;gn.setAttribute("tabindex","0");gn.setAttribute("role","button");
  gn.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();backGroup()}};

  const startX=240,stepX=440,startY=390,stepY=78;
  items.forEach((it,i)=>{
    const col=i%cols,row=Math.floor(i/cols),x=startX+col*stepX,y=startY+row*stepY;
    itemNode(gN,it,cat,x,y,400,50);
  });
  el("text",{x:900,y:H-34,"text-anchor":"middle",class:"grid-note"},gN)
    .textContent="★ = notion avec rappel / réflexe examen dans sa fiche";
}

function openPanel(){$shell.classList.add("panel-open")}
function closePanel(){$shell.classList.remove("panel-open");$panel.innerHTML=""}

function showGroup(grp,cat){
  openPanel();
  let h=`<div class="panel-in"><button class="close" aria-label="Fermer">×</button>`;
  h+=`<p class="kind" style="color:${cat.color}">${cat.label}</p><h3>${esc(grp.g)}</h3>`;
  h+=`<p>${grp.items.length} fiches dans ce groupe.</p>`;
  grp.items.forEach((it,i)=>h+=`<button class="result" data-g="${i}">${esc(it.name)}<span class="meta">${esc((it.desc||"").slice(0,90))}…</span></button>`);
  h+=`</div>`;
  $panel.innerHTML=h;
  $panel.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    state.sel=grp.items[+b.dataset.g];showDetail(state.sel,cat);draw();
  });
  wirePanel();
}

function showDetail(it,cat){
  openPanel();
  let h=`<div class="panel-in"><button class="close" aria-label="Fermer">×</button>`;
  h+=`<p class="kind" style="color:${cat.color}">${cat.label}</p><h3>${esc(it.name)}</h3>`;
  if(it.tr&&it.tr!=="n/a"){
    const parts=it.tr==="both"?[["TCP","var(--tcp)"],["UDP","var(--udp)"]]:[[TR[it.tr].t,TR[it.tr].c]];
    h+=`<div class="transport">`+parts.map(([t,c])=>`<b style="background:${c}">${t}</b>`).join("")+`</div>`;
  }
  h+=`<p>${esc(it.desc)}</p>`;
  if(it.flow)h+=`<div class="flow">${esc(it.flow)}</div>`;
  if(it.syntax)h+=`<div class="syntax">${esc(it.syntax)}</div>`;
  (it.cheat||[]).forEach(sec=>{
    h+=`<h4>${esc(sec.title)}</h4><dl class="sheet${sec.words?" words":""}">`;
    sec.rows.forEach(([k,v])=>h+=`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`);
    h+=`</dl>`;
  });
  if(it.exam)h+=`<p class="exam">${esc(it.exam)}</p>`;
  if(it.xref){
    h+=`<h4>Revient aussi dans</h4><div class="xlinks">`;
    it.xref.forEach(n=>{const m=modByN(n);if(m)h+=`<button data-go="${n}">${String(n).padStart(2,"0")} · ${esc(m.t)}</button>`});
    h+=`</div>`;
  }
  h+=`</div>`;
  $panel.innerHTML=h;wirePanel();
}

function showSearch(q){
  const res=[];
  MODULES.forEach(m=>{
    if(!m.data)return;
    CATS.forEach(c=>allItems(m.data[c.key]).forEach(it=>{if(blobOf(it).includes(q))res.push({it,c,m})}));
  });
  document.getElementById("hits").textContent=res.length?res.length+" résultat"+(res.length>1?"s":""):"aucun";
  openPanel();
  let h=`<div class="panel-in"><button class="close" aria-label="Fermer">×</button>`;
  h+=`<p class="kind" style="color:var(--ink-faint)">Recherche transverse</p><h3>« ${esc(q)} »</h3>`;
  if(!res.length)h+=`<p>Rien trouvé dans les modules actuellement alimentés.</p>`;
  else res.forEach((r,i)=>h+=`<button class="result" data-r="${i}">${esc(r.it.name)}<span class="meta">Module ${String(r.m.n).padStart(2,"0")} · ${r.c.label}</span></button>`);
  h+=`</div>`;
  $panel.innerHTML=h;
  $panel.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=res[+b.dataset.r];
    state.mod=r.m.n;state.open=new Set([r.c.key]);state.sel=r.it;state.group=null;
    const raw=r.m.data[r.c.key];
    if(isGrouped(raw)){
      const gi=raw.groups.findIndex(g=>g.items.includes(r.it));
      if(gi>=0)state.group={cat:r.c.key,i:gi};
    }
    document.querySelectorAll(".mod").forEach(x=>x.setAttribute("aria-current",x.dataset.n==String(r.m.n)?"true":"false"));
    draw();showDetail(r.it,r.c);
  });
  wirePanel();draw();
}

function wirePanel(){
  const c=$panel.querySelector(".close");
  if(c)c.onclick=()=>{state.sel=null;closePanel();draw()};
  $panel.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>selectModule(+b.dataset.go));
}

$back.onclick=()=>{
  if(state.group){state.group=null;state.sel=null;closePanel();draw();return}
  state.open.clear();state.group=null;state.sel=null;closePanel();draw();
};

let timer;
document.getElementById("q").addEventListener("input",e=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{
    state.query=e.target.value.trim();
    if(state.query.length<2){state.query="";document.getElementById("hits").textContent="";closePanel();draw();return}
    showSearch(state.query.toLowerCase());
  },180);
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){state.sel=null;closePanel();draw();}
  if(e.key==="/" && document.activeElement!==document.getElementById("q")){e.preventDefault();document.getElementById("q").focus();}
});

selectModule(13);
</script>
</body>
</html>
