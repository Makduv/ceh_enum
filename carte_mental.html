 être actif avant l’exécution côté cible.","syntax":"use exploit/multi/handler\nset PAYLOAD <matching payload>\nset LHOST <ip>\nset LPORT <port>\nexploit"},{"name":"Netcat listener","desc":"Pour un reverse shell simple ne nécessitant pas Meterpreter, netcat peut écouter sur le port choisi avant l’exécution du payload.","syntax":"netcat -lvnp 4444"},{"name":"chmod","desc":"Sur Linux, le binaire ELF généré doit posséder le droit d’exécution avant de pouvoir être lancé.","syntax":"chmod +x payload\n./payload"},{"name":"Crypters cités","desc":"Le module cite plusieurs crypters à reconnaître : AttackerCrypter, Muck Crypter, Pure Crypter, DarkTortilla et Line Crypter. Leur rôle commun est de transformer le binaire pour réduire sa détection."},{"name":"Worm construction tools","desc":"Le module cite Internet Worm Maker Thing et Batch Worm Generator comme exemples historiques d’outils de création de worms. Pour la révision, le nom et la fonction générale suffisent."}]},{"g":"C2 / infrastructure","items":[{"name":"Cobalt Strike","desc":"Outil commercial de red team utilisé comme framework C2. Son agent est BEACON et les opérateurs se connectent à un team server commun."},{"name":"BEACON","desc":"Agent/payload Cobalt Strike chargé de communiquer avec le team server. Les canaux cités sont HTTP, HTTPS, DNS et SMB."},{"name":"Malleable C2 Profile","desc":"Profil qui modifie l’apparence du trafic BEACON afin qu’il ressemble davantage à un trafic attendu. L’objectif est d’adapter le format de la communication C2."},{"name":"Node.js / Express / REST","desc":"Technologies citées pour illustrer un C2 web : Node.js exécute le serveur JavaScript, Express gère les requêtes, et REST utilise des endpoints URL pour exposer les fonctions."}]}]},"port":{"groups":[{"g":"Ports de Trojans cités","items":[{"name":"20 / 22 / 80 / 443 — Emotet","desc":"Ports cités comme pouvant être utilisés par Emotet."},{"name":"21/TCP — FTP","desc":"Port associé dans le tableau aux Trojans Blade Runner, Doly Trojan, Fore, WinCrash et DarkFTP."},{"name":"22/TCP — SSH","desc":"Port cité pour Shaft, SSH RAT et Linux Rabbit."},{"name":"23/TCP — Telnet","desc":"Port cité pour Tiny Telnet Server et EliteWrap."},{"name":"25/TCP — SMTP","desc":"Port cité pour Antigen, Terminator, Lazarus Group et Night Dragon."},{"name":"53 — DNS","desc":"Port cité pour Denis, Ebury, FIN7, Lazarus Group et RedLeaves. DNS peut aussi servir de canal C2."},{"name":"3389/TCP — RDP","desc":"RDP peut être utilisé pour l’accès distant à une machine compromise."},{"name":"6666/TCP — RAT","desc":"Port cité pour KilerRat et Houdini RAT."},{"name":"6667 / 12349 — Bionet / Magic Hound","desc":"Ports cités dans le tableau des Trojans."}]},{"g":"Protocoles C2","items":[{"name":"80/TCP — HTTP","desc":"HTTP peut transporter du C2 web et se confondre avec du trafic de navigation."},{"name":"443/TCP — HTTPS","desc":"HTTPS peut transporter du C2 chiffré et traverser plus facilement les politiques autorisant le Web."},{"name":"53 — DNS","desc":"DNS peut transporter des commandes ou données encodées dans les requêtes/réponses."},{"name":"445/TCP — SMB","desc":"SMB est cité comme canal BEACON/C2 interne ; le port SMB direct est 445."},{"name":"IRC","desc":"Canal historique de botnets : les bots rejoignent un channel et reçoivent leurs commandes."}]}]},"contre":{"groups":[{"g":"Prévention générale","items":[{"name":"Réduire les vecteurs d’entrée","desc":"Ne pas ouvrir de pièces jointes inconnues, ne pas télécharger d’applications depuis des sources non fiables et analyser les médias amovibles avant usage."},{"name":"Patching","desc":"Installer régulièrement les correctifs de l’OS, des applications et du firmware afin de réduire les vulnérabilités utilisées pour l’infection."},{"name":"Bloquer ports/services inutiles","desc":"Fermer les ports non nécessaires sur les hôtes et les pare-feux et désactiver les services/protocoles non utilisés."},{"name":"Backups","desc":"Maintenir des sauvegardes régulières afin de limiter l’impact d’une corruption ou d’un ransomware."},{"name":"Least privilege","desc":"Limiter les droits administrateur et les permissions réduit ce qu’un malware peut faire après exécution."},{"name":"Désactiver Autoplay","desc":"Désactiver l’exécution automatique sur les supports externes pour empêcher un Autorun.inf de lancer automatiquement un payload."},{"name":"FIM / integrity checking","desc":"Surveiller les fichiers critiques via checksums ou File Integrity Monitoring afin de détecter les modifications anormales."}]},{"g":"Trojans","items":[{"name":"Durcir les configurations","desc":"Corriger les configurations faibles ou par défaut et désactiver les protocoles inutiles."},{"name":"Surveiller le trafic","desc":"Rechercher des ports inhabituels, connexions chiffrées inattendues ou communications persistantes vers l’extérieur."},{"name":"Host AV / firewall / IDS","desc":"Utiliser antivirus, pare-feu hôte et IDS pour détecter ou bloquer les comportements associés aux Trojans."},{"name":"DEP & ASLR","desc":"Activer les protections mémoire DEP et ASLR pour réduire les possibilités de code injection et d’exploitation mémoire."},{"name":"Vérifier les communications sensibles","desc":"Le module recommande de contrôler l’authenticité SSL/TLS avant des opérations sensibles et d’éviter les logiciels reçus par messagerie instantanée."}]},{"g":"Virus / Worm / Fileless","items":[{"name":"Former contre le phishing","desc":"Apprendre aux utilisateurs à reconnaître les liens/documents suspects et à ne pas activer automatiquement des macros."},{"name":"Désactiver scripts/plugins inutiles","desc":"Désactiver JavaScript dans les lecteurs PDF si non nécessaire, Flash et les téléchargements automatiques de plugins."},{"name":"MFA","desc":"Ajouter une authentification multifacteur limite l’exploitation directe d’identifiants dérobés."},{"name":"Surveiller PowerShell / WMIC","desc":"Détecter l’abus de PowerShell, WMIC et autres applications autorisées fréquemment utilisées dans les attaques fileless."},{"name":"Application control","desc":"Empêcher les navigateurs ou documents de lancer de manière inattendue PowerShell/WMIC ou d’autres interpréteurs."},{"name":"Behavior analytics","desc":"Utiliser UBA/behavior analytics et EDR/NGAV pour détecter des comportements anormaux plutôt que seulement des signatures."},{"name":"IOC monitoring","desc":"Rechercher régulièrement les Indicators of Compromise sur les endpoints et le réseau."},{"name":"MDR","desc":"Le Managed Detection and Response est cité pour compléter la surveillance et la chasse aux menaces."}]},{"g":"Adware / PUA","items":[{"name":"Installer depuis des sources fiables","desc":"Télécharger les logiciels depuis des sources reconnues et éviter les bundles douteux."},{"name":"Installation personnalisée","desc":"Choisir l’installation custom pour décocher les composants publicitaires ou logiciels additionnels."},{"name":"Ad blockers & privacy extensions","desc":"Utiliser des extensions de blocage/publicité et de protection de la vie privée lorsque c’est pertinent."},{"name":"Revoir les logiciels installés","desc":"Contrôler régulièrement la liste des programmes afin de supprimer les PUA/PUP inattendus."},{"name":"Lire EULA et écrans d’installation","desc":"Vérifier les conditions et options plutôt que d’accepter automatiquement les logiciels additionnels."}]},{"g":"APT","items":[{"name":"Zero Trust","desc":"Autoriser explicitement utilisateurs et équipements au lieu d’accorder une confiance implicite."},{"name":"Risk assessments","desc":"Réaliser des évaluations régulières pour identifier les actifs et scénarios à forte valeur pour une APT."},{"name":"Segmentation","desc":"Segmenter le réseau pour ralentir l’expansion et limiter le mouvement latéral."},{"name":"NGAV / EDR","desc":"Déployer des protections endpoint capables d’observer comportements, persistance et activités anormales sur la durée."}]},{"g":"Analyse & détection","items":[{"name":"Lab isolé","desc":"Analyser les malwares dans une VM sans accès au réseau de production, idéalement avec snapshots et services simulés."},{"name":"Baseline avant exécution","desc":"Capturer l’état du système avant l’analyse dynamique afin de mesurer précisément les changements après exécution."},{"name":"Static + Dynamic","desc":"Combiner les deux approches : l’analyse statique révèle structure et code ; la dynamique révèle le comportement réel."},{"name":"Signatures + heuristics + behavior","desc":"Ne pas dépendre d’une seule technique de détection : combiner signatures, heuristique, intégrité, émulation et surveillance comportementale."},{"name":"Détecter l’évasion VM","desc":"Se rappeler qu’un échantillon peut se comporter différemment en VM ; une absence d’activité n’est pas une preuve d’innocuité."}]}]}}},{"n":8,"t":"Sniffing","data":{"concept":{"groups":[{"g":"Fondamentaux du sniffing","items":[{"name":"Sniffing — définition","desc":"Le sniffing consiste à capturer puis analyser le trafic réseau. Un packet sniffer / network analyzer observe les trames et paquets qui circulent afin d’en extraire les en-têtes, les protocoles utilisés et, lorsque le trafic n’est pas chiffré, le contenu transporté. Cette visibilité peut révéler des identifiants, des sessions, des configurations et d’autres informations sensibles.","cheat":[{"words":1,"title":"Ce qu’un sniffer peut révéler","rows":[["Identifiants","mots de passe Telnet/FTP, informations d’authentification"],["Communications","email, chat, HTTP, DNS, syslog"],["Infrastructure","configuration routeur, flux réseau, services utilisés"],["Sessions","données échangées entre client et serveur"]]}],"exam":"Sniffing = capture + analyse du trafic. Le chiffrement peut empêcher de lire le payload même si les paquets sont capturés."},{"name":"Packet capturing","desc":"La capture de paquets consiste à acquérir du trafic réseau visible depuis l’interface de capture, y compris du trafic qui n’est pas destiné à la machine de l’analyste lorsque l’environnement et le mode de la NIC le permettent. Le logiciel de capture décode ensuite chaque couche du paquet pour présenter les champs des différents protocoles.","cheat":[{"words":1,"title":"Deux éléments à distinguer","rows":[["Headers","métadonnées de protocole : adresses, ports, flags, numéros de séquence, etc."],["Payload","données réellement transportées entre les endpoints ; elles peuvent être réparties sur plusieurs paquets"]]}]},{"name":"Promiscuous Mode","desc":"Une NIC filtre normalement les trames Ethernet et transmet au système uniquement celles dont la destination MAC la concerne. En mode promiscuous, ce filtre est désactivé : l’interface remonte toutes les trames qu’elle voit au système, ce qui permet à un sniffer de les analyser.","exam":"Promiscuous mode n’oblige pas un switch à envoyer le trafic des autres ports vers ta NIC. Sur un réseau commuté, il faut encore que le trafic atteigne ton port."},{"name":"Hub vs Switch","desc":"Un hub répète le trafic reçu vers tous ses ports : tous les hôtes voient les trames et le sniffing passif est donc simple. Un switch, lui, consulte sa table CAM et envoie normalement la trame uniquement vers le port associé à la MAC de destination. C’est pour cette raison que le sniffing d’un réseau commuté nécessite souvent une technique active ou un mécanisme de monitoring.","cheat":[{"words":1,"title":"Différence à retenir","rows":[["Hub","trafic copié vers tous les ports → sniffing passif facilité"],["Switch","trafic dirigé vers le port correspondant dans la CAM table → trafic des autres hôtes non visible par défaut"]]}],"exam":"Hub = shared Ethernet ; switch = switched Ethernet."},{"name":"Passive vs Active Sniffing","desc":"Le sniffing passif se contente d’observer le trafic déjà visible sans injecter de paquets supplémentaires ; il correspond particulièrement aux environnements partagés comme les hubs. Le sniffing actif vise surtout les réseaux commutés : l’attaquant manipule le fonctionnement du LAN pour faire passer le trafic des autres hôtes par son port.","cheat":[{"words":1,"title":"Comparaison","rows":[["Passive sniffing","observe uniquement ; trafic déjà diffusé sur le segment ; plus discret"],["Active sniffing","injecte/manipule du trafic pour rediriger ou exposer les communications sur un switch"]]}],"exam":"Techniques actives citées : MAC flooding, DHCP attacks, DNS poisoning, switch port stealing, ARP poisoning et spoofing attacks."},{"name":"Shared Ethernet vs Switched Ethernet","desc":"Dans un shared Ethernet, plusieurs hôtes partagent le même média et reçoivent les transmissions du segment. Dans un switched Ethernet, le switch apprend les adresses MAC et associe chaque MAC à un port via sa table CAM afin de limiter la diffusion inutile du trafic.","cheat":[{"words":1,"title":"Conséquence pour le sniffing","rows":[["Shared Ethernet","la visibilité du trafic est naturellement large"],["Switched Ethernet","la visibilité est limitée par le forwarding du switch"]]}]},{"name":"Obstacles au sniffing","desc":"Trois obstacles principaux limitent ce qu’un sniffer peut observer : le switching, la segmentation et le chiffrement. Un switch isole les ports, les VLAN/subnets limitent la portée du trafic et le chiffrement rend le contenu illisible même lorsque les paquets sont capturés.","cheat":[{"words":1,"title":"Les 3 obstacles","rows":[["Switches","trafic envoyé seulement au bon port"],["Segmentation","VLANs/subnets empêchent le trafic d’un autre segment d’atteindre l’interface"],["Encryption","TLS/HTTPS, IPsec, SSH : headers visibles mais payload chiffré"]]}]},{"name":"Payload, MTU et fragmentation","desc":"Le payload est la donnée transportée à l’intérieur des en-têtes réseau. Une conversation complète peut être répartie sur de nombreux paquets et trames. Lorsque la taille maximale autorisée par la couche liaison est dépassée, la MTU peut entraîner une fragmentation, ce qui oblige l’outil d’analyse à reconstituer les données pour comprendre la communication.","exam":"MTU = Maximum Transmission Unit. Une conversation n’est pas forcément contenue dans un seul paquet."},{"name":"Protocoles vulnérables au sniffing","desc":"Les protocoles qui transmettent les données ou les identifiants sans chiffrement sont particulièrement exposés : une simple capture peut suffire pour lire les informations. Le cours cite Telnet/Rlogin, HTTP, SNMPv1/v2, SMTP, NNTP, POP, FTP, IMAP et TFTP.","exam":"Le problème principal n’est pas le protocole de capture : c’est l’absence de chiffrement du protocole applicatif."},{"name":"Hardware Protocol Analyzer","desc":"Un analyseur matériel est un équipement dédié placé sur le réseau pour capturer, décoder et analyser le trafic sans modifier le segment observé. Il peut offrir une meilleure capacité de capture qu’un simple logiciel lorsque le volume est élevé et prend en charge plusieurs types de liaisons.","cheat":[{"words":1,"title":"À retenir","rows":[["Avantage","capacité de capture élevée, moins de risque de pertes pendant une surcharge"],["Inconvénient","plus coûteux qu’une solution logicielle"],["Exemples","Xgig 1000, SierraNet M1288"]]}]},{"name":"Ethereal → Wireshark","desc":"Ethereal était l’un des premiers outils gratuits ayant largement démocratisé la capture réseau. Il a ensuite été renommé Wireshark, qui reste l’outil graphique de référence pour la capture et l’analyse de paquets."},{"name":"6 techniques d’Active Sniffing","desc":"Sur un réseau commuté, plusieurs techniques peuvent être utilisées pour rendre visible du trafic qui ne devrait normalement pas atteindre le port de l’attaquant. Elles agissent sur la table CAM, l’adressage, DHCP, ARP, DNS ou le comportement du switch.","cheat":[{"words":1,"title":"Les 6 techniques CEH","rows":[["1","MAC Flooding"],["2","DHCP Attacks"],["3","DNS Poisoning"],["4","Switch Port Stealing"],["5","ARP Poisoning"],["6","Spoofing Attack"]]}],"exam":"Cette liste fait partie des classifications importantes du module."}]},{"g":"Switching, MAC & accès au trafic","items":[{"name":"MAC Address — structure","desc":"Une adresse MAC fait 6 octets. Les 3 premiers octets forment l’OUI (Organizationally Unique Identifier) attribué au constructeur, et les 3 derniers identifient l’interface. Dans l’octet de contrôle, certains bits indiquent notamment unicast/multicast et adresse globalement unique/localement administrée.","cheat":[{"words":1,"title":"Bits cités","rows":[["a1","0 = Unicast ; 1 = Multicast"],["a2","0 = globally unique ; 1 = locally administered"]]}]},{"name":"CAM Table","desc":"La CAM table d’un switch associe dynamiquement des adresses MAC aux ports physiques et aux VLANs. Lorsqu’une trame arrive, le switch consulte la MAC de destination et transmet la trame sur le port correspondant. Cette table est de taille finie et constitue la cible du MAC flooding.","cheat":[{"words":1,"title":"Informations typiques","rows":[["MAC address","adresse apprise"],["Port","interface physique où la MAC a été vue"],["VLAN","segment auquel l’entrée appartient"],["Age / Learn","état d’apprentissage et vieillissement de l’entrée"]]}],"exam":"CAM = MAC ↔ switch port. ARP cache = IP ↔ MAC : ne pas confondre."},{"name":"MAC Flooding","desc":"Le MAC flooding envoie au switch un grand nombre de trames contenant des adresses MAC falsifiées afin de remplir sa CAM table. Une fois la capacité dépassée, le switch peut se comporter de manière proche d’un hub pour les destinations qu’il ne peut plus apprendre, ce qui augmente la diffusion de trafic et facilite le sniffing.","flow":"Fausses MAC en masse → CAM table saturée → forwarding moins précis / flooding → trafic visible sur davantage de ports","exam":"Outil cité : macof."},{"name":"Switch Port Stealing","desc":"Le port stealing vise à faire apprendre au switch la MAC d’une victime sur le port de l’attaquant. L’attaquant envoie une réponse ARP usurpée suffisamment tôt pour que le switch associe la MAC de la victime à son propre port. Le trafic destiné à la victime est alors redirigé vers le port de l’attaquant.","flow":"ARP request → réponse usurpée → CAM mise à jour avec mauvais port → trafic de la victime envoyé à l’attaquant"},{"name":"MAC Spoofing / Duplicating","desc":"Le MAC spoofing consiste à réutiliser ou falsifier une adresse MAC observée sur le réseau. L’objectif peut être de contourner un contrôle qui autorise uniquement une MAC précise, par exemple un filtre MAC sur un switch ou un point d’accès Wi-Fi.","exam":"MAC spoofing change l’identité MAC utilisée par l’attaquant ; ARP poisoning modifie les associations IP↔MAC apprises par les autres hôtes."},{"name":"Port Mirroring / SPAN","desc":"Le port mirroring configure un switch pour copier le trafic d’un ou plusieurs ports vers un port de monitoring. Sur Cisco, cette fonction s’appelle SPAN (Switched Port Analyzer). Elle permet de capturer du trafic d’un réseau commuté sans devoir provoquer de redirection par une attaque.","cheat":[{"words":1,"title":"Choix pratique","rows":[["Un seul port à mirrorer","le port du gateway/router permet d’observer une grande partie du trafic entrant/sortant"],["Nom Cisco","SPAN"],["But","copier le trafic vers un port d’analyse"]]}]},{"name":"SPAN Oversubscription","desc":"Un port SPAN peut perdre des paquets si la somme du trafic copié dépasse sa capacité. Par exemple, plusieurs ports à 1 Gbps copiés vers un unique port de monitoring à 1 Gbps peuvent provoquer des pertes aléatoires et rendre la capture incomplète.","exam":"Une capture via SPAN n’est pas forcément exhaustive si le port de destination est saturé."},{"name":"Network TAP","desc":"Un TAP (Test Access Point) est un dispositif matériel inséré sur le lien afin de copier passivement le trafic vers un outil de capture. Contrairement au SPAN, il ne dépend pas d’une configuration du switch et évite les pertes dues à l’oversubscription du port de monitoring, dans les limites de sa capacité nominale."},{"name":"VLAN Hopping","desc":"Le VLAN hopping vise à atteindre du trafic d’un VLAN auquel l’attaquant ne devrait pas avoir accès. Le module distingue deux techniques : switch spoofing, où l’attaquant négocie un trunk non autorisé, et double tagging, où une trame porte deux tags 802.1Q.","cheat":[{"words":1,"title":"Deux techniques","rows":[["Switch Spoofing","un équipement attaquant se présente comme switch et établit un trunk non autorisé"],["Double Tagging","une trame contient deux tags 802.1Q ; le premier correspond au native VLAN et le second au VLAN cible"]]}],"exam":"Double tagging dépend du native VLAN et du traitement des tags sur les trunks."},{"name":"802.1Q Double Tagging","desc":"Dans le double tagging, la trame contient un tag externe correspondant au native VLAN de l’attaquant et un tag interne correspondant au VLAN cible. Le premier switch retire le tag externe puis transmet la trame sur le trunk ; le tag interne devient alors visible au switch suivant, qui peut l’envoyer vers le VLAN cible.","flow":"Tag externe = native VLAN + tag interne = VLAN cible → premier switch retire le tag externe → second switch traite le tag interne"},{"name":"STP — Spanning Tree Protocol","desc":"STP évite les boucles de niveau 2 en élisant un root bridge et en contrôlant quels liens restent actifs. Les switches s’échangent des BPDU (Bridge Protocol Data Units). L’élection s’appuie sur le BID, composé d’une priorité de bridge et d’une adresse MAC.","cheat":[{"words":1,"title":"Termes clés","rows":[["BPDU","message utilisé par STP entre switches"],["BID","Bridge ID = Bridge Priority + MAC"],["Root bridge","switch élu comme référence de l’arbre STP"],["Valeur citée","Default Bridge Priority = 32769"]]}]},{"name":"STP Attack","desc":"Un attaquant peut connecter un rogue switch avec une priorité STP très basse, par exemple 0, afin de tenter de devenir root bridge. Si l’élection est remportée, davantage de trafic du LAN peut transiter par son équipement, ce qui facilite l’observation et la manipulation du réseau.","flow":"Rogue switch + priorité plus basse → élu root bridge → chemins STP recalculés → trafic peut transiter par l’équipement attaquant"},{"name":"IRDP Spoofing","desc":"IRDP spoofing fait partie des quatre spoofing attacks à reconnaître dans ce module, aux côtés du MAC spoofing, du VLAN hopping et des attaques STP. Les fichiers fournis ne développent pas davantage son fonctionnement.","exam":"À retenir pour la classification : MAC Spoofing | IRDP Spoofing | VLAN Hopping | STP Attack."}]},{"g":"DHCP Attacks","items":[{"name":"DHCP — processus DORA","desc":"DHCP fournit automatiquement une configuration IP aux clients. Le processus classique suit DORA : le client diffuse une demande, le serveur propose une configuration, le client demande l’offre choisie, puis le serveur confirme le bail.","flow":"DHCPDISCOVER → DHCPOFFER → DHCPREQUEST → DHCPACK","exam":"DORA = Discover, Offer, Request, Acknowledge."},{"name":"DHCP Message Types","desc":"En plus de DORA, DHCP définit plusieurs messages pour gérer le cycle de vie d’un bail et les relais DHCP.","cheat":[{"words":1,"title":"Messages cités","rows":[["DHCPRelease","le client libère son adresse"],["DHCPDecline","le client indique que l’adresse proposée semble déjà utilisée"],["Reconfigure","le serveur demande au client de renouveler/mettre à jour sa configuration"],["DHCPInform","le client demande uniquement des paramètres de configuration"],["Relay-Forward","le relay agent transmet la requête vers le serveur"],["Relay-Reply","le serveur répond via le relay agent"],["DHCPNAK","le serveur refuse/indique une configuration d’adresse incorrecte"]]}]},{"name":"DHCP Starvation","desc":"Le DHCP starvation est un DoS contre le pool d’adresses. L’attaquant envoie de nombreuses demandes DHCP avec des identités falsifiées pour faire réserver toutes les adresses disponibles. Lorsque le pool est épuisé, les clients légitimes ne peuvent plus obtenir ou renouveler leur adresse IP.","flow":"Beaucoup de DHCPDISCOVER falsifiés → nombreuses offres/réservations → pool épuisé → clients légitimes sans bail","exam":"Outils cités : Yersinia, dhcpStarvation.py, Metasploit, Hyenae, DHCPig."},{"name":"Rogue DHCP Server","desc":"Un rogue DHCP server répond aux broadcasts des clients avec une configuration contrôlée par l’attaquant. Il est souvent utilisé après un DHCP starvation afin que le serveur légitime ne puisse plus répondre correctement. Le rogue server tente alors de faire accepter sa propre offre plus rapidement.","flow":"Client broadcast → rogue DHCPOFFER → client DHCPREQUEST → rogue DHCPACK"},{"name":"Options malveillantes via Rogue DHCP","desc":"Un serveur DHCP malveillant ne fournit pas seulement une adresse IP : il peut aussi pousser une passerelle ou un serveur DNS contrôlé par l’attaquant. Cela permet de provoquer un DoS, de rediriger la résolution DNS ou de placer l’attaquant sur le chemin du trafic.","cheat":[{"words":1,"title":"Exemples","rows":[["Wrong Default Gateway","le trafic sortant passe par l’attaquant"],["Wrong DNS Server","les requêtes DNS sont envoyées au serveur de l’attaquant"],["Wrong IP Address","configuration invalide ou conflit provoquant un DoS"]]}]}]},{"g":"ARP Poisoning & MITM","items":[{"name":"ARP — Address Resolution Protocol","desc":"ARP associe une adresse IPv4 à une adresse MAC sur le réseau local. Lorsqu’un hôte connaît l’IP de destination mais pas sa MAC, il diffuse une requête ARP ; le détenteur de l’IP répond avec son adresse MAC, puis cette association est placée dans le cache ARP.","flow":"IP connue, MAC inconnue → ARP Request broadcast → ARP Reply → IP↔MAC mise en cache","exam":"ARP cache = IP ↔ MAC. CAM table = MAC ↔ switch port."},{"name":"Pourquoi ARP peut être empoisonné","desc":"ARP ne fournit pas d’authentification permettant de prouver qu’une réponse vient réellement du détenteur de l’adresse IP annoncée. Un hôte peut donc accepter une association IP↔MAC falsifiée et l’enregistrer dans son cache.","exam":"La faiblesse centrale de l’ARP spoofing est l’absence d’authentification des associations IP↔MAC."},{"name":"Gratuitous ARP","desc":"Un gratuitous ARP est une annonce ARP envoyée sans qu’une requête correspondante soit nécessaire. Comme les systèmes peuvent mettre à jour leur cache avec ce type d’annonce, un attaquant peut renvoyer régulièrement de fausses associations pour maintenir un empoisonnement.","exam":"Les outils d’ARP spoofing renvoient périodiquement les annonces car les entrées du cache expirent."},{"name":"ARP Cache Timing","desc":"Les associations ARP ne restent pas indéfiniment dans le cache. Les valeurs citées dans le chapitre sont d’environ 60 secondes sous Linux et, sous Windows, 30 000 ms multipliées par une valeur aléatoire entre 0,5 et 1,5. L’empoisonnement doit donc être entretenu.","exam":"L’expiration du cache explique pourquoi les outils de poisoning envoient continuellement des réponses ARP."},{"name":"ARP Spoofing / ARP Poisoning","desc":"L’attaquant envoie une fausse réponse ARP pour faire associer l’IP d’un hôte légitime — souvent la passerelle — à sa propre adresse MAC. Le trafic destiné à l’hôte usurpé est alors envoyé vers l’attaquant. Pour conserver une communication fonctionnelle et rester en MITM, il faut ensuite transférer le trafic vers la vraie destination.","flow":"Fausse association IP gateway → MAC attaquant → victime envoie au MITM → attaquant forward vers vraie gateway"},{"name":"IP Forwarding dans un MITM","desc":"Une fois le trafic redirigé vers la machine de l’attaquant, celui-ci doit le retransmettre vers sa destination réelle. Sans IP forwarding, les communications se cassent et l’interception devient évidente. Avec le forwarding, l’attaquant peut observer le trafic tout en maintenant la session entre les deux endpoints."},{"name":"Conséquences de l’ARP Poisoning","desc":"Une position MITM obtenue par ARP poisoning permet d’intercepter des paquets, de détourner une session ou d’observer des communications VoIP. L’attaque sert donc souvent de mécanisme d’accès au trafic pour d’autres techniques, par exemple DNS spoofing ou downgrade HTTPS.","cheat":[{"words":1,"title":"Menaces citées","rows":[["Packet Sniffing","lecture du trafic du segment"],["Session Hijacking","récupération d’informations de session pour accéder à une application"],["VoIP Call Tapping","observation du trafic voix"]]}],"xref":[11]},{"name":"ARP Poisoning vs MAC Spoofing","desc":"MAC spoofing modifie l’adresse MAC utilisée par l’attaquant afin d’imiter une autre interface. ARP poisoning, lui, vise les caches ARP des autres machines afin qu’elles associent une IP légitime à la MAC de l’attaquant. Les deux peuvent être combinés, mais ce ne sont pas la même action.","cheat":[{"words":1,"title":"Différence","rows":[["MAC Spoofing","l’attaquant change/duplique sa propre identité MAC"],["ARP Poisoning","la victime apprend une fausse association IP ↔ MAC"]]}],"exam":"Question fréquente : spoofing de MAC ≠ poisoning de cache ARP."}]},{"g":"DNS Poisoning & interception chiffrée","items":[{"name":"DNS Spoofing / DNS Poisoning","desc":"Le DNS spoofing vise à faire résoudre un nom de domaine vers une adresse contrôlée par l’attaquant. Si la victime reçoit et accepte la fausse réponse, son navigateur ou son application se connecte au mauvais serveur alors qu’elle a demandé le bon nom.","flow":"Victime demande nom → fausse réponse DNS → mauvaise IP mise en cache → connexion vers serveur attaquant"},{"name":"4 DNS Poisoning Techniques","desc":"Le module distingue quatre familles de DNS poisoning. Le mécanisme détaillé dans les fichiers fournis est surtout l’Intranet DNS Spoofing ; les trois autres catégories sont à reconnaître par leur nom.","cheat":[{"words":1,"title":"Classification CEH","rows":[["1","Intranet DNS Spoofing"],["2","Internet DNS Spoofing"],["3","Proxy Server DNS Poisoning"],["4","DNS Cache Poisoning"]]}],"exam":"Mémoriser les 4 catégories."},{"name":"Intranet DNS Spoofing","desc":"Sur un LAN commuté, l’attaquant commence par se placer en MITM, par exemple avec ARP poisoning. Il intercepte ensuite les requêtes DNS et renvoie une adresse IP contrôlée par lui avant la réponse légitime, ce qui redirige le client vers un faux site ou un proxy attaquant.","flow":"ARP poisoning → requête DNS visible → réponse falsifiée → victime vers faux site → interception / forwarding"},{"name":"DNS + UDP : course au premier reply","desc":"Le chapitre souligne que DNS est souvent utilisé en UDP : il n’existe pas de handshake de connexion comparable à TCP. Dans un scénario local où l’attaquant voit la requête, il peut tenter de faire accepter une réponse falsifiée avant la réponse du serveur légitime.","exam":"La protection principale présentée contre la falsification des réponses DNS est DNSSEC."},{"name":"DNS Cache & TTL","desc":"Une fois une réponse DNS falsifiée mise en cache, le client peut continuer à utiliser la mauvaise adresse pendant la durée de vie de l’entrée. L’attaquant n’a donc pas nécessairement besoin de falsifier chaque résolution tant que la valeur empoisonnée reste valide."},{"name":"sslstrip","desc":"sslstrip agit comme un proxy transparent dans une position MITM. Lorsque le serveur veut faire passer le client de HTTP à HTTPS, l’outil modifie les liens afin que la victime continue à parler en HTTP avec l’attaquant, tandis que l’attaquant établit lui-même une session HTTPS avec le serveur.","flow":"Victime HTTP ↔ attaquant ; attaquant HTTPS ↔ serveur","cheat":[{"words":1,"title":"Conditions / limites citées","rows":[["Prérequis","le trafic doit déjà passer par l’attaquant, par exemple via ARP spoofing"],["Ce que voit la victime","HTTP sans cadenas au lieu du HTTPS attendu"],["Limites","HSTS et TLS 1.3 empêchent ce scénario selon le chapitre"]]}],"exam":"sslstrip = downgrade HTTPS→HTTP côté victime ; nécessite une position MITM."},{"name":"TLS Decryption dans Wireshark","desc":"Capturer une session TLS ne suffit pas à lire son contenu : il faut disposer des secrets nécessaires à la déchiffrer. Wireshark peut utiliser des clés privées RSA dans certains scénarios, une pre-shared key ou un fichier de secrets/pre-master/session keys. Avec les échanges modernes utilisant des clés éphémères, le key log est la méthode adaptée décrite dans le chapitre.","exam":"Même si le payload TLS est chiffré, les métadonnées réseau restent visibles."}]},{"g":"Analyse de paquets & détection de sniffers","items":[{"name":"Wireshark — lecture d’un paquet","desc":"Wireshark présente chaque trame avec les différentes couches et champs de protocole décodés. Il permet de parcourir la capture, d’appliquer des display filters, d’ouvrir des PCAP produits par d’autres outils et d’examiner le contenu des conversations lorsqu’il est disponible."},{"name":"Follow TCP Stream","desc":"Follow TCP Stream filtre la capture pour ne garder que les paquets appartenant à une même conversation TCP, puis reconstitue l’échange client↔serveur dans l’ordre. C’est particulièrement utile pour lire une session applicative complète quand le contenu est en clair.","exam":"Follow TCP Stream = reconstituer une conversation TCP complète."},{"name":"Relative TCP Sequence Numbers","desc":"Les numéros de séquence TCP réels sont de grandes valeurs initiales aléatoires. Pour faciliter l’analyse, Wireshark peut les recalculer en valeurs relatives commençant à 1, puis les incrémenter selon le nombre d’octets échangés."},{"name":"Expert Information","desc":"Expert Information regroupe les paquets que Wireshark a signalés comme intéressants ou anormaux — erreurs, warnings, notes et messages de conversation. Cela permet de trouver rapidement les problèmes sans parcourir manuellement des milliers de trames."},{"name":"Wireshark Statistics","desc":"Le menu Statistics donne une vue agrégée de la capture : hiérarchie des protocoles, conversations entre endpoints, I/O graphs, endpoints, longueurs de paquets et flow graphs. Il sert à comprendre le trafic global avant de descendre au niveau d’un paquet précis."},{"name":"Relative Time vs Absolute Time","desc":"Wireshark peut afficher le temps relatif depuis le début de la capture ou l’heure absolue. Le temps relatif facilite l’analyse d’une conversation ; l’heure absolue est utile pour corréler les paquets avec des logs et d’autres sources d’événements."},{"name":"Berkeley Packet Filter — BPF","desc":"BPF fournit une syntaxe de filtrage utilisée par des outils de capture comme tcpdump, tshark et Wireshark. On combine des primitives décrivant ce qu’on veut cibler avec des modificateurs de direction et des opérateurs logiques.","syntax":"tcpdump not port 22\ntcpdump tcp and \\(host 192.168.86.1\\)","cheat":[{"words":1,"title":"Syntaxe à reconnaître","rows":[["Primitives","host, ether, net, proto, port"],["Direction","src, dst"],["Logique","and, or, not"]]}]},{"name":"Sniffer Detection — Ping Method","desc":"La méthode Ping envoie vers la machine suspecte un paquet dont l’IP de destination est correcte mais dont la MAC est volontairement incorrecte. Une NIC normale doit filtrer la trame ; une interface en mode promiscuous peut la transmettre au système et provoquer une réponse. Cette méthode n’est toutefois pas parfaitement fiable sur un réseau commuté.","exam":"Correct IP + wrong MAC → réponse potentielle = indice de promiscuous mode."},{"name":"Sniffer Detection — DNS Method","desc":"Certains sniffers effectuent des reverse DNS lookups pour convertir les IP capturées en noms d’hôtes. Une machine qui déclenche de nombreuses résolutions inverses après l’apparition de trafic peut donc constituer un indice de sniffing."},{"name":"Sniffer Detection — ARP Method","desc":"La méthode ARP envoie une information ARP non broadcast que seule une interface en mode promiscuous est supposée accepter, puis utilise un ping avec une combinaison IP/MAC spéciale pour voir quel hôte a mémorisé l’association. Une réponse indique un possible sniffer."},{"name":"ARP anomalies comme indicateur","desc":"Un sniffing actif basé sur ARP spoofing génère des modifications inhabituelles des associations IP↔MAC et souvent de nombreuses réponses ARP non sollicitées. Surveiller les changements de mappings avec un outil comme arpwatch peut révéler ces anomalies."},{"name":"AI-powered Packet Analysis","desc":"L’analyse assistée par IA applique des modèles à de grands volumes de paquets afin d’identifier plus rapidement des anomalies, des problèmes de performance ou des comportements de sécurité. Les caractéristiques citées incluent le timing, les délais aller-retour, les patterns de flux, les abus de protocole et les communications inattendues.","cheat":[{"words":1,"title":"Exemples cités","rows":[["NetNerve","analyse assistée par IA et génération d’insights en texte"],["AGILITY","analyse à grande échelle de paquets 4G/5G"],["Scapy + AI","extraction et analyse de paquets en temps réel"]]}]}]}]},"outil":{"groups":[{"g":"Capture & analyse","items":[{"name":"Wireshark","desc":"Analyseur réseau graphique permettant de capturer, parcourir et décoder les paquets sur de nombreux médias. Il sait ouvrir des captures tcpdump/tshark, appliquer des display filters, suivre une conversation TCP et présenter le détail de chaque couche.","cheat":[{"words":1,"title":"Fonctions à connaître","rows":[["Follow TCP Stream","reconstruit une conversation TCP"],["Display Filters","réduit la vue aux paquets pertinents"],["Statistics","protocol hierarchy, conversations, endpoints, I/O graphs"],["Expert Information","centralise erreurs/warnings/notes"],["TLS secrets","peut déchiffrer certaines sessions si les clés/secrets nécessaires sont fournis"]]}]},{"name":"tcpdump","desc":"Outil CLI de capture réseau sous Linux/BSD. Il peut capturer en direct, sélectionner une interface, désactiver la résolution de noms, afficher le payload, augmenter la verbosité et lire/écrire des fichiers PCAP. Il utilise la syntaxe BPF pour filtrer.","syntax":"tcpdump -n\ntcpdump -vv -s 0\ntcpdump -i eth0 -X\ntcpdump -w file.pcap\ntcpdump -r file.pcap\ntcpdump not port 22\ntcpdump tcp and \\(host 192.168.86.1\\)","cheat":[{"words":1,"title":"Options importantes","rows":[["-i <iface>","interface de capture"],["-n","désactiver la résolution de noms"],["-v / -vv / -vvv","augmenter la verbosité"],["-s 0","capturer le paquet complet"],["-X","afficher le payload en hex/ASCII"],["-w file.pcap","écrire la capture dans un PCAP"],["-r file.pcap","lire un PCAP"]]}]},{"name":"tshark","desc":"Version en ligne de commande de Wireshark. Elle peut afficher des champs très précis pour faciliter le scripting et l’extraction structurée de données.","syntax":"tshark -Tfields -e frame.number -e ip.src -e ip.dst -e ip.tos -e ip.ttl","cheat":[{"words":1,"title":"Options présentes dans l’exemple","rows":[["-Tfields","sortie constituée uniquement des champs demandés"],["-e <field>","ajoute un champ à extraire ; l’option peut être répétée"]]}]},{"name":"WinDump","desc":"Équivalent Windows de tcpdump pour la capture en ligne de commande."},{"name":"NetScanTools Pro — Promiscuous Mode Scanner","desc":"Le Promiscuous Mode Scanner recherche des machines susceptibles de capturer du trafic en mode promiscuous sur une plage d’IP et peut signaler un résultat comme Promiscuous Mode ou Maybe."},{"name":"Capsa Portable Network Analyzer","desc":"Analyseur portable destiné à la capture, au diagnostic et à l’analyse des performances réseau."},{"name":"OmniPeek","desc":"Analyseur réseau cité pour la visualisation et l’analyse de paquets ; le module mentionne notamment une vue cartographique des IP publiques observées."},{"name":"RITA","desc":"Real Intelligence Threat Analytics, outil cité pour l’analyse du trafic réseau et la détection de comportements intéressants."},{"name":"Observer Analyzer","desc":"Solution de network monitoring et d’analyse citée parmi les outils de sniffing."},{"name":"PRTG Network Monitor","desc":"Solution de supervision réseau citée pour le monitoring des performances et du trafic."},{"name":"SolarWinds Network Performance Monitor","desc":"Outil de supervision des performances réseau cité dans le module."},{"name":"Xgig 1000","desc":"Analyseur matériel de protocole cité comme exemple d’équipement de capture dédié."},{"name":"SierraNet M1288","desc":"Analyseur matériel de protocole cité comme exemple de solution dédiée à la capture et à l’analyse."}]},{"g":"Attaques LAN & MITM","items":[{"name":"macof","desc":"Outil de la suite dsniff utilisé pour envoyer rapidement de nombreuses trames avec des adresses MAC/IP aléatoires afin de remplir la CAM table d’un switch.","syntax":"macof -i eth0 -n 10","cheat":[{"words":1,"title":"Options importantes de l’exemple","rows":[["-i eth0","interface utilisée pour envoyer les trames"],["-n 10","nombre de paquets à générer dans l’exemple"]]}],"exam":"Le module indique qu’il peut générer un très grand nombre d’entrées par minute."},{"name":"arpspoof (dsniff)","desc":"Outil d’ARP spoofing sous Linux. Il envoie de fausses réponses ARP afin d’insérer l’attaquant entre des hôtes du LAN. Une fois le trafic redirigé, l’IP forwarding doit être actif pour conserver la communication.","syntax":"sudo arpspoof -i eth0 -c both 192.168.86.1","cheat":[{"words":1,"title":"Options citées","rows":[["-i eth0","interface réseau"],["-c both","mode de poisoning utilisé dans l’exemple"],["-t <target>","viser un hôte spécifique"],["-r","poisoning dans la direction inverse également"]]}]},{"name":"Ettercap","desc":"Suite d’attaque MITM disponible en mode console ou GUI. Elle peut scanner les hôtes, sélectionner des cibles, lancer de l’ARP poisoning et activer des plugins comme dns_spoof pour falsifier des réponses DNS.","cheat":[{"words":1,"title":"Workflow DNS spoofing","rows":[["1","scanner / construire la host list"],["2","sélectionner les targets"],["3","lancer ARP poisoning"],["4","configurer les mappings DNS dans /etc/ettercap/"],["5","activer le plugin dns_spoof"]]}]},{"name":"Yersinia","desc":"Outil utilisé dans le module pour les attaques liées à DHCP. Le mode interactif permet de lancer un scénario de DHCP starvation et d’observer le nombre de paquets DHCP et l’usage du spoofing.","syntax":"yersinia -I"},{"name":"bettercap","desc":"Outil cité parmi les solutions d’ARP poisoning / interception sur un LAN."},{"name":"Habu","desc":"Suite réseau citée pour l’ARP poisoning. Le module donne une commande directe entre deux IP.","syntax":"habu.arp.poison <IP1> <IP2>"},{"name":"sslstrip","desc":"Proxy transparent utilisé depuis une position MITM pour maintenir la victime en HTTP pendant que l’attaquant utilise HTTPS vers le serveur. Le chapitre indique qu’ARP spoofing doit déjà placer le trafic sur la machine de l’attaquant.","exam":"Défait par HSTS et TLS 1.3 selon le chapitre."},{"name":"MAC Address Changer","desc":"Outil cité pour changer ou randomiser une adresse MAC et restaurer ensuite l’adresse d’origine."},{"name":"dhcpStarvation.py","desc":"Script cité comme outil de DHCP starvation pour épuiser le pool d’adresses."},{"name":"DHCPig","desc":"Outil cité pour les attaques de DHCP starvation."},{"name":"Hyenae","desc":"Outil cité parmi les solutions pouvant générer des attaques DHCP."},{"name":"ARP Spoofer / Iarp / RITM","desc":"Outils supplémentaires cités dans le module pour l’ARP poisoning et les attaques de type MITM."}]},{"g":"Surveillance & IA","items":[{"name":"arpwatch","desc":"Outil de surveillance des associations MAC↔IP. Il peut alerter lorsque les mappings changent de manière inattendue, ce qui aide à repérer un ARP spoofing."},{"name":"NetNerve","desc":"Plateforme d’analyse de paquets assistée par IA citée pour accélérer l’interprétation de grandes captures et produire des informations de menace en langage lisible."},{"name":"AGILITY","desc":"Plateforme citée pour analyser avec l’IA de grands volumes de données de paquets sur des réseaux 4G/5G."},{"name":"Scapy","desc":"Bibliothèque de manipulation de paquets mentionnée comme pouvant être intégrée à des workflows d’analyse assistée par IA en temps réel."}]}]},"port":{"groups":[{"g":"Protocoles particulièrement exposés au sniffing","items":[{"name":"Telnet & Rlogin","desc":"Protocoles cités comme vulnérables car les frappes, noms d’utilisateur et mots de passe peuvent circuler sans chiffrement."},{"name":"HTTP","desc":"Le trafic HTTP non chiffré peut exposer les données envoyées par l’utilisateur. Une capture peut donc révéler le contenu des requêtes et réponses."},{"name":"SNMPv1 / SNMPv2","desc":"Versions de SNMP citées comme ne fournissant pas une protection forte du trafic ; le module recommande SNMPv3 pour une meilleure sécurité."},{"name":"SMTP","desc":"Le trafic SMTP peut exposer le contenu des messages lorsqu’il n’est pas chiffré."},{"name":"NNTP","desc":"Protocole cité comme ne chiffrant pas les données par défaut."},{"name":"POP","desc":"Le module classe POP parmi les protocoles dont le flux peut être observé en clair."},{"name":"FTP","desc":"FTP est cité comme protocole non chiffré dont les identifiants et données peuvent être capturés."},{"name":"IMAP","desc":"Le module classe IMAP non protégé parmi les protocoles dont les données/identifiants peuvent être sniffés."},{"name":"TFTP","desc":"TFTP fonctionne sur UDP et ne fournit ni authentification ni chiffrement dans le cadre décrit par le module."}]},{"g":"Protocoles & mécanismes du LAN","items":[{"name":"ARP","desc":"Protocol local de résolution IPv4→MAC. Son absence d’authentification permet les attaques de cache poisoning."},{"name":"DHCP","desc":"Protocol d’attribution dynamique de configuration IP. Les broadcasts et l’absence de confiance forte dans le serveur sont exploités dans starvation et rogue DHCP."},{"name":"DNS — UDP 53","desc":"Le module souligne l’usage d’UDP pour DNS et cite UDP 53 comme port source à ne pas laisser prévisible. DNSSEC sert à signer les réponses et à limiter leur falsification.","tr":"udp"},{"name":"802.1Q","desc":"Standard de tagging VLAN utilisé dans les trunks. Le double tagging exploite la présence d’un tag externe et d’un tag interne."},{"name":"STP / BPDU","desc":"STP évite les boucles Ethernet ; les switches échangent des BPDUs et élisent un root bridge via le BID."},{"name":"TLS / SSL","desc":"Le chiffrement protège le payload contre le sniffing. SSL est présenté comme obsolète au profit de TLS ; Wireshark ne peut déchiffrer que si les secrets nécessaires sont disponibles."},{"name":"SSH / SCP / SFTP","desc":"Protocoles sécurisés recommandés dans les contre-mesures pour remplacer Telnet et FTP lorsqu’une communication distante ou un transfert de fichiers doit être protégé."},{"name":"HTTPS","desc":"HTTP protégé par TLS ; recommandé à la place de HTTP afin d’empêcher la lecture directe du contenu capturé."},{"name":"DNSSEC","desc":"Extension de sécurité DNS utilisant des signatures cryptographiques afin de permettre la validation des réponses DNS et de réduire les possibilités de spoofing."},{"name":"WPA2 / WPA3","desc":"Mécanismes de protection Wi-Fi recommandés pour chiffrer le trafic sans fil."},{"name":"VPN / IPsec","desc":"Les tunnels chiffrés sont recommandés pour protéger le trafic sur des réseaux non sûrs et limiter l’intérêt d’une capture."}]}]},"contre":{"groups":[{"g":"Protection contre MAC Flooding / MAC Spoofing","items":[{"name":"Cisco Port Security","desc":"Port Security limite les adresses MAC autorisées sur un port d’accès. Si un port reçoit trop d’adresses inattendues ou une MAC non autorisée, le switch peut considérer cela comme une violation et bloquer le port.","syntax":"interface <interface_id>\nswitchport mode access\nswitchport port-security","exam":"Le module indique qu’un port peut être limité à une seule MAC et qu’une violation peut provoquer un shutdown et un SNMP trap."},{"name":"DHCP Snooping Binding Table","desc":"La binding table conserve notamment MAC, IP, durée du bail, VLAN et interface. Elle sert de source de confiance pour d’autres mécanismes de sécurité du switch, notamment Dynamic ARP Inspection et IP Source Guard."},{"name":"IP Source Guard","desc":"Contrôle cité avec DHCP Snooping et DAI pour empêcher qu’un port utilise une combinaison IP/MAC qui ne correspond pas aux bindings légitimes."},{"name":"Router derrière les serveurs sensibles","desc":"Le module recommande de placer le serveur derrière un routeur comme protection supplémentaire contre certains scénarios de MAC spoofing, les routeurs prenant leurs décisions de forwarding au niveau IP plutôt qu’à partir de la MAC du client distant."},{"name":"MAC Filtering","desc":"Le filtrage MAC peut limiter les équipements autorisés à se connecter, mais il doit être combiné avec d’autres contrôles car une MAC peut être observée puis usurpée."}]},{"g":"Protection DHCP","items":[{"name":"DHCP Snooping — principe","desc":"DHCP Snooping distingue les ports trusted et untrusted. Seuls les ports reliés aux serveurs DHCP légitimes doivent accepter les réponses serveur ; les ports clients restent non fiables. Le switch peut aussi limiter le débit de messages DHCP afin de réduire le starvation."},{"name":"DHCP Snooping — commandes Cisco","desc":"La configuration active d’abord DHCP Snooping globalement, l’active sur les VLANs concernés, marque l’interface du vrai serveur comme trusted puis applique éventuellement une limite de débit sur les ports clients.","syntax":"ip dhcp snooping\nip dhcp snooping vlan 4,104\nip dhcp snooping trust\nip dhcp snooping limit rate <rate>\nshow ip dhcp snooping\nno ip dhcp snooping information option","exam":"Tous les ports du VLAN sont untrusted par défaut selon le module."},{"name":"Rate Limiting DHCP","desc":"Limiter le nombre de messages DHCP qu’un port peut envoyer par seconde réduit la capacité d’un poste compromis à épuiser rapidement le pool d’adresses."}]},{"g":"Protection ARP","items":[{"name":"Dynamic ARP Inspection — DAI","desc":"DAI inspecte les paquets ARP et compare l’association IP/MAC/port avec les informations de confiance, notamment la DHCP Snooping table. Une réponse ARP qui ne correspond pas au binding attendu peut être rejetée.","syntax":"show ip arp inspection\nip arp inspection validate <address-type>","exam":"DAI + DHCP Snooping = défense centrale contre ARP poisoning dans le module."},{"name":"Static ARP Entries","desc":"Fixer statiquement certaines associations IP↔MAC importantes — par exemple celle de la gateway — empêche leur remplacement automatique par une réponse ARP falsifiée."},{"name":"Surveiller les changements ARP","desc":"Une variation inattendue d’une association IP↔MAC ou une forte quantité de gratuitous ARP peut révéler un poisoning. Des outils de monitoring comme arpwatch peuvent alerter sur ces changements."},{"name":"IDS / IPS","desc":"Un IDS/IPS peut repérer des patterns anormaux associés au spoofing, aux floods et aux changements d’adressage, puis générer une alerte ou bloquer le trafic."}]},{"g":"Protection DNS & TLS","items":[{"name":"DNSSEC","desc":"DNSSEC ajoute des signatures cryptographiques aux données DNS afin que le résolveur puisse vérifier qu’une réponse n’a pas été falsifiée. C’est la contre-mesure principale présentée contre le DNS spoofing."},{"name":"DNS local + filtrage externe","desc":"Faire résoudre les postes via un DNS interne connu et bloquer les résolutions directes vers des DNS externes réduit les chemins par lesquels un attaquant peut imposer un résolveur ou une réponse non autorisée."},{"name":"Randomiser le source port DNS","desc":"Le résolveur doit utiliser un port source aléatoire pour chaque requête au lieu d’un port prévisible. Le module recommande également de ne pas utiliser UDP 53 comme port source par défaut pour les requêtes sortantes."},{"name":"Limiter la récursion DNS","desc":"La récursion doit être réservée aux utilisateurs/systèmes autorisés afin de réduire les abus du résolveur."},{"name":"NXDOMAIN Rate Limiting","desc":"Limiter le volume de réponses ou requêtes NXDOMAIN est cité comme mécanisme de protection et de durcissement DNS."},{"name":"Audit & patch du DNS","desc":"Auditer régulièrement le serveur DNS et corriger ses vulnérabilités réduit les possibilités de poisoning et d’exploitation."},{"name":"HSTS","desc":"HSTS oblige le navigateur à utiliser HTTPS pour un site connu et empêche le downgrade vers HTTP utilisé par sslstrip. Le chapitre le cite comme protection contre cette technique."},{"name":"TLS / HTTPS","desc":"Chiffrer les sessions applicatives empêche un simple sniffer de lire les payloads capturés. HTTPS doit remplacer HTTP pour les communications web sensibles."}]},{"g":"Protection STP / VLAN","items":[{"name":"BPDU Guard","desc":"BPDU Guard protège les ports edge/PortFast : si un BPDU est reçu là où aucun switch ne devrait être connecté, le port est placé en état de violation/errdisable.","syntax":"spanning-tree portfast bpduguard"},{"name":"Root Guard","desc":"Root Guard empêche un port d’accepter un BPDU supérieur qui ferait devenir le switch voisin root bridge. Le port peut être placé en état loop-inconsistent.","syntax":"spanning-tree guard root","exam":"Root Guard protège l’élection du root bridge contre un rogue switch."},{"name":"Loop Guard","desc":"Loop Guard fait partie des mécanismes STP cités pour limiter les scénarios où une perte de BPDUs pourrait provoquer un état de forwarding indésirable."},{"name":"UDLD","desc":"UDLD (Unidirectional Link Detection) détecte les liens unidirectionnels et peut fonctionner en mode aggressive.","syntax":"udld { enable | disable | aggressive }"}]},{"g":"Contre-mesures générales au sniffing","items":[{"name":"Chiffrer les communications","desc":"Le moyen le plus direct de réduire la valeur d’une capture est de chiffrer les données : SSH plutôt que Telnet, HTTPS plutôt que HTTP, SCP/SFTP plutôt que FTP, ainsi que VPN, IPsec, SSL/TLS, PGP ou S/MIME selon l’usage."},{"name":"Switch plutôt que Hub","desc":"Un switch limite normalement le trafic de chaque hôte à son propre port, contrairement au hub qui répète tout le trafic. Cela réduit le sniffing passif, même si les attaques actives restent possibles."},{"name":"Segmentation par VLAN","desc":"Segmenter le réseau limite la quantité de trafic visible depuis un seul point et empêche qu’une interface située dans un VLAN voie naturellement les communications d’un autre VLAN."},{"name":"ACLs","desc":"Des ACLs peuvent limiter les adresses et flux autorisés, réduire l’accès aux segments sensibles et restreindre les communications non nécessaires."},{"name":"VPN sur réseaux non sûrs","desc":"Un VPN crée un tunnel chiffré sur un réseau public ou non fiable et empêche un observateur local de lire directement le contenu applicatif."},{"name":"WPA2 / WPA3","desc":"Le trafic Wi-Fi doit être chiffré avec WPA2 ou WPA3 plutôt que transmis sur un réseau ouvert."},{"name":"Éviter les Wi-Fi ouverts","desc":"Un réseau Wi-Fi non sécurisé facilite l’observation du trafic et les attaques locales. Le module recommande de ne pas utiliser de réseaux ouverts sans protection supplémentaire."},{"name":"Monitoring régulier","desc":"Surveiller et auditer régulièrement le trafic aide à détecter les anomalies : changements ARP, rogue devices, ports inhabituels et comportements de capture ou de spoofing."}]},{"g":"Détection de sniffers","items":[{"name":"Ping Method","desc":"Envoyer un paquet avec la bonne IP mais une mauvaise MAC : une interface normale doit le filtrer, tandis qu’une interface en mode promiscuous peut répondre. Une réponse est donc un indice, pas une preuve absolue."},{"name":"DNS Method","desc":"Surveiller les reverse DNS lookups générés par les machines. Un grand nombre de recherches inverses déclenchées par du trafic observé peut indiquer qu’un sniffer tente de résoudre les IP capturées."},{"name":"ARP Method","desc":"Utiliser un ARP non-broadcast puis un ping spécialement construit pour déterminer si une machine a mis en cache une information qu’elle n’aurait normalement pas dû voir. Une réponse peut indiquer un promiscuous mode."},{"name":"NetScanTools Pro","desc":"Le Promiscuous Mode Scanner automatise la recherche d’hôtes susceptibles d’être en mode promiscuous sur une plage d’adresses."}]}]}}},{"n":9,"t":"Ingénierie sociale","data":{"concept":{"groups":[{"g":"Fondamentaux & psychologie","items":[{"name":"Social engineering","desc":"Manipuler une personne afin qu’elle révèle une information, fournisse un accès ou réalise une action qu’elle n’aurait normalement pas faite pour quelqu’un qu’elle ne connaît pas. L’attaque vise donc d’abord la confiance, les habitudes et la prise de décision humaine plutôt qu’une faille purement technique.","exam":"Objectif principal : obtenir de l’information ou provoquer une action utile à l’attaquant."},{"name":"Pourquoi le social engineering fonctionne","desc":"Il exploite le fait que les utilisateurs veulent aider, font confiance à des rôles connus et ne réalisent pas toujours la valeur des informations auxquelles ils ont accès. Une attaque peut coûter peu, être difficile à détecter et contourner des contrôles techniques pourtant solides.","cheat":[{"title":"Facteurs d’efficacité","rows":[["Weakest link","la politique de sécurité reste limitée par le comportement humain"],["Low cost","beaucoup d’attaques demandent peu ou pas d’outillage spécialisé"],["Difficult to detect","une conversation ou une demande crédible peut sembler légitime"],["No complete technical fix","aucun matériel ou logiciel ne remplace la vigilance, la procédure et la vérification"]],"words":1}]},{"name":"Sources pré-attaque","desc":"Avant de contacter une cible, l’attaquant collecte des informations pour rendre son histoire crédible : site officiel de l’entreprise, noms/emails d’employés, publicités, blogs, forums, réseaux sociaux, organigrammes ou événements récents."},{"name":"Leviers psychologiques EC-Council","desc":"Les attaques combinent plusieurs ressorts pour accélérer la décision ou réduire l’esprit critique de la victime.","cheat":[{"title":"Leviers à connaître","rows":[["Authority","obéir à une personne perçue comme légitime ou supérieure"],["Intimidation","faire agir sous pression ou peur"],["Consensus","« les autres l’ont déjà fait »"],["Scarcity","présenter une ressource ou une opportunité comme rare"],["Urgency","réduire le temps laissé pour réfléchir ou vérifier"],["Familiarity","créer une impression de proximité ou de connaissance"],["Trust","construire ou exploiter une relation de confiance"],["Greed","faire miroiter un gain personnel"]],"words":1}],"exam":"Les scénarios CEH décrivent souvent un ou plusieurs de ces leviers sans les nommer directement."},{"name":"Cialdini — 6 principes d’influence","desc":"Le modèle de Cialdini décrit six mécanismes psychologiques fréquemment exploités dans les scénarios de manipulation. Ils peuvent être combinés dans une même attaque.","cheat":[{"title":"Les 6 principes","rows":[["Reciprocity","la victime se sent obligée de rendre un service après avoir reçu quelque chose"],["Commitment & Consistency","un petit engagement initial rend plus probable un engagement plus important ensuite"],["Social Proof","si d’autres personnes le font, le comportement paraît acceptable"],["Authority","les personnes ont tendance à suivre une figure d’autorité"],["Liking","on coopère plus facilement avec quelqu’un que l’on apprécie"],["Scarcity","la rareté augmente la valeur perçue et crée de l’urgence"]],"words":1}],"exam":"Exemple classique : « je suis le CFO, ce virement doit partir dans 30 minutes » = Authority + Scarcity/Urgency."},{"name":"Pretexting","desc":"Le pretexting consiste à construire une histoire crédible expliquant pourquoi l’attaquant contacte la victime et pourquoi sa demande paraît normale. Un bon prétexte s’appuie sur l’OSINT : noms, service, projet, fournisseur, incident ou événement réel."},{"name":"4 phases d’une attaque de social engineering","desc":"Le cours présente un cycle en quatre étapes. La qualité de la phase de recherche conditionne souvent la crédibilité du prétexte et la réussite des étapes suivantes.","flow":"Research the Target Company → Select a Target → Develop a Relationship → Exploit the Relationship","cheat":[{"title":"Étapes","rows":[["1. Research","comprendre l’entreprise, ses personnes, ses habitudes et son environnement"],["2. Select Target","choisir une personne ayant l’accès, l’information ou le profil exploitable"],["3. Develop Relationship","établir confiance et crédibilité"],["4. Exploit Relationship","obtenir l’information ou l’action recherchée"]],"words":1}],"exam":"Ordre à mémoriser."},{"name":"Cibles fréquentes","desc":"Réception, help desk, support technique, administrateurs système, utilisateurs, clients, fournisseurs et dirigeants sont ciblés parce qu’ils disposent soit d’informations utiles, soit d’un rôle leur permettant d’aider ou d’autoriser une action."},{"name":"Facteurs organisationnels de vulnérabilité","desc":"Une entreprise devient plus facile à manipuler lorsque la sensibilisation est insuffisante, que l’accès à l’information est peu régulé, que les équipes fonctionnent en silos ou que les politiques de sécurité sont absentes ou mal appliquées."},{"name":"Impacts pour l’organisation","desc":"Une attaque réussie peut provoquer pertes économiques, atteinte à la réputation, perte de confidentialité, litiges, interruption d’activité et perte de confiance des clients ou partenaires."}]},{"g":"Techniques humaines & physiques","items":[{"name":"Impersonation","desc":"L’attaquant se fait passer pour une personne légitime ou autorisée afin d’obtenir des informations ou un accès. Il peut se présenter comme employé, dirigeant, client, fournisseur, réparateur, support IT ou autorité externe.","exam":"C’est la technique human-based la plus directement centrée sur l’usurpation de rôle."},{"name":"Impersonation — profils utilisés","desc":"Le prétexte dépend du rôle choisi : utilisateur ayant oublié son mot de passe, VIP pressé, technicien venu résoudre une panne, fournisseur, client, réparateur ou personne invoquant l’autorisation d’un tiers.","cheat":[{"title":"Rôles typiques","rows":[["End user","« j’ai oublié mon mot de passe »"],["VIP / executive","pression hiérarchique et urgence"],["Technical support","demande d’identifiants sous prétexte de dépannage"],["Employee / client / vendor","exploite une relation de confiance existante"],["Repairman / authority","exploite l’apparence d’une autorisation physique ou institutionnelle"]],"words":1}]},{"name":"Eavesdropping","desc":"Écoute ou lecture non autorisée d’une conversation ou d’un message. L’information peut être interceptée sur un canal téléphonique, email, messagerie instantanée, conversation physique ou autre moyen de communication."},{"name":"Shoulder surfing","desc":"Observer directement un clavier, un écran, un code PIN, un numéro de compte ou une autre information sensible. L’observation peut se faire à proximité ou à distance avec un dispositif optique."},{"name":"Dumpster diving","desc":"Rechercher dans les déchets physiques ou bacs d’impression des informations réutilisables : notes, factures, coordonnées, organigrammes, procédures, calendriers, impressions d’emails, journaux d’utilisation ou mots de passe écrits."},{"name":"Reverse social engineering","desc":"Au lieu de contacter directement la victime pour demander de l’aide, l’attaquant crée une situation qui pousse la victime à venir elle-même vers lui. La relation semble alors plus légitime et la méfiance diminue.","cheat":[{"title":"3 techniques","rows":[["Sabotage","provoquer ou simuler une panne/problème"],["Marketing","faire connaître un faux contact ou une fausse offre de support"],["Support","aider la victime et maintenir la crédibilité même après obtention de l’information"]],"words":1}],"exam":"Sabotage → Marketing → Support."},{"name":"Piggybacking","desc":"Une personne autorisée permet à une personne non autorisée de franchir une porte sécurisée, volontairement ou parce qu’elle pense rendre service. Il y a interaction ou consentement de la personne autorisée.","exam":"Piggybacking = WITH consent/interaction."},{"name":"Tailgating","desc":"L’attaquant suit une personne autorisée à travers une porte sécurisée sans que celle-ci ne lui donne réellement l’autorisation d’entrer. Un faux badge peut renforcer la crédibilité.","exam":"Tailgating = WITHOUT consent/knowledge."},{"name":"Diversion theft","desc":"Détourner une livraison légitime vers un emplacement contrôlé par l’attaquant en trompant le transporteur ou la personne responsable du colis."},{"name":"Third-party authorization","desc":"L’attaquant affirme qu’une personne absente — manager, dirigeant, client — lui a donné l’autorisation de recevoir une information ou d’effectuer une action. L’absence du tiers complique la vérification immédiate."},{"name":"Tech support attack","desc":"L’attaquant se fait passer pour le support interne ou un prestataire technique afin de demander un mot de passe, un code, un accès distant ou une action prétendument nécessaire au dépannage."},{"name":"Quid pro quo","desc":"L’attaquant propose directement un service ou un avantage en échange d’une information ou d’un accès. Exemple : prétendre être le support et « réparer » un problème en échange des identifiants.","exam":"Quid pro quo = échange direct ; baiting = appât que la victime découvre ou consomme."},{"name":"Elicitation","desc":"Obtenir progressivement une information précise au cours d’une conversation naturelle et non menaçante, sans poser frontalement la question sensible. La technique repose sur le rapport, la curiosité et les formulations indirectes."},{"name":"Baiting","desc":"Présenter ou laisser un objet/offre suffisamment tentant pour provoquer une action : clé USB « Salary Info », fichier « Confidential », cadeau ou lien attrayant. La curiosité de la victime devient le déclencheur."},{"name":"Badge access","desc":"Les badges RFID servent de contrôle d’accès physique. Une attaque peut consister à voler le badge, le dupliquer ou profiter d’un passage ouvert par une autre personne."},{"name":"RFID cloning","desc":"Copier le signal ou l’identifiant d’un badge RFID vers un support vierge ou compatible. Le chapitre cite les bandes 125 kHz et 13,56 MHz et mentionne l’usage possible de technologies NFC sur téléphone ou de matériels dédiés."},{"name":"Man trap","desc":"Contrôle physique composé de deux portes successives. La seconde ne s’ouvre qu’après fermeture de la première et vérification de l’identité, afin d’imposer le passage d’une seule personne à la fois."},{"name":"Biométrie — principe","desc":"L’authentification biométrique utilise une caractéristique physique ou comportementale propre à une personne : empreinte, iris, rétine, voix, veines de la paume, démarche ou visage."},{"name":"Biométrie — FAR / FRR / CER","desc":"Les systèmes biométriques sont évalués par leurs taux d’erreur. Réduire l’un des taux peut augmenter l’autre ; le point d’équilibre permet de comparer globalement les systèmes.","cheat":[{"title":"Mesures","rows":[["FAR","False Acceptance Rate : un imposteur est accepté — faux positif de sécurité"],["FRR","False Rejection Rate : un utilisateur légitime est rejeté — faux négatif d’usage"],["CER / EER","Crossover/Equal Error Rate : point où FAR = FRR ; plus il est bas, meilleur est le système"]],"words":1}],"exam":"Best comparison metric = CER/EER le plus faible."},{"name":"Biométrie — principales faiblesses","desc":"Les empreintes peuvent être reproduites si le lecteur ne vérifie pas suffisamment le vivant, la voix varie et peut être imitée par clonage vocal, la reconnaissance faciale nécessite des contrôles de liveness ; l’iris et la rétine offrent des propriétés différentes de précision et d’ergonomie."}]},{"g":"Phishing & techniques informatiques","items":[{"name":"Phishing","desc":"Envoi d’un message illégitime se faisant passer pour une source de confiance afin d’obtenir des informations, rediriger la victime vers une fausse page ou livrer un contenu malveillant. Le canal peut être email, messagerie ou réseau social."},{"name":"Pourquoi le phishing réussit","desc":"La réussite repose sur le manque de connaissance, la ressemblance visuelle avec des services légitimes, l’inattention aux indicateurs de sécurité et l’usage de pression psychologique."},{"name":"Spear phishing","desc":"Phishing ciblé contre une personne ou un petit groupe. L’attaquant utilise les informations OSINT — rôle, collègues, projets, événements — pour rendre le message crédible et pertinent.","exam":"Targeted individual = spear phishing."},{"name":"Whaling","desc":"Spear phishing visant une cible de grande valeur ou de haut niveau : CEO, CFO, responsable politique, célébrité ou autre personne disposant d’un accès privilégié.","exam":"Executive / high-profile = whaling."},{"name":"Pharming","desc":"Redirection de trafic vers un site frauduleux sans lure classique envoyé directement à l’utilisateur. Le cours cite le DNS cache poisoning et la modification du fichier hosts.","exam":"« Phishing without a lure » = pharming."},{"name":"Spimming","desc":"Variante de spam/phishing utilisant les plateformes de messagerie instantanée pour diffuser des liens, collecter des identifiants ou pousser des contenus indésirables."},{"name":"Clone phishing","desc":"Copie presque identique d’un message légitime existant dans laquelle le lien ou la pièce jointe est remplacé par une destination malveillante."},{"name":"E-wallet phishing","desc":"Attaque de phishing ciblant les utilisateurs de portefeuille électronique en imitant un fournisseur légitime afin de récupérer des informations ou autorisations sensibles."},{"name":"Tabnabbing","desc":"Une page déjà ouverte modifie son apparence lorsque l’utilisateur consulte un autre onglet puis revient, afin de ressembler à une page connue et pousser à se réauthentifier.","exam":"La victime revient sur un onglet qui a changé."},{"name":"Reverse tabnabbing","desc":"L’utilisateur ouvre un lien depuis une page apparemment légitime ; la nouvelle page profite de la relation entre onglets pour modifier ou remplacer le contenu de l’onglet d’origine par une fausse page."},{"name":"Consent phishing","desc":"Une fausse application exploite un flux OAuth légitime et pousse la victime à lui accorder des permissions. Le mot de passe n’est pas nécessairement volé : l’autorisation donnée à l’application devient le moyen d’accès.","exam":"OAuth abuse = consent phishing."},{"name":"Search engine phishing","desc":"Manipuler le référencement ou les résultats de recherche pour faire apparaître un site frauduleux parmi les réponses attendues de la victime."},{"name":"Pop-up windows","desc":"Fausses alertes ou fenêtres de support prétendent qu’un système est infecté ou bloqué afin de faire appeler un numéro, saisir des informations ou installer un logiciel."},{"name":"Hoax letters","desc":"Messages d’alerte à propos d’une menace inexistante. Ils créent panique, perte de temps et diffusion d’informations erronées même sans charge malveillante réelle."},{"name":"Chain letters","desc":"Messages demandant d’être transférés à plusieurs personnes en promettant récompense, chance ou gain. Ils exploitent la curiosité, la superstition ou l’appât du gain."},{"name":"Instant chat messenger abuse","desc":"L’attaquant utilise une conversation de messagerie instantanée pour obtenir des informations personnelles telles que date de naissance ou réponse à une question de sécurité."},{"name":"Spam email","desc":"Messages non sollicités pouvant servir à collecter des informations ou livrer des fichiers malveillants. Les noms de fichiers très longs ou les extensions multiples peuvent masquer la nature réelle d’une pièce jointe."},{"name":"Scareware","desc":"Fausses alertes de sécurité destinées à effrayer l’utilisateur et à le pousser à visiter un site, appeler un numéro ou installer un logiciel malveillant."},{"name":"Phishing — red flags","desc":"Vérifier l’adresse de l’expéditeur, le domaine réel derrière un lien, les fautes ou incohérences, l’urgence artificielle et les pièces jointes inattendues. Les attaquants peuvent cependant produire des messages très soignés.","cheat":[{"title":"À contrôler","rows":[["Sender","domaine et adresse cohérents avec l’identité annoncée"],["URL","survoler le lien, rechercher typo, sous-domaine trompeur ou protocole inattendu"],["Language","fautes classiques, mais moins fiables avec l’IA"],["Context","urgence, menace, demande inhabituelle, changement de procédure"],["Attachment","PDF, Office avec macro, ZIP/RAR ou exécutable déguisé"]],"words":1}]},{"name":"Contact spamming","desc":"Après compromission d’une boîte mail, l’attaquant peut contacter les relations déjà connues de la victime. Il peut aussi usurper l’adresse d’un contact identifié pendant la reconnaissance. Le mécanisme repose sur la confiance existante."},{"name":"Deepfake","desc":"Contenu audio ou vidéo synthétique imitant une personne réelle. Dans un scénario de social engineering, il renforce l’usurpation d’identité, la fraude au dirigeant, le vishing ou l’extorsion."},{"name":"AI-assisted social engineering","desc":"L’IA augmente surtout le réalisme, la personnalisation et l’échelle : rédaction de messages naturels, génération de variantes, adaptation à un profil, voix clonée, chatbot interactif et automatisation de campagnes."}]},{"g":"Identity theft","items":[{"name":"Identity theft","desc":"Vol d’informations personnellement identifiables (PII) dans le but d’usurper une identité et de commettre une fraude ou un autre délit. L’identité volée peut aussi servir à se faire passer physiquement pour un employé."},{"name":"PII fréquemment recherchées","desc":"Nom, adresse personnelle ou professionnelle, numéro de téléphone, date de naissance, données médicales et d’assurance, données biométriques, coordonnées bancaires, carte bancaire, rapport de crédit, permis de conduire et passeport."},{"name":"Criminal identity theft","desc":"Une personne utilise l’identité d’un tiers lors d’une infraction ou face aux autorités afin que les conséquences soient attribuées à la victime."},{"name":"Financial identity theft","desc":"Utilisation frauduleuse d’informations bancaires ou de carte de paiement pour retirer de l’argent, effectuer des achats ou ouvrir de nouveaux comptes."},{"name":"Driver's License identity theft","desc":"Utilisation du permis de conduire d’une autre personne comme identité, notamment pour faire attribuer à la victime des infractions ou obligations qu’elle n’a pas commises."},{"name":"Insurance identity theft","desc":"Utilisation des informations d’assurance d’une victime afin d’obtenir des soins ou services pris en charge à sa place."},{"name":"Medical identity theft","desc":"Utilisation des données d’une victime pour obtenir des produits ou soins médicaux. Les informations incorrectes ajoutées au dossier peuvent ensuite affecter la prise en charge de la vraie personne."},{"name":"Tax identity theft","desc":"Utilisation d’un identifiant fiscal ou équivalent afin de déposer une déclaration ou demander un remboursement au nom de la victime."},{"name":"Obtention de PII","desc":"Le cours cite notamment vol/reroutage de courrier, collecte d’informations sur les réseaux sociaux et achat de données sur le dark web."},{"name":"Signes d’usurpation d’identité","desc":"Transactions inconnues, factures manquantes, comptes non reconnus, appels de créanciers, soins jamais reçus, plusieurs déclarations fiscales, refus de prestation ou notification de fuite de données peuvent révéler une usurpation."}]},{"g":"Mobile, QR & réseaux sociaux","items":[{"name":"Publishing malicious apps","desc":"L’attaquant publie une application mobile malveillante, souvent sous l’apparence d’un jeu ou service utile. Une fois installée, elle collecte ou transmet des informations à l’attaquant."},{"name":"Repackaging legitimate apps","desc":"Une application légitime est téléchargée, modifiée pour embarquer du code malveillant puis redistribuée, souvent via une boutique tierce. L’utilisateur pense installer l’application originale."},{"name":"Fake security application","desc":"Un malware ou faux message pousse l’utilisateur à installer une prétendue application de sécurité ou bancaire. L’application peut ensuite voler les identifiants et intercepter un second facteur par SMS."},{"name":"SMiShing","desc":"Phishing par SMS. Le message pousse à agir immédiatement : suivre un lien, télécharger une application ou appeler un faux numéro.","exam":"SMS = SMiShing."},{"name":"Vishing","desc":"Phishing par la voix ou le téléphone. L’attaquant se fait souvent passer pour la banque, le support, un manager ou un prestataire et s’appuie sur un prétexte préparé.","exam":"Phone/voice = Vishing."},{"name":"QRLJacking","desc":"Abus d’un mécanisme de connexion par QR code. L’attaquant génère une vraie session de connexion, clone son QR code dans une page de phishing et pousse la victime à le scanner ; la session est alors associée au compte de la victime.","flow":"Attacker starts QR login → clones QR → phishing page → victim scans → session is hijacked","exam":"QR Code Login session hijack = QRLJacking."},{"name":"Social profile cloning","desc":"Créer un faux compte copiant nom, photo et informations d’une personne, puis ajouter ses contacts afin d’exploiter la confiance associée à cette identité."},{"name":"Account takeover","desc":"Compromettre le vrai compte d’une personne. Les contacts, l’historique et la réputation existants rendent l’usurpation plus crédible qu’un simple clone.","exam":"Cloning = fausse copie ; takeover = vrai compte compromis."}]},{"g":"Sites web & accès sans fil","items":[{"name":"Website cloning","desc":"Reproduire suffisamment de contenu HTML pour qu’une page ressemble au service légitime. Dans un scénario de phishing, une simple page de connexion convaincante peut suffire à récolter des identifiants."},{"name":"Rogue website","desc":"Site que l’utilisateur pense légitime mais dont la finalité réelle est le credential harvesting, la collecte d’informations ou la livraison de contenu malveillant."},{"name":"Typosquatting","desc":"Enregistrer un domaine très proche d’un domaine légitime mais contenant une faute de frappe probable. L’attaque repose sur l’erreur de saisie de l’utilisateur."},{"name":"URL hijacking / homograph","desc":"Utiliser une URL trompeuse visuellement proche de l’originale. Un homograph remplace certains caractères par des caractères Unicode ressemblants pour créer une adresse visuellement similaire."},{"name":"Watering hole","desc":"Compromettre un site que la cible visite régulièrement au lieu d’attaquer directement la personne. La cible est choisie après reconnaissance de ses habitudes.","exam":"Watering hole = site fréquenté par la cible, donc attaque ciblée."},{"name":"Rogue Wi-Fi network","desc":"Créer un faux point d’accès, souvent avec le même SSID qu’un réseau attendu. Les utilisateurs s’y connectent en pensant utiliser le réseau légitime, ce qui place leur trafic sous le contrôle de l’attaquant."},{"name":"Captive portal phishing","desc":"Un faux portail captif imite la page d’authentification d’un hôtel, aéroport, café ou entreprise. La victime fournit volontairement des identifiants en croyant se connecter au réseau."},{"name":"Wi-Fi deauthentication in social engineering","desc":"Un outil peut forcer des clients à quitter le point d’accès légitime ; ceux-ci tentent ensuite de se reconnecter, ce qui augmente les chances qu’ils choisissent un faux point d’accès portant le même SSID."},{"name":"WEP / WPA / WPA2 / WPA3 — rappel","desc":"Le chapitre associe le scénario rogue Wi-Fi aux mécanismes de sécurité sans fil : WEP est cassé, WPA est ancien, WPA2 utilise notamment AES et WPA3 introduit SAE et une meilleure résistance aux attaques hors ligne.","xref":[16]}]},{"g":"Automatisation & IA","items":[{"name":"Social-Engineer Toolkit (SET) — concept","desc":"SET regroupe dans une interface guidée plusieurs tâches de social engineering et s’appuie sur Metasploit pour automatiser les payloads, handlers et certains scénarios de campagne."},{"name":"Ce que SET automatise","desc":"Spear phishing, clonage de site avec credential harvesting, mass mailer, média infectieux, PowerShell et génération de QR codes. L’objectif est d’enchaîner les étapes sans configurer chaque composant séparément.","xref":[6]},{"name":"IA
