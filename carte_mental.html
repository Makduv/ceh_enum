 lent et moins certain : silence = open|filtered, pas automatiquement open."},{"name":"TCP Connect Scan — -sT","desc":"Le TCP Connect scan utilise l'appel système connect() de l'OS et termine réellement le three-way handshake. Il ne nécessite pas de raw socket ni de privilèges administrateur. Il est fiable, mais la connexion complète le rend plus visible et plus facile à journaliser côté cible.","flow":"Ouvert : SYN → SYN/ACK → ACK → RST\nFermé : SYN → RST","syntax":"nmap -sT -p 80,443 192.168.1.10","exam":"-sT = full-open / full connect ; pas de privilèges raw socket requis."},{"name":"SYN / Half-Open Scan — -sS","desc":"Nmap envoie SYN. Si le port répond SYN/ACK, il envoie immédiatement RST au lieu de terminer le handshake. La connexion n'est donc jamais complètement établie. Ce scan est rapide, très courant et demande des privilèges permettant de forger les paquets.","flow":"Ouvert : SYN → SYN/ACK → RST\nFermé : SYN → RST","syntax":"sudo nmap -sS 192.168.12.3","exam":"Le scan SYN est le scan TCP le plus populaire. Il est aussi appelé stealth ou half-open."},{"name":"Xmas / FIN / NULL Scans","desc":"Ces scans envoient des combinaisons inhabituelles de flags pour exploiter le comportement RFC 793 : un port fermé renvoie RST, alors qu'un port ouvert reste normalement silencieux. Comme le silence peut aussi venir d'un firewall, Nmap renvoie souvent open|filtered. Les piles Windows modernes ne suivent pas ce comportement de manière utile pour ces scans.","cheat":[{"words":1,"title":"Flags","rows":[["Xmas — -sX","FIN + URG + PSH"],["FIN — -sF","FIN uniquement"],["NULL — -sN","aucun flag"]]}],"exam":"Xmas, FIN et NULL : closed → RST ; open → silence ; ne fonctionnent pas correctement pour distinguer les ports sur Windows."},{"name":"Maimon Scan — -sM","desc":"Le scan Maimon envoie une combinaison FIN+ACK. Comme les scans FIN/NULL/Xmas, il dépend du comportement de certaines piles TCP dérivées de BSD et n'est pas adapté aux systèmes Windows modernes.","syntax":"nmap -sM <target>","exam":"Maimon = FIN + ACK."},{"name":"ACK Scan — -sA","desc":"L'ACK scan n'essaie pas de déterminer si une application écoute. Il envoie un ACK hors connexion pour étudier la réaction du filtrage. Un RST indique que le paquet a atteint la cible et que le port est 'unfiltered' ; l'absence de réponse ou certains ICMP indiquent 'filtered'. Il sert donc surtout à cartographier les règles d'un firewall.","syntax":"nmap -sA <target>","exam":"ACK scan = filtered/unfiltered, jamais open/closed.","xref":[12]},{"name":"IDLE / IPID Scan — -sI","desc":"L'IDLE scan utilise un hôte tiers appelé zombie possédant un compteur IPID prévisible. L'attaquant usurpe l'adresse du zombie lorsqu'il sonde la cible puis observe l'évolution de l'IPID du zombie. La cible ne voit jamais directement l'adresse IP de l'attaquant.","flow":"1. Lire IPID du zombie\n2. SYN vers cible en usurpant le zombie\n3. Port ouvert → cible répond au zombie → zombie émet RST\n4. Relire IPID et comparer","cheat":[{"words":1,"title":"Interprétation CEH","rows":[["IPID +2","port ouvert"],["IPID +1","port fermé / pas de réponse supplémentaire du zombie"]]}],"syntax":"nmap -sI <zombie> <target>","exam":"Le zombie doit avoir des IPID incrémentaux prévisibles. L'intérêt principal est de masquer l'IP source réelle."},{"name":"UDP Scan — -sU","desc":"Nmap envoie des datagrammes UDP et observe les réponses. Un ICMP Port Unreachable signifie clairement que le port est fermé. Une réponse UDP confirme qu'un service écoute, mais beaucoup de services restent silencieux même lorsqu'ils sont ouverts : Nmap doit alors conclure open|filtered et retransmettre, ce qui rend le scan lent.","syntax":"sudo nmap -sU -T4 192.168.12.3","exam":"ICMP type 3 code 3 = Port Unreachable = port UDP fermé.","xref":[1]},{"name":"SCTP INIT / COOKIE ECHO","desc":"SCTP dispose de ses propres mécanismes de découverte. Le scan INIT envoie un chunk INIT : INIT+ACK indique ouvert, ABORT indique fermé. Le scan COOKIE ECHO envoie un COOKIE ECHO ; un port ouvert le laisse souvent sans réponse alors qu'un port fermé renvoie ABORT. COOKIE ECHO peut passer certains filtres non stateful.","cheat":[{"words":1,"title":"Nmap","rows":[["-sY","SCTP INIT scan"],["-sZ","SCTP COOKIE ECHO scan"]]}],"exam":"SCTP INIT différencie clairement open/closed/filtered ; COOKIE ECHO est plus discret face à certains filtres non stateful."},{"name":"IPv6 Scanning","desc":"Nmap peut appliquer ses techniques de scan à des cibles IPv6. L'option -6 active l'adressage IPv6 ; les principes de port scanning restent les mêmes que pour IPv4.","syntax":"nmap -6 scanme.nmap.org"}]},{"g":"Services, OS & fingerprinting","items":[{"name":"Service / Version Detection","desc":"Après avoir trouvé un port ouvert, Nmap peut dialoguer avec le service et analyser sa bannière pour identifier le logiciel et sa version. Cette information est beaucoup plus exploitable qu'un simple numéro de port car elle permet de rechercher les vulnérabilités correspondant au composant réellement présent.","syntax":"nmap -sV 10.10.1.11\nnmap -sV --reason -v -sT 10.10.1.11\nnmap -sV -sC 10.10.1.11","exam":"-sV = service/version. Un numéro de port ne suffit pas à prouver quel logiciel écoute réellement."},{"name":"Aggressive Scan — -A","desc":"L'option -A regroupe plusieurs mécanismes de collecte détaillée dans un même scan : détection du système d'exploitation, détection des versions, scripts NSE par défaut et traceroute. Elle fournit beaucoup d'informations, mais elle est plus lente et plus visible qu'un scan ciblé.","syntax":"nmap -A 10.10.1.11","exam":"-A = OS + version + scripts par défaut + traceroute."},{"name":"Active OS Fingerprinting","desc":"L'empreinte active envoie des paquets spécialement construits et compare les réponses à une base de signatures. Nmap observe notamment la génération d'IPID, les numéros de séquence, la taille de fenêtre et d'autres comportements de la pile. La présence d'au moins un port ouvert et un port fermé améliore la précision de l'identification.","syntax":"nmap -O 10.10.1.11\nnmap -O --osscan-guess 10.10.1.11","exam":"-O = OS detection. Une base de signatures obsolète ou des OS partageant le même noyau limitent la précision."},{"name":"Passive OS Fingerprinting","desc":"L'empreinte passive n'envoie aucune sonde à la cible : elle observe du trafic déjà présent. Les indices principaux sont le TTL, la TCP Window Size, le bit DF et le champ ToS. C'est plus discret, mais le TTL observé a déjà été décrémenté par les routeurs traversés.","cheat":[{"words":1,"title":"Indices","rows":[["TTL","valeur initiale typique de l'OS, diminuée à chaque saut"],["Window Size","taille de fenêtre TCP habituelle"],["DF","comportement du Don't Fragment bit"],["ToS","valeur utilisée dans le champ Type of Service"]]}],"xref":[8]},{"name":"TTL & Window Size — repères","desc":"Certaines piles démarrent avec des TTL et tailles de fenêtre typiques. Ces valeurs servent d'indices et non de preuve absolue, car le TTL diminue à chaque routeur et les paramètres peuvent varier.","cheat":[{"words":1,"title":"Repères TTL / Window","rows":[["Linux 2.4+","TTL 64 — Window 5840"],["FreeBSD","TTL 64 — Window 65535"],["Windows","TTL 128 — Window 65535 ou 8192"],["OpenBSD","TTL 255 — Window 16384"],["Cisco IOS","TTL 255 — Window 4128"],["Solaris","TTL 255 — Window 8760"],["AIX","TTL 255 — Window 16384"]]}],"exam":"Repère rapide : 64 ≈ Linux/Unix, 128 ≈ Windows, 255 ≈ Cisco/Solaris/OpenBSD/AIX selon les autres indices."},{"name":"NSE — Nmap Scripting Engine","desc":"NSE étend Nmap avec des scripts écrits en Lua. Ils peuvent automatiser l'authentification, la découverte, le bruteforce, la détection de malware ou de vulnérabilités, et beaucoup d'autres tâches. Les scripts se terminent par .nse et peuvent être lancés individuellement ou par catégorie.","cheat":[{"words":1,"title":"Catégories citées","rows":[["auth / brute","authentification et bruteforce"],["broadcast / discovery","découverte"],["default / safe","scripts standard ou à faible impact"],["dos / exploit / intrusive","tests potentiellement perturbateurs"],["external / fuzzer","sources externes / fuzzing"],["malware / version / vuln","malware, versions et vulnérabilités"]]}],"syntax":"nmap --script=discovery <target>\nnmap --script-help=http-waf-detect.nse\nnmap --script smb-os-discovery.nse <target>","exam":"NSE = scripts Lua ; Linux : /usr/share/nmap/scripts."}]},{"g":"Vulnerability Scanning","items":[{"name":"Pourquoi utiliser un vulnerability scanner","desc":"Lancer aveuglément des exploits sur une cible est bruyant et peut provoquer des pannes. Un scanner de vulnérabilités part des ports et services détectés, identifie les faiblesses possibles et exécute des tests adaptés. Son objectif est d'identifier des vulnérabilités potentielles, pas de compromettre automatiquement la machine.","exam":"Scanner ≠ exploit. Les résultats doivent ensuite être validés.","xref":[5]},{"name":"True / False Positive & Negative","desc":"Un scanner compare ce qu'il observe à ses tests et signatures, mais il peut se tromper. Il faut distinguer la réalité de la vulnérabilité du verdict du scanner afin de savoir si le résultat est fiable.","cheat":[{"words":1,"title":"Matrice","rows":[["True Positive","la vulnérabilité existe et le scanner la détecte"],["False Positive","le scanner signale une vulnérabilité absente"],["False Negative","la vulnérabilité existe mais le scanner la manque"],["True Negative","aucune vulnérabilité et aucun signalement"]]}],"exam":"False negative = le cas le plus dangereux : la faiblesse est réelle mais invisible au scanner.","xref":[5]},{"name":"Credentialed / Grey-box Scan","desc":"Avec des identifiants valides, un scanner peut examiner des informations locales qui ne sont pas visibles depuis le réseau : configuration, patchs et composants installés. Dans un scan grey box/credentialed, les credentials peuvent être un couple utilisateur/mot de passe ou une clé SSH.","exam":"Un scan authentifié donne généralement une visibilité plus profonde qu'un scan réseau non authentifié.","xref":[5]},{"name":"OpenVAS — architecture & résultats","desc":"OpenVAS est un système open source de vulnerability assessment. Son interface web est Greenbone Security Assistant (GSA). Les tests sont des NVTs regroupés en familles et sélectionnés via des scan configurations. Les résultats incluent un QoD (Quality of Detection), qui exprime la confiance dans la détection ; on peut également ajouter des notes et ajuster la sévérité selon le contexte.","cheat":[{"words":1,"title":"À retenir","rows":[["GSA","interface web"],["NVT","Network Vulnerability Test"],["Families","regroupement des NVT"],["QoD","confiance qu'un finding soit un vrai positif"],["Tasks","scan à lancer sur une cible avec une configuration"],["Dashboard","évolution globale dans le temps, pas le détail de chaque vulnérabilité"]]}],"exam":"OpenVAS permet notes + changement de sévérité, ce qui le rapproche d'un outil de vulnerability management."},{"name":"Nessus — principes","desc":"Nessus est un scanner commercial. Une policy définit la découverte, l'assessment, le reporting et les paramètres avancés. Il accepte notamment des credentials SSH et Windows, et ses plugins sont écrits en NASL. Dans un Basic Network Scan, le scan de ports communs est activé par défaut tandis que les tests de vulnérabilités web sont désactivés par défaut.","cheat":[{"words":1,"title":"À retenir","rows":[["NASL","Nessus Attack Scripting Language"],["Discovery","découverte et ports"],["Assessment","paramètres des tests, notamment web"],["Report","verbosité du rapport"],["Advanced","accès à l'ensemble des réglages"],["Audit trail","historique des actions, cité comme différence avec OpenVAS"]]}],"exam":"Nessus : web vulns off par défaut dans le Basic Network Scan ; plugins en NASL.","xref":[5]},{"name":"Validation manuelle des findings","desc":"Un scanner peut produire des faux positifs ou rater une faiblesse. Avant de présenter une vulnérabilité comme un finding confirmé, il faut la vérifier avec un outil adapté ou, lorsque le périmètre l'autorise, avec un module Metasploit. La validation transforme une simple suspicion en preuve exploitable dans le rapport.","exam":"Toujours vérifier les findings importants avant de les présenter comme vulnérabilités confirmées.","xref":[5,6]}]},{"g":"Packet Crafting & manipulation","items":[{"name":"Packet Crafting & Raw Sockets","desc":"Normalement, l'application demande une connexion et la pile réseau de l'OS construit automatiquement des paquets valides. Le packet crafting contourne ce comportement : l'outil contrôle directement les champs IP/TCP/UDP pour produire des combinaisons que l'OS ne générerait pas. Les raw sockets donnent ce contrôle bas niveau.","cheat":[{"words":1,"title":"Pourquoi le faire","rows":[["Custom flags","combinaisons TCP inhabituelles"],["Spoofing","adresse source choisie"],["Payload","taille et contenu contrôlés"],["Malformed packets","tester les réactions d'une pile ou d'un filtre"],["Evasion","fragmenter / modifier le trafic pour tester IDS et firewall"]]}],"xref":[12]},{"name":"Spoofing — conséquence pratique","desc":"Usurper l'adresse IP source peut masquer l'origine apparente du paquet, mais les réponses normales repartent vers l'adresse usurpée. L'attaquant ne voit donc généralement pas les réponses. Le spoofing est utile lorsque le but est de provoquer du trafic, de construire un scan indirect ou de tester des règles de filtrage, mais pas pour une conversation bidirectionnelle classique.","exam":"Source IP spoofée = réponses envoyées à l'IP usurpée, pas à l'émetteur réel."},{"name":"MTU, fragmentation & chaff","desc":"La MTU est la taille maximale qu'une technologie de liaison transporte sans fragmentation. Les paquets plus grands sont découpés. Des outils comme Fragroute peuvent fragmenter, réordonner ou injecter du chaff (paquets inutiles/dupliqués) pour tester si un IDS, un firewall et la cible reconstruisent le même flux.","cheat":[{"words":1,"title":"Termes","rows":[["MTU","Maximum Transmission Unit"],["Fragmentation","découpe d'un paquet en fragments"],["Chaff","paquets inutiles ou dupliqués ajoutés au flux"],["Overlap","fragments qui se chevauchent avec données conflictuelles"]]}],"xref":[12]}]},{"g":"Évasion IDS / Firewall","items":[{"name":"Pourquoi l'évasion fonctionne","desc":"Un firewall peut bloquer la sonde et un IDS/IPS peut repérer un scan. Les techniques d'évasion cherchent à modifier le rythme, la forme ou le chemin du trafic pour qu'il ressemble moins à une activité de scan ou pour créer une différence entre ce que voit l'équipement de sécurité et ce que reconstruit la cible.","xref":[12]},{"name":"Encryption / Encoding / Polymorphism","desc":"Le chiffrement cache le contenu à un équipement qui ne peut pas déchiffrer le flux. L'encoding modifie la représentation d'une chaîne afin d'échapper à une signature simple. Le polymorphisme change les octets d'un contenu malveillant pour produire une empreinte différente tout en conservant sa fonction.","exam":"Changer les octets change le hash : une signature basée uniquement sur l'empreinte peut ne plus correspondre.","xref":[12]},{"name":"Fragmentation & Overlapping Fragments","desc":"La fragmentation sépare un message en morceaux. Si l'IDS ne réassemble pas exactement comme la cible, il peut manquer une signature répartie sur plusieurs fragments. Les overlaps vont plus loin : des fragments se chevauchent avec des données contradictoires, de sorte que l'IDS et l'OS peuvent reconstruire deux contenus différents.","exam":"Le point clé des overlaps est la différence de réassemblage entre l'IDS et la cible.","xref":[12]},{"name":"Malformed Data & scans inverses","desc":"Les protocoles imposent des règles sur les combinaisons de champs et de flags. Des paquets illégaux ou inhabituels peuvent passer un filtre stateless mal conçu et provoquer malgré tout une réponse révélatrice de la pile cible. C'est la logique derrière les scans Xmas, FIN et NULL.","exam":"Xmas/FIN/NULL sont à la fois des techniques de scan et des exemples de trafic anormal pouvant contourner des règles simplistes."},{"name":"Low-and-Slow","desc":"Un scan très rapide crée un motif évident : beaucoup de ports ou d'hôtes touchés en peu de temps. Low-and-slow espace les sondes pour rester sous les seuils de détection et mieux se fondre dans le trafic normal. Nmap matérialise cette stratégie avec les timings très lents T0/T1.","syntax":"nmap -T0 <target>\nnmap -T1 <target>","xref":[12]},{"name":"Resource Consumption & Screen Blindness","desc":"Deux approches cherchent à saturer la défense plutôt qu'à la contourner proprement. Resource consumption épuise CPU ou mémoire pour qu'un équipement dégrade son inspection ou 'fail open'. Screen blindness génère une masse d'alertes factices afin de noyer l'activité réelle dans le bruit opérationnel.","exam":"Resource consumption vise le dispositif ; screen blindness vise surtout la capacité de l'analyste à distinguer le signal du bruit.","xref":[10,12]},{"name":"Tunneling","desc":"Le tunneling transporte des données à l'intérieur d'un autre protocole qui paraît légitime au réseau. GRE, SSH, HTTP, ICMP et DNS peuvent servir de protocoles de transport. L'équipement intermédiaire voit le protocole extérieur ; le contenu réel est encapsulé à l'intérieur.","exam":"Tunneling = données cachées/transportées dans un autre protocole, pas simplement chiffrement.","xref":[12]},{"name":"Nmap Fragmentation — -f / --mtu","desc":"La fragmentation divise les sondes en petits fragments IP afin de tester si un filtre ou un IDS réassemble correctement le trafic. -f active la fragmentation et --mtu permet de choisir une petite taille de fragment. Une cible moderne peut parfaitement détecter ou bloquer cette technique : elle ne rend pas un scan invisible par magie.","syntax":"nmap -f <target>\nnmap -ff <target>\nnmap --mtu 24 <target>","exam":"--mtu : valeur multiple de 8 dans les exemples CEH.","xref":[12]},{"name":"IP Decoys — -D","desc":"Le decoy scan envoie des sondes provenant de plusieurs sources apparentes afin que les journaux de la cible contiennent plusieurs adresses. La véritable adresse est mélangée aux leurres ; ME permet de choisir sa position dans une liste explicite.","syntax":"nmap -D RND:10 <target>\nnmap -D 192.168.1.1,ME,192.168.1.3 <target>","exam":"Decoy ≠ spoofing pur : Nmap mélange la vraie source à plusieurs leurres afin de compliquer l'identification.","xref":[12]},{"name":"Source Port Manipulation — -g","desc":"Certaines règles de firewall mal conçues font confiance au numéro de port source. Nmap peut fixer ce port pour faire ressembler la sonde à du trafic provenant d'un service autorisé, par exemple DNS 53 ou HTTP 80. La technique ne fonctionne que si la règle de filtrage est réellement trop permissive.","syntax":"nmap --source-port 53 <target>\nnmap -g 80 <target>\nnmap -g 443 <target>","exam":"-g et --source-port fixent le port SOURCE, pas le port destination.","xref":[12]},{"name":"IP Address Spoofing — -S","desc":"-S remplace l'adresse IP source par une autre adresse. La cible répond alors à l'adresse usurpée, ce qui signifie que l'émetteur réel ne reçoit normalement pas les réponses. C'est utile pour tester l'anti-spoofing ou construire certains scénarios indirects, pas pour un scan bidirectionnel classique.","syntax":"nmap -S 192.168.1.100 <target>","exam":"IP spoofing masque la source apparente mais aveugle généralement l'émetteur aux réponses."},{"name":"Randomize Hosts","desc":"Scanner une plage dans l'ordre numérique produit un motif très facile à repérer. --randomize-hosts change l'ordre des cibles afin d'éviter une séquence évidente. Cela réduit un indicateur simple mais ne supprime pas les autres traces du scan.","syntax":"nmap --randomize-hosts 10.0.0.0/24"},{"name":"Source Routing","desc":"Le source routing place dans le paquet des informations indiquant le chemin que celui-ci devrait emprunter. Strict source routing précise le chemin complet ; loose source routing n'impose qu'une partie des sauts. Un réseau correctement filtré doit bloquer cette possibilité lorsqu'elle pourrait contourner le routage ou les contrôles prévus.","exam":"Deux formes : strict = chemin complet ; loose = chemin partiel.","xref":[12]},{"name":"Bad Checksum Probe","desc":"--badsum force Nmap à envoyer des paquets dont le checksum TCP/UDP est invalide. Une pile réseau normale doit les rejeter. Si une réponse apparaît malgré tout, elle peut provenir d'un équipement intermédiaire qui ne valide pas correctement le checksum ; la technique aide donc à identifier/tester certaines middleboxes.","syntax":"nmap --badsum <target>","exam":"Un système final normal ne doit pas répondre à un paquet dont le checksum est invalide."},{"name":"MAC Spoofing — limite couche 2","desc":"Une adresse MAC ne voyage que sur le segment local. À chaque passage par un routeur, l'en-tête Ethernet est remplacé pour le lien suivant. Usurper une MAC peut donc servir à tester un contrôle local basé sur la MAC, mais la MAC falsifiée n'atteint pas une cible située derrière plusieurs routeurs.","syntax":"nmap --spoof-mac 00:11:22:33:44:55 <target>\nnmap --spoof-mac 0 <target>\nnmap --spoof-mac Dell <target>","exam":"MAC spoofing = local segment seulement.","xref":[1,8]}]}]},"outil":{"groups":[{"g":"Nmap & Zenmap","items":[{"name":"Nmap","desc":"Network Mapper regroupe découverte d'hôtes, scans TCP/UDP/SCTP, détection de services et d'OS, scripting NSE, réglage du timing, formats de sortie et techniques de test de filtrage. Ses options sont plus faciles à retenir lorsqu'elles sont classées par objectif.","syntax":"nmap <options> <target>\n# Exemple complet\nsudo nmap -sS -sV -O -T4 -p- -oA scan 10.0.0.5","cheat":[{"title":"Host discovery","rows":[["-sn","host discovery uniquement, pas de port scan"],["-Pn","considère les cibles actives, saute la découverte"],["-PR","ARP ping, très fiable sur LAN"],["-PE","ICMP Echo"],["-PP","ICMP Timestamp"],["-PM","ICMP Address Mask"],["-PS<ports>","TCP SYN ping"],["-PA<ports>","TCP ACK ping"],["-PU<ports>","UDP ping"],["-PO","IP Protocol ping"],["--disable-arp-ping","désactive l'ARP ping automatique sur le LAN"]]},{"title":"Scan types","rows":[["-sS","TCP SYN / half-open"],["-sT","TCP Connect complet"],["-sU","UDP"],["-sX / -sF / -sN","Xmas / FIN / NULL"],["-sM","Maimon FIN+ACK"],["-sA","ACK — filtered/unfiltered"],["-sI <zombie>","IDLE / IPID scan"],["-sY / -sZ","SCTP INIT / COOKIE ECHO"],["-6","IPv6"]]},{"title":"Ports & vitesse","rows":[["-p 22,80,443","ports explicites"],["-p-","tous les ports 0–65535"],["--top-ports <n>","n ports les plus courants"],["-T0 … -T5","timing paranoid → insane"],["-n","désactive la résolution DNS"],["--min-parallelism","contrôle le parallélisme minimal"],["--randomize-hosts","ordre des hôtes aléatoire"]]},{"title":"Détection & NSE","rows":[["-sV","détection service/version"],["-O","détection OS"],["--osscan-guess","devine l'OS plus agressivement"],["-A","OS + versions + scripts défaut + traceroute"],["-sC","scripts NSE par défaut"],["--script=<nom|cat>","lance un script ou une catégorie NSE"],["--script-help=<script>.nse","aide sur un script"],["--reason","explique pourquoi Nmap attribue un état"]]},{"title":"Évasion / spoofing","rows":[["-f / -ff","fragmentation"],["--mtu <n>","MTU personnalisé ; utiliser un multiple de 8"],["-D RND:10","decoys aléatoires"],["-D d1,ME,d2","decoys explicites ; ME = vraie IP"],["-S <IP>","source IP spoofée"],["--spoof-mac <MAC|vendor|0>","MAC spécifique, constructeur ou aléatoire"],["-g / --source-port <port>","fixe le port source"],["--badsum","checksum TCP/UDP invalide"]]},{"title":"Sortie","rows":[["-oN <fichier>","format normal"],["-oX <fichier>","XML"],["-oG <fichier>","grepable"],["-oA <base>","enregistre plusieurs formats avec le même nom de base"],["-v / -vv","verbosité"],["-oG-","sortie grepable vers stdout, pratique pour filtrer en pipeline"]]}],"exam":"Options centrales : -sS, -sT, -sU, -sX/-sF/-sN, -sA, -sI, -sV, -O, -A, -sn, -Pn, -T0…T5, -f, -D, -g/--source-port.","xref":[1,2,4,5,12]},{"name":"Zenmap","desc":"Zenmap est l'interface graphique de Nmap. Il lance des commandes Nmap à partir de profils, présente les résultats par hôtes et services, permet de sauvegarder les scans en XML et de comparer plusieurs résultats. Il est utile pour visualiser, mais ne remplace pas les options disponibles en ligne de commande.","cheat":[{"words":1,"title":"Profils cités","rows":[["Intense scan","profil plus agressif / rapide"],["Regular scan","profil standard"],["Slow comprehensive scan","scan plus lent et approfondi"]]}],"exam":"Zenmap = GUI de Nmap ; comparaison possible à partir de scans XML sauvegardés."},{"name":"NSE — commandes pratiques","desc":"Les scripts NSE complètent Nmap lorsque le simple état d'un port ne suffit pas. On peut lancer une catégorie complète, un script ciblé ou demander la documentation d'un script avant de l'utiliser.","syntax":"sudo nmap -sS --script=discovery 192.168.23.0/24\nsudo nmap --script-help=http-waf-detect.nse\nsudo nmap --script smb-os-discovery.nse 10.10.1.22\nsudo nmap -sS --script \"smbv2*\" -T4 192.168.2.3","exam":"Scripts Linux : /usr/share/nmap/scripts ; extension .nse ; langage Lua."}]},{"g":"Host Discovery & scanners rapides","items":[{"name":"fping","desc":"fping est conçu pour envoyer des ICMP Echo Requests à de nombreux systèmes rapidement. Il est particulièrement pratique pour un ping sweep simple d'un bloc réseau.","syntax":"fping -aeg 192.168.86.0/24","cheat":[{"title":"Options importantes","rows":[["-a","affiche uniquement les hôtes vivants"],["-e","affiche le temps aller-retour"],["-g","génère automatiquement les cibles depuis une plage/bloc"]]}],"exam":"Un hôte 'unreachable' peut être réellement éteint ou simplement filtré."},{"name":"Masscan","desc":"Masscan privilégie la vitesse sur de très grandes plages. Il réalise des scans SYN et peut récupérer des bannières, mais offre moins de types de scans que Nmap. Une stratégie courante est de l'utiliser pour découvrir rapidement puis d'approfondir avec Nmap.","syntax":"sudo masscan --rate=100000 -p80,443 192.168.1.0/24\nsudo masscan -sS --banners --rate=100000 -p80,443 192.168.2.0/24","cheat":[{"title":"Options importantes","rows":[["--rate <pps>","nombre de paquets par seconde"],["-p<ports>","ports à tester"],["--banners","tente de récupérer les bannières"],["--randomize-hosts","ordre des cibles aléatoire"],["-sS","scan SYN ; comportement naturel de Masscan"]]}],"exam":"Masscan = vitesse / SYN ; pas les multiples types de scan avancés de Nmap."},{"name":"MegaPing","desc":"MegaPing est une suite Windows graphique. Son IP Scanner réalise des ping sweeps et peut afficher des informations supplémentaires comme les MAC et hostnames si les colonnes correspondantes sont activées. Il inclut aussi un port scanner et plusieurs outils de dépannage réseau.","exam":"Le port scanner MegaPing utilise notamment des collections prédéfinies 'Hostile ports' et 'Authorized ports' ; plusieurs adresses doivent être ajoutées individuellement plutôt qu'en CIDR."},{"name":"NetScanTools Pro","desc":"Suite réseau Windows regroupant plusieurs fonctions actives et passives : informations IPv4/IPv6, hostnames, domaines, adresses e-mail, ports ouverts, DNS, traceroute et outils locaux. Elle sert à centraliser plusieurs tâches de découverte et d'analyse réseau dans une interface graphique.","xref":[2,4]},{"name":"Unicornscan","desc":"Scanner réseau asynchrone utilisé pour la découverte, le port scanning et certaines tâches de fingerprinting. Son approche asynchrone le rend adapté à l'envoi et à la collecte de nombreuses sondes sans attendre une réponse avant chaque requête."},{"name":"Autres scanners à reconnaître","desc":"Plusieurs utilitaires peuvent compléter Nmap selon le besoin : découverte rapide d'hôtes, ping, inventaire ou monitoring. Il faut surtout savoir reconnaître leur fonction générale lorsqu'ils apparaissent dans un scénario.","cheat":[{"words":1,"title":"Outils cités","rows":[["Angry IP Scanner","découverte / scan d'hôtes multiplateforme"],["Advanced IP Scanner","scanner d'hôtes"],["Colasoft Ping Tool","ping / discovery"],["OpUtils","outil réseau ManageEngine"],["SolarWinds Engineer's Toolset","suite d'outils réseau"],["RustScan / sx","scanners cités comme alternatives"],["PRTG Network Monitor","monitoring réseau cité parmi les outils"]]}]},{"name":"Wireshark — OS fingerprinting","desc":"En capturant du trafic existant, Wireshark permet d'inspecter le TTL dans l'en-tête IP et d'autres caractéristiques sans envoyer de sonde supplémentaire. Un TTL observé proche de 128 suggère souvent Windows ; proche de 64, Linux/FreeBSD. Il faut tenir compte des sauts déjà traversés.","syntax":"ip.addr == <target>\n# Inspecter : Internet Protocol → Time to Live","exam":"Fingerprinting passif : observer TTL et Window Size au lieu d'envoyer des paquets de test.","xref":[8]}]},{"g":"Packet Crafting","items":[{"name":"hping3","desc":"hping3 permet de forger et envoyer des paquets TCP/IP avec des champs choisis manuellement. Il peut servir de ping, de scanner ou d'outil de test de firewall, mais sa force principale est le contrôle fin des flags, protocoles, ports, adresse source et payload. Sans port destination précisé, il utilise le port 0, qui n'est pas un port de service valide.","syntax":"sudo hping3 -S -p 80 192.168.86.1\nhping3 -A 10.10.1.11 -p 80\nhping3 -8 50-60 -S 10.0.0.25 -V\nhping3 -F -P -U 10.0.0.25 -p 80\nhping3 -9 HTTP -I eth0","cheat":[{"title":"Modes / protocole","rows":[["-1","mode ICMP"],["-2","mode UDP"],["-8 / --scan","scan d'une plage de ports"],["-9","mode listen"]]},{"title":"Flags TCP","rows":[["-S","SYN"],["-A","ACK"],["-F","FIN"],["-P","PUSH / PSH"],["-U","URG"]]},{"title":"Cible & contenu","rows":[["-p <port>","port destination"],["-a <IP>","spoof de l'adresse source"],["-d <bytes>","taille du payload"],["--file <fichier>","utilise le contenu d'un fichier comme payload"],["-I <iface>","interface réseau"],["--rand-dest","destinations aléatoires dans le contexte de la plage utilisée"],["--tcp-timestamp","option TCP timestamp citée dans le module"],["-V","mode verbose"]]}],"exam":"Réponse SA = SYN+ACK, donc port ouvert ; RA = RST+ACK, donc rien n'écoute. Si la source IP est spoofée avec -a, les réponses vont à l'adresse usurpée."},{"name":"PackETH","desc":"PackETH est un packet crafter graphique. Il affiche les champs correspondant au protocole choisi, permet de saisir un payload personnalisé en hexadécimal et peut envoyer un paquet unique ou des flux de paquets. Il sait aussi sauvegarder des paquets et charger un PCAP pour rejouer ou modifier du trafic capturé.","cheat":[{"words":1,"title":"Contrôles cités","rows":[["Send","envoie un paquet"],["Gen-b","génère un nombre défini de paquets"],["Gen-s","génère des streams/patterns"],["Burst / continuous / random","modes d'envoi des streams"],["User Defined Payload","payload personnalisé en hexadécimal"]]}]},{"name":"Fragroute","desc":"Fragroute fait passer le trafic par son moteur avant l'envoi et le transforme selon un fichier de directives. Il sert à fragmenter, dupliquer, retarder ou réordonner des paquets afin de tester la robustesse d'une pile réseau et la manière dont IDS/IPS reconstruisent le trafic.","syntax":"delay random 1\ndup last 30%\nip_chaff dup\nip_frag 128 new\ntcp_chaff null 16\norder random","cheat":[{"words":1,"title":"Directives","rows":[["delay random 1","retarde aléatoirement un paquet"],["dup last 30%","30 % de chance de dupliquer le dernier paquet"],["ip_chaff dup","insère du trafic parasite en couche 3"],["ip_frag 128 new","force des fragments IP de 128 octets"],["tcp_chaff null 16","ajoute du chaff au niveau TCP"],["order random","réordonne les messages"]]}],"xref":[12]},{"name":"Colasoft Packet Builder","desc":"Constructeur de paquets graphique permettant de partir de templates puis de modifier les champs dans des vues décodée, hexadécimale et ASCII. Il sert à produire précisément la structure de paquet à tester contre une pile réseau, un firewall ou un IDS."}]},{"g":"Vulnerability Scanners & framework","items":[{"name":"OpenVAS / GSA","desc":"OpenVAS est une solution open source de vulnerability assessment. GSA fournit l'interface web ; une cible, une scan configuration et une task définissent le scan. Les tests sont des NVTs organisés en familles, et les résultats peuvent être suivis dans le temps avec un QoD, des notes et des ajustements de sévérité.","cheat":[{"title":"Workflow","rows":[["Target","IP(s), exclusions, ports et éventuels credentials"],["Scan Config","familles/NVT à exécuter"],["Task","scan à planifier et lancer"],["Results","findings détaillés"],["QoD","confiance dans la détection"],["Alerts","notifications possibles par e-mail, HTTP, SMB, SNMP, etc."]]}],"exam":"Une task ne démarre pas toute seule : elle doit être lancée, sauf planification explicite.","xref":[5]},{"name":"Nessus","desc":"Scanner commercial de vulnérabilités. Les scans peuvent utiliser plusieurs jeux de credentials, les politiques contrôlent la découverte et l'assessment, et les tests sont implémentés sous forme de plugins NASL. Les résultats sont consultables par hôtes, vulnérabilités et historique.","cheat":[{"words":1,"title":"Repères","rows":[["Credentials","SSH, Windows, bases de données et autres méthodes citées"],["NASL","langage de scripts Nessus"],["Basic Network Scan","ports communs activés par défaut"],["Web vulnerabilities","désactivées par défaut dans le scénario décrit"],["History","historique des résultats"],["Audit trail","trace des actions"]]}],"xref":[5]},{"name":"Metasploit — scanner modules","desc":"Metasploit est surtout connu pour l'exploitation, mais il contient aussi de nombreux modules auxiliary de scanning. Les résultats peuvent être conservés dans sa base, ce qui permet d'enchaîner découverte, validation et exploitation dans le même environnement lorsqu'un engagement l'autorise.","syntax":"msfconsole\nsearch portscan\nuse auxiliary/scanner/portscan/tcp\nset RHOSTS 192.168.1.0/24\nrun","exam":"Metasploit n'est pas uniquement un exploit framework : il possède aussi des modules de scanning et peut servir à confirmer certains findings.","xref":[5,6]},{"name":"SATAN / SARA / SAINT","desc":"Scanners historiques de vulnérabilités : SATAN fait partie des premiers scanners open source des années 1990, puis SARA et SAINT ont poursuivi cette famille d'outils. À retenir surtout comme prédécesseurs des scanners modernes."}]},{"g":"Anonymisation / intermédiaires","items":[{"name":"Proxychains / proxies","desc":"Un proxy agit comme intermédiaire entre l'outil et la cible : la cible voit la connexion de l'intermédiaire plutôt que la source directe. Une chaîne de proxies ajoute plusieurs relais. La compatibilité dépend du type de scan : un TCP Connect passe plus facilement par un proxy que des paquets raw forgés.","syntax":"proxychains nmap -sT -Pn <target>","xref":[12]},{"name":"Tor & anonymizers","desc":"Un anonymizer relaie la connexion au nom de l'utilisateur afin que la cible voie l'intermédiaire plutôt que l'adresse source directe. Tor utilise plusieurs relais chiffrés ; des services VPN/proxy peuvent jouer un rôle similaire d'intermédiation selon le protocole utilisé.","cheat":[{"words":1,"title":"Exemples cités","rows":[["Tor Network / Tor Browser","routage via plusieurs relais"],["Proxifier","outil proxy"],["Hotspot Shield / CyberGhost VPN","services d'intermédiation/VPN cités"],["IPRoyal Residential Proxy","proxy résidentiel cité dans le module"]]}],"xref":[12]}]}]},"port":{"groups":[{"g":"Services fondamentaux","items":[{"name":"20 / 21 — FTP","tr":"tcp","desc":"20 transporte les données en mode actif ; 21 transporte les commandes et le contrôle FTP."},{"name":"22 — SSH","tr":"tcp","desc":"Administration distante chiffrée ; la bannière peut révéler l'implémentation et sa version."},{"name":"23 — Telnet","tr":"tcp","desc":"Administration distante en clair ; sa présence est un indicateur de service ancien ou faible."},{"name":"25 — SMTP","tr":"tcp","desc":"Serveur de messagerie SMTP."},{"name":"53 — DNS","tr":"both","desc":"Résolution DNS en UDP/TCP ; les transferts de zone utilisent TCP.","xref":[2,4]},{"name":"67 / 68 — DHCP","tr":"udp","desc":"67 = serveur DHCP/BOOTP ; 68 = client DHCP/BOOTP."},{"name":"69 — TFTP","tr":"udp","desc":"Trivial File Transfer Protocol, service UDP simple."},{"name":"79 — Finger","tr":"tcp","desc":"Service historique d'information utilisateur, utile à reconnaître pour l'énumération."},{"name":"80 — HTTP","tr":"both","desc":"HTTP, service web en clair. Transport indiqué ici : TCP/UDP.","xref":[13,14]},{"name":"443 — HTTPS","tr":"tcp","desc":"HTTP protégé par TLS sur TCP 443.","xref":[13,14]},{"name":"110 — POP3","tr":"tcp","desc":"Relève de courrier POP3."},{"name":"119 — NNTP","tr":"tcp","desc":"Network News Transfer Protocol."},{"name":"123 — NTP","tr":"udp","desc":"Synchronisation de temps réseau."},{"name":"143 — IMAP","tr":"both","desc":"Accès aux boîtes de messagerie via IMAP."}]},{"g":"Windows, AD & administration","items":[{"name":"88 — Kerberos","tr":"both","desc":"Authentification Kerberos, particulièrement importante dans Active Directory.","xref":[6]},{"name":"111 — RPC / sunrpc","tr":"both","desc":"Portmapper/rpcbind pour les services RPC Unix."},{"name":"135 — Microsoft RPC","tr":"both","desc":"RPC Endpoint Mapper Windows."},{"name":"137 / 138 / 139 — NetBIOS","tr":"both","desc":"137 Name Service, 138 Datagram Service, 139 Session Service.","xref":[4]},{"name":"161 / 162 — SNMP","tr":"both","desc":"161 pour les requêtes SNMP ; 162 pour les traps SNMP.","xref":[4]},{"name":"389 — LDAP","tr":"both","desc":"Annuaire LDAP / Active Directory.","xref":[4]},{"name":"445 — SMB / Microsoft-DS","tr":"both","desc":"SMB direct pour partages et services Windows ; surface très importante pour scanning et enumeration.","xref":[4,6]},{"name":"3389 — RDP","tr":"tcp","desc":"Remote Desktop Protocol pour l'administration graphique Windows.","xref":[6]}]},{"g":"VPN, bases & autres services","items":[{"name":"500 — IKE / ISAKMP","tr":"udp","desc":"Négociation IKE/IPsec pour VPN."},{"name":"1080 — SOCKS","tr":"both","desc":"Proxy SOCKS."},{"name":"1433 / 1434 — MSSQL","tr":"both","desc":"Microsoft SQL Server / SQL Monitor-Browser selon le service.","xref":[15]},{"name":"1723 — PPTP","tr":"both","desc":"VPN PPTP."},{"name":"2049 — NFS","tr":"both","desc":"Network File System, partage de fichiers Unix/Linux.","xref":[4]},{"name":"5060 — SIP","tr":"both","desc":"Signalisation SIP pour VoIP.","xref":[4]},{"name":"6000–6063 — X11","tr":"both","desc":"X Window System."},{"name":"6667 — IRC","tr":"tcp","desc":"Internet Relay Chat ; également rencontré historiquement comme canal de commande."}]}]},"contre":{"groups":[{"g":"Réduire l'exposition","items":[{"name":"Default-Deny & fermer les services inutiles","desc":"Le moyen le plus direct de réduire la valeur d'un scan est de réduire la surface visible. Le firewall bloque par défaut ce qui n'est pas explicitement autorisé et les services inutiles sont désactivés. Moins de ports exposés signifie moins d'informations et moins de points d'entrée potentiels.","exam":"Drop divulgue moins d'information que Reject : Reject renvoie explicitement une erreur à l'émetteur.","xref":[1]},{"name":"Patcher services & équipements de sécurité","desc":"Les services nécessaires doivent rester à jour et les firewalls eux-mêmes doivent être patchés. L'objectif n'est pas seulement de cacher un port : un service exposé doit aussi être dans une version non vulnérable et configuré de manière sûre.","xref":[5]},{"name":"Banner Suppression","desc":"Réduire ou supprimer les bannières de version limite la précision du service fingerprinting. Un attaquant peut toujours identifier le comportement d'un service, mais il obtient moins directement le nom et la version exacte depuis une simple connexion.","xref":[13]},{"name":"NAT & masquage de l'adressage interne","desc":"NAT masque l'adressage privé derrière des adresses visibles au périmètre. Cela n'est pas un contrôle de sécurité suffisant à lui seul, mais il réduit l'information directement observable sur les hôtes internes depuis l'extérieur.","xref":[1]}]},{"g":"Détection de scanning","items":[{"name":"IDS / IPS anti-scan","desc":"Les scans ont des motifs atypiques : un même hôte touche de nombreux ports, plusieurs IP sont balayées successivement, ou des flags TCP inhabituels apparaissent. IDS et IPS peuvent détecter ces signatures ; un IPS peut en plus bloquer automatiquement la source lorsque les seuils sont atteints.","xref":[1,12]},{"name":"Rate Limiting & seuils","desc":"Limiter le nombre de connexions, SYN ou requêtes ICMP qu'une même source peut générer dans une fenêtre de temps rend les scans rapides plus difficiles et force l'attaquant à ralentir. portsentry et fail2ban peuvent automatiser le blocage de certaines sources après détection.","xref":[12]},{"name":"Journalisation centralisée & SIEM","desc":"Un seul événement peut sembler banal, mais la corrélation de centaines de connexions sur plusieurs firewalls ou hôtes fait apparaître un scan. Centraliser les logs dans un SIEM permet de détecter ces motifs et conserve les preuves même si un système local est ensuite compromis.","xref":[1]},{"name":"ExtraHop & Splunk ES","desc":"ExtraHop analyse les interactions réseau en temps réel pour repérer des comportements anormaux. Splunk Enterprise Security centralise et corrèle les événements dans un SIEM afin de faire ressortir les motifs de scanning observés sur plusieurs équipements.","cheat":[{"words":1,"title":"Outils","rows":[["ExtraHop","détection et analyse des interactions réseau"],["Splunk Enterprise Security","SIEM / corrélation de patterns de scanning"]]}]}]},{"g":"Anti-spoofing & filtrage","items":[{"name":"Ingress / Egress Filtering","desc":"L'ingress filtering rejette au périmètre des paquets entrants dont la source est impossible, par exemple une adresse privée RFC1918 prétendant venir d'Internet. L'egress filtering vérifie que les paquets sortants utilisent une adresse source légitime de l'organisation. Ensemble, ils réduisent fortement l'usurpation d'adresse.","exam":"BCP 38 = filtrage anti-spoofing à la frontière du réseau, notamment sur les adresses source."},{"name":"Ne pas faire confiance à l'IP seule","desc":"Une adresse IP peut être usurpée. L'authentification ne doit donc pas reposer uniquement sur l'adresse source : elle doit être complétée par une authentification réelle et, lorsque pertinent, par des protocoles sécurisés comme TLS, SSH, HTTPS ou IPsec.","xref":[1]},{"name":"Bloquer source routing & paquets malformés","desc":"Routeurs, firewalls et proxies doivent empêcher les contournements fondés sur le source routing et traiter correctement les fragments ou paquets malformés. L'objectif est d'éviter qu'une route imposée ou une reconstruction ambiguë permette de franchir le contrôle.","xref":[12]}]},{"g":"Limiter la découverte d'hôtes","items":[{"name":"Limiter ICMP","desc":"Bloquer ou limiter les Echo Requests provenant de sources non fiables réduit l'efficacité des ping sweeps. Il faut autoriser uniquement les types ICMP nécessaires au fonctionnement et appliquer une limitation de débit afin de rendre les balayages plus visibles et moins efficaces.","xref":[1]},{"name":"Segmentation / VLAN / DMZ","desc":"Segmenter le réseau limite la portée d'un scan. Même si un attaquant obtient un accès à un segment, des VLANs, firewalls internes, DMZ ou microsegments peuvent empêcher qu'il balaie directement tout l'environnement.","xref":[1]},{"name":"Port Knocking","desc":"Le port knocking masque un service derrière une séquence de connexions prédéfinie : le port n'est exposé qu'après la bonne séquence. Il réduit la visibilité d'un service lors d'un scan classique mais ne remplace pas une authentification forte.","xref":[12]},{"name":"Honeypots","desc":"Un scanner peut être redirigé ou attiré vers un honeypot afin de détecter et observer l'activité de reconnaissance. L'objectif est de transformer une tentative de découverte en signal de détection plutôt que de simplement la bloquer.","xref":[12]}]}]}}},{"n":4,"t":"Énumération","data":{"concept":{"groups":[{"g":"Fondamentaux de l’énumération","items":[{"name":"Enumeration — définition","desc":"L’énumération vient après le scanning. Le scanning indique qu’un hôte est actif et qu’un service écoute ; l’énumération établit une connexion active avec ce service et lui envoie des requêtes pour en extraire des informations concrètes : utilisateurs, groupes, partages, noms de machines, ressources, versions, paramètres ou bannières.","flow":"Scanning → service identifié → requêtes dirigées → informations exploitables","cheat":[{"words":1,"title":"Différence essentielle","rows":[["Scanning","trouve les hôtes, ports et services"],["Enumeration","fait parler le service pour obtenir des objets concrets"]]}],"exam":"Enumeration = active connections + directed queries. Les usernames obtenus servent souvent de cibles aux attaques de mots de passe.","xref":[3,6]},{"name":"Informations recherchées","desc":"Une énumération réussie peut révéler les ressources et partages réseau, tables de routage, paramètres d’audit et de services, noms de machines, FQDN, utilisateurs et groupes, applications, versions, bannières et informations SNMP. L’intérêt est de transformer une surface technique en cibles précises pour la suite du pentest.","cheat":[{"words":1,"title":"Exemples","rows":[["Identité","users, groups, machine names, domains"],["Ressources","shares, network resources, routes"],["Services","applications, banners, versions, configuration"]]}]},{"name":"Service Enumeration & Banner Grabbing","desc":"L’énumération d’un service commence souvent par son identification précise. Nmap avec -sV interroge les ports ouverts et analyse les bannières pour déterminer le logiciel et sa version. Si la bannière est trop pauvre, des scripts NSE peuvent interroger le protocole plus profondément et extraire des détails spécifiques.","syntax":"sudo nmap -sV <target>\nsudo nmap -sV --script=banner <target>\nsudo nmap --script=ssl-enum-ciphers.nse <target>\nsudo nmap --script=ssh2-enum-algos.nse <target>","exam":"Une bannière peut révéler le service sans donner l’application ou sa version ; les scripts NSE servent alors à aller plus loin.","xref":[3]},{"name":"Pourquoi les utilisateurs sont précieux","desc":"Beaucoup de services exposés utilisent une authentification. Si l’énumération permet de confirmer des comptes valides, l’attaquant possède déjà la moitié de l’information nécessaire à une attaque de mot de passe : il ne doit plus deviner simultanément le nom d’utilisateur et le secret.","flow":"Service exposé → utilisateurs valides → password attack ciblée","xref":[6]},{"name":"Techniques générales d’énumération","desc":"Les approches incluent déduire un username depuis une adresse email, tester des identifiants ou paramètres par défaut, exploiter des différences de messages d’erreur, demander les groupes Windows, utiliser SNMP pour parcourir les objets exposés ou profiter d’un transfert de zone DNS mal configuré.","cheat":[{"words":1,"title":"Idée","rows":[["Email","username@domain peut révéler le format des comptes"],["SNMP","community string → parcours de la MIB"],["DNS","AXFR mal restreint → hôtes, sous-domaines et IP"],["AD","des réponses différentes peuvent permettre de confirmer des usernames"]]}]}]},{"g":"NetBIOS & SMB","items":[{"name":"NetBIOS — rôle et noms","desc":"NetBIOS fournit des services de nommage, de datagrammes et de sessions sur un réseau Windows historique. Un nom NetBIOS contient 16 caractères : les 15 premiers représentent le nom de la machine ou du domaine et le 16e identifie le type de service ou d’enregistrement. NetBIOS est conçu pour le LAN et sa résolution de noms n’est pas prise en charge en IPv6.","cheat":[{"words":1,"title":"Ports","rows":[["UDP 137","Name Service"],["UDP 138","Datagram Service"],["TCP 139","Session Service"]]}],"exam":"Le 16e caractère du nom NetBIOS correspond au type de service."},{"name":"Codes NetBIOS à reconnaître","desc":"Les codes NetBIOS ajoutés au nom permettent de comprendre ce que représente l’entrée observée. Ils sont particulièrement utiles lorsque nbtstat retourne la table de noms d’une machine.","cheat":[{"words":1,"title":"Codes CEH","rows":[["<00> UNIQUE","hostname"],["<00> GROUP","domain name"],["<03> UNIQUE","Messenger service / user"],["<20> UNIQUE","Server service"],["<1D> GROUP","master browser du subnet"],["<1B> UNIQUE","domain master browser / PDC"],["<1E> GROUP","browser service elections"]]}],"exam":"<1B> UNIQUE identifie le Domain Master Browser / PDC ; <20> indique le Server service."},{"name":"SMB — pourquoi c’est une mine","desc":"SMB est un protocole applicatif Windows utilisé pour le partage de fichiers et d’imprimantes, l’administration distante et d’autres opérations réseau. Il fonctionne directement sur TCP 445 ou historiquement via NetBIOS sur les ports 137–139. Comme SMB connaît les utilisateurs, groupes, partages, domaines et parfois l’OS, il fournit beaucoup d’informations lorsqu’il est mal protégé.","cheat":[{"words":1,"title":"Transports","rows":[["TCP 445","SMB direct"],["UDP 137/138 + TCP 139","SMB via NetBIOS"]]}],"exam":"445 = SMB direct host ; 139 = NetBIOS Session Service."},{"name":"Null Session & IPC$","desc":"Une null session est une connexion SMB anonyme. Historiquement, elle pouvait permettre de récupérer des utilisateurs, groupes et partages sans fournir d’identifiants. Le partage IPC$ donne accès aux named pipes et constitue le point d’entrée classique de ce type d’énumération. Les versions modernes de Windows bloquent ce comportement par défaut, mais il peut être réactivé par configuration.","cheat":[{"words":1,"title":"Shares classiques","rows":[["IPC$","shared pipes / null-session entry point"],["C$","partage administratif automatique du disque C:"]]}],"exam":"IPC$ est le partage à associer aux null sessions."},{"name":"Samba — smbd et nmbd","desc":"Sur Unix/Linux, Samba implémente SMB pour interopérer avec Windows. smbd gère les opérations SMB elles-mêmes, tandis que nmbd gère le nommage NetBIOS. Cette distinction explique pourquoi nmblookup cible la partie nommage alors qu’enum4linux agrège plusieurs mécanismes Samba.","cheat":[{"words":1,"title":"Démons","rows":[["smbd","SMB : fichiers, partages, authentification"],["nmbd","noms NetBIOS / découverte"]]}]},{"name":"Partages et ressources Windows","desc":"Une fois un système Windows identifié, l’énumération peut porter sur les partages accessibles, les ressources publiées et les machines visibles dans un domaine ou workgroup. La commande net view fournit directement ce type d’information et peut aussi afficher les partages cachés avec /ALL.","syntax":"net view \\\\<computername>\nnet view \\\\<computername> /ALL\nnet view /domain\nnet view /domain:<domain>","exam":"net view /ALL affiche aussi les partages cachés."}]},{"g":"SNMP","items":[{"name":"SNMP — rôle","desc":"SNMP est un protocole applicatif utilisé pour surveiller et administrer des équipements comme routeurs, switches, imprimantes et serveurs. Un agent SNMP tourne sur l’équipement et répond aux requêtes d’une station de management. Comme il peut exposer interfaces, routes, processus, utilisateurs et configuration, un SNMP mal protégé est très intéressant pour l’énumération.","cheat":[{"words":1,"title":"Ports","rows":[["UDP 161","requêtes vers l’agent"],["UDP 162","traps / notifications"]]}]},{"name":"SNMPv1 / v2c / v3","desc":"SNMPv1 et SNMPv2c reposent sur des community strings et ne chiffrent pas les échanges. SNMPv3 ajoute des utilisateurs, l’authentification et le chiffrement. Pour la sécurité, la différence essentielle est donc que v3 permet une protection réelle des identifiants et du contenu, alors que v1/v2c dépendent d’un secret partagé.","cheat":[{"words":1,"title":"Comparaison","rows":[["v1","community string, pas de chiffrement"],["v2c","community string, pas de chiffrement"],["v3","user-based authentication + chiffrement"]]}],"exam":"SNMPv3 est la version à associer à l’authentification utilisateur et au chiffrement."},{"name":"Community Strings","desc":"La community string agit comme un mot de passe partagé dans SNMPv1/v2c. Les valeurs par défaut classiques sont public pour la lecture et private pour la lecture/écriture. Si elles sont laissées inchangées, un attaquant peut parcourir les données de management ; avec un accès read-write, il peut également modifier la configuration exposée.","cheat":[{"words":1,"title":"Defaults à reconnaître","rows":[["public","read-only"],["private","read-write"]]}],"exam":"public = read ; private = read/write."},{"name":"Manager, Agent et PDUs SNMP","desc":"La station de management interroge l’agent SNMP installé sur l’équipement. Get lit une variable, GetNext avance dans l’arbre MIB, Set modifie une valeur, GetBulk récupère plusieurs valeurs, Response renvoie la réponse, Trap signale spontanément un événement et Inform fournit une notification avec confirmation.","cheat":[{"words":1,"title":"PDUs","rows":[["Get","lire une valeur"],["GetNext","parcourir la prochaine variable"],["GetBulk","récupérer un lot, v2+"],["Set","modifier une valeur"],["Response","réponse de l’agent"],["Trap","alerte non sollicitée"],["Inform","notification avec acquittement"]]}]},{"name":"MIB, OID et ASN.1","desc":"La MIB est la base logique des objets gérés par SNMP. Elle est organisée comme un arbre ; chaque élément possède un OID, c’est-à-dire un chemin numérique unique. Les MIB sont décrites à l’aide d’ASN.1. En pratique, parcourir les OID permet d’énumérer la configuration, les interfaces et de nombreux paramètres du système.","cheat":[{"words":1,"title":"Termes","rows":[["MIB","Management Information Base"],["OID","identifiant unique d’un objet dans l’arbre"],["ASN.1","notation utilisée pour structurer les MIB"],["ifTable","table listant les interfaces réseau et leur configuration"]]}]},{"name":"MIB importantes","desc":"Certaines MIB ciblent des domaines précis : DHCP.MIB pour le trafic DHCP, HOSTMIB.MIB pour les ressources hôte, LNMIB2.MIB pour les services workstation/server, MIB_II.MIB pour les objets TCP/IP et WINS.MIB pour Windows Internet Name Service.","cheat":[{"words":1,"title":"Associations","rows":[["DHCP.MIB","DHCP"],["HOSTMIB.MIB","host resources"],["LNMIB2.MIB","workstation/server services"],["MIB_II.MIB","TCP/IP"],["WINS.MIB","WINS"]]}]}]},{"g":"LDAP & Active Directory","items":[{"name":"LDAP — fonctionnement","desc":"LDAP est un protocole permettant d’accéder à un service d’annuaire hiérarchique. Le client ouvre une session avec un Directory System Agent (DSA), généralement sur le port 389, puis envoie des opérations de recherche dans l’arbre. Les données LDAP sont structurées logiquement comme une organisation : domaines, unités, utilisateurs, groupes et autres objets.","cheat":[{"words":1,"title":"À retenir","rows":[["DSA","Directory System Agent auquel le client se connecte"],["BER","Basic Encoding Rules utilisées pour l’encodage client/serveur"],["Port 389","port LDAP cité dans le module"]]}]},{"name":"Anonymous LDAP Enumeration","desc":"Si le serveur autorise un bind anonyme, un client peut interroger l’annuaire sans fournir de compte. Selon les permissions, cela peut révéler usernames, adresses, départements, noms de serveurs et autres objets utiles à la préparation d’attaques ciblées.","flow":"Anonymous bind → naming context → base DN → filtres LDAP → objets/utilisateurs","exam":"La contre-mesure directe est de désactiver les anonymous binds lorsqu’ils ne sont pas nécessaires."},{"name":"Naming Context & Base DN","desc":"Avant une recherche LDAP étendue, on récupère souvent les naming contexts afin de connaître la racine logique de l’annuaire. Une valeur comme DC=htb,DC=local devient ensuite le base DN passé à ldapsearch avec -b pour limiter la recherche à cette branche.","syntax":"ldapsearch -h <IP> -x -s base namingcontexts\nldapsearch -h <IP> -x -b \"DC=htb,DC=local\"","exam":"-s base namingcontexts sert à découvrir la racine ; -b indique le base DN."},{"name":"Filtres LDAP","desc":"LDAP permet de filtrer les objets retournés selon leurs attributs. Un filtre objectClass=* demande tous les objets sous le base DN ; un filtre comme (objectClass=Employee) limite les résultats à cette classe. On peut aussi demander uniquement certains attributs, par exemple sAMAccountName.","syntax":"ldapsearch -x -h <IP> -b \"DC=htb,DC=local\" \"objectclass=*\"\nldapsearch -h <IP> -x -b \"DC=htb,DC=local\" \"(objectClass=Employee)\" sAMAccountName sAMAccountType"},{"name":"Global Catalog","desc":"Le Global Catalog fournit une vue globale des objets d’une forêt Active Directory. Le module associe ce service au port 3268. Lors d’une énumération AD, l’existence d’un Global Catalog peut donc élargir la recherche au-delà d’un seul domaine.","exam":"3268 = Global Catalog Service."}]},{"g":"RPC, RMI & NFS","items":[{"name":"RPC — Remote Procedure Call","desc":"RPC permet à un programme d’appeler une procédure exécutée sur une autre machine presque comme s’il s’agissait d’une fonction locale. Pour un attaquant, l’intérêt est d’identifier les programmes RPC enregistrés et les ports dynamiques qu’ils utilisent : cela révèle des services qui ne seraient pas évidents avec un scan limité aux ports habituels.","flow":"Client → portmapper/rpcbind → programme + port → connexion au service","exam":"RPC = procédures distantes ; le portmapper indique où se trouvent les services."},{"name":"portmap / rpcbind","desc":"Les programmes Sun RPC ne sont pas obligés d’écouter sur un port fixe. Ils s’enregistrent auprès de portmap/rpcbind sur le port 111. Le client interroge ce service de répertoire pour apprendre le nom du programme RPC et le port réel à contacter.","syntax":"rpcinfo -p <target>","exam":"111 = portmap/rpcbind. rpcinfo -p retourne les programmes RPC et leurs ports."},{"name":"Java RMI","desc":"RMI est la version objet du RPC pour Java. Les applications enregistrent des objets distants dans rmiregistry, qui écoute par défaut sur le port 1099. Le client utilise un stub comme représentant local de l’objet distant ; le terme skeleton désigne historiquement la partie serveur qui recevait l’appel.","cheat":[{"words":1,"title":"Éléments","rows":[["rmiregistry","répertoire RMI, port 1099"],["Stub","proxy côté client"],["Skeleton","récepteur côté serveur dans le modèle historique"]]}],"exam":"1099 = Java RMI registry."},{"name":"JRE vs JDK","desc":"La présence d’un service RMI implique qu’un environnement Java est disponible. Le JRE permet d’exécuter du bytecode avec java ; le JDK inclut aussi les outils de développement comme javac pour compiler le code source. Cette distinction aide à comprendre ce que l’environnement Java peut faire.","cheat":[{"words":1,"title":"Commandes","rows":[["java","exécute"],["javac","compile — JDK"]]}]},{"name":"NFS — Network File System","desc":"NFS permet d’accéder à des fichiers distants comme s’ils étaient montés localement. Le serveur exporte des répertoires et le client les monte. Le fichier /etc/exports définit les clients autorisés. Le cours souligne que les anciennes versions reposent fortement sur l’adresse IP du client, ce qui rend une mauvaise configuration dangereuse.","cheat":[{"words":1,"title":"Mots-clés","rows":[["Exporting","le serveur partage un répertoire"],["Mounting","le client rend le partage accessible localement"],["/etc/exports","définit les exports et clients autorisés"],["TCP 2049","NFS"]]}],"exam":"showmount -e <target> liste les exports ; rpcinfo -p aide à identifier NFS et les services RPC associés."}]},{"g":"SMTP & DNS","items":[{"name":"SMTP — principe d’énumération","desc":"SMTP fonctionne avec des commandes textuelles. Certaines commandes donnent des réponses différentes selon qu’un utilisateur ou une adresse existe. Cette différence permet de confirmer des comptes valides sans connaître leur mot de passe.","flow":"Connexion SMTP → HELO/EHLO → VRFY / EXPN / RCPT TO → comparer les réponses","exam":"VRFY, EXPN et RCPT TO sont les trois commandes d’énumération utilisateur à connaître."},{"name":"VRFY","desc":"VRFY demande au serveur SMTP de vérifier si un utilisateur existe. Un compte valide peut produire une réponse 250 tandis qu’un compte inconnu peut produire une erreur 550. Beaucoup de serveurs désactivent cette commande précisément parce qu’elle facilite l’énumération.","syntax":"VRFY <username>","exam":"VRFY = verify a user."},{"name":"EXPN","desc":"EXPN demande au serveur d’étendre un alias ou une liste de diffusion vers ses adresses réelles. Si le serveur autorise la commande, elle peut à la fois confirmer l’existence d’un identifiant et révéler les membres d’une liste.","syntax":"EXPN <alias-or-list>","exam":"EXPN = expand aliases / mailing lists."},{"name":"RCPT TO","desc":"RCPT TO définit le destinataire pendant une transaction SMTP. Après avoir fourni MAIL FROM, on teste des destinataires et on observe si le serveur les accepte ou les rejette. Cette technique reste utile quand VRFY et EXPN sont désactivés mais que les réponses RCPT diffèrent.","syntax":"MAIL FROM:<sender>\nRCPT TO:<candidate>","exam":"RCPT TO peut révéler les comptes par différence de réponse."},{"name":"DNS Zone Transfer — AXFR","desc":"Un transfert de zone copie la zone DNS d’un serveur primaire vers un serveur secondaire pour assurer la réplication. S’il n’est pas limité aux secondaires autorisés, un client quelconque peut demander AXFR et obtenir une grande partie de la cartographie DNS : serveurs, hostnames, machines, IP et alias.","syntax":"dig ns <domain>\ndig @<name-server> <domain> axfr","exam":"AXFR est légitime entre serveurs DNS ; la vulnérabilité est de l’autoriser à des clients non autorisés.","xref":[2]},{"name":"DNS Cache Snooping","desc":"Le cache snooping consiste à interroger un résolveur DNS pour déterminer si un nom se trouve déjà dans son cache. Cela peut révéler quels domaines ont été consultés ou utilisés par des clients. Les requêtes récursives et non récursives produisent des comportements différents utiles à cette vérification.","syntax":"dig @<DNS-server> <domain> +recurse\ndig @<DNS-server> <domain> +norecurse"},{"name":"DNSSEC Zone Walking","desc":"Avec certaines configurations DNSSEC, les enregistrements NSEC ou NSEC3 peuvent permettre de parcourir les noms présents dans une zone. ldns-walk, DNSRecon et le script NSE dns-nsec-enum sont utilisés pour ce type d’énumération.","syntax":"ldns-walk @<DNS-server-IP> <domain>\ndnsrecon -d <domain> -z\nnmap -sU -p 53 --script dns-nsec-enum --script-args dns-nsec-enum.domains=<domain> <target>","exam":"Zone walking = DNSSEC/NSEC(NSEC3), à distinguer du transfert AXFR."}]},{"g":"NTP, IPsec, VoIP & Unix/Linux","items":[{"name":"NTP Enumeration","desc":"NTP synchronise les horloges des systèmes sur UDP 123. Une interrogation NTP peut révéler les pairs, clients, adresses IP, noms de systèmes et parfois des informations internes si le serveur se trouve en DMZ. ntptrace permet en plus de remonter la chaîne de serveurs jusqu’à la source primaire.","cheat":[{"words":1,"title":"Outils","rows":[["ntpdate","collecte des échantillons de temps"],["ntptrace","trace la chaîne des serveurs"],["ntpdc","interroge l’état de ntpd"],["ntpq","surveille les opérations et performances de ntpd"]]}],"exam":"UDP 123 = NTP."},{"name":"IPsec / IKE Enumeration","desc":"La plupart des VPN IPsec utilisent IKE/ISAKMP pour négocier les Security Associations et les paramètres cryptographiques. En énumérant UDP 500, on cherche la présence d’un service IKE et on peut obtenir les algorithmes de chiffrement/hachage, le type d’authentification, les paramètres de distribution de clés et la durée des SA.","syntax":"nmap -sU -p 500 <target>\nnmap -sU -p 500 --script=ike-version <target>\nike-scan <target>","exam":"UDP 500 = ISAKMP/IKE."},{"name":"VoIP / SIP Enumeration","desc":"SIP est utilisé pour établir et gérer des communications VoIP. L’énumération cherche les gateways, PBX/IP-PBX, softphones, téléphones, User-Agents et extensions. Le module cite 5060 pour SIP non chiffré et 5061 pour SIP protégé par TLS, ainsi que 2000/2001 dans certains environnements.","cheat":[{"words":1,"title":"Informations obtenues","rows":[["Infrastructure","gateways, PBX, SIP servers"],["Clients","softphones, phones, User-Agent IPs"],["Identités","extensions utilisateurs"]]}],"exam":"5060 = SIP ; 5061 = SIP sur TLS."},{"name":"Unix/Linux User Enumeration","desc":"Des utilitaires historiques Unix permettent de demander quels utilisateurs sont connectés. rusers liste les utilisateurs distants, rwho affiche les utilisateurs présents sur les machines du réseau local et finger fournit des informations détaillées comme login, nom réel, terminal, temps d’inactivité et heure de connexion.","cheat":[{"words":1,"title":"Commandes","rows":[["rusers","utilisateurs distants / réseau"],["rwho","utilisateurs sur les hôtes du LAN"],["finger","détails d’un utilisateur"]]}]}]},{"g":"Web Enumeration & AI","items":[{"name":"Directory Enumeration","desc":"L’énumération web peut rechercher des répertoires qui ne sont pas directement liés dans le site. Un outil prend une wordlist de noms probables, envoie une requête pour chacun et observe les réponses du serveur. Les résultats dépendent donc fortement de la qualité de la wordlist.","flow":"Wordlist → requêtes HTTP → codes/réponses → répertoires trouvés","exam":"Directory discovery ne garantit pas de trouver tous les chemins : ce qui n’est pas dans la wordlist peut rester invisible.","xref":[13,14]},{"name":"WordPress Enumeration","desc":"Sur WordPress, l’énumération peut viser les utilisateurs, plugins, thèmes et versions vulnérables. WPScan est conçu spécifiquement pour cette tâche ; Metasploit fournit aussi des modules HTTP comme wordpress_login_enum pour rechercher des utilisateurs.","syntax":"wpscan --url https://<target>\nuse auxiliary/scanner/http/wordpress_login_enum","xref":[14]},{"name":"Enumeration assistée par IA","desc":"L’IA peut accélérer l’énumération en corrélant de grandes quantités de données, en proposant des noms de sous-domaines ou de services plausibles, en générant des schémas de usernames et en adaptant des entrées de fuzzing. Les résultats doivent toutefois être vérifiés manuellement : l’automatisation peut produire des faux positifs ou des informations inventées.","exam":"IA = accélérateur et générateur d’hypothèses, pas validation automatique."}]}]},"outil":{"groups":[{"g":"Service & Nmap NSE","items":[{"name":"Nmap — Service Enumeration","desc":"Nmap -sV interroge les services trouvés pour identifier leur nom et leur version. Les scripts NSE permettent ensuite de demander des informations spécifiques au protocole lorsque la bannière seule ne suffit pas.","syntax":"sudo nmap -sV <target>\nsudo nmap -sV --script=banner <target>\nsudo nmap --script=ssl-enum-ciphers.nse <target>\nsudo nmap --script=ssh2-enum-algos.nse <target>","cheat":[{"words":1,"title":"Options importantes","rows":[["-sV","service + version detection"],["--script=banner","récupérer la bannière brute"],["ssl-enum-ciphers.nse","énumérer les suites TLS"],["ssh2-enum-algos.nse","énumérer les algorithmes SSH"]]}],"xref":[3]}]},{"g":"NetBIOS / SMB","items":[{"name":"nbtstat","desc":"Utilitaire Windows de diagnostic NetBIOS. Il affiche les tables de noms locales/distantes, le cache de noms et les sessions NetBIOS. Les options -a et -A servent à interroger une machine distante respectivement par nom ou par adresse IP.","syntax":"nbtstat -a <remote-name>\nnbtstat -A <IP>\nnbtstat -c\nnbtstat -n\nnbtstat -r\nnbtstat -R\nnbtstat -RR\nnbtstat -s\nnbtstat -S","cheat":[{"words":1,"title":"Options","rows":[["-a <name>","table NetBIOS distante par nom"],["-A <IP>","table NetBIOS distante par IP"],["-c","cache NetBIOS"],["-n","noms enregistrés localement"],["-r","statistiques résolues broadcast/WINS"],["-R","purge et recharge le cache"],["-RR","release + re-register names"],["-s","sessions avec résolution en noms"],["-S","sessions avec adresses IP"],["<interval>","réafficher périodiquement"],["-?","help"]]}],"exam":"-a = nom ; -A = adresse IP."},{"name":"nmblookup","desc":"Outil Samba sous Linux pour rechercher des noms NetBIOS ou interroger WINS. -B force l’adresse de broadcast utilisée, -R effectue une recherche récursive via WINS et -S demande aussi le node status.","syntax":"nmblookup -S -B <broadcast-or-target-IP> <name>","cheat":[{"words":1,"title":"Options","rows":[["-B <addr>","broadcast address"],["-R","recursive / WINS lookup"],["-S","retourner aussi le node status"]]}]},{"name":"nbtscan","desc":"Scanner NetBIOS pour un hôte ou un réseau. Il peut retourner nom NetBIOS, utilisateur, adresse MAC et IP, ce qui le rend pratique pour dresser rapidement l’inventaire Windows d’un segment.","syntax":"nbtscan 192.168.2.0/24\nnbtscan -A <target>","cheat":[{"words":1,"title":"À retenir","rows":[["Réseau CIDR","balaye plusieurs hôtes"],["-A <target>","forme montrée pour l’énumération d’une cible"]]}]},{"name":"net view","desc":"Commande Windows pour lister les ressources partagées d’une machine ou les machines/partages visibles dans un domaine.","syntax":"net view \\\\<computer>\nnet view \\\\<computer> /ALL\nnet view /domain\nnet view /domain:<domain>","cheat":[{"words":1,"title":"Options","rows":[["\\\\<computer>","ressources du poste"],["/ALL","inclut les partages cachés"],["/domain","domaines / ressources de domaine"],["/domain:<name>","domaine précis"]]}]},{"name":"net — Workstation statistics","desc":"L’utilitaire net peut aussi interroger le service Workstation. net statistics workstation affiche notamment octets transférés, sessions ouvertes et sessions échouées.","syntax":"net statistics workstation"},{"name":"enum4linux","desc":"Outil Kali qui encapsule plusieurs utilitaires Samba pour récupérer automatiquement des informations SMB comme les utilisateurs, groupes et partages.","syntax":"enum4linux -S <target>","cheat":[{"words":1,"title":"Option présente","rows":[["-S","énumération des shares"]]}]},{"name":"Nmap — SMB NSE","desc":"Les scripts SMB de Nmap permettent d’énumérer dialectes SMB, OS, utilisateurs et partages. Certains résultats nécessitent une authentification selon la configuration de la cible.","syntax":"nmap -p 445 --script smb-protocols <target>\nnmap -p 445 --script smb-enum-shares <target>\nnmap -p 445 --script smb-enum-users <target>\nnmap -p 445 --script smb-os-discovery <target>\nnmap -sV -v --script nbstat.nse <target>","cheat":[{"words":1,"title":"Scripts","rows":[["smb-protocols","dialectes SMB"],["smb-enum-shares","partages"],["smb-enum-users","utilisateurs"],["smb-os-discovery","OS, computer/domain info"],["nbstat.nse","NetBIOS status"]]}]},{"name":"Metasploit — SMB modules","desc":"Metasploit fournit des modules auxiliaires pour identifier la version SMB, énumérer les comptes du domaine, tester des identifiants et lister les partages.","syntax":"use auxiliary/scanner/smb/smb_version\nuse auxiliary/scanner/smb/smb_enumusers_domain\nuse auxiliary/scanner/smb/smb_login\nuse auxiliary/scanner/smb/smb_enumshares","cheat":[{"words":1,"title":"Modules","rows":[["smb_version","version SMB / informations OS"],["smb_enumusers_domain","utilisateurs domaine"],["smb_login","tests username/password"],["smb_enumshares","shares"]]}]},{"name":"PsTools Suite","desc":"Suite Sysinternals pour l’administration distante Windows. Dans un contexte d’énumération, elle peut aider à identifier des SID, utilisateurs connectés, informations système, processus et fichiers ouverts.","syntax":"psexec \\\\<computer> -u <user> -p <password> <command>\npsgetsid \\\\<computer> <account-or-SID>\npsinfo \\\\<computer>","cheat":[{"words":1,"title":"Outils","rows":[["PsExec","exécuter un processus distant"],["PsFile","voir/fermer les fichiers ouverts à distance"],["PsGetSid","SID ↔ nom de compte"],["PsKill","tuer un processus"],["PsInfo","OS, build, CPU, RAM, date d’installation"],["PsList","processus / CPU / mémoire / threads"],["PsLoggedOn","utilisateurs connectés localement ou via ressources"]]}]},{"name":"NetBIOS Enumerator","desc":"Outil graphique : on fournit une plage IP et il interroge les hôtes SMB/NetBIOS pour récupérer notamment noms de machines, usernames disponibles, domaines/workgroups et adresses MAC. Une énumération non authentifiée ne permet pas forcément d’obtenir l’utilisateur actuellement connecté."}]},{"g":"SNMP & LDAP","items":[{"name":"snmpwalk","desc":"snmpwalk parcourt la MIB d’un agent SNMP et récupère successivement les OID accessibles avec le niveau d’autorisation fourni. C’est l’outil principal pour transformer une community string valide en inventaire détaillé de l’équipement.","syntax":"snmpwalk -v1 -c public <target>\nsnmpwalk -v2c -c public <target>\nsnmpwalk -v2c -c public <target> hrSWInstalledName","cheat":[{"words":1,"title":"Options","rows":[["-v 1 / 2c / 3","version SNMP"],["-c <community>","community string v1/v2c"],["OID final","limite la marche à une branche/objet, ex. hrSWInstalledName"]]}],"exam":"-v choisit la version ; -c fournit la community string."},{"name":"Nmap — SNMP NSE","desc":"Nmap peut scanner UDP 161 et utiliser des scripts NSE pour récupérer des informations spécifiques à l’agent.","syntax":"nmap -sU -p 161 --script snmp-info <target>\nnmap -sU -p 161 --script snmp-processes <target>","cheat":[{"words":1,"title":"Scripts","rows":[["snmp-info","informations générales SNMP"],["snmp-processes","processus exposés via SNMP"]]}]},{"name":"ldapsearch","desc":"Client LDAP en ligne de commande. Il permet de découvrir les naming contexts, définir un base DN, appliquer des filtres LDAP et sélectionner les attributs à retourner.","syntax":"ldapsearch -h <IP> -x -s base namingcontexts\nldapsearch -h <IP> -x -b \"DC=htb,DC=local\"\nldapsearch -h <IP> -x -b \"DC=htb,DC=local\" \"(objectClass=Employee)\"\nldapsearch -x -h <IP> -b \"DC=htb,DC=local\" \"objectclass=*\"","cheat":[{"words":1,"title":"Options importantes","rows":[["-h <host>","serveur LDAP"],["-x","simple authentication / simple bind"],["-s base","scope base"],["-b <DN>","base DN"],["(filter)","filtre LDAP"],["attributs à la fin","ex. sAMAccountName, sAMAccountType"]]}]},{"name":"LDAP GUI Tools","desc":"Le module cite plusieurs interfaces graphiques pour explorer un annuaire : Softerra LDAP Administrator, AD Explorer et LDAP Admin Tool. Leur rôle commun est de parcourir l’arbre LDAP/AD, rechercher des objets et inspecter leurs attributs.","cheat":[{"words":1,"title":"Outils","rows":[["Softerra LDAP Administrator","administration/exploration LDAP"],["AD Explorer","exploration Active Directory"],["LDAP Admin Tool","GUI LDAP"]]}]}]},{"g":"RPC / RMI / NFS / NTP","items":[{"name":"rpcinfo","desc":"rpcinfo interroge portmap/rpcbind et liste les programmes RPC enregistrés, leurs versions, protocoles et ports. C’est plus direct qu’un scan limité aux ports courants, car les services RPC peuvent utiliser des ports élevés dynamiques.","syntax":"rpcinfo -p <target>","cheat":[{"words":1,"title":"Option","rows":[["-p","liste des programmes RPC + ports"]]}],"exam":"rpcinfo -p est la commande à associer au portmapper."},{"name":"Metasploit — SunRPC","desc":"Module auxiliaire permettant d’énumérer le portmapper Sun RPC et les programmes qu’il publie.","syntax":"use auxiliary/scanner/misc/sunrpc_portmapper"},{"name":"BaRMIe","desc":"Outil dédié à Java RMI. Il interroge un service RMI pour identifier les objets exposés et peut tester des vecteurs connus contre eux.","syntax":"java -jar BaRMIe_v1.01.jar <target>"},{"name":"Metasploit — Java RMI","desc":"Module de collecte pour interroger un Java RMI Registry et récupérer les objets enregistrés.","syntax":"use auxiliary/gather/java_rmi_registry"},{"name":"showmount","desc":"showmount interroge un serveur NFS pour lister les systèmes de fichiers exportés. Cela permet de voir quelles ressources sont proposées au réseau avant d’essayer de les monter.","syntax":"showmount -e <target>","cheat":[{"words":1,"title":"Option","rows":[["-e","afficher la liste des exports"]]}],"exam":"showmount -e = liste des partages NFS."},{"name":"ntpdate","desc":"ntpdate collecte des échantillons de temps auprès d’un ou plusieurs serveurs NTP. Sa syntaxe permet de choisir IPv4/IPv6, timeout, version, authentification ou nombre d’échantillons.","syntax":"ntpdate [-46bBdqsuv] [-a key] [-e authdelay] [-k keyfile] [-o version] [-p samples] [-t timeout] [-U user_name] server [...]","cheat":[{"words":1,"title":"Options citées","rows":[["-4 / -6","IPv4 / IPv6"],["-a key","clé d’authentification"],["-k keyfile","fichier de clés"],["-o version","version NTP"],["-p samples","nombre d’échantillons"],["-t timeout","timeout"],["-U user_name","utilisateur"]]}]},{"name":"ntptrace","desc":"ntptrace suit les relations NTP depuis un serveur jusqu’à une source de référence de niveau supérieur, en affichant notamment stratum, offset et distance de synchronisation.","syntax":"ntptrace [-n] [-m maxhosts] [servername/IP_address]","cheat":[{"words":1,"title":"Options","rows":[["-n","sortie numérique"],["-m maxhosts","limite le nombre d’hôtes"]]}]},{"name":"ntpdc","desc":"ntpdc interroge l’état du démon ntpd et peut afficher les peers. Il peut fonctionner en ligne de commande ou en mode interactif.","syntax":"ntpdc [-46dilnps] [-c command] [host]","cheat":[{"words":1,"title":"Options","rows":[["-4 / -6","forcer IPv4 / IPv6"],["-d","debug"],["-c command","commande directe"],["-i","mode interactif"],["-l","listpeers"],["-n","format numérique"],["-p","peers + état"],["-s","dmpeers / autre résumé d’état"]]}]},{"name":"ntpq","desc":"ntpq sert à surveiller le fonctionnement de ntpd et ses performances.","syntax":"ntpq [-inp] [-c command] [host] [...]","cheat":[{"words":1,"title":"Options citées","rows":[["-i","mode interactif"],["-n","sortie numérique"],["-p","affichage des peers"],["-c command","exécuter une commande"]]}]}]},{"g":"SMTP / DNS / IPsec / VoIP","items":[{"name":"Netcat / Telnet — SMTP","desc":"Un serveur SMTP peut être interrogé manuellement sur son port pour observer les réponses à HELO/EHLO, VRFY, EXPN et RCPT TO.","syntax":"nc <target> 25\nEHLO example.com\nVRFY admin\n\n# ou\ntelnet <target> 25\nHELO x\nVRFY <user>"},{"name":"smtp-user-enum","desc":"Outil spécialisé qui automatise l’énumération des utilisateurs SMTP en exploitant les différences de réponses aux commandes VRFY, EXPN ou RCPT TO.","exam":"Associer smtp-user-enum à l’énumération de comptes via VRFY / EXPN / RCPT TO."},{"name":"Nmap — SMTP NSE","desc":"Le script smtp-enum-users permet de tester automatiquement plusieurs méthodes d’énumération SMTP et d’enregistrer les résultats.","syntax":"nmap -p25 --script smtp-enum-users --script-args smtp-enum-users.methods={VRFY,EXPN,RCPT} <target> -oN output.txt","cheat":[{"words":1,"title":"Éléments","rows":[["-p25","cible SMTP"],["--script smtp-enum-users","script d’énumération"],["methods={VRFY,EXPN,RCPT}","méthodes à tester"],["-oN output.txt","sortie normale dans un fichier"]]}]},{"name":"Metasploit — smtp_enum","desc":"Module auxiliaire qui automatise l’énumération SMTP à partir d’une liste de noms et compare les réponses du serveur.","syntax":"msfconsole -q -x \"use auxiliary/scanner/smtp/smtp_enum; set RHOSTS <target>; run; exit\""},{"name":"dig — AXFR & Cache Snooping","desc":"dig sert ici à trouver les nameservers, tenter un transfert AXFR et interroger le cache d’un résolveur.","syntax":"dig ns <domain>\ndig @<NS> <domain> axfr\ndig @<DNS-server> <domain> +recurse\ndig @<DNS-server> <domain> +norecurse","cheat":[{"words":1,"title":"Usages","rows":[["ns","récupérer les NS"],["axfr","zone transfer"],["+recurse","requête récursive"],["+norecurse","requête non récursive / cache snooping"]]}]},{"name":"Nmap — DNS NSE","desc":"Scripts NSE utilisés pour découvrir des services DNS, brute-forcer des sous-domaines, tester la récursion ou effectuer du NSEC enumeration.","syntax":"nmap --script=broadcast-dns-service-discovery <domain>\nnmap -T4 -p 53 --script dns-brute <domain>\nnmap -Pn -sU -p 53 --script=dns-recurs
