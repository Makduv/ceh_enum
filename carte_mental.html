— personnalisation à grande échelle","desc":"L’IA transforme surtout l’économie de l’attaque : une seule personne peut générer de nombreux messages personnalisés, adapter le ton, exploiter l’OSINT et répondre en temps réel grâce à des chatbots."},{"name":"IA — deepfake & voice cloning","desc":"Les modèles audio/vidéo permettent d’imiter une personne connue pendant une interaction. La crédibilité d’une voix ou d’une image ne suffit donc plus à authentifier une demande sensible."}]}]},"outil":{"groups":[{"g":"Campagnes, sensibilisation & phishing","items":[{"name":"Social-Engineer Toolkit (SET)","desc":"Outil menu-driven s’appuyant sur Metasploit pour automatiser plusieurs scénarios de social engineering : spear phishing, clonage de sites, mass mailer, médias infectieux, PowerShell et QR codes.","cheat":[{"title":"Fonctions à reconnaître","rows":[["Spear phishing","création/envoi de campagnes ciblées"],["Website attack","clonage + credential harvesting"],["Mass mailer","envoi d’emails à grande échelle"],["Infectious media","génération de supports USB/CD"],["PowerShell","payloads basés sur PowerShell"],["QR code","génération de QR redirigeant vers une URL"]],"words":1}],"xref":[6]},{"name":"FiercePhish","desc":"Plateforme de campagnes de phishing utilisée pour des simulations/red-team et pour mesurer les clics ou réactions des utilisateurs."},{"name":"GoPhish","desc":"Plateforme de campagne de phishing citée comme outil comparable à FiercePhish pour les simulations et la sensibilisation."},{"name":"OhPhish","desc":"Plateforme EC-Council Aware de simulation et formation : clic, credential harvesting, envoi de pièces jointes, vishing, smishing et assignation de formation."},{"name":"Netcraft","desc":"Extension/service anti-phishing permettant de bloquer ou signaler des sites suspects."},{"name":"PhishTank","desc":"Base collaborative de signalements de phishing avec API ouverte pour intégrer la réputation de sites dans d’autres outils."}]},{"g":"Clonage de sites & HTTP","items":[{"name":"WinHTTrack","desc":"Interface graphique permettant de reproduire un site pour consultation hors ligne. Le chapitre le cite comme outil de clonage de site web."},{"name":"wget","desc":"Outil CLI de téléchargement HTTP capable de suivre récursivement les liens et de créer une copie locale d’un site.","syntax":"wget -m https://target.example","cheat":[{"title":"Options importantes du chapitre","rows":[["-m","mode mirror : téléchargement récursif du site"],["--convert-links","réécrit les liens pour qu’ils fonctionnent localement"],["--page-requisites","récupère les ressources nécessaires à l’affichage hors ligne"]],"words":1}]},{"name":"cURL","desc":"Outil CLI de transfert de données via URL. Plus adapté que wget pour récupérer une page précise, interroger une API, tester des en-têtes ou automatiser une requête HTTP.","syntax":"curl https://target.example"}]},{"g":"Rogue Wi-Fi & accès physique","items":[{"name":"hostapd","desc":"Permet de transformer une interface Wi-Fi compatible en point d’accès en définissant notamment SSID, canal et paramètres de sécurité. Le chapitre le cite dans les scénarios de rogue AP.","xref":[16]},{"name":"iptables","desc":"Outil de filtrage/routage Linux utilisé pour faire transiter le trafic d’un faux point d’accès vers une autre interface réseau afin de fournir un accès Internet aux clients connectés.","xref":[16]},{"name":"wifiphisher","desc":"Automatise un scénario rogue AP : découverte des SSID, choix du réseau à imiter, déauthentification des clients puis portail de phishing ou autre page d’interaction.","cheat":[{"title":"Workflow à retenir","rows":[["1","scan des SSID"],["2","sélection du SSID à imiter"],["3","déauthentification des clients du vrai AP"],["4","reconnexion vers le rogue AP"],["5","fake portal ou page de payload"]],"words":1}],"xref":[16]},{"name":"Proxmark","desc":"Matériel cité pour interagir avec certaines technologies RFID/NFC dans des scénarios d’audit de badges physiques."},{"name":"Flipper Zero","desc":"Matériel cité comme exemple de dispositif pouvant interagir avec certains badges ou technologies sans contact dans un contexte de test physique."}]},{"g":"Deepfake & QR","items":[{"name":"DeepFaceLab","desc":"Outil cité pour la création de deepfakes vidéo."},{"name":"Vidnoz","desc":"Outil cité pour la génération ou manipulation de contenus vidéo synthétiques."},{"name":"Deepfakesweb","desc":"Service cité pour la création de deepfakes."},{"name":"Synthesia","desc":"Plateforme citée pour la génération de vidéo par IA."},{"name":"DeepBrain AI","desc":"Plateforme citée pour la génération de contenu vidéo synthétique."},{"name":"Hoodem","desc":"Outil cité dans la liste des solutions de deepfake du module."},{"name":"QR TIGER","desc":"Générateur de QR code cité dans le contexte QRLJacking pour reproduire ou publier un QR code dans une page de phishing."}]}]},"port":{"groups":[{"g":"Protocoles & canaux de communication","items":[{"name":"SMTP — 25 / 587 / 465","desc":"L’email reste un canal central du phishing. Le chapitre rappelle SMTP pour l’acheminement des messages ; 587 correspond couramment à la soumission et 465 à SMTP sur TLS implicite.","tr":"tcp","xref":[4]},{"name":"HTTP — 80","desc":"Les pages de phishing, faux portails et sites clonés peuvent être servis en HTTP. L’absence de chiffrement facilite aussi l’observation du trafic.","tr":"tcp"},{"name":"HTTPS — 443","desc":"Le fait qu’un faux site utilise HTTPS ne garantit pas qu’il soit légitime ; TLS protège la connexion au site choisi mais n’atteste pas à lui seul que ce site est digne de confiance.","tr":"tcp"},{"name":"OAuth — pas de port dédié","desc":"Consent phishing abuse un protocole d’autorisation applicatif. Les flux sont généralement transportés sur HTTPS ; il n’existe pas de « port OAuth » spécifique.","tr":"n/a"},{"name":"DNS — 53","desc":"Le pharming peut s’appuyer sur un détournement de résolution DNS pour rediriger la victime vers un faux site.","tr":"both","xref":[2,4]}]},{"g":"RFID / NFC / Wi-Fi","items":[{"name":"RFID — 125 kHz","desc":"Fréquence basse citée pour certains badges d’accès plus anciens. Le chapitre l’associe à des scénarios de clonage physique.","tr":"n/a"},{"name":"RFID / NFC — 13,56 MHz","desc":"Fréquence haute utilisée par de nombreuses technologies RFID/NFC ; le chapitre la cite parmi les systèmes de badges sans contact.","tr":"n/a"},{"name":"WEP","desc":"Ancien mécanisme de sécurité Wi-Fi cité comme cassé et facilement déchiffrable.","tr":"n/a","xref":[16]},{"name":"WPA","desc":"Évolution de WEP avec prise en charge de modes PSK ou Enterprise ; le chapitre le présente comme ancien et plus faible que WPA2/WPA3.","tr":"n/a","xref":[16]},{"name":"WPA2","desc":"Mécanisme Wi-Fi largement utilisé avec AES et modes PSK/Enterprise.","tr":"n/a","xref":[16]},{"name":"WPA3 / SAE","desc":"Standard Wi-Fi plus récent introduisant notamment SAE et une meilleure résistance aux attaques par dictionnaire hors ligne.","tr":"n/a","xref":[16]},{"name":"802.11w / Protected Management Frames","desc":"Protection des trames de management mentionnée comme mesure réduisant les attaques de déauthentification utilisées dans certains scénarios rogue Wi-Fi.","tr":"n/a","xref":[16]}]}]},"contre":{"groups":[{"g":"Sensibilisation & processus","items":[{"name":"Security awareness training","desc":"Former régulièrement les utilisateurs aux scénarios réels : phishing, vishing, smishing, faux support, pièces jointes, badges, USB et demandes urgentes. Les rôles à risque doivent recevoir une formation adaptée."},{"name":"Vérification par canal indépendant","desc":"Pour une demande sensible, contacter la personne ou le service via un canal connu et distinct de celui utilisé dans la demande initiale. La crédibilité du message, de la voix ou de la vidéo ne suffit pas."},{"name":"Politiques officielles et accusé de compréhension","desc":"Les politiques doivent être diffusées, expliquées et acceptées formellement. Elles précisent les comportements attendus, les exceptions et les conséquences d’une violation."},{"name":"Procédure help desk stricte","desc":"Les resets de mot de passe, modifications MFA, changements de coordonnées ou demandes d’accès doivent suivre une procédure de vérification standard, même pour un VIP ou une situation urgente."},{"name":"Réduire l’information publique exploitable","desc":"Limiter la publication inutile de coordonnées, organigrammes, détails de projets et informations internes réduit la quantité d’OSINT utilisable pour construire un prétexte."},{"name":"Challenge culture","desc":"Autoriser et encourager les employés à vérifier l’identité d’une personne inconnue, d’un visiteur ou d’une demande inhabituelle sans craindre de contrarier un supérieur ou un client."}]},{"g":"Mots de passe, identité & comptes","items":[{"name":"Password policy","desc":"Utiliser des mots de passe longs et complexes, éviter les réponses faciles aux questions de social engineering, ne pas réutiliser les secrets et ne jamais les transmettre par téléphone, email ou SMS."},{"name":"MFA","desc":"L’authentification multifacteur réduit l’impact d’un mot de passe volé et complique l’usurpation d’identité. Les demandes MFA inhabituelles doivent aussi être considérées comme suspectes."},{"name":"Account lockout","desc":"Bloquer temporairement un compte après plusieurs échecs réduit les tentatives répétées de deviner ou d’utiliser des identifiants."},{"name":"Surveiller comptes et relevés","desc":"Contrôler les comptes financiers, relevés, factures et alertes de sécurité aide à détecter rapidement une usurpation d’identité."},{"name":"Vérifier les contacts non sollicités","desc":"Ne jamais fournir d’information personnelle à un interlocuteur non vérifié ; rappeler l’organisation via un numéro officiel ou utiliser un canal indépendant."},{"name":"MFA sur réseaux sociaux","desc":"Activer MFA sur les comptes sociaux, vérifier les demandes inhabituelles hors plateforme, signaler les profils dupliqués et surveiller l’exposition d’identifiants dans les fuites."}]},{"g":"Email, web & anti-phishing","items":[{"name":"Email filtering","desc":"Filtrage des expéditeurs, domaines, pièces jointes et URLs pour réduire la livraison de campagnes connues ou manifestement suspectes."},{"name":"SPF / DKIM / DMARC","desc":"Contrôles d’authentification email limitant certaines usurpations de domaine. Ils ne remplacent pas la sensibilisation ni la validation de la demande."},{"name":"Link sandboxing","desc":"Analyser les liens ou pièces jointes dans un environnement isolé avant qu’ils n’atteignent l’utilisateur ou au moment du clic."},{"name":"Browser / anti-phishing protection","desc":"Utiliser des protections de réputation et des extensions capables de signaler ou bloquer les sites connus pour le phishing."},{"name":"Vérifier URL et domaine","desc":"Lire le domaine réel, pas seulement le texte visible du lien ; contrôler fautes de frappe, sous-domaines trompeurs, caractères similaires et redirections."},{"name":"Bloquer les macros / pièces jointes à risque","desc":"Les pièces jointes inattendues doivent être ouvertes avec prudence ; les macros ou exécutables embarqués sont des vecteurs classiques."}]},{"g":"Sécurité physique","items":[{"name":"Badges, visiteurs & escortes","desc":"Émettre des badges, contrôler les visiteurs et accompagner les personnes externes dans les zones sensibles réduit l’impersonation et le tailgating."},{"name":"Man traps","desc":"Imposent le passage d’une seule personne à la fois et rendent plus difficile piggybacking et tailgating."},{"name":"Door close timers","desc":"Réduire le temps pendant lequel une porte reste ouverte limite la possibilité pour une seconde personne de se glisser derrière un utilisateur légitime."},{"name":"Security guards","desc":"La vérification humaine à l’entrée permet de détecter badges douteux, comportements inhabituels et visiteurs non autorisés."},{"name":"Disable USB autorun","desc":"Empêcher l’exécution automatique d’un média amovible limite l’efficacité d’un baiting par clé USB."},{"name":"Bloquer ou contrôler les USB inconnus","desc":"Une politique endpoint peut refuser les supports non approuvés ou imposer leur analyse avant utilisation."}]},{"g":"Deepfake & contenus synthétiques","items":[{"name":"Digital watermarking","desc":"Ajouter des mécanismes de provenance ou de marquage à un contenu authentique aide à distinguer une source officielle d’un contenu modifié."},{"name":"Blockchain / provenance","desc":"Le cours cite l’enregistrement de l’authenticité d’un contenu dans une infrastructure de provenance afin de faciliter sa vérification."},{"name":"AI/ML deepfake detection","desc":"Utiliser des outils recherchant mouvements oculaires inhabituels, expressions incohérentes, défauts de lip-sync, éclairage ou artefacts de génération."},{"name":"Forensic verification","desc":"Analyser compression, pixels, audio, incohérences vidéo et métadonnées pour rechercher des signes de manipulation."},{"name":"Protection des données biométriques","desc":"Limiter la collecte et l’exposition des voix, visages et autres données biométriques réduit la matière première disponible pour certaines usurpations."},{"name":"Procédure d’approbation hors média","desc":"Une demande de virement, d’accès ou de changement sensible ne doit jamais être validée uniquement parce qu’une vidéo ou une voix semble authentique."}]},{"g":"Rogue Wi-Fi & mobile","items":[{"name":"WPA3","desc":"Utiliser la génération de sécurité Wi-Fi la plus récente disponible réduit certains scénarios associés aux anciens mécanismes."},{"name":"802.11w / Protected Management Frames","desc":"Protège certaines trames de management et limite les attaques de déauthentification utilisées pour pousser un client vers un rogue AP.","xref":[16]},{"name":"VPN sur réseau non fiable","desc":"Un tunnel chiffré limite l’exposition du trafic lorsqu’un utilisateur doit utiliser un réseau public ou non maîtrisé."},{"name":"Vérifier le réseau avant connexion","desc":"Ne pas se fier uniquement au SSID ; confirmer le nom du réseau auprès du lieu ou de l’organisation et éviter les réseaux inattendus."},{"name":"Désactiver l’auto-connect Wi-Fi","desc":"Empêche l’appareil de rejoindre automatiquement un SSID connu qui serait usurpé par un rogue AP."},{"name":"Installer uniquement depuis des sources fiables","desc":"Éviter les boutiques tierces et vérifier l’éditeur réduit le risque d’application mobile repackagée ou fausse."}]}]}}},{"n":10,"t":"Déni de service","data":{"concept":{"groups":[{"g":"Fondamentaux DoS / DDoS","items":[{"name":"Denial-of-Service (DoS)","desc":"Une attaque DoS cherche à réduire, restreindre ou empêcher l'accès d'utilisateurs légitimes à un système ou à une ressource. Le but principal n'est pas de voler des données ni d'obtenir un accès non autorisé : il est de rendre le service indisponible en épuisant ses ressources, en surchargeant un service ou en provoquant un dysfonctionnement.","cheat":[{"words":1,"title":"Ce qu'un DoS peut épuiser","rows":[["Bande passante","trop de trafic pour la capacité du lien"],["CPU / mémoire / disque","consommation volontaire de ressources locales"],["Tables d'état / files de connexions","trop de connexions ou de sessions incomplètes"],["Service / pile réseau","paquets malformés ou interactions inattendues provoquant un crash ou un blocage"]]}],"exam":"Réflexe CEH : DoS = indisponibilité pour les utilisateurs légitimes, pas prise de contrôle."},{"name":"DoS vs DDoS","desc":"Un DoS provient d'une source d'attaque unique ou d'un nombre limité de sources. Un DDoS (Distributed Denial-of-Service) distribue l'attaque sur de nombreuses machines compromises — souvent des zombies d'un botnet — afin de générer beaucoup plus de trafic et de rendre le filtrage de la source plus difficile.","cheat":[{"words":1,"title":"Différence essentielle","rows":[["DoS","attaque concentrée depuis une source ou un petit nombre de systèmes"],["DDoS","attaque distribuée depuis de nombreux systèmes compromis"]]}]},{"name":"Objectifs et impacts d'un DoS","desc":"Le DoS vise la disponibilité. Les effets possibles cités dans le module sont la consommation de bande passante, d'espace disque, de temps CPU ou de structures internes, ainsi que des plantages de services ou de piles TCP/IP. L'impact métier peut être une panne réseau, une interruption opérationnelle, une perte financière et une dégradation de l'image de l'organisation."},{"name":"Mécanismes généraux d'un DoS","desc":"Le module regroupe plusieurs façons de provoquer un déni de service : envoyer plus de trafic que la cible ne peut traiter, générer plus d'événements qu'un service ne peut absorber, envoyer des paquets corrompus ou inattendus pour faire planter une pile réseau ou une application, ou forcer le système à rester bloqué dans une boucle ou un état de traitement coûteux."},{"name":"Architecture DDoS : attacker → handlers → zombies","desc":"Dans un DDoS, l'attaquant ne sollicite pas nécessairement directement la cible. Il peut piloter un ou plusieurs systèmes de contrôle/handlers qui commandent des machines compromises. Ces zombies reçoivent ensuite l'ordre d'envoyer le trafic vers la cible. Cette distribution augmente la capacité de l'attaque et complique l'identification d'une source unique.","flow":"Attaquant → Handler / C&C → Zombies / bots → Cible"},{"name":"Réflecteurs dans un DDoS","desc":"Une attaque par réflexion fait envoyer les réponses par des systèmes tiers. L'attaquant envoie des requêtes aux réflecteurs en usurpant l'adresse IP de la victime. Les réflecteurs croient répondre à la victime et lui envoient leurs réponses. Si de nombreux réflecteurs sont utilisés simultanément, la victime reçoit un grand volume de trafic qu'elle n'a jamais demandé.","flow":"Attaquant (IP victime usurpée) → Réflecteurs → Réponses vers la victime"},{"name":"Bot / Zombie","desc":"Un bot ou zombie est une machine compromise qui exécute des tâches automatisées sous le contrôle d'un attaquant. Dans le contexte DDoS, des milliers de bots peuvent recevoir la même instruction et envoyer simultanément du trafic vers une cible."},{"name":"Botnet","desc":"Un botnet est un ensemble de machines infectées et contrôlées comme un groupe. Il peut être utilisé pour des DDoS, du spam, la diffusion de malware ou d'autres activités criminelles. Les bots se reconnectent au C&C pour recevoir des instructions et peuvent chercher de nouvelles machines vulnérables afin d'agrandir le botnet."},{"name":"C&C / Command and Control","desc":"Le C&C est l'infrastructure utilisée pour piloter les bots. Les machines compromises s'y connectent pour recevoir des ordres. Neutraliser les handlers ou le C&C peut donc rendre de nombreux agents inutilisables en même temps, car il existe généralement moins de systèmes de contrôle que de bots."},{"name":"Cycle typique de constitution d'un botnet","desc":"Le scénario du module commence par la mise en place d'un C&C et d'une infrastructure de crimeware, puis par la diffusion du malware via sites compromis, phishing ou social engineering. Les victimes sont infectées, les bots rejoignent le C&C, reçoivent des instructions, cherchent éventuellement d'autres systèmes vulnérables et participent enfin à l'attaque de la cible.","flow":"C&C → diffusion malware → infection → callback des bots → propagation → ordre d'attaque → DDoS"},{"name":"Écosystème d'un botnet","desc":"Un botnet ne sert pas uniquement au DDoS. L'infrastructure peut être liée à l'extorsion, au scan et à l'intrusion, au spam et au mass mailing, au phishing, au vol de données ou à des marchés de malware et de zero-days. Pour l'examen, retiens surtout qu'un même botnet peut soutenir plusieurs activités malveillantes."}]},{"g":"Recherche de machines vulnérables par un botnet","items":[{"name":"Random Scanning","desc":"Chaque machine infectée sonde aléatoirement des adresses IP dans l'espace cible afin de trouver de nouveaux systèmes vulnérables. La méthode génère beaucoup de trafic et peut perdre en efficacité lorsque de nombreuses machines commencent à scanner les mêmes zones."},{"name":"Hit-list Scanning","desc":"L'attaquant prépare d'abord une liste de machines potentiellement vulnérables. Lorsqu'une nouvelle machine est infectée, la liste peut être divisée entre les systèmes compromis afin qu'ils poursuivent la recherche en parallèle. Cette répartition permet une croissance très rapide du nombre de machines compromises.","exam":"Hit-list : liste préconstruite puis divisée entre les nouvelles infections."},{"name":"Topological Scanning","desc":"La machine infectée utilise des informations déjà présentes sur l'hôte — par exemple des URL trouvées sur le disque — pour identifier de nouvelles cibles probables. La recherche s'appuie donc sur la topologie ou les relations découvertes depuis les systèmes déjà compromis."},{"name":"Local Subnet Scanning","desc":"La machine compromise recherche d'autres machines vulnérables sur son propre réseau local. Cette méthode est utile pour atteindre des systèmes internes qui ne sont pas directement visibles depuis Internet parce qu'ils se trouvent derrière un pare-feu ou utilisent des adresses privées."},{"name":"Permutation Scanning","desc":"Tous les systèmes infectés partagent une même permutation pseudo-aléatoire de l'espace d'adresses et commencent à des positions différentes. Cela réduit les scans en doublon et limite la réinfection de machines déjà compromises tout en conservant une vitesse de propagation élevée.","exam":"Permutation scanning : permutation pseudo-aléatoire commune + points de départ différents."}]},{"g":"Catégories d'attaques DoS/DDoS","items":[{"name":"Volumetric Attacks","desc":"Les attaques volumétriques cherchent principalement à saturer la bande passante disponible. Elles génèrent un volume massif de trafic afin que les paquets légitimes ne puissent plus atteindre le service. Leur intensité est mesurée en bits par seconde (bps).","cheat":[{"words":1,"title":"Exemples du module","rows":[["UDP / ICMP floods","volume massif de paquets"],["Smurf / amplification","réponses de tiers dirigées vers la victime"],["Ping of Death / Pulse Wave / NTP amplification","autres exemples classés comme volumétriques"]]}],"exam":"Volumetric = bande passante = bps."},{"name":"Protocol Attacks","desc":"Les attaques de protocole épuisent les ressources nécessaires au traitement des connexions ou des paquets dans les firewalls, load balancers, serveurs et autres équipements. Elles exploitent le fonctionnement ou l'état des protocoles plutôt que seulement la bande passante. Leur intensité est mesurée en paquets par seconde (pps).","cheat":[{"words":1,"title":"Exemples du module","rows":[["SYN flood","épuise la file des connexions incomplètes"],["Fragmentation","coût de réassemblage de fragments"],["ACK / SYN-ACK floods","épuisement par trafic TCP"],["TCP SACK Panic","paquets SACK malformés provoquant un crash Linux"]]}],"exam":"Protocol attack = state tables / traitement réseau = pps."},{"name":"Application-Layer Attacks","desc":"Les attaques de couche applicative consomment les ressources propres à l'application, souvent avec beaucoup moins de trafic qu'une attaque volumétrique. Elles ressemblent parfois à des requêtes légitimes et peuvent donc être difficiles à distinguer d'un client lent ou intensif. Leur intensité est mesurée en requêtes par seconde (rps).","exam":"Application layer = ressources de l'application = rps."},{"name":"Flood Attack","desc":"Une flood attack envoie un grand nombre de paquets ou requêtes afin de dépasser la capacité de traitement de la cible. Le principe est la quantité : saturer la bande passante, le CPU, les files de connexions ou un service."},{"name":"Amplification Attack","desc":"Une attaque d'amplification exploite un protocole où une petite requête provoque une réponse beaucoup plus grande. L'attaquant usurpe l'adresse IP de la victime dans la requête : les systèmes sollicités envoient alors les grosses réponses à la victime. L'objectif est d'obtenir plus de trafic reçu par la cible que de trafic émis par l'attaquant.","flow":"Petite requête + IP victime usurpée → serveur tiers → grosse réponse → victime"},{"name":"Reflection vs Amplification","desc":"Reflection décrit le fait que les réponses proviennent de systèmes tiers qui pensent répondre à la victime. Amplification ajoute un effet multiplicateur : la réponse générée est beaucoup plus grande que la requête initiale. Une même attaque peut donc être à la fois réfléchie et amplifiée."},{"name":"Mesures bps / pps / rps","desc":"Le CEH associe chaque grande famille à une mesure typique : les attaques volumétriques sont exprimées en bits par seconde, les attaques de protocole en paquets par seconde et les attaques applicatives en requêtes par seconde.","syntax":"Volumetric → bps | Protocol → pps | Application Layer → rps","exam":"À mémoriser tel quel pour les QCM."}]},{"g":"Attaques volumétriques & amplification","items":[{"name":"UDP Flood","desc":"L'attaquant envoie à très grande vitesse des paquets UDP, souvent vers des ports aléatoires. La cible doit vérifier si une application écoute sur chaque port et peut répondre par des messages ICMP « Destination Unreachable ». Le traitement répété et le volume de trafic finissent par épuiser ses ressources."},{"name":"ICMP Flood","desc":"L'attaquant envoie une grande quantité de requêtes ICMP Echo, souvent avec des adresses source usurpées. La cible tente de répondre plus vite qu'elle ne le peut réellement, ce qui consomme sa bande passante et ses ressources."},{"name":"Ping of Death","desc":"Le Ping of Death repose sur des paquets ping malformés ou surdimensionnés destinés à faire planter la cible lorsqu'elle tente de les traiter. Dans le module CEH, il est classé parmi les attaques volumétriques à connaître."},{"name":"Smurf Attack","desc":"L'attaquant envoie une requête ICMP Echo à une adresse de broadcast en mettant l'adresse IP de la victime comme source. Tous les hôtes du réseau de broadcast répondent alors à la victime. Une seule requête peut donc déclencher de nombreuses réponses et amplifier le trafic reçu par la cible.","flow":"ICMP Echo → broadcast + IP victime usurpée → tous les hôtes répondent → victime","exam":"Smurf = ICMP + broadcast + source spoofée."},{"name":"DNS Amplification","desc":"DNS utilise couramment UDP, un protocole sans handshake. Une petite requête peut générer une réponse bien plus volumineuse. En usurpant l'adresse IP de la victime, l'attaquant fait envoyer ces réponses amplifiées à la cible.","flow":"Petite requête DNS spoofée → réponse DNS plus grosse → victime","exam":"DNS amplification : petite requête, grosse réponse, IP victime usurpée."},{"name":"NTP Amplification","desc":"Le module classe NTP amplification parmi les attaques volumétriques. Elle suit le principe général d'amplification : des requêtes envoyées à des systèmes tiers avec l'adresse source de la victime déclenchent des réponses qui augmentent le trafic reçu par la cible."},{"name":"Autres protocoles d'amplification","desc":"La section DoS du Chapter 12 cite également SNMP, memcached et SSDP comme protocoles pouvant servir à l'amplification, en plus de DNS et NTP. Le principe reste le même : exploiter une réponse plus grande que la requête et diriger cette réponse vers la victime par usurpation de l'adresse source."},{"name":"Pulse Wave DDoS","desc":"Une Pulse Wave DDoS n'envoie pas nécessairement un flux continu. Elle produit des vagues périodiques de trafic très intense séparées par des intervalles. Les pics peuvent saturer brutalement le lien et empêcher l'infrastructure de retrouver un état stable entre deux vagues.","exam":"Pulse Wave = DDoS par énormes impulsions périodiques, pas trafic constant."},{"name":"Zero-Day DDoS","desc":"Une attaque Zero-Day DDoS exploite une faiblesse de déni de service pour laquelle aucun correctif ou mécanisme de défense adapté n'est encore disponible au moment de l'attaque."}]},{"g":"Attaques de protocole & legacy","items":[{"name":"SYN Flood","desc":"Le SYN flood exploite l'établissement de connexion TCP. L'attaquant envoie de nombreux SYN mais ne termine pas le 3-way handshake. Le serveur conserve des connexions half-open en attente et sa file de connexions finit par être épuisée, empêchant de nouveaux clients légitimes de se connecter.","flow":"SYN → SYN/ACK → pas d'ACK → connexion half-open conservée","cheat":[{"words":1,"title":"À retenir","rows":[["Ressource visée","file / buffer des connexions en attente"],["Pourquoi ça marche","le serveur garde un état pour chaque handshake incomplet"],["Contre-mesure citée","SYN cookies"]]}],"exam":"SYN flood = beaucoup de connexions half-open."},{"name":"SYN-ACK Flood","desc":"Cette attaque envoie un grand nombre de paquets SYN-ACK à la cible. Elle exploite la deuxième étape du 3-way handshake et force la cible à traiter massivement des réponses TCP inattendues, ce qui peut épuiser ses ressources."},{"name":"ACK / PUSH ACK Flood","desc":"L'attaquant envoie une grande quantité de paquets ACK ou PUSH ACK usurpés. La cible consomme des ressources à traiter ce trafic TCP jusqu'à devenir indisponible."},{"name":"Fragmentation Attack","desc":"La cible reçoit de nombreux fragments TCP ou UDP qu'elle ne peut pas réassembler correctement. Elle dépense alors du temps et de la mémoire à gérer ces fragments, ce qui peut finir par épuiser ses ressources."},{"name":"TCP SACK Panic","desc":"Cette attaque cible des systèmes Linux en envoyant des paquets SACK avec un MSS malformé ou très faible. Le cours décrit un dépassement entier dans les structures Socket Buffer (SKB) pouvant conduire à un kernel panic et donc à un déni de service.","cheat":[{"words":1,"title":"Chaîne logique","rows":[["SACK","Selective Acknowledgement TCP"],["MSS","valeur malformée/faible, le cours cite 48 octets"],["Effet","overflow dans la gestion SKB → kernel panic"]]}],"exam":"TCP SACK Panic = Linux + SACK malformé + MSS très faible + kernel panic."},{"name":"Permanent DoS / PDoS / Phlashing","desc":"Un Permanent Denial-of-Service vise à rendre un équipement inutilisable de manière durable, au point de nécessiter une réinstallation ou un remplacement. Le module l'associe au « bricking » d'un système via un firmware ou une mise à jour matérielle falsifiée/corrompue.","exam":"PDoS = phlashing = bricking / dommage durable au système."},{"name":"DRDoS — Distributed Reflection DoS","desc":"Un DRDoS s'appuie sur des systèmes intermédiaires qui réfléchissent du trafic vers la cible. L'attaquant utilise des adresses source usurpées et plusieurs niveaux de victimes/intermédiaires pour que la cible reçoive les réponses sans contact direct évident avec l'attaquant."},{"name":"LAND Attack","desc":"LAND est une attaque historique dans laquelle l'adresse IP et le port source sont identiques à l'adresse IP et au port de destination. Le système se retrouve à répondre à lui-même et peut entrer dans une boucle ou planter. Le Chapter 12 la classe parmi les attaques legacy à reconnaître pour l'examen.","exam":"LAND = source IP/port = destination IP/port."},{"name":"Fraggle Attack","desc":"Fraggle reprend l'idée du Smurf mais avec UDP : des messages UDP sont envoyés à une adresse de broadcast avec l'adresse de la victime usurpée, ce qui provoque des réponses amplifiées vers la cible.","exam":"Smurf = ICMP ; Fraggle = UDP."},{"name":"Teardrop Attack","desc":"Teardrop envoie des fragments IP dont les offsets se chevauchent. Les anciennes piles réseau pouvaient mal gérer le réassemblage de ces fragments et planter. Le Chapter 12 la présente comme une attaque legacy à reconnaître."}]},{"g":"Application layer, HTTP & slow attacks","items":[{"name":"HTTP GET DoS","desc":"Une attaque HTTP GET peut maintenir le serveur occupé en envoyant une requête dont les en-têtes arrivent très lentement ou restent incomplets. Le serveur attend la fin de la requête et conserve la connexion ouverte au lieu de libérer immédiatement ses ressources."},{"name":"HTTP POST DoS","desc":"Une attaque HTTP POST peut annoncer un corps de requête puis l'envoyer très lentement ou de manière incomplète. Le serveur continue d'attendre le reste du message et immobilise des ressources pour cette connexion."},{"name":"Single-Session HTTP Flood","desc":"Cette variante exploite une seule session HTTP/1.1 pour envoyer de nombreuses requêtes. Elle cherche à bombarder la cible tout en réutilisant la même session au lieu d'ouvrir une nouvelle connexion pour chaque requête."},{"name":"Single-Request HTTP Flood","desc":"Le module décrit une variante où plusieurs requêtes HTTP sont dissimulées dans un seul paquet ou une seule requête afin d'augmenter la charge tout en rendant l'activité moins évidente."},{"name":"Recursive HTTP GET Flood","desc":"L'attaquant se comporte comme un utilisateur qui parcourt un site et demande récursivement des pages, images et autres ressources. Chaque page peut provoquer de nombreuses requêtes supplémentaires, ce qui augmente la charge sur le serveur."},{"name":"Random Recursive GET Flood","desc":"Variante du recursive GET adaptée notamment aux forums et blogs : l'attaquant choisit des numéros de pages aléatoires dans une plage valide afin de produire continuellement des requêtes différentes."},{"name":"Slowloris","desc":"Slowloris établit normalement la connexion TCP mais n'achève jamais la requête HTTP. Il envoie des en-têtes partiels afin que le serveur garde un grand nombre de connexions ouvertes. Lorsque les threads ou slots disponibles sont consommés, les clients légitimes ne peuvent plus être servis.","flow":"TCP établi → requête HTTP partielle → attente prolongée → nombreuses connexions ouvertes → épuisement","exam":"Slowloris = headers HTTP incomplets, très peu de bande passante, épuisement des connexions."},{"name":"RUDY — R-U-Dead-Yet","desc":"RUDY applique le principe d'une requête lente au corps HTTP POST. La requête annonce un Content-Length important puis envoie le body très lentement, par petits morceaux, afin de garder la connexion ouverte et de consommer les ressources du serveur.","exam":"RUDY = POST body lent / Content-Length élevé."},{"name":"Apache Killer","desc":"Apache Killer envoie des requêtes contenant des plages d'octets qui se chevauchent. Le serveur tente de construire les réponses correspondant à ces ranges et peut consommer énormément de mémoire jusqu'au déni de service.","exam":"Apache Killer = overlapping byte ranges → mémoire."},{"name":"Slow Read","desc":"Slow Read demande une ressource volumineuse puis lit la réponse extrêmement lentement. Le serveur doit conserver la connexion et continuer à réserver des ressources pour un client qui n'achève presque jamais la réception."},{"name":"DDoS Extortion / RDDoS","desc":"Le Ransom DDoS combine menace et déni de service. L'attaquant exige une rançon et peut lancer une attaque de démonstration pour prouver sa capacité, puis menacer d'une attaque plus importante si l'organisation ne paie pas.","exam":"DDoS Extortion = Ransom DDoS / RDDoS."}]}]},"outil":{"groups":[{"g":"Outils de flood / DDoS","items":[{"name":"LOIC — Low Orbit Ion Cannon","desc":"Outil de génération de trafic de flood disponible sur Linux et Windows. Il est utilisé pour envoyer un volume important de trafic vers une cible et est historiquement associé à des campagnes hacktivistes. Le support ne fournit pas d'options CLI à mémoriser."},{"name":"HOIC — High Orbit Ion Cannon","desc":"Outil de DoS/DDoS cité dans le module CEH. À retenir comme outil de génération de trafic de flood, dans la même famille générale que LOIC."},{"name":"HULK","desc":"Outil DoS/DDoS cité dans le module CEH. Le support le classe parmi les outils d'attaque à reconnaître ; aucune syntaxe détaillée n'est fournie dans les fichiers de ce module."},{"name":"UFONet","desc":"Outil DoS/DDoS cité par le module. À reconnaître comme outil pouvant participer à la génération ou à l'orchestration de trafic de déni de service."},{"name":"Packet Flooder Tool — NetScanTools","desc":"Outil de NetScanTools cité dans le module pour générer du trafic de flood dans un contexte de test réseau. Le fichier ne fournit pas de paramètres de ligne de commande spécifiques."}]},{"g":"Outils de slow HTTP","items":[{"name":"Slowloris — outil","desc":"Le nom Slowloris désigne aussi un outil associé à l'attaque du même nom : maintenir de nombreuses connexions HTTP ouvertes en envoyant des requêtes partielles. L'important pour l'examen est surtout de reconnaître le mécanisme de l'attaque."},{"name":"slowhttptest","desc":"Outil cité dans le Chapter 12 pour simuler plusieurs attaques HTTP lentes. Il peut reproduire Slowloris, RUDY, Apache Killer et Slow Read afin d'évaluer la résistance d'un serveur à l'épuisement de connexions ou de mémoire.","cheat":[{"words":1,"title":"Attaques simulées","rows":[["Slowloris","headers HTTP incomplets"],["RUDY","corps POST envoyé très lentement"],["Apache Killer","ranges d'octets qui se chevauchent"],["Slow Read","lecture très lente d'une grosse réponse"]]}]}]},{"g":"Protection / mitigation DDoS","items":[{"name":"Huawei AntiDDoS1000","desc":"Solution de protection DoS/DDoS citée dans le module."},{"name":"A10 Thunder TPS","desc":"Plateforme de protection DDoS citée dans le module. Les fonctions mises en avant sont le maintien de la disponibilité des services, la protection contre des attaques croissantes, l'évolutivité et la réduction des coûts opérationnels de sécurité."},{"name":"Akamai Security Center","desc":"Service/console Akamai cité comme solution de protection DDoS. Dans la section DoS du Chapter 12, Akamai est aussi donné comme exemple de service de mitigation capable d'absorber et filtrer du trafic en amont."},{"name":"Stormwall PRO","desc":"Solution de protection DDoS citée dans le module."},{"name":"Imperva DDoS Protection","desc":"Service de protection DDoS cité dans le module."},{"name":"Nexusguard","desc":"Solution de protection DDoS citée dans le module."},{"name":"BlockDoS","desc":"Solution de protection DDoS citée dans le module."}]}]},"port":{"groups":[{"g":"Protocoles directement exploités","items":[{"name":"ICMP","desc":"ICMP est utilisé dans l'ICMP flood et dans Smurf. Dans Smurf, une requête Echo est envoyée vers une adresse de broadcast avec l'adresse source de la victime afin que les réponses convergent vers elle.","tr":"ICMP"},{"name":"UDP","desc":"UDP est utilisé par les UDP floods et par plusieurs attaques d'amplification. Son caractère sans connexion/handshake facilite l'usurpation de l'adresse source dans les scénarios d'amplification décrits dans le Chapter 12.","tr":"UDP"},{"name":"TCP","desc":"TCP est au cœur de plusieurs attaques de protocole : SYN flood, SYN-ACK flood, ACK/PUSH ACK flood et TCP SACK Panic. Le SYN flood exploite le maintien d'un état pour les connexions dont le 3-way handshake n'est pas terminé.","tr":"TCP"},{"name":"HTTP / HTTP 1.1","desc":"Les attaques de couche applicative exploitent le comportement normal d'HTTP : GET/POST incomplets, réutilisation d'une session HTTP/1.1 ou requêtes volontairement lentes afin de conserver des ressources serveur.","tr":"TCP"},{"name":"DNS","desc":"DNS est cité comme protocole d'amplification. Une petite requête peut provoquer une réponse plus grande ; avec une adresse source usurpée, cette réponse est envoyée à la victime. Le Chapter 12 insiste sur l'usage d'UDP pour ce scénario.","tr":"UDP"},{"name":"NTP","desc":"NTP est cité dans le module comme protocole utilisé pour des attaques d'amplification volumétriques. Le principe est de faire répondre des systèmes tiers à l'adresse usurpée de la victime."},{"name":"SNMP","desc":"SNMP est cité dans le Chapter 12 parmi les protocoles pouvant servir à l'amplification, selon le même principe de petite requête et de réponse plus importante dirigée vers une victime."},{"name":"memcached","desc":"memcached est cité parmi les services/protocoles utilisables dans des scénarios d'amplification."},{"name":"SSDP","desc":"SSDP est cité parmi les protocoles d'amplification possibles dans la section DoS du Chapter 12."},{"name":"CHARGEN","desc":"Le Character Generator Protocol est cité comme service à désactiver dans le cadre de la défense contre les attaques par réflexion distribuée. Le module recommande de désactiver les services comme echo et chargen lorsqu'ils ne sont pas nécessaires."},{"name":"TCP SACK / MSS","desc":"TCP SACK (Selective Acknowledgement) et MSS interviennent dans TCP SACK Panic. Le cours décrit des paquets SACK avec un MSS malformé ou très faible — 48 octets — pouvant provoquer un dépassement dans les structures SKB d'un système Linux."}]},{"g":"Mesures à reconnaître","items":[{"name":"bps — bits per second","desc":"Mesure associée aux attaques volumétriques : elle représente la quantité de bande passante consommée."},{"name":"pps — packets per second","desc":"Mesure associée aux attaques de protocole : elle représente le nombre de paquets que l'infrastructure doit traiter."},{"name":"rps — requests per second","desc":"Mesure associée aux attaques applicatives : elle représente le nombre de requêtes reçues par l'application."}]}]},"contre":{"groups":[{"g":"Cadre officiel des 6 contre-mesures DDoS","items":[{"name":"1 — Protect Secondary Victims","desc":"Réduire le nombre de machines susceptibles de devenir des bots : maintenir antivirus/anti-Trojan à jour, supprimer les applications et services inutiles, analyser les fichiers externes, appliquer les mises à jour et sensibiliser les utilisateurs."},{"name":"2 — Detect and Neutralize Handlers","desc":"Chercher les communications et patterns entre handlers, clients et agents afin d'identifier les nœuds infectés. Comme il existe généralement moins de handlers que de bots, neutraliser quelques systèmes de contrôle peut désactiver une grande partie du botnet."},{"name":"3 — Prevent Potential Attacks","desc":"Empêcher ou limiter l'attaque avant qu'elle n'atteigne la cible avec des mécanismes comme ingress filtering, egress filtering, TCP intercept et rate limiting."},{"name":"4 — Deflect Attacks","desc":"Détourner l'activité malveillante vers des systèmes conçus pour l'observer, notamment des honeypots. L'objectif est de protéger les systèmes réels tout en recueillant des informations sur les techniques et outils de l'attaquant."},{"name":"5 — Mitigate Attacks","desc":"Réduire l'impact pendant l'attaque à l'aide de load balancing, throttling, suppression de requêtes et autres techniques de gestion de capacité afin de conserver autant de service que possible."},{"name":"6 — Post-Attack Forensics","desc":"Après l'incident, analyser les logs des routeurs, firewalls et IDS pour identifier le ou les types de DDoS observés. Le module mentionne aussi le traçage via les FAI intermédiaires et les forces de l'ordre lorsque c'est applicable."}]},{"g":"Filtrage & anti-spoofing","items":[{"name":"Ingress Filtering","desc":"Filtrer le trafic entrant afin de rejeter les paquets dont l'adresse source n'est pas cohérente avec le réseau d'où ils arrivent. L'objectif est de réduire l'utilisation d'adresses source usurpées."},{"name":"Egress Filtering","desc":"Filtrer le trafic sortant afin d'empêcher des systèmes internes d'émettre des paquets avec des adresses source usurpées ou non autorisées."},{"name":"RFC 3704 Filtering","desc":"Le module présente RFC 3704 comme une technique de filtrage ACL contre le spoofing. Elle peut utiliser une liste de bogons — adresses inutilisées ou réservées — pour rejeter les paquets dont la source ne devrait pas apparaître sur Internet.","exam":"RFC 3704 → bogon list / adresses source usurpées."},{"name":"Cisco IPS Source IP Reputation Filtering","desc":"Le module cite un filtrage basé sur la réputation d'IP : une base de réputation permet d'identifier les sources associées à des botnets, du malware ou d'autres activités malveillantes et de les filtrer."},{"name":"IP Source Guard","desc":"Le module cite IP Source Guard comme mesure de prévention : le trafic est filtré selon les associations présentes dans la base DHCP snooping ou dans des bindings IP configurés, ce qui aide à bloquer des paquets à source usurpée."}]},{"g":"Absorption, capacité & upstream mitigation","items":[{"name":"Rate Limiting / Throttling","desc":"Limiter le débit ou le nombre de requêtes autorisées réduit la quantité de ressources qu'une source peut consommer. Le module le cite comme mécanisme préventif et de mitigation ; le Chapter 12 l'applique aussi aux floods et aux attaques lentes."},{"name":"Load Balancing","desc":"Distribuer la charge entre plusieurs serveurs permet d'éviter qu'une seule instance n'absorbe tout le trafic et augmente la capacité disponible pendant une attaque."},{"name":"ISP Filtering","desc":"Pour une attaque saturant le lien Internet, filtrer uniquement au niveau de la cible peut être trop tard : le lien est déjà rempli. La section DoS du Chapter 12 recommande de contacter le FAI afin de filtrer le trafic en amont avant qu'il n'atteigne l'organisation."},{"name":"DDoS Mitigation / Traffic Scrubbing","desc":"Un service de mitigation reçoit ou détourne le trafic, identifie le trafic malveillant, le supprime puis laisse passer le trafic légitime. Le Chapter 12 cite Akamai et Cloudflare comme exemples de services de mitigation/load balancing."},{"name":"Cloud Scale","desc":"Les fournisseurs cloud sont cités comme moyen d'absorber une partie du trafic DDoS grâce à leur capacité et à leur architecture distribuée. Le Chapter 12 cite AWS, Azure et Google Cloud comme exemples."},{"name":"Black Hole Filtering","desc":"Un black hole est un point de routage où le trafic est silencieusement supprimé. Cette technique peut protéger le reste du réseau en sacrifiant temporairement le trafic destiné à une cible pendant une attaque.","exam":"Black hole = trafic supprimé silencieusement au niveau routage."},{"name":"Distributed / Multi-cloud Architecture","desc":"Le module recommande d'éviter les points uniques de défaillance, d'utiliser des modèles de serveurs distribués, des capacités de secours et éventuellement un déploiement multi-cloud pour les applications critiques."}]},{"g":"Protection des attaques TCP / slow HTTP","items":[{"name":"SYN Cookies","desc":"Contre un SYN flood, les SYN cookies permettent de ne pas conserver immédiatement un état complet pour chaque connexion incomplète. Le Chapter 12 les cite comme contre-mesure des SYN floods legacy.","exam":"SYN flood → SYN cookies."},{"name":"Connection Timeouts","desc":"Des délais d'expiration plus stricts permettent de fermer plus rapidement les connexions qui restent incomplètes ou inactives. C'est particulièrement utile contre les attaques HTTP lentes qui essaient de conserver des connexions ouvertes très longtemps."},{"name":"TCP Intercept","desc":"Le module cite TCP intercept parmi les mesures permettant de prévenir des attaques potentielles, en particulier lorsque de nombreuses connexions TCP incomplètes sont créées."},{"name":"Capacity / Connection Management","desc":"Les attaques Slowloris, RUDY et Slow Read cherchent à monopoliser les threads ou connexions. Les mesures de mitigation visent donc à contrôler la durée, le nombre et la consommation de ressources des connexions plutôt qu'à se concentrer seulement sur le volume de bande passante."}]},{"g":"Honeypots & diversion","items":[{"name":"Honeypot","desc":"Un honeypot est un système volontairement exposé avec un niveau de sécurité contrôlé afin d'attirer l'attaquant. Dans le cadre DDoS du module, il sert à détourner l'activité et à collecter des informations sur les techniques et outils utilisés."},{"name":"Low-Interaction Honeypot","desc":"Un honeypot low-interaction émule seulement certaines fonctions ou services. Il offre moins de surface et moins d'informations qu'un environnement réel, mais il est plus simple à contrôler."},{"name":"High-Interaction Honeypot","desc":"Un honeypot high-interaction offre un environnement beaucoup plus réaliste et permet d'observer davantage de comportements. Il expose donc aussi davantage de ressources réelles à surveiller."},{"name":"Honeynet","desc":"Une honeynet est un réseau de honeypots à forte interaction simulant une infrastructure complète avec de vraies machines et applications. Elle sert à capturer et étudier les attaques de manière plus réaliste."}]},{"g":"Hygiène, détection & résilience","items":[{"name":"Anti-malware & Patch Management","desc":"Les machines secondaires doivent être protégées afin de ne pas devenir des agents DDoS. Le module recommande antivirus/anti-Trojan, mises à jour régulières et suppression des services ou applications inutiles."},{"name":"Network Traffic Analysis","desc":"Analyser les volumes, protocoles et patterns de communication permet de repérer les relations entre handlers et agents, les anomalies de trafic et les changements brusques associés à un DDoS."},{"name":"AI/ML & Anomaly Detection","desc":"Le module recommande les systèmes d'anomaly detection et les approches AI/ML pour repérer des écarts de trafic pouvant indiquer un DDoS, surtout lorsque l'attaque ne correspond pas à une signature fixe."},{"name":"Limiter le broadcast","desc":"Limiter les capacités de broadcast réduit les possibilités d'exploiter un réseau comme amplificateur dans des attaques de type Smurf ou apparentées."},{"name":"Désactiver Echo / CHARGEN inutiles","desc":"Le module recommande de désactiver les services echo et chargen lorsqu'ils ne sont pas nécessaires afin de réduire les possibilités de réflexion ou d'amplification."},{"name":"Simulations DoS/DDoS","desc":"Réaliser des simulations contrôlées permet de vérifier la capacité de l'infrastructure, les mécanismes de détection, les limites de rate limiting et les procédures de réaction avant un incident réel."},{"name":"Threat Intelligence & partage d'information","desc":"Le module recommande d'utiliser des flux de threat intelligence et de partager des informations avec les pairs du secteur afin d'identifier plus rapidement les sources, botnets ou techniques DDoS observés."}]}]}}},{"n":11,"t":"Détournement de session","data":{"concept":{"groups":[{"g":"Fondamentaux du Session Hijacking","items":[{"name":"Session Hijacking","desc":"Prise de contrôle d’une session de communication déjà valide entre deux systèmes. L’attaquant profite du fait que l’authentification a souvent lieu au début de la session : s’il récupère ou reproduit les éléments qui identifient cette session, il peut agir comme l’utilisateur légitime sans refaire l’authentification.","exam":"Réflexe CEH : hijacking = détourner une session déjà établie."},{"name":"Pourquoi le hijacking fonctionne","desc":"Trois faiblesses facilitent particulièrement le détournement : absence de verrouillage après des essais de Session ID invalides, génération faible ou prévisible des identifiants de session, et mauvaise protection des Session IDs côté client ou serveur.","cheat":{"words":1,"title":"Faiblesses à reconnaître","rows":[["Pas de lockout","permet de tester de nombreux Session IDs"],["SID prévisible","réduit l’espace de recherche"],["SID mal protégé","peut être récupéré via XSS, DNS poisoning ou bugs navigateur"]]}},{"name":"Processus en 3 phases","desc":"Le détournement d’une session TCP suit trois étapes : suivre la connexion pour connaître les numéros SEQ/ACK, désynchroniser les deux extrémités afin qu’elles n’aient plus le même état de session, puis injecter les paquets ou commandes de l’attaquant dans la communication.","cheat":{"words":1,"title":"Ordre à mémoriser","rows":[["1","Tracking the Connection"],["2","Desynchronizing the Connection"],["3","Injecting the Attacker's Packet"]]},"exam":"Ordre CEH : Tracking → Desynchronization → Injection."},{"name":"Tracking the Connection","desc":"L’attaquant observe une session active afin d’identifier les hôtes, le flux TCP et surtout les numéros de séquence et d’acquittement. Un sniffer réseau ou un outil de reconnaissance peut être utilisé pour suivre la victime et repérer une séquence suffisamment prévisible."},{"name":"Desynchronizing the Connection","desc":"Une connexion est désynchronisée lorsque les deux extrémités ne s’accordent plus sur les numéros SEQ/ACK attendus. L’attaquant peut faire avancer l’état d’un côté avec des données nulles, provoquer une rupture avec RST, ou manipuler la synchronisation avant de prendre la place d’un des participants."},{"name":"Injection de paquets","desc":"Après avoir perturbé l’état de la session, l’attaquant envoie des paquets qui semblent appartenir à la connexion légitime. S’ils utilisent les bonnes adresses et les bons numéros de séquence/acquittement, le serveur peut les accepter comme provenant du client authentifié."},{"name":"Active Hijacking","desc":"L’attaquant prend effectivement la place d’un participant dans une session existante. Il ne se contente plus d’observer : il peut injecter, modifier ou interrompre les échanges de la session détournée.","exam":"Active = takeover."},{"name":"Passive Hijacking","desc":"L’attaquant surveille une session en cours sans en prendre le contrôle. L’objectif est surtout d’observer les échanges et de récupérer des informations utiles, contrairement à l’active hijack qui modifie ou remplace un participant.","exam":"Passive = monitoring only."},{"name":"Prérequis d’un hijack TCP non chiffré","desc":"L’attaquant doit pouvoir observer ou atteindre le trafic de session, reconnaître/prédire les numéros de séquence TCP et usurper l’adresse MAC ou IP d’un hôte afin de recevoir ou d’injecter du trafic qui ne lui est normalement pas destiné. Sur un LAN, l’ARP poisoning peut aider à placer l’attaquant sur le chemin."},{"name":"Spoofing vs Session Hijacking","desc":"Le spoofing consiste à se faire passer pour quelqu’un dès le départ en utilisant une identité, une adresse ou des identifiants usurpés. Le session hijacking vise une connexion déjà établie : l’attaquant récupère l’état de la session, perturbe la victime puis injecte son propre trafic.","exam":"Spoofing = usurpation ; hijacking = prise d’une session existante."},{"name":"Network-Level vs Application-Level","desc":"Le network-level hijacking agit sur les paquets et les mécanismes TCP/UDP. L’application-level hijacking vise la session applicative, typiquement une session HTTP identifiée par un Session ID ou un cookie. Les deux niveaux peuvent se combiner : l’interception réseau peut permettre de récupérer un token applicatif.","cheat":{"words":1,"title":"Deux niveaux","rows":[["Network-level","interception/manipulation TCP ou UDP"],["Application-level","contrôle de la session HTTP via Session ID/token"]]}}]},{"g":"Application-Level Session Hijacking","items":[{"name":"Session Token / Session ID","desc":"Identifiant utilisé par une application pour rattacher plusieurs requêtes au même utilisateur authentifié. Si un attaquant récupère, prédit, réutilise ou impose ce token, il peut hériter de la session sans connaître le mot de passe de la victime."},{"name":"12 moyens de compromettre un token","desc":"Le cours regroupe douze voies principales : session sniffing, predictable session token, MITM, man-in-the-browser, XSS, CSRF, session replay, session fixation, CRIME, Forbidden attack, session donation et PetitPotam hijacking.","cheat":{"words":1,"title":"Liste CEH","rows":[["1–4","Sniffing · Predictable token · MITM · Man-in-the-browser"],["5–8","XSS · CSRF · Replay · Fixation"],["9–12","CRIME · Forbidden · Donation · PetitPotam"]]},"exam":"Savoir reconnaître les 12 vecteurs cités."},{"name":"Predictable Session Token","desc":"Si les Session IDs sont courts ou générés avec un algorithme prévisible, l’attaquant peut tester différentes valeurs jusqu’à trouver une session valide. Il n’a alors plus besoin d’authentifier son propre compte : le serveur associe le token trouvé à l’utilisateur déjà connecté."},{"name":"Session Prediction Attack","desc":"Forme de brute-force des Session IDs dans laquelle l’espace de valeurs possibles est suffisamment petit ou prévisible pour que l’attaquant puisse fortement réduire les essais nécessaires.","exam":"Session prediction = brute-force de SID quand la plage prédite est petite."},{"name":"MITM / Manipulator-in-the-Middle","desc":"L’attaquant s’insère dans une connexion existante et la transforme en deux connexions distinctes : client ↔ attaquant et attaquant ↔ serveur. Il peut alors lire, modifier ou injecter des données tout en laissant les deux extrémités croire qu’elles communiquent directement."},{"name":"Man-in-the-Browser","desc":"Un composant malveillant dans le navigateur intercepte les données de formulaire via le DOM, peut modifier les valeurs envoyées au serveur puis afficher à l’utilisateur les valeurs originales. Le serveur voit une requête valide provenant du vrai navigateur, ce qui rend la manipulation difficile à distinguer d’une transaction légitime."},{"name":"XSS et vol de session","desc":"Du JavaScript injecté dans une page peut récupérer un Session ID ou un token présent côté navigateur et l’envoyer à l’attaquant. Le token volé peut ensuite être réutilisé pour reprendre la session de la victime.","exam":"XSS peut être un moyen de voler un Session ID."},{"name":"Malicious JavaScript","desc":"Un script malveillant exécuté dans le navigateur peut capturer silencieusement des tokens de session et les transmettre à l’attaquant. Le point clé est que le vol se produit côté client, au sein de la session web de la victime."},{"name":"Trojan et proxy navigateur","desc":"Un Trojan peut modifier les paramètres proxy du navigateur afin de faire transiter les sessions de l’utilisateur par une machine contrôlée par l’attaquant. Celui-ci devient alors intermédiaire pour observer ou manipuler les échanges."},{"name":"Session Replay Attack","desc":"L’attaquant capture un jeton d’authentification transmis pendant une session puis le rejoue ultérieurement. Si le serveur accepte le même token sans vérifier sa fraîcheur ou son contexte, l’attaquant obtient l’accès avec les informations authentifiées de la victime.","cheat":{"words":1,"title":"Flux","rows":[["1","Victime s’authentifie"],["2","Attaquant capture le token"],["3","Attaquant rejoue le token"],["4","Serveur accepte la session"]]}},{"name":"Session Fixation","desc":"L’attaquant choisit ou obtient un Session ID avant l’authentification puis pousse la victime à utiliser ce même SID, par exemple via un lien. Si l’application conserve le SID après le login, l’attaquant connaît déjà l’identifiant de la session devenue authentifiée.","exam":"Fixation = le SID est connu avant le login et reste le même après authentification."},{"name":"CRIME Attack","desc":"Compression Ratio Info-Leak Made Easy exploite la compression de données dans des protocoles comme SSL/TLS, SPDY ou HTTPS. L’attaquant envoie des requêtes contrôlées et observe les variations de taille après compression afin de reconstruire progressivement une valeur secrète comme un cookie de session.","cheat":{"words":1,"title":"Idée clé","rows":[["Compression","DEFLATE compresse cookie + données contrôlées"],["Observation","la taille change selon les caractères correctement devinés"],["Résultat","reconstruction du cookie caractère par caractère"]]},"exam":"CRIME = fuite par ratio de compression permettant de retrouver un cookie."},{"name":"Forbidden Attack","desc":"Attaque MITM qui exploite la réutilisation incorrecte d’un nonce pendant un échange TLS utilisant AES-GCM. La réutilisation du nonce affaiblit les garanties cryptographiques et peut permettre à l’attaquant d’intercepter la session et d’y injecter du contenu.","exam":"Forbidden = nonce réutilisé avec AES-GCM."},{"name":"Session Donation","desc":"L’attaquant ne vole pas la session de la victime : il lui fournit son propre Session ID. La victime utilise alors sans le savoir une session appartenant à l’attaquant et y enregistre des informations, que l’attaquant retrouve ensuite en se reconnectant avec le même SID.","exam":"Donation = l’attaquant donne son SID à la victime."},{"name":"PetitPotam Hijacking","desc":"Technique dans laquelle un serveur ou contrôleur de domaine est forcé à initier une authentification NTLM vers un serveur contrôlé par l’attaquant via MS-EFSRPC. L’authentification peut ensuite être relayée vers AD CS pour obtenir un certificat et des privilèges élevés.","cheat":{"words":1,"title":"Chaîne simplifiée","rows":[["MS-EFSRPC","coerce la cible à s’authentifier"],["NTLM relay","rejoue l’authentification vers AD CS"],["Certificat","permet d’acquérir des privilèges élevés"]]}}]},{"g":"Network-Level Session Hijacking","items":[{"name":"TCP Three-Way Handshake","desc":"Une session TCP commence par SYN, puis SYN+ACK avec un Initial Sequence Number, puis ACK. Le suivi des numéros de séquence et d’acquittement permet à chaque extrémité de savoir quelles données ont été reçues et lesquelles sont attendues ensuite."},{"name":"ISN, SEQ, ACK et NSN","desc":"ISN est l’Initial Sequence Number choisi au démarrage de la connexion. SEQ identifie la position des données envoyées, ACK indique la prochaine séquence attendue, et NSN désigne le Next Sequence Number. Un hijack TCP dépend de la capacité à connaître ou prédire ces valeurs."},{"name":"ACK Storm","desc":"Une mauvaise désynchronisation peut amener les deux extrémités à s’envoyer continuellement des acquittements parce que chacune considère l’autre comme hors séquence. Le cours signale notamment que l’usage de FIN pendant certaines tentatives de désynchronisation peut révéler l’attaque par ce phénomène."},{"name":"Blind Hijacking","desc":"L’attaquant ne voit pas les réponses de la session et doit donc deviner correctement les numéros de séquence. Les adresses IP et ports sont relativement faciles à connaître ; la difficulté réside dans la prédiction du SEQ attendu par le serveur.","exam":"Blind hijacking = deviner la séquence sans observer les réponses."},{"name":"UDP Hijacking","desc":"UDP est connectionless et ne possède ni handshake ni séquençage comparable à TCP. L’attaquant peut forger une réponse UDP qui semble provenir du serveur et tenter de la faire parvenir au client avant la réponse légitime.","exam":"UDP hijacking est facilité par l’absence de synchronisation et de séquence TCP."},{"name":"TCP/IP Hijacking","desc":"Après avoir usurpé une adresse IP, l’attaquant injecte des paquets avec des numéros SEQ/ACK adaptés à la connexion. S’ils arrivent avant les paquets légitimes, ils peuvent faire avancer l’état de la session et désynchroniser le client réel."},{"name":"RST Hijacking","desc":"L’attaquant forge un paquet TCP RST avec l’adresse source attendue et un numéro d’acquittement crédible. Si le paquet est accepté comme appartenant à la session, la connexion est immédiatement réinitialisée.","exam":"RST hijacking = RST spoofé + ACK/sequence crédible."},{"name":"MITM avec Packet Sniffer","desc":"Un sniffer placé sur le chemin réseau permet à l’attaquant d’observer les paquets échangés entre client et serveur. Cette position fournit les informations de session nécessaires pour intercepter, analyser ou préparer une prise de contrôle."},{"name":"IP Spoofing + Source Routing","desc":"L’attaquant usurpe l’adresse d’un hôte considéré comme fiable et utilise le source routing afin d’imposer un chemin aux paquets. Il injecte ensuite des paquets avant que l’hôte réel ne réponde, de sorte que le serveur traite les données forgées comme appartenant à la session du trusted host."},{"name":"Source-Routed Packets","desc":"Avec le source routing, l’émetteur spécifie lui-même le chemin que doit suivre un paquet au lieu de laisser uniquement les routeurs choisir la route. Dans le contexte du hijacking, ce mécanisme peut être combiné à l’IP spoofing pour faire transiter du trafic par un hôte de confiance."}]},{"g":"Détection & impacts","items":[{"name":"Session Hijacking et MITM","desc":"Un détournement de session peut évoluer vers une position MITM : l’attaquant devient intermédiaire entre le client et le serveur. Il peut alors observer les échanges, modifier les données et injecter de nouveaux messages tout en maintenant la communication apparente."},{"name":"Session Hijacking et DoS","desc":"Le détournement peut aussi provoquer une indisponibilité. Une désynchronisation volontaire, un RST forgé ou la prise de contrôle de la session peut couper la connexion légitime de la victime et empêcher la poursuite normale des échanges."},{"name":"Difficulté de détection","desc":"Le session hijacking est difficile à détecter car une grande partie du trafic continue à ressembler à une session valide. Les utilisateurs peuvent ne rien remarquer tant que la performance ne chute pas ou qu’une action visible n’est pas réalisée avec leur session."},{"name":"Symptômes réseau","desc":"Deux signes cités sont une brusque augmentation de l’activité réseau entraînant une baisse de performance, et des serveurs anormalement occupés parce qu’ils reçoivent simultanément des requêtes du vrai client et du hijacker."}]}]},"outil":{"groups":[{"g":"Tracking, capture & analyse","items":[{"name":"Nmap","desc":"Peut être utilisé pendant la phase de tracking pour identifier les systèmes et suivre les éléments réseau utiles avant le détournement d’une session."},{"name":"Wireshark","desc":"Analyseur de paquets utilisé pour observer les communications, examiner les flux TCP et rechercher des signes de hijacking. Il fait aussi partie des outils de détection cités pour l’investigation de sessions suspectes."},{"name":"tcpdump","desc":"Outil de capture et d’analyse TCP/IP utilisé dans le cours pour examiner le trafic réseau, notamment lors de l’étude d’un RST hijacking ou d’une session dont les numéros de séquence doivent être observés."},{"name":"Colasoft Packet Builder","desc":"Outil de packet crafting cité pour construire des paquets réseau personnalisés, notamment des paquets TCP dont les champs doivent correspondre à une session existante."}]},{"g":"Hijacking, MITM & proxy","items":[{"name":"bettercap","desc":"Outil cité parmi les solutions de session hijacking. Il peut servir dans un contexte de manipulation ou d’interception de trafic lorsqu’un attaquant se positionne sur le chemin réseau."},{"name":"Burp Suite","desc":"Proxy d’interception cité comme outil de session hijacking au niveau applicatif. Il permet d’observer et manipuler des échanges HTTP/HTTPS et donc d’étudier les mécanismes de session web et les tokens associés."},{"name":"OWASP ZAP","desc":"Proxy d’interception pour analyser le trafic web et les mécanismes de session côté application. Le cours le cite parmi les outils utiles pour les scénarios de détournement de session."},{"name":"WebSploit Framework","desc":"Framework cité dans la liste des outils de session hijacking pour des scénarios d’interception et d’attaque de sessions réseau ou web."},{"name":"sslstrip","desc":"Outil cité parmi les outils de hijacking pour les scénarios MITM impliquant du trafic web chiffré et des tentatives de dégradation de la protection de la session."},{"name":"JHijack","desc":"Outil cité spécifiquement dans la liste CEH des outils de session hijacking."}]},{"g":"Détection & monitoring","items":[{"name":"Quantum Intrusion Prevention System","desc":"IPS cité comme outil de détection des activités de session hijacking et des comportements réseau associés."},{"name":"SolarWinds Security Event Manager","desc":"Plateforme de centralisation et d’analyse d’événements citée pour détecter des anomalies et indices pouvant accompagner un détournement de session."},{"name":"IBM Security Network IPS","desc":"Système de prévention d’intrusion réseau cité pour identifier et bloquer des activités anormales liées au hijacking."},{"name":"LogRhythm","desc":"Plateforme de surveillance et corrélation de sécurité citée parmi les outils de détection du session hijacking."},{"name":"ARPwatch","desc":"Outil de surveillance des changements d’associations IP/MAC. Il est recommandé pour repérer l’ARP cache poisoning pouvant placer un attaquant sur le chemin de la session."}]}]},"port":{"groups":[{"g":"Protocoles de session & transport","items":[{"name":"TCP","desc":"Protocole orienté connexion dont les sessions reposent sur SYN/SYN-ACK/ACK et sur les numéros SEQ/ACK. Le détournement réseau TCP consiste à prédire ou observer ces valeurs puis injecter des paquets cohérents avec la session.","tr":"tcp"},{"name":"UDP","desc":"Protocole connectionless sans handshake ni mécanisme de séquençage équivalent à TCP. Une réponse forgée peut être envoyée au client avant la réponse légitime, ce qui rend certains scénarios de hijacking plus simples.","tr":"udp"},{"name":"HTTP","desc":"Les sessions web sont souvent maintenues par des Session IDs ou cookies. Leur compromission permet un application-level session hijacking même sans détourner directement la session TCP.","tr":"tcp"},{"name":"HTTPS — 443","desc":"HTTP protégé par TLS. Les cookies d’authentification doivent être transportés sur HTTPS. Le cours associe également le port 443 à DNS over HTTPS, qui chiffre les requêtes DNS.","exam":"443 = HTTPS et transport DoH dans le cours.","tr":"tcp"},{"name":"DNS — 53","desc":"DNS classique utilise le port 53. Le cours oppose ce fonctionnement à DoH sur 443, utilisé pour empêcher l’observation directe des requêtes DNS pendant la résolution.","tr":"both"},{"name":"SSH / OpenSSH — 22","desc":"Canal sécurisé recommandé pour réduire les risques liés aux communications non chiffrées et au détournement de sessions réseau.","tr":"tcp"},{"name":"SFTP","desc":"Protocole de transfert chiffré recommandé comme alternative sécurisée lorsque des données sensibles doivent être transportées pendant une session."},{"name":"FTPS","desc":"FTP protégé par TLS et certificats numériques, recommandé parmi les moyens de sécuriser les échanges de fichiers contre l’interception."},{"name":"AS2 Managed File Transfer","desc":"Mécanisme de transfert géré cité comme solution pour protéger les échanges de fichiers grâce au chiffrement et aux certificats numériques."}]},{"g":"TLS, compression & mécanismes exploités","items":[{"name":"TLS / SSL","desc":"TLS protège les sessions web par chiffrement. Le cours associe CRIME à la compression utilisée avec SSL/TLS et Forbidden à une mauvaise utilisation du nonce lors d’un chiffrement AES-GCM."},{"name":"DEFLATE","desc":"Algorithme de compression lossless cité dans le scénario CRIME. Les variations de taille de la sortie compressée peuvent révéler progressivement des informations sur un cookie secret."},{"name":"AES-GCM","desc":"Mode de chiffrement authentifié utilisé avec TLS. Dans le Forbidden attack, le problème vient de la réutilisation incorrecte du même nonce avec AES-GCM."},{"name":"NTLM","desc":"Mécanisme d’authentification impliqué dans PetitPotam : la cible est forcée à s’authentifier vers le serveur de l’attaquant, puis l’authentification NTLM est relayée vers AD CS."},{"name":"MS-EFSRPC","desc":"Microsoft Encrypting File System Remote Protocol utilisé dans le scénario PetitPotam pour forcer un serveur ou contrôleur de domaine à initier une authentification NTLM vers une machine contrôlée par l’attaquant."}]},{"g":"IPsec","items":[{"name":"IPsec","desc":"Suite de protocoles IETF qui sécurise les communications IP en authentifiant et/ou chiffrant les paquets. Elle fournit peer authentication, data-origin authentication, intégrité, confidentialité et protection contre le replay."},{"name":"AH — Authentication Header","desc":"Service IPsec fournissant l’authentification de l’émetteur et l’intégrité, sans assurer la confidentialité des données par chiffrement.","exam":"AH = authentication only."},{"name":"ESP — Encapsulating Security Payload","desc":"Service IPsec fournissant à la fois authentification et chiffrement, donc confidentialité du trafic en plus de la protection de l’origine.","exam":"ESP = authentication + encryption."},{"name":"IPsec Transport Mode","desc":"Mode dans lequel l’en-tête IP externe reste visible et seul le payload de couche transport est encapsulé/protégé par IPsec. Le cours l’associe à un usage host-to-host.","exam":"Transport = protège le payload, pas l’intégralité du paquet IP."},{"name":"IPsec Tunnel Mode","desc":"Mode qui encapsule l’intégralité du paquet IP original dans un nouveau paquet doté d’un outer IP header. Il est typiquement utilisé entre deux gateways.","exam":"Tunnel = protège tout le paquet IP original."},{"name":"DNS over HTTPS (DoH) — 443","desc":"Résolution DNS transportée dans HTTPS pour empêcher l’observation directe des requêtes DNS. Le cours le présente comme une mesure contre le snooping/MITM des requêtes et l’oppose au DNS classique sur le port 53.","tr":"tcp"},{"name":"Kerberos","desc":"Mécanisme d’authentification fort recommandé dans les contre-mesures afin de réduire les possibilités d’usurpation et de détournement associées à des méthodes d’authentification plus faibles."}]}]},"contre":{"groups":[{"g":"Gestion sûre des sessions","items":[{"name":"Régénérer le Session ID après login","desc":"Une nouvelle valeur doit être générée après une authentification réussie. Cela empêche qu’un SID connu avant le login reste associé à la session authentifiée, ce qui réduit directement le risque de session fixation."},{"name":"N’accepter que les Session IDs serveur","desc":"Le serveur doit être l’autorité qui crée et valide les Session IDs. Accepter des identifiants de session imposés par le client augmente le risque de fixation ou de manipulation de session."},{"name":"Session IDs longs et aléatoires","desc":"Les identifiants de session doivent avoir suffisamment d’entropie pour empêcher le brute-force et la prédiction. Des valeurs longues et aléatoires réduisent fortement la probabilité qu’un attaquant devine un SID actif."},{"name":"Timeout des sessions","desc":"Les sessions expirées ou inactives doivent être détruites automatiquement. Une durée de vie limitée réduit la fenêtre pendant laquelle un Session ID volé peut être réutilisé."},{"name":"Fonction de logout","desc":"L’utilisateur doit pouvoir mettre fin explicitement à sa session. Le logout doit invalider côté serveur le token associé afin qu’il ne puisse plus être rejoué."},{"name":"Ne pas placer le SID dans l’URL","desc":"Éviter les Session IDs dans les URLs ou query strings, car ils peuvent fuiter dans l’historique, les logs, les referers ou être plus facilement copiés et partagés."},{"name":"Cookies d’authentification via HTTPS","desc":"Les cookies servant à maintenir une session authentifiée doivent circuler sur une connexion HTTPS afin de réduire leur interception sur le réseau."}]},{"g":"Chiffrement & authentification","items":[{"name":"Chiffrer les données en transit","desc":"Le chiffrement empêche un simple sniffer d’extraire directement les informations de session ou les tokens échangés entre les participants. Il fait partie de la defense-in-depth contre le hijacking."},{"name":"Utiliser SSH / OpenSSH","desc":"Pour les communications distantes, un canal SSH fournit chiffrement et authentification afin d’éviter que les données de session soient exposées en clair."},{"name":"Authentification forte avec Kerberos","desc":"Le cours recommande des mécanismes d’authentification robustes tels que Kerberos afin de limiter les risques de prise de session fondés sur des mécanismes plus faibles."},{"name":"Peer-to-Peer VPN","desc":"Un VPN entre les participants protège le trafic réseau par un tunnel sécurisé, réduisant l’interception et l’injection de paquets entre les extrémités."},{"name":"IPsec","desc":"IPsec ajoute authentification, intégrité, confidentialité et protection contre le replay au niveau IP. AH apporte l’authentification, tandis qu’ESP ajoute également le chiffrement."},{"name":"SFTP / FTPS / AS2","desc":"Pour les transferts de fichiers, utiliser des solutions chiffrées et authentifiées avec certificats plutôt que des échanges non protégés réduit l’exposition des données de session et du contenu."}]},{"g":"Protection réseau & anti-spoofing","items":[{"name":"Passer d’un hub à un switch","desc":"Un switch limite normalement les trames au port associé à la destination, ce qui réduit l’exposition passive du trafic par rapport à un hub qui diffuse les trames à tous les ports."},{"name":"Règles anti-spoofing sur les gateways","desc":"Configurer des règles internes et externes de filtrage contre les adresses usurpées réduit les attaques dans lesquelles l’attaquant se fait passer pour un hôte de confiance ou tente d’injecter du trafic dans une session."},{"name":"Surveiller l’ARP poisoning","desc":"IDS et ARPwatch peuvent surveiller les modifications anormales d’associations IP/MAC. Détecter rapidement un empoisonnement ARP empêche l’attaquant de conserver une position MITM sur le LAN."},{"name":"Réduire l’accès distant","desc":"Limiter les accès distants aux seuls besoins légitimes réduit le nombre de sessions exposées à des interceptions et prises de contrôle à distance."},{"name":"Maintenir les protections client/serveur","desc":"Les logiciels de protection côté client et côté serveur doivent être actifs et à jour afin de bloquer les malwares, scripts et manipulations pouvant voler ou altérer des sessions."}]},{"g":"Détection & surveillance","items":[{"name":"Surveiller les pics d’activité","desc":"Une augmentation inhabituelle du trafic et une baisse de performance peuvent indiquer qu’un client légitime et un hijacker envoient simultanément des données dans la même session."},{"name":"Surveiller les serveurs anormalement occupés","desc":"Des requêtes concurrentes provenant du vrai client et de l’attaquant peuvent charger anormalement un serveur. Ce symptôme doit être corrélé avec les données réseau et les événements de sécurité."},{"name":"IDS / IPS","desc":"Les systèmes de détection et de prévention peuvent rechercher des anomalies de session, des patterns d’injection, du spoofing ou des changements ARP compatibles avec une tentative de hijacking."},{"name":"Wireshark pour investigation","desc":"L’analyse détaillée des flux TCP permet d’examiner les numéros SEQ/ACK, RST inattendus, duplications ou comportements de désynchronisation afin de comprendre une session suspecte."},{"name":"Corrélation des événements","desc":"Des solutions comme SolarWinds SEM ou LogRhythm peuvent agréger les événements de plusieurs sources afin de repérer des comportements qui seraient difficiles à distinguer sur un seul équipement."}]},{"g":"Protection MITM & DNS","items":[{"name":"DNS over HTTPS (DoH)","desc":"DoH transporte les requêtes DNS sur HTTPS, port 443, afin de réduire le snooping des résolutions DNS et certaines manipulations de DNS effectuées sur le chemin réseau."},{"name":"Vérification de l’authenticité des sites","desc":"Le cours recommande l’usage de mécanismes de vérification de l’authenticité des sites, notamment via des network notary servers, afin de réduire les risques d’interception et de faux endpoints."},{"name":"Defense-in-Depth","desc":"Aucune mesure unique ne suffit contre tous les modes de hijacking. Combiner gestion robuste des sessions, chiffrement, authentification, anti-spoofing et monitoring réduit la probabilité qu’une faiblesse isolée suffise à compromettre la session."},{"name":"Sensibilisation des utilisateurs","desc":"Former les employés aide à réduire les attaques côté client, les liens malveillants et les situations dans lesquelles un token de session est compromis par un script, un Trojan ou une manipulation du navigateur."}]}]}}},{"n":12,"t":"Évasion IDS, pare-feu et honeypots","data":{"concept":{"groups":[{"g":"IDS, IPS & détection","items":[{"name":"IDS — Intrusion Detection System","desc":"Système matériel ou logiciel qui observe le trafic ou les événements, recherche des comportements correspondant à des intrusions et génère une alerte. Il analyse les paquets après capture et reste principalement passif : sa fonction centrale est de détecter et signaler, pas de bloquer directement le flux.","exam":"IDS = passif, détection/alerte."},{"name":"IPS — Intrusion Prevention System","desc":"Système placé inline entre la source et la destination. Il analyse le trafic en temps réel et peut bloquer ou filtrer ce qui est jugé malveillant, tout en générant des alertes et des logs.","exam":"IPS =
