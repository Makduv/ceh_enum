<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte CEH v13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EAEE; --paper-deep:#D8DEE4;
  --ink:#1C2733; --ink-soft:#54646F; --ink-faint:#8A99A4; --rule:#BCC6CF; --panel:#F3F5F7;
  --c-concept:#3F6493; --c-outil:#9A6B2F; --c-port:#2F7263; --c-contre:#6E5182;
  --focus:#B4443A; --tcp:#2F7263; --udp:#9A6B2F; --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr) 0;grid-template-rows:auto minmax(0,1fr);height:100vh;transition:grid-template-columns .22s ease}
.shell.panel-open{grid-template-columns:236px minmax(0,1fr) 480px}

.bar{grid-column:1/-1;display:flex;align-items:baseline;gap:22px;padding:14px 22px;border-bottom:1px solid var(--rule);background:var(--paper)}
.mark{font-weight:600;letter-spacing:-.01em}
.mark span{color:var(--ink-faint);font-weight:400;margin-left:8px;font-size:13.5px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:2px}
.search input{border:0;background:none;outline:none;font:inherit;color:var(--ink);width:210px;padding:2px 0}
.search input::placeholder{color:var(--ink-faint)}
.search:focus-within{border-bottom-color:var(--ink)}
.hits{font-size:12.5px;color:var(--ink-faint);min-width:54px}

.rail{border-right:1px solid var(--rule);overflow-y:auto;padding:10px 0 40px}
.rail h2{font-size:12.5px;font-weight:500;color:var(--ink-faint);margin:6px 0 8px;padding:0 18px}
.mod{display:grid;grid-template-columns:26px 1fr;gap:4px;align-items:baseline;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink-soft);padding:6px 18px;cursor:pointer;border-left:2px solid transparent}
.mod:hover{color:var(--ink);background:var(--paper-deep)}
.mod .num{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint)}
.mod[aria-current="true"]{color:var(--ink);font-weight:500;border-left-color:var(--focus);background:var(--paper-deep)}
.mod.empty .label{color:var(--ink-faint)}
.mod:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.canvas{position:relative;overflow:auto;background:var(--paper)}
.canvas svg{display:block;width:100%;height:auto;min-height:100%;min-width:820px}
.legend{position:absolute;left:20px;bottom:18px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft)}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.hint{position:absolute;right:20px;bottom:18px;font-size:12.5px;color:var(--ink-faint);max-width:250px;text-align:right}
.back{position:absolute;left:20px;top:16px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-soft);font:inherit;font-size:13px;padding:4px 11px;border-radius:var(--r);cursor:pointer;display:none}
.back.on{display:block}
.back:hover{border-color:var(--ink-soft);color:var(--ink)}

.edge{fill:none;stroke:var(--rule);stroke-width:1.25}
.edge.on{stroke:var(--ink-soft)}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .frame{stroke:var(--focus);stroke-width:2}
.core rect{fill:var(--ink);rx:8;ry:8}
.core text{fill:var(--paper);font-size:14px;font-weight:600}
.core .sub{fill:#B7C1C9;font-size:12px;font-weight:400}
.level-title{font-size:12px;fill:var(--ink-faint);font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}
.card-sub{font-size:11px!important;font-weight:400!important;opacity:.78}
.grid-note{font-size:12px;fill:var(--ink-faint)}
.cat rect{rx:8;ry:8}
.cat text{font-size:12.5px;font-weight:500;fill:#fff}
.cat .count{fill:rgba(255,255,255,.7);font-family:"IBM Plex Mono",monospace;font-size:11px}
.grp rect{rx:7;ry:7;fill:var(--panel);stroke-width:1.5}
.grp text{font-size:12.5px;font-weight:500}
.grp .count{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.65}
.grp.open rect{fill:var(--ink);stroke:var(--ink)}
.grp.open text{fill:var(--paper)}
.leaf rect{fill:var(--panel);stroke:var(--rule);rx:5;ry:5}
.leaf text{font-size:12.5px;fill:var(--ink)}
.leaf .tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.leaf:hover rect{stroke:var(--ink-soft)}
.leaf.sel rect{fill:var(--ink);stroke:var(--ink)}
.leaf.sel text{fill:var(--paper)}
.leaf.match rect{stroke:var(--focus);stroke-width:1.75}
.leaf.dim{opacity:.28}

.panel{border-left:1px solid var(--rule);background:var(--panel);overflow-y:auto;min-width:0}
.shell:not(.panel-open) .panel{display:none}
.panel-in{padding:20px 24px 56px}
.panel .close{float:right;border:0;background:none;cursor:pointer;color:var(--ink-faint);font-size:19px;line-height:1;padding:2px 4px}
.panel .close:hover{color:var(--ink)}
.kind{font-size:12.5px;margin:0 0 2px}
.panel h3{margin:0 0 12px;font-size:20px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.panel p{margin:0 0 14px;color:var(--ink-soft);max-width:60ch}
.syntax{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--ink);color:#D6DDE3;padding:11px 13px;border-radius:var(--r);margin:0 0 16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.panel h4{font-size:12.5px;font-weight:500;color:var(--ink-faint);margin:20px 0 8px;border-top:1px solid var(--rule);padding-top:10px}
.panel h4:first-of-type{border-top:0;padding-top:0}
.sheet{margin:0 0 6px;display:grid;grid-template-columns:minmax(78px,auto) 1fr;gap:5px 16px;font-size:13.5px;align-items:baseline}
.sheet dt{font-family:"IBM Plex Mono",monospace;color:var(--ink);overflow-wrap:anywhere}
.sheet dd{margin:0;color:var(--ink-soft)}
.sheet.words dt{font-family:"IBM Plex Sans",sans-serif;font-weight:500}
.flow{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;margin:0 0 16px;white-space:pre-wrap;line-height:1.7}
.transport{display:flex;gap:6px;margin:0 0 14px}
.transport b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;color:#fff;border-radius:var(--r);padding:2px 8px}
.xlinks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.xlinks button{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);border-radius:var(--r);padding:3px 9px;cursor:pointer}
.xlinks button:hover{border-color:var(--ink-soft);color:var(--ink)}
.xlinks button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.exam{border-left:2px solid var(--focus);padding:2px 0 2px 12px;margin:18px 0 0;font-size:13.5px;color:var(--ink-soft)}
.note{font-size:13px;color:var(--ink-faint);border-top:1px solid var(--rule);padding-top:12px;margin-top:22px}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;font:inherit;padding:9px 2px;cursor:pointer;color:var(--ink)}
.result:hover{background:var(--paper-deep)}
.result .meta{display:block;font-size:12px;color:var(--ink-faint);margin-top:1px}

@media (max-width:1100px){.shell.panel-open{grid-template-columns:236px minmax(0,1fr) 400px}}
@media (max-width:900px){
  .shell,.shell.panel-open{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--rule);display:flex;gap:2px;overflow-x:auto;padding:8px 12px}
  .rail h2{display:none}
  .mod{width:auto;grid-template-columns:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:5px 10px}
  .mod .num{display:none}
  .mod[aria-current="true"]{border-left:0;border-bottom-color:var(--focus)}
  .shell.panel-open .panel{position:fixed;inset:auto 0 0 0;max-height:70vh;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -8px 24px rgba(28,39,51,.14);z-index:5}
  .legend,.hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="bar">
    <div class="mark">Carte CEH v13 <span id="stat"></span></div>
    <label class="search"><input id="q" type="search" placeholder="Chercher un outil, un port, un concept" autocomplete="off"></label>
    <div class="hits" id="hits"></div>
  </header>
  <nav class="rail" id="rail" aria-label="Modules"><h2>20 modules</h2></nav>
  <main class="canvas" id="canvas">
    <svg id="map" viewBox="0 0 1300 830" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Carte mentale du module"></svg>
    <button class="back" id="back">← Revenir aux branches</button>
    <div class="legend">
      <div><i style="background:var(--c-concept)"></i>Concepts clés</div>
      <div><i style="background:var(--c-outil)"></i>Outils</div>
      <div><i style="background:var(--c-port)"></i>Ports &amp; protocoles</div>
      <div><i style="background:var(--c-contre)"></i>Contre-mesures</div>
      <div><span style="width:9px;text-align:center;color:var(--focus);font-weight:600">★</span>Fiche prioritaire examen</div>
    </div>
    <div class="hint">Clique une branche pour l'ouvrir, une feuille pour le détail. Le <span style="font-family:'IBM Plex Mono',monospace">↔</span> signale ce qui revient ailleurs.</div>
  </main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script>
const CATS=[
 {key:"concept",label:"Concepts clés",color:"var(--c-concept)"},
 {key:"outil",  label:"Outils",color:"var(--c-outil)"},
 {key:"port",   label:"Ports & protocoles",color:"var(--c-port)"},
 {key:"contre", label:"Contre-mesures",color:"var(--c-contre)"}
];

const MODULES=[{"n":1,"t":"Introduction au hacking éthique","data":{"concept":{"groups":[{"g":"Fondamentaux de la sécurité","items":[{"name":"Information Security","desc":"La sécurité de l'information consiste à protéger l'information et les systèmes qui la traitent contre l'accès, la divulgation, la modification ou la destruction non autorisés. Une information est un actif : sa compromission peut entraîner des pertes financières, une atteinte à l'image et une perte de confiance des clients. Pour raisonner sur ce qu'il faut protéger, le CEH s'appuie d'abord sur les propriétés de sécurité de l'information.","cheat":[{"words":1,"title":"Idée à garder en tête","rows":[["Ce qu'on protège","l'information elle-même ET les systèmes qui la stockent, la traitent ou la transmettent"],["Ce qu'on cherche à éviter","accès/divulgation non autorisés, altération et destruction"],["Pourquoi","la compromission d'un actif informationnel peut avoir un impact métier réel"]]}]},{"name":"Triade CIA","desc":"La triade CIA décrit les trois propriétés fondamentales de la sécurité : Confidentiality, Integrity et Availability. Une attaque ou une défaillance de sécurité peut être comprise comme une atteinte à l'une de ces propriétés. L'intérêt de la triade est de ne pas réduire la sécurité au secret : une donnée correcte mais indisponible, ou disponible mais altérée, n'est pas sécurisée.","cheat":[{"words":1,"title":"Les trois propriétés","rows":[["Confidentiality","seules les personnes autorisées accèdent à l'information ; chiffrement, permissions et contrôle d'accès y contribuent"],["Integrity","la donnée reçue reste conforme à la donnée d'origine ; hash, HMAC et signature numérique servent à détecter ou prouver une modification"],["Availability","le service ou l'information reste accessible au moment attendu ; redondance, sauvegardes, failover, load balancing et protections anti-DoS y contribuent"]]}],"exam":"CIA = Confidentiality, Integrity, Availability. La disponibilité est bien une propriété de sécurité : rendre volontairement un service indisponible reste une atteinte à la sécurité."},{"name":"CIA + Authenticity + Non-Repudiation","desc":"Une donnée n'est pas exposée de la même manière selon qu'elle est stockée, transmise ou actuellement utilisée. On distingue la donnée au repos, en mouvement et en usage. Cette distinction aide à choisir la protection adaptée : chiffrer un disque protège surtout la donnée stockée, tandis que TLS protège la donnée pendant son transport.","cheat":[{"words":1,"title":"Les 5 éléments CEH","rows":[["Confidentiality","accès réservé aux utilisateurs autorisés"],["Integrity","donnée fiable, sans modification impropre ou non autorisée"],["Availability","systèmes accessibles quand les utilisateurs autorisés en ont besoin"],["Authenticity","origine ou communication authentique et non corrompue"],["Non-Repudiation","une partie ne peut pas nier ultérieurement l'action ou l'envoi effectué"]]}],"exam":"Aide-mémoire du module officiel : CIA + AN."},{"name":"États de la donnée","desc":"Une donnée n'est pas exposée de la même manière selon qu'elle est stockée, transmise ou actuellement utilisée. Le Chapter 3 distingue la donnée au repos, en mouvement et en usage. Cette distinction aide à choisir la protection adaptée : chiffrer un disque protège surtout la donnée stockée, tandis que TLS protège la donnée pendant son transport.","cheat":[{"words":1,"title":"Les trois états","rows":[["At rest / static","donnée stockée sur disque ; exemples de protection : chiffrement complet du disque ou de la base"],["In motion / dynamic","donnée qui circule entre deux endroits ; SSL puis TLS sont cités pour les communications web"],["In use","donnée manipulée en mémoire ; c'est l'état le plus difficile à protéger"]]}]},{"name":"Parkerian Hexad","desc":"Donn Parker a proposé en 1998 d'étendre la triade CIA avec Possession/Control, Authenticity et Utility. Le modèle n'est pas présenté comme un standard, mais il permet d'expliquer des situations que CIA décrit mal. Une sauvegarde chiffrée volée, par exemple, peut conserver sa confidentialité tout en ayant perdu sa possession.","cheat":[{"words":1,"title":"Les trois ajouts à CIA","rows":[["Possession / Control","qui détient réellement la donnée, indépendamment du fait de pouvoir la lire"],["Authenticity","l'origine ou la donnée est bien celle annoncée"],["Utility","la donnée est utilisable dans son état actuel ; une donnée chiffrée dont la clé est perdue peut rester confidentielle mais devenir inutile"]]}],"exam":"Hexade complète : Confidentiality, Integrity, Availability, Possession, Authenticity, Utility."},{"name":"Attack = Motive + Method + Vulnerability","desc":"Le module officiel résume une attaque comme la combinaison d'un motif, d'une méthode et d'une vulnérabilité. Le motif décrit l'objectif de l'attaquant, la méthode correspond à la manière d'agir — notamment ses TTP — et la vulnérabilité est la faiblesse permettant à l'action d'aboutir. Cette formule aide à distinguer pourquoi l'attaque existe, comment elle est conduite et quelle faiblesse elle exploite.","syntax":"ATTACK = Motive (Goal) + Method (TTP) + Vulnerability","cheat":[{"words":1,"title":"Motifs cités dans le cours","rows":[["Perturbation","interrompre la continuité d'activité"],["Vol / manipulation","dérober ou modifier des informations"],["Financier","causer une perte, obtenir un gain ou demander une rançon"],["Idéologique / militaire","propager des convictions ou atteindre un objectif stratégique"],["Réputation / vengeance","nuire à l'image d'une cible ou se venger"]]}]},{"name":"TTP — Tactics, Techniques, Procedures","desc":"Les TTP décrivent le comportement d'un attaquant à différents niveaux. La tactique représente son objectif ou sa stratégie, la technique la méthode utilisée pour obtenir un résultat, et la procédure l'implémentation concrète ou l'enchaînement suivi. Ce vocabulaire devient particulièrement important avec MITRE ATT&CK, qui organise les comportements adverses autour de ces notions.","cheat":[{"words":1,"title":"Les trois niveaux","rows":[["Tactic","le pourquoi : l'objectif poursuivi à une étape"],["Technique","le comment : la méthode permettant d'atteindre cet objectif"],["Procedure","la façon concrète dont un acteur ou un malware applique la technique"]]}],"exam":"Dans ATT&CK : tactic = why, technique = how, procedure = implémentation concrète."},{"name":"Origine des vulnérabilités","desc":"Une vulnérabilité est une faiblesse de conception ou d'implémentation pouvant être exploitée pour compromettre la sécurité. Le module insiste sur le fait qu'elles ne viennent pas uniquement de bugs logiciels : une mauvaise configuration, une conception faible, une faiblesse inhérente à une technologie ou un comportement utilisateur peuvent également créer une ouverture exploitable.","cheat":[{"words":1,"title":"Causes principales","rows":[["Misconfiguration","mauvaise configuration matérielle ou logicielle"],["Poor / insecure design","faiblesse introduite dès la conception du réseau ou de l'application"],["Inherent weakness","limite intrinsèque d'une technologie face à certains scénarios d'attaque"],["End-user carelessness","partage d'identifiants, connexion à des réseaux non sûrs, mauvaises pratiques"],["Intentional act","abus volontaire, par exemple un ancien employé conservant un accès"]]}]},{"name":"Classification IATF des attaques","desc":"Le cours classe les attaques en cinq catégories selon la manière dont elles sont menées. Une attaque passive observe sans modifier, alors qu'une attaque active interagit avec la cible ou perturbe la communication. Les trois autres catégories décrivent surtout la proximité physique, l'abus d'un accès interne ou l'altération d'un produit avant son installation.","cheat":[{"words":1,"title":"Les 5 catégories","rows":[["Passive","interception/observation sans altération : footprinting, sniffing, analyse de trafic"],["Active","modification ou perturbation : DoS, MITM, session hijacking, SQL injection, spoofing, replay"],["Close-in","attaquant physiquement proche : shoulder surfing, dumpster diving, eavesdropping"],["Insider","personne de confiance qui abuse de son accès légitime"],["Distribution","matériel ou logiciel altéré avant l'installation, à la source ou pendant la distribution"]]}],"exam":"Passif = pas d'interaction active et donc plus difficile à détecter ; actif = du trafic ou une action visible peut être généré.","xref":[2]},{"name":"Information Warfare","desc":"L'Information Warfare désigne l'usage des technologies de l'information et de la communication pour obtenir un avantage sur un adversaire. Le module reprend la classification de Martin Libicki en sept catégories et distingue les actions défensives — prévention, détection, préparation, réponse — des actions offensives contre les actifs ICT.","cheat":[{"words":1,"title":"7 catégories de Libicki","rows":[["Command & Control","agir sur un système ou réseau compromis contrôlé par l'attaquant"],["Intelligence-based","technologies de renseignement/capteurs utilisées pour affecter des systèmes"],["Electronic","techniques radio-électroniques et cryptographiques visant les communications"],["Psychological","propagande ou terreur pour démoraliser"],["Hacker warfare","arrêt de systèmes, corruption de données, vol de service, faux messages"],["Economic","blocage de flux d'information pour nuire à l'économie"],["Cyberwarfare","forme la plus large d'utilisation des systèmes d'information contre un adversaire"]]}]}]},{"g":"Risque & Information Assurance","items":[{"name":"Formules du risque","desc":"Le risque peut être exprimé de plusieurs façons selon l'objectif de l'analyse. Une approche relie menace, vulnérabilité et impact ou valeur de l'actif ; une autre approche économique raisonne en perte × probabilité. Dans tous les cas, le but est d'estimer à la fois la possibilité qu'un événement se produise et les conséquences attendues.","syntax":"RISK = Threats × Vulnerabilities × Impact\nRISK = Threat × Vulnerability × Asset Value\nRisk = Loss × Probability","exam":"Ne mélange pas risque et vulnérabilité : la vulnérabilité est une faiblesse ; le risque tient compte de ce qui peut l'exploiter et de la conséquence."},{"name":"SLE, ARO & ALE","desc":"SLE, ARO et ALE servent à exprimer le risque en termes financiers. La SLE estime la perte associée à un événement unique, l'ARO estime combien de fois cet événement est attendu sur une année, et l'ALE combine les deux pour obtenir une perte annuelle attendue. Cette estimation permet de comparer le coût probable d'un risque au coût d'un contrôle.","cheat":[{"words":1,"title":"Formules","rows":[["SLE","Single Loss Expectancy = Asset Value × Exposure Factor"],["ARO","Annualized Rate of Occurrence = fréquence annuelle attendue"],["ALE","Annualized Loss Expectancy = SLE × ARO"]]}],"exam":"ALE représente la perte annualisée attendue et aide à justifier économiquement une mesure de sécurité."},{"name":"Threat, Vulnerability, Exploit, Actor, Vector","desc":"Ces termes décrivent des éléments différents d'un même scénario d'attaque. Une menace est ce qui peut causer une atteinte à la sécurité ; une vulnérabilité est la faiblesse présente dans le système ; l'exploit est ce qui déclenche ou tire parti de cette faiblesse. L'acteur est l'entité qui concrétise la menace, et le vecteur est le chemin par lequel il atteint la vulnérabilité.","cheat":[{"words":1,"title":"Vocabulaire","rows":[["Threat","possibilité de causer une atteinte à la confidentialité, l'intégrité ou la disponibilité"],["Vulnerability","faiblesse du système"],["Exploit","mécanisme ou action qui tire parti de la faiblesse"],["Threat actor / agent","personne ou groupe capable de réaliser la menace"],["Threat vector","chemin ou moyen utilisé pour atteindre et exploiter la vulnérabilité"]]}],"exam":"Toutes les vulnérabilités ne sont pas nécessairement exploitables dans les conditions réelles ; une race condition, par exemple, dépend d'une fenêtre de timing parfois difficile à contrôler."},{"name":"Niveaux de risque CEH","desc":"Le module officiel utilise une échelle de niveaux pour indiquer l'urgence du traitement. Un risque élevé ou extrême exige des mesures immédiates, un risque moyen doit être traité dès que possible et un risque faible appelle surtout des mesures préventives. Ce classement sert à prioriser les ressources plutôt qu'à traiter chaque problème comme s'il était catastrophique.","cheat":[{"words":1,"title":"Échelle donnée dans le module","rows":[["Extreme / High — 81–100 %","mesures immédiates et contrôles imposés sans délai"],["Medium — 41–60 %","pas d'urgence immédiate ; mettre en place des contrôles dès que possible"],["Low — 1–20 %","mesures préventives pour limiter les effets"]]}]},{"name":"Traitement du risque","desc":"Les contrôles peuvent être classés selon le moment où ils agissent. Un contrôle préventif essaie d'empêcher l'événement, un contrôle détectif cherche à identifier qu'il s'est produit, et un contrôle correctif réduit les conséquences après coup. On rencontre aussi les catégories deterrent, compensating et recovery.","cheat":[{"words":1,"title":"4 stratégies","rows":[["Acceptance","l'organisation comprend le risque et choisit de le supporter"],["Transference","transférer une partie du coût à un tiers, par exemple via une assurance ou un prestataire"],["Mitigation","mettre en place des contrôles pour réduire la probabilité, la perte ou les deux"],["Avoidance","renoncer à l'activité qui introduit le risque"]]},{"words":1,"title":"Deux notions liées","rows":[["Risk appetite","niveau de risque que l'organisation est prête à gérer"],["Residual risk","risque restant après la mise en place des contrôles"]]}],"exam":"Il n'existe pas de risque nul : après les contrôles, il reste un risque résiduel qui doit être accepté ou encore traité."},{"name":"Contrôles par fonction","desc":"Un contrôle peut être classé selon le moment où il agit par rapport à l'incident. Un contrôle préventif essaie d'empêcher l'événement, un contrôle détectif cherche à identifier qu'il s'est produit, et un contrôle correctif réduit les conséquences après coup. Le Chapter mentionne aussi des variantes comme deterrent, compensating et recovery.","cheat":[{"words":1,"title":"Fonctions","rows":[["Preventive","empêcher l'événement de se produire"],["Detective","identifier qu'une violation ou un événement a eu lieu"],["Corrective","réduire les dégâts et restaurer après l'événement"]]}]},{"name":"Contrôles par type","desc":"La deuxième classification décrit la nature du contrôle : technique, administrative ou physique. Les deux classifications se combinent. Une serrure est à la fois un contrôle physique et préventif ; une caméra peut être physique et détective ; une sauvegarde peut être technique et corrective.","cheat":[{"words":1,"title":"Types","rows":[["Technical","matériel ou logiciel : pare-feu, antivirus, EDR, chiffrement"],["Administrative","politiques, procédures, directives, formation, vérifications d'antécédents"],["Physical","barrières empêchant l'accès physique : portes, badges, caméras, gardiens, clôtures"]]}],"exam":"Une question peut demander les deux axes en même temps : type du contrôle ET fonction du contrôle."},{"name":"Information Assurance (IA)","desc":"L'Information Assurance ne se limite pas à installer des outils de sécurité. Elle vise à garantir la confidentialité, l'intégrité, la disponibilité et l'authenticité de l'information pendant son utilisation, son traitement, son stockage et sa transmission. Elle combine politiques, processus, personnes, contrôles techniques et décisions métier.","cheat":[{"words":1,"title":"Processus cité par le module","rows":[["1–2","développer politiques/processus puis concevoir les stratégies d'authentification réseau et utilisateur"],["3–5","identifier menaces/vulnérabilités, besoins et ressources puis planifier"],["6","appliquer les contrôles d'assurance appropriés"],["7","mener les processus de Certification & Accreditation"],["8","former le personnel"]]}]}]},{"g":"Ethical Hacking & acteurs","items":[{"name":"Hacking — définition","desc":"Le module définit le hacking comme l'exploitation de vulnérabilités et le contournement de contrôles de sécurité afin d'obtenir un accès non autorisé ou inapproprié aux ressources d'un système. Le terme peut aussi décrire le fait de modifier les fonctions d'un système ou d'une application au-delà de leur usage prévu. Ce qui rend l'activité légitime ou illégitime dépend ensuite du contexte et de l'autorisation.","cheat":[{"words":1,"title":"Exemples d'activités citées","rows":[["Réseau","scripts, sniffing, password cracking, DoS, botnets"],["Malware / tromperie","virus, worms, trojans, phishing"],["Impact métier","vol ou redistribution de propriété intellectuelle, pertes pour l'organisation"]]}]},{"name":"Ethical Hacking","desc":"L'ethical hacking consiste à utiliser des compétences, outils et techniques d'attaque pour tester la sécurité d'un système avec l'autorisation de son propriétaire. L'ethical hacker cherche les mêmes faiblesses qu'un attaquant, mais travaille dans un cadre convenu, évite les dommages non autorisés et rapporte les vulnérabilités afin qu'elles soient corrigées.","cheat":[{"words":1,"title":"La différence fondamentale","rows":[["Même techniques","un white hat peut utiliser les mêmes outils qu'un attaquant"],["Autorisation","le propriétaire a donné son consentement pour le test"],["Objectif","améliorer la sécurité et fournir des résultats de remédiation"]]}],"exam":"Dans le module CEH, le critère décisif est le CONSENTEMENT / l'AUTORISATION."},{"name":"3 questions de l'Ethical Hacker","desc":"Le cours résume un engagement d'ethical hacking par trois questions. Elles suivent naturellement le déroulement d'une attaque : d'abord ce que l'attaquant peut découvrir, ensuite ce qu'il peut faire avec cette information, et enfin si l'organisation est capable de remarquer ses actions.","cheat":[{"words":1,"title":"Les 3 questions","rows":[["1. What can an attacker see?","reconnaissance et scanning : informations, hôtes, services et surface exposée"],["2. What can an intruder do with it?","gaining access et maintaining access : exploitation, accès, persistance"],["3. Are the attempts noticed?","capacité de détection et traces laissées pendant l'attaque"]]}]},{"name":"Règles de l'Ethical Hacker","desc":"Avant toute action technique, l'ethical hacker doit travailler dans un cadre explicitement autorisé. Le module impose une autorisation signée, la confidentialité des informations obtenues et le respect strict des limites convenues. Une technique comme un DoS ne devient acceptable dans le test que si elle fait partie du périmètre autorisé.","cheat":[{"words":1,"title":"3 règles non négociables","rows":[["Authorization","obtenir l'autorisation signée du client AVANT le test"],["Confidentiality","protéger les informations du test, notamment via NDA"],["Scope","ne tester que ce qui a été convenu, avec les techniques autorisées"]]}],"exam":"Pour toute question de légalité dans un test : autorisation écrite préalable + respect du scope."},{"name":"Scope, audit & limites","desc":"L'ethical hacking fait partie de l'évaluation du risque, de l'audit et des bonnes pratiques de sécurité. Il sert à identifier les risques et à proposer des actions correctives, mais l'organisation reste responsable de mettre réellement les protections en place. Le module décrit également un cadre d'audit simple allant de la discussion initiale avec le client jusqu'à la restitution des conclusions.","cheat":[{"words":1,"title":"Security Audit Framework","rows":[["1","discuter avec le client de ses besoins"],["2","préparer et signer le NDA"],["3","constituer l'équipe et planifier"],["4","conduire le test"],["5","analyser les résultats et préparer le rapport"],["6","présenter les findings au client"]]},{"words":1,"title":"Limites","rows":[["Cadrage","l'organisation doit savoir ce qu'elle cherche et définir correctement le besoin"],["Remédiation","l'ethical hacker aide à comprendre ; l'organisation doit ensuite mettre en œuvre les protections"]]}]},{"name":"Compétences de l'Ethical Hacker","desc":"Le profil attendu combine des compétences techniques et non techniques. Le cours cite la maîtrise des systèmes Windows/Unix/Linux/Macintosh, des réseaux, du matériel et des domaines de sécurité, mais aussi la capacité d'apprendre rapidement, de résoudre des problèmes, de communiquer et de respecter les politiques et lois applicables.","cheat":[{"words":1,"title":"Technique","rows":[["Systèmes","Windows, Unix, Linux, Macintosh"],["Réseau","concepts réseau, hardware et software"],["Sécurité","connaissance approfondie des domaines et problématiques de cybersécurité"]]},{"words":1,"title":"Non technique","rows":[["Adaptation","apprendre rapidement de nouvelles technologies"],["Jugement","work ethic, problem solving, respect des politiques et du cadre légal"],["Communication","expliquer et restituer efficacement les résultats"]]}]},{"name":"Hacker Hats — White, Black, Gray, Blue, Red, Green","desc":"Les couleurs de hats servent à distinguer plusieurs profils selon leur autorisation, leur intention et leur rôle. White Hat travaille avec permission pour améliorer la sécurité ; Black Hat agit de manière malveillante et illégale ; Gray Hat peut rechercher des vulnérabilités sans autorisation. Blue Hat est présenté comme un professionnel sous contrat, Red Hat comme un justicier visant les black hats et Green Hat comme un débutant en apprentissage.","cheat":[{"words":1,"title":"Couleurs","rows":[["White Hat","autorisé, défensif, pentest et vulnerability assessment"],["Black Hat","non autorisé, intention malveillante : malware, phishing, ransomware, vol"],["Gray Hat","entre les deux, notamment découverte sans permission"],["Blue Hat","professionnel contractuel réalisant audits/tests pour une organisation ou un produit"],["Red Hat","vigilante s'attaquant aux black hats, auto-autorisé"],["Green Hat","nouveau venu qui apprend et expérimente"]]}],"exam":"Le module demande explicitement de connaître les couleurs ET leurs distinctions. Le meilleur repère reste l'autorisation."},{"name":"Autres profils d'attaquants","desc":"Au-delà des hats, le module décrit plusieurs acteurs selon leurs compétences et leurs motivations. Un script kiddie utilise surtout des outils préexistants sans bien les comprendre ; un hacktivist agit pour une cause ; un acteur étatique vise des objectifs nationaux ; un insider abuse d'un accès de confiance ; les groupes criminels organisés recherchent principalement un bénéfice financier.","cheat":[{"words":1,"title":"Profils à reconnaître","rows":[["Script Kiddie","peu expérimenté, outils préfabriqués, recherche de fun/reconnaissance"],["Hacktivist","motivation politique ou sociale : DDoS, défacement, fuite"],["State-Sponsored","hautement entraîné, espionnage ou sabotage pour un gouvernement"],["Cyber Terrorist","cherche à répandre la peur, notamment via les infrastructures critiques"],["Corporate Spy","espionnage industriel pour avantage concurrentiel"],["Insider","personne de confiance abusant de son accès"],["Criminal Syndicate / Organized Hackers","criminalité structurée, gains financiers, vol d'argent ou de propriété intellectuelle"]]}]},{"name":"AI-Driven Ethical Hacking","desc":"Le CEH v13 présente l'IA comme un moyen d'augmenter l'efficacité de l'ethical hacker, pas de le remplacer. Elle peut automatiser des tâches répétitives, aider à réduire certains faux positifs, passer à l'échelle et diminuer l'effort manuel. L'humain reste nécessaire pour la créativité, la pensée critique, la compréhension du contexte, l'interprétation des résultats et les décisions éthiques.","cheat":[{"words":1,"title":"Bénéfices mis en avant","rows":[["Efficiency","automatiser les tâches répétitives"],["Accuracy","réduire les faux positifs"],["Scalability","traiter des évaluations plus larges"],["Cost-effectiveness","réduire l'effort manuel"]]},{"words":1,"title":"Pourquoi l'humain reste nécessaire","rows":[["Créativité","adapter l'approche à un environnement et à un objectif"],["Critical thinking","évaluer des résultats imparfaits et décider ce qui compte réellement"],["Ethics","prendre des décisions qui ne se résument pas à une règle automatique"]]}],"xref":[20]}]},{"g":"Méthodologies & frameworks","items":[{"name":"CEH Ethical Hacking Framework — 5 phases","desc":"Le framework CEH organise un engagement en cinq grandes phases : Reconnaissance, Vulnerability Scanning, Gaining Access, Maintaining Access et Clearing Tracks. Le scanning et l'enumeration servent à caractériser les systèmes avant l'exploitation.","flow":"1. Reconnaissance\n   ↳ Footprinting · Scanning · Enumeration\n2. Vulnerability Scanning\n3. Gaining Access\n4. Maintaining Access\n5. Clearing Tracks","cheat":[{"words":1,"title":"Ce qui se passe à chaque phase","rows":[["Reconnaissance","collecter des informations, identifier hôtes, ports, services, utilisateurs, groupes et surface d'attaque"],["Vulnerability Scanning","identifier, mesurer et classer les vulnérabilités"],["Gaining Access","exploiter une faiblesse, un mot de passe ou un buffer overflow pour obtenir un point d'appui"],["Maintaining Access","conserver le contrôle et la persistance, éventuellement via backdoors, trojans ou rootkits"],["Clearing Tracks","effacer ou modifier les traces et journaux pour rester non détecté"]]}],"exam":"À retenir : Reconnaissance → Vulnerability Scanning → Gaining Access → Maintaining Access → Clearing Tracks.","xref":[2,3,4,5,6]},{"name":"Cyber Kill Chain — Lockheed Martin","desc":"La Cyber Kill Chain est un modèle séquentiel de défense pilotée par le renseignement. Elle décrit sept étapes allant de la recherche de la cible jusqu'à l'objectif final de l'attaquant. L'idée importante est celle d'une chaîne : si le défenseur casse un maillon, il peut empêcher la suite de l'attaque.","flow":"1 Reconnaissance → 2 Weaponization → 3 Delivery → 4 Exploitation → 5 Installation → 6 Command & Control → 7 Actions on Objectives","cheat":[{"words":1,"title":"Les 7 étapes","rows":[["Reconnaissance","rechercher, identifier et sélectionner la cible"],["Weaponization","associer exploit et malware/backdoor dans une charge livrable"],["Delivery","transmettre la charge : mail, USB, web, watering hole"],["Exploitation","déclencher l'exploitation de la vulnérabilité"],["Installation","installer malware/backdoor pour conserver un accès"],["Command & Control","établir le canal de contrôle distant"],["Actions on Objectives","exfiltrer, détruire, perturber ou atteindre l'objectif final"]]}],"exam":"Weaponization = création/assemblage de la charge ; Delivery = transmission de cette charge à la victime.","xref":[2,7]},{"name":"Attack Lifecycle — Mandiant","desc":"Le modèle Mandiant décrit une intrusion comme un processus moins linéaire que la Kill Chain. Après la reconnaissance initiale, le premier compromis et l'établissement d'un foothold, l'attaquant entre dans une boucle : il élève ses privilèges, explore le réseau interne, se déplace latéralement et maintient sa présence jusqu'à pouvoir accomplir sa mission.","flow":"Initial Recon → Initial Compromise → Establish Foothold\n                              ↻ Escalate Privileges\n                              ↻ Internal Recon\n                              ↻ Move Laterally\n                              ↻ Maintain Presence\n                         → Complete Mission","exam":"Différence essentielle avec la Kill Chain : le modèle Mandiant contient une boucle interne représentant les allers-retours réels d'une intrusion."},{"name":"MITRE ATT&CK","desc":"MITRE ATT&CK est une base de connaissances de comportements adverses observés dans le monde réel, organisée en matrice. Contrairement à la Kill Chain, ATT&CK n'impose pas une séquence unique : un attaquant peut utiliser plusieurs techniques dans différentes tactiques, revenir en arrière ou ignorer certaines étapes. Le framework sert notamment à décrire les comportements, cartographier les détections, faire du purple teaming et construire des hypothèses de threat hunting.","cheat":[{"words":1,"title":"Structure","rows":[["Tactic","objectif de l'attaquant à ce moment — le pourquoi"],["Technique","méthode utilisée pour atteindre cet objectif — le comment"],["Sub-technique","variante plus précise d'une technique"],["Procedure","implémentation concrète par un groupe ou un malware"]]},{"words":1,"title":"Tactiques Enterprise citées","rows":[["Début","Reconnaissance, Resource Development, Initial Access, Execution"],["Contrôle","Persistence, Privilege Escalation, Defense Evasion, Credential Access"],["Progression","Discovery, Lateral Movement, Collection"],["Final","Command & Control, Exfiltration, Impact"]]}],"exam":"ATT&CK = matrice de TTP ; Kill Chain = séquence d'étapes.","xref":[7,12]},{"name":"Diamond Model of Intrusion Analysis","desc":"Le Diamond Model sert à analyser des événements d'intrusion en reliant quatre éléments principaux : l'adversaire, la victime, la capacité utilisée et l'infrastructure employée. L'intérêt est de corréler plusieurs événements, repérer les informations manquantes et comprendre comment les différentes parties d'une campagne se relient.","cheat":[{"words":1,"title":"Les 4 sommets","rows":[["Adversary","QUI est derrière l'action"],["Victim","OÙ / contre qui l'action est menée"],["Capability","COMMENT l'adversaire agit : outils, techniques, capacités"],["Infrastructure","QUOI est utilisé pour atteindre la victime : domaines, systèmes, canaux"]]}],"exam":"Relation à mémoriser : l'adversaire utilise une infrastructure pour déployer une capacité contre une victime."}]},{"g":"Threat Intelligence & incidents","items":[{"name":"Indicators of Compromise (IoC)","desc":"Un IoC est un indice, un artefact ou une donnée forensique observée sur un réseau ou un système et pouvant signaler une compromission ou une activité malveillante. Le module insiste sur le fait qu'un IoC n'est pas, à lui seul, du renseignement : c'est une donnée qui doit être analysée et replacée dans un contexte pour devenir utile.","cheat":[{"words":1,"title":"Types d'IoC","rows":[["Atomic","indicateur indivisible dont le sens reste stable, par exemple une adresse IP ou une adresse mail"],["Computed","indicateur dérivé de données, par exemple un hash ou une expression régulière"],["Behavioral","combinaison logique de plusieurs indicateurs atomiques et calculés"]]}]},{"name":"STIX & TAXII","desc":"STIX et TAXII sont associés au partage de renseignement et d'IoC. STIX fournit une manière structurée de représenter l'information de menace, tandis que TAXII fournit le mécanisme d'échange permettant de transporter ce renseignement entre organisations ou systèmes. Ils sont donc complémentaires plutôt qu'interchangeables.","cheat":[{"words":1,"title":"Association","rows":[["STIX","Structured Threat Information Expression — format/structure de description"],["TAXII","Trusted Automated eXchange of Intelligence Information — mécanisme de transport/échange"]]}],"exam":"STIX décrit ; TAXII transporte."},{"name":"Cyber Threat Intelligence — 4 types","desc":"La Cyber Threat Intelligence est une information organisée, analysée et raffinée sur des attaques potentielles ou en cours, afin d'aider à réduire les menaces. Le module distingue quatre niveaux selon le public et le type d'information : stratégique pour la direction, tactique pour les opérations de sécurité, opérationnel pour des menaces spécifiques et technique pour les indicateurs directement exploitables.","cheat":[{"words":1,"title":"Les 4 niveaux","rows":[["Strategic","vision métier et tendances de haut niveau pour la direction"],["Tactical","TTP et comportements adverses pour les équipes sécurité"],["Operational","informations sur des menaces, campagnes ou opérations spécifiques pour les incident handlers"],["Technical","IoC et données techniques directement exploitables"]]}],"exam":"Association CEH : Strategic → management ; Tactical → opérations sécurité ; Operational → incident handlers ; Technical → IoC."},{"name":"Threat Intelligence Lifecycle","desc":"Le renseignement de menace suit un cycle en cinq étapes. On commence par définir les besoins, puis on collecte les données nécessaires, on transforme les données brutes en information exploitable, on analyse pour produire du renseignement et enfin on diffuse le résultat aux personnes qui en ont besoin. Le cycle recommence lorsque de nouveaux besoins apparaissent.","flow":"1 Planning & Direction → 2 Collection → 3 Processing & Exploitation → 4 Analysis & Production → 5 Dissemination & Integration","cheat":[{"words":1,"title":"À quoi sert chaque étape","rows":[["Planning & Direction","définir les intelligence requirements, l'équipe et le plan de collecte"],["Collection","rassembler les données, notamment OSINT, HUMINT, IMINT, MASINT"],["Processing & Exploitation","convertir la donnée brute dans un format utilisable"],["Analysis & Production","combiner les éléments et produire un résultat objectif, opportun, précis et actionnable"],["Dissemination & Integration","livrer le renseignement aux parties prenantes concernées"]]}],"exam":"Ordre : Planning → Collection → Processing → Analysis → Dissemination."},{"name":"Incident Management — 9 étapes","desc":"Le module décrit la réponse à incident comme un processus structuré en neuf étapes, depuis la préparation jusqu'aux activités post-incident. L'ordre est important : après avoir qualifié et notifié l'incident, on cherche d'abord à contenir la propagation, puis on collecte les preuves, on éradique la cause et seulement ensuite on restaure le service.","flow":"1 Preparation → 2 Recording & Assignment → 3 Triage → 4 Notification → 5 Containment → 6 Evidence/Forensics → 7 Eradication → 8 Recovery → 9 Post-Incident","cheat":[{"words":1,"title":"Étapes critiques","rows":[["Containment","empêcher l'incident de se propager à d'autres actifs"],["Evidence & Forensics","collecter et analyser les preuves pour comprendre la méthode et les systèmes touchés"],["Eradication","supprimer la cause racine et fermer les vecteurs d'attaque"],["Recovery","restaurer systèmes, services, ressources et données"],["Post-Incident","documenter, évaluer l'impact et améliorer procédures/politiques"]]}],"exam":"Séquence à ne pas inverser : Containment → Evidence/Forensics → Eradication → Recovery."},{"name":"Adaptive Security Strategy","desc":"La stratégie de sécurité adaptative est un cycle continu qui ne repose pas uniquement sur la prévention. Elle combine la capacité à prédire les risques, protéger les actifs, détecter les anomalies puis répondre aux incidents. Les enseignements de la réponse alimentent ensuite à nouveau la prédiction et la protection.","flow":"Predict → Protect → Detect → Respond → repeat","cheat":[{"words":1,"title":"Les 4 activités","rows":[["Predict","risk/vulnerability assessment, attack surface analysis, threat intelligence"],["Protect","défense en profondeur, politiques, protection endpoint/réseau/données"],["Detect","surveillance des anomalies, monitoring réseau, packet sniffing"],["Respond","investigation, containment, mitigation, eradication"]]}],"exam":"Ce n'est pas une suite unique : c'est un cycle continu Predict → Protect → Detect → Respond."}]},{"g":"Réseau — modèles & adressage","items":[{"name":"Modèle OSI","desc":"Le modèle OSI est un modèle de référence en sept couches créé pour standardiser la communication entre systèmes. À l'émission, les données descendent de la couche Application vers la couche Physique et chaque couche ajoute son propre en-tête ; à la réception, le processus est inversé. Dans les questions CEH, lorsqu'une couche est citée par son numéro — Layer 2, Layer 3, Layer 7 — il s'agit généralement du modèle OSI.","cheat":[{"words":1,"title":"7 couches — du haut vers le bas","rows":[["7 Application","besoins de communication des applications : HTTP, HTTPS, DNS, SMTP"],["6 Presentation","format/encodage des données : ASCII, Unicode, JPEG"],["5 Session","établit et maintient la communication entre applications : RPC, NetBIOS"],["4 Transport","segmentation, multiplexage et ports : TCP, UDP"],["3 Network","adressage et routage : IP, ICMP"],["2 Data Link","communication locale et adresse MAC : Ethernet, ARP, VLAN"],["1 Physical","signal physique transmis sur le média"]]}],"exam":"Mnémotechnique OSI : Please Do Not Touch Steven's Pet Alligator, de Physical vers Application."},{"name":"Modèle TCP/IP","desc":"TCP/IP est le modèle réellement implémenté sur les réseaux modernes, avec quatre couches. Il regroupe plusieurs couches OSI : la couche Application TCP/IP recouvre les couches 7, 6 et 5 d'OSI ; Transport correspond à OSI 4 ; Internet à OSI 3 ; Link/Network Access regroupe OSI 2 et 1. OSI reste toutefois le vocabulaire de référence pour parler des couches dans de nombreuses questions.","cheat":[{"words":1,"title":"Correspondance","rows":[["TCP/IP Application","OSI 7 + 6 + 5"],["TCP/IP Transport","OSI 4"],["TCP/IP Internet","OSI 3"],["TCP/IP Link","OSI 2 + 1"]]}]},{"name":"Encapsulation & PDU","desc":"Lorsqu'un message descend la pile réseau, chaque protocole ajoute son propre en-tête : c'est l'encapsulation. Le bloc de données change de nom selon la couche où on l'observe. Connaître ces PDU aide à comprendre ce que manipulent les protocoles et les outils de capture.","cheat":[{"words":1,"title":"PDU par couche","rows":[["OSI 7–5","Data"],["OSI 4","Segment pour TCP / Datagram pour UDP"],["OSI 3","Packet"],["OSI 2","Frame"],["OSI 1","Bits"]]}],"exam":"TCP = segment ; UDP = datagram ; IP = packet ; Ethernet/Data Link = frame."},{"name":"Topologies réseau","desc":"Une topologie montre comment les équipements sont reliés et donc comment le trafic circule. Cela permet de comprendre les points de panne mais aussi les endroits où le trafic peut être intercepté ou manipulé. Les principales topologies à reconnaître sont bus, star, ring, mesh et hybrid.","cheat":[{"words":1,"title":"Topologies","rows":[["Bus","un câble partagé, terminateurs aux deux extrémités, nombreuses collisions"],["Star","équipement central ; hub répète partout, switch envoie vers le bon port"],["Ring","trafic de système en système ; Token Ring utilise un token et un MAU"],["Mesh","liaisons directes redondantes ; full mesh = tous reliés à tous"],["Hybrid","combinaison de plusieurs topologies, fréquente dans les réseaux réels"]]}],"exam":"Full mesh : nombre de liaisons = n(n−1)/2."},{"name":"Adresse MAC & OUI","desc":"Une adresse MAC identifie une interface sur le réseau local. Elle fait 6 octets : les trois premiers correspondent à l'OUI, qui identifie le constructeur, et les trois derniers identifient l'interface dans la plage du constructeur. Les MAC sont utilisées sur le segment local, contrairement aux adresses IP qui permettent le routage entre réseaux.","cheat":[{"words":1,"title":"Repères","rows":[["Taille","6 octets, par exemple BA:00:4C:78:57:00"],["OUI","3 premiers octets = Organizationally Unique Identifier du constructeur"],["Partie hôte","3 derniers octets = identifiant de l'interface chez ce constructeur"],["Broadcast","ff:ff:ff:ff:ff:ff = trame livrée à tous les équipements du segment"]]}],"xref":[8]},{"name":"Switching & table CAM","desc":"Un switch prend ses décisions de transfert à partir des adresses MAC, donc en couche 2. Il apprend l'emplacement des machines en observant la MAC source des trames reçues et en stockant l'association MAC → port dans sa table CAM. Si la destination est inconnue, ou si la trame est broadcast/multicast, il la diffuse sur plusieurs ports.","flow":"Frame reçue → lire MAC source → apprendre MAC→port dans CAM → destination connue ? oui: unicast vers le bon port / non: flood","cheat":[{"words":1,"title":"Conséquences sécurité","rows":[["SPAN / port mirroring","fonction légitime qui copie le trafic vers un port de supervision"],["MAC flooding","saturer la CAM de fausses MAC pour pousser le switch à flooder davantage"],["ARP poisoning","empoisonner les caches ARP des hôtes pour rediriger le trafic vers la MAC de l'attaquant"],["MAC spoofing","changer sa propre MAC pour usurper un autre équipement ou contourner certains filtrages"]]}],"xref":[8]},{"name":"Adressage IPv4","desc":"Une adresse IPv4 fait 32 bits, soit quatre octets compris entre 0 et 255. Certaines plages ont un rôle spécial : loopback, privées RFC 1918, APIPA, multicast ou réservées. Les adresses privées ne sont pas routables directement sur Internet et nécessitent généralement du NAT pour communiquer vers l'extérieur.","cheat":[{"words":1,"title":"Plages à connaître","rows":[["127.0.0.0/8","loopback"],["10.0.0.0/8","privée RFC 1918"],["172.16.0.0/12","privée RFC 1918"],["192.168.0.0/16","privée RFC 1918"],["169.254.0.0/16","APIPA / link-local quand DHCP échoue"],["224.0.0.0–239.255.255.255","multicast"],["240.0.0.0 et plus","réservé"]]}],"exam":"Les trois plages privées RFC 1918 sont à connaître de mémoire."},{"name":"Adressage IPv6","desc":"IPv6 utilise des adresses de 128 bits écrites en huit groupes hexadécimaux. On peut supprimer les zéros de tête dans un groupe et remplacer une seule séquence de groupes entièrement nuls par ::. Contrairement à IPv4, IPv6 n'utilise pas de broadcast : le multicast sert à joindre un groupe, tandis que l'anycast remet le trafic au membre considéré comme le plus proche.","cheat":[{"words":1,"title":"Types d'adresses","rows":[["Unicast","un destinataire"],["Multicast","tous les membres d'un groupe ; remplace le broadcast"],["Anycast","un groupe partage l'adresse mais un seul membre, généralement le plus proche, reçoit le trafic"],["::1","loopback"],["fe80::/10","link-local"],["fc00::/7","unique local, équivalent privé"]]}],"exam":"IPv6 : pas de broadcast. Multicast = tous les membres ; anycast = un membre/plus proche."},{"name":"Subnetting & CIDR","desc":"Un subnet est une subdivision logique d'un réseau IP. Le masque sépare la partie réseau — bits à 1 — de la partie hôte — bits à 0. En notation CIDR, ajouter un bit au préfixe divise la plage par deux ; retirer un bit la double. Dans un sous-réseau IPv4 classique, l'adresse la plus basse est l'adresse réseau et la plus haute l'adresse de broadcast.","cheat":[{"words":1,"title":"Tailles CIDR à retenir","rows":[["/23","512 adresses, 510 hôtes utilisables"],["/24","256 adresses, 254 utilisables"],["/25","128 adresses, 126 utilisables"],["/26","64 adresses, 62 utilisables"],["Formule","nombre total d'adresses = 2^(32 − préfixe)"]]}],"exam":"Chaque bit ajouté au préfixe divise la plage par 2."},{"name":"Types de réseaux — LAN, VLAN, WAN, MAN","desc":"Les types de réseaux décrivent surtout l'étendue géographique et la manière dont la couche 2 est organisée. Un LAN regroupe des systèmes proches ; un VLAN crée une séparation logique dans le switch ; un WAN relie des sites distants ou passe par un opérateur ; un MAN couvre typiquement une ville ou un campus. PAN désigne un réseau personnel et CAN un réseau de campus.","cheat":[{"words":1,"title":"Repères","rows":[["LAN","systèmes proches, même environnement local de couche 2"],["VLAN","isolation logique de couche 2 ; passer d'un VLAN à l'autre demande une frontière couche 3"],["WAN","sites éloignés ou interconnexion via un fournisseur de service"],["MAN","échelle intermédiaire, par exemple plusieurs bâtiments dans une ville/campus"],["PAN / CAN","Personal Area Network / Campus Area Network"]]}]},{"name":"DMZ, enclaves & isolation","desc":"La segmentation cherche à empêcher qu'un système exposé donne directement accès aux actifs internes. Une DMZ accueille les services joignables depuis Internet, comme web, mail ou DNS, tandis que des enclaves isolent des populations ou des données spécifiques. Le principe clé est qu'un hôte compromis dans une zone exposée ne doit pas disposer d'un chemin libre vers le réseau interne.","cheat":[{"words":1,"title":"Règles d'architecture","rows":[["DMZ","zone destinée aux systèmes accessibles depuis l'extérieur"],["Flux","Internet peut atteindre les services DMZ autorisés ; la DMZ ne doit pas pouvoir initier librement des connexions vers le LAN"],["Enclave","segment isolé dédié à un type de donnée ou de population, éventuellement via microsegmentation/SDN"]]}],"xref":[12]},{"name":"VPN, IPSec, TLS & MPLS","desc":"Un VPN crée un tunnel chiffré à travers un réseau non fiable. IPSec est couramment utilisé pour des tunnels site-to-site, tandis que les VPN TLS sont fréquents pour l'accès distant utilisateur. IPSec travaille en couche 3 avec AH ou ESP ; un VPN TLS passe souvent sur TCP 443. MPLS, lui, transporte les flux à l'aide de labels et n'apporte pas de chiffrement par lui-même.","cheat":[{"words":1,"title":"IPSec","rows":[["AH","authentification et intégrité, sans chiffrement"],["ESP","chiffrement + authentification ; c'est le protocole IPSec le plus couramment utilisé"],["Transport mode","chiffre principalement la charge utile, hôte à hôte"],["Tunnel mode","chiffre le paquet original complet et l'encapsule dans un nouvel en-tête IP, typique site-to-site"]]},{"words":1,"title":"TLS VPN vs IPSec","rows":[["IPSec","couche 3, portée réseau complète, plus contraignant avec NAT/firewall"],["TLS VPN","accès distant, souvent via 443, plus facile à faire traverser proxies/NAT/firewalls"],["MPLS","transport opérateur par labels, parfois appelé couche 2.5 ; pas de chiffrement natif"]]}]},{"name":"Cloud — STaaS, IaaS, PaaS, SaaS","desc":"Le cloud externalise une partie de l'infrastructure vers un fournisseur. La différence entre les modèles tient surtout à ce que le fournisseur prend en charge et à ce que le client continue d'administrer. Plus on va vers SaaS, plus la pile technique est gérée par le fournisseur ; le client reste néanmoins responsable de ses données, de ses accès et de ses configurations dans le cadre du shared responsibility model.","cheat":[{"words":1,"title":"Modèles","rows":[["STaaS","Storage as a Service : stockage distant, par exemple iCloud, Drive, Dropbox, S3"],["IaaS","compute/storage/network bruts ; le client gère notamment OS, runtime, applications et données"],["PaaS","plateforme déjà configurée ; le client gère surtout applications et données"],["SaaS","application finie fournie via le réseau ; le client gère principalement ses données et accès"]]},{"words":1,"title":"Shared responsibility","rows":[["Provider","sécurise l'infrastructure du cloud"],["Customer","sécurise ce qu'il met dans le cloud : données, identités, configurations et accès"]]}],"exam":"STaaS = Storage as a Service ; SaaS = Software as a Service.","xref":[19]},{"name":"IoT & OT","desc":"L'IoT regroupe les objets disposant d'un logiciel embarqué et d'un accès réseau : caméras, thermostats, équipements domestiques ou boîtiers connectés. Leurs faiblesses récurrentes incluent identifiants par défaut ou codés en dur, difficulté de patch, longue durée de vie et faible visibilité après déploiement. OT/ICS/SCADA représente le pendant industriel, où une compromission peut avoir des conséquences physiques.","cheat":[{"words":1,"title":"Risques cités","rows":[["Credentials","identifiants par défaut ou hardcodés"],["Patching","mécanisme de mise à jour absent ou insuffisant"],["Lifecycle","équipements conservés longtemps"],["Visibility","faible visibilité une fois déployés"],["Botnets","objets vulnérables utilisés comme nœuds de botnet ; Mirai est l'exemple cité"]]}],"xref":[18]}]},{"g":"Technologies de défense","items":[{"name":"Packet Filtering Firewall","desc":"Le filtrage de paquets est la forme la plus simple de pare-feu. Il décide du sort d'un paquet principalement à partir du protocole, des adresses et des ports source/destination, sans comprendre le contexte complet de la conversation. Les règles sont évaluées dans l'ordre et la première règle correspondante l'emporte.","cheat":[{"words":1,"title":"Actions","rows":[["Drop","ne transmet pas le paquet et ne répond pas"],["Reject","ne transmet pas mais renvoie un message d'erreur, par exemple ICMP destination unreachable"],["Accept","autorise le paquet à passer"]]},{"words":1,"title":"Politiques","rows":[["Default deny","tout bloquer sauf ce qui est explicitement autorisé"],["Default accept","tout autoriser sauf ce qui est explicitement bloqué"]]}],"exam":"Les règles sont lues de haut en bas : first match wins. Default deny est l'approche la plus restrictive.","xref":[12]},{"name":"Stateful Firewall","desc":"Un pare-feu stateful ne regarde pas chaque paquet isolément : il conserve une table d'état représentant les conversations en cours. Il sait ainsi quel côté a initié une connexion et peut autoriser automatiquement le trafic de retour correspondant. À l'inverse, un ACK ou SYN-ACK isolé sans état associé peut être rejeté.","cheat":[{"words":1,"title":"Conséquences","rows":[["Return traffic","une réponse appartenant à une connexion initiée et connue peut être autorisée sans règle séparée"],["State table","le pare-feu compare les paquets à l'état de la conversation"],["Scans","certains scans reposant sur des paquets isolés deviennent moins efficaces face à un filtrage à état"]]}],"xref":[3,12]},{"name":"Deep Packet Inspection (DPI)","desc":"La DPI inspecte la charge utile et pas seulement les en-têtes réseau. Elle peut donc chercher des signatures et comprendre davantage les protocoles applicatifs, mais doit parfois attendre le réassemblage complet d'un message, ce qui ajoute de la latence. Une charge chiffrée n'est pas lisible sans mécanisme d'interception TLS/SSL.","cheat":[{"words":1,"title":"À retenir","rows":[["Payload","inspection du contenu au-delà des en-têtes"],["Signatures","recherche de motifs connus"],["Reassembly","besoin de reconstituer les fragments/messages pour inspecter correctement"],["Encrypted traffic","le contenu chiffré reste opaque sauf interception TLS/SSL"]]}],"xref":[12]},{"name":"Application Firewall & WAF","desc":"Un pare-feu applicatif comprend la sémantique d'un protocole spécifique plutôt que de se limiter à des adresses et des ports. Pour le web, le WAF examine les requêtes/réponses HTTP(S) et applique des règles destinées notamment aux attaques web. Il est souvent déployé en reverse proxy, c'est-à-dire entre le client et le serveur.","cheat":[{"words":1,"title":"Exemples","rows":[["WAF","vise notamment SQL injection, XSS et path traversal"],["ModSecurity","WAF open source utilisable notamment avec Apache"],["SBC","Session Border Controller pour les environnements VoIP"]]}],"xref":[13,14,15]},{"name":"UTM & NGFW","desc":"Un UTM consolide plusieurs fonctions de sécurité — pare-feu, IDS, IPS, antivirus — dans un seul équipement afin de simplifier l'administration. Le revers est qu'il concentre aussi le traitement et peut devenir un point unique de défaillance ou un goulet d'étranglement. Un NGFW ajoute typiquement inspection stateful, DPI, compréhension applicative, identité utilisateur et IPS.","cheat":[{"words":1,"title":"Comparaison rapide","rows":[["UTM","consolidation de plusieurs fonctions dans une appliance/console unique"],["Avantage","gestion plus simple, coût et administration centralisés"],["Risque","single point of failure / bottleneck lorsque toutes les fonctions sont activées"],["NGFW","pare-feu stateful + DPI + applications + identité + IPS"]]}]},{"name":"IDS","desc":"Un Intrusion Detection System détecte et alerte mais ne bloque pas, par définition. Un HIDS surveille l'activité sur un hôte — fichiers, journaux, processus, registre — alors qu'un NIDS observe le trafic réseau. Le placement normal d'un IDS réseau est hors bande : il reçoit une copie du trafic via SPAN ou TAP et peut donc surveiller sans être directement sur le chemin des paquets.","cheat":[{"words":1,"title":"Types & placement","rows":[["HIDS","sur l'hôte ; surveille fichiers, logs, processus, registre"],["NIDS","sur le réseau ; analyse les paquets vus par le capteur"],["Out-of-band","reçoit une copie via SPAN/TAP ; pas de blocage direct"],["Distributed sensors","plusieurs capteurs remontent vers une console centrale"]]},{"words":1,"title":"Détection","rows":[["Signature-based","cherche des motifs connus ; peut manquer une attaque nouvelle"],["Anomaly / behavior","cherche un écart à une baseline ; peut produire davantage de faux positifs"]]}],"exam":"IDS = detect & alert. En mode normal, il n'est pas inline et ne bloque pas.","xref":[12]},{"name":"IPS","desc":"Un Intrusion Prevention System doit être placé inline, directement sur le chemin du trafic. Cette position lui permet de bloquer ou rejeter un paquet, contrairement à un IDS hors bande. Ses règles peuvent analyser le contenu du trafic ; un mauvais réglage peut cependant bloquer du trafic légitime.","cheat":[{"words":1,"title":"Points pratiques","rows":[["Inline","le trafic traverse physiquement l'IPS"],["Action","drop silencieux ou reject avec message approprié"],["Tuning","les règles peuvent produire des faux positifs ; certaines sont d'abord déployées en detect-only"],["Logs","même lorsqu'une attaque est bloquée, les alertes doivent être investiguées"]]}],"exam":"IDS observe ; IPS doit être inline pour prévenir/bloquer.","xref":[12]},{"name":"EDR","desc":"Un Endpoint Detection and Response est un agent installé sur les postes qui collecte en continu de la télémétrie — processus, connexions réseau, modifications de fichiers et de registre — afin de détecter les comportements malveillants et d'aider à l'investigation. Contrairement à un antivirus classique centré sur le blocage de fichiers connus, l'EDR fournit visibilité, historique et capacités de réponse à distance.","cheat":[{"words":1,"title":"Fonctions","rows":[["Detection","antimalware par signature et comportement"],["Investigation","analyse des journaux et de la télémétrie système"],["Remote access","agir sur l'hôte depuis une console centrale"],["Artifacts","récupérer process lists, memory dumps, fichiers et logs"],["Isolation","couper l'hôte du réseau tout en conservant la connexion à la console"]]},{"words":1,"title":"Termes proches","rows":[["XDR","étend l'idée à plusieurs sources : endpoint, réseau, mail, cloud"],["MDR","service managé s'appuyant sur ces capacités"]]}]},{"name":"SIEM & SOC","desc":"Un SIEM centralise les journaux provenant de nombreuses sources, normalise leurs formats, les corrèle et génère des alertes ou tableaux de bord. Sa valeur vient surtout du contexte : plusieurs événements anodins pris séparément peuvent devenir significatifs lorsqu'ils sont corrélés. Un SOC utilise notamment ce type de plateforme pour superviser et investiguer les événements de sécurité.","cheat":[{"words":1,"title":"Fonctions SIEM","rows":[["Collection","rapatrier les logs des sources"],["Normalization","rendre comparables des formats différents"],["Correlation","croiser plusieurs événements/sources"],["Alerting & retention","notifier et conserver les événements"],["Dashboards / reporting","visualiser, suivre et répondre aux besoins de conformité"]]},{"words":1,"title":"Limites","rows":[["Volume / coût","beaucoup de données à stocker et traiter"],["Tuning","gérer les faux positifs et la qualité des règles"],["Coverage","un SIEM ne peut analyser que les données réellement collectées"]]}]},{"name":"Logging vs Auditing","desc":"Le logging enregistre ce que les systèmes, applications ou équipements ont fait ; l'auditing consiste à décider explicitement quels événements de sécurité doivent être enregistrés afin d'assurer la traçabilité et la preuve. Exemples : Audit Policy sous Windows, auditd/auditctl sous Linux. Les deux approches sont complémentaires.","cheat":[{"words":1,"title":"Logging","rows":[["Sources","système, équipements de sécurité, applications"],["Windows","Event Logs : System, Security, Application, etc."],["Unix-like","Syslog, notamment pour la centralisation distante"]]},{"words":1,"title":"Auditing","rows":[["Windows","Audit Policy ; les événements apparaissent dans le Security log"],["Linux","auditctl définit les règles ; auditd les applique et journalise fichiers, exécutions et syscalls"]]}],"exam":"Logging = enregistrer ce qui se passe ; Auditing = configurer délibérément quels événements doivent être enregistrés."}]},{"g":"Gouvernance, normes & lois","items":[{"name":"Policy, Standard, Procedure, Guideline","desc":"La documentation de sécurité suit une hiérarchie. La policy définit le quoi et le pourquoi à haut niveau ; le standard transforme cette politique en exigences plus précises ; la procedure explique étape par étape comment appliquer le standard ; la guideline propose des bonnes pratiques mais reste optionnelle. Plus on descend dans la hiérarchie, plus le document change fréquemment.","cheat":[{"words":1,"title":"Hiérarchie","rows":[["Policy","quoi et pourquoi ; obligatoire ; haut niveau ; change rarement"],["Standard","exigence précise dérivée de la policy ; obligatoire ; change régulièrement"],["Procedure","comment faire, étape par étape ; obligatoire ; change souvent"],["Guideline","manière recommandée de faire ; non obligatoire"]]}],"exam":"Piège classique : Standard = obligatoire ; Guideline = recommandation non obligatoire."},{"name":"PCI DSS","desc":"PCI DSS est un standard de sécurité destiné aux organisations qui stockent, traitent ou transmettent des données de porteurs de cartes. Il concerne notamment commerçants, processeurs, acquéreurs, émetteurs et prestataires. Le module présente six grandes familles d'exigences couvrant le réseau, les données, les vulnérabilités, les accès, la surveillance et la politique de sécurité.","cheat":[{"words":1,"title":"6 exigences de haut niveau","rows":[["1","Build and Maintain a Secure Network"],["2","Protect Cardholder Data"],["3","Maintain a Vulnerability Management Program"],["4","Implement Strong Access Control Measures"],["5","Regularly Monitor and Test Networks"],["6","Maintain an Information Security Policy"]]}],"exam":"PCI DSS = données de cartes de paiement ; non-conformité : amendes ou perte du droit de traiter les paiements."},{"name":"ISO/IEC 27000 Series","desc":"La famille ISO/IEC 27000 regroupe des normes de management et de contrôle de la sécurité de l'information. Pour la révision, la distinction la plus importante est entre ISO/IEC 27001, qui définit les exigences du système de management de la sécurité de l'information, et ISO/IEC 27002, qui fournit un code de bonnes pratiques et un catalogue de contrôles.","cheat":[{"words":1,"title":"Normes citées","rows":[["27001:2022","ISMS/SMSI — établir, mettre en œuvre, maintenir et améliorer continuellement"],["27002:2022","code de pratique pour les contrôles de sécurité"],["27032:2023","guidelines cybersécurité / Internet et rôles des parties prenantes"],["27033-7:2023","sécurité de la virtualisation réseau"],["27036-3:2023","sécurisation de la supply chain hardware/software/services"],["27040:2024","sécurité du stockage de données"]]}],"exam":"27001 = système de management ; 27002 = contrôles / bonnes pratiques."},{"name":"GDPR & DPA 2018","desc":"Le GDPR protège les données personnelles des citoyens de l'Union européenne et s'applique depuis le 25 mai 2018. Le module retient notamment les principes de traitement licite, loyal et transparent, les droits d'accès/effacement/portabilité/opposition, la notification de violation sous 72 heures et les sanctions maximales. Le DPA 2018 est le cadre britannique qui a remplacé le DPA 1998 et a pris effet le même jour.","cheat":[{"words":1,"title":"GDPR — chiffres à retenir","rows":[["Breach notification","dans les 72 heures"],["Sanctions","jusqu'à 20 M€ ou 4 % du chiffre d'affaires annuel mondial"],["Droits","accès, effacement, portabilité, opposition"]]},{"words":1,"title":"DPA 2018","rows":[["UK","cadre britannique de protection des données"],["Particularité citée","étend aussi la protection aux domaines de sécurité nationale et défense"]]}],"exam":"GDPR : 72 h ; 20 M€ ou 4 % du CA mondial."},{"name":"Lois US — HIPAA, SOX, DMCA, FISMA, CFAA","desc":"Le module demande surtout de savoir associer certaines lois américaines à leur domaine. HIPAA concerne les informations de santé ; SOX le reporting financier et la lutte contre la fraude comptable ; DMCA le contournement de protections du droit d'auteur ; FISMA la protection des informations et actifs fédéraux ; CFAA l'accès non autorisé aux systèmes informatiques.","cheat":[{"words":1,"title":"Association","rows":[["HIPAA","health information / privacy"],["SOX","financial reporting, audit trails, anti-fraud"],["DMCA","contournement des protections du copyright"],["FISMA","sécurité des informations et actifs du gouvernement fédéral"],["CFAA","accès non autorisé aux ordinateurs"]]}],"exam":"Santé → HIPAA ; finance → SOX ; fédéral → FISMA ; accès non autorisé → CFAA ; DRM/copyright → DMCA."},{"name":"Cyber Laws by Country","desc":"Le module fournit également une table de correspondance internationale. L'objectif de révision n'est pas d'apprendre tout le droit de chaque pays, mais de reconnaître le texte associé lorsqu'il apparaît dans un QCM.","cheat":[{"words":1,"title":"Correspondances du module","rows":[["UK","Computer Misuse Act 1990"],["Germany","Section 202a StGB — Data Espionage"],["Canada","Criminal Code s. 342.1"],["Australia","Criminal Code Act 1995 — Part 10.7"],["India","Information Technology Act 2000"],["Japan","Unauthorized Access Prohibition Law"],["Brazil","LGPD"],["Philippines","Republic Act No. 10175"],["Hong Kong","Article 139 of the Basic Law"]]}]}]}]},"outil":{"groups":[{"g":"Frameworks & cartographie","items":[{"name":"ATT&CK Navigator","desc":"ATT&CK Navigator est l'outil de visualisation associé à MITRE ATT&CK. Il permet de colorer ou annoter la matrice pour représenter les techniques couvertes par des détections, celles observées chez un adversaire ou celles que l'on veut tester. Son intérêt principal est de rendre visibles les trous de couverture et de partager une cartographie commune entre équipes.","exam":"Si la question parle de visualiser la couverture de détection sur la matrice ATT&CK : ATT&CK Navigator."},{"name":"D3FEND","desc":"D3FEND est présenté comme le pendant défensif d'ATT&CK. Là où ATT&CK décrit surtout les comportements adverses, D3FEND aide à relier des contre-mesures et techniques défensives aux actions d'attaque. Il est utile pour passer d'une technique offensive observée à des mécanismes de défense possibles."}]},{"g":"Détection réseau & Web","items":[{"name":"Snort","desc":"Snort est un IDS/IPS réseau open source, aujourd'hui associé à Cisco. Il analyse le trafic à partir de règles pouvant porter sur différentes couches de la pile et générer des alertes ou appliquer des actions selon le mode de déploiement. Dans le cadre du module 1, il sert surtout d'exemple concret de détection réseau par règles/signatures.","syntax":"alert tcp any any -> 10.0.0.0/24 445 (msg:\"SMB\"; sid:1000001;)","cheat":[{"words":1,"title":"Anatomie simplifiée d'une règle","rows":[["action","alert, log, pass, drop, reject selon le contexte"],["protocol","tcp, udp, icmp ou ip"],["source → destination","adresses et ports concernés"],["msg","texte de l'alerte"],["content","motif recherché"],["sid","identifiant de règle"]]}],"xref":[12]},{"name":"Suricata & Zeek","desc":"Suricata et Zeek sont des outils open source de visibilité et d'analyse réseau. Suricata est principalement orienté IDS/IPS et inspection réseau ; Zeek produit une télémétrie réseau riche et structurée utile à l'analyse et à la détection.","xref":[12]},{"name":"ModSecurity","desc":"ModSecurity est un WAF open source utilisable notamment avec Apache. Il applique des règles afin de détecter ou bloquer des requêtes/réponses web malveillantes et agit au niveau du contenu HTTP, là où un simple filtrage réseau ne suffit pas.","xref":[13,14,15]}]},{"g":"Endpoint, logs & audit","items":[{"name":"GRR — Google Rapid Response","desc":"GRR (Google Rapid Response) est un outil open source d'investigation et de réponse à distance sur les endpoints. Il permet d'interroger des postes, récupérer des artefacts et mener des investigations depuis une console centrale."},{"name":"Windows Event Viewer","desc":"Windows Event Viewer est la console utilisée pour consulter les journaux Windows. Les événements disposent d'un Event ID numérique, ce qui permet de filtrer ou déclencher des alertes indépendamment du texte exact du message.","cheat":[{"words":1,"title":"Event IDs cités","rows":[["4624","logon success"],["4625","logon failure"],["4688","process creation"],["4720","account created"],["1102","Security log cleared"]]}],"xref":[6]},{"name":"auditctl / auditd","desc":"Sous Linux, auditctl sert à définir la politique et les règles d'audit, tandis que le démon auditd applique ces règles et écrit les événements. Le sous-système peut surveiller l'activité sur des fichiers/répertoires, l'exécution d'applications et certains appels système. Les règles persistantes sont stockées dans /etc/audit/audit.rules et les logs dans /var/log/audit/audit.log.","syntax":"auditctl -w /etc/passwd -p wa -k identites\nauditctl -a always,exit -F arch=b64 -S execve -k exec\nausearch -k identites","cheat":[{"words":1,"title":"Repères","rows":[["-w <path>","surveiller un fichier ou un répertoire"],["-p r|w|x|a","événements de lecture, écriture, exécution ou attributs"],["-k <key>","étiqueter la règle pour faciliter la recherche"],["ausearch","rechercher dans les événements d'audit"]]}]}]},{"g":"IA — outils cités par CEH v13","items":[{"name":"Outils IA de l'Ethical Hacker","desc":"Plusieurs outils d'IA peuvent assister l'ethical hacker : scan web, pentest, bug bounty, évaluation du risque ou opérations de sécurité. Ils accélèrent certaines tâches, mais leurs résultats doivent être vérifiés et interprétés par un humain.","cheat":[{"words":1,"title":"Association outil → usage dans le module","rows":[["BurpGPT","Burp Suite enrichi par IA pour le scan de vulnérabilités web"],["PentestGPT","automatisation/assistance de certaines étapes du penetration testing"],["BugBountyGPT","orienté bug bounty"],["BugHunterGPT","aide à la recherche et au reporting de bugs"],["GPT White Hack","risk assessment et threat detection"],["CybGPT","outil généraliste pour les opérations de sécurité"]]}],"exam":"À reconnaître par usage ; le module insiste surtout sur le fait que l'IA augmente l'humain mais ne le remplace pas.","xref":[20]}]}]},"port":{"groups":[{"g":"Protocoles fondamentaux","items":[{"name":"TCP","desc":"TCP est un protocole de couche 4 orienté connexion. Il utilise des ports, des numéros de séquence et d'acquittement pour assurer le suivi, l'ordre et la retransmission des données. Avant d'échanger des données, les deux extrémités établissent une connexion via le three-way handshake. L'en-tête TCP fait au minimum 20 octets.","tr":"tcp","cheat":[{"words":1,"title":"Ce qui caractérise TCP","rows":[["Connection-oriented","une connexion est établie avant l'échange"],["Reliability","séquences, ACK et retransmissions permettent de détecter les pertes"],["Ordering","les numéros de séquence permettent de remettre les segments dans le bon ordre"],["Flow control","la Window indique combien de données le récepteur accepte"]]}],"xref":[3,10,11]},{"name":"TCP Flags","desc":"Les flags TCP décrivent l'état ou l'intention d'un segment. Ils sont au cœur de l'établissement et de la fermeture d'une connexion, mais aussi de nombreux scans de ports. SYN et ACK sont utilisés pour établir la connexion ; FIN termine proprement ; RST l'interrompt brutalement ; PSH et URG influencent la manière dont les données sont remises à l'application.","tr":"tcp","cheat":[{"words":1,"title":"6 flags","rows":[["URG","le champ Urgent Pointer contient une information significative"],["ACK","le numéro d'acquittement est valide"],["PSH","pousser les données vers l'application sans attendre davantage de buffering"],["RST","réinitialiser brutalement la connexion ; apparaît aussi lorsqu'un port TCP est fermé"],["SYN","synchroniser les numéros de séquence / initier une connexion"],["FIN","fermeture propre : plus de données à envoyer"]]}],"exam":"Ordre mnémotechnique des flags TCP : U A P R S F.","xref":[3]},{"name":"TCP Three-Way Handshake","desc":"TCP établit une connexion en trois messages afin que chaque extrémité confirme qu'elle est joignable et synchronise son numéro de séquence initial. Le client envoie SYN ; le serveur répond SYN-ACK avec son propre numéro de séquence et accuse réception du SYN du client ; le client renvoie ACK du numéro de séquence du serveur +1. À ce moment, la connexion est établie.","tr":"tcp","flow":"1. Client → SYN (seq = X)\n2. Server → SYN-ACK (seq = Y, ack = X+1)\n3. Client → ACK (ack = Y+1)\n→ connexion établie","cheat":[{"words":1,"title":"Pourquoi c'est important en sécurité","rows":[["Port scanning","SYN → SYN-ACK suggère un port ouvert ; SYN → RST indique fermé ; silence peut indiquer filtré"],["SYN scan","Nmap peut lire la réponse puis envoyer RST au lieu de finir le handshake"],["SYN flood","de nombreux SYN non terminés peuvent remplir la table de connexions"],["Session hijacking","les ISN aléatoires rendent la prédiction de séquence plus difficile"]]}],"exam":"SYN → SYN-ACK → ACK. La fermeture propre est distincte et se fait en quatre échanges FIN/ACK/FIN/ACK.","xref":[3,10,11]},{"name":"UDP","desc":"UDP est un protocole de couche 4 sans connexion. Il ne réalise pas de handshake et n'offre ni numéros de séquence, ni acquittements, ni retransmission, ni contrôle de flux ou remise en ordre. Son en-tête ne fait que 8 octets, ce qui le rend léger et adapté aux applications où la rapidité compte davantage qu'une livraison garantie.","tr":"udp","cheat":[{"words":1,"title":"Caractéristiques","rows":[["Connectionless","envoi sans établir de session préalable"],["No reliability","pas de retransmission automatique ni ACK"],["Header","4 champs : source port, destination port, length, checksum"],["Usages cités","streaming, VoIP, gaming, DNS, DHCP, SNMP, TFTP, NTP, Syslog"]]},{"words":1,"title":"Impact sécurité","rows":[["UDP scan","l'absence de réponse peut signifier open OU filtered ; ICMP port unreachable indique clairement fermé"],["Spoofing","sans handshake, l'adresse source est facile à usurper, ce qui facilite les attaques de réflexion/ampli
