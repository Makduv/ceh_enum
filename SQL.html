<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Module 15 — SQL Injection — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"fact_id":"type.inline.blacklist","concept_id":"type.inline.blacklist","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"What security control are in-line SQL comments often used to bypass?","choices":["Simple blacklists","Network segmentation","Disk encryption","MFA tokens"],"answer":"Simple blacklists","explanation":"Inline comments can split keywords to evade simplistic pattern matching.","id":"S01Q01"},{"fact_id":"type.oob.listener","concept_id":"type.oob.listener","variant":1,"category":"Types of SQL Injection","topic":"Out-of-Band","question":"Which command-line tool is used in the course example to listen for an out-of-band HTTP callback?","choices":["rpcinfo","nmap","aircrack-ng","netcat"],"answer":"netcat","explanation":"The example uses nc to listen on the attacker system.","id":"S01Q02"},{"fact_id":"def.select.scope","concept_id":"def.select.scope","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"How can database permissions limit information disclosure from SQLi?","choices":["Use one shared admin account","Grant SELECT only on data the application actually needs","Grant SELECT on every schema","Disable logging"],"answer":"Grant SELECT only on data the application actually needs","explanation":"Narrow data access limits what injected queries can read.","id":"S01Q03"},{"fact_id":"def.validation.content","concept_id":"def.validation.content","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What validation would permit only predefined values such as known country codes or roles?","choices":["URL encoding","Allowlist validation","Dynamic SQL","Case variation"],"answer":"Allowlist validation","explanation":"Allowlisting explicitly defines acceptable content.","id":"S01Q04"},{"fact_id":"con.info.3","concept_id":"con.info.3","variant":1,"category":"SQL Injection Concepts","topic":"Information Gathering","question":"Which database detail reveals accounts that may own useful privileges?","choices":["Database users","Output mechanism","Database version","OS interaction level"],"answer":"Database users","explanation":"Database users is explicitly listed as useful SQL injection reconnaissance information.","id":"S01Q05"},{"fact_id":"eva.frag.order.4","concept_id":"eva.frag.order.4","variant":1,"category":"Evasion & Detection","topic":"IP Fragmentation","question":"Which evasion pattern sends fragments in an arbitrary order?","choices":["Reverse order","Normal order","Random/out-of-order","Last fragment first"],"answer":"Random/out-of-order","explanation":"The course lists this as an IP-fragmentation evasion pattern.","id":"S01Q06"},{"fact_id":"def.os.priv","concept_id":"def.os.priv","variant":1,"category":"SQL Injection Countermeasures","topic":"Privileges","question":"What control limits the impact of xp_cmdshell or UDF-based OS interaction?","choices":["Increase database timeout","Restrict DBMS service privileges","Allow all file writes","Expose detailed errors"],"answer":"Restrict DBMS service privileges","explanation":"Restricting service privileges limits host-level actions even if a database feature is abused.","id":"S01Q07"},{"fact_id":"con.query.dynamic","concept_id":"con.query.dynamic","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"Why is dynamically building SQL with raw user input dangerous?","choices":["Input can alter SQL syntax and logic","It disables HTTP","It forces DNS recursion","It changes the network MTU"],"answer":"Input can alter SQL syntax and logic","explanation":"Concatenation can turn user data into executable SQL syntax.","id":"S01Q08"},{"fact_id":"con.error.generic2","concept_id":"con.error.generic2","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What security benefit does a generic application error page provide?","choices":["It fixes unsafe query concatenation","It hides DBMS-specific details from the client","It disables all SQL errors internally","It grants least privilege"],"answer":"It hides DBMS-specific details from the client","explanation":"Generic errors reduce information leakage but do not fix the underlying injection flaw.","id":"S01Q09"},{"fact_id":"eva.regex.sxp","concept_id":"eva.regex.sxp","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which procedure-name prefixes are targeted by `(s|x)p\\w+` in the MSSQL regex?","choices":["sp and xp","sys and pg","utl and dbms","fn and vw"],"answer":"sp and xp","explanation":"The expression is designed to match stored/extended procedures beginning with sp or xp.","id":"S01Q10"},{"fact_id":"con.comment.dash","concept_id":"con.comment.dash","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which SQL sequence comments out the remainder of a line in the classic login-bypass example?","choices":["@@","# only in every DBMS","/* */","--"],"answer":"--","explanation":"The course uses double dash to ignore the remainder of the query line.","id":"S01Q11"},{"fact_id":"meth.os.shell","concept_id":"meth.os.shell","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"What is the second DBMS-to-OS interaction method listed in the course?","choices":["Enumerate columns","Direct command execution via remote shell","Read/write system files","Create database users"],"answer":"Direct command execution via remote shell","explanation":"The course lists direct command execution via remote shell as the other OS interaction path.","id":"S01Q12"},{"fact_id":"type.blind.len","concept_id":"type.blind.len","variant":1,"category":"Types of SQL Injection","topic":"Blind Extraction","question":"What database property is tested before extracting a username character by character in the course example?","choices":["TCP window size","Username length","TLS key length","DNS TTL"],"answer":"Username length","explanation":"The example first checks LEN(USER) before probing individual characters.","id":"S01Q13"},{"fact_id":"meth.acct.mysql.table","concept_id":"meth.acct.mysql.table","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Account Creation","question":"Which MySQL system table is directly modified in the course account-creation example?","choices":["mysql.user","all_tab_columns","sys.sysdatabases","information_schema.columns"],"answer":"mysql.user","explanation":"The MySQL example inserts directly into mysql.user.","id":"S01Q14"},{"fact_id":"meth.phase.launchpurpose","concept_id":"meth.phase.launchpurpose","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"What is the purpose of the attack phase after vulnerability confirmation?","choices":["Only capture Wi-Fi traffic","Extract, modify, or manipulate database data","Only enumerate DNS records","Only identify the web server version"],"answer":"Extract, modify, or manipulate database data","explanation":"Once injection is confirmed, attacks can retrieve or alter database data.","id":"S01Q15"},{"fact_id":"con.rce.impact","concept_id":"con.rce.impact","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQLi impact is involved when xp_cmdshell executes host commands?","choices":["Remote Code Execution","Authentication and Authorization Bypass","Compromised Integrity and Availability of Data","Information Disclosure"],"answer":"Remote Code Execution","explanation":"OS command execution is remote code execution impact.","id":"S01Q16"},{"fact_id":"def.webconfig.secret2","concept_id":"def.webconfig.secret2","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"Which type of data is especially dangerous to leave in web configuration files?","choices":["Image dimensions","HTML titles","Public CSS classes","Database credentials"],"answer":"Database credentials","explanation":"Exposed DB credentials can turn file disclosure into database compromise.","id":"S01Q17"},{"fact_id":"type.inline.version","concept_id":"type.inline.version","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"What additional information can comment behavior sometimes help determine?","choices":["Wi-Fi channel","Browser font","Switch model only","Database version"],"answer":"Database version","explanation":"The course notes in-line comments can help determine DB versions.","id":"S01Q18"},{"fact_id":"def.siem.log","concept_id":"def.siem.log","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What should detection logs capture to support SQLi investigation?","choices":["The suspicious request and relevant application/database context","Only the browser theme","Only CPU temperature","Only DNS TTL"],"answer":"The suspicious request and relevant application/database context","explanation":"Useful logs preserve evidence needed to understand the attempted injection.","id":"S01Q19"},{"fact_id":"meth.pass.like","concept_id":"meth.pass.like","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Data Extraction","question":"Which SQL operator is used in the course to test password prefixes character by character?","choices":["LIKE","COMMIT","GRANT","UNION"],"answer":"LIKE","explanation":"LIKE can test whether a password matches a candidate prefix.","id":"S01Q20"},{"fact_id":"type.piggy.def","concept_id":"type.piggy.def","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Which SQL injection technique appends an additional statement to the original statement?","choices":["Error-based SQL Injection","Illegal/Logically Incorrect Query","UNION SQL Injection","Piggybacked Query"],"answer":"Piggybacked Query","explanation":"Piggybacked/stacked queries execute an additional SQL statement after the original one.","id":"S01Q21"},{"fact_id":"type.heavy.delayfunc","concept_id":"type.heavy.delayfunc","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Does a heavy-query blind technique require WAITFOR/SLEEP-style functions?","choices":["No","Only on MySQL","Only on Oracle","Yes"],"answer":"No","explanation":"Heavy queries create computational delay without explicit sleep functions.","id":"S01Q22"},{"fact_id":"con.impact.1","concept_id":"con.impact.1","variant":1,"category":"SQL Injection Concepts","topic":"Impacts","question":"Which SQL injection impact lets an attacker bypass a login or access-control check?","choices":["Information Disclosure","Remote Code Execution","Compromised Integrity and Availability of Data","Authentication and Authorization Bypass"],"answer":"Authentication and Authorization Bypass","explanation":"Authentication and Authorization Bypass is one of the four SQL injection impacts listed in the course.","id":"S01Q23"},{"fact_id":"meth.err.sysobjects","concept_id":"meth.err.sysobjects","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Error-based Extraction","question":"Which MSSQL system object is queried to enumerate table names in the course example?","choices":["syscat.columns","syscolumns","all_tab_columns","sysobjects"],"answer":"sysobjects","explanation":"The example queries sysobjects for table names.","id":"S01Q24"},{"fact_id":"eva.tech.12","concept_id":"eva.tech.12","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique splits the attack across multiple IP fragments?","choices":["Hex Encoding","String Concatenation","IP Fragmentation","Case Variation"],"answer":"IP Fragmentation","explanation":"IP Fragmentation is the course technique that splits the attack across multiple IP fragments.","id":"S01Q25"},{"fact_id":"eva.detect.decode","concept_id":"eva.detect.decode","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why should a detector normalize or decode input before signature matching?","choices":["Encoded variants may represent the same SQL tokens","Decoding disables logs","Encoding changes the database engine","Decoding increases DB privileges"],"answer":"Encoded variants may represent the same SQL tokens","explanation":"Normalization reduces bypasses based solely on alternate representations.","id":"S01Q26"},{"fact_id":"meth.err.infoschema","concept_id":"meth.err.infoschema","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Error-based Extraction","question":"Which schema view is queried to enumerate column names in the example?","choices":["all_users","sys.sysdatabases","information_schema.columns","mysql.user"],"answer":"information_schema.columns","explanation":"information_schema.columns provides column metadata.","id":"S01Q27"},{"fact_id":"meth.dbms.utl","concept_id":"meth.dbms.utl","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"Which DBMS is associated with UTL_HTTP for out-of-band requests?","choices":["Oracle","DB2","MySQL","PostgreSQL"],"answer":"Oracle","explanation":"UTL_HTTP is an Oracle package.","id":"S01Q28"},{"fact_id":"def.input.reject","concept_id":"def.input.reject","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"Which input elements should be rejected when they are not expected?","choices":["Valid usernames","Binary data, escapes, and comment characters","TLS records","HTTP status codes"],"answer":"Binary data, escapes, and comment characters","explanation":"The checklist explicitly calls out binary data, escape sequences, and comment characters.","id":"S01Q29"},{"fact_id":"def.config.secret","concept_id":"def.config.secret","variant":1,"category":"SQL Injection Countermeasures","topic":"Configuration","question":"Why should secrets not be stored in exposed web configuration files?","choices":["It increases CPU usage","It changes SQL syntax","Disclosure can reveal database credentials or sensitive settings","It disables indexes"],"answer":"Disclosure can reveal database credentials or sensitive settings","explanation":"Configuration disclosure can turn a web compromise into database access.","id":"S01Q30"},{"fact_id":"con.same.channel","concept_id":"con.same.channel","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What does “in-band” mean in SQL injection?","choices":["Attack and results always use DNS","No database is involved","Only timing is observable","Attack and results use the same communication channel"],"answer":"Attack and results use the same communication channel","explanation":"In-band SQLi uses the same channel for requests and results.","id":"S01Q31"},{"fact_id":"def.abstraction","concept_id":"def.abstraction","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What software design layer can centralize secure database access rules?","choices":["ARP cache","Packet filter","Data access abstraction layer","DNS resolver"],"answer":"Data access abstraction layer","explanation":"A data access abstraction layer can enforce consistent secure access patterns.","id":"S01Q32"},{"fact_id":"con.classmember.1","concept_id":"con.classmember.1","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes Error-based SQL Injection?","choices":["In-band SQL Injection","Blind/Inferential SQL Injection","Not a SQL injection class","Out-of-Band SQL Injection"],"answer":"In-band SQL Injection","explanation":"Error-based SQL Injection is classified under In-band SQL Injection in the course diagram.","id":"S01Q33"},{"fact_id":"eva.tech.5","concept_id":"eva.tech.5","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique inserts or changes whitespace between SQL keywords?","choices":["Char Encoding","Null Byte","Manipulating White Spaces","Hex Encoding"],"answer":"Manipulating White Spaces","explanation":"Manipulating White Spaces is the course technique that inserts or changes whitespace between SQL keywords.","id":"S01Q34"},{"fact_id":"type.oob.func","concept_id":"type.oob.func","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"Why are database email, DNS, file, or HTTP features relevant to OOB SQLi?","choices":["They disable user privileges","They hide every error","They can cause externally observable communication","They automatically parameterize queries"],"answer":"They can cause externally observable communication","explanation":"Network-capable DBMS features can exfiltrate data outside the normal application channel.","id":"S01Q35"},{"fact_id":"def.validation.type","concept_id":"def.validation.type","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What validation would reject alphabetic input in an integer-only field?","choices":["MAC filtering","Type validation","TLS inspection","DNS validation"],"answer":"Type validation","explanation":"Type validation enforces the expected data type.","id":"S01Q36"},{"fact_id":"con.sqlmeta.quote","concept_id":"con.sqlmeta.quote","variant":1,"category":"SQL Injection Concepts","topic":"SQL Semantics","question":"Why is a single quote important during SQLi testing?","choices":["It starts a TCP session","It can terminate a string literal","It creates a VLAN","It signs a certificate"],"answer":"It can terminate a string literal","explanation":"Breaking out of a quoted string is a common way to alter SQL syntax.","id":"S01Q37"},{"fact_id":"meth.passgrab.goal","concept_id":"meth.passgrab.goal","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Advanced SQLi","question":"What is the objective of password-grabbing SQL injection?","choices":["Change DNS TTLs","Capture Wi-Fi handshakes","Extract passwords from database tables","Enumerate SNMP MIBs"],"answer":"Extract passwords from database tables","explanation":"Password grabbing targets credential data stored in application/database tables.","id":"S01Q38"},{"fact_id":"eva.regex.wordchars","concept_id":"eva.regex.wordchars","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"What does `\\w+` represent at the end of the MSSQL procedure-detection regex?","choices":["A URL-encoded quote","One or more whitespace characters","An IP fragment offset","One or more word characters in the procedure name"],"answer":"One or more word characters in the procedure name","explanation":"`\\w+` matches the remaining word characters in the procedure name.","id":"S01Q39"},{"fact_id":"eva.tech.9","concept_id":"eva.tech.9","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique places %00 before a string to bypass detection?","choices":["Declare Variables","Sophisticated Matches","Null Byte","Case Variation"],"answer":"Null Byte","explanation":"Null Byte is the course technique that places %00 before a string to bypass detection.","id":"S01Q40"},{"fact_id":"type.class.benchmark","concept_id":"type.class.benchmark","variant":1,"category":"Types of SQL Injection","topic":"Technique Recognition","question":"A vulnerable MySQL parameter uses BENCHMARK only when a predicate is true. What technique is this?","choices":["Error-based SQL Injection","Boolean Exploitation","Time Delay","Heavy Query"],"answer":"Time Delay","explanation":"BENCHMARK creates a timing side channel.","id":"S01Q41"},{"fact_id":"eva.meta.10","concept_id":"eva.meta.10","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded r/r in the SQLi detection reference?","choices":["%72/%52","%2F","%3C","%27"],"answer":"%72/%52","explanation":"%72/%52 is listed as the encoded r/r representation.","id":"S01Q42"},{"fact_id":"con.classmember.4","concept_id":"con.classmember.4","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes End-of-Line Comment?","choices":["Not a SQL injection class","In-band SQL Injection","Out-of-Band SQL Injection","Blind/Inferential SQL Injection"],"answer":"In-band SQL Injection","explanation":"End-of-Line Comment is classified under In-band SQL Injection in the course diagram.","id":"S01Q43"},{"fact_id":"type.taut.auth","concept_id":"type.taut.auth","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What security control is most directly bypassed by a tautology such as OR 1=1 in a login query?","choices":["TLS certificate validation","Network segmentation","Authentication check","DNSSEC"],"answer":"Authentication check","explanation":"An always-true WHERE clause can bypass vulnerable login logic.","id":"S01Q44"},{"fact_id":"meth.cols.pg","concept_id":"meth.cols.pg","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS Enumeration","question":"Which PostgreSQL catalog objects are joined to enumerate column names in the course example?","choices":["pg_class and pg_attribute","all_users and DUAL","mysql.user and mysql.db","sysobjects and syscolumns"],"answer":"pg_class and pg_attribute","explanation":"The PostgreSQL example joins pg_class and pg_attribute.","id":"S01Q45"},{"fact_id":"eva.meta.14","concept_id":"eva.meta.14","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to whitespace regex class in the SQLi detection reference?","choices":["%3D","\\s","%2D","%2F"],"answer":"\\s","explanation":"\\s is listed as the whitespace regex class representation.","id":"S01Q46"},{"fact_id":"eva.sig.reason","concept_id":"eva.sig.reason","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Why are SQL injection evasion techniques effective against simple signature-based IDS rules?","choices":["They disable TCP checksums","They alter the attack string without changing its meaning","They force TLS 1.3","They remove the database entirely"],"answer":"They alter the attack string without changing its meaning","explanation":"Obfuscation changes the textual representation that signatures expect.","id":"S01Q47"},{"fact_id":"def.validation.length","concept_id":"def.validation.length","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What validation would reject an input that exceeds the maximum allowed number of characters?","choices":["Length/size validation","DNSSEC validation","Route validation","Certificate pinning"],"answer":"Length/size validation","explanation":"Input limits prevent oversized and malformed data.","id":"S01Q48"},{"fact_id":"type.illegal.goal","concept_id":"type.illegal.goal","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Which technique intentionally sends malformed SQL to reveal database structure through errors?","choices":["Error-based SQL Injection","Illegal/Logically Incorrect Query","In-line Comments","Tautology"],"answer":"Illegal/Logically Incorrect Query","explanation":"Invalid queries can expose schema or syntax details in error messages.","id":"S01Q49"},{"fact_id":"meth.sqlmap.u","concept_id":"meth.sqlmap.u","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"Which sqlmap option identifies the target URL in the course examples?","choices":["-D","-u","-T","--dbs"],"answer":"-u","explanation":"`-u` specifies the target URL.","id":"S01Q50"}],[{"fact_id":"type.taut.vsunion","concept_id":"type.taut.vsunion","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What is the main purpose difference between a tautology and UNION-based SQLi?","choices":["UNION only bypasses authentication","Tautology uses DNS; UNION uses ICMP","Tautology changes logic; UNION retrieves additional rows","Tautology is out-of-band"],"answer":"Tautology changes logic; UNION retrieves additional rows","explanation":"They target different parts of query behavior.","id":"S02Q01"},{"fact_id":"con.impact.4","concept_id":"con.impact.4","variant":1,"category":"SQL Injection Concepts","topic":"Impacts","question":"Which SQL injection impact can extend from database compromise to executing commands on the host?","choices":["Authentication and Authorization Bypass","Information Disclosure","Remote Code Execution","Compromised Integrity and Availability of Data"],"answer":"Remote Code Execution","explanation":"Remote Code Execution is one of the four SQL injection impacts listed in the course.","id":"S02Q02"},{"fact_id":"type.blind.binaryrange","concept_id":"type.blind.binaryrange","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What does binary search optimize during blind extraction?","choices":["The database port","The number of probes needed to identify a character","The HTTP method","The SQL comment style"],"answer":"The number of probes needed to identify a character","explanation":"Binary search narrows candidate character values efficiently.","id":"S02Q03"},{"fact_id":"eva.enc.2","concept_id":"eva.enc.2","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which URL-encoded value represents the hash character?","choices":["%3C","%23","%3D","%27"],"answer":"%23","explanation":"%23 is the encoded hash character in the course reference.","id":"S02Q04"},{"fact_id":"def.debug","concept_id":"def.debug","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What should happen to code tracing and debug messages before production deployment?","choices":["Remove or disable them","Convert them to SQL comments","Store them in cookies","Expose them publicly"],"answer":"Remove or disable them","explanation":"Verbose debug output can disclose sensitive information useful to attackers.","id":"S02Q05"},{"fact_id":"def.dynamic.avoid","concept_id":"def.dynamic.avoid","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What query-construction practice should be avoided with user-controlled values?","choices":["Prepared statements","Dynamic SQL concatenation","Stored procedures with parameters","Parameter binding"],"answer":"Dynamic SQL concatenation","explanation":"String concatenation can mix data with executable SQL.","id":"S02Q06"},{"fact_id":"type.blind.infer","concept_id":"type.blind.infer","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Which SQL injection type recovers information by asking true/false questions?","choices":["Error-based SQL Injection","Out-of-Band SQL Injection","In-band SQL Injection","Blind/Inferential SQL Injection"],"answer":"Blind/Inferential SQL Injection","explanation":"Blind SQLi infers results from response differences or timing.","id":"S02Q07"},{"fact_id":"meth.xpcmd.enable","concept_id":"meth.xpcmd.enable","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"What prerequisite is implied before xp_cmdshell can execute host commands?","choices":["The query uses UNION","The client uses Firefox","The feature is enabled and the account has sufficient privileges","DNSSEC is disabled"],"answer":"The feature is enabled and the account has sufficient privileges","explanation":"xp_cmdshell use depends on configuration and privileges.","id":"S02Q08"},{"fact_id":"def.param.data","concept_id":"def.param.data","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"What should happen to user-supplied values in a parameterized query?","choices":["Store them in headers","Convert them into comments","Bind them as parameters","Concatenate them into SQL text"],"answer":"Bind them as parameters","explanation":"Parameter binding treats values as data.","id":"S02Q09"},{"fact_id":"eva.sig.db","concept_id":"eva.sig.db","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What does a signature-based IDS compare incoming strings against?","choices":["A database of known attack signatures","The DHCP lease file","The routing table","The ARP cache"],"answer":"A database of known attack signatures","explanation":"The course describes signature-based IDS as matching inputs against known SQLi attack strings.","id":"S02Q10"},{"fact_id":"meth.dbms.xpdirtree","concept_id":"meth.dbms.xpdirtree","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"Which DBMS is associated with xp_dirtree for DNS-based out-of-band activity?","choices":["MSSQL","DB2","MySQL","Oracle"],"answer":"MSSQL","explanation":"xp_dirtree is a SQL Server extended procedure.","id":"S02Q11"},{"fact_id":"def.dsss.params","concept_id":"def.dsss.params","variant":1,"category":"SQL Injection Countermeasures","topic":"Detection Tools","question":"What request parameters does DSSS scan for SQL injection?","choices":["SMTP and IMAP","GET and POST","ARP and ICMP","DNS and DHCP"],"answer":"GET and POST","explanation":"DSSS is described as a GET/POST parameter scanner.","id":"S02Q12"},{"fact_id":"def.ids.limit","concept_id":"def.ids.limit","variant":1,"category":"SQL Injection Countermeasures","topic":"Detection vs Prevention","question":"Does deploying an IDS remove the need to fix vulnerable SQL query construction?","choices":["Only if signatures are current","Yes","Only on internal apps","No"],"answer":"No","explanation":"Detection is supplemental; the vulnerable code must still be corrected.","id":"S02Q13"},{"fact_id":"meth.phase.detectpurpose","concept_id":"meth.phase.detectpurpose","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"What is the purpose of the initial SQL injection detection phase?","choices":["Identify injectable inputs and backend behavior","Immediately create OS accounts","Disable database logging","Delete all tables"],"answer":"Identify injectable inputs and backend behavior","explanation":"Initial testing maps inputs, DBMS behavior, and vulnerability evidence.","id":"S02Q14"},{"fact_id":"con.classmember.3","concept_id":"con.classmember.3","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes Tautology?","choices":["Out-of-Band SQL Injection","Blind/Inferential SQL Injection","Not a SQL injection class","In-band SQL Injection"],"answer":"In-band SQL Injection","explanation":"Tautology is classified under In-band SQL Injection in the course diagram.","id":"S02Q15"},{"fact_id":"con.trigger.event","concept_id":"con.trigger.event","variant":1,"category":"SQL Injection Concepts","topic":"Database Backdoors","question":"Which events are used by the course example to activate the malicious trigger?","choices":["SELECT only","INSERT or UPDATE","DNS lookup","TCP handshake"],"answer":"INSERT or UPDATE","explanation":"The example trigger executes after INSERT or UPDATE on the target table.","id":"S02Q16"},{"fact_id":"type.blind.timecost","concept_id":"type.blind.timecost","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"Why is blind SQL injection generally time-intensive?","choices":["Every request needs a new DNS zone","Each recovered bit or character requires additional probes","TLS keys must be regenerated","The database must reboot after each query"],"answer":"Each recovered bit or character requires additional probes","explanation":"Blind extraction requires many iterative true/false or timing checks.","id":"S02Q17"},{"fact_id":"meth.json.comment","concept_id":"meth.json.comment","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Alternate Inputs","question":"What SQL syntax in a JSON field can remove the password comparison from the resulting query?","choices":["GRANT CONNECT","UNION only","-- comment","ROLLBACK"],"answer":"-- comment","explanation":"The example injects a comment marker after the username value.","id":"S02Q18"},{"fact_id":"eva.regex.execspace","concept_id":"eva.regex.execspace","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"What can appear between `exec` and an MSSQL procedure name in the course detection regex?","choices":["Only commas","Only colons","Only null bytes","Whitespace or plus signs"],"answer":"Whitespace or plus signs","explanation":"The regex uses `(\\s|\\+)+` after exec.","id":"S02Q19"},{"fact_id":"con.leastpriv.reason","concept_id":"con.leastpriv.reason","variant":1,"category":"SQL Injection Concepts","topic":"Privileges","question":"Why does least privilege reduce SQL injection impact?","choices":["The network stops routing packets","The SQL parser stops accepting quotes","The application DB account has fewer allowed actions","The browser disables JavaScript"],"answer":"The application DB account has fewer allowed actions","explanation":"Least privilege limits what a successful injection can read, modify, or execute.","id":"S02Q20"},{"fact_id":"type.boolean.nodelay","concept_id":"type.boolean.nodelay","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Does Boolean-based blind SQL injection require an explicit delay function?","choices":["No","Only on MSSQL","Yes","Only on Oracle"],"answer":"No","explanation":"Boolean-based inference can use page differences without timing functions.","id":"S02Q21"},{"fact_id":"meth.errorprobe","concept_id":"meth.errorprobe","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Discovery","question":"What is the purpose of injecting malformed input during SQLi testing?","choices":["Renew the TLS certificate","Change the MAC address","Start a VPN tunnel","Trigger informative database errors"],"answer":"Trigger informative database errors","explanation":"Errors can reveal query structure, DBMS type, or vulnerable input handling.","id":"S02Q22"},{"fact_id":"type.blind.binary","concept_id":"type.blind.binary","variant":1,"category":"Types of SQL Injection","topic":"Blind Extraction","question":"Why can binary search reduce the number of blind requests per character?","choices":["It halves the possible character range on each probe","It uses UNION output","It disables database logging","It skips authentication"],"answer":"It halves the possible character range on each probe","explanation":"Binary search narrows the candidate range faster than testing every value sequentially.","id":"S02Q23"},{"fact_id":"meth.tool.zap","concept_id":"meth.tool.zap","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Detection Tools","question":"Which integrated web security tool provides both automated and manual scanning for SQL injection?","choices":["Tamper Dev","OWASP ZAP","jSQL Injection","sqlmap"],"answer":"OWASP ZAP","explanation":"OWASP ZAP is listed as an integrated pentest tool with automated and manual scanners.","id":"S02Q24"},{"fact_id":"eva.detect.case","concept_id":"eva.detect.case","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why should SQLi detection be case-insensitive?","choices":["SQL keywords may be mixed-case without changing meaning","Only Oracle uses lowercase","HTTP blocks lowercase","SQL is always case-sensitive"],"answer":"SQL keywords may be mixed-case without changing meaning","explanation":"Case variation is a listed evasion technique.","id":"S02Q25"},{"fact_id":"meth.trigger.ddl","concept_id":"meth.trigger.ddl","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Database Backdoors","question":"Which SQL statement creates a persistent trigger-based database backdoor?","choices":["WAITFOR","SELECT","CREATE TRIGGER","SHOW COLUMNS"],"answer":"CREATE TRIGGER","explanation":"A trigger is created with CREATE TRIGGER syntax.","id":"S02Q26"},{"fact_id":"def.escapecontext","concept_id":"def.escapecontext","variant":1,"category":"SQL Injection Countermeasures","topic":"Escaping","question":"Why must escaping be specific to the target SQL interpreter?","choices":["Escaping changes network ports","Escaping only affects HTML","Escaping rules differ by context and DBMS","All DBMS use identical syntax"],"answer":"Escaping rules differ by context and DBMS","explanation":"Generic encoding is not a substitute for context-aware escaping.","id":"S02Q27"},{"fact_id":"con.error.leak","concept_id":"con.error.leak","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What makes verbose conversion errors especially useful to an attacker?","choices":["They disable SQL parsing","They force password rotation","They can echo attacker-selected database values","They close the TCP session"],"answer":"They can echo attacker-selected database values","explanation":"Error-based extraction deliberately causes errors that contain selected values.","id":"S02Q28"},{"fact_id":"def.static.dynamic","concept_id":"def.static.dynamic","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why combine static source analysis with black-box testing?","choices":["Both do exactly the same thing","One inspects code paths while the other verifies runtime behavior","Static analysis sends live payloads","Black-box testing reads source code"],"answer":"One inspects code paths while the other verifies runtime behavior","explanation":"The methods observe different aspects of the application.","id":"S02Q29"},{"fact_id":"eva.tech.2","concept_id":"eva.tech.2","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique uses a built-in CHAR function to represent characters?","choices":["Hex Encoding","Char Encoding","URL Encoding","Obfuscated Code"],"answer":"Char Encoding","explanation":"Char Encoding is the course technique that uses a built-in CHAR function to represent characters.","id":"S02Q30"},{"fact_id":"con.proc.dynamic","concept_id":"con.proc.dynamic","variant":1,"category":"SQL Injection Concepts","topic":"Stored Procedures","question":"What makes a stored procedure vulnerable to SQL injection?","choices":["It is stored on disk","It uses a transaction","It dynamically concatenates unsanitized input","It has a name longer than eight characters"],"answer":"It dynamically concatenates unsanitized input","explanation":"Stored procedures are not inherently safe if they build dynamic SQL from untrusted input.","id":"S02Q31"},{"fact_id":"type.oob.mssql","concept_id":"type.oob.mssql","variant":1,"category":"Types of SQL Injection","topic":"Out-of-Band","question":"Which MSSQL feature is used in the course to trigger DNS requests for out-of-band SQL injection?","choices":["UTL_HTTP","OPENROWSET","xp_dirtree","xp_cmdshell"],"answer":"xp_dirtree","explanation":"xp_dirtree can be abused to cause DNS lookups to an attacker-controlled system.","id":"S02Q32"},{"fact_id":"con.headers","concept_id":"con.headers","variant":1,"category":"SQL Injection Concepts","topic":"Detection Concepts","question":"Which non-form input can also carry SQL injection if it is stored or queried unsafely?","choices":["HTTP headers","Ethernet preamble","Wi-Fi beacons","TCP window scale only"],"answer":"HTTP headers","explanation":"The course lists User-Agent, Referer, Cookie, and other headers as SQL injection vectors when unsafely processed.","id":"S02Q33"},{"fact_id":"meth.sqlmap.T","concept_id":"meth.sqlmap.T","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"Which sqlmap option selects a specific table?","choices":["-T","--dbs","-u","-D"],"answer":"-T","explanation":"`-T` selects the table.","id":"S02Q34"},{"fact_id":"con.perm.insert","concept_id":"con.perm.insert","variant":1,"category":"SQL Injection Concepts","topic":"Privileges","question":"What determines whether an injected INSERT statement can add a new database user row?","choices":["Web server privileges","Database account privileges","DNS resolver privileges","Browser privileges"],"answer":"Database account privileges","explanation":"The injected SQL executes with the privileges of the database account used by the application.","id":"S02Q35"},{"fact_id":"type.oob.neednet","concept_id":"type.oob.neednet","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What capability must the database server have for DNS/HTTP out-of-band extraction?","choices":["A wireless interface","Client-side JavaScript only","Outbound network connectivity","A visible UNION result"],"answer":"Outbound network connectivity","explanation":"OOB callbacks require the database host to reach attacker-controlled infrastructure.","id":"S02Q36"},{"fact_id":"con.app.dbaccount","concept_id":"con.app.dbaccount","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"Under whose database privileges does injected SQL normally execute?","choices":["The DNS server account","The browser user account","The application database account","The switch management account"],"answer":"The application database account","explanation":"The application’s DB connection determines available privileges.","id":"S02Q37"},{"fact_id":"type.time.conditional","concept_id":"type.time.conditional","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What must control the delay for time-based blind SQL injection to reveal one bit of information?","choices":["The HTTP User-Agent","The network MTU","A true/false SQL condition","The client clock only"],"answer":"A true/false SQL condition","explanation":"The server delays only when the tested predicate evaluates as intended.","id":"S02Q38"},{"fact_id":"def.ids.layered","concept_id":"def.ids.layered","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why use network, host, and application detection together?","choices":["Application logging is useless","Only HIDS sees HTTP","Only network IDS sees SQL text","Different layers can observe different SQLi indicators"],"answer":"Different layers can observe different SQLi indicators","explanation":"Layered monitoring improves coverage across attack stages.","id":"S02Q39"},{"fact_id":"def.tool.dsss","concept_id":"def.tool.dsss","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"Which tool is described as a small GET/POST SQL injection parameter scanner?","choices":["Tamper Dev","blind_sql_bitshifting","DSSS","OWASP ZAP"],"answer":"DSSS","explanation":"DSSS scans GET and POST parameters for SQL injection.","id":"S02Q40"},{"fact_id":"eva.enc.7","concept_id":"eva.enc.7","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which URL-encoded value represents the slash?","choices":["%3E","%23","%3B","%2F"],"answer":"%2F","explanation":"%2F is the encoded slash in the course reference.","id":"S02Q41"},{"fact_id":"def.insert.priv","concept_id":"def.insert.priv","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What hardening principle prevents a read-only web app from creating attacker-controlled rows?","choices":["Do not grant INSERT when it is unnecessary","Run as database owner","Enable stacked queries","Return raw errors"],"answer":"Do not grant INSERT when it is unnecessary","explanation":"Only required write permissions should be granted.","id":"S02Q42"},{"fact_id":"eva.meta.6","concept_id":"eva.meta.6","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded hash in the SQLi detection reference?","choices":["%23","%3B","\\s","%2D"],"answer":"%23","explanation":"%23 is listed as the encoded hash representation.","id":"S02Q43"},{"fact_id":"eva.tech.3","concept_id":"eva.tech.3","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique builds SQL keywords by concatenating text?","choices":["URL Encoding","Case Variation","String Concatenation","Hex Encoding"],"answer":"String Concatenation","explanation":"String Concatenation is the course technique that builds SQL keywords by concatenating text.","id":"S02Q44"},{"fact_id":"type.dist.time.boolean","concept_id":"type.dist.time.boolean","variant":1,"category":"Types of SQL Injection","topic":"Technique Distinctions","question":"Which blind technique uses response latency as the side channel?","choices":["UNION SQL Injection","Time Delay","Error-based SQL Injection","Boolean Exploitation"],"answer":"Time Delay","explanation":"Time-based blind SQLi relies on conditional delays.","id":"S02Q45"},{"fact_id":"meth.quote.long","concept_id":"meth.quote.long","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Black-box Testing","question":"What is the purpose of sending unusually long strings of quote characters during SQLi testing?","choices":["Detect SQL command truncation/modification","Measure network MTU","Trigger ARP poisoning","Enumerate SNMP communities"],"answer":"Detect SQL command truncation/modification","explanation":"Long quote strings can stress REPLACE/QUOTENAME return sizes and expose command truncation behavior.","id":"S02Q46"},{"fact_id":"eva.space.alt","concept_id":"eva.space.alt","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What can whitespace manipulation use instead of one normal space?","choices":["Different or additional whitespace characters","Database roles","DNS resource records","TLS extensions"],"answer":"Different or additional whitespace characters","explanation":"Changing whitespace can defeat signatures expecting fixed spacing.","id":"S02Q47"},{"fact_id":"meth.sqlmap.tablesmeaning","concept_id":"meth.sqlmap.tablesmeaning","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"What does `--tables` ask sqlmap to enumerate?","choices":["Operating-system users","Table names","TLS ciphers","Firewall rules"],"answer":"Table names","explanation":"--tables enumerates tables in the selected database.","id":"S02Q48"},{"fact_id":"eva.frag.sensorview","concept_id":"eva.frag.sensorview","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What is the core goal of IP-fragmentation evasion against an IDS?","choices":["Make the IDS and target reconstruct or time out differently","Disable HTTP","Hide the database name from the application","Change SQL privileges"],"answer":"Make the IDS and target reconstruct or time out differently","explanation":"Evasion exploits inconsistent reassembly behavior or timing.","id":"S02Q49"},{"fact_id":"con.orderby.role","concept_id":"con.orderby.role","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which SQL clause sorts a result set rather than filtering it?","choices":["UNION","ORDER BY","HAVING","WHERE"],"answer":"ORDER BY","explanation":"ORDER BY controls result ordering.","id":"S02Q50"}],[{"fact_id":"meth.sqlmap.dumpmeaning","concept_id":"meth.sqlmap.dumpmeaning","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"What does `--dump` ask sqlmap to do?","choices":["List DNS records","Change SQL port","Create a TLS certificate","Retrieve table data"],"answer":"Retrieve table data","explanation":"--dump extracts records from the selected table.","id":"S03Q01"},{"fact_id":"type.blind.substr","concept_id":"type.blind.substr","variant":1,"category":"Types of SQL Injection","topic":"Blind Extraction","question":"Which SQL function isolates one character at a specific position for blind extraction?","choices":["SUBSTRING","COUNT","GRANT","DROP"],"answer":"SUBSTRING","explanation":"SUBSTRING selects the character at the position being tested.","id":"S03Q02"},{"fact_id":"type.error.goal","concept_id":"type.error.goal","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Which in-band technique deliberately makes the database return useful error messages?","choices":["End-of-Line Comment","System Stored Procedure","Error-based SQL Injection","In-line Comments"],"answer":"Error-based SQL Injection","explanation":"Error-based SQLi extracts information from database error messages.","id":"S03Q03"},{"fact_id":"type.union.require","concept_id":"type.union.require","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What query characteristic is essential for UNION-based extraction?","choices":["Only INSERT is allowed","The original query returns a SELECT result set","The DBMS has no tables","The application never queries the database"],"answer":"The original query returns a SELECT result set","explanation":"UNION combines SELECT result sets.","id":"S03Q04"},{"fact_id":"def.monitor.anomaly","concept_id":"def.monitor.anomaly","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What could application monitoring flag as suspicious SQLi behavior?","choices":["Routine DNS caching","Repeated quote errors, tautology probes, or encoded SQL metacharacters","Normal static image requests only","Valid TLS handshakes only"],"answer":"Repeated quote errors, tautology probes, or encoded SQL metacharacters","explanation":"SQLi testing often creates recognizable error/payload patterns.","id":"S03Q05"},{"fact_id":"type.union.samechannel","concept_id":"type.union.samechannel","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Through what channel are UNION-injected results returned?","choices":["A separate DNS callback","A new SSH session","The normal application response","An ICMP tunnel"],"answer":"The normal application response","explanation":"UNION SQLi is an in-band technique.","id":"S03Q06"},{"fact_id":"meth.group.having","concept_id":"meth.group.having","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Black-box Testing","question":"Which black-box technique uses HAVING errors to reveal ungrouped column names?","choices":["Type Mismatch","Injections in SELECT clause","Grouping Error","Boolean Exploitation"],"answer":"Grouping Error","explanation":"Grouping errors can expose column names through DBMS error messages.","id":"S03Q07"},{"fact_id":"con.countstar","concept_id":"con.countstar","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What does `COUNT(*)` return in a SQL query such as the login example?","choices":["The current user privilege","The number of matching rows","The first matching password","The database name"],"answer":"The number of matching rows","explanation":"COUNT(*) counts rows satisfying the query conditions.","id":"S03Q08"},{"fact_id":"eva.regex.mssql","concept_id":"eva.regex.mssql","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"What MSSQL behavior is targeted by `/exec(\\s|\\+)+(s|x)p\\w+/ix`?","choices":["Oracle HTTP callbacks","UNION column counting","Execution of sp_/xp_ procedures","MySQL BENCHMARK timing"],"answer":"Execution of sp_/xp_ procedures","explanation":"The pattern looks for EXEC followed by stored/extended procedure names beginning with sp or xp.","id":"S03Q09"},{"fact_id":"eva.url.percent","concept_id":"eva.url.percent","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What prefix identifies percent-encoded bytes in URL encoding?","choices":["&","@","#","%"],"answer":"%","explanation":"URL encoding represents code points using percent notation.","id":"S03Q10"},{"fact_id":"type.inband.channel","concept_id":"type.inband.channel","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Which SQL injection type uses the same channel to send the attack and retrieve results?","choices":["Blind/Inferential SQL Injection","Error-based SQL Injection","Out-of-Band SQL Injection","In-band SQL Injection"],"answer":"In-band SQL Injection","explanation":"In-band SQL injection uses the same communication channel for attack and results.","id":"S03Q11"},{"fact_id":"con.trigger.persistence","concept_id":"con.trigger.persistence","variant":1,"category":"SQL Injection Concepts","topic":"Database Backdoors","question":"What database object can automatically run malicious logic after INSERT or UPDATE events?","choices":["Trigger","Column","Database","Row/field value"],"answer":"Trigger","explanation":"A malicious trigger can execute automatically when defined database events occur.","id":"S03Q12"},{"fact_id":"con.perm.os","concept_id":"con.perm.os","variant":1,"category":"SQL Injection Concepts","topic":"Privileges","question":"What limits OS-level impact from SQL injection features such as command execution?","choices":["DNS TTL","HTTP keepalive timeout","Database service privileges","Client screen resolution"],"answer":"Database service privileges","explanation":"OS interaction is constrained by the privileges under which the DBMS or database feature runs.","id":"S03Q13"},{"fact_id":"con.schema.column","concept_id":"con.schema.column","variant":1,"category":"SQL Injection Concepts","topic":"Database Structure","question":"What database object defines a named attribute within a table?","choices":["Database","Table","Row/field value","Column"],"answer":"Column","explanation":"Columns define fields within table rows.","id":"S03Q14"},{"fact_id":"eva.regex.exec","concept_id":"eva.regex.exec","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why does the MSSQL-specific regex look for `exec` followed by `xp` or `sp` procedure names?","choices":["To detect TLS renegotiation","To detect DNS zone transfers","To detect ARP poisoning","To detect suspicious stored/extended procedure execution"],"answer":"To detect suspicious stored/extended procedure execution","explanation":"MSSQL exploitation often invokes stored/extended procedures via EXEC.","id":"S03Q15"},{"fact_id":"meth.header.referer","concept_id":"meth.header.referer","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Alternate Inputs","question":"Which request field can expose the previous page and also become a SQLi vector if stored unsafely?","choices":["Referer","Content-Length only","TCP checksum","ARP target MAC"],"answer":"Referer","explanation":"Referer is listed among SQL-injectable HTTP headers.","id":"S03Q16"},{"fact_id":"eva.enc.5","concept_id":"eva.enc.5","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which URL-encoded value represents the less-than sign?","choices":["%3B","%2F","%3C","%3E"],"answer":"%3C","explanation":"%3C is the encoded less-than sign in the course reference.","id":"S03Q17"},{"fact_id":"def.prepared.effect","concept_id":"def.prepared.effect","variant":1,"category":"SQL Injection Countermeasures","topic":"Parameterized Queries","question":"Why do prepared statements stop attacker input from changing SQL structure?","choices":["Parameters block TCP port 1433","Parameters disable the database listener","Parameters encrypt the whole database","Parameters are treated as data, not SQL code"],"answer":"Parameters are treated as data, not SQL code","explanation":"Parameter binding keeps input separate from executable SQL syntax.","id":"S03Q18"},{"fact_id":"def.log.detail","concept_id":"def.log.detail","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"Where should detailed diagnostic errors be kept for defenders?","choices":["Browser cookies","URL parameters","HTML comments","Protected server-side logs"],"answer":"Protected server-side logs","explanation":"Diagnostics should be available to defenders without exposing them to users.","id":"S03Q19"},{"fact_id":"type.class.multijoin","concept_id":"type.class.multijoin","variant":1,"category":"Types of SQL Injection","topic":"Technique Recognition","question":"A predicate runs expensive joins over system tables to create measurable latency. What technique is this?","choices":["Boolean Exploitation","Heavy Query","Error-based SQL Injection","Time Delay"],"answer":"Heavy Query","explanation":"Heavy-query SQLi uses expensive computation rather than explicit sleep functions.","id":"S03Q20"},{"fact_id":"meth.acct.mssql.sysadmin","concept_id":"meth.acct.mssql.sysadmin","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Account Creation","question":"Which MSSQL server role gives the new login full administrative privileges in the example?","choices":["sysadmin","public","db_datareader","guest"],"answer":"sysadmin","explanation":"The example adds the attacker-created login to the sysadmin role.","id":"S03Q21"},{"fact_id":"def.untrusted.header","concept_id":"def.untrusted.header","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Should HTTP headers such as User-Agent be server-side validated before database use?","choices":["Yes","Only for GET requests","No","Only if HTTPS is disabled"],"answer":"Yes","explanation":"Headers are attacker-controlled input and must be treated as untrusted.","id":"S03Q22"},{"fact_id":"eva.concat.goal","concept_id":"eva.concat.goal","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What does string-concatenation evasion try to avoid placing literally in the request?","choices":["TLS ciphers","Complete SQL keywords","HTTP methods","IP addresses"],"answer":"Complete SQL keywords","explanation":"Concatenation constructs keywords from pieces so simple signatures do not see the full token.","id":"S03Q23"},{"fact_id":"def.prepared","concept_id":"def.prepared","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What is the recommended code-level defense for creating SQL queries with user values?","choices":["Hex encoding","String concatenation","Prepared statements / parameterized queries","Case variation"],"answer":"Prepared statements / parameterized queries","explanation":"Prepared statements separate SQL code from parameter data.","id":"S03Q24"},{"fact_id":"meth.os.revshell","concept_id":"meth.os.revshell","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"What is the purpose of invoking a shell through xp_cmdshell with `/dev/tcp/...` redirection?","choices":["Create a trigger","Perform a DNS zone transfer","Enumerate columns","Create a reverse shell"],"answer":"Create a reverse shell","explanation":"The course example uses xp_cmdshell to start an interactive reverse shell.","id":"S03Q25"},{"fact_id":"con.schema.row","concept_id":"con.schema.row","variant":1,"category":"SQL Injection Concepts","topic":"Database Structure","question":"What is extracted after identifying a target table and column during data retrieval?","choices":["Database","Stored procedure","Row/field value","Trigger"],"answer":"Row/field value","explanation":"After identifying schema objects, the attacker can retrieve actual field values.","id":"S03Q26"},{"fact_id":"meth.replace","concept_id":"meth.replace","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Black-box Testing","question":"Which SQL Server function is mentioned as having a return-size limit that can be stressed with long input?","choices":["COUNT","REPLACE","GRANT","SUBSTRING"],"answer":"REPLACE","explanation":"The course mentions REPLACE return-value limits in SQL modification detection.","id":"S03Q27"},{"fact_id":"type.time.nocontent","concept_id":"type.time.nocontent","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Can time-based blind SQL injection work when page content is identical for true and false results?","choices":["No","Yes","Only with UNION","Only when errors are verbose"],"answer":"Yes","explanation":"Timing can act as the side channel even when content is identical.","id":"S03Q28"},{"fact_id":"type.heavy.use","concept_id":"type.heavy.use","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"When is a heavy-query blind technique especially useful?","choices":["When the page never reaches a database","When UNION output is fully visible","When the DBMS has no tables","When explicit time-delay functions are disabled"],"answer":"When explicit time-delay functions are disabled","explanation":"Heavy queries can create delays without WAITFOR/SLEEP-style functions.","id":"S03Q29"},{"fact_id":"eva.case.filter","concept_id":"eva.case.filter","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"When would case variation fail to evade a SQL keyword filter?","choices":["When the DBMS accepts SQL","When the filter matches case-insensitively","When the request uses POST","When TLS is enabled"],"answer":"When the filter matches case-insensitively","explanation":"A case-insensitive signature sees mixed-case variants as equivalent.","id":"S03Q30"},{"fact_id":"con.delete.role","concept_id":"con.delete.role","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which SQL statement removes rows from a table?","choices":["UPDATE","SELECT","DELETE","INSERT"],"answer":"DELETE","explanation":"DELETE removes rows.","id":"S03Q31"},{"fact_id":"def.delimited","concept_id":"def.delimited","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What is the security concern with heavily relying on quoted/delimited identifiers?","choices":["They force plaintext passwords","They require DNS","They disable SQL permissions","They complicate consistent allowlisting and escaping"],"answer":"They complicate consistent allowlisting and escaping","explanation":"Complex identifier quoting can make validation/escaping rules harder to implement correctly.","id":"S03Q32"},{"fact_id":"type.blind.output","concept_id":"type.blind.output","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Which SQL injection type is used when query results are not directly visible?","choices":["Out-of-Band SQL Injection","In-band SQL Injection","Blind/Inferential SQL Injection","Error-based SQL Injection"],"answer":"Blind/Inferential SQL Injection","explanation":"Blind SQLi infers data without direct result output.","id":"S03Q33"},{"fact_id":"def.allowlist","concept_id":"def.allowlist","variant":1,"category":"SQL Injection Countermeasures","topic":"Input Validation","question":"Which input-validation strategy is strongest when only known values are valid?","choices":["Blocking one dangerous string","Removing spaces only","Case-sensitive blacklist","Allowlisting expected values"],"answer":"Allowlisting expected values","explanation":"Allowlisting defines what is valid rather than trying to enumerate every malicious form.","id":"S03Q34"},{"fact_id":"con.sqlmeta.semicolon","concept_id":"con.sqlmeta.semicolon","variant":1,"category":"SQL Injection Concepts","topic":"SQL Semantics","question":"What does a semicolon commonly separate in SQL when stacked queries are allowed?","choices":["HTTP headers","DNS labels","SQL statements","Ethernet frames"],"answer":"SQL statements","explanation":"A semicolon can separate statements in SQL dialects that permit stacking.","id":"S03Q35"},{"fact_id":"eva.hex.quote","concept_id":"eva.hex.quote","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What filtering problem can hex encoding avoid in the course example?","choices":["ARP requests","DNS TTLs","TCP flags","Literal single quotes"],"answer":"Literal single quotes","explanation":"The example emphasizes that hexadecimal construction can avoid single quotes.","id":"S03Q36"},{"fact_id":"con.inband.commonpair","concept_id":"con.inband.commonpair","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"Which two techniques are identified as the most common in-band SQL injection methods?","choices":["Error-based and UNION","Heavy Query and OOB","Null Byte and Case Variation","Boolean and Time Delay"],"answer":"Error-based and UNION","explanation":"The course explicitly calls error-based and UNION the most common in-band techniques.","id":"S03Q37"},{"fact_id":"eva.detect.hex","concept_id":"eva.detect.hex","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why must a detector consider hex-encoded SQL strings?","choices":["Hex changes TCP ports","Hex can reconstruct dangerous SQL without literal keywords","Hex prevents parsing","Hex disables the database"],"answer":"Hex can reconstruct dangerous SQL without literal keywords","explanation":"Hex encoding is explicitly listed as a signature-evasion technique.","id":"S03Q38"},{"fact_id":"eva.null.position","concept_id":"eva.null.position","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Where is the null byte placed in the course evasion example?","choices":["Inside the TCP header","Before the SQL injection string","After the TLS certificate","After the HTTP body only"],"answer":"Before the SQL injection string","explanation":"The example prefixes the injected SQL with %00.","id":"S03Q39"},{"fact_id":"def.test.auto.manual","concept_id":"def.test.auto.manual","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why combine automated scanning with manual testing?","choices":["They use different database ports","Automation always proves exploitability","Manual testing cannot find SQLi","Automation finds common patterns while humans validate context and edge cases"],"answer":"Automation finds common patterns while humans validate context and edge cases","explanation":"Complementary testing improves coverage and confidence.","id":"S03Q40"},{"fact_id":"meth.sqlmap.techE.semantic","concept_id":"meth.sqlmap.techE.semantic","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS / Tool Semantics","question":"What does sqlmap `--technique=E` select?","choices":["Boolean-based blind only","Out-of-band only","Error-based SQL injection","UNION-only enumeration"],"answer":"Error-based SQL injection","explanation":"The course example uses E to select error-based SQL injection testing.","id":"S03Q41"},{"fact_id":"con.unsanitized","concept_id":"con.unsanitized","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What input weakness allows SQL commands to reach a backend database through a web application?","choices":["Missing ARP entry","Weak Wi-Fi signal","Expired certificate","Unsanitized input"],"answer":"Unsanitized input","explanation":"SQL injection abuses untrusted input that is not safely validated or parameterized.","id":"S03Q42"},{"fact_id":"def.separate","concept_id":"def.separate","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What principle keeps attacker-controlled values from becoming executable SQL?","choices":["Disable logging","Encode all data as Base64","Use longer table names","Keep untrusted data separate from commands and queries"],"answer":"Keep untrusted data separate from commands and queries","explanation":"Separating data from SQL syntax is the core defense.","id":"S03Q43"},{"fact_id":"meth.pg.attnum","concept_id":"meth.pg.attnum","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"What does `attnum > 0` help exclude in the PostgreSQL column-enumeration example?","choices":["All table columns","Non-user/system attribute entries","All network connections","All databases"],"answer":"Non-user/system attribute entries","explanation":"Positive attribute numbers correspond to regular table columns.","id":"S03Q44"},{"fact_id":"con.oob.featuretypes","concept_id":"con.oob.featuretypes","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What kind of DBMS features can enable out-of-band SQL injection?","choices":["Only arithmetic functions","Functions that perform external network/file communication","Only local sorting functions","Only transaction commits"],"answer":"Functions that perform external network/file communication","explanation":"The module mentions email, file, DNS, and HTTP-capable database functionality for OOB communication.","id":"S03Q45"},{"fact_id":"meth.acct.oracle.resource","concept_id":"meth.acct.oracle.resource","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Account Creation","question":"Which Oracle role is also granted in the course account-creation example?","choices":["RESOURCE","public","guest","sysadmin"],"answer":"RESOURCE","explanation":"The example grants RESOURCE in addition to CONNECT.","id":"S03Q46"},{"fact_id":"def.test.blackbox","concept_id":"def.test.blackbox","variant":1,"category":"SQL Injection Countermeasures","topic":"Testing","question":"What testing approach evaluates a running application from the outside without source code knowledge?","choices":["Code formatting","Database backup validation","Static source analysis","Black-box injection testing"],"answer":"Black-box injection testing","explanation":"Black-box testing probes application behavior from an external perspective.","id":"S03Q47"},{"fact_id":"eva.tech.4","concept_id":"eva.tech.4","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique makes the SQL statement intentionally difficult to understand?","choices":["Char Encoding","In-line Comment","Variations","Obfuscated Code"],"answer":"Obfuscated Code","explanation":"Obfuscated Code is the course technique that makes the SQL statement intentionally difficult to understand.","id":"S03Q48"},{"fact_id":"type.oob.channel","concept_id":"type.oob.channel","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Which SQL injection type sends extracted data through a different channel than the original request?","choices":["Error-based SQL Injection","In-band SQL Injection","Blind/Inferential SQL Injection","Out-of-Band SQL Injection"],"answer":"Out-of-Band SQL Injection","explanation":"Out-of-band SQLi uses a secondary channel such as DNS or HTTP callbacks.","id":"S03Q49"},{"fact_id":"meth.os.files","concept_id":"meth.os.files","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"What is one DBMS-to-OS interaction method listed in the course?","choices":["Read/write system files","Direct command execution via remote shell","Enumerate columns","Create database users"],"answer":"Read/write system files","explanation":"SQL injection impact can extend to reading and writing host files when privileges allow it.","id":"S03Q50"}],[{"fact_id":"type.dist.union.error","concept_id":"type.dist.union.error","variant":1,"category":"Types of SQL Injection","topic":"Technique Distinctions","question":"Which in-band technique merges attacker-selected rows into the normal response rather than relying on errors?","choices":["Heavy Query","Error-based SQL Injection","UNION SQL Injection","Out-of-Band SQL Injection"],"answer":"UNION SQL Injection","explanation":"UNION SQLi returns injected rows through the same output channel.","id":"S04Q01"},{"fact_id":"con.piggy.permission","concept_id":"con.piggy.permission","variant":1,"category":"SQL Injection Concepts","topic":"SQL Semantics","question":"What determines whether a piggybacked second statement succeeds?","choices":["The database account privileges and DBMS support","The browser theme","The DNS TTL","The switch port speed"],"answer":"The database account privileges and DBMS support","explanation":"Stacked statements still execute within DBMS capabilities and account privileges.","id":"S04Q02"},{"fact_id":"eva.regex.s","concept_id":"eva.regex.s","variant":1,"category":"Evasion & Detection","topic":"Evasion Und
