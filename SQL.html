ord is hashed twice","The browser ignores JSON","The injected comment removes the password predicate","The server changes database ports"],"answer":"The injected comment removes the password predicate","explanation":"The comment causes the remainder of the SQL query, including the password check, to be ignored.","id":"S04Q07"},{"fact_id":"type.time.signal","concept_id":"type.time.signal","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"Which blind technique infers data from differences in response time?","choices":["Time Delay","Heavy Query","Boolean Exploitation","Error-based SQL Injection"],"answer":"Time Delay","explanation":"Time-based blind SQLi uses conditional delays as the side channel.","id":"S04Q08"},{"fact_id":"def.test.static","concept_id":"def.test.static","variant":1,"category":"SQL Injection Countermeasures","topic":"Testing","question":"What testing approach reviews source code for unsafe query construction?","choices":["Password spraying","Packet capture only","Black-box injection testing","Static source code analysis"],"answer":"Static source code analysis","explanation":"Static analysis can find dangerous concatenation and unsafe database APIs.","id":"S04Q09"},{"fact_id":"def.query.api","concept_id":"def.query.api","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What database API characteristic is preferred for safe query execution?","choices":["Requirement for string concatenation","Verbose error output","Automatic sysadmin privileges","Support for bound parameters"],"answer":"Support for bound parameters","explanation":"Parameter APIs keep SQL syntax and data separate.","id":"S04Q10"},{"fact_id":"eva.meta.3","concept_id":"eva.meta.3","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded single quote in the SQLi detection reference?","choices":["--","%72/%52","%27","%3E"],"answer":"%27","explanation":"%27 is listed as the encoded single quote representation.","id":"S04Q11"},{"fact_id":"type.class.tautlogin","concept_id":"type.class.tautlogin","variant":1,"category":"Types of SQL Injection","topic":"Technique Recognition","question":"The attacker injects an OR expression that is always true to satisfy the WHERE clause. What technique is this?","choices":["UNION SQL Injection","Piggybacked Query","Tautology","System Stored Procedure"],"answer":"Tautology","explanation":"Always-true predicates are tautology attacks.","id":"S04Q12"},{"fact_id":"meth.sqlmap.tables","concept_id":"meth.sqlmap.tables","variant":1,"category":"SQL Injection Methodology & Tools","topic":"sqlmap","question":"Which sqlmap command pattern enumerates tables from a selected database?","choices":["-D dbname -T tablename --dump","--dbs","-D dbname --tables","-D dbname -T tablename --columns"],"answer":"-D dbname --tables","explanation":"`-D` selects the database and `--tables` enumerates its tables.","id":"S04Q13"},{"fact_id":"def.separation.core","concept_id":"def.separation.core","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"What is the core security objective of parameterization and prepared statements?","choices":["Disable logging","Separate code from data","Increase SQL verbosity","Hide the database port"],"answer":"Separate code from data","explanation":"Separating SQL syntax from input prevents input from becoming executable query structure.","id":"S04Q14"},{"fact_id":"meth.acct.mysql.pass","concept_id":"meth.acct.mysql.pass","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Account Creation","question":"Which MySQL function transforms the credential value in the account-creation example?","choices":["DB_NAME()","PASSWORD()","ASCII()","BENCHMARK()"],"answer":"PASSWORD()","explanation":"The example uses PASSWORD() when inserting the new MySQL account.","id":"S04Q15"},{"fact_id":"type.blind.lower","concept_id":"type.blind.lower","variant":1,"category":"Types of SQL Injection","topic":"Blind Extraction","question":"Why is `LOWER()` applied before ASCII comparison in the example?","choices":["Trigger a DNS request","Encrypt the character","Normalize character case","Create a table"],"answer":"Normalize character case","explanation":"LOWER normalizes case so comparisons are more predictable.","id":"S04Q16"},{"fact_id":"def.sanitize","concept_id":"def.sanitize","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What should happen to user input before it is used in unavoidable dynamic SQL?","choices":["Sanitize and validate it","Trust authenticated users","Convert it to lowercase only","Base64-encode it only"],"answer":"Sanitize and validate it","explanation":"Dynamic SQL requires strict sanitization and validation, though parameterization is preferred.","id":"S04Q17"},{"fact_id":"meth.acct.mssql.role","concept_id":"meth.acct.mssql.role","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Account Creation","question":"Which MSSQL procedure adds a login to a server role?","choices":["sp_addlogin","sp_addsrvrolemember","PASSWORD()","CREATE USER"],"answer":"sp_addsrvrolemember","explanation":"sp_addsrvrolemember assigns the new login to a server role.","id":"S04Q18"},{"fact_id":"eva.tech.10","concept_id":"eva.tech.10","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique mixes upper- and lowercase SQL keywords?","choices":["Hex Encoding","String Concatenation","Case Variation","IP Fragmentation"],"answer":"Case Variation","explanation":"Case Variation is the course technique that mixes upper- and lowercase SQL keywords.","id":"S04Q19"},{"fact_id":"def.parameter.quote","concept_id":"def.parameter.quote","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why does parameter binding make attacker-supplied quotes less dangerous?","choices":["The DBMS disables strings","Quotes are removed from the network","Quotes remain part of a data value rather than SQL syntax","The browser encrypts them"],"answer":"Quotes remain part of a data value rather than SQL syntax","explanation":"Bound values are parsed separately from the SQL statement structure.","id":"S04Q20"},{"fact_id":"con.classmember.10","concept_id":"con.classmember.10","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes Boolean Exploitation?","choices":["In-band SQL Injection","Blind/Inferential SQL Injection","Out-of-Band SQL Injection","Not a SQL injection class"],"answer":"Blind/Inferential SQL Injection","explanation":"Boolean Exploitation is classified under Blind/Inferential SQL Injection in the course diagram.","id":"S04Q21"},{"fact_id":"meth.meta.pg.role","concept_id":"meth.meta.pg.role","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS / Tool Semantics","question":"Which PostgreSQL catalog stores attribute/column metadata used in the course enumeration query?","choices":["syscat.columns","pg_attribute","syscolumns","all_tab_columns"],"answer":"pg_attribute","explanation":"The PostgreSQL example joins pg_class and pg_attribute to enumerate table columns.","id":"S04Q22"},{"fact_id":"type.illegal.feedback","concept_id":"type.illegal.feedback","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What is the attacker primarily measuring during logically incorrect-query testing?","choices":["The content of returned error messages","TLS certificate age","Wi-Fi signal strength","ARP cache size"],"answer":"The content of returned error messages","explanation":"Malformed queries are useful because their errors leak parsing/schema information.","id":"S04Q23"},{"fact_id":"con.goal.unauth","concept_id":"con.goal.unauth","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What is a primary goal of SQL injection against a backend database?","choices":["ARP cache poisoning","Unauthorized database access","Wireless deauthentication","TLS certificate pinning"],"answer":"Unauthorized database access","explanation":"SQL injection can be used to gain unauthorized access to a database.","id":"S04Q24"},{"fact_id":"eva.tech.7","concept_id":"eva.tech.7","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique replaces obvious tautologies such as OR 1=1 with alternative equivalent expressions?","choices":["Declare Variables","Char Encoding","Manipulating White Spaces","Sophisticated Matches"],"answer":"Sophisticated Matches","explanation":"Sophisticated Matches is the course technique that replaces obvious tautologies such as OR 1=1 with alternative equivalent expressions.","id":"S04Q25"},{"fact_id":"def.account.selectonly","concept_id":"def.account.selectonly","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What privilege set best follows least privilege for a read-only application?","choices":["Only the required SELECT permissions","INSERT/UPDATE/DELETE on all tables","Database owner","sysadmin"],"answer":"Only the required SELECT permissions","explanation":"Grant only capabilities the application requires.","id":"S04Q26"},{"fact_id":"type.inline.obfuscate","concept_id":"type.inline.obfuscate","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"Why are in-line SQL comments useful for evasion?","choices":["They change IP addresses","They rotate database keys","They disable logs","They break recognizable keyword patterns"],"answer":"They break recognizable keyword patterns","explanation":"Inline comments can split keywords so simple filters miss them.","id":"S04Q27"},{"fact_id":"con.dbpriv.inherit","concept_id":"con.dbpriv.inherit","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What security context governs an injected SELECT, INSERT, or command-execution feature?","choices":["The permissions of the application database connection","The DNS resolver account","The switch port profile","The browser local user"],"answer":"The permissions of the application database connection","explanation":"Injected SQL normally runs with the application DB account privileges.","id":"S04Q28"},{"fact_id":"type.inband.directview","concept_id":"type.inband.directview","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"What characteristic distinguishes in-band extraction from blind inference?","choices":["Only timing is used","The DBMS has no output","Only DNS is used","Results can be returned through the same response channel"],"answer":"Results can be returned through the same response channel","explanation":"In-band techniques can expose results directly through the normal channel.","id":"S04Q29"},{"fact_id":"eva.meta.11","concept_id":"eva.meta.11","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded less-than sign in the SQLi detection reference?","choices":["%6F/%4F","%3D","%3B","%3C"],"answer":"%3C","explanation":"%3C is listed as the encoded less-than sign representation.","id":"S04Q30"},{"fact_id":"def.input.expected","concept_id":"def.input.expected","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"How should string input be accepted when only a known set of values is valid?","choices":["Convert it to uppercase only","Disable TLS","Allow only expected values","Accept everything then log it"],"answer":"Allow only expected values","explanation":"Allow-listing expected values reduces injection risk.","id":"S04Q31"},{"fact_id":"def.code.review","concept_id":"def.code.review","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What coding issue should reviewers look for when auditing SQLi risk?","choices":["Least-privilege accounts","Server-side type validation","Use of prepared statements","String concatenation that mixes untrusted input with SQL"],"answer":"String concatenation that mixes untrusted input with SQL","explanation":"Unsafe concatenation is the central injection pattern.","id":"S04Q32"},{"fact_id":"con.data.disclosure","concept_id":"con.data.disclosure","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQLi impact is involved when an attacker dumps usernames and passwords?","choices":["Information Disclosure","Authentication and Authorization Bypass","Compromised Integrity and Availability of Data","Remote Code Execution"],"answer":"Information Disclosure","explanation":"Dumping confidential records is information disclosure.","id":"S04Q33"},{"fact_id":"type.oob.restrict","concept_id":"type.oob.restrict","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What can prevent out-of-band SQLi even if injection exists?","choices":["Using GET instead of POST","Blocking the DB server from making outbound connections","Changing the page title","Allowing generic errors"],"answer":"Blocking the DB server from making outbound connections","explanation":"Egress restrictions can stop DNS/HTTP callbacks from the database host.","id":"S04Q34"},{"fact_id":"eva.char.avoidliteral","concept_id":"eva.char.avoidliteral","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What does CHAR()-based evasion avoid putting directly in the request?","choices":["Database privileges","Literal target characters","HTTP headers","TCP flags"],"answer":"Literal target characters","explanation":"CHAR can construct characters at execution time.","id":"S04Q35"},{"fact_id":"eva.meta.8","concept_id":"eva.meta.8","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded semicolon in the SQLi detection reference?","choices":["%3B","%3C","--","%3E"],"answer":"%3B","explanation":"%3B is listed as the encoded semicolon representation.","id":"S04Q36"},{"fact_id":"con.like.meaning","concept_id":"con.like.meaning","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What does the SQL `LIKE` operator do in the search-field example?","choices":["Performs pattern matching on text","Joins two result sets","Creates a user account","Executes an OS command"],"answer":"Performs pattern matching on text","explanation":"LIKE compares text against a pattern.","id":"S04Q37"},{"fact_id":"con.query.password","concept_id":"con.query.password","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"In a normal login query, what does `Password=...` represent?","choices":["Comment marker","Username predicate","Password predicate","Boolean operator"],"answer":"Password predicate","explanation":"It constrains the query to the supplied password.","id":"S04Q38"},{"fact_id":"meth.openrowset.remote","concept_id":"meth.openrowset.remote","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"What does the attacker-controlled Address parameter in OPENROWSET identify?","choices":["The HTTP Referer","The local DNS cache","The Oracle SID only","The remote SQL endpoint"],"answer":"The remote SQL endpoint","explanation":"The example points OPENROWSET at the attacker-controlled host.","id":"S04Q39"},{"fact_id":"eva.obf.goal","concept_id":"eva.obf.goal","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What is the defensive weakness targeted by generally obfuscated SQL?","choices":["Network routing","Human/signature readability of the payload","Database backups","TLS key strength"],"answer":"Human/signature readability of the payload","explanation":"Obfuscation makes recognized patterns harder to match or understand.","id":"S04Q40"},{"fact_id":"def.leastpriv","concept_id":"def.leastpriv","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What security principle should govern applications accessing the DBMS?","choices":["Least privilege","Trust on first use","Shared admin account","Open access"],"answer":"Least privilege","explanation":"Least privilege limits what a compromised application account can do.","id":"S04Q41"},{"fact_id":"meth.inputs","concept_id":"meth.inputs","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Discovery","question":"What should be enumerated to identify possible SQL injection entry points?","choices":["Only visible buttons","Only CSS selectors","All input fields","Only TLS ciphers"],"answer":"All input fields","explanation":"Visible and hidden inputs can all become injection points.","id":"S04Q42"},{"fact_id":"type.class.callbackdns","concept_id":"type.class.callbackdns","variant":1,"category":"Types of SQL Injection","topic":"Technique Recognition","question":"The database makes a DNS request to an attacker-controlled host to leak data. What SQLi class is this?","choices":["In-band SQL Injection","Out-of-Band SQL Injection","Error-based SQL Injection","Blind/Inferential SQL Injection"],"answer":"Out-of-Band SQL Injection","explanation":"DNS callbacks use an out-of-band channel.","id":"S04Q43"},{"fact_id":"eva.obfuscation.semantic","concept_id":"eva.obfuscation.semantic","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What must remain unchanged when SQL code is obfuscated for signature evasion?","choices":["Its IP address","Its HTTP port","Its TLS certificate","Its database semantics"],"answer":"Its database semantics","explanation":"Evasion changes representation, not the intended SQL behavior.","id":"S04Q44"},{"fact_id":"eva.tech.11","concept_id":"eva.tech.11","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique constructs the SQL payload through variables?","choices":["Variations","Declare Variables","Obfuscated Code","IP Fragmentation"],"answer":"Declare Variables","explanation":"Declare Variables is the course technique that constructs the SQL payload through variables.","id":"S04Q45"},{"fact_id":"type.eol.password","concept_id":"type.eol.password","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What condition is commonly removed by an end-of-line comment in a login-bypass payload?","choices":["TCP port","TLS cipher","Database name","Password predicate"],"answer":"Password predicate","explanation":"The comment can cause the application-generated password comparison to be ignored.","id":"S04Q46"},{"fact_id":"meth.udf.dll","concept_id":"meth.udf.dll","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"Why does the MySQL UDF example reference a DLL?","choices":["The DLL changes DNS records","The DLL parameterizes SQL","The library provides native functions exposed to MySQL","The DLL stores HTTP cookies"],"answer":"The library provides native functions exposed to MySQL","explanation":"The UDF loads functionality from the referenced shared library.","id":"S04Q47"},{"fact_id":"meth.connectdb","concept_id":"meth.connectdb","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Discovery","question":"What should be confirmed before attempting database-specific SQL injection techniques?","choices":["The server supports Bluetooth","The client uses RDP","The router uses BGP","The web application communicates with a database"],"answer":"The web application communicates with a database","explanation":"SQL injection requires application input to influence database queries.","id":"S04Q48"},{"fact_id":"def.sanitize.notparam","concept_id":"def.sanitize.notparam","variant":1,"category":"SQL Injection Countermeasures","topic":"Parameterized Queries","question":"Which control should be preferred over relying only on sanitization for query construction?","choices":["Parameterized queries","Verbose errors","URL encoding","Case variation"],"answer":"Parameterized queries","explanation":"Parameterization structurally separates data from code and is preferred to ad-hoc sanitization.","id":"S04Q49"},{"fact_id":"con.tautology.where","concept_id":"con.tautology.where","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which part of a query is commonly forced to evaluate TRUE during a tautology-based login bypass?","choices":["Comment","SELECT list","WHERE clause","String literal"],"answer":"WHERE clause","explanation":"A tautology changes the WHERE condition so it is always true.","id":"S04Q50"}],[{"fact_id":"eva.frag.reassembly","concept_id":"eva.frag.reassembly","variant":1,"category":"Evasion & Detection","topic":"IP Fragmentation","question":"What must an IDS do before matching a signature spread across IP fragments?","choices":["Rotate TLS keys","Reassemble the fragments","Change the DB port","Create a new VLAN"],"answer":"Reassemble the fragments","explanation":"Signature matching across fragments requires correct reassembly first.","id":"S05Q01"},{"fact_id":"con.query.username","concept_id":"con.query.username","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"In a normal login query, what does `UserName=...` represent?","choices":["Password predicate","Comment marker","Username predicate","Boolean operator"],"answer":"Username predicate","explanation":"It constrains the query to the supplied username.","id":"S05Q02"},{"fact_id":"def.stored.proc.validate","concept_id":"def.stored.proc.validate","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"What should a stored procedure do with user input before using it in dynamic SQL?","choices":["Encode it as Base64 only","Validate it and avoid unsafe concatenation","Return it in an error","Trust it because procedures are safe"],"answer":"Validate it and avoid unsafe concatenation","explanation":"Stored procedures must still validate input and avoid unsafe dynamic SQL.","id":"S05Q03"},{"fact_id":"con.sql.having","concept_id":"con.sql.having","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQL clause filters groups after GROUP BY?","choices":["UNION","WHERE","INSERT","HAVING"],"answer":"HAVING","explanation":"HAVING filters grouped results.","id":"S05Q04"},{"fact_id":"def.feature.xpcmd","concept_id":"def.feature.xpcmd","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What hardening action reduces the attack surface for MSSQL OS command execution?","choices":["Run SQL Server as administrator","Expose detailed errors","Enable it for every app","Disable or restrict xp_cmdshell when not required"],"answer":"Disable or restrict xp_cmdshell when not required","explanation":"Reducing unnecessary powerful DBMS features limits post-SQLi escalation.","id":"S05Q05"},{"fact_id":"def.untrusted.cookie","concept_id":"def.untrusted.cookie","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Should cookie values be treated as trusted merely because the server originally issued them?","choices":["No","Only after login","Yes","Only on HTTPS"],"answer":"No","explanation":"Clients can modify cookie values, so server-side validation/parameterization still applies.","id":"S05Q06"},{"fact_id":"meth.unionprobe","concept_id":"meth.unionprobe","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Discovery","question":"What SQL operator is tested to see whether attacker-controlled result sets can be combined with the original query?","choices":["UNION","ROLLBACK","COMMIT","GRANT"],"answer":"UNION","explanation":"UNION tests whether injected SELECT results can be returned in-band.","id":"S05Q07"},{"fact_id":"def.hash","concept_id":"def.hash","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"Which algorithm does the course recommend instead of storing passwords in plaintext?","choices":["CRC32","MD5","SHA256","Base64"],"answer":"SHA256","explanation":"The course checklist explicitly names SHA256.","id":"S05Q08"},{"fact_id":"con.groupby.role","concept_id":"con.groupby.role","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which clause groups rows before HAVING conditions are applied?","choices":["EXEC","GROUP BY","UNION","ORDER BY"],"answer":"GROUP BY","explanation":"GROUP BY defines grouped fields that HAVING can reference.","id":"S05Q09"},{"fact_id":"def.input.size","concept_id":"def.input.size","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What input property should be bounded to reduce malformed or abusive database input?","choices":["Screen resolution","TTL","Size","MAC OUI"],"answer":"Size","explanation":"The checklist says to test input size and enforce limits.","id":"S05Q10"},{"fact_id":"meth.cols.mysql","concept_id":"meth.cols.mysql","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS Enumeration","question":"Which command lists columns from a table in MySQL?","choices":["SELECT * FROM all_tab_columns","sp_columns tablename","SELECT * FROM syscat.columns","SHOW COLUMNS FROM tablename"],"answer":"SHOW COLUMNS FROM tablename","explanation":"MySQL uses SHOW COLUMNS FROM tablename.","id":"S05Q11"},{"fact_id":"type.boolean.false","concept_id":"type.boolean.false","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"Which condition is normally used as an always-false probe during blind SQL injection testing?","choices":["3=3","1=1","2=2","1=0"],"answer":"1=0","explanation":"1=0 is false and is compared with an always-true condition.","id":"S05Q12"},{"fact_id":"type.eol.goal","concept_id":"type.eol.goal","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Which technique comments out the application-generated remainder of a vulnerable query?","choices":["End-of-Line Comment","Tautology","In-line Comments","System Stored Procedure"],"answer":"End-of-Line Comment","explanation":"End-of-line comments can remove trailing password checks or syntax.","id":"S05Q13"},{"fact_id":"con.error.generic","concept_id":"con.error.generic","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"Why does replacing detailed database errors with generic application errors reduce attack feedback?","choices":["It removes schema and syntax clues","It encrypts SQL statements","It blocks TCP port 80","It prevents all SQL execution"],"answer":"It removes schema and syntax clues","explanation":"Detailed errors help attackers refine payloads and identify schema/DBMS behavior.","id":"S05Q14"},{"fact_id":"meth.acct.mssql.login","concept_id":"meth.acct.mssql.login","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Account Creation","question":"Which MSSQL procedure creates a new SQL login in the course example?","choices":["PASSWORD()","GRANT CONNECT","sp_addlogin","CREATE USER"],"answer":"sp_addlogin","explanation":"sp_addlogin creates an MSSQL login.","id":"S05Q15"},{"fact_id":"eva.regex.x","concept_id":"eva.regex.x","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"What regex modifier is described as ignoring whitespace in the pattern?","choices":["s","m","i","x"],"answer":"x","explanation":"The course describes `x` as ignoring whitespace in the regex pattern.","id":"S05Q16"},{"fact_id":"type.proc.dynamicrisk","concept_id":"type.proc.dynamicrisk","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Does using a stored procedure automatically prevent SQL injection?","choices":["Yes","Only on Oracle","No","Only with HTTPS"],"answer":"No","explanation":"Stored procedures are id":"def.regex.limit","concept_id":"def.regex.limit","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why should regular expressions not be the only SQLi defense?","choices":["Regex cannot inspect text","Regex always grants admin access","Regex disables TLS","Encoding and syntax variations can bypass pattern matching"],"answer":"Encoding and syntax variations can bypass pattern matching","explanation":"The evasion section demonstrates many equivalent representations.","id":"S05Q22"},{"fact_id":"eva.meta.13","concept_id":"eva.meta.13","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded slash in the SQLi detection reference?","choices":["%3C","%72/%52","%6F/%4F","%2F"],"answer":"%2F","explanation":"%2F is listed as the encoded slash representation.","id":"S05Q23"},{"fact_id":"eva.meta.5","concept_id":"eva.meta.5","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded dash in the SQLi detection reference?","choices":["%23","%2D","|","%2F"],"answer":"%2D","explanation":"%2D is listed as the encoded dash representation.","id":"S05Q24"},{"fact_id":"meth.insert.permission","concept_id":"meth.insert.permission","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Data Modification","question":"What database permission is required for an injected statement to add a new row to the Users table?","choices":["DNS update permission","SELECT permission only","SSH login permission","INSERT permission"],"answer":"INSERT permission","explanation":"The course notes that inserting a new user requires INSERT permission.","id":"S05Q25"},{"fact_id":"def.udf.priv","concept_id":"def.udf.priv","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What hardening principle reduces risk from malicious MySQL UDF creation?","choices":["Disable authentication","Restrict  of SQL Injection","topic":"Technique Recognition","question":"A forced conversion error includes the current database name in the error text. What technique is this?","choices":["Tautology","Error-based SQL Injection","Piggybacked Query","System Stored Procedure"],"answer":"Error-based SQL Injection","explanation":"The attacker extracts data from an error message.","id":"S05Q43"},{"fact_id":"eva.enc.4","concept_id":"eva.enc.4","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which URL-encoded value represents the semicolon?","choices":["%3E","%3B","%27","%3C"],"answer":"%3B","explanation":"%3B is the encoded semicolon in the course reference.","id":"S05Q44"},{"fact_id":"eva.meta.4","concept_id":"eva.meta.4","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to double dash comment in the SQLi detection reference?","choices":["--","'","%2D","|"],"answer":"--","explanation":"-- is listed as the double dash comment representation.","id":"S05Q45"},{"fact_id":"meth.dbms.xpcmd","concept_id":"meth.dbms.xpcmd","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"Which DBMS is associated with xp_cmdshell for OS command execution?","choices":["MySQL","PostgreSQL","Oracle","MSSQL"],"answer":"MSSQL","explanation":"xp_cmdshell is a Microsoft SQL Server extended procedure.","id":"S05Q46"},{"fact_id":"def.dbacct.noadmin","concept_id":"def.dbacct.noadmin","variant":1,"category":"SQL Injection Countermeasures","topic":"Privileges","question":"Why should the application avoid using a sysadmin/database-owner account?","choices":["Queries would become slower","The browser would cache less","HTTPS would stop working","SQL injection would inherit excessive privileges"],"answer":"SQL injection would inherit excessive privileges","explanation":"Injection executes with the application account’s database privileges.","id":"S05Q47"},{"fact_id":"type.oob.oracle.cha nsive queries instead of calling a sleep function?","choices":["Boolean Exploitation","Error-based SQL Injection","Heavy Query","Time Delay"],"answer":"Heavy Query","explanation":"Heavy queries create measurable delays through computation or joins.","id":"S06Q28"},{"fact_id":"meth.sqlmap.columns","concept_id":"meth.sqlmap.columns","variant":1,"category":"SQL Injection Methodology & Tools","topic":"sqlmap","question":"Which sqlmap command pattern enumerates columns from a selected table?","choices":["-D dbname -T tablename --columns","-D dbname --tables","--dbs","--technique=E"],"answer":"-D dbname -T tablename --columns","explanation":"`-D` selects the database, `-T` the table, and `--columns` lists columns.","id":"S06Q29"},{"fact_id":"eva.url.goal","concept_id":"eva.url.goal","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What does URL encoding change without changing the decoded SQL semantics?","choices":["The TCP destination port","The textual representation of characters","The SQL user privileges","The database schema"],"answer":"The textual representation of characters","explanation":"Percent encoding can evade filters that inspect only literal characters.","id":"S06Q30"},{"fact_id":"con.classmember.9","concept_id":"con.classmember.9","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes Time Delay?","choices":["Blind/Inferential SQL Injection","Not a SQL injection class","Out-of-Band SQL Injection","In-band SQL Injection"],"answer":"Blind/Inferential SQL Injection","explanation":"Time Delay is classified under Blind/Inferential SQL Injection in the course diagram.","id":"S06Q31"},{"fact_id":"con.inferential.mean","concept_id":"con.inferential.mean","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What does “inferential” mean in blind SQL injection?","choices":["Data is returned through UNION rows","Data is printed directly ty","concept_id":"con.data.integrity","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQLi impact is involved when an attacker changes product prices or records?","choices":["Information Disclosure","Authentication and Authorization Bypass","Compromised Integrity and Availability of Data","Remote Code Execution"],"answer":"Compromised Integrity and Availability of Data","explanation":"Unauthorized modification compromises integrity and potentially availability.","id":"S06Q45"},{"fact_id":"con.query.or","concept_id":"con.query.or","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"How does injected `OR` change the logic of a vulnerable authentication query?","choices":["Either side can make the condition true","Both sides must remain false","It ends the SQL session","It converts strings to integers"],"answer":"Either side can make the condition true","explanation":"OR allows an attacker-controlled true predicate to satisfy the WHERE clause.","id":"S06Q46"},{"fact_id":"type.error.vsblind","concept_id":"type.error.vsblind","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What differentiates error-based SQLi from blind SQLi?","choices":["Error-based exposes DBMS error data directly","Blind always uses UNION","Blind requires verbose stack traces","Error-based requires DNS callbacks"],"answer":"Error-based exposes DBMS error data directly","explanation":"Error-based is direct feedback; blind infers without useful output.","id":"S06Q47"},{"fact_id":"def.error.vs.log","concept_id":"def.error.vs.log","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Where should detailed database exceptions be recorded rather than exposed to users?","choices":["HTML comments sent to clients","Server-side logs","URL query strings","Cookie values"],"answer":"Server-side logs","explanation":"Detailed errors belong in protected R DELAY '0:0:10'` cause when its condition is reached?","choices":["A 10-second delay","A DNS lookup","A password reset","A table drop"],"answer":"A 10-second delay","explanation":"The WAITFOR DELAY example sleeps for ten seconds.","id":"S07Q03"},{"fact_id":"meth.os.bulk","concept_id":"meth.os.bulk","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"Which MSSQL statement loads file contents into a table in the course example?","choices":["WAITFOR DELAY","BULK INSERT","SHOW COLUMNS","GRANT CONNECT"],"answer":"BULK INSERT","explanation":"BULK INSERT is used to import the command-output file into a temporary table.","id":"S07Q04"},{"fact_id":"def.concat.bad","concept_id":"def.concat.bad","variant":1,"category":"SQL Injection Countermeasures","topic":"Parameterized Queries","question":"Which coding pattern most directly creates SQL injection risk?","choices":["Binding parameters","Allowlisting expected values","Using least privilege","Concatenating raw user input into SQL"],"answer":"Concatenating raw user input into SQL","explanation":"Direct concatenation mixes untrusted data with SQL code.","id":"S07Q05"},{"fact_id":"meth.meta.infoschema.role","concept_id":"meth.meta.infoschema.role","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS / Tool Semantics","question":"What does `information_schema.columns` provide during database enumeration?","choices":["Column metadata for tables","DNS records","Operating-system processes","HTTP session tokens"],"answer":"Column metadata for tables","explanation":"The course uses information_schema.columns to enumerate columns for a named table.","id":"S07Q06"},{"fact_id":"def.monitor.detect","concept_id":"def.monitor.detect","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What is the role of IDS/WAF/monitoring in SQLi defense?","choices":["Replace parameterization","Detect and alert on suspicious input patterns","Make unsaf ation":"Injection points are defined by data flow to SQL, not UI visibility.","id":"S07Q11"},{"fact_id":"con.impact.2","concept_id":"con.impact.2","variant":1,"category":"SQL Injection Concepts","topic":"Impacts","question":"Which SQL injection impact exposes sensitive database contents?","choices":["Information Disclosure","Compromised Integrity and Availability of Data","Authentication and Authorization Bypass","Remote Code Execution"],"answer":"Information Disclosure","explanation":"Information Disclosure is one of the four SQL injection impacts listed in the course.","id":"S07Q12"},{"fact_id":"con.oob.callback","concept_id":"con.oob.callback","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"Who initiates the outbound DNS or HTTP request in out-of-band SQL injection?","choices":["The firewall only","The DNS client on the attacker","The browser only","The database server"],"answer":"The database server","explanation":"OOB SQLi abuses DBMS functions so the target server contacts attacker-controlled infrastructure.","id":"S07Q13"},{"fact_id":"con.insert.role","concept_id":"con.insert.role","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which SQL statement adds new rows to a table?","choices":["UPDATE","SELECT","DELETE","INSERT"],"answer":"INSERT","explanation":"INSERT adds rows to a table.","id":"S07Q14"},{"fact_id":"type.boolean.pages","concept_id":"type.boolean.pages","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What is compared during Boolean-based blind SQL injection?","choices":["Two ARP caches","Two DNS zones","Responses to true and false predicates","Two TLS certificates"],"answer":"Responses to true and false predicates","explanation":"Differences in response content/behavior reveal the predicate result.","id":"S07Q15"},{"fact_id":"meth.sqlmap.dbsmeaning","concept_id":"meth.sqlmap.dbsmeaning","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"What does `--dbs` ask sqlmap to enumerate?","choices":["Column values","Database names","HTTP cookies","DNS zones"],"answer":"Database names","explanation":"--dbs enumerates databases.","id":"S07Q16"},{"fact_id":"meth.dbms.benchmark","concept_id":"meth.dbms.benchmark","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"Which DBMS is associated with BENCHMARK for time-based SQL injection?","choices":["DB2","PostgreSQL","MySQL","Oracle"],"answer":"MySQL","explanation":"BENCHMARK is the MySQL timing function shown in the course.","id":"S07Q17"},{"fact_id":"type.dist.heavy.time","concept_id":"type.dist.heavy.time","variant":1,"category":"Types of SQL Injection","topic":"Technique Distinctions","question":"Which blind technique creates delay through expensive computation instead of a sleep function?","choices":["Time Delay","UNION SQL Injection","Boolean Exploitation","Heavy Query"],"answer":"Heavy Query","explanation":"Heavy queries create latency without explicit delay functions.","id":"S07Q18"},{"fact_id":"eva.regex.3d","concept_id":"eva.regex.3d","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What SQL operator is represented by `%3D`?","choices":["Semicolon (;)","Slash (/)","Less-than (<)","Equals sign (=)"],"answer":"Equals sign (=)","explanation":"%3D is the URL-encoded equals sign.","id":"S07Q19"},{"fact_id":"con.info.2","concept_id":"con.info.2","variant":1,"category":"SQL Injection Concepts","topic":"Information Gathering","question":"Which database detail helps select DBMS/version-specific syntax and techniques?","choices":["OS interaction level","Database version","DBMS type","Database users"],"answer":"Database version","explanation":"Database version is explicitly listed as useful SQL injection reconnaissance information.","id":"S07Q20"},{"fact_id":"eva.inline.example","concept_id":"eva.inline.example","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What syntax can be inserted between SQL keywords to perform in-line comment evasion?","choices":["SQL comments","DNS SOA records","TLS records","ARP replies"],"answer":"SQL comments","explanation":"Inline comments can split recognizable keywords.","id":"S07Q21"},{"fact_id":"eva.detect.whitespace","concept_id":"eva.detect.whitespace","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why should detection tolerate flexible whitespace between SQL tokens?","choices":["Whitespace changes database roles","Whitespace manipulation can preserve SQL semantics","Whitespace encrypts input","Whitespace disables TCP"],"answer":"Whitespace manipulation can preserve SQL semantics","explanation":"Fixed-spacing signatures are easy to evade.","id":"S07Q22"},{"fact_id":"def.account.command","concept_id":"def.account.command","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why should application DB accounts not have OS command-execution permissions?","choices":["Queries would be too short","Passwords would be hashed","SQLi could escalate into host command execution","TLS would fail"],"answer":"SQLi could escalate into host command execution","explanation":"Reducing DBMS/OS privileges limits post-injection impact.","id":"S07Q23"},{"fact_id":"con.info.6","concept_id":"con.info.6","variant":1,"category":"SQL Injection Concepts","topic":"Information Gathering","question":"Which detail indicates what the application database account is allowed to do?","choices":["Database version","User privilege level","Database name","OS interaction level"],"answer":"User privilege level","explanation":"User privilege level is explicitly listed as useful SQL injection reconnaissance information.","id":"S07Q24"},{"fact_id":"meth.meta.oracle.role","concept_id":"meth.meta.oracle.role","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS / Tool Semant erving SQL semantics.","id":"S07Q29"},{"fact_id":"meth.sqlmap.takeover","concept_id":"meth.sqlmap.takeover","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"What does “taking over DB servers” mean in the sqlmap description beyond detection?","choices":["Only listing HTTP headers","Only scanning network ports","Automating exploitation and deeper database control","Only checking TLS certificates"],"answer":"Automating exploitation and deeper database control","explanation":"sqlmap supports exploitation after identifying SQL injection.","id":"S07Q30"},{"fact_id":"type.boolean.samecontent","concept_id":"type.boolean.samecontent","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What observable difference can Boolean-based blind SQLi use besides visible text?","choices":["Only DNS callbacks","Only SQL errors","Only OS shell output","Any consistent response behavior difference"],"answer":"Any consistent response behavior difference","explanation":"Boolean inference can use status, content length, presence/absence, or other consistent response changes.","id":"S07Q31"},{"fact_id":"def.test.manual","concept_id":"def.test.manual","variant":1,"category":"SQL Injection Countermeasures","topic":"Testing","question":"What testing approach uses human reasoning to validate and exploit subtle SQL injection conditions?","choices":["Automated backup testing","Manual penetration testing","Static source code analysis","NTP monitoring"],"answer":"Manual penetration testing","explanation":"Manual testing complements automated and static techniques.","id":"S07Q32"},{"fact_id":"type.blind.ascii","concept_id":"type.blind.ascii","variant":1,"category":"Types of SQL Injection","topic":"Blind Extraction","question":"Which function converts the extracted character into a numeric value for comparison?","choices":["MAX","ASCII","GRANT","COUNT"],"answer":"ASCII","explanation":"ASCII converts a character to its numeric code for Boolean comparison.","id":"S07Q33"},{"fact_id":"eva.enc.6","concept_id":"eva.enc.6","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which URL-encoded value represents the greater-than sign?","choices":["%3E","%3D","%27","%23"],"answer":"%3E","explanation":"%3E is the encoded greater-than sign in the course reference.","id":"S07Q34"},{"fact_id":"def.stored.notmagic","concept_id":"def.stored.notmagic","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why is “use stored procedures” not sufficient by itself?","choices":["Stored procedures disable logging","Stored procedures always run as admin","Stored procedures cannot accept parameters","A procedure can still concatenate untrusted input into dynamic SQL"],"answer":"A procedure can still concatenate untrusted input into dynamic SQL","explanation":"Implementation details determine whether the procedure remains injectable.","id":"S07Q35"},{"fact_id":"con.info.1","concept_id":"con.info.1","variant":1,"category":"SQL Injection Concepts","topic":"Information Gathering","question":"Which database detail helps target later table and column enumeration?","choices":["Database name","User privilege level","Database version","OS interaction level"],"answer":"Database name","explanation":"Database name is explicitly listed as useful SQL injection reconnaissance information.","id":"S07Q36"},{"fact_id":"con.oob.mean","concept_id":"con.oob.mean","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What does “out-of-band” mean in SQL injection?","choices":["A separate communication channel carries extracted data","The query runs outside a transaction","The database is offline","The request uses a nonstandard port only"],"answer":"A separate communication channel carries extracted data","explanation":"Out-of-band SQLi uses a channel different from the original web response.","id":"S07Q37"},{"fact_id":"type.boolean.vstime","concept_id":"type.boolean.vstime","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What specifically distinguishes Boolean-based blind from time-based blind SQLi?","choices":["Boolean-based uses DNS; time-based uses UNION","Time-based requires visible errors","Boolean-based uses response behavior; time-based uses latency","Boolean-based is in-band only"],"answer":"Boolean-based uses response behavior; time-based uses latency","explanation":"They use different observable side channels.","id":"S07Q38"},{"fact_id":"con.union.purpose","concept_id":"con.union.purpose","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"What does a UNION clause allow an attacker to do in SQL injection?","choices":["Disable query parsing","Append another SELECT result set","Create a DNS zone transfer","Start a TCP handshake"],"answer":"Append another SELECT result set","explanation":"UNION combines the result of an injected SELECT with the original query result.","id":"S07Q39"},{"fact_id":"meth.os.mysql.eval","concept_id":"meth.os.mysql.eval","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"Which MySQL user-defined function is created to execute commands and return a string?","choices":["xp_dirtree","sys_eval","DB_NAME","sys_exec"],"answer":"sys_eval","explanation":"The course shows CREATE FUNCTION sys_eval ... .","id":"S07Q40"},{"fact_id":"def.patch.app","concept_id":"def.patch.app","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why should untested web applications not be deployed?","choices":["They break DNSSEC","They cannot use HTTPS","They always use the wrong DB port","Unknown injection flaws may reach production"],"answer":"Unknown injection flaws may reach production","explanation":"Testing reduces the chance of deploying SQL-injectable code.","id":"S07Q41"},{"fact_id":"eva.comment.split","concept_id":"eva.comment.split","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What property lets in-line comments appear between SQL keyword fragments without changing execution?","choices":["The network strips SQL comments","The WAF parameterizes them","The browser executes comments","The DBMS treats the comments as non-executable text"],"answer":"The DBMS treats the comments as non-executable text","explanation":"Comments can alter the byte/string pattern while preserving SQL semantics.","id":"S07Q42"},{"fact_id":"def.trigger.priv","concept_id":"def.trigger.priv","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What hardening principle reduces trigger-based SQLi persistence?","choices":["Restrict CREATE TRIGGER and modification privileges","Disable prepared statements","Expose schema errors","Grant CREATE TRIGGER to every app"],"answer":"Restrict CREATE TRIGGER and modification privileges","explanation":"Least privilege limits the ability to install persistent database logic.","id":"S07Q43"},{"fact_id":"meth.sqlmap.dump","concept_id":"meth.sqlmap.dump","variant":1,"category":"SQL Injection Methodology & Tools","topic":"sqlmap","question":"Which sqlmap command pattern extracts the contents of a selected table?","choices":["-D dbname -T tablename --dump","--dbs","-D dbname -T tablename --columns","--technique=E"],"answer":"-D dbname -T tablename --dump","explanation":"`--dump` retrieves table data.","id":"S07Q44"},{"fact_id":"meth.sqlmap.e","concept_id":"meth.sqlmap.e","variant":1,"category":"SQL Injection Methodology & Tools","topic":"sqlmap","question":"Which sqlmap option restricts testing to error-based SQL injection in the course example?","choices":["-D dbname -T tablename --dump","--technique=E","-D dbname -T tablename --columns","-D dbname --tables"],"answer":"--technique=E","explanation":"The `E` technique code selects error-based SQL injection.","id":"S07Q45"},{"fact_id":"meth.tool.dsss","concept_id":"meth.tool.dsss","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Detection Tools","question":"Which SQL injection scanner specifically targets GET and POST parameters?","choices":["blind_sql_bitshifting","DSSS","OWASP ZAP","NoSQLMap"],"answer":"DSSS","explanation":"Damn Small SQLi Scanner is described as a GET/POST parameter scanner.","id":"S07Q46"},{"fact_id":"eva.regex.flagsboth","concept_id":"eva.regex.flagsboth","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Why are both `i` and `x` modifiers used in the course SQLi regex examples?","choices":["To force integer parsing","To fragment IP packets","To ignore case and allow flexible whitespace in the pattern","To enable encryption and compression"],"answer":"To ignore case and allow flexible whitespace in the pattern","explanation":"The table defines `i` as case-insensitive and `x` as ignoring whitespace in the pattern.","id":"S07Q47"},{"fact_id":"con.having.role","concept_id":"con.having.role","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which SQL clause is used to filter grouped results and can trigger grouping errors during testing?","choices":["GRANT","HAVING","WHERE","UNION"],"answer":"HAVING","explanation":"The course uses HAVING-based errors to reveal ungrouped column names.","id":"S07Q48"},{"fact_id":"def.zap.integrated","concept_id":"def.zap.integrated","variant":1,"category":"SQL Injection Countermeasures","topic":"Detection Tools","question":"What type of tool is OWASP ZAP in the course?","choices":["Wireless cracking suite","Database backup utility","Integrated web penetration testing tool","Network time client"],"answer":"Integrated web penetration testing tool","explanation":"OWASP ZAP is listed as an integrated pentest tool.","id":"S07Q49"},{"fact_id":"type.illegal.structure","concept_id":"type.illegal.structure","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What can an illegal/logically incorrect query reveal?","choices":["ARP table age","TLS private keys automatically","Database structure and syntax","Wi-Fi channels"],"answer":"Database structure and syntax","explanation":"Database errors can reveal parsing and schema details.","id":"S07Q50"}],[{"fact_id":"meth.reverse.direction","concept_id":"meth.reverse.direction","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"In a reverse shell launched from the DBMS host, who initiates the network connection?","choices":["The compromised database host","The firewall","The attacker browser only","The DNS server"],"answer":"The compromised database host","explanation":"A reverse shell connects outward from the compromised target to the attacker.","id":"S08Q01"},{"fact_id":"def.testing","concept_id":"def.testing","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What testing combination is recommended to find SQL injection before deployment?","choices":["Only unit tests","Black-box testing, static analysis, and manual penetration testing","Only code formatting","Only vulnerability scanning"],"answer":"Black-box testing, static analysis, and manual penetration testing","explanation":"The course recommends multiple complementary testing methods.","id":"S08Q02"},{"fact_id":"type.union.goal","concept_id":"type.union.goal","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Which in-band technique appends an attacker-controlled SELECT to the original query?","choices":["Tautology","In-line Comments","Error-based SQL Injection","UNION SQL Injection"],"answer":"UNION SQL Injection","explanation":"UNION SQLi combines attacker-selected rows with the legitimate result set.","id":"S08Q03"},{"fact_id":"con.query.commentauth","concept_id":"con.query.commentauth","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What vulnerable login component is usually neutralized after an injected end-of-line comment?","choices":["The database listener","The TLS handshake","The trailing password check","The username field itself"],"answer":"The trailing password check","explanation":"Commenting out the remainder commonly removes the password predicate.","id":"S08Q04"},{"fact_id":"type.heavy.systemtables","concept_id":"type.heavy.systemtables","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"Why are system tables useful for heavy-query blind SQLi?","choices":["They bypass authentication automatically","They can be cross-joined to create expensive work","They disable indexes globally","They always contain passwords"],"answer":"They can be cross-joined to create expensive work","explanation":"Cross joins can multiply rows and consume processing time.","id":"S08Q05"},{"fact_id":"type.error.info","concept_id":"type.error.info","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What does error-based SQL injection primarily extract from database error messages?","choices":["Routing metrics","Schema/data clues","ARP entries","Wi-Fi keys"],"answer":"Schema/data clues","explanation":"Errors may reveal usernames, table/column information, or other DBMS details.","id":"S08Q06"},{"fact_id":"eva.meta.9","concept_id":"eva.meta.9","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded o/o in the SQLi detection reference?","choices":["%2F","%3E","\\s","%6F/%4F"],"answer":"%6F/%4F","explanation":"%6F/%4F is listed as the encoded o/o representation.","id":"S08Q07"},{"fact_id":"eva.regex.i","concept_id":"eva.regex.i","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"What regex modifier makes SQLi detection case-insensitive in the course patterns?","choices":["x","i","m","g"],"answer":"i","explanation":"The `i` modifier enables case-insensitive matching.","id":"S08Q08"},{"fact_id":"type.dist.oob.inband","concept_id":"type.dist.oob.inband","variant":1,"category":"Types of SQL Injection","topic":"Technique Distinctions","question":"Which SQL injection class requires a secondary channel such as DNS or HTTP callbacks?","choices":["In-band SQL Injection","Tautology","Boolean Exploitation","Out-of-Band SQL Injection"],"answer":"Out-of-Band SQL Injection","explanation":"Out-of-band SQLi uses a separate communication channel.","id":"S08Q09"},{"fact_id":"meth.sqlmap.dbs","concept_id":"meth.sqlmap.dbs","variant":1,"category":"SQL Injection Methodology & Tools","topic":"sqlmap","question":"Which sqlmap option enumerates available databases?","choices":["--technique=E","-D dbname --tables","--dbs","-D dbname -T tablename --dump"],"answer":"--dbs","explanation":"--dbs enumerates database names.","id":"S08Q10"},{"fact_id":"type.proc.vuln","concept_id":"type.proc.vuln","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What makes a stored-procedure call exploitable even though the procedure itself is pre-created?","choices":["Its name is predictable","It returns one row","It uses SELECT","Unsafe dynamic SQL inside the procedure"],"answer":"Unsafe dynamic SQL inside the procedure","explanation":"Dynamic concatenation inside stored procedures recreates the same injection problem.","id":"S08Q11"},{"fact_id":"def.tool.zap","concept_id":"def.tool.zap","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"Which tool in the module can combine automated and manual web-application scanning?","choices":["OWASP ZAP","Mole","DSSS","blind_sql_bitshifting"],"answer":"OWASP ZAP","explanation":"OWASP ZAP provides automated and manual scanning.","id":"S08Q12"},{"fact_id":"con.classmember.7","concept_id":"con.classmember.7","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes Illegal/Logically Incorrect Query?","choices":["Blind/Inferential SQL Injection","Not a SQL injection class","In-band SQL Injection","Out-of-Band SQL Injection"],"answer":"In-band SQL Injection","explanation":"Illegal/Logically Incorrect Query is classified under In-band SQL Injection in the course diagram.","id":"S08Q13"},{"fact_id":"meth.trigger.row","concept_id":"meth.trigger.row","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Database Backdoors","question":"What does `FOR EACH ROW` mean in the trigger example?","choices":["The trigger runs once per database","The trigger only runs at login","The query becomes read-only","The trigger logic runs for each affected row"],"answer":"The trigger logic runs for each affected row","explanation":"FOR EACH ROW applies trigger logic to each inserted or updated row.","id":"S08Q14"},{"fact_id":"meth.os.cleanup","concept_id":"meth.os.cleanup","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"Why does the course example delete `test.txt` and drop temporary tables after extraction?","choices":["Change DB port","Enable DNSSEC","Remove artifacts","Increase query speed"],"answer":"Remove artifacts","explanation":"Cleanup reduces obvious artifacts left by the attack workflow.","id":"S08Q15"},{"fact_id":"type.eol.syntax","concept_id":"type.eol.syntax","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What does the end-of-line comment technique depend on?","choices":["A DBMS-supported line-comment syntax","A routing protocol","A certificate authority","A DNS resolver"],"answer":"A DBMS-supported line-comment syntax","explanation":"The technique only works if the backend recognizes the chosen comment syntax.","id":"S08Q16"},{"fact_id":"con.classmember.6","concept_id":"con.classmember.6","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes System Stored Procedure?","choices":["Out-of-Band SQL Injection","Not a SQL injection class","Blind/Inferential SQL Injection","In-band SQL Injection"],"answer":"In-band SQL Injection","explanation":"System Stored Procedure is classified under In-band SQL Injection in the course diagram.","id":"S08Q17"},{"fact_id":"con.oob.features","concept_id":"con.oob.features","variant":1,"category":"SQL Injection Concepts","topic":"SQL Semantics","question":"What database capability is often abused for out-of-band SQL injection?","choices":["ARP caching","Browser local storage","CSS rendering","Network-capable database functions"],"answer":"Network-capable database functions","explanation":"OOB SQLi needs the DBMS to initiate external communication.","id":"S08Q18"},{"fact_id":"meth.cols.mssqlsys","concept_id":"meth.cols.mssqlsys","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS Enumeration","question":"Which DBMS uses `syscolumns` and `sysobjects` for the column-enumeration example?","choices":["DB2","Oracle","MySQL","MSSQL"],"answer":"MSSQL","explanation":"The course maps syscolumns/sysobjects enumeration to Microsoft SQL Server.","id":"S08Q19"},{"fact_id":"con.trigger.effect","concept_id":"con.trigger.effect","variant":1,"category":"SQL Injection Concepts","topic":"Database Backdoors","question":"What persistence benefit does a malicious database trigger provide?","choices":["Automatic execution on future data changes","Automatic password hashing","Automatic TLS renewal","Automatic DNSSEC signing"],"answer":"Automatic execution on future data changes","explanation":"Once created, a trigger can execute later without the attacker resending the original SQL injection payload.","id":"S08Q20"},{"fact_id":"eva.tech.13","concept_id":"eva.tech.13","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique uses alternative always-true WHERE expressions?","choices":["Variations","Hex Encoding","IP Fragmentation","Case Variation"],"answer":"Variations","explanation":"Variations is the course technique that uses alternative always-true WHERE expressions.","id":"S08Q21"},{"fact_id":"con.or.true","concept_id":"con.or.true","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Why does `OR 1=1` bypass a vulnerable authentication condition?","choices":["It creates a new session key","The condition is always true","It encrypts the password","It disables the database listener"],"answer":"The condition is always true","explanation":"A true OR condition can make the overall WHERE predicate true regardless of the password check.","id":"S08Q22"},{"fact_id":"meth.err.convert","concept_id":"meth.err.convert","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Error-based Extraction","question":"Why does the course use `convert(int, value)` in error-based MSSQL examples?","choices":["Create a DNS record","Hash the value","Encrypt the value","Force a conversion error that reveals the value"],"answer":"Force a conversion error that reveals the value","explanation":"Converting nonnumeric data to int produces an error containing the value.","id":"S08Q23"},{"fact_id":"def.output.encode","concept_id":"def.output.encode","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Does HTML output encoding fix SQL injection at the database query boundary?","choices":["Only for UNION SQLi","Yes","Only for MSSQL","No"],"answer":"No","explanation":"Output encoding addresses browser rendering issues, not unsafe SQL query construction.","id":"S08Q24"},{"fact_id":"def.leastpriv.damage","concept_id":"def.leastpriv.damage","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Which SQLi impacts are reduced most directly by least privilege?","choices":["DNS cache aging","Client-side XSS only","Unauthorized data changes and privileged actions","Wireless jamming"],"answer":"Unauthorized data changes and privileged actions","explanation":"Restricted accounts limit modification, account creation, and OS interaction.","id":"S08Q25"},{"fact_id":"def.waf.role","concept_id":"def.waf.role","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What is the proper role of a WAF in SQLi defense?","choices":["A password hashing algorithm","A database backup system","The only required control","An additional detection/filtering layer, not a replacement for secure code"],"answer":"An additional detection/filtering layer, not a replacement for secure code","explanation":"Defense should be layered, with secure query construction as the primary fix.","id":"S08Q26"},{"fact_id":"def.debug.info","concept_id":"def.debug.info","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why remove debug/tracing output before production?","choices":["It disables prepared statements","It changes HTTP ports","It can expose internal query, stack, or configuration details","It prevents authentication"],"answer":"It can expose internal query, stack, or configuration details","explanation":"Verbose diagnostics can give attackers implementation details.","id":"S08Q27"},{"fact_id":"eva.tech.1","concept_id":"eva.tech.1","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Which SQLi evasion technique inserts comments between SQL keywords?","choices":["Declare Variables","In-line Comment","Variations","Manipulating White Spaces"],"answer":"In-line Comment","explanation":"In-line Comment is the course technique that inserts comments between SQL keywords.","id":"S08Q28"},{"fact_id":"type.illegal.quote","concept_id":"type.illegal.quote","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"What error can an unmatched quote reveal during an illegal-query test?","choices":["TLS session key","ARP timeout","SQL syntax details","Wireless signal strength"],"answer":"SQL syntax details","explanation":"An unclosed quotation error can reveal how the backend parses SQL.","id":"S08Q29"},{"fact_id":"meth.tool.mole","concept_id":"meth.tool.mole","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools","question":"Which tool detects and exploits SQL injection by taking a vulnerable URL and a valid string on the site?","choices":["DSSS","NoSQLMap","Mole","Havij"],"answer":"Mole","explanation":"The course describes Mole as taking a vulnerable URL and a valid site string.","id":"S08Q30"},{"fact_id":"eva.regex.3c","concept_id":"eva.regex.3c","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What comparison symbol is represented by `%3C`?","choices":["Greater-than (>)","Equals (=)","Less-than (<)","Slash (/)"],"answer":"Less-than (<)","explanation":"%3C represents the less-than character.","id":"S08Q31"},{"fact_id":"con.select.role","concept_id":"con.select.role","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which SQL statement retrieves data from database tables?","choices":["INSERT","DELETE","UPDATE","SELECT"],"answer":"SELECT","explanation":"SELECT retrieves data.","id":"S08Q32"},{"fact_id":"eva.regex.unionquote","concept_id":"eva.regex.unionquote","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"What must immediately precede `union` in the course UNION-detection regex?","choices":["A semicolon only","A DNS label","A TCP SYN flag","A literal or URL-encoded single quote"],"answer":"A literal or URL-encoded single quote","explanation":"The regex matches a literal quote or %27 followed by UNION.","id":"S08Q33"},{"fact_id":"eva.variations.true","concept_id":"eva.variations.true","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What property must a variation of a tautology preserve to remain effective?","choices":["The WHERE expression still evaluates true","The browser disables cookies","The DBMS sends DNS","The query uses port 443"],"answer":"The WHERE expression still evaluates true","explanation":"The exact math/string expression can change as long as the predicate remains true.","id":"S08Q34"},{"fact_id":"meth.meta.db2.role","concept_id":"meth.meta.db2.role","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS / Tool Semantics","question":"Which DB2 catalog view provides column metadata in the course?","choices":["all_tab_columns","pg_attribute","syscolumns","syscat.columns"],"answer":"syscat.columns","explanation":"The DB2 example queries syscat.columns for table-column metadata.","id":"S08Q35"},{"fact_id":"type.time.vsheavy","concept_id":"type.time.vsheavy","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What specifically distinguishes an explicit time-delay attack from a heavy-query attack?","choices":["Only heavy queries are blind","Only delay functions use SQL","Heavy queries require DNS","The former calls a delay function; the latter creates computational load"],"answer":"The former calls a delay function; the latter creates computational load","explanation":"Both use time, but they create the delay differently.","id":"S08Q36"},{"fact_id":"con.quote.error","concept_id":"con.quote.error","variant":1,"category":"SQL Injection Concepts","topic":"Detection Concepts","question":"What simple character is commonly inserted to provoke a SQL syntax error during testing?","choices":["SYN flag","Null route","Single quote","ARP opcode"],"answer":"Single quote","explanation":"A single quote can break a quoted SQL literal and reveal unsafe query construction.","id":"S08Q37"},{"fact_id":"def.input.assume","concept_id":"def.input.assume","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What should developers assume about the size, type, or content of externally received data?","choices":["Nothing; validate it explicitly","It is safe if numeric-looking","It is safe if authenticated","It is safe if HTTPS is used"],"answer":"Nothing; validate it explicitly","explanation":"Never trust external input based on assumptions.","id":"S08Q38"},{"fact_id":"type.oob.mssql.channel","concept_id":"type.oob.mssql.channel","variant":1,"category":"Types of SQL Injection","topic":"Out-of-Band","question":"What external channel is associated with `xp_dirtree` in the course?","choices":["ICMP only","SMTP only","DNS","ARP"],"answer":"DNS","explanation":"The course uses xp_dirtree to create DNS requests.","id":"S08Q39"},{"fact_id":"def.error.hide","concept_id":"def.error.hide","variant":1,"category":"SQL Injection Countermeasures","topic":"Error Handling","question":"What should production applications avoid returning to users after database errors?","choices":["Detailed DBMS error messages","Generic error pages","HTTP status codes","Correlation IDs"],"answer":"Detailed DBMS error messages","explanation":"Detailed DBMS errors help attackers refine error-based SQL injection.","id":"S08Q40"},{"fact_id":"eva.hex.select","concept_id":"eva.hex.select","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What SQL keyword does `0x73656c656374` represent in the course example?","choices":["UPDATE","UNION","SELECT","INSERT"],"answer":"SELECT","explanation":"The course identifies that hex sequence as SELECT.","id":"S08Q41"},{"fact_id":"con.auth.bypass","concept_id":"con.auth.bypass","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQLi impact is involved when `OR 1=1` logs in without a valid password?","choices":["Remote Code Execution","Compromised Integrity and Availability of Data","Information Disclosure","Authentication and Authorization Bypass"],"answer":"Authentication and Authorization Bypass","explanation":"A tautology can bypass login checks.","id":"S08Q42"},{"fact_id":"meth.errorreview","concept_id":"meth.errorreview","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Discovery","question":"Why are detailed database error messages valuable during SQL injection testing?","choices":["They increase password entropy","They disable SQL parsing","They reveal information for crafting later queries","They guarantee RCE"],"answer":"They reveal information for crafting later queries","explanation":"Detailed errors can disclose schema, types, and DBMS-specific behavior.","id":"S08Q43"},{"fact_id":"def.escapecharswhy","concept_id":"def.escapecharswhy","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why reject unexpected escape sequences and comment characters?","choices":["They create indexes","They can alter SQL parsing or hide payload structure","They force TLS","They improve logging"],"answer":"They can alter SQL parsing or hide payload structure","explanation":"Escape/comment syntax is frequently used to break out or truncate vulnerable SQL.","id":"S08Q44"},{"fact_id":"type.class.unionrows","concept_id":"type.class.unionrows","variant":1,"category":"Types of SQL Injection","topic":"Technique Recognition","question":"An injected SELECT causes credential rows to appear alongside normal search results. What technique is this?","choices":["Tautology","In-line Comments","Piggybacked Query","UNION SQL Injection"],"answer":"UNION SQL Injection","explanation":"UNION merges attacker-controlled rows into the application result set.","id":"S08Q45"},{"fact_id":"eva.meta.7","concept_id":"eva.meta.7","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded equals sign in the SQLi detection reference?","choices":["%3D","%3E","'","%27"],"answer":"%3D","explanation":"%3D is listed as the encoded equals sign representation.","id":"S08Q46"},{"fact_id":"meth.err.dbname","concept_id":"meth.err.dbname","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Error-based Extraction","question":"Which MSSQL function returns the current database name in the course example?","choices":["HOST_NAME","USER_NAME","BENCHMARK","DB_NAME"],"answer":"DB_NAME","explanation":"DB_NAME returns the current database name.","id":"S08Q47"},{"fact_id":"con.update.role","concept_id":"con.update.role","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"Which SQL statement modifies existing rows?","choices":["SELECT","DELETE","INSERT","UPDATE"],"answer":"UPDATE","explanation":"UPDATE changes existing data.","id":"S08Q48"},{"fact_id":"def.sanitize.dynamic","concept_id":"def.sanitize.dynamic","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"If dynamic SQL is unavoidable, what two controls should be combined?","choices":["Strict validation/sanitization and least privilege","Disabled logging and shared accounts","Verbose errors and admin rights","Case variation and URL encoding"],"answer":"Strict validation/sanitization and least privilege","explanation":"Reducing input risk and account privileges limits both likelihood and impact.","id":"S08Q49"},{"fact_id":"eva.meta.12","concept_id":"eva.meta.12","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to encoded greater-than sign in the SQLi detection reference?","choices":["\\s","%3E","'","%3C"],"answer":"%3E","explanation":"%3E is listed as the encoded greater-than sign representation.","id":"S08Q50"}],[{"fact_id":"def.error.logging","concept_id":"def.error.logging","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What is the secure balance for database errors?","choices":["Return the SQL query to users","Suppress every error everywhere","Log detailed errors internally and return generic messages externally","Expose detailed errors and disable logs"],"answer":"Log detailed errors internally and return generic messages externally","explanation":"Defenders retain diagnostics without giving attackers DBMS details.","id":"S09Q01"},{"fact_id":"type.class.inlinecomment","concept_id":"type.class.inlinecomment","variant":1,"category":"Types of SQL Injection","topic":"Technique Recognition","question":"A filter blocks `UNION SELECT`, so comments are inserted between keywords. What technique is this?","choices":["Error-based SQL Injection","In-line Comments","Tautology","Piggybacked Query"],"answer":"In-line Comments","explanation":"Inline comments obfuscate the SQL tokens.","id":"S09Q02"},{"fact_id":"def.clientonly","concept_id":"def.clientonly","variant":1,"category":"SQL Injection Countermeasures","topic":"Input Validation","question":"Why is client-side validation alone insufficient?","choices":["Databases ignore server-side input","TLS disables validation","Attackers can bypass or modify client-side checks","Browsers cannot send HTTP"],"answer":"Attackers can bypass or modify client-side checks","explanation":"Security validation must be enforced server-side.","id":"S09Q03"},{"fact_id":"def.escape","concept_id":"def.escape","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What should be used when no parameterized API is available?","choices":["Interpreter-specific escaping","HTML comments","Generic URL encoding only","DNS encoding"],"answer":"Interpreter-specific escaping","explanation":"The checklist recommends an escape syntax specific to the interpreter when parameterization is unavailable.","id":"S09Q04"},{"fact_id":"type.oob.dnshttp","concept_id":"type.oob.dnshttp","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What do DNS and HTTP represent in out-of-band SQLi?","choices":["Prepared-statement modes","SQL data types","Alternative exfiltration channels","Database roles"],"answer":"Alternative exfiltration channels","explanation":"The DBMS can signal or send data through alternate network protocols.","id":"S09Q05"},{
