"fact_id":"con.output.oob","concept_id":"con.output.oob","variant":1,"category":"SQL Injection Concepts","topic":"Output Mechanisms","question":"Which condition can make out-of-band SQL injection attractive?","choices":["The user enters a strong password","Normal response channels cannot return useful data","The DBMS has no network access at all","The application shows all query results"],"answer":"Normal response channels cannot return useful data","explanation":"Out-of-band techniques use a different communication channel when ordinary output paths are unsuitable.","id":"S09Q06"},{"fact_id":"con.union.resultsets","concept_id":"con.union.resultsets","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"What SQL operator combines result sets from two or more SELECT statements?","choices":["UNION","HAVING","EXEC","ORDER BY"],"answer":"UNION","explanation":"UNION combines compatible SELECT result sets.","id":"S09Q07"},{"fact_id":"meth.header.useragent","concept_id":"meth.header.useragent","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Alternate Inputs","question":"Which request field can become a SQL injection vector if the application stores it in a database unsafely?","choices":["IP TTL","User-Agent","Ethernet FCS","TCP sequence number"],"answer":"User-Agent","explanation":"User-Agent is explicitly listed as an HTTP-header SQL injection input.","id":"S09Q08"},{"fact_id":"type.class.waitfor","concept_id":"type.class.waitfor","variant":1,"category":"Types of SQL Injection","topic":"Technique Recognition","question":"A vulnerable parameter triggers a conditional WAITFOR DELAY and reveals data through latency. What technique is this?","choices":["Heavy Query","Time Delay","Boolean Exploitation","Error-based SQL Injection"],"answer":"Time Delay","explanation":"Conditional delays are time-based blind SQL injection.","id":"S09Q09"},{"fact_id":"meth.pass.bracket","concept_id":"meth.pass.bracket","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Data Extraction","question":"What does a bracket expression such as `[8]` test in the course password-extraction example?","choices":["The user role","A specific character at the current position","The query timeout","The database port"],"answer":"A specific character at the current position","explanation":"The pattern is used to confirm a candidate character at a specific position.","id":"S09Q10"},{"fact_id":"def.priv.read","concept_id":"def.priv.read","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"If an application only needs SELECT access, what should its DB account avoid receiving?","choices":["A password","A network socket","A username","Write/admin privileges"],"answer":"Write/admin privileges","explanation":"Least privilege grants only capabilities required by the application.","id":"S09Q11"},{"fact_id":"meth.sysdbs","concept_id":"meth.sysdbs","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"Which MSSQL catalog view is selected in the OPENROWSET transfer example to list databases?","choices":["all_tab_columns","mysql.user","information_schema.columns","sys.sysdatabases"],"answer":"sys.sysdatabases","explanation":"The example selects from sys.sysdatabases.","id":"S09Q12"},{"fact_id":"type.error.require","concept_id":"type.error.require","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What application behavior is required for useful error-based SQL injection?","choices":["Database error details reach the response","Only DNS callbacks work","All errors are suppressed","Every response is identical"],"answer":"Database error details reach the response","explanation":"Error-based SQLi depends on useful DBMS errors being exposed.","id":"S09Q13"},{"fact_id":"type.time.mysql","concept_id":"type.time.mysql","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"Which MySQL function is used in the course to create a measurable time delay?","choices":["WAITFOR DELAY","BENCHMARK","xp_dirtree","UTL_HTTP"],"answer":"BENCHMARK","explanation":"BENCHMARK repeatedly evaluates an expression to consume time in MySQL.","id":"S09Q14"},{"fact_id":"def.layers","concept_id":"def.layers","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"Why use multiple layers of input validation?","choices":["It increases database privileges","It disables SQL parsing","One validation layer may miss malformed input","It enables stacked queries"],"answer":"One validation layer may miss malformed input","explanation":"Layered validation reduces reliance on a single check.","id":"S09Q15"},{"fact_id":"eva.frag.timeout","concept_id":"eva.frag.timeout","variant":1,"category":"Evasion & Detection","topic":"IP Fragmentation","question":"Why can pausing between fragments evade an IDS?","choices":["The browser changes User-Agent","The database stops parsing SQL","The switch disables VLANs","The IDS may time out before the target does"],"answer":"The IDS may time out before the target does","explanation":"Different reassembly timeouts can give the IDS and target different views.","id":"S09Q16"},{"fact_id":"meth.os.privlimit","concept_id":"meth.os.privlimit","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"What limits both MSSQL and MySQL OS-interaction techniques?","choices":["DNS TTL","Database running privileges","Browser cache size","HTTP User-Agent"],"answer":"Database running privileges","explanation":"OS interaction succeeds only to the extent allowed by DBMS/service privileges.","id":"S09Q17"},{"fact_id":"meth.openrowset.goal","concept_id":"meth.openrowset.goal","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Advanced SQLi","question":"Which MSSQL feature is used in the course to transfer database data to an attacker-controlled SQL endpoint?","choices":["OPENROWSET","UTL_HTTP","BENCHMARK","WAITFOR"],"answer":"OPENROWSET","explanation":"OPENROWSET can connect to an external SQL provider and insert data into it.","id":"S09Q18"},{"fact_id":"eva.frag.order.1","concept_id":"eva.frag.order.1","variant":1,"category":"Evasion & Detection","topic":"IP Fragmentation","question":"Which fragment-delivery pattern sends the final fragment first and continues backward?","choices":["Last fragment first","Reverse order","First fragment last","Random/out-of-order"],"answer":"Reverse order","explanation":"The course lists this as an IP-fragmentation evasion pattern.","id":"S09Q19"},{"fact_id":"eva.regex.meta","concept_id":"eva.regex.meta","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which regex pattern family detects quotes, encoded quotes, double dashes, and hash characters?","choices":["MSSQL exec pattern","IPv4 address pattern","SQL meta-character pattern","UNION-only pattern"],"answer":"SQL meta-character pattern","explanation":"The first regex is designed to catch common SQL metacharacters.","id":"S09Q20"},{"fact_id":"eva.regex.23","concept_id":"eva.regex.23","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why is `%23` included alongside `#` in SQLi detection?","choices":["It is the encoded hash/comment character","It means SELECT","It is an equals sign","It is a slash"],"answer":"It is the encoded hash/comment character","explanation":"Encoded metacharacters must be recognized after/before decoding.","id":"S09Q21"},{"fact_id":"def.input.canonical","concept_id":"def.input.canonical","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why normalize/canonicalize input before applying detection rules?","choices":["Multiple encodings can represent the same dangerous characters","Canonicalization parameterizes queries automatically","Canonicalization grants DB rights","It changes TCP ports"],"answer":"Multiple encodings can represent the same dangerous characters","explanation":"Normalization helps detection see through encoding-based evasion.","id":"S09Q22"},{"fact_id":"type.error.samechannel","concept_id":"type.error.samechannel","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Through what channel does error-based SQL injection expose information?","choices":["A DNS callback only","A reverse shell only","ARP broadcasts","Database errors in the application response"],"answer":"Database errors in the application response","explanation":"Error-based SQLi uses visible DBMS error messages returned by the application.","id":"S09Q23"},{"fact_id":"eva.whitespace.goal","concept_id":"eva.whitespace.goal","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"What detection assumption does whitespace manipulation target?","choices":["Fixed spacing between SQL tokens","Fixed DNS TTL","Fixed TLS cipher","Fixed database port"],"answer":"Fixed spacing between SQL tokens","explanation":"Filters that expect exact spacing can miss equivalent SQL with altered whitespace.","id":"S09Q24"},{"fact_id":"eva.meta.2","concept_id":"eva.meta.2","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to or operator in the SQLi detection reference?","choices":["%3B","%3C","'","|"],"answer":"|","explanation":"| is listed as the or operator representation.","id":"S09Q25"},{"fact_id":"con.output.blind","concept_id":"con.output.blind","variant":1,"category":"SQL Injection Concepts","topic":"Output Mechanisms","question":"Which application behavior pushes an attacker toward blind SQL injection?","choices":["UNION output is printed verbatim","The DBMS allows xp_cmdshell","Database errors reveal full schema","Query results are not directly visible"],"answer":"Query results are not directly visible","explanation":"Blind SQLi is used when results are not visible through the normal response.","id":"S09Q26"},{"fact_id":"eva.enc.1","concept_id":"eva.enc.1","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which URL-encoded value represents the single quote?","choices":["%23","%27","%3C","%3E"],"answer":"%27","explanation":"%27 is the encoded single quote in the course reference.","id":"S09Q27"},{"fact_id":"meth.os.xpcmd","concept_id":"meth.os.xpcmd","variant":1,"category":"SQL Injection Methodology & Tools","topic":"OS Interaction","question":"Which MSSQL extended procedure executes operating-system commands?","choices":["sp_columns","xp_cmdshell","sp_addlogin","xp_dirtree"],"answer":"xp_cmdshell","explanation":"xp_cmdshell can execute OS commands from SQL Server when enabled and permitted.","id":"S09Q28"},{"fact_id":"con.input.stringnum","concept_id":"con.input.stringnum","variant":1,"category":"SQL Injection Concepts","topic":"Detection Concepts","question":"What test may reveal SQL handling when a numeric parameter is expected?","choices":["Send an ICMP echo","Submit a string value","Rotate the TLS certificate","Change the MAC address"],"answer":"Submit a string value","explanation":"Submitting a string where a number is expected can trigger type-conversion errors that expose SQL behavior.","id":"S09Q29"},{"fact_id":"def.exception.generic","concept_id":"def.exception.generic","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"What should users receive instead of raw database exception text?","choices":["The full stack trace","A generic error response","Database credentials","The SQL statement"],"answer":"A generic error response","explanation":"Generic responses avoid leaking internal database details.","id":"S09Q30"},{"fact_id":"meth.json.waf","concept_id":"meth.json.waf","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Alternate Inputs","question":"What security control can JSON-based SQL injection sometimes bypass?","choices":["NTP server","DHCP server","WAF","VPN concentrator"],"answer":"WAF","explanation":"The course explicitly presents JSON-based SQL injection as a WAF bypass technique.","id":"S09Q31"},{"fact_id":"def.stored.safe","concept_id":"def.stored.safe","variant":1,"category":"SQL Injection Countermeasures","topic":"Stored Procedures","question":"When do stored procedures reduce SQL injection risk?","choices":["Only when run as sysadmin","Only when errors are verbose","Whenever they exist, regardless of implementation","When they avoid dynamic concatenation and use validated parameters"],"answer":"When they avoid dynamic concatenation and use validated parameters","explanation":"Stored procedures are only safer when implemented without unsafe dynamic SQL.","id":"S09Q32"},{"fact_id":"def.identifiers","concept_id":"def.identifiers","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"Why should quoted or delimited identifiers be avoided when possible?","choices":["They complicate allowlisting, blocklisting, and escaping","They change the DB port","They encrypt the query","They disable indexes"],"answer":"They complicate allowlisting, blocklisting, and escaping","explanation":"The course says quoted/delimited identifiers complicate secure filtering and escaping.","id":"S09Q33"},{"fact_id":"eva.regex.27","concept_id":"eva.regex.27","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why is `%27` included in SQLi signatures alongside a literal quote?","choices":["It is a null byte","It means UNION","It is the URL-encoded form of a single quote","It is a space"],"answer":"It is the URL-encoded form of a single quote","explanation":"Attackers may encode the quote to evade literal matching.","id":"S09Q34"},{"fact_id":"meth.quotename","concept_id":"meth.quotename","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Black-box Testing","question":"Which SQL Server function is mentioned alongside REPLACE in truncation-based testing?","choices":["QUOTENAME","UTL_HTTP","BENCHMARK","xp_dirtree"],"answer":"QUOTENAME","explanation":"QUOTENAME is mentioned in the course as another function whose return limits can contribute to truncation.","id":"S09Q35"},{"fact_id":"def.account","concept_id":"def.account","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What database account should a web application use?","choices":["A sysadmin account","The database owner for all apps","An anonymous superuser","The most restrictive account that meets its needs"],"answer":"The most restrictive account that meets its needs","explanation":"Least privilege limits SQL injection impact.","id":"S09Q36"},{"fact_id":"type.tautology.goal","concept_id":"type.tautology.goal","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Which technique makes a WHERE condition always true to bypass authentication?","choices":["Error-based SQL Injection","UNION SQL Injection","Piggybacked Query","Tautology"],"answer":"Tautology","explanation":"Tautology attacks use conditions such as OR 1=1.","id":"S09Q37"},{"fact_id":"type.union.vsstacked","concept_id":"type.union.vsstacked","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What differentiates UNION-based SQLi from stacked/piggybacked queries?","choices":["UNION merges result sets; stacked queries add another statement","UNION uses DNS; stacked uses HTTP","They are identical","UNION is blind; stacked is error-based"],"answer":"UNION merges result sets; stacked queries add another statement","explanation":"UNION extends a SELECT result; stacked queries execute an additional statement.","id":"S09Q38"},{"fact_id":"con.sql.where","concept_id":"con.sql.where","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQL clause filters rows according to a condition?","choices":["GRANT","WHERE","ORDER BY","GROUP BY"],"answer":"WHERE","explanation":"WHERE filters rows by predicates.","id":"S09Q39"},{"fact_id":"eva.detect.fragments","concept_id":"eva.detect.fragments","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why should network SQLi detection reassemble fragmented traffic?","choices":["SQL never crosses packets","Fragments cannot carry HTTP","Reassembly changes SQL privileges","The attack signature may span several fragments"],"answer":"The attack signature may span several fragments","explanation":"Without reassembly, no single fragment may contain the full signature.","id":"S09Q40"},{"fact_id":"con.info.4","concept_id":"con.info.4","variant":1,"category":"SQL Injection Concepts","topic":"Information Gathering","question":"Which detail tells an attacker whether errors, page content, timing, or another channel can leak results?","choices":["OS interaction level","User privilege level","Database version","Output mechanism"],"answer":"Output mechanism","explanation":"Output mechanism is explicitly listed as useful SQL injection reconnaissance information.","id":"S09Q41"},{"fact_id":"eva.frag.order.3","concept_id":"eva.frag.order.3","variant":1,"category":"Evasion & Detection","topic":"IP Fragmentation","question":"Which evasion pattern sends the final fragment before earlier fragments?","choices":["Last fragment first","Random/out-of-order","Reverse order","Normal order"],"answer":"Last fragment first","explanation":"The course lists this as an IP-fragmentation evasion pattern.","id":"S09Q42"},{"fact_id":"type.inband.require","concept_id":"type.inband.require","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What must exist for practical in-band extraction?","choices":["A response path that carries database output","A disabled database listener","A wireless interface","A separate DNS callback"],"answer":"A response path that carries database output","explanation":"In-band SQLi depends on results reaching the attacker through the original channel.","id":"S09Q43"},{"fact_id":"meth.tool.tamperdev","concept_id":"meth.tool.tamperdev","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools","question":"Which browser/request manipulation tool is listed alongside Burp Suite in the detection phase?","choices":["Tamper Dev","Havij","OWASP ZAP","DSSS"],"answer":"Tamper Dev","explanation":"Tamper Dev is listed for manipulating requests during testing.","id":"S09Q44"},{"fact_id":"con.classmember.5","concept_id":"con.classmember.5","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes In-line Comments?","choices":["Out-of-Band SQL Injection","Not a SQL injection class","Blind/Inferential SQL Injection","In-band SQL Injection"],"answer":"In-band SQL Injection","explanation":"In-line Comments is classified under In-band SQL Injection in the course diagram.","id":"S09Q45"},{"fact_id":"con.schema.table","concept_id":"con.schema.table","variant":1,"category":"SQL Injection Concepts","topic":"Database Structure","question":"What database object contains rows and columns of related data?","choices":["Table","Row/field value","Stored procedure","Column"],"answer":"Table","explanation":"Tables organize records in a relational database.","id":"S09Q46"},{"fact_id":"type.boolean.true","concept_id":"type.boolean.true","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"Which condition is normally used as an always-true probe during blind SQL injection testing?","choices":["1=1","2=3","5<1","1=0"],"answer":"1=1","explanation":"1=1 is always true and provides a baseline for Boolean inference.","id":"S09Q47"},{"fact_id":"con.sql.grant","concept_id":"con.sql.grant","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQL statement assigns database privileges to a user?","choices":["WAITFOR","SELECT","BENCHMARK","GRANT"],"answer":"GRANT","explanation":"GRANT assigns privileges/roles.","id":"S09Q48"},{"fact_id":"con.classmember.2","concept_id":"con.classmember.2","variant":1,"category":"SQL Injection Concepts","topic":"Classification","question":"Which SQL injection class includes UNION SQL Injection?","choices":["Blind/Inferential SQL Injection","Out-of-Band SQL Injection","Not a SQL injection class","In-band SQL Injection"],"answer":"In-band SQL Injection","explanation":"UNION SQL Injection is classified under In-band SQL Injection in the course diagram.","id":"S09Q49"},{"fact_id":"meth.passgrab.impact","concept_id":"meth.passgrab.impact","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Advanced SQLi","question":"What privilege escalation can follow successful database password theft?","choices":["Administrative access","Higher MTU","Longer DHCP leases","New Wi-Fi channel"],"answer":"Administrative access","explanation":"Stolen credentials may provide privileged or administrative access.","id":"S09Q50"}],[{"fact_id":"type.blind.genericpage","concept_id":"type.blind.genericpage","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"What application behavior often indicates blind SQL injection rather than error-based extraction?","choices":["The database sends DNS callbacks","A generic response hides database errors","UNION results are displayed directly","Detailed stack traces are returned"],"answer":"A generic response hides database errors","explanation":"Blind SQLi is common when useful database errors or query results are hidden.","id":"S10Q01"},{"fact_id":"type.time.jitter","concept_id":"type.time.jitter","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What network condition can make time-based blind SQLi less reliable?","choices":["A prepared statement","A static database name","A fixed HTML template","Variable response latency"],"answer":"Variable response latency","explanation":"Timing inference is harder when normal latency varies significantly.","id":"S10Q02"},{"fact_id":"def.testedapp","concept_id":"def.testedapp","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What deployment rule is recommended for web applications on the server?","choices":["Run every app as admin","Do not use untested web applications","Disable all logging","Expose database errors"],"answer":"Do not use untested web applications","explanation":"The course says to avoid using web applications that have not been tested.","id":"S10Q03"},{"fact_id":"meth.tool.burp","concept_id":"meth.tool.burp","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools","question":"Which tool is listed for intercepting and modifying web requests during SQL injection testing?","choices":["blind_sql_bitshifting","Burp Suite","NoSQLMap","sqlmap"],"answer":"Burp Suite","explanation":"Burp Suite is listed as a SQL injection testing tool during vulnerability detection.","id":"S10Q04"},{"fact_id":"type.heavy.joins","concept_id":"type.heavy.joins","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What database operation makes the course heavy-query example slow?","choices":["A single indexed lookup","A GRANT statement","Multiple joins over system tables","A COMMIT statement"],"answer":"Multiple joins over system tables","explanation":"The heavy query multiplies work by joining system tables repeatedly.","id":"S10Q05"},{"fact_id":"type.oob.oracle","concept_id":"type.oob.oracle","variant":1,"category":"Types of SQL Injection","topic":"Out-of-Band","question":"Which Oracle package can send HTTP requests for out-of-band SQL injection?","choices":["UTL_HTTP","OPENROWSET","xp_dirtree","xp_cmdshell"],"answer":"UTL_HTTP","explanation":"UTL_HTTP can make outbound HTTP requests from Oracle SQL/PLSQL.","id":"S10Q06"},{"fact_id":"type.dist.boolean.time","concept_id":"type.dist.boolean.time","variant":1,"category":"Types of SQL Injection","topic":"Technique Distinctions","question":"Which blind technique infers truth from response content rather than response delay?","choices":["Time Delay","Out-of-Band SQL Injection","Heavy Query","Boolean Exploitation"],"answer":"Boolean Exploitation","explanation":"Boolean blind SQLi compares response behavior/content.","id":"S10Q07"},{"fact_id":"con.output.error","concept_id":"con.output.error","variant":1,"category":"SQL Injection Concepts","topic":"Output Mechanisms","question":"Which application behavior makes error-based SQL injection possible?","choices":["Only static HTML is served","Detailed database errors are returned","All responses have identical timing","DNS is completely disabled"],"answer":"Detailed database errors are returned","explanation":"Error-based SQLi depends on useful database error information reaching the attacker.","id":"S10Q08"},{"fact_id":"type.proc.exec","concept_id":"type.proc.exec","variant":1,"category":"Types of SQL Injection","topic":"Technique Properties","question":"What unsafe operation inside a stored procedure creates SQL injection risk?","choices":["EXEC of dynamically concatenated SQL","A read-only transaction","A static view","A fixed SELECT with bound parameters"],"answer":"EXEC of dynamically concatenated SQL","explanation":"Executing dynamically constructed SQL from user input remains injectable.","id":"S10Q09"},{"fact_id":"meth.temp.table","concept_id":"meth.temp.table","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"Why does the xp_cmdshell workflow create temporary SQL tables?","choices":["To change the HTTP port","To import and expose command output through SQL","To create a new DNS resolver","To store TLS certificates"],"answer":"To import and expose command output through SQL","explanation":"Temporary tables make OS command output queryable through SQL.","id":"S10Q10"},{"fact_id":"con.sql.union","concept_id":"con.sql.union","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQL operator combines compatible SELECT result sets?","choices":["GRANT","UNION","EXEC","HAVING"],"answer":"UNION","explanation":"UNION combines SELECT results.","id":"S10Q11"},{"fact_id":"def.ids","concept_id":"def.ids","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What security monitoring can help detect SQL injection attempts at network, host, and application layers?","choices":["Intrusion detection systems","Only RAID monitoring","Only DHCP logging","Only NTP monitoring"],"answer":"Intrusion detection systems","explanation":"The checklist recommends network, host, and application IDS coverage.","id":"S10Q12"},{"fact_id":"meth.header.cookie","concept_id":"meth.header.cookie","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Alternate Inputs","question":"Which client-supplied state header can become a SQLi vector if incorporated into database queries?","choices":["Cookie","Date","Connection","Accept-Encoding only"],"answer":"Cookie","explanation":"Cookie values can become injection points if used unsafely in SQL.","id":"S10Q13"},{"fact_id":"type.error.dbms","concept_id":"type.error.dbms","variant":1,"category":"Types of SQL Injection","topic":"In-band Techniques","question":"Why can error-based SQL injection payloads differ across database systems?","choices":["TCP ports change per query","Browsers encrypt SQL syntax","SQL has no standard keywords","Error behavior and functions are DBMS-specific"],"answer":"Error behavior and functions are DBMS-specific","explanation":"Different DBMS products expose information through different functions and error formats.","id":"S10Q14"},{"fact_id":"def.blacklistweak","concept_id":"def.blacklistweak","variant":1,"category":"SQL Injection Countermeasures","topic":"Input Validation","question":"Why are simple SQL keyword blacklists fragile?","choices":["They require TLS","They only work on Linux","They prevent logging","Equivalent syntax and encodings can bypass them"],"answer":"Equivalent syntax and encodings can bypass them","explanation":"The evasion section demonstrates comments, encoding, case changes, and alternate expressions that bypass signatures/blacklists.","id":"S10Q15"},{"fact_id":"con.blind.bits","concept_id":"con.blind.bits","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What is the attacker learning from each blind true/false probe?","choices":["A routing table","A small piece of the hidden database value","A TLS private key","A complete database backup"],"answer":"A small piece of the hidden database value","explanation":"Blind extraction recovers data incrementally.","id":"S10Q16"},{"fact_id":"con.error.dbmstype","concept_id":"con.error.dbmstype","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"Why can a syntax error help identify the backend DBMS?","choices":["All DBMS use identical errors","TCP ports identify every query","The HTTP server adds the DBMS name automatically","Error formats and functions differ across DBMS products"],"answer":"Error formats and functions differ across DBMS products","explanation":"DBMS-specific errors and syntax can fingerprint the backend.","id":"S10Q17"},{"fact_id":"con.comment.effect","concept_id":"con.comment.effect","variant":1,"category":"SQL Injection Concepts","topic":"Query Semantics","question":"What is the purpose of appending a SQL comment marker after an injected condition?","choices":["Force a transaction rollback","Repeat the previous query","Encrypt the remaining query","Ignore the remaining query"],"answer":"Ignore the remaining query","explanation":"Commenting out the remainder removes trailing application-generated conditions such as the password comparison.","id":"S10Q18"},{"fact_id":"def.deploy.test","concept_id":"def.deploy.test","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What must happen before deploying a web application that handles database input?","choices":["Security testing for injection flaws","Grant sysadmin","Expose stack traces","Disable all input validation"],"answer":"Security testing for injection flaws","explanation":"The checklist says not to use untested web applications.","id":"S10Q19"},{"fact_id":"def.multi.validation","concept_id":"def.multi.validation","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What does layered validation protect against?","choices":["DNS latency","Database backups failing","A single validation control missing a malicious representation","TLS certificates expiring"],"answer":"A single validation control missing a malicious representation","explanation":"Multiple validation layers reduce single-point filtering failures.","id":"S10Q20"},{"fact_id":"def.regex.detect","concept_id":"def.regex.detect","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What is the role of SQLi regex patterns in defense?","choices":["Replace prepared statements","Create database accounts","Make concatenated SQL safe by themselves","Detect suspicious syntax patterns for monitoring/filtering"],"answer":"Detect suspicious syntax patterns for monitoring/filtering","explanation":"Regex signatures are detection aids, not a substitute for safe query construction.","id":"S10Q21"},{"fact_id":"eva.meta.1","concept_id":"eva.meta.1","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which token corresponds to single quote in the SQLi detection reference?","choices":["%3E","'","%3C","\\s"],"answer":"'","explanation":"' is listed as the single quote representation.","id":"S10Q22"},{"fact_id":"con.sql.exec","concept_id":"con.sql.exec","variant":1,"category":"SQL Injection Concepts","topic":"SQL Fundamentals","question":"Which SQL keyword/procedure invocation is used to execute dynamically built statements in the stored-procedure example?","choices":["EXEC","ORDER BY","UNION","HAVING"],"answer":"EXEC","explanation":"EXEC executes the dynamically constructed SQL string.","id":"S10Q23"},{"fact_id":"eva.regex.3b","concept_id":"eva.regex.3b","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What SQL punctuation is represented by `%3B`?","choices":["Equals sign (=)","Quote (')","Slash (/)","Semicolon (;)"],"answer":"Semicolon (;)","explanation":"%3B is the URL-encoded semicolon.","id":"S10Q24"},{"fact_id":"meth.tool.sqlmap","concept_id":"meth.tool.sqlmap","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools","question":"Which open-source tool automates SQL injection detection, exploitation, and database takeover?","choices":["Havij","blind_sql_bitshifting","sqlmap","Tamper Dev"],"answer":"sqlmap","explanation":"sqlmap automates multiple SQL injection techniques and DBMS exploitation.","id":"S10Q25"},{"fact_id":"meth.cols.oracle","concept_id":"meth.cols.oracle","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS Enumeration","question":"Which Oracle data dictionary view lists table columns in the course reference?","choices":["syscolumns","syscat.columns","pg_class","all_tab_columns"],"answer":"all_tab_columns","explanation":"Oracle column enumeration uses all_tab_columns.","id":"S10Q26"},{"fact_id":"type.oob.usecase","concept_id":"type.oob.usecase","variant":1,"category":"Types of SQL Injection","topic":"Classification","question":"Which SQL injection type is useful when both direct in-band output and normal blind channels are unsuitable?","choices":["Out-of-Band SQL Injection","In-band SQL Injection","Blind/Inferential SQL Injection","Error-based SQL Injection"],"answer":"Out-of-Band SQL Injection","explanation":"Out-of-band SQLi is used when other result channels are not usable.","id":"S10Q27"},{"fact_id":"type.time.benchmark.role","concept_id":"type.time.benchmark.role","variant":1,"category":"Types of SQL Injection","topic":"Blind Techniques","question":"What does the first argument of MySQL `BENCHMARK(count, expression)` control?","choices":["HTTP status code","Database port","Column count","Number of repetitions"],"answer":"Number of repetitions","explanation":"BENCHMARK repeats the expression the specified number of times.","id":"S10Q28"},{"fact_id":"meth.enum.colbeforedata","concept_id":"meth.enum.colbeforedata","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"Why is a target column name useful before extracting row values?","choices":["Columns enable HTTP headers","The DBMS port depends on the column","It disables errors","The SELECT must reference the field containing the desired data"],"answer":"The SELECT must reference the field containing the desired data","explanation":"Data extraction requires naming/selecting the desired field.","id":"S10Q29"},{"fact_id":"con.sql.commentline","concept_id":"con.sql.commentline","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What happens to SQL text after a valid end-of-line comment marker?","choices":["It becomes a new transaction","It is executed twice","It is automatically encrypted","It is ignored by the SQL parser"],"answer":"It is ignored by the SQL parser","explanation":"The comment causes the remainder of the line to be ignored.","id":"S10Q30"},{"fact_id":"eva.concat.dbms","concept_id":"eva.concat.dbms","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why can string-concatenation evasion syntax differ across databases?","choices":["All DBMS use identical concatenation","TLS controls concatenation","Concatenation operators/functions are DBMS-specific","HTTP changes SQL syntax"],"answer":"Concatenation operators/functions are DBMS-specific","explanation":"The course notes DB-specific instructions can build keywords.","id":"S10Q31"},{"fact_id":"def.leastpriv.write","concept_id":"def.leastpriv.write","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Application","question":"What permission should be withheld if the application never needs to modify data?","choices":["TLS permission","SELECT privilege","INSERT/UPDATE/DELETE privileges","CONNECT privilege"],"answer":"INSERT/UPDATE/DELETE privileges","explanation":"Least privilege removes unnecessary write capabilities.","id":"S10Q32"},{"fact_id":"con.goal.retrieve","concept_id":"con.goal.retrieve","variant":1,"category":"SQL Injection Concepts","topic":"Core Concepts","question":"What can SQL injection retrieve directly from the backend database?","choices":["Database information","Kerberos tickets only","Switch CAM entries","RF spectrum data"],"answer":"Database information","explanation":"SQL injection can retrieve data directly from the backend database.","id":"S10Q33"},{"fact_id":"def.exception.safe","concept_id":"def.exception.safe","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"What should safe exception handling separate?","choices":["GET from POST","SQL data from the database","TCP from UDP","Internal diagnostic detail from the user-facing error"],"answer":"Internal diagnostic detail from the user-facing error","explanation":"Defenders need diagnostics without exposing them to clients.","id":"S10Q34"},{"fact_id":"def.regexproc","concept_id":"def.regexproc","variant":1,"category":"SQL Injection Countermeasures","topic":"Core Defenses","question":"What two mechanisms does the course recommend for detecting potentially harmful input?","choices":["Regular expressions and stored procedures","TLS and DNSSEC","ARP and ICMP","NTP and SNMP"],"answer":"Regular expressions and stored procedures","explanation":"The checklist explicitly mentions regular expressions and stored procedures.","id":"S10Q35"},{"fact_id":"meth.err.top1.purpose","concept_id":"meth.err.top1.purpose","variant":1,"category":"SQL Injection Methodology & Tools","topic":"DBMS / Tool Semantics","question":"Why use `TOP 1` while forcing one value into an MSSQL error message?","choices":["Encrypt the returned value","Create a DNS callback","Limit the subquery to a single candidate value","Disable SQL parsing"],"answer":"Limit the subquery to a single candidate value","explanation":"Restricting the subquery to one row makes error-based extraction return one candidate value at a time.","id":"S10Q36"},{"fact_id":"meth.acct.oracle.connect","concept_id":"meth.acct.oracle.connect","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Account Creation","question":"Which Oracle privilege allows the new account to connect to the database?","choices":["sp_addsrvrolemember","INSERT INTO mysql.user","PASSWORD()","GRANT CONNECT"],"answer":"GRANT CONNECT","explanation":"The example grants CONNECT to the created Oracle user.","id":"S10Q37"},{"fact_id":"eva.frag.match","concept_id":"eva.frag.match","variant":1,"category":"Evasion & Detection","topic":"Signature Evasion","question":"Why does inspecting each IP fragment separately often fail to match the full SQLi signature?","choices":["SQL never uses TCP/IP","Fragments cannot contain text","The DBMS ignores fragments","No single fragment contains the complete attack string"],"answer":"No single fragment contains the complete attack string","explanation":"Signature matching may require reassembly of the full payload.","id":"S10Q38"},{"fact_id":"con.hidden.fields","concept_id":"con.hidden.fields","variant":1,"category":"SQL Injection Concepts","topic":"Detection Concepts","question":"Which web input should be tested even though it is not visible in the normal page UI?","choices":["Only CSS classes","TLS cipher suites","Router ARP cache","Hidden fields"],"answer":"Hidden fields","explanation":"The methodology explicitly includes hidden fields among injection points to enumerate.","id":"S10Q39"},{"fact_id":"con.blind.channel","concept_id":"con.blind.channel","variant":1,"category":"SQL Injection Concepts","topic":"SQL Semantics","question":"What observable side channels can blind SQL injection use when data is not displayed?","choices":["Only DNS zone transfers","Only TLS renegotiation","Response differences or timing","Only ICMP payloads"],"answer":"Response differences or timing","explanation":"Blind SQLi infers truth from content/behavior or time.","id":"S10Q40"},{"fact_id":"eva.detect.alttrue","concept_id":"eva.detect.alttrue","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why should detection avoid matching only the literal `OR 1=1` tautology?","choices":["OR is not SQL","Many equivalent always-true expressions exist","1=1 is always false","Only UNION matters"],"answer":"Many equivalent always-true expressions exist","explanation":"The course lists sophisticated matches and variations as evasion techniques.","id":"S10Q41"},{"fact_id":"eva.frag.firstlast","concept_id":"eva.frag.firstlast","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Why can sending the first fragment last confuse simplistic inspection?","choices":["The browser drops cookies","The DBMS changes port","Critical header/payload context arrives after later fragments","TLS expires"],"answer":"Critical header/payload context arrives after later fragments","explanation":"Out-of-order arrival can complicate or defeat incomplete reassembly logic.","id":"S10Q42"},{"fact_id":"eva.frag.random","concept_id":"eva.frag.random","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"What must a robust IDS do with out-of-order fragments?","choices":["Ignore all fragments","Convert them to UDP","Inspect only the first fragment","Reassemble them consistently before signature matching"],"answer":"Reassemble them consistently before signature matching","explanation":"Correct normalization/reassembly prevents fragmentation evasion.","id":"S10Q43"},{"fact_id":"eva.regex.or","concept_id":"eva.regex.or","variant":1,"category":"Evasion & Detection","topic":"Detection Regex","question":"Which encoded letters are explicitly matched to detect `OR` in a typical SQL injection pattern?","choices":["%6F/%4F and %72/%52","%2D and %23","%3D and %3B","%3C and %3E"],"answer":"%6F/%4F and %72/%52","explanation":"The pattern accepts encoded or literal O/o and R/r characters.","id":"S10Q44"},{"fact_id":"def.parameter.taut","concept_id":"def.parameter.taut","variant":1,"category":"SQL Injection Countermeasures","topic":"Defense Reasoning","question":"Why does parameterization stop an input such as `OR 1=1` from becoming a tautology?","choices":["The password is always correct","The text is bound as data instead of appended to the WHERE expression","The DBMS no longer supports OR","The query runs over DNS"],"answer":"The text is bound as data instead of appended to the WHERE expression","explanation":"The attacker cannot alter the SQL grammar through a bound value.","id":"S10Q45"},{"fact_id":"type.inline.syntax","concept_id":"type.inline.syntax","variant":1,"category":"Types of SQL Injection","topic":"Technique Understanding","question":"What remains semantically intact when SQL keywords are split by valid in-line comments?","choices":["The TCP sequence number","The database port","The HTTP status code only","The SQL statement"],"answer":"The SQL statement","explanation":"Comments can change representation while the DBMS still parses the intended SQL.","id":"S10Q46"},{"fact_id":"meth.sqlmap.D","concept_id":"meth.sqlmap.D","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Tools & DBMS","question":"Which sqlmap option selects a specific database?","choices":["-D","--dump","-T","-u"],"answer":"-D","explanation":"`-D` selects the database.","id":"S10Q47"},{"fact_id":"eva.frag.order.2","concept_id":"eva.frag.order.2","variant":1,"category":"Evasion & Detection","topic":"IP Fragmentation","question":"Which evasion pattern sends the first fragment after the rest?","choices":["Random/out-of-order","First fragment last","Reverse order","Last fragment first"],"answer":"First fragment last","explanation":"The course lists this as an IP-fragmentation evasion pattern.","id":"S10Q48"},{"fact_id":"meth.zap.scope","concept_id":"meth.zap.scope","variant":1,"category":"SQL Injection Methodology & Tools","topic":"Methodology Understanding","question":"Why is OWASP ZAP suitable for SQLi testing beyond one fixed payload?","choices":["It supports automated and manual web testing","It only parses DNS","It only captures Bluetooth","It is a database server"],"answer":"It supports automated and manual web testing","explanation":"ZAP combines scanning with interactive testing capabilities.","id":"S10Q49"},{"fact_id":"eva.url.decode","concept_id":"eva.url.decode","variant":1,"category":"Evasion & Detection","topic":"Evasion Understanding","question":"Where must URL-encoded SQLi be decoded before the backend can execute the intended characters?","choices":["In the Ethernet switch","In the DNS root zone","In the TLS certificate","In the web/application request-processing path"],"answer":"In the web/application request-processing path","explanation":"Percent-encoded input is decoded by web/application components before database use.","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-module15-sqli-500-unique-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>SQL Injection — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">SQL Injection (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">SQL Injection (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
