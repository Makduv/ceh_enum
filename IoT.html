<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Module 18 — IoT & OT Hacking — 500 Unique Direct Questions</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"fact_id":"iot.model.backendwhy","concept_id":"iot.model.backendwhy","variant":1,"category":"IoT Concepts & Architecture","topic":"IoT Core Concepts","question":"What distinguishes Backend Data-Sharing from basic Device-to-Cloud communication?","choices":["Only local serial buses are used","The device loses all cloud connectivity","Third parties can access or analyze cloud-held device data","The device becomes air-gapped"],"answer":"Third parties can access or analyze cloud-held device data","explanation":"Backend Data-Sharing extends cloud data access to additional parties/services.","id":"S01Q01"},{"fact_id":"ot.loop.closed","concept_id":"ot.loop.closed","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Core Understanding","question":"Which control-loop type automatically uses output feedback to adjust the process toward a target?","choices":["Backend Data-Sharing","Open Telnet","Manual Loop","Closed Loop"],"answer":"Closed Loop","explanation":"In a closed loop, process output feeds back into control decisions.","id":"S01Q02"},{"fact_id":"iot.v.unenc","concept_id":"iot.v.unenc","variant":1,"category":"IoT Attacks, Vulnerabilities & Attack Surface","topic":"OWASP IoT Vulnerabilities","question":"Which IoT vulnerability exposes management or application traffic in plaintext?","choices":["Username Enumeration","Unencrypted Services","Obtaining Console Access","Firmware and Storage Extraction"],"answer":"Unencrypted Services","explanation":"Unencrypted Services matches the vulnerability described in the CEH IoT list.","id":"S01Q03"},{"fact_id":"ot.def.dmz","concept_id":"ot.def.dmz","variant":1,"category":"OT/ICS Countermeasures & Security Controls","topic":"Defense Reasoning","question":"What architecture provides a controlled buffer between enterprise IT and OT when a full air gap is impractical?","choices":["Public cloud subnet","Flat VLAN","Guest Wi-Fi","Industrial DMZ"],"answer":"Industrial DMZ","explanation":"The Purdue model uses a DMZ to separate IT and OT.","id":"S01Q04"},{"fact_id":"iot.dev.update","concept_id":"iot.dev.update","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"Secure Development","question":"Which development practice protects the authenticity and integrity of firmware delivery?","choices":["Secure Firmware/Software Updates","Threat Modeling","Secure Coding Practices","Secure Communication Protocols"],"answer":"Secure Firmware/Software Updates","explanation":"Secure Firmware/Software Updates is one of the secure IoT development practices listed by CEH.","id":"S01Q05"},{"fact_id":"iot.phys.storage","concept_id":"iot.phys.storage","variant":1,"category":"IoT Attacks, Vulnerabilities & Attack Surface","topic":"IoT Attack Understanding","question":"Which physical-interface risk lets an attacker analyze storage outside the original device?","choices":["Code signing","OCSP stapling","Removal of storage media","Network segmentation"],"answer":"Removal of storage media","explanation":"Removable storage can be extracted and examined offline.","id":"S01Q06"},{"fact_id":"iot.surf.web","concept_id":"iot.surf.web","variant":1,"category":"IoT Attacks, Vulnerabilities & Attack Surface","topic":"OWASP IoT Attack Surface","question":"Which OWASP IoT attack surface covers the web UI hosted directly on the device?","choices":["Device Memory","Device Web Interface","Local Data Storage","Update Mechanism"],"answer":"Device Web Interface","explanation":"Device Web Interface is the OWASP IoT attack surface that matches the described component.","id":"S01Q07"},{"fact_id":"ot.loop.manual","concept_id":"ot.loop.manual","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Core Understanding","question":"Which control-loop type is completely under human control?","choices":["Manual Loop","Automatic Failover","Device-to-Cloud","Closed Loop"],"answer":"Manual Loop","explanation":"The module defines a Manual Loop as fully human-controlled.","id":"S01Q08"},{"fact_id":"iot.tool.multi","concept_id":"iot.tool.multi","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"IoT Tools","question":"Which tool can scan a range of addresses to identify responsive IoT hosts?","choices":["Cascoda Packet Sniffer","MultiPing","DIVA","FCC ID Search"],"answer":"MultiPing","explanation":"MultiPing is the tool associated with that IoT testing activity.","id":"S01Q09"},{"fact_id":"ot.proto3.3","concept_id":"ot.proto3.3","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Protocol Placement","question":"At which Purdue level is `IEC 61850` listed in the CEH protocol table?","choices":["Level 0/1","Level 4/5","Level 2","Level 3"],"answer":"Level 3","explanation":"IEC 61850 is listed at Purdue Level 3.","id":"S01Q10"},{"fact_id":"ot.fragile","concept_id":"ot.fragile","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Basics","question":"Why can aggressive scanning be dangerous on legacy OT devices?","choices":["Scanning automatically patches firmware","Every PLC has unlimited resources","Fragile devices may crash on unexpected or heavy traffic","OT devices always block scans"],"answer":"Fragile devices may crash on unexpected or heavy traffic","explanation":"The supplemental chapter notes that some industrial devices are fragile and can fail under anomalous traffic.","id":"S01Q11"},{"fact_id":"iot.t.ransom","concept_id":"iot.t.ransom","variant":1,"category":"IoT Attacks, Vulnerabilities & Attack Surface","topic":"IoT Threats","question":"Which threat encrypts or locks IoT resources and demands payment?","choices":["Forged Malicious Device","BlueBorne Attack","Ransomware","Network Pivoting"],"answer":"Ransomware","explanation":"Ransomware matches the IoT threat described in the CEH module.","id":"S01Q12"},{"fact_id":"iot.telnet.first","concept_id":"iot.telnet.first","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"IoT Methodology Reasoning","question":"What should an attacker identify before trying credentials against an IoT Telnet service?","choices":["A signed firmware image","An open Telnet port","A CRL","A cloud IAM role"],"answer":"An open Telnet port","explanation":"The methodology begins by scanning for exposed Telnet.","id":"S01Q13"},{"fact_id":"ot.proto45.8","concept_id":"ot.proto45.8","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Protocol Placement","question":"At which Purdue level group is `Wi-Fi` listed in the CEH protocol table?","choices":["Level 0/1","Level 3","Level 4/5","Level 2"],"answer":"Level 4/5","explanation":"Wi-Fi is listed at Purdue Level 4/5.","id":"S01Q14"},{"fact_id":"iot.cm.48101why","concept_id":"iot.cm.48101why","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"IoT Methodology Reasoning","question":"Why is port 48101 specifically monitored in the CEH IoT countermeasures?","choices":["It is the standard Modbus port","Infected devices may use it to spread malicious files","It carries OCSP","It is the JTAG port"],"answer":"Infected devices may use it to spread malicious files","explanation":"The module explicitly links port 48101 with malware spreading.","id":"S01Q15"},{"fact_id":"ot.protoabuse","concept_id":"ot.protoabuse","variant":1,"category":"OT/ICS Attacks, Methodology & Tools","topic":"OT Attacks","question":"What makes old industrial protocols such as Modbus and CAN attractive for protocol-abuse attacks?","choices":["They require mutual TLS","They may lack strong authentication and security controls","They are always air-gapped","They rotate keys every packet"],"answer":"They may lack strong authentication and security controls","explanation":"Legacy industrial protocols were often designed without modern security controls.","id":"S01Q16"},{"fact_id":"ot.side.goal","concept_id":"ot.side.goal","variant":1,"category":"OT/ICS Attacks, Methodology & Tools","topic":"OT Attacks","question":"What secret is recovered in the OT power-analysis example?","choices":["SCADA hostname only","Cryptographic key / password information","Purdue level","MAC OUI only"],"answer":"Cryptographic key / password information","explanation":"Power-profile differences can leak secret-dependent information.","id":"S01Q17"},{"fact_id":"iot.cm.authwhy","concept_id":"iot.cm.authwhy","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"Countermeasure Understanding","question":"What common IoT weakness does strong authentication directly address?","choices":["Weak or default credentials","Firmware version disclosure","RF interference","Physical sensor failure"],"answer":"Weak or default credentials","explanation":"Strong authentication reduces risk from weak/default credentials.","id":"S01Q18"},{"fact_id":"iot.tool.cat","concept_id":"iot.tool.cat","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"IoT Tools","question":"Which listed IoT tool is a multiprotocol packet sniffer for embedded/radio analysis?","choices":["MultiPing","RFCrack","CatSniffer","Cascoda Packet Sniffer"],"answer":"CatSniffer","explanation":"CatSniffer is the tool associated with that IoT testing activity.","id":"S01Q19"},{"fact_id":"iot.app.2","concept_id":"iot.app.2","variant":1,"category":"IoT Concepts & Architecture","topic":"IoT Protocols","question":"What type of IoT technology is `LWM2M` in the CEH table?","choices":["IoT operating system","IoT application protocol","Wired technology","Wireless technology"],"answer":"IoT application protocol","explanation":"LWM2M is listed as an IoT application protocol.","id":"S01Q20"},{"fact_id":"ot.shodan.modbus","concept_id":"ot.shodan.modbus","variant":1,"category":"OT/ICS Attacks, Methodology & Tools","topic":"OT Methodology Understanding","question":"Which Shodan query targets Internet-exposed Modbus systems?","choices":["`port:20000`","`port:443`","`port:23`","`port:502`"],"answer":"`port:502`","explanation":"The OT methodology uses `port:502` to find Modbus-enabled systems.","id":"S01Q21"},{"fact_id":"ot.shodan.geo","concept_id":"ot.shodan.geo","variant":1,"category":"OT/ICS Attacks, Methodology & Tools","topic":"OT Methodology Understanding","question":"What does ``\"SCADA Country:US\"`` add to a SCADA Shodan search?","choices":["Firmware signing","Protocol fuzzing","Password spraying","Geographic filtering"],"answer":"Geographic filtering","explanation":"The example narrows SCADA results by country.","id":"S01Q22"},{"fact_id":"ot.proto01.6","concept_id":"ot.proto01.6","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Protocol Placement","question":"At which Purdue level group is `ISA SP100` listed in the CEH protocol table?","choices":["Level 0/1","Level 4/5","Level 2","Level 3"],"answer":"Level 0/1","explanation":"ISA SP100 is listed at Purdue Level 0/1.","id":"S01Q23"},{"fact_id":"iot.cm.patch","concept_id":"iot.cm.patch","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"IoT Countermeasures","question":"Which control addresses known vulnerabilities in device software over time?","choices":["Disable Telnet","Unified integrated security","Disable guest/demo accounts","Regular patching/firmware updates"],"answer":"Regular patching/firmware updates","explanation":"Regular patching/firmware updates is one of the IoT countermeasures in the CEH module.","id":"S01Q24"},{"fact_id":"iot.tech.short.7","concept_id":"iot.tech.short.7","variant":1,"category":"IoT Concepts & Architecture","topic":"IoT Technologies","question":"How is `Wi-Fi Direct` classified in the CEH IoT technology table?","choices":["Long-range wireless","Medium-range wireless","Short-range wireless","Wired communication"],"answer":"Short-range wireless","explanation":"Wi-Fi Direct is listed as a short-range wireless IoT technology.","id":"S01Q25"},{"fact_id":"ot.def.macauth","concept_id":"ot.def.macauth","variant":1,"category":"OT/ICS Countermeasures & Security Controls","topic":"OT Defense Reasoning","question":"What does MAC authentication at Level 0 help control?","choices":["Which CA signs TLS","Which user reads email","Which cloud region runs SaaS","Which local devices are allowed to communicate"],"answer":"Which local devices are allowed to communicate","explanation":"MAC authentication can restrict device communication at the lowest layer.","id":"S01Q26"},{"fact_id":"ot.cm.logs","concept_id":"ot.cm.logs","variant":1,"category":"OT/ICS Countermeasures & Security Controls","topic":"OT Hardening","question":"Which control supports continuous detection by reviewing industrial event records over time?","choices":["Static passwords","Continuous log monitoring","Disable logging","Guest accounts"],"answer":"Continuous log monitoring","explanation":"The module recommends continuous monitoring of log data.","id":"S01Q27"},{"fact_id":"iot.sec.mobile.api","concept_id":"iot.sec.mobile.api","variant":1,"category":"IoT Concepts & Architecture","topic":"Security Architecture","question":"Which IoT security layer covers insecure APIs in the companion smartphone app?","choices":["Cloud","Mobile","Application","Network"],"answer":"Mobile","explanation":"Mobile is the layer associated with that IoT security concern.","id":"S01Q28"},{"fact_id":"iot.phys.reset","concept_id":"iot.phys.reset","variant":1,"category":"IoT Attacks, Vulnerabilities & Attack Surface","topic":"IoT Attack Understanding","question":"Which physical attack can restore a device to a weaker default configuration?","choices":["Account lockout","Firmware signing","TLS renegotiation","Reset to insecure state"],"answer":"Reset to insecure state","explanation":"The module lists reset-to-insecure-state as a physical-interface weakness.","id":"S01Q29"},{"fact_id":"iot.tech.long.4","concept_id":"iot.tech.long.4","variant":1,"category":"IoT Concepts & Architecture","topic":"IoT Technologies","question":"How is `VSAT` classified in the CEH IoT technology table?","choices":["Long-range wireless","Wired communication","Short-range wireless","Medium-range wireless"],"answer":"Long-range wireless","explanation":"VSAT is listed as long-range wireless.","id":"S01Q30"},{"fact_id":"ot.def.airgap","concept_id":"ot.def.airgap","variant":1,"category":"OT/ICS Countermeasures & Security Controls","topic":"Defense Reasoning","question":"What provides the strongest isolation when an OT network is physically disconnected from Internet-connected networks?","choices":["Public Wi-Fi","Port forwarding","Air gap","UPnP"],"answer":"Air gap","explanation":"The supplemental OT section describes air-gapping as the strongest separation.","id":"S01Q31"},{"fact_id":"ot.proto01.3","concept_id":"ot.proto01.3","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Protocol Placement","question":"At which Purdue level group is `Crimson` listed in the CEH protocol table?","choices":["Level 2","Level 0/1","Level 3","Level 4/5"],"answer":"Level 0/1","explanation":"Crimson is listed at Purdue Level 0/1.","id":"S01Q32"},{"fact_id":"iot.bestorm.blackbox","concept_id":"iot.bestorm.blackbox","variant":1,"category":"IoT Methodology, Tools & Countermeasures","topic":"IoT Methodology Reasoning","question":"What testing style does beSTORM use against IoT protocols?","choices":["Packet routing","Static source-code review only","Certificate validation","Automated black-box fuzzing"],"answer":"Automated black-box fuzzing","explanation":"beSTORM is described as an automated black-box auditing/fuzzing tool.","id":"S01Q33"},{"fact_id":"ot.cm.audit","concept_id":"ot.cm.audit","variant":1,"category":"OT/ICS Countermeasures & Security Controls","topic":"OT Countermeasures","question":"Which control periodically validates that industrial security safeguards remain effective?","choices":["Periodic industrial security audits","Layered VPN remote access","Anti-malware scanning","Cryptographic signatures on updates"],"answer":"Periodic industrial security audits","explanation":"Periodic industrial security audits is an OT countermeasure listed in the CEH module.","id":"S01Q34"},{"fact_id":"ot.estop","concept_id":"ot.estop","variant":1,"category":"OT/ICS Attacks, Methodology & Tools","topic":"OT Attacks","question":"What safety function can be abused through protocol manipulation in the course example?","choices":["Certificate revocation","Emergency stop (e-stop)","File compression","DNS caching"],"answer":"Emergency stop (e-stop)","explanation":"The module gives e-stop abuse as a protocol-abuse example.","id":"S01Q35"},{"fact_id":"iot.dnsreb.target","concept_id":"iot.dnsreb.target","variant":1,"category":"IoT Attacks, Vulnerabilities & Attack Surface","topic":"Attack Understanding","question":"What does DNS rebinding try to make a victim browser access after DNS resolution changes?","choices":["A disconnected USB device","Only a public CDN","Internal/local IoT service","A CRL file"],"answer":"Internal/local IoT service","explanation":"DNS rebinding uses the browser as a bridge to internal services.","id":"S01Q36"},{"fact_id":"ot.zone.l21.ipsec","concept_id":"ot.zone.l21.ipsec","variant":1,"category":"OT/ICS Countermeasures & Security Controls","topic":"Purdue Security Controls","question":"Where are IPsec communication encryption, security gateways, and authorized RTU/PLC commands emphasized?","choices":["Physical Level 0","Industrial DMZ Level 3.5","Enterprise Levels 4/5","Control Levels 2/1"],"answer":"Control Levels 2/1","explanation":"Control Levels 2/1 is the zone/level associated with those controls in the CEH table.","id":"S01Q37"},{"fact_id":"ot.proto3.1","concept_id":"ot.proto3.1","variant":1,"category":"OT/ICS Concepts & Architecture","topic":"OT Protocol Placement","question":"At which Purdue level is `HSCP` listed in the CEH protocol table?","choices":["Level 0/1","Level 2","Level 3","Level 4/5"],"answer":"Level 3","explanation":"HSCP is listed at Purdue Level 3.","id":"S01Q38"},{"fact_id":"iot.phys.fwextract","concept_id":"iot.phys.fwextract","variant":1,"category":"IoT Attacks, Vulnerabilities & Attac 1,"category":"IoT Methodology, Tools & Countermeasures","topic":"Countermeasure Understanding","question":"What attack does IoT account lockout primarily slow?","choices":["RF jamming","Online password guessing","DNS rebinding","Firmware extraction"],"answer":"Online password guessing","explanation":"Lockout limits repeated authentication guesses.","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-module18-iot-ot-500-unique-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>IoT & OT Hacking — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">IoT & OT Hacking (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">IoT & OT Hacking (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
