<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Module 13 — Hacking Web Servers — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"fact_id":"cx.pers.firewallbypass","concept_id":"cx.pers.firewallbypass","variant":1,"category":"Web Server Concepts","topic":"Perspectives","question":"What can active browser content sometimes bypass according to the end-user perspective?","choices":["UPS systems","Firewalls","CPU caches","RAID arrays"],"answer":"Firewalls","explanation":"The notes state that active content can introduce malware risks bypassing firewalls.","id":"S01Q01"},{"fact_id":"a.dnshijack.destination","concept_id":"a.dnshijack.destination","variant":1,"category":"Web Server Attacks","topic":"DNS Hijacking","question":"Where are users redirected after DNS mappings are maliciously changed?","choices":["NTP server","Print server","Attacker-controlled site","Local loopback only"],"answer":"Attacker-controlled site","explanation":"Changed DNS records direct users to the attacker-controlled site.","id":"S01Q02"},{"fact_id":"m.stage.next.1","concept_id":"m.stage.next.1","variant":1,"category":"Web Server Attack Methodology","topic":"Methodology Order","question":"What stage follows Information Gathering?","choices":["Information Gathering","Website Mirroring","Web Server Footprinting","Web Server Passwords Hacking"],"answer":"Web Server Footprinting","explanation":"Web Server Footprinting follows Information Gathering.","id":"S01Q03"},{"fact_id":"ax.cache.triggeragain","concept_id":"ax.cache.triggeragain","variant":1,"category":"Web Server Attacks","topic":"Cache Poisoning","question":"Why does the attacker request the page again during cache poisoning?","choices":["To renew DHCP","To rotate keys","To enumerate SNMP","To create/store the cache entry"],"answer":"To create/store the cache entry","explanation":"The repeat request helps generate the poisoned cache entry.","id":"S01Q04"},{"fact_id":"d.check.15","concept_id":"d.check.15","variant":1,"category":"Web Server Attack Countermeasures","topic":"19-Point Checklist","question":"What must be completed before an IIS server is connected to the Internet?","choices":["Cautious URL mappings","Server-side session tracking","Harden before Internet","Separate database server"],"answer":"Harden before Internet","explanation":"Do not connect IIS to the Internet until fully hardened.","id":"S01Q05"},{"fact_id":"d.check.18","concept_id":"d.check.18","variant":1,"category":"Web Server Attack Countermeasures","topic":"19-Point Checklist","question":"How much web-server functionality should remain enabled?","choices":["Minimum functionality","Cautious URL mappings","Remove script mappings","Physical protection"],"answer":"Minimum functionality","explanation":"Enable only the web technologies actually required.","id":"S01Q06"},{"fact_id":"c.stack.example.7","concept_id":"c.stack.example.7","variant":1,"category":"Web Server Concepts","topic":"7-Stack","question":"Which technology or risk is associated with Custom Web Applications in the 7-stack model?","choices":["Windows/Linux/macOS","IPS/IDS","Apache/IIS","Business Logic Flaws"],"answer":"Business Logic Flaws","explanation":"The course maps Custom Web Applications to Business Logic Flaws.","id":"S01Q07"},{"fact_id":"d.ssl.uploadroot","concept_id":"d.ssl.uploadroot","variant":1,"category":"Web Server Attack Countermeasures","topic":"Files/SSL","question":"Why should uploaded files be stored outside the web root?","choices":["Improve DNS speed","Reduce NTP drift","Prevent direct web execution/access","Increase TLS key length"],"answer":"Prevent direct web execution/access","explanation":"Keeping uploads outside the web root reduces direct exposure and execution risk.","id":"S01Q08"},{"fact_id":"ax.mis.apache.status","concept_id":"ax.mis.apache.status","variant":1,"category":"Web Server Attacks","topic":"Misconfiguration","question":"What sensitive operational page can the Apache server-status handler expose?","choices":["DNS zone file","Server status page","SAM database","Kerberos TGT"],"answer":"Server status page","explanation":"The example exposes Apache server-status information.","id":"S01Q09"},{"fact_id":"mx.fp.robotsrisk","concept_id":"mx.fp.robotsrisk","variant":1,"category":"Web Server Attack Methodology","topic":"Footprinting","question":"Why can robots.txt be valuable during web-server footprinting?","choices":["It disables TLS","It reveals disallowed paths","It resets passwords","It exposes private keys automatically"],"answer":"It reveals disallowed paths","explanation":"robots.txt can disclose directories that site owners prefer crawlers not access.","id":"S01Q10"},{"fact_id":"d.cas.dotdot","concept_id":"d.cas.dotdot","variant":1,"category":"Web Server Attack Countermeasures","topic":"Code Access Security","question":"What should IIS do with URLs containing ../ sequences?","choices":["Install patches/updates","Secure coding","Enable debug mode","Reject ../ URLs"],"answer":"Reject ../ URLs","explanation":"IIS should be configured to reject traversal-style URLs.","id":"S01Q11"},{"fact_id":"a.split.stage.5","concept_id":"a.split.stage.5","variant":1,"category":"Web Server Attacks","topic":"Response Splitting","question":"What occurs at stage 5 of HTTP response splitting?","choices":["Attacker receives victim-related response","Victim receives second response","Attacker requests index.html","Attacker receives first response"],"answer":"Attacker requests index.html","explanation":"Stage 5: Attacker requests index.html.","id":"S01Q12"},{"fact_id":"c.ng.master.socket","concept_id":"c.ng.master.socket","variant":1,"category":"Web Server Concepts","topic":"NGINX","question":"Which NGINX process creates, binds, and closes sockets?","choices":["Cache Manager","Backend Server","Master Process","Worker Processes"],"answer":"Master Process","explanation":"Socket lifecycle management is a master-process responsibility.","id":"S01Q13"},{"fact_id":"a.trav.precondition","concept_id":"a.trav.precondition","variant":1,"category":"Web Server Attacks","topic":"Directory Traversal","question":"What coding weakness commonly enables directory traversal?","choices":["Strong HSTS","DNSSEC","Missing input validation","Certificate pinning"],"answer":"Missing input validation","explanation":"The server is vulnerable when browser input is not properly validated.","id":"S01Q14"},{"fact_id":"d.acct.9","concept_id":"d.acct.9","variant":1,"category":"Web Server Attack Countermeasures","topic":"Accounts","question":"How should administrator/root access be limited?","choices":["OpenVPN","URL authorization","Limit root/admin users","Login failure monitoring"],"answer":"Limit root/admin users","explanation":"Restrict administrator/root access to the minimum number of users.","id":"S01Q15"},{"fact_id":"dx.ssl.version","concept_id":"dx.ssl.version","variant":1,"category":"Web Server Attack Countermeasures","topic":"Files/SSL","question":"What control allows web-application files to be tracked and reverted after changes?","choices":["Version control","DNS recursion","ARP cache","Port knocking"],"answer":"Version control","explanation":"Version control tracks and can revert file changes.","id":"S01Q16"},{"fact_id":"m.pwd.method.2","concept_id":"m.pwd.method.2","variant":1,"category":"Web Server Attack Methodology","topic":"Password Hacking","question":"Which password attack combines dictionary words with mutations or additions?","choices":["Dictionary attack","Brute-force attack","DNS spoofing","Hybrid attack"],"answer":"Hybrid attack","explanation":"Hybrid attack is listed as a web-server password-hacking method.","id":"S01Q17"},{"fact_id":"m.stage.number.3","concept_id":"m.stage.number.3","variant":1,"category":"Web Server Attack Methodology","topic":"Methodology Order","question":"What is stage 3 of the web-server attack methodology?","choices":["Web Server Passwords Hacking","Information Gathering","Website Mirroring","Session Hijacking"],"answer":"Website Mirroring","explanation":"Stage 3 is Website Mirroring.","id":"S01Q18"},{"fact_id":"d.port.80","concept_id":"d.port.80","variant":1,"category":"Web web-server attack methodology?","choices":["Web Server Footprinting","Web Server Passwords Hacking","Information Gathering","Vulnerability Scanning"],"answer":"Web Server Passwords Hacking","explanation":"Web Server Passwords Hacking is stage 6.","id":"S01Q24"},{"fact_id":"d.check.metabase","concept_id":"d.check.metabase","variant":1,"category":"Web Server Attack Countermeasures","topic":"19-Point Checklist","question":"What IIS configuration store should be protected with hardened NTFS permissions?","choices":["MIB","Metabase","Hosts file","ARP table"],"answer":"Metabase","explanation":"The IIS metabase should have restricted file access.","id":"S01Q25"},{"fact_id":"my.ig.stagefirst","concept_id":"my.ig.stagefirst","variant":1,"category":"Web Server Attack Methodology","topic":"Methodology Order","question":"What is the first stage of the six-step web-server attack methodology?","choices":["Web Server Passwords Hacking","Information Gathering","Vulnerability Scanning","Web Server Footprinting"],"answer":"Information Gathering","explanation":"Information Gathering is stage 1.","id":"S01Q26"},{"fact_id":"ax.cache.tworeplies","concept_id":"ax.cache.tworeplies","variant":1,"category":"Web Server Attacks","topic":"Cache Poisoning","question":"What behavior in the malicious cache-poisoning request helps create poisoned content?","choices":["One ICMP reply","Two generated responses","Three TLS handshakes","One DNSSEC signature"],"answer":"Two generated responses","explanation":"The crafted request generates two responses in the course sequence.","id":"S01Q27"},{"fact_id":"cx.ng.clients","concept_id":"cx.ng.clients","variant":1,"category":"Web Server Concepts","topic":"NGINX","question":"What NGINX component receives client requests directly?","choices":["Cache Manager","Cache Loader","Worker Processes","Master Process"],"answer":"Worker Processes","explanation":"Clients send requests to NGINX worker processes.","id":"S01Q28"},{"fact_id":"dx.check.dbseparate","concept_id":"dx.check.dbseparate","variant":1,"category":"Web Server Attack Countermeasures","topic":"19-Point Checklist","question":"Should MS SQL run on the same machine as the public web server according to the checklist?","choices":["Only with FTP","Only on port 80","No","Yes"],"answer":"No","explanation":"The backend database should be installed on a separate server.","id":"S01Q29"},{"fact_id":"m.fp.ai","concept_id":"m.fp.ai","variant":1,"category":"Web Server Attack Methodology","topic":"Footprinting","question":"What AI tool is mentioned as able to generate web-server footprinting commands?","choices":["Nessus","Hydra","Reaver","ChatGPT"],"answer":"ChatGPT","explanation":"The notes mention AI-assisted footprinting with ChatGPT.","id":"S01Q30"},{"fact_id":"a.split.stage.4","concept_id":"a.split.stage.4","variant":1,"category":"Web Server Attacks","topic":"Response Splitting","question":"What occurs at stage 4 of HTTP response splitting?","choices":["Attacker sends splitting request","Attacker receives victim-related response","Victim receives second response","Attacker requests index.html"],"answer":"Victim receives second response","explanation":"Stage 4: Victim receives second response.","id":"S01Q31"},{"fact_id":"dx.check.sharesperm","concept_id":"dx.check.sharesperm","variant":1,"category":"Web Server Attack Countermeasures","topic":"19-Point Checklist","question":"What permission system should secure any remaining Windows file shares?","choices":["No permissions","Anonymous write","World-writable ACLs","NTFS permissions"],"answer":"NTFS permissions","explanation":"Remaining shares should use restricted NTFS permissions.","id":"S01Q32"},{"fact_id":"dx.ssl.waf","concept_id":"dx.ssl.waf","variant":1,"category":"Web Server Attack Countermeasures","topic":"Files/SSL","question":"What control is recommended against SQL injection and common web attacks?","choices":["FTP proxy","DHCP relay","NTP server","WAF"],"answer":"WAF","explanation":"A Web Application Firewall is recommended for common web attacks.","id":"S01Q33"},{"fact_id":"dy.ssl.sftpreason","concept_id":"dy.ssl.sftpreason","variant":1,"category":"Web Server Attack Countermeasures","topic":"Files/SSL","question":"Why is SFTP preferred over FTP in the checklist?","choices":["It removes file permissions","It disables authentication","It uses no network","It encrypts file transfers"],"answer":"It encrypts file transfers","explanation":"SFTP protects file transfers with encryption.","id":"S01Q34"},{"fact_id":"cx.pers.userperception","concept_id":"cx.pers.userperception","variant":1,"category":"Web Server Concepts","topic":"Perspectives","question":"Why may end users underestimate web-server threats?","choices":["Web traffic is always private","Browsers have no scripts","HTTP cannot carry malware","Browsing feels safe/anonymous"],"answer":"Browsing feels safe/anonymous","explanation":"The course says browsing can feel safe and anonymous to end users.","id":"S01Q35"},{"fact_id":"c.goal.priv","concept_id":"c.goal.priv","variant":1,"category":"Web Server Concepts","topic":"Goals","question":"Which goal seeks higher permissions on the server?","choices":["Compromise a database","Hide/redirect traffic","Escalate privileges","Steal credentials/credit-card data"],"answer":"Escalate privileges","explanation":"Escalate privileges is listed as a common goal behind web-server hacking.","id":"S01Q36"},{"fact_id":"d.check.13","concept_id":"d.check.13","variant":1,"category":"Web Server Attack Countermeasures","topic":"19-Point Checklist","question":"What should be used to automate web-server hardening?","choices":["Dedicated web server","Automated security tools","No IIS on domain controller","Minimum auditing"],"answer":"Automated security tools","explanation":"Use web-server security tools/scanners to automate hardening.","id":"S01Q37"},{"fact_id":"dx.acct.expiry","concept_id":"dx.acct.expiry","variant":1,"category":"Web Server Attack Countermeasures","topic":"Accounts","question":"What policy forces users to change passwords periodically?","choices":["Password reuse","Password expiry","Anonymous access","No expiration"],"answer":"Password expiry","explanation":"Password-expiry policy enforces periodic changes.","id":"S01Q38"},{"fact_id":"az.split.vulncode","concept_id":"az.split.vulncode","variant":1,"category":"Web Server Attacks","topic":"Response Splitting","question":"What coding mistake makes the response-splitting Cookie example vulnerable?","choices":["TLS is renewed","HSTS is enabled","User input is copied without sanitization","The database is separate"],"answer":"User input is copied without sanitization","explanation":"The author parameter is copied into a Cookie without proper sanitization.","id":"S01Q39"},{"fact_id":"dy.patch.gfitypes","concept_id":"dy.patch.gfitypes","variant":1,"category":"Web Server Attack Countermeasures","topic":"Patch Management","question":"What two patch categories can GFI LanGuard install and manage?","choices":["Only database schemas","Only browser extensions","Only firmware patches","Security and non-security patches"],"answer":"Security and non-security patches","explanation":"GFI LanGuard manages both security and non-security patches.","id":"S01Q40"},{"fact_id":"c.stack.below.5","concept_id":"c.stack.below.5","variant":1,"category":"Web Server Concepts","topic":"7-Stack","question":"Which stack level sits immediately below Web Server?","choices":["Database","Third-party Components","Network","Operating System"],"answer":"Database","explanation":"Database is immediately below Web Server in the seven-level model.","id":"S01Q41"},{"fact_id":"a.trav.sequence","concept_id":"a.trav.sequence","variant":1,"category":"Web Server Attacks","topic":"Directory Traversal","question":"What sequence is commonly used to move outside the web root in a directory traversal attack?","choices":["||","&&","../","%00"],"answer":"../","explanation":"The dot-dot-slash sequence is the classic directory traversal pattern.","id":"S01Q42" const STORAGE_KEY = "ceh-v13-module13-hacking-web-servers-unique-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Hacking Web Servers — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Hacking Web Servers (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Hacking Web Servers (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
