<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Social Engineering — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"concept_id":"Identity Theft:89","variant":2,"category":"Identity Theft","question":"What term best fits this clue: fraudulent tax return?","choices":["Financial Identity Theft","Driver's License Identity Theft","Tax Identity Theft","Criminal Identity Theft"],"answer":"Tax Identity Theft","explanation":"Tax Identity Theft: using a victim's tax identifier to file a fraudulent return or claim a refund.","id":"S01Q01"},{"concept_id":"Social Engineering Techniques:44","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: inactive tab changes; waiting until the user switches away and then replacing the tab with a fake sign-in page?","choices":["Pharming","Whaling","Spear Phishing","Tabnabbing"],"answer":"Tabnabbing","explanation":"Tabnabbing: changing the content of an inactive browser tab so it appears to be a familiar login when revisited.","id":"S01Q02"},{"concept_id":"Impersonation on Social Networking Sites:77","variant":0,"category":"Impersonation on Social Networking Sites","question":"Which concept best matches the social-network advantage that lets a hijacked real account message trusted people immediately?","choices":["Existing Contact List","Profile Cloning","Account Takeover","Message History"],"answer":"Existing Contact List","explanation":"Existing Contact List: the social-network advantage that lets a hijacked real account message trusted people immediately.","id":"S01Q03"},{"concept_id":"Social Engineering Techniques:62","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: misleading lookalike URL?","choices":["Website Cloning","Typosquatting","Homograph Attack","URL Hijacking"],"answer":"URL Hijacking","explanation":"URL Hijacking: using a misleading URL that resembles a legitimate destination.","id":"S01Q04"},{"concept_id":"Social Engineering Techniques:58","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: GUI site mirroring?","choices":["Phishing","wget","WinHTTrack","cURL"],"answer":"WinHTTrack","explanation":"WinHTTrack: a graphical tool that can mirror an entire website for offline use.","id":"S01Q05"},{"concept_id":"Social Engineering Concepts:10","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches exploiting recognition or a sense that the requester is known to the target?","choices":["Urgency","Familiarity","Intimidation","Trust"],"answer":"Familiarity","explanation":"Familiarity: exploiting recognition or a sense that the requester is known to the target.","id":"S01Q06"},{"concept_id":"Social Engineering Concepts:3","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: small commitment then escalation?","choices":["Reciprocity","Social Proof","Commitment and Consistency","Authority"],"answer":"Commitment and Consistency","explanation":"Commitment and Consistency: using a small initial commitment to increase the chance of later compliance.","id":"S01Q07"},{"concept_id":"Identity Theft:87","variant":2,"category":"Identity Theft","question":"What term best fits this clue: misuse insurance coverage?","choices":["Driver's License Identity Theft","Insurance Identity Theft","Criminal Identity Theft","Financial Identity Theft"],"answer":"Insurance Identity Theft","explanation":"Insurance Identity Theft: using another person's insurance information to obtain covered treatment or benefits.","id":"S01Q08"},{"concept_id":"PAIR:Rogue Access Point|Captive Portal Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Rogue Access Point and Captive Portal Phishing is correct, in that order?","choices":["fake trusted Wi-Fi / fake Wi-Fi login page","fake Wi-Fi login page / fake trusted Wi-Fi","fake trusted Wi-Fi / observe password entry","observe password entry / fake Wi-Fi login page"],"answer":"fake trusted Wi-Fi / fake Wi-Fi login page","explanation":"Rogue Access Point means fake trusted Wi-Fi; Captive Portal Phishing means fake Wi-Fi login page.","id":"S01Q09"},{"concept_id":"Social Engineering Techniques:69","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using a banking pop-up to direct the victim to an attacker-controlled app store?","choices":["Repackaged App","Phishing","Fake Security Application","QRLJacking"],"answer":"Fake Security Application","explanation":"Fake Security Application: tricking a victim into installing a malicious app presented as required security software.","id":"S01Q10"},{"concept_id":"PAIR:E-wallet Phishing|Consent Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between E-wallet Phishing and Consent Phishing is correct, in that order?","choices":["malicious OAuth consent / targets wallet users","targets wallet users / malicious OAuth consent","instant-message spam / malicious OAuth consent","targets wallet users / instant-message spam"],"answer":"targets wallet users / malicious OAuth consent","explanation":"E-wallet Phishing means targets wallet users; Consent Phishing means malicious OAuth consent.","id":"S01Q11"},{"concept_id":"Insider Threats:70","variant":0,"category":"Insider Threats","question":"Which concept best matches an internal person specifically identified in the course as easier for an attacker to manipulate?","choices":["Unregulated Access to Information","Insufficient Security Training","Disgruntled Employee","Siloed Organizational Units"],"answer":"Disgruntled Employee","explanation":"Disgruntled Employee: an internal person specifically identified in the course as easier for an attacker to manipulate.","id":"S01Q12"},{"concept_id":"Social Engineering Concepts:6","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: rapport and similarity?","choices":["Liking","Commitment and Consistency","Social Proof","Reciprocity"],"answer":"Liking","explanation":"Liking: increasing compliance by building rapport, similarity, or friendliness.","id":"S01Q13"},{"concept_id":"PAIR:Impersonation|Tech Support Impersonation","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Impersonation and Tech Support Impersonation is correct, in that order?","choices":["pretend to be authorized / fake support request","pretend to be authorized / direct exchange","direct exchange / fake support request","fake support request / pretend to be authorized"],"answer":"pretend to be authorized / fake support request","explanation":"Impersonation means pretend to be authorized; Tech Support Impersonation means fake support request.","id":"S01Q14"},{"concept_id":"Social Engineering Techniques:67","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: QR login session hijack?","choices":["QRLJacking","Repackaged App","Fake Security Application","Phishing"],"answer":"QRLJacking","explanation":"QRLJacking: abusing QR-code login by presenting a cloned login QR code to hijack a session.","id":"S01Q15"},{"concept_id":"Social Engineering Techniques:41","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: instant-message spam?","choices":["Spear Phishing","Spimming","Whaling","Pharming"],"answer":"Spimming","explanation":"Spimming: sending spam through instant messaging platforms.","id":"S01Q16"},{"concept_id":"Insider Threats:73","variant":1,"category":"Insider Threats","question":"Which option is most directly associated with creating gaps in verification and inconsistent handling of sensitive information?","choices":["Unregulated Access to Information","Disgruntled Employee","Siloed Organizational Units","Insufficient Security Training"],"answer":"Siloed Organizational Units","explanation":"Siloed Organizational Units: a company weakness created when separate units do not coordinate security effectively.","id":"S01Q17"},{"concept_id":"PAIR:Criminal Identity Theft|Financial Identity Theft","variant":0,"category":"Identity Theft","question":"Which distinction between Criminal Identity Theft and Financial Identity Theft is correct, in that order?","choices":["use victim identity with police / steal for financial transactions","fraudulent healthcare identity / steal for financial transactions","steal for financial transactions / use victim identity with police","use victim identity with police / fraudulent healthcare identity"],"answer":"use victim identity with police / steal for financial transactions","explanation":"Criminal Identity Theft means use victim identity with police; Financial Identity Theft means steal for financial transactions.","id":"S01Q18"},{"concept_id":"Social Engineering Techniques:21","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with calling a help desk or employee while pretending to be support staff?","choices":["SMiShing","Phishing","Vishing","Spear Phishing"],"answer":"Vishing","explanation":"Vishing: using voice calls to obtain information or manipulate a victim.","id":"S01Q19"},{"concept_id":"Social Engineering Techniques:50","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with offering a gift if the message is sent to a fixed number of people?","choices":["Hoax Letters","Instant Chat Messenger Attack","Chain Letters","Pop-up Windows"],"answer":"Chain Letters","explanation":"Chain Letters: encouraging recipients to forward a message to others by promising a benefit or invoking superstition.","id":"S01Q20"},{"concept_id":"Social Engineering Countermeasures:95","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: train users to recognize manipulation; the primary human-focused control for reducing phishing, pretexting, baiting, and impersonation success?","choices":["Security Awareness Training","Policy Acknowledgement","Security Policy Dissemination","Account Lockout"],"answer":"Security Awareness Training","explanation":"Security Awareness Training: teaching users how to recognize and respond to manipulation attempts.","id":"S01Q21"},{"concept_id":"PAIR:Clone Phishing|Search Engine Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Clone Phishing and Search Engine Phishing is correct, in that order?","choices":["copy legitimate message / poisoned search results","targets executives / poisoned search results","copy legitimate message / targets executives","poisoned search results / copy legitimate message"],"answer":"copy legitimate message / poisoned search results","explanation":"Clone Phishing means copy legitimate message; Search Engine Phishing means poisoned search results.","id":"S01Q22"},{"concept_id":"PAIR:Dumpster Diving|Bait and Switching","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Dumpster Diving and Bait and Switching is correct, in that order?","choices":["search discarded information / victim seeks attacker","attractive offer prompts action / search discarded information","victim seeks attacker / attractive offer prompts action","search discarded information / attractive offer prompts action"],"answer":"search discarded information / attractive offer prompts action","explanation":"Dumpster Diving means search discarded information; Bait and Switching means attractive offer prompts action.","id":"S01Q23"},{"concept_id":"Social Engineering Techniques:25","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: observe password entry?","choices":["Impersonation","Shoulder Surfing","Eavesdropping","Dumpster Diving"],"answer":"Shoulder Surfing","explanation":"Shoulder Surfing: directly observing a person entering sensitive information such as a password or PIN.","id":"S01Q24"},{"concept_id":"Social Engineering Techniques:37","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: extract through conversation; using disarming questions and social skills so the target reveals details naturally?","choices":["Shoulder Surfing","Impersonation","Elicitation","Eavesdropping"],"answer":"Elicitation","explanation":"Elicitation: drawing out specific information through normal-looking conversation.","id":"S01Q25"},{"concept_id":"Social Engineering Techniques:28","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches entering a secure area because an authorized person knowingly allows access?","choices":["Tailgating","Phishing","Piggybacking","Spear Phishing"],"answer":"Piggybacking","explanation":"Piggybacking: entering a secure area because an authorized person knowingly allows access.","id":"S01Q26"},{"concept_id":"Social Engineering Concepts:0","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: manipulates people; attacking human behavior rather than a technical vulnerability?","choices":["Pretexting","Social engineering","Reciprocity","Constant Vigilance"],"answer":"Social engineering","explanation":"Social engineering: manipulating people into revealing information or taking actions they normally would not take.","id":"S01Q27"},{"concept_id":"Social Engineering Concepts:17","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with recognizing that hardware and software alone cannot eliminate social-engineering risk?","choices":["Social engineering","Constant Vigilance","Pretexting","Reciprocity"],"answer":"Constant Vigilance","explanation":"Constant Vigilance: the continuing human defense required because no single product guarantees protection from manipulation.","id":"S01Q28"},{"concept_id":"Social Engineering Techniques:59","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: CLI recursive mirror?","choices":["cURL","Phishing","WinHTTrack","wget"],"answer":"wget","explanation":"wget: a command-line tool that can recursively mirror a website.","id":"S01Q29"},{"concept_id":"Insider Threats:72","variant":3,"category":"Insider Threats","question":"Which concept best combines these ideas: poor employee preparation; making internal personnel easier to exploit through phishing, impersonation, or pretexting?","choices":["Insufficient Security Training","Siloed Organizational Units","Unregulated Access to Information","Disgruntled Employee"],"answer":"Insufficient Security Training","explanation":"Insufficient Security Training: an organizational weakness that leaves employees less able to recognize manipulation.","id":"S01Q30"},{"concept_id":"Social Engineering Techniques:24","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: unauthorized listening; obtaining information from spoken, phone, email, or messaging communications?","choices":["Dumpster Diving","Impersonation","Eavesdropping","Shoulder Surfing"],"answer":"Eavesdropping","explanation":"Eavesdropping: secretly listening to conversations or intercepting communications without authorization.","id":"S01Q31"},{"concept_id":"Identity Theft:92","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with acquiring identity data that another criminal has already stolen?","choices":["Social Media Mining","Mail Theft and Rerouting","Dark Web Data Trading","Identity Theft"],"answer":"Dark Web Data Trading","explanation":"Dark Web Data Trading: buying stolen credentials, banking information, or personal identifiers from underground markets.","id":"S01Q32"},{"concept_id":"Social Engineering Countermeasures:105","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches embedding authenticity information into legitimate media to help verify its origin?","choices":["Security Policy Dissemination","Digital Watermarking","AI/ML Deepfake Detection","Security Awareness Training"],"answer":"Digital Watermarking","explanation":"Digital Watermarking: embedding authenticity information into legitimate media to help verify its origin.","id":"S01Q33"},{"concept_id":"Social Engineering Techniques:64","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: compromise frequented site; researching a target group's browsing habits and infecting a trusted site they frequent?","choices":["Website Cloning","URL Hijacking","Typosquatting","Watering Hole Attack"],"answer":"Watering Hole Attack","explanation":"Watering Hole Attack: compromising a website the intended victims already visit regularly.","id":"S01Q34"},{"concept_id":"Social Engineering Techniques:32","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: advertise attacker support; placing a business card or contact number where the victim will use it?","choices":["Phishing","Sabotage","Marketing","Support"],"answer":"Marketing","explanation":"Marketing: making the attacker easy to contact by advertising support details to the target.","id":"S01Q35"},{"concept_id":"Social Engineering Countermeasures:98","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: lock after failed attempts; limiting repeated guessing against user accounts?","choices":["Security Awareness Training","Unique Passwords","Account Lockout","Security Policy Dissemination"],"answer":"Account Lockout","explanation":"Account Lockout: blocking an account after a defined number of failed authentication attempts.","id":"S01Q36"},{"concept_id":"Social Engineering Techniques:48","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: fake alert popup?","choices":["Chain Letters","Hoax Letters","Pop-up Windows","Instant Chat Messenger Attack"],"answer":"Pop-up Windows","explanation":"Pop-up Windows: using fake alert windows to pressure users into calling or entering information.","id":"S01Q37"},{"concept_id":"Impersonation on Social Networking Sites:81","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: verify outside the suspicious channel; calling the person directly before sending money, codes, or sensitive information?","choices":["Breach Exposure Monitoring","Separate-channel Verification","Duplicate Profile Reporting","MFA on Social Accounts"],"answer":"Separate-channel Verification","explanation":"Separate-channel Verification: confirming an unusual request using a communication path different from the suspicious message.","id":"S01Q38"},{"concept_id":"Social Engineering Concepts:13","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: gather information first; using websites, blogs, advertisements, and dumpster diving before choosing a victim?","choices":["Research the Target","Select a Target","Exploit the Relationship","Develop a Relationship"],"answer":"Research the Target","explanation":"Research the Target: the first social-engineering phase in which basic company and employee information is gathered.","id":"S01Q39"},{"concept_id":"Identity Theft:93","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with an observable warning sign that financial identity information may have been abused?","choices":["Unexpected Medical Record Changes","Unauthorized Account Charges","Criminal Identity Theft","Identity Theft"],"answer":"Unauthorized Account Charges","explanation":"Unauthorized Account Charges: transactions on a credit or bank account that the real owner does not recognize.","id":"S01Q40"},{"concept_id":"Identity Theft:88","variant":0,"category":"Identity Theft","question":"Which concept best matches using another person's identity to obtain medical products or healthcare services?","choices":["Financial Identity Theft","Criminal Identity Theft","Driver's License Identity Theft","Medical Identity Theft"],"answer":"Medical Identity Theft","explanation":"Medical Identity Theft: using another person's identity to obtain medical products or healthcare services.","id":"S01Q41"},{"concept_id":"Social Engineering Concepts:11","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: relies on confidence; leveraging an established relationship so a request is not questioned?","choices":["Trust","Intimidation","Urgency","Familiarity"],"answer":"Trust","explanation":"Trust: exploiting confidence that a person, source, or relationship is reliable.","id":"S01Q42"},{"concept_id":"Impersonation on Social Networking Sites:79","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: report the fake copy; a defensive response aimed specifically at profile-cloning attacks?","choices":["Duplicate Profile Reporting","MFA on Social Accounts","Breach Exposure Monitoring","Separate-channel Verification"],"answer":"Duplicate Profile Reporting","explanation":"Duplicate Profile Reporting: reporting a second lookalike account that appears to impersonate a real user.","id":"S01Q43"},{"concept_id":"Social Engineering Countermeasures:100","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with reducing the usefulness of stolen credentials in phishing and identity attacks?","choices":["Security Policy Dissemination","MFA","Security Awareness Training","Policy Acknowledgement"],"answer":"MFA","explanation":"MFA: requiring an additional authentication factor beyond the password.","id":"S01Q44"},{"concept_id":"Social Engineering Techniques:45","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with tricking the victim into opening a link that then changes the first tab into a phishing page?","choices":["Whaling","Pharming","Spear Phishing","Reverse Tabnabbing"],"answer":"Reverse Tabnabbing","explanation":"Reverse Tabnabbing: using a newly opened malicious page to alter the content of the original tab.","id":"S01Q45"},{"concept_id":"Social Engineering Techniques:27","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: victim seeks attacker; making the attacker appear to be the authority the target needs to contact?","choices":["Reverse Social Engineering","Impersonation","Eavesdropping","Shoulder Surfing"],"answer":"Reverse Social Engineering","explanation":"Reverse Social Engineering: creating a situation in which the victim approaches the attacker for help.","id":"S01Q46"},{"concept_id":"Social Engineering Techniques:40","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: redirects without lure; sending users to a fake site without requiring a conventional phishing lure?","choices":["Spimming","Whaling","Pharming","Spear Phishing"],"answer":"Pharming","explanation":"Pharming: redirecting traffic to a fraudulent website through DNS cache poisoning or host-file modification.","id":"S01Q47"},{"concept_id":"Social Engineering Techniques:54","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: synthetic person imitation; cloning an executive's face or voice for impersonation?","choices":["Phishing","Spear Phishing","Deepfake","Whaling"],"answer":"Deepfake","explanation":"Deepfake: AI-generated audio or video that convincingly imitates a real person.","id":"S01Q48"},{"concept_id":"Social Engineering Techniques:55","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with leveraging an existing contact relationship so recipients lower their guard?","choices":["Phishing","Contact Spamming","Spear Phishing","Whaling"],"answer":"Contact Spamming","explanation":"Contact Spamming: using a compromised or spoofed trusted identity to send messages to that person's contacts.","id":"S01Q49"},{"concept_id":"PAIR:Social Proof|Scarcity","variant":0,"category":"Social Engineering Concepts","question":"Which distinction between Social Proof and Scarcity is correct, in that order?","choices":["perceived power / limited availability","limited availability / others already complied","others already complied / perceived power","others already complied / limited availability"],"answer":"others already complied / limited availability","explanation":"Social Proof means others already complied; Scarcity means limited availability.","id":"S01Q50"}],[{"concept_id":"Social Engineering Techniques:45","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: new tab alters original; tricking the victim into opening a link that then changes the first tab into a phishing page?","choices":["Reverse Tabnabbing","Pharming","Spear Phishing","Whaling"],"answer":"Reverse Tabnabbing","explanation":"Reverse Tabnabbing: using a newly opened malicious page to alter the content of the original tab.","id":"S02Q01"},{"concept_id":"Social Engineering Concepts:1","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with using researched names, departments, projects, or events to make a request credible?","choices":["Constant Vigilance","Reciprocity","Social engineering","Pretexting"],"answer":"Pretexting","explanation":"Pretexting: creating a believable backstory or excuse that explains why contact is being made.","id":"S02Q02"},{"concept_id":"PAIR:Impersonation|Shoulder Surfing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Impersonation and Shoulder Surfing is correct, in that order?","choices":["pretend to be authorized / observe password entry","observe password entry / pretend to be authorized","pretend to be authorized / attractive offer prompts action","attractive offer prompts action / observe password entry"],"answer":"pretend to be authorized / observe password entry","explanation":"Impersonation means pretend to be authorized; Shoulder Surfing means observe password entry.","id":"S02Q03"},{"concept_id":"Social Engineering Techniques:62","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: misleading lookalike URL; the broader category that can include typosquatting and homograph tricks?","choices":["Typosquatting","Website Cloning","URL Hijacking","Homograph Attack"],"answer":"URL Hijacking","explanation":"URL Hijacking: using a misleading URL that resembles a legitimate destination.","id":"S02Q04"},{"concept_id":"Social Engineering Techniques:54","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches AI-generated audio or video that convincingly imitates a real person?","choices":["Deepfake","Whaling","Phishing","Spear Phishing"],"answer":"Deepfake","explanation":"Deepfake: AI-generated audio or video that convincingly imitates a real person.","id":"S02Q05"},{"concept_id":"PAIR:Reverse Social Engineering|Elicitation","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Reverse Social Engineering and Elicitation is correct, in that order?","choices":["extract through conversation / victim seeks attacker","attractive offer prompts action / extract through conversation","victim seeks attacker / extract through conversation","victim seeks attacker / attractive offer prompts action"],"answer":"victim seeks attacker / extract through conversation","explanation":"Reverse Social Engineering means victim seeks attacker; Elicitation means extract through conversation.","id":"S02Q06"},{"concept_id":"Social Engineering Techniques:56","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: weaponized file attachment?","choices":["Phishing","Whaling","Spear Phishing","Malicious Attachment"],"answer":"Malicious Attachment","explanation":"Malicious Attachment: using a document or archive that contains executable content or malicious macros.","id":"S02Q07"},{"concept_id":"Social Engineering Techniques:38","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: attractive offer prompts action; using an exciting e-commerce offer to trigger a harmful action?","choices":["Bait and Switching","Eavesdropping","Shoulder Surfing","Impersonation"],"answer":"Bait and Switching","explanation":"Bait and Switching: presenting an attractive offer that causes the victim to follow a link or download a file.","id":"S02Q08"},{"concept_id":"Social Engineering Techniques:18","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using a broad email campaign that redirects recipients to a fake login page?","choices":["Spear Phishing","SMiShing","Vishing","Phishing"],"answer":"Phishing","explanation":"Phishing: sending deceptive electronic messages that appear legitimate to obtain information or drive malicious action.","id":"S02Q09"},{"concept_id":"Social Engineering Concepts:13","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches the first social-engineering phase in which basic company and employee information is gathered?","choices":["Select a Target","Exploit the Relationship","Research the Target","Develop a Relationship"],"answer":"Research the Target","explanation":"Research the Target: the first social-engineering phase in which basic company and employee information is gathered.","id":"S02Q10"},{"concept_id":"Social Engineering Countermeasures:97","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with obtaining signatures showing that staff received and accepted the rules?","choices":["Policy Acknowledgement","Security Awareness Training","Security Policy Dissemination","Account Lockout"],"answer":"Policy Acknowledgement","explanation":"Policy Acknowledgement: requiring employees to confirm that they understand security policies.","id":"S02Q11"},{"concept_id":"Impersonation on Social Networking Sites:82","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: watch for exposed credentials?","choices":["MFA on Social Accounts","Breach Exposure Monitoring","Separate-channel Verification","Duplicate Profile Reporting"],"answer":"Breach Exposure Monitoring","explanation":"Breach Exposure Monitoring: checking whether account credentials have appeared in known data breaches.","id":"S02Q12"},{"concept_id":"Social Engineering Techniques:40","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: redirects without lure?","choices":["Spimming","Spear Phishing","Whaling","Pharming"],"answer":"Pharming","explanation":"Pharming: redirecting traffic to a fraudulent website through DNS cache poisoning or host-file modification.","id":"S02Q13"},{"concept_id":"Identity Theft:88","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: fraudulent healthcare identity; creating dangerous inaccuracies in the victim's medical record through fraudulent treatment?","choices":["Driver's License Identity Theft","Medical Identity Theft","Criminal Identity Theft","Financial Identity Theft"],"answer":"Medical Identity Theft","explanation":"Medical Identity Theft: using another person's identity to obtain medical products or healthcare services.","id":"S02Q14"},{"concept_id":"Social Engineering Countermeasures:100","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches requiring an additional authentication factor beyond the password?","choices":["Policy Acknowledgement","Security Policy Dissemination","Security Awareness Training","MFA"],"answer":"MFA","explanation":"MFA: requiring an additional authentication factor beyond the password.","id":"S02Q15"},{"concept_id":"Social Engineering Techniques:68","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: legitimate app plus malware?","choices":["Repackaged App","QRLJacking","Phishing","Fake Security Application"],"answer":"Repackaged App","explanation":"Repackaged App: taking a legitimate mobile application, adding malicious code, and redistributing it.","id":"S02Q16"},{"concept_id":"Identity Theft:87","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: misuse insurance coverage; accessing an insurance plan under the victim's identity?","choices":["Financial Identity Theft","Criminal Identity Theft","Driver's License Identity Theft","Insurance Identity Theft"],"answer":"Insurance Identity Theft","explanation":"Insurance Identity Theft: using another person's insurance information to obtain covered treatment or benefits.","id":"S02Q17"},{"concept_id":"Social Engineering Techniques:65","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: fake trusted Wi-Fi; attracting users to an attacker-controlled network so their traffic passes through it?","choices":["Captive Portal Phishing","Rogue Access Point","Phishing","Spear Phishing"],"answer":"Rogue Access Point","explanation":"Rogue Access Point: creating a fake wireless network that imitates a trusted SSID.","id":"S02Q18"},{"concept_id":"Social Engineering Techniques:52","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: bulk unsolicited email; using long filenames or hidden extensions in a mass unsolicited message?","choices":["Hoax Letters","Chain Letters","Spam Email","Pop-up Windows"],"answer":"Spam Email","explanation":"Spam Email: sending unsolicited bulk email that may collect information or carry concealed malware.","id":"S02Q19"},{"concept_id":"Social Engineering Concepts:8","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: fear or threat; using fear of punishment or escalation to force quick compliance?","choices":["Intimidation","Trust","Familiarity","Urgency"],"answer":"Intimidation","explanation":"Intimidation: pressuring a person through fear, threats, or an implied negative consequence.","id":"S02Q20"},{"concept_id":"Insider Threats:74","variant":0,"category":"Insider Threats","question":"Which concept best matches an organizational weakness caused by missing rules for handling information and access?","choices":["Lack of Security Policies","Insufficient Security Training","Disgruntled Employee","Unregulated Access to Information"],"answer":"Lack of Security Policies","explanation":"Lack of Security Policies: an organizational weakness caused by missing rules for handling information and access.","id":"S02Q21"},{"concept_id":"PAIR:Financial Identity Theft|Driver's License Identity Theft","variant":0,"category":"Identity Theft","question":"Which distinction between Financial Identity Theft and Driver's License Identity Theft is correct, in that order?","choices":["steal for financial transactions / fraudulent healthcare identity","fraudulent healthcare identity / misuse driving identity","misuse driving identity / steal for financial transactions","steal for financial transactions / misuse driving identity"],"answer":"steal for financial transactions / misuse driving identity","explanation":"Financial Identity Theft means steal for financial transactions; Driver's License Identity Theft means misuse driving identity.","id":"S02Q22"},{"concept_id":"Social Engineering Concepts:14","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with preferring a person who appears easier to manipulate after reconnaissance?","choices":["Research the Target","Exploit the Relationship","Develop a Relationship","Select a Target"],"answer":"Select a Target","explanation":"Select a Target: the phase in which the attacker chooses the person most likely to provide useful information.","id":"S02Q23"},{"concept_id":"Social Engineering Concepts:17","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: continuous human awareness; recognizing that hardware and software alone cannot eliminate social-engineering risk?","choices":["Constant Vigilance","Social engineering","Pretexting","Reciprocity"],"answer":"Constant Vigilance","explanation":"Constant Vigilance: the continuing human defense required because no single product guarantees protection from manipulation.","id":"S02Q24"},{"concept_id":"Social Engineering Techniques:26","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: search discarded information; recovering phone lists, org charts, notes, printouts, or policy manuals from trash?","choices":["Impersonation","Dumpster Diving","Shoulder Surfing","Eavesdropping"],"answer":"Dumpster Diving","explanation":"Dumpster Diving: searching discarded material for useful organizational or personal information.","id":"S02Q25"},{"concept_id":"Social Engineering Techniques:51","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using online chat to collect personal information that can help compromise accounts?","choices":["Hoax Letters","Instant Chat Messenger Attack","Pop-up Windows","Chain Letters"],"answer":"Instant Chat Messenger Attack","explanation":"Instant Chat Messenger Attack: using online chat to collect personal information that can help compromise accounts.","id":"S02Q26"},{"concept_id":"Social Engineering Concepts:16","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: use trust to extract; asking for account, financial, technology, or planning details after rapport exists?","choices":["Exploit the Relationship","Develop a Relationship","Select a Target","Research the Target"],"answer":"Exploit the Relationship","explanation":"Exploit the Relationship: the phase in which established trust is used to extract sensitive information or action.","id":"S02Q27"},{"concept_id":"Social Engineering Countermeasures:103","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: community phishing database; providing community phishing intelligence for anti-phishing integrations?","choices":["Security Awareness Training","PhishTank","OhPhish","Netcraft"],"answer":"PhishTank","explanation":"PhishTank: a collaborative clearinghouse that collects phishing reports and exposes data through an open API.","id":"S02Q28"},{"concept_id":"Social Engineering Concepts:4","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with claiming that coworkers have already provided the same information?","choices":["Commitment and Consistency","Social Proof","Reciprocity","Authority"],"answer":"Social Proof","explanation":"Social Proof: using the behavior of other people as evidence that an action is acceptable.","id":"S02Q29"},{"concept_id":"Social Engineering Techniques:43","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with sending a fraudulent message that appears to come from a payment-wallet service?","choices":["E-wallet Phishing","Spear Phishing","Whaling","Pharming"],"answer":"E-wallet Phishing","explanation":"E-wallet Phishing: impersonating an electronic-wallet provider to steal wallet-related information.","id":"S02Q30"},{"concept_id":"Social Engineering Techniques:61","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with relying on a victim entering a lookalike typo of a legitimate URL?","choices":["URL Hijacking","Typosquatting","Homograph Attack","Website Cloning"],"answer":"Typosquatting","explanation":"Typosquatting: registering a deliberately misspelled domain that users may reach through typing mistakes.","id":"S02Q31"},{"concept_id":"PAIR:Social Media Mining|Dark Web Data Trading","variant":0,"category":"Identity Theft","question":"Which distinction between Social Media Mining and Dark Web Data Trading is correct, in that order?","choices":["harvest PII from profiles / steal or redirect mail","purchase stolen PII / harvest PII from profiles","steal or redirect mail / purchase stolen PII","harvest PII from profiles / purchase stolen PII"],"answer":"harvest PII from profiles / purchase stolen PII","explanation":"Social Media Mining means harvest PII from profiles; Dark Web Data Trading means purchase stolen PII.","id":"S02Q32"},{"concept_id":"Social Engineering Countermeasures:95","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with the primary human-focused control for reducing phishing, pretexting, baiting, and impersonation success?","choices":["Security Awareness Training","Policy Acknowledgement","Security Policy Dissemination","Account Lockout"],"answer":"Security Awareness Training","explanation":"Security Awareness Training: teaching users how to recognize and respond to manipulation attempts.","id":"S02Q33"},{"concept_id":"Social Engineering Techniques:49","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: false threat warning?","choices":["Hoax Letters","Chain Letters","Instant Chat Messenger Attack","Pop-up Windows"],"answer":"Hoax Letters","explanation":"Hoax Letters: spreading false warnings about threats that do not actually exist.","id":"S02Q34"},{"concept_id":"PAIR:Unregulated Access to Information|Siloed Organizational Units","variant":0,"category":"Insider Threats","question":"Which distinction between Unregulated Access to Information and Siloed Organizational Units is correct, in that order?","choices":["security gaps between units / excess internal access","excess internal access / poor employee preparation","poor employee preparation / security gaps between units","excess internal access / security gaps between units"],"answer":"excess internal access / security gaps between units","explanation":"Unregulated Access to Information means excess internal access; Siloed Organizational Units means security gaps between units.","id":"S02Q35"},{"concept_id":"Insider Threats:70","variant":1,"category":"Insider Threats","question":"Which option is most directly associated with being preferred during target selection because dissatisfaction may lower resistance?","choices":["Unregulated Access to Information","Siloed Organizational Units","Disgruntled Employee","Insufficient Security Training"],"answer":"Disgruntled Employee","explanation":"Disgruntled Employee: an internal person specifically identified in the course as easier for an attacker to manipulate.","id":"S02Q36"},{"concept_id":"Social Engineering Techniques:42","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches copying a legitimate message and replacing its link or attachment with a malicious one?","choices":["Spear Phishing","Pharming","Whaling","Clone Phishing"],"answer":"Clone Phishing","explanation":"Clone Phishing: copying a legitimate message and replacing its link or attachment with a malicious one.","id":"S02Q37"},{"concept_id":"Social Engineering Techniques:32","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches making the attacker easy to contact by advertising support details to the target?","choices":["Sabotage","Phishing","Marketing","Support"],"answer":"Marketing","explanation":"Marketing: making the attacker easy to contact by advertising support details to the target.","id":"S02Q38"},{"concept_id":"Impersonation on Social Networking Sites:76","variant":1,"category":"Impersonation on Social Networking Sites","question":"Which option is most directly associated with retaining the victim's existing contacts, history, and established account reputation?","choices":["Profile Cloning","Message History","Account Takeover","Existing Contact List"],"answer":"Account Takeover","explanation":"Account Takeover: compromising the real social-media account rather than creating a copy.","id":"S02Q39"},{"concept_id":"Identity Theft:83","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with using another person's details to open accounts, make purchases, obtain services, or impersonate them?","choices":["Driver's License Identity Theft","Criminal Identity Theft","Identity Theft","Financial Identity Theft"],"answer":"Identity Theft","explanation":"Identity Theft: stealing personally identifiable information in order to commit fraud or other crimes as another person.","id":"S02Q40"},{"concept_id":"PAIR:Diversion Theft|Tech Support Impersonation","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Diversion Theft and Tech Support Impersonation is correct, in that order?","choices":["observe password entry / fake support request","redirect a delivery / fake support request","redirect a delivery / observe password entry","fake support request / redirect a delivery"],"answer":"redirect a delivery / fake support request","explanation":"Diversion Theft means redirect a delivery; Tech Support Impersonation means fake support request.","id":"S02Q41"},{"concept_id":"Social Engineering Techniques:36","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: direct exchange?","choices":["Shoulder Surfing","Eavesdropping","Quid Pro Quo","Impersonation"],"answer":"Quid Pro Quo","explanation":"Quid Pro Quo: offering a service or benefit in direct exchange for information or access.","id":"S02Q42"},{"concept_id":"Social Engineering Techniques:47","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches manipulating search results so fraudulent sites appear where victims are likely to click?","choices":["Spear Phishing","Pharming","Whaling","Search Engine Phishing"],"answer":"Search Engine Phishing","explanation":"Search Engine Phishing: manipulating search results so fraudulent sites appear where victims are likely to click.","id":"S02Q43"},{"concept_id":"Social Engineering Techniques:28","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: entry with consent; asking an employee to hold a controlled door open?","choices":["Piggybacking","Tailgating","Phishing","Spear Phishing"],"answer":"Piggybacking","explanation":"Piggybacking: entering a secure area because an authorized person knowingly allows access.","id":"S02Q44"},{"concept_id":"Identity Theft:84","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with giving an assumed identity to law enforcement after committing an offense?","choices":["Financial Identity Theft","Criminal Identity Theft","Driver's License Identity Theft","Insurance Identity Theft"],"answer":"Criminal Identity Theft","explanation":"Criminal Identity Theft: using another person's identity when arrested or questioned to avoid criminal consequences.","id":"S02Q45"},{"concept_id":"Social Engineering Countermeasures:102","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches a browser extension that blocks or warns about suspected phishing sites?","choices":["Netcraft","PhishTank","Security Awareness Training","OhPhish"],"answer":"Netcraft","explanation":"Netcraft: a browser extension that blocks or warns about suspected phishing sites.","id":"S02Q46"},{"concept_id":"PAIR:Spear Phishing|Spimming","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Spear Phishing and Spimming is correct, in that order?","choices":["instant-message spam / targeted personalized phishing","targeted personalized phishing / instant-message spam","targets executives / instant-message spam","targeted personalized phishing / targets executives"],"answer":"targeted personalized phishing / instant-message spam","explanation":"Spear Phishing means targeted personalized phishing; Spimming means instant-message spam.","id":"S02Q47"},{"concept_id":"PAIR:Pop-up Windows|Scareware","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Pop-up Windows and Scareware is correct, in that order?","choices":["fake fear-based warning / fake alert popup","bulk unsolicited email / fake fear-based warning","fake alert popup / bulk unsolicited email","fake alert popup / fake fear-based warning"],"answer":"fake alert popup / fake fear-based warning","explanation":"Pop-up Windows means fake alert popup; Scareware means fake fear-based warning.","id":"S02Q48"},{"concept_id":"Impersonation on Social Networking Sites:78","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: past conversations aid impersonation; allowing references to earlier discussions after an account takeover?","choices":["Account Takeover","Existing Contact List","Message History","Profile Cloning"],"answer":"Message History","explanation":"Message History: past conversations that help an attacker impersonating a real account sound believable.","id":"S02Q49"},{"concept_id":"Social Engineering Concepts:2","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with doing something for the target first and then asking for something in return?","choices":["Authority","Reciprocity","Commitment and Consistency","Social Proof"],"answer":"Reciprocity","explanation":"Reciprocity: making someone feel obliged to return a favor or kindness.","id":"S02Q50"}],[{"concept_id":"Social Engineering Concepts:6","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches increasing compliance by building rapport, similarity, or friendliness?","choices":["Reciprocity","Social Proof","Commitment and Consistency","Liking"],"answer":"Liking","explanation":"Liking: increasing compliance by building rapport, similarity, or friendliness.","id":"S03Q01"},{"concept_id":"Social Engineering Techniques:39","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches leaving a tempting object or resource for the victim to discover and interact with?","choices":["Phishing","Spear Phishing","Baiting","Whaling"],"answer":"Baiting","explanation":"Baiting: leaving a tempting object or resource for the victim to discover and interact with.","id":"S03Q02"},{"concept_id":"Identity Theft:91","variant":0,"category":"Identity Theft","question":"Which concept best matches collecting personal details from social profiles to build or impersonate an identity?","choices":["Dark Web Data Trading","Social Media Mining","Mail Theft and Rerouting","Identity Theft"],"answer":"Social Media Mining","explanation":"Social Media Mining: collecting personal details from social profiles to build or impersonate an identity.","id":"S03Q03"},{"concept_id":"Social Engineering Concepts:9","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: act immediately?","choices":["Intimidation","Urgency","Familiarity","Trust"],"answer":"Urgency","explanation":"Urgency: reducing careful verification by making the target believe immediate action is required.","id":"S03Q04"},{"concept_id":"Social Engineering Concepts:7","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: limited availability; using a message such as an offer expiring today?","choices":["Reciprocity","Scarcity","Social Proof","Commitment and Consistency"],"answer":"Scarcity","explanation":"Scarcity: making something seem more valuable because availability is limited.","id":"S03Q05"},{"concept_id":"Social Engineering Techniques:27","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with making the attacker appear to be the authority the target needs to contact?","choices":["Eavesdropping","Impersonation","Shoulder Surfing","Reverse Social Engineering"],"answer":"Reverse Social Engineering","explanation":"Reverse Social Engineering: creating a situation in which the victim approaches the attacker for help.","id":"S03Q06"},{"concept_id":"Social Engineering Techniques:20","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches phishing aimed specifically at high-profile executives or other high-value people?","choices":["Spear Phishing","Pharming","Spimming","Whaling"],"answer":"Whaling","explanation":"Whaling: phishing aimed specifically at high-profile executives or other high-value people.","id":"S03Q07"},{"concept_id":"Social Engineering Techniques:32","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: advertise attacker support?","choices":["Phishing","Support","Marketing","Sabotage"],"answer":"Marketing","explanation":"Marketing: making the attacker easy to contact by advertising support details to the target.","id":"S03Q08"},{"concept_id":"Insider Threats:72","variant":0,"category":"Insider Threats","question":"Which concept best matches an organizational weakness that leaves employees less able to recognize manipulation?","choices":["Insufficient Security Training","Unregulated Access to Information","Siloed Organizational Units","Disgruntled Employee"],"answer":"Insufficient Security Training","explanation":"Insufficient Security Training: an organizational weakness that leaves employees less able to recognize manipulation.","id":"S03Q09"},{"concept_id":"Social Engineering Concepts:17","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches the continuing human defense required because no single product guarantees protection from manipulation?","choices":["Constant Vigilance","Pretexting","Social engineering","Reciprocity"],"answer":"Constant Vigilance","explanation":"Constant Vigilance: the continuing human defense required because no single product guarantees protection from manipulation.","id":"S03Q10"},{"concept_id":"Social Engineering Techniques:45","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using a newly opened malicious page to alter the content of the original tab?","choices":["Reverse Tabnabbing","Pharming","Whaling","Spear Phishing"],"answer":"Reverse Tabnabbing","explanation":"Reverse Tabnabbing: using a newly opened malicious page to alter the content of the original tab.","id":"S03Q11"},{"concept_id":"PAIR:Medical Identity Theft|Tax Identity Theft","variant":0,"category":"Identity Theft","question":"Which distinction between Medical Identity Theft and Tax Identity Theft is correct, in that order?","choices":["fraudulent tax return / fraudulent healthcare identity","fraudulent healthcare identity / misuse driving identity","fraudulent healthcare identity / fraudulent tax return","misuse driving identity / fraudulent tax return"],"answer":"fraudulent healthcare identity / fraudulent tax return","explanation":"Medical Identity Theft means fraudulent healthcare identity; Tax Identity Theft means fraudulent tax return.","id":"S03Q12"},{"concept_id":"Social Engineering Techniques:66","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: fake Wi-Fi login page; using a rogue access point to display a fraudulent hotel or airport sign-in page?","choices":["Rogue Access Point","Phishing","Spear Phishing","Captive Portal Phishing"],"answer":"Captive Portal Phishing","explanation":"Captive Portal Phishing: presenting a fake network-login page that collects credentials from connected users.","id":"S03Q13"},{"concept_id":"Impersonation on Social Networking Sites:76","variant":0,"category":"Impersonation on Social Networking Sites","question":"Which concept best matches compromising the real social-media account rather than creating a copy?","choices":["Profile Cloning","Account Takeover","Message History","Existing Contact List"],"answer":"Account Takeover","explanation":"Account Takeover: compromising the real social-media account rather than creating a copy.","id":"S03Q14"},{"concept_id":"Social Engineering Concepts:1","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches creating a believable backstory or excuse that explains why contact is being made?","choices":["Pretexting","Constant Vigilance","Reciprocity","Social engineering"],"answer":"Pretexting","explanation":"Pretexting: creating a believable backstory or excuse that explains why contact is being made.","id":"S03Q15"},{"concept_id":"Social Engineering Countermeasures:104","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with measuring user resilience and assigning training after simulated social-engineering campaigns?","choices":["PhishTank","OhPhish","Security Awareness Training","Netcraft"],"answer":"OhPhish","explanation":"OhPhish: a phishing-simulation and awareness platform that can run email, attachment, vishing, and smishing exercises.","id":"S03Q16"},{"concept_id":"Social Engineering Concepts:13","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: gather information first?","choices":["Select a Target","Develop a Relationship","Research the Target","Exploit the Relationship"],"answer":"Research the Target","explanation":"Research the Target: the first social-engineering phase in which basic company and employee information is gathered.","id":"S03Q17"},{"concept_id":"Social Engineering Techniques:63","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using a Greek or Cyrillic character so a fake domain looks like the real one?","choices":["Homograph Attack","URL Hijacking","Website Cloning","Typosquatting"],"answer":"Homograph Attack","explanation":"Homograph Attack: replacing characters in a domain with visually similar characters from another alphabet.","id":"S03Q18"},{"concept_id":"Social Engineering Techniques:47","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: poisoned search results; using SEO techniques and keyword stuffing to promote a phishing page?","choices":["Whaling","Spear Phishing","Pharming","Search Engine Phishing"],"answer":"Search Engine Phishing","explanation":"Search Engine Phishing: manipulating search results so fraudulent sites appear where victims are likely to click.","id":"S03Q19"},{"concept_id":"Identity Theft:83","variant":2,"category":"Identity Theft","question":"What term best fits this clue: steal identity for fraud?","choices":["Financial Identity Theft","Identity Theft","Criminal Identity Theft","Driver's License Identity Theft"],"answer":"Identity Theft","explanation":"Identity Theft: stealing personally identifiable information in order to commit fraud or other crimes as another person.","id":"S03Q20"},{"concept_id":"Identity Theft:94","variant":0,"category":"Identity Theft","question":"Which concept best matches new diagnoses or treatment records that the real patient never received?","choices":["Identity Theft","Unexpected Medical Record Changes","Unauthorized Account Charges","Criminal Identity Theft"],"answer":"Unexpected Medical Record Changes","explanation":"Unexpected Medical Record Changes: new diagnoses or treatment records that the real patient never received.","id":"S03Q21"},{"concept_id":"Social Engineering Techniques:19","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: targeted personalized phishing?","choices":["Whaling","Pharming","Spear Phishing","Spimming"],"answer":"Spear Phishing","explanation":"Spear Phishing: targeting a specific person or small group with personalized phishing content.","id":"S03Q22"},{"concept_id":"PAIR:Diversion Theft|Bait and Switching","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Diversion Theft and Bait and Switching is correct, in that order?","choices":["redirect a delivery / search discarded information","search discarded information / attractive offer prompts action","attractive offer prompts action / redirect a delivery","redirect a delivery / attractive offer prompts action"],"answer":"redirect a delivery / attractive offer prompts action","explanation":"Diversion Theft means redirect a delivery; Bait and Switching means attractive offer prompts action.","id":"S03Q23"},{"concept_id":"Social Engineering Techniques:21","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: voice phishing?","choices":["Spear Phishing","Phishing","Vishing","SMiShing"],"answer":"Vishing","explanation":"Vishing: using voice calls to obtain information or manipulate a victim.","id":"S03Q24"},{"concept_id":"Social Engineering Techniques:23","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with posing as an employee, vendor, repair technician, executive, or trusted authority?","choices":["Shoulder Surfing","Dumpster Diving","Eavesdropping","Impersonation"],"answer":"Impersonation","explanation":"Impersonation: pretending to be a legitimate or authorized person to gain information or access.","id":"S03Q25"},{"concept_id":"Identity Theft:84","variant":0,"category":"Identity Theft","question":"Which concept best matches using another person's identity when arrested or questioned to avoid criminal consequences?","choices":["Insurance Identity Theft","Driver's License Identity Theft","Financial Identity Theft","Criminal Identity Theft"],"answer":"Criminal Identity Theft","explanation":"Criminal Identity Theft: using another person's identity when arrested or questioned to avoid criminal consequences.","id":"S03Q26"},{"concept_id":"Identity Theft:86","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with causing unauthorized traffic violations to appear under the victim's name?","choices":["Criminal Identity Theft","Financial Identity Theft","Insurance Identity Theft","Driver's License Identity Theft"],"answer":"Driver's License Identity Theft","explanation":"Driver's License Identity Theft: using another person's driver's license identity for traffic-related offenses.","id":"S03Q27"},{"concept_id":"PAIR:Disgruntled Employee|Lack of Security Policies","variant":0,"category":"Insider Threats","question":"Which distinction between Disgruntled Employee and Lack of Security Policies is correct, in that order?","choices":["missing internal rules / dissatisfied internal target","dissatisfied internal target / security gaps between units","security gaps between units / missing internal rules","dissatisfied internal target / missing internal rules"],"answer":"dissatisfied internal target / missing internal rules","explanation":"Disgruntled Employee means dissatisfied internal target; Lack of Security Policies means missing internal rules.","id":"S03Q28"},{"concept_id":"Social Engineering Techniques:44","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches changing the content of an inactive browser tab so it appears to be a familiar login when revisited?","choices":["Pharming","Tabnabbing","Spear Phishing","Whaling"],"answer":"Tabnabbing","explanation":"Tabnabbing: changing the content of an inactive browser tab so it appears to be a familiar login when revisited.","id":"S03Q29"},{"concept_id":"Social Engineering Techniques:28","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with asking an employee to hold a controlled door open?","choices":["Tailgating","Piggybacking","Phishing","Spear Phishing"],"answer":"Piggybacking","explanation":"Piggybacking: entering a secure area because an authorized person knowingly allows access.","id":"S03Q30"},{"concept_id":"PAIR:Tech Support Impersonation|Elicitation","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Tech Support Impersonation and Elicitation is correct, in that order?","choices":["fake support request / extract through conversation","extract through conversation / fake support request","fake support request / pretend to be authorized","pretend to be authorized / extract through conversation"],"answer":"fake support request / extract through conversation","explanation":"Tech Support Impersonation means fake support request; Elicitation means extract through conversation.","id":"S03Q31"},{"concept_id":"Social Engineering Techniques:40","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with sending users to a fake site without requiring a conventional phishing lure?","choices":["Spear Phishing","Spimming","Pharming","Whaling"],"answer":"Pharming","explanation":"Pharming: redirecting traffic to a fraudulent website through DNS cache poisoning or host-file modification.","id":"S03Q32"},{"concept_id":"Social Engineering Techniques:34","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: claims absent approval?","choices":["Impersonation","Shoulder Surfing","Third-party Authorization","Eavesdropping"],"answer":"Third-party Authorization","explanation":"Third-party Authorization: claiming that an absent authority figure approved the request.","id":"S03Q33"},{"concept_id":"Insider Threats:71","variant":0,"category":"Insider Threats","question":"Which concept best matches an organizational condition in which too many people can reach sensitive information without adequate control?","choices":["Siloed Organizational Units","Unregulated Access to Information","Disgruntled Employee","Insufficient Security Training"],"answer":"Unregulated Access to Information","explanation":"Unregulated Access to Information: an organizational condition in which too many people can reach sensitive information without adequate control.","id":"S03Q34"},{"concept_id":"Social Engineering Countermeasures:101","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: secure unattended workstation; preventing opportunistic access to an already authenticated workstation?","choices":["Security Awareness Training","Policy Acknowledgement","Security Policy Dissemination","Lock Screen When Away"],"answer":"Lock Screen When Away","explanation":"Lock Screen When Away: locking or shutting down a computer before leaving it unattended.","id":"S03Q35"},{"concept_id":"Social Engineering Countermeasures:106","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: detect synthetic media artifacts?","choices":["Security Awareness Training","AI/ML Deepfake Detection","Digital Watermarking","Security Policy Dissemination"],"answer":"AI/ML Deepfake Detection","explanation":"AI/ML Deepfake Detection: using automated analysis to find unnatural facial movement, lighting, lip synchronization, or other synthetic artifacts.","id":"S03Q36"},{"concept_id":"Social Engineering Techniques:41","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: instant-message spam; using bots to harvest messaging IDs and distribute unsolicited messages?","choices":["Spear Phishing","Pharming","Whaling","Spimming"],"answer":"Spimming","explanation":"Spimming: sending spam through instant messaging platforms.","id":"S03Q37"},{"concept_id":"PAIR:Chain Letters|Spam Email","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Chain Letters and Spam Email is correct, in that order?","choices":["fake fear-based warning / bulk unsolicited email","forward for reward / fake fear-based warning","bulk unsolicited email / forward for reward","forward for reward / bulk unsolicited email"],"answer":"forward for reward / bulk unsolicited email","explanation":"Chain Letters means forward for reward; Spam Email means bulk unsolicited email.","id":"S03Q38"},{"concept_id":"Social Engineering Countermeasures:96","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches making sure employees receive and understand the organization's security rules?","choices":["Policy Acknowledgement","Security Awareness Training","Security Policy Dissemination","Account Lockout"],"answer":"Security Policy Dissemination","explanation":"Security Policy Dissemination: making sure employees receive and understand the organization's security rules.","id":"S03Q39"},{"concept_id":"Social Engineering Techniques:61","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches registering a deliberately misspelled domain that users may reach through typing mistakes?","choices":["Typosquatting","URL Hijacking","Homograph Attack","Website Cloning"],"answer":"Typosquatting","explanation":"Typosquatting: registering a deliberately misspelled domain that users may reach through typing mistakes.","id":"S03Q40"},{"concept_id":"Social Engineering Countermeasures:99","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: no password reuse; reducing the damage from one credential breach spreading to other services?","choices":["Account Lockout","Security Awareness Training","Security Policy Dissemination","Unique Passwords"],"answer":"Unique Passwords","explanation":"Unique Passwords: using a different password for each account instead of reusing the same secret.","id":"S03Q41"},{"concept_id":"PAIR:Shoulder Surfing|Dumpster Diving","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Shoulder Surfing and Dumpster Diving is correct, in that order?","choices":["search discarded information / observe password entry","observe password entry / search discarded information","observe password entry / fake support request","fake support request / search discarded information"],"answer":"observe password entry / search discarded information","explanation":"Shoulder Surfing means observe password entry; Dumpster Diving means search discarded information.","id":"S03Q42"},{"concept_id":"Social Engineering Techniques:58","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches a graphical tool that can mirror an entire website for offline use?","choices":["WinHTTrack","cURL","wget","Phishing"],"answer":"WinHTTrack","explanation":"WinHTTrack: a graphical tool that can mirror an entire website for offline use.","id":"S03Q43"},{"concept_id":"Social Engineering Techniques:56","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with sending an invoice, shipping notice, PDF, Office file, ZIP, or RAR that delivers malware?","choices":["Spear Phishing","Malicious Attachment","Phishing","Whaling"],"answer":"Malicious Attachment","explanation":"Malicious Attachment: using a document or archive that contains executable content or malicious macros.","id":"S03Q44"},{"concept_id":"Social Engineering Techniques:59","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using mirror mode to download a site and optionally convert links for offline browsing?","choices":["Phishing","cURL","WinHTTrack","wget"],"answer":"wget","explanation":"wget: a command-line tool that can recursively mirror a website.","id":"S03Q45"},{"concept_id":"PAIR:Clone Phishing|E-wallet Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Clone Phishing and E-wallet Phishing is correct, in that order?","choices":["copy legitimate message / targets wallet users","targets wallet users / copy legitimate message","copy legitimate message / poisoned search results","poisoned search results / targets wallet users"],"answer":"copy legitimate message / targets wallet users","explanation":"Clone Phishing means copy legitimate message; E-wallet Phishing means targets wallet users.","id":"S03Q46"},{"concept_id":"Social Engineering Concepts:14","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches the phase in which the attacker chooses the person most likely to provide useful information?","choices":["Select a Target","Research the Target","Exploit the Relationship","Develop a Relationship"],"answer":"Select a Target","explanation":"Select a Target: the phase in which the attacker chooses the person most likely to provide useful information.","id":"S03Q47"},{"concept_id":"Social Engineering Concepts:3","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with getting the target to agree to a minor request before escalating?","choices":["Reciprocity","Commitment and Consistency","Authority","Social Proof"],"answer":"Commitment and Consistency","explanation":"Commitment and Consistency: using a small initial commitment to increase the chance of later compliance.","id":"S03Q48"},{"concep
