earch results","redirects without lure / copy legitimate message","poisoned search results / redirects without lure","redirects without lure / poisoned search results"],"answer":"redirects without lure / poisoned search results","explanation":"Pharming means redirects without lure; Search Engine Phishing means poisoned search results.","id":"S07Q11"},{"concept_id":"Identity Theft:90","variant":0,"category":"Identity Theft","question":"Which concept best matches stealing or redirecting physical mail to obtain financial or administrative information?","choices":["Social Media Mining","Identity Theft","Mail Theft and Rerouting","Dark Web Data Trading"],"answer":"Mail Theft and Rerouting","explanation":"Mail Theft and Rerouting: stealing or redirecting physical mail to obtain financial or administrative information.","id":"S07Q12"},{"concept_id":"Impersonation on Social Networking Sites:77","variant":1,"category":"Impersonation on Social Networking Sites","question":"Which option is most directly associated with eliminating the need to send new friend requests after an account takeover?","choices":["Profile Cloning","Message History","Existing Contact List","Account Takeover"],"answer":"Existing Contact List","explanation":"Existing Contact List: the social-network advantage that lets a hijacked real account message trusted people immediately.","id":"S07Q13"},{"concept_id":"PAIR:wget|cURL","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between wget and cURL is correct, in that order?","choices":["CLI recursive mirror / granular URL requests","granular URL requests / CLI recursive mirror","GUI site mirroring / granular URL requests","CLI recursive mirror / GUI site mirroring"],"answer":"CLI recursive mirror / granular URL requests","explanation":"wget means CLI recursive mirror; cURL means granular URL requests.","id":"S07Q14"},{"concept_id":"Social Engineering Techniques:27","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches creating a situation in which the victim approaches the attacker for help?","choices":["Reverse Social Engineering","Impersonation","Eavesdropping","Shoulder Surfing"],"answer":"Reverse Social Engineering","explanation":"Reverse Social Engineering: creating a situation in which the victim approaches the attacker for help.","id":"S07Q15"},{"concept_id":"Social Engineering Countermeasures:101","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: secure unattended workstation?","choices":["Lock Screen When Away","Security Policy Dissemination","Security Awareness Training","Policy Acknowledgement"],"answer":"Lock Screen When Away","explanation":"Lock Screen When Away: locking or shutting down a computer before leaving it unattended.","id":"S07Q16"},{"concept_id":"Social Engineering Countermeasures:99","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: no password reuse?","choices":["Security Policy Dissemination","Unique Passwords","Account Lockout","Security Awareness Training"],"answer":"Unique Passwords","explanation":"Unique Passwords: using a different password for each account instead of reusing the same secret.","id":"S07Q17"},{"concept_id":"Social Engineering Techniques:65","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches creating a fake wireless network that imitates a trusted SSID?","choices":["Rogue Access Point","Phishing","Captive Portal Phishing","Spear Phishing"],"answer":"Rogue Access Point","explanation":"Rogue Access Point: creating a fake wireless network that imitates a trusted SSID.","id":"S07Q18"},{"concept_id":"Social Engineering Countermeasures:105","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: mark authentic media; making trusted video easier to distinguish from manipulated content?","choices":["Digital Watermarking","Security Awareness Training","Security Policy Dissemination","AI/ML Deepfake Detection"],"answer":"Digital Watermarking","explanation":"Digital Watermarking: embedding authenticity information into legitimate media to help verify its origin.","id":"S07Q19"},{"concept_id":"Social Engineering Concepts:0","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with attacking human behavior rather than a technical vulnerability?","choices":["Pretexting","Social engineering","Reciprocity","Constant Vigilance"],"answer":"Social engineering","explanation":"Social engineering: manipulating people into revealing information or taking actions they normally would not take.","id":"S07Q20"},{"concept_id":"Social Engineering Techniques:24","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: unauthorized listening?","choices":["Dumpster Diving","Shoulder Surfing","Eavesdropping","Impersonation"],"answer":"Eavesdropping","explanation":"Eavesdropping: secretly listening to conversations or intercepting communications without authorization.","id":"S07Q21"},{"concept_id":"Social Engineering Countermeasures:103","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with providing community phishing intelligence for anti-phishing integrations?","choices":["PhishTank","Security Awareness Training","OhPhish","Netcraft"],"answer":"PhishTank","explanation":"PhishTank: a collaborative clearinghouse that collects phishing reports and exposes data through an open API.","id":"S07Q22"},{"concept_id":"PAIR:Spimming|Clone Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Spimming and Clone Phishing is correct, in that order?","choices":["copy legitimate message / instant-message spam","instant-message spam / inactive tab changes","inactive tab changes / copy legitimate message","instant-message spam / copy legitimate message"],"answer":"instant-message spam / copy legitimate message","explanation":"Spimming means instant-message spam; Clone Phishing means copy legitimate message.","id":"S07Q23"},{"concept_id":"Identity Theft:94","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: medical records do not match reality; a warning sign that another person may be using the victim's healthcare identity?","choices":["Unauthorized Account Charges","Criminal Identity Theft","Identity Theft","Unexpected Medical Record Changes"],"answer":"Unexpected Medical Record Changes","explanation":"Unexpected Medical Record Changes: new diagnoses or treatment records that the real patient never received.","id":"S07Q24"},{"concept_id":"Impersonation on Social Networking Sites:80","variant":0,"category":"Impersonation on Social Networking Sites","question":"Which concept best matches adding a second authentication factor to reduce the chance that stolen credentials lead to takeover?","choices":["Separate-channel Verification","Duplicate Profile Reporting","Breach Exposure Monitoring","MFA on Social Accounts"],"answer":"MFA on Social Accounts","explanation":"MFA on Social Accounts: adding a second authentication factor to reduce the chance that stolen credentials lead to takeover.","id":"S07Q25"},{"concept_id":"PAIR:Whaling|Reverse Tabnabbing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Whaling and Reverse Tabnabbing is correct, in that order?","choices":["targets executives / new tab alters original","malicious OAuth consent / new tab alters original","targets executives / malicious OAuth consent","new tab alters original / targets executives"],"answer":"targets executives / new tab alters original","explanation":"Whaling means targets executives; Reverse Tabnabbing means new tab alters original.","id":"S07Q26"},{"concept_id":"Social Engineering Techniques:19","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: targeted personalized phishing; using OSINT about a target's role, colleagues, or projects to craft a relevant email?","choices":["Spimming","Pharming","Spear Phishing","Whaling"],"answer":"Spear Phishing","explanation":"Spear Phishing: targeting a specific person or small group with personalized phishing content.","id":"S07Q27"},{"concept_id":"PAIR:Shoulder Surfing|Bait and Switching","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Shoulder Surfing and Bait and Switching is correct, in that order?","choices":["observe password entry / attractive offer prompts action","attractive offer prompts action / observe password entry","extract through conversation / attractive offer prompts action","observe password entry / extract through conversation"],"answer":"observe password entry / attractive offer prompts action","explanation":"Shoulder Surfing means observe password entry; Bait and Switching means attractive offer prompts action.","id":"S07Q28"},{"concept_id":"Social Engineering Techniques:31","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: create the problem?","choices":["Support","Marketing","Phishing","Sabotage"],"answer":"Sabotage","explanation":"Sabotage: damaging or appearing to damage a system so the victim needs assistance.","id":"S07Q29"},{"concept_id":"Social Engineering Techniques:36","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with offering to fix a problem in return for credentials?","choices":["Shoulder Surfing","Eavesdropping","Impersonation","Quid Pro Quo"],"answer":"Quid Pro Quo","explanation":"Quid Pro Quo: offering a service or benefit in direct exchange for information or access.","id":"S07Q30"},{"concept_id":"Social Engineering Techniques:56","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: weaponized file attachment; sending an invoice, shipping notice, PDF, Office file, ZIP, or RAR that delivers malware?","choices":["Spear Phishing","Phishing","Malicious Attachment","Whaling"],"answer":"Malicious Attachment","explanation":"Malicious Attachment: using a document or archive that contains executable content or malicious macros.","id":"S07Q31"},{"concept_id":"Social Engineering Techniques:35","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: fake support request?","choices":["Impersonation","Tech Support Impersonation","Eavesdropping","Shoulder Surfing"],"answer":"Tech Support Impersonation","explanation":"Tech Support Impersonation: posing as technical support to obtain credentials or other sensitive information.","id":"S07Q32"},{"concept_id":"Social Engineering Techniques:21","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using voice calls to obtain information or manipulate a victim?","choices":["Vishing","SMiShing","Spear Phishing","Phishing"],"answer":"Vishing","explanation":"Vishing: using voice calls to obtain information or manipulate a victim.","id":"S07Q33"},{"concept_id":"PAIR:Commitment and Consistency|Social Proof","variant":0,"category":"Social Engineering Concepts","question":"Which distinction between Commitment and Consistency and Social Proof is correct, in that order?","choices":["others already complied / small commitment then escalation","limited availability / others already complied","small commitment then escalation / limited availability","small commitment then escalation / others already complied"],"answer":"small commitment then escalation / others already complied","explanation":"Commitment and Consistency means small commitment then escalation; Social Proof means others already complied.","id":"S07Q34"},{"concept_id":"Insider Threats:70","variant":2,"category":"Insider Threats","question":"What term best fits this clue: dissatisfied internal target?","choices":["Unregulated Access to Information","Insufficient Security Training","Siloed Organizational Units","Disgruntled Employee"],"answer":"Disgruntled Employee","explanation":"Disgruntled Employee: an internal person specifically identified in the course as easier for an attacker to manipulate.","id":"S07Q35"},{"concept_id":"PAIR:E-wallet Phishing|Tabnabbing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between E-wallet Phishing and Tabnabbing is correct, in that order?","choices":["targets wallet users / inactive tab changes","targets executives / inactive tab changes","targets wallet users / targets executives","inactive tab changes / targets wallet users"],"answer":"targets wallet users / inactive tab changes","explanation":"E-wallet Phishing means targets wallet users; Tabnabbing means inactive tab changes.","id":"S07Q36"},{"concept_id":"Insider Threats:74","variant":2,"category":"Insider Threats","question":"What term best fits this clue: missing internal rules?","choices":["Unregulated Access to Information","Insufficient Security Training","Disgruntled Employee","Lack of Security Policies"],"answer":"Lack of Security Policies","explanation":"Lack of Security Policies: an organizational weakness caused by missing rules for handling information and access.","id":"S07Q37"},{"concept_id":"Social Engineering Techniques:52","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using long filenames or hidden extensions in a mass unsolicited message?","choices":["Spam Email","Hoax Letters","Pop-up Windows","Chain Letters"],"answer":"Spam Email","explanation":"Spam Email: sending unsolicited bulk email that may collect information or carry concealed malware.","id":"S07Q38"},{"concept_id":"Social Engineering Techniques:23","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches pretending to be a legitimate or authorized person to gain information or access?","choices":["Dumpster Diving","Impersonation","Shoulder Surfing","Eavesdropping"],"answer":"Impersonation","explanation":"Impersonation: pretending to be a legitimate or authorized person to gain information or access.","id":"S07Q39"},{"concept_id":"Social Engineering Techniques:49","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches spreading false warnings about threats that do not actually exist?","choices":["Hoax Letters","Pop-up Windows","Chain Letters","Instant Chat Messenger Attack"],"answer":"Hoax Letters","explanation":"Hoax Letters: spreading false warnings about threats that do not actually exist.","id":"S07Q40"},{"concept_id":"Social Engineering Techniques:58","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: GUI site mirroring; using a GUI to clone or mirror website content?","choices":["cURL","Phishing","wget","WinHTTrack"],"answer":"WinHTTrack","explanation":"WinHTTrack: a graphical tool that can mirror an entire website for offline use.","id":"S07Q41"},{"concept_id":"Identity Theft:91","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with harvesting names, dates, relationships, locations, and other PII from public profiles?","choices":["Social Media Mining","Dark Web Data Trading","Mail Theft and Rerouting","Identity Theft"],"answer":"Social Media Mining","explanation":"Social Media Mining: collecting personal details from social profiles to build or impersonate an identity.","id":"S07Q42"},{"concept_id":"Social Engineering Concepts:7","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with using a message such as an offer expiring today?","choices":["Social Proof","Reciprocity","Scarcity","Commitment and Consistency"],"answer":"Scarcity","explanation":"Scarcity: making something seem more valuable because availability is limited.","id":"S07Q43"},{"concept_id":"Social Engineering Techniques:48","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: fake alert popup; displaying a fraudulent security warning claiming the computer is blocked?","choices":["Hoax Letters","Chain Letters","Instant Chat Messenger Attack","Pop-up Windows"],"answer":"Pop-up Windows","explanation":"Pop-up Windows: using fake alert windows to pressure users into calling or entering information.","id":"S07Q44"},{"concept_id":"Social Engineering Techniques:37","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using disarming questions and social skills so the target reveals details naturally?","choices":["Shoulder Surfing","Eavesdropping","Impersonation","Elicitation"],"answer":"Elicitation","explanation":"Elicitation: drawing out specific information through normal-looking conversation.","id":"S07Q45"},{"concept_id":"Social Engineering Countermeasures:96","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with educating staff on the policies they are expected to follow?","choices":["Security Policy Dissemination","Policy Acknowledgement","Security Awareness Training","Account Lockout"],"answer":"Security Policy Dissemination","explanation":"Security Policy Dissemination: making sure employees receive and understand the organization's security rules.","id":"S07Q46"},{"concept_id":"Social Engineering Techniques:53","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: fake fear-based warning?","choices":["Scareware","Pop-up Windows","Hoax Letters","Chain Letters"],"answer":"Scareware","explanation":"Scareware: using frightening fake warnings to convince users to install software or visit malicious sites.","id":"S07Q47"},{"concept_id":"Social Engineering Concepts:10","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: seems known; using names, routines, or shared context to feel familiar?","choices":["Intimidation","Familiarity","Urgency","Trust"],"answer":"Familiarity","explanation":"Familiarity: exploiting recognition or a sense that the requester is known to the target.","id":"S07Q48"},{"concept_id":"Social Engineering Techniques:39","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with placing a USB labeled with interesting information where employees will find it?","choices":["Whaling","Phishing","Spear Phishing","Baiting"],"answer":"Baiting","explanation":"Baiting: leaving a tempting object or resource for the victim to discover and interact with.","id":"S07Q49"},{"concept_id":"Social Engineering Concepts:8","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with using fear of punishment or escalation to force quick compliance?","choices":["Familiarity","Urgency","Trust","Intimidation"],"answer":"Intimidation","explanation":"Intimidation: pressuring a person through fear, threats, or an implied negative consequence.","id":"S07Q50"}],[{"concept_id":"PAIR:Reverse Social Engineering|Bait and Switching","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Reverse Social Engineering and Bait and Switching is correct, in that order?","choices":["victim seeks attacker / extract through conversation","victim seeks attacker / attractive offer prompts action","attractive offer prompts action / victim seeks attacker","extract through conversation / attractive offer prompts action"],"answer":"victim seeks attacker / attractive offer prompts action","explanation":"Reverse Social Engineering means victim seeks attacker; Bait and Switching means attractive offer prompts action.","id":"S08Q01"},{"concept_id":"Social Engineering Techniques:46","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with presenting a fake app that asks the user to approve access to cloud-account data?","choices":["Consent Phishing","Spear Phishing","Pharming","Whaling"],"answer":"Consent Phishing","explanation":"Consent Phishing: abusing OAuth authorization so a victim grants a malicious application account permissions.","id":"S08Q02"},{"concept_id":"Social Engineering Techniques:24","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches secretly listening to conversations or intercepting communications without authorization?","choices":["Impersonation","Dumpster Diving","Eavesdropping","Shoulder Surfing"],"answer":"Eavesdropping","explanation":"Eavesdropping: secretly listening to conversations or intercepting communications without authorization.","id":"S08Q03"},{"concept_id":"Social Engineering Techniques:48","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using fake alert windows to pressure users into calling or entering information?","choices":["Hoax Letters","Instant Chat Messenger Attack","Chain Letters","Pop-up Windows"],"answer":"Pop-up Windows","explanation":"Pop-up Windows: using fake alert windows to pressure users into calling or entering information.","id":"S08Q04"},{"concept_id":"PAIR:Pharming|E-wallet Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Pharming and E-wallet Phishing is correct, in that order?","choices":["copy legitimate message / targets wallet users","redirects without lure / targets wallet users","redirects without lure / copy legitimate message","targets wallet users / redirects without lure"],"answer":"redirects without lure / targets wallet users","explanation":"Pharming means redirects without lure; E-wallet Phishing means targets wallet users.","id":"S08Q05"},{"concept_id":"Identity Theft:87","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with accessing an insurance plan under the victim's identity?","choices":["Financial Identity Theft","Criminal Identity Theft","Insurance Identity Theft","Driver's License Identity Theft"],"answer":"Insurance Identity Theft","explanation":"Insurance Identity Theft: using another person's insurance information to obtain covered treatment or benefits.","id":"S08Q06"},{"concept_id":"Social Engineering Techniques:37","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: extract through conversation?","choices":["Shoulder Surfing","Eavesdropping","Impersonation","Elicitation"],"answer":"Elicitation","explanation":"Elicitation: drawing out specific information through normal-looking conversation.","id":"S08Q07"},{"concept_id":"Insider Threats:72","variant":2,"category":"Insider Threats","question":"What term best fits this clue: poor employee preparation?","choices":["Insufficient Security Training","Siloed Organizational Units","Unregulated Access to Information","Disgruntled Employee"],"answer":"Insufficient Security Training","explanation":"Insufficient Security Training: an organizational weakness that leaves employees less able to recognize manipulation.","id":"S08Q08"},{"concept_id":"Identity Theft:85","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: steal for financial transactions; maxing credit cards or opening financial accounts in the victim's name?","choices":["Financial Identity Theft","Insurance Identity Theft","Criminal Identity Theft","Driver's License Identity Theft"],"answer":"Financial Identity Theft","explanation":"Financial Identity Theft: using stolen bank or credit information for purchases, withdrawals, or new accounts.","id":"S08Q09"},{"concept_id":"Social Engineering Techniques:67","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: QR login session hijack; getting a victim to scan an attacker's QR login token?","choices":["QRLJacking","Fake Security Application","Repackaged App","Phishing"],"answer":"QRLJacking","explanation":"QRLJacking: abusing QR-code login by presenting a cloned login QR code to hijack a session.","id":"S08Q10"},{"concept_id":"Social Engineering Concepts:4","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches using the behavior of other people as evidence that an action is acceptable?","choices":["Reciprocity","Authority","Social Proof","Commitment and Consistency"],"answer":"Social Proof","explanation":"Social Proof: using the behavior of other people as evidence that an action is acceptable.","id":"S08Q11"},{"concept_id":"Social Engineering Techniques:42","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: copy legitimate message; reusing the look and wording of a real communication to reduce suspicion?","choices":["Clone Phishing","Pharming","Whaling","Spear Phishing"],"answer":"Clone Phishing","explanation":"Clone Phishing: copying a legitimate message and replacing its link or attachment with a malicious one.","id":"S08Q12"},{"concept_id":"Impersonation on Social Networking Sites:80","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: second factor on social account?","choices":["Separate-channel Verification","MFA on Social Accounts","Duplicate Profile Reporting","Breach Exposure Monitoring"],"answer":"MFA on Social Accounts","explanation":"MFA on Social Accounts: adding a second authentication factor to reduce the chance that stolen credentials lead to takeover.","id":"S08Q13"},{"concept_id":"PAIR:PhishTank|OhPhish","variant":0,"category":"Social Engineering Countermeasures","question":"Which distinction between PhishTank and OhPhish is correct, in that order?","choices":["community phishing database / phishing awareness simulation","phishing awareness simulation / community phishing database","community phishing database / browser phishing protection","browser phishing protection / phishing awareness simulation"],"answer":"community phishing database / phishing awareness simulation","explanation":"PhishTank means community phishing database; OhPhish means phishing awareness simulation.","id":"S08Q14"},{"concept_id":"Social Engineering Techniques:41","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using bots to harvest messaging IDs and distribute unsolicited messages?","choices":["Whaling","Spimming","Spear Phishing","Pharming"],"answer":"Spimming","explanation":"Spimming: sending spam through instant messaging platforms.","id":"S08Q15"},{"concept_id":"Social Engineering Techniques:22","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: SMS phishing?","choices":["SMiShing","Phishing","Vishing","Spear Phishing"],"answer":"SMiShing","explanation":"SMiShing: using SMS text messages to lure a victim into clicking, calling, or disclosing information.","id":"S08Q16"},{"concept_id":"Social Engineering Techniques:49","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with sending a fake virus warning that wastes time and creates confusion?","choices":["Hoax Letters","Pop-up Windows","Instant Chat Messenger Attack","Chain Letters"],"answer":"Hoax Letters","explanation":"Hoax Letters: spreading false warnings about threats that do not actually exist.","id":"S08Q17"},{"concept_id":"PAIR:Shoulder Surfing|Quid Pro Quo","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Shoulder Surfing and Quid Pro Quo is correct, in that order?","choices":["unauthorized listening / direct exchange","direct exchange / observe password entry","observe password entry / direct exchange","observe password entry / unauthorized listening"],"answer":"observe password entry / direct exchange","explanation":"Shoulder Surfing means observe password entry; Quid Pro Quo means direct exchange.","id":"S08Q18"},{"concept_id":"Social Engineering Countermeasures:95","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches teaching users how to recognize and respond to manipulation attempts?","choices":["Policy Acknowledgement","Account Lockout","Security Policy Dissemination","Security Awareness Training"],"answer":"Security Awareness Training","explanation":"Security Awareness Training: teaching users how to recognize and respond to manipulation attempts.","id":"S08Q19"},{"concept_id":"Identity Theft:92","variant":0,"category":"Identity Theft","question":"Which concept best matches buying stolen credentials, banking information, or personal identifiers from underground markets?","choices":["Dark Web Data Trading","Identity Theft","Mail Theft and Rerouting","Social Media Mining"],"answer":"Dark Web Data Trading","explanation":"Dark Web Data Trading: buying stolen credentials, banking information, or personal identifiers from underground markets.","id":"S08Q20"},{"concept_id":"Social Engineering Techniques:30","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: redirect a delivery; tricking delivery personnel into sending goods somewhere else?","choices":["Impersonation","Shoulder Surfing","Eavesdropping","Diversion Theft"],"answer":"Diversion Theft","explanation":"Diversion Theft: redirecting a legitimate delivery or consignment to an unintended location through deception.","id":"S08Q21"},{"concept_id":"Social Engineering Techniques:29","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches entering a secure area by closely following an authorized person without their consent or knowledge?","choices":["Spear Phishing","Piggybacking","Phishing","Tailgating"],"answer":"Tailgating","explanation":"Tailgating: entering a secure area by closely following an authorized person without their consent or knowledge.","id":"S08Q22"},{"concept_id":"PAIR:Reciprocity|Commitment and Consistency","variant":0,"category":"Social Engineering Concepts","question":"Which distinction between Reciprocity and Commitment and Consistency is correct, in that order?","choices":["small commitment then escalation / return a favor","return a favor / perceived power","perceived power / small commitment then escalation","return a favor / small commitment then escalation"],"answer":"return a favor / small commitment then escalation","explanation":"Reciprocity means return a favor; Commitment and Consistency means small commitment then escalation.","id":"S08Q23"},{"concept_id":"Social Engineering Techniques:55","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: abuse trusted contacts?","choices":["Contact Spamming","Spear Phishing","Whaling","Phishing"],"answer":"Contact Spamming","explanation":"Contact Spamming: using a compromised or spoofed trusted identity to send messages to that person's contacts.","id":"S08Q24"},{"concept_id":"Social Engineering Techniques:60","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: granular URL requests; making granular HTTP requests rather than mirroring a complete site?","choices":["cURL","WinHTTrack","Phishing","wget"],"answer":"cURL","explanation":"cURL: a command-line URL transfer tool suited to individual pages, headers, or API responses.","id":"S08Q25"},{"concept_id":"PAIR:Spear Phishing|Whaling","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Spear Phishing and Whaling is correct, in that order?","choices":["new tab alters original / targets executives","targets executives / targeted personalized phishing","targeted personalized phishing / targets executives","targeted personalized phishing / new tab alters original"],"answer":"targeted personalized phishing / targets executives","explanation":"Spear Phishing means targeted personalized phishing; Whaling means targets executives.","id":"S08Q26"},{"concept_id":"Social Engineering Countermeasures:105","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: mark authentic media?","choices":["AI/ML Deepfake Detection","Security Awareness Training","Digital Watermarking","Security Policy Dissemination"],"answer":"Digital Watermarking","explanation":"Digital Watermarking: embedding authenticity information into legitimate media to help verify its origin.","id":"S08Q27"},{"concept_id":"Social Engineering Concepts:11","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches exploiting confidence that a person, source, or relationship is reliable?","choices":["Trust","Intimidation","Urgency","Familiarity"],"answer":"Trust","explanation":"Trust: exploiting confidence that a person, source, or relationship is reliable.","id":"S08Q28"},{"concept_id":"Social Engineering Techniques:65","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with attracting users to an attacker-controlled network so their traffic passes through it?","choices":["Rogue Access Point","Phishing","Captive Portal Phishing","Spear Phishing"],"answer":"Rogue Access Point","explanation":"Rogue Access Point: creating a fake wireless network that imitates a trusted SSID.","id":"S08Q29"},{"concept_id":"Social Engineering Techniques:26","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: search discarded information?","choices":["Eavesdropping","Shoulder Surfing","Dumpster Diving","Impersonation"],"answer":"Dumpster Diving","explanation":"Dumpster Diving: searching discarded material for useful organizational or personal information.","id":"S08Q30"},{"concept_id":"Social Engineering Countermeasures:98","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: lock after failed attempts?","choices":["Unique Passwords","Account Lockout","Security Policy Dissemination","Security Awareness Training"],"answer":"Account Lockout","explanation":"Account Lockout: blocking an account after a defined number of failed authentication attempts.","id":"S08Q31"},{"concept_id":"Social Engineering Techniques:34","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches claiming that an absent authority figure approved the request?","choices":["Shoulder Surfing","Impersonation","Third-party Authorization","Eavesdropping"],"answer":"Third-party Authorization","explanation":"Third-party Authorization: claiming that an absent authority figure approved the request.","id":"S08Q32"},{"concept_id":"PAIR:Unregulated Access to Information|Lack of Security Policies","variant":0,"category":"Insider Threats","question":"Which distinction between Unregulated Access to Information and Lack of Security Policies is correct, in that order?","choices":["security gaps between units / missing internal rules","excess internal access / missing internal rules","missing internal rules / excess internal access","excess internal access / security gaps between units"],"answer":"excess internal access / missing internal rules","explanation":"Unregulated Access to Information means excess internal access; Lack of Security Policies means missing internal rules.","id":"S08Q33"},{"concept_id":"Impersonation on Social Networking Sites:78","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: past conversations aid impersonation?","choices":["Profile Cloning","Message History","Existing Contact List","Account Takeover"],"answer":"Message History","explanation":"Message History: past conversations that help an attacker impersonating a real account sound believable.","id":"S08Q34"},{"concept_id":"Identity Theft:93","variant":2,"category":"Identity Theft","question":"What term best fits this clue: unfamiliar charges?","choices":["Criminal Identity Theft","Identity Theft","Unexpected Medical Record Changes","Unauthorized Account Charges"],"answer":"Unauthorized Account Charges","explanation":"Unauthorized Account Charges: transactions on a credit or bank account that the real owner does not recognize.","id":"S08Q35"},{"concept_id":"Insider Threats:73","variant":3,"category":"Insider Threats","question":"Which concept best combines these ideas: security gaps between units; creating gaps in verification and inconsistent handling of sensitive information?","choices":["Insufficient Security Training","Disgruntled Employee","Unregulated Access to Information","Siloed Organizational Units"],"answer":"Siloed Organizational Units","explanation":"Siloed Organizational Units: a company weakness created when separate units do not coordinate security effectively.","id":"S08Q36"},{"concept_id":"Social Engineering Countermeasures:100","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: second authentication factor?","choices":["Security Policy Dissemination","Security Awareness Training","Policy Acknowledgement","MFA"],"answer":"MFA","explanation":"MFA: requiring an additional authentication factor beyond the password.","id":"S08Q37"},{"concept_id":"Impersonation on Social Networking Sites:82","variant":0,"category":"Impersonation on Social Networking Sites","question":"Which concept best matches checking whether account credentials have appeared in known data breaches?","choices":["Breach Exposure Monitoring","Duplicate Profile Reporting","MFA on Social Accounts","Separate-channel Verification"],"answer":"Breach Exposure Monitoring","explanation":"Breach Exposure Monitoring: checking whether account credentials have appeared in known data breaches.","id":"S08Q38"},{"concept_id":"Social Engineering Techniques:33","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches continuing to assist the victim after contact so the attacker remains credible and unidentified?","choices":["Marketing","Support","Sabotage","Phishing"],"answer":"Support","explanation":"Support: continuing to assist the victim after contact so the attacker remains credible and unidentified.","id":"S08Q39"},{"concept_id":"Social Engineering Concepts:9","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: act immediately; demanding action now before an account closes or a deadline passes?","choices":["Intimidation","Familiarity","Trust","Urgency"],"answer":"Urgency","explanation":"Urgency: reducing careful verification by making the target believe immediate action is required.","id":"S08Q40"},{"concept_id":"Social Engineering Techniques:57","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: copy convincing web page; replicating a login page so entered credentials go to the attacker?","choices":["URL Hijacking","Typosquatting","Website Cloning","Homograph Attack"],"answer":"Website Cloning","explanation":"Website Cloning: copying enough of a legitimate site's appearance to make a fraudulent page convincing.","id":"S08Q41"},{"concept_id":"Social Engineering Concepts:15","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: build rapport; creating enough trust before asking for sensitive information?","choices":["Exploit the Relationship","Develop a Relationship","Select a Target","Research the Target"],"answer":"Develop a Relationship","explanation":"Develop a Relationship: the phase focused on building rapport and credibility with the selected person.","id":"S08Q42"},{"concept_id":"Social Engineering Techniques:69","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches tricking a victim into installing a malicious app presented as required security software?","choices":["Phishing","Repackaged App","QRLJacking","Fake Security Application"],"answer":"Fake Security Application","explanation":"Fake Security Application: tricking a victim into installing a malicious app presented as required security software.","id":"S08Q43"},{"concept_id":"Social Engineering Concepts:0","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: manipulates people?","choices":["Constant Vigilance","Pretexting","Reciprocity","Social engineering"],"answer":"Social engineering","explanation":"Social engineering: manipulating people into revealing information or taking actions they normally would not take.","id":"S08Q44"},{"concept_id":"Identity Theft:88","variant":2,"category":"Identity Theft","question":"What term best fits this clue: fraudulent healthcare identity?","choices":["Financial Identity Theft","Medical Identity Theft","Driver's License Identity Theft","Criminal Identity Theft"],"answer":"Medical Identity Theft","explanation":"Medical Identity Theft: using another person's identity to obtain medical products or healthcare services.","id":"S08Q45"},{"concept_id":"Social Engineering Techniques:50","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: forward for reward?","choices":["Chain Letters","Instant Chat Messenger Attack","Pop-up Windows","Hoax Letters"],"answer":"Chain Letters","explanation":"Chain Letters: encouraging recipients to forward a message to others by promising a benefit or invoking superstition.","id":"S08Q46"},{"concept_id":"Social Engineering Concepts:12","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: promise of gain; offering money or a prize to make the target ignore warning signs?","choices":["Intimidation","Familiarity","Urgency","Greed"],"answer":"Greed","explanation":"Greed: using the promise of financial gain, rewards, or valuable benefits to drive action.","id":"S08Q47"},{"concept_id":"Social Engineering Techniques:62","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using a misleading URL that resembles a legitimate destination?","choices":["Homograph Attack","URL Hijacking","Website Cloning","Typosquatting"],"answer":"URL Hijacking","explanation":"URL Hijacking: using a misleading URL that resembles a legitimate destination.","id":"S08Q48"},{"concept_id":"Social Engineering Concepts:6","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with finding common ground so the target is more willing to cooperate?","choices":["Liking","Commitment and Consistency","Reciprocity","Social Proof"],"answer":"Liking","explanation":"Liking: increasing compliance by building rapport, similarity, or friendliness.","id":"S08Q49"},{"concept_id":"Impersonation on Social Networking Sites:75","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: fake duplicate account?","choices":["Profile Cloning","Message History","Existing Contact List","Account Takeover"],"answer":"Profile Cloning","explanation":"Profile Cloning: creating a fake duplicate social-media account using another person's name, photo, and details.","id":"S08Q50"}],[{"concept_id":"Social Engineering Techniques:59","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches a command-line tool that can recursively mirror a website?","choices":["Phishing","cURL","wget","WinHTTrack"],"answer":"wget","explanation":"wget: a command-line tool that can recursively mirror a website.","id":"S09Q01"},{"concept_id":"PAIR:Dumpster Diving|Elicitation","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Dumpster Diving and Elicitation is correct, in that order?","choices":["search discarded information / redirect a delivery","search discarded information / extract through conversation","redirect a delivery / extract through conversation","extract through conversation / search discarded information"],"answer":"search discarded information / extract through conversation","explanation":"Dumpster Diving means search discarded information; Elicitation means extract through conversation.","id":"S09Q02"},{"concept_id":"Social Engineering Techniques:68","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches taking a legitimate mobile application, adding malicious code, and redistributing it?","choices":["Fake Security Application","QRLJacking","Repackaged App","Phishing"],"answer":"Repackaged App","explanation":"Repackaged App: taking a legitimate mobile application, adding malicious code, and redistributing it.","id":"S09Q03"},{"concept_id":"Social Engineering Concepts:3","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: small commitment then escalation; getting the target to agree to a minor request before escalating?","choices":["Social Proof","Authority","Reciprocity","Commitment and Consistency"],"answer":"Commitment and Consistency","explanation":"Commitment and Consistency: using a small initial commitment to increase the chance of later compliance.","id":"S09Q04"},{"concept_id":"Identity Theft:85","variant":0,"category":"Identity Theft","question":"Which concept best matches using stolen bank or credit information for purchases, withdrawals, or new accounts?","choices":["Insurance Identity Theft","Financial Identity Theft","Driver's License Identity Theft","Criminal Identity Theft"],"answer":"Financial Identity Theft","explanation":"Financial Identity Theft: using stolen bank or credit information for purchases, withdrawals, or new accounts.","id":"S09Q05"},{"concept_id":"Identity Theft:93","variant":0,"category":"Identity Theft","question":"Which concept best matches transactions on a credit or bank account that the real owner does not recognize?","choices":["Identity Theft","Unauthorized Account Charges","Unexpected Medical Record Changes","Criminal Identity Theft"],"answer":"Unauthorized Account Charges","explanation":"Unauthorized Account Charges: transactions on a credit or bank account that the real owner does not recognize.","id":"S09Q06"},{"concept_id":"Social Engineering Techniques:47","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using SEO techniques and keyword stuffing to promote a phishing page?","choices":["Spear Phishing","Pharming","Search Engine Phishing","Whaling"],"answer":"Search Engine Phishing","explanation":"Search Engine Phishing: manipulating search results so fraudulent sites appear where victims are likely to click.","id":"S09Q07"},{"concept_id":"Impersonation on Social Networking Sites:80","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: second factor on social account; hardening social accounts against phishing, breach, or cracked-password reuse?","choices":["Separate-channel Verification","MFA on Social Accounts","Duplicate Profile Reporting","Breach Exposure Monitoring"],"answer":"MFA on Social Accounts","explanation":"MFA on Social Accounts: adding a second authentication factor to reduce the chance that stolen credentials lead to takeover.","id":"S09Q08"},{"concept_id":"PAIR:Impersonation|Eavesdropping","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Impersonation and Eavesdropping is correct, in that order?","choices":["pretend to be authorized / unauthorized listening","unauthorized listening / pretend to be authorized","pretend to be authorized / redirect a delivery","redirect a delivery / unauthorized listening"],"answer":"pretend to be authorized / unauthorized listening","explanation":"Impersonation means pretend to be authorized; Eavesdropping means unauthorized listening.","id":"S09Q09"},{"concept_id":"Social Engineering Concepts:8","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: fear or threat?","choices":["Trust","Urgency","Familiarity","Intimidation"],"answer":"Intimidation","explanation":"Intimidation: pressuring a person through fear, threats, or an implied negative consequence.","id":"S09Q10"},{"concept_id":"Social Engineering Concepts:5","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: perceived power; pretending to be a manager, IT administrator, or law-enforcement official?","choices":["Authority","Reciprocity","Commitment and Consistency","Social Proof"],"answer":"Authority","explanation":"Authority: exploiting the tendency to comply with people perceived as having legitimate power.","id":"S09Q11"},{"concept_id":"Identity Theft:88","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with creating dangerous inaccuracies in the victim's medical record through fraudulent treatment?","choices":["Criminal Identity Theft","Medical Identity Theft","Financial Identity Theft","Driver's License Identity Theft"],"answer":"Medical Identity Theft","explanation":"Medical Identity Theft: using another person's identity to obtain medical products or healthcare services.","id":"S09Q12"},{"concept_id":"Social Engineering Techniques:18","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: deceptive electronic message; using a broad email campaign that redirects recipients to a fake login page?","choices":["Spear Phishing","SMiShing","Vishing","Phishing"],"answer":"Phishing","explanation":"Phishing: sending deceptive electronic messages that appear legitimate to obtain information or drive malicious action.","id":"S09Q13"},{"concept_id":"Social Engineering Techniques:35","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with claiming troubleshooting requires the user's password or account details?","choices":["Shoulder Surfing","Tech Support Impersonation","Impersonation","Eavesdropping"],"answer":"Tech Support Impersonation","explanation":"Tech Support Impersonation: posing as technical support to obtain credentials or other sensitive information.","id":"S09Q14"},{"concept_id":"Social Engineering Concepts:14","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: choose the victim; preferring a person who appears easier to manipulate after reconnaissance?","choices":["Select a Target","Research the Target","Develop a Relationship","Exploit the Relationship"],"answer":"Select a Target","explanation":"Select a Target: the phase in which the attacker chooses the person most likely to provide useful information.","id":"S09Q15"},{"concept_id":"Identity Theft:83","variant":0,"category":"Identity Theft","question":"Which concept best matches stealing personally identifiable information in order to commit fraud or other crimes as another person?","choices":["Driver's License Identity Theft","Financial Identity Theft","Criminal Identity Theft","Identity Theft"],"answer":"Identity Theft","explanation":"Identity Theft: stealing personally identifiable information in order to commit fraud or other crimes as another person.","id":"S09Q16"},{"concept_id":"Social Engineering Countermeasures:103","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: community phishing database?","choices":["PhishTank","OhPhish","Security Awareness Training","Netcraft"],"answer":"PhishTank","explanation":"PhishTank: a collaborative clearinghouse that collects phishing reports and exposes data through an open API.","id":"S09Q17"},{"concept_id":"Insider Threats:71","variant":2,"category":"Insider Threats","question":"What term best fits this clue: excess internal access?","choices":["Disgruntled Employee","Siloed Organizational Units","Unregulated Access to Information","Insufficient Security Training"],"answer":"Unregulated Access to Information","explanation":"Unregulated Access to Information: an organizational condition in which too many people can reach sensitive information without adequate control.","id":"S09Q18"},{"concept_id":"Social Engineering Concepts:16","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches the phase in which established trust is used to extract sensitive information or action?","choices":["Research the Target","Develop a Relationship","Select a Target","Exploit the Relationship"],"answer":"Exploit the Relationship","explanation":"Exploit the Relationship: the phase in which established trust is used to extract sensitive information or action.","id":"S09Q19"},{"concept_id":"Social Engineering Techniques:42","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: copy legitimate message?","choices":["Spear Phishing","Whaling","Clone Phishing","Pharming"],"answer":"Clone Phishing","explanation":"Clone Phishing: copying a legitimate message and replacing its link or attachment with a malicious one.","id":"S09Q20"},{"concept_id":"Social Engineering Concepts:12","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with offering money or a prize to make the target ignore warning signs?","choices":["Greed","Urgency","Familiarity","Intimidation"],"answer":"Greed","explanation":"Greed: using the promise of financial gain, rewards, or valuable benefits to drive action.","id":"S09Q21"},{"concept_id":"Impersonation on Social Networking Sites:78","variant":1,"category":"Impersonation on Social Networking Sites","question":"Which option is most directly associated with allowing references to earlier discussions after an account takeover?","choices":["Existing Contact List","Account Takeover","Profile Cloning","Message History"],"answer":"Message History","explanation":"Message History: past conversations that help an attacker impersonating a real account sound believable.","id":"S09Q22"},{"concept_id":"Social Engineering Techniques:22","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with sending a fake bank emergency message by text?","choices":["Spear Phishing","SMiShing","Vishing","Phishing"],"answer":"SMiShing","explanation":"SMiShing: using SMS text messages to lure a victim into clicking, calling, or disclosing information.","id":"S09Q23"},{"concept_id":"PAIR:Disgruntled Employee|Siloed Organizational Units","variant":0,"category":"Insider Threats","question":"Which distinction between Disgruntled Employee and Siloed Organizational Units is correct, in that order?","choices":["security gaps between units / dissatisfied internal target","dissatisfied internal target / missing internal rules","missing internal rules / security gaps between units","dissatisfied internal target / security gaps between units"],"answer":"dissatisfied internal target / security gaps between units","explanation":"Disgruntled Employee means dissatisfied internal target; Siloed Organizational Units means security gaps between units.","id":"S09Q24"},{"concept_id":"Social Engineering Techniques:63","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: lookalike Unicode characters?","choices":["URL Hijacking","Website Cloning","Typosquatting","Homograph Attack"],"answer":"Homograph Attack","explanation":"Homograph Attack: replacing characters in a domain with visually similar characters from another alphabet.","id":"S09Q25"},{"concept_id":"Social Engineering Techniques:61","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: misspelled domain?","choices":["URL Hijacking","Website Cloning","Typosquatting","Homograph Attack"],"answer":"Typosquatting","explanation":"Typosquatting: registering a deliberately misspelled domain that users may reach through typing mistakes.","id":"S09Q26"},{"concept_id":"Social Engineering Techniques:29","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: entry without consent?","choices":["Phishing","Spear Phishing","Piggybacking","Tailgating"],"answer":"Tailgating","explanation":"Tailgating: entering a secure area by closely following an authorized person without their consent or knowledge.","id":"S09Q27"},{"concept_id":"PAIR:Liking|Scarcity","variant":0,"category":"Social Engineering Concepts","question":"Which distinction between Liking and Scarcity is correct, in that order?","choices":["return a favor / limited availability","rapport and similarity / limited availability","rapport and similarity / return a favor","limited availability / rapport and similarity"],"answer":"rapport and similarity / limited availability","explanation":"Liking means rapport and similarity; Scarcity means limited availability.","id":"S09Q28"},{"concept_id":"Social Engineering Techniques:66","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using a rogue access point to display a fraudulent hotel or airport sign-in page?","choices":["Spear Phishing","Captive Portal Phishing","Rogue Access Point","Phishing"],"answer":"Captive Portal Phishing","explanation":"Captive Portal Phishing: presenting a fake network-login page that collects credentials from connected users.","id":"S09Q29"},{"concept_id":"Social Engineering Techniques:36","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: direct exchange; offering to fix a problem in return for credentials?","choices":["Impersonation","Eavesdropping","Quid Pro Quo","Shoulder Surfing"],"answer":"Quid Pro Quo","explanation":"Quid Pro Quo: offering a service or benefit in direct exchange for information or access.","id":"S09Q30"},{"concept_id":"Social Engineering Concepts:2","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: return a favor?","choices":["Reciprocity","Social Proof","Authority","Commitment and Consistency"],"answer":"Reciprocity","explanation":"Reciprocity: making someone feel obliged to return a favor or kindness.","id":"S09Q31"},{"concept_id":"Social Engineering Countermeasures:97","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: employees confirm understanding; obtaining signatures showing that staff received and accepted the rules?","choices":["Security Policy Dissemination","Account Lockout","Security Awareness Training","Policy Acknowledgement"],"answer":"Policy Acknowledgement","explanation":"Policy Acknowledgement: requiring employees to confirm that they understand security policies.","id":"S09Q32"},{"concept_id":"PAIR:URL Hijacking|Watering Hole Attack","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between URL Hijacking and Watering Hole Attack is correct, in that order?","choices":["compromise frequented site / misleading lookalike URL","misleading lookalike URL / compromise frequented site","misleading lookalike URL / copy convincing web page","copy convincing web page / compromise frequented site"],"answer":"misleading lookalike URL / compromise frequented site","explanation":"URL Hijacking means misleading lookalike URL; Watering Hole Attack means compromise frequented site.","id":"S09Q33"},{"concept_id":"Social Engineering Countermeasures:101","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with preventing opportunistic access to an already authenticated workstation?","choices":["Lock Screen When Away","Security Awareness Training","Security Policy Dissemination","Policy Acknowledgement"],"answer":"Lock Screen When Away","explanation":"Lock Screen When Away: locking or shutting down a computer before leaving it unattended.","id":"S09Q34"},{"concept_id":"PAIR:Pop-up Windows|Spam Email","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Pop-up Windows and Spam Email is correct, in that order?","choices":["fake alert popup / bulk unsolicited email","fake alert popup / false threat warning","bulk unsolicited email / fake alert popup","false threat warning / bulk unsolicited email"],"answer":"fake alert popup / bulk unsolicited email","explanation":"Pop-up Windows means fake alert popup; Spam Email means bulk unsolicited email.","id":"S09Q35"},{"concept_id":"Social Engineering Techniques:54","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: synthetic person imitation?","choices":["Whaling","Phishing","Deepfake","Spear Phishing"],"answer":"Deepfake","explanation":"Deepfake: AI-generated audio or video that convincingly imitates a real person.","id":"S09Q36"},{"concept_id":"Social Engineering Countermeasures:106","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: detect synthetic media artifacts; screening suspicious media for signs that it was artificially generated?","choices":["Security Awareness Training","AI/ML Deepfake Detection","Security Policy Dissemination","Digital Watermarking"],"answer":"AI/ML Deepfake Detection","explanation":"AI/ML Deepfake Detection: using automated analysis to find unnatural facial movement, lighting, lip synchronization, or other synthetic artifacts.","id":"S09Q37"},{"concept_id":"Social Engineering Techniques:27","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: victim seeks attacker?","choices":["Impersonation","Eavesdropping","Reverse Social Engineering","Shoulder Surfing"],"answer":"Reverse Social Engineering","explanation":"Reverse Social Engineering: creating a situation in which the victim approaches the attacker for help.","id":"S09Q38"},{"concept_id":"Impersonation on Social Networking Sites:82","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: watch for exposed credentials; reducing takeover risk by detecting exposed credentials before attackers reuse them?","choices":["Duplicate Profile Reporting","MFA on Social Accounts","Breach Exposure Monitoring","Separate-channel Verification"],"answer":"Breach Exposure Monitoring","explanation":"Breach Exposure Monitoring: checking whether account credentials have appeared in known data breaches.","id":"S09Q39"},{"concept_id":"Social Engineering Countermeasures:99","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches using a different password for each account instead of reusing the same secret?","choices":["Security Awareness Training","Unique Passwords","Account Lockout","Security Policy Dissemination"],"answer":"Unique Passwords","explanation":"Unique Passwords: using a different password for each account instead of reusing the same secret.","id":"S09Q40"},{"concept_id":"Social Engineering Techniques:43","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches impersonating an electronic-wallet provider to steal wallet-related information?","choices":["Whaling","E-wallet Phishing","Pharming","Spear Phishing"],"answer":"E-wallet Phishing","explanation":"E-wallet Phishing: impersonating an electronic-wallet provider to steal wallet-related information.","id":"S09Q41"},{"concept_id":"Impersonation on Social Networking Sites:75","variant":0,"category":"Impersonation on Social Networking Sites","question" const STORAGE_KEY = "ceh-v13-social-engineering-direct-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Social Engineering — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied Social Engineering materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Social Engineering</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Social Engineering</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
