t_id":"Impersonation on Social Networking Sites:79","variant":1,"category":"Impersonation on Social Networking Sites","question":"Which option is most directly associated with a defensive response aimed specifically at profile-cloning attacks?","choices":["MFA on Social Accounts","Duplicate Profile Reporting","Separate-channel Verification","Breach Exposure Monitoring"],"answer":"Duplicate Profile Reporting","explanation":"Duplicate Profile Reporting: reporting a second lookalike account that appears to impersonate a real user.","id":"S03Q49"},{"concept_id":"Social Engineering Techniques:53","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using frightening fake warnings to convince users to install software or visit malicious sites?","choices":["Hoax Letters","Scareware","Chain Letters","Pop-up Windows"],"answer":"Scareware","explanation":"Scareware: using frightening fake warnings to convince users to install software or visit malicious sites.","id":"S03Q50"}],[{"concept_id":"Social Engineering Techniques:18","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: deceptive electronic message?","choices":["Phishing","Spear Phishing","Vishing","SMiShing"],"answer":"Phishing","explanation":"Phishing: sending deceptive electronic messages that appear legitimate to obtain information or drive malicious action.","id":"S04Q01"},{"concept_id":"Social Engineering Countermeasures:102","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: browser phishing protection?","choices":["Security Awareness Training","Netcraft","OhPhish","PhishTank"],"answer":"Netcraft","explanation":"Netcraft: a browser extension that blocks or warns about suspected phishing sites.","id":"S04Q02"},{"concept_id":"Impersonation on Social Networking Sites:79","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: report the fake copy?","choices":["Duplicate Profile Reporting","Breach Exposure Monitoring","MFA on Social Accounts","Separate-channel Verification"],"answer":"Duplicate Profile Reporting","explanation":"Duplicate Profile Reporting: reporting a second lookalike account that appears to impersonate a real user.","id":"S04Q03"},{"concept_id":"Social Engineering Techniques:69","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: malware disguised as security app; using a banking pop-up to direct the victim to an attacker-controlled app store?","choices":["Repackaged App","QRLJacking","Phishing","Fake Security Application"],"answer":"Fake Security Application","explanation":"Fake Security Application: tricking a victim into installing a malicious app presented as required security software.","id":"S04Q04"},{"concept_id":"PAIR:Third-party Authorization|Elicitation","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Third-party Authorization and Elicitation is correct, in that order?","choices":["unauthorized listening / extract through conversation","extract through conversation / claims absent approval","claims absent approval / extract through conversation","claims absent approval / unauthorized listening"],"answer":"claims absent approval / extract through conversation","explanation":"Third-party Authorization means claims absent approval; Elicitation means extract through conversation.","id":"S04Q05"},{"concept_id":"Social Engineering Techniques:30","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches redirecting a legitimate delivery or consignment to an unintended location through deception?","choices":["Shoulder Surfing","Diversion Theft","Impersonation","Eavesdropping"],"answer":"Diversion Theft","explanation":"Diversion Theft: redirecting a legitimate delivery or consignment to an unintended location through deception.","id":"S04Q06"},{"concept_id":"Social Engineering Concepts:2","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: return a favor; doing something for the target first and then asking for something in return?","choices":["Social Proof","Authority","Reciprocity","Commitment and Consistency"],"answer":"Reciprocity","explanation":"Reciprocity: making someone feel obliged to return a favor or kindness.","id":"S04Q07"},{"concept_id":"Social Engineering Countermeasures:99","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with reducing the damage from one credential breach spreading to other services?","choices":["Security Awareness Training","Security Policy Dissemination","Unique Passwords","Account Lockout"],"answer":"Unique Passwords","explanation":"Unique Passwords: using a different password for each account instead of reusing the same secret.","id":"S04Q08"},{"concept_id":"Social Engineering Techniques:47","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: poisoned search results?","choices":["Whaling","Search Engine Phishing","Spear Phishing","Pharming"],"answer":"Search Engine Phishing","explanation":"Search Engine Phishing: manipulating search results so fraudulent sites appear where victims are likely to click.","id":"S04Q09"},{"concept_id":"PAIR:E-wallet Phishing|Reverse Tabnabbing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between E-wallet Phishing and Reverse Tabnabbing is correct, in that order?","choices":["malicious OAuth consent / new tab alters original","targets wallet users / new tab alters original","targets wallet users / malicious OAuth consent","new tab alters original / targets wallet users"],"answer":"targets wallet users / new tab alters original","explanation":"E-wallet Phishing means targets wallet users; Reverse Tabnabbing means new tab alters original.","id":"S04Q10"},{"concept_id":"Social Engineering Techniques:25","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: observe password entry; watching a screen or keyboard from nearby or through vision-enhancing devices?","choices":["Dumpster Diving","Eavesdropping","Shoulder Surfing","Impersonation"],"answer":"Shoulder Surfing","explanation":"Shoulder Surfing: directly observing a person entering sensitive information such as a password or PIN.","id":"S04Q11"},{"concept_id":"Social Engineering Techniques:26","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with recovering phone lists, org charts, notes, printouts, or policy manuals from trash?","choices":["Impersonation","Eavesdropping","Dumpster Diving","Shoulder Surfing"],"answer":"Dumpster Diving","explanation":"Dumpster Diving: searching discarded material for useful organizational or personal information.","id":"S04Q12"},{"concept_id":"Social Engineering Techniques:35","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: fake support request; claiming troubleshooting requires the user's password or account details?","choices":["Tech Support Impersonation","Impersonation","Eavesdropping","Shoulder Surfing"],"answer":"Tech Support Impersonation","explanation":"Tech Support Impersonation: posing as technical support to obtain credentials or other sensitive information.","id":"S04Q13"},{"concept_id":"Social Engineering Techniques:22","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: SMS phishing; sending a fake bank emergency message by text?","choices":["Spear Phishing","SMiShing","Phishing","Vishing"],"answer":"SMiShing","explanation":"SMiShing: using SMS text messages to lure a victim into clicking, calling, or disclosing information.","id":"S04Q14"},{"concept_id":"Social Engineering Techniques:57","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with replicating a login page so entered credentials go to the attacker?","choices":["Website Cloning","URL Hijacking","Typosquatting","Homograph Attack"],"answer":"Website Cloning","explanation":"Website Cloning: copying enough of a legitimate site's appearance to make a fraudulent page convincing.","id":"S04Q15"},{"concept_id":"Social Engineering Concepts:8","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches pressuring a person through fear, threats, or an implied negative consequence?","choices":["Intimidation","Trust","Urgency","Familiarity"],"answer":"Intimidation","explanation":"Intimidation: pressuring a person through fear, threats, or an implied negative consequence.","id":"S04Q16"},{"concept_id":"Social Engineering Countermeasures:103","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches a collaborative clearinghouse that collects phishing reports and exposes data through an open API?","choices":["Security Awareness Training","Netcraft","OhPhish","PhishTank"],"answer":"PhishTank","explanation":"PhishTank: a collaborative clearinghouse that collects phishing reports and exposes data through an open API.","id":"S04Q17"},{"concept_id":"Social Engineering Techniques:53","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: fake fear-based warning; claiming identity theft or infection has occurred and demanding immediate action?","choices":["Hoax Letters","Pop-up Windows","Chain Letters","Scareware"],"answer":"Scareware","explanation":"Scareware: using frightening fake warnings to convince users to install software or visit malicious sites.","id":"S04Q18"},{"concept_id":"Social Engineering Techniques:24","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with obtaining information from spoken, phone, email, or messaging communications?","choices":["Shoulder Surfing","Impersonation","Dumpster Diving","Eavesdropping"],"answer":"Eavesdropping","explanation":"Eavesdropping: secretly listening to conversations or intercepting communications without authorization.","id":"S04Q19"},{"concept_id":"Impersonation on Social Networking Sites:75","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: fake duplicate account; sending new connection requests to the real person's contacts from the duplicate account?","choices":["Existing Contact List","Profile Cloning","Account Takeover","Message History"],"answer":"Profile Cloning","explanation":"Profile Cloning: creating a fake duplicate social-media account using another person's name, photo, and details.","id":"S04Q20"},{"concept_id":"PAIR:Pharming|Spimming","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Pharming and Spimming is correct, in that order?","choices":["malicious OAuth consent / instant-message spam","instant-message spam / redirects without lure","redirects without lure / malicious OAuth consent","redirects without lure / instant-message spam"],"answer":"redirects without lure / instant-message spam","explanation":"Pharming means redirects without lure; Spimming means instant-message spam.","id":"S04Q21"},{"concept_id":"Identity Theft:84","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: use victim identity with police; giving an assumed identity to law enforcement after committing an offense?","choices":["Criminal Identity Theft","Driver's License Identity Theft","Insurance Identity Theft","Financial Identity Theft"],"answer":"Criminal Identity Theft","explanation":"Criminal Identity Theft: using another person's identity when arrested or questioned to avoid criminal consequences.","id":"S04Q22"},{"concept_id":"Social Engineering Concepts:16","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with asking for account, financial, technology, or planning details after rapport exists?","choices":["Select a Target","Research the Target","Develop a Relationship","Exploit the Relationship"],"answer":"Exploit the Relationship","explanation":"Exploit the Relationship: the phase in which established trust is used to extract sensitive information or action.","id":"S04Q23"},{"concept_id":"Social Engineering Techniques:44","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with waiting until the user switches away and then replacing the tab with a fake sign-in page?","choices":["Tabnabbing","Pharming","Spear Phishing","Whaling"],"answer":"Tabnabbing","explanation":"Tabnabbing: changing the content of an inactive browser tab so it appears to be a familiar login when revisited.","id":"S04Q24"},{"concept_id":"Identity Theft:86","variant":2,"category":"Identity Theft","question":"What term best fits this clue: misuse driving identity?","choices":["Criminal Identity Theft","Driver's License Identity Theft","Insurance Identity Theft","Financial Identity Theft"],"answer":"Driver's License Identity Theft","explanation":"Driver's License Identity Theft: using another person's driver's license identity for traffic-related offenses.","id":"S04Q25"},{"concept_id":"PAIR:Chain Letters|Instant Chat Messenger Attack","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Chain Letters and Instant Chat Messenger Attack is correct, in that order?","choices":["forward for reward / bulk unsolicited email","harvest details in chat / forward for reward","bulk unsolicited email / harvest details in chat","forward for reward / harvest details in chat"],"answer":"forward for reward / harvest details in chat","explanation":"Chain Letters means forward for reward; Instant Chat Messenger Attack means harvest details in chat.","id":"S04Q26"},{"concept_id":"Impersonation on Social Networking Sites:76","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: hijack the real account?","choices":["Message History","Account Takeover","Profile Cloning","Existing Contact List"],"answer":"Account Takeover","explanation":"Account Takeover: compromising the real social-media account rather than creating a copy.","id":"S04Q27"},{"concept_id":"Social Engineering Concepts:5","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches exploiting the tendency to comply with people perceived as having legitimate power?","choices":["Commitment and Consistency","Authority","Social Proof","Reciprocity"],"answer":"Authority","explanation":"Authority: exploiting the tendency to comply with people perceived as having legitimate power.","id":"S04Q28"},{"concept_id":"Social Engineering Techniques:52","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: bulk unsolicited email?","choices":["Pop-up Windows","Spam Email","Hoax Letters","Chain Letters"],"answer":"Spam Email","explanation":"Spam Email: sending unsolicited bulk email that may collect information or carry concealed malware.","id":"S04Q29"},{"concept_id":"Identity Theft:93","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: unfamiliar charges; an observable warning sign that financial identity information may have been abused?","choices":["Unexpected Medical Record Changes","Identity Theft","Criminal Identity Theft","Unauthorized Account Charges"],"answer":"Unauthorized Account Charges","explanation":"Unauthorized Account Charges: transactions on a credit or bank account that the real owner does not recognize.","id":"S04Q30"},{"concept_id":"Social Engineering Countermeasures:106","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with screening suspicious media for signs that it was artificially generated?","choices":["Security Policy Dissemination","AI/ML Deepfake Detection","Security Awareness Training","Digital Watermarking"],"answer":"AI/ML Deepfake Detection","explanation":"AI/ML Deepfake Detection: using automated analysis to find unnatural facial movement, lighting, lip synchronization, or other synthetic artifacts.","id":"S04Q31"},{"concept_id":"Insider Threats:73","variant":0,"category":"Insider Threats","question":"Which concept best matches a company weakness created when separate units do not coordinate security effectively?","choices":["Unregulated Access to Information","Insufficient Security Training","Disgruntled Employee","Siloed Organizational Units"],"answer":"Siloed Organizational Units","explanation":"Siloed Organizational Units: a company weakness created when separate units do not coordinate security effectively.","id":"S04Q32"},{"concept_id":"Social Engineering Techniques:54","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with cloning an executive's face or voice for impersonation?","choices":["Deepfake","Phishing","Spear Phishing","Whaling"],"answer":"Deepfake","explanation":"Deepfake: AI-generated audio or video that convincingly imitates a real person.","id":"S04Q33"},{"concept_id":"Social Engineering Techniques:33","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with providing ongoing help even after desired information has been obtained?","choices":["Marketing","Support","Phishing","Sabotage"],"answer":"Support","explanation":"Support: continuing to assist the victim after contact so the attacker remains credible and unidentified.","id":"S04Q34"},{"concept_id":"PAIR:Separate-channel Verification|Breach Exposure Monitoring","variant":0,"category":"Impersonation on Social Networking Sites","question":"Which distinction between Separate-channel Verification and Breach Exposure Monitoring is correct, in that order?","choices":["verify outside the suspicious channel / report the fake copy","watch for exposed credentials / verify outside the suspicious channel","verify outside the suspicious channel / watch for exposed credentials","report the fake copy / watch for exposed credentials"],"answer":"verify outside the suspicious channel / watch for exposed credentials","explanation":"Separate-channel Verification means verify outside the suspicious channel; Breach Exposure Monitoring means watch for exposed credentials.","id":"S04Q35"},{"concept_id":"Insider Threats:72","variant":1,"category":"Insider Threats","question":"Which option is most directly associated with making internal personnel easier to exploit through phishing, impersonation, or pretexting?","choices":["Unregulated Access to Information","Insufficient Security Training","Siloed Organizational Units","Disgruntled Employee"],"answer":"Insufficient Security Training","explanation":"Insufficient Security Training: an organizational weakness that leaves employees less able to recognize manipulation.","id":"S04Q36"},{"concept_id":"Social Engineering Countermeasures:96","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: communicate security rules?","choices":["Security Awareness Training","Security Policy Dissemination","Account Lockout","Policy Acknowledgement"],"answer":"Security Policy Dissemination","explanation":"Security Policy Dissemination: making sure employees receive and understand the organization's security rules.","id":"S04Q37"},{"concept_id":"Social Engineering Techniques:67","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches abusing QR-code login by presenting a cloned login QR code to hijack a session?","choices":["QRLJacking","Repackaged App","Phishing","Fake Security Application"],"answer":"QRLJacking","explanation":"QRLJacking: abusing QR-code login by presenting a cloned login QR code to hijack a session.","id":"S04Q38"},{"concept_id":"Identity Theft:92","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: purchase stolen PII; acquiring identity data that another criminal has already stolen?","choices":["Identity Theft","Social Media Mining","Dark Web Data Trading","Mail Theft and Rerouting"],"answer":"Dark Web Data Trading","explanation":"Dark Web Data Trading: buying stolen credentials, banking information, or personal identifiers from underground markets.","id":"S04Q39"},{"concept_id":"Social Engineering Techniques:31","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches damaging or appearing to damage a system so the victim needs assistance?","choices":["Sabotage","Marketing","Phishing","Support"],"answer":"Sabotage","explanation":"Sabotage: damaging or appearing to damage a system so the victim needs assistance.","id":"S04Q40"},{"concept_id":"Identity Theft:90","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: steal or redirect mail; causing statements and official documents to stop reaching the victim?","choices":["Mail Theft and Rerouting","Identity Theft","Social Media Mining","Dark Web Data Trading"],"answer":"Mail Theft and Rerouting","explanation":"Mail Theft and Rerouting: stealing or redirecting physical mail to obtain financial or administrative information.","id":"S04Q41"},{"concept_id":"Social Engineering Techniques:64","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches compromising a website the intended victims already visit regularly?","choices":["URL Hijacking","Website Cloning","Watering Hole Attack","Typosquatting"],"answer":"Watering Hole Attack","explanation":"Watering Hole Attack: compromising a website the intended victims already visit regularly.","id":"S04Q42"},{"concept_id":"Social Engineering Concepts:4","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: others already complied; claiming that coworkers have already provided the same information?","choices":["Reciprocity","Commitment and Consistency","Social Proof","Authority"],"answer":"Social Proof","explanation":"Social Proof: using the behavior of other people as evidence that an action is acceptable.","id":"S04Q43"},{"concept_id":"PAIR:URL Hijacking|Homograph Attack","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between URL Hijacking and Homograph Attack is correct, in that order?","choices":["misleading lookalike URL / lookalike Unicode characters","lookalike Unicode characters / misleading lookalike URL","compromise frequented site / lookalike Unicode characters","misleading lookalike URL / compromise frequented site"],"answer":"misleading lookalike URL / lookalike Unicode characters","explanation":"URL Hijacking means misleading lookalike URL; Homograph Attack means lookalike Unicode characters.","id":"S04Q44"},{"concept_id":"Social Engineering Techniques:38","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches presenting an attractive offer that causes the victim to follow a link or download a file?","choices":["Shoulder Surfing","Impersonation","Eavesdropping","Bait and Switching"],"answer":"Bait and Switching","explanation":"Bait and Switching: presenting an attractive offer that causes the victim to follow a link or download a file.","id":"S04Q45"},{"concept_id":"Social Engineering Techniques:19","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches targeting a specific person or small group with personalized phishing content?","choices":["Spimming","Whaling","Spear Phishing","Pharming"],"answer":"Spear Phishing","explanation":"Spear Phishing: targeting a specific person or small group with personalized phishing content.","id":"S04Q46"},{"concept_id":"Social Engineering Concepts:14","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: choose the victim?","choices":["Research the Target","Select a Target","Develop a Relationship","Exploit the Relationship"],"answer":"Select a Target","explanation":"Select a Target: the phase in which the attacker chooses the person most likely to provide useful information.","id":"S04Q47"},{"concept_id":"Social Engineering Techniques:60","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: granular URL requests?","choices":["WinHTTrack","wget","Phishing","cURL"],"answer":"cURL","explanation":"cURL: a command-line URL transfer tool suited to individual pages, headers, or API responses.","id":"S04Q48"},{"concept_id":"PAIR:Clone Phishing|Consent Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Clone Phishing and Consent Phishing is correct, in that order?","choices":["copy legitimate message / inactive tab changes","malicious OAuth consent / copy legitimate message","copy legitimate message / malicious OAuth consent","inactive tab changes / malicious OAuth consent"],"answer":"copy legitimate message / malicious OAuth consent","explanation":"Clone Phishing means copy legitimate message; Consent Phishing means malicious OAuth consent.","id":"S04Q49"},{"concept_id":"Social Engineering Concepts:10","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with using names, routines, or shared context to feel familiar?","choices":["Urgency","Intimidation","Trust","Familiarity"],"answer":"Familiarity","explanation":"Familiarity: exploiting recognition or a sense that the requester is known to the target.","id":"S04Q50"}],[{"concept_id":"Social Engineering Techniques:60","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches a command-line URL transfer tool suited to individual pages, headers, or API responses?","choices":["Phishing","WinHTTrack","cURL","wget"],"answer":"cURL","explanation":"cURL: a command-line URL transfer tool suited to individual pages, headers, or API responses.","id":"S05Q01"},{"concept_id":"Identity Theft:92","variant":2,"category":"Identity Theft","question":"What term best fits this clue: purchase stolen PII?","choices":["Dark Web Data Trading","Mail Theft and Rerouting","Identity Theft","Social Media Mining"],"answer":"Dark Web Data Trading","explanation":"Dark Web Data Trading: buying stolen credentials, banking information, or personal identifiers from underground markets.","id":"S05Q02"},{"concept_id":"PAIR:Unregulated Access to Information|Insufficient Security Training","variant":0,"category":"Insider Threats","question":"Which distinction between Unregulated Access to Information and Insufficient Security Training is correct, in that order?","choices":["excess internal access / dissatisfied internal target","poor employee preparation / excess internal access","dissatisfied internal target / poor employee preparation","excess internal access / poor employee preparation"],"answer":"excess internal access / poor employee preparation","explanation":"Unregulated Access to Information means excess internal access; Insufficient Security Training means poor employee preparation.","id":"S05Q03"},{"concept_id":"Social Engineering Concepts:11","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with leveraging an established relationship so a request is not questioned?","choices":["Intimidation","Familiarity","Trust","Urgency"],"answer":"Trust","explanation":"Trust: exploiting confidence that a person, source, or relationship is reliable.","id":"S05Q04"},{"concept_id":"Social Engineering Techniques:62","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with the broader category that can include typosquatting and homograph tricks?","choices":["URL Hijacking","Website Cloning","Typosquatting","Homograph Attack"],"answer":"URL Hijacking","explanation":"URL Hijacking: using a misleading URL that resembles a legitimate destination.","id":"S05Q05"},{"concept_id":"Identity Theft:89","variant":0,"category":"Identity Theft","question":"Which concept best matches using a victim's tax identifier to file a fraudulent return or claim a refund?","choices":["Driver's License Identity Theft","Criminal Identity Theft","Tax Identity Theft","Financial Identity Theft"],"answer":"Tax Identity Theft","explanation":"Tax Identity Theft: using a victim's tax identifier to file a fraudulent return or claim a refund.","id":"S05Q06"},{"concept_id":"Impersonation on Social Networking Sites:76","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: hijack the real account; retaining the victim's existing contacts, history, and established account reputation?","choices":["Profile Cloning","Message History","Existing Contact List","Account Takeover"],"answer":"Account Takeover","explanation":"Account Takeover: compromising the real social-media account rather than creating a copy.","id":"S05Q07"},{"concept_id":"PAIR:Urgency|Greed","variant":0,"category":"Social Engineering Concepts","question":"Which distinction between Urgency and Greed is correct, in that order?","choices":["relies on confidence / promise of gain","promise of gain / act immediately","act immediately / promise of gain","act immediately / relies on confidence"],"answer":"act immediately / promise of gain","explanation":"Urgency means act immediately; Greed means promise of gain.","id":"S05Q08"},{"concept_id":"Identity Theft:87","variant":0,"category":"Identity Theft","question":"Which concept best matches using another person's insurance information to obtain covered treatment or benefits?","choices":["Criminal Identity Theft","Financial Identity Theft","Insurance Identity Theft","Driver's License Identity Theft"],"answer":"Insurance Identity Theft","explanation":"Insurance Identity Theft: using another person's insurance information to obtain covered treatment or benefits.","id":"S05Q09"},{"concept_id":"Social Engineering Techniques:40","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches redirecting traffic to a fraudulent website through DNS cache poisoning or host-file modification?","choices":["Pharming","Spimming","Spear Phishing","Whaling"],"answer":"Pharming","explanation":"Pharming: redirecting traffic to a fraudulent website through DNS cache poisoning or host-file modification.","id":"S05Q10"},{"concept_id":"Social Engineering Techniques:39","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: tempting lure left to find; placing a USB labeled with interesting information where employees will find it?","choices":["Baiting","Phishing","Whaling","Spear Phishing"],"answer":"Baiting","explanation":"Baiting: leaving a tempting object or resource for the victim to discover and interact with.","id":"S05Q11"},{"concept_id":"PAIR:Spear Phishing|Clone Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Spear Phishing and Clone Phishing is correct, in that order?","choices":["targeted personalized phishing / copy legitimate message","targets executives / copy legitimate message","targeted personalized phishing / targets executives","copy legitimate message / targeted personalized phishing"],"answer":"targeted personalized phishing / copy legitimate message","explanation":"Spear Phishing means targeted personalized phishing; Clone Phishing means copy legitimate message.","id":"S05Q12"},{"concept_id":"Identity Theft:94","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with a warning sign that another person may be using the victim's healthcare identity?","choices":["Unauthorized Account Charges","Unexpected Medical Record Changes","Criminal Identity Theft","Identity Theft"],"answer":"Unexpected Medical Record Changes","explanation":"Unexpected Medical Record Changes: new diagnoses or treatment records that the real patient never received.","id":"S05Q13"},{"concept_id":"Insider Threats:70","variant":3,"category":"Insider Threats","question":"Which concept best combines these ideas: dissatisfied internal target; being preferred during target selection because dissatisfaction may lower resistance?","choices":["Disgruntled Employee","Siloed Organizational Units","Unregulated Access to Information","Insufficient Security Training"],"answer":"Disgruntled Employee","explanation":"Disgruntled Employee: an internal person specifically identified in the course as easier for an attacker to manipulate.","id":"S05Q14"},{"concept_id":"Social Engineering Techniques:66","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: fake Wi-Fi login page?","choices":["Spear Phishing","Phishing","Rogue Access Point","Captive Portal Phishing"],"answer":"Captive Portal Phishing","explanation":"Captive Portal Phishing: presenting a fake network-login page that collects credentials from connected users.","id":"S05Q15"},{"concept_id":"Social Engineering Countermeasures:101","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches locking or shutting down a computer before leaving it unattended?","choices":["Policy Acknowledgement","Security Awareness Training","Security Policy Dissemination","Lock Screen When Away"],"answer":"Lock Screen When Away","explanation":"Lock Screen When Away: locking or shutting down a computer before leaving it unattended.","id":"S05Q16"},{"concept_id":"Social Engineering Techniques:55","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using a compromised or spoofed trusted identity to send messages to that person's contacts?","choices":["Whaling","Spear Phishing","Phishing","Contact Spamming"],"answer":"Contact Spamming","explanation":"Contact Spamming: using a compromised or spoofed trusted identity to send messages to that person's contacts.","id":"S05Q17"},{"concept_id":"Social Engineering Concepts:6","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: rapport and similarity; finding common ground so the target is more willing to cooperate?","choices":["Liking","Commitment and Consistency","Social Proof","Reciprocity"],"answer":"Liking","explanation":"Liking: increasing compliance by building rapport, similarity, or friendliness.","id":"S05Q18"},{"concept_id":"Social Engineering Techniques:52","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches sending unsolicited bulk email that may collect information or carry concealed malware?","choices":["Chain Letters","Spam Email","Hoax Letters","Pop-up Windows"],"answer":"Spam Email","explanation":"Spam Email: sending unsolicited bulk email that may collect information or carry concealed malware.","id":"S05Q19"},{"concept_id":"Social Engineering Concepts:10","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: seems known?","choices":["Intimidation","Trust","Familiarity","Urgency"],"answer":"Familiarity","explanation":"Familiarity: exploiting recognition or a sense that the requester is known to the target.","id":"S05Q20"},{"concept_id":"Social Engineering Techniques:21","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: voice phishing; calling a help desk or employee while pretending to be support staff?","choices":["Vishing","Spear Phishing","SMiShing","Phishing"],"answer":"Vishing","explanation":"Vishing: using voice calls to obtain information or manipulate a victim.","id":"S05Q21"},{"concept_id":"Social Engineering Techniques:43","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: targets wallet users; sending a fraudulent message that appears to come from a payment-wallet service?","choices":["Whaling","Pharming","E-wallet Phishing","Spear Phishing"],"answer":"E-wallet Phishing","explanation":"E-wallet Phishing: impersonating an electronic-wallet provider to steal wallet-related information.","id":"S05Q22"},{"concept_id":"PAIR:Hoax Letters|Chain Letters","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Hoax Letters and Chain Letters is correct, in that order?","choices":["harvest details in chat / forward for reward","false threat warning / harvest details in chat","forward for reward / false threat warning","false threat warning / forward for reward"],"answer":"false threat warning / forward for reward","explanation":"Hoax Letters means false threat warning; Chain Letters means forward for reward.","id":"S05Q23"},{"concept_id":"Social Engineering Techniques:29","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with slipping through a controlled door behind a badge holder?","choices":["Spear Phishing","Tailgating","Phishing","Piggybacking"],"answer":"Tailgating","explanation":"Tailgating: entering a secure area by closely following an authorized person without their consent or knowledge.","id":"S05Q24"},{"concept_id":"PAIR:Typosquatting|Homograph Attack","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Typosquatting and Homograph Attack is correct, in that order?","choices":["copy convincing web page / lookalike Unicode characters","lookalike Unicode characters / misspelled domain","misspelled domain / copy convincing web page","misspelled domain / lookalike Unicode characters"],"answer":"misspelled domain / lookalike Unicode characters","explanation":"Typosquatting means misspelled domain; Homograph Attack means lookalike Unicode characters.","id":"S05Q25"},{"concept_id":"Social Engineering Techniques:51","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: harvest details in chat?","choices":["Pop-up Windows","Instant Chat Messenger Attack","Chain Letters","Hoax Letters"],"answer":"Instant Chat Messenger Attack","explanation":"Instant Chat Messenger Attack: using online chat to collect personal information that can help compromise accounts.","id":"S05Q26"},{"concept_id":"Social Engineering Countermeasures:104","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: phishing awareness simulation?","choices":["Security Awareness Training","Netcraft","PhishTank","OhPhish"],"answer":"OhPhish","explanation":"OhPhish: a phishing-simulation and awareness platform that can run email, attachment, vishing, and smishing exercises.","id":"S05Q27"},{"concept_id":"Insider Threats:73","variant":2,"category":"Insider Threats","question":"What term best fits this clue: security gaps between units?","choices":["Siloed Organizational Units","Unregulated Access to Information","Insufficient Security Training","Disgruntled Employee"],"answer":"Siloed Organizational Units","explanation":"Siloed Organizational Units: a company weakness created when separate units do not coordinate security effectively.","id":"S05Q28"},{"concept_id":"Impersonation on Social Networking Sites:77","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: contacts already connected?","choices":["Message History","Existing Contact List","Account Takeover","Profile Cloning"],"answer":"Existing Contact List","explanation":"Existing Contact List: the social-network advantage that lets a hijacked real account message trusted people immediately.","id":"S05Q29"},{"concept_id":"Social Engineering Techniques:69","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: malware disguised as security app?","choices":["QRLJacking","Repackaged App","Phishing","Fake Security Application"],"answer":"Fake Security Application","explanation":"Fake Security Application: tricking a victim into installing a malicious app presented as required security software.","id":"S05Q30"},{"concept_id":"Identity Theft:86","variant":0,"category":"Identity Theft","question":"Which concept best matches using another person's driver's license identity for traffic-related offenses?","choices":["Insurance Identity Theft","Financial Identity Theft","Driver's License Identity Theft","Criminal Identity Theft"],"answer":"Driver's License Identity Theft","explanation":"Driver's License Identity Theft: using another person's driver's license identity for traffic-related offenses.","id":"S05Q31"},{"concept_id":"Social Engineering Techniques:36","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches offering a service or benefit in direct exchange for information or access?","choices":["Shoulder Surfing","Quid Pro Quo","Eavesdropping","Impersonation"],"answer":"Quid Pro Quo","explanation":"Quid Pro Quo: offering a service or benefit in direct exchange for information or access.","id":"S05Q32"},{"concept_id":"Social Engineering Techniques:48","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with displaying a fraudulent security warning claiming the computer is blocked?","choices":["Pop-up Windows","Chain Letters","Instant Chat Messenger Attack","Hoax Letters"],"answer":"Pop-up Windows","explanation":"Pop-up Windows: using fake alert windows to pressure users into calling or entering information.","id":"S05Q33"},{"concept_id":"Impersonation on Social Networking Sites:80","variant":1,"category":"Impersonation on Social Networking Sites","question":"Which option is most directly associated with hardening social accounts against phishing, breach, or cracked-password reuse?","choices":["Duplicate Profile Reporting","MFA on Social Accounts","Separate-channel Verification","Breach Exposure Monitoring"],"answer":"MFA on Social Accounts","explanation":"MFA on Social Accounts: adding a second authentication factor to reduce the chance that stolen credentials lead to takeover.","id":"S05Q34"},{"concept_id":"Social Engineering Techniques:38","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: attractive offer prompts action?","choices":["Shoulder Surfing","Bait and Switching","Impersonation","Eavesdropping"],"answer":"Bait and Switching","explanation":"Bait and Switching: presenting an attractive offer that causes the victim to follow a link or download a file.","id":"S05Q35"},{"concept_id":"Social Engineering Countermeasures:106","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches using automated analysis to find unnatural facial movement, lighting, lip synchronization, or other synthetic artifacts?","choices":["Security Awareness Training","AI/ML Deepfake Detection","Security Policy Dissemination","Digital Watermarking"],"answer":"AI/ML Deepfake Detection","explanation":"AI/ML Deepfake Detection: using automated analysis to find unnatural facial movement, lighting, lip synchronization, or other synthetic artifacts.","id":"S05Q36"},{"concept_id":"Social Engineering Techniques:31","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with creating the problem that motivates the target to call the attacker?","choices":["Marketing","Phishing","Support","Sabotage"],"answer":"Sabotage","explanation":"Sabotage: damaging or appearing to damage a system so the victim needs assistance.","id":"S05Q37"},{"concept_id":"Social Engineering Countermeasures:98","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with limiting repeated guessing against user accounts?","choices":["Security Awareness Training","Security Policy Dissemination","Unique Passwords","Account Lockout"],"answer":"Account Lockout","explanation":"Account Lockout: blocking an account after a defined number of failed authentication attempts.","id":"S05Q38"},{"concept_id":"Social Engineering Techniques:65","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: fake trusted Wi-Fi?","choices":["Rogue Access Point","Spear Phishing","Phishing","Captive Portal Phishing"],"answer":"Rogue Access Point","explanation":"Rogue Access Point: creating a fake wireless network that imitates a trusted SSID.","id":"S05Q39"},{"concept_id":"Social Engineering Concepts:1","variant":3,"category":"Social Engineering Concepts","question":"Which concept best combines these ideas: believable backstory; using researched names, departments, projects, or events to make a request credible?","choices":["Reciprocity","Social engineering","Pretexting","Constant Vigilance"],"answer":"Pretexting","explanation":"Pretexting: creating a believable backstory or excuse that explains why contact is being made.","id":"S05Q40"},{"concept_id":"Social Engineering Concepts:4","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: others already complied?","choices":["Authority","Reciprocity","Social Proof","Commitment and Consistency"],"answer":"Social Proof","explanation":"Social Proof: using the behavior of other people as evidence that an action is acceptable.","id":"S05Q41"},{"concept_id":"Social Engineering Techniques:26","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches searching discarded material for useful organizational or personal information?","choices":["Impersonation","Shoulder Surfing","Eavesdropping","Dumpster Diving"],"answer":"Dumpster Diving","explanation":"Dumpster Diving: searching discarded material for useful organizational or personal information.","id":"S05Q42"},{"concept_id":"PAIR:Spimming|Consent Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Spimming and Consent Phishing is correct, in that order?","choices":["instant-message spam / inactive tab changes","instant-message spam / malicious OAuth consent","inactive tab changes / malicious OAuth consent","malicious OAuth consent / instant-message spam"],"answer":"instant-message spam / malicious OAuth consent","explanation":"Spimming means instant-message spam; Consent Phishing means malicious OAuth consent.","id":"S05Q43"},{"concept_id":"Social Engineering Techniques:45","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: new tab alters original?","choices":["Whaling","Pharming","Spear Phishing","Reverse Tabnabbing"],"answer":"Reverse Tabnabbing","explanation":"Reverse Tabnabbing: using a newly opened malicious page to alter the content of the original tab.","id":"S05Q44"},{"concept_id":"PAIR:Diversion Theft|Elicitation","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Diversion Theft and Elicitation is correct, in that order?","choices":["claims absent approval / extract through conversation","redirect a delivery / claims absent approval","redirect a delivery / extract through conversation","extract through conversation / redirect a delivery"],"answer":"redirect a delivery / extract through conversation","explanation":"Diversion Theft means redirect a delivery; Elicitation means extract through conversation.","id":"S05Q45"},{"concept_id":"Social Engineering Countermeasures:96","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: communicate security rules; educating staff on the policies they are expected to follow?","choices":["Account Lockout","Security Awareness Training","Security Policy Dissemination","Policy Acknowledgement"],"answer":"Security Policy Dissemination","explanation":"Security Policy Dissemination: making sure employees receive and understand the organization's security rules.","id":"S05Q46"},{"concept_id":"Social Engineering Concepts:16","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: use trust to extract?","choices":["Develop a Relationship","Exploit the Relationship","Research the Target","Select a Target"],"answer":"Exploit the Relationship","explanation":"Exploit the Relationship: the phase in which established trust is used to extract sensitive information or action.","id":"S05Q47"},{"concept_id":"Impersonation on Social Networking Sites:81","variant":2,"category":"Impersonation on Social Networking Sites","question":"What term best fits this clue: verify outside the suspicious channel?","choices":["Breach Exposure Monitoring","Duplicate Profile Reporting","MFA on Social Accounts","Separate-channel Verification"],"answer":"Separate-channel Verification","explanation":"Separate-channel Verification: confirming an unusual request using a communication path different from the suspicious message.","id":"S05Q48"},{"concept_id":"Social Engineering Concepts:15","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches the phase focused on building rapport and credibility with the selected person?","choices":["Exploit the Relationship","Select a Target","Research the Target","Develop a Relationship"],"answer":"Develop a Relationship","explanation":"Develop a Relationship: the phase focused on building rapport and credibility with the selected person.","id":"S05Q49"},{"concept_id":"Social Engineering Techniques:23","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: pretend to be authorized; posing as an employee, vendor, repair technician, executive, or trusted authority?","choices":["Dumpster Diving","Impersonation","Eavesdropping","Shoulder Surfing"],"answer":"Impersonation","explanation":"Impersonation: pretending to be a legitimate or authorized person to gain information or access.","id":"S05Q50"}],[{"concept_id":"Social Engineering Techniques:32","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with placing a business card or contact number where the victim will use it?","choices":["Marketing","Support","Sabotage","Phishing"],"answer":"Marketing","explanation":"Marketing: making the attacker easy to contact by advertising support details to the target.","id":"S06Q01"},{"concept_id":"Social Engineering Concepts:2","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches making someone feel obliged to return a favor or kindness?","choices":["Social Proof","Authority","Commitment and Consistency","Reciprocity"],"answer":"Reciprocity","explanation":"Reciprocity: making someone feel obliged to return a favor or kindness.","id":"S06Q02"},{"concept_id":"Social Engineering Countermeasures:102","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: browser phishing protection; protecting users during web browsing by identifying known or suspected fraudulent pages?","choices":["PhishTank","Netcraft","Security Awareness Training","OhPhish"],"answer":"Netcraft","explanation":"Netcraft: a browser extension that blocks or warns about suspected phishing sites.","id":"S06Q03"},{"concept_id":"Identity Theft:86","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: misuse driving identity; causing unauthorized traffic violations to appear under the victim's name?","choices":["Financial Identity Theft","Insurance Identity Theft","Driver's License Identity Theft","Criminal Identity Theft"],"answer":"Driver's License Identity Theft","explanation":"Driver's License Identity Theft: using another person's driver's license identity for traffic-related offenses.","id":"S06Q04"},{"concept_id":"Social Engineering Techniques:18","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches sending deceptive electronic messages that appear legitimate to obtain information or drive malicious action?","choices":["Vishing","Spear Phishing","Phishing","SMiShing"],"answer":"Phishing","explanation":"Phishing: sending deceptive electronic messages that appear legitimate to obtain information or drive malicious action.","id":"S06Q05"},{"concept_id":"Social Engineering Techniques:56","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches using a document or archive that contains executable content or malicious macros?","choices":["Whaling","Phishing","Malicious Attachment","Spear Phishing"],"answer":"Malicious Attachment","explanation":"Malicious Attachment: using a document or archive that contains executable content or malicious macros.","id":"S06Q06"},{"concept_id":"PAIR:E-wallet Phishing|Search Engine Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between E-wallet Phishing and Search Engine Phishing is correct, in that order?","choices":["inactive tab changes / poisoned search results","targets wallet users / poisoned search results","poisoned search results / targets wallet users","targets wallet users / inactive tab changes"],"answer":"targets wallet users / poisoned search results","explanation":"E-wallet Phishing means targets wallet users; Search Engine Phishing means poisoned search results.","id":"S06Q07"},{"concept_id":"Social Engineering Techniques:46","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: malicious OAuth consent?","choices":["Consent Phishing","Whaling","Pharming","Spear Phishing"],"answer":"Consent Phishing","explanation":"Consent Phishing: abusing OAuth authorization so a victim grants a malicious application account permissions.","id":"S06Q08"},{"concept_id":"Social Engineering Techniques:29","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: entry without consent; slipping through a controlled door behind a badge holder?","choices":["Phishing","Spear Phishing","Piggybacking","Tailgating"],"answer":"Tailgating","explanation":"Tailgating: entering a secure area by closely following an authorized person without their consent or knowledge.","id":"S06Q09"},{"concept_id":"Social Engineering Countermeasures:97","variant":2,"category":"Social Engineering Countermeasures","question":"What term best fits this clue: employees confirm understanding?","choices":["Security Policy Dissemination","Account Lockout","Security Awareness Training","Policy Acknowledgement"],"answer":"Policy Acknowledgement","explanation":"Policy Acknowledgement: requiring employees to confirm that they understand security policies.","id":"S06Q10"},{"concept_id":"Social Engineering Techniques:23","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: pretend to be authorized?","choices":["Impersonation","Shoulder Surfing","Eavesdropping","Dumpster Diving"],"answer":"Impersonation","explanation":"Impersonation: pretending to be a legitimate or authorized person to gain information or access.","id":"S06Q11"},{"concept_id":"Social Engineering Techniques:64","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with researching a target group's browsing habits and infecting a trusted site they frequent?","choices":["URL Hijacking","Watering Hole Attack","Website Cloning","Typosquatting"],"answer":"Watering Hole Attack","explanation":"Watering Hole Attack: compromising a website the intended victims already visit regularly.","id":"S06Q12"},{"concept_id":"PAIR:Eavesdropping|Reverse Social Engineering","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Eavesdropping and Reverse Social Engineering is correct, in that order?","choices":["pretend to be authorized / victim seeks attacker","victim seeks attacker / unauthorized listening","unauthorized listening / pretend to be authorized","unauthorized listening / victim seeks attacker"],"answer":"unauthorized listening / victim seeks attacker","explanation":"Eavesdropping means unauthorized listening; Reverse Social Engineering means victim seeks attacker.","id":"S06Q13"},{"concept_id":"PAIR:Spimming|Reverse Tabnabbing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Spimming and Reverse Tabnabbing is correct, in that order?","choices":["new tab alters original / instant-message spam","instant-message spam / new tab alters original","malicious OAuth consent / new tab alters original","instant-message spam / malicious OAuth consent"],"answer":"instant-message spam / new tab alters original","explanation":"Spimming means instant-message spam; Reverse Tabnabbing means new tab alters original.","id":"S06Q14"},{"concept_id":"Impersonation on Social Networking Sites:77","variant":3,"category":"Impersonation on Social Networking Sites","question":"Which concept best combines these ideas: contacts already connected; eliminating the need to send new friend requests after an account takeover?","choices":["Profile Cloning","Account Takeover","Message History","Existing Contact List"],"answer":"Existing Contact List","explanation":"Existing Contact List: the social-network advantage that lets a hijacked real account message trusted people immediately.","id":"S06Q15"},{"concept_id":"Social Engineering Countermeasures:98","variant":0,"category":"Social Engineering Countermeasures","question":"Which concept best matches blocking an account after a defined number of failed authentication attempts?","choices":["Account Lockout","Unique Passwords","Security Awareness Training","Security Policy Dissemination"],"answer":"Account Lockout","explanation":"Account Lockout: blocking an account after a defined number of failed authentication attempts.","id":"S06Q16"},{"concept_id":"Social Engineering Techniques:25","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with watching a screen or keyboard from nearby or through vision-enhancing devices?","choices":["Dumpster Diving","Eavesdropping","Impersonation","Shoulder Surfing"],"answer":"Shoulder Surfing","explanation":"Shoulder Surfing: directly observing a person entering sensitive information such as a password or PIN.","id":"S06Q17"},{"concept_id":"Social Engineering Techniques:51","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with asking for date of birth, maiden name, or similar recovery information in chat?","choices":["Pop-up Windows","Hoax Letters","Chain Letters","Instant Chat Messenger Attack"],"answer":"Instant Chat Messenger Attack","explanation":"Instant Chat Messenger Attack: using online chat to collect personal information that can help compromise accounts.","id":"S06Q18"},{"concept_id":"Social Engineering Techniques:50","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: forward for reward; offering a gift if the message is sent to a fixed number of people?","choices":["Pop-up Windows","Hoax Letters","Chain Letters","Instant Chat Messenger Attack"],"answer":"Chain Letters","explanation":"Chain Letters: encouraging recipients to forward a message to others by promising a benefit or invoking superstition.","id":"S06Q19"},{"concept_id":"Social Engineering Techniques:58","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using a GUI to clone or mirror website content?","choices":["cURL","wget","WinHTTrack","Phishing"],"answer":"WinHTTrack","explanation":"WinHTTrack: a graphical tool that can mirror an entire website for offline use.","id":"S06Q20"},{"concept_id":"Social Engineering Concepts:12","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: promise of gain?","choices":["Intimidation","Familiarity","Urgency","Greed"],"answer":"Greed","explanation":"Greed: using the promise of financial gain, rewards, or valuable benefits to drive action.","id":"S06Q21"},{"concept_id":"Impersonation on Social Networking Sites:81","variant":1,"category":"Impersonation on Social Networking Sites","question":"Which option is most directly associated with calling the person directly before sending money, codes, or sensitive information?","choices":["Separate-channel Verification","Duplicate Profile Reporting","MFA on Social Accounts","Breach Exposure Monitoring"],"answer":"Separate-channel Verification","explanation":"Separate-channel Verification: confirming an unusual request using a communication path different from the suspicious message.","id":"S06Q22"},{"concept_id":"Social Engineering Techniques:34","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with saying a manager who is traveling authorized release of information?","choices":["Eavesdropping","Third-party Authorization","Impersonation","Shoulder Surfing"],"answer":"Third-party Authorization","explanation":"Third-party Authorization: claiming that an absent authority figure approved the request.","id":"S06Q23"},{"concept_id":"Identity Theft:85","variant":2,"category":"Identity Theft","question":"What term best fits this clue: steal for financial transactions?","choices":["Driver's License Identity Theft","Insurance Identity Theft","Financial Identity Theft","Criminal Identity Theft"],"answer":"Financial Identity Theft","explanation":"Financial Identity Theft: using stolen bank or credit information for purchases, withdrawals, or new accounts.","id":"S06Q24"},{"concept_id":"Social Engineering Techniques:20","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: targets executives?","choices":["Spear Phishing","Pharming","Spimming","Whaling"],"answer":"Whaling","explanation":"Whaling: phishing aimed specifically at high-profile executives or other high-value people.","id":"S06Q25"},{"concept_id":"Social Engineering Concepts:0","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches manipulating people into revealing information or taking actions they normally would not take?","choices":["Social engineering","Reciprocity","Constant Vigilance","Pretexting"],"answer":"Social engineering","explanation":"Social engineering: manipulating people into revealing information or taking actions they normally would not take.","id":"S06Q26"},{"concept_id":"Social Engineering Concepts:7","variant":0,"category":"Social Engineering Concepts","question":"Which concept best matches making something seem more valuable because availability is limited?","choices":["Scarcity","Social Proof","Commitment and Consistency","Reciprocity"],"answer":"Scarcity","explanation":"Scarcity: making something seem more valuable because availability is limited.","id":"S06Q27"},{"concept_id":"Social Engineering Techniques:30","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with tricking delivery personnel into sending goods somewhere else?","choices":["Eavesdropping","Diversion Theft","Impersonation","Shoulder Surfing"],"answer":"Diversion Theft","explanation":"Diversion Theft: redirecting a legitimate delivery or consignment to an unintended location through deception.","id":"S06Q28"},{"concept_id":"Social Engineering Concepts:9","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with demanding action now before an account closes or a deadline passes?","choices":["Trust","Intimidation","Urgency","Familiarity"],"answer":"Urgency","explanation":"Urgency: reducing careful verification by making the target believe immediate action is required.","id":"S06Q29"},{"concept_id":"Social Engineering Countermeasures:105","variant":1,"category":"Social Engineering Countermeasures","question":"Which option is most directly associated with making trusted video easier to distinguish from manipulated content?","choices":["AI/ML Deepfake Detection","Digital Watermarking","Security Awareness Training","Security Policy Dissemination"],"answer":"Digital Watermarking","explanation":"Digital Watermarking: embedding authenticity information into legitimate media to help verify its origin.","id":"S06Q30"},{"concept_id":"Social Engineering Techniques:37","variant":0,"category":"Social Engineering Techniques","question":"Which concept best matches drawing out specific information through normal-looking conversation?","choices":["Elicitation","Eavesdropping","Impersonation","Shoulder Surfing"],"answer":"Elicitation","explanation":"Elicitation: drawing out specific information through normal-looking conversation.","id":"S06Q31"},{"concept_id":"Identity Theft:90","variant":2,"category":"Identity Theft","question":"What term best fits this clue: steal or redirect mail?","choices":["Dark Web Data Trading","Social Media Mining","Mail Theft and Rerouting","Identity Theft"],"answer":"Mail Theft and Rerouting","explanation":"Mail Theft and Rerouting: stealing or redirecting physical mail to obtain financial or administrative information.","id":"S06Q32"},{"concept_id":"Impersonation on Social Networking Sites:79","variant":0,"category":"Impersonation on Social Networking Sites","question":"Which concept best matches reporting a second lookalike account that appears to impersonate a real user?","choices":["MFA on Social Accounts","Separate-channel Verification","Breach Exposure Monitoring","Duplicate Profile Reporting"],"answer":"Duplicate Profile Reporting","explanation":"Duplicate Profile Reporting: reporting a second lookalike account that appears to impersonate a real user.","id":"S06Q33"},{"concept_id":"Insider Threats:71","variant":3,"category":"Insider Threats","question":"Which concept best combines these ideas: excess internal access; increasing the damage possible when an internal user is careless, manipulated, or malicious?","choices":["Disgruntled Employee","Insufficient Security Training","Siloed Organizational Units","Unregulated Access to Information"],"answer":"Unregulated Access to Information","explanation":"Unregulated Access to Information: an organizational condition in which too many people can reach sensitive information without adequate control.","id":"S06Q34"},{"concept_id":"PAIR:Intimidation|Familiarity","variant":0,"category":"Social Engineering Concepts","question":"Which distinction between Intimidation and Familiarity is correct, in that order?","choices":["fear or threat / relies on confidence","fear or threat / seems known","relies on confidence / seems known","seems known / fear or threat"],"answer":"fear or threat / seems known","explanation":"Intimidation means fear or threat; Familiarity means seems known.","id":"S06Q35"},{"concept_id":"Insider Threats:74","variant":3,"category":"Insider Threats","question":"Which concept best combines these ideas: missing internal rules; making it unclear how employees should verify, share, and protect sensitive data?","choices":["Unregulated Access to Information","Disgruntled Employee","Insufficient Security Training","Lack of Security Policies"],"answer":"Lack of Security Policies","explanation":"Lack of Security Policies: an organizational weakness caused by missing rules for handling information and access.","id":"S06Q36"},{"concept_id":"PAIR:Spam Email|Scareware","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Spam Email and Scareware is correct, in that order?","choices":["fake fear-based warning / bulk unsolicited email","fake alert popup / fake fear-based warning","bulk unsolicited email / fake fear-based warning","bulk unsolicited email / fake alert popup"],"answer":"bulk unsolicited email / fake fear-based warning","explanation":"Spam Email means bulk unsolicited email; Scareware means fake fear-based warning.","id":"S06Q37"},{"concept_id":"Social Engineering Techniques:63","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: lookalike Unicode characters; using a Greek or Cyrillic character so a fake domain looks like the real one?","choices":["Typosquatting","URL Hijacking","Homograph Attack","Website Cloning"],"answer":"Homograph Attack","explanation":"Homograph Attack: replacing characters in a domain with visually similar characters from another alphabet.","id":"S06Q38"},{"concept_id":"PAIR:Repackaged App|Fake Security Application","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Repackaged App and Fake Security Application is correct, in that order?","choices":["legitimate app plus malware / malware disguised as security app","legitimate app plus malware / QR login session hijack","malware disguised as security app / legitimate app plus malware","QR login session hijack / malware disguised as security app"],"answer":"legitimate app plus malware / malware disguised as security app","explanation":"Repackaged App means legitimate app plus malware; Fake Security Application means malware disguised as security app.","id":"S06Q39"},{"concept_id":"Identity Theft:91","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: harvest PII from profiles; harvesting names, dates, relationships, locations, and other PII from public profiles?","choices":["Dark Web Data Trading","Mail Theft and Rerouting","Social Media Mining","Identity Theft"],"answer":"Social Media Mining","explanation":"Social Media Mining: collecting personal details from social profiles to build or impersonate an identity.","id":"S06Q40"},{"concept_id":"Identity Theft:94","variant":2,"category":"Identity Theft","question":"What term best fits this clue: medical records do not match reality?","choices":["Unauthorized Account Charges","Unexpected Medical Record Changes","Identity Theft","Criminal Identity Theft"],"answer":"Unexpected Medical Record Changes","explanation":"Unexpected Medical Record Changes: new diagnoses or treatment records that the real patient never received.","id":"S06Q41"},{"concept_id":"PAIR:Criminal Identity Theft|Tax Identity Theft","variant":0,"category":"Identity Theft","question":"Which distinction between Criminal Identity Theft and Tax Identity Theft is correct, in that order?","choices":["use victim identity with police / fraudulent healthcare identity","fraudulent healthcare identity / fraudulent tax return","fraudulent tax return / use victim identity with police","use victim identity with police / fraudulent tax return"],"answer":"use victim identity with police / fraudulent tax return","explanation":"Criminal Identity Theft means use victim identity with police; Tax Identity Theft means fraudulent tax return.","id":"S06Q42"},{"concept_id":"Social Engineering Concepts:15","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with creating enough trust before asking for sensitive information?","choices":["Research the Target","Exploit the Relationship","Select a Target","Develop a Relationship"],"answer":"Develop a Relationship","explanation":"Develop a Relationship: the phase focused on building rapport and credibility with the selected person.","id":"S06Q43"},{"concept_id":"Social Engineering Techniques:19","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with using OSINT about a target's role, colleagues, or projects to craft a relevant email?","choices":["Pharming","Spear Phishing","Spimming","Whaling"],"answer":"Spear Phishing","explanation":"Spear Phishing: targeting a specific person or small group with personalized phishing content.","id":"S06Q44"},{"concept_id":"Social Engineering Techniques:39","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: tempting lure left to find?","choices":["Phishing","Whaling","Baiting","Spear Phishing"],"answer":"Baiting","explanation":"Baiting: leaving a tempting object or resource for the victim to discover and interact with.","id":"S06Q45"},{"concept_id":"Social Engineering Techniques:67","variant":1,"category":"Social Engineering Techniques","question":"Which option is most directly associated with getting a victim to scan an attacker's QR login token?","choices":["QRLJacking","Phishing","Fake Security Application","Repackaged App"],"answer":"QRLJacking","explanation":"QRLJacking: abusing QR-code login by presenting a cloned login QR code to hijack a session.","id":"S06Q46"},{"concept_id":"Social Engineering Countermeasures:104","variant":3,"category":"Social Engineering Countermeasures","question":"Which concept best combines these ideas: phishing awareness simulation; measuring user resilience and assigning training after simulated social-engineering campaigns?","choices":["OhPhish","Security Awareness Training","PhishTank","Netcraft"],"answer":"OhPhish","explanation":"OhPhish: a phishing-simulation and awareness platform that can run email, attachment, vishing, and smishing exercises.","id":"S06Q47"},{"concept_id":"Social Engineering Techniques:44","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: inactive tab changes?","choices":["Tabnabbing","Spear Phishing","Pharming","Whaling"],"answer":"Tabnabbing","explanation":"Tabnabbing: changing the content of an inactive browser tab so it appears to be a familiar login when revisited.","id":"S06Q48"},{"concept_id":"Social Engineering Techniques:59","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: CLI recursive mirror; using mirror mode to download a site and optionally convert links for offline browsing?","choices":["Phishing","cURL","WinHTTrack","wget"],"answer":"wget","explanation":"wget: a command-line tool that can recursively mirror a website.","id":"S06Q49"},{"concept_id":"Social Engineering Concepts:5","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with pretending to be a manager, IT administrator, or law-enforcement official?","choices":["Reciprocity","Social Proof","Commitment and Consistency","Authority"],"answer":"Authority","explanation":"Authority: exploiting the tendency to comply with people perceived as having legitimate power.","id":"S06Q50"}],[{"concept_id":"Social Engineering Concepts:17","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: continuous human awareness?","choices":["Social engineering","Constant Vigilance","Pretexting","Reciprocity"],"answer":"Constant Vigilance","explanation":"Constant Vigilance: the continuing human defense required because no single product guarantees protection from manipulation.","id":"S07Q01"},{"concept_id":"Social Engineering Techniques:61","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: misspelled domain; relying on a victim entering a lookalike typo of a legitimate URL?","choices":["Homograph Attack","URL Hijacking","Website Cloning","Typosquatting"],"answer":"Typosquatting","explanation":"Typosquatting: registering a deliberately misspelled domain that users may reach through typing mistakes.","id":"S07Q02"},{"concept_id":"Social Engineering Techniques:46","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: malicious OAuth consent; presenting a fake app that asks the user to approve access to cloud-account data?","choices":["Spear Phishing","Pharming","Consent Phishing","Whaling"],"answer":"Consent Phishing","explanation":"Consent Phishing: abusing OAuth authorization so a victim grants a malicious application account permissions.","id":"S07Q03"},{"concept_id":"Social Engineering Concepts:5","variant":2,"category":"Social Engineering Concepts","question":"What term best fits this clue: perceived power?","choices":["Social Proof","Commitment and Consistency","Authority","Reciprocity"],"answer":"Authority","explanation":"Authority: exploiting the tendency to comply with people perceived as having legitimate power.","id":"S07Q04"},{"concept_id":"Identity Theft:89","variant":3,"category":"Identity Theft","question":"Which concept best combines these ideas: fraudulent tax return; causing more than one tax return to appear under the same person's identity?","choices":["Financial Identity Theft","Driver's License Identity Theft","Tax Identity Theft","Criminal Identity Theft"],"answer":"Tax Identity Theft","explanation":"Tax Identity Theft: using a victim's tax identifier to file a fraudulent return or claim a refund.","id":"S07Q05"},{"concept_id":"Social Engineering Concepts:13","variant":1,"category":"Social Engineering Concepts","question":"Which option is most directly associated with using websites, blogs, advertisements, and dumpster diving before choosing a victim?","choices":["Exploit the Relationship","Research the Target","Select a Target","Develop a Relationship"],"answer":"Research the Target","explanation":"Research the Target: the first social-engineering phase in which basic company and employee information is gathered.","id":"S07Q06"},{"concept_id":"Social Engineering Techniques:28","variant":2,"category":"Social Engineering Techniques","question":"What term best fits this clue: entry with consent?","choices":["Phishing","Piggybacking","Tailgating","Spear Phishing"],"answer":"Piggybacking","explanation":"Piggybacking: entering a secure area because an authorized person knowingly allows access.","id":"S07Q07"},{"concept_id":"Impersonation on Social Networking Sites:82","variant":1,"category":"Impersonation on Social Networking Sites","question":"Which option is most directly associated with reducing takeover risk by detecting exposed credentials before attackers reuse them?","choices":["Separate-channel Verification","Duplicate Profile Reporting","Breach Exposure Monitoring","MFA on Social Accounts"],"answer":"Breach Exposure Monitoring","explanation":"Breach Exposure Monitoring: checking whether account credentials have appeared in known data breaches.","id":"S07Q08"},{"concept_id":"Social Engineering Techniques:68","variant":3,"category":"Social Engineering Techniques","question":"Which concept best combines these ideas: legitimate app plus malware; publishing a modified copy of a real app through a third-party store?","choices":["Phishing","Repackaged App","QRLJacking","Fake Security Application"],"answer":"Repackaged App","explanation":"Repackaged App: taking a legitimate mobile application, adding malicious code, and redistributing it.","id":"S07Q09"},{"concept_id":"Identity Theft:85","variant":1,"category":"Identity Theft","question":"Which option is most directly associated with maxing credit cards or opening financial accounts in the victim's name?","choices":["Insurance Identity Theft","Driver's License Identity Theft","Financial Identity Theft","Criminal Identity Theft"],"answer":"Financial Identity Theft","explanation":"Financial Identity Theft: using stolen bank or credit information for purchases, withdrawals, or new accounts.","id":"S07Q10"},{"concept_id":"PAIR:Pharming|Search Engine Phishing","variant":0,"category":"Social Engineering Techniques","question":"Which distinction between Pharming and Search Engine Phishing is correct, in that order?","choices":["copy legitimate message / poisoned s
