<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Sniffing — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"concept_id":"Spoofing Attacks:9","variant":1,"category":"Spoofing Attacks","question":"What term describes shutting or err-disabling a PortFast edge port when a BPDU arrives?","choices":["BPDU Guard","UDLD","Root Guard","Loop Guard"],"answer":"BPDU Guard","explanation":"BPDU Guard treats bridge control traffic on an edge port as a violation.","id":"Q001"},{"concept_id":"DHCP Attacks:8","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by supplying clients with attacker-controlled gateway, DNS, or address settings?","choices":["DHCP starvation","Rogue DHCP server","MAC flooding","Port security"],"answer":"Rogue DHCP server","explanation":"A rogue server wins the DHCP race and pushes malicious network configuration.","id":"Q002"},{"concept_id":"Sniffing Tools:12","variant":2,"category":"Sniffing Tools","question":"Which option is most directly associated with scanning an IP range for likely promiscuous-mode interfaces?","choices":["Ettercap","macof","NetScanTools Pro","Yersinia"],"answer":"NetScanTools Pro","explanation":"The CEH notes list its Promiscuous Mode Scanner.","id":"Q003"},{"concept_id":"Sniffing Concepts:10","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by the actual carried data above protocol headers in a captured packet?","choices":["Payload","Frame check sequence","Ethernet preamble","TCP checksum"],"answer":"Payload","explanation":"The payload contains the higher-layer data transported by the packet.","id":"Q004"},{"concept_id":"Sniffing Concepts:4","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by repeating received Ethernet traffic out every port?","choices":["Hub","Switch","Network TAP","Router"],"answer":"Hub","explanation":"A hub creates a shared collision domain, so every attached system can see the frames.","id":"Q005"},{"concept_id":"Sniffing Concepts:0","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches capturing and analyzing packets traversing a network?","choices":["Port scanning","Packet sniffing","Route enumeration","Vulnerability scanning"],"answer":"Packet sniffing","explanation":"Packet sniffing monitors network traffic so packet headers and payloads can be inspected.","id":"Q006"},{"concept_id":"Spoofing Attacks:2","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with using two 802.1Q tags so an inner target-VLAN tag survives native-VLAN processing?","choices":["Double tagging","DNS poisoning","MAC flooding","Switch spoofing"],"answer":"Double tagging","explanation":"Double tagging exploits native-VLAN handling across trunks.","id":"Q007"},{"concept_id":"Spoofing Attacks:7","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with an aggressive bridge-priority value used by a rogue switch to win STP root election in the example?","choices":["32769","65535","Priority 0","49152"],"answer":"Priority 0","explanation":"A very low priority lowers the Bridge ID.","id":"Q008"},{"concept_id":"Spoofing Attacks:12","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches downgrading victim-side HTTPS links to HTTP after a MITM path already exists?","choices":["macof","arpwatch","sslstrip","Yersinia"],"answer":"sslstrip","explanation":"sslstrip acts as a transparent proxy and requires traffic to pass through the attacker first.","id":"Q009"},{"concept_id":"Sniffing Detection Techniques:8","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by showing an ARP claim inconsistent with trusted IP/MAC/interface bindings?","choices":["DAI violation log","SPAN configuration","DNSSEC trust anchor","HSTS event"],"answer":"DAI violation log","explanation":"DAI logs rejected forged ARP packets.","id":"Q010"},{"concept_id":"ARP Poisoning:11","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by pinning a critical IP-to-MAC mapping so dynamic forged replies cannot replace it normally?","choices":["DHCP relay","Dynamic DNS entry","SPAN session","Static ARP entry"],"answer":"Static ARP entry","explanation":"Static ARP mappings can protect stable critical peers such as a gateway.","id":"Q011"},{"concept_id":"Sniffing Countermeasures:11","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports blocking forged ARP claims that conflict with trusted bindings?","choices":["Dynamic ARP Inspection","HSTS","Port Security","DNSSEC"],"answer":"Dynamic ARP Inspection","explanation":"DAI validates ARP packets against authoritative binding data.","id":"Q012"},{"concept_id":"Sniffing Countermeasures:4","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses encrypting wireless traffic instead of relying on open Wi-Fi or MAC filtering?","choices":["WEP only","Hidden SSID only","WPA2/WPA3","Open Wi-Fi"],"answer":"WPA2/WPA3","explanation":"Strong Wi-Fi encryption reduces local packet-sniffing exposure.","id":"Q013"},{"concept_id":"Sniffing Countermeasures:12","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports preventing an access direction from introducing a superior STP root?","choices":["DAI","HSTS","BPDU Guard","Root Guard"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root bridge.","id":"Q014"},{"concept_id":"Sniffing Concepts:9","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with leaving useful packet metadata visible while making protected payload content unreadable?","choices":["Encryption","Segmentation","MAC learning","Port mirroring"],"answer":"Encryption","explanation":"Encrypted traffic can still expose headers, but the application content remains protected without keys.","id":"Q015"},{"concept_id":"Sniffing Concepts:12","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by an inline hardware device that passively copies link traffic without switch mirroring configuration?","choices":["DHCP snooping","SPAN","Network TAP","Port security"],"answer":"Network TAP","explanation":"A TAP copies traffic in hardware and is independent of a SPAN session.","id":"Q016"},{"concept_id":"Sniffing Detection Techniques:4","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches alerting on suspicious MAC-to-IP mapping changes and flips?","choices":["arpwatch","sslstrip","DHCPig","macof"],"answer":"arpwatch","explanation":"ARP mapping changes are a strong clue of spoofing-based sniffing.","id":"Q017"},{"concept_id":"Sniffing Tools:7","variant":3,"category":"Sniffing Tools","question":"Which CLI option directly enables requesting full-packet capture instead of snapshot truncation in tcpdump?","choices":["-n","-s 0","-vvv","-i any"],"answer":"-s 0","explanation":"`-s 0` captures the complete packet according to the supplied notes.","id":"Q018"},{"concept_id":"DNS Poisoning:10","variant":0,"category":"DNS Poisoning","question":"Which concept best matches the mapping-file structure used by Ettercap DNS spoofing for names, record types, and addresses?","choices":["PCAP structure","STP topology file","DHCP lease database","DNS zone-style config"],"answer":"DNS zone-style config","explanation":"Ettercap's spoof mappings resemble DNS zone-file entries.","id":"Q019"},{"concept_id":"Spoofing Attacks:4","variant":1,"category":"Spoofing Attacks","question":"What term describes manipulating spanning-tree root election so traffic paths favor a rogue switch?","choices":["DNS poisoning","ARP inspection","DHCP starvation","STP attack"],"answer":"STP attack","explanation":"A rogue switch can advertise a better bridge identity and become root.","id":"Q020"},{"concept_id":"Sniffing Tools:10","variant":3,"category":"Sniffing Tools","question":"Which concept is defined by isolating and reconstructing one TCP conversation in Wireshark?","choices":["Follow TCP Stream","Expert Information","Capture Options","Protocol Hierarchy"],"answer":"Follow TCP Stream","explanation":"Follow TCP Stream filters unrelated frames and reconstructs the exchange.","id":"Q021"},{"concept_id":"ARP Poisoning:6","variant":0,"category":"ARP Poisoning","question":"Which concept best matches sending forged ARP mappings with a focused dsniff utility?","choices":["Yersinia","NetScanTools Pro","macof","arpspoof"],"answer":"arpspoof","explanation":"arpspoof is a dsniff tool for ARP spoofing.","id":"Q022"},{"concept_id":"Sniffing Detection Techniques:7","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with indicating a possible rogue DHCP server on an untrusted access port?","choices":["ARP broadcast","Valid root BPDU","Normal DHCPREQUEST","Unauthorized DHCPOFFER"],"answer":"Unauthorized DHCPOFFER","explanation":"Server-side DHCP messages should come only from authorized infrastructure.","id":"Q023"},{"concept_id":"ARP Poisoning:8","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by an ARP-poisoning/MITM framework listed in the CEH material?","choices":["Nessus","bettercap","Hashcat","Cutter"],"answer":"bettercap","explanation":"bettercap is one of the listed ARP poisoning tools.","id":"Q205"},{"concept_id":"MAC Attacks:6","variant":3,"category":"MAC Attacks","question":"Which concept is defined by limiting how many or which MAC addresses may be learned on an access port?","choices":["Root Guard","DNSSEC","DHCP relay","Port Security"],"answer":"Port Security","explanation":"Port security mitigates MAC flooding and MAC spoofing on access ports.","id":"Q481"},{"concept_id":"Sniffing Tools:2","variant":0,"category":"Sniffing Tools","question":"Which tool is used for using Wireshark's dissectors from the command line with field-oriented output?","choices":["Ettercap","tshark","tcpdump","WinDump"],"answer":"tshark","explanation":"tshark is Wireshark's CLI version.","id":"Q026"},{"concept_id":"Sniffing Countermeasures:7","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for reducing how much broadcast and local traffic any one capture point can observe?","choices":["VLAN segmentation","Open Wi-Fi","Hub deployment","Long DHCP leases"],"answer":"VLAN segmentation","explanation":"Segmentation confines layer-2 visibility.","id":"Q027"},{"concept_id":"MAC Attacks:4","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with the direct resource goal of MAC flooding?","choices":["CAM table exhaustion","DNS cache poisoning","DHCP pool exhaustion","STP root election"],"answer":"CAM table exhaustion","explanation":"MAC flooding consumes the finite MAC-learning capacity of the switch.","id":"Q028"},{"concept_id":"Spoofing Attacks:6","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by the STP election value combining bridge priority and MAC address?","choices":["Bridge ID","ARP cache entry","DNS transaction ID","DHCP binding"],"answer":"Bridge ID","explanation":"The bridge with the lowest BID wins root election.","id":"Q029"},{"concept_id":"Sniffing Detection Techniques:12","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches visualizing bursts and timing anomalies across a capture?","choices":["I/O Graph","DNS zone","ARP cache","CAM table"],"answer":"I/O Graph","explanation":"Wireshark I/O graphs reveal traffic-rate changes over time.","id":"Q030"},{"concept_id":"Sniffing Countermeasures:3","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses replacing community-string SNMP versions with stronger authentication and encryption?","choices":["SNMPv3","SNMPv1","TFTP","SNMPv2c"],"answer":"SNMPv3","explanation":"SNMPv3 provides modern security controls for management traffic.","id":"Q031"},{"concept_id":"DNS Poisoning:12","variant":1,"category":"DNS Poisoning","question":"What term describes blocking endpoints from sending direct DNS requests to unauthorized external servers?","choices":["Disable HTTPS","Open DNS recursion","Firewall DNS restriction","Hub deployment"],"answer":"Firewall DNS restriction","explanation":"Firewall policy can force endpoints through approved resolvers.","id":"Q032"},{"concept_id":"ARP Poisoning:10","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by the reference DAI commonly checks when validating dynamic ARP claims?","choices":["STP topology table","DHCP snooping binding table","DNS cache","TCP connection table"],"answer":"DHCP snooping binding table","explanation":"DAI compares claimed IP/MAC/interface data with trusted DHCP bindings.","id":"Q033"},{"concept_id":"DNS Poisoning:8","variant":1,"category":"DNS Poisoning","question":"What term describes controlling how long a poisoned DNS answer can remain reusable after acceptance?","choices":["ARP opcode","DNS cache TTL","STP path cost","DHCP relay address"],"answer":"DNS cache TTL","explanation":"TTL determines cache lifetime.","id":"Q034"},{"concept_id":"Sniffing Tools:11","variant":3,"category":"Sniffing Tools","question":"Which concept is defined by providing negotiated TLS secrets to Wireshark for authorized decryption of modern sessions?","choices":["Pre-master/session key log","DHCP snooping table","STP log","CAM export"],"answer":"Pre-master/session key log","explanation":"Modern ephemeral TLS is commonly decrypted with logged session secrets.","id":"Q035"},{"concept_id":"DNS Poisoning:1","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with forging DNS answers on a switched LAN after obtaining local traffic visibility?","choices":["Intranet DNS spoofing","Proxy DNS poisoning","Offline zone signing","Internet DNS spoofing"],"answer":"Intranet DNS spoofing","explanation":"The supplied flow uses local MITM positioning before forged DNS responses.","id":"Q036"},{"concept_id":"MAC Attacks:3","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with a MAC address whose U/L bit is set to 1?","choices":["Multicast MAC","Locally administered MAC","Globally unique MAC","OUI-only address"],"answer":"Locally administered MAC","explanation":"The U/L bit marks whether the MAC is locally administered.","id":"Q037"},{"concept_id":"MAC Attacks:11","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with a switch updating a known MAC to a new ingress port after seeing that source address there?","choices":["DHCP renewal","MAC relearning","DNS recursion","TLS resumption"],"answer":"MAC relearning","explanation":"Switches dynamically relearn source MAC locations.","id":"Q038"},{"concept_id":"MAC Attacks:10","variant":1,"category":"MAC Attacks","question":"What term describes cloning or changing a client MAC identity to impersonate an authorized endpoint?","choices":["STP root attack","MAC spoofing","DHCP starvation","MAC flooding"],"answer":"MAC spoofing","explanation":"MAC spoofing reuses a layer-2 identity rather than generating thousands of addresses.","id":"Q039"},{"concept_id":"ARP Poisoning:4","variant":1,"category":"ARP Poisoning","question":"What term describes placing a false IP-to-MAC mapping into another host's ARP cache?","choices":["DHCP starvation","ARP poisoning","DNS poisoning","MAC flooding"],"answer":"ARP poisoning","explanation":"ARP poisoning redirects local Ethernet traffic by corrupting address resolution.","id":"Q207"},{"concept_id":"DHCP Attacks:10","variant":1,"category":"DHCP Attacks","question":"What term describes filtering DHCP server messages according to trusted and untrusted switch ports?","choices":["DAI","Root Guard","DNSSEC","DHCP Snooping"],"answer":"DHCP Snooping","explanation":"DHCP snooping blocks rogue server responses and builds trusted lease bindings.","id":"Q041"},{"concept_id":"DHCP Attacks:6","variant":1,"category":"DHCP Attacks","question":"What term describes a client requesting local configuration without asking for a new address lease?","choices":["DHCPDecline","DHCPREQUEST","DHCPInform","Relay-Forward"],"answer":"DHCPInform","explanation":"Inform asks for options only.","id":"Q042"},{"concept_id":"DNS Poisoning:3","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by cryptographically validating DNS record authenticity and integrity?","choices":["DAI","Port Security","Root Guard","DNSSEC"],"answer":"DNSSEC","explanation":"DNSSEC signatures allow validating resolvers to reject forged DNS data.","id":"Q043"},{"concept_id":"Sniffing Tools:3","variant":1,"category":"Sniffing Tools","question":"What utility best fits interactively browsing captured frames and decoding the full protocol stack in a GUI?","choices":["DHCPig","Yersinia","Wireshark","macof"],"answer":"Wireshark","explanation":"Wireshark is the standard graphical packet analyzer.","id":"Q044"},{"concept_id":"ARP Poisoning:2","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by returning the MAC address associated with the requested local IP?","choices":["ARP request","DHCPDISCOVER","ARP reply","STP BPDU"],"answer":"ARP reply","explanation":"The host owning the IP responds with its hardware address.","id":"Q045"},{"concept_id":"DHCP Attacks:1","variant":1,"category":"DHCP Attacks","question":"What term describes the server's proposed address and configuration to a client?","choices":["DHCPNAK","DHCPDISCOVER","DHCPOFFER","DHCPREQUEST"],"answer":"DHCPOFFER","explanation":"Offer proposes lease parameters after discovery.","id":"Q046"},{"concept_id":"MAC Attacks:12","variant":3,"category":"MAC Attacks","question":"Which concept is defined by a notification that may be generated when port-security detects a violation?","choices":["SNMP trap","ICMP redirect","DNS zone transfer","DHCPACK"],"answer":"SNMP trap","explanation":"Port-security violations can trigger an SNMP notification.","id":"Q047"},{"concept_id":"DHCP Attacks:2","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by the client's message selecting or requesting an offered lease?","choices":["DHCPACK","DHCPRelease","DHCPOFFER","DHCPREQUEST"],"answer":"DHCPREQUEST","explanation":"Request follows an offer in DORA.","id":"Q064"},{"concept_id":"Sniffing Detection Techniques:3","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with locally indicating promiscuous mode on interfaces where the OS exposes that state?","choices":["ROOT flag","SNOOP flag","PROMISC flag","TRUST flag"],"answer":"PROMISC flag","explanation":"The supplementary notes mention PROMISC on macOS, while warning that OS reporting varies.","id":"Q049"},{"concept_id":"Sniffing Concepts:8","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches preventing traffic in another VLAN or subnet from reaching the sniffer interface by default?","choices":["Name resolution","Network segmentation","Encryption","Promiscuous mode"],"answer":"Network segmentation","explanation":"Segmentation limits which traffic reaches a capture point.","id":"Q050"}],[{"concept_id":"Sniffing Tools:3","variant":3,"category":"Sniffing Tools","question":"Which tool most directly handles interactively browsing captured frames and decoding the full protocol stack in a GUI?","choices":["DHCPig","macof","Wireshark","Yersinia"],"answer":"Wireshark","explanation":"Wireshark is the standard graphical packet analyzer.","id":"Q051"},{"concept_id":"ARP Poisoning:5","variant":1,"category":"ARP Poisoning","question":"What term describes keeping intercepted MITM traffic moving onward to the real destination?","choices":["BPDU Guard","DNS recursion","Port Security","IP forwarding"],"answer":"IP forwarding","explanation":"Without forwarding, redirected traffic stops at the attacker and breaks the victim connection.","id":"Q052"},{"concept_id":"Sniffing Tools:13","variant":2,"category":"Sniffing Tools","question":"Which option is most directly associated with portable packet capture plus performance analysis and diagnostics?","choices":["arpwatch","Capsa Portable Network Analyzer","RITA","macof"],"answer":"Capsa Portable Network Analyzer","explanation":"Capsa is listed as a portable network analyzer.","id":"Q053"},{"concept_id":"Sniffing Detection Techniques:0","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches probing a suspect with the correct IP but an incorrect destination MAC and watching for an unexpected reply?","choices":["DHCP method","ARP method","DNS method","Ping method"],"answer":"Ping method","explanation":"A promiscuous NIC may pass the wrong-MAC frame to the IP stack.","id":"Q054"},{"concept_id":"Sniffing Concepts:7","variant":1,"category":"Sniffing Concepts","question":"What term describes mapping IPv4 addresses to local MAC addresses on an endpoint?","choices":["Routing table","CAM table","ARP cache","DNS cache"],"answer":"ARP cache","explanation":"ARP resolves local IPv4 peers to Ethernet MAC addresses.","id":"Q055"},{"concept_id":"DHCP Attacks:1","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by the server's proposed address and configuration to a client?","choices":["DHCPDISCOVER","DHCPOFFER","DHCPNAK","DHCPREQUEST"],"answer":"DHCPOFFER","explanation":"Offer proposes lease parameters after discovery.","id":"Q056"},{"concept_id":"Sniffing Detection Techniques:6","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches indicating possible DHCP starvation when many changing client identities request leases?","choices":["Valid DNSSEC answer","DHCPDISCOVER burst","Stable ARP table","Single DHCPACK"],"answer":"DHCPDISCOVER burst","explanation":"Starvation creates high-volume discovery traffic.","id":"Q057"},{"concept_id":"MAC Attacks:12","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with a notification that may be generated when port-security detects a violation?","choices":["DHCPACK","DNS zone transfer","SNMP trap","ICMP redirect"],"answer":"SNMP trap","explanation":"Port-security violations can trigger an SNMP notification.","id":"Q058"},{"concept_id":"DNS Poisoning:8","variant":0,"category":"DNS Poisoning","question":"Which concept best matches controlling how long a poisoned DNS answer can remain reusable after acceptance?","choices":["STP path cost","DHCP relay address","ARP opcode","DNS cache TTL"],"answer":"DNS cache TTL","explanation":"TTL determines cache lifetime.","id":"Q059"},{"concept_id":"Sniffing Countermeasures:1","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports replacing plaintext FTP-style transfers with SSH-protected file transfer?","choices":["SFTP/SCP","TFTP","Rlogin","FTP"],"answer":"SFTP/SCP","explanation":"SFTP and SCP protect both authentication and file data.","id":"Q060"},{"concept_id":"DNS Poisoning:5","variant":0,"category":"DNS Poisoning","question":"Which concept best matches allowing recursive DNS service only for authorized clients?","choices":["Enable open recursion","Use a hub","Disable DNSSEC","Restrict recursion"],"answer":"Restrict recursion","explanation":"Recursion access control reduces abuse and exposure.","id":"Q061"},{"concept_id":"Sniffing Countermeasures:8","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports restricting network access to trusted source or destination ranges?","choices":["SPAN","ACL","BPF on the sniffer","Hub"],"answer":"ACL","explanation":"Access-control lists limit which systems may communicate.","id":"Q062"},{"concept_id":"Sniffing Tools:0","variant":0,"category":"Sniffing Tools","question":"Which tool is used for capturing packets from the command line on Linux and BSD?","choices":["NetScanTools Pro","WinDump","Wireshark GUI","tcpdump"],"answer":"tcpdump","explanation":"tcpdump is the classic Unix-like CLI packet capture tool.","id":"Q063"},{"concept_id":"DHCP Attacks:13","variant":0,"category":"DHCP Attacks","question":"Which concept best matches recording trusted MAC, IP, VLAN, interface, and lease information for clients?","choices":["TCP session table","STP topology table","DNS cache","DHCP snooping binding table"],"answer":"DHCP snooping binding table","explanation":"The binding database is also used by controls such as DAI and IP Source Guard.","id":"Q048"},{"concept_id":"Sniffing Concepts:3","variant":1,"category":"Sniffing Concepts","question":"What term describes manipulating a switched network so otherwise hidden traffic becomes visible?","choices":["Static routing","Active sniffing","Offline PCAP analysis","Passive sniffing"],"answer":"Active sniffing","explanation":"Active sniffing injects or manipulates traffic to defeat normal switch isolation.","id":"Q065"},{"concept_id":"Sniffing Concepts:9","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches leaving useful packet metadata visible while making protected payload content unreadable?","choices":["Port mirroring","Encryption","MAC learning","Segmentation"],"answer":"Encryption","explanation":"Encrypted traffic can still expose headers, but the application content remains protected without keys.","id":"Q066"},{"concept_id":"Spoofing Attacks:0","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches impersonating another endpoint by reusing its layer-2 address?","choices":["DHCP starvation","DNS poisoning","MAC flooding","MAC spoofing"],"answer":"MAC spoofing","explanation":"MAC spoofing abuses trust based on hardware identity.","id":"Q393"},{"concept_id":"ARP Poisoning:4","variant":0,"category":"ARP Poisoning","question":"Which concept best matches placing a false IP-to-MAC mapping into another host's ARP cache?","choices":["MAC flooding","ARP poisoning","DHCP starvation","DNS poisoning"],"answer":"ARP poisoning","explanation":"ARP poisoning redirects local Ethernet traffic by corrupting address resolution.","id":"Q068"},{"concept_id":"ARP Poisoning:8","variant":1,"category":"ARP Poisoning","question":"What term describes an ARP-poisoning/MITM framework listed in the CEH material?","choices":["Cutter","Nessus","Hashcat","bettercap"],"answer":"bettercap","explanation":"bettercap is one of the listed ARP poisoning tools.","id":"Q069"},{"concept_id":"Sniffing Countermeasures:10","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for blocking rogue DHCP server responses and optionally rate-limiting DHCP traffic?","choices":["DNSSEC","DAI","DHCP Snooping","Root Guard"],"answer":"DHCP Snooping","explanation":"DHCP snooping protects DHCP trust at the switch.","id":"Q070"},{"concept_id":"MAC Attacks:2","variant":0,"category":"MAC Attacks","question":"Which concept best matches a MAC address whose I/G bit is set to 1?","choices":["Multicast MAC","Globally unique MAC","Unicast MAC","Locally administered MAC"],"answer":"Multicast MAC","explanation":"The low-order I/G bit distinguishes group/multicast from individual/unicast addressing.","id":"Q071"},{"concept_id":"MAC Attacks:3","variant":0,"category":"MAC Attacks","question":"Which concept best matches a MAC address whose U/L bit is set to 1?","choices":["Globally unique MAC","Multicast MAC","Locally administered MAC","OUI-only address"],"answer":"Locally administered MAC","explanation":"The U/L bit marks whether the MAC is locally administered.","id":"Q072"},{"concept_id":"ARP Poisoning:12","variant":1,"category":"ARP Poisoning","question":"What term describes monitoring MAC-to-IP mapping changes to expose ARP anomalies?","choices":["arpwatch","sslstrip","macof","arpspoof"],"answer":"arpwatch","explanation":"arpwatch is defensive monitoring rather than a poisoning tool.","id":"Q073"},{"concept_id":"DNS Poisoning:6","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with forcing endpoints to use approved internal DNS infrastructure instead of arbitrary external resolvers?","choices":["Hub forwarding","Static MAC filtering only","Open resolver policy","Local DNS resolver policy"],"answer":"Local DNS resolver policy","explanation":"Centralized DNS enables validation, logging, and consistent controls.","id":"Q074"},{"concept_id":"ARP Poisoning:7","variant":1,"category":"ARP Poisoning","question":"What term describes combining ARP poisoning with broader MITM and DNS-spoofing capabilities?","choices":["PRTG","RITA","Ettercap","WinDump"],"answer":"Ettercap","explanation":"Ettercap is a multipurpose MITM and sniffing framework.","id":"Q075"},{"concept_id":"Sniffing Detection Techniques:1","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches looking for unusual reverse DNS lookups generated while a sniffer resolves captured IP addresses?","choices":["ARP method","Ping method","DNS method","STP method"],"answer":"DNS method","explanation":"Some sniffers create detectable PTR lookup traffic.","id":"Q076"},{"concept_id":"Sniffing Countermeasures:4","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports encrypting wireless traffic instead of relying on open Wi-Fi or MAC filtering?","choices":["Hidden SSID only","WPA2/WPA3","Open Wi-Fi","WEP only"],"answer":"WPA2/WPA3","explanation":"Strong Wi-Fi encryption reduces local packet-sniffing exposure.","id":"Q077"},{"concept_id":"MAC Attacks:6","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with limiting how many or which MAC addresses may be learned on an access port?","choices":["DHCP relay","Root Guard","DNSSEC","Port Security"],"answer":"Port Security","explanation":"Port security mitigates MAC flooding and MAC spoofing on access ports.","id":"Q078"},{"concept_id":"DNS Poisoning:11","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with reducing abusive volumes of negative DNS responses or queries?","choices":["NXDOMAIN rate limiting","ARP inspection","Port Security","BPDU Guard"],"answer":"NXDOMAIN rate limiting","explanation":"The CEH countermeasures include rate limiting for NXDOMAIN activity.","id":"Q079"},{"concept_id":"Spoofing Attacks:4","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches manipulating spanning-tree root election so traffic paths favor a rogue switch?","choices":["DHCP starvation","ARP inspection","STP attack","DNS poisoning"],"answer":"STP attack","explanation":"A rogue switch can advertise a better bridge identity and become root.","id":"Q080"},{"concept_id":"Sniffing Tools:11","variant":1,"category":"Sniffing Tools","question":"What term describes providing negotiated TLS secrets to Wireshark for authorized decryption of modern sessions?","choices":["Pre-master/session key log","STP log","CAM export","DHCP snooping table"],"answer":"Pre-master/session key log","explanation":"Modern ephemeral TLS is commonly decrypted with logged session secrets.","id":"Q081"},{"concept_id":"Sniffing Countermeasures:12","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses preventing an access direction from introducing a superior STP root?","choices":["HSTS","DAI","BPDU Guard","Root Guard"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root bridge.","id":"Q082"},{"concept_id":"DHCP Attacks:0","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with the client's initial broadcast looking for DHCP servers?","choices":["DHCPACK","DHCPREQUEST","DHCPDISCOVER","DHCPOFFER"],"answer":"DHCPDISCOVER","explanation":"Discover begins the DORA lease exchange.","id":"Q083"},{"concept_id":"DHCP Attacks:9","variant":1,"category":"DHCP Attacks","question":"What term describes generating DHCP starvation traffic in the supplied CEH tooling?","choices":["macof","tshark","Yersinia","arpwatch"],"answer":"Yersinia","explanation":"Yersinia is listed as a DHCP attack tool.","id":"Q084"},{"concept_id":"DNS Poisoning:3","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with cryptographically validating DNS record authenticity and integrity?","choices":["DNSSEC","DAI","Root Guard","Port Security"],"answer":"DNSSEC","explanation":"DNSSEC signatures allow validating resolvers to reject forged DNS data.","id":"Q085"},{"concept_id":"Sniffing Detection Techniques:3","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by locally indicating promiscuous mode on interfaces where the OS exposes that state?","choices":["PROMISC flag","TRUST flag","SNOOP flag","ROOT flag"],"answer":"PROMISC flag","explanation":"The supplementary notes mention PROMISC on macOS, while warning that OS reporting varies.","id":"Q086"},{"concept_id":"DHCP Attacks:3","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with the server's confirmation that finalizes the accepted lease?","choices":["DHCPInform","DHCPREQUEST","DHCPACK","DHCPDecline"],"answer":"DHCPACK","explanation":"ACK completes successful address assignment.","id":"Q087"},{"concept_id":"DHCP Attacks:11","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by marking a legitimate DHCP-server-facing switch interface as trusted?","choices":["ip dhcp snooping vlan","ip dhcp snooping trust","ip arp inspection validate","switchport mode access"],"answer":"ip dhcp snooping trust","explanation":"Only trusted interfaces should be allowed to send legitimate server-side DHCP messages.","id":"Q088"},{"concept_id":"Spoofing Attacks:8","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by the default bridge-priority value listed in the supplied CEH notes?","choices":["65535","32769","4096","32768"],"answer":"32769","explanation":"The provided chapter explicitly lists 32769 as the default value to remember.","id":"Q089"},{"concept_id":"Sniffing Tools:6","variant":1,"category":"Sniffing Tools","question":"What flag is used for displaying packet contents in hex and ASCII with tcpdump?","choices":["-w","-X","-r","-n"],"answer":"-X","explanation":"`-X` exposes packet bytes for payload inspection.","id":"Q090"},{"concept_id":"Sniffing Countermeasures:11","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides blocking forged ARP claims that conflict with trusted bindings?","choices":["Dynamic ARP Inspection","Port Security","DNSSEC","HSTS"],"answer":"Dynamic ARP Inspection","explanation":"DAI validates ARP packets against authoritative binding data.","id":"Q091"},{"concept_id":"MAC Attacks:5","variant":3,"category":"MAC Attacks","question":"Which concept is defined by flooding a switch with many randomized MAC/IP identities to stress the CAM table?","choices":["Yersinia","NetScanTools Pro","arpspoof","macof"],"answer":"macof","explanation":"macof is the classic dsniff utility for MAC flooding.","id":"Q092"},{"concept_id":"Spoofing Attacks:2","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by using two 802.1Q tags so an inner target-VLAN tag survives native-VLAN processing?","choices":["MAC flooding","Switch spoofing","DNS poisoning","Double tagging"],"answer":"Double tagging","explanation":"Double tagging exploits native-VLAN handling across trunks.","id":"Q093"},{"concept_id":"Sniffing Concepts:4","variant":1,"category":"Sniffing Concepts","question":"What term describes repeating received Ethernet traffic out every port?","choices":["Network TAP","Hub","Switch","Router"],"answer":"Hub","explanation":"A hub creates a shared collision domain, so every attached system can see the frames.","id":"Q094"},{"concept_id":"Sniffing Concepts:5","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by forwarding normal unicast frames only toward the learned destination port?","choices":["Repeater","Switch","Network TAP","Hub"],"answer":"Switch","explanation":"A switch uses its CAM table to limit unicast forwarding.","id":"Q095"},{"concept_id":"Sniffing Concepts:6","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with mapping learned MAC addresses to switch ports and VLAN context?","choices":["DHCP scope","ARP cache","CAM table","DNS cache"],"answer":"CAM table","explanation":"The CAM table is the switch's MAC-to-port forwarding database.","id":"Q096"},{"concept_id":"Spoofing Attacks:7","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches an aggressive bridge-priority value used by a rogue switch to win STP root election in the example?","choices":["Priority 0","65535","32769","49152"],"answer":"Priority 0","explanation":"A very low priority lowers the Bridge ID.","id":"Q097"},{"concept_id":"ARP Poisoning:2","variant":0,"category":"ARP Poisoning","question":"Which concept best matches returning the MAC address associated with the requested local IP?","choices":["ARP reply","ARP request","STP BPDU","DHCPDISCOVER"],"answer":"ARP reply","explanation":"The host owning the IP responds with its hardware address.","id":"Q098"},{"concept_id":"Sniffing Tools:4","variant":1,"category":"Sniffing Tools","question":"What term describes filtering captures with primitives such as host, net, port, proto, and ether?","choices":["YARA","STIX","BPF","Sigma"],"answer":"BPF","explanation":"Berkeley Packet Filter syntax is used by tcpdump and other capture tools.","id":"Q099"},{"concept_id":"Sniffing Detection Techniques:7","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by indicating a possible rogue DHCP server on an untrusted access port?","choices":["Unauthorized DHCPOFFER","Valid root BPDU","Normal DHCPREQUEST","ARP broadcast"],"answer":"Unauthorized DHCPOFFER","explanation":"Server-side DHCP messages should come only from authorized infrastructure.","id":"Q100"}],[{"concept_id":"Sniffing Concepts:5","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with forwarding normal unicast frames only toward the learned destination port?","choices":["Hub","Network TAP","Repeater","Switch"],"answer":"Switch","explanation":"A switch uses its CAM table to limit unicast forwarding.","id":"Q101"},{"concept_id":"Sniffing Concepts:9","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by leaving useful packet metadata visible while making protected payload content unreadable?","choices":["Port mirroring","MAC learning","Encryption","Segmentation"],"answer":"Encryption","explanation":"Encrypted traffic can still expose headers, but the application content remains protected without keys.","id":"Q102"},{"concept_id":"DNS Poisoning:9","variant":0,"category":"DNS Poisoning","question":"Which concept best matches the Ettercap plugin that forges DNS responses from configured name mappings?","choices":["macof","dns_spoof","arpwatch","dhcp_snoop"],"answer":"dns_spoof","explanation":"The supplementary material uses Ettercap's dns_spoof plugin.","id":"Q103"},{"concept_id":"MAC Attacks:12","variant":1,"category":"MAC Attacks","question":"What term describes a notification that may be generated when port-security detects a violation?","choices":["ICMP redirect","SNMP trap","DNS zone transfer","DHCPACK"],"answer":"SNMP trap","explanation":"Port-security violations can trigger an SNMP notification.","id":"Q104"},{"concept_id":"Sniffing Countermeasures:7","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides reducing how much broadcast and local traffic any one capture point can observe?","choices":["Long DHCP leases","Hub deployment","Open Wi-Fi","VLAN segmentation"],"answer":"VLAN segmentation","explanation":"Segmentation confines layer-2 visibility.","id":"Q105"},{"concept_id":"Sniffing Detection Techniques:4","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with alerting on suspicious MAC-to-IP mapping changes and flips?","choices":["arpwatch","DHCPig","macof","sslstrip"],"answer":"arpwatch","explanation":"ARP mapping changes are a strong clue of spoofing-based sniffing.","id":"Q106"},{"concept_id":"ARP Poisoning:9","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by validating ARP messages against trusted switch binding information?","choices":["Port Security","Root Guard","Dynamic ARP Inspection","SPAN"],"answer":"Dynamic ARP Inspection","explanation":"DAI blocks forged ARP claims, often using DHCP snooping bindings.","id":"Q107"},{"concept_id":"Spoofing Attacks:4","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by manipulating spanning-tree root election so traffic paths favor a rogue switch?","choices":["DNS poisoning","DHCP starvation","STP attack","ARP inspection"],"answer":"STP attack","explanation":"A rogue switch can advertise a better bridge identity and become root.","id":"Q108"},{"concept_id":"Sniffing Tools:5","variant":1,"category":"Sniffing Tools","question":"What flag is used for disabling name resolution in tcpdump for faster numeric output?","choices":["-w","-X","-r","-n"],"answer":"-n","explanation":"`-n` prevents address-to-name resolution.","id":"Q109"},{"concept_id":"MAC Attacks:9","variant":1,"category":"MAC Attacks","question":"What term describes moving a specific victim MAC mapping toward the attacker's switch port?","choices":["DHCP starvation","DNS cache poisoning","MAC flooding","Switch port stealing"],"answer":"Switch port stealing","explanation":"Port stealing targets a specific learned MAC location rather than exhausting the whole CAM table.","id":"Q110"},{"concept_id":"DHCP Attacks:13","variant":1,"category":"DHCP Attacks","question":"What term describes recording trusted MAC, IP, VLAN, interface, and lease information for clients?","choices":["DHCP snooping binding table","DNS cache","TCP session table","STP topology table"],"answer":"DHCP snooping binding table","explanation":"The binding database is also used by controls such as DAI and IP Source Guard.","id":"Q440"},{"concept_id":"ARP Poisoning:6","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by sending forged ARP mappings with a focused dsniff utility?","choices":["NetScanTools Pro","Yersinia","macof","arpspoof"],"answer":"arpspoof","explanation":"arpspoof is a dsniff tool for ARP spoofing.","id":"Q112"},{"concept_id":"Sniffing Detection Techniques:10","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes collecting frames marked as errors, warnings, notes, or chat-level events?","choices":["Follow TCP Stream","Capture Options","Protocol Hierarchy","Wireshark Expert Information"],"answer":"Wireshark Expert Information","explanation":"Expert Information highlights packets Wireshark considers noteworthy.","id":"Q113"},{"concept_id":"DNS Poisoning:8","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with controlling how long a poisoned DNS answer can remain reusable after acceptance?","choices":["ARP opcode","DNS cache TTL","DHCP relay address","STP path cost"],"answer":"DNS cache TTL","explanation":"TTL determines cache lifetime.","id":"Q114"},{"concept_id":"Sniffing Concepts:1","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with a NIC forwarding frames to the OS even when the destination MAC is different?","choices":["Monitor mode","Promiscuous mode","Half-duplex mode","Trunk mode"],"answer":"Promiscuous mode","explanation":"Promiscuous mode disables normal destination-MAC filtering on the NIC.","id":"Q115"},{"concept_id":"Sniffing Countermeasures:13","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides rejecting forged DNS data through cryptographic validation?","choices":["DHCP Snooping","Root Guard","DNSSEC","Port Security"],"answer":"DNSSEC","explanation":"DNSSEC protects DNS authenticity and integrity.","id":"Q469"},{"concept_id":"DNS Poisoning:7","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by adding connection state that makes simple response injection harder than connectionless UDP?","choices":["DHCP over TLS","ARP over UDP","STP over TCP","DNS over TCP"],"answer":"DNS over TCP","explanation":"TCP requires a valid connection state before the DNS response can be accepted.","id":"Q117"},{"concept_id":"DHCP Attacks:8","variant":1,"category":"DHCP Attacks","question":"What term describes supplying clients with attacker-controlled gateway, DNS, or address settings?","choices":["Port security","Rogue DHCP server","DHCP starvation","MAC flooding"],"answer":"Rogue DHCP server","explanation":"A rogue server wins the DHCP race and pushes malicious network configuration.","id":"Q118"},{"concept_id":"Sniffing Tools:12","variant":0,"category":"Sniffing Tools","question":"Which concept best matches scanning an IP range for likely promiscuous-mode interfaces?","choices":["macof","Yersinia","Ettercap","NetScanTools Pro"],"answer":"NetScanTools Pro","explanation":"The CEH notes list its Promiscuous Mode Scanner.","id":"Q119"},{"concept_id":"Spoofing Attacks:0","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by impersonating another endpoint by reusing its layer-2 address?","choices":["DNS poisoning","DHCP starvation","MAC spoofing","MAC flooding"],"answer":"MAC spoofing","explanation":"MAC spoofing abuses trust based on hardware identity.","id":"Q120"},{"concept_id":"Sniffing Tools:8","variant":2,"category":"Sniffing Tools","question":"Which command setting best matches writing tcpdump packets to a PCAP file?","choices":["-X","-n","-r","-w"],"answer":"-w","explanation":"`-w` saves the capture.","id":"Q121"},{"concept_id":"Sniffing Detection Techniques:9","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes indicating a possible attempt to alter STP root placement?","choices":["Unexpected superior BPDU","Normal DHCP renewal","Valid DNS response","Stable ARP entry"],"answer":"Unexpected superior BPDU","explanation":"Superior BPDUs on the wrong port can indicate a rogue-switch/root attack.","id":"Q122"},{"concept_id":"Spoofing Attacks:5","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by the control message used by switches to exchange spanning-tree election and topology information?","choices":["BPDU","ARP reply","DHCPACK","DNS TXT"],"answer":"BPDU","explanation":"STP uses Bridge Protocol Data Units.","id":"Q123"},{"concept_id":"Sniffing Concepts:10","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with the actual carried data above protocol headers in a captured packet?","choices":["Frame check sequence","TCP checksum","Ethernet preamble","Payload"],"answer":"Payload","explanation":"The payload contains the higher-layer data transported by the packet.","id":"Q124"},{"concept_id":"Sniffing Tools:11","variant":2,"category":"Sniffing Tools","question":"Which option is most directly associated with providing negotiated TLS secrets to Wireshark for authorized decryption of modern sessions?","choices":["CAM export","Pre-master/session key log","DHCP snooping table","STP log"],"answer":"Pre-master/session key log","explanation":"Modern ephemeral TLS is commonly decrypted with logged session secrets.","id":"Q125"},{"concept_id":"ARP Poisoning:5","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by keeping intercepted MITM traffic moving onward to the real destination?","choices":["DNS recursion","BPDU Guard","IP forwarding","Port Security"],"answer":"IP forwarding","explanation":"Without forwarding, redirected traffic stops at the attacker and breaks the victim connection.","id":"Q126"},{"concept_id":"DNS Poisoning:10","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with the mapping-file structure used by Ettercap DNS spoofing for names, record types, and addresses?","choices":["PCAP structure","DNS zone-style config","STP topology file","DHCP lease database"],"answer":"DNS zone-style config","explanation":"Ettercap's spoof mappings resemble DNS zone-file entries.","id":"Q127"},{"concept_id":"Sniffing Detection Techniques:8","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with showing an ARP claim inconsistent with trusted IP/MAC/interface bindings?","choices":["SPAN configuration","DNSSEC trust anchor","DAI violation log","HSTS event"],"answer":"DAI violation log","explanation":"DAI logs rejected forged ARP packets.","id":"Q128"},{"concept_id":"Sniffing Detection Techniques:12","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with visualizing bursts and timing anomalies across a capture?","choices":["DNS zone","ARP cache","I/O Graph","CAM table"],"answer":"I/O Graph","explanation":"Wireshark I/O graphs reveal traffic-rate changes over time.","id":"Q129"},{"concept_id":"Sniffing Countermeasures:0","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses replacing Telnet with encrypted remote-login traffic?","choices":["SNMPv2c","FTP","TFTP","SSH"],"answer":"SSH","explanation":"SSH protects credentials and terminal data from passive sniffing.","id":"Q130"},{"concept_id":"DHCP Attacks:7","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with exhausting a DHCP scope with forged lease requests so legitimate users cannot obtain addresses?","choices":["MAC spoofing","ARP poisoning","Rogue DHCP","DHCP starvation"],"answer":"DHCP starvation","explanation":"Starvation is a DHCP denial-of-service attack against address availability.","id":"Q131"},{"concept_id":"DNS Poisoning:6","variant":0,"category":"DNS Poisoning","question":"Which concept best matches forcing endpoints to use approved internal DNS infrastructure instead of arbitrary external resolvers?","choices":["Static MAC filtering only","Hub forwarding","Open resolver policy","Local DNS resolver policy"],"answer":"Local DNS resolver policy","explanation":"Centralized DNS enables validation, logging, and consistent controls.","id":"Q132"},{"concept_id":"MAC Attacks:3","variant":1,"category":"MAC Attacks","question":"What term describes a MAC address whose U/L bit is set to 1?","choices":["Locally administered MAC","Multicast MAC","Globally unique MAC","OUI-only address"],"answer":"Locally administered MAC","explanation":"The U/L bit marks whether the MAC is locally administered.","id":"Q133"},{"concept_id":"Sniffing Tools:9","variant":1,"category":"Sniffing Tools","question":"What flag is used for reading a saved PCAP file with tcpdump?","choices":["-s","-w","-r","-i"],"answer":"-r","explanation":"`-r` reads packets from a capture file.","id":"Q134"},{"concept_id":"Sniffing Countermeasures:8","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for restricting network access to trusted source or destination ranges?","choices":["BPF on the sniffer","ACL","SPAN","Hub"],"answer":"ACL","explanation":"Access-control lists limit which systems may communicate.","id":"Q135"},{"concept_id":"Sniffing Tools:6","variant":0,"category":"Sniffing Tools","question":"Which option or command performs displaying packet contents in hex and ASCII with tcpdump?","choices":["-r","-n","-X","-w"],"answer":"-X","explanation":"`-X` exposes packet bytes for payload inspection.","id":"Q136"},{"concept_id":"Sniffing Concepts:14","variant":1,"category":"Sniffing Concepts","question":"What term describes dedicated capture equipment that can sustain heavy traffic with fewer packet drops than host software?","choices":["Software firewall","Hardware protocol analyzer","DNS resolver","DHCP relay"],"answer":"Hardware protocol analyzer","explanation":"Dedicated analyzers capture and decode traffic without altering the segment and can handle overload better.","id":"Q137"},{"concept_id":"ARP Poisoning:13","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by abusing captured session information after gaining an ARP-based MITM position?","choices":["DHCP snooping","DNSSEC signing","Session hijacking","Port security"],"answer":"Session hijacking","explanation":"Intercepted sessions can expose tokens or other authentication state.","id":"Q138"},{"concept_id":"Spoofing Attacks:8","variant":1,"category":"Spoofing Attacks","question":"What term describes the default bridge-priority value listed in the supplied CEH notes?","choices":["65535","32769","4096","32768"],"answer":"32769","explanation":"The provided chapter explicitly lists 32769 as the default value to remember.","id":"Q139"},{"concept_id":"Sniffing Concepts:7","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches mapping IPv4 addresses to local MAC addresses on an endpoint?","choices":["CAM table","ARP cache","DNS cache","Routing table"],"answer":"ARP cache","explanation":"ARP resolves local IPv4 peers to Ethernet MAC addresses.","id":"Q140"},{"concept_id":"Spoofing Attacks:11","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with blocking source IP/MAC combinations that do not match trusted binding information?","choices":["SPAN","Protocol Hierarchy","TAP","IP Source Guard"],"answer":"IP Source Guard","explanation":"IP Source Guard can use DHCP snooping data to enforce source identity.","id":"Q141"},{"concept_id":"Spoofing Attacks:9","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by shutting or err-disabling a PortFast edge port when a BPDU arrives?","choices":["BPDU Guard","Loop Guard","UDLD","Root Guard"],"answer":"BPDU Guard","explanation":"BPDU Guard treats bridge control traffic on an edge port as a violation.","id":"Q142"},{"concept_id":"ARP Poisoning:8","variant":0,"category":"ARP Poisoning","question":"Which concept best matches an ARP-poisoning/MITM framework listed in the CEH material?","choices":["Hashcat","Nessus","bettercap","Cutter"],"answer":"bettercap","explanation":"bettercap is one of the listed ARP poisoning tools.","id":"Q143"},{"concept_id":"MAC Attacks:6","variant":1,"category":"MAC Attacks","question":"What term describes limiting how many or which MAC addresses may be learned on an access port?","choices":["DHCP relay","Port Security","DNSSEC","Root Guard"],"answer":"Port Security","explanation":"Port security mitigates MAC flooding and MAC spoofing on access ports.","id":"Q144"},{"concept_id":"MAC Attacks:8","variant":3,"category":"MAC Attacks","question":"Which concept is defined by enabling Cisco port-security behavior on the current interface?","choices":["spanning-tree portfast","ip dhcp snooping","switchport port-security","ip arp inspection"],"answer":"switchport port-security","explanation":"This interface command enables port security.","id":"Q145"},{"concept_id":"DHCP Attacks:5","variant":1,"category":"DHCP Attacks","question":"What term describes a client voluntarily relinquishing its leased address?","choices":["DHCPOFFER","DHCPInform","DHCPDecline","DHCPRelease"],"answer":"DHCPRelease","explanation":"Release returns the address to the DHCP pool.","id":"Q146"},{"concept_id":"Sniffing Countermeasures:4","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for encrypting wireless traffic instead of relying on open Wi-Fi or MAC filtering?","choices":["WEP only","Open Wi-Fi","Hidden SSID only","WPA2/WPA3"],"answer":"WPA2/WPA3","explanation":"Strong Wi-Fi encryption reduces local packet-sniffing exposure.","id":"Q147"},{"concept_id":"ARP Poisoning:0","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with mapping a known local IPv4 address to an Ethernet MAC address?","choices":["STP","ARP","DNS","DHCP"],"answer":"ARP","explanation":"ARP supplies the destination MAC needed for local IPv4 Ethernet delivery.","id":"Q148"},{"concept_id":"DHCP Attacks:2","variant":0,"category":"DHCP Attacks","question":"Which concept best matches the client's message selecting or requesting an offered lease?","choices":["DHCPOFFER","DHCPRelease","DHCPREQUEST","DHCPACK"],"answer":"DHCPREQUEST","explanation":"Request follows an offer in DORA.","id":"Q149"},{"concept_id":"MAC Attacks:13","variant":0,"category":"MAC Attacks","question":"Which concept best matches the switch characteristic that makes MAC flooding possible?","choices":["Static-only MAC entries","Mandatory Ethernet encryption","Absence of VLAN support","Finite CAM capacity"],"answer":"Finite CAM capacity","explanation":"A finite dynamic MAC table can be intentionally consumed by fake source identities.","id":"Q150"}],[{"concept_id":"Sniffing Concepts:2","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with observing traffic on a shared medium without injecting extra packets?","choices":["Passive sniffing","Switch port stealing","Active sniffing","ARP poisoning"],"answer":"Passive sniffing","explanation":"Passive sniffing is naturally suited to hub/shared-Ethernet environments and is comparatively stealthy.","id":"Q151"},{"concept_id":"Sniffing Concepts:6","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by mapping learned MAC addresses to switch ports and VLAN context?","choices":["DHCP scope","ARP cache","CAM table","DNS cache"],"answer":"CAM table","explanation":"The CAM table is the switch's MAC-to-port forwarding database.","id":"Q152"},{"concept_id":"ARP Poisoning:12","variant":0,"category":"ARP Poisoning","question":"Which concept best matches monitoring MAC-to-IP mapping changes to expose ARP anomalies?","choices":["arpspoof","sslstrip","macof","arpwatch"],"answer":"arpwatch","explanation":"arpwatch is defensive monitoring rather than a poisoning tool.","id":"Q153"},{"concept_id":"Spoofing Attacks:11","variant":1,"category":"Spoofing Attacks","question":"What term describes blocking source IP/MAC combinations that do not match trusted binding information?","choices":["IP Source Guard","SPAN","Protocol Hierarchy","TAP"],"answer":"IP Source Guard","explanation":"IP Source Guard can use DHCP snooping data to enforce source identity.","id":"Q154"},{"concept_id":"DNS Poisoning:9","variant":1,"category":"DNS Poisoning","question":"What term describes the Ettercap plugin that forges DNS responses from configured name mappings?","choices":["arpwatch","dns_spoof","dhcp_snoop","macof"],"answer":"dns_spoof","explanation":"The supplementary material uses Ettercap's dns_spoof plugin.","id":"Q155"},{"concept_id":"ARP Poisoning:4","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by placing a false IP-to-MAC mapping into another host's ARP cache?","choices":["MAC flooding","DNS poisoning","ARP poisoning","DHCP starvation"],"answer":"ARP poisoning","explanation":"ARP poisoning redirects local Ethernet traffic by corrupting address resolution.","id":"Q156"},{"concept_id":"Sniffing Countermeasures:6","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides pinning stable critical IP/MAC mappings to resist local ARP cache poisoning?","choices":["SPAN","Dynamic DNS","Static ARP entries","DHCP relay"],"answer":"Static ARP entries","explanation":"Static mappings prevent normal dynamic overwrite of critical peers.","id":"Q157"},{"concept_id":"Sniffing Concepts:13","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches packet loss caused when mirrored source bandwidth exceeds the monitoring port capacity?","choices":["DNS recursion","ARP poisoning","Oversubscription","CAM aging"],"answer":"Oversubscription","explanation":"A SPAN destination can drop packets when it receives more mirrored traffic than it can transmit.","id":"Q158"},{"concept_id":"DHCP Attacks:10","variant":0,"category":"DHCP Attacks","question":"Which concept best matches filtering DHCP server messages according to trusted and untrusted switch ports?","choices":["DAI","DNSSEC","DHCP Snooping","Root Guard"],"answer":"DHCP Snooping","explanation":"DHCP snooping blocks rogue server responses and builds trusted lease bindings.","id":"Q233"},{"concept_id":"Sniffing Detection Techniques:10","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches collecting frames marked as errors, warnings, notes, or chat-level events?","choices":["Protocol Hierarchy","Capture Options","Follow TCP Stream","Wireshark Expert Information"],"answer":"Wireshark Expert Information","explanation":"Expert Information highlights packets Wireshark considers noteworthy.","id":"Q160"},{"concept_id":"DNS Poisoning:7","variant":1,"category":"DNS Poisoning","question":"What term describes adding connection state that makes simple response injection harder than connectionless UDP?","choices":["DNS over TCP","DHCP over TLS","STP over TCP","ARP over UDP"],"answer":"DNS over TCP","explanation":"TCP requires a valid connection state before the DNS response can be accepted.","id":"Q161"},{"concept_id":"MAC Attacks:10","variant":0,"category":"MAC Attacks","question":"Which concept best matches cloning or changing a client MAC identity to impersonate an authorized endpoint?","choices":["STP root attack","MAC flooding","DHCP starvation","MAC spoofing"],"answer":"MAC spoofing","explanation":"MAC spoofing reuses a layer-2 identity rather than generating thousands of addresses.","id":"Q430"},{"concept_id":"ARP Poisoning:10","variant":1,"category":"ARP Poisoning","question":"What term describes the reference DAI commonly checks when validating dynamic ARP claims?","choices":["TCP connection table","DHCP snooping binding table","STP topology table","DNS cache"],"answer":"DHCP snooping binding table","explanation":"DAI compares claimed IP/MAC/interface data with trusted DHCP bindings.","id":"Q163"},{"concept_id":"Sniffing Concepts:12","variant":1,"category":"Sniffing Concepts","question":"What term describes an inline hardware device that passively copies link traffic without switch mirroring configuration?","choices":["Network TAP","SPAN","Port security","DHCP snooping"],"answer":"Network TAP","explanation":"A TAP copies traffic in hardware and is independent of a SPAN session.","id":"Q164"},{"concept_id":"Sniffing Tools:8","variant":3,"category":"Sniffing Tools","question":"Which CLI option directly enables writing tcpdump packets to a PCAP file?","choices":["-X","-w","-r","-n"],"answer":"-w","explanation":"`-w` saves the capture.","id":"Q165"},{"concept_id":"DHCP Attacks:9","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with generating DHCP starvation traffic in the supplied CEH tooling?","choices":["arpwatch","macof","tshark","Yersinia"],"answer":"Yersinia","explanation":"Yersinia is listed as a DHCP attack tool.","id":"Q166"},{"concept_id":"DNS Poisoning:2","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with inserting false records into a resolver cache so later clients receive the wrong address?","choices":["MAC flooding","ARP cache poisoning","DNS cache poisoning","DHCP starvation"],"answer":"DNS cache poisoning","explanation":"Cache poisoning persists while the false record remains cached.","id":"Q167"},{"concept_id":"Spoofing Attacks:10","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by preventing a protected port from accepting a superior root claim?","choices":["Root Guard","DHCP Snooping","BPDU Guard","DAI"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root placement.","id":"Q168"},{"concept_id":"Spoofing Attacks:13","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with forcing HTTPS and defeating classic HTTP downgrade behavior used by sslstrip?","choices":["BPDU Guard","DAI","HSTS","SNMPv3"],"answer":"HSTS","explanation":"HTTP Strict Transport Security prevents protected sites from being accessed over downgraded HTTP.","id":"Q169"},{"concept_id":"Sniffing Tools:1","variant":0,"category":"Sniffing Tools","question":"Which tool is used for providing tcpdump-style command-line packet capture on Windows?","choices":["WinDump","RITA","tshark","macof"],"answer":"WinDump","explanation":"WinDump is the Windows counterpart named in the notes.","id":"Q170"},{"concept_id":"DHCP Attacks:11","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with marking a legitimate DHCP-server-facing switch interface as trusted?","choices":["ip arp inspection validate","ip dhcp snooping trust","switchport mode access","ip dhcp snooping vlan"],"answer":"ip dhcp snooping trust","explanation":"Only trusted interfaces should be allowed to send legitimate server-side DHCP messages.","id":"Q171"},{"concept_id":"Sniffing Countermeasures:1","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for replacing plaintext FTP-style transfers with SSH-protected file transfer?","choices":["FTP","Rlogin","SFTP/SCP","TFTP"],"answer":"SFTP/SCP","explanation":"SFTP and SCP protect both authentication and file data.","id":"Q172"},{"concept_id":"Spoofing Attacks:3","variant":1,"category":"Spoofing Attacks","question":"What term describes the VLAN whose untagged trunk handling is exploited by classic double tagging?","choices":["Voice VLAN","Management VLAN","Native VLAN","Private VLAN"],"answer":"Native VLAN","explanation":"The outer tag matches the native VLAN and is removed by the first switch.","id":"Q173"},{"concept_id":"DHCP Attacks:4","variant":0,"category":"DHCP Attacks","question":"Which concept best matches a client reporting that an offered network address is already in use?","choices":["DHCPInform","DHCPDecline","DHCPNAK","DHCPRelease"],"answer":"DHCPDecline","explanation":"Decline reports an address conflict.","id":"Q174"},{"concept_id":"Spoofing Attacks:1","variant":1,"category":"Spoofing Attacks","question":"What term describes forming an unauthorized trunk by pretending to be a switching peer?","choices":["ARP poisoning","DHCP starvation","Double tagging","Switch spoofing"],"answer":"Switch spoofing","explanation":"Switch spoofing is one of the two VLAN-hopping techniques.","id":"Q175"},{"concept_id":"MAC Attacks:4","variant":0,"category":"MAC Attacks","question":"Which concept best matches the direct resource goal of MAC flooding?","choices":["DNS cache poisoning","DHCP pool exhaustion","STP root election","CAM table exhaustion"],"answer":"CAM table exhaustion","explanation":"MAC flooding consumes the finite MAC-learning capacity of the switch.","id":"Q176"},{"concept_id":"Sniffing Countermeasures:11","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses blocking forged ARP claims that conflict with trusted bindings?","choices":["HSTS","Dynamic ARP Inspection","Port Security","DNSSEC"],"answer":"Dynamic ARP Inspection","explanation":"DAI validates ARP packets against authoritative binding data.","id":"Q177"},{"concept_id":"DHCP Attacks:3","variant":1,"category":"DHCP Attacks","question":"What term describes the server's confirmation that finalizes the accepted lease?","choices":["DHCPInform","DHCPREQUEST","DHCPDecline","DHCPACK"],"answer":"DHCPACK","explanation":"ACK completes successful address assignment.","id":"Q178"},{"concept_id":"Sniffing Tools:7","variant":2,"category":"Sniffing Tools","question":"Which command setting best matches requesting full-packet capture instead of snapshot truncation in tcpdump?","choices":["-n","-vvv","-s 0","-i any"],"answer":"-s 0","explanation":"`-s 0` captures the complete packet according to the supplied notes.","id":"Q179"},{"concept_id":"DNS Poisoning:4","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with making blind forged DNS responses harder to match to outstanding resolver queries?","choices":["Fixed UDP source port 53","Longer ARP timeout","Source-port randomization","Static STP priority"],"answer":"Source-port randomization","explanation":"Unpredictable source ports add entropy to each DNS query.","id":"Q180"},{"concept_id":"MAC Attacks:0","variant":0,"category":"MAC Attacks","question":"Which concept best matches the first three bytes of a standard MAC address identifying the vendor allocation?","choices":["VLAN ID","ARP opcode","OUI","NIC-specific portion"],"answer":"OUI","explanation":"The OUI is the vendor-assigned first 24 bits of a MAC address.","id":"Q181"},{"concept_id":"Sniffing Concepts:11","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by Cisco switch-based port mirroring to a monitoring interface?","choices":["DAI","SPAN","UDLD","HSRP"],"answer":"SPAN","explanation":"SPAN stands for Switched Port Analyzer and copies selected traffic to a monitor port.","id":"Q182"},{"concept_id":"Sniffing Detection Techniques:9","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with indicating a possible attempt to alter STP root placement?","choices":["Valid DNS response","Stable ARP entry","Unexpected superior BPDU","Normal DHCP renewal"],"answer":"Unexpected superior BPDU","explanation":"Superior BPDUs on the wrong port can indicate a rogue-switch/root attack.","id":"Q183"},{"concept_id":"Sniffing Countermeasures:2","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports protecting web forms and sessions from plaintext packet capture?","choices":["NNTP","HTTP","Telnet","HTTPS"],"answer":"HTTPS","explanation":"HTTPS adds TLS encryption to HTTP.","id":"Q184"},{"concept_id":"Sniffing Countermeasures:0","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports replacing Telnet with encrypted remote-login traffic?","choices":["FTP","SSH","TFTP","SNMPv2c"],"answer":"SSH","explanation":"SSH protects credentials and terminal data from passive sniffing.","id":"Q185"},{"concept_id":"Sniffing Tools:6","variant":3,"category":"Sniffing Tools","question":"Which CLI option directly enables displaying packet contents in hex and ASCII with tcpdump?","choices":["-X","-n","-w","-r"],"answer":"-X","explanation":"`-X` exposes packet bytes for payload inspection.","id":"Q186"},{"concept_id":"Sniffing Detection Techniques:0","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with probing a suspect with the correct IP but an incorrect destination MAC and watching for an unexpected reply?","choices":["Ping method","ARP method","DHCP method","DNS method"],"answer":"Ping method","explanation":"A promiscuous NIC may pass the wrong-MAC frame to the IP stack.","id":"Q187"},{"concept_id":"ARP Poisoning:3","variant":0,"category":"ARP Poisoning","question":"Which concept best matches advertising an IP-to-MAC mapping without waiting for a matching request?","choices":["DHCPInform","Gratuitous ARP","ARP probe over TCP","Signed ARP"],"answer":"Gratuitous ARP","explanation":"Unsolicited ARP messages can update caches and are useful for poisoning.","id":"Q252"},{"concept_id":"Sniffing Detection Techniques:2","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by using a non-broadcast ARP plus a follow-up ping to test whether a promiscuous host cached data it should not have seen?","choices":["DNS method","Ping method","ARP method","DHCP method"],"answer":"ARP method","explanation":"The ARP method relies on promiscuous processing of unusual layer-2 traffic.","id":"Q189"},{"concept_id":"DHCP Attacks:7","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by exhausting a DHCP scope with forged lease requests so legitimate users cannot obtain addresses?","choices":["MAC spoofing","ARP poisoning","DHCP starvation","Rogue DHCP"],"answer":"DHCP starvation","explanation":"Starvation is a DHCP denial-of-service attack against address availability.","id":"Q190"},{"concept_id":"ARP Poisoning:1","variant":1,"category":"ARP Poisoning","question":"What term describes broadcasting a query when a host knows an IP address but not the corresponding MAC?","choices":["ARP reply","DHCPACK","ARP request","DNS answer"],"answer":"ARP request","explanation":"ARP requests are broadcast on the local segment.","id":"Q191"},{"concept_id":"Sniffing Concepts:3","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by manipulating a switched network so otherwise hidden traffic becomes visible?","choices":["Passive sniffing","Static routing","Active sniffing","Offline PCAP analysis"],"answer":"Active sniffing","explanation":"Active sniffing injects or manipulates traffic to defeat normal switch isolation.","id":"Q192"},{"concept_id":"DNS Poisoning:0","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with corrupting hostname-to-IP resolution so clients connect to an attacker-chosen address?","choices":["DHCP starvation","DNS poisoning","ARP poisoning","MAC flooding"],"answer":"DNS poisoning","explanation":"DNS poisoning changes name resolution rather than local IP-to-MAC resolution.","id":"Q193"},{"concept_id":"MAC Attacks:11","variant":3,"category":"MAC Attacks","question":"Which concept is defined by a switch updating a known MAC to a new ingress port after seeing that source address there?","choices":["DHCP renewal","MAC relearning","TLS resumption","DNS recursion"],"answer":"MAC relearn
