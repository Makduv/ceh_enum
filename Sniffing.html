hich option is most directly associated with forming an unauthorized trunk by pretending to be a switching peer?","choices":["DHCP starvation","Switch spoofing","ARP poisoning","Double tagging"],"answer":"Switch spoofing","explanation":"Switch spoofing is one of the two VLAN-hopping techniques.","id":"Q402"},{"concept_id":"MAC Attacks:5","variant":1,"category":"MAC Attacks","question":"What term describes flooding a switch with many randomized MAC/IP identities to stress the CAM table?","choices":["Yersinia","arpspoof","NetScanTools Pro","macof"],"answer":"macof","explanation":"macof is the classic dsniff utility for MAC flooding.","id":"Q403"},{"concept_id":"Sniffing Concepts:8","variant":1,"category":"Sniffing Concepts","question":"What term describes preventing traffic in another VLAN or subnet from reaching the sniffer interface by default?","choices":["Promiscuous mode","Network segmentation","Encryption","Name resolution"],"answer":"Network segmentation","explanation":"Segmentation limits which traffic reaches a capture point.","id":"Q404"},{"concept_id":"Sniffing Detection Techniques:11","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with showing traffic volume between endpoint pairs to identify unusually chatty relationships?","choices":["Conversation Statistics","Packet Bytes","Display Filter history","Protocol Hierarchy"],"answer":"Conversation Statistics","explanation":"Conversation statistics summarize endpoint-pair traffic.","id":"Q405"},{"concept_id":"Sniffing Tools:9","variant":2,"category":"Sniffing Tools","question":"Which command setting best matches reading a saved PCAP file with tcpdump?","choices":["-s","-w","-i","-r"],"answer":"-r","explanation":"`-r` reads packets from a capture file.","id":"Q406"},{"concept_id":"ARP Poisoning:3","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by advertising an IP-to-MAC mapping without waiting for a matching request?","choices":["DHCPInform","ARP probe over TCP","Signed ARP","Gratuitous ARP"],"answer":"Gratuitous ARP","explanation":"Unsolicited ARP messages can update caches and are useful for poisoning.","id":"Q407"},{"concept_id":"DHCP Attacks:4","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by a client reporting that an offered network address is already in use?","choices":["DHCPDecline","DHCPRelease","DHCPNAK","DHCPInform"],"answer":"DHCPDecline","explanation":"Decline reports an address conflict.","id":"Q408"},{"concept_id":"Spoofing Attacks:0","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with impersonating another endpoint by reusing its layer-2 address?","choices":["DNS poisoning","DHCP starvation","MAC spoofing","MAC flooding"],"answer":"MAC spoofing","explanation":"MAC spoofing abuses trust based on hardware identity.","id":"Q409"},{"concept_id":"ARP Poisoning:7","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by combining ARP poisoning with broader MITM and DNS-spoofing capabilities?","choices":["WinDump","Ettercap","PRTG","RITA"],"answer":"Ettercap","explanation":"Ettercap is a multipurpose MITM and sniffing framework.","id":"Q410"},{"concept_id":"Sniffing Concepts:13","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with packet loss caused when mirrored source bandwidth exceeds the monitoring port capacity?","choices":["DNS recursion","ARP poisoning","CAM aging","Oversubscription"],"answer":"Oversubscription","explanation":"A SPAN destination can drop packets when it receives more mirrored traffic than it can transmit.","id":"Q411"},{"concept_id":"Sniffing Tools:10","variant":2,"category":"Sniffing Tools","question":"Which option is most directly associated with isolating and reconstructing one TCP conversation in Wireshark?","choices":["Follow TCP Stream","Protocol Hierarchy","Capture Options","Expert Information"],"answer":"Follow TCP Stream","explanation":"Follow TCP Stream filters unrelated frames and reconstructs the exchange.","id":"Q412"},{"concept_id":"Sniffing Tools:7","variant":0,"category":"Sniffing Tools","question":"Which option or command performs requesting full-packet capture instead of snapshot truncation in tcpdump?","choices":["-s 0","-n","-i any","-vvv"],"answer":"-s 0","explanation":"`-s 0` captures the complete packet according to the supplied notes.","id":"Q413"},{"concept_id":"Spoofing Attacks:6","variant":1,"category":"Spoofing Attacks","question":"What term describes the STP election value combining bridge priority and MAC address?","choices":["ARP cache entry","DNS transaction ID","Bridge ID","DHCP binding"],"answer":"Bridge ID","explanation":"The bridge with the lowest BID wins root election.","id":"Q414"},{"concept_id":"Sniffing Tools:3","variant":0,"category":"Sniffing Tools","question":"Which tool is used for interactively browsing captured frames and decoding the full protocol stack in a GUI?","choices":["DHCPig","Yersinia","macof","Wireshark"],"answer":"Wireshark","explanation":"Wireshark is the standard graphical packet analyzer.","id":"Q415"},{"concept_id":"Spoofing Attacks:3","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with the VLAN whose untagged trunk handling is exploited by classic double tagging?","choices":["Private VLAN","Native VLAN","Management VLAN","Voice VLAN"],"answer":"Native VLAN","explanation":"The outer tag matches the native VLAN and is removed by the first switch.","id":"Q416"},{"concept_id":"MAC Attacks:1","variant":0,"category":"MAC Attacks","question":"Which concept best matches the final three bytes of a standard MAC address identifying the interface within a vendor block?","choices":["IPv4 network portion","OUI","Bridge priority","NIC-specific portion"],"answer":"NIC-specific portion","explanation":"The final 24 bits identify the interface within the OUI allocation.","id":"Q417"},{"concept_id":"DNS Poisoning:8","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by controlling how long a poisoned DNS answer can remain reusable after acceptance?","choices":["ARP opcode","STP path cost","DHCP relay address","DNS cache TTL"],"answer":"DNS cache TTL","explanation":"TTL determines cache lifetime.","id":"Q418"},{"concept_id":"ARP Poisoning:14","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with monitoring voice traffic after ARP-based traffic redirection or mirroring?","choices":["SMTP relaying","DNS tunneling","SNMP polling","VoIP call tapping"],"answer":"VoIP call tapping","explanation":"The CEH notes list VoIP call tapping as a threat enabled by ARP poisoning.","id":"Q419"},{"concept_id":"ARP Poisoning:10","variant":0,"category":"ARP Poisoning","question":"Which concept best matches the reference DAI commonly checks when validating dynamic ARP claims?","choices":["DHCP snooping binding table","DNS cache","STP topology table","TCP connection table"],"answer":"DHCP snooping binding table","explanation":"DAI compares claimed IP/MAC/interface data with trusted DHCP bindings.","id":"Q420"},{"concept_id":"Sniffing Detection Techniques:4","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by alerting on suspicious MAC-to-IP mapping changes and flips?","choices":["sslstrip","macof","DHCPig","arpwatch"],"answer":"arpwatch","explanation":"ARP mapping changes are a strong clue of spoofing-based sniffing.","id":"Q421"},{"concept_id":"MAC Attacks:2","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with a MAC address whose I/G bit is set to 1?","choices":["Multicast MAC","Unicast MAC","Globally unique MAC","Locally administered MAC"],"answer":"Multicast MAC","explanation":"The low-order I/G bit distinguishes group/multicast from individual/unicast addressing.","id":"Q422"},{"concept_id":"DNS Poisoning:10","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by the mapping-file structure used by Ettercap DNS spoofing for names, record types, and addresses?","choices":["DNS zone-style config","DHCP lease database","STP topology file","PCAP structure"],"answer":"DNS zone-style config","explanation":"Ettercap's spoof mappings resemble DNS zone-file entries.","id":"Q423"},{"concept_id":"ARP Poisoning:1","variant":0,"category":"ARP Poisoning","question":"Which concept best matches broadcasting a query when a host knows an IP address but not the corresponding MAC?","choices":["ARP reply","DHCPACK","DNS answer","ARP request"],"answer":"ARP request","explanation":"ARP requests are broadcast on the local segment.","id":"Q424"},{"concept_id":"Sniffing Countermeasures:0","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for replacing Telnet with encrypted remote-login traffic?","choices":["FTP","SSH","SNMPv2c","TFTP"],"answer":"SSH","explanation":"SSH protects credentials and terminal data from passive sniffing.","id":"Q425"},{"concept_id":"DNS Poisoning:1","variant":0,"category":"DNS Poisoning","question":"Which concept best matches forging DNS answers on a switched LAN after obtaining local traffic visibility?","choices":["Intranet DNS spoofing","Offline zone signing","Proxy DNS poisoning","Internet DNS spoofing"],"answer":"Intranet DNS spoofing","explanation":"The supplied flow uses local MITM positioning before forged DNS responses.","id":"Q426"},{"concept_id":"DNS Poisoning:7","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with adding connection state that makes simple response injection harder than connectionless UDP?","choices":["DHCP over TLS","ARP over UDP","STP over TCP","DNS over TCP"],"answer":"DNS over TCP","explanation":"TCP requires a valid connection state before the DNS response can be accepted.","id":"Q427"},{"concept_id":"DHCP Attacks:2","variant":1,"category":"DHCP Attacks","question":"What term describes the client's message selecting or requesting an offered lease?","choices":["DHCPOFFER","DHCPACK","DHCPRelease","DHCPREQUEST"],"answer":"DHCPREQUEST","explanation":"Request follows an offer in DORA.","id":"Q428"},{"concept_id":"Spoofing Attacks:10","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches preventing a protected port from accepting a superior root claim?","choices":["Root Guard","DHCP Snooping","DAI","BPDU Guard"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root placement.","id":"Q429"},{"concept_id":"MAC Attacks:8","variant":0,"category":"MAC Attacks","question":"Which concept best matches enabling Cisco port-security behavior on the current interface?","choices":["ip arp inspection","switchport port-security","spanning-tree portfast","ip dhcp snooping"],"answer":"switchport port-security","explanation":"This interface command enables port security.","id":"Q162"},{"concept_id":"Sniffing Concepts:1","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches a NIC forwarding frames to the OS even when the destination MAC is different?","choices":["Trunk mode","Half-duplex mode","Monitor mode","Promiscuous mode"],"answer":"Promiscuous mode","explanation":"Promiscuous mode disables normal destination-MAC filtering on the NIC.","id":"Q431"},{"concept_id":"Sniffing Concepts:12","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with an inline hardware device that passively copies link traffic without switch mirroring configuration?","choices":["DHCP snooping","Port security","Network TAP","SPAN"],"answer":"Network TAP","explanation":"A TAP copies traffic in hardware and is independent of a SPAN session.","id":"Q432"},{"concept_id":"DNS Poisoning:12","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with blocking endpoints from sending direct DNS requests to unauthorized external servers?","choices":["Open DNS recursion","Firewall DNS restriction","Disable HTTPS","Hub deployment"],"answer":"Firewall DNS restriction","explanation":"Firewall policy can force endpoints through approved resolvers.","id":"Q433"},{"concept_id":"MAC Attacks:7","variant":0,"category":"MAC Attacks","question":"Which concept best matches placing a Cisco interface in access mode before applying access-port security?","choices":["switchport mode trunk","switchport mode access","spanning-tree guard root","ip dhcp snooping trust"],"answer":"switchport mode access","explanation":"The supplied Cisco sequence sets access mode before enabling port security.","id":"Q434"},{"concept_id":"MAC Attacks:3","variant":3,"category":"MAC Attacks","question":"Which concept is defined by a MAC address whose U/L bit is set to 1?","choices":["OUI-only address","Multicast MAC","Globally unique MAC","Locally administered MAC"],"answer":"Locally administered MAC","explanation":"The U/L bit marks whether the MAC is locally administered.","id":"Q435"},{"concept_id":"Sniffing Concepts:0","variant":1,"category":"Sniffing Concepts","question":"What term describes capturing and analyzing packets traversing a network?","choices":["Packet sniffing","Vulnerability scanning","Route enumeration","Port scanning"],"answer":"Packet sniffing","explanation":"Packet sniffing monitors network traffic so packet headers and payloads can be inspected.","id":"Q436"},{"concept_id":"ARP Poisoning:4","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with placing a false IP-to-MAC mapping into another host's ARP cache?","choices":["DHCP starvation","MAC flooding","DNS poisoning","ARP poisoning"],"answer":"ARP poisoning","explanation":"ARP poisoning redirects local Ethernet traffic by corrupting address resolution.","id":"Q437"},{"concept_id":"Sniffing Countermeasures:11","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for blocking forged ARP claims that conflict with trusted bindings?","choices":["DNSSEC","Dynamic ARP Inspection","HSTS","Port Security"],"answer":"Dynamic ARP Inspection","explanation":"DAI validates ARP packets against authoritative binding data.","id":"Q438"},{"concept_id":"Sniffing Countermeasures:2","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for protecting web forms and sessions from plaintext packet capture?","choices":["NNTP","HTTP","HTTPS","Telnet"],"answer":"HTTPS","explanation":"HTTPS adds TLS encryption to HTTP.","id":"Q439"},{"concept_id":"DHCP Attacks:12","variant":1,"category":"DHCP Attacks","question":"What term describes limiting DHCP packets per second on an access port to reduce starvation?","choices":["ip dhcp snooping limit rate","no ip dhcp snooping information option","show ip dhcp snooping","ip dhcp snooping trust"],"answer":"ip dhcp snooping limit rate","explanation":"Rate limiting constrains request floods.","id":"Q111"},{"concept_id":"Sniffing Countermeasures:5","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for creating an encrypted tunnel across an untrusted local or public network?","choices":["Hub","ARP cache","VPN","CAM table"],"answer":"VPN","explanation":"A VPN protects traffic even when the access network cannot be trusted.","id":"Q441"},{"concept_id":"DHCP Attacks:0","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by the client's initial broadcast looking for DHCP servers?","choices":["DHCPOFFER","DHCPDISCOVER","DHCPACK","DHCPREQUEST"],"answer":"DHCPDISCOVER","explanation":"Discover begins the DORA lease exchange.","id":"Q442"},{"concept_id":"Sniffing Detection Techniques:10","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by collecting frames marked as errors, warnings, notes, or chat-level events?","choices":["Wireshark Expert Information","Capture Options","Protocol Hierarchy","Follow TCP Stream"],"answer":"Wireshark Expert Information","explanation":"Expert Information highlights packets Wireshark considers noteworthy.","id":"Q443"},{"concept_id":"Sniffing Detection Techniques:1","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by looking for unusual reverse DNS lookups generated while a sniffer resolves captured IP addresses?","choices":["STP method","Ping method","ARP method","DNS method"],"answer":"DNS method","explanation":"Some sniffers create detectable PTR lookup traffic.","id":"Q444"},{"concept_id":"Spoofing Attacks:7","variant":1,"category":"Spoofing Attacks","question":"What term describes an aggressive bridge-priority value used by a rogue switch to win STP root election in the example?","choices":["Priority 0","49152","65535","32769"],"answer":"Priority 0","explanation":"A very low priority lowers the Bridge ID.","id":"Q445"},{"concept_id":"DHCP Attacks:5","variant":0,"category":"DHCP Attacks","question":"Which concept best matches a client voluntarily relinquishing its leased address?","choices":["DHCPOFFER","DHCPDecline","DHCPInform","DHCPRelease"],"answer":"DHCPRelease","explanation":"Release returns the address to the DHCP pool.","id":"Q446"},{"concept_id":"Sniffing Concepts:2","variant":1,"category":"Sniffing Concepts","question":"What term describes observing traffic on a shared medium without injecting extra packets?","choices":["Active sniffing","ARP poisoning","Switch port stealing","Passive sniffing"],"answer":"Passive sniffing","explanation":"Passive sniffing is naturally suited to hub/shared-Ethernet environments and is comparatively stealthy.","id":"Q447"},{"concept_id":"Sniffing Tools:14","variant":2,"category":"Sniffing Tools","question":"Which option is most directly associated with analyzing captures with a feature that maps public IPs geographically?","choices":["PRTG","Observer Analyzer","RITA","OmniPeek"],"answer":"OmniPeek","explanation":"The notes associate OmniPeek with displaying public IPs on a Google Map.","id":"Q448"},{"concept_id":"Sniffing Detection Techniques:3","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes locally indicating promiscuous mode on interfaces where the OS exposes that state?","choices":["TRUST flag","PROMISC flag","SNOOP flag","ROOT flag"],"answer":"PROMISC flag","explanation":"The supplementary notes mention PROMISC on macOS, while warning that OS reporting varies.","id":"Q449"},{"concept_id":"Sniffing Countermeasures:9","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses limiting MAC identities on user-facing switch ports?","choices":["S/MIME","DNSSEC","HSTS","Port Security"],"answer":"Port Security","explanation":"Port security helps mitigate MAC flooding and spoofing.","id":"Q450"}],[{"concept_id":"Sniffing Countermeasures:6","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses pinning stable critical IP/MAC mappings to resist local ARP cache poisoning?","choices":["DHCP relay","Static ARP entries","SPAN","Dynamic DNS"],"answer":"Static ARP entries","explanation":"Static mappings prevent normal dynamic overwrite of critical peers.","id":"Q451"},{"concept_id":"ARP Poisoning:2","variant":1,"category":"ARP Poisoning","question":"What term describes returning the MAC address associated with the requested local IP?","choices":["ARP request","STP BPDU","ARP reply","DHCPDISCOVER"],"answer":"ARP reply","explanation":"The host owning the IP responds with its hardware address.","id":"Q452"},{"concept_id":"Spoofing Attacks:1","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches forming an unauthorized trunk by pretending to be a switching peer?","choices":["DHCP starvation","Double tagging","ARP poisoning","Switch spoofing"],"answer":"Switch spoofing","explanation":"Switch spoofing is one of the two VLAN-hopping techniques.","id":"Q453"},{"concept_id":"DHCP Attacks:13","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with recording trusted MAC, IP, VLAN, interface, and lease information for clients?","choices":["STP topology table","DHCP snooping binding table","TCP session table","DNS cache"],"answer":"DHCP snooping binding table","explanation":"The binding database is also used by controls such as DAI and IP Source Guard.","id":"Q454"},{"concept_id":"Sniffing Countermeasures:3","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports replacing community-string SNMP versions with stronger authentication and encryption?","choices":["SNMPv1","TFTP","SNMPv2c","SNMPv3"],"answer":"SNMPv3","explanation":"SNMPv3 provides modern security controls for management traffic.","id":"Q455"},{"concept_id":"DNS Poisoning:5","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by allowing recursive DNS service only for authorized clients?","choices":["Restrict recursion","Enable open recursion","Use a hub","Disable DNSSEC"],"answer":"Restrict recursion","explanation":"Recursion access control reduces abuse and exposure.","id":"Q456"},{"concept_id":"Spoofing Attacks:5","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with the control message used by switches to exchange spanning-tree election and topology information?","choices":["DNS TXT","DHCPACK","ARP reply","BPDU"],"answer":"BPDU","explanation":"STP uses Bridge Protocol Data Units.","id":"Q457"},{"concept_id":"Sniffing Concepts:10","variant":1,"category":"Sniffing Concepts","question":"What term describes the actual carried data above protocol headers in a captured packet?","choices":["Payload","Ethernet preamble","TCP checksum","Frame check sequence"],"answer":"Payload","explanation":"The payload contains the higher-layer data transported by the packet.","id":"Q458"},{"concept_id":"ARP Poisoning:12","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by monitoring MAC-to-IP mapping changes to expose ARP anomalies?","choices":["macof","arpwatch","sslstrip","arpspoof"],"answer":"arpwatch","explanation":"arpwatch is defensive monitoring rather than a poisoning tool.","id":"Q459"},{"concept_id":"DHCP Attacks:9","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by generating DHCP starvation traffic in the supplied CEH tooling?","choices":["tshark","macof","arpwatch","Yersinia"],"answer":"Yersinia","explanation":"Yersinia is listed as a DHCP attack tool.","id":"Q460"},{"concept_id":"Spoofing Attacks:0","variant":1,"category":"Spoofing Attacks","question":"What term describes impersonating another endpoint by reusing its layer-2 address?","choices":["DHCP starvation","MAC flooding","MAC spoofing","DNS poisoning"],"answer":"MAC spoofing","explanation":"MAC spoofing abuses trust based on hardware identity.","id":"Q461"},{"concept_id":"Sniffing Countermeasures:9","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports limiting MAC identities on user-facing switch ports?","choices":["HSTS","S/MIME","Port Security","DNSSEC"],"answer":"Port Security","explanation":"Port security helps mitigate MAC flooding and spoofing.","id":"Q462"},{"concept_id":"Sniffing Concepts:1","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by a NIC forwarding frames to the OS even when the destination MAC is different?","choices":["Monitor mode","Trunk mode","Half-duplex mode","Promiscuous mode"],"answer":"Promiscuous mode","explanation":"Promiscuous mode disables normal destination-MAC filtering on the NIC.","id":"Q463"},{"concept_id":"Sniffing Concepts:7","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with mapping IPv4 addresses to local MAC addresses on an endpoint?","choices":["ARP cache","DNS cache","CAM table","Routing table"],"answer":"ARP cache","explanation":"ARP resolves local IPv4 peers to Ethernet MAC addresses.","id":"Q464"},{"concept_id":"MAC Attacks:9","variant":3,"category":"MAC Attacks","question":"Which concept is defined by moving a specific victim MAC mapping toward the attacker's switch port?","choices":["DHCP starvation","DNS cache poisoning","MAC flooding","Switch port stealing"],"answer":"Switch port stealing","explanation":"Port stealing targets a specific learned MAC location rather than exhausting the whole CAM table.","id":"Q465"},{"concept_id":"Sniffing Countermeasures:12","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides preventing an access direction from introducing a superior STP root?","choices":["BPDU Guard","Root Guard","HSTS","DAI"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root bridge.","id":"Q466"},{"concept_id":"Sniffing Tools:0","variant":3,"category":"Sniffing Tools","question":"Which tool most directly handles capturing packets from the command line on Linux and BSD?","choices":["Wireshark GUI","NetScanTools Pro","WinDump","tcpdump"],"answer":"tcpdump","explanation":"tcpdump is the classic Unix-like CLI packet capture tool.","id":"Q467"},{"concept_id":"DNS Poisoning:3","variant":1,"category":"DNS Poisoning","question":"What term describes cryptographically validating DNS record authenticity and integrity?","choices":["Port Security","DAI","DNSSEC","Root Guard"],"answer":"DNSSEC","explanation":"DNSSEC signatures allow validating resolvers to reject forged DNS data.","id":"Q468"},{"concept_id":"Sniffing Countermeasures:10","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides blocking rogue DHCP server responses and optionally rate-limiting DHCP traffic?","choices":["DNSSEC","DHCP Snooping","DAI","Root Guard"],"answer":"DHCP Snooping","explanation":"DHCP snooping protects DHCP trust at the switch.","id":"Q116"},{"concept_id":"MAC Attacks:5","variant":0,"category":"MAC Attacks","question":"Which concept best matches flooding a switch with many randomized MAC/IP identities to stress the CAM table?","choices":["macof","arpspoof","NetScanTools Pro","Yersinia"],"answer":"macof","explanation":"macof is the classic dsniff utility for MAC flooding.","id":"Q470"},{"concept_id":"ARP Poisoning:13","variant":1,"category":"ARP Poisoning","question":"What term describes abusing captured session information after gaining an ARP-based MITM position?","choices":["Session hijacking","DHCP snooping","Port security","DNSSEC signing"],"answer":"Session hijacking","explanation":"Intercepted sessions can expose tokens or other authentication state.","id":"Q471"},{"concept_id":"Sniffing Tools:7","variant":1,"category":"Sniffing Tools","question":"What flag is used for requesting full-packet capture instead of snapshot truncation in tcpdump?","choices":["-vvv","-s 0","-i any","-n"],"answer":"-s 0","explanation":"`-s 0` captures the complete packet according to the supplied notes.","id":"Q472"},{"concept_id":"DHCP Attacks:5","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with a client voluntarily relinquishing its leased address?","choices":["DHCPDecline","DHCPOFFER","DHCPInform","DHCPRelease"],"answer":"DHCPRelease","explanation":"Release returns the address to the DHCP pool.","id":"Q473"},{"concept_id":"MAC Attacks:11","variant":1,"category":"MAC Attacks","question":"What term describes a switch updating a known MAC to a new ingress port after seeing that source address there?","choices":["TLS resumption","DHCP renewal","DNS recursion","MAC relearning"],"answer":"MAC relearning","explanation":"Switches dynamically relearn source MAC locations.","id":"Q474"},{"concept_id":"ARP Poisoning:1","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with broadcasting a query when a host knows an IP address but not the corresponding MAC?","choices":["ARP reply","ARP request","DHCPACK","DNS answer"],"answer":"ARP request","explanation":"ARP requests are broadcast on the local segment.","id":"Q475"},{"concept_id":"Sniffing Concepts:11","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches Cisco switch-based port mirroring to a monitoring interface?","choices":["HSRP","SPAN","UDLD","DAI"],"answer":"SPAN","explanation":"SPAN stands for Switched Port Analyzer and copies selected traffic to a monitor port.","id":"Q476"},{"concept_id":"Sniffing Concepts:5","variant":1,"category":"Sniffing Concepts","question":"What term describes forwarding normal unicast frames only toward the learned destination port?","choices":["Network TAP","Repeater","Switch","Hub"],"answer":"Switch","explanation":"A switch uses its CAM table to limit unicast forwarding.","id":"Q477"},{"concept_id":"DHCP Attacks:2","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with the client's message selecting or requesting an offered lease?","choices":["DHCPREQUEST","DHCPRelease","DHCPACK","DHCPOFFER"],"answer":"DHCPREQUEST","explanation":"Request follows an offer in DORA.","id":"Q478"},{"concept_id":"Sniffing Tools:4","variant":3,"category":"Sniffing Tools","question":"Which concept is defined by filtering captures with primitives such as host, net, port, proto, and ether?","choices":["STIX","BPF","Sigma","YARA"],"answer":"BPF","explanation":"Berkeley Packet Filter syntax is used by tcpdump and other capture tools.","id":"Q479"},{"concept_id":"Sniffing Concepts:4","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches repeating received Ethernet traffic out every port?","choices":["Switch","Router","Network TAP","Hub"],"answer":"Hub","explanation":"A hub creates a shared collision domain, so every attached system can see the frames.","id":"Q480"},{"concept_id":"MAC Attacks:1","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with the final three bytes of a standard MAC address identifying the interface within a vendor block?","choices":["OUI","Bridge priority","IPv4 network portion","NIC-specific portion"],"answer":"NIC-specific portion","explanation":"The final 24 bits identify the interface within the OUI allocation.","id":"Q025"},{"concept_id":"Sniffing Detection Techniques:9","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches indicating a possible attempt to alter STP root placement?","choices":["Valid DNS response","Unexpected superior BPDU","Stable ARP entry","Normal DHCP renewal"],"answer":"Unexpected superior BPDU","explanation":"Superior BPDUs on the wrong port can indicate a rogue-switch/root attack.","id":"Q482"},{"concept_id":"Sniffing Countermeasures:7","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses reducing how much broadcast and local traffic any one capture point can observe?","choices":["Hub deployment","Open Wi-Fi","VLAN segmentation","Long DHCP leases"],"answer":"VLAN segmentation","explanation":"Segmentation confines layer-2 visibility.","id":"Q483"},{"concept_id":"ARP Poisoning:14","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by monitoring voice traffic after ARP-based traffic redirection or mirroring?","choices":["DNS tunneling","SMTP relaying","SNMP polling","VoIP call tapping"],"answer":"VoIP call tapping","explanation":"The CEH notes list VoIP call tapping as a threat enabled by ARP poisoning.","id":"Q484"},{"concept_id":"Sniffing Detection Techniques:5","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by revealing abnormally many MAC addresses learned on one access port?","choices":["Port-security violation","DNSSEC success","TLS certificate renewal","Normal DHCPACK"],"answer":"Port-security violation","explanation":"MAC flooding often triggers port-security or MAC-learning alarms.","id":"Q485"},{"concept_id":"Sniffing Tools:6","variant":2,"category":"Sniffing Tools","question":"Which command setting best matches displaying packet contents in hex and ASCII with tcpdump?","choices":["-n","-w","-X","-r"],"answer":"-X","explanation":"`-X` exposes packet bytes for payload inspection.","id":"Q486"},{"concept_id":"DHCP Attacks:4","variant":1,"category":"DHCP Attacks","question":"What term describes a client reporting that an offered network address is already in use?","choices":["DHCPDecline","DHCPInform","DHCPRelease","DHCPNAK"],"answer":"DHCPDecline","explanation":"Decline reports an address conflict.","id":"Q487"},{"concept_id":"Spoofing Attacks:7","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by an aggressive bridge-priority value used by a rogue switch to win STP root election in the example?","choices":["32769","65535","Priority 0","49152"],"answer":"Priority 0","explanation":"A very low priority lowers the Bridge ID.","id":"Q488"},{"concept_id":"MAC Attacks:13","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with the switch characteristic that makes MAC flooding possible?","choices":["Finite CAM capacity","Mandatory Ethernet encryption","Static-only MAC entries","Absence of VLAN support"],"answer":"Finite CAM capacity","explanation":"A finite dynamic MAC table can be intentionally consumed by fake source identities.","id":"Q489"},{"concept_id":"DNS Poisoning:12","variant":0,"category":"DNS Poisoning","question":"Which concept best matches blocking endpoints from sending direct DNS requests to unauthorized external servers?","choices":["Open DNS recursion","Hub deployment","Disable HTTPS","Firewall DNS restriction"],"answer":"Firewall DNS restriction","explanation":"Firewall policy can force endpoints through approved resolvers.","id":"Q490"},{"concept_id":"Sniffing Detection Techniques:0","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by probing a suspect with the correct IP but an incorrect destination MAC and watching for an unexpected reply?","choices":["DHCP method","DNS method","ARP method","Ping method"],"answer":"Ping method","explanation":"A promiscuous NIC may pass the wrong-MAC frame to the IP stack.","id":"Q491"},{"concept_id":"DNS Poisoning:1","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by forging DNS answers on a switched LAN after obtaining local traffic visibility?","choices":["Proxy DNS poisoning","Offline zone signing","Internet DNS spoofing","Intranet DNS spoofing"],"answer":"Intranet DNS spoofing","explanation":"The supplied flow uses local MITM positioning before forged DNS responses.","id":"Q492"},{"concept_id":"DHCP Attacks:11","variant":1,"category":"DHCP Attacks","question":"What term describes marking a legitimate DHCP-server-facing switch interface as trusted?","choices":["ip dhcp snooping vlan","ip dhcp snooping trust","switchport mode access","ip arp inspection validate"],"answer":"ip dhcp snooping trust","explanation":"Only trusted interfaces should be allowed to send legitimate server-side DHCP messages.","id":"Q493"},{"concept_id":"Sniffing Detection Techniques:6","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with indicating possible DHCP starvation when many changing client identities request leases?","choices":["Valid DNSSEC answer","Stable ARP table","Single DHCPACK","DHCPDISCOVER burst"],"answer":"DHCPDISCOVER burst","explanation":"Starvation creates high-volume discovery traffic.","id":"Q494"},{"concept_id":"Sniffing Tools:5","variant":0,"category":"Sniffing Tools","question":"Which option or command performs disabling name resolution in tcpdump for faster numeric output?","choices":["-r","-X","-w","-n"],"answer":"-n","explanation":"`-n` prevents address-to-name resolution.","id":"Q495"},{"concept_id":"DNS Poisoning:4","variant":0,"category":"DNS Poisoning","question":"Which concept best matches making blind forged DNS responses harder to match to outstanding resolver queries?","choices":["Source-port randomization","Fixed UDP source port 53","Longer ARP timeout","Static STP priority"],"answer":"Source-port randomization","explanation":"Unpredictable source ports add entropy to each DNS query.","id":"Q496"},{"concept_id":"Sniffing Detection Techniques:1","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with looking for unusual reverse DNS lookups generated while a sniffer resolves captured IP addresses?","choices":["ARP method","Ping method","STP method","DNS method"],"answer":"DNS method","explanation":"Some sniffers create detectable PTR lookup traffic.","id":"Q286"},{"concept_id":"ARP Poisoning:9","variant":0,"category":"ARP Poisoning","question":"Which concept best matches validating ARP messages against trusted switch binding information?","choices":["Dynamic ARP Inspection","Root Guard","Port Security","SPAN"],"answer":"Dynamic ARP Inspection","explanation":"DAI blocks forged ARP claims, often using DHCP snooping bindings.","id":"Q498"},{"concept_id":"Spoofing Attacks:3","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches the VLAN whose untagged trunk handling is exploited by classic double tagging?","choices":["Management VLAN","Voice VLAN","Private VLAN","Native VLAN"],"answer":"Native VLAN","explanation":"The outer tag matches the native VLAN and is removed by the first switch.","id":"Q499"},{"concept_id":"Sniffing Tools:12","variant":3,"category":"Sniffing Tools","question":"Which concept is defined by scanning an IP range for likely promiscuous-mode interfaces?","choices":["Yersinia","NetScanTools Pro","macof","Ettercap"],"answer":"NetScanTools Pro","explanation":"The CEH notes list its Promiscuous Mode Scanner.","id":"Q500"}]];

const STORAGE_KEY = "ceh-v13-sniffing-direct-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Sniffing — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied Sniffing materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">9 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Sniffing</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Sniffing</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
