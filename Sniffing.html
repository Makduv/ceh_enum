ing","explanation":"Switches dynamically relearn source MAC locations.","id":"Q194"},{"concept_id":"Sniffing Tools:0","variant":2,"category":"Sniffing Tools","question":"Which program would you choose for capturing packets from the command line on Linux and BSD?","choices":["Wireshark GUI","tcpdump","NetScanTools Pro","WinDump"],"answer":"tcpdump","explanation":"tcpdump is the classic Unix-like CLI packet capture tool.","id":"Q195"},{"concept_id":"MAC Attacks:12","variant":0,"category":"MAC Attacks","question":"Which concept best matches a notification that may be generated when port-security detects a violation?","choices":["SNMP trap","DHCPACK","ICMP redirect","DNS zone transfer"],"answer":"SNMP trap","explanation":"Port-security violations can trigger an SNMP notification.","id":"Q196"},{"concept_id":"Sniffing Detection Techniques:8","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes showing an ARP claim inconsistent with trusted IP/MAC/interface bindings?","choices":["DAI violation log","HSTS event","DNSSEC trust anchor","SPAN configuration"],"answer":"DAI violation log","explanation":"DAI logs rejected forged ARP packets.","id":"Q197"},{"concept_id":"ARP Poisoning:14","variant":1,"category":"ARP Poisoning","question":"What term describes monitoring voice traffic after ARP-based traffic redirection or mirroring?","choices":["DNS tunneling","SNMP polling","VoIP call tapping","SMTP relaying"],"answer":"VoIP call tapping","explanation":"The CEH notes list VoIP call tapping as a threat enabled by ARP poisoning.","id":"Q198"},{"concept_id":"Sniffing Tools:13","variant":1,"category":"Sniffing Tools","question":"What term describes portable packet capture plus performance analysis and diagnostics?","choices":["RITA","Capsa Portable Network Analyzer","macof","arpwatch"],"answer":"Capsa Portable Network Analyzer","explanation":"Capsa is listed as a portable network analyzer.","id":"Q199"},{"concept_id":"Sniffing Countermeasures:3","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides replacing community-string SNMP versions with stronger authentication and encryption?","choices":["TFTP","SNMPv3","SNMPv2c","SNMPv1"],"answer":"SNMPv3","explanation":"SNMPv3 provides modern security controls for management traffic.","id":"Q200"}],[{"concept_id":"Sniffing Concepts:13","variant":1,"category":"Sniffing Concepts","question":"What term describes packet loss caused when mirrored source bandwidth exceeds the monitoring port capacity?","choices":["ARP poisoning","DNS recursion","Oversubscription","CAM aging"],"answer":"Oversubscription","explanation":"A SPAN destination can drop packets when it receives more mirrored traffic than it can transmit.","id":"Q201"},{"concept_id":"Sniffing Countermeasures:13","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for rejecting forged DNS data through cryptographic validation?","choices":["DNSSEC","DHCP Snooping","Root Guard","Port Security"],"answer":"DNSSEC","explanation":"DNSSEC protects DNS authenticity and integrity.","id":"Q202"},{"concept_id":"Sniffing Detection Techniques:2","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches using a non-broadcast ARP plus a follow-up ping to test whether a promiscuous host cached data it should not have seen?","choices":["Ping method","DNS method","ARP method","DHCP method"],"answer":"ARP method","explanation":"The ARP method relies on promiscuous processing of unusual layer-2 traffic.","id":"Q203"},{"concept_id":"DHCP Attacks:6","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with a client requesting local configuration without asking for a new address lease?","choices":["DHCPInform","DHCPREQUEST","DHCPDecline","Relay-Forward"],"answer":"DHCPInform","explanation":"Inform asks for options only.","id":"Q204"},{"concept_id":"ARP Poisoning:9","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with validating ARP messages against trusted switch binding information?","choices":["Dynamic ARP Inspection","Port Security","SPAN","Root Guard"],"answer":"Dynamic ARP Inspection","explanation":"DAI blocks forged ARP claims, often using DHCP snooping bindings.","id":"Q024"},{"concept_id":"Sniffing Countermeasures:10","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses blocking rogue DHCP server responses and optionally rate-limiting DHCP traffic?","choices":["Root Guard","DAI","DNSSEC","DHCP Snooping"],"answer":"DHCP Snooping","explanation":"DHCP snooping protects DHCP trust at the switch.","id":"Q206"},{"concept_id":"ARP Poisoning:12","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with monitoring MAC-to-IP mapping changes to expose ARP anomalies?","choices":["arpspoof","arpwatch","sslstrip","macof"],"answer":"arpwatch","explanation":"arpwatch is defensive monitoring rather than a poisoning tool.","id":"Q040"},{"concept_id":"Sniffing Concepts:12","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches an inline hardware device that passively copies link traffic without switch mirroring configuration?","choices":["Network TAP","Port security","DHCP snooping","SPAN"],"answer":"Network TAP","explanation":"A TAP copies traffic in hardware and is independent of a SPAN session.","id":"Q208"},{"concept_id":"Sniffing Tools:9","variant":3,"category":"Sniffing Tools","question":"Which CLI option directly enables reading a saved PCAP file with tcpdump?","choices":["-r","-i","-w","-s"],"answer":"-r","explanation":"`-r` reads packets from a capture file.","id":"Q209"},{"concept_id":"Spoofing Attacks:12","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with downgrading victim-side HTTPS links to HTTP after a MITM path already exists?","choices":["Yersinia","sslstrip","arpwatch","macof"],"answer":"sslstrip","explanation":"sslstrip acts as a transparent proxy and requires traffic to pass through the attacker first.","id":"Q210"},{"concept_id":"Sniffing Tools:1","variant":1,"category":"Sniffing Tools","question":"What utility best fits providing tcpdump-style command-line packet capture on Windows?","choices":["WinDump","RITA","tshark","macof"],"answer":"WinDump","explanation":"WinDump is the Windows counterpart named in the notes.","id":"Q211"},{"concept_id":"Sniffing Countermeasures:5","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides creating an encrypted tunnel across an untrusted local or public network?","choices":["Hub","ARP cache","VPN","CAM table"],"answer":"VPN","explanation":"A VPN protects traffic even when the access network cannot be trusted.","id":"Q212"},{"concept_id":"Sniffing Detection Techniques:3","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches locally indicating promiscuous mode on interfaces where the OS exposes that state?","choices":["ROOT flag","TRUST flag","SNOOP flag","PROMISC flag"],"answer":"PROMISC flag","explanation":"The supplementary notes mention PROMISC on macOS, while warning that OS reporting varies.","id":"Q213"},{"concept_id":"Spoofing Attacks:13","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches forcing HTTPS and defeating classic HTTP downgrade behavior used by sslstrip?","choices":["SNMPv3","DAI","HSTS","BPDU Guard"],"answer":"HSTS","explanation":"HTTP Strict Transport Security prevents protected sites from being accessed over downgraded HTTP.","id":"Q214"},{"concept_id":"DNS Poisoning:0","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by corrupting hostname-to-IP resolution so clients connect to an attacker-chosen address?","choices":["DNS poisoning","ARP poisoning","MAC flooding","DHCP starvation"],"answer":"DNS poisoning","explanation":"DNS poisoning changes name resolution rather than local IP-to-MAC resolution.","id":"Q215"},{"concept_id":"Sniffing Tools:10","variant":0,"category":"Sniffing Tools","question":"Which concept best matches isolating and reconstructing one TCP conversation in Wireshark?","choices":["Capture Options","Expert Information","Protocol Hierarchy","Follow TCP Stream"],"answer":"Follow TCP Stream","explanation":"Follow TCP Stream filters unrelated frames and reconstructs the exchange.","id":"Q216"},{"concept_id":"DNS Poisoning:7","variant":0,"category":"DNS Poisoning","question":"Which concept best matches adding connection state that makes simple response injection harder than connectionless UDP?","choices":["STP over TCP","DHCP over TLS","DNS over TCP","ARP over UDP"],"answer":"DNS over TCP","explanation":"TCP requires a valid connection state before the DNS response can be accepted.","id":"Q217"},{"concept_id":"ARP Poisoning:0","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by mapping a known local IPv4 address to an Ethernet MAC address?","choices":["DNS","DHCP","ARP","STP"],"answer":"ARP","explanation":"ARP supplies the destination MAC needed for local IPv4 Ethernet delivery.","id":"Q218"},{"concept_id":"ARP Poisoning:5","variant":0,"category":"ARP Poisoning","question":"Which concept best matches keeping intercepted MITM traffic moving onward to the real destination?","choices":["BPDU Guard","IP forwarding","DNS recursion","Port Security"],"answer":"IP forwarding","explanation":"Without forwarding, redirected traffic stops at the attacker and breaks the victim connection.","id":"Q219"},{"concept_id":"MAC Attacks:0","variant":3,"category":"MAC Attacks","question":"Which concept is defined by the first three bytes of a standard MAC address identifying the vendor allocation?","choices":["OUI","ARP opcode","VLAN ID","NIC-specific portion"],"answer":"OUI","explanation":"The OUI is the vendor-assigned first 24 bits of a MAC address.","id":"Q220"},{"concept_id":"ARP Poisoning:6","variant":1,"category":"ARP Poisoning","question":"What term describes sending forged ARP mappings with a focused dsniff utility?","choices":["Yersinia","arpspoof","macof","NetScanTools Pro"],"answer":"arpspoof","explanation":"arpspoof is a dsniff tool for ARP spoofing.","id":"Q221"},{"concept_id":"DNS Poisoning:6","variant":1,"category":"DNS Poisoning","question":"What term describes forcing endpoints to use approved internal DNS infrastructure instead of arbitrary external resolvers?","choices":["Hub forwarding","Static MAC filtering only","Local DNS resolver policy","Open resolver policy"],"answer":"Local DNS resolver policy","explanation":"Centralized DNS enables validation, logging, and consistent controls.","id":"Q222"},{"concept_id":"Spoofing Attacks:4","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with manipulating spanning-tree root election so traffic paths favor a rogue switch?","choices":["ARP inspection","DNS poisoning","STP attack","DHCP starvation"],"answer":"STP attack","explanation":"A rogue switch can advertise a better bridge identity and become root.","id":"Q223"},{"concept_id":"Spoofing Attacks:9","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with shutting or err-disabling a PortFast edge port when a BPDU arrives?","choices":["Root Guard","Loop Guard","BPDU Guard","UDLD"],"answer":"BPDU Guard","explanation":"BPDU Guard treats bridge control traffic on an edge port as a violation.","id":"Q224"},{"concept_id":"MAC Attacks:13","variant":1,"category":"MAC Attacks","question":"What term describes the switch characteristic that makes MAC flooding possible?","choices":["Static-only MAC entries","Mandatory Ethernet encryption","Finite CAM capacity","Absence of VLAN support"],"answer":"Finite CAM capacity","explanation":"A finite dynamic MAC table can be intentionally consumed by fake source identities.","id":"Q225"},{"concept_id":"Sniffing Tools:11","variant":0,"category":"Sniffing Tools","question":"Which concept best matches providing negotiated TLS secrets to Wireshark for authorized decryption of modern sessions?","choices":["Pre-master/session key log","STP log","DHCP snooping table","CAM export"],"answer":"Pre-master/session key log","explanation":"Modern ephemeral TLS is commonly decrypted with logged session secrets.","id":"Q226"},{"concept_id":"DHCP Attacks:4","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with a client reporting that an offered network address is already in use?","choices":["DHCPNAK","DHCPDecline","DHCPRelease","DHCPInform"],"answer":"DHCPDecline","explanation":"Decline reports an address conflict.","id":"Q227"},{"concept_id":"Sniffing Concepts:11","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with Cisco switch-based port mirroring to a monitoring interface?","choices":["DAI","UDLD","HSRP","SPAN"],"answer":"SPAN","explanation":"SPAN stands for Switched Port Analyzer and copies selected traffic to a monitor port.","id":"Q228"},{"concept_id":"Sniffing Concepts:6","variant":1,"category":"Sniffing Concepts","question":"What term describes mapping learned MAC addresses to switch ports and VLAN context?","choices":["ARP cache","DNS cache","DHCP scope","CAM table"],"answer":"CAM table","explanation":"The CAM table is the switch's MAC-to-port forwarding database.","id":"Q229"},{"concept_id":"MAC Attacks:9","variant":0,"category":"MAC Attacks","question":"Which concept best matches moving a specific victim MAC mapping toward the attacker's switch port?","choices":["DHCP starvation","DNS cache poisoning","MAC flooding","Switch port stealing"],"answer":"Switch port stealing","explanation":"Port stealing targets a specific learned MAC location rather than exhausting the whole CAM table.","id":"Q230"},{"concept_id":"MAC Attacks:4","variant":1,"category":"MAC Attacks","question":"What term describes the direct resource goal of MAC flooding?","choices":["DHCP pool exhaustion","CAM table exhaustion","STP root election","DNS cache poisoning"],"answer":"CAM table exhaustion","explanation":"MAC flooding consumes the finite MAC-learning capacity of the switch.","id":"Q231"},{"concept_id":"DHCP Attacks:0","variant":1,"category":"DHCP Attacks","question":"What term describes the client's initial broadcast looking for DHCP servers?","choices":["DHCPOFFER","DHCPACK","DHCPREQUEST","DHCPDISCOVER"],"answer":"DHCPDISCOVER","explanation":"Discover begins the DORA lease exchange.","id":"Q232"},{"concept_id":"DHCP Attacks:5","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by a client voluntarily relinquishing its leased address?","choices":["DHCPRelease","DHCPOFFER","DHCPInform","DHCPDecline"],"answer":"DHCPRelease","explanation":"Release returns the address to the DHCP pool.","id":"Q159"},{"concept_id":"Sniffing Detection Techniques:12","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes visualizing bursts and timing anomalies across a capture?","choices":["DNS zone","ARP cache","CAM table","I/O Graph"],"answer":"I/O Graph","explanation":"Wireshark I/O graphs reveal traffic-rate changes over time.","id":"Q234"},{"concept_id":"Sniffing Detection Techniques:6","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes indicating possible DHCP starvation when many changing client identities request leases?","choices":["Single DHCPACK","DHCPDISCOVER burst","Valid DNSSEC answer","Stable ARP table"],"answer":"DHCPDISCOVER burst","explanation":"Starvation creates high-volume discovery traffic.","id":"Q235"},{"concept_id":"Sniffing Countermeasures:1","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses replacing plaintext FTP-style transfers with SSH-protected file transfer?","choices":["TFTP","SFTP/SCP","Rlogin","FTP"],"answer":"SFTP/SCP","explanation":"SFTP and SCP protect both authentication and file data.","id":"Q236"},{"concept_id":"Spoofing Attacks:2","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches using two 802.1Q tags so an inner target-VLAN tag survives native-VLAN processing?","choices":["DNS poisoning","Switch spoofing","Double tagging","MAC flooding"],"answer":"Double tagging","explanation":"Double tagging exploits native-VLAN handling across trunks.","id":"Q237"},{"concept_id":"MAC Attacks:1","variant":1,"category":"MAC Attacks","question":"What term describes the final three bytes of a standard MAC address identifying the interface within a vendor block?","choices":["Bridge priority","NIC-specific portion","OUI","IPv4 network portion"],"answer":"NIC-specific portion","explanation":"The final 24 bits identify the interface within the OUI allocation.","id":"Q238"},{"concept_id":"MAC Attacks:10","variant":3,"category":"MAC Attacks","question":"Which concept is defined by cloning or changing a client MAC identity to impersonate an authorized endpoint?","choices":["MAC flooding","DHCP starvation","MAC spoofing","STP root attack"],"answer":"MAC spoofing","explanation":"MAC spoofing reuses a layer-2 identity rather than generating thousands of addresses.","id":"Q239"},{"concept_id":"ARP Poisoning:7","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with combining ARP poisoning with broader MITM and DNS-spoofing capabilities?","choices":["WinDump","PRTG","RITA","Ettercap"],"answer":"Ettercap","explanation":"Ettercap is a multipurpose MITM and sniffing framework.","id":"Q240"},{"concept_id":"Sniffing Detection Techniques:8","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches showing an ARP claim inconsistent with trusted IP/MAC/interface bindings?","choices":["SPAN configuration","DNSSEC trust anchor","DAI violation log","HSTS event"],"answer":"DAI violation log","explanation":"DAI logs rejected forged ARP packets.","id":"Q241"},{"concept_id":"Sniffing Concepts:2","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches observing traffic on a shared medium without injecting extra packets?","choices":["ARP poisoning","Switch port stealing","Passive sniffing","Active sniffing"],"answer":"Passive sniffing","explanation":"Passive sniffing is naturally suited to hub/shared-Ethernet environments and is comparatively stealthy.","id":"Q242"},{"concept_id":"DNS Poisoning:11","variant":1,"category":"DNS Poisoning","question":"What term describes reducing abusive volumes of negative DNS responses or queries?","choices":["ARP inspection","NXDOMAIN rate limiting","BPDU Guard","Port Security"],"answer":"NXDOMAIN rate limiting","explanation":"The CEH countermeasures include rate limiting for NXDOMAIN activity.","id":"Q243"},{"concept_id":"Sniffing Concepts:3","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with manipulating a switched network so otherwise hidden traffic becomes visible?","choices":["Passive sniffing","Static routing","Offline PCAP analysis","Active sniffing"],"answer":"Active sniffing","explanation":"Active sniffing injects or manipulates traffic to defeat normal switch isolation.","id":"Q244"},{"concept_id":"DNS Poisoning:5","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with allowing recursive DNS service only for authorized clients?","choices":["Disable DNSSEC","Enable open recursion","Use a hub","Restrict recursion"],"answer":"Restrict recursion","explanation":"Recursion access control reduces abuse and exposure.","id":"Q245"},{"concept_id":"Sniffing Tools:5","variant":3,"category":"Sniffing Tools","question":"Which CLI option directly enables disabling name resolution in tcpdump for faster numeric output?","choices":["-w","-n","-r","-X"],"answer":"-n","explanation":"`-n` prevents address-to-name resolution.","id":"Q246"},{"concept_id":"Sniffing Countermeasures:12","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for preventing an access direction from introducing a superior STP root?","choices":["BPDU Guard","DAI","Root Guard","HSTS"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root bridge.","id":"Q247"},{"concept_id":"Spoofing Attacks:8","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches the default bridge-priority value listed in the supplied CEH notes?","choices":["32768","32769","65535","4096"],"answer":"32769","explanation":"The provided chapter explicitly lists 32769 as the default value to remember.","id":"Q248"},{"concept_id":"Sniffing Tools:8","variant":0,"category":"Sniffing Tools","question":"Which option or command performs writing tcpdump packets to a PCAP file?","choices":["-w","-X","-n","-r"],"answer":"-w","explanation":"`-w` saves the capture.","id":"Q249"},{"concept_id":"DHCP Attacks:7","variant":0,"category":"DHCP Attacks","question":"Which concept best matches exhausting a DHCP scope with forged lease requests so legitimate users cannot obtain addresses?","choices":["ARP poisoning","Rogue DHCP","MAC spoofing","DHCP starvation"],"answer":"DHCP starvation","explanation":"Starvation is a DHCP denial-of-service attack against address availability.","id":"Q250"}],[{"concept_id":"Sniffing Concepts:0","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with capturing and analyzing packets traversing a network?","choices":["Route enumeration","Vulnerability scanning","Port scanning","Packet sniffing"],"answer":"Packet sniffing","explanation":"Packet sniffing monitors network traffic so packet headers and payloads can be inspected.","id":"Q251"},{"concept_id":"ARP Poisoning:9","variant":1,"category":"ARP Poisoning","question":"What term describes validating ARP messages against trusted switch binding information?","choices":["Dynamic ARP Inspection","Port Security","Root Guard","SPAN"],"answer":"Dynamic ARP Inspection","explanation":"DAI blocks forged ARP claims, often using DHCP snooping bindings.","id":"Q188"},{"concept_id":"DHCP Attacks:11","variant":0,"category":"DHCP Attacks","question":"Which concept best matches marking a legitimate DHCP-server-facing switch interface as trusted?","choices":["ip dhcp snooping vlan","ip dhcp snooping trust","ip arp inspection validate","switchport mode access"],"answer":"ip dhcp snooping trust","explanation":"Only trusted interfaces should be allowed to send legitimate server-side DHCP messages.","id":"Q253"},{"concept_id":"ARP Poisoning:6","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with sending forged ARP mappings with a focused dsniff utility?","choices":["macof","NetScanTools Pro","arpspoof","Yersinia"],"answer":"arpspoof","explanation":"arpspoof is a dsniff tool for ARP spoofing.","id":"Q254"},{"concept_id":"Spoofing Attacks:10","variant":1,"category":"Spoofing Attacks","question":"What term describes preventing a protected port from accepting a superior root claim?","choices":["DAI","BPDU Guard","DHCP Snooping","Root Guard"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root placement.","id":"Q255"},{"concept_id":"MAC Attacks:7","variant":3,"category":"MAC Attacks","question":"Which concept is defined by placing a Cisco interface in access mode before applying access-port security?","choices":["switchport mode access","switchport mode trunk","ip dhcp snooping trust","spanning-tree guard root"],"answer":"switchport mode access","explanation":"The supplied Cisco sequence sets access mode before enabling port security.","id":"Q256"},{"concept_id":"MAC Attacks:8","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with enabling Cisco port-security behavior on the current interface?","choices":["ip dhcp snooping","switchport port-security","spanning-tree portfast","ip arp inspection"],"answer":"switchport port-security","explanation":"This interface command enables port security.","id":"Q257"},{"concept_id":"ARP Poisoning:13","variant":0,"category":"ARP Poisoning","question":"Which concept best matches abusing captured session information after gaining an ARP-based MITM position?","choices":["DHCP snooping","Session hijacking","DNSSEC signing","Port security"],"answer":"Session hijacking","explanation":"Intercepted sessions can expose tokens or other authentication state.","id":"Q258"},{"concept_id":"ARP Poisoning:2","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with returning the MAC address associated with the requested local IP?","choices":["DHCPDISCOVER","ARP request","ARP reply","STP BPDU"],"answer":"ARP reply","explanation":"The host owning the IP responds with its hardware address.","id":"Q259"},{"concept_id":"MAC Attacks:5","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with flooding a switch with many randomized MAC/IP identities to stress the CAM table?","choices":["Yersinia","arpspoof","NetScanTools Pro","macof"],"answer":"macof","explanation":"macof is the classic dsniff utility for MAC flooding.","id":"Q260"},{"concept_id":"Sniffing Countermeasures:6","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports pinning stable critical IP/MAC mappings to resist local ARP cache poisoning?","choices":["Dynamic DNS","DHCP relay","Static ARP entries","SPAN"],"answer":"Static ARP entries","explanation":"Static mappings prevent normal dynamic overwrite of critical peers.","id":"Q261"},{"concept_id":"Sniffing Tools:13","variant":0,"category":"Sniffing Tools","question":"Which concept best matches portable packet capture plus performance analysis and diagnostics?","choices":["arpwatch","RITA","macof","Capsa Portable Network Analyzer"],"answer":"Capsa Portable Network Analyzer","explanation":"Capsa is listed as a portable network analyzer.","id":"Q262"},{"concept_id":"ARP Poisoning:0","variant":0,"category":"ARP Poisoning","question":"Which concept best matches mapping a known local IPv4 address to an Ethernet MAC address?","choices":["DHCP","DNS","STP","ARP"],"answer":"ARP","explanation":"ARP supplies the destination MAC needed for local IPv4 Ethernet delivery.","id":"Q263"},{"concept_id":"Spoofing Attacks:12","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by downgrading victim-side HTTPS links to HTTP after a MITM path already exists?","choices":["Yersinia","macof","arpwatch","sslstrip"],"answer":"sslstrip","explanation":"sslstrip acts as a transparent proxy and requires traffic to pass through the attacker first.","id":"Q264"},{"concept_id":"Sniffing Tools:14","variant":0,"category":"Sniffing Tools","question":"Which concept best matches analyzing captures with a feature that maps public IPs geographically?","choices":["PRTG","Observer Analyzer","RITA","OmniPeek"],"answer":"OmniPeek","explanation":"The notes associate OmniPeek with displaying public IPs on a Google Map.","id":"Q265"},{"concept_id":"Sniffing Tools:9","variant":0,"category":"Sniffing Tools","question":"Which option or command performs reading a saved PCAP file with tcpdump?","choices":["-s","-w","-i","-r"],"answer":"-r","explanation":"`-r` reads packets from a capture file.","id":"Q266"},{"concept_id":"Sniffing Countermeasures:4","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides encrypting wireless traffic instead of relying on open Wi-Fi or MAC filtering?","choices":["WEP only","Open Wi-Fi","WPA2/WPA3","Hidden SSID only"],"answer":"WPA2/WPA3","explanation":"Strong Wi-Fi encryption reduces local packet-sniffing exposure.","id":"Q267"},{"concept_id":"Spoofing Attacks:13","variant":1,"category":"Spoofing Attacks","question":"What term describes forcing HTTPS and defeating classic HTTP downgrade behavior used by sslstrip?","choices":["BPDU Guard","SNMPv3","HSTS","DAI"],"answer":"HSTS","explanation":"HTTP Strict Transport Security prevents protected sites from being accessed over downgraded HTTP.","id":"Q268"},{"concept_id":"Sniffing Detection Techniques:0","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes probing a suspect with the correct IP but an incorrect destination MAC and watching for an unexpected reply?","choices":["DNS method","DHCP method","ARP method","Ping method"],"answer":"Ping method","explanation":"A promiscuous NIC may pass the wrong-MAC frame to the IP stack.","id":"Q269"},{"concept_id":"DHCP Attacks:10","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by filtering DHCP server messages according to trusted and untrusted switch ports?","choices":["DAI","Root Guard","DNSSEC","DHCP Snooping"],"answer":"DHCP Snooping","explanation":"DHCP snooping blocks rogue server responses and builds trusted lease bindings.","id":"Q270"},{"concept_id":"DNS Poisoning:9","variant":2,"category":"DNS Poisoning","question":"Which option is most directly associated with the Ettercap plugin that forges DNS responses from configured name mappings?","choices":["arpwatch","dhcp_snoop","dns_spoof","macof"],"answer":"dns_spoof","explanation":"The supplementary material uses Ettercap's dns_spoof plugin.","id":"Q271"},{"concept_id":"Sniffing Countermeasures:2","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses protecting web forms and sessions from plaintext packet capture?","choices":["Telnet","HTTP","NNTP","HTTPS"],"answer":"HTTPS","explanation":"HTTPS adds TLS encryption to HTTP.","id":"Q272"},{"concept_id":"DHCP Attacks:3","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by the server's confirmation that finalizes the accepted lease?","choices":["DHCPACK","DHCPDecline","DHCPInform","DHCPREQUEST"],"answer":"DHCPACK","explanation":"ACK completes successful address assignment.","id":"Q273"},{"concept_id":"Sniffing Detection Techniques:6","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by indicating possible DHCP starvation when many changing client identities request leases?","choices":["Stable ARP table","Valid DNSSEC answer","DHCPDISCOVER burst","Single DHCPACK"],"answer":"DHCPDISCOVER burst","explanation":"Starvation creates high-volume discovery traffic.","id":"Q274"},{"concept_id":"Sniffing Tools:2","variant":1,"category":"Sniffing Tools","question":"What utility best fits using Wireshark's dissectors from the command line with field-oriented output?","choices":["WinDump","tcpdump","tshark","Ettercap"],"answer":"tshark","explanation":"tshark is Wireshark's CLI version.","id":"Q275"},{"concept_id":"DHCP Attacks:1","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with the server's proposed address and configuration to a client?","choices":["DHCPREQUEST","DHCPOFFER","DHCPNAK","DHCPDISCOVER"],"answer":"DHCPOFFER","explanation":"Offer proposes lease parameters after discovery.","id":"Q276"},{"concept_id":"Sniffing Countermeasures:8","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides restricting network access to trusted source or destination ranges?","choices":["BPF on the sniffer","ACL","Hub","SPAN"],"answer":"ACL","explanation":"Access-control lists limit which systems may communicate.","id":"Q277"},{"concept_id":"Sniffing Concepts:8","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by preventing traffic in another VLAN or subnet from reaching the sniffer interface by default?","choices":["Name resolution","Promiscuous mode","Encryption","Network segmentation"],"answer":"Network segmentation","explanation":"Segmentation limits which traffic reaches a capture point.","id":"Q278"},{"concept_id":"Sniffing Tools:8","variant":1,"category":"Sniffing Tools","question":"What flag is used for writing tcpdump packets to a PCAP file?","choices":["-X","-n","-r","-w"],"answer":"-w","explanation":"`-w` saves the capture.","id":"Q279"},{"concept_id":"Sniffing Detection Techniques:5","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with revealing abnormally many MAC addresses learned on one access port?","choices":["Port-security violation","Normal DHCPACK","TLS certificate renewal","DNSSEC success"],"answer":"Port-security violation","explanation":"MAC flooding often triggers port-security or MAC-learning alarms.","id":"Q280"},{"concept_id":"Sniffing Concepts:2","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by observing traffic on a shared medium without injecting extra packets?","choices":["Passive sniffing","ARP poisoning","Active sniffing","Switch port stealing"],"answer":"Passive sniffing","explanation":"Passive sniffing is naturally suited to hub/shared-Ethernet environments and is comparatively stealthy.","id":"Q281"},{"concept_id":"DHCP Attacks:12","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by limiting DHCP packets per second on an access port to reduce starvation?","choices":["ip dhcp snooping limit rate","ip dhcp snooping trust","show ip dhcp snooping","no ip dhcp snooping information option"],"answer":"ip dhcp snooping limit rate","explanation":"Rate limiting constrains request floods.","id":"Q282"},{"concept_id":"MAC Attacks:4","variant":3,"category":"MAC Attacks","question":"Which concept is defined by the direct resource goal of MAC flooding?","choices":["STP root election","DNS cache poisoning","CAM table exhaustion","DHCP pool exhaustion"],"answer":"CAM table exhaustion","explanation":"MAC flooding consumes the finite MAC-learning capacity of the switch.","id":"Q283"},{"concept_id":"DHCP Attacks:8","variant":0,"category":"DHCP Attacks","question":"Which concept best matches supplying clients with attacker-controlled gateway, DNS, or address settings?","choices":["DHCP starvation","Port security","Rogue DHCP server","MAC flooding"],"answer":"Rogue DHCP server","explanation":"A rogue server wins the DHCP race and pushes malicious network configuration.","id":"Q284"},{"concept_id":"Sniffing Concepts:7","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by mapping IPv4 addresses to local MAC addresses on an endpoint?","choices":["Routing table","DNS cache","ARP cache","CAM table"],"answer":"ARP cache","explanation":"ARP resolves local IPv4 peers to Ethernet MAC addresses.","id":"Q285"},{"concept_id":"Sniffing Detection Techniques:4","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes alerting on suspicious MAC-to-IP mapping changes and flips?","choices":["arpwatch","macof","sslstrip","DHCPig"],"answer":"arpwatch","explanation":"ARP mapping changes are a strong clue of spoofing-based sniffing.","id":"Q497"},{"concept_id":"Spoofing Attacks:6","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with the STP election value combining bridge priority and MAC address?","choices":["DHCP binding","ARP cache entry","DNS transaction ID","Bridge ID"],"answer":"Bridge ID","explanation":"The bridge with the lowest BID wins root election.","id":"Q287"},{"concept_id":"MAC Attacks:2","variant":3,"category":"MAC Attacks","question":"Which concept is defined by a MAC address whose I/G bit is set to 1?","choices":["Unicast MAC","Globally unique MAC","Locally administered MAC","Multicast MAC"],"answer":"Multicast MAC","explanation":"The low-order I/G bit distinguishes group/multicast from individual/unicast addressing.","id":"Q288"},{"concept_id":"DNS Poisoning:2","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by inserting false records into a resolver cache so later clients receive the wrong address?","choices":["DHCP starvation","MAC flooding","ARP cache poisoning","DNS cache poisoning"],"answer":"DNS cache poisoning","explanation":"Cache poisoning persists while the false record remains cached.","id":"Q289"},{"concept_id":"Sniffing Countermeasures:9","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for limiting MAC identities on user-facing switch ports?","choices":["DNSSEC","Port Security","HSTS","S/MIME"],"answer":"Port Security","explanation":"Port security helps mitigate MAC flooding and spoofing.","id":"Q290"},{"concept_id":"DNS Poisoning:5","variant":1,"category":"DNS Poisoning","question":"What term describes allowing recursive DNS service only for authorized clients?","choices":["Disable DNSSEC","Enable open recursion","Restrict recursion","Use a hub"],"answer":"Restrict recursion","explanation":"Recursion access control reduces abuse and exposure.","id":"Q291"},{"concept_id":"Sniffing Concepts:10","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches the actual carried data above protocol headers in a captured packet?","choices":["Payload","TCP checksum","Frame check sequence","Ethernet preamble"],"answer":"Payload","explanation":"The payload contains the higher-layer data transported by the packet.","id":"Q292"},{"concept_id":"ARP Poisoning:11","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with pinning a critical IP-to-MAC mapping so dynamic forged replies cannot replace it normally?","choices":["Static ARP entry","Dynamic DNS entry","SPAN session","DHCP relay"],"answer":"Static ARP entry","explanation":"Static ARP mappings can protect stable critical peers such as a gateway.","id":"Q293"},{"concept_id":"Sniffing Concepts:14","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with dedicated capture equipment that can sustain heavy traffic with fewer packet drops than host software?","choices":["DNS resolver","Hardware protocol analyzer","Software firewall","DHCP relay"],"answer":"Hardware protocol analyzer","explanation":"Dedicated analyzers capture and decode traffic without altering the segment and can handle overload better.","id":"Q294"},{"concept_id":"Sniffing Countermeasures:7","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports reducing how much broadcast and local traffic any one capture point can observe?","choices":["Hub deployment","VLAN segmentation","Open Wi-Fi","Long DHCP leases"],"answer":"VLAN segmentation","explanation":"Segmentation confines layer-2 visibility.","id":"Q295"},{"concept_id":"DNS Poisoning:6","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by forcing endpoints to use approved internal DNS infrastructure instead of arbitrary external resolvers?","choices":["Hub forwarding","Local DNS resolver policy","Open resolver policy","Static MAC filtering only"],"answer":"Local DNS resolver policy","explanation":"Centralized DNS enables validation, logging, and consistent controls.","id":"Q296"},{"concept_id":"Spoofing Attacks:11","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches blocking source IP/MAC combinations that do not match trusted binding information?","choices":["IP Source Guard","TAP","SPAN","Protocol Hierarchy"],"answer":"IP Source Guard","explanation":"IP Source Guard can use DHCP snooping data to enforce source identity.","id":"Q297"},{"concept_id":"Sniffing Tools:1","variant":3,"category":"Sniffing Tools","question":"Which tool most directly handles providing tcpdump-style command-line packet capture on Windows?","choices":["RITA","tshark","WinDump","macof"],"answer":"WinDump","explanation":"WinDump is the Windows counterpart named in the notes.","id":"Q298"},{"concept_id":"DNS Poisoning:0","variant":1,"category":"DNS Poisoning","question":"What term describes corrupting hostname-to-IP resolution so clients connect to an attacker-chosen address?","choices":["DNS poisoning","DHCP starvation","MAC flooding","ARP poisoning"],"answer":"DNS poisoning","explanation":"DNS poisoning changes name resolution rather than local IP-to-MAC resolution.","id":"Q299"},{"concept_id":"Sniffing Detection Techniques:7","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches indicating a possible rogue DHCP server on an untrusted access port?","choices":["Unauthorized DHCPOFFER","Valid root BPDU","ARP broadcast","Normal DHCPREQUEST"],"answer":"Unauthorized DHCPOFFER","explanation":"Server-side DHCP messages should come only from authorized infrastructure.","id":"Q300"}],[{"concept_id":"Sniffing Countermeasures:0","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides replacing Telnet with encrypted remote-login traffic?","choices":["SNMPv2c","TFTP","FTP","SSH"],"answer":"SSH","explanation":"SSH protects credentials and terminal data from passive sniffing.","id":"Q301"},{"concept_id":"DNS Poisoning:3","variant":0,"category":"DNS Poisoning","question":"Which concept best matches cryptographically validating DNS record authenticity and integrity?","choices":["Port Security","DNSSEC","Root Guard","DAI"],"answer":"DNSSEC","explanation":"DNSSEC signatures allow validating resolvers to reject forged DNS data.","id":"Q302"},{"concept_id":"Sniffing Tools:1","variant":2,"category":"Sniffing Tools","question":"Which program would you choose for providing tcpdump-style command-line packet capture on Windows?","choices":["macof","WinDump","tshark","RITA"],"answer":"WinDump","explanation":"WinDump is the Windows counterpart named in the notes.","id":"Q303"},{"concept_id":"Sniffing Detection Techniques:2","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes using a non-broadcast ARP plus a follow-up ping to test whether a promiscuous host cached data it should not have seen?","choices":["Ping method","DNS method","ARP method","DHCP method"],"answer":"ARP method","explanation":"The ARP method relies on promiscuous processing of unusual layer-2 traffic.","id":"Q304"},{"concept_id":"ARP Poisoning:3","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with advertising an IP-to-MAC mapping without waiting for a matching request?","choices":["Signed ARP","DHCPInform","Gratuitous ARP","ARP probe over TCP"],"answer":"Gratuitous ARP","explanation":"Unsolicited ARP messages can update caches and are useful for poisoning.","id":"Q305"},{"concept_id":"ARP Poisoning:0","variant":1,"category":"ARP Poisoning","question":"What term describes mapping a known local IPv4 address to an Ethernet MAC address?","choices":["DHCP","DNS","ARP","STP"],"answer":"ARP","explanation":"ARP supplies the destination MAC needed for local IPv4 Ethernet delivery.","id":"Q306"},{"concept_id":"DHCP Attacks:3","variant":0,"category":"DHCP Attacks","question":"Which concept best matches the server's confirmation that finalizes the accepted lease?","choices":["DHCPACK","DHCPDecline","DHCPREQUEST","DHCPInform"],"answer":"DHCPACK","explanation":"ACK completes successful address assignment.","id":"Q307"},{"concept_id":"Spoofing Attacks:9","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches shutting or err-disabling a PortFast edge port when a BPDU arrives?","choices":["Root Guard","UDLD","BPDU Guard","Loop Guard"],"answer":"BPDU Guard","explanation":"BPDU Guard treats bridge control traffic on an edge port as a violation.","id":"Q308"},{"concept_id":"Sniffing Tools:13","variant":3,"category":"Sniffing Tools","question":"Which concept is defined by portable packet capture plus performance analysis and diagnostics?","choices":["arpwatch","RITA","Capsa Portable Network Analyzer","macof"],"answer":"Capsa Portable Network Analyzer","explanation":"Capsa is listed as a portable network analyzer.","id":"Q309"},{"concept_id":"Sniffing Tools:2","variant":3,"category":"Sniffing Tools","question":"Which tool most directly handles using Wireshark's dissectors from the command line with field-oriented output?","choices":["Ettercap","tcpdump","WinDump","tshark"],"answer":"tshark","explanation":"tshark is Wireshark's CLI version.","id":"Q310"},{"concept_id":"DHCP Attacks:0","variant":0,"category":"DHCP Attacks","question":"Which concept best matches the client's initial broadcast looking for DHCP servers?","choices":["DHCPOFFER","DHCPACK","DHCPDISCOVER","DHCPREQUEST"],"answer":"DHCPDISCOVER","explanation":"Discover begins the DORA lease exchange.","id":"Q311"},{"concept_id":"DHCP Attacks:12","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with limiting DHCP packets per second on an access port to reduce starvation?","choices":["show ip dhcp snooping","ip dhcp snooping trust","ip dhcp snooping limit rate","no ip dhcp snooping information option"],"answer":"ip dhcp snooping limit rate","explanation":"Rate limiting constrains request floods.","id":"Q312"},{"concept_id":"DNS Poisoning:2","variant":1,"category":"DNS Poisoning","question":"What term describes inserting false records into a resolver cache so later clients receive the wrong address?","choices":["DNS cache poisoning","MAC flooding","DHCP starvation","ARP cache poisoning"],"answer":"DNS cache poisoning","explanation":"Cache poisoning persists while the false record remains cached.","id":"Q313"},{"concept_id":"Sniffing Detection Techniques:5","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes revealing abnormally many MAC addresses learned on one access port?","choices":["Port-security violation","TLS certificate renewal","Normal DHCPACK","DNSSEC success"],"answer":"Port-security violation","explanation":"MAC flooding often triggers port-security or MAC-learning alarms.","id":"Q314"},{"concept_id":"MAC Attacks:6","variant":0,"category":"MAC Attacks","question":"Which concept best matches limiting how many or which MAC addresses may be learned on an access port?","choices":["Port Security","DHCP relay","DNSSEC","Root Guard"],"answer":"Port Security","explanation":"Port security mitigates MAC flooding and MAC spoofing on access ports.","id":"Q315"},{"concept_id":"Spoofing Attacks:10","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with preventing a protected port from accepting a superior root claim?","choices":["BPDU Guard","Root Guard","DHCP Snooping","DAI"],"answer":"Root Guard","explanation":"Root Guard preserves the intended root placement.","id":"Q316"},{"concept_id":"Sniffing Concepts:11","variant":1,"category":"Sniffing Concepts","question":"What term describes Cisco switch-based port mirroring to a monitoring interface?","choices":["UDLD","HSRP","DAI","SPAN"],"answer":"SPAN","explanation":"SPAN stands for Switched Port Analyzer and copies selected traffic to a monitor port.","id":"Q317"},{"concept_id":"Sniffing Detection Techniques:11","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes showing traffic volume between endpoint pairs to identify unusually chatty relationships?","choices":["Conversation Statistics","Packet Bytes","Display Filter history","Protocol Hierarchy"],"answer":"Conversation Statistics","explanation":"Conversation statistics summarize endpoint-pair traffic.","id":"Q318"},{"concept_id":"Sniffing Detection Techniques:1","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes looking for unusual reverse DNS lookups generated while a sniffer resolves captured IP addresses?","choices":["Ping method","ARP method","STP method","DNS method"],"answer":"DNS method","explanation":"Some sniffers create detectable PTR lookup traffic.","id":"Q319"},{"concept_id":"Sniffing Tools:14","variant":1,"category":"Sniffing Tools","question":"What term describes analyzing captures with a feature that maps public IPs geographically?","choices":["PRTG","RITA","OmniPeek","Observer Analyzer"],"answer":"OmniPeek","explanation":"The notes associate OmniPeek with displaying public IPs on a Google Map.","id":"Q320"},{"concept_id":"ARP Poisoning:7","variant":0,"category":"ARP Poisoning","question":"Which concept best matches combining ARP poisoning with broader MITM and DNS-spoofing capabilities?","choices":["WinDump","PRTG","Ettercap","RITA"],"answer":"Ettercap","explanation":"Ettercap is a multipurpose MITM and sniffing framework.","id":"Q321"},{"concept_id":"Sniffing Concepts:0","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by capturing and analyzing packets traversing a network?","choices":["Packet sniffing","Route enumeration","Vulnerability scanning","Port scanning"],"answer":"Packet sniffing","explanation":"Packet sniffing monitors network traffic so packet headers and payloads can be inspected.","id":"Q322"},{"concept_id":"ARP Poisoning:8","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with an ARP-poisoning/MITM framework listed in the CEH material?","choices":["Cutter","bettercap","Nessus","Hashcat"],"answer":"bettercap","explanation":"bettercap is one of the listed ARP poisoning tools.","id":"Q323"},{"concept_id":"Sniffing Concepts:3","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches manipulating a switched network so otherwise hidden traffic becomes visible?","choices":["Active sniffing","Passive sniffing","Offline PCAP analysis","Static routing"],"answer":"Active sniffing","explanation":"Active sniffing injects or manipulates traffic to defeat normal switch isolation.","id":"Q324"},{"concept_id":"Sniffing Countermeasures:2","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides protecting web forms and sessions from plaintext packet capture?","choices":["HTTP","NNTP","Telnet","HTTPS"],"answer":"HTTPS","explanation":"HTTPS adds TLS encryption to HTTP.","id":"Q325"},{"concept_id":"Sniffing Countermeasures:5","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses creating an encrypted tunnel across an untrusted local or public network?","choices":["CAM table","ARP cache","Hub","VPN"],"answer":"VPN","explanation":"A VPN protects traffic even when the access network cannot be trusted.","id":"Q326"},{"concept_id":"Sniffing Countermeasures:10","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports blocking rogue DHCP server responses and optionally rate-limiting DHCP traffic?","choices":["DHCP Snooping","DAI","Root Guard","DNSSEC"],"answer":"DHCP Snooping","explanation":"DHCP snooping protects DHCP trust at the switch.","id":"Q327"},{"concept_id":"DNS Poisoning:4","variant":1,"category":"DNS Poisoning","question":"What term describes making blind forged DNS responses harder to match to outstanding resolver queries?","choices":["Static STP priority","Fixed UDP source port 53","Longer ARP timeout","Source-port randomization"],"answer":"Source-port randomization","explanation":"Unpredictable source ports add entropy to each DNS query.","id":"Q328"},{"concept_id":"Spoofing Attacks:5","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches the control message used by switches to exchange spanning-tree election and topology information?","choices":["DNS TXT","DHCPACK","BPDU","ARP reply"],"answer":"BPDU","explanation":"STP uses Bridge Protocol Data Units.","id":"Q329"},{"concept_id":"DNS Poisoning:9","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by the Ettercap plugin that forges DNS responses from configured name mappings?","choices":["macof","dhcp_snoop","arpwatch","dns_spoof"],"answer":"dns_spoof","explanation":"The supplementary material uses Ettercap's dns_spoof plugin.","id":"Q330"},{"concept_id":"DHCP Attacks:1","variant":0,"category":"DHCP Attacks","question":"Which concept best matches the server's proposed address and configuration to a client?","choices":["DHCPNAK","DHCPREQUEST","DHCPDISCOVER","DHCPOFFER"],"answer":"DHCPOFFER","explanation":"Offer proposes lease parameters after discovery.","id":"Q331"},{"concept_id":"MAC Attacks:7","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with placing a Cisco interface in access mode before applying access-port security?","choices":["switchport mode access","ip dhcp snooping trust","spanning-tree guard root","switchport mode trunk"],"answer":"switchport mode access","explanation":"The supplied Cisco sequence sets access mode before enabling port security.","id":"Q332"},{"concept_id":"Sniffing Concepts:14","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches dedicated capture equipment that can sustain heavy traffic with fewer packet drops than host software?","choices":["DHCP relay","DNS resolver","Hardware protocol analyzer","Software firewall"],"answer":"Hardware protocol analyzer","explanation":"Dedicated analyzers capture and decode traffic without altering the segment and can handle overload better.","id":"Q333"},{"concept_id":"Spoofing Attacks:2","variant":1,"category":"Spoofing Attacks","question":"What term describes using two 802.1Q tags so an inner target-VLAN tag survives native-VLAN processing?","choices":["Switch spoofing","MAC flooding","DNS poisoning","Double tagging"],"answer":"Double tagging","explanation":"Double tagging exploits native-VLAN handling across trunks.","id":"Q334"},{"concept_id":"Sniffing Countermeasures:1","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides replacing plaintext FTP-style transfers with SSH-protected file transfer?","choices":["Rlogin","FTP","SFTP/SCP","TFTP"],"answer":"SFTP/SCP","explanation":"SFTP and SCP protect both authentication and file data.","id":"Q335"},{"concept_id":"Sniffing Tools:10","variant":1,"category":"Sniffing Tools","question":"What term describes isolating and reconstructing one TCP conversation in Wireshark?","choices":["Follow TCP Stream","Capture Options","Expert Information","Protocol Hierarchy"],"answer":"Follow TCP Stream","explanation":"Follow TCP Stream filters unrelated frames and reconstructs the exchange.","id":"Q336"},{"concept_id":"MAC Attacks:1","variant":3,"category":"MAC Attacks","question":"Which concept is defined by the final three bytes of a standard MAC address identifying the interface within a vendor block?","choices":["OUI","IPv4 network portion","Bridge priority","NIC-specific portion"],"answer":"NIC-specific portion","explanation":"The final 24 bits identify the interface within the OUI allocation.","id":"Q337"},{"concept_id":"MAC Attacks:8","variant":1,"category":"MAC Attacks","question":"What term describes enabling Cisco port-security behavior on the current interface?","choices":["ip arp inspection","ip dhcp snooping","switchport port-security","spanning-tree portfast"],"answer":"switchport port-security","explanation":"This interface command enables port security.","id":"Q338"},{"concept_id":"ARP Poisoning:5","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with keeping intercepted MITM traffic moving onward to the real destination?","choices":["IP forwarding","Port Security","BPDU Guard","DNS recursion"],"answer":"IP forwarding","explanation":"Without forwarding, redirected traffic stops at the attacker and breaks the victim connection.","id":"Q339"},{"concept_id":"Sniffing Tools:4","variant":0,"category":"Sniffing Tools","question":"Which concept best matches filtering captures with primitives such as host, net, port, proto, and ether?","choices":["STIX","BPF","Sigma","YARA"],"answer":"BPF","explanation":"Berkeley Packet Filter syntax is used by tcpdump and other capture tools.","id":"Q340"},{"concept_id":"MAC Attacks:11","variant":0,"category":"MAC Attacks","question":"Which concept best matches a switch updating a known MAC to a new ingress port after seeing that source address there?","choices":["TLS resumption","MAC relearning","DNS recursion","DHCP renewal"],"answer":"MAC relearning","explanation":"Switches dynamically relearn source MAC locations.","id":"Q341"},{"concept_id":"DNS Poisoning:10","variant":1,"category":"DNS Poisoning","question":"What term describes the mapping-file structure used by Ettercap DNS spoofing for names, record types, and addresses?","choices":["PCAP structure","DNS zone-style config","STP topology file","DHCP lease database"],"answer":"DNS zone-style config","explanation":"Ettercap's spoof mappings resemble DNS zone-file entries.","id":"Q342"},{"concept_id":"DHCP Attacks:6","variant":3,"category":"DHCP Attacks","question":"Which concept is defined by a client requesting local configuration without asking for a new address lease?","choices":["Relay-Forward","DHCPInform","DHCPREQUEST","DHCPDecline"],"answer":"DHCPInform","explanation":"Inform asks for options only.","id":"Q343"},{"concept_id":"Sniffing Concepts:8","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with preventing traffic in another VLAN or subnet from reaching the sniffer interface by default?","choices":["Network segmentation","Name resolution","Encryption","Promiscuous mode"],"answer":"Network segmentation","explanation":"Segmentation limits which traffic reaches a capture point.","id":"Q344"},{"concept_id":"ARP Poisoning:11","variant":0,"category":"ARP Poisoning","question":"Which concept best matches pinning a critical IP-to-MAC mapping so dynamic forged replies cannot replace it normally?","choices":["Dynamic DNS entry","Static ARP entry","SPAN session","DHCP relay"],"answer":"Static ARP entry","explanation":"Static ARP mappings can protect stable critical peers such as a gateway.","id":"Q345"},{"concept_id":"Sniffing Detection Techniques:7","variant":1,"category":"Sniffing Detection Techniques","question":"What term describes indicating a possible rogue DHCP server on an untrusted access port?","choices":["Normal DHCPREQUEST","ARP broadcast","Unauthorized DHCPOFFER","Valid root BPDU"],"answer":"Unauthorized DHCPOFFER","explanation":"Server-side DHCP messages should come only from authorized infrastructure.","id":"Q346"},{"concept_id":"Sniffing Concepts:4","variant":2,"category":"Sniffing Concepts","question":"Which option is most directly associated with repeating received Ethernet traffic out every port?","choices":["Router","Hub","Switch","Network TAP"],"answer":"Hub","explanation":"A hub creates a shared collision domain, so every attached system can see the frames.","id":"Q347"},{"concept_id":"MAC Attacks:0","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with the first three bytes of a standard MAC address identifying the vendor allocation?","choices":["VLAN ID","OUI","NIC-specific portion","ARP opcode"],"answer":"OUI","explanation":"The OUI is the vendor-assigned first 24 bits of a MAC address.","id":"Q348"},{"concept_id":"Spoofing Attacks:3","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by the VLAN whose untagged trunk handling is exploited by classic double tagging?","choices":["Private VLAN","Voice VLAN","Management VLAN","Native VLAN"],"answer":"Native VLAN","explanation":"The outer tag matches the native VLAN and is removed by the first switch.","id":"Q349"},{"concept_id":"Spoofing Attacks:8","variant":2,"category":"Spoofing Attacks","question":"Which option is most directly associated with the default bridge-priority value listed in the supplied CEH notes?","choices":["32769","65535","32768","4096"],"answer":"32769","explanation":"The provided chapter explicitly lists 32769 as the default value to remember.","id":"Q350"}],[{"concept_id":"Sniffing Countermeasures:13","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses rejecting forged DNS data through cryptographic validation?","choices":["Port Security","DHCP Snooping","DNSSEC","Root Guard"],"answer":"DNSSEC","explanation":"DNSSEC protects DNS authenticity and integrity.","id":"Q351"},{"concept_id":"DHCP Attacks:8","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with supplying clients with attacker-controlled gateway, DNS, or address settings?","choices":["Port security","DHCP starvation","Rogue DHCP server","MAC flooding"],"answer":"Rogue DHCP server","explanation":"A rogue server wins the DHCP race and pushes malicious network configuration.","id":"Q352"},{"concept_id":"Sniffing Countermeasures:9","variant":0,"category":"Sniffing Countermeasures","question":"Which control most directly provides limiting MAC identities on user-facing switch ports?","choices":["Port Security","HSTS","DNSSEC","S/MIME"],"answer":"Port Security","explanation":"Port security helps mitigate MAC flooding and spoofing.","id":"Q353"},{"concept_id":"Spoofing Attacks:11","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by blocking source IP/MAC combinations that do not match trusted binding information?","choices":["TAP","SPAN","IP Source Guard","Protocol Hierarchy"],"answer":"IP Source Guard","explanation":"IP Source Guard can use DHCP snooping data to enforce source identity.","id":"Q354"},{"concept_id":"Sniffing Countermeasures:5","variant":3,"category":"Sniffing Countermeasures","question":"Which protection most directly supports creating an encrypted tunnel across an untrusted local or public network?","choices":["Hub","CAM table","VPN","ARP cache"],"answer":"VPN","explanation":"A VPN protects traffic even when the access network cannot be trusted.","id":"Q355"},{"concept_id":"Sniffing Concepts:5","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches forwarding normal unicast frames only toward the learned destination port?","choices":["Hub","Repeater","Switch","Network TAP"],"answer":"Switch","explanation":"A switch uses its CAM table to limit unicast forwarding.","id":"Q356"},{"concept_id":"Sniffing Detection Techniques:10","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with collecting frames marked as errors, warnings, notes, or chat-level events?","choices":["Protocol Hierarchy","Capture Options","Follow TCP Stream","Wireshark Expert Information"],"answer":"Wireshark Expert Information","explanation":"Expert Information highlights packets Wireshark considers noteworthy.","id":"Q357"},{"concept_id":"ARP Poisoning:14","variant":0,"category":"ARP Poisoning","question":"Which concept best matches monitoring voice traffic after ARP-based traffic redirection or mirroring?","choices":["DNS tunneling","SNMP polling","VoIP call tapping","SMTP relaying"],"answer":"VoIP call tapping","explanation":"The CEH notes list VoIP call tapping as a threat enabled by ARP poisoning.","id":"Q358"},{"concept_id":"Sniffing Detection Techniques:9","variant":3,"category":"Sniffing Detection Techniques","question":"Which concept is defined by indicating a possible attempt to alter STP root placement?","choices":["Unexpected superior BPDU","Valid DNS response","Normal DHCP renewal","Stable ARP entry"],"answer":"Unexpected superior BPDU","explanation":"Superior BPDUs on the wrong port can indicate a rogue-switch/root attack.","id":"Q359"},{"concept_id":"ARP Poisoning:3","variant":1,"category":"ARP Poisoning","question":"What term describes advertising an IP-to-MAC mapping without waiting for a matching request?","choices":["Gratuitous ARP","DHCPInform","Signed ARP","ARP probe over TCP"],"answer":"Gratuitous ARP","explanation":"Unsolicited ARP messages can update caches and are useful for poisoning.","id":"Q360"},{"concept_id":"Sniffing Detection Techniques:11","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches showing traffic volume between endpoint pairs to identify unusually chatty relationships?","choices":["Protocol Hierarchy","Display Filter history","Packet Bytes","Conversation Statistics"],"answer":"Conversation Statistics","explanation":"Conversation statistics summarize endpoint-pair traffic.","id":"Q361"},{"concept_id":"DNS Poisoning:0","variant":0,"category":"DNS Poisoning","question":"Which concept best matches corrupting hostname-to-IP resolution so clients connect to an attacker-chosen address?","choices":["MAC flooding","DNS poisoning","ARP poisoning","DHCP starvation"],"answer":"DNS poisoning","explanation":"DNS poisoning changes name resolution rather than local IP-to-MAC resolution.","id":"Q362"},{"concept_id":"MAC Attacks:10","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with cloning or changing a client MAC identity to impersonate an authorized endpoint?","choices":["MAC spoofing","STP root attack","MAC flooding","DHCP starvation"],"answer":"MAC spoofing","explanation":"MAC spoofing reuses a layer-2 identity rather than generating thousands of addresses.","id":"Q363"},{"concept_id":"Sniffing Countermeasures:8","variant":1,"category":"Sniffing Countermeasures","question":"What defense best addresses restricting network access to trusted source or destination ranges?","choices":["SPAN","ACL","Hub","BPF on the sniffer"],"answer":"ACL","explanation":"Access-control lists limit which systems may communicate.","id":"Q364"},{"concept_id":"Sniffing Concepts:6","variant":0,"category":"Sniffing Concepts","question":"Which concept best matches mapping learned MAC addresses to switch ports and VLAN context?","choices":["CAM table","DNS cache","ARP cache","DHCP scope"],"answer":"CAM table","explanation":"The CAM table is the switch's MAC-to-port forwarding database.","id":"Q365"},{"concept_id":"ARP Poisoning:13","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with abusing captured session information after gaining an ARP-based MITM position?","choices":["DHCP snooping","DNSSEC signing","Session hijacking","Port security"],"answer":"Session hijacking","explanation":"Intercepted sessions can expose tokens or other authentication state.","id":"Q366"},{"concept_id":"MAC Attacks:7","variant":1,"category":"MAC Attacks","question":"What term describes placing a Cisco interface in access mode before applying access-port security?","choices":["switchport mode access","switchport mode trunk","ip dhcp snooping trust","spanning-tree guard root"],"answer":"switchport mode access","explanation":"The supplied Cisco sequence sets access mode before enabling port security.","id":"Q367"},{"concept_id":"MAC Attacks:0","variant":1,"category":"MAC Attacks","question":"What term describes the first three bytes of a standard MAC address identifying the vendor allocation?","choices":["OUI","NIC-specific portion","VLAN ID","ARP opcode"],"answer":"OUI","explanation":"The OUI is the vendor-assigned first 24 bits of a MAC address.","id":"Q368"},{"concept_id":"Sniffing Countermeasures:3","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for replacing community-string SNMP versions with stronger authentication and encryption?","choices":["SNMPv3","TFTP","SNMPv1","SNMPv2c"],"answer":"SNMPv3","explanation":"SNMPv3 provides modern security controls for management traffic.","id":"Q369"},{"concept_id":"ARP Poisoning:10","variant":2,"category":"ARP Poisoning","question":"Which option is most directly associated with the reference DAI commonly checks when validating dynamic ARP claims?","choices":["TCP connection table","DNS cache","DHCP snooping binding table","STP topology table"],"answer":"DHCP snooping binding table","explanation":"DAI compares claimed IP/MAC/interface data with trusted DHCP bindings.","id":"Q370"},{"concept_id":"Sniffing Detection Techniques:2","variant":2,"category":"Sniffing Detection Techniques","question":"Which option is most directly associated with using a non-broadcast ARP plus a follow-up ping to test whether a promiscuous host cached data it should not have seen?","choices":["DNS method","Ping method","ARP method","DHCP method"],"answer":"ARP method","explanation":"The ARP method relies on promiscuous processing of unusual layer-2 traffic.","id":"Q371"},{"concept_id":"Sniffing Tools:4","variant":2,"category":"Sniffing Tools","question":"Which option is most directly associated with filtering captures with primitives such as host, net, port, proto, and ether?","choices":["BPF","YARA","STIX","Sigma"],"answer":"BPF","explanation":"Berkeley Packet Filter syntax is used by tcpdump and other capture tools.","id":"Q372"},{"concept_id":"DNS Poisoning:11","variant":0,"category":"DNS Poisoning","question":"Which concept best matches reducing abusive volumes of negative DNS responses or queries?","choices":["NXDOMAIN rate limiting","BPDU Guard","Port Security","ARP inspection"],"answer":"NXDOMAIN rate limiting","explanation":"The CEH countermeasures include rate limiting for NXDOMAIN activity.","id":"Q373"},{"concept_id":"Spoofing Attacks:6","variant":0,"category":"Spoofing Attacks","question":"Which concept best matches the STP election value combining bridge priority and MAC address?","choices":["DHCP binding","DNS transaction ID","Bridge ID","ARP cache entry"],"answer":"Bridge ID","explanation":"The bridge with the lowest BID wins root election.","id":"Q374"},{"concept_id":"ARP Poisoning:11","variant":1,"category":"ARP Poisoning","question":"What term describes pinning a critical IP-to-MAC mapping so dynamic forged replies cannot replace it normally?","choices":["Dynamic DNS entry","Static ARP entry","SPAN session","DHCP relay"],"answer":"Static ARP entry","explanation":"Static ARP mappings can protect stable critical peers such as a gateway.","id":"Q375"},{"concept_id":"DHCP Attacks:6","variant":0,"category":"DHCP Attacks","question":"Which concept best matches a client requesting local configuration without asking for a new address lease?","choices":["DHCPDecline","DHCPREQUEST","DHCPInform","Relay-Forward"],"answer":"DHCPInform","explanation":"Inform asks for options only.","id":"Q376"},{"concept_id":"DHCP Attacks:10","variant":2,"category":"DHCP Attacks","question":"Which option is most directly associated with filtering DHCP server messages according to trusted and untrusted switch ports?","choices":["Root Guard","DAI","DHCP Snooping","DNSSEC"],"answer":"DHCP Snooping","explanation":"DHCP snooping blocks rogue server responses and builds trusted lease bindings.","id":"Q377"},{"concept_id":"Sniffing Tools:3","variant":2,"category":"Sniffing Tools","question":"Which program would you choose for interactively browsing captured frames and decoding the full protocol stack in a GUI?","choices":["Yersinia","macof","DHCPig","Wireshark"],"answer":"Wireshark","explanation":"Wireshark is the standard graphical packet analyzer.","id":"Q378"},{"concept_id":"Sniffing Concepts:1","variant":1,"category":"Sniffing Concepts","question":"What term describes a NIC forwarding frames to the OS even when the destination MAC is different?","choices":["Monitor mode","Trunk mode","Promiscuous mode","Half-duplex mode"],"answer":"Promiscuous mode","explanation":"Promiscuous mode disables normal destination-MAC filtering on the NIC.","id":"Q379"},{"concept_id":"MAC Attacks:2","variant":1,"category":"MAC Attacks","question":"What term describes a MAC address whose I/G bit is set to 1?","choices":["Multicast MAC","Unicast MAC","Globally unique MAC","Locally administered MAC"],"answer":"Multicast MAC","explanation":"The low-order I/G bit distinguishes group/multicast from individual/unicast addressing.","id":"Q380"},{"concept_id":"Sniffing Tools:14","variant":3,"category":"Sniffing Tools","question":"Which concept is defined by analyzing captures with a feature that maps public IPs geographically?","choices":["Observer Analyzer","OmniPeek","RITA","PRTG"],"answer":"OmniPeek","explanation":"The notes associate OmniPeek with displaying public IPs on a Google Map.","id":"Q381"},{"concept_id":"DNS Poisoning:1","variant":1,"category":"DNS Poisoning","question":"What term describes forging DNS answers on a switched LAN after obtaining local traffic visibility?","choices":["Offline zone signing","Internet DNS spoofing","Proxy DNS poisoning","Intranet DNS spoofing"],"answer":"Intranet DNS spoofing","explanation":"The supplied flow uses local MITM positioning before forged DNS responses.","id":"Q382"},{"concept_id":"Sniffing Tools:0","variant":1,"category":"Sniffing Tools","question":"What utility best fits capturing packets from the command line on Linux and BSD?","choices":["NetScanTools Pro","tcpdump","WinDump","Wireshark GUI"],"answer":"tcpdump","explanation":"tcpdump is the classic Unix-like CLI packet capture tool.","id":"Q383"},{"concept_id":"Sniffing Countermeasures:6","variant":2,"category":"Sniffing Countermeasures","question":"Which mitigation is intended for pinning stable critical IP/MAC mappings to resist local ARP cache poisoning?","choices":["SPAN","Static ARP entries","Dynamic DNS","DHCP relay"],"answer":"Static ARP entries","explanation":"Static mappings prevent normal dynamic overwrite of critical peers.","id":"Q384"},{"concept_id":"Spoofing Attacks:5","variant":1,"category":"Spoofing Attacks","question":"What term describes the control message used by switches to exchange spanning-tree election and topology information?","choices":["DNS TXT","ARP reply","DHCPACK","BPDU"],"answer":"BPDU","explanation":"STP uses Bridge Protocol Data Units.","id":"Q385"},{"concept_id":"DNS Poisoning:4","variant":3,"category":"DNS Poisoning","question":"Which concept is defined by making blind forged DNS responses harder to match to outstanding resolver queries?","choices":["Static STP priority","Source-port randomization","Fixed UDP source port 53","Longer ARP timeout"],"answer":"Source-port randomization","explanation":"Unpredictable source ports add entropy to each DNS query.","id":"Q386"},{"concept_id":"Spoofing Attacks:1","variant":3,"category":"Spoofing Attacks","question":"Which concept is defined by forming an unauthorized trunk by pretending to be a switching peer?","choices":["Switch spoofing","Double tagging","ARP poisoning","DHCP starvation"],"answer":"Switch spoofing","explanation":"Switch spoofing is one of the two VLAN-hopping techniques.","id":"Q387"},{"concept_id":"Sniffing Tools:5","variant":2,"category":"Sniffing Tools","question":"Which command setting best matches disabling name resolution in tcpdump for faster numeric output?","choices":["-r","-w","-X","-n"],"answer":"-n","explanation":"`-n` prevents address-to-name resolution.","id":"Q388"},{"concept_id":"DNS Poisoning:2","variant":0,"category":"DNS Poisoning","question":"Which concept best matches inserting false records into a resolver cache so later clients receive the wrong address?","choices":["DHCP starvation","MAC flooding","ARP cache poisoning","DNS cache poisoning"],"answer":"DNS cache poisoning","explanation":"Cache poisoning persists while the false record remains cached.","id":"Q389"},{"concept_id":"DHCP Attacks:9","variant":0,"category":"DHCP Attacks","question":"Which concept best matches generating DHCP starvation traffic in the supplied CEH tooling?","choices":["Yersinia","tshark","arpwatch","macof"],"answer":"Yersinia","explanation":"Yersinia is listed as a DHCP attack tool.","id":"Q390"},{"concept_id":"Sniffing Concepts:13","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by packet loss caused when mirrored source bandwidth exceeds the monitoring port capacity?","choices":["ARP poisoning","CAM aging","DNS recursion","Oversubscription"],"answer":"Oversubscription","explanation":"A SPAN destination can drop packets when it receives more mirrored traffic than it can transmit.","id":"Q391"},{"concept_id":"Sniffing Detection Techniques:5","variant":0,"category":"Sniffing Detection Techniques","question":"Which concept best matches revealing abnormally many MAC addresses learned on one access port?","choices":["TLS certificate renewal","DNSSEC success","Port-security violation","Normal DHCPACK"],"answer":"Port-security violation","explanation":"MAC flooding often triggers port-security or MAC-learning alarms.","id":"Q392"},{"concept_id":"Spoofing Attacks:12","variant":1,"category":"Spoofing Attacks","question":"What term describes downgrading victim-side HTTPS links to HTTP after a MITM path already exists?","choices":["arpwatch","macof","sslstrip","Yersinia"],"answer":"sslstrip","explanation":"sslstrip acts as a transparent proxy and requires traffic to pass through the attacker first.","id":"Q067"},{"concept_id":"Sniffing Concepts:9","variant":1,"category":"Sniffing Concepts","question":"What term describes leaving useful packet metadata visible while making protected payload content unreadable?","choices":["Port mirroring","Encryption","MAC learning","Segmentation"],"answer":"Encryption","explanation":"Encrypted traffic can still expose headers, but the application content remains protected without keys.","id":"Q394"},{"concept_id":"Sniffing Concepts:14","variant":3,"category":"Sniffing Concepts","question":"Which concept is defined by dedicated capture equipment that can sustain heavy traffic with fewer packet drops than host software?","choices":["DHCP relay","DNS resolver","Software firewall","Hardware protocol analyzer"],"answer":"Hardware protocol analyzer","explanation":"Dedicated analyzers capture and decode traffic without altering the segment and can handle overload better.","id":"Q395"},{"concept_id":"MAC Attacks:9","variant":2,"category":"MAC Attacks","question":"Which option is most directly associated with moving a specific victim MAC mapping toward the attacker's switch port?","choices":["DNS cache poisoning","DHCP starvation","MAC flooding","Switch port stealing"],"answer":"Switch port stealing","explanation":"Port stealing targets a specific learned MAC location rather than exhausting the whole CAM table.","id":"Q396"},{"concept_id":"DHCP Attacks:12","variant":0,"category":"DHCP Attacks","question":"Which concept best matches limiting DHCP packets per second on an access port to reduce starvation?","choices":["no ip dhcp snooping information option","ip dhcp snooping trust","show ip dhcp snooping","ip dhcp snooping limit rate"],"answer":"ip dhcp snooping limit rate","explanation":"Rate limiting constrains request floods.","id":"Q397"},{"concept_id":"ARP Poisoning:1","variant":3,"category":"ARP Poisoning","question":"Which concept is defined by broadcasting a query when a host knows an IP address but not the corresponding MAC?","choices":["ARP reply","DHCPACK","ARP request","DNS answer"],"answer":"ARP request","explanation":"ARP requests are broadcast on the local segment.","id":"Q398"},{"concept_id":"DHCP Attacks:7","variant":1,"category":"DHCP Attacks","question":"What term describes exhausting a DHCP scope with forged lease requests so legitimate users cannot obtain addresses?","choices":["Rogue DHCP","MAC spoofing","ARP poisoning","DHCP starvation"],"answer":"DHCP starvation","explanation":"Starvation is a DHCP denial-of-service attack against address availability.","id":"Q399"},{"concept_id":"Sniffing Tools:12","variant":1,"category":"Sniffing Tools","question":"What term describes scanning an IP range for likely promiscuous-mode interfaces?","choices":["Ettercap","NetScanTools Pro","macof","Yersinia"],"answer":"NetScanTools Pro","explanation":"The CEH notes list its Promiscuous Mode Scanner.","id":"Q400"}],[{"concept_id":"Sniffing Tools:2","variant":2,"category":"Sniffing Tools","question":"Which program would you choose for using Wireshark's dissectors from the command line with field-oriented output?","choices":["WinDump","tcpdump","tshark","Ettercap"],"answer":"tshark","explanation":"tshark is Wireshark's CLI version.","id":"Q401"},{"concept_id":"Spoofing Attacks:1","variant":2,"category":"Spoofing Attacks","question":"W
