 quiz:[
  {q:{fr:"Quel composant de malware sert à évader l'antivirus en cachant son existence ?",en:"Which malware component evades antivirus by hiding its existence?"},opts:[{fr:"Crypter",en:"Crypter"},{fr:"Packer",en:"Packer"},{fr:"Dropper",en:"Dropper"},{fr:"Payload",en:"Payload"}],a:0,ex:{fr:"Le Crypter cache l'existence du malware et le protège du reverse engineering. Le Packer compresse, le Dropper installe, le Payload agit.",en:"The Crypter conceals the malware's existence and protects it from reverse engineering. The Packer compresses, the Dropper installs, the Payload acts."}},
  {q:{fr:"Quel est l'objectif principal d'une APT ?",en:"What is the main objective of an APT?"},opts:[{fr:"obtenir de l'information sensible en restant indétecté",en:"obtain sensitive information while staying undetected"},{fr:"détruire les données au plus vite",en:"destroy data as fast as possible"},{fr:"chiffrer les fichiers contre rançon",en:"encrypt files for ransom"},{fr:"défigurer un site web",en:"deface a website"}],a:0,ex:{fr:"Une APT vise l'exfiltration prolongée d'information sensible, pas le sabotage. Cycle : Preparation → Intrusion → Expansion → Persistence → Exfiltration → Cleanup.",en:"An APT aims at prolonged exfiltration of sensitive information, not sabotage. Lifecycle: Preparation → Intrusion → Expansion → Persistence → Exfiltration → Cleanup."}},
  {q:{fr:"Où réside principalement un malware fileless ?",en:"Where does fileless malware mainly reside?"},opts:[{fr:"en mémoire (RAM)",en:"in memory (RAM)"},{fr:"dans le MBR",en:"in the MBR"},{fr:"dans le SAM",en:"in the SAM"},{fr:"sur une partition FAT",en:"on a FAT partition"}],a:0,ex:{fr:"Le fileless réside en RAM et abuse d'outils légitimes (LOL, ex. PowerShell/WMI) → très difficile à détecter.",en:"Fileless resides in RAM and abuses legitimate tools (LOL, e.g. PowerShell/WMI) → very hard to detect."}},
  {q:{fr:"Quel virus se réécrit entièrement à chaque itération ?",en:"Which virus fully rewrites itself each iteration?"},opts:[{fr:"métamorphe",en:"metamorphic"},{fr:"polymorphe",en:"polymorphic"},{fr:"macro",en:"macro"},{fr:"boot sector",en:"boot sector"}],a:0,ex:{fr:"Le virus métamorphe se réécrit complètement (plus avancé). Le polymorphe change seulement son module de chiffrement à chaque copie.",en:"The metamorphic virus fully rewrites itself (more advanced). The polymorphic one only changes its encryption module each copy."}},
  {q:{fr:"Quelle est la différence clé entre un virus et un worm ?",en:"What is the key difference between a virus and a worm?"},opts:[{fr:"le worm se propage seul via une vulnérabilité, sans fichier hôte",en:"the worm self-propagates via a vulnerability, no host file"},{fr:"le virus est plus rapide à se propager",en:"the virus spreads faster"},{fr:"le worm a besoin d'une action utilisateur",en:"the worm needs user action"},{fr:"le virus n'infecte que le réseau",en:"the virus only infects the network"}],a:0,ex:{fr:"Le worm exploite une vulnérabilité et se réplique seul (propagation rapide via réseau/e-mail) ; le virus a besoin d'un fichier hôte et souvent d'une action utilisateur.",en:"The worm exploits a vulnerability and self-replicates (fast network/email spread); the virus needs a host file and often user action."}},
  {q:{fr:"« LOL » dans le contexte du fileless malware signifie…",en:"\"LOL\" in the fileless malware context means…"},opts:[{fr:"Living-off-the-Land (abus d'outils préinstallés)",en:"Living-off-the-Land (abusing pre-installed tools)"},{fr:"Lots of Logs",en:"Lots of Logs"},{fr:"Low-Order Language",en:"Low-Order Language"},{fr:"Local Only Loader",en:"Local Only Loader"}],a:0,ex:{fr:"Living-off-the-Land : le malware abuse d'outils système déjà installés (PowerShell, WMI, certutil) au lieu de déposer ses propres binaires.",en:"Living-off-the-Land: the malware abuses already-installed system tools (PowerShell, WMI, certutil) instead of dropping its own binaries."}},
  {q:{fr:"Quelles sont les 3 étapes de l'analyse de malware ?",en:"What are the 3 steps of malware analysis?"},opts:[{fr:"préparer le testbed, analyse statique, analyse dynamique",en:"prepare the testbed, static analysis, dynamic analysis"},{fr:"scanner, chiffrer, supprimer",en:"scan, encrypt, delete"},{fr:"infiltration, exécution, exfiltration",en:"infiltration, execution, exfiltration"},{fr:"baselining, hooking, cleanup",en:"baselining, hooking, cleanup"}],a:0,ex:{fr:"1. Testbed (VM isolée) → 2. Statique (sans exécuter) → 3. Dynamique (en exécutant, baselining + host integrity monitoring).",en:"1. Testbed (isolated VM) → 2. Static (without running) → 3. Dynamic (by running, baselining + host integrity monitoring)."}},
  {q:{fr:"En quoi consiste l'analyse statique de malware ?",en:"What does static malware analysis consist of?"},opts:[{fr:"examiner l'exécutable sans l'exécuter",en:"examining the executable without running it"},{fr:"l'exécuter dans une sandbox",en:"running it in a sandbox"},{fr:"surveiller le trafic réseau en direct",en:"monitoring live network traffic"},{fr:"comparer deux snapshots système",en:"comparing two system snapshots"}],a:0,ex:{fr:"L'analyse statique inspecte le binaire sans l'exécuter (strings, readelf, PE, désassemblage) — sûr. Le dynamique l'exécute en environnement isolé.",en:"Static analysis inspects the binary without running it (strings, readelf, PE, disassembly) — safe. Dynamic runs it in an isolated environment."}},
  {q:{fr:"Quel outil sert à écrire des règles de reconnaissance de malware par motifs ?",en:"Which tool writes pattern-based malware recognition rules?"},opts:[{fr:"YARA",en:"YARA"},{fr:"Nikto",en:"Nikto"},{fr:"Responder",en:"Responder"},{fr:"Maltego",en:"Maltego"}],a:0,ex:{fr:"YARA permet de définir des règles (strings/conditions) pour identifier des familles de malwares.",en:"YARA lets you define rules (strings/conditions) to identify malware families."}},
  {q:{fr:"Quelle méthode de détection exécute le code dans une VM (efficace contre le polymorphe) ?",en:"Which detection method runs code in a VM (effective vs polymorphic)?"},opts:[{fr:"Code emulation",en:"Code emulation"},{fr:"Scanning par signature",en:"Signature scanning"},{fr:"Integrity checking",en:"Integrity checking"},{fr:"Interception",en:"Interception"}],a:0,ex:{fr:"Le code emulation exécute le code dans une VM pour simuler CPU/mémoire — efficace contre les virus chiffrés/polymorphes. L'heuristique détecte l'inconnu mais fait des faux positifs.",en:"Code emulation runs the code in a VM to simulate CPU/memory — effective vs encrypted/polymorphic viruses. Heuristics detect the unknown but cause false positives."}}
 ]
},
{
 n:9, exam:"312-50",
 t:{fr:"Ingénierie sociale",en:"Social Engineering"},
 sub:{fr:"Manipuler l'humain, pas la machine",en:"Manipulating people, not machines"},
 cards:[

  {id:"concepts", t:{fr:"Concepts",en:"Concepts"},
   s:{fr:"Leviers psychologiques, cibles, 4 phases",en:"Psychological levers, targets, 4 phases"},
   blocks:[
    {t:"p",fr:"L'**ingénierie sociale** est l'art de **convaincre des personnes** de révéler des informations confidentielles. Elle vise la **faiblesse humaine**, pas la sécurité réseau — aucun logiciel/matériel ne peut la contrer, seule la **vigilance constante**.",en:"**Social engineering** is the art of **convincing people** to reveal confidential information. It targets the **human weakness**, not network security — no software/hardware defends against it, only **constant vigilance**."},
    {t:"h",fr:"Leviers psychologiques",en:"Psychological levers"},
    {t:"p",fr:"Comportements exploitables : **autorité, intimidation, consensus (preuve sociale), rareté, urgence, familiarité, confiance, appât du gain**.",en:"Exploitable behaviors: **authority, intimidation, consensus (social proof), scarcity, urgency, familiarity, trust, greed**."},
    {t:"h",fr:"Cibles privilégiées",en:"Favored targets"},
    {t:"ul",items:[
      {fr:"Réceptionnistes / **help-desk** (veulent aider)",en:"Receptionists / **help desk** (want to help)"},
      {fr:"Support technique, **administrateurs système** (détiennent l'info critique)",en:"Technical support, **system administrators** (hold critical info)"},
      {fr:"Utilisateurs/clients, fournisseurs, **cadres dirigeants**",en:"Users/clients, vendors, **senior executives**"}]},
    {t:"h",fr:"Les 4 phases de l'attaque",en:"The 4 attack phases"},
    {t:"ol",items:[
      {fr:"**Rechercher** l'entreprise cible (dumpster diving, site web)",en:"**Research** the target company (dumpster diving, website)"},
      {fr:"**Sélectionner** une cible (les employés mécontents sont préférés)",en:"**Select** a target (disgruntled employees preferred)"},
      {fr:"**Développer** une relation",en:"**Develop** a relationship"},
      {fr:"**Exploiter** la relation pour extraire l'info",en:"**Exploit** the relationship to extract info"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"L'ingénierie sociale vise le **maillon humain**. Leviers récurrents : autorité, urgence, rareté, confiance. Les 4 phases : Recherche → Sélection → Relation → Exploitation.",en:"Social engineering targets the **human link**. Recurring levers: authority, urgency, scarcity, trust. The 4 phases: Research → Select → Relationship → Exploit."},
    {t:"recap",items:[
      {k:"Cible",fr:"la faiblesse humaine",en:"the human weakness"},
      {k:"Leviers",fr:"autorité, urgence, rareté, confiance, appât du gain",en:"authority, urgency, scarcity, trust, greed"},
      {k:"4 phases",fr:"Recherche · Sélection · Relation · Exploitation",en:"Research · Select · Relationship · Exploit"}]}
   ]},

  {id:"human", t:{fr:"Techniques humaines",en:"Human-based techniques"},
   s:{fr:"Impersonation, piggybacking vs tailgating",en:"Impersonation, piggybacking vs tailgating"},
   blocks:[
    {t:"p",fr:"L'**impersonation** (se faire passer pour quelqu'un de légitime) est la technique humaine la plus courante : faux utilisateur, faux VIP, faux support technique, faux réparateur, ou via **vishing** (phishing vocal).",en:"**Impersonation** (posing as someone legitimate) is the most common human technique: fake user, fake VIP, fake tech support, fake repairman, or via **vishing** (voice phishing)."},
    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[
      [{fr:"Eavesdropping",en:"Eavesdropping"},{fr:"écoute/lecture non autorisée de communications",en:"unauthorized listening/reading of communications"}],
      [{fr:"Shoulder surfing",en:"Shoulder surfing"},{fr:"observer par-dessus l'épaule (mot de passe, PIN)",en:"looking over the shoulder (password, PIN)"}],
      [{fr:"Dumpster diving",en:"Dumpster diving"},{fr:"fouiller les poubelles (factures, notes, mots de passe)",en:"searching trash (bills, notes, passwords)"}],
      [{fr:"**Piggybacking**",en:"**Piggybacking**"},{fr:"une personne autorisée laisse **sciemment** entrer (« j'ai oublié mon badge »)",en:"an authorized person **knowingly** lets someone in (\"I forgot my badge\")"}],
      [{fr:"**Tailgating**",en:"**Tailgating**"},{fr:"l'attaquant se faufile **sans consentement** (faux badge, suit de près)",en:"the attacker sneaks in **without consent** (fake badge, follows closely)"}],
      [{fr:"Reverse SE",en:"Reverse SE"},{fr:"l'attaquant se pose en autorité → la cible vient à lui (sabotage/marketing/support)",en:"the attacker poses as authority → the target comes to them (sabotage/marketing/support)"}],
      [{fr:"Quid pro quo",en:"Quid pro quo"},{fr:"« quelque chose contre quelque chose » (aide contre identifiants)",en:"\"something for something\" (help for credentials)"}],
      [{fr:"Elicitation",en:"Elicitation"},{fr:"extraire l'info via une conversation anodine",en:"extract info via disarming conversation"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Piggybacking = AVEC consentement** de la personne autorisée. **Tailgating = SANS consentement** (faux badge, on se faufile). Reverse SE = 3 techniques : sabotage, marketing, support.",en:"**Piggybacking = WITH consent** of the authorized person. **Tailgating = WITHOUT consent** (fake badge, sneaking in). Reverse SE = 3 techniques: sabotage, marketing, support."},
    {t:"recap",items:[
      {k:"La plus courante",fr:"impersonation (+ vishing)",en:"impersonation (+ vishing)"},
      {k:"Piggybacking",fr:"avec consentement",en:"with consent"},
      {k:"Tailgating",fr:"sans consentement (faux badge)",en:"without consent (fake badge)"},
      {k:"Quid pro quo",fr:"service contre info",en:"service for info"}]}
   ]},

  {id:"computer", t:{fr:"Techniques informatiques",en:"Computer-based techniques"},
   s:{fr:"Phishing (10 types), scareware, deepfake",en:"Phishing (10 types), scareware, deepfake"},
   blocks:[
    {t:"p",fr:"Le **phishing** envoie un e-mail illégitime imitant un site de confiance pour capter des identifiants, en redirigeant vers une fausse page.",en:"**Phishing** sends an illegitimate email mimicking a trusted site to capture credentials, redirecting to a fake page."},
    {t:"table",head:{fr:["Type","Cible / principe"],en:["Type","Target / principle"]},rows:[
      [{fr:"**Spear phishing**",en:"**Spear phishing**"},{fr:"individus/petit groupe ciblés",en:"targeted individuals/small group"}],
      [{fr:"**Whaling**",en:"**Whaling**"},{fr:"cadres dirigeants (CEO, CFO)",en:"high-profile execs (CEO, CFO)"}],
      [{fr:"**Pharming**",en:"**Pharming**"},{fr:"« phishing sans appât » — DNS cache poisoning / modif du fichier hosts",en:"\"phishing without a lure\" — DNS cache poisoning / hosts file mod"}],
      [{fr:"**Clone phishing**",en:"**Clone phishing**"},{fr:"copie quasi identique d'un vrai message, lien modifié",en:"near-identical copy of a real message, altered link"}],
      [{fr:"**Consent phishing**",en:"**Consent phishing**"},{fr:"abuse d'**OAuth** — fausse appli demande des permissions",en:"abuses **OAuth** — fake app requests permissions"}],
      [{fr:"**Tabnabbing**",en:"**Tabnabbing**"},{fr:"change le contenu d'un onglet inactif en page de login",en:"changes an inactive tab's content to a login page"}],
      [{fr:"Spimming / Search engine",en:"Spimming / Search engine"},{fr:"via messagerie instantanée / résultats de recherche piégés",en:"via instant messaging / poisoned search results"}]]},
    {t:"p",fr:"Autres : **pop-ups** frauduleux, **hoax letters**, **chain letters**, **scareware** (fausse alerte urgente). L'IA (ChatGPT) accélère la rédaction de mails de phishing crédibles.",en:"Others: fraudulent **pop-ups**, **hoax letters**, **chain letters**, **scareware** (fake urgent alert). AI (ChatGPT) speeds up crafting convincing phishing emails."},
    {t:"h",fr:"Deepfake",en:"Deepfake"},
    {t:"p",fr:"Contenu vidéo/audio généré par IA imitant une vraie personne (source video = visage à copier, destination video = cible). Outils : **DeepFaceLab, Synthesia**. Défense : **watermarking**, **blockchain**, détection IA (mouvements oculaires anormaux, lip-sync).",en:"AI-generated video/audio impersonating a real person (source video = face to copy, destination video = target). Tools: **DeepFaceLab, Synthesia**. Defense: **watermarking**, **blockchain**, AI detection (abnormal eye movement, lip-sync)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Whaling** = dirigeants. **Pharming** = « phishing sans appât » (DNS/hosts). **Consent phishing** = OAuth. **Tabnabbing** = onglet inactif détourné.",en:"**Whaling** = executives. **Pharming** = \"phishing without a lure\" (DNS/hosts). **Consent phishing** = OAuth. **Tabnabbing** = hijacked inactive tab."},
    {t:"recap",items:[
      {k:"Whaling",fr:"cadres dirigeants",en:"senior executives"},
      {k:"Pharming",fr:"DNS/hosts, sans appât",en:"DNS/hosts, no lure"},
      {k:"Consent phishing",fr:"abuse d'OAuth",en:"abuses OAuth"},
      {k:"Deepfake",fr:"IA ; défense watermarking/blockchain",en:"AI; defense watermarking/blockchain"}]}
   ]},

  {id:"identity", t:{fr:"Vol d'identité",en:"Identity theft"},
   s:{fr:"6 types, PII, techniques",en:"6 types, PII, techniques"},
   blocks:[
    {t:"p",fr:"Le **vol d'identité** : un imposteur vole des **PII** (nom, n° de carte, SSN, permis…) pour commettre une fraude, ou pour **usurper un employé** et accéder physiquement aux locaux.",en:"**Identity theft**: an imposter steals **PII** (name, card number, SSN, license…) to commit fraud, or to **impersonate an employee** and gain physical access."},
    {t:"table",head:{fr:["Type","Détail"],en:["Type","Detail"]},rows:[
      [{fr:"Criminal",en:"Criminal"},{fr:"donne l'identité d'autrui à la police",en:"gives someone's identity to the police"}],
      [{fr:"Financial",en:"Financial"},{fr:"vol de données bancaires/carte",en:"stolen bank/card data"}],
      [{fr:"Driver's license",en:"Driver's license"},{fr:"le **plus facile** — infractions sous le nom de la victime",en:"the **easiest** — traffic offenses under the victim's name"}],
      [{fr:"Insurance",en:"Insurance"},{fr:"accès à l'assurance pour des soins",en:"access to insurance for treatment"}],
      [{fr:"Medical",en:"Medical"},{fr:"le **plus dangereux** — faux diagnostics possibles",en:"the **most dangerous** — possible false diagnoses"}],
      [{fr:"Tax",en:"Tax"},{fr:"vole le SSN pour de fausses déclarations",en:"steals the SSN for fraudulent returns"}]]},
    {t:"p",fr:"Techniques d'obtention de PII : **vol/déroutage de courrier**, **social media mining**, **achat sur le dark web**.",en:"PII-gathering techniques: **mail theft/rerouting**, **social media mining**, **buying on the dark web**."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Vol d'identité le **plus facile = permis de conduire** ; le **plus dangereux = médical** (faux diagnostics).",en:"Easiest identity theft = **driver's license**; most dangerous = **medical** (false diagnoses)."},
    {t:"recap",items:[
      {k:"6 types",fr:"Criminal · Financial · Driver's license · Insurance · Medical · Tax",en:"Criminal · Financial · Driver's license · Insurance · Medical · Tax"},
      {k:"Facile / dangereux",fr:"permis / médical",en:"license / medical"}]}
   ]},

  {id:"mobile", t:{fr:"Techniques mobiles",en:"Mobile-based techniques"},
   s:{fr:"Apps piégées, SMiShing, QRLJacking",en:"Rogue apps, SMiShing, QRLJacking"},
   blocks:[
    {t:"ul",items:[
      {fr:"**Publier des apps malveillantes** (ex. jeu qui exfiltre les identifiants)",en:"**Publishing malicious apps** (e.g. a game that exfiltrates credentials)"},
      {fr:"**Repackaging** — reconditionner une app légitime avec du malware sur un store tiers",en:"**Repackaging** — repackage a legitimate app with malware on a third-party store"},
      {fr:"**Fake security apps** — fausse alerte pousse à installer une « app de sécurité » qui vole les identifiants + le SMS 2FA",en:"**Fake security apps** — a fake alert pushes a \"security app\" that steals credentials + the SMS 2FA"}]},
    {t:"h",fr:"SMiShing & QRLJacking",en:"SMiShing & QRLJacking"},
    {t:"p",fr:"**SMiShing** = phishing par **SMS** (« Urgence banque, appelez le… ») pour pousser une action immédiate. **QRLJacking** exploite le **login par QR code** : l'attaquant clone le QR, l'insère dans une page de phishing ; en le scannant, la victime livre sa session (device ID, IMEI, GPS). Outil : **QR TIGER**.",en:"**SMiShing** = **SMS** phishing (\"Bank emergency, call…\") to prompt immediate action. **QRLJacking** exploits **QR-code login**: the attacker clones the QR, puts it on a phishing page; scanning it hands over the session (device ID, IMEI, GPS). Tool: **QR TIGER**."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**SMiShing** = phishing par SMS. **QRLJacking** = détournement de session via le login par QR code.",en:"**SMiShing** = SMS phishing. **QRLJacking** = session hijacking via QR-code login."},
    {t:"recap",items:[
      {k:"Apps",fr:"publication / repackaging / fake security app",en:"publishing / repackaging / fake security app"},
      {k:"SMiShing",fr:"phishing par SMS",en:"SMS phishing"},
      {k:"QRLJacking",fr:"vol de session via QR login",en:"session theft via QR login"}]}
   ]},

  {id:"defense", t:{fr:"Contre-mesures",en:"Countermeasures"},
   s:{fr:"Sensibilisation, politiques, anti-phishing",en:"Awareness, policies, anti-phishing"},
   blocks:[
    {t:"ul",items:[
      {fr:"**Sensibilisation** des utilisateurs (formation ciblée pour les postes à risque), signature des politiques, conséquences définies",en:"User **awareness** (targeted training for high-risk roles), signed policies, defined consequences"},
      {fr:"**Politique de mots de passe** : longs/complexes, non réutilisés, jamais communiqués par téléphone/e-mail/SMS, verrouillage après échecs",en:"**Password policy**: long/complex, not reused, never shared by phone/email/SMS, lockout after failures"},
      {fr:"**Sécurité physique** : badges, uniformes, contrôle d'accès",en:"**Physical security**: badges, uniforms, access control"},
      {fr:"Contre le **deepfake** : watermarking, blockchain, détection IA, forensique",en:"Against **deepfake**: watermarking, blockchain, AI detection, forensics"}]},
    {t:"h",fr:"Outils anti-phishing",en:"Anti-phishing tools"},
    {t:"ul",items:[
      {fr:"**Netcraft** — extension bloquant les sites de phishing",en:"**Netcraft** — extension blocking phishing sites"},
      {fr:"**PhishTank** — base collaborative de phishing (API ouverte)",en:"**PhishTank** — collaborative phishing clearinghouse (open API)"},
      {fr:"**OhPhish** (EC-Council) — simulations de phishing/vishing/smishing",en:"**OhPhish** (EC-Council) — phishing/vishing/smishing simulations"}]},
    {t:"recap",items:[
      {k:"Cœur",fr:"sensibilisation + politiques + contrôles",en:"awareness + policies + controls"},
      {k:"Anti-phishing",fr:"Netcraft, PhishTank, OhPhish",en:"Netcraft, PhishTank, OhPhish"}]}
   ]}
 ],

  {q:{fr:"Quelle est la différence entre piggybacking et tailgating ?",en:"What is the difference between piggybacking and tailgating?"},opts:[{fr:"piggybacking = avec consentement ; tailgating = sans consentement",en:"piggybacking = with consent; tailgating = without consent"},{fr:"l'inverse",en:"the opposite"},{fr:"les deux nécessitent un badge valide",en:"both need a valid badge"},{fr:"aucune différence",en:"no difference"}],a:0,ex:{fr:"Piggybacking : la personne autorisée laisse sciemment entrer. Tailgating : l'attaquant se faufile sans consentement (souvent avec un faux badge).",en:"Piggybacking: the authorized person knowingly allows entry. Tailgating: the attacker sneaks in without consent (often with a fake badge)."}},

{
 n:10, exam:"312-50",
 t:{fr:"Déni de service (DoS/DDoS)",en:"Denial-of-Service (DoS/DDoS)"},
 sub:{fr:"Rendre un service indisponible",en:"Making a service unavailable"},
 cards:[

  {id:"concepts", t:{fr:"Concepts DoS/DDoS",en:"DoS/DDoS concepts"},
   s:{fr:"But, zombies, reflectors",en:"Goal, zombies, reflectors"},
   blocks:[
    {t:"p",fr:"Une attaque **DoS** réduit ou empêche l'accès aux ressources pour les utilisateurs légitimes, en saturant le système de requêtes illégitimes. But : **rendre indisponible** — **pas** obtenir un accès ni corrompre des données.",en:"A **DoS** attack reduces or prevents access to resources for legitimate users, by flooding the system with illegitimate requests. Goal: **make it unavailable** — **not** gain access or corrupt data."},
    {t:"h",fr:"Comment marche un DDoS",en:"How a DDoS works"},
    {t:"p",fr:"L'attaquant pilote des **zombies** (machines compromises) via des **handlers**. Dans une attaque par **réflexion**, les zombies envoient des requêtes à des **reflectors** avec l'**IP source usurpée de la victime** → les reflectors répondent tous à la victime, qui est submergée.",en:"The attacker controls **zombies** (compromised machines) via **handlers**. In a **reflection** attack, zombies send requests to **reflectors** with the **victim's spoofed source IP** → the reflectors all reply to the victim, which is overwhelmed."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Le but d'un DoS = **priver d'accès**, pas voler/corrompre. Chaîne DDoS : attaquant → **handler** → **zombies** → cible. La réflexion usurpe l'IP de la victime.",en:"A DoS's goal = **deny access**, not steal/corrupt. DDoS chain: attacker → **handler** → **zombies** → target. Reflection spoofs the victim's IP."},
    {t:"recap",items:[
      {k:"But",fr:"indisponibilité (pas accès/vol)",en:"unavailability (not access/theft)"},
      {k:"Chaîne",fr:"attaquant → handler → zombies → cible",en:"attacker → handler → zombies → target"},
      {k:"Réflexion",fr:"IP victime usurpée vers des reflectors",en:"victim IP spoofed toward reflectors"}]}
   ]},

  {id:"botnet", t:{fr:"Botnets",en:"Botnets"},
   s:{fr:"C&C, propagation, méthodes de scan",en:"C&C, propagation, scanning methods"},
   blocks:[
    {t:"p",fr:"Un **botnet** est un ensemble de machines infectées (**bots/zombies**) pilotées par un **C&C**, servant à lancer des DDoS, du spam, de la fraude. Les bots se connectent au C&C, reçoivent des ordres, puis cherchent d'autres machines vulnérables à recruter.",en:"A **botnet** is a set of infected machines (**bots/zombies**) controlled by a **C&C**, used to launch DDoS, spam, fraud. Bots connect to the C&C, receive orders, then look for other vulnerable machines to recruit."},
    {t:"h",fr:"Méthodes de scan (recrutement)",en:"Scanning methods (recruitment)"},
    {t:"table",head:{fr:["Méthode","Principe"],en:["Method","Principle"]},rows:[
      [{fr:"**Random**",en:"**Random**"},{fr:"sonde des IP au hasard — beaucoup de trafic",en:"probes random IPs — lots of traffic"}],
      [{fr:"**Hit-list**",en:"**Hit-list**"},{fr:"liste préétablie, **divisée en deux** à chaque infection → croissance exponentielle",en:"prebuilt list, **halved** on each infection → exponential growth"}],
      [{fr:"**Topological**",en:"**Topological**"},{fr:"utilise les infos de la machine infectée (URLs)",en:"uses info from the infected machine (URLs)"}],
      [{fr:"**Local subnet**",en:"**Local subnet**"},{fr:"cherche dans le réseau local (derrière le pare-feu)",en:"searches the local network (behind the firewall)"}],
      [{fr:"**Permutation**",en:"**Permutation**"},{fr:"liste pseudo-aléatoire partagée (block cipher 32 bits) — évite la réinfection",en:"shared pseudorandom list (32-bit block cipher) — avoids reinfection"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Hit-list** = liste divisée en deux à chaque infection (croissance exponentielle). **Permutation** = liste pseudo-aléatoire via un block cipher 32 bits.",en:"**Hit-list** = list halved on each infection (exponential growth). **Permutation** = pseudorandom list via a 32-bit block cipher."},
    {t:"recap",items:[
      {k:"Botnet",fr:"bots/zombies + C&C",en:"bots/zombies + C&C"},
      {k:"5 scans",fr:"random · hit-list · topological · local subnet · permutation",en:"random · hit-list · topological · local subnet · permutation"}]}
   ]},

  {id:"techniques", t:{fr:"Techniques d'attaque",en:"Attack techniques"},
   s:{fr:"Volumétrique / protocole / applicatif",en:"Volumetric / protocol / application"},
   blocks:[
    {t:"h",fr:"3 catégories de vecteurs",en:"3 vector categories"},
    {t:"table",head:{fr:["Catégorie","Cible","Unité","Exemples"],en:["Category","Target","Unit","Examples"]},rows:[
      [{fr:"**Volumétrique**",en:"**Volumetric**"},{fr:"bande passante",en:"bandwidth"},{fr:"**bps**",en:"**bps**"},{fr:"UDP/ICMP flood, Smurf, Ping of Death, Pulse wave, NTP amplification",en:"UDP/ICMP flood, Smurf, Ping of Death, Pulse wave, NTP amplification"}],
      [{fr:"**Protocole**",en:"**Protocol**"},{fr:"tables d'état (FW, LB)",en:"state tables (FW, LB)"},{fr:"**pps**",en:"**pps**"},{fr:"SYN flood, fragmentation, ACK flood, TCP SACK panic",en:"SYN flood, fragmentation, ACK flood, TCP SACK panic"}],
      [{fr:"**Applicatif (L7)**",en:"**Application (L7)**"},{fr:"ressources de l'appli",en:"app resources"},{fr:"**rps**",en:"**rps**"},{fr:"HTTP GET/POST, Slowloris, RDDoS",en:"HTTP GET/POST, Slowloris, RDDoS"}]]},
    {t:"h",fr:"Attaques à connaître",en:"Attacks to know"},
    {t:"ul",items:[
      {fr:"**Smurf** — ICMP ECHO avec **IP source usurpée (victime)** vers une adresse de **broadcast** → tous répondent à la victime",en:"**Smurf** — ICMP ECHO with **spoofed source IP (victim)** to a **broadcast** address → everyone replies to the victim"},
      {fr:"**SYN flood** — masse de SYN sans compléter le handshake → épuise la file de connexions",en:"**SYN flood** — mass of SYNs without completing the handshake → exhausts the connection queue"},
      {fr:"**Pulse wave** — pattern **périodique** (pulses ~10 min) très difficile à absorber",en:"**Pulse wave** — **periodic** pattern (~10-min pulses), very hard to absorb"},
      {fr:"**TCP SACK Panic** — paquets SACK avec MSS malformé → overflow du buffer socket Linux → kernel panic",en:"**TCP SACK Panic** — SACK packets with malformed MSS → Linux socket-buffer overflow → kernel panic"},
      {fr:"**PDoS / phlashing** — « bricking » : firmware corrompu → **dégâts matériels irréversibles**",en:"**PDoS / phlashing** — \"bricking\": corrupted firmware → **irreversible hardware damage**"},
      {fr:"**Slowloris** — requêtes HTTP **partielles légitimes** qui gardent les connexions ouvertes (L7)",en:"**Slowloris** — **partial legitimate** HTTP requests keeping connections open (L7)"},
      {fr:"**RDDoS** — extorsion : rançon sous menace de DDoS",en:"**RDDoS** — extortion: ransom under threat of DDoS"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Volumétrique = bps · Protocole = pps · Applicatif = rps.** **Smurf** = ICMP broadcast + IP victime usurpée. **PDoS (phlashing)** = dégâts matériels. **Slowloris** = L7, connexions ouvertes.",en:"**Volumetric = bps · Protocol = pps · Application = rps.** **Smurf** = ICMP broadcast + spoofed victim IP. **PDoS (phlashing)** = hardware damage. **Slowloris** = L7, open connections."},
    {t:"recap",items:[
      {k:"3 unités",fr:"volumétrique bps · protocole pps · appli rps",en:"volumetric bps · protocol pps · app rps"},
      {k:"Smurf",fr:"ICMP broadcast, IP victime usurpée",en:"ICMP broadcast, spoofed victim IP"},
      {k:"PDoS",fr:"phlashing → matériel détruit",en:"phlashing → hardware destroyed"},
      {k:"Slowloris",fr:"L7, requêtes partielles légitimes",en:"L7, partial legitimate requests"}]}
   ]},

  {id:"defense", t:{fr:"Contre-mesures",en:"Countermeasures"},
   s:{fr:"6 catégories, défenses botnet, honeypots",en:"6 categories, botnet defenses, honeypots"},
   blocks:[
    {t:"h",fr:"6 catégories de contre-mesures",en:"6 countermeasure categories"},
    {t:"ol",items:[
      {fr:"**Protéger les victimes secondaires** (antivirus, durcissement)",en:"**Protect secondary victims** (antivirus, hardening)"},
      {fr:"**Détecter & neutraliser les handlers** (peu de handlers → gros effet)",en:"**Detect & neutralize handlers** (few handlers → big effect)"},
      {fr:"**Prévenir** (ingress/egress filtering, TCP intercept, rate limiting)",en:"**Prevent** (ingress/egress filtering, TCP intercept, rate limiting)"},
      {fr:"**Dévier** (honeypots)",en:"**Deflect** (honeypots)"},
      {fr:"**Atténuer** (load balancing, throttling, drop)",en:"**Mitigate** (load balancing, throttling, drop)"},
      {fr:"**Forensique post-attaque** (logs routeurs/FW/IDS, traceback)",en:"**Post-attack forensics** (router/FW/IDS logs, traceback)"}]},
    {t:"h",fr:"4 techniques anti-botnet",en:"4 anti-botnet techniques"},
    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[
      [{fr:"**RFC 3704 Filtering**",en:"**RFC 3704 Filtering**"},{fr:"rejette les IP usurpées via une **bogon list** (IP réservées/inutilisées)",en:"drops spoofed IPs via a **bogon list** (reserved/unused IPs)"}],
      [{fr:"**IP Reputation (Cisco IPS)**",en:"**IP Reputation (Cisco IPS)**"},{fr:"base de réputation (SensorBase) des sources malveillantes",en:"reputation database (SensorBase) of malicious sources"}],
      [{fr:"**Black Hole Filtering**",en:"**Black Hole Filtering**"},{fr:"jette le trafic silencieusement au niveau routage",en:"silently discards traffic at routing level"}],
      [{fr:"**IP Source Guard**",en:"**IP Source Guard**"},{fr:"filtre selon la table DHCP snooping (bloque les paquets usurpés)",en:"filters against the DHCP snooping table (blocks spoofed packets)"}]]},
    {t:"h",fr:"Honeypots (déviation)",en:"Honeypots (deflection)"},
    {t:"p",fr:"Systèmes à sécurité **volontairement limitée** pour attirer et étudier l'attaquant. **Low-interaction** (émulation limitée) vs **high-interaction** (ex. **honeynet** : réseau complet avec vraies machines). Autres mesures : désactiver **CHARGEN** (contre le DRDoS), AI/ML de détection d'anomalies, modèle multi-cloud.",en:"Systems with **deliberately limited** security to attract and study the attacker. **Low-interaction** (limited emulation) vs **high-interaction** (e.g. **honeynet**: full network with real machines). Other measures: disable **CHARGEN** (against DRDoS), AI/ML anomaly detection, multi-cloud model."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**RFC 3704** = bogon list contre l'usurpation. **Black hole** = jette silencieusement. **Honeynet** = honeypot high-interaction. Désactiver **CHARGEN** contre le DRDoS.",en:"**RFC 3704** = bogon list against spoofing. **Black hole** = silently discards. **Honeynet** = high-interaction honeypot. Disable **CHARGEN** against DRDoS."},
    {t:"recap",items:[
      {k:"6 catégories",fr:"protéger · neutraliser · prévenir · dévier · atténuer · forensique",en:"protect · neutralize · prevent · deflect · mitigate · forensics"},
      {k:"Anti-botnet",fr:"RFC 3704, IP reputation, black hole, IP source guard",en:"RFC 3704, IP reputation, black hole, IP source guard"},
      {k:"Honeypot",fr:"low vs high-interaction (honeynet)",en:"low vs high-interaction (honeynet)"}]}
   ]}

 quiz:[
  {q:{fr:"Quel est le but principal d'une attaque DoS ?",en:"What is the main goal of a DoS attack?"},opts:[{fr:"priver les utilisateurs légitimes d'accès au service",en:"deny legitimate users access to the service"},{fr:"voler des données",en:"steal data"},{fr:"obtenir un accès administrateur",en:"gain admin access"},{fr:"installer un rootkit",en:"install a rootkit"}],a:0,ex:{fr:"Le DoS vise l'indisponibilité, pas l'accès ni le vol. Il sature les ressources de requêtes illégitimes.",en:"DoS aims at unavailability, not access or theft. It saturates resources with illegitimate requests."}},
  {q:{fr:"Quelles sont les 3 catégories de vecteurs DoS/DDoS ?",en:"What are the 3 DoS/DDoS vector categories?"},opts:[{fr:"volumétrique, protocole, applicatif",en:"volumetric, protocol, application"},{fr:"actif, passif, hybride",en:"active, passive, hybrid"},{fr:"local, distant, réflexif",en:"local, remote, reflexive"},{fr:"SYN, ACK, RST",en:"SYN, ACK, RST"}],a:0,ex:{fr:"Volumétrique (bande passante, bps), protocole (tables d'état, pps), applicatif L7 (ressources appli, rps).",en:"Volumetric (bandwidth, bps), protocol (state tables, pps), application L7 (app resources, rps)."}},
  {q:{fr:"En quelle unité mesure-t-on une attaque volumétrique ?",en:"In what unit is a volumetric attack measured?"},opts:[{fr:"bits par seconde (bps)",en:"bits per second (bps)"},{fr:"paquets par seconde (pps)",en:"packets per second (pps)"},{fr:"requêtes par seconde (rps)",en:"requests per second (rps)"},{fr:"connexions par minute",en:"connections per minute"}],a:0,ex:{fr:"Volumétrique = bps ; protocole = pps ; applicatif = rps.",en:"Volumetric = bps; protocol = pps; application = rps."}},
  {q:{fr:"Quelle attaque envoie un ICMP ECHO avec l'IP de la victime usurpée vers un broadcast ?",en:"Which attack sends an ICMP ECHO with the victim's spoofed IP to a broadcast?"},opts:[{fr:"Smurf",en:"Smurf"},{fr:"SYN flood",en:"SYN flood"},{fr:"Slowloris",en:"Slowloris"},{fr:"Ping of Death",en:"Ping of Death"}],a:0,ex:{fr:"Le Smurf usurpe l'IP de la victime et envoie un ICMP ECHO à un broadcast : tous les hôtes répondent à la victime.",en:"Smurf spoofs the victim's IP and sends an ICMP ECHO to a broadcast: all hosts reply to the victim."}},
  {q:{fr:"Quel type de DoS provoque des dégâts matériels irréversibles ?",en:"Which DoS type causes irreversible hardware damage?"},opts:[{fr:"PDoS (phlashing / bricking)",en:"PDoS (phlashing / bricking)"},{fr:"SYN flood",en:"SYN flood"},{fr:"HTTP GET flood",en:"HTTP GET flood"},{fr:"UDP flood",en:"UDP flood"}],a:0,ex:{fr:"Le PDoS (phlashing) envoie un firmware corrompu qui « brick » le matériel — remplacement/réinstallation nécessaires.",en:"PDoS (phlashing) sends corrupted firmware that \"bricks\" hardware — replacement/reinstallation required."}},
  {q:{fr:"Quel outil L7 utilise des requêtes HTTP partielles pour épuiser les connexions ?",en:"Which L7 tool uses partial HTTP requests to exhaust connections?"},opts:[{fr:"Slowloris",en:"Slowloris"},{fr:"LOIC",en:"LOIC"},{fr:"Smurf",en:"Smurf"},{fr:"HOIC",en:"HOIC"}],a:0,ex:{fr:"Slowloris garde de nombreuses connexions ouvertes avec des requêtes HTTP partielles, en trafic parfaitement légitime → difficile à détecter.",en:"Slowloris keeps many connections open with partial HTTP requests, using perfectly legitimate traffic → hard to detect."}},

{
 n:11, exam:"312-50",
 t:{fr:"Détournement de session",en:"Session Hijacking"},
 sub:{fr:"Prendre le contrôle d'une session valide",en:"Taking over a valid session"},
 cards:[

  {id:"concepts", t:{fr:"Concepts",en:"Concepts"},
   s:{fr:"3 phases, actif/passif, niveaux, vs spoofing",en:"3 phases, active/passive, levels, vs spoofing"},
   blocks:[
    {t:"p",fr:"Le **session hijacking** consiste à **prendre le contrôle d'une session TCP valide** entre deux machines. Comme l'authentification n'a lieu qu'au **début** de la session, voler un **session ID** valide suffit à s'authentifier auprès du serveur. Il ouvre la voie au **MITM** et au **DoS**.",en:"**Session hijacking** means **seizing control of a valid TCP session** between two machines. Since authentication happens only at the **start** of the session, stealing a valid **session ID** is enough to authenticate to the server. It enables **MITM** and **DoS**."},
    {t:"h",fr:"Pourquoi ça marche",en:"Why it works"},
    {t:"ul",items:[
      {fr:"Pas de **verrouillage** sur les session IDs invalides → brute-force possible",en:"No **lockout** on invalid session IDs → brute-force possible"},
      {fr:"Génération **faible/prévisible** des IDs (algorithme linéaire, IDs courts)",en:"**Weak/predictable** ID generation (linear algorithm, short IDs)"},
      {fr:"Manipulation non sécurisée des IDs (XSS, DNS poisoning)",en:"Insecure ID handling (XSS, DNS poisoning)"}]},
    {t:"h",fr:"Le processus en 3 phases",en:"The 3-phase process"},
    {t:"ol",items:[
      {fr:"**Tracking** — sniffer la session, capturer SEQ/ACK, repérer une séquence prévisible",en:"**Tracking** — sniff the session, capture SEQ/ACK, spot a predictable sequence"},
      {fr:"**Desynchronizing** — décaler les SEQ/ACK (données nulles, RST) pour désynchroniser",en:"**Desynchronizing** — shift SEQ/ACK (null data, RST) to desynchronize"},
      {fr:"**Injecting** — injecter ses propres paquets/commandes dans la session",en:"**Injecting** — inject one's own packets/commands into the session"}]},
    {t:"table",head:{fr:["Distinction","Détail"],en:["Distinction","Detail"]},rows:[
      [{fr:"Actif / Passif",en:"Active / Passive"},{fr:"prend le contrôle / observe seulement",en:"takes over / only observes"}],
      [{fr:"Network / Application",en:"Network / Application"},{fr:"intercepte les paquets (TCP/UDP) / contrôle la session HTTP via le session ID",en:"intercepts packets (TCP/UDP) / controls the HTTP session via the session ID"}],
      [{fr:"Spoofing vs Hijacking",en:"Spoofing vs Hijacking"},{fr:"se faire passer pour qqn (faux credentials) / **voler une session déjà établie**",en:"impersonate someone (fake credentials) / **steal an already-established session**"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"3 phases : **Tracking → Desynchronizing → Injecting**. Le **spoofing** utilise de faux identifiants dès le départ ; le **hijacking** détourne une session **déjà établie** en prédisant les numéros de séquence.",en:"3 phases: **Tracking → Desynchronizing → Injecting**. **Spoofing** uses fake credentials from the start; **hijacking** takes over an **already-established** session by predicting sequence numbers."},
    {t:"recap",items:[
      {k:"Faille",fr:"auth seulement en début de session",en:"auth only at session start"},
      {k:"3 phases",fr:"Tracking · Desync · Injection",en:"Tracking · Desync · Injection"},
      {k:"2 niveaux",fr:"network (paquets) / application (session ID)",en:"network (packets) / application (session ID)"},
      {k:"vs spoofing",fr:"hijacking = session déjà établie",en:"hijacking = already-established session"}]}
   ]},

  {id:"app", t:{fr:"Niveau application",en:"Application level"},
   s:{fr:"Fixation, CRIME, forbidden, donation, PetitPotam",en:"Fixation, CRIME, forbidden, donation, PetitPotam"},
   blocks:[
    {t:"p",fr:"Compromettre un **token de session** (12 méthodes) : sniffing, token prévisible, MITM, **man-in-the-browser**, XSS, CSRF, session replay, session fixation, CRIME, forbidden attack, session donation, PetitPotam.",en:"Compromising a **session token** (12 methods): sniffing, predictable token, MITM, **man-in-the-browser**, XSS, CSRF, session replay, session fixation, CRIME, forbidden attack, session donation, PetitPotam."},
    {t:"table",head:{fr:["Attaque","Principe"],en:["Attack","Principle"]},rows:[
      [{fr:"**Session fixation**",en:"**Session fixation**"},{fr:"l'attaquant **impose un SID** à la victime (lien piégé) puis réutilise le même",en:"the attacker **forces a SID** on the victim (rigged link) then reuses the same one"}],
      [{fr:"**Session donation**",en:"**Session donation**"},{fr:"l'attaquant **donne son propre SID** à la victime → ses données arrivent sur le compte de l'attaquant",en:"the attacker **donates their own SID** to the victim → her data lands in the attacker's account"}],
      [{fr:"**Session replay**",en:"**Session replay**"},{fr:"capture puis rejoue les jetons d'authentification",en:"captures then replays the authentication tokens"}],
      [{fr:"**CRIME**",en:"**CRIME**"},{fr:"exploite la **compression** TLS (DEFLATE) pour deviner le cookie caractère par caractère",en:"exploits TLS **compression** (DEFLATE) to guess the cookie char by char"}],
      [{fr:"**Forbidden attack**",en:"**Forbidden attack**"},{fr:"MITM HTTPS exploitant la **réutilisation d'un nonce AES-GCM**",en:"HTTPS MITM exploiting **AES-GCM nonce reuse**"}],
      [{fr:"**Man-in-the-browser**",en:"**Man-in-the-browser**"},{fr:"extension qui modifie les formulaires via le DOM (reçu affiché = valeurs d'origine)",en:"extension modifying forms via the DOM (displayed receipt = original values)"}],
      [{fr:"**PetitPotam**",en:"**PetitPotam**"},{fr:"force un **DC** à s'authentifier (MS-EFSRPC) → relais NTLM vers AD CS → certificat admin",en:"forces a **DC** to authenticate (MS-EFSRPC) → NTLM relay to AD CS → admin certificate"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**CRIME** = compression TLS. **Forbidden** = nonce AES-GCM réutilisé. **Fixation** = imposer un SID ; **donation** = donner son propre SID. **PetitPotam** = coercition NTLM d'un DC vers AD CS.",en:"**CRIME** = TLS compression. **Forbidden** = reused AES-GCM nonce. **Fixation** = force a SID; **donation** = give your own SID. **PetitPotam** = NTLM coercion of a DC toward AD CS."},
    {t:"recap",items:[
      {k:"CRIME",fr:"compression TLS/DEFLATE",en:"TLS/DEFLATE compression"},
      {k:"Forbidden",fr:"nonce AES-GCM réutilisé",en:"reused AES-GCM nonce"},
      {k:"Fixation/Donation",fr:"imposer / donner un SID",en:"force / give a SID"},
      {k:"PetitPotam",fr:"DC → AD CS (MS-EFSRPC)",en:"DC → AD CS (MS-EFSRPC)"}]}
   ]},

  {id:"network", t:{fr:"Niveau réseau",en:"Network level"},
   s:{fr:"Blind, UDP, TCP/IP, RST hijacking",en:"Blind, UDP, TCP/IP, RST hijacking"},
   blocks:[
    {t:"p",fr:"Le hijacking réseau détourne les protocoles **transport/Internet**. IP et port sont fixes et faciles à lire ; ce sont les **numéros de séquence** qui changent — c'est le cœur du problème pour l'attaquant.",en:"Network hijacking targets the **transport/Internet** protocols. IP and port are fixed and easy to read; it's the **sequence numbers** that change — the crux for the attacker."},
    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[
      [{fr:"**Blind hijacking**",en:"**Blind hijacking**"},{fr:"**deviner les numéros de séquence** sans voir le trafic",en:"**guess the sequence numbers** without seeing the traffic"}],
      [{fr:"**UDP hijacking**",en:"**UDP hijacking**"},{fr:"plus **facile** (sans séquencement) : forger la réponse avant le serveur",en:"**easier** (no sequencing): forge the reply before the server"}],
      [{fr:"**TCP/IP hijacking**",en:"**TCP/IP hijacking**"},{fr:"après spoof IP, altérer SEQ/ACK et injecter avant le client",en:"after IP spoof, alter SEQ/ACK and inject before the client"}],
      [{fr:"**RST hijacking**",en:"**RST hijacking**"},{fr:"injecter un **RST** usurpé (ACK prédit) → reset de la connexion",en:"inject a spoofed **RST** (predicted ACK) → connection reset"}],
      [{fr:"MITM packet sniffer",en:"MITM packet sniffer"},{fr:"s'interposer avec un sniffer",en:"interpose with a sniffer"}],
      [{fr:"IP spoofing (source routed)",en:"IP spoofing (source routed)"},{fr:"paquets source-routés via un hôte de confiance",en:"source-routed packets via a trusted host"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Blind hijacking** = deviner les numéros de séquence sans voir le trafic. **UDP** est plus facile à détourner (sans connexion/séquencement). **RST hijacking** = paquet RST usurpé pour reset la connexion.",en:"**Blind hijacking** = guessing sequence numbers without seeing traffic. **UDP** is easier to hijack (connectionless/no sequencing). **RST hijacking** = spoofed RST packet to reset the connection."},
    {t:"recap",items:[
      {k:"Blind",fr:"deviner les SEQ sans voir le trafic",en:"guess SEQ without seeing traffic"},
      {k:"UDP",fr:"plus facile (sans séquencement)",en:"easier (no sequencing)"},
      {k:"RST",fr:"reset via paquet RST usurpé",en:"reset via spoofed RST packet"}]}
   ]},

  {id:"defense", t:{fr:"Contre-mesures & IPsec",en:"Countermeasures & IPsec"},
   s:{fr:"HTTPS, DoH, AH vs ESP, transport vs tunnel",en:"HTTPS, DoH, AH vs ESP, transport vs tunnel"},
   blocks:[
    {t:"ul",items:[
      {fr:"**Chiffrer** tout (SSH, HTTPS, IPsec, VPN) ; SID **après** login, généré par le serveur, long et aléatoire",en:"**Encrypt** everything (SSH, HTTPS, IPsec, VPN); SID **after** login, server-generated, long and random"},
      {fr:"Ne **jamais** mettre le SID dans l'URL ; **timeout** des sessions ; **logout** fonctionnel",en:"**Never** put the SID in the URL; session **timeout**; working **logout**"},
      {fr:"Switch (pas de hub), **ARPwatch/IDS** contre l'ARP poisoning, Kerberos",en:"Switch (not a hub), **ARPwatch/IDS** against ARP poisoning, Kerberos"}]},
    {t:"h",fr:"DNS over HTTPS (DoH)",en:"DNS over HTTPS (DoH)"},
    {t:"p",fr:"Chiffre les requêtes DNS dans du HTTPS (**port 443** au lieu de 53) → empêche l'espionnage des requêtes lors d'un MITM.",en:"Encrypts DNS queries inside HTTPS (**port 443** instead of 53) → prevents snooping of queries during a MITM."},
    {t:"h",fr:"IPsec",en:"IPsec"},
    {t:"table",head:{fr:["Élément","Rôle"],en:["Element","Role"]},rows:[
      [{fr:"**AH**",en:"**AH**"},{fr:"authentification **seule**",en:"authentication **only**"}],
      [{fr:"**ESP**",en:"**ESP**"},{fr:"authentification **ET** chiffrement (confidentialité)",en:"authentication **AND** encryption (confidentiality)"}],
      [{fr:"**Transport mode**",en:"**Transport mode**"},{fr:"chiffre **le payload** (host-to-host)",en:"encrypts **the payload** (host-to-host)"}],
      [{fr:"**Tunnel mode**",en:"**Tunnel mode**"},{fr:"chiffre **tout le paquet IP** (gateway-to-gateway)",en:"encrypts **the whole IP packet** (gateway-to-gateway)"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**AH = authentification seule ; ESP = auth + chiffrement.** **Transport mode = payload** (host-to-host) ; **Tunnel mode = tout le paquet** (gateway-to-gateway). DoH = DNS sur HTTPS (443).",en:"**AH = authentication only; ESP = auth + encryption.** **Transport mode = payload** (host-to-host); **Tunnel mode = whole packet** (gateway-to-gateway). DoH = DNS over HTTPS (443)."},
    {t:"recap",items:[
      {k:"Prévention",fr:"HTTPS, SID post-login aléatoire, pas de SID en URL, timeout",en:"HTTPS, random post-login SID, no SID in URL, timeout"},
      {k:"IPsec",fr:"AH (auth) / ESP (auth+chiffrement)",en:"AH (auth) / ESP (auth+encryption)"},
      {k:"Modes",fr:"transport (payload) / tunnel (paquet entier)",en:"transport (payload) / tunnel (whole packet)"},
      {k:"DoH",fr:"DNS sur HTTPS, port 443",en:"DNS over HTTPS, port 443"}]}
   ]}
 ],

 quiz:[
  {q:{fr:"Quelles sont les 3 phases du processus de session hijacking ?",en:"What are the 3 phases of the session hijacking process?"},opts:[{fr:"Tracking → Desynchronizing → Injecting",en:"Tracking → Desynchronizing → Injecting"},{fr:"Scan → Exploit → Persistence",en:"Scan → Exploit → Persistence"},{fr:"Recon → Weaponize → Deliver",en:"Recon → Weaponize → Deliver"},{fr:"Sniff → Spoof → Crack",en:"Sniff → Spoof → Crack"}],a:0,ex:{fr:"Suivre la connexion (SEQ/ACK), la désynchroniser, puis injecter ses propres paquets.",en:"Track the connection (SEQ/ACK), desynchronize it, then inject one's own packets."}},

  {q:{fr:"Quelle attaque exploite la compression des données TLS/SSL pour déchiffrer les cookies de session ?",en:"Which attack exploits TLS/SSL data compression to decrypt session cookies?"},opts:[{fr:"CRIME",en:"CRIME"},{fr:"Forbidden attack",en:"Forbidden attack"},{fr:"Session fixation",en:"Session fixation"},{fr:"PetitPotam",en:"PetitPotam"}],a:0,ex:{fr:"CRIME (Compression Ratio Info-leak Made Easy) exploite DEFLATE : la variation de longueur de la réponse compressée révèle le cookie caractère par caractère.",en:"CRIME (Compression Ratio Info-leak Made Easy) exploits DEFLATE: the compressed response's length variation reveals the cookie char by char."}},
  {q:{fr:"Quelle attaque exploite la réutilisation d'un nonce en AES-GCM lors du handshake TLS ?",en:"Which attack exploits AES-GCM nonce reuse during the TLS handshake?"},opts:[{fr:"Forbidden attack",en:"Forbidden attack"},{fr:"CRIME",en:"CRIME"},{fr:"Session replay",en:"Session replay"},{fr:"Blind hijacking",en:"Blind hijacking"}],a:0,ex:{fr:"La forbidden attack est un MITM HTTPS exploitant la réutilisation incorrecte d'un nonce en AES-GCM pour dériver des clés et détourner la connexion.",en:"The forbidden attack is an HTTPS MITM exploiting incorrect AES-GCM nonce reuse to derive keys and hijack the connection."}},
  {q:{fr:"Dans quelle attaque l'attaquant DONNE son propre session ID à la victime ?",en:"In which attack does the attacker GIVE their own session ID to the victim?"},opts:[{fr:"Session donation",en:"Session donation"},{fr:"Session fixation",en:"Session fixation"},{fr:"Session replay",en:"Session replay"},{fr:"Session sniffing",en:"Session sniffing"}],a:0,ex:{fr:"En session donation, l'attaquant donne son SID à la victime : les données saisies par la victime alimentent le compte de l'attaquant. La fixation, elle, impose un SID à la victime.",en:"In session donation, the attacker gives their SID to the victim: data entered by the victim feeds the attacker's account. Fixation instead forces a SID onto the victim."}},
  {q:{fr:"Quel détournement réseau nécessite de DEVINER les numéros de séquence sans voir le trafic ?",en:"Which network hijacking requires GUESSING the sequence numbers without seeing the traffic?"},opts:[{fr:"Blind hijacking",en:"Blind hijacking"},{fr:"MITM packet sniffer",en:"MITM packet sniffer"},{fr:"RST hijacking",en:"RST hijacking"},{fr:"UDP hijacking",en:"UDP hijacking"}],a:0,ex:{fr:"Le blind hijacking se fait à l'aveugle : l'attaquant ne voit pas le trafic et doit deviner les numéros de séquence pour que le serveur accepte ses paquets usurpés.",en:"Blind hijacking is done blindly: the attacker can't see the traffic and must guess the sequence numbers so the server accepts spoofed packets."}},
  {q:{fr:"Pourquoi le détournement de session UDP est-il plus facile que le TCP ?",en:"Why is UDP session hijacking easier than TCP?"},opts:[{fr:"UDP est connectionless et sans séquencement",en:"UDP is connectionless and has no sequencing"},{fr:"UDP est chiffré",en:"UDP is encrypted"},{fr:"UDP utilise un handshake en 4 étapes",en:"UDP uses a 4-step handshake"},{fr:"UDP verrouille les sessions",en:"UDP locks sessions"}],a:0,ex:{fr:"UDP n'utilise ni séquencement ni synchronisation : il suffit de forger une réponse avant le serveur, sans prédire de numéro de séquence.",en:"UDP uses neither sequencing nor synchronization: just forge a reply before the server, no sequence number to predict."}},
  {q:{fr:"Quelle est la différence entre AH et ESP dans IPsec ?",en:"What is the difference between AH and ESP in IPsec?"},opts:[{fr:"AH = authentification seule ; ESP = authentification + chiffrement",en:"AH = authentication only; ESP = authentication + encryption"},{fr:"l'inverse",en:"the opposite"},{fr:"AH chiffre, ESP authentifie",en:"AH encrypts, ESP authenticates"},{fr:"les deux ne font que chiffrer",en:"both only encrypt"}],a:0,ex:{fr:"AH (Authentication Header) authentifie seulement ; ESP (Encapsulation Security Payload) authentifie ET chiffre (confidentialité).",en:"AH (Authentication Header) only authenticates; ESP (Encapsulation Security Payload) authenticates AND encrypts (confidentiality)."}},
  {q:{fr:"Quel mode IPsec chiffre l'intégralité du paquet IP (gateway-to-gateway) ?",en:"Which IPsec mode encrypts the entire IP packet (gateway-to-gateway)?"},opts:[{fr:"Tunnel mode",en:"Tunnel mode"},{fr:"Transport mode",en:"Transport mode"},{fr:"AH mode",en:"AH mode"},{fr:"DoH mode",en:"DoH mode"}],a:0,ex:{fr:"Le tunnel mode encapsule et chiffre tout le paquet IP original (entre passerelles) ; le transport mode ne chiffre que le payload (host-to-host).",en:"Tunnel mode encapsulates and encrypts the whole original IP packet (between gateways); transport mode only encrypts the payload (host-to-host)."}},
  {q:{fr:"Quel mécanisme chiffre les requêtes DNS via HTTPS (port 443) pour contrer le MITM ?",en:"Which mechanism encrypts DNS queries over HTTPS (port 443) to counter MITM?"},opts:[{fr:"DNS over HTTPS (DoH)",en:"DNS over HTTPS (DoH)"},{fr:"DNSSEC",en:"DNSSEC"},{fr:"AXFR",en:"AXFR"},{fr:"NAT",en:"NAT"}],a:0,ex:{fr:"DoH envoie les requêtes DNS dans du HTTPS (443) au lieu du port 53 en clair, empêchant l'espionnage lors d'un MITM.",en:"DoH sends DNS queries inside HTTPS (443) instead of cleartext port 53, preventing snooping during a MITM."}}
 ]
},
{
 n:12, exam:"312-50",
 t:{fr:"Évasion IDS, pare-feu & honeypots",en:"Evading IDS, firewalls & honeypots"},
 sub:{fr:"Contourner la détection",en:"Bypassing detection"},
 cards:[

  {id:"concepts", t:{fr:"IDS, IPS & pare-feu",en:"IDS, IPS & firewalls"},
   s:{fr:"Détection, NIDS/HIDS, types de FW, DMZ",en:"Detection, NIDS/HIDS, FW types, DMZ"},
   blocks:[
    {t:"p",fr:"Un **IDS** surveille et détecte les activités malveillantes (« packet sniffer » qui lève une alarme). Un **IPS** est un **IDS actif** placé **inline** : il détecte **et** bloque.",en:"An **IDS** monitors and detects malicious activity (a \"packet sniffer\" that raises an alarm). An **IPS** is an **active IDS** placed **inline**: it detects **and** blocks."},
    {t:"h",fr:"3 méthodes de détection",en:"3 detection methods"},
    {t:"table",head:{fr:["Méthode","Principe"],en:["Method","Principle"]},rows:[
      [{fr:"**Signature** (misuse)",en:"**Signature** (misuse)"},{fr:"compare aux signatures d'attaques connues (faux positifs, base lourde)",en:"compares to known attack signatures (false positives, heavy DB)"}],
      [{fr:"**Anomaly**",en:"**Anomaly**"},{fr:"écart par rapport à un comportement « normal » (le modèle est dur à établir)",en:"deviation from a \"normal\" baseline (the model is hard to build)"}],
      [{fr:"**Protocol anomaly**",en:"**Protocol anomaly**"},{fr:"écart par rapport aux standards de protocole",en:"deviation from protocol standards"}]]},
    {t:"p",fr:"Types : **NIDS** (réseau, mode promiscuous, chaque paquet) et **HIDS** (hôte, événements d'un système précis).",en:"Types: **NIDS** (network, promiscuous mode, every packet) and **HIDS** (host, events on a specific system)."},
    {t:"h",fr:"Pare-feu",en:"Firewalls"},
    {t:"p",fr:"7 technologies : **packet filtering** (IP/port/protocole, L3-L4), **circuit-level gateway**, **application-level / proxy**, **stateful multilayer inspection**, **NAT**, **VPN**. Les **NGFW** ajoutent DPI + conscience applicative + IPS intégré.",en:"7 technologies: **packet filtering** (IP/port/protocol, L3-L4), **circuit-level gateway**, **application-level / proxy**, **stateful multilayer inspection**, **NAT**, **VPN**. **NGFWs** add DPI + application awareness + integrated IPS."},
    {t:"note",k:{fr:"DMZ & VPN",en:"DMZ & VPN"},fr:"La **DMZ** est une zone tampon entre l'intranet et Internet (serveurs web/DNS/mail publics) ; les serveurs internes sensibles n'y sont **jamais**. Un **VPN n'a aucun lien intrinsèque** avec le pare-feu (mais on l'y ajoute par commodité).",en:"The **DMZ** is a buffer zone between the intranet and the Internet (public web/DNS/mail servers); sensitive internal servers **never** sit there. A **VPN has no intrinsic relation** to the firewall (but it's added there for convenience)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**IDS = passif (détecte) ; IPS = actif/inline (détecte + bloque).** 3 méthodes : signature, anomaly, protocol anomaly. Packet filtering opère en **L3-L4**.",en:"**IDS = passive (detects); IPS = active/inline (detects + blocks).** 3 methods: signature, anomaly, protocol anomaly. Packet filtering works at **L3-L4**."},
    {t:"recap",items:[
      {k:"IDS/IPS",fr:"passif (détecte) / actif inline (bloque)",en:"passive (detects) / active inline (blocks)"},
      {k:"3 méthodes",fr:"signature · anomaly · protocol anomaly",en:"signature · anomaly · protocol anomaly"},
      {k:"NIDS/HIDS",fr:"réseau (promiscuous) / hôte",en:"network (promiscuous) / host"},
      {k:"DMZ",fr:"zone tampon ; pas de serveurs sensibles",en:"buffer zone; no sensitive servers"}]}
   ]},

  {id:"bypass", t:{fr:"Contourner IDS & pare-feu",en:"Bypassing IDS & firewalls"},
   s:{fr:"Firewalking, fragments, tunneling, DGA",en:"Firewalking, fragments, tunneling, DGA"},
   blocks:[
    {t:"h",fr:"Reconnaissance",en:"Reconnaissance"},
    {t:"ul",items:[
      {fr:"**Firewalking** — utilise les **TTL** (un hop de plus que le pare-feu) pour cartographier les ACL",en:"**Firewalking** — uses **TTL** (one hop past the firewall) to map the ACLs"},
      {fr:"**Banner grabbing**, **port scanning** (certains IDS/FW se trahissent par leurs ports)",en:"**Banner grabbing**, **port scanning** (some IDS/FW reveal themselves via ports)"}]},
    {t:"h",fr:"Techniques d'évasion",en:"Evasion techniques"},
    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[
      [{fr:"**IP spoofing**",en:"**IP spoofing**"},{fr:"IP source d'un hôte de confiance",en:"source IP of a trusted host"}],
      [{fr:"**Source routing**",en:"**Source routing**"},{fr:"impose le chemin — **loose** (étapes) / **strict** (route exacte)",en:"forces the path — **loose** (stages) / **strict** (exact route)"}],
      [{fr:"**Tiny fragments**",en:"**Tiny fragments**"},{fr:"pousse l'en-tête TCP dans le fragment suivant → l'IDS ne réassemble pas",en:"pushes the TCP header into the next fragment → IDS can't reassemble"}],
      [{fr:"**ICMP tunneling**",en:"**ICMP tunneling**"},{fr:"backdoor dans la **data** des paquets ICMP Echo (RFC 792)",en:"backdoor in the **data** of ICMP Echo packets (RFC 792)"}],
      [{fr:"**ACK tunneling**",en:"**ACK tunneling**"},{fr:"payload dans des paquets **ACK** (moins scrutés que SYN)",en:"payload in **ACK** packets (less scrutinized than SYN)"}],
      [{fr:"**HTTP / SSH / DNS tunneling**",en:"**HTTP / SSH / DNS tunneling**"},{fr:"encapsule le trafic dans du HTTP/SSH/DNS",en:"encapsulates traffic in HTTP/SSH/DNS"}],
      [{fr:"**HTML smuggling**",en:"**HTML smuggling**"},{fr:"blob JavaScript qui auto-télécharge le malware (échappe aux gateways)",en:"JavaScript blob auto-downloading malware (evades gateways)"}],
      [{fr:"**Windows BITS**",en:"**Windows BITS**"},{fr:"transfert de fichiers en tâche de fond « de confiance »",en:"file transfer as a \"trusted\" background job"}]]},
    {t:"p",fr:"Aussi : **fragmentation timeout attacks** (jouer sur l'écart de timeout de réassemblage entre l'IDS et la victime), **désynchronisation** (pre/post-connection SYN), **DGA** (domaines « gibberish » générés via une *seed* pour le C2).",en:"Also: **fragmentation timeout attacks** (exploit the reassembly-timeout gap between IDS and victim), **desynchronization** (pre/post-connection SYN), **DGA** (\"gibberish\" domains generated via a *seed* for C2)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Firewalking** = TTL pour cartographier les ACL. **Tiny fragments** = en-tête TCP dans le fragment suivant. **ICMP tunneling** = backdoor dans la data ICMP. **ACK tunneling** = ACK moins surveillés que SYN. **DGA** = domaines générés via une seed.",en:"**Firewalking** = TTL to map ACLs. **Tiny fragments** = TCP header in the next fragment. **ICMP tunneling** = backdoor in ICMP data. **ACK tunneling** = ACKs less watched than SYN. **DGA** = domains generated via a seed."},
    {t:"recap",items:[
      {k:"Firewalking",fr:"TTL → cartographie des ACL",en:"TTL → ACL mapping"},
      {k:"Tiny fragments",fr:"en-tête TCP scindé → pas de réassemblage IDS",en:"split TCP header → no IDS reassembly"},
      {k:"Tunneling",fr:"ICMP / ACK / HTTP / SSH / DNS",en:"ICMP / ACK / HTTP / SSH / DNS"},
      {k:"DGA",fr:"domaines gibberish via une seed",en:"gibberish domains via a seed"}]}
   ]},

  {id:"nac", t:{fr:"Contourner NAC & endpoint",en:"Bypassing NAC & endpoint"},
   s:{fr:"VLAN hopping, injection, AMSI bypass",en:"VLAN hopping, injection, AMSI bypass"},
   blocks:[
    {t:"h",fr:"NAC",en:"NAC"},
    {t:"ul",items:[
      {fr:"**VLAN hopping** via **DTP** (Dynamic Trunking Protocol) — mode « dynamic auto/desirable » → trunk établi (outil VLANPWN)",en:"**VLAN hopping** via **DTP** (Dynamic Trunking Protocol) — \"dynamic auto/desirable\" mode → trunk established (tool VLANPWN)"},
      {fr:"**Pre-authenticated device** — s'intercaler (ex. Raspberry Pi) entre un appareil déjà authentifié et le serveur NAC",en:"**Pre-authenticated device** — interpose (e.g. Raspberry Pi) between an already-authenticated device and the NAC server"}]},
    {t:"h",fr:"Endpoint / EDR",en:"Endpoint / EDR"},
    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[
      [{fr:"**Ghostwriting**",en:"**Ghostwriting**"},{fr:"modifie la structure du binaire sans changer sa fonction → évade la signature",en:"alters the binary's structure without changing function → evades signature"}],
      [{fr:"**Whitelisting bypass**",en:"**Whitelisting bypass**"},{fr:"DLL hijacking + rundll32/regsvr32",en:"DLL hijacking + rundll32/regsvr32"}],
      [{fr:"**Process injection**",en:"**Process injection**"},{fr:"`VirtualAllocEx()` → `WriteProcessMemory()` → `CreateRemoteThread()`",en:"`VirtualAllocEx()` → `WriteProcessMemory()` → `CreateRemoteThread()`"}],
      [{fr:"**Direct syscalls**",en:"**Direct syscalls**"},{fr:"appelle le kernel directement (évite les hooks de ntdll.dll)",en:"calls the kernel directly (bypasses ntdll.dll hooks)"}],
      [{fr:"**AMSI bypass**",en:"**AMSI bypass**"},{fr:"hook `AmsiScanBuffer()` → retourne toujours `AMSI_RESULT_CLEAN`",en:"hooks `AmsiScanBuffer()` → always returns `AMSI_RESULT_CLEAN`"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**VLAN hopping** exploite **DTP**. **Process injection** = VirtualAllocEx → WriteProcessMemory → CreateRemoteThread. **AMSI bypass** = hook d'`AmsiScanBuffer()`. **Ghostwriting** = évasion de signature.",en:"**VLAN hopping** exploits **DTP**. **Process injection** = VirtualAllocEx → WriteProcessMemory → CreateRemoteThread. **AMSI bypass** = hooking `AmsiScanBuffer()`. **Ghostwriting** = signature evasion."},
    {t:"recap",items:[
      {k:"NAC",fr:"VLAN hopping (DTP) / pre-auth device",en:"VLAN hopping (DTP) / pre-auth device"},
      {k:"Injection",fr:"VirtualAllocEx → WriteProcessMemory → CreateRemoteThread",en:"VirtualAllocEx → WriteProcessMemory → CreateRemoteThread"},
      {k:"AMSI",fr:"hook AmsiScanBuffer → CLEAN",en:"hook AmsiScanBuffer → CLEAN"}]}
   ]},

  {id:"honeypot", t:{fr:"Honeypots",en:"Honeypots"},
   s:{fr:"Types par interaction, 5 détections",en:"Types by interaction, 5 detections"},
   blocks:[
    {t:"p",fr:"Un **honeypot** est une ressource montée pour **attirer et piéger** les attaquants. Il n'a **aucune valeur de production** → tout trafic vers lui est suspect (sonde, attaque).",en:"A **honeypot** is a resource set up to **attract and trap** attackers. It has **no production value** → any traffic to it is suspect (probe, attack)."},
    {t:"table",head:{fr:["Type (par interaction)","Description"],en:["Type (by interaction)","Description"]},rows:[
      [{fr:"**Low-interaction**",en:"**Low-interaction**"},{fr:"services limités, **ne peut pas être compromis** (KFSensor, Honeytrap)",en:"limited services, **cannot be compromised** (KFSensor, Honeytrap)"}],
      [{fr:"**Medium-interaction**",en:"**Medium-interaction**"},{fr:"simule un vrai OS + applis/services",en:"simulates a real OS + apps/services"}],
      [{fr:"**High-interaction**",en:"**High-interaction**"},{fr:"simule **tous** les services/applis",en:"simulates **all** services/apps"}],
      [{fr:"**Pure honeypot**",en:"**Pure honeypot**"},{fr:"émule le **vrai réseau de production**",en:"emulates the **real production network**"}]]},
    {t:"p",fr:"Par déploiement : **production** / **research**. Par déception : malware, database, spam, email, spider, **honeynets**.",en:"By deployment: **production** / **research**. By deception: malware, database, spam, email, spider, **honeynets**."},
    {t:"h",fr:"Détecter un honeypot (5 méthodes)",en:"Detecting a honeypot (5 methods)"},
    {t:"ul",items:[
      {fr:"**Fingerprinting** du service (comportement incohérent avec la bannière)",en:"Service **fingerprinting** (behavior inconsistent with the banner)"},
      {fr:"**Temps de réponse** anormalement élevés/variables (surcoût de logging)",en:"Abnormally high/variable **response times** (logging overhead)"},
      {fr:"**MAC / OUI** inhabituels",en:"Unusual **MAC / OUI**"},
      {fr:"**Ports ouverts inattendus** (`nmap -p-`)",en:"**Unexpected open ports** (`nmap -p-`)"},
      {fr:"**Config/metadata** par défaut ou incohérents",en:"Default or inconsistent **config/metadata**"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"4 types par interaction : **low** (ne peut être compromis) · medium · high · **pure** (vrai réseau de prod). Un **honeynet** = honeypot high-interaction. Indice de détection : **temps de réponse élevés/variables**.",en:"4 types by interaction: **low** (cannot be compromised) · medium · high · **pure** (real prod network). A **honeynet** = high-interaction honeypot. Detection clue: **high/variable response times**."},
    {t:"recap",items:[
      {k:"4 types",fr:"low · medium · high · pure",en:"low · medium · high · pure"},
      {k:"Low",fr:"services limités, non compromettable",en:"limited services, not compromisable"},
      {k:"Détection",fr:"réponse lente, OUI, ports inattendus",en:"slow response, OUI, unexpected ports"}]}
   ]},

  {id:"defense", t:{fr:"Contre-mesures",en:"Countermeasures"},
   s:{fr:"Défendre IDS et pare-feu",en:"Defending IDS and firewalls"},
   blocks:[
    {t:"h",fr:"Contre l'évasion d'IDS",en:"Against IDS evasion"},
    {t:"ul",items:[
      {fr:"**Normaliser** le trafic et **réassembler les fragments** dans l'ordre avant l'IDS",en:"**Normalize** traffic and **reassemble fragments** in order before the IDS"},
      {fr:"Terminer les sessions malveillantes par TCP FIN/RST ; surveiller les nop ≠ 0x90 (shellcode polymorphe)",en:"Terminate malicious sessions with TCP FIN/RST; watch for nop ≠ 0x90 (polymorphic shellcode)"},
      {fr:"Bloquer les ICMP TTL-expired, mettre le TTL à une grande valeur, MAJ des signatures",en:"Block ICMP TTL-expired, set TTL to a large value, update signatures"}]},
    {t:"h",fr:"Contre l'évasion de pare-feu",en:"Against firewall evasion"},
    {t:"ul",items:[
      {fr:"**Deny all** par défaut, n'activer que le nécessaire ; spécifier IP/ports source et destination",en:"**Deny all** by default, enable only what's needed; specify source/destination IPs and ports"},
      {fr:"**DPI** au niveau applicatif, **inspection HTTPS/TLS**, limites de connexions par IP",en:"**DPI** at the application layer, **HTTPS/TLS inspection**, connection limits per IP"},
      {fr:"Syslog distant protégé, sauvegardes du ruleset, audits réguliers, **modèle zero-trust**",en:"Protected remote syslog, ruleset backups, regular audits, **zero-trust model**"}]},
    {t:"recap",items:[
      {k:"IDS",fr:"normalisation + réassemblage des fragments",en:"normalization + fragment reassembly"},
      {k:"Pare-feu",fr:"deny all, DPI, inspection TLS, zero-trust",en:"deny all, DPI, TLS inspection, zero-trust"}]}
   ]}
 ],

 quiz:[
  {q:{fr:"Quelle est la différence clé entre un IDS et un IPS ?",en:"What is the key difference between an IDS and an IPS?"},opts:[{fr:"IDS passif (détecte) ; IPS actif inline (détecte et bloque)",en:"IDS passive (detects); IPS active inline (detects and blocks)"},{fr:"l'inverse",en:"the opposite"},{fr:"aucune différence",en:"no difference"},{fr:"l'IDS bloque, l'IPS journalise",en:"IDS blocks, IPS logs"}],a:0,ex:{fr:"L'IDS surveille et alerte (souvent en promiscuous, hors bande) ; l'IPS est placé inline et peut bloquer le trafic.",en:"The IDS monitors and alerts (often promiscuous, out-of-band); the IPS is inline and can block traffic."}},
  {q:{fr:"Quelle technique utilise les valeurs de TTL pour cartographier les règles ACL d'un pare-feu ?",en:"Which technique uses TTL values to map a firewall's ACL rules?"},opts:[{fr:"Firewalking",en:"Firewalking"},{fr:"Banner grabbing",en:"Banner grabbing"},{fr:"HTML smuggling",en:"HTML smuggling"},{fr:"Source routing",en:"Source routing"}],a:0,ex:{fr:"Le firewalking envoie des paquets avec un TTL d'un hop de plus que le pare-feu pour déduire ses filtres ACL. Outils : Firewalk, script Nmap.",en:"Firewalking sends packets with a TTL one hop past the firewall to infer its ACL filters. Tools: Firewalk, Nmap script."}},
  {q:{fr:"Quelle technique force l'en-tête TCP dans le fragment suivant pour empêcher le réassemblage par l'IDS ?",en:"Which technique forces the TCP header into the next fragment to prevent IDS reassembly?"},opts:[{fr:"Tiny fragments",en:"Tiny fragments"},{fr:"ACK tunneling",en:"ACK tunneling"},{fr:"DGA",en:"DGA"},{fr:"Firewalking",en:"Firewalking"}],a:0,ex:{fr:"Les tiny fragments scindent le paquet pour que l'en-tête TCP tombe dans le fragment suivant : l'IDS ne peut pas réassembler pour matcher une signature.",en:"Tiny fragments split the packet so the TCP header lands in the next fragment: the IDS can't reassemble to match a signature."}},
  {q:{fr:"Quelle technique tunnelise un backdoor dans la partie données de paquets ICMP Echo ?",en:"Which technique tunnels a backdoor in the data portion of ICMP Echo packets?"},opts:[{fr:"ICMP tunneling",en:"ICMP tunneling"},{fr:"DNS tunneling",en:"DNS tunneling"},{fr:"HTTP tunneling",en:"HTTP tunneling"},{fr:"ACK tunneling",en:"ACK tunneling"}],a:0,ex:{fr:"La RFC 792 ne définit pas le contenu de la data ICMP : on peut y placer un payload arbitraire (backdoor). Outil : ICMPTX.",en:"RFC 792 doesn't define ICMP data content: an arbitrary payload (backdoor) can be placed there. Tool: ICMPTX."}},
  {q:{fr:"Quelle technique utilise une « seed » partagée pour générer des noms de domaine gibberish pour le C2 ?",en:"Which technique uses a shared \"seed\" to generate gibberish domain names for C2?"},opts:[{fr:"Domain Generation Algorithm (DGA)",en:"Domain Generation Algorithm (DGA)"},{fr:"Fast flux",en:"Fast flux"},{fr:"Source routing",en:"Source routing"},{fr:"HTML smuggling",en:"HTML smuggling"}],a:0,ex:{fr:"Les DGA génèrent quantité de domaines « gibberish » (ex. isdfcbdjdnfuylt.ru) via une seed partagée, servant de points de rendez-vous C2 — difficile à bloquer par signature.",en:"DGAs generate many \"gibberish\" domains (e.g. isdfcbdjdnfuylt.ru) via a shared seed, serving as C2 rendezvous points — hard to block by signature."}},
  {q:{fr:"Quel protocole les attaquants exploitent-ils pour le VLAN hopping afin de contourner le NAC ?",en:"Which protocol do attackers exploit for VLAN hopping to bypass NAC?"},opts:[{fr:"DTP (Dynamic Trunking Protocol)",en:"DTP (Dynamic Trunking Protocol)"},{fr:"STP",en:"STP"},{fr:"ARP",en:"ARP"},{fr:"DHCP",en:"DHCP"}],a:0,ex:{fr:"En mode « dynamic auto/desirable », DTP permet d'établir un trunk et d'accéder à tous les VLAN. Outil : VLANPWN.",en:"In \"dynamic auto/desirable\" mode, DTP lets an attacker establish a trunk and reach all VLANs. Tool: VLANPWN."}},
  {q:{fr:"Quelle séquence d'API Windows caractérise le process injection ?",en:"Which Windows API sequence characterizes process injection?"},opts:[{fr:"VirtualAllocEx → WriteProcessMemory → CreateRemoteThread",en:"VirtualAllocEx → WriteProcessMemory → CreateRemoteThread"},{fr:"AmsiScanBuffer → Sleep → XOR",en:"AmsiScanBuffer → Sleep → XOR"},{fr:"malloc → strcpy → free",en:"malloc → strcpy → free"},{fr:"open → read → close",en:"open → read → close"}],a:0,ex:{fr:"On alloue de la mémoire dans le processus cible (VirtualAllocEx), on y écrit le payload (WriteProcessMemory) puis on l'exécute (CreateRemoteThread).",en:"Memory is allocated in the target process (VirtualAllocEx), the payload is written (WriteProcessMemory), then executed (CreateRemoteThread)."}},
  {q:{fr:"Quelle fonction est hookée pour réaliser un AMSI bypass ?",en:"Which function is hooked to perform an AMSI bypass?"},opts:[{fr:"AmsiScanBuffer()",en:"AmsiScanBuffer()"},{fr:"CreateRemoteThread()",en:"CreateRemoteThread()"},{fr:"VirtualAllocEx()",en:"VirtualAllocEx()"},{fr:"EfsRpcOpenFileRaw()",en:"EfsRpcOpenFileRaw()"}],a:0,ex:{fr:"L'AMSI bypass hooke AmsiScanBuffer() pour qu'elle retourne toujours AMSI_RESULT_CLEAN, neutralisant l'inspection.",en:"AMSI bypass hooks AmsiScanBuffer() to always return AMSI_RESULT_CLEAN, neutralizing the inspection."}},
  {q:{fr:"Quel type de honeypot ne peut PAS être totalement compromis car il ne simule que des services limités ?",en:"Which honeypot type CANNOT be fully compromised because it only simulates limited services?"},opts:[{fr:"Low-interaction",en:"Low-interaction"},{fr:"High-interaction",en:"High-interaction"},{fr:"Pure honeypot",en:"Pure honeypot"},{fr:"Medium-interaction",en:"Medium-interaction"}],a:0,ex:{fr:"Le low-interaction ne simule qu'un nombre limité de services (KFSensor, Honeytrap) et ne peut être pleinement compromis. Le pure honeypot émule un vrai réseau de production.",en:"Low-interaction simulates only a limited number of services (KFSensor, Honeytrap) and cannot be fully compromised. A pure honeypot emulates a real production network."}},
  {q:{fr:"Quel indice, basé sur le temps, peut trahir un honeypot ?",en:"Which time-based clue can betray a honeypot?"},opts:[{fr:"des temps de réponse anormalement élevés et variables",en:"abnormally high and variable response times"},{fr:"un TTL de 128",en:"a TTL of 128"},{fr:"un port 443 ouvert",en:"an open port 443"},{fr:"une adresse IP privée",en:"a private IP address"}],a:0,ex:{fr:"Le surcoût de logging/monitoring d'un honeypot se traduit souvent par des temps de réponse plus élevés et variables que les services réels.",en:"A honeypot's logging/monitoring overhead often shows up as higher, more variable response times than real services."}}
 ]
},
