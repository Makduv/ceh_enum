<!DOCTYPE html>
<html lang="fr" data-theme="light" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEH v13 — Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAEEF2; --sink:#DFE4E9; --card:#FBFCFD; --card-2:#F2F5F7;
  --ink:#14202B; --ink-soft:#46586A; --ink-faint:#7C8D9B; --rule:#CDD6DE; --rule-soft:#DEE5EB;
  --accent:#0E7C71; --accent-soft:#0E7C7115; --accent-line:#0E7C7140;
  --cmd-bg:#12242A; --cmd-ink:#D4E7E4; --cmd-key:#7FD9C9; --cmd-cmt:#6F8A86;
  --trap:#B0402A; --trap-bg:#B0402A12; --warn:#9A6B12; --warn-bg:#9A6B1214;
  --ok:#177A47; --ok-bg:#177A4714; --recap:#3F5D8A; --recap-bg:#3F5D8A10;
  --shadow:0 1px 2px #1420280d, 0 6px 20px #14202810;
  --r:10px;
}
[data-theme="dark"]{
  --paper:#0E151D; --sink:#0A1017; --card:#161F29; --card-2:#1B2733;
  --ink:#E7EDF2; --ink-soft:#A6B6C2; --ink-faint:#69798A; --rule:#283542; --rule-soft:#1F2A35;
  --accent:#3AD6C4; --accent-soft:#3AD6C418; --accent-line:#3AD6C440;
  --cmd-bg:#0A1418; --cmd-ink:#CFE7E3; --cmd-key:#6FE0CE; --cmd-cmt:#5C7772;
  --trap:#F08157; --trap-bg:#F0815718; --warn:#E4B44A; --warn-bg:#E4B44A16;
  --ok:#4FD98A; --ok-bg:#4FD98A16; --recap:#8FB0E0; --recap-bg:#8FB0E014;
  --shadow:0 1px 2px #0006, 0 8px 26px #0007;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Inter",system-ui,sans-serif;font-size:15.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.2;margin:0}
a{color:var(--accent)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);height:100vh;height:100dvh}
.rail{grid-row:1/-1;border-right:1px solid var(--rule);background:var(--sink);
  overflow-y:auto;padding:0 0 40px;display:flex;flex-direction:column}
.brand{padding:18px 20px 12px;position:sticky;top:0;background:var(--sink);z-index:2;border-bottom:1px solid var(--rule-soft)}
.brand .t{font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand .s{color:var(--ink-faint);font-size:12.5px;margin-top:2px}
.railsec{padding:14px 12px 2px}
.railsec .h{font-size:11.5px;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;padding:0 8px 6px;font-weight:600}
.navi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
  font:inherit;color:var(--ink-soft);padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.35;
  border:1px solid transparent}
.navi:hover{background:var(--card);color:var(--ink)}
.navi .num{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-faint);min-width:20px}
.navi[aria-current="true"]{background:var(--card);color:var(--ink);border-color:var(--rule);font-weight:500;box-shadow:var(--shadow)}
.navi[aria-current="true"] .num{color:var(--accent)}
.navi.tx{gap:9px}
.navi .ic{width:16px;height:16px;flex:none;color:var(--ink-faint)}
.navi[aria-current="true"] .ic{color:var(--accent)}
.navi.dim{opacity:.5}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
  padding:12px 26px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--rule);border-radius:9px;padding:7px 12px}
.search input{border:0;background:none;outline:none;font:inherit;color:var(--ink);width:100%}
.search input::placeholder{color:var(--ink-faint)}
.search svg{color:var(--ink-faint);flex:none}
.tgl{display:flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--card)}
.tgl button{border:0;background:none;font:inherit;font-weight:500;font-size:13px;color:var(--ink-faint);
  padding:7px 12px;cursor:pointer;line-height:1}
.tgl button.on{background:var(--accent);color:#fff}
.iconbtn{border:1px solid var(--rule);background:var(--card);border-radius:9px;width:38px;height:34px;
  cursor:pointer;color:var(--ink-soft);display:grid;place-items:center}
.iconbtn:hover{color:var(--ink)}

.scroller{overflow-y:auto;height:calc(100vh - 59px);height:calc(100dvh - 59px)}
.wrap{max-width:1180px;margin:0 auto;padding:30px 26px 90px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:34px;align-items:start}
@media(max-width:960px){.wrap{grid-template-columns:1fr}.toc{display:none}}

/* ---------- module header ---------- */
.mhead{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 20px;
  border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:6px}
.mhead .no{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--accent);font-weight:500}
.mhead h1{font-size:32px;letter-spacing:-.015em;margin-top:2px}
.mhead .exam{color:var(--ink-faint);font-size:13px;margin-top:6px}
.mhead .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;font-weight:500;
  font-size:13.5px;padding:9px 15px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent-line);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
.btn svg{width:15px;height:15px}

/* ---------- toc ---------- */
.toc{position:sticky;top:78px;font-size:13.5px}
.toc .h{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:10px}
.toc a{display:block;color:var(--ink-soft);text-decoration:none;padding:5px 0 5px 12px;border-left:2px solid var(--rule-soft);line-height:1.35}
.toc a:hover{color:var(--ink);border-left-color:var(--ink-faint)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:500}

/* ---------- cards ---------- */
.col{min-width:0;display:flex;flex-direction:column;gap:22px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:76px}
.card>summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;align-items:center;gap:14px}
.card>summary::-webkit-details-marker{display:none}
.card .cnum{width:30px;height:30px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500}
.card h2{font-size:19px;letter-spacing:-.01em}
.card .sub{color:var(--ink-faint);font-size:13px;margin-top:1px}
.card .chev{margin-left:auto;color:var(--ink-faint);transition:transform .2s}
.card[open] .chev{transform:rotate(90deg)}
.body{padding:2px 22px 24px;border-top:1px solid var(--rule-soft)}
.body>*:first-child{margin-top:16px}

/* content blocks */
.body h3{font-size:16px;margin:26px 0 8px;letter-spacing:-.005em}
.body h3:first-child{margin-top:14px}
.body p{margin:10px 0;max-width:72ch}
.body strong{font-weight:600;color:var(--ink)}
.body code{font-family:"JetBrains Mono",monospace;font-size:.86em;background:var(--card-2);
  border:1px solid var(--rule-soft);border-radius:5px;padding:1px 5px;color:var(--ink)}
.body ul{margin:10px 0;padding-left:0;list-style:none;max-width:72ch}
.body ul li{position:relative;padding:4px 0 4px 20px}
.body ul li::before{content:"";position:absolute;left:4px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.body ol{margin:10px 0;padding-left:22px;max-width:72ch}
.body ol li{padding:3px 0}
.body ol li::marker{color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:.85em}

table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;overflow:hidden}
.tblwrap{overflow-x:auto;margin:14px 0;border:1px solid var(--rule-soft);border-radius:8px}
.tblwrap table{margin:0}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
th{background:var(--card-2);font-weight:600;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}

.cmd{background:var(--cmd-bg);border-radius:8px;margin:14px 0;overflow:hidden;border:1px solid #0003}
.cmd .cbar{display:flex;align-items:center;gap:7px;padding:8px 13px;border-bottom:1px solid #ffffff10}
.cmd .cbar .dot{width:9px;height:9px;border-radius:50%;background:#ffffff22}
.cmd .cbar .lbl{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--cmd-cmt)}
.cmd pre{margin:0;padding:13px 15px;overflow-x:auto;font-family:"JetBrains Mono",monospace;
  font-size:13px;line-height:1.7;color:var(--cmd-ink)}
.cmd .p{color:var(--cmd-key)}
.cmd .c{color:var(--cmd-cmt)}

.call{border-radius:8px;padding:13px 16px 13px 15px;margin:16px 0;border:1px solid;border-left-width:3px;font-size:14.5px}
.call .k{display:block;font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.call p{margin:5px 0;max-width:none}
.call.trap{background:var(--trap-bg);border-color:var(--trap)}
.call.trap .k{color:var(--trap)}
.call.warn{background:var(--warn-bg);border-color:var(--warn)}
.call.warn .k{color:var(--warn)}
.call.note{background:var(--accent-soft);border-color:var(--accent-line)}
.call.note .k{color:var(--accent)}

.recap{background:var(--recap-bg);border:1px solid var(--rule-soft);border-radius:8px;padding:15px 17px;margin:18px 0 4px}
.recap .k{font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--recap);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.recap .grid{display:grid;gap:7px}
.recap .grid div{display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:13.5px;align-items:baseline}
.recap .grid b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:12.5px;color:var(--recap);white-space:nowrap}

/* ---------- transverse tables view ---------- */
.tx-head{grid-column:1/-1;border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:8px}
.tx-head h1{font-size:30px;letter-spacing:-.015em}
.tx-head p{color:var(--ink-soft);margin:8px 0 0;max-width:72ch}
.filterbar{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.chip{border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);font:inherit;font-size:13px;
  padding:6px 13px;border-radius:20px;cursor:pointer;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.txbody{grid-column:1/-1}
.ports-t td:first-child code,.ports-t th:first-child{width:70px}
.proto{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;display:inline-block}
.proto.tcp{background:#0E7C7118;color:var(--accent)}
.proto.udp{background:#9A6B1218;color:var(--warn)}
.proto.both{background:var(--card-2);color:var(--ink-soft)}
[data-theme="dark"] .proto.tcp{background:#3AD6C420}
[data-theme="dark"] .proto.udp{background:#E4B44A20}

.tool{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.tool .th{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tool .th h3{font-size:17px}
.tool .os{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint);border:1px solid var(--rule-soft);padding:2px 7px;border-radius:5px}
.tool>p{color:var(--ink-soft);font-size:14px;margin:8px 0 12px;max-width:72ch}
.famhead{grid-column:1/-1;font-size:14px;font-family:"Fraunces",serif;font-weight:600;color:var(--accent);
  margin:20px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--accent-line)}
.famhead:first-of-type{margin-top:0}

/* ---------- modal (cheat + quiz) ---------- */
.modal{position:fixed;inset:0;background:#0a0f14b0;backdrop-filter:blur(3px);display:none;
  z-index:40;padding:24px;overflow-y:auto}
.modal.on{display:flex;align-items:flex-start;justify-content:center}
.dialog{background:var(--paper);border:1px solid var(--rule);border-radius:14px;max-width:860px;width:100%;
  margin:auto;box-shadow:0 20px 60px #0007;overflow:hidden}
.dhead{display:flex;align-items:flex-start;gap:16px;padding:20px 24px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:2}
.dhead .kick{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.dhead h2{font-size:22px;margin-top:3px;letter-spacing:-.01em}
.dhead .m{color:var(--ink-faint);font-size:13px;margin-top:3px}
.dclose{margin-left:auto;border:1px solid var(--rule);background:var(--card);border-radius:8px;width:34px;height:34px;
  font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;flex:none}
.dclose:hover{color:var(--ink)}
.dbody{padding:22px 24px 30px}

/* cheat sheet layout */
.cheat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.csec{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:15px 17px}
.csec.wide{grid-column:1/-1}
.csec h4{font-size:14px;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.csec .row{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;padding:3px 0;align-items:baseline}
.csec .row b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:12px;color:var(--ink);white-space:nowrap}
.csec .row span{color:var(--ink-soft);overflow-wrap:anywhere}
.csec ul{margin:4px 0 0;padding:0;list-style:none}
.csec ul li{position:relative;padding:3px 0 3px 16px;font-size:13px;color:var(--ink-soft)}
.csec ul li::before{content:"";position:absolute;left:2px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.qa{font-size:13px;padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.qa:last-child{border:0}
.qa .q{color:var(--ink);font-weight:500}
.qa .a{color:var(--accent);margin-top:2px}

/* quiz */
.quiz-setup{text-align:center;padding:14px 0}
.quiz-setup h3{font-size:20px;margin-bottom:8px}
.quiz-setup p{color:var(--ink-soft);max-width:52ch;margin:0 auto 18px}
.sizes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sizes button{border:1px solid var(--rule);background:var(--card);font:inherit;font-weight:500;padding:12px 22px;
  border-radius:9px;cursor:pointer;color:var(--ink)}
.sizes button:hover{border-color:var(--accent);color:var(--accent)}
.qbar{height:5px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qctx{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-faint)}
.qq{font-size:18px;font-family:"Fraunces",serif;font-weight:600;margin:8px 0 18px;line-height:1.35}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--card);
  font:inherit;padding:13px 15px;border-radius:9px;cursor:pointer;color:var(--ink)}
.qopt:hover{border-color:var(--accent-line)}
.qopt .kk{width:24px;height:24px;flex:none;border-radius:6px;background:var(--card-2);display:grid;place-items:center;
  font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-faint)}
.qopt.correct{border-color:var(--ok);background:var(--ok-bg)}
.qopt.correct .kk{background:var(--ok);color:#fff}
.qopt.wrong{border-color:var(--trap);background:var(--trap-bg)}
.qopt.wrong .kk{background:var(--trap);color:#fff}
.qfb{margin-top:16px;padding:13px 16px;border-radius:8px;background:var(--card-2);border:1px solid var(--rule-soft);
  font-size:14px;display:none}
.qfb.on{display:block}
.qfb b{color:var(--ink)}
.qact{display:flex;justify-content:flex-end;margin-top:16px}
.qnext{border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:500;
  padding:10px 18px;border-radius:9px;cursor:pointer}
.qres{text-align:center;padding:10px 0}
.qres .score{font-family:"Fraunces",serif;font-size:56px;font-weight:600;color:var(--accent);line-height:1}
.qres h3{font-size:19px;margin:10px 0}
.qres .again{border:1px solid var(--rule);background:var(--card);font:inherit;font-weight:500;padding:10px 20px;
  border-radius:9px;cursor:pointer;color:var(--ink);margin-top:14px}

.empty{grid-column:1/-1;text-align:center;color:var(--ink-faint);padding:70px 20px}
.empty h2{font-size:22px;color:var(--ink-soft);margin-bottom:8px}

@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .25s;z-index:30}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:#0008;z-index:29;display:none}
  .scrim.on{display:block}
  .menu-btn{display:grid!important}
  .mhead h1{font-size:25px}
}
.menu-btn{display:none}

.searchwrap{grid-column:1/-1;max-width:860px;margin:0 auto;width:100%}
.searchwrap h1{font-size:24px;letter-spacing:-.01em;margin-bottom:2px}
.searchwrap .sub{color:var(--ink-faint);margin-bottom:20px;font-size:14px}
.srgrp{margin:20px 0}
.srgrp .gh{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
.sr{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:11px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.sr:hover{border-color:var(--accent-line)}
.sr .m{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint)}
.sr .t{font-weight:500;margin-top:2px}
.sr .x{color:var(--ink-soft);font-size:13px;margin-top:3px;display:block}
.sr mark{background:var(--accent-soft);color:var(--accent);padding:0 2px;border-radius:3px;font-weight:600}
.srempty{grid-column:1/-1;text-align:center;color:var(--ink-faint);padding:60px 20px}

.toolsub{margin:8px 0 2px;padding:0;list-style:none}
.toolsub li{position:relative;padding:4px 0 4px 16px;font-size:13.5px;color:var(--ink-soft);max-width:74ch;line-height:1.5}
.toolsub li::before{content:"";position:absolute;left:3px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.toolsub b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail">
    <div class="brand">
      <div class="t">CEH v13</div>
      <div class="s" data-i18n="tagline">Révision — une seule ressource</div>
    </div>
    <div class="railsec">
      <div class="h" data-i18n="modules">Modules</div>
      <div id="modlist"></div>
    </div>
    <div class="railsec">
      <div class="h" data-i18n="transverse">Transverse</div>
      <button class="navi tx" data-view="ports">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>
        <span data-i18n="ports">Ports &amp; services</span>

      [{fr:"Blue",en:"Blue"},{fr:"Oui (sous contrat)",en:"Yes (contract)"},{fr:"Test avant mise en prod",en:"Pre-release testing"}],
      [{fr:"Red",en:"Red"},{fr:"Auto-mandaté",en:"Self-authorized"},{fr:"Vigilante contre les black hats",en:"Vigilante vs black hats"}],
      [{fr:"Green",en:"Green"},{fr:"Non",en:"No"},{fr:"Débutant qui apprend",en:"Learner"}]]},
    {t:"p",fr:"Autres profils : **Script kiddies** (outils tout faits), **Hacktivistes** (cause politique), **State-sponsored** (espionnage étatique), **Cyber-terroristes**, **Suicide hackers** (assument les conséquences), **Insiders**.",en:"Other profiles: **Script kiddies** (ready-made tools), **Hacktivists** (political cause), **State-sponsored** (state espionage), **Cyber-terrorists**, **Suicide hackers** (accept the consequences), **Insiders**."},
    {t:"h",fr:"Règles de l'engagement",en:"Rules of engagement"},
    {t:"ol",items:[
      {fr:"Obtenir une **autorisation signée** avant tout test",en:"Get **signed authorization** before any test"},
      {fr:"**Confidentialité** — signer un NDA, ne rien divulguer",en:"**Confidentiality** — sign an NDA, disclose nothing"},
      {fr:"Rester **dans les limites convenues** (ex. DoS seulement si accepté)",en:"Stay **within agreed limits** (e.g. DoS only if agreed)"}]},
    {t:"p",fr:"**3 questions** que l'éthique doit trancher : que voit l'attaquant ? que peut-il en faire ? ses tentatives sont-elles repérées ?",en:"**3 questions** the ethical hacker must answer: what can the attacker see? what can they do with it? are their attempts being noticed?"},
    {t:"h",fr:"Hacking éthique assisté par IA (nouveau v13)",en:"AI-driven ethical hacking (new in v13)"},
    {t:"p",fr:"L'IA **augmente** l'éthique (efficacité, précision, passage à l'échelle, coût) mais ne le **remplace pas** : créativité, jugement contextuel et décisions éthiques restent humains. Outils : **PentestGPT, BurpGPT, BugBountyGPT, CybGPT**.",en:"AI **augments** the ethical hacker (efficiency, accuracy, scale, cost) but does **not replace** them: creativity, contextual judgment and ethical decisions stay human. Tools: **PentestGPT, BurpGPT, BugBountyGPT, CybGPT**."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Gray hat = **agit sans permission** (donc pas légal) mais sans intention malveillante — à ne pas confondre avec White (autorisé) ni Black (malveillant).",en:"Gray hat = **acts without permission** (so not legal) but without malicious intent — don't confuse with White (authorized) or Black (malicious)."},
    {t:"recap",items:[
      {k:"Distinction clé",fr:"le consentement du propriétaire",en:"the owner's consent"},
      {k:"Chapeaux",fr:"White/Black/Gray/Blue/Red/Green",en:"White/Black/Gray/Blue/Red/Green"},
      {k:"Règles",fr:"autorisation signée, NDA, limites convenues",en:"signed authorization, NDA, agreed limits"},
      {k:"IA",fr:"augmente, ne remplace pas — PentestGPT, BurpGPT",en:"augments, doesn't replace — PentestGPT, BurpGPT"}]}
   ]},

  {id:"method", t:{fr:"Méthodologie CEH (5 phases)",en:"CEH methodology (5 phases)"},
   s:{fr:"Recon → Scan → Accès → Maintien → Effacement",en:"Recon → Scan → Access → Maintain → Clear"},
   blocks:[
    {t:"table",head:{fr:["Phase","Ce qui s'y passe"],en:["Phase","What happens"]},rows:[
      [{fr:"1. Reconnaissance",en:"1. Reconnaissance"},{fr:"Footprinting + scanning + énumération : profil de la cible, surface d'attaque",en:"Footprinting + scanning + enumeration: target profile, attack surface"}],
      [{fr:"2. Scan de vulnérabilités",en:"2. Vulnerability scanning"},{fr:"Identifier et classer les failles exploitables",en:"Identify and classify exploitable flaws"}],
      [{fr:"3. Gaining Access",en:"3. Gaining Access"},{fr:"Le hacking réel : exploit, mot de passe, misconfig → puis **escalade de privilèges**",en:"The real hacking: exploit, password, misconfig → then **privilege escalation**"}],
      [{fr:"4. Maintaining Access",en:"4. Maintaining Access"},{fr:"Garder la main : backdoors, trojans, rootkits (souvent en durcissant la machine)",en:"Keep control: backdoors, trojans, rootkits (often hardening the box)"}],
      [{fr:"5. Clearing Tracks",en:"5. Clearing Tracks"},{fr:"Effacer les preuves : logs, horodatages, stéganographie, ADS",en:"Erase evidence: logs, timestamps, steganography, ADS"}]],},
    {t:"h",fr:"Recon passive vs active",en:"Passive vs active recon"},
    {t:"ul",items:[
      {fr:"**Passive** — aucune interaction directe (OSINT, sources publiques)",en:"**Passive** — no direct interaction (OSINT, public sources)"},
      {fr:"**Active** — interaction directe (scan de ports, mapping OS)",en:"**Active** — direct interaction (port scanning, OS mapping)"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Nmap = scanning, jamais footprinting.** Le footprinting est de la reconnaissance (souvent passive) ; Nmap sonde activement des hôtes vivants.",en:"**Nmap = scanning, never footprinting.** Footprinting is reconnaissance (often passive); Nmap actively probes live hosts."},
    {t:"recap",items:[
      {k:"5 phases",fr:"Recon · Vuln scan · Access · Maintain · Clear tracks",en:"Recon · Vuln scan · Access · Maintain · Clear tracks"},
      {k:"Après l'accès",fr:"escalade de privilèges",en:"privilege escalation"},
      {k:"Nmap",fr:"phase scanning (pas footprinting)",en:"scanning phase (not footprinting)"}]}
   ]},

  {id:"frameworks", t:{fr:"Frameworks d'attaque",en:"Attack frameworks"},
   s:{fr:"Kill Chain, Mandiant, MITRE ATT&CK, Diamond",en:"Kill Chain, Mandiant, MITRE ATT&CK, Diamond"},
   blocks:[
    {t:"h",fr:"Cyber Kill Chain (Lockheed Martin) — 7 phases",en:"Cyber Kill Chain (Lockheed Martin) — 7 phases"},
    {t:"table",head:{fr:["Phase","Activité"],en:["Phase","Activity"]},rows:[
      [{fr:"1. Reconnaissance",en:"1. Reconnaissance"},{fr:"Recherche et sélection des cibles (OSINT, whois, scan)",en:"Research and select targets (OSINT, whois, scan)"}],
      [{fr:"2. Weaponization",en:"2. Weaponization"},{fr:"Coupler exploit + backdoor en un payload livrable",en:"Pair exploit + backdoor into a deliverable payload"}],
      [{fr:"3. Delivery",en:"3. Delivery"},{fr:"Transmettre l'arme (phishing, USB, watering hole)",en:"Transmit the weapon (phishing, USB, watering hole)"}],
      [{fr:"4. Exploitation",en:"4. Exploitation"},{fr:"Déclencher le code malveillant",en:"Trigger the malicious code"}],
      [{fr:"5. Installation",en:"5. Installation"},{fr:"Installer une persistance (backdoor, rootkit)",en:"Install persistence (backdoor, rootkit)"}],
      [{fr:"6. Command & Control",en:"6. Command & Control"},{fr:"Canal C2 (souvent HTTP/S, DNS, ICMP)",en:"C2 channel (often HTTP/S, DNS, ICMP)"}],
      [{fr:"7. Actions on Objectives",en:"7. Actions on Objectives"},{fr:"Exfiltration, destruction, mouvement latéral",en:"Exfiltration, destruction, lateral movement"}]]},
    {t:"note",k:{fr:"Attack Lifecycle (Mandiant)",en:"Attack Lifecycle (Mandiant)"},fr:"Variante avec une **boucle** interne : après Initial Recon → Initial Compromise → Establish Foothold, l'attaquant boucle sur Escalate Privileges ↔ Internal Recon ↔ Lateral Movement ↔ Maintain Presence, jusqu'à Complete Mission. La boucle reflète le va-et-vient réel dans le réseau, contrairement au kill chain linéaire.",en:"Variant with an internal **loop**: after Initial Recon → Initial Compromise → Establish Foothold, the attacker loops on Escalate Privileges ↔ Internal Recon ↔ Lateral Movement ↔ Maintain Presence, until Complete Mission. The loop reflects the real back-and-forth inside the network, unlike the linear kill chain."},
    {t:"h",fr:"MITRE ATT&CK",en:"MITRE ATT&CK"},
    {t:"p",fr:"Base de connaissances (MITRE, 2013) des comportements réels d'attaquants, organisée en **matrice** (Enterprise, Mobile, ICS). Structure : **Tactique** (le *pourquoi*) → **Technique** (le *comment*, ex. T1566 Phishing) → **Sous-technique** → **Procédure**. Ensemble = les **TTP**. Ce n'est **pas** une séquence : on pioche dans les tactiques. Outil : **ATT&CK Navigator** (couverture des détections) ; pendant défensif : **D3FEND**.",en:"Knowledge base (MITRE, 2013) of real attacker behavior, organized as a **matrix** (Enterprise, Mobile, ICS). Structure: **Tactic** (the *why*) → **Technique** (the *how*, e.g. T1566 Phishing) → **Sub-technique** → **Procedure**. Together = the **TTPs**. It's **not** a sequence: you pick from the tactics. Tool: **ATT&CK Navigator** (detection coverage); defensive counterpart: **D3FEND**."},
    {t:"p",fr:"Tactiques (colonnes) : Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, **C2**, Exfiltration, **Impact**.",en:"Tactics (columns): Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, **C2**, Exfiltration, **Impact**."},
    {t:"h",fr:"Diamond Model",en:"Diamond Model"},
    {t:"p",fr:"Analyse d'intrusion par 4 sommets : **Adversary** (qui), **Victim** (où), **Capability** (comment), **Infrastructure** (avec quoi). L'adversaire utilise une infrastructure pour déployer une capacité contre une victime.",en:"Intrusion analysis via 4 vertices: **Adversary** (who), **Victim** (where), **Capability** (how), **Infrastructure** (with what). The adversary uses infrastructure to deploy a capability against a victim."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Kill Chain = **séquence linéaire** de 7 phases. MITRE ATT&CK = **matrice** (non linéaire). Ne pas les confondre.",en:"Kill Chain = **linear sequence** of 7 phases. MITRE ATT&CK = **matrix** (non-linear). Don't confuse them."},
    {t:"recap",items:[
      {k:"Kill Chain",fr:"7 phases linéaires : Recon→Weapon→Deliver→Exploit→Install→C2→Actions",en:"7 linear phases: Recon→Weapon→Deliver→Exploit→Install→C2→Actions"},
      {k:"Mandiant",fr:"lifecycle avec boucle interne",en:"lifecycle with internal loop"},
      {k:"ATT&CK",fr:"matrice Tactique→Technique→Procédure = TTP",en:"matrix Tactic→Technique→Procedure = TTP"},
      {k:"Diamond",fr:"Adversary · Victim · Capability · Infrastructure",en:"Adversary · Victim · Capability · Infrastructure"}]}
   ]},

  {id:"controls", t:{fr:"Contrôles & gouvernance",en:"Controls & governance"},
   s:{fr:"Defense in depth, contrôles, politiques/standards/procédures",en:"Defense in depth, controls, policies/standards/procedures"},
   blocks:[
    {t:"p",fr:"L'**Information Assurance (IA)** garantit C, I, A et authenticité durant l'usage, le traitement, le stockage et la transmission, via des contrôles **physiques, techniques et administratifs**.",en:"**Information Assurance (IA)** guarantees C, I, A and authenticity during use, processing, storage and transmission, via **physical, technical and administrative** controls."},
    {t:"h",fr:"Defense in Depth vs in Breadth",en:"Defense in Depth vs in Breadth"},
    {t:"ul",items:[
      {fr:"**In Depth** — couches empilées (Politiques → Physique → Périmètre → Réseau interne → Hôte → Application → Donnée). But : **ralentir** et laisser des traces détectables",en:"**In Depth** — stacked layers (Policies → Physical → Perimeter → Internal network → Host → Application → Data). Goal: **delay** and leave detectable traces"},
      {fr:"**In Breadth** — élargit : cycle de dev (DevSecOps), supply chain, tiers, cloud, mobile, humains ; suppose que la prévention échouera → investit dans **détection & réponse**",en:"**In Breadth** — widens: dev lifecycle (DevSecOps), supply chain, third parties, cloud, mobile, people; assumes prevention will fail → invests in **detection & response**"}]},
    {t:"h",fr:"Stratégie de sécurité adaptative",en:"Adaptive security strategy"},
    {t:"p",fr:"Cycle continu **Predict → Protect → Detect → Respond**. Protéger (defense in depth), détecter (monitoring), répondre (IR), prédire (analyse de risque, threat intel).",en:"Continuous cycle **Predict → Protect → Detect → Respond**. Protect (defense in depth), detect (monitoring), respond (IR), predict (risk analysis, threat intel)."},
    {t:"h",fr:"Contrôles : deux axes",en:"Controls: two axes"},
    {t:"table",head:{fr:["Par fonction","Par type"],en:["By function","By type"]},rows:[
      [{fr:"**Préventif** — empêcher",en:"**Preventive** — stop it happening"},{fr:"**Technique** — antivirus, FW, EDR, chiffrement",en:"**Technical** — antivirus, FW, EDR, encryption"}],
      [{fr:"**Détectif** — repérer une violation",en:"**Detective** — spot a violation"},{fr:"**Administratif** — politiques, formation, background checks",en:"**Administrative** — policies, training, background checks"}],
      [{fr:"**Correctif** — réduire les dégâts après coup",en:"**Corrective** — reduce damage afterward"},{fr:"**Physique** — portes, caméras, badges, gardes",en:"**Physical** — doors, cameras, badges, guards"}]]},
    {t:"p",fr:"Les axes se combinent : une porte verrouillée = physique + préventif ; une caméra = physique + détectif ; une sauvegarde = technique + correctif.",en:"The axes combine: a locked door = physical + preventive; a camera = physical + detective; a backup = technical + corrective."},
    {t:"h",fr:"Politiques → Standards → Procédures → Guidelines",en:"Policies → Standards → Procedures → Guidelines"},
    {t:"table",head:{fr:["Niveau","Quoi","Obligatoire","Change"],en:["Level","What","Mandatory","Changes"]},rows:[
      [{fr:"Politique",en:"Policy"},{fr:"Le quoi et le pourquoi (haut niveau)",en:"The what and why (high-level)"},{fr:"Oui",en:"Yes"},{fr:"Rarement",en:"Rarely"}],
      [{fr:"Standard",en:"Standard"},{fr:"Le quoi précis (NIST, ISO, interne)",en:"The specific what (NIST, ISO, internal)"},{fr:"Oui",en:"Yes"},{fr:"Régulièrement",en:"Regularly"}],
      [{fr:"Procédure",en:"Procedure"},{fr:"Le comment, pas à pas (runbook)",en:"The how, step by step (runbook)"},{fr:"Oui",en:"Yes"},{fr:"Souvent",en:"Often"}],
      [{fr:"Guideline",en:"Guideline"},{fr:"Suggestion de bonne pratique",en:"Best-practice suggestion"},{fr:"Non",en:"No"},{fr:"Au besoin",en:"As needed"}]]},
    {t:"note",k:{fr:"Point clé",en:"Key point"},fr:"Une politique n'a aucun poids sans le **sponsoring du management** : c'est un artefact de gestion, pas technique. Les guidelines sont les seules **non obligatoires**.",en:"A policy has no weight without **management sponsorship**: it's a management artifact, not a technical one. Guidelines are the only **non-mandatory** level."},
    {t:"recap",items:[
      {k:"IA",fr:"contrôles physiques + techniques + administratifs",en:"physical + technical + administrative controls"},
      {k:"Adaptatif",fr:"Predict · Protect · Detect · Respond",en:"Predict · Protect · Detect · Respond"},
      {k:"Fonction",fr:"Préventif / Détectif / Correctif",en:"Preventive / Detective / Corrective"},
      {k:"Hiérarchie",fr:"Politique › Standard › Procédure › Guideline (seule non obligatoire)",en:"Policy › Standard › Procedure › Guideline (only non-mandatory)"}]}
   ]},

  {id:"defensetech", t:{fr:"Technologies de défense",en:"Defensive technologies"},
   s:{fr:"Pare-feu, IDS/IPS, EDR, SIEM, logging",en:"Firewalls, IDS/IPS, EDR, SIEM, logging"},
   blocks:[
    {t:"h",fr:"Pare-feu",en:"Firewalls"},
    {t:"table",head:{fr:["Type","Ce qu'il fait"],en:["Type","What it does"]},rows:[
      [{fr:"Packet filter",en:"Packet filter"},{fr:"Décision sur protocole/port/adresses (L3-L4). Sans contexte. Actions : **Drop** (silencieux → filtered), **Reject** (ICMP unreachable), **Accept**",en:"Decision on protocol/port/addresses (L3-L4). No context. Actions: **Drop** (silent → filtered), **Reject** (ICMP unreachable), **Accept**"}],
      [{fr:"Stateful",en:"Stateful"},{fr:"Suit l'**état** des connexions (table d'état) → autorise le retour sans règle ; casse les scans ACK/FIN",en:"Tracks connection **state** (state table) → allows return traffic without a rule; defeats ACK/FIN scans"}],
      [{fr:"DPI",en:"DPI"},{fr:"Inspecte le **payload** (signatures) ; **ne voit pas le chiffré** sans interception TLS",en:"Inspects the **payload** (signatures); **can't see encrypted** traffic without TLS interception"}],
      [{fr:"WAF",en:"WAF"},{fr:"Applicatif web (reverse proxy) : SQLi, XSS, path traversal — ex. **ModSecurity**",en:"Web application (reverse proxy): SQLi, XSS, path traversal — e.g. **ModSecurity**"}],
      [{fr:"UTM / NGFW",en:"UTM / NGFW"},{fr:"Consolide FW+IDS+IPS+AV (+ identité, appli) en un point ; NGFW = stateful+DPI+appli+identité+IPS",en:"Consolidates FW+IDS+IPS+AV (+ identity, app) in one point; NGFW = stateful+DPI+app+identity+IPS"}]]},
    {t:"note",k:{fr:"Règles de pare-feu",en:"Firewall rules"},fr:"Lues **de haut en bas, première correspondance gagne**. **Default deny** (tout ce qui n'est pas explicitement autorisé est bloqué) = le choix sûr.",en:"Read **top to bottom, first match wins**. **Default deny** (everything not explicitly allowed is blocked) = the secure choice."},
    {t:"h",fr:"IDS vs IPS",en:"IDS vs IPS"},
    {t:"ul",items:[
      {fr:"**IDS** — détecte et alerte, **ne bloque pas**. HIDS (hôte) / NIDS (réseau). Placé **hors bande** (copie via SPAN/TAP)",en:"**IDS** — detects and alerts, **does not block**. HIDS (host) / NIDS (network). Placed **out-of-band** (copy via SPAN/TAP)"},
      {fr:"**IPS** — **en coupure (inline)** dans le flux → peut Drop/Reject. Règles **dynamiques et temporaires**, décision sur le **contenu**",en:"**IPS** — **inline** in the flow → can Drop/Reject. **Dynamic and temporary** rules, decision on **content**"},
      {fr:"Détection : **signature** (connu) vs **anomalie/comportement** (plus de faux positifs). Open source : **Snort, Suricata, Zeek**",en:"Detection: **signature** (known) vs **anomaly/behavior** (more false positives). Open source: **Snort, Suricata, Zeek**"}]},
    {t:"h",fr:"EDR & SIEM",en:"EDR & SIEM"},
    {t:"ul",items:[
      {fr:"**EDR** — agent sur l'endpoint : enregistre en continu (processus, réseau, fichiers), détecte sur le **comportement**, permet investigation et **isolation** à distance. **XDR** (étendu), **MDR** (managé)",en:"**EDR** — endpoint agent: records continuously (processes, network, files), detects on **behavior**, enables remote investigation and **isolation**. **XDR** (extended), **MDR** (managed)"},
      {fr:"**SIEM** — centralise + **normalise** + **corrèle** les logs, alerte, tableaux de bord. Cœur du **SOC**. Force : vue d'ensemble (un événement anodin devient signifiant corrélé). Limites : coût au volume, tuning des faux positifs",en:"**SIEM** — centralizes + **normalizes** + **correlates** logs, alerts, dashboards. Core of the **SOC**. Strength: big picture (a harmless event becomes meaningful once correlated). Limits: volume-based cost, false-positive tuning"}]},
    {t:"h",fr:"Logging & audit",en:"Logging & auditing"},
    {t:"ul",items:[
      {fr:"**Syslog** (Unix) — **UDP 514**, logging distant → copie centrale = sauvegarde contre l'effacement des traces. Sévérités : emergency…debug",en:"**Syslog** (Unix) — **UDP 514**, remote logging → central copy = backup against track-clearing. Severities: emergency…debug"},
      {fr:"**Windows Event Log** (binaire, requêtable) — catégories System/Security/Application ; **Event ID** utiles : **4624** logon OK, **4625** logon échoué, **4688** création de processus, **4720** compte créé, **1102** journal de sécurité effacé",en:"**Windows Event Log** (binary, queryable) — System/Security/Application categories; useful **Event IDs**: **4624** logon success, **4625** logon failure, **4688** process creation, **4720** account created, **1102** security log cleared"},
      {fr:"**Audit** — Linux : `auditctl` / `auditd` (règles dans `/etc/audit/`, logs dans `/var/log/audit/`). Windows : audit policy (succès/échec) → journal Security",en:"**Auditing** — Linux: `auditctl` / `auditd` (rules in `/etc/audit/`, logs in `/var/log/audit/`). Windows: audit policy (success/failure) → Security log"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"IDS **alerte** (hors bande) ; IPS **bloque** (inline). Syslog = **UDP 514**. Un **drop** apparaît « filtered » sous Nmap, un **reject** renvoie un ICMP unreachable.",en:"IDS **alerts** (out-of-band); IPS **blocks** (inline). Syslog = **UDP 514**. A **drop** shows as \"filtered\" in Nmap, a **reject** returns an ICMP unreachable."},
    {t:"recap",items:[
      {k:"FW",fr:"packet / stateful / DPI / WAF / NGFW ; default deny",en:"packet / stateful / DPI / WAF / NGFW; default deny"},
      {k:"IDS/IPS",fr:"IDS alerte hors bande / IPS bloque inline",en:"IDS alerts out-of-band / IPS blocks inline"},
      {k:"EDR/SIEM",fr:"EDR comportement+isolation / SIEM corrélation, cœur du SOC",en:"EDR behavior+isolation / SIEM correlation, core of the SOC"},
      {k:"Logs",fr:"Syslog UDP 514 ; Windows 4624/4625/4688/1102",en:"Syslog UDP 514; Windows 4624/4625/4688/1102"}]}
   ]},

      {fr:"**Triage** — analyser, valider, catégoriser, prioriser",en:"**Triage** — analyze, validate, categorize, prioritize"},

    {t:"recap",items:[

      {k:"CTI types",fr:"Stratégique / Tactique / Opérationnelle / Technique",en:"Strategic / Tactical / Operational / Technical"},

  {id:"laws", t:{fr:"Lois & normes",en:"Laws & standards"},
   s:{fr:"PCI DSS, ISO 27000, RGPD, lois US",en:"PCI DSS, ISO 27000, GDPR, US laws"},
   blocks:[
    {t:"h",fr:"Normes majeures",en:"Major standards"},

 quiz:[
  {q:{fr:"Quels sont les deux éléments qui complètent la triade CIA ?",en:"Which two elements complete the CIA triad?"},opts:[{fr:"Authenticité et Non-répudiation",en:"Authenticity and Non-repudiation"},{fr:"Possession et Utilité",en:"Possession and Utility"},{fr:"Autorisation et Audit",en:"Authorization and Auditing"},{fr:"Chiffrement et Hachage",en:"Encryption and Hashing"}],a:0,ex:{fr:"Les 5 éléments de la sécurité de l'information = CIA + Authenticité + Non-répudiation. (Possession et Utilité viennent de l'hexade de Parker.)",en:"The 5 elements of information security = CIA + Authenticity + Non-repudiation. (Possession and Utility come from Parker's hexad.)"}},
  {q:{fr:"Quelle formule décrit une attaque selon le CEH ?",en:"Which formula describes an attack per CEH?"},opts:[{fr:"Motive + Method (TTP) + Vulnérabilité",en:"Motive + Method (TTP) + Vulnerability"},{fr:"Menace × Impact",en:"Threat × Impact"},{fr:"Perte × Probabilité",en:"Loss × Probability"},{fr:"Exploit + Payload",en:"Exploit + Payload"}],a:0,ex:{fr:"Attaque = Motive (but) + Method (TTP) + Vulnérabilité. « Perte × Probabilité » décrit le risque, pas l'attaque.",en:"Attack = Motive (goal) + Method (TTP) + Vulnerability. \"Loss × Probability\" describes risk, not the attack."}},
  {q:{fr:"Un pentesteur agit toujours…",en:"A pentester always acts…"},opts:[{fr:"avec une autorisation signée du propriétaire",en:"with the owner's signed authorization"},{fr:"sans prévenir personne pour être réaliste",en:"without warning anyone, to be realistic"},{fr:"en dépassant le périmètre si c'est utile",en:"going beyond scope if useful"},{fr:"en gardant les failles pour lui",en:"keeping the flaws to himself"}],a:0,ex:{fr:"Le consentement est la distinction centrale du hacking éthique : autorisation signée, NDA, respect des limites convenues.",en:"Consent is the central distinction of ethical hacking: signed authorization, NDA, respect for agreed limits."}},
  {q:{fr:"Nmap intervient dans quelle phase de la méthodologie CEH ?",en:"Which CEH methodology phase does Nmap belong to?"},opts:[{fr:"Scanning",en:"Scanning"},{fr:"Footprinting",en:"Footprinting"},{fr:"Clearing Tracks",en:"Clearing Tracks"},{fr:"Maintaining Access",en:"Maintaining Access"}],a:0,ex:{fr:"Nmap sonde activement les hôtes vivants et les ports → phase de scanning. Le footprinting est de la reconnaissance (souvent passive).",en:"Nmap actively probes live hosts and ports → scanning phase. Footprinting is reconnaissance (often passive)."}},
  {q:{fr:"Quelle est la différence structurelle entre la Cyber Kill Chain et MITRE ATT&CK ?",en:"What is the structural difference between the Cyber Kill Chain and MITRE ATT&CK?"},opts:[{fr:"Kill Chain = séquence linéaire ; ATT&CK = matrice",en:"Kill Chain = linear sequence; ATT&CK = matrix"},{fr:"Kill Chain = matrice ; ATT&CK = séquence",en:"Kill Chain = matrix; ATT&CK = sequence"},{fr:"Les deux sont des séquences identiques",en:"Both are identical sequences"},{fr:"ATT&CK ne concerne que le cloud",en:"ATT&CK only covers cloud"}],a:0,ex:{fr:"La Kill Chain enchaîne 7 phases linéaires ; ATT&CK est une matrice de tactiques/techniques dans laquelle on pioche, non linéaire.",en:"The Kill Chain runs 7 linear phases; ATT&CK is a matrix of tactics/techniques you pick from, non-linear."}},
  {q:{fr:"Un chapeau gris (gray hat) se caractérise par…",en:"A gray hat is characterized by…"},opts:[{fr:"agir sans permission, mais sans intention malveillante",en:"acting without permission, but with no malicious intent"},{fr:"agir avec permission et intention défensive",en:"acting with permission and defensive intent"},{fr:"agir avec permission mais intention malveillante",en:"acting with permission but malicious intent"},{fr:"un débutant qui apprend",en:"a beginner learning"}],a:0,ex:{fr:"Gray hat = découvre des failles sans autorisation (donc pas légal) mais sans intention de nuire, parfois il les signale.",en:"Gray hat = finds flaws without authorization (so not legal) but without intent to harm, sometimes discloses them."}},
  {q:{fr:"Lequel bloque activement le trafic malveillant ?",en:"Which one actively blocks malicious traffic?"},opts:[{fr:"L'IPS (inline)",en:"The IPS (inline)"},{fr:"L'IDS",en:"The IDS"},{fr:"Le SIEM",en:"The SIEM"},{fr:"Le syslog",en:"Syslog"}],a:0,ex:{fr:"L'IPS est en coupure (inline) et peut Drop/Reject. L'IDS ne fait qu'alerter (hors bande).",en:"The IPS is inline and can Drop/Reject. The IDS only alerts (out-of-band)."}},
  {q:{fr:"Sur quel port et protocole fonctionne syslog ?",en:"What port and protocol does syslog use?"},opts:[{fr:"UDP 514",en:"UDP 514"},{fr:"TCP 22",en:"TCP 22"},{fr:"UDP 53",en:"UDP 53"},{fr:"TCP 443",en:"TCP 443"}],a:0,ex:{fr:"Syslog utilise historiquement UDP 514 (des variantes TCP/TLS existent). Le logging distant protège les traces de l'effacement.",en:"Syslog historically uses UDP 514 (TCP/TLS variants exist). Remote logging protects traces from being wiped."}},

 n:2, exam:"312-50",
 t:{fr:"Footprinting & reconnaissance",en:"Footprinting & Reconnaissance"},
 sub:{fr:"Rassembler l'information avant l'attaque",en:"Gathering information before the attack"},
 cards:[

  {id:"concepts", t:{fr:"Concepts du footprinting",en:"Footprinting concepts"},
   s:{fr:"Passif vs actif, ce qu'on collecte, méthodologie",en:"Passive vs active, what is collected, methodology"},
   blocks:[
    {t:"p",fr:"Le **footprinting (reconnaissance)** est la phase préparatoire où l'on rassemble **le plus d'informations possible** sur une cible **avant** de lancer l'attaque. C'est la **première étape** : il dresse un *blueprint* de la posture de sécurité et de la surface d'attaque.",en:"**Footprinting (reconnaissance)** is the preparatory phase where you gather **as much information as possible** about a target **before** launching the attack. It's the **first step**: it builds a blueprint of the security posture and attack surface."},
    {t:"h",fr:"Passif vs actif",en:"Passive vs active"},
    {t:"table",head:{fr:["Type","Principe","Techniques"],en:["Type","Principle","Techniques"]},rows:[
      [{fr:"Passif",en:"Passive"},{fr:"Sans interaction directe — **la cible ne peut pas détecter**",en:"No direct interaction — **the target cannot detect**"},{fr:"OSINT, bases publiques, services payants",en:"OSINT, public databases, paid services"}],
      [{fr:"Actif",en:"Active"},{fr:"Avec interaction directe — **peut laisser des traces**",en:"Direct interaction — **may leave traces**"},{fr:"Interrogation DNS, scan, énumération, social engineering",en:"DNS interrogation, scanning, enumeration, social engineering"}]]},
    {t:"h",fr:"Informations collectées",en:"Information collected"},
    {t:"ul",items:[
      {fr:"**Organisation** — employés, contacts, filiales, partenaires, technos web, communiqués, brevets",en:"**Organization** — employees, contacts, branches, partners, web tech, press releases, patents"},
      {fr:"**Réseau** — domaines/sous-domaines, blocs IP, topologie, routeurs/pare-feu, enregistrements Whois et DNS",en:"**Network** — domains/subdomains, IP blocks, topology, routers/firewalls, Whois and DNS records"},
      {fr:"**Système** — OS des serveurs web, localisation, e-mails publics, identifiants",en:"**System** — web server OS, location, public emails, credentials"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Passif = aucun trafic vers la cible. Actif = contact direct**, peut déclencher des alertes. Le footprinting est de la reconnaissance ; il précède le scanning (Nmap).",en:"**Passive = no traffic to the target. Active = direct contact**, may trigger alerts. Footprinting is reconnaissance; it precedes scanning (Nmap)."},
    {t:"recap",items:[
      {k:"Rôle",fr:"1re phase, blueprint de la surface d'attaque",en:"1st phase, attack-surface blueprint"},
      {k:"Passif",fr:"OSINT, aucune trace",en:"OSINT, no trace"},
      {k:"Actif",fr:"DNS, scan, social engineering — traçable",en:"DNS, scan, social engineering — traceable"}]}
   ]},

  {id:"search", t:{fr:"Moteurs de recherche & Google dorking",en:"Search engines & Google dorking"},
   s:{fr:"Opérateurs Google, GHDB, Shodan",en:"Google operators, GHDB, Shodan"},
   blocks:[
    {t:"p",fr:"Le **Google hacking (dorking)** utilise des opérateurs avancés pour extraire des informations sensibles ou cachées. Syntaxe : `opérateur:terme` (sans espace).",en:"**Google hacking (dorking)** uses advanced operators to extract sensitive or hidden information. Syntax: `operator:term` (no space)."},
    {t:"table",head:{fr:["Opérateur","Effet"],en:["Operator","Effect"]},rows:[
      [{fr:"`site:`",en:"`site:`"},{fr:"Limiter à un domaine",en:"Restrict to a domain"}],
      [{fr:"`inurl:` / `allinurl:`",en:"`inurl:` / `allinurl:`"},{fr:"Mot-clé dans l'URL",en:"Keyword in the URL"}],
      [{fr:"`intitle:` / `allintitle:`",en:"`intitle:` / `allintitle:`"},{fr:"Mot-clé dans le titre",en:"Keyword in the title"}],
      [{fr:"`intext:`",en:"`intext:`"},{fr:"Mot-clé dans le corps",en:"Keyword in the body"}],
      [{fr:"`filetype:`",en:"`filetype:`"},{fr:"Par extension de fichier",en:"By file extension"}],
      [{fr:"`cache:`",en:"`cache:`"},{fr:"Version en cache Google",en:"Google cached version"}],
      [{fr:"`link:` / `related:`",en:"`link:` / `related:`"},{fr:"Pages liées / sites similaires",en:"Linking pages / similar sites"}]]},
    {t:"cmd",lbl:"Google dorks utiles",lines:[
      ["site:cible.com -inurl:www","{fr:trouve les sous-domaines|en:find subdomains}"],
      ["intitle:\"index of\" inurl:ftp","{fr:serveurs FTP à répertoire ouvert|en:FTP servers with open dir}"],
      ["filetype:cfg OR filetype:conf intext:password","{fr:fichiers de conf exposés|en:exposed config files}"],
      ["inurl:admin intitle:login","{fr:pages d'admin/login|en:admin/login pages}"]]},
    {t:"h",fr:"GHDB & SearchSploit",en:"GHDB & SearchSploit"},
    {t:"p",fr:"La **Google Hacking Database (GHDB)** (sur Exploit-DB) est une collection de dorks prêts à l'emploi : fichiers sensibles, répertoires ouverts, messages d'erreur, portails de login. **SearchSploit** interroge Exploit-DB **hors-ligne** (utile en réseau isolé).",en:"The **Google Hacking Database (GHDB)** (on Exploit-DB) is a collection of ready-made dorks: sensitive files, open directories, error messages, login portals. **SearchSploit** queries Exploit-DB **offline** (useful on air-gapped networks)."},
    {t:"h",fr:"Shodan & Censys",en:"Shodan & Censys"},
    {t:"p",fr:"**Shodan** scanne tout Internet pour référencer les appareils connectés (serveurs, IoT, webcams, SCADA/ICS) : ports ouverts, bannières, versions, localisation, appareils sans authentification. **Censys** est équivalent.",en:"**Shodan** scans the whole Internet to index connected devices (servers, IoT, webcams, SCADA/ICS): open ports, banners, versions, location, devices with no auth. **Censys** is equivalent."},
    {t:"recap",items:[
      {k:"Dorking",fr:"opérateur:terme (site, inurl, intitle, filetype…)",en:"operator:term (site, inurl, intitle, filetype…)"},
      {k:"GHDB",fr:"dorks prêts à l'emploi (Exploit-DB) ; SearchSploit hors-ligne",en:"ready-made dorks (Exploit-DB); SearchSploit offline"},
      {k:"Shodan/Censys",fr:"moteur d'appareils connectés",en:"connected-device search engine"}]}
   ]},

   s:{fr:"Sous-domaines, personnes, archive.org, dark web",en:"Subdomains, people, archive.org, dark web"},
   blocks:[
    {t:"h",fr:"Sous-domaines & TLD",en:"Subdomains & TLDs"},
    {t:"cmd",lbl:"Énumération de sous-domaines",lines:[
      ["sublist3r -d cible.com -o subs.txt","{fr:énumération OSINT|en:OSINT enumeration}"],
      ["subfinder -d cible.com","{fr:énumération passive rapide|en:fast passive enumeration}"]]},
    {t:"p",fr:"Aussi : **Netcraft** (sous-domaines, OS, hébergeur) et **DNSdumpster** (hôtes liés à un domaine).",en:"Also: **Netcraft** (subdomains, OS, host) and **DNSdumpster** (hosts related to a domain)."},
    {t:"h",fr:"Personnes, emploi, finance",en:"People, jobs, finance"},
    {t:"ul",items:[
      {fr:"**People search** : Spokeo, pipl, BeenVerified, Whitepages → nom, âge, adresse, tél, profils",en:"**People search**: Spokeo, pipl, BeenVerified, Whitepages → name, age, address, phone, profiles"},
      {fr:"**Sites d'emploi** (LinkedIn, Glassdoor, Indeed) → stack technique, outils internes, org, recrutements → posture de sécurité",en:"**Job sites** (LinkedIn, Glassdoor, Indeed) → tech stack, internal tools, org, hiring → security posture"},

    {t:"h",fr:"Archive.org (Wayback Machine)",en:"Archive.org (Wayback Machine)"},
    {t:"p",fr:"Instantanés historiques des sites : pages supprimées, anciens annuaires d'employés, anciens portails de login, documents archivés. Pour retirer des pages → demander la suppression directement à archive.org.",en:"Historical website snapshots: deleted pages, old employee directories, old login portals, archived documents. To remove pages → request deletion directly from archive.org."},
    {t:"h",fr:"Dark web & alertes",en:"Dark web & alerts"},
    {t:"p",fr:"Via **Tor**, on cherche bases de credentials fuités, documents sensibles, PII d'employés. La surveillance passive se met en place avec **Google Alerts, X Alerts, Giga Alerts**.",en:"Via **Tor**, one searches leaked credential dumps, sensitive documents, employee PII. Passive monitoring is set up with **Google Alerts, X Alerts, Giga Alerts**."},
    {t:"recap",items:[

  {id:"social", t:{fr:"Réseaux sociaux & dépôts de code",en:"Social networks & code repos"},
   s:{fr:"Ce qu'on récolte, theHarvester, Recon-ng",en:"What is harvested, theHarvester, Recon-ng"},
   blocks:[
    {t:"p",fr:"Les réseaux sociaux livrent, côté **individus** : contacts, localisation, liste d'amis, centres d'intérêt, événements ; côté **organisations** : stratégie, profil produit, technologies (via recrutement), matière à social engineering.",en:"Social networks reveal, for **individuals**: contacts, location, friends list, interests, events; for **organizations**: strategy, product profile, technologies (via recruitment), social-engineering material."},
    {t:"cmd",lbl:"theHarvester / Sherlock",lines:[

      ["sherlock PseudoCible","{fr:comptes associés sur 100+ plateformes|en:associated accounts across 100+ platforms}"]]},

  {id:"concepts", t:{fr:"Concepts & flags TCP",en:"Concepts & TCP flags"},
   s:{fr:"3 types de scan, handshake, 6 flags",en:"3 scan types, handshake, 6 flags"},
   blocks:[
    {t:"p",fr:"Le **scan réseau** identifie **hôtes, ports et services**. C'est de la reconnaissance **active** : on envoie des sondes TCP/IP et on analyse les réponses pour profiler la cible. Outils : **Nmap** (GUI : Zenmap), **hping3**, **NetScanTools Pro**.",en:"**Network scanning** identifies **hosts, ports and services**. It's **active** recon: you send TCP/IP probes and analyze responses to profile the target. Tools: **Nmap** (GUI: Zenmap), **hping3**, **NetScanTools Pro**."},
    {t:"table",head:{fr:["Type","But"],en:["Type","Goal"]},rows:[
      [{fr:"Port scanning",en:"Port scanning"},{fr:"Lister ports ouverts et services",en:"List open ports and services"}],
      [{fr:"Network scanning",en:"Network scanning"},{fr:"Lister les hôtes/IP actifs",en:"List active hosts/IPs"}],
      [{fr:"Vulnerability scanning",en:"Vulnerability scanning"},{fr:"Identifier les faiblesses connues",en:"Identify known weaknesses"}]]},
    {t:"h",fr:"Les 6 flags TCP",en:"The 6 TCP flags"},
    {t:"table",head:{fr:["Flag","Rôle"],en:["Flag","Role"]},rows:[
      [{fr:"**SYN**",en:"**SYN**"},{fr:"Initie une connexion (handshake)",en:"Initiates a connection (handshake)"}],
      [{fr:"**ACK**",en:"**ACK**"},{fr:"Confirme la réception",en:"Acknowledges receipt"}],
      [{fr:"**PSH**",en:"**PSH**"},{fr:"Envoie immédiatement les données bufferisées",en:"Sends buffered data immediately"}],
      [{fr:"**URG**",en:"**URG**"},{fr:"Traiter en priorité (données urgentes)",en:"Process urgently (priority data)"}],
      [{fr:"**FIN**",en:"**FIN**"},{fr:"Fin de transmission",en:"No more transmission"}],
      [{fr:"**RST**",en:"**RST**"},{fr:"Réinitialise/annule la connexion",en:"Resets/aborts the connection"}]]},
    {t:"h",fr:"Handshake & terminaison",en:"Handshake & termination"},
    {t:"p",fr:"**3-way handshake** (ouverture) : SYN → SYN+ACK → ACK. **4-way termination** (fermeture) : FIN → ACK → FIN → ACK.",en:"**3-way handshake** (open): SYN → SYN+ACK → ACK. **4-way termination** (close): FIN → ACK → FIN → ACK."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Le scan de ports repose surtout sur **SYN, ACK et RST**. Un port fermé répond typiquement par **RST**.",en:"Port scanning relies mostly on **SYN, ACK and RST**. A closed port typically replies with **RST**."},
    {t:"recap",items:[

  {id:"hostdisc", t:{fr:"Découverte d'hôtes",en:"Host discovery"},
   s:{fr:"ARP/ICMP/TCP/UDP ping, ping sweep",en:"ARP/ICMP/TCP/UDP ping, ping sweep"},
   blocks:[
    {t:"p",fr:"La découverte d'hôtes identifie les systèmes **vivants** avant de scanner les ports. Sur un LAN, l'**ARP ping (`-PR`)** est le plus fiable : il opère en couche 2 et marche **même si l'ICMP est bloqué** — c'est le défaut de Nmap en local.",en:"Host discovery identifies **live** systems before port scanning. On a LAN, **ARP ping (`-PR`)** is the most reliable: it works at layer 2 and functions **even if ICMP is blocked** — it's Nmap's default on local networks."},
    {t:"cmd",lbl:"nmap -sn (host discovery)",lines:[
      ["nmap -sn -PR 10.10.1.11","{fr:ARP ping (meilleur sur LAN)|en:ARP ping (best on LAN)}"],
      ["nmap -sn -PE 10.10.1.0/24","{fr:ICMP ECHO ping sweep|en:ICMP ECHO ping sweep}"],
      ["nmap -sn -PS 10.10.1.11","{fr:TCP SYN ping (port 80) — sans trace|en:TCP SYN ping (port 80) — no logs}"],
      ["nmap -sn -PA 10.10.1.11","{fr:TCP ACK ping — contourne pare-feu stateless|en:TCP ACK ping — bypasses stateless FW}"],
      ["nmap -sn -PU 10.10.1.11","{fr:UDP ping (port 40125)|en:UDP ping (port 40125)}"],
      ["nmap -sn -PP 10.10.1.11","{fr:ICMP timestamp (si ECHO bloqué)|en:ICMP timestamp (if ECHO blocked)}"]]},
    {t:"p",fr:"Le **ping sweep** (ICMP sweep) balaie une plage pour trouver les IP vivantes. Outils GUI : **Angry IP Scanner**, Advanced IP Scanner, NetScanTools Pro.",en:"The **ping sweep** (ICMP sweep) scans a range to find live IPs. GUI tools: **Angry IP Scanner**, Advanced IP Scanner, NetScanTools Pro."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**ARP ping (`-PR`)** = le plus fiable sur un réseau local, insensible au blocage ICMP. Port UDP de ping par défaut = **40125**.",en:"**ARP ping (`-PR`)** = most reliable on a local network, immune to ICMP blocking. Default UDP ping port = **40125**."},
    {t:"recap",items:[
      {k:"LAN",fr:"ARP ping -PR (couche 2, ignore l'ICMP bloqué)",en:"ARP ping -PR (layer 2, ignores blocked ICMP)"},
      {k:"Sweep",fr:"-PE sur une plage /24",en:"-PE over a /24 range"},
      {k:"SYN ping",fr:"-PS : discret, pas de log",en:"-PS: stealthy, no log"}]}
   ]},

  {id:"portscan", t:{fr:"Scan de ports",en:"Port scanning"},
   s:{fr:"Connect, SYN, Xmas/FIN/NULL, IDLE, UDP, SCTP",en:"Connect, SYN, Xmas/FIN/NULL, IDLE, UDP, SCTP"},
   blocks:[
    {t:"h",fr:"Catégories de ports",en:"Port categories"},
    {t:"ul",items:[
      {fr:"**Well-known** : 0–1023 (assignés par l'IANA)",en:"**Well-known**: 0–1023 (IANA-assigned)"},
      {fr:"**Registered** : 1024–49151",en:"**Registered**: 1024–49151"},
      {fr:"**Dynamic/Private** : 49152–65535 (ports client temporaires)",en:"**Dynamic/Private**: 49152–65535 (temporary client ports)"}]},
    {t:"h",fr:"Tous les types de scan",en:"All scan types"},
    {t:"table",head:{fr:["Scan","Flag","Envoie","Ouvert","Fermé","Windows ?"],en:["Scan","Flag","Sends","Open","Closed","Windows?"]},rows:[
      [{fr:"TCP Connect",en:"TCP Connect"},{fr:"`-sT`",en:"`-sT`"},{fr:"SYN",en:"SYN"},{fr:"handshake complet",en:"full handshake"},{fr:"RST",en:"RST"},{fr:"Oui (loggé)",en:"Yes (logged)"}],
      [{fr:"SYN / Half-open",en:"SYN / Half-open"},{fr:"`-sS`",en:"`-sS`"},{fr:"SYN",en:"SYN"},{fr:"SYN+ACK → RST",en:"SYN+ACK → RST"},{fr:"RST",en:"RST"},{fr:"Oui (discret)",en:"Yes (stealthy)"}],
      [{fr:"Xmas",en:"Xmas"},{fr:"`-sX`",en:"`-sX`"},{fr:"FIN+URG+PSH",en:"FIN+URG+PSH"},{fr:"aucune réponse",en:"no response"},{fr:"RST",en:"RST"},{fr:"Non",en:"No"}],
      [{fr:"FIN",en:"FIN"},{fr:"`-sF`",en:"`-sF`"},{fr:"FIN",en:"FIN"},{fr:"aucune réponse",en:"no response"},{fr:"RST",en:"RST"},{fr:"Non",en:"No"}],
      [{fr:"NULL",en:"NULL"},{fr:"`-sN`",en:"`-sN`"},{fr:"aucun flag",en:"no flags"},{fr:"aucune réponse",en:"no response"},{fr:"RST",en:"RST"},{fr:"Non",en:"No"}],
      [{fr:"Maimon",en:"Maimon"},{fr:"`-sM`",en:"`-sM`"},{fr:"FIN+ACK",en:"FIN+ACK"},{fr:"états ignorés",en:"ignored states"},{fr:"RST",en:"RST"},{fr:"Non",en:"No"}],
      [{fr:"ACK Probe",en:"ACK Probe"},{fr:"`-sA`",en:"`-sA`"},{fr:"ACK",en:"ACK"},{fr:"filtré/non filtré (TTL/Window)",en:"filtered/unfiltered (TTL/Window)"},{fr:"RST",en:"RST"},{fr:"Non",en:"No"}],
      [{fr:"IDLE / IPID",en:"IDLE / IPID"},{fr:"`-sI`",en:"`-sI`"},{fr:"SYN usurpé",en:"spoofed SYN"},{fr:"IPID +2 sur le zombie",en:"IPID +2 on zombie"},{fr:"IPID +1",en:"IPID +1"},{fr:"Oui",en:"Yes"}],
      [{fr:"UDP",en:"UDP"},{fr:"`-sU`",en:"`-sU`"},{fr:"UDP",en:"UDP"},{fr:"aucune réponse",en:"no response"},{fr:"ICMP port unreachable",en:"ICMP port unreachable"},{fr:"Oui",en:"Yes"}],
      [{fr:"SCTP INIT",en:"SCTP INIT"},{fr:"`-sY`",en:"`-sY`"},{fr:"INIT",en:"INIT"},{fr:"INIT+ACK",en:"INIT+ACK"},{fr:"ABORT",en:"ABORT"},{fr:"—",en:"—"}],
      [{fr:"SCTP COOKIE",en:"SCTP COOKIE"},{fr:"`-sZ`",en:"`-sZ`"},{fr:"COOKIE ECHO",en:"COOKIE ECHO"},{fr:"silence (drop)",en:"silence (drop)"},{fr:"ABORT",en:"ABORT"},{fr:"—",en:"—"}]]},
    {t:"warn",k:{fr:"Règle RFC 793",en:"RFC 793 rule"},fr:"**Xmas, FIN, NULL, Maimon** ne fonctionnent que sur les piles TCP/IP **conformes à la RFC 793** (BSD/UNIX). Ils **ne marchent sur aucune version de Windows** (qui répond RST sur ports ouverts et fermés) et nécessitent les privilèges root.",en:"**Xmas, FIN, NULL, Maimon** only work on TCP/IP stacks **compliant with RFC 793** (BSD/UNIX). They **don't work on any version of Windows** (which replies RST for both open and closed ports) and require root privileges."},
    {t:"note",k:{fr:"À retenir sur les scans clés",en:"Key scans to remember"},fr:"**`-sS` (SYN/half-open)** = le plus populaire et discret (pas de handshake complet, peu loggé). **`-sT` (Connect)** = le plus fiable mais loggé. **`-sA` (ACK)** = détermine *filtré/non filtré*, pas ouvert/fermé. **`-sI` (IDLE)** = le plus furtif, cache totalement l'IP via un zombie.",en:"**`-sS` (SYN/half-open)** = most popular and stealthy (no full handshake, rarely logged). **`-sT` (Connect)** = most reliable but logged. **`-sA` (ACK)** = determines *filtered/unfiltered*, not open/closed. **`-sI` (IDLE)** = stealthiest, fully hides the IP via a zombie."},
    {t:"recap",items:[
      {k:"Le plus populaire",fr:"SYN / half-open (-sS)",en:"SYN / half-open (-sS)"},
      {k:"Le plus fiable",fr:"Connect (-sT), mais loggé",en:"Connect (-sT), but logged"},
      {k:"ACK",fr:"filtré vs non filtré (pas ouvert/fermé)",en:"filtered vs unfiltered (not open/closed)"},
      {k:"IDLE",fr:"anonyme via zombie ; IPID +2 = ouvert",en:"anonymous via zombie; IPID +2 = open"},
      {k:"RFC 793",fr:"Xmas/FIN/NULL/Maimon inopérants sur Windows",en:"Xmas/FIN/NULL/Maimon fail on Windows"}]}
   ]},

      ["nmap -sV 10.10.1.11","{fr:nom + version des services|en:service name + version}"],

  {id:"os", t:{fr:"OS discovery & banner grabbing",en:"OS discovery & banner grabbing"},
   s:{fr:"TTL/Window, actif vs passif, nmap -O",en:"TTL/Window, active vs passive, nmap -O"},
   blocks:[
    {t:"p",fr:"Le **banner grabbing (OS fingerprinting)** détermine l'OS distant en analysant les réponses. **Actif** : paquets forgés comparés à une base de signatures (détectable). **Passif** : capture et analyse du trafic existant (discret) — via messages d'erreur, TTL/Window, extension des pages.",en:"**Banner grabbing (OS fingerprinting)** determines the remote OS by analyzing responses. **Active**: crafted packets compared to a signature database (detectable). **Passive**: capture and analyze existing traffic (stealthy) — via error messages, TTL/Window, page extensions."},
    {t:"h",fr:"Identifier l'OS par TTL & Window",en:"Identify the OS by TTL & Window"},
    {t:"table",head:{fr:["OS","TTL","TCP Window"],en:["OS","TTL","TCP Window"]},rows:[
      [{fr:"Linux",en:"Linux"},{fr:"**64**",en:"**64**"},{fr:"5840",en:"5840"}],
      [{fr:"FreeBSD",en:"FreeBSD"},{fr:"**64**",en:"**64**"},{fr:"65535",en:"65535"}],
      [{fr:"Windows",en:"Windows"},{fr:"**128**",en:"**128**"},{fr:"65535 / 8192",en:"65535 / 8192"}],
      [{fr:"Cisco / Solaris / OpenBSD / AIX",en:"Cisco / Solaris / OpenBSD / AIX"},{fr:"**255**",en:"**255**"},{fr:"variable",en:"varies"}]]},
    {t:"p",fr:"Passif : l'**extension des pages** trahit aussi la stack — `.aspx` → IIS/Windows, `.php` → Apache/Linux, `.jsp` → Java. Les 4 critères de fingerprint passif : **TTL, Window Size, bit DF, ToS**.",en:"Passive: the **page extension** also betrays the stack — `.aspx` → IIS/Windows, `.php` → Apache/Linux, `.jsp` → Java. The 4 passive fingerprint criteria: **TTL, Window Size, DF bit, ToS**."},
    {t:"cmd",lbl:"OS detection",lines:[
      ["nmap -O 10.10.1.11","{fr:détection d'OS|en:OS detection}"],
      ["nmap -O --osscan-guess 10.10.1.11","{fr:devine agressivement|en:aggressive guess}"],
      ["nmap --script smb-os-discovery.nse 10.10.1.22","{fr:OS via SMB (nom, domaine, FQDN)|en:OS via SMB (name, domain, FQDN)}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**TTL 128 → Windows. TTL 64 → Linux/FreeBSD. TTL 255 → Cisco/Solaris/OpenBSD.** C'est le réflexe de fingerprint passif.",en:"**TTL 128 → Windows. TTL 64 → Linux/FreeBSD. TTL 255 → Cisco/Solaris/OpenBSD.** The passive-fingerprint reflex."},
    {t:"recap",items:[
      {k:"Actif/Passif",fr:"paquets forgés / capture discrète",en:"crafted packets / stealthy capture"},
      {k:"TTL",fr:"128 Win · 64 Linux · 255 Cisco",en:"128 Win · 64 Linux · 255 Cisco"},
      {k:"Nmap",fr:"-O ; smb-os-discovery.nse",en:"-O; smb-os-discovery.nse"}]}
   ]},

  {id:"evasion", t:{fr:"Évasion IDS & pare-feu",en:"IDS & firewall evasion"},
   s:{fr:"Fragmentation, decoy, spoofing, source port",en:"Fragmentation, decoy, spoofing, source port"},
   blocks:[
    {t:"table",head:{fr:["Technique","Commande / principe"],en:["Technique","Command / principle"]},rows:[
      [{fr:"Fragmentation",en:"Fragmentation"},{fr:"`-f` (8 o), `-ff` (16 o), `--mtu 24` : casse les signatures IDS",en:"`-f` (8 B), `-ff` (16 B), `--mtu 24`: breaks IDS signatures"}],
      [{fr:"Manipulation du port source",en:"Source port manipulation"},{fr:"`--source-port 53` / `-g 80` : passe pour du trafic de confiance",en:"`--source-port 53` / `-g 80`: poses as trusted traffic"}],
      [{fr:"Leurres (decoy)",en:"Decoy"},{fr:"`-D RND:10` : noie l'IP réelle parmi de fausses",en:"`-D RND:10`: hides the real IP among fakes"}],
      [{fr:"Usurpation d'IP",en:"IP spoofing"},{fr:"`-S <ip>` : pas de réponse reçue ; détectable via l'IPID",en:"`-S <ip>`: no reply received; detectable via IPID"}],
      [{fr:"Usurpation de MAC",en:"MAC spoofing"},{fr:"`--spoof-mac 0` : contourne le filtrage MAC",en:"`--spoof-mac 0`: bypasses MAC filtering"}],
      [{fr:"Ordre aléatoire",en:"Randomize order"},{fr:"`--randomize-hosts` : évite un motif détectable",en:"`--randomize-hosts`: avoids a detectable pattern"}],
      [{fr:"Mauvais checksum",en:"Bad checksum"},{fr:"`--badsum` : certains IDS/pare-feu l'ignorent",en:"`--badsum`: some IDS/FW ignore it"}]]},
    {t:"p",fr:"Autres approches : **source routing** (imposer le chemin), **proxy/proxychains**, **anonymiseurs** et **Tor** (serveur intermédiaire qui accède à la cible à votre place, retire l'IP identifiante). Le **IDLE scan** (`-sI`) reste la meilleure façon de cacher totalement l'identité.",en:"Other approaches: **source routing** (force the path), **proxy/proxychains**, **anonymizers** and **Tor** (an intermediary server reaching the target on your behalf, stripping the identifying IP). The **IDLE scan** (`-sI`) remains the best way to fully hide the identity."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Contourner un pare-feu via un port de confiance = **manipulation du port source** (`--source-port 53`). Cacher totalement l'attaquant = **IDLE scan** (zombie). L'IP spoofing se **détecte via l'IPID**.",en:"Bypass a firewall via a trusted port = **source port manipulation** (`--source-port 53`). Fully hide the attacker = **IDLE scan** (zombie). IP spoofing is **detected via IPID**."},
    {t:"recap",items:[
      {k:"Fragmenter",fr:"-f / --mtu",en:"-f / --mtu"},
      {k:"Port de confiance",fr:"--source-port 53 / -g 80",en:"--source-port 53 / -g 80"},
      {k:"Cacher l'IP",fr:"decoy -D / IDLE -sI (le plus furtif)",en:"decoy -D / IDLE -sI (stealthiest)"}]}
   ]},

  {id:"defense", t:{fr:"Contre-mesures",en:"Countermeasures"},
   s:{fr:"Anti-scan, anti-spoofing, segmentation",en:"Anti-scan, anti-spoofing, segmentation"},
   blocks:[
    {t:"h",fr:"Contre le ping sweep",en:"Against ping sweep"},
    {t:"ul",items:[
      {fr:"Bloquer l'ICMP echo entrant des sources non fiables au pare-feu",en:"Block inbound ICMP echo from untrusted sources at the firewall"},
      {fr:"IDS/IPS (Snort) pour détecter les sweeps ; rate-limiting ICMP",en:"IDS/IPS (Snort) to detect sweeps; ICMP rate-limiting"},
      {fr:"Couper la connexion au-delà de **10 ICMP ECHO**",en:"Cut the connection beyond **10 ICMP ECHO**"},
      {fr:"Segmentation réseau, IP privées + NAT",en:"Network segmentation, private IPs + NAT"}]},
    {t:"h",fr:"Contre le port scan",en:"Against port scan"},
    {t:"ul",items:[
      {fr:"Garder le **minimum de ports ouverts** ; versions de services non vulnérables",en:"Keep the **minimum of open ports**; non-vulnerable service versions"},
      {fr:"Règles **anti-scan et anti-spoofing** sur les pare-feu, bloquer le source-routing",en:"**Anti-scan and anti-spoofing** rules on firewalls, block source-routing"},
      {fr:"**Port knocking** pour masquer les ports ; **honeypots** pour piéger les scans",en:"**Port knocking** to hide ports; **honeypots** to trap scans"},
      {fr:"IPS pour blacklister les IP scanneuses ; TCP wrappers ; VLAN",en:"IPS to blacklist scanning IPs; TCP wrappers; VLANs"}]},
    {t:"h",fr:"Contre l'IP spoofing",en:"Against IP spoofing"},
    {t:"ul",items:[
      {fr:"Chiffrer le trafic (IPsec, TLS, SSH) ; ne pas s'appuyer sur l'authentification par IP",en:"Encrypt traffic (IPsec, TLS, SSH); don't rely on IP-based auth"},
      {fr:"**Ingress filtering** (paquets prétendant venir de l'interne) + **egress filtering**",en:"**Ingress filtering** (packets claiming to be internal) + **egress filtering**"},
      {fr:"Numéro de séquence initial aléatoire ; surveiller les **IPID**",en:"Random initial sequence number; monitor **IPIDs**"}]},
    {t:"recap",items:[
      {k:"Ping sweep",fr:"bloquer ICMP, rate-limit, segmentation",en:"block ICMP, rate-limit, segmentation"},
      {k:"Port scan",fr:"peu de ports, anti-scan FW, port knocking, honeypot",en:"few ports, anti-scan FW, port knocking, honeypot"},
      {k:"Spoofing",fr:"chiffrement, ingress/egress filtering, IPID",en:"encryption, ingress/egress filtering, IPID"}]}
   ]}
 ],
