  {q:{fr:"Quel scan complète entièrement le 3-way handshake ?",en:"Which scan fully completes the 3-way handshake?"},opts:[{fr:"TCP Connect (-sT)",en:"TCP Connect (-sT)"},{fr:"SYN (-sS)",en:"SYN (-sS)"},{fr:"NULL (-sN)",en:"NULL (-sN)"},{fr:"IDLE (-sI)",en:"IDLE (-sI)"}],a:0,ex:{fr:"Le Connect scan ouvre puis ferme la connexion (SYN→SYN+ACK→ACK→RST) : fiable mais loggé. Le SYN reste half-open.",en:"The Connect scan opens then closes the connection (SYN→SYN+ACK→ACK→RST): reliable but logged. The SYN stays half-open."}},
  {q:{fr:"Quel est le scan de ports le plus populaire et discret ?",en:"What is the most popular and stealthy port scan?"},opts:[{fr:"SYN / half-open (-sS)",en:"SYN / half-open (-sS)"},{fr:"Connect (-sT)",en:"Connect (-sT)"},{fr:"UDP (-sU)",en:"UDP (-sU)"},{fr:"ACK (-sA)",en:"ACK (-sA)"}],a:0,ex:{fr:"Le SYN scan n'achève pas le handshake (envoie RST après SYN+ACK) → peu loggé, il contourne beaucoup de mécanismes.",en:"The SYN scan doesn't finish the handshake (sends RST after SYN+ACK) → rarely logged, bypasses many mechanisms."}},
  {q:{fr:"Quels scans ne fonctionnent PAS sur Windows ?",en:"Which scans do NOT work on Windows?"},opts:[{fr:"Xmas, FIN, NULL, Maimon",en:"Xmas, FIN, NULL, Maimon"},{fr:"SYN et Connect",en:"SYN and Connect"},{fr:"UDP et ACK",en:"UDP and ACK"},{fr:"IDLE et SCTP",en:"IDLE and SCTP"}],a:0,ex:{fr:"Ces scans exploitent le comportement RFC 793 (BSD/UNIX). Windows répond RST sur ports ouverts ET fermés, ce qui les rend inopérants.",en:"These exploit RFC 793 behavior (BSD/UNIX). Windows replies RST on both open AND closed ports, making them ineffective."}},
  {q:{fr:"Quel scan est totalement anonyme grâce à un hôte zombie ?",en:"Which scan is fully anonymous using a zombie host?"},opts:[{fr:"IDLE / IPID (-sI)",en:"IDLE / IPID (-sI)"},{fr:"SYN (-sS)",en:"SYN (-sS)"},{fr:"Xmas (-sX)",en:"Xmas (-sX)"},{fr:"Connect (-sT)",en:"Connect (-sT)"}],a:0,ex:{fr:"L'IDLE scan n'envoie jamais de paquet depuis l'IP de l'attaquant : IPID +2 sur le zombie = port ouvert, +1 = fermé.",en:"The IDLE scan never sends a packet from the attacker's IP: IPID +2 on the zombie = open, +1 = closed."}},
  {q:{fr:"Que détermine un ACK scan (-sA) ?",en:"What does an ACK scan (-sA) determine?"},opts:[{fr:"si les ports sont filtrés ou non filtrés",en:"whether ports are filtered or unfiltered"},{fr:"si les ports sont ouverts ou fermés",en:"whether ports are open or closed"},{fr:"la version des services",en:"the service version"},{fr:"le système d'exploitation",en:"the operating system"}],a:0,ex:{fr:"L'ACK scan analyse TTL/Window des RST pour cartographier les règles de pare-feu (filtré vs non filtré), pas l'état ouvert/fermé.",en:"The ACK scan analyzes TTL/Window of RSTs to map firewall rules (filtered vs unfiltered), not open/closed state."}},
  {q:{fr:"Une valeur TTL de 128 indique généralement…",en:"A TTL value of 128 generally indicates…"},opts:[{fr:"Windows",en:"Windows"},{fr:"Linux",en:"Linux"},{fr:"Cisco IOS",en:"Cisco IOS"},{fr:"OpenBSD",en:"OpenBSD"}],a:0,ex:{fr:"TTL 128 → Windows ; TTL 64 → Linux/FreeBSD ; TTL 255 → Cisco/Solaris/OpenBSD.",en:"TTL 128 → Windows; TTL 64 → Linux/FreeBSD; TTL 255 → Cisco/Solaris/OpenBSD."}},
  {q:{fr:"Comment un port UDP fermé se signale-t-il ?",en:"How does a closed UDP port respond?"},opts:[{fr:"ICMP port unreachable",en:"ICMP port unreachable"},{fr:"RST",en:"RST"},{fr:"SYN+ACK",en:"SYN+ACK"},{fr:"aucune réponse",en:"no response"}],a:0,ex:{fr:"Un port UDP fermé renvoie un message ICMP « port unreachable ». Ouvert = souvent aucune réponse, d'où la lenteur.",en:"A closed UDP port returns an ICMP \"port unreachable\". Open = often no response, hence the slowness."}},
  {q:{fr:"Sur un LAN, quelle découverte d'hôtes est la plus fiable même si l'ICMP est bloqué ?",en:"On a LAN, which host discovery is most reliable even if ICMP is blocked?"},opts:[{fr:"ARP ping (-PR)",en:"ARP ping (-PR)"},{fr:"ICMP echo (-PE)",en:"ICMP echo (-PE)"},{fr:"UDP ping (-PU)",en:"UDP ping (-PU)"},{fr:"IP protocol ping (-PO)",en:"IP protocol ping (-PO)"}],a:0,ex:{fr:"L'ARP ping opère en couche 2 : il ne dépend pas de l'ICMP et c'est le défaut de Nmap sur un réseau local.",en:"ARP ping works at layer 2: it doesn't rely on ICMP and is Nmap's default on a local network."}},
  {q:{fr:"Pour contourner un pare-feu qui autorise le trafic depuis le port 53, on utilise…",en:"To bypass a firewall allowing traffic from port 53, you use…"},opts:[{fr:"la manipulation du port source (--source-port 53)",en:"source port manipulation (--source-port 53)"},{fr:"la fragmentation (-f)",en:"fragmentation (-f)"},{fr:"le decoy (-D)",en:"decoy (-D)"},{fr:"le bad checksum (--badsum)",en:"bad checksum (--badsum)"}],a:0,ex:{fr:"Beaucoup de pare-feu font confiance aux ports 53/80/443 : utiliser 53 comme port source peut passer les filtres.",en:"Many firewalls trust ports 53/80/443: using 53 as source port can pass the filters."}},
  {q:{fr:"Quelle option Nmap génère 10 leurres aléatoires pour masquer l'IP réelle ?",en:"Which Nmap option generates 10 random decoys to hide the real IP?"},opts:[{fr:"-D RND:10",en:"-D RND:10"},{fr:"-S 10",en:"-S 10"},{fr:"--spoof-mac 10",en:"--spoof-mac 10"},{fr:"-T4",en:"-T4"}],a:0,ex:{fr:"`-D RND:10` noie l'IP réelle parmi 10 fausses sources. `-S` usurpe une IP unique, `--spoof-mac` change la MAC.",en:"`-D RND:10` hides the real IP among 10 fake sources. `-S` spoofs a single IP, `--spoof-mac` changes the MAC."}},
  {q:{fr:"Comment détecter des paquets à IP usurpée ?",en:"How to detect IP-spoofed packets?"},opts:[{fr:"en surveillant les numéros IPID",en:"by monitoring IPID numbers"},{fr:"en comptant les ports ouverts",en:"by counting open ports"},{fr:"via le TTL uniquement",en:"via TTL only"},{fr:"avec un ping sweep",en:"with a ping sweep"}],a:0,ex:{fr:"Un IPID de réponse très éloigné de celui de la sonde trahit un paquet usurpé ; l'ingress/egress filtering complète la défense.",en:"A response IPID far from the probe's betrays a spoofed packet; ingress/egress filtering rounds out the defense."}}
 ]
},
{
 n:4, exam:"312-50",
 t:{fr:"Énumération",en:"Enumeration"},
 sub:{fr:"Extraire comptes, partages et services",en:"Extracting accounts, shares and services"},
 cards:[

  {id:"concepts", t:{fr:"Concepts & ports à énumérer",en:"Concepts & ports to enumerate"},
   s:{fr:"Connexions actives, services et ports clés",en:"Active connections, key services and ports"},
   blocks:[
    {t:"p",fr:"L'**énumération** extrait noms d'utilisateurs, machines, ressources, partages et services en établissant des **connexions actives** et en envoyant des **requêtes dirigées**. Elle se fait **dans l'intranet** (il faut de la connectivité vers la cible) et peut être **illégale** sans autorisation.",en:"**Enumeration** extracts usernames, machine names, resources, shares and services by establishing **active connections** and sending **directed queries**. It's done **within the intranet** (requires connectivity to the target) and may be **illegal** without authorization."},
    {t:"h",fr:"Ce qu'on extrait",en:"What is extracted"},
    {t:"p",fr:"Ressources et partages réseau, tables de routage, réglages de service, détails SNMP/FQDN, noms de machines, utilisateurs et groupes, bannières d'applications. Sur Windows, un **partage IPC$** distant permet d'énumérer davantage via brute-force des identifiants admin.",en:"Network resources and shares, routing tables, service settings, SNMP/FQDN details, machine names, users and groups, application banners. On Windows, a remote **IPC$ share** allows further enumeration via brute-forcing admin credentials."},
    {t:"h",fr:"Ports & services clés",en:"Key ports & services"},
    {t:"table",head:{fr:["Port","Service"],en:["Port","Service"]},rows:[
      [{fr:"53 (TCP/UDP)",en:"53 (TCP/UDP)"},{fr:"DNS — zone transfer",en:"DNS — zone transfer"}],
      [{fr:"135 (TCP)",en:"135 (TCP)"},{fr:"MS RPC Endpoint Mapper",en:"MS RPC Endpoint Mapper"}],
      [{fr:"137/138 (UDP), 139 (TCP)",en:"137/138 (UDP), 139 (TCP)"},{fr:"NetBIOS (name / datagram / session)",en:"NetBIOS (name / datagram / session)"}],
      [{fr:"161/162 (UDP)",en:"161/162 (UDP)"},{fr:"SNMP agent / trap",en:"SNMP agent / trap"}],
      [{fr:"389 · 3268",en:"389 · 3268"},{fr:"LDAP · Global Catalog",en:"LDAP · Global Catalog"}],
      [{fr:"445 (TCP)",en:"445 (TCP)"},{fr:"SMB direct (sans NetBIOS)",en:"SMB direct (no NetBIOS)"}],
      [{fr:"2049 (TCP)",en:"2049 (TCP)"},{fr:"NFS",en:"NFS"}],
      [{fr:"25 · 587",en:"25 · 587"},{fr:"SMTP",en:"SMTP"}],
      [{fr:"500 (UDP)",en:"500 (UDP)"},{fr:"ISAKMP/IKE (IPsec)",en:"ISAKMP/IKE (IPsec)"}],
      [{fr:"123 (UDP)",en:"123 (UDP)"},{fr:"NTP",en:"NTP"}],
      [{fr:"5060/5061",en:"5060/5061"},{fr:"SIP (VoIP) — 5060 clair, 5061 TLS",en:"SIP (VoIP) — 5060 cleartext, 5061 TLS"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Une faille de conception d'AD — la fonction **« logon hours »** — renvoie des messages d'erreur différents pour un compte valide/invalide, ce qui permet l'**énumération des noms d'utilisateurs**.",en:"An AD design flaw — the **\"logon hours\"** feature — returns different error messages for valid/invalid accounts, enabling **username enumeration**."},
    {t:"recap",items:[
      {k:"Définition",fr:"connexions actives + requêtes dirigées, dans l'intranet",en:"active connections + directed queries, within the intranet"},
      {k:"Ports phares",fr:"137-139 NetBIOS · 161 SNMP · 389 LDAP · 445 SMB",en:"137-139 NetBIOS · 161 SNMP · 389 LDAP · 445 SMB"},
      {k:"Windows",fr:"partage IPC$ = point d'entrée",en:"IPC$ share = entry point"}]}
   ]},

  {id:"netbios", t:{fr:"NetBIOS",en:"NetBIOS"},
   s:{fr:"Codes, nbtstat, net view, PsTools",en:"Codes, nbtstat, net view, PsTools"},
   blocks:[
    {t:"p",fr:"Un **nom NetBIOS** est une chaîne ASCII de **16 caractères** : 15 pour le nom, le **16e** pour le type de service. Windows l'utilise pour le partage de fichiers/imprimantes via **UDP 137** (noms), **UDP 138** (datagrammes), **TCP 139** (sessions). Non supporté en IPv6.",en:"A **NetBIOS name** is a **16-character** ASCII string: 15 for the name, the **16th** for the service type. Windows uses it for file/printer sharing via **UDP 137** (names), **UDP 138** (datagrams), **TCP 139** (sessions). Not supported over IPv6."},
    {t:"h",fr:"Codes NetBIOS (à mémoriser)",en:"NetBIOS codes (memorize)"},
    {t:"table",head:{fr:["Code","Signification"],en:["Code","Meaning"]},rows:[
      [{fr:"`<00>` UNIQUE",en:"`<00>` UNIQUE"},{fr:"Nom d'hôte",en:"Hostname"}],
      [{fr:"`<00>` GROUP",en:"`<00>` GROUP"},{fr:"Nom de domaine",en:"Domain name"}],
      [{fr:"`<03>` UNIQUE",en:"`<03>` UNIQUE"},{fr:"Service Messenger",en:"Messenger service"}],
      [{fr:"`<20>` UNIQUE",en:"`<20>` UNIQUE"},{fr:"Service Serveur actif (partage)",en:"Server service running (sharing)"}],
      [{fr:"`<1D>` GROUP",en:"`<1D>` GROUP"},{fr:"Master browser du sous-réseau",en:"Master browser of the subnet"}],
      [{fr:"`<1B>` UNIQUE",en:"`<1B>` UNIQUE"},{fr:"Domain master browser — identifie le **PDC**",en:"Domain master browser — identifies the **PDC**"}]]},
    {t:"cmd",lbl:"nbtstat / net view",lines:[
      ["nbtstat -A 10.10.1.11","{fr:table de noms NetBIOS par IP|en:NetBIOS name table by IP}"],
      ["nbtscan -A 10.10.1.11","{fr:scan NetBIOS (Linux)|en:NetBIOS scan (Linux)}"],
      ["net view \\\\\\\\<pc> /ALL","{fr:tous les partages, y compris cachés|en:all shares, including hidden}"],
      ["nmap -sV --script nbstat.nse <ip>","{fr:énumération NetBIOS via Nmap|en:NetBIOS enumeration via Nmap}"]]},
    {t:"p",fr:"**PsTools** (Sysinternals) gère les systèmes à distance : **PsExec** (exécution distante), **PsGetSid** (SID↔nom), **PsLoggedOn** (utilisateurs connectés), **PsInfo**, **PsKill**.",en:"**PsTools** (Sysinternals) manage remote systems: **PsExec** (remote execution), **PsGetSid** (SID↔name), **PsLoggedOn** (logged-in users), **PsInfo**, **PsKill**."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"NetBIOS Session Service = **TCP 139**. Code **`<1B>`** = domain master browser = le **PDC**. Utilitaire de résolution NetBIOS = **nbtstat**.",en:"NetBIOS Session Service = **TCP 139**. Code **`<1B>`** = domain master browser = the **PDC**. NetBIOS resolution utility = **nbtstat**."},
    {t:"recap",items:[
      {k:"Ports",fr:"137 UDP · 138 UDP · 139 TCP",en:"137 UDP · 138 UDP · 139 TCP"},
      {k:"Codes",fr:"<20> serveur · <1B> PDC · <1D> master browser",en:"<20> server · <1B> PDC · <1D> master browser"},
      {k:"Outils",fr:"nbtstat, net view, PsTools",en:"nbtstat, net view, PsTools"}]}
   ]},

  {id:"snmp", t:{fr:"SNMP",en:"SNMP"},
   s:{fr:"Community strings, PDU, MIB/OID, snmpwalk",en:"Community strings, PDU, MIB/OID, snmpwalk"},
   blocks:[
    {t:"p",fr:"**SNMP** (application, sur **UDP**) gère routeurs, switches et hubs. L'énumération SNMP liste comptes et devices. Deux composants : l'**agent** (sur le device, écoute sur **UDP 161**) et la **station de management**.",en:"**SNMP** (application-layer, over **UDP**) manages routers, switches and hubs. SNMP enumeration lists accounts and devices. Two components: the **agent** (on the device, listens on **UDP 161**) and the **management station**."},
    {t:"h",fr:"Community strings",en:"Community strings"},
    {t:"table",head:{fr:["Type","Détail"],en:["Type","Detail"]},rows:[
      [{fr:"Read (lecture)",en:"Read"},{fr:"Voit la config — chaîne par défaut **public**",en:"Views config — default string **public**"}],
      [{fr:"Read/Write",en:"Read/Write"},{fr:"Modifie la config — chaîne par défaut **private**",en:"Changes config — default string **private**"}]]},
    {t:"p",fr:"Les chaînes par défaut laissées en place = vecteur d'attaque majeur. Les **PDU** clés : Get, GetNext, Set, GetBulk (v2+), Response, **Trap** (alerte non sollicitée, UDP 162), Inform. La **MIB** est la base virtuelle décrivant les objets, identifiés par des **OID**.",en:"Default strings left in place = major attack vector. Key **PDUs**: Get, GetNext, Set, GetBulk (v2+), Response, **Trap** (unsolicited alert, UDP 162), Inform. The **MIB** is the virtual database describing objects, identified by **OIDs**."},
    {t:"cmd",lbl:"snmpwalk / nmap",lines:[
      ["snmpwalk -v2c -c public <ip>","{fr:parcourt l'arbre SNMP (community public)|en:walk the SNMP tree (public community)}"],
      ["snmpwalk -v2c -c public <ip> hrSWInstalledName","{fr:logiciels installés|en:installed software}"],
      ["nmap -sU -p 161 --script snmp-info <ip>","{fr:infos SNMP via Nmap|en:SNMP info via Nmap}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Agent SNMP = **UDP 161**, Trap = **UDP 162**. Communities par défaut : **public** (RO) et **private** (RW). Contre-mesure clé : passer en **SNMPv3** (authentification + chiffrement).",en:"SNMP agent = **UDP 161**, Trap = **UDP 162**. Default communities: **public** (RO) and **private** (RW). Key countermeasure: move to **SNMPv3** (authentication + encryption)."},
    {t:"recap",items:[
      {k:"Ports",fr:"161 agent / 162 trap (UDP)",en:"161 agent / 162 trap (UDP)"},
      {k:"Communities",fr:"public (RO) / private (RW)",en:"public (RO) / private (RW)"},
      {k:"MIB/OID",fr:"base d'objets ; outil snmpwalk",en:"object database; tool snmpwalk"},
      {k:"Défense",fr:"SNMPv3 (AuthPriv), pas NoAuthNoPriv",en:"SNMPv3 (AuthPriv), not NoAuthNoPriv"}]}
   ]},

  {id:"ldap", t:{fr:"LDAP",en:"LDAP"},
   s:{fr:"Port 389, ldapsearch, Global Catalog",en:"Port 389, ldapsearch, Global Catalog"},
   blocks:[
    {t:"p",fr:"**LDAP** accède aux services d'annuaire distribués (structure hiérarchique, comme un organigramme). Le client ouvre une session vers un **DSA** sur **TCP 389** (Global Catalog = **3268**), en encodage **BER**. Une requête **anonyme** peut révéler noms d'utilisateurs, adresses, services, noms de serveurs.",en:"**LDAP** accesses distributed directory services (hierarchical, like an org chart). The client opens a session to a **DSA** on **TCP 389** (Global Catalog = **3268**), using **BER** encoding. An **anonymous** query can reveal usernames, addresses, departments, server names."},
    {t:"cmd",lbl:"ldapsearch",lines:[
      ["ldapsearch -h <ip> -x -s base namingcontexts","{fr:découvre les contextes de nommage|en:discover naming contexts}"],
      ["ldapsearch -h <ip> -x -b \"DC=htb,DC=local\" \"objectclass=*\"","{fr:tous les objets de l'annuaire|en:all directory objects}"],
      ["ldapsearch -h <ip> -x -b \"DC=htb,DC=local\" '(objectClass=user)' sAMAccountName","{fr:liste les comptes|en:list accounts}"]]},
    {t:"p",fr:"Outils : **ldapsearch**, Softerra LDAP Administrator, AD Explorer. Contre-mesures : **SSL/STARTTLS**, désactiver les **binds anonymes**, comptes ≠ e-mail, MFA, comptes/groupes **leurres** (canary).",en:"Tools: **ldapsearch**, Softerra LDAP Administrator, AD Explorer. Countermeasures: **SSL/STARTTLS**, disable **anonymous binds**, accounts ≠ email, MFA, **decoy** accounts/groups (canary)."},
    {t:"recap",items:[
      {k:"Ports",fr:"389 LDAP · 3268 Global Catalog",en:"389 LDAP · 3268 Global Catalog"},
      {k:"Outil",fr:"ldapsearch",en:"ldapsearch"},
      {k:"Défense",fr:"SSL/STARTTLS, pas de bind anonyme, MFA",en:"SSL/STARTTLS, no anonymous bind, MFA"}]}
   ]},

  {id:"ntpnfs", t:{fr:"NTP & NFS",en:"NTP & NFS"},
   s:{fr:"Temps (123) et partage de fichiers (2049)",en:"Time (123) and file sharing (2049)"},
   blocks:[
    {t:"h",fr:"NTP — UDP 123",en:"NTP — UDP 123"},
    {t:"p",fr:"**NTP** synchronise les horloges. L'interroger révèle : hôtes connectés au serveur, IP/OS des clients, et des **IP internes** si le serveur NTP est en DMZ.",en:"**NTP** synchronizes clocks. Querying it reveals: hosts connected to the server, clients' IP/OS, and **internal IPs** if the NTP server sits in the DMZ."},
    {t:"cmd",lbl:"Commandes NTP",lines:[
      ["ntptrace","{fr:remonte la chaîne jusqu'à la source primaire|en:trace the chain to the primary source}"],
      ["ntpq -p <ip>","{fr:liste les peers|en:list peers}"],
      ["ntpdc -c listpeers <ip>","{fr:état du démon ntpd|en:ntpd daemon state}"]]},
    {t:"h",fr:"NFS — TCP 2049",en:"NFS — TCP 2049"},
    {t:"p",fr:"**NFS** partage des fichiers distants comme s'ils étaient locaux (RPC route les requêtes). Le seul « credential » est l'**IP du client** (faible). Le fichier `/etc/exports` liste les clients autorisés.",en:"**NFS** shares remote files as if local (RPC routes requests). The only \"credential\" is the **client's IP** (weak). The `/etc/exports` file lists authorized clients."},
    {t:"cmd",lbl:"Énumération NFS",lines:[
      ["rpcinfo -p <ip>","{fr:services RPC + port NFS 2049|en:RPC services + NFS port 2049}"],
      ["showmount -e <ip>","{fr:liste les partages exportés|en:list exported shares}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"NTP = **UDP 123**, NFS = **TCP 2049**. Défense NFS : garder **`root_squash`** dans `/etc/exports` et migrer vers **NFSv4** (Kerberos).",en:"NTP = **UDP 123**, NFS = **TCP 2049**. NFS defense: keep **`root_squash`** in `/etc/exports` and move to **NFSv4** (Kerberos)."},
    {t:"recap",items:[
      {k:"NTP",fr:"UDP 123 — ntptrace, ntpq, ntpdc",en:"UDP 123 — ntptrace, ntpq, ntpdc"},
      {k:"NFS",fr:"TCP 2049 — rpcinfo, showmount -e",en:"TCP 2049 — rpcinfo, showmount -e"},
      {k:"Défense NFS",fr:"root_squash, NFSv4",en:"root_squash, NFSv4"}]}
   ]},

  {id:"smtp", t:{fr:"SMTP",en:"SMTP"},
   s:{fr:"VRFY, EXPN, RCPT TO",en:"VRFY, EXPN, RCPT TO"},
   blocks:[
    {t:"p",fr:"**SMTP** (livraison de mail, **TCP 25 / 587 / 2525**) répond **différemment** aux commandes selon que l'utilisateur est valide ou non — c'est ce qui permet d'énumérer les comptes.",en:"**SMTP** (mail delivery, **TCP 25 / 587 / 2525**) responds **differently** to commands depending on whether the user is valid — that's what enables account enumeration."},
    {t:"table",head:{fr:["Commande","Fonction"],en:["Command","Function"]},rows:[
      [{fr:"**VRFY**",en:"**VRFY**"},{fr:"Valide un utilisateur",en:"Validates a user"}],
      [{fr:"**EXPN**",en:"**EXPN**"},{fr:"Affiche les adresses réelles d'un alias/liste",en:"Shows real addresses of an alias/list"}],
      [{fr:"**RCPT TO**",en:"**RCPT TO**"},{fr:"Définit les destinataires (réponse selon validité)",en:"Defines recipients (response by validity)"}]]},
    {t:"cmd",lbl:"telnet 25",lines:[
      ["telnet <ip> 25","{fr:se connecter au serveur SMTP|en:connect to the SMTP server}"],
      ["VRFY jonathan","{fr:250 = valide, 550 = inconnu|en:250 = valid, 550 = unknown}"],
      ["smtp-user-enum -M VRFY -U users.txt -t <ip>","{fr:énumération automatisée|en:automated enumeration}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Les **3 commandes d'énumération SMTP = VRFY, EXPN, RCPT TO**. Contre-mesure : les **désactiver** (ou les restreindre aux authentifiés) et fermer l'open relay.",en:"The **3 SMTP enumeration commands = VRFY, EXPN, RCPT TO**. Countermeasure: **disable** them (or restrict to authenticated users) and close the open relay."},
    {t:"recap",items:[
      {k:"Ports",fr:"25 / 587 / 2525",en:"25 / 587 / 2525"},
      {k:"Commandes",fr:"VRFY · EXPN · RCPT TO",en:"VRFY · EXPN · RCPT TO"},
      {k:"Outil",fr:"smtp-user-enum, Nmap smtp-enum-users",en:"smtp-user-enum, Nmap smtp-enum-users"}]}
   ]},

  {id:"dns", t:{fr:"DNS enumeration",en:"DNS enumeration"},
   s:{fr:"Zone transfer, DNSSEC zone walking",en:"Zone transfer, DNSSEC zone walking"},
   blocks:[
    {t:"p",fr:"Le **zone transfer** copie la zone du serveur primaire vers le secondaire. Mal configuré, il livre noms de serveurs, hôtes, machines, utilisateurs, IP, alias.",en:"A **zone transfer** copies the zone from primary to secondary server. Misconfigured, it hands over server names, hosts, machines, users, IPs, aliases."},
    {t:"cmd",lbl:"Zone transfer",lines:[
      ["dig ns cible.com","{fr:liste les serveurs de noms|en:list name servers}"],
      ["dig @ns1.cible.com cible.com axfr","{fr:tente le transfert de zone|en:attempt the zone transfer}"],
      ["nmap -p 53 --script dns-brute cible.com","{fr:brute-force de sous-domaines|en:subdomain brute-force}"]]},
    {t:"h",fr:"DNSSEC zone walking",en:"DNSSEC zone walking"},
    {t:"p",fr:"DNSSEC signe les réponses mais ses enregistrements **NSEC/NSEC3** peuvent être « marchés » pour énumérer la zone. Outils : `ldns-walk`, `dnsrecon -d cible -z`.",en:"DNSSEC signs responses but its **NSEC/NSEC3** records can be \"walked\" to enumerate the zone. Tools: `ldns-walk`, `dnsrecon -d target -z`."},
    {t:"recap",items:[
      {k:"AXFR",fr:"dig @ns cible axfr — dump complet si ouvert",en:"dig @ns target axfr — full dump if open"},

{
 n:5, exam:"312-50",
 t:{fr:"Analyse de vulnérabilités",en:"Vulnerability Analysis"},
 sub:{fr:"Identifier, scorer et gérer les failles",en:"Identify, score and manage flaws"},
 cards:[

  {id:"concepts", t:{fr:"Concepts & classification",en:"Concepts & classification"},
   s:{fr:"Types de vulnérabilités, zero-day, legacy",en:"Vulnerability types, zero-day, legacy"},
   blocks:[
    {t:"p",fr:"L'**évaluation de vulnérabilités** identifie les failles de sécurité du réseau, de l'infrastructure de communication et des systèmes terminaux. Un réseau sûr exige : patch management, antivirus, correction des applis tierces, config matérielle non par défaut.",en:"**Vulnerability assessment** identifies security loopholes in the network, communication infrastructure and end systems. A secure network requires: patch management, antivirus, fixing third-party apps, non-default hardware config."},
    {t:"h",fr:"Types de vulnérabilités",en:"Vulnerability types"},
    {t:"table",head:{fr:["Type","Exemples"],en:["Type","Examples"]},rows:[
      [{fr:"**Misconfiguration**",en:"**Misconfiguration**"},{fr:"protocoles non sûrs, ports/services ouverts, chiffrement faible, comptes root non sécurisés",en:"insecure protocols, open ports/services, weak encryption, unsecured root accounts"}],
      [{fr:"**Application flaws**",en:"**Application flaws**"},{fr:"buffer overflow, memory leak, integer overflow, null-pointer deref, race condition, DLL injection",en:"buffer overflow, memory leak, integer overflow, null-pointer deref, race condition, DLL injection"}],
      [{fr:"**Patch management défaillant**",en:"**Poor patch management**"},{fr:"serveurs, firmware, OS, applis non patchés",en:"unpatched servers, firmware, OS, apps"}],
      [{fr:"**Design flaws**",en:"**Design flaws**"},{fr:"chiffrement incorrect, validation de données médiocre",en:"incorrect encryption, poor data validation"}],
      [{fr:"**Risques tiers**",en:"**Third-party risks**"},{fr:"supply chain, code sous-traité, stockage cloud",en:"supply chain, outsourced code, cloud storage"}]]},
    {t:"h",fr:"Catégories notables",en:"Notable categories"},
    {t:"ul",items:[
      {fr:"**Zero-day** — faille inconnue, non patchée, exploitée avant divulgation",en:"**Zero-day** — unknown, unpatched flaw exploited before disclosure"},
      {fr:"**Legacy** — code obsolète/non supporté (IoT, vieux OS, IDS)",en:"**Legacy** — obsolete/unsupported code (IoT, old OS, IDS)"},
      {fr:"**System sprawl** — actifs non documentés",en:"**System sprawl** — undocumented assets"},
      {fr:"**Mauvaise gestion des clés/certificats** ; **mots de passe faibles/par défaut**",en:"**Poor key/cert management**; **weak/default passwords**"}]},
    {t:"note",k:{fr:"Outil à retenir",en:"Tool to remember"},fr:"Détection de **memory leak** sous Unix/Linux = **Valgrind**.",en:"**Memory leak** detection on Unix/Linux = **Valgrind**."},
    {t:"recap",items:[
      {k:"5 types",fr:"misconfig · app flaws · patch · design · tiers",en:"misconfig · app flaws · patch · design · third-party"},
      {k:"Zero-day",fr:"inconnue et non patchée",en:"unknown and unpatched"},
      {k:"Memory leak",fr:"Valgrind",en:"Valgrind"}]}
   ]},

  {id:"scoring", t:{fr:"Scoring & bases (CVSS, CVE)",en:"Scoring & databases (CVSS, CVE)"},
   s:{fr:"CVSS, CVE, NVD, CWE, CPE",en:"CVSS, CVE, NVD, CWE, CPE"},
   blocks:[
    {t:"h",fr:"CVSS",en:"CVSS"},
    {t:"p",fr:"Le **CVSS** (FIRST.org) est un framework ouvert qui note la sévérité de **0 à 10** (vecteur textuel). Il sert à **prioriser la remédiation** et **calculer la sévérité**. CVSS 4.0 a **4 groupes de métriques** : **Base** (exploitabilité + impact), **Threat**, **Environmental**, **Supplemental**.",en:"**CVSS** (FIRST.org) is an open framework scoring severity from **0 to 10** (text vector). It's used to **prioritize remediation** and **calculate severity**. CVSS 4.0 has **4 metric groups**: **Base** (exploitability + impact), **Threat**, **Environmental**, **Supplemental**."},
    {t:"table",head:{fr:["Sévérité","Score de base"],en:["Severity","Base score"]},rows:[
      [{fr:"None",en:"None"},{fr:"0.0",en:"0.0"}],
      [{fr:"Low",en:"Low"},{fr:"0.1 – 3.9",en:"0.1 – 3.9"}],
      [{fr:"Medium",en:"Medium"},{fr:"4.0 – 6.9",en:"4.0 – 6.9"}],
      [{fr:"High",en:"High"},{fr:"7.0 – 8.9",en:"7.0 – 8.9"}],
      [{fr:"Critical",en:"Critical"},{fr:"9.0 – 10.0",en:"9.0 – 10.0"}]]},
    {t:"h",fr:"CVE, NVD, CWE, CPE",en:"CVE, NVD, CWE, CPE"},
    {t:"table",head:{fr:["Acronyme","Rôle"],en:["Acronym","Role"]},rows:[
      [{fr:"**CVE**",en:"**CVE**"},{fr:"**Dictionnaire** (pas une base) d'identifiants standardisés — MITRE, attribués par les **CNA**",en:"**Dictionary** (not a database) of standardized identifiers — MITRE, assigned by **CNAs**"}],
      [{fr:"**NVD**",en:"**NVD**"},{fr:"Base US (NIST) qui **analyse les CVE** et produit CVSS/CWE/CPE (SCAP)",en:"US database (NIST) that **analyzes CVEs** and produces CVSS/CWE/CPE (SCAP)"}],
      [{fr:"**CWE**",en:"**CWE**"},{fr:"Catégorisation des **types** de faiblesses logicielles (600+)",en:"Categorization of software weakness **types** (600+)"}],
      [{fr:"**CPE**",en:"**CPE**"},{fr:"Common Platform Enumeration — quels produits/versions sont concernés",en:"Common Platform Enumeration — which products/versions are affected"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**CVE = dictionnaire, pas base de données.** **Critical = 9.0–10.0**, High = 7.0–8.9. C'est la **NVD** (pas le CVE) qui produit CVSS/CWE/CPE.",en:"**CVE = dictionary, not database.** **Critical = 9.0–10.0**, High = 7.0–8.9. It's the **NVD** (not CVE) that produces CVSS/CWE/CPE."},
    {t:"recap",items:[
      {k:"CVSS",fr:"0–10, 4 groupes ; Critical 9.0–10.0",en:"0–10, 4 groups; Critical 9.0–10.0"},
      {k:"CVE",fr:"dictionnaire d'identifiants (MITRE)",en:"dictionary of identifiers (MITRE)"},
      {k:"NVD",fr:"analyse les CVE → CVSS/CWE/CPE",en:"analyzes CVEs → CVSS/CWE/CPE"},
      {k:"CWE",fr:"types de faiblesses (600+)",en:"weakness types (600+)"}]}
   ]},

  {id:"lifecycle", t:{fr:"Cycle de gestion (8 étapes)",en:"Management lifecycle (8 steps)"},
   s:{fr:"Pré-évaluation → évaluation → post",en:"Pre-assessment → assessment → post"},
   blocks:[
    {t:"h",fr:"Pré-évaluation",en:"Pre-assessment"},
    {t:"ol",items:[
      {fr:"**Identifier les actifs** (inventaire, priorisation des critiques)",en:"**Identify assets** (inventory, prioritize critical ones)"},
      {fr:"**Créer une baseline** (processus métier, archi, contrôles en place, périmètre)",en:"**Create a baseline** (business processes, architecture, existing controls, scope)"}]},
    {t:"h",fr:"Évaluation",en:"Assessment"},
    {t:"ol",items:[
      {fr:"**Vulnerability Scan** (outils automatisés)",en:"**Vulnerability Scan** (automated tools)"},
      {fr:"**Vulnerability Analysis** (pertinence, impact)",en:"**Vulnerability Analysis** (relevance, impact)"}]},
    {t:"h",fr:"Post-évaluation",en:"Post-assessment"},
    {t:"ol",items:[
      {fr:"**Risk Assessment** (catégoriser critique/haut/moyen/bas)",en:"**Risk Assessment** (categorize critical/high/medium/low)"},
      {fr:"**Remediation** (patchs, root-cause, exception handling)",en:"**Remediation** (patches, root-cause, exception handling)"},
      {fr:"**Verification** (re-scan pour confirmer le correctif)",en:"**Verification** (re-scan to confirm the fix)"},
      {fr:"**Monitoring** (surveillance continue via IDS/IPS, SIEM)",en:"**Monitoring** (continuous, via IDS/IPS, SIEM)"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Après **Remediation** vient **Verification**, puis **Monitoring** — dans cet ordre. La remédiation doit être **SMART** (spécifique, mesurable, atteignable, pertinente, temporelle).",en:"After **Remediation** comes **Verification**, then **Monitoring** — in that order. Remediation must be **SMART** (specific, measurable, attainable, relevant, time-bound)."},
    {t:"recap",items:[
      {k:"Pré",fr:"1. Actifs · 2. Baseline",en:"1. Assets · 2. Baseline"},
      {k:"Éval",fr:"3. Scan · 4. Analyse",en:"3. Scan · 4. Analysis"},
      {k:"Post",fr:"5. Risque · 6. Remédiation · 7. Vérif · 8. Monitoring",en:"5. Risk · 6. Remediation · 7. Verification · 8. Monitoring"}]}
   ]},

  {id:"scanning", t:{fr:"Le scanning de vulnérabilités",en:"Vulnerability scanning"},
   s:{fr:"Actif/passif, les 9 types, limites",en:"Active/passive, the 9 types, limits"},
   blocks:[
    {t:"table",head:{fr:["Approche","Principe"],en:["Approach","Principle"]},rows:[
      [{fr:"**Actif**",en:"**Active**"},{fr:"Interaction directe (sondes, requêtes forgées) — simule une attaque",en:"Direct interaction (probes, crafted requests) — simulates an attack"}],
      [{fr:"**Passif**",en:"**Passive**"},{fr:"Sans interaction directe — devine versions OS/app en observant le trafic",en:"No direct interaction — guesses OS/app versions by observing traffic"}]]},
    {t:"h",fr:"Les 9 types de scan",en:"The 9 scan types"},
    {t:"ul",items:[
      {fr:"**External** (vue externe) / **Internal** (vue interne)",en:"**External** (outside view) / **Internal** (inside view)"},
      {fr:"**Host-based** (config) / **Network-based** (réseau)",en:"**Host-based** (config) / **Network-based** (network)"},

    {t:"p",fr:"**Credentialed** (authentifié) = connexion avec des identifiants valides → analyse plus profonde. **Non-credentialed** = point de vue d'un attaquant externe. **External** = vue du hacker depuis dehors ; **Internal** = depuis l'intérieur.",en:"**Credentialed** (authenticated) = logs in with valid credentials → deeper analysis. **Non-credentialed** = external attacker's view. **External** = hacker's view from outside; **Internal** = from inside."},
    {t:"warn",k:{fr:"Limites",en:"Limitations"},fr:"Le scan ne détecte les failles qu'**à un instant t**, doit être mis à jour, dépend de la maintenance, et **ne mesure pas la force des contrôles** de sécurité. Attention aux **faux positifs**.",en:"Scanning only detects flaws **at a point in time**, must be updated, depends on maintenance, and **doesn't measure the strength of security controls**. Watch out for **false positives**."},
    {t:"recap",items:[
      {k:"Actif/Passif",fr:"interaction directe / observation",en:"direct interaction / observation"},
      {k:"9 types",fr:"External/Internal, Host/Network, App, Cred/Non-cred, Manual/Auto",en:"External/Internal, Host/Network, App, Cred/Non-cred, Manual/Auto"},
      {k:"Credentialed",fr:"identifiants valides = scan plus profond",en:"valid credentials = deeper scan"}]}
   ]},

  {id:"tools", t:{fr:"Approches & outils",en:"Approaches & tools"},

    {t:"table",head:{fr:["Approche","Principe"],en:["Approach","Principle"]},rows:[

      [{fr:"**Service-based**",en:"**Service-based**"},{fr:"Proposée par un tiers (interne ou externe)",en:"Offered by a third party (internal or external)"}],
      [{fr:"**Tree-based**",en:"**Tree-based**"},{fr:"Un scanner différent par type de machine (Windows vs Linux)",en:"A different scanner per machine type (Windows vs Linux)"}],
      [{fr:"**Inference-based**",en:"**Inference-based**"},{fr:"Inventaire des protocoles → détecte les services → n'exécute que les tests **pertinents**",en:"Protocol inventory → detects services → runs only **relevant** tests"}]]},
    {t:"h",fr:"Outils clés",en:"Key tools"},

    {t:"recap",items:[

   s:{fr:"Structure, contenu, faux positifs",en:"Structure, content, false positives"},
   blocks:[
    {t:"p",fr:"Le **rapport d'évaluation** détaille les faiblesses, leur impact, leur sévérité et les recommandations. Les vulnérabilités sont classées **High / Medium / Low** ; les **High** (accès non autorisé possible) sont à corriger immédiatement.",en:"The **assessment report** details weaknesses, their impact, severity and recommendations. Vulnerabilities are ranked **High / Medium / Low**; **High** (possible unauthorized access) must be fixed immediately."},
    {t:"h",fr:"Ce que le rapport doit contenir",en:"What the report must include"},
    {t:"ul",items:[

    {t:"p",fr:"Structure : Executive Summary → Assessment Overview → Findings → Risk Assessment → Recommendations. Deux types : **Security Vulnerability Report** (combiné, tous les devices) et **Security Vulnerability Summary** (par device).",en:"Structure: Executive Summary → Assessment Overview → Findings → Risk Assessment → Recommendations. Two types: **Security Vulnerability Report** (combined, all devices) and **Security Vulnerability Summary** (per device)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"3 niveaux de sévérité dans un rapport = **High, Medium, Low**. L'analyste doit se méfier des **faux positifs**.",en:"3 severity levels in a report = **High, Medium, Low**. The analyst must beware of **false positives**."},
    {t:"recap",items:[

  {q:{fr:"Le CVE est…",en:"CVE is…"},opts:[{fr:"un dictionnaire d'identifiants standardisés",en:"a dictionary of standardized identifiers"},{fr:"une base de données détaillée de vulnérabilités",en:"a detailed vulnerability database"},{fr:"un scanner de vulnérabilités",en:"a vulnerability scanner"},{fr:"un score de sévérité",en:"a severity score"}],a:0,ex:{fr:"CVE = dictionnaire (un identifiant + une description standard par faille). La base détaillée qui l'analyse, c'est la NVD.",en:"CVE = dictionary (one identifier + one standard description per flaw). The detailed database analyzing it is the NVD."}},

 cards:[

  {id:"crack", t:{fr:"Authentification & cracking de mots de passe",en:"Authentication & password cracking"},
   s:{fr:"SAM, NTLM, Kerberos, types d'attaques",en:"SAM, NTLM, Kerberos, attack types"},
   blocks:[
    {t:"h",fr:"Mécanismes d'authentification Windows",en:"Windows authentication mechanisms"},
    {t:"ul",items:[
      {fr:"**SAM** — stocke les hash (LM/NTLM) dans un fichier registre verrouillé, partiellement chiffré par **SYSKEY**. Le **hash LM** ne gère pas les mots de passe >14 caractères et est désactivé depuis Vista",en:"**SAM** — stores hashes (LM/NTLM) in a locked registry file, partially encrypted by **SYSKEY**. The **LM hash** can't handle passwords >14 chars and is disabled since Vista"},
      {fr:"**NTLM** — challenge-response en 6 étapes via le contrôleur de domaine",en:"**NTLM** — 6-step challenge-response via the domain controller"},
      {fr:"**Kerberos** — défaut actuel, plus fort. **KDC** = **AS** (Authentication Server) + **TGS** (Ticket Granting Server)",en:"**Kerberos** — current default, stronger. **KDC** = **AS** (Authentication Server) + **TGS** (Ticket Granting Server)"}]},
    {t:"p",fr:"Extraction de hash : **Mimikatz, pwdump7, Hashcat, DSInternals**.",en:"Hash extraction: **Mimikatz, pwdump7, Hashcat, DSInternals**."},
    {t:"h",fr:"Les 4 types d'attaques de mots de passe",en:"The 4 password attack types"},
    {t:"table",head:{fr:["Type","Exemples"],en:["Type","Examples"]},rows:[
      [{fr:"Non-électronique",en:"Non-electronic"},{fr:"shoulder surfing, social engineering, dumpster diving",en:"shoulder surfing, social engineering, dumpster diving"}],
      [{fr:"Active online",en:"Active online"},{fr:"dictionnaire, brute-force, **spraying**, Kerberoasting, **LLMNR/NBT-NS poisoning**",en:"dictionary, brute-force, **spraying**, Kerberoasting, **LLMNR/NBT-NS poisoning**"}],
      [{fr:"Passive online",en:"Passive online"},{fr:"wire sniffing, MITM, replay",en:"wire sniffing, MITM, replay"}],
      [{fr:"Offline",en:"Offline"},{fr:"**rainbow tables**, distributed network attack (DNA)",en:"**rainbow tables**, distributed network attack (DNA)"}]]},
    {t:"p",fr:"**Password spraying** = **un** mot de passe courant testé contre **beaucoup** de comptes (sous le seuil de verrouillage). Cibles : MSSQL 1433, SSH 22, FTP 21, SMB 445, Telnet 23, Kerberos 88. **LLMNR/NBT-NS poisoning** avec **Responder** capture des hash NTLMv2.",en:"**Password spraying** = **one** common password against **many** accounts (below lockout threshold). Targets: MSSQL 1433, SSH 22, FTP 21, SMB 445, Telnet 23, Kerberos 88. **LLMNR/NBT-NS poisoning** with **Responder** captures NTLMv2 hashes."},
    {t:"cmd",lbl:"Cracking",lines:[
      ["hydra -l admin -P passwords.txt ftp://<ip>","{fr:brute-force/spraying|en:brute-force/spraying}"],
      ["john --format=NT --wordlist=rockyou.txt hashes.txt","{fr:cracke des hash NTLM|en:crack NTLM hashes}"],
      ["sudo responder -I eth0","{fr:empoisonne LLMNR/NBT-NS → capture NTLMv2|en:poison LLMNR/NBT-NS → capture NTLMv2}"]]},
    {t:"h",fr:"Attaques Kerberos",en:"Kerberos attacks"},
    {t:"table",head:{fr:["Attaque","Principe"],en:["Attack","Principle"]},rows:[
      [{fr:"**AS-REP Roasting**",en:"**AS-REP Roasting**"},{fr:"cible les comptes **sans pré-authentification Kerberos** ; craque l'AS-REP hors-ligne",en:"targets accounts **without Kerberos pre-auth**; cracks the AS-REP offline"}],
      [{fr:"**Kerberoasting**",en:"**Kerberoasting**"},{fr:"un user demande des tickets **TGS** de comptes de service (SPN), chiffrés RC4 → craque hors-ligne",en:"a user requests **TGS** tickets of service accounts (SPNs), RC4-encrypted → cracks offline"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**SAM** stocke les hash. **AS-REP Roasting** = comptes sans pré-auth ; **Kerberoasting** = tickets TGS de comptes de service. Contre-mesure clé : **désactiver LLMNR/NBT-NS** et activer le verrouillage de compte.",en:"**SAM** stores hashes. **AS-REP Roasting** = accounts without pre-auth; **Kerberoasting** = TGS tickets of service accounts. Key countermeasure: **disable LLMNR/NBT-NS** and enable account lockout."},
    {t:"recap",items:[
      {k:"Stockage",fr:"SAM (LM/NTLM), SYSKEY",en:"SAM (LM/NTLM), SYSKEY"},
      {k:"4 types",fr:"non-électronique · active · passive · offline",en:"non-electronic · active · passive · offline"},
      {k:"Kerberos",fr:"AS-REP roasting / Kerberoasting",en:"AS-REP roasting / Kerberoasting"},
      {k:"Outils",fr:"Mimikatz, Hashcat, John, Hydra, Responder",en:"Mimikatz, Hashcat, John, Hydra, Responder"}]}
   ]},

  {id:"exploit", t:{fr:"Exploitation & buffer overflow",en:"Exploitation & buffer overflow"},
   s:{fr:"Metasploit, registres, ASLR/DEP/ROP",en:"Metasploit, registers, ASLR/DEP/ROP"},
   blocks:[
    {t:"h",fr:"Exploitation d'une vulnérabilité (7 étapes)",en:"Vulnerability exploitation (7 steps)"},
    {t:"ol",items:[
      {fr:"Identifier la vulnérabilité (Exploit-DB, Packet Storm)",en:"Identify the vulnerability (Exploit-DB, Packet Storm)"},
      {fr:"Déterminer le risque, puis la capacité",en:"Determine the risk, then the capability"},
      {fr:"Développer l'exploit (Metasploit)",en:"Develop the exploit (Metasploit)"},
      {fr:"Choisir la livraison (local/distant)",en:"Choose delivery (local/remote)"},
      {fr:"Générer et livrer le payload (shellcode)",en:"Generate and deliver the payload (shellcode)"},
      {fr:"Obtenir l'accès distant (shell)",en:"Gain remote access (shell)"}]},
    {t:"p",fr:"**Metasploit** — modules : **Exploit, Payload, Encoder** (obfusque pour éviter l'AV, polymorphe), **NOPS** (sled), **Evasion**, **Post-exploitation** (`getsystem`, hashdump, pivoting).",en:"**Metasploit** — modules: **Exploit, Payload, Encoder** (obfuscates to evade AV, polymorphic), **NOPS** (sled), **Evasion**, **Post-exploitation** (`getsystem`, hashdump, pivoting)."},
    {t:"h",fr:"Buffer overflow — registres",en:"Buffer overflow — registers"},
    {t:"table",head:{fr:["Registre","Rôle"],en:["Register","Role"]},rows:[
      [{fr:"**EBP**",en:"**EBP**"},{fr:"base de la pile (premier élément)",en:"stack base (first element)"}],
      [{fr:"**ESP**",en:"**ESP**"},{fr:"sommet de la pile (prochain élément)",en:"top of stack (next element)"}],
      [{fr:"**EIP**",en:"**EIP**"},{fr:"**prochaine instruction — cible de l'attaque**",en:"**next instruction — the attack target**"}],
      [{fr:"ESI / EDI",en:"ESI / EDI"},{fr:"index source / destination (chaînes)",en:"source / destination index (strings)"}]]},
    {t:"p",fr:"La pile est **LIFO** (PUSH/POP). Types : **stack-based** (le plus courant, `strcpy()` sans borne) et **heap-based** (`malloc()`). Étapes Windows : **spiking → fuzzing → offset → écraser EIP → bad chars → bon module (mona.py) → shellcode (msfvenom) → shell**.",en:"The stack is **LIFO** (PUSH/POP). Types: **stack-based** (most common, `strcpy()` without bounds) and **heap-based** (`malloc()`). Windows steps: **spiking → fuzzing → offset → overwrite EIP → bad chars → right module (mona.py) → shellcode (msfvenom) → shell**."},
    {t:"h",fr:"Contourner les protections mémoire",en:"Bypassing memory protections"},
    {t:"table",head:{fr:["Protection / technique","Détail"],en:["Protection / technique","Detail"]},rows:[
      [{fr:"**ASLR**",en:"**ASLR**"},{fr:"randomise les adresses mémoire",en:"randomizes memory addresses"}],
      [{fr:"**DEP**",en:"**DEP**"},{fr:"empêche l'exécution en zone non exécutable",en:"prevents execution in non-executable regions"}],
      [{fr:"**Heap / JIT spraying**",en:"**Heap / JIT spraying**"},{fr:"remplit le tas de copies du shellcode",en:"fills the heap with shellcode copies"}],
      [{fr:"**ROP**",en:"**ROP**"},{fr:"enchaîne des *gadgets* finissant par RET → contourne DEP/signature",en:"chains *gadgets* ending in RET → bypasses DEP/signing"}]]},
    {t:"note",k:{fr:"BloodHound",en:"BloodHound"},fr:"Cartographie une forêt AD par **théorie des graphes** : chemins vers Domain Admins, comptes kerberoastables/AS-REP roastables.",en:"Maps an AD forest via **graph theory**: paths to Domain Admins, kerberoastable/AS-REP-roastable accounts."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**EIP** est la cible d'un buffer overflow. **ASLR** randomise les adresses, **DEP** bloque l'exécution ; **ROP** contourne le DEP en chaînant des gadgets.",en:"**EIP** is the buffer-overflow target. **ASLR** randomizes addresses, **DEP** blocks execution; **ROP** bypasses DEP by chaining gadgets."},
    {t:"recap",items:[

  {id:"maintain", t:{fr:"Maintien d'accès : outils malveillants",en:"Maintaining access: malicious tools"},
   s:{fr:"Keyloggers, spyware, rootkits, NTFS ADS",en:"Keyloggers, spyware, rootkits, NTFS ADS"},
   blocks:[
    {t:"h",fr:"Keyloggers",en:"Keyloggers"},
    {t:"p",fr:"Enregistrent chaque frappe. **Matériels** (entre clavier et port — **non détectables par logiciel**, indépendants de l'OS) : PC/BIOS, PS/2, USB, acoustique, Bluetooth, Wi-Fi. **Logiciels** : application, **kernel**, hyperviseur, form-grabbing, JavaScript, injection mémoire.",en:"Record every keystroke. **Hardware** (between keyboard and port — **not detectable by software**, OS-independent): PC/BIOS, PS/2, USB, acoustic, Bluetooth, Wi-Fi. **Software**: application, **kernel**, hypervisor, form-grabbing, JavaScript, memory injection."},
    {t:"h",fr:"Rootkits — 6 types (par anneau)",en:"Rootkits — 6 types (by ring)"},
    {t:"table",head:{fr:["Type","Anneau / détail"],en:["Type","Ring / detail"]},rows:[
      [{fr:"Hypervisor-level",en:"Hypervisor-level"},{fr:"**Ring -1** — héberge l'OS en VM (Intel VT/AMD-V)",en:"**Ring -1** — hosts the OS as a VM (Intel VT/AMD-V)"}],
      [{fr:"Hardware/Firmware",en:"Hardware/Firmware"},{fr:"BIOS, disque, carte réseau",en:"BIOS, disk, network card"}],
      [{fr:"Kernel-level",en:"Kernel-level"},{fr:"**Ring 0** — privilèges max, via drivers/LKM",en:"**Ring 0** — max privileges, via drivers/LKM"}],
      [{fr:"Boot-loader (bootkit)",en:"Boot-loader (bootkit)"},{fr:"s'active **avant l'OS**",en:"activates **before the OS**"}],
      [{fr:"Application-level",en:"Application-level"},{fr:"**Ring 3** — user-mode",en:"**Ring 3** — user-mode"}],
      [{fr:"Library / Memory",en:"Library / Memory"},{fr:"hook des appels système / réside en **RAM** (le plus furtif)",en:"hooks syscalls / resides in **RAM** (stealthiest)"}]]},
    {t:"h",fr:"NTFS Alternate Data Streams (ADS)",en:"NTFS Alternate Data Streams (ADS)"},
    {t:"p",fr:"Flux caché NTFS : on injecte du code dans un fichier **sans changer sa taille ni son affichage** — invisible à l'Explorateur. Défense : déplacer sur une partition **FAT** (supprime les flux), détecter avec **Streams (Sysinternals)** ou **GMER**.",en:"Hidden NTFS stream: inject code into a file **without changing its size or display** — invisible in Explorer. Defense: move to a **FAT** partition (removes streams), detect with **Streams (Sysinternals)** or **GMER**."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Keylogger **matériel = non détectable par logiciel**. Rootkit **hypervisor = Ring -1**, **kernel = Ring 0**, **memory rootkit = le plus furtif** (RAM). ADS ne change pas la taille du fichier.",en:"**Hardware keylogger = not software-detectable**. **Hypervisor rootkit = Ring -1**, **kernel = Ring 0**, **memory rootkit = stealthiest** (RAM). ADS doesn't change file size."},
    {t:"recap",items:[
      {k:"Keylogger HW",fr:"non détectable par logiciel",en:"not software-detectable"},
      {k:"Rootkits",fr:"Ring -1 hypervisor · Ring 0 kernel · Ring 3 user",en:"Ring -1 hypervisor · Ring 0 kernel · Ring 3 user"},
      {k:"ADS",fr:"cache du code sans changer la taille",en:"hides code without changing size"}]}
   ]},

  {id:"stego", t:{fr:"Stéganographie",en:"Steganography"},
   s:{fr:"LSB, classification, steganalyse",en:"LSB, classification, steganalysis"},
   blocks:[
    {t:"p",fr:"La **stéganographie** cache l'**existence** d'un message dans un support anodin (contrairement au chiffrement qui cache seulement le contenu). Processus : Cover + Message → **Stego Object** → extraction.",en:"**Steganography** hides the **existence** of a message inside an innocuous cover (unlike encryption, which only hides the content). Process: Cover + Message → **Stego Object** → extraction."},
    {t:"p",fr:"Deux familles : **technique** (encre invisible, microdots) et **linguistique** (semagrams, open codes : null cipher, grille cipher, jargon code).",en:"Two families: **technical** (invisible ink, microdots) and **linguistic** (semagrams, open codes: null cipher, grille cipher, jargon code)."},
    {t:"h",fr:"Image — LSB Insertion",en:"Image — LSB Insertion"},
    {t:"p",fr:"Technique image la plus courante : le **bit de poids faible (LSB)** de chaque pixel porte 1 bit du message — imperceptible à l'œil. Ex. cacher « H » (`01001000`) en modifiant le LSB d'octets consécutifs.",en:"Most common image technique: the **least-significant bit (LSB)** of each pixel carries 1 bit of the message — imperceptible to the eye. E.g. hide \"H\" (`01001000`) by modifying the LSB of consecutive bytes."},
    {t:"h",fr:"Steganalyse (attaques)",en:"Steganalysis (attacks)"},
    {t:"ul",items:[
      {fr:"**Stego-only** — seul le stego object est disponible",en:"**Stego-only** — only the stego object is available"},
      {fr:"**Known-cover / Known-message / Known-stego** — selon ce qu'on possède en plus",en:"**Known-cover / Known-message / Known-stego** — depending on what else you have"},
      {fr:"**Chosen-message / Chosen-stego** — on choisit le message/l'objet",en:"**Chosen-message / Chosen-stego** — you choose the message/object"},
      {fr:"**Chi-square / Distinguishing statistical / Blind classifier** — analyses statistiques",en:"**Chi-square / Distinguishing statistical / Blind classifier** — statistical analyses"}]},
    {t:"p",fr:"Outils de détection : **zsteg** (PNG/BMP), StegoVeritas, StegoHunt.",en:"Detection tools: **zsteg** (PNG/BMP), StegoVeritas, StegoHunt."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Stégano ≠ chiffrement : elle cache l'**existence** du message. Technique image la plus courante = **LSB insertion**. Attaque avec seulement l'objet = **stego-only**.",en:"Stego ≠ encryption: it hides the **existence** of the message. Most common image technique = **LSB insertion**. Attack with only the object = **stego-only**."},
    {t:"recap",items:[
      {k:"But",fr:"cacher l'existence (pas juste le contenu)",en:"hide the existence (not just the content)"},
      {k:"Image",fr:"LSB insertion (bit de poids faible)",en:"LSB insertion (least-significant bit)"},
      {k:"Steganalyse",fr:"stego-only, known-*, chosen-*, chi-square",en:"stego-only, known-*, chosen-*, chi-square"}]}
   ]},

      [{fr:"**Skeleton Key**",en:"**Skeleton Key**"},{fr:"malware en mémoire injectant un **mot de passe maître** dans le DC",en:"in-memory malware injecting a **master password** into the DC"}],

    {t:"cmd",lbl:"mimikatz (golden ticket)",lines:[

      ["kerberos::golden /sid:<SID> /rc4:<hash> /user:<u>","{fr:forge le golden ticket|en:forge the golden ticket}"],
      ["sekurlsa::logonpasswords","{fr:extrait les credentials en mémoire|en:dump in-memory credentials}"]]},
    {t:"p",fr:"Persistance additionnelle : **abus de DPAPI** (clé maître du DC), **WMI Event Subscription** (survit au reboot).",en:"Additional persistence: **DPAPI abuse** (DC master key), **WMI Event Subscription** (survives reboot)."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Golden Ticket = KRBTGT + TGT** (domaine entier). **Silver Ticket = compte de service + TGS** (un service). Le vol du hash KRBTGT se fait par **DCSync**.",en:"**Golden Ticket = KRBTGT + TGT** (whole domain). **Silver Ticket = service account + TGS** (one service). KRBTGT hash theft is done via **DCSync**."},

   s:{fr:"Logs, anti-forensique, canaux cachés",en:"Logs, anti-forensics, covert channels"},

      ["Clear-EventLog -LogName application,system","{fr:PowerShell|en:PowerShell}"],
      ["rm /var/log/<fichier>.log","{fr:journaux Linux en clair|en:cleartext Linux logs}"]]},
    {t:"h",fr:"Anti-forensique Windows",en:"Windows anti-forensics"},
    {t:"ul",items:[
      {fr:"`fsutil behavior set disablelastaccess 1` — désactive le last-access timestamp",en:"`fsutil behavior set disablelastaccess 1` — disable the last-access timestamp"},
      {fr:"Désactiver **Prefetch** (service **SysMain/Superfetch**) et le cache de miniatures",en:"Disable **Prefetch** (**SysMain/Superfetch** service) and the thumbnail cache"},

    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[

      [{fr:"DNS tunneling",en:"DNS tunneling"},{fr:"données encodées dans les requêtes DNS (C2/exfiltration)",en:"data encoded in DNS queries (C2/exfiltration)"}]]},
    {t:"p",fr:"Défense (effacement de traces) : logging sur **serveur séparé en DMZ**, logs en **append-only** / **immutable**, empêcher l'écrasement, sauvegardes sur média inaltérable, ACL restreintes.",en:"Defense (against track-clearing): logging to a **separate DMZ server**, **append-only** / **immutable** logs, prevent overwriting, backups to unalterable media, restricted ACLs."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"`clearev` (Meterpreter) efface les 3 journaux Windows. Le **DNS tunneling** exfiltre via des requêtes DNS. Meilleure défense : logs distants **append-only** sur un serveur en DMZ.",en:"`clearev` (Meterpreter) wipes the 3 Windows logs. **DNS tunneling** exfiltrates via DNS queries. Best defense: remote **append-only** logs on a DMZ server."},
    {t:"recap",items:[

      {k:"Exfil cachée",fr:"HTTP / ICMP / DNS tunneling",en:"HTTP / ICMP / DNS tunneling"},

  {q:{fr:"À quel anneau (ring) opère un rootkit de type hyperviseur ?",en:"At which ring does a hypervisor rootkit operate?"},opts:[{fr:"Ring -1",en:"Ring -1"},{fr:"Ring 0",en:"Ring 0"},{fr:"Ring 3",en:"Ring 3"},{fr:"Ring 1",en:"Ring 1"}],a:0,ex:{fr:"Le rootkit hyperviseur opère au Ring -1 (héberge l'OS en VM). Le kernel-level est au Ring 0, l'application-level au Ring 3.",en:"The hypervisor rootkit operates at Ring -1 (hosts the OS as a VM). Kernel-level is Ring 0, application-level is Ring 3."}},
  {q:{fr:"Pourquoi un keylogger matériel est-il difficile à détecter ?",en:"Why is a hardware keylogger hard to detect?"},opts:[{fr:"il n'est pas détectable par un logiciel anti-keylogger",en:"it isn't detectable by anti-keylogger software"},{fr:"il chiffre ses frappes",en:"it encrypts its keystrokes"},{fr:"il réside dans le SAM",en:"it resides in the SAM"},{fr:"il utilise le port 445",en:"it uses port 445"}],a:0,ex:{fr:"Placé physiquement entre le clavier et le port, il est indépendant de l'OS → invisible aux logiciels ; il se découvre physiquement.",en:"Physically placed between keyboard and port, it's OS-independent → invisible to software; it's found physically."}},
  {q:{fr:"Quelle est la technique de stéganographie d'image la plus courante ?",en:"What is the most common image steganography technique?"},opts:[{fr:"l'insertion LSB (bit de poids faible)",en:"LSB insertion (least-significant bit)"},{fr:"le null cipher",en:"the null cipher"},{fr:"les microdots",en:"microdots"},{fr:"le chi-square",en:"chi-square"}],a:0,ex:{fr:"L'insertion LSB remplace le bit de poids faible de chaque pixel par un bit du message, imperceptible à l'œil.",en:"LSB insertion replaces the least-significant bit of each pixel with a message bit, imperceptible to the eye."}},
  {q:{fr:"Quelle commande Meterpreter efface les journaux Windows ?",en:"Which Meterpreter command clears Windows logs?"},opts:[{fr:"clearev",en:"clearev"},{fr:"getsystem",en:"getsystem"},{fr:"hashdump",en:"hashdump"},{fr:"migrate",en:"migrate"}],a:0,ex:{fr:"clearev efface les journaux Application, System et Security. Défense : logs distants append-only sur un serveur en DMZ.",en:"clearev wipes the Application, System and Security logs. Defense: remote append-only logs on a DMZ server."}},
  {q:{fr:"Une fonctionnalité NTFS qui cache du code sans changer la taille du fichier ?",en:"An NTFS feature that hides code without changing file size?"},opts:[{fr:"les Alternate Data Streams (ADS)",en:"Alternate Data Streams (ADS)"},{fr:"le SYSKEY",en:"SYSKEY"},{fr:"le Prefetch",en:"Prefetch"},{fr:"le Global Catalog",en:"the Global Catalog"}],a:0,ex:{fr:"Les ADS ajoutent un flux caché à un fichier sans modifier sa taille ni son affichage. Défense : partition FAT, Streams (Sysinternals), GMER.",en:"ADS add a hidden stream to a file without changing its size or display. Defense: FAT partition, Streams (Sysinternals), GMER."}}
 ]
},
{
 n:7, exam:"312-50",
 t:{fr:"Menaces de malwares",en:"Malware Threats"},
 sub:{fr:"Trojans, virus, worms, fileless, APT",en:"Trojans, viruses, worms, fileless, APT"},
 cards:[

  {id:"concepts", t:{fr:"Concepts & composants",en:"Concepts & components"},
   s:{fr:"Vecteurs d'entrée, distribution, composants",en:"Entry vectors, distribution, components"},
   blocks:[
    {t:"p",fr:"Un **malware** endommage ou prend le contrôle d'un système pour du vol/fraude. Exemples : Trojans, backdoors, rootkits, ransomware, adware, virus, worms, spyware, botnets, crypters.",en:"**Malware** damages or takes control of a system for theft/fraud. Examples: Trojans, backdoors, rootkits, ransomware, adware, viruses, worms, spyware, botnets, crypters."},
    {t:"h",fr:"Vecteurs d'entrée & distribution web",en:"Entry vectors & web distribution"},
    {t:"ul",items:[
      {fr:"Messageries instantanées, **supports amovibles** (USB via **Autorun.inf** — désactiver l'Autoplay via gpedit)",en:"Instant messaging, **removable media** (USB via **Autorun.inf** — disable Autoplay via gpedit)"},
      {fr:"**Black hat SEO**, **malvertising**, **drive-by downloads** (juste visiter le site infecte)",en:"**Black hat SEO**, **malvertising**, **drive-by downloads** (just visiting infects)"},
      {fr:"**Spear-phishing sites**, sites légitimes compromis, **spam** (méthode la plus courante)",en:"**Spear-phishing sites**, compromised legitimate sites, **spam** (most common method)"}]},
    {t:"h",fr:"Composants d'un malware",en:"Malware components"},
    {t:"table",head:{fr:["Composant","Fonction"],en:["Component","Function"]},rows:[
      [{fr:"**Crypter**",en:"**Crypter**"},{fr:"cache l'existence du malware, évade l'AV",en:"conceals the malware's existence, evades AV"}],
      [{fr:"**Downloader**",en:"**Downloader**"},{fr:"télécharge d'autres malwares depuis Internet",en:"downloads other malware from the Internet"}],
      [{fr:"**Dropper**",en:"**Dropper**"},{fr:"transporteur discret, installe le payload",en:"covert carrier, installs the payload"}],
      [{fr:"**Exploit**",en:"**Exploit**"},{fr:"tire parti d'un bug/vulnérabilité",en:"takes advantage of a bug/vulnerability"}],
      [{fr:"**Injector**",en:"**Injector**"},{fr:"injecte du code dans des processus vivants",en:"injects code into running processes"}],
      [{fr:"**Packer**",en:"**Packer**"},{fr:"compresse le fichier en format illisible",en:"compresses the file into an unreadable format"}],
      [{fr:"**Payload**",en:"**Payload**"},{fr:"réalise l'action malveillante",en:"performs the malicious action"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Crypter** cache/évade l'AV ; **Packer** compresse ; **Dropper** installe ; **Downloader** télécharge ; **Payload** agit. Ne pas les confondre. Les **PUA/PUP** (grayware) sont potentiellement indésirables.",en:"**Crypter** hides/evades AV; **Packer** compresses; **Dropper** installs; **Downloader** downloads; **Payload** acts. Don't confuse them. **PUA/PUP** (grayware) are potentially unwanted."},
    {t:"recap",items:[
      {k:"Distribution",fr:"spam (n°1), drive-by, malvertising, USB autorun",en:"spam (#1), drive-by, malvertising, USB autorun"},
      {k:"Crypter/Packer",fr:"cache-AV / compresse",en:"AV-hide / compresses"},
      {k:"Dropper/Downloader",fr:"installe / télécharge",en:"installs / downloads"}]}
   ]},

  {id:"apt", t:{fr:"APT",en:"APT"},
   s:{fr:"Advanced Persistent Threat, cycle en 6 étapes",en:"Advanced Persistent Threat, 6-stage lifecycle"},
   blocks:[
    {t:"p",fr:"Une **APT** : un attaquant obtient un accès non autorisé et **reste indétecté longtemps**. **A**dvanced (techniques poussées) · **P**ersistent (C2 qui exfiltre en continu) · **T**hreat (coordination humaine). Objectif principal : **obtenir de l'information sensible** (pas saboter).",en:"An **APT**: an attacker gains unauthorized access and **stays undetected for a long time**. **A**dvanced (sophisticated techniques) · **P**ersistent (C2 continuously exfiltrating) · **T**hreat (human coordination). Main objective: **obtain sensitive information** (not sabotage)."},
    {t:"h",fr:"Cycle de vie (6 étapes)",en:"Lifecycle (6 stages)"},
    {t:"ol",items:[
      {fr:"**Preparation** — définir/étudier la cible, outiller",en:"**Preparation** — define/research the target, tool up"},
      {fr:"**Initial Intrusion** — déployer le malware, connexion sortante",en:"**Initial Intrusion** — deploy malware, outbound connection"},
      {fr:"**Expansion** — étendre l'accès, obtenir des identifiants",en:"**Expansion** — expand access, obtain credentials"},
      {fr:"**Persistence** — maintenir l'accès",en:"**Persistence** — maintain access"},
      {fr:"**Search & Exfiltration** — exfiltrer les données",en:"**Search & Exfiltration** — exfiltrate data"},
      {fr:"**Cleanup** — effacer les traces",en:"**Cleanup** — cover tracks"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"L'objectif d'une APT = **information sensible**, pas la destruction. Cycle : Preparation → Initial Intrusion → Expansion → Persistence → Search & Exfiltration → Cleanup.",en:"An APT's objective = **sensitive information**, not destruction. Lifecycle: Preparation → Initial Intrusion → Expansion → Persistence → Search & Exfiltration → Cleanup."},
    {t:"recap",items:[
      {k:"Sens",fr:"Advanced · Persistent · Threat",en:"Advanced · Persistent · Threat"},
      {k:"Objectif",fr:"exfiltrer de l'info, rester indétecté",en:"exfiltrate info, stay undetected"},
      {k:"Cycle",fr:"Prep→Intrusion→Expansion→Persistence→Exfil→Cleanup",en:"Prep→Intrusion→Expansion→Persistence→Exfil→Cleanup"}]}
   ]},

  {id:"trojan", t:{fr:"Trojans",en:"Trojans"},
   s:{fr:"Types, ports, e-banking, dropper vs downloader",en:"Types, ports, e-banking, dropper vs downloader"},
   blocks:[
    {t:"p",fr:"Un **Trojan** se cache dans un programme légitime et agit au **même niveau de privilège que la victime**. Indices : fond d'écran qui change, tiroir CD qui s'ouvre, curseur qui bouge seul, AV désactivé, trafic réseau anormal. L'état **« listening »** trahit souvent un Trojan en attente de connexion.",en:"A **Trojan** hides inside a legitimate program and runs at the **same privilege level as the victim**. Signs: wallpaper changing, CD tray opening, cursor moving by itself, AV disabled, abnormal traffic. A **\"listening\"** state often betrays a Trojan awaiting connection."},
    {t:"h",fr:"14 types de Trojans",en:"14 Trojan types"},
    {t:"p",fr:"**RAT** (contrôle total) · **Backdoor** · **Botnet** · **Rootkit** · **E-Banking** · **POS** · **Defacement** · **Service Protocol** · **Mobile** · **IoT** · **Security Software Disabler** · **Destructive** · **DDoS** · **Command Shell**.",en:"**RAT** (full control) · **Backdoor** · **Botnet** · **Rootkit** · **E-Banking** · **POS** · **Defacement** · **Service Protocol** · **Mobile** · **IoT** · **Security Software Disabler** · **Destructive** · **DDoS** · **Command Shell**."},
    {t:"h",fr:"Trojans e-banking",en:"E-banking Trojans"},
    {t:"table",head:{fr:["Méthode","Principe"],en:["Method","Principle"]},rows:[
      [{fr:"TAN Grabber",en:"TAN Grabber"},{fr:"intercepte le TAN valide, le remplace",en:"intercepts the valid TAN, replaces it"}],
      [{fr:"HTML Injection",en:"HTML Injection"},{fr:"faux champs sur la page bancaire",en:"fake fields on the banking page"}],
      [{fr:"Form Grabber",en:"Form Grabber"},{fr:"capture les données des formulaires (POST)",en:"captures form data (POST)"}]]},
    {t:"p",fr:"**Dropper** = transporte et installe le payload (l'écrit sur le disque). **Downloader** = télécharge d'autres malwares après l'accès initial. Un **crypter** chiffre le binaire pour évader l'AV.",en:"**Dropper** = carries and installs the payload (writes it to disk). **Downloader** = downloads more malware after initial access. A **crypter** encrypts the binary to evade AV."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Un Trojan agit au **même privilège que la victime**. **RAT** = contrôle distant complet. **Dropper** installe, **Downloader** télécharge.",en:"A Trojan runs at the **victim's privilege level**. **RAT** = full remote control. **Dropper** installs, **Downloader** downloads."},
    {t:"recap",items:[
      {k:"Privilège",fr:"celui de la victime",en:"the victim's"},
      {k:"RAT",fr:"contrôle distant total",en:"full remote control"},
      {k:"E-banking",fr:"TAN grabber, HTML injection, form grabber",en:"TAN grabber, HTML injection, form grabber"}]}
   ]},

  {id:"virus", t:{fr:"Virus & worms",en:"Viruses & worms"},
   s:{fr:"Types de virus, polymorphe/métamorphe, worm",en:"Virus types, polymorphic/metamorphic, worm"},
   blocks:[
    {t:"p",fr:"Un **virus** est un programme **auto-répliquant** qui s'attache à un autre programme, à un secteur de boot ou à un document. Deux phases : **infection** (charge en mémoire, s'attache) et **attaque** (corrompt/supprime).",en:"A **virus** is a **self-replicating** program that attaches to another program, a boot sector or a document. Two phases: **infection** (loads in memory, attaches) and **attack** (corrupts/deletes)."},
    {t:"h",fr:"Types de virus clés",en:"Key virus types"},
    {t:"table",head:{fr:["Type","Détail"],en:["Type","Detail"]},rows:[
      [{fr:"Boot sector",en:"Boot sector"},{fr:"cible le MBR",en:"targets the MBR"}],
      [{fr:"File / Macro",en:"File / Macro"},{fr:"exécutables / documents Office macro",en:"executables / macro Office docs"}],
      [{fr:"Multipartite",en:"Multipartite"},{fr:"boot sector **et** fichiers",en:"boot sector **and** files"}],
      [{fr:"Stealth / Sparse",en:"Stealth / Sparse"},{fr:"intercepte l'AV / infecte rarement (anti-détection)",en:"intercepts AV / infects rarely (anti-detection)"}],
      [{fr:"**Polymorphe**",en:"**Polymorphic**"},{fr:"change son code à chaque réplication (chiffrement variable)",en:"changes its code each replication (variable encryption)"}],
      [{fr:"**Métamorphe**",en:"**Metamorphic**"},{fr:"**se réécrit entièrement** (plus avancé que polymorphe)",en:"**fully rewrites itself** (more advanced than polymorphic)"}],
      [{fr:"Logic bomb",en:"Logic bomb"},{fr:"se déclenche sur une condition/date",en:"triggers on a condition/date"}]]},
    {t:"h",fr:"Virus vs Worm",en:"Virus vs Worm"},
    {t:"table",head:{fr:["Virus","Worm"],en:["Virus","Worm"]},rows:[
      [{fr:"a besoin d'un fichier hôte + action utilisateur",en:"needs a host file + user action"},{fr:"exploite une **vulnérabilité**, se réplique seul",en:"exploits a **vulnerability**, self-replicates"}],
      [{fr:"vitesse de propagation uniforme",en:"uniform spread rate"},{fr:"se propage **plus vite** (réseau, e-mail)",en:"spreads **faster** (network, email)"}],
      [{fr:"difficile à retirer",en:"hard to remove"},{fr:"plus facile à retirer",en:"easier to remove"}]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Polymorphe** = change son chiffrement à chaque copie ; **métamorphe** = se réécrit entièrement. **Worm** = se propage seul via une vulnérabilité, sans fichier hôte ni action utilisateur.",en:"**Polymorphic** = changes its encryption each copy; **metamorphic** = fully rewrites itself. **Worm** = self-propagates via a vulnerability, no host file or user action."},
    {t:"recap",items:[
      {k:"Polymorphe",fr:"chiffrement variable à chaque réplication",en:"variable encryption each replication"},
      {k:"Métamorphe",fr:"réécriture complète",en:"full rewrite"},
      {k:"Worm",fr:"exploite une vuln, propagation autonome rapide",en:"exploits a vuln, fast autonomous spread"}]}
   ]},

  {id:"fileless", t:{fr:"Fileless & AI malware",en:"Fileless & AI malware"},
   s:{fr:"RAM, LOLBins, injection, IA",en:"RAM, LOLBins, injection, AI"},
   blocks:[
    {t:"p",fr:"Le **fileless malware** (non-malware) réside surtout en **RAM** et injecte son code dans des processus légitimes (PowerShell, WMI, .NET, macros). Il pratique le **LOL (Living-off-the-Land)** : il abuse d'outils déjà installés → **très difficile à détecter**, complique la forensique.",en:"**Fileless malware** (non-malware) resides mostly in **RAM** and injects code into legitimate processes (PowerShell, WMI, .NET, macros). It uses **LOL (Living-off-the-Land)**: it abuses already-installed tools → **very hard to detect**, complicates forensics."},
    {t:"h",fr:"4 phases",en:"4 phases"},
    {t:"ol",items:[
      {fr:"**Point of Entry** (phishing, doc/site malveillant)",en:"**Point of Entry** (phishing, malicious doc/site)"},
      {fr:"**Code Execution** (injection : process hollowing, **reflective DLL** ; via PowerShell/CScript)",en:"**Code Execution** (injection: process hollowing, **reflective DLL**; via PowerShell/CScript)"},
      {fr:"**Persistence** (registre, **WMI**, tâche planifiée)",en:"**Persistence** (registry, **WMI**, scheduled task)"},
      {fr:"**Achieving Objectives** (recon, credentials, exfiltration)",en:"**Achieving Objectives** (recon, credentials, exfiltration)"}]},
    {t:"p",fr:"Outils abusés (**LOLBins**) : Certutil, WMIC, Regsvr32, rundll32, PowerShell, Mimikatz, Cobalt Strike.",en:"Abused tools (**LOLBins**): Certutil, WMIC, Regsvr32, rundll32, PowerShell, Mimikatz, Cobalt Strike."},
    {t:"h",fr:"Malware basé IA",en:"AI-based malware"},
    {t:"p",fr:"Variantes : **BlackMamba, WormGPT, FraudGPT, DeepLocker, Stuxnet**. Cycle en 7 phases : Infiltration → Establishment → **Learning** → **Adaptation** → Execution → Propagation → **Evolution**. Capacités : évasion adaptative, exploitation de zero-days, **auto-réparation**.",en:"Variants: **BlackMamba, WormGPT, FraudGPT, DeepLocker, Stuxnet**. 7-phase cycle: Infiltration → Establishment → **Learning** → **Adaptation** → Execution → Propagation → **Evolution**. Capabilities: adaptive evasion, zero-day exploitation, **self-healing**."},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"Fileless = réside en **RAM**, **LOL** = abuse d'outils légitimes préinstallés. Défense : **NGAV** (ML/AI), **UBA**, contrôle applicatif empêchant les navigateurs de lancer PowerShell/WMIC.",en:"Fileless = resides in **RAM**, **LOL** = abuses pre-installed legitimate tools. Defense: **NGAV** (ML/AI), **UBA**, application control blocking browsers from spawning PowerShell/WMIC."},
    {t:"recap",items:[
      {k:"Fileless",fr:"RAM + LOLBins (PowerShell, WMI)",en:"RAM + LOLBins (PowerShell, WMI)"},
      {k:"4 phases",fr:"Entry → Execution → Persistence → Objectives",en:"Entry → Execution → Persistence → Objectives"},
      {k:"IA",fr:"BlackMamba, WormGPT ; auto-réparation",en:"BlackMamba, WormGPT; self-healing"}]}
   ]},

  {id:"analysis", t:{fr:"Analyse de malware",en:"Malware analysis"},
   s:{fr:"Testbed, statique vs dynamique, YARA",en:"Testbed, static vs dynamic, YARA"},
   blocks:[
    {t:"p",fr:"Procédure : **1. Préparer le testbed → 2. Analyse statique → 3. Analyse dynamique**. Le testbed est une **VM isolée** (NIC en *host-only*, INetSim pour simuler Internet, partages désactivés, hash de référence).",en:"Procedure: **1. Prepare the testbed → 2. Static analysis → 3. Dynamic analysis**. The testbed is an **isolated VM** (NIC in *host-only*, INetSim to simulate the Internet, shares disabled, reference hashes)."},
    {t:"table",head:{fr:["Analyse","Principe"],en:["Analysis","Principle"]},rows:[
      [{fr:"**Statique**",en:"**Static**"},{fr:"**sans exécuter** : fingerprint, strings, PE, désassemblage, `readelf` (ELF), oletools (Office)",en:"**without running**: fingerprint, strings, PE, disassembly, `readelf` (ELF), oletools (Office)"}],
      [{fr:"**Dynamique**",en:"**Dynamic**"},{fr:"**en exécutant** en VM/sandbox : baselining + host integrity monitoring",en:"**by running** in a VM/sandbox: baselining + host integrity monitoring"}]]},
    {t:"p",fr:"Dynamique en 2 stades : **System Baselining** (snapshot initial) et **Host Integrity Monitoring** (comparaison avant/après). Outils : `netstat -an`, `strace`, **Wireshark**. **YARA** écrit des règles de *pattern matching* pour reconnaître un malware.",en:"Dynamic in 2 stages: **System Baselining** (initial snapshot) and **Host Integrity Monitoring** (before/after comparison). Tools: `netstat -an`, `strace`, **Wireshark**. **YARA** writes *pattern-matching* rules to recognize malware."},
    {t:"cmd",lbl:"Analyse",lines:[
      ["strings sample > str.txt","{fr:extrait les chaînes (statique)|en:extract strings (static)}"],
      ["readelf -h sample","{fr:en-têtes ELF|en:ELF headers}"],
      ["yara rules.yar suspicious_file","{fr:pattern matching|en:pattern matching}"],
      ["netstat -an","{fr:connexions/ports (dynamique)|en:connections/ports (dynamic)}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Statique = sans exécuter** (sûr) ; **dynamique = en exécutant** en environnement isolé. Les 2 stades du dynamique : **baselining** puis **host integrity monitoring**. **YARA** = règles de reconnaissance.",en:"**Static = without running** (safe); **dynamic = by running** in an isolated environment. The 2 dynamic stages: **baselining** then **host integrity monitoring**. **YARA** = recognition rules."},
    {t:"recap",items:[
      {k:"3 étapes",fr:"testbed → statique → dynamique",en:"testbed → static → dynamic"},
      {k:"Statique",fr:"strings, readelf, PE — sans exécuter",en:"strings, readelf, PE — without running"},
      {k:"Dynamique",fr:"baselining + host integrity ; netstat, Wireshark",en:"baselining + host integrity; netstat, Wireshark"},
      {k:"YARA",fr:"règles de pattern matching",en:"pattern-matching rules"}]}
   ]},

  {id:"detection", t:{fr:"Détection & contre-mesures",en:"Detection & countermeasures"},
   s:{fr:"5 méthodes, code emulation, NGAV/EDR",en:"5 methods, code emulation, NGAV/EDR"},
   blocks:[
    {t:"h",fr:"5 méthodes de détection de virus",en:"5 virus detection methods"},
    {t:"table",head:{fr:["Méthode","Principe"],en:["Method","Principle"]},rows:[
      [{fr:"**Scanning**",en:"**Scanning**"},{fr:"cherche des **signatures** connues",en:"looks for known **signatures**"}],
      [{fr:"**Integrity checking**",en:"**Integrity checking**"},{fr:"compare à une empreinte de référence",en:"compares to a reference fingerprint"}],
      [{fr:"**Interception**",en:"**Interception**"},{fr:"surveille les requêtes OS (logic bombs, Trojans)",en:"monitors OS requests (logic bombs, Trojans)"}],
      [{fr:"**Code emulation**",en:"**Code emulation**"},{fr:"exécute le code en **VM** — efficace contre polymorphe/chiffré",en:"runs the code in a **VM** — effective vs polymorphic/encrypted"}],
      [{fr:"**Heuristic analysis**",en:"**Heuristic analysis**"},{fr:"détecte l'**inconnu** — mais **faux positifs**",en:"detects the **unknown** — but **false positives**"}]]},
    {t:"h",fr:"Contre-mesures",en:"Countermeasures"},
    {t:"ul",items:[
      {fr:"Ne pas ouvrir les PJ inconnues ni les fichiers à **double extension** ; désactiver l'autorun, les macros, le JavaScript des PDF",en:"Don't open unknown attachments or **double-extension** files; disable autorun, macros, PDF JavaScript"},
      {fr:"Patcher, moindre privilège, **DEP/ASLR**, FIM (file integrity monitoring)",en:"Patch, least privilege, **DEP/ASLR**, FIM (file integrity monitoring)"},
      {fr:"Contre le fileless : **NGAV** (ML/AI), **UBA**, **MDR**, empêcher les navigateurs de lancer PowerShell/WMIC",en:"Against fileless: **NGAV** (ML/AI), **UBA**, **MDR**, block browsers from spawning PowerShell/WMIC"},
      {fr:"Contre l'APT : **zero-trust**, segmentation, **EDR/NGAV**",en:"Against APT: **zero-trust**, segmentation, **EDR/NGAV**"}]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},fr:"**Code emulation** exécute en VM (efficace contre le polymorphe). **Heuristic analysis** détecte l'inconnu mais génère des **faux positifs**. Contre les malwares modernes : **NGAV** (ML/AI) + **EDR**.",en:"**Code emulation** runs in a VM (effective vs polymorphic). **Heuristic analysis** detects the unknown but yields **false positives**. Against modern malware: **NGAV** (ML/AI) + **EDR**."},
    {t:"recap",items:[
      {k:"5 méthodes",fr:"scanning · integrity · interception · emulation · heuristic",en:"scanning · integrity · interception · emulation · heuristic"},
      {k:"Polymorphe",fr:"code emulation (VM)",en:"code emulation (VM)"},
      {k:"Inconnu",fr:"heuristique (faux positifs)",en:"heuristic (false positives)"},
      {k:"Moderne",fr:"NGAV + EDR + zero-trust",en:"NGAV + EDR + zero-trust"}]}
   ]}
 ],
