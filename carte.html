{
 n:8, exam:"312-50",
 t:{fr:"Sniffing",en:"Sniffing"},
 sub:{fr:"Capturer et détourner le trafic réseau",en:"Capturing and diverting network traffic"},
 cards:[

  /* ---- 1. Fondamentaux ---- */
  {id:"fond", t:{fr:"Fondamentaux du sniffing",en:"Sniffing fundamentals"},
   s:{fr:"Ce qu'on capture, promiscuous, passif vs actif",en:"What is captured, promiscuous, passive vs active"},
   blocks:[
    {t:"p",fr:"Le **packet sniffing** consiste à surveiller et capturer tous les paquets qui transitent sur un réseau, à l'aide d'un logiciel ou d'un matériel. Depuis un seul point, l'attaquant peut observer l'ensemble du trafic : mots de passe Telnet/FTP, mails, trafic web, DNS, sessions de chat, config routeur.",
              en:"**Packet sniffing** means monitoring and capturing every packet crossing a network, using software or hardware. From a single point, the attacker can observe all traffic: Telnet/FTP passwords, email, web, DNS, chat sessions, router config."},
    {t:"h",fr:"Mode promiscuous",en:"Promiscuous mode"},
    {t:"p",fr:"Une carte réseau (NIC) ne remonte normalement que les trames dont la MAC destination correspond à la sienne. En **mode promiscuous**, ce filtre est désactivé : la NIC remonte **toutes** les trames qu'elle voit. C'est la condition pour sniffer le trafic des autres.",
              en:"A NIC normally only passes up frames whose destination MAC matches its own. In **promiscuous mode** that filter is off: the NIC passes up **every** frame it sees. That's the prerequisite for sniffing other hosts' traffic."},
    {t:"h",fr:"Hub vs switch",en:"Hub vs switch"},
    {t:"p",fr:"Un **hub** répète chaque trame sur tous ses ports : tout le monde voit tout. Un **switch** lit la MAC de destination et n'envoie la trame que sur le bon port, grâce à sa table **CAM**. Sniffer sur un switch demande donc une attaque active.",
              en:"A **hub** repeats every frame on all ports: everyone sees everything. A **switch** reads the destination MAC and forwards the frame only to the right port, using its **CAM** table. Sniffing on a switch therefore requires an active attack."},
    {t:"table",head:{fr:["Environnement","Description"],en:["Environment","Description"]},rows:[
      [{fr:"Shared Ethernet",en:"Shared Ethernet"},{fr:"Bus unique (hub) : toutes les machines reçoivent tous les paquets — collision domain commun.",en:"Single bus (hub): every machine receives every packet — a common collision domain."}],
      [{fr:"Switched Ethernet",en:"Switched Ethernet"},{fr:"Le switch régule le flux port à port via la table CAM. Plus sûr.",en:"The switch regulates flow port-by-port via the CAM table. More secure."}]]},
    {t:"h",fr:"Sniffing passif vs actif",en:"Passive vs active sniffing"},
    {t:"table",head:{fr:["Type","Principe"],en:["Type","Principle"]},rows:[
      [{fr:"Passif",en:"Passive"},{fr:"Sur un hub. On écoute sans injecter de paquets → très discret.",en:"On a hub. Listen without injecting packets → very stealthy."}],
      [{fr:"Actif",en:"Active"},{fr:"Sur un switch. On injecte des paquets (ARP, flood CAM…) pour forcer le switch à diffuser.",en:"On a switch. Inject packets (ARP, CAM flood…) to force the switch to broadcast."}]]},
    {t:"note",k:{fr:"Les 6 techniques actives",en:"The 6 active techniques"},
      fr:"MAC Flooding · DHCP Attacks · DNS Poisoning · Switch Port Stealing · ARP Poisoning · Spoofing Attack.",
      en:"MAC Flooding · DHCP Attacks · DNS Poisoning · Switch Port Stealing · ARP Poisoning · Spoofing Attack."},
    {t:"h",fr:"Protocoles vulnérables (en clair)",en:"Vulnerable protocols (cleartext)"},
    {t:"p",fr:"La raison principale de sniffer ces protocoles : **récupérer des identifiants**. Tous transmettent en clair.",
              en:"The main reason to sniff these protocols: **harvest credentials**. All send in cleartext."},
    {t:"ul",items:[
      {fr:"**Telnet / Rlogin** — frappes clavier, login, mot de passe en clair",en:"**Telnet / Rlogin** — keystrokes, login, password in cleartext"},
      {fr:"**HTTP** — données utilisateur en clair (23, 80)",en:"**HTTP** — user data in cleartext"},
      {fr:"**FTP / TFTP** — identifiants en clair ; TFTP sans auth, sur UDP",en:"**FTP / TFTP** — cleartext credentials; TFTP no auth, over UDP"},
      {fr:"**SMTP / POP / IMAP / NNTP** — messagerie en clair",en:"**SMTP / POP / IMAP / NNTP** — cleartext mail"},
      {fr:"**SNMP v1/v2** — communities en clair",en:"**SNMP v1/v2** — cleartext communities"}]},
    {t:"h",fr:"Analyseurs matériels",en:"Hardware protocol analyzers"},
    {t:"p",fr:"Un **analyseur matériel** intercepte, décode et analyse le trafic **sans altérer** le segment. Plus performant qu'un logiciel (pas de perte de paquets en surcharge) mais coûteux. Exemples : **Xgig 1000** (VIAVI), **SierraNet M1288** (Teledyne LeCroy).",
              en:"A **hardware analyzer** intercepts, decodes and analyzes traffic **without altering** the segment. More capable than software (no packet drops under load) but expensive. Examples: **Xgig 1000** (VIAVI), **SierraNet M1288** (Teledyne LeCroy)."},
    {t:"recap",items:[
      {k:"Promiscuous",fr:"NIC capte toutes les trames, pas seulement les siennes",en:"NIC captures all frames, not only its own"},
      {k:"CAM",fr:"table MAC ↔ port du switch",en:"switch's MAC ↔ port table"},
      {k:"Passif/Actif",fr:"hub, aucune injection / switch, injection de paquets",en:"hub, no injection / switch, packet injection"},
      {k:"Clair",fr:"Telnet, FTP, HTTP, SMTP/POP/IMAP, SNMPv1/2",en:"Telnet, FTP, HTTP, SMTP/POP/IMAP, SNMPv1/2"}]}
   ]},

  /* ---- 2. MAC attacks ---- */
  {id:"mac", t:{fr:"Attaques MAC",en:"MAC attacks"},
   s:{fr:"CAM table, MAC flooding, port stealing",en:"CAM table, MAC flooding, port stealing"},
   blocks:[
    {t:"h",fr:"Table CAM",en:"CAM table"},
    {t:"p",fr:"La **CAM (Content Addressable Memory)** est une table **de taille fixe** qui associe les MAC apprises aux ports physiques (+ VLAN). Le switch y cherche la MAC destination pour ne transmettre que sur le bon port.",
              en:"The **CAM (Content Addressable Memory)** table is a **fixed-size** table mapping learned MACs to physical ports (+ VLAN). The switch looks up the destination MAC there to forward only to the right port."},
    {t:"h",fr:"MAC Flooding",en:"MAC Flooding"},
    {t:"p",fr:"L'attaquant sature la table CAM avec de **fausses adresses MAC**. Une fois pleine (taille fixe), le switch passe en **fail-open** : il se comporte comme un hub et diffuse tout sur tous les ports → l'attaquant peut sniffer.",
              en:"The attacker floods the CAM table with **fake MAC addresses**. Once full (fixed size), the switch goes **fail-open**: it behaves like a hub and broadcasts everything on all ports → the attacker can sniff."},
    {t:"cmd",lbl:"macof",lines:[
      ["macof -i eth0","{fr:inonde le réseau de MAC/IP aléatoires (~131 000 entrées/min)|en:flood the network with random MAC/IP (~131,000 entries/min)}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},
      fr:"L'outil de MAC flooding = **macof** (suite dsniff). Le switch saturé passe en **fail-open**, pas « fail-closed ».",
      en:"The MAC flooding tool = **macof** (dsniff suite). A saturated switch goes **fail-open**, not \"fail-closed\"."},
    {t:"h",fr:"Switch Port Stealing",en:"Switch Port Stealing"},
    {t:"p",fr:"L'attaquant usurpe à la fois l'**IP et la MAC** de la cible. Il envoie une fausse réponse ARP avant la vraie cible : la table CAM associe l'IP de la cible au **port de l'attaquant**. Le trafic destiné à la cible arrive chez l'attaquant.",
              en:"The attacker spoofs both the **IP and MAC** of the target. It sends a forged ARP reply before the real target: the CAM table binds the target's IP to the **attacker's port**. Traffic meant for the target reaches the attacker."},
    {t:"h",fr:"Défense — Port Security (Cisco)",en:"Defense — Port Security (Cisco)"},
    {t:"cmd",lbl:"Cisco IOS",lines:[
      ["interface <id>","{fr:mode config interface|en:interface config mode}"],
      ["switchport mode access","{fr:port en mode access|en:set port to access mode}"],
      ["switchport port-security","{fr:active la sécurité de port|en:enable port security}"]]},
    {t:"p",fr:"Limite le nombre de MAC autorisées par port (souvent **une**). Au-delà → le port se verrouille et envoie un **SNMP trap**.",
              en:"Limits the number of MACs allowed per port (often **one**). Beyond that → the port locks down and sends an **SNMP trap**."},
    {t:"recap",items:[
      {k:"MAC flooding",fr:"remplit la CAM → fail-open → hub → sniff — outil macof",en:"fills the CAM → fail-open → hub → sniff — tool macof"},
      {k:"Port stealing",fr:"usurpe IP+MAC, vole l'entrée CAM de la cible",en:"spoofs IP+MAC, steals the target's CAM entry"},
      {k:"Défense",fr:"port-security (1 MAC/port) → lock + SNMP trap",en:"port-security (1 MAC/port) → lock + SNMP trap"}]}
   ]},

  /* ---- 3. DHCP ---- */
  {id:"dhcp", t:{fr:"Attaques DHCP",en:"DHCP attacks"},
   s:{fr:"DORA, starvation, rogue DHCP, snooping",en:"DORA, starvation, rogue DHCP, snooping"},
   blocks:[
    {t:"h",fr:"Le processus DORA",en:"The DORA process"},
    {t:"p",fr:"L'attribution d'adresse DHCP suit 4 étapes : **D**iscover → **O**ffer → **R**equest → **A**ck. Le client diffuse un DHCPDISCOVER, le serveur propose (OFFER), le client demande (REQUEST), le serveur confirme (ACK). Ports **67 (serveur, bootps)** et **68 (client, bootpc)** en UDP.",
              en:"DHCP address assignment follows 4 steps: **D**iscover → **O**ffer → **R**equest → **A**ck. The client broadcasts a DHCPDISCOVER, the server proposes (OFFER), the client asks (REQUEST), the server confirms (ACK). Ports **67 (server, bootps)** and **68 (client, bootpc)** over UDP."},
    {t:"h",fr:"DHCP Starvation",en:"DHCP Starvation"},
    {t:"p",fr:"Attaque **DoS** : l'attaquant diffuse des masses de requêtes DHCP forgées pour louer **toutes** les adresses du scope. Les utilisateurs légitimes ne peuvent plus obtenir d'IP.",
              en:"A **DoS** attack: the attacker broadcasts masses of forged DHCP requests to lease **all** addresses in the scope. Legitimate users can no longer get an IP."},
    {t:"cmd",lbl:"Yersinia",lines:[
      ["yersinia -I","{fr:mode DHCP interactif|en:interactive DHCP mode}"]]},
    {t:"p",fr:"Autres outils : **dhcpStarvation.py, DHCPig, Hyenae, Metasploit**.",
              en:"Other tools: **dhcpStarvation.py, DHCPig, Hyenae, Metasploit**."},
    {t:"h",fr:"Rogue DHCP Server",en:"Rogue DHCP Server"},
    {t:"p",fr:"L'attaquant monte un **faux serveur DHCP** qui répond plus vite que le vrai (souvent après un starvation qui a assommé le serveur légitime). Il pousse alors une config piégée :",
              en:"The attacker sets up a **rogue DHCP server** that answers faster than the real one (often after a starvation that knocked out the legitimate server). It then pushes a malicious config:"},
    {t:"ul",items:[
      {fr:"**Mauvaise passerelle** → l'attaquant devient la gateway (MitM)",en:"**Wrong gateway** → the attacker becomes the gateway (MitM)"},
      {fr:"**Mauvais DNS** → l'attaquant devient le résolveur",en:"**Wrong DNS** → the attacker becomes the resolver"},
      {fr:"**Mauvaise IP** → déni de service",en:"**Wrong IP** → denial of service"}]},
    {t:"h",fr:"Défense — DHCP Snooping (Cisco)",en:"Defense — DHCP Snooping (Cisco)"},
    {t:"cmd",lbl:"Cisco IOS",lines:[
      ["ip dhcp snooping","{fr:active globalement|en:enable globally}"],
      ["ip dhcp snooping vlan 4,104","{fr:active par VLAN|en:enable per VLAN}"],
      ["ip dhcp snooping trust","{fr:marque le port du vrai serveur comme fiable|en:mark the real server's port as trusted}"]]},
    {t:"note",k:{fr:"Règle clé",en:"Key rule"},
      fr:"Tous les ports du VLAN sont **untrusted par défaut** : seuls les ports explicitement « trust » peuvent envoyer des OFFER/ACK → le rogue est bloqué.",
      en:"All VLAN ports are **untrusted by default**: only ports explicitly set to \"trust\" may send OFFER/ACK → the rogue is blocked."},
    {t:"recap",items:[
      {k:"DORA",fr:"Discover · Offer · Request · Ack (ports 67/68 UDP)",en:"Discover · Offer · Request · Ack (ports 67/68 UDP)"},
      {k:"Starvation",fr:"épuise le pool → DoS — Yersinia, DHCPig",en:"exhausts the pool → DoS — Yersinia, DHCPig"},
      {k:"Rogue DHCP",fr:"faux serveur → gateway/DNS piégés → MitM",en:"fake server → malicious gateway/DNS → MitM"},
      {k:"Défense",fr:"DHCP snooping — ports untrusted par défaut",en:"DHCP snooping — ports untrusted by default"}]}
   ]},

  /* ---- 4. ARP ---- */
  {id:"arp", t:{fr:"ARP Poisoning",en:"ARP Poisoning"},
   s:{fr:"L'attaque MitM centrale du module",en:"The module's central MitM attack"},
   blocks:[
    {t:"h",fr:"Rappel : comment marche ARP",en:"Reminder: how ARP works"},
    {t:"p",fr:"**ARP** associe une IP à une **MAC**. Un hôte diffuse « qui a cette IP ? », le propriétaire répond avec sa MAC. Le problème central : **ARP n'a aucune authentification**. N'importe qui peut répondre en se faisant passer pour n'importe quelle IP — même **sans qu'on ait rien demandé** (c'est un **gratuitous ARP**).",
              en:"**ARP** maps an IP to a **MAC**. A host broadcasts \"who has this IP?\", the owner replies with its MAC. The core problem: **ARP has no authentication**. Anyone can reply claiming to be any IP — even **when nobody asked** (a **gratuitous ARP**)."},
    {t:"h",fr:"L'attaque en 6 temps",en:"The attack in 6 steps"},
    {t:"ol",items:[
      {fr:"L'utilisateur A veut joindre 10.1.1.1 et cherche sa MAC",en:"User A wants to reach 10.1.1.1 and looks up its MAC"},
      {fr:"A envoie une requête ARP",en:"A sends an ARP request"},
      {fr:"Le switch diffuse la requête",en:"The switch broadcasts the request"},
      {fr:"Le vrai B répond avec sa MAC (A1-B1-C1-D1-E1-F1)",en:"The real B replies with its MAC (A1-B1-C1-D1-E1-F1)"},
      {fr:"L'attaquant écoute l'échange",en:"The attacker eavesdrops on the exchange"},
      {fr:"L'attaquant envoie une fausse réponse : « 10.1.1.1 = ma MAC » → le cache ARP est empoisonné, le trafic part vers l'attaquant",en:"The attacker sends a forged reply: \"10.1.1.1 = my MAC\" → the ARP cache is poisoned, traffic goes to the attacker"}]},
    {t:"h",fr:"Rester transparent",en:"Staying transparent"},
    {t:"p",fr:"Le cache ARP expire (**~60 s sous Linux**, valeur aléatoire sous Windows) : les outils **renvoient en continu** de faux ARP. Il faut aussi activer l'**IP forwarding** pour relayer le trafic vers la vraie destination, sinon la victime perd sa connexion et remarque l'attaque.",
              en:"The ARP cache expires (**~60 s on Linux**, a random value on Windows): tools **continuously resend** forged ARP. You must also enable **IP forwarding** to relay traffic to the real destination, otherwise the victim loses connectivity and notices the attack."},
    {t:"cmd",lbl:"arpspoof / bettercap",lines:[
      ["echo 1 > /proc/sys/net/ipv4/ip_forward","{fr:active le forwarding|en:enable forwarding}"],
      ["arpspoof -i eth0 -c both -t 10.0.0.5 10.0.0.1","{fr:place l'attaquant entre la cible et la gateway|en:place attacker between target and gateway}"],
      ["habu.arp.poison 10.0.0.5 10.0.0.1","{fr:équivalent avec Habu|en:equivalent with Habu}"]]},
    {t:"h",fr:"Menaces débloquées",en:"Threats unlocked"},
    {t:"ul",items:[
      {fr:"**Packet sniffing** de tout le segment",en:"**Packet sniffing** of the whole segment"},
      {fr:"**Session hijacking** (vol de session valide)",en:"**Session hijacking** (stealing a valid session)"},
      {fr:"**VoIP call tapping** (via port mirroring)",en:"**VoIP call tapping** (via port mirroring)"}]},
    {t:"p",fr:"Outils : **bettercap, Ettercap, Bettercap, arpspoof (dsniff), Habu, RITM**.",
              en:"Tools: **bettercap, Ettercap, arpspoof (dsniff), Habu, RITM**."},
    {t:"h",fr:"Défense — Dynamic ARP Inspection (DAI)",en:"Defense — Dynamic ARP Inspection (DAI)"},
    {t:"p",fr:"Le switch inspecte chaque réponse ARP et la compare à la **table DHCP snooping**. Si aucune entrée ne correspond à l'IP source sur cette interface → le paquet est **rejeté**.",
              en:"The switch inspects each ARP reply and compares it against the **DHCP snooping table**. If no entry matches the source IP on that interface → the packet is **dropped**."},
    {t:"cmd",lbl:"Cisco IOS",lines:[
      ["ip arp inspection vlan 10","{fr:active DAI sur le VLAN|en:enable DAI on the VLAN}"],
      ["show ip arp inspection","{fr:état de la validation par VLAN|en:validation status per VLAN}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},
      fr:"DAI compare les réponses ARP à la **table DHCP snooping** (pas à la CAM). La défense ARP dépend donc du DHCP snooping activé au préalable.",
      en:"DAI compares ARP replies against the **DHCP snooping table** (not the CAM). ARP defense therefore relies on DHCP snooping being enabled first."},
    {t:"recap",items:[
      {k:"Faille",fr:"ARP sans authentification → gratuitous ARP",en:"ARP has no authentication → gratuitous ARP"},
      {k:"Transparence",fr:"resend continu + IP forwarding activé",en:"continuous resend + IP forwarding enabled"},
      {k:"Cache",fr:"expire ~60 s (Linux), aléatoire (Windows)",en:"expires ~60 s (Linux), random (Windows)"},
      {k:"Défense",fr:"DAI vs table DHCP snooping",en:"DAI vs DHCP snooping table"}]}
   ]},

  /* ---- 5. DNS ---- */
  {id:"dns", t:{fr:"DNS Poisoning",en:"DNS Poisoning"},
   s:{fr:"Rediriger les résolutions vers l'attaquant",en:"Redirect name resolution to the attacker"},
   blocks:[
    {t:"h",fr:"4 techniques",en:"4 techniques"},
    {t:"p",fr:"**Intranet DNS Spoofing** · **Internet DNS Spoofing** · **Proxy Server DNS Poisoning** · **DNS Cache Poisoning**.",
              en:"**Intranet DNS Spoofing** · **Internet DNS Spoofing** · **Proxy Server DNS Poisoning** · **DNS Cache Poisoning**."},
    {t:"h",fr:"Intranet DNS Spoofing",en:"Intranet DNS Spoofing"},
    {t:"p",fr:"Sur un LAN commuté, via **ARP poisoning** : l'attaquant doit être sur le LAN et pouvoir sniffer.",
              en:"On a switched LAN, via **ARP poisoning**: the attacker must be on the LAN and able to sniff."},
    {t:"ol",items:[
      {fr:"L'attaquant empoisonne le routeur (arpspoof/dnsspoof) et détourne les requêtes DNS",en:"The attacker poisons the router (arpspoof/dnsspoof) and hijacks DNS requests"},
      {fr:"Le client envoie sa requête DNS",en:"The client sends its DNS request"},
      {fr:"Le routeur empoisonné répond avec une **fausse IP** (site pirate)",en:"The poisoned router replies with a **fake IP** (attacker's site)"},
      {fr:"Le navigateur se connecte au faux site",en:"The browser connects to the fake site"},
      {fr:"L'attaquant sniffe les identifiants puis relaie vers le vrai site (MitM transparent)",en:"The attacker sniffs credentials then relays to the real site (transparent MitM)"}]},
    {t:"cmd",lbl:"Ettercap",lines:[
      ["# /etc/ettercap/etter.dns","{fr:fichier zone : nom, type, IP piégée|en:zone file: name, type, spoofed IP}"],
      ["plugin dns_spoof","{fr:active le spoof (ARP poisoning requis avant)|en:enable spoof (ARP poisoning required first)}"]]},
    {t:"note",k:{fr:"Pourquoi ça marche",en:"Why it works"},
      fr:"DNS repose sur **UDP** (sans handshake) : il suffit d'injecter une réponse **plus rapide** que le vrai serveur. Empoisonner le cache une fois suffit pour toute la durée du **TTL**.",
      en:"DNS runs over **UDP** (no handshake): just inject a reply **faster** than the real server. Poisoning the cache once lasts for the whole **TTL**."},
    {t:"h",fr:"Défense (points clés)",en:"Defense (key points)"},
    {t:"ul",items:[
      {fr:"Implémenter **DNSSEC** (signe cryptographiquement les réponses)",en:"Deploy **DNSSEC** (cryptographically signs responses)"},
      {fr:"Résoudre en interne, bloquer les requêtes DNS sortantes",en:"Resolve internally, block outbound DNS requests"},
      {fr:"**Port source aléatoire** par requête + rate-limiting NXDOMAIN",en:"**Random source port** per query + NXDOMAIN rate-limiting"},
      {fr:"Préférer **DNS over TCP**, SSH/SSL, ARP+IP statiques, IDS",en:"Prefer **DNS over TCP**, SSH/SSL, static ARP+IP, IDS"},
      {fr:"Auditer le serveur DNS régulièrement",en:"Audit the DNS server regularly"}]},
    {t:"recap",items:[
      {k:"4 types",fr:"Intranet · Internet · Proxy · Cache",en:"Intranet · Internet · Proxy · Cache"},
      {k:"Vecteur",fr:"UDP → réponse forgée plus rapide, dure le TTL",en:"UDP → faster forged reply, lasts the TTL"},
      {k:"Intranet",fr:"nécessite ARP poisoning préalable",en:"requires prior ARP poisoning"},
      {k:"Défense",fr:"DNSSEC, DNS over TCP, port source aléatoire",en:"DNSSEC, DNS over TCP, random source port"}]}
   ]},

  /* ---- 6. Autres spoofing ---- */
  {id:"spoof", t:{fr:"Autres attaques de spoofing",en:"Other spoofing attacks"},
   s:{fr:"MAC spoofing, VLAN hopping, STP",en:"MAC spoofing, VLAN hopping, STP"},
   blocks:[
    {t:"p",fr:"Au-delà de l'ARP, quatre techniques à retenir : **MAC Spoofing · IRDP Spoofing · VLAN Hopping · STP Attack**.",
              en:"Beyond ARP, four techniques to remember: **MAC Spoofing · IRDP Spoofing · VLAN Hopping · STP Attack**."},
    {t:"h",fr:"MAC Spoofing / Duplicating",en:"MAC Spoofing / Duplicating"},
    {t:"p",fr:"On sniffe les MAC des clients associés à un port, puis on **réutilise** l'une d'elles. Contourne la règle « autoriser si MAC = X » du switch **et** le filtrage MAC des points d'accès Wi-Fi.",
              en:"Sniff the MACs of clients on a port, then **reuse** one. Bypasses the switch's \"allow if MAC = X\" rule **and** Wi-Fi AP MAC filtering."},
    {t:"h",fr:"VLAN Hopping",en:"VLAN Hopping"},
    {t:"table",head:{fr:["Technique","Principe"],en:["Technique","Principle"]},rows:[
      [{fr:"Switch Spoofing",en:"Switch Spoofing"},{fr:"L'attaquant simule un switch et négocie un **trunk** non autorisé → accès à tous les VLAN.",en:"The attacker fakes a switch and negotiates an unauthorized **trunk** → access to all VLANs."}],
      [{fr:"Double Tagging",en:"Double Tagging"},{fr:"Deux tags 802.1Q (interne = VLAN cible, externe = VLAN natif). Le switch retire le tag externe et forwarde avec le tag interne. Ne marche que si les ports utilisent le VLAN natif.",en:"Two 802.1Q tags (inner = target VLAN, outer = native VLAN). The switch strips the outer tag and forwards with the inner tag. Only works if ports use the native VLAN."}]]},
    {t:"h",fr:"STP Attack",en:"STP Attack"},
    {t:"p",fr:"STP élit un **root bridge** via les **BPDU**, chacun portant un **BID** (Bridge Priority + MAC). Priorité par défaut = **32769**. L'attaquant branche un switch pirate avec **priorité = 0** → il devient root bridge → tout le trafic passe par lui.",
              en:"STP elects a **root bridge** via **BPDUs**, each carrying a **BID** (Bridge Priority + MAC). Default priority = **32769**. The attacker plugs in a rogue switch with **priority = 0** → becomes root bridge → all traffic flows through it."},
    {t:"cmd",lbl:"Cisco — défenses STP",lines:[
      ["spanning-tree portfast bpduguard","{fr:BPDU Guard : coupe le port si un BPDU arrive|en:BPDU Guard: shuts the port if a BPDU arrives}"],
      ["spanning-tree guard root","{fr:Root Guard : empêche un port de devenir root|en:Root Guard: stops a port becoming root}"]]},
    {t:"trap",k:{fr:"Piège d'examen",en:"Exam trap"},
      fr:"Priorité STP par défaut = **32769**. Un switch pirate met **priorité 0** pour gagner l'élection. **Root Guard** protège le root bridge ; **BPDU Guard** protège les ports d'accès.",
      en:"Default STP priority = **32769**. A rogue switch sets **priority 0** to win the election. **Root Guard** protects the root bridge; **BPDU Guard** protects access ports."},
    {t:"recap",items:[
      {k:"4 spoofing",fr:"MAC · IRDP · VLAN Hopping · STP",en:"MAC · IRDP · VLAN Hopping · STP"},
      {k:"VLAN hop",fr:"Switch Spoofing (trunk) / Double Tagging (2× 802.1Q)",en:"Switch Spoofing (trunk) / Double Tagging (2× 802.1Q)"},
      {k:"STP",fr:"BID = priorité+MAC, défaut 32769, rogue = 0",en:"BID = priority+MAC, default 32769, rogue = 0"},
      {k:"Défenses STP",fr:"BPDU Guard (accès) · Root Guard (root)",en:"BPDU Guard (access) · Root Guard (root)"}]}
   ]},

  /* ---- 7. Capture & analyse ---- */
  {id:"tools", t:{fr:"Capture & analyse",en:"Capture & analysis"},
   s:{fr:"tcpdump, tshark, Wireshark, BPF, SPAN/TAP",en:"tcpdump, tshark, Wireshark, BPF, SPAN/TAP"},
   blocks:[
    {t:"h",fr:"tcpdump",en:"tcpdump"},
    {t:"p",fr:"Capture en CLI (Linux/BSD ; équivalent Windows = **WinDump**). Idéal pour capturer vite et écrire dans un **PCAP** (format qui garde les métadonnées de session).",
              en:"CLI capture (Linux/BSD; Windows equivalent = **WinDump**). Ideal to capture fast and write a **PCAP** (format that keeps session metadata)."},
    {t:"cmd",lbl:"tcpdump",lines:[
      ["tcpdump -i eth0 -n","{fr:capture, sans résolution DNS|en:capture, no DNS resolution}"],
      ["tcpdump -vv -s 0","{fr:verbeux + paquet entier (voit les flags TCP)|en:verbose + full packet (shows TCP flags)}"],
      ["tcpdump -i eth0 -X","{fr:hexdump du payload|en:payload hexdump}"],
      ["tcpdump -w cap.pcap  /  -r cap.pcap","{fr:écrit / relit un PCAP|en:write / read a PCAP}"],
      ["tcpdump not port 22","{fr:filtre BPF : tout sauf SSH|en:BPF filter: all but SSH}"]]},
    {t:"h",fr:"BPF (Berkeley Packet Filter)",en:"BPF (Berkeley Packet Filter)"},
    {t:"p",fr:"Syntaxe de filtrage partagée par tcpdump, tshark et Wireshark. **Primitives** : `host`, `port`, `net`, `proto`, `ether` ; **modificateurs** : `src`, `dst` ; **logique** : `and`, `or`, `not`.",
              en:"Filtering syntax shared by tcpdump, tshark and Wireshark. **Primitives**: `host`, `port`, `net`, `proto`, `ether`; **modifiers**: `src`, `dst`; **logic**: `and`, `or`, `not`."},
    {t:"h",fr:"Wireshark",en:"Wireshark"},
    {t:"ul",items:[
      {fr:"**Follow TCP Stream** — reconstruit toute une session (mots de passe HTTP en clair)",en:"**Follow TCP Stream** — reassembles a whole session (cleartext HTTP passwords)"},
      {fr:"Décode **tous** les protocoles, ouvre les captures tcpdump/tshark",en:"Decodes **every** protocol, opens tcpdump/tshark captures"},
      {fr:"**Déchiffrement TLS** : clé RSA ou pre-master secret log (méthode moderne, DH éphémère)",en:"**TLS decryption**: RSA key or pre-master secret log (modern method, ephemeral DH)"},
      {fr:"Statistics → Protocol Hierarchy, Conversations, Expert Information",en:"Statistics → Protocol Hierarchy, Conversations, Expert Information"}]},
    {t:"h",fr:"Accéder au trafic sur un switch",en:"Getting traffic on a switch"},
    {t:"table",head:{fr:["Méthode","Détail"],en:["Method","Detail"]},rows:[
      [{fr:"Port Mirroring / SPAN",en:"Port Mirroring / SPAN"},{fr:"Copie le trafic de ports vers le port de monitoring (nom Cisco : SPAN). Choisir le port de la gateway. Risque d'**oversubscription** → pertes.",en:"Copies traffic from ports to the monitor port (Cisco name: SPAN). Pick the gateway port. **Oversubscription** risk → drops."}],
      [{fr:"Network TAP",en:"Network TAP"},{fr:"Boîtier matériel inline, passif : aucune config switch, aucune perte (dans sa capacité).",en:"Inline hardware device, passive: no switch config, no drops (within its rating)."}]]},
    {t:"h",fr:"sslstrip",en:"sslstrip"},
    {t:"p",fr:"Proxy transparent qui **downgrade HTTPS→HTTP** en réécrivant les liens. Nécessite un ARP poisoning en place. Marche jusqu'à **TLS 1.2** ; battu par **HSTS** et **TLS 1.3**.",
              en:"Transparent proxy that **downgrades HTTPS→HTTP** by rewriting links. Requires ARP poisoning in place. Works up to **TLS 1.2**; defeated by **HSTS** and **TLS 1.3**."},
    {t:"h",fr:"Analyse assistée par IA",en:"AI-assisted analysis"},
    {t:"p",fr:"Des plateformes appliquent le machine learning à grande échelle : **NetNerve** (renseignement de menace en clair), **AGILITY** (4G/5G), ou l'intégration dans **Scapy** en temps réel.",
              en:"Platforms apply ML at scale: **NetNerve** (plain-text threat intel), **AGILITY** (4G/5G), or integration into **Scapy** in real time."},
    {t:"recap",items:[
      {k:"CLI",fr:"tcpdump (Linux) / WinDump (Windows) / tshark",en:"tcpdump (Linux) / WinDump (Windows) / tshark"},
      {k:"PCAP",fr:"-w écrit, -r relit ; garde les métadonnées",en:"-w writes, -r reads; keeps metadata"},
      {k:"Follow TCP Stream",fr:"reconstruit une session complète",en:"reassembles a full session"},
      {k:"SPAN vs TAP",fr:"SPAN = config switch (pertes possibles) / TAP = matériel passif",en:"SPAN = switch config (possible drops) / TAP = passive hardware"},
      {k:"sslstrip",fr:"downgrade jusqu'à TLS 1.2, battu par HSTS/TLS 1.3",en:"downgrade up to TLS 1.2, beaten by HSTS/TLS 1.3"}]}
   ]},

  /* ---- 8. Détection ---- */
  {id:"detect", t:{fr:"Détection des sniffers",en:"Detecting sniffers"},
   s:{fr:"Trouver les cartes en mode promiscuous",en:"Finding NICs in promiscuous mode"},
   blocks:[
    {t:"p",fr:"Détecter un sniffer = trouver une interface en **mode promiscuous**. Trois méthodes réseau à connaître.",
              en:"Detecting a sniffer = finding an interface in **promiscuous mode**. Three network methods to know."},
    {t:"table",head:{fr:["Méthode","Fonctionnement"],en:["Method","How it works"]},rows:[
      [{fr:"Ping Method",en:"Ping Method"},{fr:"Envoyer un ping avec la **bonne IP mais une fausse MAC**. Une NIC normale rejette (MAC ≠) → pas de réponse. Une NIC en promiscuous ne filtre pas → **répond** = sniffer.",en:"Send a ping with the **correct IP but a wrong MAC**. A normal NIC rejects it (MAC mismatch) → no reply. A promiscuous NIC doesn't filter → **replies** = sniffer."}],
      [{fr:"DNS Method",en:"DNS Method"},{fr:"Beaucoup de sniffers font des **reverse DNS** sur les IP capturées. Une machine générant un fort trafic de reverse DNS est probablement en train de sniffer.",en:"Many sniffers do **reverse DNS** on captured IPs. A machine generating heavy reverse-DNS traffic is likely sniffing."}],
      [{fr:"ARP Method",en:"ARP Method"},{fr:"Envoyer un **ARP non-broadcast** à tous : seule la machine en promiscuous met l'info en cache. Puis un ping broadcast avec même IP / MAC différente : seule la machine ayant caché répond.",en:"Send a **non-broadcast ARP** to all: only the promiscuous machine caches it. Then a broadcast ping with same IP / different MAC: only the machine that cached it replies."}]]},
    {t:"p",fr:"Autres indices : un **volume anormal d'ARP** (gratuitous ARP, réponses non sollicitées) trahit un ARP spoofing. **arpwatch** alerte quand une MAC change d'IP. Outil de scan : **NetScanTools Pro** (Promiscuous Mode Scanner).",
              en:"Other clues: an **abnormal volume of ARP** (gratuitous ARP, unsolicited replies) betrays ARP spoofing. **arpwatch** alerts when a MAC changes IP. Scanning tool: **NetScanTools Pro** (Promiscuous Mode Scanner)."},
    {t:"warn",k:{fr:"Limite",en:"Limitation"},
      fr:"La Ping Method n'est **pas fiable à 100 %** : un switch peut refuser de forwarder une trame dont la MAC ne correspond à aucune entrée CAM.",
      en:"The Ping Method is **not 100% reliable**: a switch may refuse to forward a frame whose MAC matches no CAM entry."},
    {t:"recap",items:[
      {k:"Ping",fr:"bonne IP + fausse MAC → promiscuous répond quand même",en:"correct IP + wrong MAC → promiscuous replies anyway"},
      {k:"DNS",fr:"excès de reverse DNS",en:"excess reverse DNS"},
      {k:"ARP",fr:"ARP non-broadcast puis ping broadcast",en:"non-broadcast ARP then broadcast ping"},
      {k:"Outils",fr:"arpwatch, NetScanTools Pro",en:"arpwatch, NetScanTools Pro"}]}
   ]},

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={lang:"fr",view:"mod",mod:1,query:""};
const modByN=n=>MODULES.find(m=>m.n===n);
const L=o=>!o?"":(typeof o==="string"?o:(o[state.lang]??o.fr??""));
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
/* inline **bold** and `code` */
function md(s){return esc(L(s)).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+?)\*/g,"<em>$1</em>").replace(/`([^`]+?)`/g,"<code>$1</code>");}
/* parse cmd line note "{fr:...|en:...}" */
function cmdNote(n){const m=/\{fr:([^|]*)\|en:([^}]*)\}/.exec(n);return m?(state.lang==="fr"?m[1]:m[2]):n;}

/* ---- rail ---- */
function buildRail(){
  const box=$("#modlist");box.innerHTML="";
  ALL_MODS.forEach(n=>{

/* ---- render dispatch ---- */
function render(){
  $$(".navi").forEach(b=>b.setAttribute("aria-current","false"));
  if(state.view==="mod"){const el=$(`.navi[data-mod="${state.mod}"]`);if(el)el.setAttribute("aria-current","true");}

/* ---- module ---- */
function blockHTML(b){
  switch(b.t){
    case"h":return `<h3>${md(b)}</h3>`;
    case"p":return `<p>${md(b)}</p>`;
    case"ul":return `<ul>${b.items.map(i=>`<li>${md(i)}</li>`).join("")}</ul>`;
    case"ol":return `<ol>${b.items.map(i=>`<li>${md(i)}</li>`).join("")}</ol>`;
    case"table":return `<div class="tblwrap"><table><thead><tr>${(state.lang==="fr"?b.head.fr:b.head.en).map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case"cmd":return `<div class="cmd"><div class="cbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="lbl">${esc(b.lbl||"")}</span></div><pre>${b.lines.map(([c,n])=>`<span class="p">$</span> ${esc(c)}${n?`  <span class="c"># ${esc(cmdNote(n))}</span>`:""}`).join("\n")}</pre></div>`;
    case"trap":case"warn":case"note":return `<div class="call ${b.t}"><span class="k">${esc(L(b.k))}</span><p>${md(b)}</p></div>`;
    case"recap":return `<div class="recap"><div class="k">✦ ${state.lang==="fr"?"À retenir":"Keep in mind"}</div><div class="grid">${b.items.map(i=>`<div><b>${esc(i.k)}</b><span>${md(i)}</span></div>`).join("")}</div></div>`;
    default:return"";
  }
}
function renderModule(){

        <button class="btn pri" id="openQuiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>${esc(L(UI.quizmod))}</button>
      </div>
    </div>
    ${toc}
    <div class="col">${cards}</div>`;
  $("#openCheat").onclick=()=>openCheat(m);
  $("#openQuiz").onclick=()=>openQuiz(m);
  wireToc();
}
function wireToc(){
  const links=$$(".toc a"), cards=$$(".card");
  $$(".toc a").forEach(a=>a.onclick=e=>{e.preventDefault();const c=$("#"+a.getAttribute("href").slice(1));if(c){c.open=true;c.scrollIntoView({behavior:"smooth",block:"start"});}});
  const sc=$("#scroller");
  sc.onscroll=()=>{
    let cur=0;cards.forEach((c,i)=>{if(c.getBoundingClientRect().top<160)cur=i;});
    links.forEach((a,i)=>a.classList.toggle("on",i===cur));
  };
  sc.onscroll();
}

/* ---- quiz ---- */
let qz={};
function openQuiz(m){
  qz={m,pool:m.quiz||[],idx:0,score:0,answered:false,questions:[]};
  $("#quizTitle").textContent=(state.lang==="fr"?"Quiz · Module ":"Quiz · Module ")+String(m.n).padStart(2,"0");
  $("#quizMeta").textContent=L(m.t);
  renderQuizSetup();
  openModal("#quizModal");
}
function renderQuizSetup(){
  const total=qz.pool.length;
  const sizes=[10,20].filter(n=>n<=total);if(!sizes.length||sizes[sizes.length-1]!==total)sizes.push(total);
  const ext=EXTERNAL_QUIZ.modules[qz.m.n];
  const extBtn=(ext&&ext!=="INSERER_URL_ICI")?`<p style="margin-top:20px"><a href="${esc(ext)}" target="_blank" rel="noopener">↗ ${esc(L(UI.quizExt))}</a></p>`:"";
  $("#quizBody").innerHTML=`<div class="quiz-setup"><h3>${esc(L(UI.chooselen))}</h3><p>${esc(L(UI.quizintro))}</p>
    <div class="sizes">${[...new Set(sizes)].map(n=>`<button data-n="${n}">${n} ${esc(L(UI.questions))}</button>`).join("")}</div>${extBtn}</div>`;
  $$("#quizBody [data-n]").forEach(b=>b.onclick=()=>startQuiz(+b.dataset.n));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(n){
  qz.questions=shuffle(qz.pool).slice(0,n).map(q=>{
    const opts=q.opts.map((o,i)=>({o,correct:i===q.a}));
    return {q:q.q,ex:q.ex,opts:shuffle(opts)};
  });
  qz.idx=0;qz.score=0;renderQ();
}
function renderQ(){
  const q=qz.questions[qz.idx];if(!q)return renderQuizRes();
  qz.answered=false;
  const pct=Math.round(qz.idx/qz.questions.length*100);
  $("#quizMeta").textContent=`${L(UI.qof)} ${qz.idx+1}/${qz.questions.length} · ${L(UI.score)} ${qz.score}`;
  $("#quizBody").innerHTML=`<div class="qbar"><i style="width:${pct}%"></i></div>
    <div class="qq">${esc(L(q.q))}</div>
    <div class="qopts">${q.opts.map((o,i)=>`<button class="qopt" data-i="${i}"><span class="kk">${i+1}</span><span>${esc(L(o.o))}</span></button>`).join("")}</div>
    <div class="qfb" id="qfb"></div>
    <div class="qact"><button class="qnext" id="qnext" hidden>${qz.idx+1===qz.questions.length?esc(L(UI.seeresult)):esc(L(UI.nextq))}</button></div>`;
  $$("#quizBody .qopt").forEach(b=>b.onclick=()=>answerQ(+b.dataset.i));
}
function answerQ(i){
  if(qz.answered)return;qz.answered=true;
  const q=qz.questions[qz.idx];
  const btns=$$("#quizBody .qopt");
  btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j].correct)b.classList.add("correct");else if(j===i)b.classList.add("wrong");});
  const ok=q.opts[i].correct;if(ok)qz.score++;
  const correct=q.opts.find(o=>o.correct).o;
  const fb=$("#qfb");fb.classList.add("on");
  fb.innerHTML=`<b>${ok?esc(L(UI.good)):esc(L(UI.expected))+" "+esc(L(correct))}</b><br>${esc(L(q.ex))}`;
  const nx=$("#qnext");nx.hidden=false;nx.onclick=()=>{qz.idx++;renderQ();};
}
function renderQuizRes(){
  const t=qz.questions.length,pct=t?Math.round(qz.score/t*100):0;
  $("#quizMeta").textContent=`${qz.score}/${t}`;
  $("#quizBody").innerHTML=`<div class="qres"><div class="score">${pct}%</div>
    <h3>${qz.score} ${esc(L(UI.correctof))} ${t}</h3>
    <button class="again" id="qagain">${esc(L(UI.restart))}</button></div>`;
  $("#qagain").onclick=()=>renderQuizSetup();
}

  if(e.key==="Escape")closeModal();
  if($("#quizModal").classList.contains("on")&&!qz.answered&&["1","2","3","4"].includes(e.key)){
    const b=$(`#quizBody .qopt[data-i="${+e.key-1}"]`);if(b)b.click();
  }
  if($("#quizModal").classList.contains("on")&&qz.answered&&e.key==="Enter"){const n=$("#qnext");if(n)n.click();}
});

/* ---- lang & theme ---- */
function applyLang(){
  document.documentElement.lang=state.lang;document.documentElement.dataset.lang=state.lang;
  $$("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(UI[k])el.textContent=L(UI[k]);});
  $$("[data-i18n-ph]").forEach(el=>{const k=el.dataset.i18nPh;if(UI[k])el.placeholder=L(UI[k]);});
  $$("#langTgl button").forEach(b=>b.classList.toggle("on",b.dataset.lang===state.lang));
  buildRail();render();
}
$$(".navi[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();closeRail();});
$$("#langTgl button").forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem("ceh-lang",state.lang);applyLang();});
$("#themeBtn").onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"light":"dark";
  localStorage.setItem("ceh-theme",dark?"light":"dark");setThemeIcon();
};
function setThemeIcon(){
  const dark=document.documentElement.dataset.theme==="dark";
  $("#themeIcon").innerHTML=dark
    ?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    :'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
}

/* ---- search (simple) ---- */
/* ---- global search across all modules + ports + tools ---- */
function blockText(b){
  let t="";const add=x=>{t+=" "+L(x);};
  switch(b.t){
    case"h":case"p":case"trap":case"warn":case"note": t+=" "+L(b); if(b.k)t+=" "+L(b.k); break;
    case"ul":case"ol": (b.items||[]).forEach(add); break;
    case"table": if(b.head){t+=" "+b.head.fr.join(" ")+" "+b.head.en.join(" ");} (b.rows||[]).forEach(r=>r.forEach(add)); break;
    case"cmd": (b.lines||[]).forEach(([c,n])=>{t+=" "+c+(n?" "+cmdNote(n):"");}); break;
    case"recap": (b.items||[]).forEach(i=>{t+=" "+i.k+" "+L(i);}); break;
  }
  return t;
}
function cardSearchText(c){return (L(c.t)+" "+L(c.s)+" "+c.blocks.map(blockText).join(" ")).toLowerCase();}
function hi(txt,q){const i=txt.toLowerCase().indexOf(q);if(i<0)return esc(txt.slice(0,120));const a=Math.max(0,i-40);return (a>0?"…":"")+esc(txt.slice(a,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length,i+q.length+70))+"…";}
function renderSearch(q){
  const v=$("#view");
  const modHits=[];
  MODULES.slice().sort((a,b)=>a.n-b.n).forEach(m=>m.cards.forEach((c,i)=>{const tx=cardSearchText(c);if(tx.includes(q))modHits.push({m,c,i,tx});}));
  const portHits=PORTS.filter(p=>(p[0]+" "+p[1]+" "+L(p[3])).toLowerCase().includes(q)).sort((a,b)=>(+a[0])-(+b[0]));
  const toolHits=[];TOOLS.forEach(f=>f.items.forEach(it=>{const tx=(it.name+" "+L(it.desc)+" "+(it.cmds||[]).map(x=>x[0]+" "+cmdNote(x[1]||"")).join(" ")).toLowerCase();if(tx.includes(q))toolHits.push({f,it,tx});}));
  const total=modHits.length+portHits.length+toolHits.length;
  const lbl=state.lang==="fr"?{res:"résultat",res2:"résultats",mods:"Modules",ports:"Ports & services",tools:"Outils & commandes",none:"Aucun résultat pour",for:"pour"}:{res:"result",res2:"results",mods:"Modules",ports:"Ports & services",tools:"Tools & commands",none:"No results for",for:"for"};
  if(!total){v.innerHTML=`<div class="srempty"><h2 style="font-size:20px;color:var(--ink-soft)">${esc(lbl.none)} « ${esc(q)} »</h2></div>`;return;}
  let html=`<div class="searchwrap"><h1>${total} ${total>1?esc(lbl.res2):esc(lbl.res)} ${esc(lbl.for)} « ${esc(q)} »</h1><div class="sub">${modHits.length} · ${portHits.length} ports · ${toolHits.length} outils</div>`;
  if(modHits.length){
    html+=`<div class="srgrp"><div class="gh">${esc(lbl.mods)}</div>`;
    html+=modHits.slice(0,60).map(h=>`<button class="sr" data-mod="${h.m.n}" data-card="${h.i}"><span class="m">MODULE ${String(h.m.n).padStart(2,"0")} · ${esc(L(h.m.t))}</span><div class="t">${esc(L(h.c.t))}</div><span class="x">${hi(h.tx,q)}</span></button>`).join("");
    html+=`</div>`;
  }
  if(portHits.length){
    html+=`<div class="srgrp"><div class="gh">${esc(lbl.ports)}</div>`;
    html+=portHits.slice(0,40).map(p=>`<button class="sr" data-view="ports"><span class="m">${p[0]} · ${esc(p[1])} · ${p[2].toUpperCase()}</span><div class="t">${esc(L(p[3]))}</div></button>`).join("");
    html+=`</div>`;
  }
  if(toolHits.length){
    html+=`<div class="srgrp"><div class="gh">${esc(lbl.tools)}</div>`;
    html+=toolHits.slice(0,40).map(h=>`<button class="sr" data-view="tools"><span class="m">${esc(L(h.f.fam))}</span><div class="t">${esc(h.it.name)}</div><span class="x">${esc(L(h.it.desc))}</span></button>`).join("");
    html+=`</div>`;
  }
  html+=`</div>`;
  v.innerHTML=html;
  $$("#view .sr[data-mod]").forEach(b=>b.onclick=()=>{state.view="mod";state.mod=+b.dataset.mod;render();const ci=+b.dataset.card;setTimeout(()=>{const el=document.getElementById("c"+ci);if(el){document.querySelectorAll(".card").forEach(c=>c.open=false);el.open=true;el.scrollIntoView({behavior:"smooth",block:"start"});}},80);});
  $$("#view .sr[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();});
}
let _searchTimer=null;
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  clearTimeout(_searchTimer);
  if(q.length<2){render();return;}
  _searchTimer=setTimeout(()=>renderSearch(q),120);
});

/* ---- mobile rail ---- */
function closeRail(){$("#rail").classList.remove("open");$("#scrim").classList.remove("on");}
$("#menuBtn").onclick=()=>{$("#rail").classList.add("open");$("#scrim").classList.add("on");};
$("#scrim").onclick=closeRail;

/* ---- init ---- */
state.lang=localStorage.getItem("ceh-lang")||"fr";
document.documentElement.dataset.theme=localStorage.getItem("ceh-theme")||"light";
setThemeIcon();applyLang();
</script>
