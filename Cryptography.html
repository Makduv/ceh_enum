<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Cryptography — 500 Unique Direct Questions</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"fact_id":"d.pq2","concept_id":"d.pq2","variant":1,"category":"Countermeasures & Cryptography Tools","topic":"Post-Quantum Countermeasures","question":"What should protect long-lived stored data against future quantum adversaries?","choices":["Quantum-capable TPMs","Quantum-specific firewalls","Quantum-resistant encryption","Quantum-resistant DLT"],"answer":"Quantum-resistant encryption","explanation":"Quantum-resistant encryption is listed in the supplied post-quantum countermeasures.","id":"S01Q01"},{"fact_id":"c.drownreq","concept_id":"c.drownreq","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Specific Attacks","question":"What configuration can make a server vulnerable to DROWN?","choices":["TLS 1.3 only","OCSP stapling","SSLv2 support or private-key reuse with an SSLv2 server","AES-256 only"],"answer":"SSLv2 support or private-key reuse with an SSLv2 server","explanation":"DROWN relies on obsolete SSLv2 behavior tied to the same RSA key.","id":"S01Q02"},{"fact_id":"c.birthprob","concept_id":"c.birthprob","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Attack Reasoning","question":"Why can collisions appear sooner than a full hash-output search would suggest?","choices":["All hashes use 23 bits","Hashes are reversible","Birthday-paradox probability grows with pairs of inputs","Certificates reuse keys"],"answer":"Birthday-paradox probability grows with pairs of inputs","explanation":"Collision search benefits from comparing many possible pairs.","id":"S01Q03"},{"fact_id":"h.luks","concept_id":"h.luks","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"Disk Encryption","question":"What does LUKS primarily add on top of dm-crypt?","choices":["Certificate revocation","Standardized header and key-slot management","Hash collision detection","TLS negotiation"],"answer":"Standardized header and key-slot management","explanation":"Standardized header and key-slot management follows the disk-encryption material.","id":"S01Q04"},{"fact_id":"f.key.AES","concept_id":"f.key.AES","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Algorithms","question":"What key size is associated with AES in the CEH table?","choices":["128, 192, or 256 bits","32–448 bits","256 bits","256, 512, or 1024 bits"],"answer":"128, 192, or 256 bits","explanation":"The supplied table lists AES with 128, 192, or 256 bits keys.","id":"S01Q05"},{"fact_id":"c.integralconst","concept_id":"c.integralconst","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Attack Reasoning","question":"What happens to the remaining plaintext bits during integral cryptanalysis?","choices":["They are deleted","They are held constant","They become public keys","They are hashed with MD5"],"answer":"They are held constant","explanation":"Integral sets keep some bits fixed.","id":"S01Q06"},{"fact_id":"f.key.Salsa20","concept_id":"f.key.Salsa20","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Algorithms","question":"What key size is associated with Salsa20 in the CEH table?","choices":["128, 192, or 256 bits","256 bits","128 bits","112 or 168 bits"],"answer":"256 bits","explanation":"The supplied table lists Salsa20 with 256 bits keys.","id":"S01Q07"},{"fact_id":"h.size.SHA-2","concept_id":"h.size.SHA-2","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"Hash Algorithms","question":"What digest size is associated with SHA-2 in the CEH table?","choices":["224–512 bits","256 or 512 bits","128 bits","160 bits"],"answer":"224–512 bits","explanation":"The supplied table lists SHA-2 with a 224–512 bits output.","id":"S01Q08"},{"fact_id":"d.fvrec","concept_id":"d.fvrec","variant":1,"category":"Countermeasures & Cryptography Tools","topic":"Tools & Commands","question":"Which encryption algorithm does FileVault use for volume encryption?","choices":["RC4","AES","3DES","Blowfish"],"answer":"AES","explanation":"The supplemental notes state that FileVault uses AES to encrypt volumes.","id":"S01Q09"},{"fact_id":"a.tlscert","concept_id":"a.tlscert","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"TLS","question":"What does the server send so the client can authenticate its public key?","choices":["Server certificate","ClientHello","ChangeCipherSpec","Session keys"],"answer":"Server certificate","explanation":"This is the role of that TLS handshake element.","id":"S01Q10"},{"fact_id":"d.stretch","concept_id":"d.stretch","variant":1,"category":"Countermeasures & Cryptography Tools","topic":"Key Stretching","question":"What is the purpose of key stretching?","choices":["Shorten hashes","Remove salts","Make encryption deterministic","Make password guessing more computationally expensive"],"answer":"Make password guessing more computationally expensive","explanation":"Make password guessing more computationally expensive follows the key-stretching material.","id":"S01Q11"},{"fact_id":"c.qgates","concept_id":"c.qgates","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Quantum Cryptanalysis","question":"What quantum resource counts the operations in a circuit?","choices":["Number of gates","Certificate chains","Key escrow entries","Padding bytes"],"answer":"Number of gates","explanation":"Number of gates is part of the quantum-cryptanalysis material.","id":"S01Q12"},{"fact_id":"a.rsa.basis","concept_id":"a.rsa.basis","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"RSA","question":"What mathematical problem underpins RSA security?","choices":["Frequency analysis","Elliptic-curve discrete logarithms","Hash collisions","Factoring large integers"],"answer":"Factoring large integers","explanation":"This follows the RSA material in the supplied notes.","id":"S01Q13"},{"fact_id":"a.dsa.sign","concept_id":"a.dsa.sign","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"DSA","question":"Which key does DSA use for signature generation?","choices":["Public key","IV","Private key","Session key"],"answer":"Private key","explanation":"DSA signs with the private key.","id":"S01Q14"},{"fact_id":"h.smime.cert","concept_id":"h.smime.cert","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"PGP & S/MIME","question":"What certificate format is used by S/MIME?","choices":["X.509","ROT13","CRL only","PGP keyring"],"answer":"X.509","explanation":"X.509 follows the supplied PGP/S-MIME material.","id":"S01Q15"},{"fact_id":"d.tpmhsm","concept_id":"d.tpmhsm","variant":1,"category":"Countermeasures & Cryptography Tools","topic":"Defense Reasoning","question":"What is the common security goal shared by TPMs and HSMs?","choices":["Provide DNS resolution","Replace hashing","Perform email routing","Protect cryptographic keys in dedicated hardware"],"answer":"Protect cryptographic keys in dedicated hardware","explanation":"Protect cryptographic keys in dedicated hardware is the relevant security rationale.","id":"S01Q16"},{"fact_id":"f.3deseff","concept_id":"f.3deseff","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Algorithms","question":"Why is 3DES effective strength closer to 112 bits than 168 bits?","choices":["Its block is 168 bits","It uses one key only","AES padding removes bits","Meet-in-the-middle style attacks"],"answer":"Meet-in-the-middle style attacks","explanation":"Multiple-key attacks reduce its effective strength.","id":"S01Q17"},{"fact_id":"d.hashsize","concept_id":"d.hashsize","variant":1,"category":"Countermeasures & Cryptography Tools","topic":"Core Countermeasures","question":"What minimum hash length does the CEH checklist recommend?","choices":["128 bits","64 bits","160 bits","256 bits"],"answer":"256 bits","explanation":"The checklist recommends 256-bit or larger hashes.","id":"S01Q18"},{"fact_id":"c.a.mitm","concept_id":"c.a.mitm","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Attack Models","question":"Which cryptographic attack applies when the attacker interposes during a public-key exchange?","choices":["Chosen-key Attack","Ciphertext-only Attack","Chosen-ciphertext Attack","Man-in-the-Middle Attack"],"answer":"Man-in-the-Middle Attack","explanation":"Man-in-the-Middle Attack matches that attacker capability.","id":"S01Q19"},{"fact_id":"a.rsa.min","concept_id":"a.rsa.min","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"RSA","question":"What RSA key size is the minimum recommended in the supplied notes?","choices":["1024 bits","128 bits","2048 bits","512 bits"],"answer":"2048 bits","explanation":"This follows the RSA material in the supplied notes.","id":"S01Q20"},{"fact_id":"f.block.AES","concept_id":"f.block.AES","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Algorithms","question":"What block size is associated with AES?","choices":["64 bits","32, 64, or 128 bits","128 bits","256, 512, or 1024 bits"],"answer":"128 bits","explanation":"The supplied table lists a 128 bits block size.","id":"S01Q21"},{"fact_id":"h.fed","concept_id":"h.fed","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"Blockchain","question":"Which blockchain type is managed by a group of predetermined trusted nodes?","choices":["Federated/Consortium Blockchain","Hybrid Blockchain","Public Blockchain","Private Blockchain"],"answer":"Federated/Consortium Blockchain","explanation":"Federated/Consortium Blockchain matches the supplied blockchain description.","id":"S01Q22"},{"fact_id":"c.freqenglish","concept_id":"c.freqenglish","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Code Breaking","question":"Why does frequency analysis work better against monoalphabetic substitution than Vigenère?","choices":["Vigenère has no key","Single substitutions preserve language frequency patterns more clearly","Caesar uses public keys","Vigenère hashes each letter"],"answer":"Single substitutions preserve language frequency patterns more clearly","explanation":"Polyalphabetic substitution flattens simple frequency patterns.","id":"S01Q23"},{"fact_id":"h.size.SHA-0","concept_id":"h.size.SHA-0","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"Hash Algorithms","question":"What digest size is associated with SHA-0 in the CEH table?","choices":["224–512 bits","160 bits","512 bits","256 or 512 bits"],"answer":"160 bits","explanation":"The supplied table lists SHA-0 with a 160 bits output.","id":"S01Q24"},{"fact_id":"c.qwidth","concept_id":"c.qwidth","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Quantum Cryptanalysis","question":"What quantum resource measures how many qubits a circuit uses simultaneously?","choices":["Circuit width","Circuit depth","T-depth","Gate count"],"answer":"Circuit width","explanation":"Circuit width is part of the quantum-cryptanalysis material.","id":"S01Q25"},{"fact_id":"h.digest","concept_id":"h.digest","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"Hashing Basics","question":"What is another common name for a hash output?","choices":["Ciphertext","Nonce","Digest","Certificate"],"answer":"Digest","explanation":"Digest and fingerprint are common hash-output terms.","id":"S01Q26"},{"fact_id":"f.nonrep","concept_id":"f.nonrep","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Objectives","question":"Which cryptographic objective prevents a signer from credibly denying a signed message?","choices":["Confidentiality","Nonrepudiation","Integrity","Authentication"],"answer":"Nonrepudiation","explanation":"Nonrepudiation is one of the four cryptographic objectives.","id":"S01Q27"},{"fact_id":"a.emailcompare","concept_id":"a.emailcompare","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"Email Signatures","question":"What proves that the received email content was not modified after signing?","choices":["Recipient private key is transmitted","Certificate serial changes","Session key is public","Recomputed hash matches the signed hash"],"answer":"Recomputed hash matches the signed hash","explanation":"Verification recomputes the message hash and compares it to the signed digest.","id":"S01Q28"},{"fact_id":"a.eq2","concept_id":"a.eq2","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"ECC","question":"Which ECC key size is listed as roughly equivalent to 3072-bit RSA?","choices":["384 bits","160 bits","256 bits","224 bits"],"answer":"256 bits","explanation":"The supplemental notes provide this equivalence.","id":"S01Q29"},{"fact_id":"d.threshold","concept_id":"d.threshold","variant":1,"category":"Countermeasures & Cryptography Tools","topic":"Defense Reasoning","question":"What security benefit does threshold cryptography provide?","choices":["It replaces hashing","It makes keys public","No single party/share can exercise full key authority alone","It removes encryption"],"answer":"No single party/share can exercise full key authority alone","explanation":"Threshold schemes distribute control across multiple shares.","id":"S01Q30"},{"fact_id":"a.fingerprint","concept_id":"a.fingerprint","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"Certificates","question":"What is a certificate fingerprint?","choices":["CRL list","Fixed-length hash identifying certificate data","Session key","Private key itself"],"answer":"Fixed-length hash identifying certificate data","explanation":"Fingerprints are hashes used to identify certificate material.","id":"S01Q31"},{"fact_id":"h.smime.trust","concept_id":"h.smime.trust","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"PGP & S/MIME","question":"What trust model does S/MIME normally use?","choices":["Root store","Certificate Authority","Key escrow","Web of Trust"],"answer":"Certificate Authority","explanation":"Certificate Authority follows the supplied PGP/S-MIME material.","id":"S01Q32"},{"fact_id":"c.a.adapt","concept_id":"c.a.adapt","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Attack Models","question":"Which cryptographic attack applies when the attacker chooses new plaintexts based on results of earlier encryption queries?","choices":["Chosen-plaintext Attack","Timing Attack","Man-in-the-Middle Attack","Adaptive Chosen-plaintext Attack"],"answer":"Adaptive Chosen-plaintext Attack","explanation":"Adaptive Chosen-plaintext Attack matches that attacker capability.","id":"S01Q33"},{"fact_id":"f.key.Twofish","concept_id":"f.key.Twofish","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Algorithms","question":"What key size is associated with Twofish in the CEH table?","choices":["56 bits","128, 192, or 256 bits","256 bits","112 or 168 bits"],"answer":"128, 192, or 256 bits","explanation":"The supplied table lists Twofish with 128, 192, or 256 bits keys.","id":"S01Q34"},{"fact_id":"f.caesar","concept_id":"f.caesar","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Classical Ciphers","question":"Which cipher rotates every alphabet character by a fixed number of positions?","choices":["Vigenère cipher","Caesar cipher","One-Time Pad","ROT13"],"answer":"Caesar cipher","explanation":"Caesar is a monoalphabetic rotation cipher.","id":"S01Q35"},{"fact_id":"a.record1","concept_id":"a.record1","variant":1,"category":"Asymmetric Cryptography, PKI & TLS","topic":"TLS","question":"Which TLS Record function may reduce data size before protection?","choices":["MAC/integrity processing","Fragmentation/reassembly","Optional compression","Encryption/decryption"],"answer":"Optional compression","explanation":"The TLS Record Protocol performs this function.","id":"S01Q36"},{"fact_id":"f.aesrep","concept_id":"f.aesrep","variant":1,"category":"Fundamentals & Symmetric Cryptography","topic":"Algorithms","question":"Which modern symmetric standard replaced DES?","choices":["Camellia","TEA","CAST-128","AES"],"answer":"AES","explanation":"AES replaced DES.","id":"S01Q37"},{"fact_id":"c.a.cp","concept_id":"c.a.cp","variant":1,"category":"Cryptanalysis & Cryptographic Attacks","topic":"Attack Models","question":"Which cryptographic attack applies when the attacker chooses plaintexts and observes the resulting ciphertexts?","choices":["Chosen-plaintext Attack","Adaptive Chosen-plaintext Attack","Known-plaintext Attack","Dictionary Attack"],"answer":"Chosen-plaintext Attack","explanation":"Chosen-plaintext Attack matches that attacker capability.","id":"S01Q38"},{"fact_id":"h.tpmplain","concept_id":"h.tpmplain","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"Disk Encryption","question":"What TPM property protects stored keys from direct extraction?","choices":["Keys need not leave the chip in plaintext","Keys are emailed to users","Keys are browser cookies","Keys are published in DNS"],"answer":"Keys need not leave the chip in plaintext","explanation":"Keys need not leave the chip in plaintext follows the disk-encryption material.","id":"S01Q39"},{"fact_id":"d.pq6","concept_id":"d.pq6","variant":1,"category":"Countermeasures & Cryptography Tools","topic":"Post-Quantum Countermeasures","question":"What technique lets parties compute jointly without revealing all private inputs?","choices":["Quantum-safe RBAC/ABAC","Quantum-resistant encryption","Layered isolation","Secure multi-party computation"],"answer":"Secure multi-party computation","explanation":"Secure multi-party computation is listed in the supplied post-quantum countermeasures.","id":"S01Q40"},{"fact_id":"h.removed","concept_id":"h.removed","variant":1,"category":"Hashing, PGP, Disk Encryption & Blockchain","topic":"Disk Encryption","question":"Why does FDE protect a disk even if it is physically removed from the computer?","choices":["CA blocks SATA","Disk erases itself","Filesystem becomes public","Contents remain ciphertext without the key"],"answer":"Contents remain ciphertext without the key"," const STORAGE_KEY = "ceh-v13-cryptography-500-unique-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Cryptography — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Cryptography (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Cryptography (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
