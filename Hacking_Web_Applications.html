<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Module 14 — Hacking Web Applications — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"fact_id":"m.purpose.foot","concept_id":"m.purpose.foot","variant":1,"category":"Hacking Methodology & Tools","topic":"Methodology","question":"Which methodology activity discovers web servers, DNS information, ports, and exposed services?","choices":["Footprint Web Infrastructure","Attack Session Management","Attack Web Services","Attack Access Controls"],"answer":"Footprint Web Infrastructure","explanation":"Footprinting identifies the target infrastructure and exposed attack surface.","id":"S01Q01"},{"fact_id":"s.modsec.phase1","concept_id":"s.modsec.phase1","variant":1,"category":"Security Techniques & Countermeasures","topic":"WAF","question":"What does mod_security phase 1 inspect or perform?","choices":["Response headers","Response body","Logging","Request headers"],"answer":"Request headers","explanation":"Phase 1 is Request headers.","id":"S01Q02"},{"fact_id":"t.sqli.effect","concept_id":"t.sqli.effect","variant":1,"category":"Web Application Threats","topic":"SQL Injection","question":"Which outcome is possible when SQL injection changes the intended database query?","choices":["Authentication bypass","ARP aging","RF jamming","Certificate pinning"],"answer":"Authentication bypass","explanation":"SQLi can alter queries to bypass authentication or access data.","id":"S01Q03"},{"fact_id":"t.forced.tools","concept_id":"t.forced.tools","variant":1,"category":"Web Application Threats","topic":"Access Control","question":"Which tool is commonly used for forced browsing and directory enumeration?","choices":["Gobuster","Wappalyzer","Burp Sequencer","WAFW00F"],"answer":"Gobuster","explanation":"Gobuster enumerates directories and files.","id":"S01Q04"},{"fact_id":"c.owasp.num.7","concept_id":"c.owasp.num.7","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Top 10","question":"Which OWASP 2021 category is A07?","choices":["Software and Data Integrity Failures","Insecure Design","Security Misconfiguration","Identification and Authentication Failures"],"answer":"Identification and Authentication Failures","explanation":"A07 is Identification and Authentication Failures.","id":"S01Q05"},{"fact_id":"t.samesite.data","concept_id":"t.samesite.data","variant":1,"category":"Web Application Threats","topic":"Same-Site","question":"What is the ultimate security impact highlighted for a successful Same-Site Attack?","choices":["DNSSEC validation","User data theft","Automatic patching","Code signing"],"answer":"User data theft","explanation":"The course example ends with the attacker stealing user data.","id":"S01Q06"},{"fact_id":"t.timing.direct","concept_id":"t.timing.direct","variant":1,"category":"Web Application Threats","topic":"Timing","question":"What timing attack measures server processing time for requests to infer information such as username existence?","choices":["Cross-site Timing Attack","Browser-based Timing Attack","Blind SQL Injection","Direct Timing Attack"],"answer":"Direct Timing Attack","explanation":"Direct timing attacks measure server response time directly.","id":"S01Q07"},{"fact_id":"m.purpose.inject","concept_id":"m.purpose.inject","variant":1,"category":"Hacking Methodology & Tools","topic":"Methodology","question":"Which methodology activity covers SQL, command, LDAP, and script injection?","choices":["Perform Injection Attacks","Analyze Web Applications","Attack Web Services","Attack Web Application Clients"],"answer":"Perform Injection Attacks","explanation":"Injection testing targets interpreters with untrusted input.","id":"S01Q08"},{"fact_id":"t.timing.browser","concept_id":"t.timing.browser","variant":1,"category":"Web Application Threats","topic":"Timing","question":"What timing attack exploits browser side-channel timing such as cache or resource processing?","choices":["Direct Timing Attack","Blind SQL Injection","Cross-site Timing Attack","Browser-based Timing Attack"],"answer":"Browser-based Timing Attack","explanation":"Browser-based timing uses client-side timing side channels.","id":"S01Q09"},{"fact_id":"m.httrack","concept_id":"m.httrack","variant":1,"category":"Hacking Methodology & Tools","topic":"Analysis","question":"Which tool mirrors a website for offline analysis?","choices":["Burp Sequencer","httrack","Telnet","Netcat"],"answer":"httrack","explanation":"httrack copies website content for offline browsing.","id":"S01Q10"},{"fact_id":"t.recog.9","concept_id":"t.recog.9","variant":1,"category":"Web Application Threats","topic":"Attack Recognition","question":"What web application attack injects crafted input into an LDAP query?","choices":["LDAP Injection","Pass-the-Cookie Attack","MarioNet Attack","Cookie/Session Poisoning"],"answer":"LDAP Injection","explanation":"This behavior describes LDAP Injection.","id":"S01Q11"},{"fact_id":"s.xss.csp","concept_id":"s.xss.csp","variant":1,"category":"Security Techniques & Countermeasures","topic":"XSS Defense","question":"What browser security policy restricts which script and content sources may execute?","choices":["Content Security Policy","HttpOnly Cookie","Output Encoding","Context-sensitive Encoding"],"answer":"Content Security Policy","explanation":"CSP restricts permitted content sources and script execution.","id":"S01Q12"},{"fact_id":"m.authflaw.9","concept_id":"m.authflaw.9","variant":1,"category":"Hacking Methodology & Tools","topic":"Authentication","question":"Which authentication flaw fails to correctly verify supplied authentication data?","choices":["Flaws in Multistage Login Functionality","Verbose Failure Messages","Forgotten Password Mechanism","Improper Validation of Credentials"],"answer":"Improper Validation of Credentials","explanation":"This behavior is Improper Validation of Credentials.","id":"S01Q13"},{"fact_id":"c.owasp.attack.19","concept_id":"c.owasp.attack.19","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Mapping","question":"Which OWASP 2021 category includes CSRF in the course mapping?","choices":["A06 Vulnerable and Outdated Components","A04 Insecure Design","A01 Broken Access Control","A07 Identification and Authentication Failures"],"answer":"A07 Identification and Authentication Failures","explanation":"The course maps CSRF to A07 Identification and Authentication Failures.","id":"S01Q14"},{"fact_id":"s.api.2","concept_id":"s.api.2","variant":1,"category":"Security Techniques & Countermeasures","topic":"API Security","question":"What control uses server-generated hidden values to validate state-changing requests?","choices":["Pagination","Quotas and Throttling","Input Sanitization","Anti-CSRF Tokens"],"answer":"Anti-CSRF Tokens","explanation":"Anti-CSRF Tokens is one of the API security practices listed in the course.","id":"S01Q15"},{"fact_id":"a.credstuff.phantom","concept_id":"a.credstuff.phantom","variant":1,"category":"Web APIs & Webhooks","topic":"API Attacks","question":"Which browser-automation tool is listed alongside Sentry MBA for credential stuffing?","choices":["Nmap","Netcat","PhantomJS","Whois"],"answer":"PhantomJS","explanation":"PhantomJS is listed alongside Sentry MBA.","id":"S01Q16"},{"fact_id":"m.authz.2","concept_id":"m.authz.2","variant":1,"category":"Hacking Methodology & Tools","topic":"Authorization","question":"What authorization-testing technique modifies values carried in the POST body?","choices":["Parameter Tampering","POST Data","Hidden Tags","HTTP Headers"],"answer":"POST Data","explanation":"POST Data is one of the six authorization-scheme attack techniques.","id":"S01Q17"},{"fact_id":"c.owasp.attack.2","concept_id":"c.owasp.attack.2","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Mapping","question":"Which OWASP 2021 category includes Hidden Field Manipulation in the course mapping?","choices":["A04 Insecure Design","A08 Software and Data Integrity Failures","A07 Identification and Authentication Failures","A01 Broken Access Control"],"answer":"A01 Broken Access Control","explanation":"The course maps Hidden Field Manipulation to A01 Broken Access Control.","id":"S01Q18"},{"fact_id":"t.crlf.hexlf","concept_id":"t.crlf.hexlf","variant":1,"category":"Web Application Threats","topic":"CRLF","question":"What URL-encoded value represents line feed in the course example?","choices":["%0d","%20","%0a","%3c"],"answer":"%0a","explanation":"%0a is line feed.","id":"S01Q19"},{"fact_id":"t.watering.inject","concept_id":"t.watering.inject","variant":1,"category":"Web Application Threats","topic":"Watering Hole","question":"What is placed on the compromised site to attack visiting victims?","choices":["Only a TLS certificate","Malicious script/code","Only a DNS TXT record","Only a sitemap"],"answer":"Malicious script/code","explanation":"The attacker injects malicious code into the chosen website.","id":"S01Q20"},{"fact_id":"a.xmlrpc","concept_id":"a.xmlrpc","variant":1,"category":"Web APIs & Webhooks","topic":"RPC","question":"Which RPC protocol uses XML to encode its calls and data?","choices":["JSON-RPC","SOAPAction","Webhooks","XML-RPC"],"answer":"XML-RPC","explanation":"XML-RPC uses XML.","id":"S01Q21"},{"fact_id":"t.cswh.token","concept_id":"t.cswh.token","variant":1,"category":"Web Application Threats","topic":"WebSocket","question":"What missing protection commonly enables Cross-Site WebSocket Hijacking?","choices":["DNSSEC","CSRF token","HSTS","Prepared statement"],"answer":"CSRF token","explanation":"CSWH occurs when cookie-authenticated WebSocket handshakes lack CSRF protection.","id":"S01Q22"},{"fact_id":"a.rest.5","concept_id":"a.rest.5","variant":1,"category":"Web APIs & Webhooks","topic":"REST","question":"Which REST characteristic allows intermediaries or layers without the client needing to know the full backend structure?","choices":["Layered System","Stateless","Uniform Interface","Code on Demand (optional)"],"answer":"Layered System","explanation":"Layered System is a REST architectural characteristic.","id":"S01Q23"},{"fact_id":"c.mvc.attack.surface","concept_id":"c.mvc.attack.surface","variant":1,"category":"Web Application Concepts & OWASP","topic":"MVC","question":"Why does MVC matter from an attack perspective?","choices":["It encrypts all traffic","Each layer exposes a different attack surface","It removes authentication","It prevents database access"],"answer":"Each layer exposes a different attack surface","explanation":"The view, controller, and model can each be targeted differently.","id":"S01Q24"},{"fact_id":"t.crlf.chars","concept_id":"t.crlf.chars","variant":1,"category":"Web Application Threats","topic":"CRLF","question":"What characters are injected in a CRLF injection attack?","choices":["Carriage return and line feed","Quote and semicolon","Null and backspace","Tab and space"],"answer":"Carriage return and line feed","explanation":"CRLF is carriage return plus line feed.","id":"S01Q25"},{"fact_id":"a.session.sequential","concept_id":"a.session.sequential","variant":1,"category":"Web APIs & Webhooks","topic":"API Configuration","question":"What token-generation weakness makes API session identifiers easier to predict?","choices":["Signed tokens","Rotated tokens","Random tokens","Sequential tokens"],"answer":"Sequential tokens","explanation":"Sequential session tokens are predictable.","id":"S01Q26"},{"fact_id":"s.hook.sig","concept_id":"s.hook.sig","variant":1,"category":"Security Techniques & Countermeasures","topic":"Webhook Security","question":"What control verifies webhook message authenticity and integrity with a shared secret?","choices":["Mutual TLS","HMAC-based Signatures","Webhook Proxy","Source Verification"],"answer":"HMAC-based Signatures","explanation":"HMAC signatures verify sender authenticity and message integrity.","id":"S01Q27"},{"fact_id":"c.owasp.num.8","concept_id":"c.owasp.num.8","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Top 10","question":"Which OWASP 2021 category is A08?","choices":["Software and Data Integrity Failures","Security Misconfiguration","Identification and Authentication Failures","0 Server-Side Request Forgery (SSRF)"],"answer":"Software and Data Integrity Failures","explanation":"A08 is Software and Data Integrity Failures.","id":"S01Q28"},{"fact_id":"m.access.1","concept_id":"m.access.1","variant":1,"category":"Hacking Methodology & Tools","topic":"Access Control","question":"What access-control test compares the same request across accounts with different privileges?","choices":["Multistage Processes","Static Resources","Different User Accounts","HTTP Method Restrictions"],"answer":"Different User Accounts","explanation":"Different User Accounts is the matching access-control test.","id":"S01Q29"},{"fact_id":"t.trav.source","concept_id":"t.trav.source","variant":1,"category":"Web Application Threats","topic":"Traversal","question":"What development artifact can directory traversal expose and reveal application internals?","choices":["ARP cache","TLS session ticket only","Source code","DHCP lease"],"answer":"Source code","explanation":"The course lists source-code discovery as a traversal impact.","id":"S01Q30"},{"fact_id":"c.mvc.view","concept_id":"c.mvc.view","variant":1,"category":"Web Application Concepts & OWASP","topic":"MVC","question":"Which MVC component represents what the user sees and interacts with?","choices":["View","Model","Web Server","Controller"],"answer":"View","explanation":"The View is the user-facing interface.","id":"S01Q31"},{"fact_id":"a.top.desc.5","concept_id":"a.top.desc.5","variant":1,"category":"Web APIs & Webhooks","topic":"OWASP API Top 10","question":"Which OWASP API risk matches this condition: A regular user can call an administrative function because function-level authorization is missing.","choices":["API7 Server-Side Request Forgery","API8 Security Misconfiguration","API5 Broken Function Level Authorization","API1 Broken Object-Level Authorization"],"answer":"API5 Broken Function Level Authorization","explanation":"This condition maps to API5 Broken Function Level Authorization.","id":"S01Q32"},{"fact_id":"m.access.3","concept_id":"m.access.3","variant":1,"category":"Hacking Methodology & Tools","topic":"Access Control","question":"What access-control test directly requests protected URLs that are not linked?","choices":["HTTP Method Restrictions","Multistage Processes","Static Resources","Different User Accounts"],"answer":"Static Resources","explanation":"Static Resources is the matching access-control test.","id":"S01Q33"},{"fact_id":"a.webhook.direction","concept_id":"a.webhook.direction","variant":1,"category":"Web APIs & Webhooks","topic":"Webhooks","question":"Which mechanism pushes updates automatically instead of requiring the consumer to poll for them?","choices":["HMAC signature","API","Mutual TLS","Webhook"],"answer":"Webhook","explanation":"Webhooks are event-driven push mechanisms.","id":"S01Q34"},{"fact_id":"s.fuzz.ai","concept_id":"s.fuzz.ai","variant":1,"category":"Security Techniques & Countermeasures","topic":"Fuzzing","question":"What fuzzing approach uses machine learning to predict more effective test inputs?","choices":["Mutation-Based Fuzzing","SAST","wfuzz","AI-Powered Fuzzing"],"answer":"AI-Powered Fuzzing","explanation":"AI-powered fuzzing learns patterns and crafts targeted inputs.","id":"S01Q35"},{"fact_id":"c.owasp.desc4","concept_id":"c.owasp.desc4","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Top 10","question":"Which OWASP 2021 risk matches this condition: Security requirements were not adequately considered in the application design itself.","choices":["A04 Insecure Design","A02 Cryptographic Failures","A07 Identification and Authentication Failures","A03 Injection"],"answer":"A04 Insecure Design","explanation":"This condition maps to A04 Insecure Design.","id":"S01Q36"},{"fact_id":"t.xss.cookie","concept_id":"t.xss.cookie","variant":1,"category":"Web Application Threats","topic":"XSS","question":"What sensitive browser artifact is commonly stolen by XSS for session hijacking?","choices":["Session cookie","ARP cache","TLS private CA root","DNS zone"],"answer":"Session cookie","explanation":"XSS can exfiltrate session cookies when protections do not prevent access.","id":"S01Q37"},{"fact_id":"t.forced.dictionary","concept_id":"t.forced.dictionary","variant":1,"category":"Web Application Threats","topic":"Access Control","question":"What technique uses lists of resource names to discover hidden pages that are not linked?","choices":["SSRF","Forced Browsing","IDOR","URL Manipulation"],"answer":"Forced Browsing","explanation":"Forced browsing enumerates discoverable resources directly.","id":"S01Q38"},{"fact_id":"s.sast","concept_id":"s.sast","variant":1,"category":"Security Techniques & Countermeasures","topic":"Testing","question":"What testing approach analyzes source code without executing the application?","choices":["Code Review","IAST","DAST","SAST"],"answer":"SAST","explanation":"SAST performs static analysis of code.","id":"S01Q39"},{"fact_id":"m.authz.4","concept_id":"m.authz.4","variant":1,"category":"Hacking Methodology & Tools","topic":"Authorization","question":"What authorization attack changes values such as Admin=False to Admin=true?","choices":["HTTP Headers","POST Data","Query String and Cookies","Parameter Tampering"],"answer":"Parameter Tampering","explanation":"Parameter Tampering is one of the six authorization-scheme attack techniques.","id":"S01Q40"},{"fact_id":"a.rest.2","concept_id":"a.rest.2","variant":1,"category":"Web APIs & Webhooks","topic":"REST","question":"Which REST characteristic allows responses to explicitly indicate whether they can be reused?","choices":["Cacheable","Uniform Interface","Code on Demand (optional)","Client-server Environment"],"answer":"Cacheable","explanation":"Cacheable is a REST architectural characteristic.","id":"S01Q41"},{"fact_id":"s.waf.modsec","concept_id":"s.waf.modsec","variant":1,"category":"Security Techniques & Countermeasures","topic":"WAF","question" ant":1,"category":"Security Techniques & Countermeasures","topic":"API Security","question":"What usage-control techniques restrict and track API consumption over time?","choices":["Quotas and Throttling","Firewall Hardening","Packet Sniffing/Monitoring","OAuth2/OpenID Connect"],"answer":"Quotas and Throttling","explanation":"Quotas and Throttling is one of the API security practices listed in the course.","id":"S10Q27"},{"fact_id":"m.client.proxy","concept_id":"m.client.proxy","variant":1,"category":"Hacking Methodology & Tools","topic":"Client Controls","question":"What tool class lets an attacker capture and modify requests after client-side validation?","choices":["DNS resolver","Packet scheduler","Patch manager","Intercepting proxy"],"answer":"Intercepting proxy","explanation":"Intercepting proxies bypass client-side controls by modifying the final request.","id":"S10Q28"},{"fact_id":"c.owasp.a02.data","concept_id":"c.owasp.a02.data","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Top 10","question":"What type of information is specifically at risk under cryptographic failures?","choices":["Only CSS files","Sensitive data","Only public images","Only DNS labels"],"answer":"Sensitive data","explanation":"Cryptographic failures expose sensitive financial, healthcare, or personal information.","id":"S10Q29"},{"fact_id":"t.recog.6","concept_id":"t.recog.6","variant":1,"category":"Web Application Threats","topic":"Attack Recognition","question":"What web application attack abuses a trusted organization subdomain or related domain to redirect or deceive users?","choices":["Pass-the-Cookie Attack","Unvalidated Redirect/Forward","Buffer Overflow","Same-Site Attack"],"answer":"Same-Site Attack","explanation":"This behavior describes Same-Site Attack.","id":"S10Q30"},{"fact_id":"a.webhook.def","concept_id":"a.webhook.def","variant":1,"category":"Web APIs & Webhooks","topic":"Webhooks","question":"What mechanism sends an HTTP callback automatically when an event occurs?","choices":["HMAC signature","API","HTTP POST","Webhook"],"answer":"Webhook","explanation":"A webhook is an event-triggered HTTP callback.","id":"S10Q31"},{"fact_id":"t.recog.1","concept_id":"t.recog.1","variant":1,"category":"Web Application Threats","topic":"Attack Recognition","question":"What web application attack uses ../ sequences to escape the intended web root and access restricted files?","choices":["Insecure Deserialization","Network Access Attack","Unvalidated Redirect/Forward","Directory Traversal"],"answer":"Directory Traversal","explanation":"This behavior describes Directory Traversal.","id":"S10Q32"},{"fact_id":"t.recog.16","concept_id":"t.recog.16","variant":1,"category":"Web Application Threats","topic":"Attack Recognition","question":"What web application attack abuses an XML parser that processes attacker-controlled external entities?","choices":["Magecart Attack","Platform Exploit","Business Logic Bypass","XXE"],"answer":"XXE","explanation":"This behavior describes XXE.","id":"S10Q33"},{"fact_id":"c.mvc.model","concept_id":"c.mvc.model","variant":1,"category":"Web Application Concepts & OWASP","topic":"MVC","question":"Which MVC component represents application data and its structure?","choices":["View","Model","Database Server","Application Server"],"answer":"Model","explanation":"The Model represents and manages application data.","id":"S10Q34"},{"fact_id":"m.shared.risk","concept_id":"m.shared.risk","variant":1,"category":"Hacking Methodology & Tools","topic":"Shared Hosting","question":"What is the main cross-tenant risk in a shared hosting environment?","choices":["TLS cannot be used","DNS cannot resolve","All tenants share one password by design","One application compromises another"],"answer":"One application compromises another","explanation":"A vulnerability in one hosted app may expose other tenants on shared infrastructure.","id":"S10Q35"},{"fact_id":"a.top.rev.8","concept_id":"a.top.rev.8","variant":1,"category":"Web APIs & Webhooks","topic":"OWASP API Top 10","question":"What OWASP API number corresponds to Security Misconfiguration?","choices":["API10","API8","API7","API3"],"answer":"API8","explanation":"Security Misconfiguration is API8.","id":"S10Q36"},{"fact_id":"c.owasp.a08.supply","concept_id":"c.owasp.a08.supply","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Top 10","question":"What attack class is strongly associated with Software and Data Integrity Failures?","choices":["Supply-chain compromise","ARP spoofing","DNS amplification","WEP cracking"],"answer":"Supply-chain compromise","explanation":"A08 includes untrusted updates, dependencies, and CI/CD supply-chain problems.","id":"S10Q37"},{"fact_id":"a.top.rev.3","concept_id":"a.top.rev.3","variant":1,"category":"Web APIs & Webhooks","topic":"OWASP API Top 10","question":"What OWASP API number corresponds to Broken Object Property Level Authorization?","choices":["API3","API7","API5","API1"],"answer":"API3","explanation":"Broken Object Property Level Authorization is API3.","id":"S10Q38"},{"fact_id":"s.fuzz.data","concept_id":"s.fuzz.data","variant":1,"category":"Security Techniques & Countermeasures","topic":"Fuzzing","question":"What is the generated random or malformed test data called?","choices":["Fuzz","Nonce","Token","Salt"],"answer":"Fuzz","explanation":"Fuzz is the generated test input.","id":"S10Q39"},{"fact_id":"a.scan.zap","concept_id":"a.scan.zap","variant":1,"category":"Web APIs & Webhooks","topic":"API Tools","question":"Which OWASP tool is listed for REST API vulnerability scanning?","choices":["OWASP ZAP","AppSpider","Astra","Fuzzapi"],"answer":"OWASP ZAP","explanation":"OWASP ZAP is listed as a REST API vulnerability scanning tool.","id":"S10Q40"},{"fact_id":"s.xss.domenc","concept_id":"s.xss.domenc","variant":1,"category":"Security Techniques & Countermeasures","topic":"XSS Defense","question":"What defense should be matched to the specific DOM sink/context to prevent DOM XSS?","choices":["Positive Security Policy","Context-sensitive Encoding","Content Security Policy","WAF"],"answer":"Context-sensitive Encoding","explanation":"DOM XSS requires encoding appropriate to the destination context.","id":"S10Q41"},{"fact_id":"t.crlf.logspoof","concept_id":"t.crlf.logspoof","variant":1,"category":"Web Application Threats","topic":"CRLF","question":"What forensic problem can CRLF log injection create?","choices":["Stronger hashes","Fake log entries","Automatic MFA","Fewer HTTP headers"],"answer":"Fake log entries","explanation":"Newlines can make malicious input appear as separate trusted log entries.","id":"S10Q42"},{"fact_id":"c.owasp.attack.25","concept_id":"c.owasp.attack.25","variant":1,"category":"Web Application Concepts & OWASP","topic":"OWASP Mapping","question":"Which OWASP 2021 category includes DNS Rebinding in the course mapping?","choices":["A08 Software and Data Integrity Failures","A10 Server-Side Request Forgery (SSRF)","A09 Security Logging and Monitoring Failures","A05 Security Misconfiguration"],"answer":"A10 Server-Side Request Forgery (SSRF)","explanation":"The course maps DNS Rebinding to A10 Server-Side Request Forgery (SSRF).","id":"S10Q43"},{"fact_id":"s.enc.html","concept_id":"s.enc.html","variant":1,"category":"Security Techniques & Countermeasures","topic":"Encoding","question":"What encoding represents special HTML characters with entities such as &lt; and &amp;?","choices":["URL Encoding","Unicode Encoding","Hex Encoding","HTML Encoding"],"answer":"HTML Encoding","explanation":"HTML entities safely represent characters inside HTML.","id":"S10Q44"},{"fact_id":"t.recog.25","concept_id":"t.recog.25","variant":1,"category":"Web Application Threats","topic":"Attack Recognition","question":"What web application attack injects a destination that makes the server issue an attacker-controlled request?","choices":["Cookie/Session Poisoning","Web-based Timing Attack","SSRF Payload Injection","Same-Site Attack"],"answer":"SSRF Payload Injection","explanation":"This behavior describes SSRF Payload Injection.","id":"S10Q45"},{"fact_id":"a.vuln.rbac","concept_id":"a.vuln.rbac","variant":1,"category":"Web APIs & Webhooks","topic":"API Vulnerabilities","question":"What API weakness lets a user change role-based privileges without proper enforcement?","choices":["Business Logic Flaw","Code Injection","IDOR","RBAC Privilege Escalation"],"answer":"RBAC Privilege Escalation","explanation":"Weak RBAC enforcement can allow privilege escalation.","id":"S10Q46"},{"fact_id":"c.arch.logic","concept_id":"c.arch.logic","variant":1,"category":"Web Application Concepts & OWASP","topic":"Architecture","question":"Which web application layer contains middleware and application logic such as .NET or Java?","choices":["Application Server","DBMS","Business Logic Layer","Web Server"],"answer":"Business Logic Layer","explanation":"Business logic is processed in the middle application layer.","id":"S10Q47"},{"fact_id":"t.session.fixation","concept_id":"t.session.fixation","variant":1,"category":"Web Application Threats","topic":"Session","question":"What attack gives the victim a session identifier already known to the attacker?","choices":["Insecure Deserialization","Cookie Snooping","XXE","Session Fixation"],"answer":"Session Fixation","explanation":"Session fixation causes the victim to authenticate using an attacker-known session ID.","id":"S10Q48"},{"fact_id":"s.sql.error","concept_id":"s.sql.error","variant":1,"category":"Security Techniques & Countermeasures","topic":"SQLi Defense","question":"What response-handling practice prevents database error messages from revealing backend details?","choices":["Parameterized Queries","Custom Error Messages","Low-privileged DB account","Prepared Statements"],"answer":"Custom Error Messages","explanation":"Generic/custom errors reduce information disclosure.","id":"S10Q49"},{"fact_id":"m.session.hex","concept_id":"m.session.hex","variant":1,"category":"Hacking Methodology & Tools","topic":"Session","question":"Which encoding pattern is explicitly mentioned as a clue in weak session-token analysis?","choices":["ROT13","Hex encoding","ASN.1 BER only","DNSSEC"],"answer":"Hex encoding","explanation":"The course example shows a session token with hex-encoded fields.","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-module14-webapp-500-unique-v2";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Hacking Web Applications — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Hacking Web Applications (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Hacking Web Applications (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
