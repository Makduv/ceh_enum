<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Evading IDS, Firewalls, and Honeypots — 500 Unique Facts v3</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"fact_id":"b001","concept_id":"b001","root_concept":"Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique uses TTL values to map firewall ACL rules?","choices":["Port Scanning","Windows BITS","Firewalking","Source Routing"],"answer":"Firewalking","explanation":"Firewalking uses TTL-controlled probes to infer gateway ACLs.","id":"S01Q01"},{"fact_id":"b099","concept_id":"b099","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"Where is the malicious payload reconstructed?","choices":["On the switch ASIC","In the browser","On the firewall","Inside DNS server memory"],"answer":"In the browser","explanation":"Client-side reconstruction helps bypass perimeter inspection.","id":"S01Q02"},{"fact_id":"n005","concept_id":"n005","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What switch mode actively tries to negotiate a trunk?","choices":["access","shutdown","dynamic desirable","protected"],"answer":"dynamic desirable","explanation":"Dynamic desirable actively attempts trunk negotiation.","id":"S01Q03"},{"fact_id":"b115","concept_id":"b115","root_concept":"Evasion List","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which technique is specifically listed for anonymous browsing through intermediary websites?","choices":["Disk encryption","Anonymous website surfing","Packet normalization","Certificate pinning"],"answer":"Anonymous website surfing","explanation":"The course additionally lists anonymous website surfing sites.","id":"S01Q04"},{"fact_id":"c059","concept_id":"c059","root_concept":"VPN","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What VPN property protects confidentiality over the Internet?","choices":["Broadcasting","ARP caching","Compression only","Encryption"],"answer":"Encryption","explanation":"VPNs encrypt traffic.","id":"S01Q05"},{"fact_id":"d046","concept_id":"d046","root_concept":"Geo-Restriction","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What control restricts traffic based on geographic region?","choices":["TLS Inspection","Geo-Restriction","Rule Risk Queries","Deep Packet Inspection"],"answer":"Geo-Restriction","explanation":"Geographic filtering can reduce unnecessary exposure.","id":"S01Q06"},{"fact_id":"c003","concept_id":"c003","root_concept":"IDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"When does an IDS analyze packets according to the course?","choices":["Only during login","After capture","Before transmission","Only after reboot"],"answer":"After capture","explanation":"The course states that IDS packets are analyzed after capture.","id":"S01Q07"},{"fact_id":"h057","concept_id":"h057","root_concept":"Enumerating Unexpected Open Ports","variant":1,"category":"Honeypot Concepts","question":"What honeypot-detection method looks for services inconsistent with the host role?","choices":["Fingerprinting Running Service","Enumerating Unexpected Open Ports","Analyzing MAC Address","Analyzing System Configuration/Metadata"],"answer":"Enumerating Unexpected Open Ports","explanation":"Unexpected exposed services can reveal deception.","id":"S01Q08"},{"fact_id":"d049","concept_id":"d049","root_concept":"TLS Inspection","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What integrated capability inspects encrypted HTTPS/TLS traffic for hidden threats?","choices":["TLS Inspection","Unique Firewall Service ID","Default Deny","Admin Access Control"],"answer":"TLS Inspection","explanation":"TLS inspection restores visibility into encrypted traffic.","id":"S01Q09"},{"fact_id":"b072","concept_id":"b072","root_concept":"Scenario 2","variant":1,"category":"Bypassing IDS/Firewalls","question":"In fragmentation-timeout scenario 2, whose timeout is longer?","choices":["IDS","DNS resolver","Proxy","Victim"],"answer":"IDS","explanation":"Scenario 2 requires IDS timeout to exceed the victim timeout.","id":"S01Q10"},{"fact_id":"b017","concept_id":"b017","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What Windows service can attackers abuse to transfer files as trusted background jobs?","choices":["Banner Grabbing","Content/XSS Attack","MITM Attack","Windows BITS"],"answer":"Windows BITS","explanation":"BITS jobs run as trusted system-level background transfers.","id":"S01Q11"},{"fact_id":"n024","concept_id":"n024","root_concept":"Ghostwriting","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What is the first structural action listed in the Ghostwriting process?","choices":["Binary deconstruction","ARP spoofing","Certificate pinning","DNS tunneling"],"answer":"Binary deconstruction","explanation":"The course lists binary deconstruction.","id":"S01Q12"},{"fact_id":"s007","concept_id":"s007","root_concept":"YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What is YARA mainly used to detect or classify in this module?","choices":["Routing loops","Wireless channels","Malware","Printer queues"],"answer":"Malware","explanation":"YARA is presented as a malware research/detection tool.","id":"S01Q13"},{"fact_id":"d048","concept_id":"d048","root_concept":"Zero Trust","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What security model assumes no internal or external traffic is inherently trusted?","choices":["Rule Risk Queries","Disable FTP","Zero Trust","Physical Access Control"],"answer":"Zero Trust","explanation":"Zero trust requires continuous verification.","id":"S01Q14"},{"fact_id":"h005","concept_id":"h005","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"What network behavior can a honeypot log as an early warning?","choices":["Only CPU temperature","Only screen resolution","Only keyboard layout","Port access attempts"],"answer":"Port access attempts","explanation":"Honeypots can log port access attempts.","id":"S01Q15"},{"fact_id":"b058","concept_id":"b058","root_concept":"ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What must the attacker first establish before crafting malicious ACK payloads?","choices":["IPsec tunnel","ARP cache","DNS zone transfer","Legitimate TCP connection"],"answer":"Legitimate TCP connection","explanation":"The course starts ACK tunneling from a legitimate TCP connection.","id":"S01Q16"},{"fact_id":"b048","concept_id":"b048","root_concept":"IP Instead of URL","variant":1,"category":"Bypassing IDS/Firewalls","question":"What service is mentioned for finding a website IP address?","choices":["KFSensor","Asleap","Host2ip","Reaver"],"answer":"Host2ip","explanation":"The course mentions Host2ip.","id":"S01Q17"},{"fact_id":"b021","concept_id":"b021","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which UDP ports are listed for ManageEngine Firewall Analyzer?","choices":["80/443","161/162","514/1514","53/67"],"answer":"514/1514","explanation":"The course lists UDP 514/1514.","id":"S01Q18"},{"fact_id":"b010","concept_id":"b010","root_concept":"HTTP Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique disguises tunneled traffic as legitimate HTTP?","choices":["Firewalking","Banner Grabbing","HTTP Tunneling","ICMP Tunneling"],"answer":"HTTP Tunneling","explanation":"HTTP tunneling hides traffic inside web protocol flows.","id":"S01Q19"},{"fact_id":"h007","concept_id":"h007","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"What intelligence value does a honeypot provide defenders?","choices":["Only VLAN numbers","Attacker tools and techniques","Only patch dates","Only user passwords"],"answer":"Attacker tools and techniques","explanation":"Honeypots can reveal attacker behavior and objectives.","id":"S01Q20"},{"fact_id":"b024","concept_id":"b024","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which UDP port is listed for Snort in the reconnaissance example?","choices":["67","53","161","123"],"answer":"53","explanation":"The course lists UDP 53 for Snort.","id":"S01Q21"},{"fact_id":"c021","concept_id":"c021","root_concept":"Signature Recognition","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What kind of attack is signature recognition best suited to detect?","choices":["Physical theft","Unknown behavior only","Known attacks","Hardware faults"],"answer":"Known attacks","explanation":"Signature recognition depends on known attack patterns.","id":"S01Q22"},{"fact_id":"c035","concept_id":"c035","root_concept":"Firewall","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What activity can a firewall identify for auditing?","choices":["CPU temperature","Keyboard layout","Printer toner","Login attempts"],"answer":"Login attempts","explanation":"Firewall functions include identifying login attempts for auditing.","id":"S01Q23"},{"fact_id":"b149","concept_id":"b149","root_concept":"Proxy","variant":1,"category":"Bypassing IDS/Firewalls","question":"What is the main privacy/evasion effect of an anonymous surfing site?","choices":["Disable DNS","Encrypt disk","Hide original client identity/path","Increase packet TTL"],"answer":"Hide original client identity/path","explanation":"The intermediary obscures the original source path.","id":"S01Q24"},{"fact_id":"b104","concept_id":"b104","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What BITS operation specifies a command to run after transfer?","choices":["/list","/setttl","/getacl","/SetNotifyCmdLine"],"answer":"/SetNotifyCmdLine","explanation":"SetNotifyCmdLine configures the notification command.","id":"S01Q25"},{"fact_id":"d047","concept_id":"d047","root_concept":"Behavior-Based Rules","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What firewall policy style considers user behavior instead of only IP addresses?","choices":["Disable FTP","Behavior-Based Rules","Physical Access Control","HTTP Evader Testing"],"answer":"Behavior-Based Rules","explanation":"Behavior-aware rules add contextual control.","id":"S01Q26"},{"fact_id":"h015","concept_id":"h015","root_concept":"Low-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"Which daemon is listed as a low-interaction honeypot?","choices":["Snort","Burp Suite","Splunk","Honeytrap"],"answer":"Honeytrap","explanation":"Honeytrap is listed as a low-interaction example.","id":"S01Q27"},{"fact_id":"h014","concept_id":"h014","root_concept":"Low-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"Which example is listed as a low-interaction honeypot?","choices":["NeroSwarm","Valhala","KFSensor","Cowrie"],"answer":"KFSensor","explanation":"KFSensor is listed as a low-interaction example.","id":"S01Q28"},{"fact_id":"c082","concept_id":"c082","root_concept":"UTM","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What performance risk can occur when one UTM handles many security functions?","choices":["Performance bottleneck","Infinite bandwidth","No CPU usage","Guaranteed latency reduction"],"answer":"Performance bottleneck","explanation":"Multiple functions can create a bottleneck.","id":"S01Q29"},{"fact_id":"c030","concept_id":"c030","root_concept":"Protocol Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What follows baseline creation in protocol anomaly detection?","choices":["Port forwarding","Certificate enrollment","DHCP renewal","Anomaly identification"],"answer":"Anomaly identification","explanation":"Anomaly identification follows baseline creation.","id":"S01Q30"},{"fact_id":"h023","concept_id":"h023","root_concept":"Database Honeypot","variant":1,"category":"Honeypot Concepts","question":"What deception type imitates database services to attract attacks?","choices":["Honeynet","Malware Honeypot","Database Honeypot","Email Honeypot"],"answer":"Database Honeypot","explanation":"Database honeypots target database-focused attackers.","id":"S01Q31"},{"fact_id":"h008","concept_id":"h008","root_concept":"Tar Pit","variant":1,"category":"Honeypot Concepts","question":"What honeypot-style concept is designed to slow and trap an attacker?","choices":["NAT","Tar pit","SIEM","VPN"],"answer":"Tar pit","explanation":"A tar pit wastes attacker time.","id":"S01Q32"},{"fact_id":"n016","concept_id":"n016","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What is being smuggled from the attacker device through the authorized path?","choices":["Network packets","Only DNS zones","Only passwords","Only files on disk"],"answer":"Network packets","explanation":"The bypass smuggles network packets through the authorized device.","id":"S01Q33"},{"fact_id":"n077","concept_id":"n077","root_concept":"AMSI Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What security interface is being neutralized?","choices":["Antimalware Scan Interface","Application Management Service Interface","Advanced Message Security Index","Automated Memory Session Interface"],"answer":"Antimalware Scan Interface","explanation":"AMSI stands for Antimalware Scan Interface.","id":"S01Q34"},{"fact_id":"n064","concept_id":"n064","root_concept":"AI-Assisted Evasion","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What property of generated code is intended to reduce AV signature hits?","choices":["Uniqueness","Same binary every time","Fixed byte pattern","Static hash reuse"],"answer":"Uniqueness","explanation":"Unique/mutated code reduces signature reuse.","id":"S01Q35"},{"fact_id":"b080","concept_id":"b080","root_concept":"Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"When is the misleading SYN sent in post-connection desynchronization?","choices":["After connection establishment","Only after reboot","During DHCP only","Before any SYN"],"answer":"After connection establishment","explanation":"The SYN is injected into an established stream.","id":"S01Q36"},{"fact_id":"b045","concept_id":"b045","root_concept":"Tiny Fragments","variant":1,"category":"Bypassing IDS/Firewalls","question":"What filtering weakness lets tiny fragments succeed?","choices":["Only first fragment inspected","Full reassembly enforced","Every fragment normalized","Application proxy used"],"answer":"Only first fragment inspected","explanation":"The evasion works if later fragments bypass inspection.","id":"S01Q37"},{"fact_id":"d054","concept_id":"d054","root_concept":"Firewall Admin","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What should be monitored in addition to firewall traffic?","choices":["Monitor brightness","Desktop themes","User access to configuration","Printer queues"],"answer":"User access to configuration","explanation":"Administrative access should be controlled and monitored.","id":"S01Q38"},{"fact_id":"s016","concept_id":"s016","root_concept":"SIEM","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What operational output can be triggered when SIEM patterns match known threats?","choices":["Certificate signing request","DHCP renewal","Alert","Routing advertisement"],"answer":"Alert","explanation":"SIEM can generate alerts.","id":"S01Q39"},{"fact_id":"n017","concept_id":"n017","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What setup script is explicitly listed for NAC bypass?","choices":["Ghostwriting.sh","DoubleTagging.py","BitsParser","nac_bypass_setup.sh"],"answer":"nac_bypass_setup.sh","explanation":"The course lists nac_bypass_setup.sh.","id":"S01Q40"},{"fact_id":"c071","concept_id":"c071","root_concept":"Defense in Depth","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security strategy uses multiple layers to delay an attacker?","choices":["Defense in Depth","Segmentation","Defensible Architecture","Isolation"],"answer":"Defense in Depth","explanation":"Defense in depth layers controls so one failure is followed by another.","id":"S01Q41"},{"fact_id":"c058","concept_id":"c058","root_concept":"NGFW","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What basic capability does an NGFW retain in addition to advanced inspection?","choices":["Traditional firewall functions","Integrated IPS","Cloud-based threat intelligence","Deep packet inspection"],"answer":"Traditional firewall functions","explanation":"NGFWs still perform traditional firewall functions.","id":"S01Q42"},{"fact_id":"c052","concept_id":"c052","root_concept":"Packet Filtering","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What protocol information can packet filtering evaluate?","choices":["Wallpaper type","Protocol type","Disk model","Keyboard layout"],"answer":"Protocol type","explanation":"Packet filters can match protocol type.","id":"S01Q43"},{"fact_id":"c070","concept_id":"c070","root_concept":"DMZ","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What trend is shrinking many traditional on-premise DMZs?","choices":["ARP spoofing","WEP adoption","Cloud migration","Tokenization"],"answer":"Cloud migration","explanation":"Public services are increasingly outsourced to cloud providers.","id":"S01Q44"},{"fact_id":"d014","concept_id":"d014","root_concept":"Traffic Normalizer","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What control is explicitly recommended more than once for IDS evasion defense?","choices":["SIEM Monitoring","Device Hardening","Traffic Normalizer","Switch Port Shutdown"],"answer":"Traffic Normalizer","explanation":"Traffic normalization appears repeatedly in the checklist.","id":"S01Q45"},{"fact_id":"b084","concept_id":"b084","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique uses a shared seed to generate gibberish domain names for C2 communication?","choices":["Tiny Fragments","Firewalking","Banner Grabbing","DGA"],"answer":"DGA","explanation":"Domain Generation Algorithms create changing rendezvous domains.","id":"S01Q46"},{"fact_id":"h003","concept_id":"h003","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"How much production value should a honeypot have?","choices":["Primary database role","High production value","None","Domain controller role"],"answer":"None","explanation":"The course states a honeypot has no production value.","id":"S01Q47"},{"fact_id":"n076","concept_id":"n076","root_concept":"In-memory Beacon Encryption","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What kind of memory regions are encrypted while dormant?","choices":["Executable memory regions","Only network packets","Only disk sectors","Only DNS cache"],"answer":"Executable memory regions","explanation":"Executable regions are encrypted in memory.","id":"S01Q48"},{"fact_id":"n001","concept_id":"n001","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What NAC bypass technique abuses switch trunking to reach additional VLANs?","choices":["BITM","DTP","VLAN Hopping","Pre-authenticated Device"],"answer":"VLAN Hopping","explanation":"VLAN hopping abuses trunk behavior.","id":"S01Q49"},{"fact_id":"d026","concept_id":"d026","root_concept":"Attack Logging","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What source-side identifier should be stored for future attack analysis?","choices":["Screen size","Attacker IP","CPU model","Font"],"answer":"Attacker IP","explanation":"Attacker IP is explicitly listed.","id":"S01Q50"}],[{"fact_id":"h037","concept_id":"h037","root_concept":"Honeytrap","variant":1,"category":"Honeypot Concepts","question":"Which trivial file-transfer protocol is explicitly supported by Honeytrap?","choices":["SIP","SMTP","LDAP","TFTP"],"answer":"TFTP","explanation":"Honeytrap supports TFTP.","id":"S02Q01"},{"fact_id":"b085","concept_id":"b085","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What is shared between malware and the C2 server to generate the same domains?","choices":["Seed","TTL value","TCP window","MAC OUI"],"answer":"Seed","explanation":"A shared seed synchronizes domain generation.","id":"S02Q02"},{"fact_id":"n022","concept_id":"n022","root_concept":"Ghostwriting","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique modifies malware code structure without changing functionality?","choices":["CPL Side-Loading","AI-Assisted Evasion","Process Injection","Ghostwriting"],"answer":"Ghostwriting","explanation":"Ghostwriting changes structure while preserving behavior.","id":"S02Q03"},{"fact_id":"c002","concept_id":"c002","root_concept":"IDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What system is referred to as a packet sniffer in the course?","choices":["SIEM","HIDS","NIDS","IDS"],"answer":"IDS","explanation":"The course describes IDS as intercepting packets via TCP/IP for analysis.","id":"S02Q04"},{"fact_id":"c015","concept_id":"c015","root_concept":"NIDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which availability attack is explicitly listed as detectable by a NIDS?","choices":["Time drift","DoS attacks","File compression","Password aging"],"answer":"DoS attacks","explanation":"DoS attacks are listed among NIDS-detectable activities.","id":"S02Q05"},{"fact_id":"b033","concept_id":"b033","root_concept":"Banner Grabbing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What kind of information source does banner grabbing inspect?","choices":["File ACL only","ARP cache only","Service announcement banner","DHCP lease only"],"answer":"Service announcement banner","explanation":"Banner grabbing inspects service announcement text.","id":"S02Q06"},{"fact_id":  Instead of URL","variant":1,"category":"Bypassing IDS/Firewalls","question":"What must a user type instead of a blocked domain name in this evasion?","choices":["MAC address","Session cookie","Username","IP address"],"answer":"IP address","explanation":"The technique uses the numeric IP directly.","id":"S02Q17"},{"fact_id":"b132","concept_id":"b132","root_concept":"BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What two paths are supplied to the /addfile operation?","choices":["Two passwords","Two VLAN IDs","Remote URL and local path","Two MAC addresses"],"answer":"Remote URL and local path","explanation":"BITS needs a source URL and destination local path.","id":"S02Q18"},{"fact_id":"d032","concept_id":"d032","root_concept":"Remote Syslog","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What logging control stores firewall events on another protected system?","choices":["Traffic Catalog Review","Remote Syslog","Deep Packet Inspection","Security Audits"],"answer":"Remote Syslog","explanation":"Remote syslog protects evidence from local compromise.","id":"S02Q19"},{"fact_id":"b136","concept_id":"b136","root_concept":"Source Routing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What security deployment weakness does source routing exploit?","choices":["Too many backups","Full segmentation","Incomplete IDS/firewall coverage","Strong MFA"],"answer":"Incomplete IDS/firewall coverage","explanation":"It steers traffic through less-monitored segments.","id":"S02Q20"},{"fact_id":"h052","concept_id":"h052","root_concept":"Analyzing Response Time","variant":1,"category":"Honeypot Concepts","question":"What basic network tools are also mentioned for timing analysis?","choices":["Burp and ZAP","Hydra and John","Ping and Traceroute","Reaver and Aircrack"],"answer":"Ping and Traceroute","explanation":"Ping and traceroute can reveal response timing.","id":"S02Q21"},{"fact_id":"b103","concept_id":"b103","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What BITS operation adds a malicious URL and local path?","choices":["/addfile","/resume","/complete","/cancel"],"answer":"/addfile","explanation":"The example uses /addfile to attach the transfer.","id":"S02Q22"},{"fact_id":"h001","concept_id":"h001","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"What deception resource is expressly set up to attract and trap attackers?","choices":["Medium-interaction Honeypot","Research Honeypot","Pure Honeypot","Honeypot"],"answer":"Honeypot","explanation":"A honeypot is intentional bait for attackers.","id":"S02Q23"},{"fact_id":"h024","concept_id":"h024","root_concept":"Spam Honeypot","variant":1,"category":"Honeypot Concepts","question":"What deception type is designed to attract spammers or automated spam abuse?","choices":["Spam Honeypot","Spider Honeypot","Database Honeypot","Email Honeypot"],"answer":"Spam Honeypot","explanation":"Spam honeypots study spam behavior.","id":"S02Q24"},{"fact_id":"b147","concept_id":"b147","root_concept":"BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What privilege-related property makes BITS attractive for evasion?","choices":["Guest-only execution","Firmware execution","Trusted system-level execution","No OS privileges"],"answer":"Trusted system-level execution","explanation":"BITS runs at system level and is trusted.","id":"S02Q25"},{"fact_id":"b079","concept_id":"b079","root_concept":"Pre-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"What IDS weakness makes pre-connection SYN desynchronization possible?","choices":["Using MFA","Reassembling fragments","Not checking checksums","Using TLS"],"answer":"Not checking checksums","explanation":"If the IDS ignores invalid checksums, its state can diverge from the host.","id":"S02Q26"},{"fact_id":"d063","concept_id":"d063","root_concept":"Behavior Rules","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What do behavior-based rules use instead of only IP addresses?","choices":["Only MAC OUI","Only checksum","Only TTL","User behavior"],"answer":"User behavior","explanation":"The checklist recommends user-behavior-aware rules.","id":"S02Q27"},{"fact_id":"d020","concept_id":"d020","root_concept":"IDS Placement","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What three factors should be analyzed before IDS deployment?","choices":["DNS, wallpaper, and users","Only VLAN IDs","Topology, traffic, and hosts","Passwords, fonts, and printers"],"answer":"Topology, traffic, and hosts","explanation":"Placement should reflect topology, traffic nature, and monitored hosts.","id":"S02Q28"},{"fact_id":"n073","concept_id":"n073","root_concept":"CPL Side-Loading","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What legitimate Windows component type is abused?","choices":["Control Panel applet","DHCP lease","Browser cookie","DNS zone file"],"answer":"Control Panel applet","explanation":"CPL files are Control Panel applets.","id":"S02Q29"},{"fact_id":"c066","concept_id":"c066","root_concept":"DMZ","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which server is a typical DMZ resident?","choices":["Payroll database","Domain controller","Root CA","Web server"],"answer":"Web server","explanation":"Public web servers commonly reside in a DMZ.","id":"S02Q30"},{"fact_id":"b121","concept_id":"b121","root_concept":"Tiny Fragments","variant":1,"category":"Bypassing IDS/Firewalls","question":"What IDS capability directly counters tiny-fragment evasion?","choices":["Password rotation","DNSSEC","Fragment reassembly","Key escrow"],"answer":"Fragment reassembly","explanation":"Reassembling fragments before inspection removes ambiguity.","id":"S02Q31"},{"fact_id":"b060","concept_id":"b060","root_concept":"ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which Nmap-family tool is also named for ACK tunneling?","choices":["Ncat only","Nping","Zenmap","Ndiff"],"answer":"Nping","explanation":"Nping is listed for ACK tunneling.","id":"S02Q32"},{"fact_id":"c024","concept_id":"c024","root_concept":"Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS method is called not-use detection in the course?","choices":["Anomaly Detection","Protocol Anomaly Detection","Signature Recognition","Stateful Protocol Analysis"],"answer":"Anomaly Detection","explanation":"The course labels anomaly detection as not-use detection.","id":"S02Q33"},{"fact_id":"c023","concept_id":"c023","root_concept":"Signature Recognition","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What can a very large signature database contribute to?","choices":["More VLANs","Stronger passwords","Longer certificates","Dropped packets"],"answer":"Dropped packets","explanation":"Large signature databases can consume resources and contribute to dropped packets.","id":"S02Q34"},{"fact_id":"d062","concept_id":"d062","root_concept":"Geo-Restriction","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What attribute is used to decide whether traffic should be restricted?","choices":["Screen resolution","File size","Geographical region","Password age"],"answer":"Geographical region","explanation":"Geo-restriction uses geographic origin.","id":"S02Q35"},{"fact_id":"n059","concept_id":"n059","root_concept":"AMSI Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What endpoint-evasion technique hooks the antimalware scan function?","choices":["AI-Assisted Evasion","AMSI Bypass","Application Whitelisting Bypass","Thread Call Stack Spoofing"],"answer":"AMSI Bypass","explanation":"AMSI bypass manipulates scan results.","id":"S02Q36"},{"fact_id":"n054","concept_id":"n054","root_concept":"In-memory Beacon Encryption","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique encrypts executable memory while the beacon is dormant?","choices":["Process Injection","Direct System Calls","Ghostwriting","In-memory Beacon Encryption"],"answer":"In-memory Beacon Encryption","explanation":"The beacon memory is encrypted during sleep.","id":"S02Q37"},{"fact_id":"h038","concept_id":"h038","root_concept":"Honeytrap","variant":1,"category":"Honeypot Concepts","question":"What web-related data field can Honeytrap log?","choices":["HTTP_URIs","BGP AS paths","TLS private keys","Kerberos TGTs"],"answer":"HTTP_URIs","explanation":"The course says Honeytrap logs HTTP_URIs.","id":"S02Q38"},{"fact_id":"c074","concept_id":"c074","root_concept":"Defense in Depth","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What modern attack can bypass network layers by abusing trusted users?","choices":["Disk mirroring","Route summarization","ARP aging","Social engineering"],"answer":"Social engineering","explanation":"Social engineering can bypass stacked network controls.","id":"S02Q39"},{"fact_id":"n040","concept_id":"n040","root_concept":"Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What Windows API writes the payload into target-process memory?","choices":["Sleep()","CreateRemoteThread()","VirtualAllocEx()","WriteProcessMemory()"],"answer":"WriteProcessMemory()","explanation":"WriteProcessMemory copies the payload.","id":"S02Q40"},{"fact_id":"d069","concept_id":"d069","root_concept":"Risk Queries","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What kind of firewall rules are risk queries intended to find?","choices":["Only DNS names","Vulnerable rules","Only expired users","Only hidden files"],"answer":"Vulnerable rules","explanation":"Risk queries identify vulnerable rules.","id":"S02Q41"},{"fact_id":"n062","concept_id":"n062","root_concept":"AMSI Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What tool is listed for this memory-hijacking bypass?","choices":["ASBBypass.dll","VLANPWN","Ghostwriting.sh","CPLResourceRunner"],"answer":"ASBBypass.dll","explanation":"ASBBypass.dll is the named tool.","id":"S02Q42"},{"fact_id":"c057","concept_id":"c057","root_concept":"NGFW","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What external intelligence source can an NGFW use to improve decisions?","choices":["Traditional firewall functions","Deep packet inspection","Cloud-based threat intelligence","Integrated IPS"],"answer":"Cloud-based threat intelligence","explanation":"NGFWs can use cloud-based threat intelligence.","id":"S02Q43"},{"fact_id":"c031","concept_id":"c031","root_concept":"Protocol Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What is created after anomalies are identified in protocol anomaly detection?","choices":["Routing tables","User profiles","Detection rules","DNS zones"],"answer":"Detection rules","explanation":"Detection rules are created from identified anomalies.","id":"S02Q44"},{"fact_id":"d003","concept_id":"d003","root_concept":"FIN/RST Termination","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure uses TCP FIN or RST to end malicious sessions?","choices":["User Training/Patching","Attack Logging","FIN/RST Termination","Trusted DNS Resolver"],"answer":"FIN/RST Termination","explanation":"FIN/RST packets can terminate malicious TCP connections.","id":"S02Q45"},{"fact_id":"b087","concept_id":"b087","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What do DGA-generated domains typically look like?","choices":["Human-readable company names only","Gibberish","MAC addresses","IP addresses only"],"answer":"Gibberish","explanation":"The course describes them as gibberish domain names.","id":"S02Q46"},{"fact_id":"s018","concept_id":"s018","root_concept":"Full Packet Capture","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What data source preserves payload content rather than only flow summaries?","choices":["Syslog only","Full packet capture","Asset inventory","NetFlow"],"answer":"Full packet capture","explanation":"Full packet capture preserves packet contents.","id":"S02Q47"},{"fact_id":"h034","concept_id":"h034","root_concept":"Honeytrap","variant":1,"category":"Honeypot Concepts","question":"What traffic does Honeytrap observe?","choices":["Only Bluetooth","Only DNSSEC","TCP/UDP service attacks","Only local keyboard events"],"answer":"TCP/UDP service attacks","explanation":"Honeytrap observes attacks against TCP/UDP services.","id":"S02Q48"},{"fact_id":"n042","concept_id":"n042","root_concept":"Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What is the correct API order for classic process injection?","choices":["CreateRemoteThread → VirtualAllocEx → AmsiScanBuffer","Sleep → WriteProcessMemory → VirtualAllocEx","VirtualAllocEx → WriteProcessMemory → CreateRemoteThread","WriteProcessMemory → VirtualAllocEx → Sleep"],"answer":"VirtualAllocEx → WriteProcessMemory → CreateRemoteThread","explanation":"The course explicitly gives this sequence.","id":"S02Q49"},{"fact_id":"b057","concept_id":"b057","root_concept":"ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"Why are ACK packets attractive for tunneling?","choices":["They never cross firewalls","They may be less scrutinized","They contain DNS records","They are always encrypted"],"answer":"They may be less scrutinized","explanation":"The course notes ACK packets can be trusted more than SYN packets.","id":"S02Q50"}],[{"fact_id":"h079","concept_id":"h079","root_concept":"Port Enumeration","variant":1,"category":"Honeypot Concepts","question":"What Nmap syntax requests all ports?","choices":["-p-","-F only","-O","-sV"],"answer":"-p-","explanation":"-p- scans the full port range.","id":"S03Q01"},{"fact_id":"d035","concept_id":"d035","root_concept":"Traffic Catalog Review","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What control catalogs and reviews all allowed inbound and outbound traffic?","choices":["Zero Trust","Deep Packet Inspection","Traffic Catalog Review","Security Audits"],"answer":"Traffic Catalog Review","explanation":"Allowed traffic should be documented and reviewed.","id":"S03Q02"},{"fact_id":"b074","concept_id":"b074","root_concept":"Scenario 2","variant":1,"category":"Bypassing IDS/Firewalls","question":"What happens to the false fragments at the victim after its timeout expires?","choices":["They are dropped","They are encrypted","They become sessions","They are signed"],"answer":"They are dropped","explanation":"The victim discards them after its shorter timeout.","id":"S03Q03"},{"fact_id":"d028","concept_id":"d028","root_concept":"Attack Logging","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What time-related evidence should be stored with attack IPs?","choices":["Clock brand","CPU frequency","Timestamp","Timezone name only"],"answer":"Timestamp","explanation":"The course lists a timestamp.","id":"S03Q04"},{"fact_id":"b068","concept_id":"b068","root_concept":"Fragmentation Timeout","variant":1,"category":"Bypassing IDS/Firewalls","question":"What mismatch is required for fragmentation-timeout evasion?","choices":["Same password length","Same MAC address","Same DNS TTL","Different IDS and victim timeouts"],"answer":"Different IDS and victim timeouts","explanation":"The evasion relies on inconsistent reassembly timeouts.","id":"S03Q05"},{"fact_id":"n045","concept_id":"n045","root_concept":"CPL Side-Loading","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"When does the embedded malicious code execute?","choices":["Only during DNS lookup","When the legitimate CPL runs","Only after DHCP renewal","Only at BIOS boot"],"answer":"When the legitimate CPL runs","explanation":"The malicious code loads with the CPL.","id":"S03Q06"},{"fact_id":"n074","concept_id":"n074","root_concept":"Direct System Calls","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What class of user-mode monitoring is bypassed by avoiding hooked APIs?","choices":["Physical locks","Disk sectors","API hooks","MFA prompts"],"answer":"API hooks","explanation":"Direct syscalls bypass user-mode hooks.","id":"S03Q07"},{"fact_id":"b106","concept_id":"b106","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What tool is recommended to evaluate BITS traffic?","choices":["Cowrie","Reaver","BitsParser","ICMPTX"],"answer":"BitsParser","explanation":"BitsParser is listed as a BITS countermeasure tool.","id":"S03Q08"},{"fact_id":"h064","concept_id":"h064","root_concept":"Analyzing System Configuration/Metadata","variant":1,"category":"Honeypot Concepts","question":"What general clue is sought across metadata fields?","choices":["No metadata","Only encryption","System inconsistencies","Perfect consistency"],"answer":"System inconsistencies","explanation":"Discrepancies in system information can reveal a honeypot.","id":"S03Q09"},{"fact_id":"c096","concept_id":"c096","root_concept":"NetFlow","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Why is NetFlow lighter than full packet capture?","choices":["It removes routing","It stores summaries","It blocks traffic","It disables encryption"],"answer":"It stores summaries","explanation":"NetFlow stores metadata instead of packet contents.","id":"S03Q10"},{"fact_id":"b067","concept_id":"b067","root_concept":"DNS Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What security weakness does DNS tunneling exploit operationally?","choices":["DNS always encrypts payloads","DNS disables logging","DNS uses no ports","DNS is often allowed through firewalls"],"answer":"DNS is often allowed through firewalls","explanation":"DNS traffic is commonly permitted, making it useful for covert channels.","id":"S03Q11"},{"fact_id":"c019","concept_id":"c019","root_concept":"Signature Recognition","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS method is also called misuse detection?","choices":["Stateful Protocol Analysis","Protocol Anomaly Detection","Anomaly Detection","Signature Recognition"],"answer":"Signature Recognition","explanation":"Signature recognition is also known as misuse detection.","id":"S03Q12"},{"fact_id":"h042","concept_id":"h042","root_concept":"Honeypot Tools","variant":1,"category":"Honeypot Concepts","question":"Which tool named NeroSwarm appears in the honeypot tool list?","choices":["KFSensor","NeroSwarm Honeypot","HoneyBOT","StingBox"],"answer":"NeroSwarm Honeypot","explanation":"NeroSwarm Honeypot is listed.","id":"S03Q13"},{"fact_id":"b125","concept_id":"b125","root_concept":"DNS Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What normal infrastructure service makes DNS tunneling blend into expected traffic?","choices":["Printing","Name resolution","Disk backup","User provisioning"],"answer":"Name resolution","explanation":"DNS is a normal name-resolution service that is often permitted.","id":"S03Q14"},{"fact_id":"n003","concept_id":"n003","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What does DTP stand for?","choices":["Distributed Trunk Protocol","Dynamic Transfer Process","Data Tunnel Process","Dynamic Trunking Protocol"],"answer":"Dynamic Trunking Protocol","explanation":"DTP stands for Dynamic Trunking Protocol.","id":"S03Q15"},{"fact_id":"c037","concept_id":"c037","root_concept":"Firewall","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What filtering method distinguishes traffic by protocol type?","choices":["File hashing","Protocol filtering","Password salting","Time sync"],"answer":"Protocol filtering","explanation":"Protocol filtering identifies traffic types.","id":"S03Q16"},{"fact_id":"c086","concept_id":"c086","root_concept":"Runbook / Playbook","variant":1,"category"
