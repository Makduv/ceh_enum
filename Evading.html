low the network layer?","choices":["Physical","Session","Data Link","Presentation"],"answer":"Data Link","explanation":"Packet filtering also appears at the data-link layer in the course table.","id":"S03Q22"},{"fact_id":"c028","concept_id":"c028","root_concept":"Protocol Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS method detects deviations from protocol standards?","choices":["Anomaly Detection","Signature Recognition","Protocol Anomaly Detection","Stateful Protocol Analysis"],"answer":"Protocol Anomaly Detection","explanation":"Protocol anomaly detection evaluates traffic against expected protocol behavior.","id":"S03Q23"},{"fact_id":"b005","concept_id":"b005","root_concept":"Tiny Fragments","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique forces TCP header information into later IP fragments?","choices":["Windows BITS","HTTP Tunneling","Tiny Fragments","Content/XSS Attack"],"answer":"Tiny Fragments","explanation":"Tiny fragments exploit incomplete fragment inspection.","id":"S03Q24"},{"fact_id":"h031","concept_id":"h031","root_concept":"KFSensor","variant":1,"category":"Honeypot Concepts","question":"What reconnaissance activity can KFSensor identify and alert on?","choices":["Certificate renewal","Disk cleanup","Password expiration","Port scanning"],"answer":"Port scanning","explanation":"KFSensor can detect port scans.","id":"S03Q25"},{"fact_id":"c007","concept_id":"c007","root_concept":"IPS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Where is an IPS placed relative to source and destination?","choices":["Behind no traffic path","Inline","Offline archive","Only on the client"],"answer":"Inline","explanation":"Inline placement lets an IPS inspect and block live traffic.","id":"S03Q26"},{"fact_id":"n023","concept_id":"n023","root_concept":"Ghostwriting","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What security technology is Ghostwriting designed to evade?","choices":["MFA","Network segmentation","Signature-based AV","Disk encryption"],"answer":"Signature-based AV","explanation":"Structural mutation can evade signatures.","id":"S03Q27"},{"fact_id":"d042","concept_id":"d042","root_concept":"Security Audits","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What periodic activity verifies firewall security posture?","choices":["Disable FTP","Security Audits","TLS Inspection","Configuration Backups"],"answer":"Security Audits","explanation":"The course recommends regular firewall security audits.","id":"S03Q28"},{"fact_id":"b083","concept_id":"b083","root_concept":"Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does the IDS incorrectly do with the injected SYN?","choices":["Disables itself","Drops all logs","Rotates keys","Resynchronizes to it"],"answer":"Resynchronizes to it","explanation":"The IDS can resynchronize and lose track of legitimate traffic.","id":"S03Q29"},{"fact_id":"b046","concept_id":"b046","root_concept":"Tiny Fragments","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does the vulnerable filtering router do with fragments after the first?","choices":["Decrypts them","Passes them through","Converts them to UDP","Drops them all"],"answer":"Passes them through","explanation":"Passing later fragments can hide header information.","id":"S03Q30"},{"fact_id":"b041","concept_id":"b041","root_concept":"Source Routing","variant":1,"category":"Bypassing IDS/Firewalls","question":"Who designates the route in a source-routed packet?","choices":["DNS server","Receiver only","Sender","DHCP server"],"answer":"Sender","explanation":"The sender specifies the route.","id":"S03Q31"},{"fact_id":"h039","concept_id":"h039","root_concept":"Honeypot Tools","variant":1,"category":"Honeypot Concepts","question":"Which SSH/Telnet-oriented deception tool is listed among honeypot tools?","choices":["Cowrie","Valhala Honeypot","Honeytrap","HoneyBOT"],"answer":"Cowrie","explanation":"Cowrie is listed among honeypot tools.","id":"S03Q32"},{"fact_id":"d070","concept_id":"d070","root_concept":"Security Audits","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"How often should firewall security audits occur according to the checklist?","choices":["Never","Regularly","Once per decade","Only after breach"],"answer":"Regularly","explanation":"The checklist calls for scheduled regular audits.","id":"S03Q33"},{"fact_id":"d013","concept_id":"d013","root_concept":"Attack Logging","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure stores attacker IP, victim IP, and timestamp for future analysis?","choices":["Topology-Aware IDS Placement","Attack Logging","Block TTL-Expired ICMP","User Training/Patching"],"answer":"Attack Logging","explanation":"Preserving attack metadata supports investigation.","id":"S03Q34"},{"fact_id":"c065","concept_id":"c065","root_concept":"DMZ","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What network zone sits between the public Internet and the corporate intranet?","choices":["UTM","DMZ","Defensible Architecture","Choke Point"],"answer":"DMZ","explanation":"A DMZ is a buffer zone between public and internal networks.","id":"S03Q35"},{"fact_id":"n012","concept_id":"n012","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What target VLAN is shown in the double-tagging example?","choices":["99","20","1","4094"],"answer":"20","explanation":"The example specifies targetvlan 20.","id":"S03Q36"},{"fact_id":"b124","concept_id":"b124","root_concept":"SSH Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What kind of channel protects SSH-tunneled traffic?","choices":["Cleartext UDP only","ARP-only channel","Encrypted channel","Broadcast channel"],"answer":"Encrypted channel","explanation":"SSH provides encryption.","id":"S03Q37"},{"fact_id":"n020","concept_id":"n020","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which NAC bypass tool is explicitly named Silentbridge?","choices":["DTP","BITM","Silentbridge","VLAN Hopping"],"answer":"Silentbridge","explanation":"Silentbridge is listed among NAC bypass tools.","id":"S03Q38"},{"fact_id":"h075","concept_id":"h075","root_concept":"Honeytrap","variant":1,"category":"Honeypot Concepts","question":"What storage does Honeytrap use for captured attack strings?","choices":["ARP cache","Printer queue","DNS root","Database"],"answer":"Database","explanation":"Honeytrap stores attack strings in a database.","id":"S03Q39"},{"fact_id":"c055","concept_id":"c055","root_concept":"NGFW","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What NGFW capability identifies applications rather than relying only on ports?","choices":["Traditional firewall functions","Cloud-based threat intelligence","Deep packet inspection","Application awareness"],"answer":"Application awareness","explanation":"Application awareness is an NGFW capability.","id":"S03Q40"},{"fact_id":"b122","concept_id":"b122","root_concept":"ICMP Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What ICMP message family is used in the course example?","choices":["Echo","Redirect only","Timestamp only","Router Advertisement only"],"answer":"Echo","explanation":"The course refers to ICMP Echo packets.","id":"S03Q41"},{"fact_id":"d002","concept_id":"d002","root_concept":"In-depth Traffic Analysis","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure requires deep analysis of ambiguous network traffic?","choices":["Device Hardening","In-depth Traffic Analysis","FIN/RST Termination","SIEM Monitoring"],"answer":"In-depth Traffic Analysis","explanation":"Ambiguous traffic should be analyzed for multiple possible interpretations.","id":"S03Q42"},{"fact_id":"b135","concept_id":"b135","root_concept":"IP Spoofing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What packet field is changed during IP-address spoofing?","choices":["DNS query name","Source IP address","Destination MAC only","TCP payload only"],"answer":"Source IP address","explanation":"The attacker changes the source IP field.","id":"S03Q43"},{"fact_id":"s014","concept_id":"s014","root_concept":"Logging","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What human resource is also needed for effective log monitoring?","choices":["People to review alerts","No analysts","Only printers","Only DNS admins"],"answer":"People to review alerts","explanation":"Tools still require people to review and act on alerts.","id":"S03Q44"},{"fact_id":"d031","concept_id":"d031","root_concept":"Unique Firewall Service ID","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What account practice avoids running firewall services as admin/root?","choices":["Filter Intruder IP","Unique Firewall Service ID","TLS Inspection","Explicit IP/Port Rules"],"answer":"Unique Firewall Service ID","explanation":"A unique non-admin identity limits privilege.","id":"S03Q45"},{"fact_id":"b144","concept_id":"b144","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What example TLD appears in the gibberish domain shown in the course?","choices":[".org",".ru",".net",".com"],"answer":".ru","explanation":"The example domain ends in .ru.","id":"S03Q46"},{"fact_id":"c053","concept_id":"c053","root_concept":"Packet Filtering","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"At what TCP/IP layer does classic packet filtering work according to the course?","choices":["Physical layer","Presentation layer","Internet layer","Application layer"],"answer":"Internet layer","explanation":"The course maps packet filtering to the TCP/IP internet layer.","id":"S03Q47"},{"fact_id":"n048","concept_id":"n048","root_concept":"Direct System Calls","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What DLL is specifically named as containing hooks attackers try to evade?","choices":["win.ini","hosts.txt","kernel32.ini","ntdll.dll"],"answer":"ntdll.dll","explanation":"The course names ntdll.dll.","id":"S03Q48"},{"fact_id":"s001","concept_id":"s001","root_concept":"YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What malware-research tool uses a rule-based approach to detect or classify malware?","choices":["Wireshark","Firewall Analyzer","YARA","Snort"],"answer":"YARA","explanation":"YARA uses rules to identify malware.","id":"S03Q49"},{"fact_id":"n080","concept_id":"n080","root_concept":"NAC Tools","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which listed NAC bypass tool is specifically named for silent bridging?","choices":["FENRIR","VLANPWN","Ghostwriting.sh","Silentbridge"],"answer":"Silentbridge","explanation":"Silentbridge is listed in the course.","id":"S03Q50"}],[{"fact_id":"c091","concept_id":"c091","root_concept":"NetFlow","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What technology records summary information about network connections?","choices":["Choke Point","NetFlow","Runbook / Playbook","SIEM"],"answer":"NetFlow","explanation":"NetFlow stores connection metadata rather than full payloads.","id":"S04Q01"},{"fact_id":"n060","concept_id":"n060","root_concept":"AMSI Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What function is hooked in the course example?","choices":["AmsiScanBuffer()","WriteProcessMemory()","Sleep()","CreateRemoteThread()"],"answer":"AmsiScanBuffer()","explanation":"The course names AmsiScanBuffer().","id":"S04Q02"},{"fact_id":"b075","concept_id":"b075","root_concept":"Scenario 2","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does the attacker send after the victim drops the false fragments?","choices":["New DHCP lease","ARP broadcast only","Real payload fragments","TLS certificate"],"answer":"Real payload fragments","explanation":"The real payload is sent after victim timeout.","id":"S04Q03"},{"fact_id":"d038","concept_id":"d038","root_concept":"Explicit IP/Port Rules","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What rule practice specifies source/destination addresses and ports?","choices":["Unique Firewall Service ID","Explicit IP/Port Rules","Traffic Catalog Review","Default Deny"],"answer":"Explicit IP/Port Rules","explanation":"Rules should be explicit about endpoints and services.","id":"S04Q04"},{"fact_id":"b127","concept_id":"b127","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What traditional detection approach is challenged by constantly changing domains?","choices":["MFA enrollment","Signature/static filtering","Disk encryption","Physical locks"],"answer":"Signature/static filtering","explanation":"Static blocking is weakened by rapidly changing indicators.","id":"S04Q05"},{"fact_id":"n056","concept_id":"n056","root_concept":"In-memory Beacon Encryption","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"At what hook is beacon memory encryption applied?","choices":["DNS hook","SMTP hook","ARP hook","Sleep() hook"],"answer":"Sleep() hook","explanation":"Encryption/decryption is tied to Sleep() hooks.","id":"S04Q06"},{"fact_id":"b081","concept_id":"b081","root_concept":"Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"What differs in the injected post-connection SYN?","choices":["DNS suffix","MAC OUI only","File hash","Sequence numbers"],"answer":"Sequence numbers","explanation":"The course states it uses divergent sequence numbers.","id":"S04Q07"},{"fact_id":"c069","concept_id":"c069","root_concept":"DMZ","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What kind of servers should not reside in the DMZ?","choices":["Public DNS servers","Mail gateways","Sensitive internal servers","Public web servers"],"answer":"Sensitive internal servers","explanation":"Sensitive internal systems should stay outside the DMZ.","id":"S04Q08"},{"fact_id":"b118","concept_id":"b118","root_concept":"Content/XSS Attack","variant":1,"category":"Bypassing IDS/Firewalls","question":"At what layer do content/XSS evasion techniques primarily operate?","choices":["Application layer","Application","Data Link","Transport"],"answer":"Application layer","explanation":"Content/XSS attacks exploit application-layer processing.","id":"S04Q09"},{"fact_id":"c098","concept_id":"c098","root_concept":"SIEM","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What can a SIEM generate when patterns indicate a threat?","choices":["Alerts","DHCP leases","CSRs","Routing loops"],"answer":"Alerts","explanation":"SIEM correlation can generate alerts.","id":"S04Q10"},{"fact_id":"h040","concept_id":"h040","root_concept":"Honeypot Tools","variant":1,"category":"Honeypot Concepts","question":"Which tool named HoneyBOT is listed in the honeypot tool list?","choices":["HoneyBOT","Honeytrap","StingBox","Blumira Honeypot"],"answer":"HoneyBOT","explanation":"HoneyBOT appears in the course list.","id":"S04Q11"},{"fact_id":"h076","concept_id":"h076","root_concept":"Response Time","variant":1,"category":"Honeypot Concepts","question":"Why might a honeypot respond more slowly than a genuine service?","choices":["No IP address","Extra logging/monitoring overhead","No CPU","No TCP stack"],"answer":"Extra logging/monitoring overhead","explanation":"Deception and monitoring can add latency.","id":"S04Q12"},{"fact_id":"h061","concept_id":"h061","root_concept":"Analyzing System Configuration/Metadata","variant":1,"category":"Honeypot Concepts","question":"What honeypot-detection method examines banners, configuration, and metadata together?","choices":["Analyzing Response Time","Fingerprinting Running Service","Analyzing System Configuration/Metadata","Enumerating Unexpected Open Ports"],"answer":"Analyzing System Configuration/Metadata","explanation":"Configuration inconsistencies can reveal deception.","id":"S04Q13"},{"fact_id":"c047","concept_id":"c047","root_concept":"Physical Layer","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What firewall technology is listed at the Physical layer?","choices":["Packet Filtering","Not Applicable","NAT","Application Proxy"],"answer":"Not Applicable","explanation":"No firewall technology is listed at the physical layer.","id":"S04Q14"},{"fact_id":"d023","concept_id":"d023","root_concept":"DNS Resolver","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Where can the client resolver DNS server be defined?","choices":["Only printers","Only switches with no IP","Routers/similar devices","Only browsers"],"answer":"Routers/similar devices","explanation":"The checklist names routers and similar network devices.","id":"S04Q15"},{"fact_id":"b098","concept_id":"b098","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What tool is explicitly listed for HTML smuggling?","choices":["ICMPTX","HTML Smuggler","KFSensor","VLANPWN"],"answer":"HTML Smuggler","explanation":"HTML Smuggler is the named tool.","id":"S04Q16"},{"fact_id":"b088","concept_id":"b088","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What security control do rapidly changing DGA domains evade?","choices":["Static IP/domain blocking","Disk encryption","Code signing","MFA"],"answer":"Static IP/domain blocking","explanation":"DGAs evade static gateway/signature blocklists.","id":"S04Q17"},{"fact_id":"s011","concept_id":"s011","root_concept":"SIEM","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What technology correlates events and can alert on suspicious patterns?","choices":["YARA","Wireshark","SIEM","Splunk"],"answer":"SIEM","explanation":"SIEM platforms organize and correlate events.","id":"S04Q18"},{"fact_id":"c017","concept_id":"c017","root_concept":"HIDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What component is typically installed on each monitored host for HIDS?","choices":["Agent","Router","DNS forwarder","Load balancer"],"answer":"Agent","explanation":"HIDS commonly uses a local agent.","id":"S04Q19"},{"fact_id":"b026","concept_id":"b026","root_concept":"Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"How is firewalking TTL set relative to the targeted firewall?","choices":["One hop greater","Exactly zero","Randomly below zero","One hop lower"],"answer":"One hop greater","explanation":"The probe is sent with TTL one hop beyond the firewall.","id":"S04Q20"},{"fact_id":"b020","concept_id":"b020","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which product is listed as listening on UDP 514/1514?","choices":["YARA","KFSensor","Snort","ManageEngine Firewall Analyzer"],"answer":"ManageEngine Firewall Analyzer","explanation":"The course gives ManageEngine Firewall Analyzer as an identification example.","id":"S04Q21"},{"fact_id":"d052","concept_id":"d052","root_concept":"Log Review","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What should analysts do with suspicious firewall log entries?","choices":["Convert them to DNS records","Delete them immediately","Investigate them","Ignore them"],"answer":"Investigate them","explanation":"Suspicious entries should be investigated.","id":"S04Q22"},{"fact_id":"h022","concept_id":"h022","root_concept":"Malware Honeypot","variant":1,"category":"Honeypot Concepts","question":"What deception type is designed to attract or study malicious software?","choices":["Spam Honeypot","Malware Honeypot","Database Honeypot","Honeynet"],"answer":"Malware Honeypot","explanation":"Malware honeypots focus on malicious code.","id":"S04Q23"},{"fact_id":"b140","concept_id":"b140","root_concept":"Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"What tracking problem occurs after the IDS resynchronizes to the injected SYN?","choices":["Creates a VLAN","Rotates keys","Gains stronger encryption","Loses legitimate traffic state"],"answer":"Loses legitimate traffic state","explanation":"The IDS loses track of the real stream.","id":"S04Q24"},{"fact_id":"b025","concept_id":"b025","root_concept":"Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"What IP field does firewalking manipulate?","choices":["TCP checksum","Urgent pointer","TTL","Window size"],"answer":"TTL","explanation":"Firewalking uses TTL behavior.","id":"S04Q25"},{"fact_id":"h017","concept_id":"h017","root_concept":"Medium-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type simulates a real OS, applications, and services?","choices":["High-interaction Honeypot","Medium-interaction Honeypot","Honeynet","Low-interaction Honeypot"],"answer":"Medium-interaction Honeypot","explanation":"Medium interaction provides a more realistic simulated environment.","id":"S04Q26"},{"fact_id":"h059","concept_id":"h059","root_concept":"Enumerating Unexpected Open Ports","variant":1,"category":"Honeypot Concepts","question":"What extra ports are given as suspicious on a web server expected to expose only 80/443?","choices":["389 and 636","123 and 161","53 and 67","21 and 22"],"answer":"21 and 22","explanation":"The course gives extra 21/22 as an example inconsistency.","id":"S04Q27"},{"fact_id":"n018","concept_id":"n018","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which tool named in the course begins with F and is used for NAC bypass?","choices":["Silentbridge","VLANPWN","FENRIR","Pre-authenticated Device"],"answer":"FENRIR","explanation":"FENRIR is listed among NAC bypass tools.","id":"S04Q28"},{"fact_id":"b117","concept_id":"b117","root_concept":"MITM Attack","variant":1,"category":"Bypassing IDS/Firewalls","question":"What can a MITM attacker do to traffic besides reading it?","choices":["Only compress it","Modify it","Only route it unchanged","Only log out users"],"answer":"Modify it","explanation":"A MITM position can relay and alter traffic.","id":"S04Q29"},{"fact_id":"s006","concept_id":"s006","root_concept":"YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What do YARA strings and Boolean conditions ultimately define?","choices":["Firewall zones","Routing tables","DHCP scopes","Detection rules"],"answer":"Detection rules","explanation":"YARA organizes matching logic into rules.","id":"S04Q30"},{"fact_id":"n069","concept_id":"n069","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What switch setting should be avoided to reduce DTP-based trunk abuse?","choices":["Dynamic trunk negotiation","Static access mode","Explicit access configuration","Port shutdown"],"answer":"Dynamic trunk negotiation","explanation":"Dynamic auto/desirable enables DTP negotiation.","id":"S04Q31"},{"fact_id":"d033","concept_id":"d033","root_concept":"Regular Log Review","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What operational control requires frequent investigation of suspicious firewall entries?","choices":["Regular Log Review","Security Audits","Rule Risk Queries","Zero Trust"],"answer":"Regular Log Review","explanation":"Firewall logs should be reviewed regularly.","id":"S04Q32"},{"fact_id":"c084","concept_id":"c084","root_concept":"Defensible Architecture","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What capability lets operations teams see anomalous behavior across the environment?","choices":["Logging and monitoring","Disk cleanup","Static NAT only","SSID hiding"],"answer":"Logging and monitoring","explanation":"Visibility controls are central to defensible architecture.","id":"S04Q33"},{"fact_id":"b006","concept_id":"b006","root_concept":"IP Instead of URL","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique tries to bypass domain blocking by browsing directly to a numeric address?","choices":["IP Instead of URL","DNS Tunneling","MITM Attack","ICMP Tunneling"],"answer":"IP Instead of URL","explanation":"Using an IP can bypass filters that only block domain names.","id":"S04Q34"},{"fact_id":"n072","concept_id":"n072","root_concept":"Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What process state is required for the target of process injection?","choices":["Powered-off host","Unformatted disk","Running process","Deleted process"],"answer":"Running process","explanation":"The course specifies injection into a running process.","id":"S04Q35"},{"fact_id":"d015","concept_id":"d015","root_concept":"Switch Port Shutdown","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What is the immediate effect of shutting down an attack host’s switch port?","choices":["Network isolation","Longer TTL","More logging only","Stronger encryption"],"answer":"Network isolation","explanation":"The host is cut off from the network.","id":"S04Q36"},{"fact_id":"c100","concept_id":"c100","root_concept":"Choke Point","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What network design element lets responders block, redirect, or inspect traffic?","choices":["Choke Point","Isolation","Defensible Architecture","Segmentation"],"answer":"Choke Point","explanation":"Choke points provide traffic-control locations.","id":"S04Q37"},{"fact_id":"b011","concept_id":"b011","root_concept":"SSH Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique uses SSH port forwarding to bypass firewall restrictions?","choices":["SSH Tunneling","Source Routing","External Systems","Port Scanning"],"answer":"SSH Tunneling","explanation":"SSH tunneling carries traffic through an encrypted SSH channel.","id":"S04Q38"},{"fact_id":"n070","concept_id":"n070","root_concept":"Ghostwriting","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Does Ghostwriting change malware functionality?","choices":["Only network behavior","Only file names","Yes, always","No"],"answer":"No","explanation":"The technique modifies structure without affecting functionality.","id":"S04Q39"},{"fact_id":"n025","concept_id":"n025","root_concept":"Ghostwriting","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What code is inserted during Ghostwriting to alter the binary structure?","choices":["Only HTML comments","Only DNS records","Arbitrary assembly code","Only MAC addresses"],"answer":"Arbitrary assembly code","explanation":"Arbitrary assembly code insertion changes the binary structure.","id":"S04Q40"},{"fact_id":"h026","concept_id":"h026","root_concept":"Spider Honeypot","variant":1,"category":"Honeypot Concepts","question":"What deception type is intended to attract malicious web crawlers?","choices":["Honeynet","Spider Honeypot","Malware Honeypot","Database Honeypot"],"answer":"Spider Honeypot","explanation":"Spider honeypots target automated crawlers.","id":"S04Q41"},{"fact_id":"h050","concept_id":"h050","root_concept":"Analyzing Response Time","variant":1,"category":"Honeypot Concepts","question":"What scan-delay value is shown in the response-time Nmap example?","choices":["60s","1s","10s","100ms"],"answer":"1s","explanation":"The example uses --scan-delay 1s.","id":"S04Q42"},{"fact_id":"c026","concept_id":"c026","root_concept":"Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What does anomaly detection treat as an attack indicator?","choices":["Deviation from regular use","Exact signature only","Approved software","Valid certificate"],"answer":"Deviation from regular use","explanation":"Anomaly detection flags deviations from normal behavior.","id":"S04Q43"},{"fact_id":"n030","concept_id":"n030","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Where is the malicious DLL placed?","choices":["DNS root zone","User recycle bin only","Switch CAM table","Directory searched by the whitelisted app"],"answer":"Directory searched by the whitelisted app","explanation":"The technique relies on the application finding the attacker DLL first.","id":"S04Q44"},{"fact_id":"b050","concept_id":"b050","root_concept":"Proxy Server","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does a proxy hide or change from the destination perspective?","choices":["Apparent source path","File hash","CPU model","Password entropy"],"answer":"Apparent source path","explanation":"A proxy relays requests through an intermediary.","id":"S04Q45"},{"fact_id":"c009","concept_id":"c009","root_concept":"IPS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What type of logs does an IPS continuously record?","choices":["Only password hashes","Only DNS zones","Real-time logs","Only monthly reports"],"answer":"Real-time logs","explanation":"The course lists continuous real-time logging as an IPS action.","id":"S04Q46"},{"fact_id":"d055","concept_id":"d055","root_concept":"Firewall Rules","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What two endpoint attributes should rules explicitly specify?","choices":["Two passwords","Two certificates only","Source and destination IPs","Two MAC OUIs only"],"answer":"Source and destination IPs","explanation":"The checklist explicitly requires source/destination addresses.","id":"S04Q47"},{"fact_id":"b036","concept_id":"b036","root_concept":"IP Address Spoofing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does the target believe after successful source-IP spoofing?","choices":["Traffic came from a trusted source","The packet was fragmented","TLS was disabled","DNS was encrypted"],"answer":"Traffic came from a trusted source","explanation":"Spoofing exploits trust in source addresses.","id":"S04Q48"},{"fact_id":"d056","concept_id":"d056","root_concept":"Firewall Rules","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What service attributes should rules explicitly specify with IPs?","choices":["CPU model","File owner","Ports","Wallpaper"],"answer":"Ports","explanation":"Rules should specify ports.","id":"S04Q49"},{"fact_id":"c006","concept_id":"c006","root_concept":"IPS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security system is considered an active IDS?","choices":["HIDS","IDS","IPS","Firewall"],"answer":"IPS","explanation":"An IPS is an active IDS because it can prevent intrusions.","id":"S04Q50"}],[{"fact_id":"b123","concept_id":"b123","root_concept":"ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What malicious content is placed inside crafted ACK packets?","choices":["Payload data","Only TTL","Only checksum","Only MAC OUI"],"answer":"Payload data","explanation":"ACK tunneling puts malicious payloads in ACK packets.","id":"S05Q01"},{"fact_id":"h019","concept_id":"h019","root_concept":"Pure Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type emulates the real production network of an organization?","choices":["Honeypot","Honeynet","Pure Honeypot","Low-interaction Honeypot"],"answer":"Pure Honeypot","explanation":"Pure honeypots closely emulate production environments.","id":"S05Q02"},{"fact_id":"c042","concept_id":"c042","root_concept":"Circuit-Level Gateway","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"At what OSI layer are circuit-level gateways listed?","choices":["Network","Physical","Data Link","Session"],"answer":"Session","explanation":"Circuit-level gateways are associated with the session layer.","id":"S05Q03"},{"fact_id":"h056","concept_id":"h056","root_concept":"Analyzing MAC Address","variant":1,"category":"Honeypot Concepts","question":"What kind of OUI may suggest a honeypot?","choices":["Expected vendor OUI","No MAC address ever","Valid DNSSEC","Unusual OUI"],"answer":"Unusual OUI","explanation":"An unusual vendor identifier can be suspicious.","id":"S05Q04"},{"fact_id":"b092","concept_id":"b092","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What browser object holds reconstructed malicious content?","choices":["VLAN tag","ARP entry","Cookie only","Blob"],"answer":"Blob","explanation":"The course describes a JavaScript-based blob.","id":"S05Q05"},{"fact_id":"h010","concept_id":"h010","root_concept":"Low-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type simulates only a limited number of services?","choices":["Research Honeypot","High-interaction Honeypot","Pure Honeypot","Low-interaction Honeypot"],"answer":"Low-interaction Honeypot","explanation":"Low-interaction honeypots emulate limited services.","id":"S05Q06"},{"fact_id":"h032","concept_id":"h032","root_concept":"KFSensor","variant":1,"category":"Honeypot Concepts","question":"What availability attack can KFSensor identify and alert on?","choices":["Backup jobs","DoS attacks","DNSSEC signing","MFA prompts"],"answer":"DoS attacks","explanation":"The course lists DoS detection.","id":"S05Q07"},{"fact_id":"b034","concept_id":"b034","root_concept":"Banner Grabbing","variant":1,"category":"Bypassing IDS/Firewalls","question":"Is banner grabbing mainly fingerprinting or exploitation?","choices":["Privilege escalation","Fingerprinting","Credential rotation","Data destruction"],"answer":"Fingerprinting","explanation":"The course calls it a simple fingerprinting method.","id":"S05Q08"},{"fact_id":"n053","concept_id":"n053","root_concept":"Thread Call Stack Spoofing","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"During what implant state is stack spoofing especially used?","choices":["User enrollment","DHCP discovery","BIOS update","Dormant/beaconing state"],"answer":"Dormant/beaconing state","explanation":"The course associates it with sleeping/beaconing implants.","id":"S05Q09"},{"fact_id":"n055","concept_id":"n055","root_concept":"In-memory Beacon Encryption","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What simple operation is named for encrypting dormant beacon memory?","choices":["XOR","Base64 only","SHA-256 only","RSA key exchange"],"answer":"XOR","explanation":"The course specifically mentions XOR.","id":"S05Q10"},{"fact_id":"c080","concept_id":"c080","root_concept":"UTM","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What management advantage does UTM provide?","choices":["Unified console","More VLAN tags","Longer TTL","More IP addresses"],"answer":"Unified console","explanation":"UTM can consolidate management into one console.","id":"S05Q11"},{"fact_id":"n067","concept_id":"n067","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What role does the attacker device perform between endpoints?","choices":["Transparent relay/bridge","DNS root","Backup server","Certificate authority"],"answer":"Transparent relay/bridge","explanation":"Traffic is relayed through the attacker device.","id":"S05Q12"},{"fact_id":"b065","concept_id":"b065","root_concept":"SSH Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What two forwarding directions are mentioned for SSH tunneling?","choices":["Static and dynamic DNS","Local and remote","Inbound and broadcast","Client and DHCP"],"answer":"Local and remote","explanation":"The course mentions local/remote port forwarding.","id":"S05Q13"},{"fact_id":"b019","concept_id":"b019","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"What information does port scanning primarily identify during IDS/firewall reconnaissance?","choices":["Encryption keys","Open ports and services","User passwords","File contents"],"answer":"Open ports and services","explanation":"Port scanning identifies exposed ports and services.","id":"S05Q14"},{"fact_id":"d043","concept_id":"d043","root_concept":"HTTP Evader Testing","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What tool is named for automated testing of suspected firewall evasions?","choices":["KFSensor","VLANPWN","HTTP Evader","ICMPTX"],"answer":"HTTP Evader","explanation":"HTTP Evader is named in the checklist.","id":"S05Q15"},{"fact_id":"s004","concept_id":"s004","root_concept":"YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What readable pattern type can YARA rules match?","choices":["Only usernames","Only certificates","Only IP addresses","Plain-text strings"],"answer":"Plain-text strings","explanation":"YARA can match plain-text strings.","id":"S05Q16"},{"fact_id":"b078","concept_id":"b078","root_concept":"Pre-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"What is intentionally invalid in the pre-connection SYN?","choices":["DNS TTL","HTTP method","Source MAC only","TCP checksum"],"answer":"TCP checksum","explanation":"The SYN uses an invalid TCP checksum.","id":"S05Q17"},{"fact_id":"h045","concept_id":"h045","root_concept":"Fingerprinting Running Service","variant":1,"category":"Honeypot Concepts","question":"What honeypot-detection method compares claimed services with actual behavior?","choices":["Analyzing System Configuration/Metadata","Fingerprinting Running Service","Analyzing Response Time","Analyzing MAC Address"],"answer":"Fingerprinting Running Service","explanation":"Service inconsistencies can reveal deception.","id":"S05Q18"},{"fact_id":"n013","concept_id":"n013","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What NAC bypass method abuses a device that has already passed authentication?","choices":["Pre-authenticated Device","VLANPWN","VLAN Hopping","FENRIR"],"answer":"Pre-authenticated Device","explanation":"The attacker piggybacks through an already-authorized device.","id":"S05Q19"},{"fact_id":"c013","concept_id":"c013","root_concept":"NIDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"How much entering network traffic does the course say a NIDS checks?","choices":["Only TCP SYNs","Every packet","Only DNS traffic","Only encrypted traffic"],"answer":"Every packet","explanation":"NIDS checks every packet entering the monitored network.","id":"S05Q20"},{"fact_id":"d040","concept_id":"d040","root_concept":"Physical Access Control","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What control protects the firewall appliance from unauthorized physical access?","choices":["Geo-Restriction","Physical Access Control","Regular Log Review","Admin Access Control"],"answer":"Physical Access Control","explanation":"Physical access to the firewall should be controlled.","id":"S05Q21"},{"fact_id":"b114","concept_id":"b114","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What user behavior should be avoided as part of BITS countermeasures?","choices":["Patching systems","Downloading suspicious files","Reading logs","Using MFA"],"answer":"Downloading suspicious files","explanation":"Avoiding suspicious downloads reduces initial compromise risk.","id":"S05Q22"},{"fact_id":"b102","concept_id":"b102","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What BITS operation creates the job named persistence in the example?","choices":["/scan persistence","/create persistence","/delete persistence","/hash persistence"],"answer":"/create persistence","explanation":"The example begins by creating a BITS job.","id":"S05Q23"},{"fact_id":"n041","concept_id":"n041","root_concept":"Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What Windows API starts execution of the injected code?","choices":["VirtualAllocEx()","AmsiScanBuffer()","WriteProcessMemory()","CreateRemoteThread()"],"answer":"CreateRemoteThread()","explanation":"CreateRemoteThread launches execution in the target process.","id":"S05Q24"},{"fact_id":"s017","concept_id":"s017","root_concept":"NetFlow","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What data source is lighter than full packet capture but still useful for anomaly detection?","choices":["Disk image","NetFlow","Memory dump","Source code archive"],"answer":"NetFlow","explanation":"NetFlow stores connection summaries.","id":"S05Q25"},{"fact_id":"d030","concept_id":"d030","root_concept":"Default Deny","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What firewall policy denies all traffic except explicitly required services?","choices":["Default Deny","Configuration Backups","Explicit IP/Port Rules","Unique Firewall Service ID"],"answer":"Default Deny","explanation":"Default deny minimizes exposure.","id":"S05Q26"},{"fact_id":"d064","concept_id":"d064","root_concept":"Zero Trust","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Which traffic locations are assumed untrusted in zero trust?","choices":["Internal only","Internal and external","External only","Wireless only"],"answer":"Internal and external","explanation":"The course explicitly states internal and external traffic.","id":"S05Q27"},{"fact_id":"b071","concept_id":"b071","root_concept":"Scenario 1","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does the victim still do after the NIDS has discarded the fragments?","choices":["Reboots","Drops all traffic","Changes IP","Accepts/reassembles them"],"answer":"Accepts/reassembles them","explanation":"The victim timeout is longer, so it still accepts the fragments.","id":"S05Q28"},{"fact_id":"c040","concept_id":"c040","root_concept":"VPN","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"At what OSI layer is VPN listed together with application proxies?","choices":["Network","Presentation","Data Link","Application"],"answer":"Application","explanation":"The course table includes VPN at the application layer.","id":"S05Q29"},{"fact_id":"d016","concept_id":"d016","root_concept":"Ambiguous Traffic","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Why should ambiguous traffic be analyzed in depth?","choices":["It creates users","It disables DNS","It always contains passwords","Different interpretations may hide threats"],"answer":"Different interpretations may hide threats","explanation":"Evasion often relies on IDS/host interpretation differences.","id":"S05Q30"},{"fact_id":"n019","concept_id":"n019","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which NAC bypass tool has a name that plays on “NAC”?","choices":["NACkered","VLANPWN","FENRIR","Pre-authenticated Device"],"answer":"NACkered","explanation":"NACkered is listed among NAC bypass tools.","id":"S05Q31"},{"fact_id":"c033","concept_id":"c033","root_concept":"Firewall","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What device verifies incoming and outgoing traffic against configured rules?","choices":["Firewall","NGFW","IPS","NIDS"],"answer":"Firewall","explanation":"A firewall allows or denies traffic according to policy.","id":"S05Q32"},{"fact_id":"c036","concept_id":"c036","root_concept":"Firewall","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What filtering method uses source and destination addresses?","choices":["Tokenization","Code signing","Address filtering","Disk mirroring"],"answer":"Address filtering","explanation":"Address filtering evaluates source and destination addressing.","id":"S05Q33"},{"fact_id":"b086","concept_id":"b086","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What can a DGA seed be according to the course?","choices":["Number or phrase","Only port number","Only MAC address","Only IP address"],"answer":"Number or phrase","explanation":"The seed can be a number or phrase.","id":"S05Q34"},{"fact_id":"b077","concept_id":"b077","root_concept":"Pre-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"When is a pre-connection SYN sent?","choices":["After system shutdown","Before the real connection","After DNSSEC validation","After logout"],"answer":"Before the real connection","explanation":"The misleading SYN is sent before the legitimate connection.","id":"S05Q35"},{"fact_id":"b128","concept_id":"b128","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What web-side feature performs the payload assembly after gateway inspection?","choices":["Client-side JavaScript","SNMP polling","BGP routing","DHCP relay"],"answer":"Client-side JavaScript","explanation":"The browser script reconstructs the payload locally.","id":"S05Q36"},{"fact_id":"d036","concept_id":"d036","root_concept":"Rule Risk Queries","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What activity identifies vulnerable or overly permissive firewall rules?","choices":["Geo-Restriction","Filter Intruder IP","Rule Risk Queries","Physical Access Control"],"answer":"Rule Risk Queries","explanation":"Regular risk queries identify weak rules.","id":"S05Q37"},{"fact_id":"c062","concept_id":"c062","root_concept":"VPN","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What is the main purpose of a VPN in the course?","choices":["Wireless discovery","Email filtering","Secure private-network access","Public DNS hosting"],"answer":"Secure private-network access","explanation":"A VPN provides secure access to a private network via the Internet.","id":"S05Q38"},{"fact_id":"b003","concept_id":"b003","root_concept":"IP Address Spoofing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique changes the source IP to a trusted host address?","choices":["Content/XSS Attack","IP Address Spoofing","Firewalking","ICMP Tunneling"],"answer":"IP Address Spoofing","explanation":"IP spoofing makes packets appear to come from a trusted source.","id":"S05Q39"},{"fact_id":"c016","concept_id":"c016","root_concept":"HIDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS type audits activity on a specific host?","choices":["HIDS","IDS","Firewall","UTM"],"answer":"HIDS","explanation":"HIDS focuses on one endpoint.","id":"S05Q40"},{"fact_id":"d059","concept_id":"d059","root_concept":"HTTP Evader","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What is HTTP Evader used to test?","choices":["Disk encryption","Password reuse","Wireless channels","Suspected firewall evasions"],"answer":"Suspected firewall evasions","explanation":"The course recommends it for automated evasion testing.","id":"S05Q41"},{"fact_id":"n038","concept_id":"n038","root_concept":"Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique executes malware inside the memory space of a running process?","choices":["AI-Assisted Evasion","AMSI Bypass","In-memory Beacon Encryption","Process Injection"],"answer":"Process Injection","explanation":"Process injection hides payload execution inside another process.","id":"S05Q42"},{"fact_id":"n061","concept_id":"n061","root_concept":"AMSI Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What result is forced by the hooked AMSI function?","choices":["AMSI_RESULT_CLEAN","STATUS_TIMEOUT","DNS_SUCCESS","ACCESS_DENIED"],"answer":"AMSI_RESULT_CLEAN","explanation":"The bypass forces a clean result.","id":"S05Q43"},{"fact_id":"b107","concept_id":"b107","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What Windows log should defenders monitor for BITS abuse?","choices":["DNS debug log only","Print service log","Bluetooth log","BITS-client event log"],"answer":"BITS-client event log","explanation":"The course recommends monitoring the BITS-client event log.","id":"S05Q44"},{"fact_id":"h029","concept_id":"h029","root_concept":"KFSensor","variant":1,"category":"Honeypot Concepts","question":"What transport protocols does KFSensor monitor?","choices":["TCP and UDP","SCTP only","UDP only","TCP only"],"answer":"TCP and UDP","explanation":"KFSensor monitors TCP/UDP ports.","id":"S05Q45"},{"fact_id":"b141","concept_id":"b141","root_concept":"Fragmentation Scenario 1","variant":1,"category":"Bypassing IDS/Firewalls","question":"What relationship lets the victim accept fragments after the NIDS drops them?","choices":["Timeouts are equal","Victim timeout is longer","Victim timeout is shorter","No timeout exists"],"answer":"Victim timeout is longer","explanation":"Scenario 1 depends on a longer victim reassembly timeout.","id":"S05Q46"},{"fact_id":"c090","concept_id":"c090","root_concept":"Logging","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What capability is essential for both visibility and forensic evidence?","choices":["NetFlow","Incident","Logging","SIEM"],"answer":"Logging","explanation":"Without logs, defenders lack evidence and visibility.","id":"S05Q47"},{"fact_id":"c088","concept_id":"c088","root_concept":"Incident","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What term means an event violated organizational policy?","choices":["Event","Runbook / Playbook","NetFlow","Incident"],"answer":"Incident","explanation":"An incident is an event that violates policy.","id":"S05Q48"},{"fact_id":"h080","concept_id":"h080","root_concept":"Honeypot Detection","variant":1,"category":"Honeypot Concepts","question":"What is the common goal of the five honeypot-detection methods?","choices":["Create users","Increase encryption","Find inconsistencies","Disable logging"],"answer":"Find inconsistencies","explanation":"Detection methods look for behavior or metadata inconsistent with a real host.","id":"S05Q49"},{"fact_id":"h041","concept_id":"h041","root_concept":"Honeypot Tools","variant":1,"category":"Honeypot Concepts","question":"Which Blumira product is listed as a honeypot tool?","choices":["Blumira Honeypot","KFSensor","Valhala Honeypot","StingBox"],"answer":"Blumira Honeypot","explanation":"Blumira honeypot software is listed.","id":"S05Q50"}],[{"fact_id":"b109","concept_id":"b109","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What BITS setting should be limited to reduce long-lived malicious jobs?","choices":["DNS suffix","Screen timeout","ARP cache size","Maximum job age"],"answer":"Maximum job age","explanation":"The course recommends limiting max job age.","id":"S06Q01"},{"fact_id":"c018","concept_id":"c018","root_concept":"HIDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Why is HIDS described as less common in the course?","choices":["Monitoring overhead","No agents exist","No endpoint visibility","No log support"],"answer":"Monitoring overhead","explanation":"Monitoring every host event can create significant overhead.","id":"S06Q02"},{"fact_id":"b035","concept_id":"b035","root_concept":"IP Address Spoofing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What source identity is forged in IP spoofing to bypass trust rules?","choices":["DNSSEC key","VLAN tag only","Victim password","Trusted host IP"],"answer":"Trusted host IP","explanation":"The attacker uses a trusted host IP as the source.","id":"S06Q03"},{"fact_id":"b044","concept_id":"b044","root_concept":"Tiny Fragments","variant":1,"category":"Bypassing IDS/Firewalls","question":"What IDS task becomes difficult when TCP headers are split across fragments?","choices":["Traffic stream reassembly","Password hashing","Certificate issuance","User provisioning"],"answer":"Traffic stream reassembly","explanation":"Fragmentation complicates reassembly for pattern matching.","id":"S06Q04"},{"fact_id":"d034","concept_id":"d034","root_concept":"Disable FTP","variant":1,"category":"IDS/Firewal isted Evasion","In-memory Beacon Encryption"],"answer":"AI-Assisted Evasion","explanation":"The course describes AI-assisted mutation.","id":"S06Q20"},{"fact_id":"d067","concept_id":"d067","root_concept":"Unique Service ID","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What account types should not run firewall services?","choices":["Unique user ID","Admin/root","Least-privilege account","Dedicated service account"],"answer":"Admin/root","explanation":"The checklist says not admin/root.","id":"S06Q21"},{"fact_id":"b112","concept_id":"b112","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What broader monitoring platform should BITS activity be integrated with?","choices":["DHCP only","ARP only","SIEM","NTP only"],"answer":"SIEM","explanation":"The course recommends integrating BITS monitoring with SIEM.","id":"S06Q22"},{"fact_id":"b126","concept_id":"b126","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What entity must know the same seed as the malware?","choices":["NTP pool","DHCP client","Printer","C2 server"],"answer":"C2 server","explanation":"Both malware and C2 must generate the same domain sequence.","id":"S06Q23"},{"fact_id":"n049","concept_id":"n049","root_concept":"Direct System Calls","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What lower-level call is given as an example alternative to VirtualAlloc?","choices":["CryptAcquireContext","NtAllocateVirtualMemory","CreateFileA","WSAStartup"],"answer":"NtAllocateVirtualMemory","explanation":"NtAllocateVirtualMemory is the example direct syscall.","id":"S06Q24"},{"fact_id":"n052","concept_id":"n052","root_concept":"Thread Call Stack Spoofing","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What function is intercepted in the course example?","choices":["EfsRpcOpenFileRaw","Sleep()","AmsiScanBuffer()","CreateRemoteThread()"],"answer":"Sleep()","explanation":"Th tatus","Fan speed","Keystrokes","Monitor brightness"],"answer":"Keystrokes","explanation":"The course notes keystroke monitoring.","id":"S07Q02"},{"fact_id":"h070","concept_id":"h070","root_concept":"High-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"What is the main security trade-off of high interaction?","choices":["No logging","Greater exposure/risk","No services","No attacker visibility"],"answer":"Greater exposure/risk","explanation":"More realistic interaction creates more risk if containment fails.","id":"S07Q03"},{"fact_id":"b069","concept_id":"b069","root_concept":"Scenario 1","variant":1,"category":"Bypassing IDS/Firewalls","question":"In fragmentation-timeout scenario 1, whose timeout is shorter?","choices":["DNS server","Firewall admin","Victim","NIDS"],"answer":"NIDS","explanation":"Scenario 1 requires the NIDS timeout to be less than the victim timeout.","id":"S07Q04"},{"fact_id":"b070","concept_id":"b070","root_concept":"Scenario 1","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does the NIDS do after its shorter fragmentation timeout expires?","choices":["Decrypts fragments","Forwards all fragments","Drops fragments","Signs fragments"],"answer":"Drops fragments","explanation":"The NIDS drops fragments before reassembly.","id":"S07Q05"},{"fact_id":"b100","concept_id":"b100","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"At what privilege context are BITS jobs described as running?","choices":["Browser sandbox only","Firmware only","Guest only","System level"],"answer":"System level","explanation":"The course says BITS jobs run at system level.","id":"S07Q06"},{"fact_id":"b108","concept_id":"b108","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What enterprise policy mechanism can manage BITS settings?","choices":["BGP","STP","GPO","WPS"],"answer":"GPO","explanation":"Group Policy can manage BITS settings.","id":"S07 ],"answer":"Analyzing Response Time","explanation":"Emulation/monitoring overhead can affect timing.","id":"S07Q17"},{"fact_id":"c039","concept_id":"c039","root_concept":"Application Proxy","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"At what OSI layer are application proxies listed?","choices":["Transport","Network","Application","Presentation"],"answer":"Application","explanation":"Application proxies are mapped to the application layer.","id":"S07Q18"},{"fact_id":"n058","concept_id":"n058","root_concept":"In-memory Beacon Encryption","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What defensive capability is this technique designed to bypass?","choices":["NTP","Memory-scanning EDR","Physical locks","Disk encryption"],"answer":"Memory-scanning EDR","explanation":"It hides executable regions from memory scanning.","id":"S07Q19"},{"fact_id":"c073","concept_id":"c073","root_concept":"Defense in Depth","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What weakness of depth alone concerns knowing whether an attack is happening?","choices":["No IP routing","Insufficient visibility","Too much encryption","No authentication"],"answer":"Insufficient visibility","explanation":"Depth can delay attacks without providing unified visibility.","id":"S07Q20"},{"fact_id":"c051","concept_id":"c051","root_concept":"Packet Filtering","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What transport information can packet filtering evaluate besides IP addresses?","choices":["File entropy","Port numbers","CPU flags","Screen resolution"],"answer":"Port numbers","explanation":"Packet filters can use source and destination ports.","id":"S07Q21"},{"fact_id":"d029","concept_id":"d029","root_concept":"Filter Intruder IP","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What firewall-evasion countermeasure blocks a known attacker address?","choices":["TLS Inspection","Filter Intruder IP","Explicit IP/  as detectable by a NIDS?","choices":["Port scans","BIOS upgrades","Screen locking","Disk cleanup"],"answer":"Port scans","explanation":"Port scans are explicitly listed among NIDS-detectable activities.","id":"S07Q27"},{"fact_id":"b054","concept_id":"b054","root_concept":"ICMP Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What tool is listed for ICMP tunneling?","choices":["Hping","Nping","HTML Smuggler","ICMPTX"],"answer":"ICMPTX","explanation":"ICMPTX is listed for ICMP tunneling.","id":"S07Q28"},{"fact_id":"s003","concept_id":"s003","root_concept":"YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What logic type is used inside YARA rules?","choices":["ARP tables","SQL joins","Boolean expressions","BGP policies"],"answer":"Boolean expressions","explanation":"YARA rules use Boolean expressions.","id":"S07Q29"},{"fact_id":"n028","concept_id":"n028","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What loading weakness is exploited by the application-whitelisting bypass?","choices":["DLL hijacking","DNSSEC","WEP cracking","ARP poisoning"],"answer":"DLL hijacking","explanation":"The technique abuses DLL search/loading behavior.","id":"S07Q30"},{"fact_id":"d050","concept_id":"d050","root_concept":"Default Deny","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"After default deny is applied, what traffic should be enabled?","choices":["All FTP traffic","All inbound traffic","All anonymous traffic","Only required services"],"answer":"Only required services","explanation":"The course says enable only required services.","id":"S07Q31"},{"fact_id":"c034","concept_id":"c034","root_concept":"Firewall","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What routing role can a firewall also perform between networks?","choices":["Router","Certificate authority","Hypervisor","Directory server"],"answer":"Router","explanation":"The course notes that a firewall can act as a router.","id":"S07Q32"},{"fact_id":"n033","concept_id":"n033","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which scripting engine is listed alongside rundll32 and regsvr32?","choices":["Java only","Bash only","PowerShell","Perl only"],"answer":"PowerShell","explanation":"PowerShell is listed as a trusted execution path.","id":"S07Q33"},{"fact_id":"n014","concept_id":"n014","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Where is the attacker device placed in the pre-authenticated-device bypass?","choices":["Inside the printer","Between device and authentication server","Only on Wi-Fi AP","Behind the DNS root"],"answer":"Between device and authentication server","explanation":"The attacker inserts a bridge in the authentication path.","id":"S07Q34"},{"fact_id":"n050","concept_id":"n050","root_concept":"Direct System Calls","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What detection technique is direct-syscall evasion said to bypass?","choices":["ARPwatch","WIDS","DNSSEC","Mark of the Syscall"],"answer":"Mark of the Syscall","explanation":"The course names Mark of the Syscall detection.","id":"S07Q35"},{"fact_id":"b049","concept_id":"b049","root_concept":"IP Instead of URL","variant":1,"category":"Bypassing IDS/Firewalls","question":"When does using an IP instead of a URL fail?","choices":["When TCP is used","When the blocker tracks the IP","When DNS is enabled","When the browser supports HTTPS"],"answer":"When the blocker tracks the IP","explanation":"IP-aware filtering defeats this bypass.","id":"S07Q36"},{"fact_id":"b012","concept_id":"b012","root_concept":"DNS Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique encodes data inside DNS queries and responses?","choices":["DNS Tunneling","ACK Tunneling","Banner Grabbing","External Systems"],"answer":"DNS Tunneling","explanation":"DNS tunneling carries data inside DNS traffic.","id":"S07Q37"},{"fact_id":"b053","concept_id":"b053","root_concept":"ICMP Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"Why can arbitrary payload be hidden in ICMP Echo data?","choices":["ICMP uses TCP","ICMP is encrypted","TTL is unlimited","RFC does not define the data content"],"answer":"RFC does not define the data content","explanation":"The data field is not tightly defined by the cited RFC.","id":"S07Q38"},{"fact_id":"d039","concept_id":"d039","root_concept":"Change Documentation","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What governance control requires notifying the policy administrator and recording firewall changes?","choices":["Physical Access Control","Security Audits","Explicit IP/Port Rules","Change Documentation"],"answer":"Change Documentation","explanation":"Firewall changes should be documented and communicated.","id":"S07Q39"},{"fact_id":"c095","concept_id":"c095","root_concept":"NetFlow","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What traffic quantity can NetFlow summarize?","choices":["Keyboard layout","Data volume","Monitor size","CPU voltage"],"answer":"Data volume","explanation":"Flow records can summarize transferred bytes/packets.","id":"S07Q40"},{"fact_id":"n002","concept_id":"n002","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What switch protocol is exploited to negotiate a trunk in the course?","choices":["Silentbridge","VLANPWN","NACkered","DTP"],"answer":"DTP","explanation":"Dynamic Trunking Protocol can be abused to establish a trunk.","id":"S07Q41"},{"fact_id":"b016","concept_id":"b016","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What web attack reconstructs malicious content in the browser to evade gateways?","choices":["Port Scanning","ICMP Tunneling","HTML Smuggling","Banner Grabbing"],"answer":"HTML Smuggling","explanation":"HTML smuggling assembles the payload client-side.","id":"S07Q42"},{"fact_id":"b056","concept_id":"b056","root_concept":"ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What TCP flag is exploited by ACK tunneling?","choices":["FIN","SYN","RST","ACK"],"answer":"ACK","explanation":"ACK tunneling uses ACK packets.","id":"S07Q43"},{"fact_id":"b031","concept_id":"b031","root_concept":"Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"What network mapping goal can firewalking support?","choices":["Decrypting disks","Resetting passwords","Signing code","Mapping networks"],"answer":"Mapping networks","explanation":"Firewalking can map network filtering and reachability.","id":"S07Q44"},{"fact_id":"c061","concept_id":"c061","root_concept":"VPN","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What VPN process wraps protected traffic inside new packets?","choices":["ARP poisoning","Route poisoning","Encapsulation","Fragment deletion"],"answer":"Encapsulation","explanation":"VPNs encapsulate traffic.","id":"S07Q45"},{"fact_id":"s008","concept_id":"s008","root_concept":"YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What does a YARA rule compare against malware to identify signatures?","choices":["Only MAC addresses","Strings and conditions","Only TCP flags","Only timestamps"],"answer":"Strings and conditions","explanation":"YARA rules combine strings with Boolean conditions.","id":"S07Q46"},{"fact_id":"c081","concept_id":"c081","root_concept":"UTM","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What reliability risk is introduced by placing many controls on one UTM?","choices":["No routing","No logs","No authentication","Single point of failure"],"answer":"Single point of failure","explanation":"A UTM can become a single point of failure.","id":"S07Q47"},{"fact_id":"b133","concept_id":"b133","ro ?","choices":["DNS resolver only","Load balancer","Generative AI","Packet sniffer only"],"answer":"Generative AI","explanation":"The notes mention tools like ChatGPT.","id":"S08Q19"},{"fact_id":"d037","concept_id":"d037","root_concept":"Admin Access Control","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What control limits who can modify firewall configuration?","choices":["Zero Trust","Explicit IP/Port Rules","HTTP Evader Testing","Admin Access Control"],"answer":"Admin Access Control","explanation":"Firewall configuration access should be restricted.","id":"S08Q20"},{"fact_id":"b111","concept_id":"b111","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What user permission should be restricted to limit BITS abuse?","choices":["Ability to create BITS jobs","Ability to use MFA","Ability to read email","Ability to view logs"],"answer":"Ability to create BITS jobs","explanation":"The course recommends limiting who can create BITS jobs.","id":"S08Q21"},{"fact_id":"h067","concept_id":"h067","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"What is the intelligence goal of observing an attacker on a honeypot?","choices":["Disable alerts","Remove logs","Learn objectives","Increase bandwidth"],"answer":"Learn objectives","explanation":"Honeypots reveal attacker goals and methods.","id":"S08Q22"},{"fact_id":"b143","concept_id":"b143","root_concept":"Fragmentation Scenario 2","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does the victim never see in the final malicious stream after timeout?","choices":["IP header","Fake fragments","Real payload","Destination port"],"answer":"Fake fragments","explanation":"The victim already discarded the false fragments.","id":"S08Q23"},{"fact_id":"d008","concept_id":"d008","root_concept":"Fragment Reassembly","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure makes the IDS rebuild
