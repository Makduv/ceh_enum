<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Evading IDS, Firewalls, and Honeypots — Direct Questions v2</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"concept_id":"IDS/IPS/Firewall Concepts::Protocol Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS detection method looks for deviations from expected protocol standards?","choices":["NIDS","Signature Recognition","Protocol Anomaly Detection","Anomaly Detection"],"answer":"Protocol Anomaly Detection","explanation":"Protocol anomaly detection focuses on protocol behavior.","id":"S01Q01"},{"concept_id":"Honeypot Concepts::Pure Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type emulates a real production environment as closely as possible?","choices":["Honeypot","High-interaction Honeypot","Medium-interaction Honeypot","Pure Honeypot"],"answer":"Pure Honeypot","explanation":"Pure honeypots mimic a real production environment.","id":"S01Q02"},{"concept_id":"IDS/IPS/Firewall Concepts::NetFlow","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What network telemetry technology stores connection summaries such as peers, ports, duration, and volume?","choices":["NetFlow","Event","Incident","NIDS"],"answer":"NetFlow","explanation":"NetFlow is lighter than full packet capture.","id":"S01Q03"},{"concept_id":"Bypassing IDS/Firewalls::Blob","variant":1,"category":"Bypassing IDS/Firewalls","question":"What browser object holds reconstructed malicious content inside the browser?","choices":["Blob","JavaScript","Banner Grabbing","Firewalking"],"answer":"Blob","explanation":"HTML smuggling commonly uses JavaScript blobs.","id":"S01Q04"},{"concept_id":"Bypassing IDS/Firewalls::Proxy Server","variant":1,"category":"Bypassing IDS/Firewalls","question":"What intermediary relays requests through an intermediary to obscure the original client?","choices":["IP Address Spoofing","Tiny Fragments","IP Instead of URL","Proxy Server"],"answer":"Proxy Server","explanation":"A proxy changes the apparent request path.","id":"S01Q05"},{"concept_id":"IDS/IPS/Firewall Concepts::Segmentation","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What network concept pre-divides the network so compromised systems can be isolated quickly?","choices":["Defensible Architecture","Segmentation","Defense in Depth","DMZ"],"answer":"Segmentation","explanation":"Segmentation makes containment easier.","id":"S01Q06"},{"concept_id":"Bypassing IDS/Firewalls::ICMPTX","variant":1,"category":"Bypassing IDS/Firewalls","question":"What tool is associated with tunneling a backdoor shell inside ICMP Echo payloads?","choices":["Banner Grabbing","Nping","ICMPTX","Hping"],"answer":"ICMPTX","explanation":"ICMPTX is listed for ICMP tunneling.","id":"S01Q07"},{"concept_id":"Bypassing NAC & Endpoint Security::WriteProcessMemory()","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What Windows API copies a payload into allocated remote-process memory?","choices":["Dynamic Auto","CreateRemoteThread()","DTP","WriteProcessMemory()"],"answer":"WriteProcessMemory()","explanation":"WriteProcessMemory writes into another process.","id":"S01Q08"},{"concept_id":"Honeypot Concepts::Analyzing MAC Address","variant":1,"category":"Honeypot Concepts","question":"What honeypot-detection method checks the OUI for unusual or inconsistent vendor information?","choices":["Honeypot","Honeynet","Analyzing MAC Address","Enumerating Unexpected Open Ports"],"answer":"Analyzing MAC Address","explanation":"Unexpected OUIs can reveal deception.","id":"S01Q09"},{"concept_id":"IDS/IPS/Firewall Concepts::Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS detection method flags deviations from an established model of normal behavior?","choices":["IPS","Anomaly Detection","Signature Recognition","IDS"],"answer":"Anomaly Detection","explanation":"Anomaly detection depends on a baseline.","id":"S01Q10"},{"concept_id":"Bypassing NAC & Endpoint Security::Raspberry Pi","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What intermediary device is an example intermediary placed between an authenticated host and authentication server?","choices":["Dynamic Desirable","DTP","Raspberry Pi","VLAN Hopping"],"answer":"Raspberry Pi","explanation":"A small intermediary can relay authenticated access.","id":"S01Q11"},{"concept_id":"Honeypot Concepts::Research Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type focuses on studying attacker behavior, tools, and techniques?","choices":["Honeypot","Production Honeypot","Low-interaction Honeypot","Research Honeypot"],"answer":"Research Honeypot","explanation":"Research honeypots collect attacker intelligence.","id":"S01Q12"},{"concept_id":"Bypassing IDS/Firewalls::Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique identifies open ports and can fingerprint defensive products?","choices":["Tiny Fragments","Proxy Server","Port Scanning","Source Routing"],"answer":"Port Scanning","explanation":"Port scanning supports reconnaissance.","id":"S01Q13"},{"concept_id":"IDS/IPS/Firewall Solutions::Splunk","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What security tool indexes and searches logs for event analysis and SIEM use?","choices":["YARA","Wireshark","Elastic Stack","Splunk"],"answer":"Splunk","explanation":"Splunk is widely used for log analytics and SIEM.","id":"S01Q14"},{"concept_id":"Bypassing IDS/Firewalls::SSH Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique uses encrypted port forwarding to carry otherwise blocked traffic?","choices":["Firewalking","DNS Tunneling","ACK Tunneling","SSH Tunneling"],"answer":"SSH Tunneling","explanation":"SSH tunneling uses encrypted forwarding.","id":"S01Q15"},{"concept_id":"Bypassing NAC & Endpoint Security::Dynamic Auto","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What switchport mode can form a trunk when the peer actively requests it?","choices":["VLANPWN","DTP","Dynamic Desirable","Dynamic Auto"],"answer":"Dynamic Auto","explanation":"Dynamic auto can negotiate a trunk with an active peer.","id":"S01Q16"},{"concept_id":"Bypassing IDS/Firewalls::Nping","variant":1,"category":"Bypassing IDS/Firewalls","question":"What tool is an Nmap-family packet generator associated with ACK tunneling?","choices":["Banner Grabbing","ICMPTX","Hping","Nping"],"answer":"Nping","explanation":"Nping can craft packets for ACK tunneling.","id":"S01Q17"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Remote Syslog","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure stores firewall logs away from the firewall itself?","choices":["Remote Syslog","Security Audits","Zero Trust","Configuration Backups"],"answer":"Remote Syslog","explanation":"Remote logging protects evidence from local compromise.","id":"S01Q18"},{"concept_id":"Bypassing IDS/Firewalls::ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique hides data in ACK packets that may receive less scrutiny than SYN packets?","choices":["DNS Tunneling","ICMP Tunneling","HTTP Tunneling","ACK Tunneling"],"answer":"ACK Tunneling","explanation":"ACK tunneling abuses trusted ACK traffic.","id":"S01Q19"},{"concept_id":"IDS/IPS/Firewall Concepts::IDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security system monitors traffic and raises alerts without being primarily inline?","choices":["UTM","IDS","HIDS","NIDS"],"answer":"IDS","explanation":"An IDS is primarily passive detection.","id":"S01Q20"},{"concept_id":"IDS/Firewall Evasion Countermeasures::TLS Inspection","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure inspects encrypted HTTPS/TLS traffic for hidden threats?","choices":["Configuration Backups","TLS Inspection","Deep Packet Inspection","Zero Trust"],"answer":"TLS Inspection","explanation":"TLS inspection improves visibility into encrypted evasion.","id":"S01Q21"},{"concept_id":"Bypassing IDS/Firewalls::IP Address Spoofing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique replaces a packet source address with a trusted host address?","choices":["IP Instead of URL","Tiny Fragments","Firewalking","IP Address Spoofing"],"answer":"IP Address Spoofing","explanation":"IP spoofing makes traffic appear to come from a trusted source.","id":"S01Q22"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Playbooks","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure ensure responders follow documented and repeatable procedures?","choices":["Centralized Logging","Isolation","Playbooks","Fragment Reassembly"],"answer":"Playbooks","explanation":"Playbooks standardize incident response.","id":"S01Q23"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Patch Management","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure keeps hosts and network devices current against known weaknesses?","choices":["Default Deny","Attack Logging","Remote Syslog","Patch Management"],"answer":"Patch Management","explanation":"Regular patching reduces exploitable gaps.","id":"S01Q24"},{"concept_id":"Honeypot Concepts::Low-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type simulates only a limited set of services and cannot be fully compromised?","choices":["Low-interaction Honeypot","Pure Honeypot","High-interaction Honeypot","Honeypot"],"answer":"Low-interaction Honeypot","explanation":"Low-interaction honeypots emulate limited functionality.","id":"S01Q25"},{"concept_id":"Bypassing NAC & Endpoint Security::Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique places malicious code inside the address space of a running process?","choices":["DTP","Ghostwriting","VLAN Hopping","Process Injection"],"answer":"Process Injection","explanation":"Process injection hides code inside another process.","id":"S01Q26"},{"concept_id":"Bypassing IDS/Firewalls::IDS timeout higher than victim","variant":1,"category":"Bypassing IDS/Firewalls","question":"What fragmentation-timeout condition causes the sensor to retain fake fragments longer than the target host?","choices":["Source Routing","Firewalking","IDS timeout higher than victim","NIDS timeout lower than victim"],"answer":"IDS timeout higher than victim","explanation":"Different reassembly timeouts can create different packet views.","id":"S01Q27"},{"concept_id":"IDS/IPS/Firewall Concepts::HIDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security system audits security-relevant activity on one specific endpoint?","choices":["IPS","HIDS","SIEM","NIDS"],"answer":"HIDS","explanation":"A HIDS focuses on a single host.","id":"S01Q28"},{"concept_id":"IDS/IPS/Firewall Concepts::Defense in Depth","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security strategy uses multiple protective layers so one failed control is followed by another?","choices":["DMZ","Segmentation","Defense in Breadth","Defense in Depth"],"answer":"Defense in Depth","explanation":"Defense in depth layers controls to delay attackers.","id":"S01Q29"},{"concept_id":"Honeypot Concepts::Honeytrap","variant":1,"category":"Honeypot Concepts","question":"What honeypot tool is a low-interaction daemon that records attack strings against TCP/UDP services?","choices":["Honeynet","Honeypot","Honeytrap","Tar Pit"],"answer":"Honeytrap","explanation":"Honeytrap records attack data.","id":"S01Q30"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Connection Limits","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure restricts simultaneous connections allowed per source?","choices":["Configuration Backups","Remote Syslog","Connection Limits","Default Deny"],"answer":"Connection Limits","explanation":"Per-IP limits reduce abuse.","id":"S01Q31"},{"concept_id":"Honeypot Concepts::High-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type provides extensive realistic services for deeper attacker interaction?","choices":["Medium-interaction Honeypot","Low-interaction Honeypot","High-interaction Honeypot","Tar Pit"],"answer":"High-interaction Honeypot","explanation":"High-interaction systems provide rich attacker visibility.","id":"S01Q32"},{"concept_id":"Honeypot Concepts::Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot concept is deliberately exposed with no legitimate production activity to attract attackers?","choices":["Honeypot","Pure Honeypot","Honeynet","Low-interaction Honeypot"],"answer":"Honeypot","explanation":"Any honeypot interaction is inherently suspicious.","id":"S01Q33"},{"concept_id":"Bypassing IDS/Firewalls::Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique uses TTL values to map firewall ACL rules?","choices":["Proxy Server","Firewalking","Banner Grabbing","Port Scanning"],"answer":"Firewalking","explanation":"Firewalking uses TTL behavior to infer firewall rules.","id":"S01Q34"},{"concept_id":"Bypassing NAC & Endpoint Security::Ghostwriting","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique changes malware code structure while preserving functionality to defeat signatures?","choices":["Application Whitelisting Bypass","Process Injection","Ghostwriting","DTP"],"answer":"Ghostwriting","explanation":"Ghostwriting mutates code structure without changing behavior.","id":"S01Q35"},{"concept_id":"Bypassing IDS/Firewalls::Seed","variant":1,"category":"Bypassing IDS/Firewalls","question":"What shared value is shared by malware and C2 to generate the same sequence of DGA domains?","choices":["Seed","DGA","Firewalking","Banner Grabbing"],"answer":"Seed","explanation":"A DGA seed synchronizes domain generation.","id":"S01Q36"},{"concept_id":"Bypassing IDS/Firewalls::Tiny Fragments","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique creates small fragments so important TCP header fields appear in later fragments?","choices":["Source Routing","Tiny Fragments","IP Address Spoofing","Banner Grabbing"],"answer":"Tiny Fragments","explanation":"Tiny fragments exploit incomplete fragment inspection.","id":"S01Q37"},{"concept_id":"Bypassing IDS/Firewalls::Loose Source Routing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What source-routing type requires packets to pass through one or more specified waypoints?","choices":["Loose Source Routing","Firewalking","IP Address Spoofing","Source Routing"],"answer":"Loose Source Routing","explanation":"Loose source routing specifies selected intermediate points.","id":"S01Q38"},{"concept_id":"IDS/IPS/Firewall Concepts::SIEM","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security system correlates logs and events and can generate security alerts?","choices":["IPS","HIDS","SIEM","IDS"],"answer":"SIEM","explanation":"A SIEM centralizes and correlates events.","id":"S01Q39"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Centralized Logging","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure stores events in a searchable platform for visibility and evidence?","choices":["Traffic Normalizer","Patch Management","Isolation","Centralized Logging"],"answer":"Centralized Logging","explanation":"Centralized logging supports monitoring and forensics.","id":"S01Q40"},{"concept_id":"Bypassing NAC & Endpoint Security::AMSI Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique forces antimalware scanning to return a clean result?","choices":["DTP","Application Whitelisting Bypass","Ghostwriting","AMSI Bypass"],"answer":"AMSI Bypass","explanation":"AMSI bypass aims to neutralize antimalware scanning.","id":"S01Q41"},{"concept_id":"IDS/IPS/Firewall Solutions::YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What security tool uses rule-based Boolean expressions and strings to detect or classify malware?","choices":["Wireshark","Elastic Stack","Snort","YARA"],"answer":"YARA","explanation":"YARA is a rule-based malware identification tool.","id":"S01Q42"},{"concept_id":"Bypassing NAC & Endpoint Security::VLANPWN","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What tool is the tool listed for VLAN-hopping attacks?","choices":["FENRIR","Dynamic Desirable","Dynamic Auto","VLANPWN"],"answer":"VLANPWN","explanation":"VLANPWN is associated with DTP and double-tagging attacks.","id":"S01Q43"},{"concept_id":"IDS/IPS/Firewall Concepts::NGFW","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security system adds deep inspection, application awareness, IPS, and threat intelligence to classic filtering?","choices":["Packet Filtering","IPS","NIDS","NGFW"],"answer":"NGFW","explanation":"An NGFW extends traditional firewall functions.","id":"S01Q44"},{"concept_id":"Bypassing IDS/Firewalls::Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique injects a SYN into an established flow so the sensor resynchronizes incorrectly?","choices":["Banner Grabbing","Post-Connection SYN","Source Routing","IP Address Spoofing"],"answer":"Post-Connection SYN","explanation":"Post-connection SYN desynchronizes IDS state after connection setup.","id":"S01Q45"},{"concept_id":"Bypassing IDS/Firewalls::Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What Windows service transfers malicious files as trusted background jobs?","choices":["Windows BITS","Firewalking","IP Address Spoofing","Source Routing"],"answer":"Windows BITS","explanation":"BITS can be abused for low-profile background transfer.","id":"S01Q46"},{"concept_id":"IDS/IPS/Firewall Concepts::Event","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What term describes a detectable occurrence such as a login or connection?","choices":["IPS","Event","NetFlow","NIDS"],"answer":"Event","explanation":"An event is something detectable that happened.","id":"S01Q47"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Traffic Normalizer","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure removes ambiguous traffic interpretations before packets reach the IDS?","choices":["Remote Syslog","Patch Management","Traffic Normalizer","Default Deny"],"answer":"Traffic Normalizer","explanation":"Traffic normalization reduces evasion through ambiguity.","id":"S01Q48"},{"concept_id":"Bypassing NAC & Endpoint Security::VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique gains access to additional VLANs through trunking behavior?","choices":["Raspberry Pi","VLAN Hopping","Dynamic Desirable","Dynamic Auto"],"answer":"VLAN Hopping","explanation":"VLAN hopping abuses switching and trunking.","id":"S01Q49"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Security Audits","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure periodically verify firewall posture and policy effectiveness?","choices":["Zero Trust","TLS Inspection","Security Audits","Connection Limits"],"answer":"Security Audits","explanation":"Regular audits identify drift and misconfiguration.","id":"S01Q50"}],[{"concept_id":"IDS/Firewall Evasion Countermeasures::Remote Syslog","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"Which countermeasure stores firewall logs away from the firewall itself?","choices":["Configuration Backups","Zero Trust","Security Audits","Remote Syslog"],"answer":"Remote Syslog","explanation":"Remote logging protects evidence from local compromise.","id":"S02Q01"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Traffic Normalizer","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"Which countermeasure removes ambiguous traffic interpretations before packets reach the IDS?","choices":["Patch Management","Traffic Normalizer","Default Deny","Remote Syslog"],"answer":"Traffic Normalizer","explanation":"Traffic normalization reduces evasion through ambiguity.","id":"S02Q02"},{"concept_id":"IDS/IPS/Firewall Solutions::Splunk","variant":2,"category":"IDS/IPS/Firewall Solutions","question":"Which security tool indexes and searches logs for event analysis and SIEM use?","choices":["Wireshark","Splunk","YARA","Elastic Stack"],"answer":"Splunk","explanation":"Splunk is widely used for log analytics and SIEM.","id":"S02Q03"},{"concept_id":"Bypassing NAC & Endpoint Security::AMSI Bypass","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"Which technique forces antimalware scanning to return a clean result?","choices":["AMSI Bypass","Ghostwriting","DTP","Application Whitelisting Bypass"],"answer":"AMSI Bypass","explanation":"AMSI bypass aims to neutralize antimalware scanning.","id":"S02Q04"},{"concept_id":"Bypassing IDS/Firewalls::Loose Source Routing","variant":2,"category":"Bypassing IDS/Firewalls","question":"Which source-routing type requires packets to pass through one or more specified waypoints?","choices":["Loose Source Routing","Source Routing","IP Address Spoofing","Firewalking"],"answer":"Loose Source Routing","explanation":"Loose source routing specifies selected intermediate points.","id":"S02Q05"},{"concept_id":"IDS/IPS/Firewall Concepts::NetFlow","variant":2,"category":"IDS/IPS/Firewall Concepts","question":"Which monitoring technology stores connection summaries such as peers, ports, duration, and volume?","choices":["NetFlow","NIDS","Incident","Event"],"answer":"NetFlow","explanation":"NetFlow is lighter than full packet capture.","id":"S02Q06"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Patch Management","variant":2,"category":"IDS/Firewall Evasion Countermeasures","questi erver","IP Address Spoofing","Source Routing","Port Scanning"],"answer":"Source Routing","explanation":"Source routing can steer traffic through less-secured paths.","id":"S07Q48"},{"concept_id":"IDS/IPS/Firewall Concepts::Protocol Anomaly Detection","variant":2,"category":"IDS/IPS/Firewall Concepts","question":"Which IDS detection method looks for deviations from expected protocol standards?","choices":["Anomaly Detection","Protocol Anomaly Detection","Signature Recognition","NIDS"],"answer":"Protocol Anomaly Detection","explanation":"Protocol anomaly detection focuses on protocol behavior.","id":"S07Q49"},{"concept_id":"Bypassing IDS/Firewalls::Pre-Connection SYN","variant":3,"category":"Bypassing IDS/Firewalls","question":"What IDS/firewall evasion technique uses an invalid-checksum SYN before the real connection to confuse the sensor?","choices":["IP Address Spoofing","Pre-Connection SYN","Post-Connection SYN","Firewalking"],"answer":"Pre-Connection SYN","explanation":"Pre-connection SYN desynchronizes IDS state before the real flow.","id":"S07Q50"}],[{"concept_id":"IDS/IPS/Firewall Concepts::DMZ","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH network concept separates internet-facing servers from the internal corporate network?","choices":["DMZ","Defense in Breadth","Choke Point","Segmentation"],"answer":"DMZ","explanation":"A DMZ isolates public-facing systems.","id":"S08Q01"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Fragment Reassembly","variant":4,"category":"IDS/Firewall Evasion Countermeasures","question":"Which security control reconstructs fragmented packets in the proper order before IDS inspection?","choices":["Attack Logging","Default Deny","Fragment Reassembly","Traffic Normalizer"],"answer":"Fragment Reassembly","explanation":"Correct reassembly counters fragmentation evasion.","id":"S08Q02"},{"concept_id":"Honeypot Concepts::Low-interaction Honeypot","variant":3,"category":"Honeypot Concepts","question":"What deception-system type simulates only a limited set of services and cannot be fully compromised?","choices":["Low-interaction Honeypot","Pure Honeypot","High-interaction Honeypot","Honeypot"],"answer":"Low-interaction Honeypot","explanation":"Low-interaction honeypots emulate limited functionality.","id":"S08Q03"},{"concept_id":"Bypassing IDS/Firewalls::JavaScript","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which web language reconstructs and triggers the malicious download client-side?","choices":["Browser Reconstruction","Blob","JavaScript","Firewalking"],"answer":"JavaScript","explanation":"JavaScript can build and download the smuggled payload.","id":"S08Q04"},{"concept_id":"Bypassing NAC & Endpoint Security::Application Whitelisting Bypass","variant":4,"category":"Bypassing NAC & Endpoint Security","question":"Which evasion method uses trusted applications or DLL-loading behavior to execute malicious code?","choices":["Process Injection","Application Whitelisting Bypass","AMSI Bypass","DTP"],"answer":"Application Whitelisting Bypass","explanation":"Whitelisting bypass abuses trusted execution paths.","id":"S08Q05"},{"concept_id":"IDS/IPS/Firewall Concepts::Event","variant":3,"category":"IDS/IPS/Firewall Concepts","question":"What security term describes a detectable occurrence such as a login or connection?","choices":["NIDS","NetFlow","Event","IPS"],"answer":"Event","explanation":"An event is something detectable that happened.","id":"S08Q06"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Default Deny","variant":4,"category":"IDS/Firewall Evasion Countermeasures","question":"Which security control blocks all traffic unless a service is explicitly required and allowed?","choices":["TLS Inspection","Deep Packet Inspection","Remote Syslog","Default Deny"],"answer":"Default Deny","explanation":"Default-deny minimizes exposed services.","id":"S08Q07"},{"concept_id":"Bypassing NAC & Endpoint Security::FENRIR","variant":4,"category":"Bypassing NAC & Endpoint Security","question":"Which CEH tool is a tool listed for NAC bypass?","choices":["VLAN Hopping","Dynamic Desirable","FENRIR","DTP"],"answer":"FENRIR","explanation":"FENRIR is listed for NAC bypass.","id":"S08Q08"},{"concept_id":"Bypassing IDS/Firewalls::ICMP Tunneling","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which evasion method hides arbitrary data inside the payload of Echo packets?","choices":["DNS Tunneling","SSH Tunneling","ICMP Tunneling","HTTP Tunneling"],"answer":"ICMP Tunneling","explanation":"ICMP tunneling hides data in ICMP payloads.","id":"S08Q09"},{"concept_id":"Bypassing IDS/Firewalls::Strict Source Routing","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which routing technique requires packets to follow the exact sender-defined path?","choices":["Banner Grabbing","Source Routing","Firewalking","Strict Source Routing"],"answer":"Strict Source Routing","explanation":"Strict source routing specifies the exact route.","id":"S08Q10"},{"concept_id":"Bypassing IDS/Firewalls::IP Instead of URL","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which evasion method tries to bypass domain-name filtering by using a numeric address directly?","choices":["Firewalking","Port Scanning","IP Instead of URL","Proxy Server"],"answer":"IP Instead of URL","explanation":"Numeric addresses may bypass domain-only blocking.","id":"S08Q11"},{"concept_id":"Bypassing IDS/Firewalls::BitsParser","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which CEH tool is the tool listed for evaluating suspicious background-transfer activity?","choices":["Source Routing","Windows BITS","BitsParser","Banner Grabbing"],"answer":"BitsParser","explanation":"BitsParser helps analyze BITS jobs.","id":"S08Q12"},{"concept_id":"Bypassing IDS/Firewalls::DGA","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which evasion method uses a shared seed to generate changing or gibberish domains for C2 communication?","choice ot Concepts::Honeynet","variant":3,"category":"Honeypot Concepts","question":"What deception concept is a network composed of multiple honeypots?","choices":["Honeynet","Low-interaction Honeypot","Honeypot","Medium-interaction Honeypot"],"answer":"Honeynet","explanation":"A honeynet is a network of honeypots.","id":"S08Q39"},{"concept_id":"IDS/IPS/Firewall Solutions::Elastic Stack","variant":4,"category":"IDS/IPS/Firewall Solutions","question":"Which CEH tool stores, searches, and visualizes large volumes of logs and events?","choices":["YARA","Splunk","Snort","Elastic Stack"],"answer":"Elastic Stack","explanation":"Elastic Stack supports centralized logging and analysis.","id":"S08Q40"},{"concept_id":"Honeypot Concepts::Fingerprinting Running Service","variant":3,"category":"Honeypot Concepts","question":"What technique for detecting honeypots looks for discrepancies between claimed services and actual behavior?","choices":["Honeynet","Analyzing MAC Address","Fingerprinting Running Service","Honeypot"],"answer":"Fingerprinting Running Service","explanation":"Service fingerprint mismatches can reveal deception.","id":"S08Q41"},{"concept_id":"IDS/IPS/Firewall Concepts::Protocol Anomaly Detection","variant":3,"category":"IDS/IPS/Firewall Concepts","question":"What detection technique looks for deviations from expected protocol standards?","choices":["Protocol Anomaly Detection","Anomaly Detection","NIDS","Signature Recognition"],"answer":"Protocol Anomaly Detection","explanation":"Protocol anomaly detection focuses on protocol behavior.","id":"S08Q42"},{"concept_id":"Bypassing NAC & Endpoint Security::VirtualAllocEx()","variant":4,"category":"Bypassing NAC & Endpoint Security","question":"Which API call allocates memory inside another process during classic injection?","choices":["WriteProcessMemory()","VirtualAllocEx()","CreateRemoteThread()","DTP"],"answer":"VirtualAllocEx()","explanation":"VirtualAllocEx allocates remote-process memory.","id":"S08Q43"},{"concept_id ption.","id":"S09Q03"},{"concept_id":"IDS/IPS/Firewall Concepts::SIEM","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which defensive system correlates logs and events and can generate security alerts?","choices":["HIDS","SIEM","IDS","IPS"],"answer":"SIEM","explanation":"A SIEM centralizes and correlates events.","id":"S09Q04"},{"concept_id":"Bypassing IDS/Firewalls::Browser Reconstruction","variant":5,"category":"Bypassing IDS/Firewalls","question":"What technique behavior assembles malicious content after it has crossed perimeter controls?","choices":["Browser Reconstruction","HTML Smuggling","Banner Grabbing","Blob"],"answer":"Browser Reconstruction","explanation":"HTML smuggling reconstructs payloads client-side.","id":"S09Q05"},{"concept_id":"IDS/IPS/Firewall Solutions::Snort","variant":4,"category":"IDS/IPS/Firewall Solutions","question":"Which CEH tool inspects network traffic for intrusion patterns?","choices":["Snort","YARA","Elastic Stack","Wireshark"],"answer":"Snort","explanation":"Snort is a network IDS/IPS technology.","id":"S09Q06"},{"concept_id":"Bypassing IDS/Firewalls::Banner Grabbing","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique fingerprints vendor or firmware information from service banners?","choices":["Source Routing","IP Address Spoofing","Banner Grabbing","Firewalking"],"answer":"Banner Grabbing","explanation":"Banner grabbing identifies technologies from banners.","id":"S09Q07"},{"concept_id":"IDS/IPS/Firewall Concepts::Signature Recognition","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH IDS method matches observed traffic against known attack patterns?","choices":["IDS","Anomaly Detection","Signature Recognition","IPS"],"answer":"Signature Recognition","explanation":"Signature recognition detects known attacks.","id":"S09Q08"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Zero Trust","variant":5,"category":"IDS/Firewall Evasion Countermeasures","que /Firewalls","question":"What CEH evasion technique encodes data inside name-resolution queries and responses?","choices":["DNS Tunneling","ACK Tunneling","SSH Tunneling","ICMP Tunneling"],"answer":"DNS Tunneling","explanation":"DNS tunneling hides data in DNS.","id":"S09Q14"},{"concept_id":"Bypassing NAC & Endpoint Security::Application Whitelisting Bypass","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What CEH evasion technique uses trusted applications or DLL-loading behavior to execute malicious code?","choices":["Process Injection","Application Whitelisting Bypass","DTP","AMSI Bypass"],"answer":"Application Whitelisting Bypass","explanation":"Whitelisting bypass abuses trusted execution paths.","id":"S09Q15"},{"concept_id":"Bypassing NAC & Endpoint Security::Dynamic Desirable","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What Cisco switchport mode actively attempts trunk negotiation?","choices":["Pre-authenticated Device","Dynamic Desirable","Dynamic Auto","DTP"],"answer":"Dynamic Desirable","explanation":"Dynamic desirable actively seeks trunk formation.","id":"S09Q16"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Attack Logging","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure stores attacker IP, victim IP, and timestamps for later analysis?","choices":["Fragment Reassembly","Traffic Normalizer","Remote Syslog","Attack Logging"],"answer":"Attack Logging","explanation":"Preserving attack evidence supports investigation.","id":"S09Q17"},{"concept_id":"Bypassing IDS/Firewalls::JavaScript","variant":5,"category":"Bypassing IDS/Firewalls","question":"What language reconstructs and triggers the malicious download client-side?","choices":["Blob","Firewalking","Browser Reconstruction","JavaScript"],"answer":"JavaScript","explanation":"JavaScript can build and download the smuggled payload.","id":"S09Q18"},{"concept_id":"Bypassing IDS/Firewalls::BitsParser","variant":5,"category":"Bypassing IDS/Firewalls","question":"What security utility is the tool listed for evaluating suspicious background-transfer activity?","choices":["BitsParser","Windows BITS","Source Routing","Banner Grabbing"],"answer":"BitsParser","explanation":"BitsParser helps analyze BITS jobs.","id":"S09Q19"},{"concept_id":"Honeypot Concepts::Honeynet","variant":4,"category":"Honeypot Concepts","question":"Which CEH honeypot concept is a network composed of multiple honeypots?","choices":["Low-interaction Honeypot","Medium-interaction Honeypot","Honeynet","Honeypot"],"answer":"Honeynet","explanation":"A honeynet is a network of honeypots.","id":"S09Q20"},{"concept_id":"Bypassing IDS/Firewalls::HTML Smuggling","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique reconstructs malicious content inside the browser using HTML5 or JavaScript?","choices":["Browser Reconstruction","HTML Smuggling","Banner Grabbing","Firewalking"],"answer":"HTML Smuggling","explanation":"HTML smuggling can evade proxies and gateways.","id":"S09Q21"},{"concept_id":"IDS/IPS/Firewall Solutions::Splunk","variant":4,"category":"IDS/IPS/Firewall Solutions","question":"Which CEH tool indexes and searches logs for event analysis and SIEM use?","choices":["Wireshark","Splunk","YARA","Elastic Stack"],"answer":"Splunk","explanation":"Splunk is widely used for log analytics and SIEM.","id":"S09Q22"},{"concept_id":"IDS/IPS/Firewall Solutions::Elastic Stack","variant":5,"category":"IDS/IPS/Firewall Solutions","question":"What analysis tool stores, searches, and visualizes large volumes of logs and events?","choices":["Elastic Stack","Splunk","Snort","YARA"],"answer":"Elastic Stack","explanation":"Elastic Stack supports centralized logging and analysis.","id":"S09Q23"},{"concept_id":"Honeypot Concepts::Research Honeypot","variant":4,"category":"Honeypot Concepts","question":"Which honeypot category focuses on studying attacker behavior, tools, and techniques?","choices":["Low-interaction Honeypot","Research Honeypot","Production Honeypot","Honeypot"],"answer":"Research Honeypot","explanation":"Research honeypots collect attacker intelligence.","id":"S09Q24"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Fragment Reassembly","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure reconstructs fragmented packets in the proper order before IDS inspection?","choices":["Default Deny","Fragment Reassembly","Attack Logging","Traffic Normalizer"],"answer":"Fragment Reassembly","explanation":"Correct reassembly counters fragmentation evasion.","id":"S09Q25"},{"concept_id":"Bypassing IDS/Firewalls::DGA","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique uses a shared seed to generate changing or gibberish domains for C2 communication?","choices":["Banner Grabbing","IP Address Spoofing","Source Routing","DGA"],"answer":"DGA","explanation":"Domain Generation Algorithms rotate possible C2 domains.","id":"S09Q26"},{"concept_id":"Bypassing NAC & Endpoint Security::Pre-authenticated Device","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What CEH evasion technique piggybacks through a device that has already passed network authentication?","choices":["Raspberry Pi","Dynamic Auto","Pre-authenticated Device","VLAN Hopping"],"answer":"Pre-authenticated Device","explanation":"An authenticated device can be abused as a bridge.","id":"S09Q27"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Default Deny","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure blocks all traffic unless a service is explicitly required and allowed?","choices":["TLS Inspection","Deep Packet Inspection","Default Deny","Remote Syslog"],"answer":"Default Deny","explanation":"Default-deny minimizes exposed services.","id":"S09Q28"},{"concept_id":"IDS/IPS/Firewall Concepts::HIDS","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which defensive system audits security-relevant activity on one specific endpoint?","choices":["HIDS","NIDS","IPS","SIEM"],"answer":"HIDS","explanation":"A HIDS focuses on a single host.","id":"S09Q29"},{"concept_id":"Bypassing IDS/Firewalls::ICMP Tunneling","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique hides arbitrary data inside the payload of Echo packets?","choices":["SSH Tunneling","DNS Tunneling","ICMP Tunneling","HTTP Tunneling"],"answer":"ICMP Tunneling","explanation":"ICMP tunneling hides data in ICMP payloads.","id":"S09Q30"},{"concept_id":"IDS/IPS/Firewall Concepts::NGFW","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which defensive system adds deep inspection, application awareness, IPS, and threat intelligence to classic filtering?","choices":["NIDS","NGFW","Packet Filtering","IPS"],"answer":"NGFW","explanation":"An NGFW extends traditional firewall functions.","id":"S09Q31"},{"concept_id":"Bypassing NAC & Endpoint Security::FENRIR","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What security utility is a tool listed for NAC bypass?","choices":["VLAN Hopping","FENRIR","DTP","Dynamic Desirable"],"answer":"FENRIR","explanation":"FENRIR is listed for NAC bypass.","id":"S09Q32"},{"concept_id":"Bypassing IDS/Firewalls::Source Routing","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique lets the sender influence the packet path to avoid monitored segments?","choices":["Source Routing","Proxy Server","IP Address Spoofing","Port Scanning"],"answer":"Source Routing","explanation":"Source routing can steer traffic through less-secured paths.","id":"S09Q33"},{"concept_id":"Bypassing IDS/Firewalls::IP Instead of URL","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique tries to bypass domain-name filtering by using a numeric address directly?","choices":["IP Instead of URL","Proxy Server","Port Scanning","Firewalking"],"answer":"IP Instead of URL","explanation":"Numeric addresses may bypass domain-only blocking.","id":"S09Q34"},{"concept_id":"Bypassing IDS/Firewalls::Hping","variant":5,"category":"Bypassing IDS/Firewalls","question":"What security utility is a packet-crafting tool associated with ACK tunneling?","choices":["Banner Grabbing","Nping","Hping","Firewalking"],"answer":"Hping","explanation":"Hping can craft ACK packets with payloads.","id":"S09Q35"},{"concept_id":"Bypassing NAC & Endpoint Security::CreateRemoteThread()","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What Windows function starts execution of injected code inside the target process?","choices":["VirtualAllocEx()","Dynamic Auto","VLAN Hopping","CreateRemoteThread()"],"answer":"CreateRemoteThread()","explanation":"CreateRemoteThread launches injected code.","id":"S09Q36"},{"concept_id":"IDS/IPS/Firewall Concepts::IPS","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which defensive system sits inline and can actively block malicious traffic?","choices":["IDS","NIDS","SIEM","IPS"],"answer":"IPS","explanation":"An IPS actively prevents as well as detects.","id":"S09Q37"},{"concept_id":"Bypassing IDS/Firewalls::Pre-Connection SYN","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique uses an invalid-checksum SYN before the real connection to confuse the sensor?","choices":["Post-Connection SYN","Pre-Connection SYN","Firewalking","IP Address Spoofing"],"answer":"Pre-Connection SYN","explanation":"Pre-connection SYN desynchronizes IDS state before the real flow.","id":"S09Q38"},{"concept_id":"Honeypot Concepts::Fingerprinting Running Service","variant":4,"category":"Honeypot Concepts","question":"Which honeypot detection technique looks for discrepancies between claimed services and actual behavior?","choices":["Honeypot","Honeynet","Analyzing MAC Address","Fingerprinting Running Service"],"answer":"Fingerprinting Running Service","explanation":"Service fingerprint mismatches can reveal deception.","id":"S09Q39"},{"concept_id":"IDS/IPS/Firewall Concepts::Incident","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What word describes an event that violates organizational policy?","choices":["Event","NIDS","Incident","IDS"],"answer":"Incident","explanation":"Not every event is an incident.","id":"S09Q40"},{"concept_id":"Honeypot Concepts::Medium-interaction Honeypot","variant":5,"category":"Honeypot Concepts","question":"What CEH honeypot type simulates a realistic OS, applications, and services?","choices":["Tar Pit","Honeypot","Low-interaction Honeypot","Medium-interaction Honeypot"],"answer":"Medium-interaction Honeypot","explanation":"Medium-interaction systems provide more realism.","id":"S09Q41"},{"concept_id":"IDS/IPS/Firewall Concepts::Segmentation","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which security architecture element pre-divides the network so compromised systems can be isolated quickly?","choices":["Defense in Depth","Defensible Architecture","DMZ","Segmentation"],"answer":"Segmentation","explanation":"Segmentation makes containment easier.","id":"S09Q42"},{"concept_id":"Honeypot Concepts::Enumerating Unexpected Open Ports","variant":5,"category":"Honeypot Concepts","question":"What CEH detection method looks for services that do not fit the target system role?","choices":["Honeypot","Enumerating Unexpected Open Ports","Analyzing Response Time","Fingerprinting Running Service"],"answer":"Enumerating Unexpected Open Ports","explanation":"Unexpected open ports may indicate a honeypot.","id":"S09Q43"},{"concept_id":"IDS/IPS/Firewall Concepts::Protocol Anomaly Detection","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which intrusion-detection method looks for deviations from expected protocol standards?","choices":["Anomaly Detection","Signature Recognition","Protocol Anomaly Detection","NIDS"],"answer":"Protoco runk?","choices":["Pre-authenticated Device","Dynamic Desirable","DTP","VLAN Hopping"],"answer":"DTP","explanation":"Dynamic Trunking Protocol can be abused for trunk formation.","id":"S09Q49"},{"concept_id":"Bypassing NAC & Endpoint Security::VirtualAllocEx()","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What Windows function allocates memory inside another process during classic injection?","choices":["CreateRemoteThread()","WriteProcessMemory()","DTP","VirtualAllocEx()"],"answer":"VirtualAllocEx()","explanation":"VirtualAllocEx allocates remote-process memory.","id":"S09Q50"}],[{"concept_id":"Bypassing NAC & Endpoint Security::VLANPWN","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What security utility is the tool listed for VLAN-hopping attacks?","choices":["FENRIR","Dynamic Auto","Dynamic Desirable","VLANPWN"],"answer":"VLANPWN","explanation":"VLANPWN is associated with DTP and double-tagging attacks.","id":"S10Q01"},{"concept_id":"IDS/IPS/Firewall Concepts::HIDS","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH security system audits security-relevant activity on one specific endpoint?","choices":["IPS","HIDS","NIDS","SIEM"],"answer":"HIDS","explanation":"A HIDS focuses on a single host.","id":"S10Q02"},{"concept_id":"Honeypot Concepts::Research Honeypot","variant":5,"category":"Honeypot Concepts","question":"What CEH honeypot type focuses on studying attacker behavior, tools, and techniques?","choices":["Research Honeypot","Honeypot","Production Honeypot","Low-interaction Honeypot"],"answer":"Research Honeypot","explanation":"Research honeypots collect attacker intelligence.","id":"S10Q03"},{"concept_id":"IDS/IPS/Firewall Concepts::Segmentation","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH network concept pre-divides the network so compromised systems can be isolated quickly?","choices":["Segmentation","DMZ","Defense in Depth","Defensible Architecture"],"answer":"Segmentation","explanation":"Segmentation makes containment easier.","id":"S10Q04"},{"concept_id":"Bypassing IDS/Firewalls::Port Scanning","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique identifies open ports and can fingerprint defensive products?","choices":["Proxy Server","Source Routing","Tiny Fragments","Port Scanning"],"answer":"Port Scanning","explanation":"Port scanning supports reconnaissance.","id":"S10Q05"},{"concept_id":"IDS/IPS/Firewall Concepts::SIEM","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH security system correlates logs and events and can generate security alerts?","choices":["IPS","HIDS","IDS","SIEM"],"answer":"SIEM","explanation":"A SIEM centralizes and correlates events.","id":"S10Q06"},{"concept_id":"Honeypot Concepts::High-interaction Honeypot","variant":5,"category":"Honeypot Concepts","question":"What CEH honeypot type provides extensive realistic services for deeper attacker interaction?","choices":["Medium-interaction Honeypot","High-interaction Honeypot","Tar Pit","Low-interaction Honeypot"],"answer":"High-interaction Honeypot","explanation":"High-interaction systems provide rich attacker visibility.","id":"S10Q07"},{"concept_id":"Honeypot Concepts::Analyzing MAC Address","variant":5,"category":"Honeypot Concepts","question":"What CEH detection method checks the OUI for unusual or inconsistent vendor information?","choices":["Honeynet","Honeypot","Enumerating Unexpected Open Ports","Analyzing MAC Address"],"answer":"Analyzing MAC Address","explanation":"Unexpected OUIs can reveal deception.","id":"S10Q08"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Remote Syslog","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure stores firewall logs away from the firewall itself?","choices":["Security Audits","Zero Trust","Remote Syslog","Configuration Backups"],"answer":"Remote Syslog","explanation":"Remote logging protects ewall Concepts::NetFlow","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH telemetry technology stores connection summaries such as peers, ports, duration, and volume?","choices":["Event","NIDS","NetFlow","Incident"],"answer":"NetFlow","explanation":"NetFlow is lighter than full packet capture.","id":"S10Q15"},{"concept_id":"Honeypot Concepts::Pure Honeypot","variant":5,"category":"Honeypot Concepts","question":"What CEH honeypot type emulates a real production environment as closely as possible?","choices":["High-interaction Honeypot","Honeypot","Pure Honeypot","Medium-interaction Honeypot"],"answer":"Pure Honeypot","explanation":"Pure honeypots mimic a real production environment.","id":"S10Q16"},{"concept_id":"Bypassing NAC & Endpoint Security::VLAN Hopping","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What CEH evasion technique gains access to additional VLANs through trunking behavior?","choices":["Dynamic Auto","VLAN Hopping","Raspberry Pi","Dynamic Desirable"],"answer":"VLAN Hopping","explanation":"VLAN hopping abuses switching and trunking.","id":"S10Q17"},{"concept_id":"Honeypot Concepts::Low-interaction Honeypot","variant":5,"category":"Honeypot Concepts","question":"What CEH honeypot type simulates only a limited set of services and cannot be fully compromised?","choices":["High-interaction Honeypot","Low-interaction Honeypot","Pure Honeypot","Honeypot"],"answer":"Low-interaction Honeypot","explanation":"Low-interaction honeypots emulate limited functionality.","id":"S10Q18"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Connection Limits","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure restricts simultaneous connections allowed per source?","choices":["Remote Syslog","Connection Limits","Default Deny","Configuration Backups"],"answer":"Connection Limits","explanation":"Per-IP limits reduce abuse.","id":"S10Q19"},{"concept_id":"Bypassing NAC & Endpoint Security::Dynamic Auto","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What Cisco switchport mode can form a trunk when the peer actively requests it?","choices":["VLANPWN","DTP","Dynamic Auto","Dynamic Desirable"],"answer":"Dynamic Auto","explanation":"Dynamic auto can negotiate a trunk with an active peer.","id":"S10Q20"},{"concept_id":"Bypassing IDS/Firewalls::IDS timeout higher than victim","variant":5,"category":"Bypassing IDS/Firewalls","question":"What fragmentation condition causes the sensor to retain fake fragments longer than the target host?","choices":["Source Routing","IDS timeout higher than victim","NIDS timeout lower than victim","Firewalking"],"answer":"IDS timeout higher than victim","explanation":"Different reassembly timeouts can create different packet views.","id":"S10Q21"},{"concept_id":"Bypassing IDS/Firewalls::Windows BITS","variant":5,"category":"Bypassing IDS/Firewalls","question":"What system service transfers malicious files as trusted background jobs?","choices":["IP Address Spoofing","Windows BITS","Source Routing","Firewalking"],"answer":"Windows BITS","explanation":"BITS can be abused for low-profile background transfer.","id":"S10Q22"},{"concept_id":"Bypassing IDS/Firewalls::Nping","variant":5,"category":"Bypassing IDS/Firewalls","question":"What security utility is an Nmap-family packet generator associated with ACK tunneling?","choices":["Hping","ICMPTX","Nping","Banner Grabbing"],"answer":"Nping","explanation":"Nping can craft packets for ACK tunneling.","id":"S10Q23"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Security Audits","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure periodically verify firewall posture and policy effectiveness?","choices":["Connection Limits","Zero Trust","TLS Inspection","Security Audits"],"answer":"Security Audits","explanation":"Regular audits identify drift and misconfiguration.","id":"S10Q24"},{"concept_id":"Bypassing IDS/Firewalls::ICMPTX","variant":5,"category":"Bypassing IDS/Firewalls","question":"What security utility is associated with tunneling a backdoor shell inside ICMP Echo payloads?","choices":["Nping","Banner Grabbing","ICMPTX","Hping"],"answer":"ICMPTX","explanation":"ICMPTX is listed for ICMP tunneling.","id":"S10Q25"},{"concept_id":"Bypassing NAC & Endpoint Security::AMSI Bypass","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What CEH evasion technique forces antimalware scanning to return a clean result?","choices":["DTP","Application Whitelisting Bypass","Ghostwriting","AMSI Bypass"],"answer":"AMSI Bypass","explanation":"AMSI bypass aims to neutralize antimalware scanning.","id":"S10Q26"},{"concept_id":"Bypassing IDS/Firewalls::Proxy Server","variant":5,"category":"Bypassing IDS/Firewalls","question":"What network intermediary relays requests through an intermediary to obscure the original client?","choices":["IP Address Spoofing","Tiny Fragments","Proxy Server","IP Instead of URL"],"answer":"Proxy Server","explanation":"A proxy changes the apparent request path.","id":"S10Q27"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Centralized Logging","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure stores events in a searchable platform for visibility and evidence?","choices":["Centralized Logging","Traffic Normalizer","Patch Management","Isolation"],"answer":"Centralized Logging","explanation":"Centralized logging supports monitoring and forensics.","id":"S10Q28"},{"concept_id":"Bypassing IDS/Firewalls::Loose Source Routing","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH source-routing type requires packets to pass through one or more specified waypoints?","choices":["Source Routing","IP Address Spoofing","Firewalking","Loose Source Routing"],"answer":"Loose Source Routing","explanation":"Loose source routing specifies selected intermediate points.","id":"S10Q29"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Traffic Normalizer","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure removes ambiguous traffic interpretations before packets reach the IDS?","choices":["Traffic Normalizer","Patch Management","Remote Syslog","Default Deny"],"answer":"Traffic Normalizer","explanation":"Traffic normalization reduces evasion through ambiguity.","id":"S10Q30"},{"concept_id":"Bypassing IDS/Firewalls::SSH Tunneling","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique uses encrypted port forwarding to carry otherwise blocked traffic?","choices":["SSH Tunneling","Firewalking","ACK Tunneling","DNS Tunneling"],"answer":"SSH Tunneling","explanation":"SSH tunneling uses encrypted forwarding.","id":"S10Q31"},{"concept_id":"IDS/IPS/Firewall Concepts::Event","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What word describes a detectable occurrence such as a login or connection?","choices":["NetFlow","Event","NIDS","IPS"],"answer":"Event","explanation":"An event is something detectable that happened.","id":"S10Q32"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Patch Management","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure keeps hosts and network devices current against known weaknesses?","choices":["Default Deny","Attack Logging","Remote Syslog","Patch Management"],"answer":"Patch Management","explanation":"Regular patching reduces exploitable gaps.","id":"S10Q33"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Playbooks","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure ensure responders follow documented and repeatable procedures?","choices":["Centralized Logging","Fragment Reassembly","Playbooks","Isolation"],"answer":"Playbooks","explanation":"Playbooks standardize incident response.","id":"S10Q34"},{"concept_id":"IDS/Firewall Evasion Countermeasures::TLS Inspection","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What CEH countermeasure inspects encrypted HTTPS/TLS traffic for hidden threats?","choices":["Deep Packet Inspection","Zero Trust","Configuration Backups","TLS Inspection"],"answer":"TLS Inspection","explanation":"TLS inspection improves visibility into encrypted evasion.","id":"S10Q35"},{"concept_id":"Bypassing IDS/Firewalls::Firewalking","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique uses TTL values to map firewall ACL rules?","choices":["Firewalking","Proxy Server","Banner Grabbing","Port Scanning"],"answer":"Firewalking","explanation":"Firewalking uses TTL behavior to infer firewall rules.","id":"S10Q36"},{"concept_id":"Honeypot Concepts::Fingerprinting Running Service","variant":5,"category":"Honeypot Concepts","question":"What CEH detection method looks for discrepancies between claimed services and actual behavior?","choices":["Fingerprinting Running Service","Honeynet","Analyzing MAC Address","Honeypot"],"answer":"Fingerprinting Running Service","explanation":"Service fingerprint mismatches can reveal deception.","id":"S10Q37"},{"concept_id":"IDS/IPS/Firewall Concepts::Anomaly Detection","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH IDS method flags deviations from an established model of normal behavior?","choices":["Signature Recognition","Anomaly Detection","IPS","IDS"],"answer":"Anomaly Detection","explanation":"Anomaly detection depends on a baseline.","id":"S10Q38"},{"concept_id":"IDS/IPS/Firewall Concepts::Defense in Breadth","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH security strategy covers people, process, technology, applications, and the full attack surface?","choices":["Defense in Breadth","Defensible Architecture","Defense in Depth","Choke Point"],"answer":"Defense in Breadth","explanation":"Defense in breadth considers wider attack paths.","id":"S10Q39"},{"concept_id":"Bypassing IDS/Firewalls::ACK Tunneling","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique hides data in ACK packets that may receive less scrutiny than SYN packets?","choices":["ACK Tunneling","DNS Tunneling","HTTP Tunneling","ICMP Tunneling"],"answer":"ACK Tunneling","explanation":"ACK tunneling abuses trusted ACK traffic.","id":"S10Q40"},{"concept_id":"Bypassing IDS/Firewalls::IP Address Spoofing","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique replaces a packet source address with a trusted host address?","choices":["Tiny Fragments","IP Address Spoofing","Firewalking","IP Instead of URL"],"answer":"IP Address Spoofing","explanation":"IP spoofing makes traffic appear to come from a trusted source.","id":"S10Q41"},{"concept_id":"Bypassing IDS/Firewalls::Tiny Fragments","variant":5,"category":"Bypassing IDS/Firewalls","question":"What CEH evasion technique creates small fragments so important TCP header fields appear in later fragments?","choices":["Banner Grabbing","Tiny Fragments","Source Routing","IP Address Spoofing"],"answer":"Tiny Fragments","explanation":"Tiny fragments exploit incomplete fragment inspection.","id":"S10Q42"},{"concept_id":"Bypassing NAC & Endpoint Security::Process Injection","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What CEH evasion technique places malicious code inside the address space of a running process?","choices":["Ghostwriting","DTP","VLAN Hopping","Process Injection"],"answer":"Process Injection","explanation":"Process injection hides code inside another process.","id":"S10Q43"},{"concept_id":"IDS/IPS/Firewall Solutions::Snort","variant":5,"category":"IDS/IPS/Firewall Solutions","question":"What analysis tool inspects network traffic for intrusion patterns?","choices":["Elastic Stack","YARA","Wireshark","Snort"],"answer":"Snort","explanation":"Snort is a network IDS/IPS technology.","id":"S10Q44"},{"concept_id":"Bypassing NAC & Endpoint Security::Raspberry Pi","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What example device is an example intermediary placed between an authenticated host and authentication server?","choices":["Raspberry Pi","Dynamic Desirable","DTP","VLAN Hopping"],"answer":"Raspberry Pi","explanation":"A small intermediary can relay authenticated access.","id":"S10Q45"},{"concept_id":"Bypassing NAC & Endpoint Security::WriteProcessMemory()","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What Windows function copies a payload into allocated remote-process memory?","choices":["WriteProcessMemory()","DTP","CreateRemoteThread()","Dynamic Auto"],"answer":"WriteProcessMemory()","explanation":"WriteProcessMemory writes into another process.","id":"S10Q46"},{"concept_id":"IDS/IPS/Firewall Concepts::NGFW","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH security system adds deep inspection, application awareness, IPS, and threat intelligence to classic filtering?","choices":["NIDS","NGFW","Packet Filtering","IPS"],"answer":"NGFW","explanation":"An NGFW extends traditional firewall functions.","id":"S10Q47"},{"concept_id":"Bypassing NAC & Endpoint Security::Ghostwriting","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What CEH evasion technique changes malware code structure while preserving functionality to defeat signatures?","choices":["Application Whitelisting Bypass","Process Injection","DTP","Ghostwriting"],"answer":"Ghostwriting","explanation":"Ghostwriting mutates code structure without changing behavior.","id":"S10Q48"},{"concept_id":"IDS/IPS/Firewall Concepts::IPS","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What CEH security system sits inline and can actively block malicious traffic?","choices":["SIEM","NIDS","IPS","IDS"],"answer":"IPS","explanation":"An IPS actively prevents as well as detects.","id":"S10Q49"},{"concept_id":"IDS/IPS/Firewall Solutions::Splunk","variant":5,"category":"IDS/IPS/Firewall Solutions","question":"What analysis tool indexes and searches logs for event analysis and SIEM use?","choices":["Wireshark","Elastic Stack","Splunk","YARA"],"answer":"Splunk","explanation":"Splunk is widely used for log analytics and SIEM.","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-evading-ids-firewalls-honeypots-direct-v2";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Evading IDS, Firewalls, and Honeypots — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Evading IDS, Firewalls, and Honeypots (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Evading IDS, Firewalls, and Honeypots (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
