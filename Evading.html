","Baseline behavior","Block traffic","Rotate keys"],"answer":"Baseline behavior","explanation":"The course sequence begins with baselining behavior.","id":"S08Q34"},{"fact_id":"c001","concept_id":"c001","root_concept":"IDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What security system primarily monitors traffic and raises an alarm when malicious activity is detected?","choices":["IDS","Firewall","NIDS","SIEM"],"answer":"IDS","explanation":"IDS is primarily a detection and alerting control.","id":"S08Q35"},{"fact_id":"n031","concept_id":"n031","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which trusted Windows binary is listed for loading DLLs?","choices":["arp.exe","ping.exe","format.com","rundll32.exe"],"answer":"rundll32.exe","explanation":"rundll32.exe is listed as an abuse path.","id":"S08Q36"},{"fact_id":"b028","concept_id":"b028","root_concept":"Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does firewalking infer from packet responses?","choices":["Disk sectors","Gateway ACL filters","User passwords","Wireless SSIDs"],"answer":"Gateway ACL filters","explanation":"Firewalking maps ACL behavior.","id":"S08Q37"},{"fact_id":"c097","concept_id":"c097","root_concept":"SIEM","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What platform type organizes and correlates events from many sources?","choices":["SIEM","HIDS","IPS","Firewall"],"answer":"SIEM","explanation":"SIEM correlates security events centrally.","id":"S08Q38"},{"fact_id":"b052","concept_id":"b052","root_concept":"ICMP Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What RFC is cited for ICMP Echo behavior in the course?","choices":["RFC 8446","RFC 1918","RFC 2616","RFC 792"],"answer":"RFC 792","explanation":"The course cites RFC 792.","id":"S08Q39"},{"fact_id":"c072","concept_id":"c072","root_concept":"Defense in Depth","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What is the main goal of defense in depth?","choices":["Disable monitoring","Remove segmentation","Eliminate logging","Delay the attacker"],"answer":"Delay the attacker","explanation":"The goal is to buy defenders time.","id":"S08Q40"},{"fact_id":"b105","concept_id":"b105","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What BITS operation starts the configured background job?","choices":["/scan","/pause","/delete","/resume"],"answer":"/resume","explanation":"The example resumes the job to start it.","id":"S08Q41"},{"fact_id":"n021","concept_id":"n021","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which short tool name BITM is listed for NAC bypass?","choices":["BITM","VLAN Hopping","DTP","VLANPWN"],"answer":"BITM","explanation":"BITM is listed among NAC bypass tools.","id":"S08Q42"},{"fact_id":"c025","concept_id":"c025","root_concept":"Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What must be established before anomaly detection can identify deviations?","choices":["DNS zone","MAC whitelist","Static route","Normal-use model"],"answer":"Normal-use model","explanation":"A baseline normal-use model is required.","id":"S08Q43"},{"fact_id":"h065","concept_id":"h065","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"What does a honeypot provide when it records attacker behavior?","choices":["Key escrow","Load balancing","Early warning","DNS recursion"],"answer":"Early warning","explanation":"Honeypots can act as early-warning sensors.","id":"S08Q44"},{"fact_id":"d027","concept_id":"d027","root_concept":"Attack Logging","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What destination-side identifier should be stored for future attack analysis?","choices":["BIOS date","Victim IP","Keyboard layout","Printer queue"],"answer":"Victim IP","explanation":"Victim IP is explicitly listed.","id":"S08Q45"},{"fact_id":"b082","concept_id":"b082","root_concept":"Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"How does the target host treat a post-connection SYN in an established session?","choices":["Creates a new DHCP lease","Ignores it","Resets DNS","Encrypts it"],"answer":"Ignores it","explanation":"The established host ignores the new SYN.","id":"S08Q46"},{"fact_id":"n057","concept_id":"n057","root_concept":"In-memory Beacon Encryption","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"When is the encrypted beacon memory decrypted?","choices":["At BIOS boot only","During DNS lookup","Before compilation","When execution resumes"],"answer":"When execution resumes","explanation":"The beacon decrypts on resume.","id":"S08Q47"},{"fact_id":"c050","concept_id":"c050","root_concept":"Packet Filtering","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What destination field can packet filtering evaluate from the IP header?","choices":["File path","User SID","Destination IP address","Process ID"],"answer":"Destination IP address","explanation":"Destination IP is one of the packet-filtering criteria.","id":"S08Q48"},{"fact_id":"s005","concept_id":"s005","root_concept":"YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What byte-oriented pattern type can YARA rules match?","choices":["Only URLs","Only DNS names","Only file paths","Hex strings"],"answer":"Hex strings","explanation":"YARA can match hexadecimal strings.","id":"S08Q49"},{"fact_id":"h004","concept_id":"h004","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"Why is almost any traffic to a honeypot suspicious?","choices":["It blocks all packets","It has no logs","It uses no IP address","No legitimate use exists"],"answer":"No legitimate use exists","explanation":"Because there is no authorized reason to access it.","id":"S08Q50"}],[{"fact_id":"h054","concept_id":"h054","root_concept":"Analyzing MAC Address","variant":1,"category":"Honeypot Concepts","question":"What identifier inside a MAC address is examined for unusual vendors?","choices":["SID","TTL","OUI","PID"],"answer":"OUI","explanation":"OUI stands for Organizationally Unique Identifier.","id":"S09Q01"},{"fact_id":"h002","concept_id":"h002","root_concept":"Honeypot","variant":1,"category":"Honeypot Concepts","question":"How much authorized activity should a honeypot have?","choices":["All production traffic","Normal employee activity","None","Only backups"],"answer":"None","explanation":"A honeypot should have no authorized activity.","id":"S09Q02"},{"fact_id":"d068","concept_id":"d068","root_concept":"Disable FTP","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What directions of FTP should be disabled by default?","choices":["Loopback only","Outbound only","Inbound only","To and from the network"],"answer":"To and from the network","explanation":"The course says FTP to/from the network.","id":"S09Q03"},{"fact_id":"c043","concept_id":"c043","root_concept":"Packet Filtering","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"At what OSI layer is packet filtering listed with VPN above the network layer?","choices":["Application","Network","Transport","Data Link"],"answer":"Transport","explanation":"The transport layer lists VPN and packet filtering.","id":"S09Q04"},{"fact_id":"h025","concept_id":"h025","root_concept":"Email Honeypot","variant":1,"category":"Honeypot Concepts","question":"What deception type focuses on attacks against email services?","choices":["Email Honeypot","Honeynet","Spider Honeypot","Database Honeypot"],"answer":"Email Honeypot","explanation":"Email honeypots target email abuse.","id":"S09Q05"},{"fact_id":"b059","concept_id":"b059","root_concept":"ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which packet-crafting tool is named for ACK tunneling?","choices":["Cowrie","ICMPTX","Hping","Reaver"],"answer":"Hping","explanation":"Hping is listed for ACK tunneling.","id":"S09Q06"},{"fact_id":"n004","concept_id":"n004","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What switch mode can pass DTP packets and negotiate a trunk if the peer initiates?","choices":["monitor","shutdown","dynamic auto","access"],"answer":"dynamic auto","explanation":"Dynamic auto can negotiate a trunk with an active peer.","id":"S09Q07"},{"fact_id":"d009","concept_id":"d009","root_concept":"Trusted DNS Resolver","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure defines the client DNS resolver on routers or similar devices?","choices":["User Training/Patching","Trusted DNS Resolver","Block TTL-Expired ICMP","Traffic Normalizer"],"answer":"Trusted DNS Resolver","explanation":"Controlling resolvers reduces DNS-based ambiguity.","id":"S09Q08"},{"fact_id":"b063","concept_id":"b063","root_concept":"SSH Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What SSH feature is used to tunnel traffic?","choices":["DNSSEC","Port forwarding","VLAN pruning","ARP aging"],"answer":"Port forwarding","explanation":"SSH tunneling uses local or remote port forwarding.","id":"S09Q09"},{"fact_id":"b131","concept_id":"b131","root_concept":"BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What is the example BITS job name used in the commands?","choices":["default","backup","system32","persistence"],"answer":"persistence","explanation":"The example creates a job named persistence.","id":"S09Q10"},{"fact_id":"d041","concept_id":"d041","root_concept":"Configuration Backups","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What control preserves firewall rules and configuration for recovery?","choices":["Configuration Backups","Behavior-Based Rules","Zero Trust","Rule Risk Queries"],"answer":"Configuration Backups","explanation":"Regular backups support restoration.","id":"S09Q11"},{"fact_id":"n032","concept_id":"n032","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which trusted registration utility is listed for bypass?","choices":["whoami.exe","ipconfig.exe","netstat.exe","regsvr32.exe"],"answer":"regsvr32.exe","explanation":"regsvr32.exe is listed in the course.","id":"S09Q12"},{"fact_id":"c093","concept_id":"c093","root_concept":"NetFlow","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What service detail can NetFlow include for a connection?","choices":["Port","Screen resolution","File owner","BIOS version"],"answer":"Port","explanation":"NetFlow records port metadata.","id":"S09Q13"},{"fact_id":"c005","concept_id":"c005","root_concept":"IDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What does an IDS normally generate after detecting suspected intrusion activity?","choices":["TLS certificate","Routing update","DHCP lease","Alarm"],"answer":"Alarm","explanation":"An IDS raises an alarm when suspicious activity is detected.","id":"S09Q14"},{"fact_id":"s013","concept_id":"s013","root_concept":"Logging","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What is a major cost driver of extensive logging?","choices":["Storage infrastructure","More MAC addresses","More SSIDs","Longer TTL"],"answer":"Storage infrastructure","explanation":"Logs require infrastructure and money to store.","id":"S09Q15"},{"fact_id":"c067","concept_id":"c067","root_concept":"DMZ","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which name-resolution server may be placed in a DMZ?","choices":["Domain controller","Backup vault","HR database","DNS server"],"answer":"DNS server","explanation":"Public DNS servers can reside in a DMZ.","id":"S09Q16"},{"fact_id":"n035","concept_id":"n035","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What regsvr32 switch in the example prevents DllRegisterServer from being called?","choices":["/r","/n","/t","/x"],"answer":"/n","explanation":"The example includes /n.","id":"S09Q17"},{"fact_id":"b076","concept_id":"b076","root_concept":"Scenario 2","variant":1,"category":"Bypassing IDS/Firewalls","question":"Why does the IDS reject its reassembled stream in the course scenario?","choices":["No DNS zone","Expired password","No MAC address","Invalid checksums"],"answer":"Invalid checksums","explanation":"The IDS combines fragments differently and sees invalid checksums.","id":"S09Q18"},{"fact_id":"b139","concept_id":"b139","root_concept":"Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"What state is the target already in when it ignores the injected SYN?","choices":["Time-wait only","Established","Listen only","Closed"],"answer":"Established","explanation":"The host ignores the SYN because the connection is already established.","id":"S09Q19"},{"fact_id":"c063","concept_id":"c063","root_concept":"VPN","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Does the course consider VPN inherently a firewall technology?","choices":["Yes","Only on Windows","Only with NAT","No"],"answer":"No","explanation":"The course explicitly says VPNs have no inherent relation to firewall technology.","id":"S09Q20"},{"fact_id":"h046","concept_id":"h046","root_concept":"Fingerprinting Running Service","variant":1,"category":"Honeypot Concepts","question":"What Nmap option is used for service-version detection in the example?","choices":["-O","-sS","-sV","-Pn"],"answer":"-sV","explanation":"The example uses nmap -sV.","id":"S09Q21"},{"fact_id":"h062","concept_id":"h062","root_concept":"Analyzing System Configuration/Metadata","variant":1,"category":"Honeypot Concepts","question":"What configuration clue can indicate a honeypot?","choices":["Minimal services","Up-to-date patching","Strong random passwords","Default configurations"],"answer":"Default configurations","explanation":"Default settings can expose emulation.","id":"S09Q22"},{"fact_id":"b013","concept_id":"b013","root_concept":"External Systems","variant":1,"category":"Bypassing IDS/Firewalls","question":"What evasion approach uses systems outside the protected network as an alternate path?","choices":["Port Scanning","IP Address Spoofing","MITM Attack","External Systems"],"answer":"External Systems","explanation":"External systems can provide alternate ingress or egress routes.","id":"S09Q23"},{"fact_id":"h033","concept_id":"h033","root_concept":"Honeytrap","variant":1,"category":"Honeypot Concepts","question":"What low-interaction honeypot runs as a daemon?","choices":["Valhala Honeypot","Honeytrap","NeroSwarm Honeypot","Blumira Honeypot"],"answer":"Honeytrap","explanation":"Honeytrap runs as a daemon.","id":"S09Q24"},{"fact_id":"n009","concept_id":"n009","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What script name in the example performs DTP hijacking?","choices":["DoubleTagging.py","nac_bypass_setup.sh","Ghostwriting.sh","DTPHijacking.py"],"answer":"DTPHijacking.py","explanation":"The example uses DTPHijacking.py.","id":"S09Q25"},{"fact_id":"c089","concept_id":"c089","root_concept":"Event","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Is every detectable event automatically an incident?","choices":["Only on servers","No","Only after alerts","Yes"],"answer":"No","explanation":"Not every event violates policy.","id":"S09Q26"},{"fact_id":"b022","concept_id":"b022","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which IDS product is listed with TCP 80 and UDP 53?","choices":["Honeytrap","Snort","Cowrie","Firewall Analyzer"],"answer":"Snort","explanation":"The course uses Snort as an identification example.","id":"S09Q27"},{"fact_id":"s012","concept_id":"s012","root_concept":"Logging","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What does centralized log analysis require in addition to storage?","choices":["No indexing","No storage","Query capability","No retention"],"answer":"Query capability","explanation":"Logs must be searchable to support investigation.","id":"S09Q28"},{"fact_id":"d025","concept_id":"d025","root_concept":"Firewalking Defense","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What TTL-related value is recommended to be changed to a large value?","choices":["MAC OUI","DNS serial","TTL field","TCP source port"],"answer":"TTL field","explanation":"The checklist recommends changing TTL to a large value.","id":"S09Q29"},{"fact_id":"h055","concept_id":"h055","root_concept":"Analyzing MAC Address","variant":1,"category":"Honeypot Concepts","question":"What command is shown for local MAC/OUI discovery?","choices":["ping -t","nmap -sV -p 80","nmap -p-","arp-scan --interface=eth0 --localnet"],"answer":"arp-scan --interface=eth0 --localnet","explanation":"The course provides this arp-scan command.","id":"S09Q30"},{"fact_id":"c011","concept_id":"c011","root_concept":"NIDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS type monitors packets traversing a network segment?","choices":["NIDS","IPS","UTM","HIDS"],"answer":"NIDS","explanation":"NIDS monitors network traffic rather than one host.","id":"S09Q31"},{"fact_id":"d057","concept_id":"d057","root_concept":"Change Control","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Who should be notified about firewall changes?","choices":["Any anonymous user","No one","Only printer admin","Security policy administrator"],"answer":"Security policy administrator","explanation":"The course names the security policy administrator.","id":"S09Q32"},{"fact_id":"d044","concept_id":"d044","root_concept":"Deep Packet Inspection","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure inspects application-layer content rather than only headers?","choices":["Behavior-Based Rules","Configuration Backups","Default Deny","Deep Packet Inspection"],"answer":"Deep Packet Inspection","explanation":"DPI improves visibility into evasive content.","id":"S09Q33"},{"fact_id":"b055","concept_id":"b055","root_concept":"ICMP Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What kind of payload can be tunneled through ICMP in the example?","choices":["Only certificate","Only ARP reply","Only DNS zone","Backdoor shell"],"answer":"Backdoor shell","explanation":"The course explicitly mentions a backdoor shell.","id":"S09Q34"},{"fact_id":"b018","concept_id":"b018","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"What reconnaissance technique identifies open ports and services before firewall evasion?","choices":["Source Routing","Port Scanning","Windows BITS","IP Instead of URL"],"answer":"Port Scanning","explanation":"Port scanning identifies reachable services and sometimes security products.","id":"S09Q35"},{"fact_id":"n037","concept_id":"n037","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What regsvr32 switch supplies the malicious scriptlet/DLL path?","choices":["/i","/s","/n","/u"],"answer":"/i","explanation":"The /i option carries the path argument in the example.","id":"S09Q36"},{"fact_id":"c085","concept_id":"c085","root_concept":"Runbook / Playbook","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What provides documented and repeatable response procedures?","choices":["NetFlow","Runbook / Playbook","SIEM","Incident"],"answer":"Runbook / Playbook","explanation":"Runbooks/playbooks standardize response.","id":"S09Q37"},{"fact_id":"c075","concept_id":"c075","root_concept":"Defense in Depth","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What operational problem can result from many separate security products?","choices":["Tool and console fragmentation","More bandwidth","Higher entropy","Fewer IP addresses"],"answer":"Tool and console fragmentation","explanation":"Separate tools and teams can hinder unified security operations.","id":"S09Q38"},{"fact_id":"d012","concept_id":"d012","root_concept":"Signature Updates","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure keeps the antivirus signature database current?","choices":["Signature Updates","Fragment Reassembly","Attack Logging","SIEM Monitoring"],"answer":"Signature Updates","explanation":"Current signatures improve detection of known threats.","id":"S09Q39"},{"fact_id":"b148","concept_id":"b148","root_concept":"BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What persistence-related capability can SetNotifyCmdLine provide?","choices":["Execute a command after job activity","Create DNSSEC records","Rotate Wi-Fi keys","Change MAC OUI"],"answer":"Execute a command after job activity","explanation":"SetNotifyCmdLine can launch a command as part of BITS job behavior.","id":"S09Q40"},{"fact_id":"b150","concept_id":"b150","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"Why can port scans help identify certain firewalls or IDS products?","choices":["Products expose characteristic listening ports","All products use same password","All products use WEP","All products disable TCP"],"answer":"Products expose characteristic listening ports","explanation":"Characteristic service ports can reveal the product.","id":"S09Q41"},{"fact_id":"b120","concept_id":"b120","root_concept":"IP Instead of URL","variant":1,"category":"Bypassing IDS/Firewalls","question":"What type of filtering does this technique mainly target?","choices":["Disk ACLs","Port security","Domain-name filtering","MAC filtering"],"answer":"Domain-name filtering","explanation":"It tries to bypass filters keyed only to domain names.","id":"S09Q42"},{"fact_id":"b032","concept_id":"b032","root_concept":"Banner Grabbing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What does banner grabbing try to identify about a service?","choices":["User password","Disk encryption key","Vendor/firmware version","VLAN native ID"],"answer":"Vendor/firmware version","explanation":"Banners can reveal product and firmware details.","id":"S09Q43"},{"fact_id":"n010","concept_id":"n010","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What interface is shown in the VLANPWN command examples?","choices":["eth0","tun0","lo","wlan0mon"],"answer":"eth0","explanation":"The examples use eth0.","id":"S09Q44"},{"fact_id":"n043","concept_id":"n043","root_concept":"CPL Side-Loading","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What endpoint-evasion technique abuses a Control Panel applet?","choices":["Direct System Calls","In-memory Beacon Encryption","CPL Side-Loading","AMSI Bypass"],"answer":"CPL Side-Loading","explanation":"CPL side-loading piggybacks on a legitimate applet.","id":"S09Q45"},{"fact_id":"n066","concept_id":"n066","root_concept":"Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What must the victim device already have before this NAC bypass works?","choices":["Expired certificate","Disabled NIC","No network access","Successful NAC authentication"],"answer":"Successful NAC authentication","explanation":"The technique relies on a device that already passed NAC.","id":"S09Q46"},{"fact_id":"b038","concept_id":"b038","root_concept":"Source Routing","variant":1,"category":"Bypassing IDS/Firewalls","question":"Why would an attacker choose less-monitored network segments?","choices":["Reduce alerting chance","Increase password length","Add MFA","Improve logging"],"answer":"Reduce alerting chance","explanation":"Source routing can reduce exposure to IDS/firewall monitoring.","id":"S09Q47"},{"fact_id":"c008","concept_id":"c008","root_concept":"IPS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What can an IPS do that distinguishes it from a passive IDS?","choices":["Block malicious traffic","Only store PCAPs","Only resolve DNS","Only inventory hosts"],"answer":"Block malicious traffic","explanation":"IPS can actively block and filter malicious traffic.","id":"S09Q48"},{"fact_id":"h027","concept_id":"h027","root_concept":"Honeynet","variant":1,"category":"Honeypot Concepts","question":"Which deception classification refers to multiple honeypots working as a network?","choices":["Email Honeypot","Honeynet","Malware Honeypot","Database Honeypot"],"answer":"Honeynet","explanation":"A honeynet is a network of honeypots.","id":"S09Q49"},{"fact_id":"b061","concept_id":"b061","root_concept":"HTTP Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What legitimate protocol does HTTP tunneling imitate?","choices":["SNMP","NTP","HTTP","ARP"],"answer":"HTTP","explanation":"HTTP tunneling disguises traffic as HTTP.","id":"S09Q50"}],[{"fact_id":"h013","concept_id":"h013","root_concept":"Low-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"Can a low-interaction honeypot be fully compromised?","choices":["No","Only with DNS","Only with VPN","Yes always"],"answer":"No","explanation":"The course explicitly says it cannot be fully compromised.","id":"S10Q01"},{"fact_id":"b089","concept_id":"b089","root_concept":"DGA","variant":1,"category":"Bypassing IDS/Firewalls","question":"What role do generated domains serve for malware and C2?","choices":["VLAN tags","Backup tapes","Rendezvous points","Password salts"],"answer":"Rendezvous points","explanation":"They act as rendezvous points for C2 communication.","id":"S10Q02"},{"fact_id":"n068","concept_id":"n068","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What is the attacker trying to gain access to through DTP abuse?","choices":["All VLANs","Only loopback","Only local files","Only DNS cache"],"answer":"All VLANs","explanation":"The course states attackers can gain access to VLANs through trunking.","id":"S10Q03"},{"fact_id":"s020","concept_id":"s020","root_concept":"SIEM","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What is the main value of SIEM beyond raw log storage?","choices":["Correlation and alerting","Password cracking","VLAN trunking","Packet fragmentation"],"answer":"Correlation and alerting","explanation":"SIEM organizes, correlates, and alerts on events.","id":"S10Q04"},{"fact_id":"n047","concept_id":"n047","root_concept":"Direct System Calls","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What technique bypasses hooks in ntdll.dll by invoking lower-level calls directly?","choices":["Ghostwriting","AI-Assisted Evasion","AMSI Bypass","Direct System Calls"],"answer":"Direct System Calls","explanation":"Direct syscalls avoid hooked user-mode APIs.","id":"S10Q05"},{"fact_id":"h011","concept_id":"h011","root_concept":"Low-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"What happens if an attacker performs an unexpected action on a low-interaction honeypot?","choices":["It generates an error","It disables logging","It joins the domain","It becomes a full OS"],"answer":"It generates an error","explanation":"Limited emulation cannot handle arbitrary behavior.","id":"S10Q06"},{"fact_id":"n029","concept_id":"n029","root_concept":"Application Whitelisting Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What characteristic does the malicious DLL copy to appear legitimate?","choices":["Legitimate DLL name","Victim IP only","DNS TTL","User SID only"],"answer":"Legitimate DLL name","explanation":"A malicious DLL is given a legitimate-looking name.","id":"S10Q07"},{"fact_id":"c027","concept_id":"c027","root_concept":"Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What is described as the hardest step in anomaly detection?","choices":["Creating a VLAN","Capturing a MAC address","Establishing normal behavior","Generating a CSR"],"answer":"Establishing normal behavior","explanation":"The course says establishing a normal-use model is the hardest step.","id":"S10Q08"},{"fact_id":"b146","concept_id":"b146","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What HTML attribute forces the browser to save a file rather than navigate normally?","choices":["title attribute","download attribute","lang attribute","alt attribute"],"answer":"download attribute","explanation":"The download attribute instructs the browser to save the resource.","id":"S10Q09"},{"fact_id":"c032","concept_id":"c032","root_concept":"Stateful Protocol Analysis","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What IDS stage checks expected protocol state when earlier checks do not match?","choices":["Anomaly Detection","Signature Recognition","Stateful Protocol Analysis","Protocol Anomaly Detection"],"answer":"Stateful Protocol Analysis","explanation":"The course flow reaches stateful protocol analysis after signature and anomaly checks.","id":"S10Q10"},{"fact_id":"h063","concept_id":"h063","root_concept":"Analyzing System Configuration/Metadata","variant":1,"category":"Honeypot Concepts","question":"What banner clue can indicate a honeypot?","choices":["No banners","Outdated banners","Accurate current banners","TLS 1.3"],"answer":"Outdated banners","explanation":"Outdated banners may be inconsistent with the claimed system.","id":"S10Q11"},{"fact_id":"b040","concept_id":"b040","root_concept":"Strict Source Routing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What source-routing type specifies the exact path?","choices":["Dynamic NAT","Strict Source Routing","Default Routing","Loose Source Routing"],"answer":"Strict Source Routing","explanation":"Strict source routing defines the complete path.","id":"S10Q12"},{"fact_id":"b023","concept_id":"b023","root_concept":"Port Scanning","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which TCP port is listed for Snort in the reconnaissance example?","choices":["80","445","22","25"],"answer":"80","explanation":"The course lists TCP 80 for Snort.","id":"S10Q13"},{"fact_id":"h074","concept_id":"h074","root_concept":"KFSensor","variant":1,"category":"Honeypot Concepts","question":"What categories of network traffic does KFSensor monitor?","choices":["SMTP only","Bluetooth only","TCP/UDP/ICMP","DNS only"],"answer":"TCP/UDP/ICMP","explanation":"KFSensor monitors TCP, UDP, and ICMP.","id":"S10Q14"},{"fact_id":"b007","concept_id":"b007","root_concept":"Proxy Server","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique routes requests through an intermediary to obscure the original client?","choices":["Proxy Server","SSH Tunneling","DNS Tunneling","MITM Attack"],"answer":"Proxy Server","explanation":"A proxy relays traffic through another system.","id":"S10Q15"},{"fact_id":"s015","concept_id":"s015","root_concept":"SIEM","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"What does SIEM correlation help identify across separate events?","choices":["CPU fan speed","Keyboard layout","Threat patterns","Screen resolution"],"answer":"Threat patterns","explanation":"Correlation links related events into meaningful patterns.","id":"S10Q16"},{"fact_id":"b073","concept_id":"b073","root_concept":"Scenario 2","variant":1,"category":"Bypassing IDS/Firewalls","question":"What kind of fragments are sent first in scenario 2?","choices":["Only ARP requests","False-payload fragments","Only DNS replies","Only ACKs"],"answer":"False-payload fragments","explanation":"The attacker first sends false-payload fragments.","id":"S10Q17"},{"fact_id":"n075","concept_id":"n075","root_concept":"Thread Call Stack Spoofing","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What evidence link is discarded by stack spoofing?","choices":["IP to MAC mapping","User to group mapping","DNS to IP mapping","Return address to shellcode"],"answer":"Return address to shellcode","explanation":"The technique hides the call-stack relationship.","id":"S10Q18"},{"fact_id":"c054","concept_id":"c054","root_concept":"NGFW","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What NGFW capability inspects content beyond basic packet headers?","choices":["Application awareness","Deep packet inspection","Traditional firewall functions","Cloud-based threat intelligence"],"answer":"Deep packet inspection","explanation":"NGFWs add deep packet inspection.","id":"S10Q19"},{"fact_id":"h060","concept_id":"h060","root_concept":"Enumerating Unexpected Open Ports","variant":1,"category":"Honeypot Concepts","question":"What ports would be expected on the example normal web server?","choices":["80 and 443","21 and 22","137 and 139","25 and 110"],"answer":"80 and 443","explanation":"The example assumes a web server should expose 80/443.","id":"S10Q20"},{"fact_id":"d061","concept_id":"d061","root_concept":"Connection Limits","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What is the unit of restriction for connection limits in the checklist?","choices":["Per VLAN name","Per CPU core","Per keyboard","Per IP address"],"answer":"Per IP address","explanation":"The course says limits per IP address.","id":"S10Q21"},{"fact_id":"d045","concept_id":"d045","root_concept":"Connection Limits","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What control restricts how many connections one IP can establish?","choices":["Geo-Restriction","Connection Limits","Security Audits","Admin Access Control"],"answer":"Connection Limits","explanation":"Per-IP connection limits reduce abuse.","id":"S10Q22"},{"fact_id":"b119","concept_id":"b119","root_concept":"Proxy Server","variant":1,"category":"Bypassing IDS/Firewalls","question":"What component receives the client request before forwarding it onward?","choices":["DHCP client","Proxy","ARP cache","DNS root server"],"answer":"Proxy","explanation":"A proxy acts as the intermediary.","id":"S10Q23"},{"fact_id":"h009","concept_id":"h009","root_concept":"Honeynet","variant":1,"category":"Honeypot Concepts","question":"What is a network of honeypots called?","choices":["High-interaction Honeypot","Medium-interaction Honeypot","Production Honeypot","Honeynet"],"answer":"Honeynet","explanation":"A honeynet contains multiple honeypots.","id":"S10Q24"},{"fact_id":"b027","concept_id":"b027","root_concept":"Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"What packet types can firewalking send according to the course?","choices":["ESP only","TCP or UDP","ARP only","GRE only"],"answer":"TCP or UDP","explanation":"The course states firewalking can send TCP/UDP packets.","id":"S10Q25"},{"fact_id":"b029","concept_id":"b029","root_concept":"Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"What standalone tool is named for firewalking?","choices":["Firewalk","Reaver","Cowrie","Hydra"],"answer":"Firewalk","explanation":"Firewalk is explicitly listed as a tool.","id":"S10Q26"},{"fact_id":"c064","concept_id":"c064","root_concept":"VPN","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Why are VPN features often placed on firewalls?","choices":["Required by SMTP","Required by ARP","Convenient integration","Required by DNS"],"answer":"Convenient integration","explanation":"Firewalls are a convenient platform for adding VPN features.","id":"S10Q27"},{"fact_id":"h072","concept_id":"h072","root_concept":"Production Honeypot","variant":1,"category":"Honeypot Concepts","question":"What is the main organizational goal of a production honeypot?","choices":["Operational defense","Asset inventory only","Software compilation","Academic research only"],"answer":"Operational defense","explanation":"Production honeypots support day-to-day protection.","id":"S10Q28"},{"fact_id":"n008","concept_id":"n008","root_concept":"VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What script name in the example performs double tagging?","choices":["BitsParser.py","DoubleTagging.py","DTPHijacking.py","Firewalk.py"],"answer":"DoubleTagging.py","explanation":"The example uses DoubleTagging.py.","id":"S10Q29"},{"fact_id":"d010","concept_id":"d010","root_concept":"Device Hardening","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure secures communication devices such as modems and routers?","choices":["Trusted DNS Resolver","Device Hardening","Topology-Aware IDS Placement","FIN/RST Termination"],"answer":"Device Hardening","explanation":"Infrastructure devices should be hardened.","id":"S10Q30"},{"fact_id":"b110","concept_id":"b110","root_concept":"Windows BITS","variant":1,"category":"Bypassing IDS/Firewalls","question":"What administrative action should be performed regularly on BITS jobs?","choices":["Remove DNS","Increase TTL","Audit them","Disable all logging"],"answer":"Audit them","explanation":"Regular audits can reveal suspicious jobs.","id":"S10Q31"},{"fact_id":"n065","concept_id":"n065","root_concept":"AI-Assisted Evasion","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What detection type is primarily challenged by constantly mutated code?","choices":["Disk quotas","Signature detection","Network cabling","Physical access control"],"answer":"Signature detection","explanation":"Mutation reduces signature-based detection rates.","id":"S10Q32"},{"fact_id":"b093","concept_id":"b093","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What metadata must be compatible so the browser handles the blob correctly?","choices":["MAC OUI","TCP ISN","DNS TTL","MIME type"],"answer":"MIME type","explanation":"A compatible MIME type is set for the blob.","id":"S10Q33"},{"fact_id":"n039","concept_id":"n039","root_concept":"Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What Windows API allocates memory in the target process?","choices":["AmsiScanBuffer()","CreateRemoteThread()","WriteProcessMemory()","VirtualAllocEx()"],"answer":"VirtualAllocEx()","explanation":"VirtualAllocEx allocates remote-process memory.","id":"S10Q34"},{"fact_id":"b130","concept_id":"b130","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What browser method is called to create the downloadable object URL?","choices":["SetNotifyCmdLine","EfsRpcOpenFileRaw","createObjectURL","CreateRemoteThread"],"answer":"createObjectURL","explanation":"The example uses window.URL.createObjectURL().","id":"S10Q35"},{"fact_id":"c083","concept_id":"c083","root_concept":"Defensible Architecture","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What architecture focuses on detecting and controlling attackers after entry?","choices":["UTM","Isolation","Defensible Architecture","Defense in Depth"],"answer":"Defensible Architecture","explanation":"Defensible architecture emphasizes visibility and response.","id":"S10Q36"},{"fact_id":"b090","concept_id":"b090","root_concept":"HTML Smuggling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technologies does HTML smuggling manipulate to evade gateways?","choices":["BGP/OSPF","SNMP/NTP","SMB/NFS","HTML5/JavaScript"],"answer":"HTML5/JavaScript","explanation":"HTML smuggling uses browser-side HTML5/JavaScript features.","id":"S10Q37"},{"fact_id":"c004","concept_id":"c004","root_concept":"IDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What type of policy problem can an IDS identify by gathering and analyzing information?","choices":["Security policy violations","Disk fragmentation","Battery drain","Printer errors"],"answer":"Security policy violations","explanation":"IDS analysis can identify unauthorized access and misuse.","id":"S10Q38"},{"fact_id":"b037","concept_id":"b037","root_concept":"IP Address Spoofing","variant":1,"category":"Bypassing IDS/Firewalls","question":"What security control is IP spoofing trying to bypass in this module?","choices":["Disk encryption","Code signing","Backup retention","IDS/firewall filtering rules"],"answer":"IDS/firewall filtering rules","explanation":"IP spoofing targets filtering based on source identity.","id":"S10Q39"},{"fact_id":"d053","concept_id":"d053","root_concept":"Traffic Review","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What directions of allowed traffic should be cataloged?","choices":["Inbound only","Loopback only","Outbound only","Inbound and outbound"],"answer":"Inbound and outbound","explanation":"The checklist explicitly says inbound/outbound.","id":"S10Q40"},{"fact_id":"h018","concept_id":"h018","root_concept":"High-interaction Honeypot","variant":1,"category":"Honeypot Concepts","question":"What honeypot type simulates all services and applications of a target network?","choices":["Production Honeypot","Low-interaction Honeypot","Pure Honeypot","High-interaction Honeypot"],"answer":"High-interaction Honeypot","explanation":"High-interaction honeypots expose extensive functionality.","id":"S10Q41"},{"fact_id":"c045","concept_id":"c045","root_concept":"Stateful Multilayer Inspection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"At what OSI layer is stateful multilayer inspection listed?","choices":["Transport","Presentation","Network","Application"],"answer":"Network","explanation":"Stateful multilayer inspection is mapped to the network layer.","id":"S10Q42"},{"fact_id":"d021","concept_id":"d021","root_concept":"Traffic Normalization","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What problem does normalization remove before traffic reaches the IDS?","choices":["Authentication","Ambiguity","Routing","Encryption"],"answer":"Ambiguity","explanation":"Normalization reduces evasive differences in interpretation.","id":"S10Q43"},{"fact_id":"c099","concept_id":"c099","root_concept":"Isolation","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What response action separates a compromised host from the network?","choices":["Defensible Architecture","Defense in Depth","Isolation","DMZ"],"answer":"Isolation","explanation":"Isolation contains a compromised system.","id":"S10Q44"},{"fact_id":"c048","concept_id":"c048","root_concept":"Packet Filtering","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What firewall type compares each packet against criteria before forwarding?","choices":["Application Proxy","NAT","Packet Filtering","Stateful Multilayer Inspection"],"answer":"Packet Filtering","explanation":"Packet filtering evaluates each packet against configured criteria.","id":"S10Q45"},{"fact_id":"d022","concept_id":"d022","root_concept":"Fragment Reassembly","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What must the IDS do after normalizing fragments?","choices":["Disable logging","Reassemble in proper order","Change MAC addresses","Drop all TCP"],"answer":"Reassemble in proper order","explanation":"Proper reassembly is explicitly recommended.","id":"S10Q46"},{"fact_id":"n046","concept_id":"n046","root_concept":"CPL Side-Loading","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"What tool is listed for CPL side-loading?","choices":["CPLResourceRunner","ASBBypass.dll","VLANPWN","Ghostwriting.sh"],"answer":"CPLResourceRunner","explanation":"CPLResourceRunner is the named tool.","id":"S10Q47"},{"fact_id":"b009","concept_id":"b009","root_concept":"ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"What technique exploits the fact that ACK packets may receive less scrutiny than SYN packets?","choices":["Proxy Server","Content/XSS Attack","ACK Tunneling","Windows BITS"],"answer":"ACK Tunneling","explanation":"ACK tunneling hides payloads in trusted ACK traffic.","id":"S10Q48"},{"fact_id":"c038","concept_id":"c038","root_concept":"Firewall","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"What state-related information can a firewall inspect?","choices":["Wallpaper settings","BIOS vendor only","Battery level","Packet state/attributes"],"answer":"Packet state/attributes","explanation":"Firewalls can inspect packet state and attributes.","id":"S10Q49"},{"fact_id":"d011","concept_id":"d011","root_concept":"Block TTL-Expired ICMP","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"What countermeasure blocks ICMP TTL-expired packets at the external interface?","choices":["Block TTL-Expired ICMP","Signature Updates","FIN/RST Termination","Polymorphic NOP Detection"],"answer":"Block TTL-Expired ICMP","explanation":"This reduces TTL-based probing such as firewalking.","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-evading-ids-firewalls-honeypots-unique-v3";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Evading IDS, Firewalls, and Honeypots — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Evading IDS, Firewalls, and Honeypots (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Evading IDS, Firewalls, and Honeypots (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
