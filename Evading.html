<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Evading IDS, Firewalls, and Honeypots — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"concept_id":"IDS/IPS/Firewall Concepts::Protocol Anomaly Detection","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What is being described here: looks for deviations from expected protocol standards?","choices":["IDS","IPS","Protocol Anomaly Detection","Anomaly Detection"],"answer":"Protocol Anomaly Detection","explanation":"Protocol anomaly detection focuses on protocol behavior.","id":"S01Q01"},{"concept_id":"Honeypot Concepts::Pure Honeypot","variant":5,"category":"Honeypot Concepts","question":"What is being described here: emulates a real production environment as closely as possible?","choices":["Honeypot","Pure Honeypot","Tar Pit","Low-interaction Honeypot"],"answer":"Pure Honeypot","explanation":"Pure honeypots mimic a real production environment.","id":"S01Q02"},{"concept_id":"IDS/IPS/Firewall Concepts::NetFlow","variant":2,"category":"IDS/IPS/Firewall Concepts","question":"What best fits this description: stores connection summaries such as peers, ports, duration, and volume?","choices":["NetFlow","IPS","Event","NIDS"],"answer":"NetFlow","explanation":"NetFlow is lighter than full packet capture.","id":"S01Q03"},{"concept_id":"Bypassing IDS/Firewalls::Blob","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: holds reconstructed malicious content inside the browser?","choices":["Banner Grabbing","Blob","Firewalking","Browser Reconstruction"],"answer":"Blob","explanation":"HTML smuggling commonly uses JavaScript blobs.","id":"S01Q04"},{"concept_id":"Bypassing IDS/Firewalls::Proxy Server","variant":3,"category":"Bypassing IDS/Firewalls","question":"Identify the correct answer: relays requests through an intermediary to obscure the original client.","choices":["Tiny Fragments","Firewalking","IP Instead of URL","Proxy Server"],"answer":"Proxy Server","explanation":"A proxy changes the apparent request path.","id":"S01Q05"},{"concept_id":"IDS/IPS/Firewall Concepts::Segmentation","variant":3,"category":"IDS/IPS/Firewall Concepts","question":"Identify the correct answer: pre-divides the network so compromised systems can be isolated quickly.","choices":["Defensible Architecture","Segmentation","Defense in Depth","Defense in Breadth"],"answer":"Segmentation","explanation":"Segmentation makes containment easier.","id":"S01Q06"},{"concept_id":"Bypassing IDS/Firewalls::ICMPTX","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: is the tool associated with tunneling data inside ICMP Echo payloads?","choices":["Firewalking","Hping","ICMPTX","Banner Grabbing"],"answer":"ICMPTX","explanation":"ICMPTX is listed for ICMP tunneling.","id":"S01Q07"},{"concept_id":"Bypassing NAC & Endpoint Security::WriteProcessMemory()","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"What best fits this description: copies a payload into allocated remote-process memory?","choices":["CreateRemoteThread()","WriteProcessMemory()","VLAN Hopping","Dynamic Auto"],"answer":"WriteProcessMemory()","explanation":"WriteProcessMemory writes into another process.","id":"S01Q08"},{"concept_id":"Honeypot Concepts::Analyzing MAC Address","variant":4,"category":"Honeypot Concepts","question":"Which term should you associate with this: checks the OUI for unusual or inconsistent vendor information?","choices":["Analyzing MAC Address","Fingerprinting Running Service","Honeypot","Analyzing Response Time"],"answer":"Analyzing MAC Address","explanation":"Unexpected OUIs can reveal deception.","id":"S01Q09"},{"concept_id":"IDS/IPS/Firewall Concepts::Anomaly Detection","variant":2,"category":"IDS/IPS/Firewall Concepts","question":"What best fits this description: flags deviations from an established model of normal behavior?","choices":["NIDS","IDS","Anomaly Detection","Protocol Anomaly Detection"],"answer":"Anomaly Detection","explanation":"Anomaly detection depends on a baseline.","id":"S01Q10"},{"concept_id":"Bypassing NAC & Endpoint Security::Raspberry Pi","variant":5,"category":"Bypassing NAC & Endpoint Security","question":"What is being described here: is an example intermediary placed between an authenticated host and authentication server?","choices":["Pre-authenticated Device","Dynamic Auto","Raspberry Pi","VLAN Hopping"],"answer":"Raspberry Pi","explanation":"A small intermediary can relay authenticated access.","id":"S01Q11"},{"concept_id":"Honeypot Concepts::Research Honeypot","variant":3,"category":"Honeypot Concepts","question":"Identify the correct answer: focuses on studying attacker behavior, tools, and techniques.","choices":["Tar Pit","Honeynet","Honeypot","Research Honeypot"],"answer":"Research Honeypot","explanation":"Research honeypots collect attacker intelligence.","id":"S01Q12"},{"concept_id":"Bypassing IDS/Firewalls::Port Scanning","variant":3,"category":"Bypassing IDS/Firewalls","question":"Identify the correct answer: identifies open ports and can fingerprint defensive products.","choices":["Port Scanning","IP Instead of URL","IP Address Spoofing","Banner Grabbing"],"answer":"Port Scanning","explanation":"Port scanning supports reconnaissance.","id":"S01Q13"},{"concept_id":"IDS/IPS/Firewall Solutions::Splunk","variant":4,"category":"IDS/IPS/Firewall Solutions","question":"Which term should you associate with this: indexes and searches logs for event analysis and SIEM use?","choices":["Snort","Wireshark","YARA","Splunk"],"answer":"Splunk","explanation":"Splunk is widely used for log analytics and SIEM.","id":"S01Q14"},{"concept_id":"Bypassing IDS/Firewalls::SSH Tunneling","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: uses encrypted port forwarding to carry otherwise blocked traffic?","choices":["ACK Tunneling","HTTP Tunneling","Firewalking","SSH Tunneling"],"answer":"SSH Tunneling","explanation":"SSH tunneling uses encrypted forwarding.","id":"S01Q15"},{"concept_id":"Bypassing NAC & Endpoint Security::Dynamic Auto","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"What best fits this description: can form a trunk when the peer actively requests it?","choices":["VLANPWN","DTP","Pre-authenticated Device","Dynamic Auto"],"answer":"Dynamic Auto","explanation":"Dynamic auto can negotiate a trunk with an active peer.","id":"S01Q16"},{"concept_id":"Bypassing IDS/Firewalls::Nping","variant":5,"category":"Bypassing IDS/Firewalls","question":"What is being described here: is an Nmap-family packet generator associated with ACK tunneling?","choices":["Hping","Banner Grabbing","Firewalking","Nping"],"answer":"Nping","explanation":"Nping can craft packets for ACK tunneling.","id":"S01Q17"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Remote Syslog","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"What best fits this description: stores firewall logs away from the firewall itself?","choices":["Remote Syslog","Zero Trust","Default Deny","Connection Limits"],"answer":"Remote Syslog","explanation":"Remote logging protects evidence from local compromise.","id":"S01Q18"},{"concept_id":"Bypassing IDS/Firewalls::ACK Tunneling","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: hides data in ACK packets that may receive less scrutiny than SYN packets?","choices":["ACK Tunneling","ICMP Tunneling","SSH Tunneling","DNS Tunneling"],"answer":"ACK Tunneling","explanation":"ACK tunneling abuses trusted ACK traffic.","id":"S01Q19"},{"concept_id":"IDS/IPS/Firewall Concepts::IDS","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which concept matches this clue: monitors traffic and raises alerts without being primarily inline?","choices":["IDS","UTM","NIDS","IPS"],"answer":"IDS","explanation":"An IDS is primarily passive detection.","id":"S01Q20"},{"concept_id":"IDS/Firewall Evasion Countermeasures::TLS Inspection","variant":3,"category":"IDS/Firewall Evasion Countermeasures","question":"Identify the correct answer: inspects encrypted HTTPS/TLS traffic for hidden threats.","choices":["Default Deny","Connection Limits","Security Audits","TLS Inspection"],"answer":"TLS Inspection","explanation":"TLS inspection improves visibility into encrypted evasion.","id":"S01Q21"},{"concept_id":"Bypassing IDS/Firewalls::IP Address Spoofing","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: replaces a packet source address with a trusted host address?","choices":["IP Address Spoofing","Firewalking","Port Scanning","Proxy Server"],"answer":"IP Address Spoofing","explanation":"IP spoofing makes traffic appear to come from a trusted source.","id":"S01Q22"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Playbooks","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"What best fits this description: ensure responders follow documented and repeatable procedures?","choices":["Traffic Normalizer","Isolation","Playbooks","Centralized Logging"],"answer":"Playbooks","explanation":"Playbooks standardize incident response.","id":"S01Q23"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Patch Management","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"What best fits this description: keeps hosts and network devices current against known weaknesses?","choices":["Remote Syslog","Fragment Reassembly","Attack Logging","Patch Management"],"answer":"Patch Management","explanation":"Regular patching reduces exploitable gaps.","id":"S01Q24"},{"concept_id":"Honeypot Concepts::Low-interaction Honeypot","variant":4,"category":"Honeypot Concepts","question":"Which term should you associate with this: simulates only a limited set of services and cannot be fully compromised?","choices":["Pure Honeypot","High-interaction Honeypot","Low-interaction Honeypot","Tar Pit"],"answer":"Low-interaction Honeypot","explanation":"Low-interaction honeypots emulate limited functionality.","id":"S01Q25"},{"concept_id":"Bypassing NAC & Endpoint Security::Process Injection","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"What best fits this description: places malicious code inside the address space of a running process?","choices":["Process Injection","Application Whitelisting Bypass","VLAN Hopping","DTP"],"answer":"Process Injection","explanation":"Process injection hides code inside another process.","id":"S01Q26"},{"concept_id":"Bypassing IDS/Firewalls::IDS timeout higher than victim","variant":3,"category":"Bypassing IDS/Firewalls","question":"Identify the correct answer: causes the sensor to retain fake fragments longer than the target host.","choices":["IDS timeout higher than victim","Banner Grabbing","Firewalking","NIDS timeout lower than victim"],"answer":"IDS timeout higher than victim","explanation":"Different reassembly timeouts can create different packet views.","id":"S01Q27"},{"concept_id":"IDS/IPS/Firewall Concepts::HIDS","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which term should you associate with this: audits security-relevant activity on one specific endpoint?","choices":["IPS","UTM","IDS","HIDS"],"answer":"HIDS","explanation":"A HIDS focuses on a single host.","id":"S01Q28"},{"concept_id":"IDS/IPS/Firewall Concepts::Defense in Depth","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which concept matches this clue: uses multiple protective layers so one failed control is followed by another?","choices":["DMZ","Defense in Depth","Choke Point","Defense in Breadth"],"answer":"Defense in Depth","explanation":"Defense in depth layers controls to delay attackers.","id":"S01Q29"},{"concept_id":"Honeypot Concepts::Honeytrap","variant":1,"category":"Honeypot Concepts","question":"Which concept matches this clue: is a low-interaction daemon that records attack strings against TCP/UDP services?","choices":["Honeypot","Low-interaction Honeypot","Honeynet","Honeytrap"],"answer":"Honeytrap","explanation":"Honeytrap records attack data.","id":"S01Q30"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Connection Limits","variant":5,"category":"IDS/Firewall Evasion Countermeasures","question":"What is being described here: restricts simultaneous connections allowed per source?","choices":["Zero Trust","Connection Limits","Remote Syslog","Security Audits"],"answer":"Connection Limits","explanation":"Per-IP limits reduce abuse.","id":"S01Q31"},{"concept_id":"Honeypot Concepts::High-interaction Honeypot","variant":2,"category":"Honeypot Concepts","question":"What best fits this description: provides extensive realistic services and applications for deeper attacker interaction?","choices":["Tar Pit","Honeypot","High-interaction Honeypot","Medium-interaction Honeypot"],"answer":"High-interaction Honeypot","explanation":"High-interaction systems provide rich attacker visibility.","id":"S01Q32"},{"concept_id":"Honeypot Concepts::Honeypot","variant":1,"category":"Honeypot Concepts","question":"Which concept matches this clue: is deliberately exposed with no legitimate production activity to attract attackers?","choices":["Honeypot","Pure Honeypot","Tar Pit","Medium-interaction Honeypot"],"answer":"Honeypot","explanation":"Any honeypot interaction is inherently suspicious.","id":"S01Q33"},{"concept_id":"Bypassing IDS/Firewalls::Firewalking","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: uses TTL-controlled probes to map gateway ACL filtering?","choices":["Tiny Fragments","IP Instead of URL","Port Scanning","Firewalking"],"answer":"Firewalking","explanation":"Firewalking uses TTL behavior to infer firewall rules.","id":"S01Q34"},{"concept_id":"Bypassing NAC & Endpoint Security::Ghostwriting","variant":3,"category":"Bypassing NAC & Endpoint Security","question":"Identify the correct answer: changes malware code structure while preserving functionality to defeat signatures.","choices":["Application Whitelisting Bypass","VLAN Hopping","Process Injection","Ghostwriting"],"answer":"Ghostwriting","explanation":"Ghostwriting mutates code structure without changing behavior.","id":"S01Q35"},{"concept_id":"Bypassing IDS/Firewalls::Seed","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: is the shared value used by malware and C2 to generate the same domain sequence?","choices":["Banner Grabbing","Seed","DGA","IP Address Spoofing"],"answer":"Seed","explanation":"A DGA seed synchronizes domain generation.","id":"S01Q36"},{"concept_id":"Bypassing IDS/Firewalls::Tiny Fragments","variant":5,"category":"Bypassing IDS/Firewalls","question":"What is being described here: splits packets so important TCP header fields appear in later fragments?","choices":["IP Address Spoofing","Source Routing","Firewalking","Tiny Fragments"],"answer":"Tiny Fragments","explanation":"Tiny fragments exploit incomplete fragment inspection.","id":"S01Q37"},{"concept_id":"Bypassing IDS/Firewalls::Loose Source Routing","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: requires packets to pass through one or more specified waypoints?","choices":["Banner Grabbing","Firewalking","Loose Source Routing","Source Routing"],"answer":"Loose Source Routing","explanation":"Loose source routing specifies selected intermediate points.","id":"S01Q38"},{"concept_id":"IDS/IPS/Firewall Concepts::SIEM","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What is being described here: correlates logs and events and can generate security alerts?","choices":["IDS","SIEM","UTM","IPS"],"answer":"SIEM","explanation":"A SIEM centralizes and correlates events.","id":"S01Q39"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Centralized Logging","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"What best fits this description: stores events in a searchable platform for visibility and evidence?","choices":["Centralized Logging","Isolation","Traffic Normalizer","Playbooks"],"answer":"Centralized Logging","explanation":"Centralized logging supports monitoring and forensics.","id":"S01Q40"},{"concept_id":"Bypassing NAC & Endpoint Security::AMSI Bypass","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"What best fits this description: forces malware scanning to return a clean result?","choices":["Application Whitelisting Bypass","DTP","AMSI Bypass","Process Injection"],"answer":"AMSI Bypass","explanation":"AMSI bypass aims to neutralize antimalware scanning.","id":"S01Q41"},{"concept_id":"IDS/IPS/Firewall Solutions::YARA","variant":1,"category":"IDS/IPS/Firewall Solutions","question":"Which concept matches this clue: uses rule-based Boolean expressions and strings to detect or classify malware?","choices":["Elastic Stack","YARA","Wireshark","Splunk"],"answer":"YARA","explanation":"YARA is a rule-based malware identification tool.","id":"S01Q42"},{"concept_id":"Bypassing NAC & Endpoint Security::VLANPWN","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"What best fits this description: is the tool listed for VLAN-hopping attacks?","choices":["Dynamic Desirable","VLANPWN","Dynamic Auto","FENRIR"],"answer":"VLANPWN","explanation":"VLANPWN is associated with DTP and double-tagging attacks.","id":"S01Q43"},{"concept_id":"IDS/IPS/Firewall Concepts::NGFW","variant":3,"category":"IDS/IPS/Firewall Concepts","question":"Identify the correct answer: adds deep inspection, application awareness, IPS, and threat intelligence to classic filtering.","choices":["IPS","Packet Filtering","IDS","NGFW"],"answer":"NGFW","explanation":"An NGFW extends traditional firewall functions.","id":"S01Q44"},{"concept_id":"Bypassing IDS/Firewalls::Post-Connection SYN","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: injects a SYN into an established flow so the sensor resynchronizes incorrectly?","choices":["Pre-Connection SYN","Post-Connection SYN","IP Address Spoofing","Source Routing"],"answer":"Post-Connection SYN","explanation":"Post-connection SYN desynchronizes IDS state after connection setup.","id":"S01Q45"},{"concept_id":"Bypassing IDS/Firewalls::Windows BITS","variant":5,"category":"Bypassing IDS/Firewalls","question":"What is being described here: transfers malicious files as trusted background jobs?","choices":["Windows BITS","Firewalking","Banner Grabbing","IP Address Spoofing"],"answer":"Windows BITS","explanation":"BITS can be abused for low-profile background transfer.","id":"S01Q46"},{"concept_id":"IDS/IPS/Firewall Concepts::Event","variant":4,"category":"IDS/IPS/Firewall Concepts","question":"Which term should you associate with this: is a detectable occurrence such as a login or connection?","choices":["IPS","Incident","IDS","Event"],"answer":"Event","explanation":"An event is something detectable that happened.","id":"S01Q47"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Traffic Normalizer","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"What best fits this description: removes ambiguous traffic interpretations before packets reach the IDS?","choices":["Attack Logging","Patch Management","Default Deny","Traffic Normalizer"],"answer":"Traffic Normalizer","explanation":"Traffic normalization reduces evasion through ambiguity.","id":"S01Q48"},{"concept_id":"Bypassing NAC & Endpoint Security::VLAN Hopping","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"What best fits this description: gains access to additional VLANs through trunking behavior?","choices":["Pre-authenticated Device","Raspberry Pi","VLAN Hopping","Dynamic Auto"],"answer":"VLAN Hopping","explanation":"VLAN hopping abuses switching and trunking.","id":"S01Q49"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Security Audits","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"What best fits this description: periodically verify firewall posture and policy effectiveness?","choices":["Security Audits","Deep Packet Inspection","Zero Trust","Remote Syslog"],"answer":"Security Audits","explanation":"Regular audits identify drift and misconfiguration.","id":"S01Q50"}],[{"concept_id":"IDS/Firewall Evasion Countermeasures::Remote Syslog","variant":3,"category":"IDS/Firewall Evasion Countermeasures","question":"Identify the correct answer: stores firewall logs away from the firewall itself.","choices":["Default Deny","Security Audits","Remote Syslog","Zero Trust"],"answer":"Remote Syslog","explanation":"Remote logging protects evidence from local compromise.","id":"S02Q01"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Traffic Normalizer","variant":3,"category":"IDS/Firewall Evasion Countermeasures","question":"Identify the correct answer: removes ambiguous traffic interpretations before packets reach the IDS.","choices":["Attack Logging","Traffic Normalizer","Fragment Reassembly","Remote Syslog"],"answer":"Traffic Normalizer","explanation":"Traffic normalization reduces evasion through ambiguity.","id":"S02Q02"},{"concept_id":"IDS/IPS/Firewall Solutions::Splunk","variant":5,"category":"IDS/IPS/Firewall Solutions","question":"What is being described here: indexes and searches logs for event analysis and SIEM use?","choices":["YARA","Wireshark","Splunk","Elastic Stack"],"answer":"Splunk","explanation":"Splunk is widely used for log analytics and SIEM.","id":"S02Q03"},{"concept_id":"Bypassing NAC & Endpoint Security::AMSI Bypass","variant":3,"category":"Bypassing NAC & Endpoint Security","question":"Identify the correct answer: forces malware scanning to return a clean result.","choices":["Process Injection","AMSI Bypass","VLAN Hopping","Ghostwriting"],"answer":"AMSI Bypass","explanation":"AMSI bypass aims to neutralize antimalware scanning.","id":"S02Q04"},{"concept_id":"Bypassing IDS/Firewalls::Loose Source Routing","variant":3,"category":"Bypassing IDS/Firewalls","question":"Identify the correct answer: requires packets to pass t ponse Time","variant":3,"category":"Honeypot Concepts","question":"Identify the correct answer: looks for consistently higher or more variable latency.","choices":["Fingerprinting Running Service","Honeypot","Honeynet","Analyzing Response Time"],"answer":"Analyzing Response Time","explanation":"Abnormal timing can indicate a honeypot.","id":"S05Q04"},{"concept_id":"Bypassing IDS/Firewalls::HTML Smuggling","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: reconstructs malicious content inside the browser using HTML5 or JavaScript?","choices":["JavaScript","HTML Smuggling","Browser Reconstruction","Blob"],"answer":"HTML Smuggling","explanation":"HTML smuggling can evade proxies and gateways.","id":"S05Q05"},{"concept_id":"Honeypot Concepts::Production Honeypot","variant":4,"category":"Honeypot Concepts","question":"Which term should you associate with this: is deployed mainly for operational protection and early warning?","choices":["Honeynet","Production Honeypot","Honeypot","Low-interaction Honeypot"],"answer":"Production Honeypot","explanation":"Production honeypots support operational defense.","id":"S05Q06"},{"concept_id":"Honeypot Concepts::Honeypot","variant":5,"category":"Honeypot Concepts","question":"What is being described here: is deliberately exposed with no legitimate production activity to attract attackers?","choices":["Pure Honeypot","Honeynet","Low-interaction Honeypot","Honeypot"],"answer":"Honeypot","explanation":"Any honeypot interaction is inherently suspicious.","id":"S05Q07"},{"concept_id":"Bypassing IDS/Firewalls::Source Routing","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: lets the sender influence the packet path to avoid monitored segments?","choices":["IP Instead of URL","Firewalking","Tiny Fragments","Source Routing"],"answer":"Source Routing","explanation":"Source routing can steer traffic through less-secured paths.","id":"S05Q08"},{"concept_id" What is being described here: uses rule-based Boolean expressions and strings to detect or classify malware?","choices":["Snort","YARA","Elastic Stack","Wireshark"],"answer":"YARA","explanation":"YARA is a rule-based malware identification tool.","id":"S05Q24"},{"concept_id":"Bypassing IDS/Firewalls::IP Instead of URL","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: tries to bypass domain-name filtering by using a numeric address directly?","choices":["IP Instead of URL","IP Address Spoofing","Firewalking","Source Routing"],"answer":"IP Instead of URL","explanation":"Numeric addresses may bypass domain-only blocking.","id":"S05Q25"},{"concept_id":"IDS/IPS/Firewall Concepts::Signature Recognition","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which concept matches this clue: matches observed traffic against known attack patterns?","choices":["IDS","Anomaly Detection","Signature Recognition","Protocol Anomaly Detection"],"answer":"Signature Recognition","explanation":"Signature recognition detects known attacks.","id":"S05Q26"},{"concept_id":"Bypassing IDS/Firewalls::Browser Reconstruction","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: assembles malicious content after it has crossed perimeter controls?","choices":["Firewalking","HTML Smuggling","Blob","Browser Reconstruction"],"answer":"Browser Reconstruction","explanation":"HTML smuggling reconstructs payloads client-side.","id":"S05Q27"},{"concept_id":"Bypassing NAC & Endpoint Security::Pre-authenticated Device","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which concept matches this clue: piggybacks through a device that has already passed network authentication?","choices":["Pre-authenticated Device","VLAN Hopping","Raspberry Pi","Dynamic Auto"],"answer":"Pre-authenticated Device","explanation":"An authenticated device can be abused as a bridge.","id":"S05Q28"},{"concept_id":"Bypassing NAC & Endpoint Security::FENRIR","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which concept matches this clue: is a tool listed for NAC bypass?","choices":["VLAN Hopping","VLANPWN","DTP","FENRIR"],"answer":"FENRIR","explanation":"FENRIR is listed for NAC bypass.","id":"S05Q29"},{"concept_id":"Bypassing IDS/Firewalls::Pre-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: uses an invalid-checksum SYN before the real connection to confuse the sensor?","choices":["Pre-Connection SYN","IP Address Spoofing","Source Routing","Firewalking"],"answer":"Pre-Connection SYN","explanation":"Pre-connection SYN desynchronizes IDS state before the real flow.","id":"S05Q30"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Deep Packet Inspection","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Which concept matches this clue: inspects application-layer content rather than only addresses and ports?","choices":["Connection Limits","Remote Syslog","Security Audits","Deep Packet Inspection"],"answer":"Deep Packet Inspection","explanation":"DPI improves visibility into evasive application traffic.","id":"S05Q31"},{"concept_id":"IDS/IPS/Firewall Concepts::IDS","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What is being described here: monitors traffic and raises alerts without being primarily inline?","choices":["HIDS","IDS","NIDS","UTM"],"answer":"IDS","explanation":"An IDS is primarily passive detection.","id":"S05Q32"},{"concept_id":"Bypassing IDS/Firewalls::Strict Source Routing","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: requires packets to follow the exact sender-defined path?","choices":["Banner Grabbing","Source Routing","Strict Source Routing","Loose Source Routing"],"answer":"Strict Source Routing","explanation":"Strict source routing specifies the exact route.","id":"S05Q33"},{"concept_id":" anation":"A DGA seed synchronizes domain generation.","id":"S10Q11"},{"concept_id":"Honeypot Concepts::Honeynet","variant":5,"category":"Honeypot Concepts","question":"What is being described here: is a network composed of multiple honeypots?","choices":["Honeypot","Honeynet","Low-interaction Honeypot","Medium-interaction Honeypot"],"answer":"Honeynet","explanation":"A honeynet is a network of honeypots.","id":"S10Q12"},{"concept_id":"Bypassing IDS/Firewalls::Post-Connection SYN","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: injects a SYN into an established flow so the sensor resynchronizes incorrectly?","choices":["Post-Connection SYN","Source Routing","Banner Grabbing","IP Address Spoofing"],"answer":"Post-Connection SYN","explanation":"Post-connection SYN desynchronizes IDS state after connection setup.","id":"S10Q13"},{"concept_id":"Bypassing IDS/Firewalls::Blob","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: holds reconstructed malicious content inside the browser?","choices":["Banner Grabbing","Blob","JavaScript","Firewalking"],"answer":"Blob","explanation":"HTML smuggling commonly uses JavaScript blobs.","id":"S10Q14"},{"concept_id":"IDS/IPS/Firewall Concepts::NetFlow","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which concept matches this clue: stores connection summaries such as peers, ports, duration, and volume?","choices":["Incident","NIDS","Event","NetFlow"],"answer":"NetFlow","explanation":"NetFlow is lighter than full packet capture.","id":"S10Q15"},{"concept_id":"Honeypot Concepts::Pure Honeypot","variant":4,"category":"Honeypot Concepts","question":"Which term should you associate with this: emulates a real production environment as closely as possible?","choices":["Honeypot","High-interaction Honeypot","Medium-interaction Honeypot","Pure Honeypot"],"answer":"Pure Honeypot","explanation":"Pure honeypots mimic a real production environment.","id":"S10Q16"},{"concept_id":"Bypassing NAC & Endpoint Security::VLAN Hopping","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which concept matches this clue: gains access to additional VLANs through trunking behavior?","choices":["VLAN Hopping","Dynamic Auto","Dynamic Desirable","Raspberry Pi"],"answer":"VLAN Hopping","explanation":"VLAN hopping abuses switching and trunking.","id":"S10Q17"},{"concept_id":"Honeypot Concepts::Low-interaction Honeypot","variant":3,"category":"Honeypot Concepts","question":"Identify the correct answer: simulates only a limited set of services and cannot be fully compromised.","choices":["Honeypot","Pure Honeypot","Low-interaction Honeypot","High-interaction Honeypot"],"answer":"Low-interaction Honeypot","explanation":"Low-interaction honeypots emulate limited functionality.","id":"S10Q18"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Connection Limits","variant":4,"category":"IDS/Firewall Evasion Countermeasures","question":"Which term should you associate with this: restricts simultaneous connections allowed per source?","choices":["Default Deny","Remote Syslog","Connection Limits","Configuration Backups"],"answer":"Connection Limits","explanation":"Per-IP limits reduce abuse.","id":"S10Q19"},{"concept_id":"Bypassing NAC & Endpoint Security::Dynamic Auto","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which concept matches this clue: can form a trunk when the peer actively requests it?","choices":["VLANPWN","Dynamic Auto","Dynamic Desirable","DTP"],"answer":"Dynamic Auto","explanation":"Dynamic auto can negotiate a trunk with an active peer.","id":"S10Q20"},{"concept_id":"Bypassing IDS/Firewalls::IDS timeout higher than victim","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: causes the sensor to retain fake fragments longer than the target host?","choices":["Firewalking","Source Routing","IDS timeout higher than victim","NIDS timeout lower than victim"],"answer":"IDS timeout higher than victim","explanation":"Different reassembly timeouts can create different packet views.","id":"S10Q21"},{"concept_id":"Bypassing IDS/Firewalls::Windows BITS","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which term should you associate with this: transfers malicious files as trusted background jobs?","choices":["Source Routing","Firewalking","Windows BITS","IP Address Spoofing"],"answer":"Windows BITS","explanation":"BITS can be abused for low-profile background transfer.","id":"S10Q22"},{"concept_id":"Bypassing IDS/Firewalls::Nping","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which term should you associate with this: is an Nmap-family packet generator associated with ACK tunneling?","choices":["Nping","Hping","ICMPTX","Banner Grabbing"],"answer":"Nping","explanation":"Nping can craft packets for ACK tunneling.","id":"S10Q23"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Security Audits","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Which concept matches this clue: periodically verify firewall posture and policy effectiveness?","choices":["Security Audits","Connection Limits","TLS Inspection","Zero Trust"],"answer":"Security Audits","explanation":"Regular audits identify drift and misconfiguration.","id":"S10Q24"},{"concept_id":"Bypassing IDS/Firewalls::ICMPTX","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: is the tool associated with tunneling data inside ICMP Echo payloads?","choices":["ICMPTX","Hping","Nping","Banner Grabbing"],"answer":"ICMPTX","explanation":"ICMPTX is listed for ICMP tunneling.","id":"S10Q25"},{"concept_id":"Bypassing NAC & Endpoint Security::AMSI Bypass","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which concept matches this clue: forces malware scanning to return a clean result?","choices":["Application Whitelisting Bypass","DTP","Ghostwriting","AMSI Bypass"],"answer":"AMSI Bypass","explanation":"AMSI bypass aims to neutralize antimalware scanning.","id":"S10Q26"},{"concept_id":"Bypassing IDS/Firewalls::Proxy Server","variant":2,"category":"Bypassing IDS/Firewalls","question":"What best fits this description: relays requests through an intermediary to obscure the original client?","choices":["IP Address Spoofing","Tiny Fragments","IP Instead of URL","Proxy Server"],"answer":"Proxy Server","explanation":"A proxy changes the apparent request path.","id":"S10Q27"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Centralized Logging","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Which concept matches this clue: stores events in a searchable platform for visibility and evidence?","choices":["Isolation","Patch Management","Centralized Logging","Traffic Normalizer"],"answer":"Centralized Logging","explanation":"Centralized logging supports monitoring and forensics.","id":"S10Q28"},{"concept_id":"Bypassing IDS/Firewalls::Loose Source Routing","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: requires packets to pass through one or more specified waypoints?","choices":["IP Address Spoofing","Loose Source Routing","Source Routing","Firewalking"],"answer":"Loose Source Routing","explanation":"Loose source routing specifies selected intermediate points.","id":"S10Q29"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Traffic Normalizer","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Which concept matches this clue: removes ambiguous traffic interpretations before packets reach the IDS?","choices":["Patch Management","Traffic Normalizer","Remote Syslog","Default Deny"],"answer":"Traffic Normalizer","explanation":"Traffic normalization reduces evasion through ambiguity.","id":"S10Q30"},{"concept_id":"Bypassing IDS/Firewalls::SSH Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: uses encrypted port forwarding to carry otherwise blocked traffic?","choices":["DNS Tunneling","ACK Tunneling","SSH Tunneling","Firewalking"],"answer":"SSH Tunneling","explanation":"SSH tunneling uses encrypted forwarding.","id":"S10Q31"},{"concept_id":"IDS/IPS/Firewall Concepts::Event","variant":3,"category":"IDS/IPS/Firewall Concepts","question":"Identify the correct answer: is a detectable occurrence such as a login or connection.","choices":["Event","NIDS","IPS","NetFlow"],"answer":"Event","explanation":"An event is something detectable that happened.","id":"S10Q32"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Patch Management","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Which concept matches this clue: keeps hosts and network devices current against known weaknesses?","choices":["Remote Syslog","Patch Management","Default Deny","Attack Logging"],"answer":"Patch Management","explanation":"Regular patching reduces exploitable gaps.","id":"S10Q33"},{"concept_id":"IDS/Firewall Evasion Countermeasures::Playbooks","variant":1,"category":"IDS/Firewall Evasion Countermeasures","question":"Which concept matches this clue: ensure responders follow documented and repeatable procedures?","choices":["Playbooks","Fragment Reassembly","Isolation","Centralized Logging"],"answer":"Playbooks","explanation":"Playbooks standardize incident response.","id":"S10Q34"},{"concept_id":"IDS/Firewall Evasion Countermeasures::TLS Inspection","variant":2,"category":"IDS/Firewall Evasion Countermeasures","question":"What best fits this description: inspects encrypted HTTPS/TLS traffic for hidden threats?","choices":["Configuration Backups","Zero Trust","Deep Packet Inspection","TLS Inspection"],"answer":"TLS Inspection","explanation":"TLS inspection improves visibility into encrypted evasion.","id":"S10Q35"},{"concept_id":"Bypassing IDS/Firewalls::Firewalking","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: uses TTL-controlled probes to map gateway ACL filtering?","choices":["Firewalking","Proxy Server","Banner Grabbing","Port Scanning"],"answer":"Firewalking","explanation":"Firewalking uses TTL behavior to infer firewall rules.","id":"S10Q36"},{"concept_id":"Honeypot Concepts::Fingerprinting Running Service","variant":5,"category":"Honeypot Concepts","question":"What is being described here: looks for discrepancies between claimed services and actual behavior?","choices":["Analyzing MAC Address","Honeypot","Honeynet","Fingerprinting Running Service"],"answer":"Fingerprinting Running Service","explanation":"Service fingerprint mismatches can reveal deception.","id":"S10Q37"},{"concept_id":"IDS/IPS/Firewall Concepts::Anomaly Detection","variant":1,"category":"IDS/IPS/Firewall Concepts","question":"Which concept matches this clue: flags deviations from an established model of normal behavior?","choices":["Signature Recognition","IPS","IDS","Anomaly Detection"],"answer":"Anomaly Detection","explanation":"Anomaly detection depends on a baseline.","id":"S10Q38"},{"concept_id":"IDS/IPS/Firewall Concepts::Defense in Breadth","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What is being described here: covers people, process, technology, applications, and the full attack surface?","choices":["Defense in Depth","Defense in Breadth","Choke Point","Defensible Architecture"],"answer":"Defense in Breadth","explanation":"Defense in breadth considers wider attack paths.","id":"S10Q39"},{"concept_id":"Bypassing IDS/Firewalls::ACK Tunneling","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: hides data in ACK packets that may receive less scrutiny than SYN packets?","choices":["HTTP Tunneling","ICMP Tunneling","ACK Tunneling","DNS Tunneling"],"answer":"ACK Tunneling","explanation":"ACK tunneling abuses trusted ACK traffic.","id":"S10Q40"},{"concept_id":"Bypassing IDS/Firewalls::IP Address Spoofing","variant":1,"category":"Bypassing IDS/Firewalls","question":"Which concept matches this clue: replaces a packet source address with a trusted host address?","choices":["Firewalking","IP Address Spoofing","Tiny Fragments","IP Instead of URL"],"answer":"IP Address Spoofing","explanation":"IP spoofing makes traffic appear to come from a trusted source.","id":"S10Q41"},{"concept_id":"Bypassing IDS/Firewalls::Tiny Fragments","variant":4,"category":"Bypassing IDS/Firewalls","question":"Which term should you associate with this: splits packets so important TCP header fields appear in later fragments?","choices":["Tiny Fragments","Banner Grabbing","Source Routing","IP Address Spoofing"],"answer":"Tiny Fragments","explanation":"Tiny fragments exploit incomplete fragment inspection.","id":"S10Q42"},{"concept_id":"Bypassing NAC & Endpoint Security::Process Injection","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which concept matches this clue: places malicious code inside the address space of a running process?","choices":["Process Injection","DTP","VLAN Hopping","Ghostwriting"],"answer":"Process Injection","explanation":"Process injection hides code inside another process.","id":"S10Q43"},{"concept_id":"IDS/IPS/Firewall Solutions::Snort","variant":5,"category":"IDS/IPS/Firewall Solutions","question":"What is being described here: inspects network traffic for intrusion patterns?","choices":["Elastic Stack","Snort","YARA","Wireshark"],"answer":"Snort","explanation":"Snort is a network IDS/IPS technology.","id":"S10Q44"},{"concept_id":"Bypassing NAC & Endpoint Security::Raspberry Pi","variant":4,"category":"Bypassing NAC & Endpoint Security","question":"Which term should you associate with this: is an example intermediary placed between an authenticated host and authentication server?","choices":["Dynamic Desirable","VLAN Hopping","Raspberry Pi","DTP"],"answer":"Raspberry Pi","explanation":"A small intermediary can relay authenticated access.","id":"S10Q45"},{"concept_id":"Bypassing NAC & Endpoint Security::WriteProcessMemory()","variant":1,"category":"Bypassing NAC & Endpoint Security","question":"Which concept matches this clue: copies a payload into allocated remote-process memory?","choices":["CreateRemoteThread()","Dynamic Auto","WriteProcessMemory()","DTP"],"answer":"WriteProcessMemory()","explanation":"WriteProcessMemory writes into another process.","id":"S10Q46"},{"concept_id":"IDS/IPS/Firewall Concepts::NGFW","variant":2,"category":"IDS/IPS/Firewall Concepts","question":"What best fits this description: adds deep inspection, application awareness, IPS, and threat intelligence to classic filtering?","choices":["IPS","NGFW","Packet Filtering","NIDS"],"answer":"NGFW","explanation":"An NGFW extends traditional firewall functions.","id":"S10Q47"},{"concept_id":"Bypassing NAC & Endpoint Security::Ghostwriting","variant":2,"category":"Bypassing NAC & Endpoint Security","question":"What best fits this description: changes malware code structure while preserving functionality to defeat signatures?","choices":["DTP","Process Injection","Application Whitelisting Bypass","Ghostwriting"],"answer":"Ghostwriting","explanation":"Ghostwriting mutates code structure without changing behavior.","id":"S10Q48"},{"concept_id":"IDS/IPS/Firewall Concepts::IPS","variant":5,"category":"IDS/IPS/Firewall Concepts","question":"What is being described here: sits inline and can actively block malicious traffic?","choices":["SIEM","IDS","IPS","NIDS"],"answer":"IPS","explanation":"An IPS actively prevents as well as detects.","id":"S10Q49"},{"concept_id":"IDS/IPS/Firewall Solutions::Splunk","variant":3,"category":"IDS/IPS/Firewall Solutions","question":"Identify the correct answer: indexes and searches logs for event analysis and SIEM use.","choices":["Elastic Stack","YARA","Wireshark","Splunk"],"answer":"Splunk","explanation":"Splunk is widely used for log analytics and SIEM.","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-evading-ids-firewalls-honeypots-direct-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Evading IDS, Firewalls, and Honeypots — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Evading IDS, Firewalls, and Honeypots (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Evading IDS, Firewalls, and Honeypots (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
