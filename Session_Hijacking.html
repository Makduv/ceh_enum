<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Session Hijacking — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"category":"Session Hijacking Tools","concept_ids":["bettercap","Colasoft Packet Builder"],"question":"Which mapping between bettercap and Colasoft Packet Builder is correct?","choices":["bettercap: Listed by the course as a session-hijacking tool | Colasoft Packet Builder: Named for packet crafting in the RST-hijacking section","bettercap: Named for packet crafting in the RST-hijacking section | Colasoft Packet Builder: Listed by the course as a session-hijacking tool","bettercap: Listed by the course as a session-hijacking tool | Colasoft Packet Builder: Named for monitoring ARP-cache-poisoning activity","bettercap: Named for monitoring ARP-cache-poisoning activity | Colasoft Packet Builder: Listed by the course as a session-hijacking tool"],"answer":"bettercap: Listed by the course as a session-hijacking tool | Colasoft Packet Builder: Named for packet crafting in the RST-hijacking section","explanation":"bettercap = Listed by the course as a session-hijacking tool. Colasoft Packet Builder = Named for packet crafting in the RST-hijacking section.","kind":"comparison","id":"S01Q01"},{"category":"Session Hijacking Countermeasures","concept_ids":["Session timeout"],"question":"Which mechanism invalidates sessions after expiry or inactivity?","choices":["Session timeout","Infinite session lifetime","Static cookie forever","No logout"],"answer":"Session timeout","explanation":"Session timeout: Destroys expired or idle sessions automatically","kind":"direct","id":"S01Q02"},{"category":"Network-Level Session Hijacking","concept_ids":["RST Hijacking"],"question":"Which technique terminates a connection with a forged reset packet?","choices":["RST Hijacking","TCP/IP Hijacking","UDP Hijacking","Blind Hijacking"],"answer":"RST Hijacking","explanation":"RST Hijacking: Injecting an authentic-looking reset with a spoofed source and predicted acknowledgment number","kind":"direct","id":"S01Q03"},{"category":"Session Hijacking Countermeasures","concept_ids":["ARPwatch monitoring","Hijacking is hard to detect"],"question":"How are ARPwatch monitoring and Hijacking is hard to detect correctly differentiated?","choices":["ARPwatch monitoring: Detects suspicious ARP-cache changes associated with local interception | Hijacking is hard to detect: Users may overlook the attack until serious damage occurs","ARPwatch monitoring: Users may overlook the attack until serious damage occurs | Hijacking is hard to detect: Detects suspicious ARP-cache changes associated with local interception","ARPwatch monitoring: A possible symptom accompanied by reduced system performance | Hijacking is hard to detect: A symptom caused by requests from both legitimate client and hijacker","ARPwatch monitoring: A symptom caused by requests from both legitimate client and hijacker | Hijacking is hard to detect: A possible symptom accompanied by reduced system performance"],"answer":"ARPwatch monitoring: Detects suspicious ARP-cache changes associated with local interception | Hijacking is hard to detect: Users may overlook the attack until serious damage occurs","explanation":"ARPwatch monitoring = Detects suspicious ARP-cache changes associated with local interception. Hijacking is hard to detect = Users may overlook the attack until serious damage occurs.","kind":"comparison","id":"S01Q04"},{"category":"Application-Level Session Hijacking","concept_ids":["AES-GCM nonce reuse"],"question":"Which implementation flaw enables the Forbidden attack?","choices":["AES-GCM nonce reuse","WEP IV reuse","TCP ISN prediction","DNS cache poisoning"],"answer":"AES-GCM nonce reuse","explanation":"AES-GCM nonce reuse: The cryptographic implementation flaw behind the Forbidden attack","kind":"direct","id":"S01Q05"},{"category":"Session Hijacking Tools","concept_ids":["Burp Suite"],"question":"Which role is associated with Burp Suite?","choices":["Listed by the course as a session-hijacking tool","Listed by the course as a session-hijacking detection tool","Named for monitoring ARP-cache-poisoning activity","Named for TCP/IP analysis in the RST-hijacking section"],"answer":"Listed by the course as a session-hijacking tool","explanation":"Burp Suite: Listed by the course as a session-hijacking tool","kind":"reverse","id":"S01Q06"},{"category":"Session Hijacking Countermeasures","concept_ids":["IETF"],"question":"Which standards organization developed IPsec?","choices":["IETF","IEEE","ICANN","W3C"],"answer":"IETF","explanation":"IETF: The organization credited with developing IPsec","kind":"direct","id":"S01Q07"},{"category":"Session Hijacking Concepts","concept_ids":["Tracking the Connection","Injecting the Attacker's Packet"],"question":"How are Tracking the Connection and Injecting the Attacker's Packet correctly differentiated?","choices":["Tracking the Connection: Sniffing the session and learning sequence and acknowledgment numbers | Injecting the Attacker's Packet: Sending attacker-controlled data or commands after the session is disrupted","Tracking the Connection: Sending attacker-controlled data or commands after the session is disrupted | Injecting the Attacker's Packet: Sniffing the session and learning sequence and acknowledgment numbers","Tracking the Connection: The correct three-phase order for session hijacking | Injecting the Attacker's Packet: Creating a state where client and server sequence expectations no longer match","Tracking the Connection: Creating a state where client and server sequence expectations no longer match | Injecting the Attacker's Packet: The correct three-phase order for session hijacking"],"answer":"Tracking the Connection: Sniffing the session and learning sequence and acknowledgment numbers | Injecting the Attacker's Packet: Sending attacker-controlled data or commands after the session is disrupted","explanation":"Tracking the Connection = Sniffing the session and learning sequence and acknowledgment numbers. Injecting the Attacker's Packet = Sending attacker-controlled data or commands after the session is disrupted.","kind":"comparison","id":"S01Q08"},{"category":"Application-Level Session Hijacking","concept_ids":["Compressed response length","Cookie reconstruction one character at a time"],"question":"Which mapping between Compressed response length and Cookie reconstruction one character at a time is correct?","choices":["Compressed response length: The observable value used to infer secret cookie characters | Cookie reconstruction one character at a time: How the attacker gradually recovers the secret in CRIME","Compressed response length: How the attacker gradually recovers the secret in CRIME | Cookie reconstruction one character at a time: The observable value used to infer secret cookie characters","Compressed response length: The information leak used by CRIME rather than direct cookie sniffing | Cookie reconstruction one character at a time: Recovering secret cookies by exploiting compression-ratio information leakage","Compressed response length: Recovering secret cookies by exploiting compression-ratio information leakage | Cookie reconstruction one character at a time: The information leak used by CRIME rather than direct cookie sniffing"],"answer":"Compressed response length: The observable value used to infer secret cookie characters | Cookie reconstruction one character at a time: How the attacker gradually recovers the secret in CRIME","explanation":"Compressed response length = The observable value used to infer secret cookie characters. Cookie reconstruction one character at a time = How the attacker gradually recovers the secret in CRIME.","kind":"comparison","id":"S01Q09"},{"category":"Session Hijacking Concepts","concept_ids":["ARP cache poisoning"],"question":"Which local-network technique can route victim traffic through the attacker?","choices":["ARP cache poisoning","DNSSEC validation","Session fixation","SYN cookies"],"answer":"ARP cache poisoning","explanation":"ARP cache poisoning: A local-segment technique that can redirect traffic through the attacker","kind":"direct","id":"S01Q10"},{"category":"Session Hijacking Concepts","concept_ids":["Session hijacking"],"question":"Which attack takes control of a valid established session?","choices":["Session hijacking","Spoofing","Eavesdropping","Port scanning"],"answer":"Session hijacking","explanation":"Session hijacking: Seizing control of a valid established communication session","kind":"direct","id":"S01Q11"},{"category":"Session Hijacking Countermeasures","concept_ids":["IPsec","Encapsulation Security Payload (ESP)"],"question":"Which mapping between IPsec and Encapsulation Security Payload (ESP) is correct?","choices":["IPsec: An IETF protocol suite that authenticates and encrypts IP communications | Encapsulation Security Payload (ESP): Provides both authentication and encryption/confidentiality","IPsec: Provides both authentication and encryption/confidentiality | Encapsulation Security Payload (ESP): An IETF protocol suite that authenticates and encrypts IP communications","IPsec: Provides data-origin/sender authentication without confidentiality | Encapsulation Security Payload (ESP): The organization credited with developing IPsec","IPsec: The organization credited with developing IPsec | Encapsulation Security Payload (ESP): Provides data-origin/sender authentication without confidentiality"],"answer":"IPsec: An IETF protocol suite that authenticates and encrypts IP communications | Encapsulation Security Payload (ESP): Provides both authentication and encryption/confidentiality","explanation":"IPsec = An IETF protocol suite that authenticates and encrypts IP communications. Encapsulation Security Payload (ESP) = Provides both authentication and encryption/confidentiality.","kind":"comparison","id":"S01Q12"},{"category":"Application-Level Session Hijacking","concept_ids":["Trojan proxy modification"],"question":"What best characterizes Trojan proxy modification?","choices":["Changing browser proxy settings so sessions are routed through the attacker","A different application-level session behavior (Session timeout)","A different application-level session behavior (Cookie rotation)","A different application-level session behavior (DNSSEC validation)"],"answer":"Changing browser proxy settings so sessions are routed through the attacker","explanation":"Trojan proxy modification: Changing browser proxy settings so sessions are routed through the attacker","kind":"reverse","id":"S01Q13"},{"category":"Session Hijacking Concepts","concept_ids":["Network-level hijacking"],"question":"Which level focuses on packet interception during TCP/UDP transmission?","choices":["Network-level hijacking","Application-level hijacking","Credential stuffing","Directory traversal"],"answer":"Network-level hijacking","explanation":"Network-level hijacking: Intercepting packets in TCP or UDP communication during transmission","kind":"direct","id":"S01Q14"},{"category":"Application-Level Session Hijacking","concept_ids":["NTLM relay to AD CS"],"question":"What does NTLM relay to AD CS primarily involve?","choices":["The relay step used after the coerced authentication","A different application-level session behavior (Kerberos TGT renewal)","A different application-level session behavior (DNS zone transfer)","A different application-level session behavior (TLS certificate pinning)"],"answer":"The relay step used after the coerced authentication","explanation":"NTLM relay to AD CS: The relay step used after the coerced authentication","kind":"reverse","id":"S01Q15"},{"category":"Application-Level Session Hijacking","concept_ids":["CRIME attack"],"question":"Which attack infers secret cookies from compressed HTTPS length changes?","choices":["CRIME attack","Forbidden attack","PetitPotam hijacking","Session fixation attack"],"answer":"CRIME attack","explanation":"CRIME attack: Recovering secret cookies by exploiting compression-ratio information leakage","kind":"direct","id":"S01Q16"},{"category":"Network-Level Session Hijacking","concept_ids":["MITM Packet Sniffer"],"question":"Which technique uses packet sniffing while positioned between endpoints?","choices":["MITM Packet Sniffer","Blind Hijacking","UDP Hijacking","Source-Routed IP Spoofing"],"answer":"MITM Packet Sniffer","explanation":"MITM Packet Sniffer: Intercepting client/server traffic while acting as an intermediary","kind":"direct","id":"S01Q17"},{"category":"Session Hijacking Countermeasures","concept_ids":["Logout functionality"],"question":"Which feature lets users deliberately end an authenticated session?","choices":["Logout functionality","Permanent session reuse","No expiration","Shared credentials"],"answer":"Logout functionality","explanation":"Logout functionality: Lets the user explicitly terminate and invalidate the session","kind":"direct","id":"S01Q18"},{"category":"Network-Level Session Hijacking","concept_ids":["UDP Hijacking"],"question":"Which technique races the legitimate server with a forged UDP response?","choices":["UDP Hijacking","Blind Hijacking","RST Hijacking","Source-Routed IP Spoofing"],"answer":"UDP Hijacking","explanation":"UDP Hijacking: Forging a UDP server reply to the client before the legitimate server responds","kind":"direct","id":"S01Q19"},{"category":"Session Hijacking Concepts","concept_ids":["Identity theft","DoS"],"question":"How are Identity theft and DoS correctly differentiated?","choices":["Identity theft: A possible consequence of taking over another user's valid session | DoS: A further attack that may be enabled after disrupting or taking over a session","Identity theft: A further attack that may be enabled after disrupting or taking over a session | DoS: A possible consequence of taking over another user's valid session","Identity theft: Pretending to be another user using fake or stolen credentials from the start | DoS: A connected session whose sequence and acknowledgment expectations do not match","Identity theft: A connected session whose sequence and acknowledgment expectations do not match | DoS: Pretending to be another user using fake or stolen credentials from the start"],"answer":"Identity theft: A possible consequence of taking over another user's valid session | DoS: A further attack that may be enabled after disrupting or taking over a session","explanation":"Identity theft = A possible consequence of taking over another user's valid session. DoS = A further attack that may be enabled after disrupting or taking over a session.","kind":"comparison","id":"S01Q20"},{"category":"Application-Level Session Hijacking","concept_ids":["Session sniffing","Session fixation attack"],"question":"How are Session sniffing and Session fixation attack correctly differentiated?","choices":["Session sniffing: Capturing a valid session token from network traffic | Session fixation attack: Forcing a victim to authenticate while keeping an attacker-chosen session ID","Session sniffing: Forcing a victim to authenticate while keeping an attacker-chosen session ID | Session fixation attack: Capturing a valid session token from network traffic","Session sniffing: Reusing captured authentication tokens to gain unauthorized access | Session fixation attack: A weak token that can be guessed or brute-forced because its values are predictable","Session sniffing: A weak token that can be guessed or brute-forced because its values are predictable | Session fixation attack: Reusing captured authentication tokens to gain unauthorized access"],"answer":"Session sniffing: Capturing a valid session token from network traffic | Session fixation attack: Forcing a victim to authenticate while keeping an attacker-chosen session ID","explanation":"Session sniffing = Capturing a valid session token from network traffic. Session fixation attack = Forcing a victim to authenticate while keeping an attacker-chosen session ID.","kind":"comparison","id":"S01Q21"},{"category":"Session Hijacking Concepts","concept_ids":["Weak session-ID generation"],"question":"Which statement is true of Weak session-ID generation?","choices":["Makes session tokens predictable because the algorithm or token space is weak","A different session-related behavior not matching this term (TLS pinning)","A different session-related behavior not matching this term (Perfect forward secrecy)","A different session-related behavior not matching this term (Strict logout)"],"answer":"Makes session tokens predictable because the algorithm or token space is weak","explanation":"Weak session-ID generation: Makes session tokens predictable because the algorithm or token space is weak","kind":"reverse","id":"S01Q22"},{"category":"Session Hijacking Countermeasures","concept_ids":["Replay protection","Data integrity"],"question":"How are Replay protection and Data integrity correctly differentiated?","choices":["Replay protection: An IPsec benefit that blocks reuse of captured packets | Data integrity: An IPsec benefit that detects packet modification","Replay protection: An IPsec benefit that detects packet modification | Data integrity: An IPsec benefit that blocks reuse of captured packets","Replay protection: Helps detect suspicious session-hijacking or poisoning behavior | Data integrity: The quick-reference use associated with IPsec transport mode","Replay protection: The quick-reference use associated with IPsec transport mode | Data integrity: Helps detect suspicious session-hijacking or poisoning behavior"],"answer":"Replay protection: An IPsec benefit that blocks reuse of captured packets | Data integrity: An IPsec benefit that detects packet modification","explanation":"Replay protection = An IPsec benefit that blocks reuse of captured packets. Data integrity = An IPsec benefit that detects packet modification.","kind":"comparison","id":"S01Q23"},{"category":"Application-Level Session Hijacking","concept_ids":["Cross-site request forgery (CSRF)","Malicious JavaScript"],"question":"Which statement correctly matches Cross-site request forgery (CSRF) and Malicious JavaScript?","choices":["Cross-site request forgery (CSRF): A listed web technique that abuses an authenticated browser to send unwanted requests | Malicious JavaScript: Embedded code that silently captures session tokens and sends them to an attacker","Cross-site request forgery (CSRF): Embedded code that silently captures session tokens and sends them to an attacker | Malicious JavaScript: A listed web technique that abuses an authenticated browser to send unwanted requests","Cross-site request forgery (CSRF): Injecting malicious client-side scripts into pages viewed by other users | Malicious JavaScript: Changing browser proxy settings so sessions are routed through the attacker","Cross-site request forgery (CSRF): Changing browser proxy settings so sessions are routed through the attacker | Malicious JavaScript: Injecting malicious client-side scripts into pages viewed by other users"],"answer":"Cross-site request forgery (CSRF): A listed web technique that abuses an authenticated browser to send unwanted requests | Malicious JavaScript: Embedded code that silently captures session tokens and sends them to an attacker","explanation":"Cross-site request forgery (CSRF) = A listed web technique that abuses an authenticated browser to send unwanted requests. Malicious JavaScript = Embedded code that silently captures session tokens and sends them to an attacker.","kind":"comparison","id":"S01Q24"},{"category":"Session Hijacking Countermeasures","concept_ids":["Minimize remote access"],"question":"Which access policy reduces the number of remotely exposed sessions?","choices":["Minimize remote access","Expose all services remotely","Disable VPNs","Use open Wi-Fi"],"answer":"Minimize remote access","explanation":"Minimize remote access: Reduces exposure of remotely reachable session paths","kind":"direct","id":"S01Q25"},{"category":"Session Hijacking Concepts","concept_ids":["MAC/IP spoofing capability","Non-encrypted session traffic"],"question":"Which option correctly distinguishes MAC/IP spoofing capability from Non-encrypted session traffic?","choices":["MAC/IP spoofing capability: Lets the attacker receive or send traffic as another host | Non-encrypted session traffic: A prerequisite that makes classic TCP session observation and prediction feasible","MAC/IP spoofing capability: A prerequisite that makes classic TCP session observation and prediction feasible | Non-encrypted session traffic: Lets the attacker receive or send traffic as another host","MAC/IP spoofing capability: A local-segment technique that can redirect traffic through the attacker | Non-encrypted session traffic: Ability to identify changing TCP sequence and acknowledgment values","MAC/IP spoofing capability: Ability to identify changing TCP sequence and acknowledgment values | Non-encrypted session traffic: A local-segment technique that can redirect traffic through the attacker"],"answer":"MAC/IP spoofing capability: Lets the attacker receive or send traffic as another host | Non-encrypted session traffic: A prerequisite that makes classic TCP session observation and prediction feasible","explanation":"MAC/IP spoofing capability = Lets the attacker receive or send traffic as another host. Non-encrypted session traffic = A prerequisite that makes classic TCP session observation and prediction feasible.","kind":"comparison","id":"S01Q26"},{"category":"Session Hijacking Countermeasures","concept_ids":["Employee security education"],"question":"Which human-focused control is listed against session hijacking?","choices":["Employee security education","Disable all logging","Increase session lifetime","Use shared accounts"],"answer":"Employee security education","explanation":"Employee security education: Reduces user-driven exposure and unsafe remote-access behavior","kind":"direct","id":"S01Q27"},{"category":"Network-Level Session Hijacking","concept_ids":["Source-Routed IP Spoofing"],"question":"Which technique combines trusted-host spoofing wi  condition for a successful UDP hijack | False information injection: The property that makes source spoofing easier for UDP than TCP"],"answer":"No UDP sequencing/synchronization: The reason UDP hijacking is easier than TCP session hijacking | False information injection: A possible result of forged UDP traffic appearing legitimate","explanation":"No UDP sequencing/synchronization = The reason UDP hijacking is easier than TCP session hijacking. False information injection = A possible result of forged UDP traffic appearing legitimate.","kind":"comparison","id":"S06Q20"},{"category":"Application-Level Session Hijacking","concept_ids":["Compressed response length"],"question":"Which measurement changes as CRIME guesses cookie characters?","choices":["Compressed response length","BSSID","TCP source port only","DNS TTL"],"answer":"Compressed response length","explanation":"Compressed response length: The observable value used to infer secret cookie characters","kind":"direct","id":"S06Q21"},{"category":"Application-Level Session Hijacking","concept_ids":["PetitPotam hijacking"],"question":"Which attack coerces a DC into NTLM authentication that is relayed to certificate services?","choices":["PetitPotam hijacking","Forbidden attack","CRIME attack","Session prediction attack"],"answer":"PetitPotam hijacking","explanation":"PetitPotam hijacking: Coercing a domain controller to authenticate outward and relaying NTLM to AD CS","kind":"direct","id":"S06Q22"},{"category":"Application-Level Session Hijacking","concept_ids":["Predictable session token","Session fixation attack"],"question":"How are Predictable session token and Session fixation attack correctly differentiated?","choices":["Predictable session token: A weak token that can be guessed or brute-forced because its values are predictable | Session fixation attack: Forcing a victim to authenticate while keeping an attacker-chosen session ID","Predictable session token: Forcing a victim to authenticate while keeping a id":"S10Q37"},{"category":"Network-Level Session Hijacking","concept_ids":["Transport and Internet protocols"],"question":"Which behavior matches Transport and Internet protocols?","choices":["The protocol layers targeted by network-level session hijacking","A different network-level hijacking behavior (Only presentation-layer formats)","A different network-level hijacking behavior (Only database schemas)","A different network-level hijacking behavior (Only browser DOM)"],"answer":"The protocol layers targeted by network-level session hijacking","explanation":"Transport and Internet protocols: The protocol layers targeted by network-level session hijacking","kind":"reverse","id":"S10Q38"},{"category":"Network-Level Session Hijacking","concept_ids":["Blind Hijacking","TCP/IP Hijacking"],"question":"Which mapping between Blind Hijacking and TCP/IP Hijacking is correct?","choices":["Blind Hijacking: Guessing TCP sequence numbers without seeing the session traffic | TCP/IP Hijacking: Spoofing IP and altering sequence/acknowledgment values to inject forged TCP packets","Blind Hijacking: Spoofing IP and altering sequence/acknowledgment values to inject forged TCP packets | TCP/IP Hijacking: Guessing TCP sequence numbers without seeing the session traffic","Blind Hijacking: Intercepting client/server traffic while acting as an intermediary | TCP/IP Hijacking: Forging a UDP server reply to the client before the legitimate server responds","Blind Hijacking: Forging a UDP server reply to the client before the legitimate server responds | TCP/IP Hijacking: Intercepting client/server traffic while acting as an intermediary"],"answer":"Blind Hijacking: Guessing TCP sequence numbers without seeing the session traffic | TCP/IP Hijacking: Spoofing IP and altering sequence/acknowledgment values to inject forged TCP packets","explanation":"Blind Hijacking = Guessing TCP sequence numbers without seeing the session traffic. TCP/IP Hijacking = Spoofing IP and altering sequence/acknowledgment values to inject forged TCP packets.","kind":"comparison","id":"S10Q39"},{"category":"Session Hijacking Tools","concept_ids":["Quantum IPS","SolarWinds Security Event Manager"],"question":"Which option correctly distinguishes Quantum IPS from SolarWinds Security Event Manager?","choices":["Quantum IPS: Listed by the course as a session-hijacking detection IPS | SolarWinds Security Event Manager: Listed by the course as a detection/monitoring product","Quantum IPS: Listed by the course as a detection/monitoring product | SolarWinds Security Event Manager: Listed by the course as a session-hijacking detection IPS","Quantum IPS: Listed by the course as a network intrusion prevention detection product | SolarWinds Security Event Manager: Listed by the course as a session-hijacking detection tool","Quantum IPS: Listed by the course as a session-hijacking detection tool | SolarWinds Security Event Manager: Listed by the course as a network intrusion prevention detection product"],"answer":"Quantum IPS: Listed by the course as a session-hijacking detection IPS | SolarWinds Security Event Manager: Listed by the course as a detection/monitoring product","explanation":"Quantum IPS = Listed by the course as a session-hijacking detection IPS. SolarWinds Security Event Manager = Listed by the course as a detection/monitoring product.","kind":"comparison","id":"S10Q40"},{"category":"Application-Level Session Hijacking","concept_ids":["Button event handler","Modified server transaction"],"question":"Which statement correctly matches Button event handler and Modified server transaction?","choices":["Button event handler: Browser-side handler registered by the malicious extension on a target page | Modified server transaction: Result sent to the server after browser-side manipulation","Button event handler: Result sent to the server after browser-side manipulation | Modified server transaction: Browser-side handler registered by the malicious extension on a target page","Butto ted communication channel","kind":"direct","id":"S10Q44"},{"category":"Application-Level Session Hijacking","concept_ids":["Session sniffing"],"question":"Which method steals a token by observing traffic?","choices":["Session sniffing","Session fixation","Session donation","CSRF"],"answer":"Session sniffing","explanation":"Session sniffing: Capturing a valid session token from network traffic","kind":"direct","id":"S10Q45"},{"category":"Network-Level Session Hijacking","concept_ids":["Changing sequence numbers"],"question":"Which values must be guessed because they change during the TCP session?","choices":["Changing sequence numbers","Static destination port","Source IP header only","Protocol number"],"answer":"Changing sequence numbers","explanation":"Changing sequence numbers: The hard-to-predict values that make blind TCP hijacking difficult","kind":"direct","id":"S10Q46"},{"category":"Session Hijacking Concepts","concept_ids":["Non-encrypted session traffic","Sequence/ACK recognition"],"question":"How are Non-encrypted session traffic and Sequence/ACK recognition correctly differentiated?","choices":["Non-encrypted session traffic: A prerequisite that makes classic TCP session observation and prediction feasible | Sequence/ACK recognition: Ability to identify changing TCP sequence and acknowledgment values","Non-encrypted session traffic: Ability to identify changing TCP sequence and acknowledgment values | Sequence/ACK recognition: A prerequisite that makes classic TCP session observation and prediction feasible","Non-encrypted session traffic: A local-segment technique that can redirect traffic through the attacker | Sequence/ACK recognition: The next TCP sequence value an attacker must predict in non-encrypted hijacking","Non-encrypted session traffic: The next TCP sequence value an attacker must predict in non-encrypted hijacking | Sequence/ACK recognition: A local-segment technique that can redirect traffic through the attacker"],"answer":"Non-encrypted session traffic: A prerequisite that makes classic TCP session observation and prediction feasible | Sequence/ACK recognition: Ability to identify changing TCP sequence and acknowledgment values","explanation":"Non-encrypted session traffic = A prerequisite that makes classic TCP session observation and prediction feasible. Sequence/ACK recognition = Ability to identify changing TCP sequence and acknowledgment values.","kind":"comparison","id":"S10Q47"},{"category":"Session Hijacking Countermeasures","concept_ids":["Keep SID out of URL"],"question":"Where should session IDs NOT be placed?","choices":["Keep SID out of URL","Put SID in query string","Embed SID in referrer","Expose SID in bookmarks"],"answer":"Keep SID out of URL","explanation":"Keep SID out of URL: Prevents session identifiers from leaking through query strings or URL handling","kind":"direct","id":"S10Q48"},{"category":"Session Hijacking Concepts","concept_ids":["Network-level hijacking"],"question":"What is the defining property of Network-level hijacking?","choices":["Intercepting packets in TCP or UDP communication during transmission","Taking control of an HTTP user session by obtaining session IDs","A different session-related behavior not matching this term (Credential stuffing)","A different session-related behavior not matching this term (Directory traversal)"],"answer":"Intercepting packets in TCP or UDP communication during transmission","explanation":"Network-level hijacking: Intercepting packets in TCP or UDP communication during transmission","kind":"reverse","id":"S10Q49"},{"category":"Session Hijacking Countermeasures","concept_ids":["IPsec"],"question":"What does IPsec primarily protect against?","choices":["An IETF protocol suite that authenticates and encrypts IP communications","A different defensive effect from the one described in the course (FTP)","A different defensive effect from the one described in the course (SNMP)","A different defensive effect from the one described in the course (HTTP)"],"answer":"An IETF protocol suite that authenticates and encrypts IP communications","explanation":"IPsec: An IETF protocol suite that authenticates and encrypts IP communications","kind":"reverse","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-session-hijacking-direct-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Session Hijacking — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">5 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Session Hijacking (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Session Hijacking (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
