<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Session Hijacking — Direct Questions v2</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"category":"Session Hijacking Tools","concept_ids":["Colasoft Packet Builder"],"question":"Which tool matches this clue: tool is named for crafting packets in the RST-hijacking section?","choices":["Burp Suite","ARPwatch","Colasoft Packet Builder","tcpdump"],"answer":"Colasoft Packet Builder","explanation":"Colasoft Packet Builder: Named for packet crafting in the RST-hijacking section","kind":"direct","id":"S01Q01"},{"category":"Session Hijacking Countermeasures","concept_ids":["Session timeout"],"question":"Which mechanism invalidates sessions after expiry or inactivity?","choices":["Session timeout","Infinite session lifetime","Static cookie forever","No logout"],"answer":"Session timeout","explanation":"Session timeout: Destroys expired or idle sessions automatically","kind":"direct","id":"S01Q02"},{"category":"Network-Level Session Hijacking","concept_ids":["RST Hijacking"],"question":"Which technique terminates a connection with a forged reset packet?","choices":["RST Hijacking","TCP/IP Hijacking","UDP Hijacking","Blind Hijacking"],"answer":"RST Hijacking","explanation":"RST Hijacking: Injecting an authentic-looking reset with a spoofed source and predicted acknowledgment number","kind":"direct","id":"S01Q03"},{"category":"Session Hijacking Countermeasures","concept_ids":["ARPwatch monitoring"],"question":"Which countermeasure matches this clue: Detects suspicious ARP-cache changes associated with local interception?","choices":["ARPwatch monitoring","Host-to-host use","IDS monitoring","Data integrity"],"answer":"ARPwatch monitoring","explanation":"ARPwatch monitoring: Detects suspicious ARP-cache changes associated with local interception","kind":"direct","id":"S01Q04"},{"category":"Application-Level Session Hijacking","concept_ids":["AES-GCM nonce reuse"],"question":"Which implementation flaw enables the Forbidden attack?","choices":["AES-GCM nonce reuse","WEP IV reuse","TCP ISN prediction","DNS cache poisoning"],"answer":"AES-GCM nonce reu rough the attacker?","choices":["ARP cache poisoning","DNSSEC validation","Session fixation","SYN cookies"],"answer":"ARP cache poisoning","explanation":"ARP cache poisoning: A local-segment technique that can redirect traffic through the attacker","kind":"direct","id":"S01Q10"},{"category":"Session Hijacking Concepts","concept_ids":["Session hijacking"],"question":"Which attack takes control of a valid established session?","choices":["Session hijacking","Spoofing","Eavesdropping","Port scanning"],"answer":"Session hijacking","explanation":"Session hijacking: Seizing control of a valid established communication session","kind":"direct","id":"S01Q11"},{"category":"Session Hijacking Countermeasures","concept_ids":["Encapsulation Security Payload (ESP)"],"question":"Which countermeasure matches this clue: Provides both authentication and encryption/confidentiality?","choices":["Encapsulation Security Payload (ESP)","Kerberos","Authentication Header (AH)","Data confidentiality"],"answer":"Encapsulation Security Payload (ESP)","explanation":"Encapsulation Security Payload (ESP): Provides both authentication and encryption/confidentiality","kind":"direct","id":"S01Q12"},{"category":"Application-Level Session Hijacking","concept_ids":["Trojan proxy modification"],"question":"Which application-level technique matches this clue: Changing browser proxy settings so sessions are routed through the attacker?","choices":["Trojan proxy modification","Two TCP connections","MITM session attack","Modified server transaction"],"answer":"Trojan proxy modification","explanation":"Trojan proxy modification: Changing browser proxy settings so sessions are routed through the attacker","kind":"direct","id":"S01Q13"},{"category":"Session Hijacking Concepts","concept_ids":["Network-level hijacking"],"question":"Which level focuses on packet interception during TCP/UDP transmission?","choices":["Network-level hijacking","Application-level hijacking","Credential stuffing","Directory traversal"],"answer":"Network-level hijacking","explanation":"Network-level hijacking: Intercepting packets in TCP or UDP communication during transmission","kind":"direct","id":"S01Q14"},{"category":"Application-Level Session Hijacking","concept_ids":["NTLM relay to AD CS"],"question":"Which application-level technique matches this clue: The relay step used after the coerced authentication?","choices":["Fixed SID in a malicious link","EfsRpcOpenFileRaw","NTLM relay to AD CS","AD certificate for admin privileges"],"answer":"NTLM relay to AD CS","explanation":"NTLM relay to AD CS: The relay step used after the coerced authentication","kind":"direct","id":"S01Q15"},{"category":"Application-Level Session Hijacking","concept_ids":["CRIME attack"],"question":"Which attack infers secret cookies from compressed HTTPS length changes?","choices":["CRIME attack","Forbidden attack","PetitPotam hijacking","Session fixation attack"],"answer":"CRIME attack","explanation":"CRIME attack: Recovering secret cookies by exploiting compression-ratio information leakage","kind":"direct","id":"S01Q16"},{"category":"Network-Level Session Hijacking","concept_ids":["MITM Packet Sniffer"],"question":"Which technique uses packet sniffing while positioned between endpoints?","choices":["MITM Packet Sniffer","Blind Hijacking","UDP Hijacking","Source-Routed IP Spoofing"],"answer":"MITM Packet Sniffer","explanation":"MITM Packet Sniffer: Intercepting client/server traffic while acting as an intermediary","kind":"direct","id":"S01Q17"},{"category":"Session Hijacking Countermeasures","concept_ids":["Logout functionality"],"question":"Which feature lets users deliberately end an authenticated session?","choices":["Logout functionality","Permanent session reuse","No expiration","Shared credentials"],"answer":"Logout functionality","explanation":"Logout functionality: Lets the user explicitly terminate and invalidate the session","kind":"direct","id":"S01Q18"},{"category":"Network-Level Session Hijacking","conce  accounts"],"answer":"Employee security education","explanation":"Employee security education: Reduces user-driven exposure and unsafe remote-access behavior","kind":"direct","id":"S01Q27"},{"category":"Network-Level Session Hijacking","concept_ids":["Source-Routed IP Spoofing"],"question":"Which technique combines trusted-host spoofing with source routing?","choices":["Source-Routed IP Spoofing","RST Hijacking","UDP Hijacking","Blind Hijacking"],"answer":"Source-Routed IP Spoofing","explanation":"Source-Routed IP Spoofing: Using a trusted host IP and attacker-specified packet path to inject traffic","kind":"direct","id":"S01Q28"},{"category":"Application-Level Session Hijacking","concept_ids":["AD certificate for admin privileges"],"question":"What does the attacker create to obtain administrator-level access?","choices":["AD certificate for admin privileges","New DHCP lease","WPA handshake","DNSSEC signature"],"answer":"AD certificate for admin privileges","explanation":"AD certificate for admin privileges: The credential artifact created after successful relay to certificate services","kind":"direct","id":"S01Q29"},{"category":"Session Hijacking Tools","concept_ids":["JHijack"],"question":"Which Java-named utility is listed as a session-hijacking tool?","choices":["JHijack","Wireshark","Quantum IPS","tcpdump"],"answer":"JHijack","explanation":"JHijack: Listed by the course as a session-hijacking tool","kind":"direct","id":"S01Q30"},{"category":"Session Hijacking Concepts","concept_ids":["Track → Desynchronize → Inject"],"question":"Which concept matches this clue: The correct three-phase order for session hijacking?","choices":["Track → Desynchronize → Inject","Next Sequence Number (NSN)","Application-level hijacking","Established-session takeover"],"answer":"Track → Desynchronize → Inject","explanation":"Track → Desynchronize → Inject: The correct three-phase order for session hijacking","kind":"direct","id":"S01Q31"},{"category":"Application-Level Session Hijacking","concept_ids":["Predictable session token"],"question":"Which application-level technique matches this clue: A weak token that can be guessed or brute-forced because its values are predictable?","choices":["Session donation attack","Small token search space","Session sniffing","Predictable session token"],"answer":"Predictable session token","explanation":"Predictable session token: A weak token that can be guessed or brute-forced because its values are predictable","kind":"direct","id":"S01Q32"},{"category":"Session Hijacking Countermeasures","concept_ids":["Data confidentiality"],"question":"Which IPsec benefit hides the contents of protected traffic?","choices":["Data confidentiality","ARP visibility","Open DNS","Session donation"],"answer":"Data confidentiality","explanation":"Data confidentiality: An IPsec benefit that hides packet contents through encryption","kind":"direct","id":"S01Q33"},{"category":"Network-Level Session Hijacking","concept_ids":["Connection reset"],"question":"Which network-level technique matches this clue: The immediate effect of a successful forged RST?","choices":["Spoofed server source","Connection reset","Attacker-chosen destination route","Forged reply wins the race"],"answer":"Connection reset","explanation":"Connection reset: The immediate effect of a successful forged RST","kind":"direct","id":"S01Q34"},{"category":"Session Hijacking Countermeasures","concept_ids":["Long random session keys"],"question":"Which countermeasure matches this clue: Makes session tokens difficult to predict or brute-force?","choices":["Server-generated session IDs only","Long random session keys","Encrypt data in transit","HTTPS for authentication cookies"],"answer":"Long random session keys","explanation":"Long random session keys: Makes session tokens difficult to predict or brute-force","kind":"direct","id":"S01Q35"},{"category":"Application-Level Session Hijacking","concept_ids":["SID preserved through login"],"question":"Which application-le "choices":["Transport and Internet protocols","Only presentation-layer formats","Only database schemas","Only browser DOM"],"answer":"Transport and Internet protocols","explanation":"Transport and Internet protocols: The protocol layers targeted by network-level session hijacking","kind":"direct","id":"S01Q40"},{"category":"Network-Level Session Hijacking","concept_ids":["Established TCP session"],"question":"Which network-level technique matches this clue: The state reached after SYN, SYN+ACK, and ACK complete?","choices":["No UDP sequencing/synchronization","Initial Sequence Number (ISN)","Established TCP session","Stable IP and port values"],"answer":"Established TCP session","explanation":"Established TCP session: The state reached after SYN, SYN+ACK, and ACK complete","kind":"direct","id":"S01Q41"},{"category":"Network-Level Session Hijacking","concept_ids":["Attacker-chosen destination route"],"question":"Which network-level technique matches this clue: How the forged source-routed packet is directed through the trusted host?","choices":["Connection reset","Sender-specified path","Attacker-chosen destination route","Source-Routed IP Spoofing"],"answer":"Attacker-chosen destination route","explanation":"Attacker-chosen destination route: How the forged source-routed packet is directed through the trusted host","kind":"direct","id":"S01Q42"},{"category":"Application-Level Session Hijacking","concept_ids":["Original-looking receipt"],"question":"Which application-level technique matches this clue: What the victim may see even though the submitted transaction was altered?","choices":["Session donation attack","SID preserved through login","Original-looking receipt","Attacker-owned valid SID"],"answer":"Original-looking receipt","explanation":"Original-looking receipt: What the victim may see even though the submitted transaction was altered","kind":"direct","id":"S01Q43"},{"category":"Application-Level Session Hijacking","concept_ids":["EfsRpcOpenFileRaw"],"questi const STORAGE_KEY = "ceh-v13-session-hijacking-direct-v2";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">5 blueprint areas mixed</span><span class="stat-pill">Direct questions only</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Session Hijacking (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Session Hijacking (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
