planation":"Protocol attacks are measured in packets per second.","id":"S08Q26"},{"concept_id":"DoS/DDoS Protection Tools::Scrubbing service","variant":2,"category":"DoS/DDoS Protection Tools","question":"What external protection model separates malicious traffic before delivery?","choices":["DDoS scrubbing service","LOIC flooder","Open DNS resolver","Botnet handler"],"answer":"DDoS scrubbing service","explanation":"Scrubbing services filter malicious traffic before forwarding legitimate traffic.","id":"S08Q27"},{"concept_id":"DoS/DDoS Attack Techniques::Smurf vs Fraggle","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What is the key protocol difference between Smurf and Fraggle?","choices":["Smurf uses ICMP; Fraggle uses UDP","Smurf uses TCP; Fraggle uses ICMP","Smurf uses UDP; Fraggle uses TCP","Both use only TCP"],"answer":"Smurf uses ICMP; Fraggle uses UDP","explanation":"Smurf uses ICMP broadcast traffic, while Fraggle uses UDP.","id":"S08Q28"},{"concept_id":"DoS/DDoS Attack Countermeasures::Capacity mgmt","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"What unifies load balancing, throttling, and request dropping?","choices":["Capacity management","Credential management","Key management","Source-code management"],"answer":"Capacity management","explanation":"These techniques reduce attack impact while preserving capacity for legitimate users.","id":"S08Q29"},{"concept_id":"DoS/DDoS Attack Countermeasures::Traffic analysis","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What defensive method examines protocols and traffic patterns for infected nodes?","choices":["Network Traffic Analysis","Black Hole Filtering","Load Balancing","Honeypotting"],"answer":"Network Traffic Analysis","explanation":"Traffic analysis can reveal C&C relationships and compromised nodes.","id":"S08Q30"},{"concept_id":"Botnets::Local hidden","variant":2,"category":"Botnets","question":"What technique finds internal hosts not directly visible from the Internet?","choices":["Local Subnet Scanning","Random Scanning","Permutation Scanning","Hit-list Scanning"],"answer":"Local Subnet Scanning","explanation":"Local subnet scanning uses access to internal address space from an already compromised host.","id":"S08Q31"},{"concept_id":"DoS/DDoS Concepts::Protocol metric","variant":1,"category":"DoS/DDoS Concepts","question":"How is a protocol attack typically measured?","choices":["Packets per second (pps)","Bits per second (bps)","Requests per second (rps)","Users per second"],"answer":"Packets per second (pps)","explanation":"Protocol attacks are commonly measured in packets per second.","id":"S08Q32"},{"concept_id":"DoS/DDoS Concepts::RDDoS concept","variant":2,"category":"DoS/DDoS Concepts","question":"Which term describes demanding payment under threat of a larger DDoS?","choices":["Ransom DDoS (RDDoS)","Distributed Reflection DoS","Permanent DoS","Pulse Wave DoS"],"answer":"Ransom DDoS (RDDoS)","explanation":"DDoS extortion is also called ransom DDoS or RDDoS.","id":"S08Q33"},{"concept_id":"DoS/DDoS Concepts::Connection queue","variant":2,"category":"DoS/DDoS Concepts","question":"Where are pending SYN connections kept until completion or timeout?","choices":["Connection queue","DNS cache","ARP table only","Routing metric"],"answer":"Connection queue","explanation":"SYN floods fill the server queue used to track incomplete connections.","id":"S08Q34"},{"concept_id":"DDoS Case Study::Case RDDoS","variant":1,"category":"DDoS Case Study","question":"A company receives a ransom note plus a small demonstration flood. Which attack model fits?","choices":["Ransom DDoS (RDDoS)","DRDoS","PDoS","Smurf"],"answer":"Ransom DDoS (RDDoS)","explanation":"RDDoS uses DDoS capability as leverage for extortion.","id":"S08Q35"},{"concept_id":"DDoS Case Study::Case topology","variant":2,"category":"DDoS Case Study","question":"New victims are selected from topology clues already present on the machine. What scan is this?","choices":["Topological Scanning","Random Scanning","Permutation Scanning","Local Subnet Scanning"],"answer":"Topological Scanning","explanation":"Topological scanning uses host-local information such as URLs to discover targets.","id":"S08Q36"},{"concept_id":"DDoS Case Study::Case blackhole","variant":2,"category":"DDoS Case Study","question":"Packets disappear at the routing layer without notifying sources. What technique is this?","choices":["Black Hole Filtering","Load Balancing","Honeypot Deflection","SYN Cookies"],"answer":"Black Hole Filtering","explanation":"Black-hole filtering discards routed traffic to protect upstream resources, often at the cost of reachability.","id":"S08Q37"},{"concept_id":"Botnets::Botnet phishing","variant":1,"category":"Botnets","question":"Which botnet-supported activity lures victims into malicious sites?","choices":["Phishing","Segmentation","Ingress filtering","SYN cookies"],"answer":"Phishing","explanation":"Botnets can support phishing campaigns and malicious-site traffic.","id":"S08Q38"},{"concept_id":"DoS/DDoS Attack Countermeasures::Traceback","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which external parties can support source traceback during post-attack forensics?","choices":["Intermediary ISPs and law enforcement","Only local users","Only certificate authorities","Only cloud developers"],"answer":"Intermediary ISPs and law enforcement","explanation":"Traceback may require cooperation from upstream ISPs and law enforcement.","id":"S08Q39"},{"concept_id":"DoS/DDoS Attack Countermeasures::Honeynet","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"What is a high-interaction environment simulating a complete network called?","choices":["Honeynet","Black hole","Botnet","CDN"],"answer":"Honeynet","explanation":"A honeynet is a high-interaction decoy network.","id":"S08Q40"},{"concept_id":"DoS/DDoS Protection Tools::Imperva","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which security vendor appears in the protection-tool list alongside Nexusguard and BlockDoS?","choices":["Imperva DDoS Protection","UFONet","Slowloris","HULK"],"answer":"Imperva DDoS Protection","explanation":"Imperva DDoS Protection is one of the listed protection services.","id":"S08Q41"},{"concept_id":"Botnets::Permutation restart","variant":2,"category":"Botnets","question":"What technique preserves high speed by jumping to new positions in the common list?","choices":["Permutation Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning uses restart points in a shared pseudorandom list.","id":"S08Q42"},{"concept_id":"DoS/DDoS Attack Techniques::SNMP amp","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which management protocol is listed as an amplification source?","choices":["SNMP","SMTP","SMB","SFTP"],"answer":"SNMP","explanation":"SNMP is listed as a possible amplification protocol.","id":"S08Q43"},{"concept_id":"Botnets::Local subnet","variant":1,"category":"Botnets","question":"Which scanning method searches the infected host's own network?","choices":["Local Subnet Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Local Subnet Scanning","explanation":"Local subnet scanning searches for vulnerable systems on the same internal network.","id":"S08Q44"},{"concept_id":"DoS/DDoS Concepts::Cloud absorption","variant":1,"category":"DoS/DDoS Concepts","question":"Why can large cloud providers help against DDoS?","choices":["Large distributed capacity","Guaranteed source attribution","No need for routing","Automatic password rotation"],"answer":"Large distributed capacity","explanation":"Cloud providers can absorb and distribute very large traffic volumes.","id":"S08Q45"},{"concept_id":"DoS/DDoS Attack Techniques::RDDoS","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which extortion attack may first demonstrate capability with a sample flood?","choices":["Ransom DDoS (RDDoS)","DRDoS","PDoS","Pulse Wave DDoS"],"answer":"Ransom DDoS (RDDoS)","explanation":"RDDoS combines DDoS capability with an extortion demand.","id":"S08Q46"},{"concept_id":"DoS/DDoS Concepts::Spoofed victim IP","variant":2,"category":"DoS/DDoS Concepts","question":"What makes reflector replies converge on the victim?","choices":["Replies are redirected to the victim","The attacker gains shell access","The victim authenticates the attacker","The reflector disables logging"],"answer":"Replies are redirected to the victim","explanation":"Spoofing the victim as the source causes reflector responses to be sent to the victim.","id":"S08Q47"},{"concept_id":"DoS/DDoS Protection Tools::LOIC purpose","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which simple DoS tool is available for Linux and Windows in the supplied notes?","choices":["LOIC","A10 Thunder TPS","Akamai","Nexusguard"],"answer":"LOIC","explanation":"LOIC is an attack-generation tool, not a protection service.","id":"S08Q48"},{"concept_id":"DDoS Case Study::Case SYN","variant":1,"category":"DDoS Case Study","question":"A server has thousands of pending handshakes with no final ACK. Which attack fits?","choices":["SYN Flood","SYN-ACK Flood","ACK Flood","Smurf"],"answer":"SYN Flood","explanation":"SYN flood fills the connection queue with incomplete handshakes.","id":"S08Q49"},{"concept_id":"DoS/DDoS Attack Techniques::ICMP flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which volumetric attack exceeds the victim's capacity to answer ping traffic?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"ICMP Flood","explanation":"ICMP floods send large numbers of Echo Requests, often with spoofed sources.","id":"S08Q50"}],[{"concept_id":"DoS/DDoS Attack Countermeasures::Disable echo chargen","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which services should be disabled when not required to reduce amplification/reflection risk?","choices":["Echo and CHARGEN","SSH and HTTPS","LDAP and Kerberos","IMAP and POP3"],"answer":"Echo and CHARGEN","explanation":"The course recommends disabling unnecessary echo and CHARGEN services.","id":"S09Q01"},{"concept_id":"Botnets::Random slowdown","variant":2,"category":"Botnets","question":"What method suffers more duplicate/redundant probing over time?","choices":["Random scanning","Hit-list scanning","Local subnet scanning","Topological scanning"],"answer":"Random scanning","explanation":"Random scanning becomes less efficient as more hosts are already infected.","id":"S09Q02"},{"concept_id":"DoS/DDoS Attack Countermeasures::Drop requests","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What strategy removes suspicious or excessive requests before processing?","choices":["Drop requests","Increase timeouts","Enable broadcast","Disable logging"],"answer":"Drop requests","explanation":"Dropping selected requests reduces load on the protected service.","id":"S09Q03"},{"concept_id":"DDoS Case Study::Case pulse","variant":1,"category":"DDoS Case Study","question":"Traffic reaches hundreds of Gbps in repeating bursts with quiet gaps. Which attack fits?","choices":["Pulse Wave DDoS","UDP Flood","Slowloris","PDoS"],"answer":"Pulse Wave DDoS","explanation":"Pulse Wave DDoS uses large periodic bursts separated by quieter periods.","id":"S09Q04"},{"concept_id":"Botnets::Traffic analysis handler","variant":1,"category":"Botnets","question":"Which technique can reveal communication between handlers and bots?","choices":["Network traffic analysis","Password spraying","File carving","Static code signing"],"answer":"Network traffic analysis","explanation":"Network traffic analysis can reveal protocols and patterns used between handlers and agents.","id":"S09Q05"},{"concept_id":"DDoS Case Study::Case PoD","variant":1,"category":"DDoS Case Study","question":"A malformed oversized ping crashes a vulnerable host. Which attack fits?","choices":["Ping of Death","Smurf","ICMP Flood","LAND"],"answer":"Ping of Death","explanation":"Ping of Death uses malformed/oversized ICMP packets.","id":"S09Q06"},{"concept_id":"DoS/DDoS Attack Techniques::HTTP GET slow header","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which application attack delays completion of HTTP headers?","choices":["HTTP GET Attack","HTTP POST Attack","Slow Read","DNS Amplification"],"answer":"HTTP GET Attack","explanation":"The course describes an HTTP GET attack with time-delayed or incomplete header data.","id":"S09Q07"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 1","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which name belongs on the defensive side of a DoS/DDoS tool comparison?","choices":["Akamai","LOIC","HOIC","HULK"],"answer":"Akamai","explanation":"Akamai is a protection/mitigation service, while the others are attack tools.","id":"S09Q08"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 2","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which name should NOT appear in a defensive DDoS product shortlist?","choices":["LOIC","Imperva DDoS Protection","Nexusguard","A10 Thunder TPS"],"answer":"LOIC","explanation":"LOIC generates attack traffic; the other choices are defensive products/services.","id":"S09Q09"},{"concept_id":"DoS/DDoS Attack Countermeasures::Assertive timeouts","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What server setting limits resource retention by slow clients?","choices":["Assertive connection timeouts","Longer idle sessions","Open keepalive forever","Disabled TCP timers"],"answer":"Assertive connection timeouts","explanation":"Aggressive/appropriate timeouts reduce resource exhaustion from slow or incomplete connections.","id":"S09Q10"},{"concept_id":"DoS/DDoS Attack Techniques::Zero day","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which attack lacks an available defensive patch at the time of exploitation?","choices":["Zero-Day DDoS","Pulse Wave DDoS","Smurf","SYN Flood"],"answer":"Zero-Day DDoS","explanation":"A zero-day DDoS exploits a vulnerability before a patch or established defense exists.","id":"S09Q11"},{"concept_id":"DoS/DDoS Protection Tools::slowhttptest","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which utility can simulate several slow HTTP DoS behaviors?","choices":["slowhttptest","LOIC","A10 Thunder TPS","Nexusguard"],"answer":"slowhttptest","explanation":"The supplementary notes describe slowhttptest as supporting several slow HTTP attack simulations.","id":"S09Q12"},{"concept_id":"Botnets::Botnet definition","variant":2,"category":"Botnets","question":"Which structure consists of many compromised hosts under common control?","choices":["A network of compromised bots","A cluster of legitimate load balancers","A set of honeypots","A DNS zone"],"answer":"A network of compromised bots","explanation":"A botnet is a collection of compromised systems controlled by an attacker.","id":"S09Q13"},{"concept_id":"DoS/DDoS Attack Countermeasures::RFC3704","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which defense uses ACLs and a bogon list to reject spoofed addresses?","choices":["RFC 3704 Filtering","Black Hole Filtering","SYN Cookies","Honeypot Deflection"],"answer":"RFC 3704 Filtering","explanation":"RFC 3704 filtering uses source-address validation and bogon-style filtering against spoofing.","id":"S09Q14"},{"concept_id":"DDoS Case Study::Case Fraggle","variant":2,"category":"DDoS Case Study","question":"The mechanism resembles Smurf but uses UDP instead of ICMP. What is it?","choices":["Fraggle","Smurf","LAND","Teardrop"],"answer":"Fraggle","explanation":"Fraggle is the UDP counterpart to Smurf-style broadcast amplification.","id":"S09Q15"},{"concept_id":"DoS/DDoS Concepts::Botnet bandwidth advantage","variant":2,"category":"DoS/DDoS Concepts","question":"What problem does a botnet solve for a single attacker?","choices":["Aggregates bandwidth from many systems","Guarantees zero packet loss","Removes the need for IP routing","Creates stronger encryption"],"answer":"Aggregates bandwidth from many systems","explanation":"A botnet combines traffic capacity from many compromised machines.","id":"S09Q16"},{"concept_id":"DoS/DDoS Concepts::Rate limiting","variant":1,"category":"DoS/DDoS Concepts","question":"What does rate limiting control during DoS mitigation?","choices":["Traffic/request rate","Source-code size","Encryption key length","Disk sector count"],"answer":"Traffic/request rate","explanation":"Rate limiting restricts how much traffic or how many requests are accepted over time.","id":"S09Q17"},{"concept_id":"DoS/DDoS Attack Techniques::Random recursive","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which HTTP flood targets forums/blogs with random valid page numbers?","choices":["Random Recursive GET Flood","Recursive HTTP GET Flood","Single-Request HTTP Flood","Slow Read"],"answer":"Random Recursive GET Flood","explanation":"Random recursive GET floods vary page numbers to generate repeated valid-looking requests.","id":"S09Q18"},{"concept_id":"DoS/DDoS Concepts::Reflection","variant":1,"category":"DoS/DDoS Concepts","question":"Which concept uses third-party systems to bounce traffic at a victim?","choices":["Reflection","Fragmentation","Rooting","Credential stuffing"],"answer":"Reflection","explanation":"Reflection uses third parties that answer spoofed requests directed at the victim.","id":"S09Q19"},{"concept_id":"DoS/DDoS Concepts::DDoS definition","variant":1,"category":"DoS/DDoS Concepts","question":"What makes a denial-of-service attack distributed?","choices":["Multiple attacking systems","Encrypted payloads","Physical access","A single spoofed packet"],"answer":"Multiple attacking systems","explanation":"DDoS uses many compromised or coordinated systems against one target.","id":"S09Q20"},{"concept_id":"Botnets::Botnet market","variant":2,"category":"Botnets","question":"What criminal market can sell or rent botnet capacity?","choices":["Botnet market","Patch market","Certificate market","Backup market"],"answer":"Botnet market","explanation":"Botnet capacity can be sold or rented in criminal markets.","id":"S09Q21"},{"concept_id":"DDoS Case Study::Case SYNACK","variant":1,"category":"DDoS Case Study","question":"A host is overwhelmed by unsolicited second-stage TCP handshake packets. Which attack fits?","choices":["SYN-ACK Flood","SYN Flood","ACK Flood","Fragmentation Attack"],"answer":"SYN-ACK Flood","explanation":"SYN-ACK flood abuses the second stage of the TCP handshake.","id":"S09Q22"},{"concept_id":"Botnets::Bot purposes crime","variant":1,"category":"Botnets","question":"Which broad use includes fraud, extortion, and illicit markets?","choices":["Cybercrime operations","Software patching","Network segmentation","Traffic shaping"],"answer":"Cybercrime operations","explanation":"Botnets support many criminal activities beyond DDoS.","id":"S09Q23"},{"concept_id":"Botnets::Central control","variant":2,"category":"Botnets","question":"Which capability lets thousands of bots act together?","choices":["Centralized coordination","Automatic patching","User authentication","Data deduplication"],"answer":"Centralized coordination","explanation":"C&C coordinates bot behavior so many systems can act together.","id":"S09Q24"},{"concept_id":"DoS/DDoS Attack Countermeasures::Black hole","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What mitigation sends unwanted traffic to a route where it disappears?","choices":["Black Hole Filtering","Load Balancing","TCP Intercept","Honeypotting"],"answer":"Black Hole Filtering","explanation":"Black-hole filtering drops traffic without notifying the sender.","id":"S09Q25"},{"concept_id":"DoS/DDoS Attack Techniques::UDP app flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which listed Layer-7 category can target a UDP-based application itself?","choices":["UDP application-layer flood","UDP volumetric flood only","SYN-ACK flood","Smurf"],"answer":"UDP application-layer flood","explanation":"The course lists UDP application-layer flood as an application-layer technique.","id":"S09Q26"},{"concept_id":"DoS/DDoS Concepts::Slow attack principle","variant":1,"category":"DoS/DDoS Concepts","question":"What do slow attacks exhaust with relatively little traffic?","choices":["Server connections/threads/memory","Only WAN bandwidth","Only DNS cache entries","Only CPU instruction cache"],"answer":"Server connections/threads/memory","explanation":"Slow attacks hold server-side resources such as connections, threads, or memory.","id":"S09Q27"},{"concept_id":"Botnets::Bot purposes malware","variant":1,"category":"Botnets","question":"Which botnet activity helps expand or spread malicious code?","choices":["Spread malware","Issue certificates","Run DHCP securely","Reduce attack surface"],"answer":"Spread malware","explanation":"Botnets can spread malware and infect additional systems.","id":"S09Q28"},{"concept_id":"DoS/DDoS Attack Techniques::RDDoS proof","variant":2,"category":"DoS/DDoS Attack Techniques","question":"What purpose does a sample attack serve before the ransom deadline?","choices":["Prove attack capability","Patch the target","Discover DNS records only","Establish a VPN"],"answer":"Prove attack capability","explanation":"A small sample attack can demonstrate that the extortion threat is credible.","id":"S09Q29"},{"concept_id":"DoS/DDoS Attack Countermeasures::Simulation","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which proactive exercise tests whether DDoS controls work before a real attack?","choices":["DoS/DDoS attack simulations","Disable monitoring","Increase broadcast traffic","Remove rate limits"],"answer":"DoS/DDoS attack simulations","explanation":"Controlled simulations help validate DDoS readiness.","id":"S09Q30"},{"concept_id":"DoS/DDoS Concepts::Application metric","variant":1,"category":"DoS/DDoS Concepts","question":"How is an application-layer DoS attack typically measured?","choices":["Requests per second (rps)","Packets per second (pps)","Bits per second (bps)","Bytes per route"],"answer":"Requests per second (rps)","explanation":"Application-layer attacks are measured in requests per second.","id":"S09Q31"},{"concept_id":"DoS/DDoS Protection Tools::A10 opex","variant":2,"category":"DoS/DDoS Protection Tools","question":"What stated benefit aims to lower ongoing security expense?","choices":["Reduce security OpEx","Increase bot count","Disable automation","Maximize packet loss"],"answer":"Reduce security OpEx","explanation":"The course lists reducing security OpEx as a Thunder TPS feature.","id":"S09Q32"},{"concept_id":"DoS/DDoS Attack Countermeasures::Neutralize handlers","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What strategy exploits the fact that handlers are fewer than agents?","choices":["Neutralize Botnet Handlers","Increase Bot Count","Enable Broadcasting","Disable Logging"],"answer":"Neutralize Botnet Handlers","explanation":"Taking down handlers can render many connected agents ineffective.","id":"S09Q33"},{"concept_id":"DoS/DDoS Attack Countermeasures::SYN cookies","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which defense specifically helps against SYN flood queue exhaustion?","choices":["SYN cookies","WPS PINs","DNSSEC","ARP inspection"],"answer":"SYN cookies","explanation":"SYN cookies help resist SYN floods by encoding connection state rather than allocating it immediately.","id":"S09Q34"},{"concept_id":"DoS/DDoS Protection Tools::Akamai","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which provider is associated with a Security Center console in the course?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"Akamai","explanation":"Akamai is listed as a DDoS protection service/provider.","id":"S09Q35"},{"concept_id":"DoS/DDoS Concepts::Protocol examples","variant":2,"category":"DoS/DDoS Concepts","question":"Which set targets connection or packet-processing state?","choices":["SYN flood, fragmentation, ACK flood","Smurf, NTP amplification, ICMP flood","Slowloris, RUDY, Slow Read","Phishing, vishing, smishing"],"answer":"SYN flood, fragmentation, ACK flood","explanation":"SYN flood, fragmentation, and ACK floods are protocol-level attacks.","id":"S09Q36"},{"concept_id":"DoS/DDoS Concepts::UDP spoofing","variant":2,"category":"DoS/DDoS Concepts","question":"What UDP property makes source-address spoofing easier?","choices":["No connection handshake","Built-in mutual TLS","Mandatory sequence numbers","Stateful three-way setup"],"answer":"No connection handshake","explanation":"UDP is connectionless, so spoofed source addresses are easier to use.","id":"S09Q37"},{"concept_id":"DoS/DDoS Attack Techniques::PDoS","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack is also called phlashing?","choices":["Permanent DoS (PDoS)","Pulse Wave DDoS","Slowloris","Smurf"],"answer":"Permanent DoS (PDoS)","explanation":"PDoS or phlashing aims to cause irreversible damage through malicious firmware changes.","id":"S09Q38"},{"concept_id":"DDoS Case Study::Case RUDY","variant":2,"category":"DDoS Case Study","question":"The request body is deliberately trickled to keep the connection open. What is this?","choices":["RUDY","Slowloris","Slow Read","Apache Killer"],"answer":"RUDY","explanation":"RUDY uses a slow POST body with a large Content-Length.","id":"S09Q39"},{"concept_id":"DoS/DDoS Attack Techniques::SYNACK flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which protocol flood sends large numbers of SYN-ACK packets?","choices":["SYN-ACK Flood","SYN Flood","ACK Flood","TCP SACK Panic"],"answer":"SYN-ACK Flood","explanation":"SYN-ACK flood targets systems with large volumes of SYN-ACK packets.","id":"S09Q40"},{"concept_id":"DDoS Case Study::Case PDoS","variant":2,"category":"DDoS Case Study","question":"Recovery requires hardware replacement after a malicious update. What is this?","choices":["Permanent DoS (PDoS)","Zero-Day DDoS","Pulse Wave DDoS","DRDoS"],"answer":"Permanent DoS (PDoS)","explanation":"PDoS or phlashing causes persistent hardware/firmware damage.","id":"S09Q41"},{"concept_id":"DoS/DDoS Attack Techniques::NTP amp","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which time-synchronization service can be abused for response amplification?","choices":["NTP","SSH","RDP","LDAP"],"answer":"NTP","explanation":"NTP is one of the protocols listed for amplification attacks.","id":"S09Q42"},{"concept_id":"DoS/DDoS Protection Tools::GCP","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which Google cloud platform is named as a DDoS absorption option?","choices":["Google Cloud (GCP)","LOIC","Packet Flooder","UFONet"],"answer":"Google Cloud (GCP)","explanation":"Google Cloud is listed as a cloud provider able to absorb large-scale traffic.","id":"S09Q43"},{"concept_id":"DoS/DDoS Attack Techniques::HTTP POST incomplete","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which web DoS makes the server wait for a POST body?","choices":["HTTP POST Attack","HTTP GET Attack","Slow Read","Smurf"],"answer":"HTTP POST Attack","explanation":"The course describes an HTTP POST attack that withholds the full message body.","id":"S09Q44"},{"concept_id":"DoS/DDoS Concepts::C&C","variant":2,"category":"DoS/DDoS Concepts","question":"Which component distributes attacker instructions to bots?","choices":["Coordinate compromised systems","Provide CDN caching","Issue public certificates","Perform user authentication"],"answer":"Coordinate compromised systems","explanation":"C&C infrastructure sends commands and coordinates bots.","id":"S09Q45"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 3","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which option is a protection product rather than a flooding tool?","choices":["Huawei AntiDDoS1000","UFONet","HULK","HOIC"],"answer":"Huawei AntiDDoS1000","explanation":"Huawei AntiDDoS1000 is a defensive platform.","id":"S09Q46"},{"concept_id":"DoS/DDoS Attack Countermeasures::Update defenses","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What should be done to built-in security mechanisms over time?","choices":["Configure and update them regularly","Disable them permanently","Expose them to the Internet","Share default passwords"],"answer":"Configure and update them regularly","explanation":"The course recommends proper configuration and regular updates of defensive mechanisms.","id":"S09Q47"},{"concept_id":"Botnets::Hitlist list","variant":1,"category":"Botnets","question":"Which scanning method starts with a pre-collected vulnerable-host list?","choices":["Hit-list scanning","Random scanning","Topological scanning","Permutation scanning"],"answer":"Hit-list scanning","explanation":"Hit-list scanning begins with a prepared list of likely vulnerable hosts.","id":"S09Q48"},{"concept_id":"DoS/DDoS Attack Techniques::CHARGEN","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which service should be disabled to reduce a classic reflection risk in the course?","choices":["CHARGEN","SSH","LDAP","Kerberos"],"answer":"CHARGEN","explanation":"The course recommends disabling CHARGEN to reduce a classic reflection/amplification vector.","id":"S09Q49"},{"concept_id":"DoS/DDoS Concepts::DoS goal","variant":2,"category":"DoS/DDoS Concepts","question":"Which outcome defines successful denial of service?","choices":["Prevent legitimate access","Steal credentials","Modify database records","Gain administrator privileges"],"answer":"Prevent legitimate access","explanation":"DoS aims to reduce or prevent legitimate access to resources, not to obtain unauthorized access.","id":"S09Q50"}],[{"concept_id":"DDoS Case Study::Case bps","variant":2,"category":"DDoS Case Study","question":"The main symptom is link saturation quantified in bits per second. What class fits?","choices":["Volumetric attack","Protocol attack","Application-layer attack","Permanent DoS"],"answer":"Volumetric attack","explanation":"Volumetric attacks are measured in bps and consume bandwidth.","id":"S10Q01"},{"concept_id":"Botnets::Primary target","variant":2,"category":"Botnets","question":"Which system receives the coordinated malicious traffic?","choices":["Primary target organization","C&C owner","Honeypot operator","Bot affiliate"],"answer":"Primary target organization","explanation":"The final attack is directed at the primary target.","id":"S10Q02"},{"concept_id":"DDoS Case Study::Case slowloris","variant":2,"category":"DDoS Case Study","question":"Requests look valid but headers are deliberately never completed. What attack is this?","choices":["Slowloris","RUDY","Slow Read","Apache Killer"],"answer":"Slowloris","explanation":"Slowloris keeps many HTTP requests incomplete to exhaust connection resources.","id":"S10Q03"},{"concept_id":"DoS/DDoS Protection Tools::Attack classification","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which group contains only DoS/DDoS attack tools?","choices":["HOIC, LOIC, HULK","Akamai, Nexusguard, BlockDoS","A10 Thunder TPS, LOIC, Akamai","Stormwall PRO, UFONet, Nexusguard"],"answer":"HOIC, LOIC, HULK","explanation":"HOIC, LOIC, and HULK are listed as attack tools.","id":"S10Q04"},{"concept_id":"DoS/DDoS Protection Tools::AWS","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which cloud provider is named as able to absorb DDoS traffic at scale?","choices":["AWS","LOIC","UFONet","Reaver"],"answer":"AWS","explanation":"AWS is named as a cloud platform capable of absorbing large-scale DDoS traffic.","id":"S10Q05"},{"concept_id":"DoS/DDoS Attack Countermeasures::Egress","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What control prevents internal hosts from sending packets with illegitimate source addresses?","choices":["Egress filtering","Ingress filtering","Blackholing","Honeypotting"],"answer":"Egress filtering","explanation":"Egress filtering checks outbound traffic and reduces spoofed-source abuse from your network.","id":"S10Q06"},{"concept_id":"DoS/DDoS Protection Tools::Nexusguard","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed provider specializes in DDoS mitigation and protection?","choices":["Nexusguard","LOIC","HOIC","HULK"],"answer":"Nexusguard","explanation":"Nexusguard is listed among DDoS protection services.","id":"S10Q07"},{"concept_id":"DoS/DDoS Concepts::ICMP echo","variant":2,"category":"DoS/DDoS Concepts","question":"What request normally triggers an ICMP echo reply?","choices":["ICMP Echo Request","TCP SYN-ACK","UDP ACK","ARP Reply"],"answer":"ICMP Echo Request","explanation":"Smurf and ICMP floods use ICMP Echo Requests.","id":"S10Q08"},{"concept_id":"DoS/DDoS Concepts::DDoS command flow","variant":1,"category":"DoS/DDoS Concepts","question":"Who ultimately instructs compromised systems to attack the target?","choices":["Attacker through handlers/C&C","Victim through DNS","ISP through DHCP","Honeypot through NAT"],"answer":"Attacker through handlers/C&C","explanation":"The attacker uses handlers or C&C infrastructure to direct zombies against the victim.","id":"S10Q09"},{"concept_id":"Botnets::Affiliate role","variant":1,"category":"Botnets","question":"What do affiliates contribute in the typical setup?","choices":["Malware/toolkit resources","Victim backups","ISP ACLs","Honeypot logs"],"answer":"Malware/toolkit resources","explanation":"Affiliates contribute malware and toolkit resources in the described botnet setup.","id":"S10Q10"},{"concept_id":"DoS/DDoS Concepts::Load balancing","variant":1,"category":"DoS/DDoS Concepts","question":"What does load balancing contribute during DoS mitigation?","choices":["Distributes traffic across resources","Spoofs source addresses","Creates botnet handlers","Disables connection tracking"],"answer":"Distributes traffic across resources","explanation":"Load balancing spreads work across multiple resources to preserve availability.","id":"S10Q11"},{"concept_id":"DoS/DDoS Concepts::Blackholing","variant":2,"category":"DoS/DDoS Concepts","question":"Which mitigation silently discards traffic at a routing point?","choices":["Drops traffic","Duplicates traffic","Encrypts traffic","Reassembles fragments"],"answer":"Drops traffic","explanation":"Black-hole filtering discards traffic at the routing level.","id":"S10Q12"},{"concept_id":"DoS/DDoS Protection Tools::A10 vs LOIC","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which product belongs to the mitigation side when compared with LOIC?","choices":["A10 Thunder TPS","LOIC","HOIC","HULK"],"answer":"A10 Thunder TPS","explanation":"A10 Thunder TPS is a defensive DDoS protection platform; LOIC, HOIC, and HULK are attack tools.","id":"S10Q13"},{"concept_id":"DoS/DDoS Protection Tools::A10 availability","variant":2,"category":"DoS/DDoS Protection Tools","question":"What stated goal of Thunder TPS directly maps to availability?","choices":["Maintain service availability","Generate botnets","Disable logging","Spoof source addresses"],"answer":"Maintain service availability","explanation":"The course lists maintaining service availability as an A10 Thunder TPS feature.","id":"S10Q14"},{"concept_id":"DoS/DDoS Concepts::Low traffic app attacks","variant":2,"category":"DoS/DDoS Concepts","question":"What makes many Layer-7 DoS attacks bandwidth-efficient?","choices":["Application-layer attacks","Volumetric attacks","Pure amplification only","Physical attacks"],"answer":"Application-layer attacks","explanation":"Application-layer attacks can exhaust server resources without large bandwidth.","id":"S10Q15"},{"concept_id":"DoS/DDoS Attack Techniques::Apache Killer","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which slow attack requests overlapping byte ranges?","choices":["Apache Killer","Slowloris","RUDY","Slow Read"],"answer":"Apache Killer","explanation":"Apache Killer abuses overlapping byte-range requests to increase memory consumption.","id":"S10Q16"},{"concept_id":"Botnets::Callback step","variant":1,"category":"Botnets","question":"What happens after a system becomes infected?","choices":["It connects back to C&C","It disconnects permanently","It becomes a honeypot","It disables networking"],"answer":"It connects back to C&C","explanation":"Infected bots connect back to C&C infrastructure.","id":"S10Q17"},{"concept_id":"Botnets::Infection step","variant":2,"category":"Botnets","question":"Which step turns a normal endpoint into a bot?","choices":["Malware infects the system","The ISP blackholes traffic","The server enables SYN cookies","The victim becomes a reflector only"],"answer":"Malware infects the system","explanation":"Malware infection converts the system into a bot.","id":"S10Q18"},{"concept_id":"DoS/DDoS Concepts::PDoS concept","variant":1,"category":"DoS/DDoS Concepts","question":"What makes permanent DoS different from ordinary resource exhaustion?","choices":["Irreversible hardware/firmware damage","Temporary bandwidth spike","One slow HTTP session","DNS cache poisoning"],"answer":"Irreversible hardware/firmware damage","explanation":"PDoS or phlashing aims to brick a device through damaging firmware/hardware state.","id":"S10Q19"},{"concept_id":"DoS/DDoS Attack Techniques::SSDP amp","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which UPnP-related protocol can be abused for reflected traffic?","choices":["SSDP","SFTP","SIP-TLS","SNMP Trap only"],"answer":"SSDP","explanation":"SSDP is listed among amplification protocols.","id":"S10Q20"},{"concept_id":"Botnets::Topological source","variant":1,"category":"Botnets","question":"Which scanning method uses information found on the infected host itself?","choices":["Topological scanning","Random scanning","Hit-list scanning","Permutation scanning"],"answer":"Topological scanning","explanation":"Topological scanning uses information such as URLs found on the infected system.","id":"S10Q21"},{"concept_id":"DoS/DDoS Attack Countermeasures::AI anomaly","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which modern technique flags traffic that deviates from normal baselines?","choices":["AI/ML anomaly detection","Static NAT only","WEP encryption","Manual DNS recursion"],"answer":"AI/ML anomaly detection","explanation":"AI/ML anomaly detection can identify traffic deviations associated with DDoS.","id":"S10Q22"},{"concept_id":"DoS/DDoS Attack Countermeasures::Spoofed address detection","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which clue can indicate forged-source traffic from a subnet?","choices":["Invalid/unexpected source addresses","Strong TLS ciphers","Long DNS names","Valid DHCP leases"],"answer":"Invalid/unexpected source addresses","explanation":"Spoofed source addresses may not match legitimate subnet assignments.","id":"S10Q23"},{"concept_id":"DDoS Case Study::Case slow read","variant":1,"category":"DDoS Case Study","question":"The server sends a large file while the client accepts only tiny chunks. Which attack fits?","choices":["Slow Read","RUDY","Slowloris","Apache Killer"],"answer":"Slow Read","explanation":"Slow Read keeps response-side resources occupied by consuming data very slowly.","id":"S10Q24"},{"concept_id":"DoS/DDoS Attack Techniques::UDP flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack sends spoofed datagrams to many random ports?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"UDP Flood","explanation":"A UDP flood sends high-rate UDP packets to random ports, forcing service checks and ICMP errors.","id":"S10Q25"},{"concept_id":"DDoS Case Study::Case permutation","variant":1,"category":"DDoS Case Study","question":"Bots share one pseudorandom IP ordering and restart at different positions. Which method fits?","choices":["Permutation Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning coordinates address coverage with a shared pseudorandom list.","id":"S10Q26"},{"concept_id":"DDoS Case Study::Case hit list","variant":1,"category":"DDoS Case Study","question":"Each newly infected bot receives half of a prepared target list. Which method fits?","choices":["Hit-list Scanning","Random Scanning","Local Subnet Scanning","Topological Scanning"],"answer":"Hit-list Scanning","explanation":"Hit-list scanning splits a prebuilt target list to accelerate propagation.","id":"S10Q27"},{"concept_id":"DoS/DDoS Concepts::DRDoS concept","variant":1,"category":"DoS/DDoS Concepts","question":"What adds the extra third-party reply mechanism to a distributed denial-of-service architecture?","choices":["Reflection","Recursion","Routing","Replication"],"answer":"Reflection","explanation":"Distributed Reflection DoS uses reflector systems between attacker and target.","id":"S10Q28"},{"concept_id":"DoS/DDoS Attack Countermeasures::DHCP snooping binding","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"What database can IP Source Guard use for validation?","choices":["DHCP snooping binding database","DNS cache","ARP cache only","BGP RIB"],"answer":"DHCP snooping binding database","explanation":"The course says IP Source Guard can filter based on DHCP snooping bindings.","id":"S10Q29"},{"concept_id":"DoS/DDoS Concepts::Bandwidth depletion types","variant":2,"category":"DoS/DDoS Concepts","question":"Which pair describes the main bandwidth exhaustion approaches?","choices":["Flood and amplification","Spoofing and phishing","Scanning and enumeration","Injection and traversal"],"answer":"Flood and amplification","explanation":"The course divides bandwidth depletion into flood attacks and amplification attacks.","id":"S10Q30"},{"concept_id":"DoS/DDoS Attack Techniques::Firmware corruption","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which attack can require hardware replacement after a malicious firmware installation?","choices":["Permanent DoS (PDoS)","SYN Flood","DNS Amplification","ICMP Flood"],"answer":"Permanent DoS (PDoS)","explanation":"PDoS can brick devices by installing corrupted firmware.","id":"S10Q31"},{"concept_id":"DoS/DDoS Protection Tools::Cloudflare","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which service is paired with Akamai as an example of traffic absorption and scrubbing?","choices":["Cloudflare","LOIC","HULK","Slowloris"],"answer":"Cloudflare","explanation":"The supplementary notes list Cloudflare as a DDoS mitigation/CDN service.","id":"S10Q32"},{"concept_id":"Botnets::Permutation list","variant":2,"category":"Botnets","question":"What method coordinates bots around one common randomized address ordering?","choices":["Permutation Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning uses a common pseudorandom ordering of addresses.","id":"S10Q33"},{"concept_id":"DoS/DDoS Attack Countermeasures::Awareness bots","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What preventive measure helps users avoid malicious downloads and social lures?","choices":["Security awareness","Blackholing","Packet fragmentation","Open broadcasting"],"answer":"Security awareness","explanation":"Awareness reduces infection opportunities that feed botnets.","id":"S10Q34"},{"concept_id":"DoS/DDoS Attack Techniques::Slowloris pool","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What resource does Slowloris primarily exhaust?","choices":["Connection pool/worker threads","DNS cache only","Disk partition table","Routing protocol IDs"],"answer":"Connection pool/worker threads","explanation":"Slowloris exhausts available server connection or worker capacity.","id":"S10Q35"},{"concept_id":"DoS/DDoS Protection Tools::Protection stack","variant":2,"category":"DoS/DDoS Protection Tools","question":"What mix addresses upstream filtering, traffic absorption, and local controls?","choices":["ISP/CDN mitigation plus local rate limiting","LOIC plus HOIC","Open DNS plus long timeouts","Broadcast forwarding plus WPS"],"answer":"ISP/CDN mitigation plus local rate limiting","explanation":"Layered protection combines upstream mitigation with local controls such as rate limiting.","id":"S10Q36"},{"concept_id":"DoS/DDoS Attack Techniques::DRDoS","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which architecture chains reflection through multiple systems?","choices":["DRDoS","Slowloris","LAND","PDoS"],"answer":"DRDoS","explanation":"Distributed Reflection DoS uses intermediary systems to direct responses toward the primary target.","id":"S10Q37"},{"concept_id":"DDoS Case Study::Case pps","variant":2,"category":"DDoS Case Study","question":"The attack is quantified in pps and stresses connection-tracking infrastructure. What is it?","choices":["Protocol attack","Volumetric attack","Application-layer attack","Physical attack"],"answer":"Protocol attack","explanation":"Protocol attacks are measured in pps and target network/state infrastructure.","id":"S10Q38"},{"concept_id":"DoS/DDoS Attack Countermeasures::Bottlenecks","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which capacity problem can turn moderate attack traffic into an outage?","choices":["Bottlenecks and single failure points","Strong authentication","Encrypted backups","Redundant paths"],"answer":"Bottlenecks and single failure points","explanation":"The course recommends eliminating bottlenecks and failure points.","id":"S10Q39"},{"concept_id":"DoS/DDoS Attack Techniques::Vol bps","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which DoS class is measured in bits per second?","choices":["Volumetric attacks","Protocol attacks","Application-layer attacks","Permanent attacks"],"answer":"Volumetric attacks","explanation":"Volumetric attacks are measured in bits per second.","id":"S10Q40"},{"concept_id":"DoS/DDoS Concepts::Protocol target","variant":1,"category":"DoS/DDoS Concepts","question":"What do protocol attacks primarily exhaust?","choices":["Connection state tables","Disk encryption keys","Application source code","Browser cookies"],"answer":"Connection state tables","explanation":"Protocol attacks consume state in infrastructure such as firewalls, load balancers, and servers.","id":"S10Q41"},{"concept_id":"Botnets::Spoof source clue","variant":1,"category":"Botnets","question":"Why can spoofed-source analysis help detect malicious traffic?","choices":["Source address does not fit the expected subnet","Every packet uses TLS","The victim uses DHCP","The attacker uses a browser"],"answer":"Source address does not fit the expected subnet","explanation":"Spoofed addresses may be invalid or implausible for the claimed network segment.","id":"S10Q42"},{"concept_id":"DoS/DDoS Concepts::Zombie","variant":2,"category":"DoS/DDoS Concepts","question":"Which role directly sends attack traffic after receiving botnet instructions?","choices":["Zombie agent","Reflector","Load balancer","Honeypot"],"answer":"Zombie agent","explanation":"Zombie agents are compromised systems used to generate attack traffic.","id":"S10Q43"},{"concept_id":"DoS/DDoS Attack Countermeasures::Disable services","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What should be done with services and applications that are not needed?","choices":["Disable/uninstall unnecessary services and apps","Enable all daemons","Increase idle timeouts","Open all inbound ports"],"answer":"Disable/uninstall unnecessary services and apps","explanation":"Reducing unnecessary services lowers the attack surface for bot infection.","id":"S10Q44"},{"concept_id":"DoS/DDoS Attack Countermeasures::High interaction","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which decoy environment provides the richest attacker interaction?","choices":["High-interaction honeypot","Low-interaction honeypot","Rate limiter","TCP intercept"],"answer":"High-interaction honeypot","explanation":"High-interaction honeypots expose realistic systems and applications for observation.","id":"S10Q45"},{"concept_id":"DoS/DDoS Attack Countermeasures::Load balance","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which mitigation spreads demand across multiple servers or paths?","choices":["Load balancing","Blackholing","Spoofing","Fragmentation"],"answer":"Load balancing","explanation":"Load balancing distributes traffic across multiple resources.","id":"S10Q46"},{"concept_id":"Botnets::Bot purposes DDoS","variant":2,"category":"Botnets","question":"What botnet activity generates distributed denial of service?","choices":["DDoS attacks","Certificate enrollment","Patch management","Backups"],"answer":"DDoS attacks","explanation":"Botnets are commonly used to launch DDoS attacks.","id":"S10Q47"},{"concept_id":"DoS/DDoS Attack Techniques::Ping of Death","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which legacy-style DoS crashes vulnerable systems with oversized ICMP packets?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"Ping of Death","explanation":"Ping of Death uses malformed or oversized ping packets.","id":"S10Q48"},{"concept_id":"DoS/DDoS Attack Techniques::RUDY","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which attack slowly trickles a POST body to keep the connection open?","choices":["RUDY","Slowloris","Slow Read","Apache Killer"],"answer":"RUDY","explanation":"RUDY targets the HTTP request body with a deliberately slow POST.","id":"S10Q49"},{"concept_id":"DoS/DDoS Attack Techniques::Memcached amp","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which caching service is listed as an amplification source?","choices":["memcached","PostgreSQL","SSH","Kerberos"],"answer":"memcached","explanation":"memcached is listed among common amplification sources.","id":"S10Q50"}]];

const STORAGE_KEY = "ceh-v13-dos-ddos-direct-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Denial of Service — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied CEH v13 DoS/DDoS materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">6 blueprint areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Denial of Service (DoS/DDoS)</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Denial of Service (DoS/DDoS)</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
