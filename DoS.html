ary echo and CHARGEN services.","id":"S04Q31"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 3","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which name belongs with mitigation platforms rather than attack utilities?","choices":["Huawei AntiDDoS1000","UFONet","HULK","HOIC"],"answer":"Huawei AntiDDoS1000","explanation":"Huawei AntiDDoS1000 is a defensive platform.","id":"S04Q32"},{"concept_id":"DoS/DDoS Attack Techniques::HTTP POST incomplete","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which application attack leaves the HTTP message body incomplete?","choices":["HTTP POST Attack","HTTP GET Attack","Slow Read","Smurf"],"answer":"HTTP POST Attack","explanation":"The course describes an HTTP POST attack that withholds the full message body.","id":"S04Q33"},{"concept_id":"DoS/DDoS Attack Techniques::RDDoS proof","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Why might an extortion attacker launch a small initial DDoS?","choices":["Prove attack capability","Patch the target","Discover DNS records only","Establish a VPN"],"answer":"Prove attack capability","explanation":"A small sample attack can demonstrate that the extortion threat is credible.","id":"S04Q34"},{"concept_id":"DoS/DDoS Concepts::Protocol examples","variant":1,"category":"DoS/DDoS Concepts","question":"Which group contains only protocol-level examples?","choices":["SYN flood, fragmentation, ACK flood","Smurf, NTP amplification, ICMP flood","Slowloris, RUDY, Slow Read","Phishing, vishing, smishing"],"answer":"SYN flood, fragmentation, ACK flood","explanation":"SYN flood, fragmentation, and ACK floods are protocol-level attacks.","id":"S04Q35"},{"concept_id":"DoS/DDoS Attack Countermeasures::RFC3704","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What filtering technique drops traffic from unused or reserved source networks?","choices":["RFC 3704 Filtering","Black Hole Filtering","SYN Cookies","Honeypot Deflection"],"answer":"RFC 3704 Filtering","explanation":"RFC 3704 filtering uses source-address validation and bogon-style filtering against spoofing.","id":"S04Q36"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 1","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which option is a protection service rather than an attack generator?","choices":["Akamai","LOIC","HOIC","HULK"],"answer":"Akamai","explanation":"Akamai is a protection/mitigation service, while the others are attack tools.","id":"S04Q37"},{"concept_id":"DoS/DDoS Concepts::Botnet bandwidth advantage","variant":1,"category":"DoS/DDoS Concepts","question":"Why are botnets effective for bandwidth attacks?","choices":["Aggregates bandwidth from many systems","Guarantees zero packet loss","Removes the need for IP routing","Creates stronger encryption"],"answer":"Aggregates bandwidth from many systems","explanation":"A botnet combines traffic capacity from many compromised machines.","id":"S04Q38"},{"concept_id":"DoS/DDoS Attack Countermeasures::Neutralize handlers","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which action can disable many bots by removing a few control systems?","choices":["Neutralize Botnet Handlers","Increase Bot Count","Enable Broadcasting","Disable Logging"],"answer":"Neutralize Botnet Handlers","explanation":"Taking down handlers can render many connected agents ineffective.","id":"S04Q39"},{"concept_id":"DoS/DDoS Concepts::C&C","variant":1,"category":"DoS/DDoS Concepts","question":"What is the main purpose of command-and-control infrastructure?","choices":["Coordinate compromised systems","Provide CDN caching","Issue public certificates","Perform user authentication"],"answer":"Coordinate compromised systems","explanation":"C&C infrastructure sends commands and coordinates bots.","id":"S04Q40"},{"concept_id":"DoS/DDoS Attack Countermeasures::SYN cookies","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What TCP mechanism avoids storing full state for every initial SYN?","choices":["SYN cookies","WPS PINs","DNSSEC","ARP inspection"],"answer":"SYN cookies","explanation":"SYN cookies help resist SYN floods by encoding connection state rather than allocating it immediately.","id":"S04Q41"},{"concept_id":"Botnets::Botnet definition","variant":1,"category":"Botnets","question":"What is a botnet?","choices":["A network of compromised bots","A cluster of legitimate load balancers","A set of honeypots","A DNS zone"],"answer":"A network of compromised bots","explanation":"A botnet is a collection of compromised systems controlled by an attacker.","id":"S04Q42"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 2","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which option is an attack tool rather than a protection product?","choices":["LOIC","Imperva DDoS Protection","Nexusguard","A10 Thunder TPS"],"answer":"LOIC","explanation":"LOIC generates attack traffic; the other choices are defensive products/services.","id":"S04Q43"},{"concept_id":"Botnets::Botnet market","variant":1,"category":"Botnets","question":"Which ecosystem component monetizes access to compromised hosts?","choices":["Botnet market","Patch market","Certificate market","Backup market"],"answer":"Botnet market","explanation":"Botnet capacity can be sold or rented in criminal markets.","id":"S04Q44"},{"concept_id":"DDoS Case Study::Case PDoS","variant":1,"category":"DDoS Case Study","question":"A device installs corrupted firmware and cannot boot again. Which attack fits?","choices":["Permanent DoS (PDoS)","Zero-Day DDoS","Pulse Wave DDoS","DRDoS"],"answer":"Permanent DoS (PDoS)","explanation":"PDoS or phlashing causes persistent hardware/firmware damage.","id":"S04Q45"},{"concept_id":"DoS/DDoS Attack Techniques::UDP app flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"What attack appears in the application-layer list despite using UDP?","choices":["UDP application-layer flood","UDP volumetric flood only","SYN-ACK flood","Smurf"],"answer":"UDP application-layer flood","explanation":"The course lists UDP application-layer flood as an application-layer technique.","id":"S04Q46"},{"concept_id":"DoS/DDoS Attack Techniques::SYNACK flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack abuses the second stage of the TCP handshake?","choices":["SYN-ACK Flood","SYN Flood","ACK Flood","TCP SACK Panic"],"answer":"SYN-ACK Flood","explanation":"SYN-ACK flood targets systems with large volumes of SYN-ACK packets.","id":"S04Q47"},{"concept_id":"DoS/DDoS Concepts::Reflection","variant":2,"category":"DoS/DDoS Concepts","question":"What mechanism makes unsolicited responses arrive from intermediary servers?","choices":["Reflection","Fragmentation","Rooting","Credential stuffing"],"answer":"Reflection","explanation":"Reflection uses third parties that answer spoofed requests directed at the victim.","id":"S04Q48"},{"concept_id":"Botnets::Random slowdown","variant":1,"category":"Botnets","question":"Which scanning method slows as more machines become infected?","choices":["Random scanning","Hit-list scanning","Local subnet scanning","Topological scanning"],"answer":"Random scanning","explanation":"Random scanning becomes less efficient as more hosts are already infected.","id":"S04Q49"},{"concept_id":"DoS/DDoS Attack Countermeasures::Simulation","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What practice validates defenses under controlled denial-of-service conditions?","choices":["DoS/DDoS attack simulations","Disable monitoring","Increase broadcast traffic","Remove rate limits"],"answer":"DoS/DDoS attack simulations","explanation":"Controlled simulations help validate DDoS readiness.","id":"S04Q50"}],[{"concept_id":"DDoS Case Study::Case bps","variant":1,"category":"DDoS Case Study","question":"A provider reports an attack peaking at 600 Gbps. Which category is being measured?","choices":["Volumetric attack","Protocol attack","Application-layer attack","Permanent DoS"],"answer":"Volumetric attack","explanation":"Volumetric attacks are measured in bps and consume bandwidth.","id":"S05Q01"},{"concept_id":"DoS/DDoS Protection Tools::AWS","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which hyperscaler in the supplementary notes can contribute elastic attack absorption?","choices":["AWS","LOIC","UFONet","Reaver"],"answer":"AWS","explanation":"AWS is named as a cloud platform capable of absorbing large-scale DDoS traffic.","id":"S05Q02"},{"concept_id":"DoS/DDoS Protection Tools::Protection stack","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which combination best represents layered DDoS protection from the supplied notes?","choices":["ISP/CDN mitigation plus local rate limiting","LOIC plus HOIC","Open DNS plus long timeouts","Broadcast forwarding plus WPS"],"answer":"ISP/CDN mitigation plus local rate limiting","explanation":"Layered protection combines upstream mitigation with local controls such as rate limiting.","id":"S05Q03"},{"concept_id":"DoS/DDoS Attack Countermeasures::Bottlenecks","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"What infrastructure weakness should be removed before a DDoS occurs?","choices":["Bottlenecks and single failure points","Strong authentication","Encrypted backups","Redundant paths"],"answer":"Bottlenecks and single failure points","explanation":"The course recommends eliminating bottlenecks and failure points.","id":"S05Q04"},{"concept_id":"DoS/DDoS Attack Countermeasures::High interaction","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which honeypot type runs real systems and applications?","choices":["High-interaction honeypot","Low-interaction honeypot","Rate limiter","TCP intercept"],"answer":"High-interaction honeypot","explanation":"High-interaction honeypots expose realistic systems and applications for observation.","id":"S05Q05"},{"concept_id":"Botnets::Infection step","variant":1,"category":"Botnets","question":"What happens after a victim reaches the malicious site?","choices":["Malware infects the system","The ISP blackholes traffic","The server enables SYN cookies","The victim becomes a reflector only"],"answer":"Malware infects the system","explanation":"Malware infection converts the system into a bot.","id":"S05Q06"},{"concept_id":"DoS/DDoS Concepts::Low traffic app attacks","variant":1,"category":"DoS/DDoS Concepts","question":"Which attack class can be effective with very little traffic?","choices":["Application-layer attacks","Volumetric attacks","Pure amplification only","Physical attacks"],"answer":"Application-layer attacks","explanation":"Application-layer attacks can exhaust server resources without large bandwidth.","id":"S05Q07"},{"concept_id":"DoS/DDoS Concepts::DRDoS concept","variant":2,"category":"DoS/DDoS Concepts","question":"Which DDoS architecture relies on third-party systems sending replies to the victim?","choices":["Reflection","Recursion","Routing","Replication"],"answer":"Reflection","explanation":"Distributed Reflection DoS uses reflector systems between attacker and target.","id":"S05Q08"},{"concept_id":"DoS/DDoS Concepts::Blackholing","variant":1,"category":"DoS/DDoS Concepts","question":"What does blackholing do to routed traffic?","choices":["Drops traffic","Duplicates traffic","Encrypts traffic","Reassembles fragments"],"answer":"Drops traffic","explanation":"Black-hole filtering discards traffic at the routing level.","id":"S05Q09"},{"concept_id":"DDoS Case Study::Case hit list","variant":2,"category":"DDoS Case Study","question":"Compromise grows rapidly because the remaining list is divided among bots. What scan is this?","choices":["Hit-list Scanning","Random Scanning","Local Subnet Scanning","Topological Scanning"],"answer":"Hit-list Scanning","explanation":"Hit-list scanning splits a prebuilt target list to accelerate propagation.","id":"S05Q10"},{"concept_id":"DoS/DDoS Protection Tools::A10 availability","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which A10 Thunder TPS feature focuses on keeping services online?","choices":["Maintain service availability","Generate botnets","Disable logging","Spoof source addresses"],"answer":"Maintain service availability","explanation":"The course lists maintaining service availability as an A10 Thunder TPS feature.","id":"S05Q11"},{"concept_id":"Botnets::Topological source","variant":2,"category":"Botnets","question":"What method discovers new targets from local URLs or other topology clues?","choices":["Topological scanning","Random scanning","Hit-list scanning","Permutation scanning"],"answer":"Topological scanning","explanation":"Topological scanning uses information such as URLs found on the infected system.","id":"S05Q12"},{"concept_id":"DoS/DDoS Attack Techniques::Memcached amp","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which high-response UDP-capable service appears in the amplification examples?","choices":["memcached","PostgreSQL","SSH","Kerberos"],"answer":"memcached","explanation":"memcached is listed among common amplification sources.","id":"S05Q13"},{"concept_id":"DoS/DDoS Concepts::ICMP echo","variant":1,"category":"DoS/DDoS Concepts","question":"Which message type is central to Smurf and ICMP flood behavior?","choices":["ICMP Echo Request","TCP SYN-ACK","UDP ACK","ARP Reply"],"answer":"ICMP Echo Request","explanation":"Smurf and ICMP floods use ICMP Echo Requests.","id":"S05Q14"},{"concept_id":"Botnets::Primary target","variant":1,"category":"Botnets","question":"What is attacked at the end of the typical botnet process?","choices":["Primary target organization","C&C owner","Honeypot operator","Bot affiliate"],"answer":"Primary target organization","explanation":"The final attack is directed at the primary target.","id":"S05Q15"},{"concept_id":"DoS/DDoS Attack Countermeasures::Disable services","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which hardening step reduces unnecessary exposure on secondary victims?","choices":["Disable/uninstall unnecessary services and apps","Enable all daemons","Increase idle timeouts","Open all inbound ports"],"answer":"Disable/uninstall unnecessary services and apps","explanation":"Reducing unnecessary services lowers the attack surface for bot infection.","id":"S05Q16"},{"concept_id":"DoS/DDoS Protection Tools::Attack classification","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which set belongs entirely to traffic-generation/offensive tooling?","choices":["HOIC, LOIC, HULK","Akamai, Nexusguard, BlockDoS","A10 Thunder TPS, LOIC, Akamai","Stormwall PRO, UFONet, Nexusguard"],"answer":"HOIC, LOIC, HULK","explanation":"HOIC, LOIC, and HULK are listed as attack tools.","id":"S05Q17"},{"concept_id":"DoS/DDoS Attack Techniques::Ping of Death","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack uses malformed or oversized ping packets?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"Ping of Death","explanation":"Ping of Death uses malformed or oversized ping packets.","id":"S05Q18"},{"concept_id":"DoS/DDoS Concepts::Protocol target","variant":2,"category":"DoS/DDoS Concepts","question":"Which resource is targeted by SYN floods and fragmentation attacks?","choices":["Connection state tables","Disk encryption keys","Application source code","Browser cookies"],"answer":"Connection state tables","explanation":"Protocol attacks consume state in infrastructure such as firewalls, load balancers, and servers.","id":"S05Q19"},{"concept_id":"Botnets::Callback step","variant":2,"category":"Botnets","question":"Which action registers the new bot for future instructions?","choices":["It connects back to C&C","It disconnects permanently","It becomes a honeypot","It disables networking"],"answer":"It connects back to C&C","explanation":"Infected bots connect back to C&C infrastructure.","id":"S05Q20"},{"concept_id":"DoS/DDoS Attack Countermeasures::AI anomaly","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What control uses machine learning to detect abnormal attack patterns?","choices":["AI/ML anomaly detection","Static NAT only","WEP encryption","Manual DNS recursion"],"answer":"AI/ML anomaly detection","explanation":"AI/ML anomaly detection can identify traffic deviations associated with DDoS.","id":"S05Q21"},{"concept_id":"Botnets::Bot purposes DDoS","variant":1,"category":"Botnets","question":"Which botnet use directly targets service availability?","choices":["DDoS attacks","Certificate enrollment","Patch management","Backups"],"answer":"DDoS attacks","explanation":"Botnets are commonly used to launch DDoS attacks.","id":"S05Q22"},{"concept_id":"DoS/DDoS Concepts::Bandwidth depletion types","variant":1,"category":"DoS/DDoS Concepts","question":"What are the two bandwidth-depletion attack types in the course?","choices":["Flood and amplification","Spoofing and phishing","Scanning and enumeration","Injection and traversal"],"answer":"Flood and amplification","explanation":"The course divides bandwidth depletion into flood attacks and amplification attacks.","id":"S05Q23"},{"concept_id":"DoS/DDoS Protection Tools::Nexusguard","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which name in the course is a defensive service rather than an attack generator?","choices":["Nexusguard","LOIC","HOIC","HULK"],"answer":"Nexusguard","explanation":"Nexusguard is listed among DDoS protection services.","id":"S05Q24"},{"concept_id":"DoS/DDoS Attack Countermeasures::DHCP snooping binding","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which Layer-2 security table maps legitimate source bindings for filtering?","choices":["DHCP snooping binding database","DNS cache","ARP cache only","BGP RIB"],"answer":"DHCP snooping binding database","explanation":"The course says IP Source Guard can filter based on DHCP snooping bindings.","id":"S05Q25"},{"concept_id":"DoS/DDoS Attack Techniques::Slowloris pool","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which server capacity is consumed by many incomplete HTTP connections?","choices":["Connection pool/worker threads","DNS cache only","Disk partition table","Routing protocol IDs"],"answer":"Connection pool/worker threads","explanation":"Slowloris exhausts available server connection or worker capacity.","id":"S05Q26"},{"concept_id":"Botnets::Spoof source clue","variant":2,"category":"Botnets","question":"What addressing anomaly may reveal forged packets from a subnet?","choices":["Source address does not fit the expected subnet","Every packet uses TLS","The victim uses DHCP","The attacker uses a browser"],"answer":"Source address does not fit the expected subnet","explanation":"Spoofed addresses may be invalid or implausible for the claimed network segment.","id":"S05Q27"},{"concept_id":"DoS/DDoS Attack Techniques::SSDP amp","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which discovery protocol is listed as an amplification source?","choices":["SSDP","SFTP","SIP-TLS","SNMP Trap only"],"answer":"SSDP","explanation":"SSDP is listed among amplification protocols.","id":"S05Q28"},{"concept_id":"DoS/DDoS Concepts::Zombie","variant":1,"category":"DoS/DDoS Concepts","question":"What is a compromised machine participating in a DDoS commonly called?","choices":["Zombie agent","Reflector","Load balancer","Honeypot"],"answer":"Zombie agent","explanation":"Zombie agents are compromised systems used to generate attack traffic.","id":"S05Q29"},{"concept_id":"DoS/DDoS Concepts::Load balancing","variant":2,"category":"DoS/DDoS Concepts","question":"Which strategy spreads legitimate and attack load across capacity?","choices":["Distributes traffic across resources","Spoofs source addresses","Creates botnet handlers","Disables connection tracking"],"answer":"Distributes traffic across resources","explanation":"Load balancing spreads work across multiple resources to preserve availability.","id":"S05Q30"},{"concept_id":"DoS/DDoS Protection Tools::Cloudflare","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which provider in the supplementary notes is used as a DDoS mitigation/CDN service?","choices":["Cloudflare","LOIC","HULK","Slowloris"],"answer":"Cloudflare","explanation":"The supplementary notes list Cloudflare as a DDoS mitigation/CDN service.","id":"S05Q31"},{"concept_id":"DoS/DDoS Protection Tools::A10 vs LOIC","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which option is designed to defend service availability rather than generate flood traffic?","choices":["A10 Thunder TPS","LOIC","HOIC","HULK"],"answer":"A10 Thunder TPS","explanation":"A10 Thunder TPS is a defensive DDoS protection platform; LOIC, HOIC, and HULK are attack tools.","id":"S05Q32"},{"concept_id":"DoS/DDoS Attack Techniques::UDP flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which flood makes the target repeatedly return ICMP Destination Unreachable messages?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"UDP Flood","explanation":"A UDP flood sends high-rate UDP packets to random ports, forcing service checks and ICMP errors.","id":"S05Q33"},{"concept_id":"DoS/DDoS Attack Countermeasures::Load balance","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What capacity strategy reduces impact by distributing traffic?","choices":["Load balancing","Blackholing","Spoofing","Fragmentation"],"answer":"Load balancing","explanation":"Load balancing distributes traffic across multiple resources.","id":"S05Q34"},{"concept_id":"DDoS Case Study::Case slowloris","variant":1,"category":"DDoS Case Study","question":"A web server has many connections waiting on unfinished request headers. Which attack fits?","choices":["Slowloris","RUDY","Slow Read","Apache Killer"],"answer":"Slowloris","explanation":"Slowloris keeps many HTTP requests incomplete to exhaust connection resources.","id":"S05Q35"},{"concept_id":"DoS/DDoS Attack Techniques::Apache Killer","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which technique drives memory use by asking a server to assemble overlapping ranges?","choices":["Apache Killer","Slowloris","RUDY","Slow Read"],"answer":"Apache Killer","explanation":"Apache Killer abuses overlapping byte-range requests to increase memory consumption.","id":"S05Q36"},{"concept_id":"Botnets::Affiliate role","variant":2,"category":"Botnets","question":"Which participants help supply malware and DDoS toolkit content?","choices":["Malware/toolkit resources","Victim backups","ISP ACLs","Honeypot logs"],"answer":"Malware/toolkit resources","explanation":"Affiliates contribute malware and toolkit resources in the described botnet setup.","id":"S05Q37"},{"concept_id":"DDoS Case Study::Case slow read","variant":2,"category":"DDoS Case Study","question":"The response connection stays open because the client reads extremely slowly. What is this?","choices":["Slow Read","RUDY","Slowloris","Apache Killer"],"answer":"Slow Read","explanation":"Slow Read keeps response-side resources occupied by consuming data very slowly.","id":"S05Q38"},{"concept_id":"DoS/DDoS Concepts::PDoS concept","variant":2,"category":"DoS/DDoS Concepts","question":"Which characteristic defines phlashing?","choices":["Irreversible hardware/firmware damage","Temporary bandwidth spike","One slow HTTP session","DNS cache poisoning"],"answer":"Irreversible hardware/firmware damage","explanation":"PDoS or phlashing aims to brick a device through damaging firmware/hardware state.","id":"S05Q39"},{"concept_id":"Botnets::Permutation list","variant":1,"category":"Botnets","question":"Which scanning method uses a shared pseudorandom permutation of IP addresses?","choices":["Permutation Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning uses a common pseudorandom ordering of addresses.","id":"S05Q40"},{"concept_id":"DoS/DDoS Attack Techniques::Vol bps","variant":2,"category":"DoS/DDoS Attack Techniques","question":"What category includes UDP flood, ICMP flood, and NTP amplification?","choices":["Volumetric attacks","Protocol attacks","Application-layer attacks","Permanent attacks"],"answer":"Volumetric attacks","explanation":"Volumetric attacks are measured in bits per second.","id":"S05Q41"},{"concept_id":"DoS/DDoS Attack Countermeasures::Egress","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which filtering direction blocks spoofed traffic leaving your network?","choices":["Egress filtering","Ingress filtering","Blackholing","Honeypotting"],"answer":"Egress filtering","explanation":"Egress filtering checks outbound traffic and reduces spoofed-source abuse from your network.","id":"S05Q42"},{"concept_id":"DoS/DDoS Attack Countermeasures::Spoofed address detection","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What addressing check can expose packets claiming implausible local sources?","choices":["Invalid/unexpected source addresses","Strong TLS ciphers","Long DNS names","Valid DHCP leases"],"answer":"Invalid/unexpected source addresses","explanation":"Spoofed source addresses may not match legitimate subnet assignments.","id":"S05Q43"},{"concept_id":"DoS/DDoS Attack Techniques::DRDoS","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which architecture uses intermediary and secondary victims before traffic reaches the primary target?","choices":["DRDoS","Slowloris","LAND","PDoS"],"answer":"DRDoS","explanation":"Distributed Reflection DoS uses intermediary systems to direct responses toward the primary target.","id":"S05Q44"},{"concept_id":"DDoS Case Study::Case pps","variant":1,"category":"DDoS Case Study","question":"A firewall state table collapses under millions of packets per second. Which category fits?","choices":["Protocol attack","Volumetric attack","Application-layer attack","Physical attack"],"answer":"Protocol attack","explanation":"Protocol attacks are measured in pps and target network/state infrastructure.","id":"S05Q45"},{"concept_id":"DoS/DDoS Attack Countermeasures::Awareness bots","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which human control reduces bot infections caused by unsafe behavior?","choices":["Security awareness","Blackholing","Packet fragmentation","Open broadcasting"],"answer":"Security awareness","explanation":"Awareness reduces infection opportunities that feed botnets.","id":"S05Q46"},{"concept_id":"DoS/DDoS Attack Techniques::RUDY","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which slow attack uses a very large Content-Length and sends the body one byte at a time?","choices":["RUDY","Slowloris","Slow Read","Apache Killer"],"answer":"RUDY","explanation":"RUDY targets the HTTP request body with a deliberately slow POST.","id":"S05Q47"},{"concept_id":"DoS/DDoS Attack Techniques::Firmware corruption","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which DoS technique relies on fraudulent hardware-update content?","choices":["Permanent DoS (PDoS)","SYN Flood","DNS Amplification","ICMP Flood"],"answer":"Permanent DoS (PDoS)","explanation":"PDoS can brick devices by installing corrupted firmware.","id":"S05Q48"},{"concept_id":"DoS/DDoS Concepts::DDoS command flow","variant":2,"category":"DoS/DDoS Concepts","question":"Which control path triggers zombie traffic in the course DDoS flow?","choices":["Attacker through handlers/C&C","Victim through DNS","ISP through DHCP","Honeypot through NAT"],"answer":"Attacker through handlers/C&C","explanation":"The attacker uses handlers or C&C infrastructure to direct zombies against the victim.","id":"S05Q49"},{"concept_id":"DDoS Case Study::Case permutation","variant":2,"category":"DDoS Case Study","question":"The scan avoids duplicate work by coordinating a common permuted address list. What is it?","choices":["Permutation Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning coordinates address coverage with a shared pseudorandom list.","id":"S05Q50"}],[{"concept_id":"Botnets::Random scan definition","variant":1,"category":"Botnets","question":"Which botnet scanning method probes addresses randomly?","choices":["Random scanning","Hit-list scanning","Topological scanning","Local subnet scanning"],"answer":"Random scanning","explanation":"Random scanning probes addresses randomly within the target range.","id":"S06Q01"},{"concept_id":"Botnets::Handler count","variant":2,"category":"Botnets","question":"What structural property makes handler takedown valuable?","choices":["There are fewer handlers than agents","Handlers have no network address","Agents cannot receive commands","Handlers are always inside the victim"],"answer":"There are fewer handlers than agents","explanation":"A small number of handlers can control many agents, so disabling them can affect many bots.","id":"S06Q02"},{"concept_id":"DDoS Case Study::Case DNS amp","variant":2,"category":"DDoS Case Study","question":"Large unsolicited DNS replies hit a target that never sent the queries. What is occurring?","choices":["DNS Amplification","Slow Read","SYN Flood","LAND"],"answer":"DNS Amplification","explanation":"DNS amplification uses spoofed UDP queries and larger reflected responses.","id":"S06Q03"},{"concept_id":"DDoS Case Study::Case ACK","variant":1,"category":"DDoS Case Study","question":"A target receives huge volumes of spoofed ACK and PUSH-ACK packets. Which technique fits?","choices":["ACK/PUSH-ACK Flood","SYN Flood","Smurf","RUDY"],"answer":"ACK/PUSH-ACK Flood","explanation":"ACK/PUSH-ACK flood overwhelms the target with forged acknowledgment traffic.","id":"S06Q04"},{"concept_id":"DoS/DDoS Attack Techniques::SYN flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack leaves many TCP handshakes incomplete?","choices":["SYN Flood","SYN-ACK Flood","ACK Flood","Fragmentation Attack"],"answer":"SYN Flood","explanation":"A SYN flood sends SYNs but does not complete the final ACK.","id":"S06Q05"},{"concept_id":"DoS/DDoS Concepts::Resource consumption","variant":1,"category":"DoS/DDoS Concepts","question":"Which effect is common to many DoS attacks?","choices":["Resource exhaustion","Privilege inheritance","Certificate renewal","Database normalization"],"answer":"Resource exhaustion","explanation":"DoS commonly consumes bandwidth, CPU, memory, connection state, or other resources.","id":"S06Q06"},{"concept_id":"DoS/DDoS Concepts::Bandwidth distributed claim","variant":2,"category":"DoS/DDoS Concepts","question":"What architecture is used to exceed a target with more bandwidth than one attacker has?","choices":["A distributed botnet","A single local process only","A userland jailbreak","A DNSSEC signer"],"answer":"A distributed botnet","explanation":"The supplied notes emphasize botnets for modern bandwidth-based denial of service.","id":"S06Q07"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 4","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which name provides mitigation rather than connection exhaustion?","choices":["Stormwall PRO","Slowloris","slowhttptest","HULK"],"answer":"Stormwall PRO","explanation":"Stormwall PRO is a defensive DDoS protection service.","id":"S06Q08"},{"concept_id":"DoS/DDoS Protection Tools::CDN role","variant":1,"category":"DoS/DDoS Protection Tools","question":"What is the main defensive value of an edge/CDN provider during DDoS?","choices":["Distributed edge capacity","Source spoofing","Credential harvesting","Firmware flashing"],"answer":"Distributed edge capacity","explanation":"A CDN/edge network can absorb and distribute large traffic volumes.","id":"S06Q09"},{"concept_id":"Botnets::C&C role","variant":2,"category":"Botnets","question":"Which system distributes commands after compromise?","choices":["C&C center","Victim CDN","Public DNS resolver","Honeypot"],"answer":"C&C center","explanation":"Bots connect to command-and-control infrastructure.","id":"S06Q10"},{"concept_id":"DoS/DDoS Attack Techniques::App low bandwidth","variant":2,"category":"DoS/DDoS Attack Techniques","question":"What property makes Layer-7 DoS less dependent on raw bandwidth?","choices":["They consume expensive application resources","They always use broadcast addresses","They require fragmented IP packets","They disable routing protocols"],"answer":"They consume expensive application resources","explanation":"Layer-7 attacks can exhaust costly server resources with relatively little traffic.","id":"S06Q11"},{"concept_id":"DoS/DDoS Attack Countermeasures::Multicloud","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What resilience strategy spreads major applications across multiple clouds?","choices":["Multi-cloud deployment","Single-host deployment","Flat VLAN design","Local-only caching"],"answer":"Multi-cloud deployment","explanation":"Multi-cloud deployment can increase resilience and capacity diversity.","id":"S06Q12"},{"concept_id":"DoS/DDoS Attack Countermeasures::Post-forensics phase","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which countermeasure category analyzes evidence after the attack has ended?","choices":["Post-attack Forensics","Mitigate Attacks","Deflect Attacks","Protect Secondary Victims"],"answer":"Post-attack Forensics","explanation":"Post-attack forensics analyzes logs, identifies the attack type, and supports traceback.","id":"S06Q13"},{"concept_id":"DoS/DDoS Concepts::Protocol infrastructure","variant":1,"category":"DoS/DDoS Concepts","question":"Which devices are commonly stressed by protocol attacks?","choices":["Firewalls, load balancers, and servers","Only DNS root servers","Only user browsers","Only storage arrays"],"answer":"Firewalls, load balancers, and servers","explanation":"Protocol attacks consume connection/state resources in network infrastructure and servers.","id":"S06Q14"},{"concept_id":"DoS/DDoS Concepts::Reflector","variant":2,"category":"DoS/DDoS Concepts","question":"What role unintentionally amplifies a reflected DDoS attack?","choices":["Reflector","Handler","Honeypot","Zombie owner"],"answer":"Reflector","explanation":"Reflectors believe the spoofed request came from the victim and send responses there.","id":"S06Q15"},{"concept_id":"DoS/DDoS Protection Tools::Packet Flooder","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which tool name directly indicates packet flooding?","choices":["Packet Flooder Tool","A10 Thunder TPS","Nexusguard","Huawei AntiDDoS1000"],"answer":"Packet Flooder Tool","explanation":"Packet Flooder Tool from NetScanTools is listed as an attack tool.","id":"S06Q16"},{"concept_id":"DoS/DDoS Attack Techniques::App rps","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which DoS class is measured in requests per second?","choices":["Application-layer attacks","Protocol attacks","Volumetric attacks","Physical attacks"],"answer":"Application-layer attacks","explanation":"Application-layer attacks are measured in requests per second.","id":"S06Q17"},{"concept_id":"DoS/DDoS Attack Countermeasures::Limit broadcast","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What should be restricted to reduce Smurf-style amplification exposure?","choices":["Network broadcasting","TLS certificates","SSH keys","Application logs"],"answer":"Network broadcasting","explanation":"Limiting broadcast behavior reduces classic amplification opportunities.","id":"S06Q18"},{"concept_id":"Botnets::Bot purposes spam","variant":1,"category":"Botnets","question":"Which botnet use abuses many hosts to send unwanted messages?","choices":["Spam/mass mailing","Secure backups","TLS offload","Database normalization"],"answer":"Spam/mass mailing","explanation":"Botnets can generate spam and mass mailing campaigns.","id":"S06Q19"},{"concept_id":"DoS/DDoS Attack Techniques::Slow resource model","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What unifies Slowloris, RUDY, Apache Killer, and Slow Read?","choices":["Hold server resources with minimal traffic","Saturate the WAN with raw bandwidth","Exploit broadcast ICMP only","Corrupt firmware"],"answer":"Hold server resources with minimal traffic","explanation":"Slow attacks consume server-side resources while generating comparatively little traffic.","id":"S06Q20"},{"concept_id":"DoS/DDoS Concepts::Half-open concept","variant":2,"category":"DoS/DDoS Concepts","question":"Which missing handshake step leaves a pending TCP connection?","choices":["Final ACK","Initial SYN","SYN-ACK","FIN-ACK"],"answer":"Final ACK","explanation":"A SYN flood leaves the handshake incomplete by never sending the final ACK.","id":"S06Q21"},{"concept_id":"DoS/DDoS Attack Techniques::ACK flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which protocol flood uses established-session flags without a legitimate session?","choices":["ACK/PUSH-ACK Flood","SYN Flood","Smurf","Slowloris"],"answer":"ACK/PUSH-ACK Flood","explanation":"ACK and PUSH-ACK floods overwhelm processing with spoofed acknowledgment traffic.","id":"S06Q22"},{"concept_id":"Botnets::Malicious redirect","variant":1,"category":"Botnets","question":"What is the role of a malicious website in botnet growth?","choices":["Redirect/expose users to malware","Perform upstream filtering","Issue SYN cookies","Run a honeynet"],"answer":"Redirect/expose users to malware","explanation":"Malicious or compromised sites expose victims to infection content.","id":"S06Q23"},{"concept_id":"DoS/DDoS Attack Techniques::Fraggle","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which broadcast amplification attack replaces ICMP with UDP?","choices":["Fraggle","Smurf","LAND","Teardrop"],"answer":"Fraggle","explanation":"Fraggle is similar to Smurf but uses UDP broadcast traffic.","id":"S06Q24"},{"concept_id":"DoS/DDoS Protection Tools::Upstream service","variant":2,"category":"DoS/DDoS Protection Tools","question":"Where should filtering occur to stop traffic before it reaches the organization?","choices":["Upstream ISP/DDoS provider","Only on the victim browser","Only after the web app","Only inside the database"],"answer":"Upstream ISP/DDoS provider","explanation":"Upstream filtering can remove attack traffic before the victim link is overwhelmed.","id":"S06Q25"},{"concept_id":"DoS/DDoS Concepts::Legacy concept","variant":1,"category":"DoS/DDoS Concepts","question":"Why do older attacks like LAND and Teardrop still matter for CEH?","choices":["Historically important and still exam-relevant","Most effective against all current systems","Required for WPA cracking","Used only for phishing"],"answer":"Historically important and still exam-relevant","explanation":"Modern stacks usually handle many classic attacks, but they remain important exam concepts.","id":"S06Q26"},{"concept_id":"DoS/DDoS Concepts::Amplification","variant":1,"category":"DoS/DDoS Concepts","question":"Which concept turns a small request into a much larger response?","choices":["Amplification","Encapsulation","Tunneling","Defragmentation"],"answer":"Amplification","explanation":"Amplification produces a response much larger than the triggering request.","id":"S06Q27"},{"concept_id":"DoS/DDoS Attack Countermeasures::Rate limit","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which preventive control caps traffic or request frequency?","choices":["Rate limiting","Blackholing","Honeynetting","Port mirroring"],"answer":"Rate limiting","explanation":"Rate limiting restricts how much traffic or how many requests can be accepted over time.","id":"S06Q28"},{"concept_id":"DoS/DDoS Attack Countermeasures::Low interaction","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which decoy offers fewer real services and less attacker interaction?","choices":["Low-interaction honeypot","High-interaction honeypot","Black hole route","Load balancer"],"answer":"Low-interaction honeypot","explanation":"Low-interaction honeypots emulate limited services with reduced exposure.","id":"S06Q29"},{"concept_id":"DoS/DDoS Attack Techniques::Smurf duplicates","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What happens after one spoofed Smurf request hits a broadcast network?","choices":["Many hosts send replies to the victim","The victim sends SYN cookies","The router reassembles fragments","The DNS server resets connections"],"answer":"Many hosts send replies to the victim","explanation":"Every responding host on the broadcast network can send an ICMP reply to the victim.","id":"S06Q30"},{"concept_id":"DoS/DDoS Protection Tools::Cloud providers group","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which set represents hyperscale infrastructure rather than attack tools?","choices":["AWS, Azure, Google Cloud","LOIC, HOIC, HULK","Akamai, LOIC, Azure","Nexusguard, HULK, AWS"],"answer":"AWS, Azure, Google Cloud","explanation":"The supplementary notes name AWS, Azure, and Google Cloud as large-scale capacity options.","id":"S06Q31"},{"concept_id":"DoS/DDoS Attack Techniques::Amplification spoofing","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What is required so amplification replies hit the victim instead of the attacker?","choices":["Source IP address","Destination MAC only","TCP window scale","HTTP User-Agent"],"answer":"Source IP address","explanation":"The attacker spoofs the victim as the request source so responses are sent to the victim.","id":"S06Q32"},{"concept_id":"DoS/DDoS Attack Countermeasures::Throttling","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What capacity-management technique slows traffic rather than dropping everything?","choices":["Throttling","Amplification","Reflection","Port scanning"],"answer":"Throttling","explanation":"Throttling limits traffic to reduce overload.","id":"S06Q33"},{"concept_id":"DoS/DDoS Concepts::Volumetric target","variant":1,"category":"DoS/DDoS Concepts","question":"What resource do volumetric attacks primarily exhaust?","choices":["Bandwidth","Authentication tokens","File permissions","Code-signing keys"],"answer":"Bandwidth","explanation":"Volumetric attacks primarily consume network bandwidth.","id":"S06Q34"},{"concept_id":"DoS/DDoS Attack Countermeasures::Slow timeout","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which defense is especially useful against Slowloris-style idle connections?","choices":["Connection timeouts","Longer keepalive","Open recursive DNS","Broadcast forwarding"],"answer":"Connection timeouts","explanation":"Connection timeouts release resources held by incomplete slow clients.","id":"S06Q35"},{"concept_id":"Botnets::Hitlist growth","variant":2,"category":"Botnets","question":"What list-based method scales rapidly as each new bot receives part of the list?","choices":["Hit-list scanning","Random scanning","Local subnet scanning","Topological scanning"],"answer":"Hit-list scanning","explanation":"Hit-list splitting enables very fast, exponential-style propagation.","id":"S06Q36"},{"concept_id":"DoS/DDoS Protection Tools::HULK","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which name belongs to the attack-tool list rather than the protection-service list?","choices":["HULK","Imperva DDoS Protection","Nexusguard","BlockDoS"],"answer":"HULK","explanation":"HULK is listed as a DoS/DDoS attack tool.","id":"S06Q37"},{"concept_id":"DoS/DDoS Attack Countermeasures::Distributed servers","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What resilience strategy uses multiple distributed servers or colocation backups?","choices":["Distributed server model","Single server only","One flat subnet","One upstream link only"],"answer":"Distributed server model","explanation":"Distributed server models reduce single points of failure.","id":"S06Q38"},{"concept_id":"DoS/DDoS Protection Tools::A10 scale","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which A10 Thunder TPS feature supports larger deployments and attack volumes?","choices":["Scalable protection","Static single-host design","No monitoring","Open relay support"],"answer":"Scalable protection","explanation":"The course lists scalable protection as a Thunder TPS feature.","id":"S06Q39"},{"concept_id":"DoS/DDoS Attack Techniques::SACK panic","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which protocol attack targets Linux socket-buffer handling?","choices":["TCP SACK Panic","SYN-ACK Flood","Teardrop","LAND"],"answer":"TCP SACK Panic","explanation":"TCP SACK Panic exploits malformed SACK/MSS handling in Linux networking.","id":"S06Q40"},{"concept_id":"DDoS Case Study::Case fragmentation","variant":1,"category":"DDoS Case Study","question":"The victim spends resources on IP pieces that never form valid packets. Which attack fits?","choices":["Fragmentation Attack","Teardrop","SYN Flood","HTTP POST Attack"],"answer":"Fragmentation Attack","explanation":"A fragmentation attack floods the target with fragments that cannot be reassembled.","id":"S06Q41"},{"concept_id":"DDoS Case Study::Case SACK","variant":2,"category":"DDoS Case Study","question":"Socket-buffer accounting overflows after crafted SACK traffic. What is this?","choices":["TCP SACK Panic","SYN Flood","Teardrop","LAND"],"answer":"TCP SACK Panic","explanation":"The course describes TCP SACK Panic as a Linux kernel DoS involving malformed SACK/MSS values.","id":"S06Q42"},{"concept_id":"Botnets::Malware infection","variant":1,"category":"Botnets","question":"What typically turns a normal endpoint into a zombie?","choices":["Malware infection","Load balancing","Traffic scrubbing","DNSSEC validation"],"answer":"Malware infection","explanation":"Bots are usually created by infecting endpoints with malware.","id":"S06Q43"},{"concept_id":"DDoS Case Study::Case DRDoS","variant":1,"category":"DDoS Case Study","question":"Traffic reaches the victim through multiple reflector systems rather than directly from bots. Which architecture fits?","choices":["DRDoS","SYN Flood","Slowloris","PDoS"],"answer":"DRDoS","explanation":"DRDoS uses distributed reflection through intermediary systems.","id":"S06Q44"},{"concept_id":"DoS/DDoS Concepts::Traffic scrubbing","variant":2,"category":"DoS/DDoS Concepts","question":"Which mitigation separates malicious traffic from legitimate traffic before delivery?","choices":["Filter attack traffic and forward clean traffic","Encrypt every packet end-to-end","Disable DNS resolution","Create additional bots"],"answer":"Filter attack traffic and forward clean traffic","explanation":"Scrubbing services inspect traffic and forward cleaner traffic to the protected service.","id":"S06Q45"},{"concept_id":"DoS/DDoS Attack Countermeasures::Third party","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which strategy outsources attack absorption or filtering?","choices":["Third-party DDoS protection","Open recursive DNS","Default router rules","Longer timeouts"],"answer":"Third-party DDoS protection","explanation":"Third-party protection services can absorb and filter large attacks.","id":"S06Q46"},{"concept_id":"DDoS Case Study::Case handler takedown","variant":2,"category":"DDoS Case Study","question":"A small number of control nodes were removed to neutralize many agents. What countermeasure concept is this?","choices":["Neutralize botnet handlers","Increase bot bandwidth","Enable WPS","Disable logging"],"answer":"Neutralize botnet handlers","explanation":"Handlers are fewer than agents, so neutralizing them can disrupt many bots at once.","id":"S06Q47"},{"concept_id":"DoS/DDoS Attack Techniques::SACK MSS","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which MSS setting is associated with the Linux socket-buffer overflow condition?","choices":["48 bytes","64 KB","1500 bytes","576 bytes"],"answer":"48 bytes","explanation":"The course highlights an MSS of 48 bytes in the SACK panic scenario.","id":"S06Q48"},{"concept_id":"DoS/DDoS Concepts::Layer7 target","variant":2,"category":"DoS/DDoS Concepts","question":"Where do slow HTTP attacks operate?","choices":["Application layer","Physical layer","Data-link layer","Presentation-only layer"],"answer":"Application layer","explanation":"HTTP-based resource-exhaustion attacks operate at the application layer.","id":"S06Q49"},{"concept_id":"Botnets::Permutation reinfection","variant":2,"category":"Botnets","question":"What method improves efficiency by coordinating address coverage?","choices":["Permutation Scanning","Random Scanning","Topological Scanning","Local Subnet Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning reduces duplicate infection attempts.","id":"S06Q50"}],[{"concept_id":"DoS/DDoS Protection Tools::Huawei","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which protection tool name includes AntiDDoS1000?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"Huawei AntiDDoS1000","explanation":"Huawei AntiDDoS1000 is listed among DoS/DDoS protection products.","id":"S07Q01"},{"concept_id":"DoS/DDoS Concepts::Broadcast amplification","variant":1,"category":"DoS/DDoS Concepts","question":"What network feature makes Smurf-style amplification possible?","choices":["Broadcast address","Loopback address","Multicast DNS only","Default gateway MAC"],"answer":"Broadcast address","explanation":"A broadcast request can trigger replies from many hosts at once.","id":"S07Q02"},{"concept_id":"DoS/DDoS Attack Techniques::SACK overflow","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What failure leads to kernel panic in the SACK attack?","choices":["Integer overflow","SQL injection","Race-free deadlock","Format-string write"],"answer":"Integer overflow","explanation":"The course describes an integer overflow in the Linux Socket Buffer path leading to kernel panic.","id":"S07Q03"},{"concept_id":"DDoS Case Study::Case local subnet","variant":1,"category":"DDoS Case Study","question":"A bot behind a firewall searches neighboring private addresses. Which method fits?","choices":["Local Subnet Scanning","Random Scanning","Hit-list Scanning","Permutation Scanning"],"answer":"Local Subnet Scanning","explanation":"Local subnet scanning targets nearby internal systems.","id":"S07Q04"},{"concept_id":"DoS/DDoS Attack Techniques::SYN timeout","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack relies on incomplete connections remaining queued for a timeout period?","choices":["SYN Flood","ICMP Flood","Slow Read","Smurf"],"answer":"SYN Flood","explanation":"SYN flood pressure comes from pending connections held until completion or timeout.","id":"S07Q05"},{"concept_id":"DoS/DDoS Attack Countermeasures::SensorBase","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which intelligence source updates Cisco IPS reputation data in the course?","choices":["Cisco SensorBase Network","DNS root hints","NTP pool","DHCP snooping table"],"answer":"Cisco SensorBase Network","explanation":"The course names Cisco SensorBase as the reputation source.","id":"S07Q06"},{"concept_id":"DoS/DDoS Attack Techniques::Smurf","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which amplification attack makes many hosts send ICMP replies to one victim?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"Smurf","explanation":"Smurf uses ICMP broadcast amplification with the victim address spoofed as the source.","id":"S07Q07"},{"concept_id":"DoS/DDoS Attack Countermeasures::Antivirus bots","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which control helps prevent endpoints from becoming DDoS agents?","choices":["Anti-virus and anti-Trojan software","Open relays","WPS","Anonymous FTP"],"answer":"Anti-virus and anti-Trojan software","explanation":"Updated anti-malware helps prevent compromise into botnet agents.","id":"S07Q08"},{"concept_id":"DoS/DDoS Protection Tools::UFONet","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which tool belongs to the DoS/DDoS attack-tool list rather than the defensive product list?","choices":["UFONet","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"UFONet","explanation":"UFONet is listed among attack tools.","id":"S07Q09"},{"concept_id":"DoS/DDoS Attack Techniques::Single-request flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which HTTP flood conceals multiple requests inside one packet/session?","choices":["Single-Request HTTP Flood","Single-Session HTTP Flood","Recursive GET Flood","Slowloris"],"answer":"Single-Request HTTP Flood","explanation":"The course describes single-request HTTP flood as concealing multiple requests inside a single packet/session.","id":"S07Q10"},{"concept_id":"Botnets::Permutation cipher","variant":2,"category":"Botnets","question":"What propagation scheme generates its shared address order cryptographically?","choices":["Permutation Scanning","Random Scanning","Local Subnet Scanning","Hit-list Scanning"],"answer":"Permutation Scanning","explanation":"The course describes permutation scanning as using a 32-bit block cipher with a preselected key.","id":"S07Q11"},{"concept_id":"DoS/DDoS Concepts::Connection timeout","variant":2,"category":"DoS/DDoS Concepts","question":"Which server behavior frees resources held by idle clients?","choices":["Close incomplete/idle connections sooner","Increase response body size","Disable logging","Extend session lifetime"],"answer":"Close incomplete/idle connections sooner","explanation":"Shorter timeouts release resources tied up by deliberately slow or incomplete clients.","id":"S07Q12"},{"concept_id":"DDoS Case Study::Case random scan","variant":1,"category":"DDoS Case Study","question":"A worm-infected bot probes arbitrary IPs and creates lots of redundant scan traffic. Which method fits?","choices":["Random Scanning","Hit-list Scanning","Topological Scanning","Permutation Scanning"],"answer":"Random Scanning","explanation":"Random scanning probes addresses without coordinated target allocation.","id":"S07Q13"},{"concept_id":"DoS/DDoS Attack Countermeasures::Cisco reputation","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which defense uses source reputation to identify known malicious IPs/services?","choices":["Source IP Reputation Filtering","Black Hole Filtering","TCP Intercept","Connection Timeout"],"answer":"Source IP Reputation Filtering","explanation":"Source IP reputation filtering uses threat intelligence to identify suspicious sources.","id":"S07Q14"},{"concept_id":"DoS/DDoS Attack Countermeasures::Protect secondary","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Where do anti-malware, user awareness, and service hardening fit?","choices":["Protect Secondary Victims","Deflect Attacks","Mitigate Attacks","Post-attack Forensics"],"answer":"Protect Secondary Victims","explanation":"Protecting secondary victims reduces the number of systems available as DDoS agents.","id":"S07Q15"},{"concept_id":"DoS/DDoS Protection Tools::HOIC","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which attack tool is the higher-orbit counterpart to LOIC?","choices":["HOIC","LOIC","HULK","UFONet"],"answer":"HOIC","explanation":"HOIC stands for High Orbit Ion Cannon and is listed as a DoS/DDoS attack tool.","id":"S07Q16"},{"concept_id":"DoS/DDoS Attack Countermeasures::Cloud scale","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What benefit do AWS, Azure, and GCP offer during large floods?","choices":["Hyperscale cloud capacity","Guaranteed attacker identity","No need for routing","No packet loss ever"],"answer":"Hyperscale cloud capacity","explanation":"Large cloud platforms provide distributed capacity that can absorb large traffic spikes.","id":"S07Q17"},{"concept_id":"DoS/DDoS Attack Countermeasures::TCP intercept","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What intermediary defense completes or validates handshakes before forwarding them?","choices":["TCP intercept","DNS recursion","ARP inspection","SMTP relay"],"answer":"TCP intercept","explanation":"TCP intercept reduces SYN-flood pressure by validating TCP connection establishment.","id":"S07Q18"},{"concept_id":"Botnets::Neutralize handlers","variant":2,"category":"Botnets","question":"Why can taking down a handler disrupt many agents at once?","choices":["Multiple agents lose coordination","Victim bandwidth increases","Reflectors become bots automatically","All DNS responses stop"],"answer":"Multiple agents lose coordination","explanation":"Handlers coordinate many agents, so disabling them can render many bots ineffective.","id":"S07Q19"},{"concept_id":"Botnets::Topological performance","variant":1,"category":"Botnets","question":"Which method is described as accurate with performance similar to hit-list scanning?","choices":["Topological scanning","Random scanning","Local subnet scanning","Permutation scanning"],"answer":"Topological scanning","explanation":"The course describes topological scanning as accurate and comparable to hit-list performance.","id":"S07Q20"},{"concept_id":"DDoS Case Study::Case rps","variant":2,"category":"DDoS Case Study","question":"The attack is measured in requests per second and consumes app resources. What is it?","choices":["Application-layer attack","Volumetric attack","Protocol attack","Physical attack"],"answer":"Application-layer attack","explanation":"Application-layer attacks are measured in rps and target application resources.","id":"S07Q21"},{"concept_id":"DoS/DDoS Attack Techniques::Pulse periodic","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which DDoS pattern arrives in large periodic bursts instead of continuously?","choices":["Pulse Wave DDoS","UDP Flood","SYN Flood","Slowloris"],"answer":"Pulse Wave DDoS","explanation":"Pulse Wave DDoS attacks use repeated high-volume bursts separated by quieter intervals.","id":"S07Q22"},{"concept_id":"DoS/DDoS Concepts::Application target","variant":2,"category":"DoS/DDoS Concepts","question":"Which resource class is targeted by Slowloris and HTTP floods?","choices":["Application resources","RF spectrum","Firmware storage only","DNSSEC keys"],"answer":"Application resources","explanation":"Application-layer attacks consume resources such as worker threads, connections, or application processing capacity.","id":"S07Q23"},{"concept_id":"Botnets::Hitlist split","variant":1,"category":"Botnets","question":"Which scanning method divides its target list after infection?","choices":["Hit-list scanning","Random scanning","Topological scanning","Local subnet scanning"],"answer":"Hit-list scanning","explanation":"Hit-list scanning divides the list to parallelize propagation.","id":"S07Q24"},{"concept_id":"DoS/DDoS Attack Countermeasures::Honeypot deflect","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Where do honeypots fit in the six countermeasure categories?","choices":["Deflect Attacks","Protect Secondary Victims","Prevent Potential Attacks","Post-attack Forensics"],"answer":"Deflect Attacks","explanation":"Honeypots are used to deflect and study attacks.","id":"S07Q25"},{"concept_id":"DoS/DDoS Protection Tools::Akamai console","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which mitigation provider exposes a named Security Center management console?","choices":["Akamai","LOIC","UFONet","HULK"],"answer":"Akamai","explanation":"The course lists Akamai and its Security Center console among DDoS protection options.","id":"S07Q26"},{"concept_id":"DDoS Case Study::Case honeynet","variant":2,"category":"DDoS Case Study","question":"The environment intentionally attracts attackers while recording their behavior. Which defense fits?","choices":["High-interaction honeynet","Black hole route","Rate limiter","SYN cookie"],"answer":"High-interaction honeynet","explanation":"A honeynet is a high-interaction honeypot environment used to study attacks.","id":"S07Q27"},{"concept_id":"DoS/DDoS Protection Tools::A10 attacks","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which A10 Thunder TPS feature addresses increasing attack volume?","choices":["Defeat growing attacks","Create new zombies","Run phishing pages","Disable rate limits"],"answer":"Defeat growing attacks","explanation":"A10 Thunder TPS is described as able to defeat growing attacks.","id":"S07Q28"},{"concept_id":"Botnets::Instruction step","variant":2,"category":"Botnets","question":"Which event starts coordinated attack behavior?","choices":["Bots receive attack instructions","Bots patch the victim","Bots delete C&C","Bots join a CDN"],"answer":"Bots receive attack instructions","explanation":"The C&C center sends attack instructions to bots.","id":"S07Q29"},{"concept_id":"DoS/DDoS Attack Countermeasures::Ingress","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which filtering direction blocks spoofed or unwanted traffic entering your network?","choices":["Ingress filtering","Egress filtering","Load balancing","Traffic shaping only"],"answer":"Ingress filtering","explanation":"Ingress filtering checks traffic entering the network.","id":"S07Q30"},{"concept_id":"DoS/DDoS Concepts::Slow traffic appearance","variant":2,"category":"DoS/DDoS Concepts","question":"What makes slow HTTP clients blend into legitimate behavior?","choices":["They resemble legitimate slow clients","They always spoof broadcast addresses","They use malformed Ethernet only","They require physical access"],"answer":"They resemble legitimate slow clients","explanation":"Slow attacks often use valid protocol behavior at an abnormally slow rate.","id":"S07Q31"},{"concept_id":"DoS/DDoS Concepts::Zero-day concept","variant":2,"category":"DoS/DDoS Concepts","question":"Which condition makes a DoS vector zero-day?","choices":["No available patch or known defense yet","It lasts zero seconds","It uses no packets","It only targets UDP port 0"],"answer":"No available patch or known defense yet","explanation":"A zero-day DDoS exploits a vulnerability before a patch or established defense is available.","id":"S07Q32"},{"concept_id":"DoS/DDoS Protection Tools::BlockDoS","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed service is named specifically around blocking DoS attacks?","choices":["BlockDoS","UFONet","LOIC","Slowloris"],"answer":"BlockDoS","explanation":"BlockDoS is listed among DoS/DDoS protection services.","id":"S07Q33"},{"concept_id":"DoS/DDoS Protection Tools::A10","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which traffic-protection platform is named Thunder TPS?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"A10 Thunder TPS","explanation":"A10 Thunder TPS is listed as a DDoS protection platform.","id":"S07Q34"},{"concept_id":"DoS/DDoS Attack Countermeasures::ISP filtering","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Who can filter malicious traffic upstream of the organization?","choices":["ISP filtering","Local browser extension","Host file editing","USB control"],"answer":"ISP filtering","explanation":"ISP filtering removes traffic upstream before it reaches the victim connection.","id":"S07Q35"},{"concept_id":"DoS/DDoS Concepts::App detect difficulty","variant":1,"category":"DoS/DDoS Concepts","question":"Which DoS class is often hardest to distinguish from legitimate clients?","choices":["Application-layer attacks","Volumetric attacks","Physical attacks","Routing-table attacks only"],"answer":"Application-layer attacks","explanation":"Application-layer traffic can look legitimate and is therefore difficult to detect and mitigate.","id":"S07Q36"},{"concept_id":"DDoS Case Study::Case Smurf","variant":2,"category":"DDoS Case Study","question":"One spoofed ping causes an entire subnet to answer the victim. What is this case?","choices":["Smurf","Fraggle","SYN Flood","Slowloris"],"answer":"Smurf","explanation":"This pattern matches Smurf: ICMP Echo sent to broadcast with the victim spoofed as source.","id":"S07Q37"},{"concept_id":"DoS/DDoS Attack Techniques::LAND","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which crash-style attack causes a system to respond to itself?","choices":["LAND","Teardrop","Fraggle","Ping of Death"],"answer":"LAND","explanation":"LAND uses packets whose source and destination addresses/ports are the same.","id":"S07Q38"},{"concept_id":"DoS/DDoS Concepts::Volumetric examples","variant":1,"category":"DoS/DDoS Concepts","question":"Which group contains only volumetric examples from the course?","choices":["UDP flood, ICMP flood, Smurf","SYN flood, ACK flood, SACK panic","Slowloris, HTTP POST, RDDoS","Teardrop, LAND, SQL injection"],"answer":"UDP flood, ICMP flood, Smurf","explanation":"UDP flood, ICMP flood, Smurf, and amplification attacks are volumetric examples.","id":"S07Q39"},{"concept_id":"Botnets::Owner role","variant":1,"category":"Botnets","question":"Who controls the botnet ecosystem at the top level?","choices":["Botnet owner/attacker","Reflector victim","ISP customer","Honeynet operator"],"answer":"Botnet owner/attacker","explanation":"The attacker or botnet owner directs the botnet.","id":"S07Q40"},{"concept_id":"Botnets::Crimeware DB","variant":2,"category":"Botnets","question":"Which botnet component supports malicious tooling and infection content?","choices":["Malicious toolkit/infection resources","Legitimate user credentials only","Router firmware backups","WIDS alerts"],"answer":"Malicious toolkit/infection resources","explanation":"The crimeware toolkit database supports malicious infection and attack resources.","id":"S07Q41"},{"concept_id":"DDoS Case Study::Case teardrop","variant":1,"category":"DDoS Case Study","question":"A legacy system crashes while reassembling fragments with overlapping offsets. Which attack fits?","choices":["Teardrop","Fragmentation Attack","LAND","Ping of Death"],"answer":"Teardrop","explanation":"Teardrop specifically uses overlapping fragment offsets.","id":"S07Q42"},{"concept_id":"DoS/DDoS Concepts::Handler","variant":1,"category":"DoS/DDoS Concepts","question":"Which system coordinates or relays commands to attacking agents?","choices":["Handler","Reflector","Victim","Load balancer"],"answer":"Handler","explanation":"Handlers coordinate or relay instructions to botnet agents.","id":"S07Q43"},{"concept_id":"DoS/DDoS Concepts::Flooding","variant":1,"category":"DoS/DDoS Concepts","question":"Which bandwidth-depletion method simply sends overwhelming traffic volume?","choices":["Flooding","Amplification","Deflection","Honeypotting"],"answer":"Flooding","explanation":"Flood attacks consume resources through high traffic volume.","id":"S07Q44"},{"concept_id":"DoS/DDoS Concepts::Volumetric metric","variant":2,"category":"DoS/DDoS Concepts","question":"Which metric best represents bandwidth exhaustion?","choices":["Bits per second (bps)","Packets per second (pps)","Requests per second (rps)","Connections per minute (cpm)"],"answer":"Bits per second (bps)","explanation":"Volumetric attacks consume bandwidth and are measured in bits per second.","id":"S07Q45"},{"concept_id":"Botnets::Propagation step","variant":1,"category":"Botnets","question":"How does the botnet grow after initial infection?","choices":["Other vulnerable systems","Only DNS root servers","Only honeypots","Only the primary target"],"answer":"Other vulnerable systems","explanation":"Bots may scan for other vulnerable systems and infect them.","id":"S07Q46"},{"concept_id":"DoS/DDoS Attack Techniques::Slowloris partial","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which Layer-7 technique keeps many connections open with incomplete request data?","choices":["Slowloris","RUDY","Slow Read","Apache Killer"],"answer":"Slowloris","explanation":"Slowloris holds connections open by sending incomplete HTTP requests.","id":"S07Q47"},{"concept_id":"DoS/DDoS Attack Techniques::Slow Read","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which technique keeps the server busy because the client reads the response extremely slowly?","choices":["Slow Read","RUDY","Slowloris","Apache Killer"],"answer":"Slow Read","explanation":"Slow Read holds a server connection open by consuming the response very slowly.","id":"S07Q48"},{"concept_id":"DoS/DDoS Attack Techniques::Recursive GET","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which HTTP flood browses pages and images like a legitimate user?","choices":["Recursive HTTP GET Flood","Random Recursive GET Flood","Single-Session HTTP Flood","RUDY"],"answer":"Recursive HTTP GET Flood","explanation":"Recursive GET floods imitate a legitimate user retrieving pages and embedded resources.","id":"S07Q49"},{"concept_id":"DoS/DDoS Attack Techniques::Fragmentation","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which protocol attack wastes resources on malformed fragment reconstruction?","choices":["Fragmentation Attack","SYN Flood","HTTP GET Flood","Smurf"],"answer":"Fragmentation Attack","explanation":"Fragmentation attacks send TCP/UDP fragments that cannot be properly reassembled.","id":"S07Q50"}],[{"concept_id":"DoS/DDoS Attack Techniques::Pulse scale","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which periodic DDoS pattern can repeatedly crowd a network pipe with huge bursts?","choices":["Pulse Wave DDoS","RUDY","LAND","Teardrop"],"answer":"Pulse Wave DDoS","explanation":"The course describes Pulse Wave attacks with very large periodic traffic bursts.","id":"S08Q01"},{"concept_id":"DDoS Case Study::Case Apache","variant":1,"category":"DDoS Case Study","question":"A server allocates excessive memory for overlapping byte-range requests. Which attack fits?","choices":["Apache Killer","RUDY","Slowloris","Slow Read"],"answer":"Apache Killer","explanation":"Apache Killer abuses overlapping byte ranges.","id":"S08Q02"},{"concept_id":"Botnets::Random traffic","variant":2,"category":"Botnets","question":"What propagation method wastes probes on arbitrary addresses?","choices":["Random scanning","Hit-list scanning","Topological scanning","Permutation scanning"],"answer":"Random scanning","explanation":"Random scanning can create substantial scan traffic.","id":"S08Q03"},{"concept_id":"Botnets::Phishing recruitment","variant":1,"category":"Botnets","question":"Which technique can redirect victims to the malicious site?","choices":["Phishing/social engineering","Rate limiting","Blackholing","Load balancing"],"answer":"Phishing/social engineering","explanation":"The setup uses phishing/social engineering to drive users to malicious content.","id":"S08Q04"},{"concept_id":"DoS/DDoS Concepts::Bot definition","variant":1,"category":"DoS/DDoS Concepts","question":"What does the term bot mean in a botnet context?","choices":["Automated software on a compromised host","A physical firewall appliance","A DNS authoritative server","A honeynet sensor"],"answer":"Automated software on a compromised host","explanation":"A bot is software that performs automated tasks under attacker control.","id":"S08Q05"},{"concept_id":"DoS/DDoS Concepts::Smurf duplicate","variant":2,"category":"DoS/DDoS Concepts","question":"Which term describes repeated ICMP replies generated by broadcast amplification?","choices":["Duplicates","Fragments","Tokens","Sessions"],"answer":"Duplicates","explanation":"The supplementary notes call successive Smurf responses duplicates.","id":"S08Q06"},{"concept_id":"DoS/DDoS Attack Countermeasures::IP Source Guard","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What control blocks spoofed packets based on trusted source bindings?","choices":["IP Source Guard","Port Security only","DNSSEC","HSTS"],"answer":"IP Source Guard","explanation":"IP Source Guard validates source addressing against trusted bindings.","id":"S08Q07"},{"concept_id":"DoS/DDoS Attack Techniques::DNS amp","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which amplification attack uses small UDP queries to trigger much larger replies?","choices":["DNS Amplification","Smurf","SYN Flood","LAND"],"answer":"DNS Amplification","explanation":"DNS amplification uses small spoofed UDP queries to generate larger responses toward the victim.","id":"S08Q08"},{"concept_id":"DoS/DDoS Attack Countermeasures::Forensics logs","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What evidence should be reviewed after an attack to reconstruct events?","choices":["Router, firewall, and IDS logs","Only browser history","Only DNS cache","Only user passwords"],"answer":"Router, firewall, and IDS logs","explanation":"Post-attack forensics analyzes network and security logs.","id":"S08Q09"},{"concept_id":"DoS/DDoS Attack Techniques::ACK spoof","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which transport flag is sent at scale without a legitimate established flow?","choices":["ACK/PUSH-ACK packets","ICMP Echo Replies","ARP Requests","DNS TXT records"],"answer":"ACK/PUSH-ACK packets","explanation":"ACK/PUSH-ACK floods send large numbers of spoofed TCP acknowledgment packets.","id":"S08Q10"},{"concept_id":"DoS/DDoS Protection Tools::Azure","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which Microsoft cloud platform is named for large-scale DDoS absorption?","choices":["Azure","HULK","HOIC","Slowloris"],"answer":"Azure","explanation":"Azure is listed as a cloud provider that can help absorb DDoS traffic.","id":"S08Q11"},{"concept_id":"DoS/DDoS Attack Techniques::Teardrop","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which legacy attack uses overlapping fragment offsets?","choices":["Teardrop","LAND","Fraggle","Smurf"],"answer":"Teardrop","explanation":"Teardrop uses overlapping IP fragment offsets that vulnerable stacks cannot reassemble safely.","id":"S08Q12"},{"concept_id":"DDoS Case Study::Case LAND","variant":2,"category":"DDoS Case Study","question":"The target loops while responding to itself. What legacy attack caused it?","choices":["LAND","Teardrop","Fraggle","Smurf"],"answer":"LAND","explanation":"LAND sets source and destination to the same values, confusing vulnerable systems.","id":"S08Q13"},{"concept_id":"Botnets::Botnet data theft","variant":2,"category":"Botnets","question":"What malicious outcome can infected systems support besides flooding?","choices":["Data theft","Load balancing","Traffic scrubbing","Patch deployment"],"answer":"Data theft","explanation":"Botnets can support data theft, phishing, and other criminal activity.","id":"S08Q14"},{"concept_id":"DoS/DDoS Attack Countermeasures::Perimeter surveillance","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What broad control detects abnormal traffic before it reaches core systems?","choices":["Advanced network-level surveillance","Open guest access","Longer session lifetimes","Disabled logging"],"answer":"Advanced network-level surveillance","explanation":"Perimeter monitoring helps detect and respond to abnormal DDoS traffic.","id":"S08Q15"},{"concept_id":"DoS/DDoS Protection Tools::Stormwall","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed mitigation product carries the PRO name?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"Stormwall PRO","explanation":"Stormwall PRO is listed among DDoS protection services.","id":"S08Q16"},{"concept_id":"DoS/DDoS Protection Tools::Protection classification","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which set belongs entirely to mitigation rather than attack generation?","choices":["A10 Thunder TPS, Akamai, Nexusguard","LOIC, HOIC, HULK","Slowloris, UFONet, LOIC","HULK, BlockDoS, HOIC"],"answer":"A10 Thunder TPS, Akamai, Nexusguard","explanation":"A10 Thunder TPS, Akamai, and Nexusguard are defensive products/services.","id":"S08Q17"},{"concept_id":"DoS/DDoS Attack Countermeasures::Threat intel","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which collaboration strategy improves awareness of emerging DDoS sources and techniques?","choices":["Threat intelligence sharing","Disable logging","Open recursive DNS","Static default passwords"],"answer":"Threat intelligence sharing","explanation":"Sharing threat intelligence improves detection and preparedness.","id":"S08Q18"},{"concept_id":"DoS/DDoS Concepts::DoS vs access","variant":2,"category":"DoS/DDoS Concepts","question":"What distinguishes denial of service from a compromise-focused attack?","choices":["Unauthorized access","Resource exhaustion","Service unavailability","Operational disruption"],"answer":"Unauthorized access","explanation":"A DoS attack can succeed without gaining unauthorized access.","id":"S08Q19"},{"concept_id":"DoS/DDoS Concepts::Upstream mitigation","variant":1,"category":"DoS/DDoS Concepts","question":"Why is ISP filtering valuable during a large DDoS?","choices":["Drops traffic before it reaches the victim link","Increases victim bandwidth usage","Disables all routing","Encrypts botnet traffic"],"answer":"Drops traffic before it reaches the victim link","explanation":"Upstream filtering can remove attack traffic before it saturates the victim connection.","id":"S08Q20"},{"concept_id":"DoS/DDoS Concepts::Application examples","variant":1,"category":"DoS/DDoS Concepts","question":"Which group contains only application-layer examples?","choices":["Slowloris, HTTP GET, HTTP POST","Smurf, Fraggle, NTP amplification","SYN flood, ACK flood, fragmentation","LAND, Teardrop, Ping of Death"],"answer":"Slowloris, HTTP GET, HTTP POST","explanation":"Slowloris and HTTP GET/POST attacks are application-layer techniques.","id":"S08Q21"},{"concept_id":"DoS/DDoS Protection Tools::Slowloris tool","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed item is both the name of an HTTP exhaustion technique and a tool?","choices":["Slowloris","Akamai","BlockDoS","Nexusguard"],"answer":"Slowloris","explanation":"Slowloris appears as a DoS attack technique/tool in the course.","id":"S08Q22"},{"concept_id":"DoS/DDoS Attack Techniques::Single-session flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which variant abuses HTTP/1.1 by reusing a single session for repeated requests?","choices":["Single-Session HTTP Flood","Single-Request HTTP Flood","Recursive GET Flood","Random Recursive GET Flood"],"answer":"Single-Session HTTP Flood","explanation":"Single-session HTTP flood sends many requests within one established session.","id":"S08Q23"},{"concept_id":"DoS/DDoS Attack Countermeasures::CDN mitigation","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which service type can absorb and scrub large public-facing DDoS traffic?","choices":["CDN/DDoS mitigation service","Local DHCP server","Endpoint password manager","Internal printer server"],"answer":"CDN/DDoS mitigation service","explanation":"CDN/DDoS services absorb, distribute, and filter attack traffic.","id":"S08Q24"},{"concept_id":"Botnets::Botnet spam","variant":1,"category":"Botnets","question":"Which botnet-supported activity sends bulk unsolicited email?","choices":["Spam","Honeypotting","Rate limiting","Patch management"],"answer":"Spam","explanation":"Spam and mass mailing are common botnet uses.","id":"S08Q25"},{"concept_id":"DoS/DDoS Attack Techniques::Prot pps","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which DoS class is measured in packets per second?","choices":["Protocol attacks","Volumetric attacks","Application-layer attacks","Physical attacks"],"answer":"Protocol attacks","ex
