<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Denial of Service — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"concept_id":"DoS/DDoS Attack Countermeasures::Limit broadcast","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which network-hardening step reduces broadcast-amplification opportunities?","choices":["Network broadcasting","TLS certificates","SSH keys","Application logs"],"answer":"Network broadcasting","explanation":"Limiting broadcast behavior reduces classic amplification opportunities.","id":"S01Q01"},{"concept_id":"Botnets::Malware infection","variant":2,"category":"Botnets","question":"Which event gives the attacker remote control over a bot?","choices":["Malware infection","Load balancing","Traffic scrubbing","DNSSEC validation"],"answer":"Malware infection","explanation":"Bots are usually created by infecting endpoints with malware.","id":"S01Q02"},{"concept_id":"DoS/DDoS Protection Tools::HULK","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which listed utility belongs with HOIC, LOIC, and UFONet rather than protection services?","choices":["HULK","Imperva DDoS Protection","Nexusguard","BlockDoS"],"answer":"HULK","explanation":"HULK is listed as a DoS/DDoS attack tool.","id":"S01Q03"},{"concept_id":"DoS/DDoS Concepts::Reflector","variant":1,"category":"DoS/DDoS Concepts","question":"Which system receives spoofed requests and sends replies to the victim?","choices":["Reflector","Handler","Honeypot","Zombie owner"],"answer":"Reflector","explanation":"Reflectors believe the spoofed request came from the victim and send responses there.","id":"S01Q04"},{"concept_id":"DDoS Case Study::Case fragmentation","variant":2,"category":"DDoS Case Study","question":"Many TCP/UDP fragments cannot be reassembled. What technique is this?","choices":["Fragmentation Attack","Teardrop","SYN Flood","HTTP POST Attack"],"answer":"Fragmentation Attack","explanation":"A fragmentation attack floods the target with fragments that cannot be reassembled.","id":"S01Q05"},{"concept_id":"DoS/DDoS Concepts::Legacy concept","variant":2,"category":"DoS/DDoS Concepts","question":"Which statement best describes many classic crash-style DoS attacks today?","choices":["Historically important and still exam-relevant","Most effective against all current systems","Required for WPA cracking","Used only for phishing"],"answer":"Historically important and still exam-relevant","explanation":"Modern stacks usually handle many classic attacks, but they remain important exam concepts.","id":"S01Q06"},{"concept_id":"DoS/DDoS Attack Techniques::SACK MSS","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What unusually small MSS value is highlighted in the SACK panic description?","choices":["48 bytes","64 KB","1500 bytes","576 bytes"],"answer":"48 bytes","explanation":"The course highlights an MSS of 48 bytes in the SACK panic scenario.","id":"S01Q07"},{"concept_id":"DoS/DDoS Attack Techniques::App low bandwidth","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Why can application-layer attacks succeed with few attacking machines?","choices":["They consume expensive application resources","They always use broadcast addresses","They require fragmented IP packets","They disable routing protocols"],"answer":"They consume expensive application resources","explanation":"Layer-7 attacks can exhaust costly server resources with relatively little traffic.","id":"S01Q08"},{"concept_id":"DoS/DDoS Attack Techniques::Smurf duplicates","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Why can a single Smurf request multiply into many responses?","choices":["Many hosts send replies to the victim","The victim sends SYN cookies","The router reassembles fragments","The DNS server resets connections"],"answer":"Many hosts send replies to the victim","explanation":"Every responding host on the broadcast network can send an ICMP reply to the victim.","id":"S01Q09"},{"concept_id":"DoS/DDoS Protection Tools::Packet Flooder","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which NetScanTools utility appears in the attack-tool list?","choices":["Packet Flooder Tool","A10 Thunder TPS","Nexusguard","Huawei AntiDDoS1000"],"answer":"Packet Flooder Tool","explanation":"Packet Flooder Tool from NetScanTools is listed as an attack tool.","id":"S01Q10"},{"concept_id":"DoS/DDoS Attack Countermeasures::Distributed servers","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which architecture reduces reliance on one service location?","choices":["Distributed server model","Single server only","One flat subnet","One upstream link only"],"answer":"Distributed server model","explanation":"Distributed server models reduce single points of failure.","id":"S01Q11"},{"concept_id":"Botnets::Hitlist growth","variant":1,"category":"Botnets","question":"Which scanning method can produce exponential compromise growth?","choices":["Hit-list scanning","Random scanning","Local subnet scanning","Topological scanning"],"answer":"Hit-list scanning","explanation":"Hit-list splitting enables very fast, exponential-style propagation.","id":"S01Q12"},{"concept_id":"DoS/DDoS Concepts::Half-open concept","variant":1,"category":"DoS/DDoS Concepts","question":"What does a half-open TCP connection lack?","choices":["Final ACK","Initial SYN","SYN-ACK","FIN-ACK"],"answer":"Final ACK","explanation":"A SYN flood leaves the handshake incomplete by never sending the final ACK.","id":"S01Q13"},{"concept_id":"Botnets::Permutation reinfection","variant":1,"category":"Botnets","question":"Which scanning method is designed to avoid reinfecting the same hosts?","choices":["Permutation Scanning","Random Scanning","Topological Scanning","Local Subnet Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning reduces duplicate infection attempts.","id":"S01Q14"},{"concept_id":"Botnets::Malicious redirect","variant":2,"category":"Botnets","question":"How are users driven toward infection infrastructure in the setup?","choices":["Redirect/expose users to malware","Perform upstream filtering","Issue SYN cookies","Run a honeynet"],"answer":"Redirect/expose users to malware","explanation":"Malicious or compromised sites expose victims to infection content.","id":"S01Q15"},{"concept_id":"DoS/DDoS Attack Countermeasures::Throttling","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which mitigation deliberately reduces accepted traffic volume?","choices":["Throttling","Amplification","Reflection","Port scanning"],"answer":"Throttling","explanation":"Throttling limits traffic to reduce overload.","id":"S01Q16"},{"concept_id":"DoS/DDoS Concepts::Layer7 target","variant":1,"category":"DoS/DDoS Concepts","question":"Which layer is targeted by HTTP GET/POST floods and Slowloris?","choices":["Application layer","Physical layer","Data-link layer","Presentation-only layer"],"answer":"Application layer","explanation":"HTTP-based resource-exhaustion attacks operate at the application layer.","id":"S01Q17"},{"concept_id":"DoS/DDoS Concepts::Volumetric target","variant":2,"category":"DoS/DDoS Concepts","question":"Which target resource is consumed by UDP and ICMP floods?","choices":["Bandwidth","Authentication tokens","File permissions","Code-signing keys"],"answer":"Bandwidth","explanation":"Volumetric attacks primarily consume network bandwidth.","id":"S01Q18"},{"concept_id":"DoS/DDoS Attack Countermeasures::Rate limit","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What control restrains abusive request volume per source or service?","choices":["Rate limiting","Blackholing","Honeynetting","Port mirroring"],"answer":"Rate limiting","explanation":"Rate limiting restricts how much traffic or how many requests can be accepted over time.","id":"S01Q19"},{"concept_id":"DoS/DDoS Concepts::Amplification","variant":2,"category":"DoS/DDoS Concepts","question":"What property makes some UDP services attractive for traffic multiplication?","choices":["Amplification","Encapsulation","Tunneling","Defragmentation"],"answer":"Amplification","explanation":"Amplification produces a response much larger than the triggering request.","id":"S01Q20"},{"concept_id":"DoS/DDoS Attack Techniques::Slow resource model","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which strategy do these attacks share despite different HTTP behaviors?","choices":["Hold server resources with minimal traffic","Saturate the WAN with raw bandwidth","Exploit broadcast ICMP only","Corrupt firmware"],"answer":"Hold server resources with minimal traffic","explanation":"Slow attacks consume server-side resources while generating comparatively little traffic.","id":"S01Q21"},{"concept_id":"DoS/DDoS Attack Techniques::ACK flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack sends large volumes of spoofed ACK or PUSH-ACK packets?","choices":["ACK/PUSH-ACK Flood","SYN Flood","Smurf","Slowloris"],"answer":"ACK/PUSH-ACK Flood","explanation":"ACK and PUSH-ACK floods overwhelm processing with spoofed acknowledgment traffic.","id":"S01Q22"},{"concept_id":"DoS/DDoS Attack Countermeasures::Low interaction","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which honeypot type provides limited emulation and lower realism?","choices":["Low-interaction honeypot","High-interaction honeypot","Black hole route","Load balancer"],"answer":"Low-interaction honeypot","explanation":"Low-interaction honeypots emulate limited services with reduced exposure.","id":"S01Q23"},{"concept_id":"DoS/DDoS Attack Countermeasures::Third party","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What should an organization use when it cannot absorb a large DDoS itself?","choices":["Third-party DDoS protection","Open recursive DNS","Default router rules","Longer timeouts"],"answer":"Third-party DDoS protection","explanation":"Third-party protection services can absorb and filter large attacks.","id":"S01Q24"},{"concept_id":"DoS/DDoS Attack Techniques::Amplification spoofing","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which packet field is forged in a reflection-amplification attack?","choices":["Source IP address","Destination MAC only","TCP window scale","HTTP User-Agent"],"answer":"Source IP address","explanation":"The attacker spoofs the victim as the request source so responses are sent to the victim.","id":"S01Q25"},{"concept_id":"DoS/DDoS Attack Techniques::App rps","variant":2,"category":"DoS/DDoS Attack Techniques","question":"What category includes Slowloris and HTTP GET/POST attacks?","choices":["Application-layer attacks","Protocol attacks","Volumetric attacks","Physical attacks"],"answer":"Application-layer attacks","explanation":"Application-layer attacks are measured in requests per second.","id":"S01Q26"},{"concept_id":"DoS/DDoS Protection Tools::A10 scale","variant":2,"category":"DoS/DDoS Protection Tools","question":"What product characteristic allows protection capacity to expand?","choices":["Scalable protection","Static single-host design","No monitoring","Open relay support"],"answer":"Scalable protection","explanation":"The course lists scalable protection as a Thunder TPS feature.","id":"S01Q27"},{"concept_id":"DDoS Case Study::Case handler takedown","variant":1,"category":"DDoS Case Study","question":"A defender disables two C&C handlers and thousands of bots stop receiving commands. Which strategy worked?","choices":["Neutralize botnet handlers","Increase bot bandwidth","Enable WPS","Disable logging"],"answer":"Neutralize botnet handlers","explanation":"Handlers are fewer than agents, so neutralizing them can disrupt many bots at once.","id":"S01Q28"},{"concept_id":"DDoS Case Study::Case DNS amp","variant":1,"category":"DDoS Case Study","question":"A tiny query triggers a much larger UDP response toward a spoofed victim. Which attack fits?","choices":["DNS Amplification","Slow Read","SYN Flood","LAND"],"answer":"DNS Amplification","explanation":"DNS amplification uses spoofed UDP queries and larger reflected responses.","id":"S01Q29"},{"concept_id":"DoS/DDoS Concepts::Bandwidth distributed claim","variant":1,"category":"DoS/DDoS Concepts","question":"According to the supplied study notes, modern bandwidth DoS commonly relies on what?","choices":["A distributed botnet","A single local process only","A userland jailbreak","A DNSSEC signer"],"answer":"A distributed botnet","explanation":"The supplied notes emphasize botnets for modern bandwidth-based denial of service.","id":"S01Q30"},{"concept_id":"DDoS Case Study::Case DRDoS","variant":2,"category":"DDoS Case Study","question":"Intermediary and secondary victims relay responses toward the primary target. What architecture is this?","choices":["DRDoS","SYN Flood","Slowloris","PDoS"],"answer":"DRDoS","explanation":"DRDoS uses distributed reflection through intermediary systems.","id":"S01Q31"},{"concept_id":"DDoS Case Study::Case SACK","variant":1,"category":"DDoS Case Study","question":"A Linux host panics after malformed SACK packets with MSS 48. Which attack fits?","choices":["TCP SACK Panic","SYN Flood","Teardrop","LAND"],"answer":"TCP SACK Panic","explanation":"The course describes TCP SACK Panic as a Linux kernel DoS involving malformed SACK/MSS values.","id":"S01Q32"},{"concept_id":"Botnets::C&C role","variant":1,"category":"Botnets","question":"What do bots connect back to after infection?","choices":["C&C center","Victim CDN","Public DNS resolver","Honeypot"],"answer":"C&C center","explanation":"Bots connect to command-and-control infrastructure.","id":"S01Q33"},{"concept_id":"Botnets::Random scan definition","variant":2,"category":"Botnets","question":"What propagation method picks target IPs without a prebuilt ordered list?","choices":["Random scanning","Hit-list scanning","Topological scanning","Local subnet scanning"],"answer":"Random scanning","explanation":"Random scanning probes addresses randomly within the target range.","id":"S01Q34"},{"concept_id":"DoS/DDoS Protection Tools::Cloud providers group","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which group contains only cloud providers named for DDoS absorption?","choices":["AWS, Azure, Google Cloud","LOIC, HOIC, HULK","Akamai, LOIC, Azure","Nexusguard, HULK, AWS"],"answer":"AWS, Azure, Google Cloud","explanation":"The supplementary notes name AWS, Azure, and Google Cloud as large-scale capacity options.","id":"S01Q35"},{"concept_id":"DoS/DDoS Protection Tools::Attack vs defense 4","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which option is a protection service rather than a slow-HTTP attack tool?","choices":["Stormwall PRO","Slowloris","slowhttptest","HULK"],"answer":"Stormwall PRO","explanation":"Stormwall PRO is a defensive DDoS protection service.","id":"S01Q36"},{"concept_id":"DoS/DDoS Concepts::Traffic scrubbing","variant":1,"category":"DoS/DDoS Concepts","question":"What is the goal of a DDoS traffic-scrubbing service?","choices":["Filter attack traffic and forward clean traffic","Encrypt every packet end-to-end","Disable DNS resolution","Create additional bots"],"answer":"Filter attack traffic and forward clean traffic","explanation":"Scrubbing services inspect traffic and forward cleaner traffic to the protected service.","id":"S01Q37"},{"concept_id":"DoS/DDoS Protection Tools::Upstream service","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which provider position is most useful when the victim link is already saturated?","choices":["Upstream ISP/DDoS provider","Only on the victim browser","Only after the web app","Only inside the database"],"answer":"Upstream ISP/DDoS provider","explanation":"Upstream filtering can remove attack traffic before the victim link is overwhelmed.","id":"S01Q38"},{"concept_id":"DoS/DDoS Concepts::Protocol infrastructure","variant":2,"category":"DoS/DDoS Concepts","question":"What systems maintain the connection state targeted by protocol floods?","choices":["Firewalls, load balancers, and servers","Only DNS root servers","Only user browsers","Only storage arrays"],"answer":"Firewalls, load balancers, and servers","explanation":"Protocol attacks consume connection/state resources in network infrastructure and servers.","id":"S01Q39"},{"concept_id":"DoS/DDoS Attack Countermeasures::Post-forensics phase","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which phase reviews logs and attempts source traceback after service recovery?","choices":["Post-attack Forensics","Mitigate Attacks","Deflect Attacks","Protect Secondary Victims"],"answer":"Post-attack Forensics","explanation":"Post-attack forensics analyzes logs, identifies the attack type, and supports traceback.","id":"S01Q40"},{"concept_id":"DoS/DDoS Attack Techniques::SYN flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which protocol attack fills the queue with half-open connections?","choices":["SYN Flood","SYN-ACK Flood","ACK Flood","Fragmentation Attack"],"answer":"SYN Flood","explanation":"A SYN flood sends SYNs but does not complete the final ACK.","id":"S01Q41"},{"concept_id":"Botnets::Bot purposes spam","variant":2,"category":"Botnets","question":"What activity can a botnet perform besides DDoS?","choices":["Spam/mass mailing","Secure backups","TLS offload","Database normalization"],"answer":"Spam/mass mailing","explanation":"Botnets can generate spam and mass mailing campaigns.","id":"S01Q42"},{"concept_id":"DoS/DDoS Attack Countermeasures::Multicloud","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which deployment model reduces dependence on a single cloud provider or region?","choices":["Multi-cloud deployment","Single-host deployment","Flat VLAN design","Local-only caching"],"answer":"Multi-cloud deployment","explanation":"Multi-cloud deployment can increase resilience and capacity diversity.","id":"S01Q43"},{"concept_id":"Botnets::Handler count","variant":1,"category":"Botnets","question":"Why can neutralizing handlers be efficient?","choices":["There are fewer handlers than agents","Handlers have no network address","Agents cannot receive commands","Handlers are always inside the victim"],"answer":"There are fewer handlers than agents","explanation":"A small number of handlers can control many agents, so disabling them can affect many bots.","id":"S01Q44"},{"concept_id":"DoS/DDoS Attack Techniques::Fraggle","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which legacy attack is the UDP counterpart of Smurf?","choices":["Fraggle","Smurf","LAND","Teardrop"],"answer":"Fraggle","explanation":"Fraggle is similar to Smurf but uses UDP broadcast traffic.","id":"S01Q45"},{"concept_id":"DoS/DDoS Concepts::Resource consumption","variant":2,"category":"DoS/DDoS Concepts","question":"What broad mechanism makes services unavailable during DoS?","choices":["Resource exhaustion","Privilege inheritance","Certificate renewal","Database normalization"],"answer":"Resource exhaustion","explanation":"DoS commonly consumes bandwidth, CPU, memory, connection state, or other resources.","id":"S01Q46"},{"concept_id":"DoS/DDoS Attack Countermeasures::Slow timeout","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What server-side control closes connections that progress too slowly?","choices":["Connection timeouts","Longer keepalive","Open recursive DNS","Broadcast forwarding"],"answer":"Connection timeouts","explanation":"Connection timeouts release resources held by incomplete slow clients.","id":"S01Q47"},{"concept_id":"DDoS Case Study::Case ACK","variant":2,"category":"DDoS Case Study","question":"The traffic contains acknowledgment flags but no real established sessions. What attack is likely?","choices":["ACK/PUSH-ACK Flood","SYN Flood","Smurf","RUDY"],"answer":"ACK/PUSH-ACK Flood","explanation":"ACK/PUSH-ACK flood overwhelms the target with forged acknowledgment traffic.","id":"S01Q48"},{"concept_id":"DoS/DDoS Protection Tools::CDN role","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which capability helps absorb and distribute attack traffic away from the origin?","choices":["Distributed edge capacity","Source spoofing","Credential harvesting","Firmware flashing"],"answer":"Distributed edge capacity","explanation":"A CDN/edge network can absorb and distribute large traffic volumes.","id":"S01Q49"},{"concept_id":"DoS/DDoS Attack Techniques::SACK panic","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack crashes Linux with malformed SACK and MSS values?","choices":["TCP SACK Panic","SYN-ACK Flood","Teardrop","LAND"],"answer":"TCP SACK Panic","explanation":"TCP SACK Panic exploits malformed SACK/MSS handling in Linux networking.","id":"S01Q50"}],[{"concept_id":"DoS/DDoS Concepts::Application target","variant":1,"category":"DoS/DDoS Concepts","question":"What do application-layer attacks primarily exhaust?","choices":["Application resources","RF spectrum","Firmware storage only","DNSSEC keys"],"answer":"Application resources","explanation":"Application-layer attacks consume resources such as worker threads, connections, or application processing capacity.","id":"S02Q01"},{"concept_id":"DoS/DDoS Protection Tools::HOIC","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed tool expands the Ion Cannon family beyond the low-orbit version?","choices":["HOIC","LOIC","HULK","UFONet"],"answer":"HOIC","explanation":"HOIC stands for High Orbit Ion Cannon and is listed as a DoS/DDoS attack tool.","id":"S02Q02"},{"concept_id":"DoS/DDoS Concepts::Zero-day concept","variant":1,"category":"DoS/DDoS Concepts","question":"What defines a zero-day DDoS attack?","choices":["No available patch or known defense yet","It lasts zero seconds","It uses no packets","It only targets UDP port 0"],"answer":"No available patch or known defense yet","explanation":"A zero-day DDoS exploits a vulnerability before a patch or established defense is available.","id":"S02Q03"},{"concept_id":"DoS/DDoS Protection Tools::A10","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed protection product is made by A10?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"A10 Thunder TPS","explanation":"A10 Thunder TPS is listed as a DDoS protection platform.","id":"S02Q04"},{"concept_id":"DDoS Case Study::Case honeynet","variant":1,"category":"DDoS Case Study","question":"Defenders expose a realistic network with real applications to observe DDoS tooling. What is this?","choices":["High-interaction honeynet","Black hole route","Rate limiter","SYN cookie"],"answer":"High-interaction honeynet","explanation":"A honeynet is a high-interaction honeypot environment used to study attacks.","id":"S02Q05"},{"concept_id":"DoS/DDoS Attack Countermeasures::Cloud scale","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which infrastructure model can absorb large attack volumes through elastic capacity?","choices":["Hyperscale cloud capacity","Guaranteed attacker identity","No need for routing","No packet loss ever"],"answer":"Hyperscale cloud capacity","explanation":"Large cloud platforms provide distributed capacity that can absorb large traffic spikes.","id":"S02Q06"},{"concept_id":"DoS/DDoS Protection Tools::Huawei","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed product is Huawei's DDoS protection platform?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"Huawei AntiDDoS1000","explanation":"Huawei AntiDDoS1000 is listed among DoS/DDoS protection products.","id":"S02Q07"},{"concept_id":"DoS/DDoS Protection Tools::UFONet","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed utility belongs to the attack-tool list rather than the defensive product list?","choices":["UFONet","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"UFONet","explanation":"UFONet is listed among attack tools.","id":"S02Q08"},{"concept_id":"DoS/DDoS Attack Techniques::Slow Read","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which slow attack requests a large file but receives it in tiny segments?","choices":["Slow Read","RUDY","Slowloris","Apache Killer"],"answer":"Slow Read","explanation":"Slow Read holds a server connection open by consuming the response very slowly.","id":"S02Q09"},{"concept_id":"DoS/DDoS Attack Techniques::SYN timeout","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which flood exploits the server waiting on pending TCP handshakes?","choices":["SYN Flood","ICMP Flood","Slow Read","Smurf"],"answer":"SYN Flood","explanation":"SYN flood pressure comes from pending connections held until completion or timeout.","id":"S02Q10"},{"concept_id":"DoS/DDoS Attack Techniques::Recursive GET","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which attack recursively requests linked resources to create load?","choices":["Recursive HTTP GET Flood","Random Recursive GET Flood","Single-Session HTTP Flood","RUDY"],"answer":"Recursive HTTP GET Flood","explanation":"Recursive GET floods imitate a legitimate user retrieving pages and embedded resources.","id":"S02Q11"},{"concept_id":"Botnets::Crimeware DB","variant":1,"category":"Botnets","question":"What is stored or managed in the crimeware toolkit database?","choices":["Malicious toolkit/infection resources","Legitimate user credentials only","Router firmware backups","WIDS alerts"],"answer":"Malicious toolkit/infection resources","explanation":"The crimeware toolkit database supports malicious infection and attack resources.","id":"S02Q12"},{"concept_id":"DoS/DDoS Concepts::App detect difficulty","variant":2,"category":"DoS/DDoS Concepts","question":"What attack class commonly uses valid-looking low-rate requests?","choices":["Application-layer attacks","Volumetric attacks","Physical attacks","Routing-table attacks only"],"answer":"Application-layer attacks","explanation":"Application-layer traffic can look legitimate and is therefore difficult to detect and mitigate.","id":"S02Q13"},{"concept_id":"Botnets::Topological performance","variant":2,"category":"Botnets","question":"What topology-based propagation method uses host-local information for good targeting?","choices":["Topological scanning","Random scanning","Local subnet scanning","Permutation scanning"],"answer":"Topological scanning","explanation":"The course describes topological scanning as accurate and comparable to hit-list performance.","id":"S02Q14"},{"concept_id":"DoS/DDoS Attack Techniques::LAND","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which legacy attack makes source and destination IP/port identical?","choices":["LAND","Teardrop","Fraggle","Ping of Death"],"answer":"LAND","explanation":"LAND uses packets whose source and destination addresses/ports are the same.","id":"S02Q15"},{"concept_id":"DoS/DDoS Attack Techniques::Slowloris partial","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which slow attack sends partial HTTP requests and never finishes them?","choices":["Slowloris","RUDY","Slow Read","Apache Killer"],"answer":"Slowloris","explanation":"Slowloris holds connections open by sending incomplete HTTP requests.","id":"S02Q16"},{"concept_id":"DoS/DDoS Attack Techniques::SACK overflow","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which vulnerability type occurs when Linux socket-buffer accounting exceeds its limit?","choices":["Integer overflow","SQL injection","Race-free deadlock","Format-string write"],"answer":"Integer overflow","explanation":"The course describes an integer overflow in the Linux Socket Buffer path leading to kernel panic.","id":"S02Q17"},{"concept_id":"DoS/DDoS Concepts::Slow traffic appearance","variant":1,"category":"DoS/DDoS Concepts","question":"Why can slow attacks be difficult to detect?","choices":["They resemble legitimate slow clients","They always spoof broadcast addresses","They use malformed Ethernet only","They require physical access"],"answer":"They resemble legitimate slow clients","explanation":"Slow attacks often use valid protocol behavior at an abnormally slow rate.","id":"S02Q18"},{"concept_id":"DoS/DDoS Attack Techniques::Single-request flood","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which variant is described as multiple HTTP requests hidden in a single HTTP packet?","choices":["Single-Request HTTP Flood","Single-Session HTTP Flood","Recursive GET Flood","Slowloris"],"answer":"Single-Request HTTP Flood","explanation":"The course describes single-request HTTP flood as concealing multiple requests inside a single packet/session.","id":"S02Q19"},{"concept_id":"DoS/DDoS Attack Techniques::Pulse periodic","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which attack may send massive traffic bursts roughly every several minutes?","choices":["Pulse Wave DDoS","UDP Flood","SYN Flood","Slowloris"],"answer":"Pulse Wave DDoS","explanation":"Pulse Wave DDoS attacks use repeated high-volume bursts separated by quieter intervals.","id":"S02Q20"},{"concept_id":"DDoS Case Study::Case local subnet","variant":2,"category":"DDoS Case Study","question":"Propagation focuses on systems reachable only from the compromised local LAN. What scan is this?","choices":["Local Subnet Scanning","Random Scanning","Hit-list Scanning","Permutation Scanning"],"answer":"Local Subnet Scanning","explanation":"Local subnet scanning targets nearby internal systems.","id":"S02Q21"},{"concept_id":"DoS/DDoS Attack Techniques::Smurf","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack sends a spoofed Echo Request to a broadcast network?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"Smurf","explanation":"Smurf uses ICMP broadcast amplification with the victim address spoofed as the source.","id":"S02Q22"},{"concept_id":"DDoS Case Study::Case teardrop","variant":2,"category":"DDoS Case Study","question":"Overlapping fragment offsets trigger an OS-level crash. What attack is this?","choices":["Teardrop","Fragmentation Attack","LAND","Ping of Death"],"answer":"Teardrop","explanation":"Teardrop specifically uses overlapping fragment offsets.","id":"S02Q23"},{"concept_id":"Botnets::Neutralize handlers","variant":1,"category":"Botnets","question":"What is the effect of disabling a botnet handler?","choices":["Multiple agents lose coordination","Victim bandwidth increases","Reflectors become bots automatically","All DNS responses stop"],"answer":"Multiple agents lose coordination","explanation":"Handlers coordinate many agents, so disabling them can render many bots ineffective.","id":"S02Q24"},{"concept_id":"DoS/DDoS Attack Countermeasures::Cisco reputation","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What Cisco IPS capability relies on reputation data about botnets and malware?","choices":["Source IP Reputation Filtering","Black Hole Filtering","TCP Intercept","Connection Timeout"],"answer":"Source IP Reputation Filtering","explanation":"Source IP reputation filtering uses threat intelligence to identify suspicious sources.","id":"S02Q25"},{"concept_id":"DoS/DDoS Protection Tools::A10 attacks","variant":2,"category":"DoS/DDoS Protection Tools","question":"What capability is described as defeating growing attacks?","choices":["Defeat growing attacks","Create new zombies","Run phishing pages","Disable rate limits"],"answer":"Defeat growing attacks","explanation":"A10 Thunder TPS is described as able to defeat growing attacks.","id":"S02Q26"},{"concept_id":"DoS/DDoS Attack Countermeasures::TCP intercept","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which preventive technique protects servers from incomplete TCP handshakes?","choices":["TCP intercept","DNS recursion","ARP inspection","SMTP relay"],"answer":"TCP intercept","explanation":"TCP intercept reduces SYN-flood pressure by validating TCP connection establishment.","id":"S02Q27"},{"concept_id":"DoS/DDoS Attack Countermeasures::Protect secondary","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which countermeasure category hardens systems so they do not become attack agents?","choices":["Protect Secondary Victims","Deflect Attacks","Mitigate Attacks","Post-attack Forensics"],"answer":"Protect Secondary Victims","explanation":"Protecting secondary victims reduces the number of systems available as DDoS agents.","id":"S02Q28"},{"concept_id":"DDoS Case Study::Case random scan","variant":2,"category":"DDoS Case Study","question":"Propagation slows as more already-infected addresses are hit again. Which scan is being used?","choices":["Random Scanning","Hit-list Scanning","Topological Scanning","Permutation Scanning"],"answer":"Random Scanning","explanation":"Random scanning probes addresses without coordinated target allocation.","id":"S02Q29"},{"concept_id":"Botnets::Hitlist split","variant":2,"category":"Botnets","question":"What technique splits the remaining list between newly compromised machines?","choices":["Hit-list scanning","Random scanning","Topological scanning","Local subnet scanning"],"answer":"Hit-list scanning","explanation":"Hit-list scanning divides the list to parallelize propagation.","id":"S02Q30"},{"concept_id":"DoS/DDoS Attack Countermeasures::SensorBase","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What network supplies reputation information about botnets and malware to Cisco IPS?","choices":["Cisco SensorBase Network","DNS root hints","NTP pool","DHCP snooping table"],"answer":"Cisco SensorBase Network","explanation":"The course names Cisco SensorBase as the reputation source.","id":"S02Q31"},{"concept_id":"DoS/DDoS Protection Tools::Akamai console","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which mitigation service exposes its protection through a named Security Center interface?","choices":["Akamai","LOIC","UFONet","HULK"],"answer":"Akamai","explanation":"The course lists Akamai and its Security Center console among DDoS protection options.","id":"S02Q32"},{"concept_id":"Botnets::Owner role","variant":2,"category":"Botnets","question":"Which role owns or directs the C&C infrastructure?","choices":["Botnet owner/attacker","Reflector victim","ISP customer","Honeynet operator"],"answer":"Botnet owner/attacker","explanation":"The attacker or botnet owner directs the botnet.","id":"S02Q33"},{"concept_id":"DoS/DDoS Attack Countermeasures::Ingress","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What control validates inbound source addresses at the perimeter?","choices":["Ingress filtering","Egress filtering","Load balancing","Traffic shaping only"],"answer":"Ingress filtering","explanation":"Ingress filtering checks traffic entering the network.","id":"S02Q34"},{"concept_id":"DDoS Case Study::Case rps","variant":1,"category":"DDoS Case Study","question":"A web application is overloaded by huge request counts despite modest bandwidth. Which category fits?","choices":["Application-layer attack","Volumetric attack","Protocol attack","Physical attack"],"answer":"Application-layer attack","explanation":"Application-layer attacks are measured in rps and target application resources.","id":"S02Q35"},{"concept_id":"DoS/DDoS Attack Countermeasures::Honeypot deflect","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which countermeasure category intentionally attracts attackers away from real assets?","choices":["Deflect Attacks","Protect Secondary Victims","Prevent Potential Attacks","Post-attack Forensics"],"answer":"Deflect Attacks","explanation":"Honeypots are used to deflect and study attacks.","id":"S02Q36"},{"concept_id":"DDoS Case Study::Case Smurf","variant":1,"category":"DDoS Case Study","question":"A victim suddenly receives ICMP replies from many hosts on one broadcast network. Which attack fits best?","choices":["Smurf","Fraggle","SYN Flood","Slowloris"],"answer":"Smurf","explanation":"This pattern matches Smurf: ICMP Echo sent to broadcast with the victim spoofed as source.","id":"S02Q37"},{"concept_id":"DoS/DDoS Attack Countermeasures::Antivirus bots","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What endpoint protection should be kept updated against bot malware?","choices":["Anti-virus and anti-Trojan software","Open relays","WPS","Anonymous FTP"],"answer":"Anti-virus and anti-Trojan software","explanation":"Updated anti-malware helps prevent compromise into botnet agents.","id":"S02Q38"},{"concept_id":"DoS/DDoS Concepts::Connection timeout","variant":1,"category":"DoS/DDoS Concepts","question":"Why do shorter connection timeouts help against slow attacks?","choices":["Close incomplete/idle connections sooner","Increase response body size","Disable logging","Extend session lifetime"],"answer":"Close incomplete/idle connections sooner","explanation":"Shorter timeouts release resources tied up by deliberately slow or incomplete clients.","id":"S02Q39"},{"concept_id":"DoS/DDoS Attack Countermeasures::ISP filtering","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which mitigation can stop attack traffic before it consumes the victim link?","choices":["ISP filtering","Local browser extension","Host file editing","USB control"],"answer":"ISP filtering","explanation":"ISP filtering removes traffic upstream before it reaches the victim connection.","id":"S02Q40"},{"concept_id":"Botnets::Permutation cipher","variant":1,"category":"Botnets","question":"Which scanning method uses a 32-bit block cipher and preselected key?","choices":["Permutation Scanning","Random Scanning","Local Subnet Scanning","Hit-list Scanning"],"answer":"Permutation Scanning","explanation":"The course describes permutation scanning as using a 32-bit block cipher with a preselected key.","id":"S02Q41"},{"concept_id":"DoS/DDoS Protection Tools::BlockDoS","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which defensive product appears in the official protection-tool list?","choices":["BlockDoS","UFONet","LOIC","Slowloris"],"answer":"BlockDoS","explanation":"BlockDoS is listed among DoS/DDoS protection services.","id":"S02Q42"},{"concept_id":"DoS/DDoS Attack Techniques::Fragmentation","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack floods a target with fragments that cannot be reassembled?","choices":["Fragmentation Attack","SYN Flood","HTTP GET Flood","Smurf"],"answer":"Fragmentation Attack","explanation":"Fragmentation attacks send TCP/UDP fragments that cannot be properly reassembled.","id":"S02Q43"},{"concept_id":"Botnets::Instruction step","variant":1,"category":"Botnets","question":"What happens after bots establish C&C communication?","choices":["Bots receive attack instructions","Bots patch the victim","Bots delete C&C","Bots join a CDN"],"answer":"Bots receive attack instructions","explanation":"The C&C center sends attack instructions to bots.","id":"S02Q44"},{"concept_id":"DoS/DDoS Concepts::Broadcast amplification","variant":2,"category":"DoS/DDoS Concepts","question":"Which destination causes many hosts to answer one spoofed request?","choices":["Broadcast address","Loopback address","Multicast DNS only","Default gateway MAC"],"answer":"Broadcast address","explanation":"A broadcast request can trigger replies from many hosts at once.","id":"S02Q45"},{"concept_id":"DoS/DDoS Concepts::Flooding","variant":2,"category":"DoS/DDoS Concepts","question":"What attack style relies on raw request volume rather than response multiplication?","choices":["Flooding","Amplification","Deflection","Honeypotting"],"answer":"Flooding","explanation":"Flood attacks consume resources through high traffic volume.","id":"S02Q46"},{"concept_id":"DoS/DDoS Concepts::Volumetric examples","variant":2,"category":"DoS/DDoS Concepts","question":"Which set belongs to the bandwidth-exhaustion category?","choices":["UDP flood, ICMP flood, Smurf","SYN flood, ACK flood, SACK panic","Slowloris, HTTP POST, RDDoS","Teardrop, LAND, SQL injection"],"answer":"UDP flood, ICMP flood, Smurf","explanation":"UDP flood, ICMP flood, Smurf, and amplification attacks are volumetric examples.","id":"S02Q47"},{"concept_id":"DoS/DDoS Concepts::Volumetric metric","variant":1,"category":"DoS/DDoS Concepts","question":"How is a volumetric DDoS attack typically measured?","choices":["Bits per second (bps)","Packets per second (pps)","Requests per second (rps)","Connections per minute (cpm)"],"answer":"Bits per second (bps)","explanation":"Volumetric attacks consume bandwidth and are measured in bits per second.","id":"S02Q48"},{"concept_id":"DoS/DDoS Concepts::Handler","variant":2,"category":"DoS/DDoS Concepts","question":"What botnet component sits between the attacker and many zombies in the course flow?","choices":["Handler","Reflector","Victim","Load balancer"],"answer":"Handler","explanation":"Handlers coordinate or relay instructions to botnet agents.","id":"S02Q49"},{"concept_id":"Botnets::Propagation step","variant":2,"category":"Botnets","question":"What do infected systems search for to add more bots?","choices":["Other vulnerable systems","Only DNS root servers","Only honeypots","Only the primary target"],"answer":"Other vulnerable systems","explanation":"Bots may scan for other vulnerable systems and infect them.","id":"S02Q50"}],[{"concept_id":"DoS/DDoS Protection Tools::Stormwall","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which listed mitigation provider uses the PRO product label?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"Stormwall PRO","explanation":"Stormwall PRO is listed among DDoS protection services.","id":"S03Q01"},{"concept_id":"DoS/DDoS Concepts::Smurf duplicate","variant":1,"category":"DoS/DDoS Concepts","question":"In the supplied notes, what are successive Smurf replies after the first called?","choices":["Duplicates","Fragments","Tokens","Sessions"],"answer":"Duplicates","explanation":"The supplementary notes call successive Smurf responses duplicates.","id":"S03Q02"},{"concept_id":"DoS/DDoS Attack Countermeasures::IP Source Guard","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which Cisco feature filters traffic using DHCP snooping or IP bindings?","choices":["IP Source Guard","Port Security only","DNSSEC","HSTS"],"answer":"IP Source Guard","explanation":"IP Source Guard validates source addressing against trusted bindings.","id":"S03Q03"},{"concept_id":"DoS/DDoS Attack Techniques::ACK spoof","variant":1,"category":"DoS/DDoS Attack Techniques","question":"What packet type dominates an ACK flood?","choices":["ACK/PUSH-ACK packets","ICMP Echo Replies","ARP Requests","DNS TXT records"],"answer":"ACK/PUSH-ACK packets","explanation":"ACK/PUSH-ACK floods send large numbers of spoofed TCP acknowledgment packets.","id":"S03Q04"},{"concept_id":"DoS/DDoS Attack Techniques::Prot pps","variant":2,"category":"DoS/DDoS Attack Techniques","question":"What category includes SYN flood, fragmentation, and ACK flood?","choices":["Protocol attacks","Volumetric attacks","Application-layer attacks","Physical attacks"],"answer":"Protocol attacks","explanation":"Protocol attacks are measured in packets per second.","id":"S03Q05"},{"concept_id":"Botnets::Permutation restart","variant":1,"category":"Botnets","question":"Which scanning method uses random restart points within a shared address order?","choices":["Permutation Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Permutation Scanning","explanation":"Permutation scanning uses restart points in a shared pseudorandom list.","id":"S03Q06"},{"concept_id":"DDoS Case Study::Case topology","variant":1,"category":"DDoS Case Study","question":"A bot extracts URLs from the infected host to find its next targets. Which method fits?","choices":["Topological Scanning","Random Scanning","Permutation Scanning","Local Subnet Scanning"],"answer":"Topological Scanning","explanation":"Topological scanning uses host-local information such as URLs to discover targets.","id":"S03Q07"},{"concept_id":"DoS/DDoS Concepts::Connection queue","variant":1,"category":"DoS/DDoS Concepts","question":"Which server structure is exhausted by many incomplete TCP handshakes?","choices":["Connection queue","DNS cache","ARP table only","Routing metric"],"answer":"Connection queue","explanation":"SYN floods fill the server queue used to track incomplete connections.","id":"S03Q08"},{"concept_id":"DoS/DDoS Attack Countermeasures::Traffic analysis","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which technique identifies handler-agent communication patterns?","choices":["Network Traffic Analysis","Black Hole Filtering","Load Balancing","Honeypotting"],"answer":"Network Traffic Analysis","explanation":"Traffic analysis can reveal C&C relationships and compromised nodes.","id":"S03Q09"},{"concept_id":"DoS/DDoS Concepts::RDDoS concept","variant":1,"category":"DoS/DDoS Concepts","question":"What is another name for extortion based on denial-of-service threats?","choices":["Ransom DDoS (RDDoS)","Distributed Reflection DoS","Permanent DoS","Pulse Wave DoS"],"answer":"Ransom DDoS (RDDoS)","explanation":"DDoS extortion is also called ransom DDoS or RDDoS.","id":"S03Q10"},{"concept_id":"DoS/DDoS Protection Tools::Azure","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which hyperscaler in the supplementary notes can provide elastic capacity against floods?","choices":["Azure","HULK","HOIC","Slowloris"],"answer":"Azure","explanation":"Azure is listed as a cloud provider that can help absorb DDoS traffic.","id":"S03Q11"},{"concept_id":"DoS/DDoS Attack Techniques::Smurf vs Fraggle","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which pairing correctly distinguishes the two broadcast amplification attacks?","choices":["Smurf uses ICMP; Fraggle uses UDP","Smurf uses TCP; Fraggle uses ICMP","Smurf uses UDP; Fraggle uses TCP","Both use only TCP"],"answer":"Smurf uses ICMP; Fraggle uses UDP","explanation":"Smurf uses ICMP broadcast traffic, while Fraggle uses UDP.","id":"S03Q12"},{"concept_id":"DoS/DDoS Attack Countermeasures::Threat intel","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What information source helps defenders recognize known malicious infrastructure?","choices":["Threat intelligence sharing","Disable logging","Open recursive DNS","Static default passwords"],"answer":"Threat intelligence sharing","explanation":"Sharing threat intelligence improves detection and preparedness.","id":"S03Q13"},{"concept_id":"DoS/DDoS Concepts::Protocol metric","variant":2,"category":"DoS/DDoS Concepts","question":"Which metric best represents connection-state exhaustion?","choices":["Packets per second (pps)","Bits per second (bps)","Requests per second (rps)","Users per second"],"answer":"Packets per second (pps)","explanation":"Protocol attacks are commonly measured in packets per second.","id":"S03Q14"},{"concept_id":"DoS/DDoS Attack Techniques::Single-session flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which HTTP flood sends many requests within one session?","choices":["Single-Session HTTP Flood","Single-Request HTTP Flood","Recursive GET Flood","Random Recursive GET Flood"],"answer":"Single-Session HTTP Flood","explanation":"Single-session HTTP flood sends many requests within one established session.","id":"S03Q15"},{"concept_id":"DoS/DDoS Attack Techniques::SNMP amp","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which UDP-based network-management service can be abused for large reflected replies?","choices":["SNMP","SMTP","SMB","SFTP"],"answer":"SNMP","explanation":"SNMP is listed as a possible amplification protocol.","id":"S03Q16"},{"concept_id":"DoS/DDoS Concepts::Bot definition","variant":2,"category":"DoS/DDoS Concepts","question":"Which description best matches a bot?","choices":["Automated software on a compromised host","A physical firewall appliance","A DNS authoritative server","A honeynet sensor"],"answer":"Automated software on a compromised host","explanation":"A bot is software that performs automated tasks under attacker control.","id":"S03Q17"},{"concept_id":"DoS/DDoS Protection Tools::Scrubbing service","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which service type filters attack traffic and forwards clean traffic?","choices":["DDoS scrubbing service","LOIC flooder","Open DNS resolver","Botnet handler"],"answer":"DDoS scrubbing service","explanation":"Scrubbing services filter malicious traffic before forwarding legitimate traffic.","id":"S03Q18"},{"concept_id":"DoS/DDoS Attack Countermeasures::Perimeter surveillance","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which strategy continuously watches the network edge for attack behavior?","choices":["Advanced network-level surveillance","Open guest access","Longer session lifetimes","Disabled logging"],"answer":"Advanced network-level surveillance","explanation":"Perimeter monitoring helps detect and respond to abnormal DDoS traffic.","id":"S03Q19"},{"concept_id":"DoS/DDoS Attack Countermeasures::Forensics logs","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which post-attack sources help identify the DDoS technique used?","choices":["Router, firewall, and IDS logs","Only browser history","Only DNS cache","Only user passwords"],"answer":"Router, firewall, and IDS logs","explanation":"Post-attack forensics analyzes network and security logs.","id":"S03Q20"},{"concept_id":"Botnets::Botnet phishing","variant":2,"category":"Botnets","question":"What social attack can be delivered at scale by compromised hosts?","choices":["Phishing","Segmentation","Ingress filtering","SYN cookies"],"answer":"Phishing","explanation":"Botnets can support phishing campaigns and malicious-site traffic.","id":"S03Q21"},{"concept_id":"DoS/DDoS Concepts::Upstream mitigation","variant":2,"category":"DoS/DDoS Concepts","question":"What advantage does upstream filtering provide?","choices":["Drops traffic before it reaches the victim link","Increases victim bandwidth usage","Disables all routing","Encrypts botnet traffic"],"answer":"Drops traffic before it reaches the victim link","explanation":"Upstream filtering can remove attack traffic before it saturates the victim connection.","id":"S03Q22"},{"concept_id":"DoS/DDoS Attack Countermeasures::Capacity mgmt","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which mitigation family preserves service by managing available capacity?","choices":["Capacity management","Credential management","Key management","Source-code management"],"answer":"Capacity management","explanation":"These techniques reduce attack impact while preserving capacity for legitimate users.","id":"S03Q23"},{"concept_id":"Botnets::Local hidden","variant":1,"category":"Botnets","question":"Which scanning method exploits knowledge of hidden local addressing?","choices":["Local Subnet Scanning","Random Scanning","Permutation Scanning","Hit-list Scanning"],"answer":"Local Subnet Scanning","explanation":"Local subnet scanning uses access to internal address space from an already compromised host.","id":"S03Q24"},{"concept_id":"Botnets::Phishing recruitment","variant":2,"category":"Botnets","question":"What social technique is used to lure users into infection pages?","choices":["Phishing/social engineering","Rate limiting","Blackholing","Load balancing"],"answer":"Phishing/social engineering","explanation":"The setup uses phishing/social engineering to drive users to malicious content.","id":"S03Q25"},{"concept_id":"DoS/DDoS Attack Countermeasures::CDN mitigation","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What role do Cloudflare/Akamai-style services provide?","choices":["CDN/DDoS mitigation service","Local DHCP server","Endpoint password manager","Internal printer server"],"answer":"CDN/DDoS mitigation service","explanation":"CDN/DDoS services absorb, distribute, and filter attack traffic.","id":"S03Q26"},{"concept_id":"DoS/DDoS Attack Countermeasures::Traceback","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Who may assist with tracing the attack path after a DDoS?","choices":["Intermediary ISPs and law enforcement","Only local users","Only certificate authorities","Only cloud developers"],"answer":"Intermediary ISPs and law enforcement","explanation":"Traceback may require cooperation from upstream ISPs and law enforcement.","id":"S03Q27"},{"concept_id":"DoS/DDoS Attack Techniques::Pulse scale","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which periodic attack can produce individual bursts in the hundreds of Gbps?","choices":["Pulse Wave DDoS","RUDY","LAND","Teardrop"],"answer":"Pulse Wave DDoS","explanation":"The course describes Pulse Wave attacks with very large periodic traffic bursts.","id":"S03Q28"},{"concept_id":"DoS/DDoS Attack Techniques::Teardrop","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which crash-style DoS breaks IP fragment reassembly with overlaps?","choices":["Teardrop","LAND","Fraggle","Smurf"],"answer":"Teardrop","explanation":"Teardrop uses overlapping IP fragment offsets that vulnerable stacks cannot reassemble safely.","id":"S03Q29"},{"concept_id":"DoS/DDoS Protection Tools::LOIC purpose","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which tool generates flood traffic and is associated with hacktivism?","choices":["LOIC","A10 Thunder TPS","Akamai","Nexusguard"],"answer":"LOIC","explanation":"LOIC is an attack-generation tool, not a protection service.","id":"S03Q30"},{"concept_id":"DDoS Case Study::Case LAND","variant":1,"category":"DDoS Case Study","question":"A TCP packet has identical source and destination IP addresses and ports. Which attack fits?","choices":["LAND","Teardrop","Fraggle","Smurf"],"answer":"LAND","explanation":"LAND sets source and destination to the same values, confusing vulnerable systems.","id":"S03Q31"},{"concept_id":"Botnets::Random traffic","variant":1,"category":"Botnets","question":"Which scanning method generates significant unnecessary traffic?","choices":["Random scanning","Hit-list scanning","Topological scanning","Permutation scanning"],"answer":"Random scanning","explanation":"Random scanning can create substantial scan traffic.","id":"S03Q32"},{"concept_id":"DDoS Case Study::Case blackhole","variant":1,"category":"DDoS Case Study","question":"A router silently discards all traffic destined for the attacked prefix. Which mitigation is in use?","choices":["Black Hole Filtering","Load Balancing","Honeypot Deflection","SYN Cookies"],"answer":"Black Hole Filtering","explanation":"Black-hole filtering discards routed traffic to protect upstream resources, often at the cost of reachability.","id":"S03Q33"},{"concept_id":"DoS/DDoS Attack Techniques::RDDoS","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack threatens a larger outage unless ransom is paid?","choices":["Ransom DDoS (RDDoS)","DRDoS","PDoS","Pulse Wave DDoS"],"answer":"Ransom DDoS (RDDoS)","explanation":"RDDoS combines DDoS capability with an extortion demand.","id":"S03Q34"},{"concept_id":"DoS/DDoS Attack Techniques::ICMP flood","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack overwhelms a target with Echo Requests?","choices":["UDP Flood","ICMP Flood","Ping of Death","Smurf"],"answer":"ICMP Flood","explanation":"ICMP floods send large numbers of Echo Requests, often with spoofed sources.","id":"S03Q35"},{"concept_id":"Botnets::Botnet data theft","variant":1,"category":"Botnets","question":"Which botnet use targets confidential information rather than availability?","choices":["Data theft","Load balancing","Traffic scrubbing","Patch deployment"],"answer":"Data theft","explanation":"Botnets can support data theft, phishing, and other criminal activity.","id":"S03Q36"},{"concept_id":"DoS/DDoS Concepts::Application examples","variant":2,"category":"DoS/DDoS Concepts","question":"Which set targets web/application resources rather than bandwidth?","choices":["Slowloris, HTTP GET, HTTP POST","Smurf, Fraggle, NTP amplification","SYN flood, ACK flood, fragmentation","LAND, Teardrop, Ping of Death"],"answer":"Slowloris, HTTP GET, HTTP POST","explanation":"Slowloris and HTTP GET/POST attacks are application-layer techniques.","id":"S03Q37"},{"concept_id":"DoS/DDoS Protection Tools::Slowloris tool","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which HTTP connection-exhaustion tool appears directly in the official tool list?","choices":["Slowloris","Akamai","BlockDoS","Nexusguard"],"answer":"Slowloris","explanation":"Slowloris appears as a DoS attack technique/tool in the course.","id":"S03Q38"},{"concept_id":"DDoS Case Study::Case SYN","variant":2,"category":"DDoS Case Study","question":"The TCP backlog is full of half-open connections. What is the likely attack?","choices":["SYN Flood","SYN-ACK Flood","ACK Flood","Smurf"],"answer":"SYN Flood","explanation":"SYN flood fills the connection queue with incomplete handshakes.","id":"S03Q39"},{"concept_id":"DoS/DDoS Concepts::DoS vs access","variant":1,"category":"DoS/DDoS Concepts","question":"Which goal is NOT required for a DoS attack?","choices":["Unauthorized access","Resource exhaustion","Service unavailability","Operational disruption"],"answer":"Unauthorized access","explanation":"A DoS attack can succeed without gaining unauthorized access.","id":"S03Q40"},{"concept_id":"DoS/DDoS Concepts::Cloud absorption","variant":2,"category":"DoS/DDoS Concepts","question":"What advantage does hyperscale infrastructure provide during floods?","choices":["Large distributed capacity","Guaranteed source attribution","No need for routing","Automatic password rotation"],"answer":"Large distributed capacity","explanation":"Cloud providers can absorb and distribute very large traffic volumes.","id":"S03Q41"},{"concept_id":"Botnets::Local subnet","variant":2,"category":"Botnets","question":"What propagation technique is especially useful behind a firewall?","choices":["Local Subnet Scanning","Random Scanning","Hit-list Scanning","Topological Scanning"],"answer":"Local Subnet Scanning","explanation":"Local subnet scanning searches for vulnerable systems on the same internal network.","id":"S03Q42"},{"concept_id":"DoS/DDoS Protection Tools::Protection classification","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which group contains only defensive DDoS products/services?","choices":["A10 Thunder TPS, Akamai, Nexusguard","LOIC, HOIC, HULK","Slowloris, UFONet, LOIC","HULK, BlockDoS, HOIC"],"answer":"A10 Thunder TPS, Akamai, Nexusguard","explanation":"A10 Thunder TPS, Akamai, and Nexusguard are defensive products/services.","id":"S03Q43"},{"concept_id":"DoS/DDoS Protection Tools::Imperva","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which vendor service is explicitly listed for DDoS protection?","choices":["Imperva DDoS Protection","UFONet","Slowloris","HULK"],"answer":"Imperva DDoS Protection","explanation":"Imperva DDoS Protection is one of the listed protection services.","id":"S03Q44"},{"concept_id":"DoS/DDoS Attack Techniques::DNS amp","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which attack commonly spoofs the victim address in DNS requests?","choices":["DNS Amplification","Smurf","SYN Flood","LAND"],"answer":"DNS Amplification","explanation":"DNS amplification uses small spoofed UDP queries to generate larger responses toward the victim.","id":"S03Q45"},{"concept_id":"DDoS Case Study::Case Apache","variant":2,"category":"DDoS Case Study","question":"Many overlapping Range values cause memory pressure. What attack is this?","choices":["Apache Killer","RUDY","Slowloris","Slow Read"],"answer":"Apache Killer","explanation":"Apache Killer abuses overlapping byte ranges.","id":"S03Q46"},{"concept_id":"DoS/DDoS Concepts::Spoofed victim IP","variant":1,"category":"DoS/DDoS Concepts","question":"Why is the victim IP spoofed in reflection attacks?","choices":["Replies are redirected to the victim","The attacker gains shell access","The victim authenticates the attacker","The reflector disables logging"],"answer":"Replies are redirected to the victim","explanation":"Spoofing the victim as the source causes reflector responses to be sent to the victim.","id":"S03Q47"},{"concept_id":"DDoS Case Study::Case RDDoS","variant":2,"category":"DDoS Case Study","question":"The attacker threatens a much larger outage unless cryptocurrency is paid. What is this?","choices":["Ransom DDoS (RDDoS)","DRDoS","PDoS","Smurf"],"answer":"Ransom DDoS (RDDoS)","explanation":"RDDoS uses DDoS capability as leverage for extortion.","id":"S03Q48"},{"concept_id":"DoS/DDoS Attack Countermeasures::Honeynet","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"Which decoy contains real computers and applications to capture attacks?","choices":["Honeynet","Black hole","Botnet","CDN"],"answer":"Honeynet","explanation":"A honeynet is a high-interaction decoy network.","id":"S03Q49"},{"concept_id":"Botnets::Botnet spam","variant":2,"category":"Botnets","question":"What mass-messaging behavior is listed in the ecosystem?","choices":["Spam","Honeypotting","Rate limiting","Patch management"],"answer":"Spam","explanation":"Spam and mass mailing are common botnet uses.","id":"S03Q50"}],[{"concept_id":"DoS/DDoS Protection Tools::Akamai","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which listed service provides DDoS protection through a large distributed edge network?","choices":["Huawei AntiDDoS1000","A10 Thunder TPS","Akamai","Stormwall PRO"],"answer":"Akamai","explanation":"Akamai is listed as a DDoS protection service/provider.","id":"S04Q01"},{"concept_id":"DoS/DDoS Protection Tools::A10 opex","variant":1,"category":"DoS/DDoS Protection Tools","question":"Which A10 Thunder TPS feature concerns operational cost?","choices":["Reduce security OpEx","Increase bot count","Disable automation","Maximize packet loss"],"answer":"Reduce security OpEx","explanation":"The course lists reducing security OpEx as a Thunder TPS feature.","id":"S04Q02"},{"concept_id":"DoS/DDoS Protection Tools::slowhttptest","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which supplementary utility is designed to test several slow HTTP DoS behaviors?","choices":["slowhttptest","LOIC","A10 Thunder TPS","Nexusguard"],"answer":"slowhttptest","explanation":"The supplementary notes describe slowhttptest as supporting several slow HTTP attack simulations.","id":"S04Q03"},{"concept_id":"DDoS Case Study::Case RUDY","variant":1,"category":"DDoS Case Study","question":"A POST declares a huge body but sends one byte at a time. Which attack fits?","choices":["RUDY","Slowloris","Slow Read","Apache Killer"],"answer":"RUDY","explanation":"RUDY uses a slow POST body with a large Content-Length.","id":"S04Q04"},{"concept_id":"DoS/DDoS Attack Countermeasures::Black hole","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which defense silently discards incoming traffic at the routing layer?","choices":["Black Hole Filtering","Load Balancing","TCP Intercept","Honeypotting"],"answer":"Black Hole Filtering","explanation":"Black-hole filtering drops traffic without notifying the sender.","id":"S04Q05"},{"concept_id":"DoS/DDoS Concepts::Rate limiting","variant":2,"category":"DoS/DDoS Concepts","question":"Which control caps how quickly requests or packets are accepted?","choices":["Traffic/request rate","Source-code size","Encryption key length","Disk sector count"],"answer":"Traffic/request rate","explanation":"Rate limiting restricts how much traffic or how many requests are accepted over time.","id":"S04Q06"},{"concept_id":"DoS/DDoS Concepts::Application metric","variant":2,"category":"DoS/DDoS Concepts","question":"Which metric best represents application request pressure?","choices":["Requests per second (rps)","Packets per second (pps)","Bits per second (bps)","Bytes per route"],"answer":"Requests per second (rps)","explanation":"Application-layer attacks are measured in requests per second.","id":"S04Q07"},{"concept_id":"DoS/DDoS Attack Techniques::Zero day","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which attack type exploits an unpatched, newly discovered DoS weakness?","choices":["Zero-Day DDoS","Pulse Wave DDoS","Smurf","SYN Flood"],"answer":"Zero-Day DDoS","explanation":"A zero-day DDoS exploits a vulnerability before a patch or established defense exists.","id":"S04Q08"},{"concept_id":"DoS/DDoS Concepts::Slow attack principle","variant":2,"category":"DoS/DDoS Concepts","question":"Which resource model makes slow attacks effective without saturating bandwidth?","choices":["Server connections/threads/memory","Only WAN bandwidth","Only DNS cache entries","Only CPU instruction cache"],"answer":"Server connections/threads/memory","explanation":"Slow attacks hold server-side resources such as connections, threads, or memory.","id":"S04Q09"},{"concept_id":"DoS/DDoS Concepts::DoS goal","variant":1,"category":"DoS/DDoS Concepts","question":"What is the primary objective of a DoS attack?","choices":["Prevent legitimate access","Steal credentials","Modify database records","Gain administrator privileges"],"answer":"Prevent legitimate access","explanation":"DoS aims to reduce or prevent legitimate access to resources, not to obtain unauthorized access.","id":"S04Q10"},{"concept_id":"Botnets::Traffic analysis handler","variant":2,"category":"Botnets","question":"What defensive analysis looks for repeated botnet C&C traffic patterns?","choices":["Network traffic analysis","Password spraying","File carving","Static code signing"],"answer":"Network traffic analysis","explanation":"Network traffic analysis can reveal protocols and patterns used between handlers and agents.","id":"S04Q11"},{"concept_id":"DoS/DDoS Attack Techniques::HTTP GET slow header","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which web DoS keeps a server waiting for a full request header?","choices":["HTTP GET Attack","HTTP POST Attack","Slow Read","DNS Amplification"],"answer":"HTTP GET Attack","explanation":"The course describes an HTTP GET attack with time-delayed or incomplete header data.","id":"S04Q12"},{"concept_id":"DoS/DDoS Protection Tools::GCP","variant":2,"category":"DoS/DDoS Protection Tools","question":"Which hyperscaler is grouped with AWS and Azure in the supplementary defense notes?","choices":["Google Cloud (GCP)","LOIC","Packet Flooder","UFONet"],"answer":"Google Cloud (GCP)","explanation":"Google Cloud is listed as a cloud provider able to absorb large-scale traffic.","id":"S04Q13"},{"concept_id":"DDoS Case Study::Case Fraggle","variant":1,"category":"DDoS Case Study","question":"A broadcast network sends large volumes of UDP replies to one spoofed victim. Which attack fits?","choices":["Fraggle","Smurf","LAND","Teardrop"],"answer":"Fraggle","explanation":"Fraggle is the UDP counterpart to Smurf-style broadcast amplification.","id":"S04Q14"},{"concept_id":"DoS/DDoS Attack Countermeasures::Drop requests","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which mitigation directly discards selected requests during overload?","choices":["Drop requests","Increase timeouts","Enable broadcast","Disable logging"],"answer":"Drop requests","explanation":"Dropping selected requests reduces load on the protected service.","id":"S04Q15"},{"concept_id":"Botnets::Hitlist list","variant":2,"category":"Botnets","question":"What propagation method uses an attacker-prepared target list?","choices":["Hit-list scanning","Random scanning","Topological scanning","Permutation scanning"],"answer":"Hit-list scanning","explanation":"Hit-list scanning begins with a prepared list of likely vulnerable hosts.","id":"S04Q16"},{"concept_id":"DoS/DDoS Concepts::DDoS definition","variant":2,"category":"DoS/DDoS Concepts","question":"Which characteristic best separates a distributed outage from a single-source one?","choices":["Multiple attacking systems","Encrypted payloads","Physical access","A single spoofed packet"],"answer":"Multiple attacking systems","explanation":"DDoS uses many compromised or coordinated systems against one target.","id":"S04Q17"},{"concept_id":"DDoS Case Study::Case PoD","variant":2,"category":"DDoS Case Study","question":"The only unusual traffic is an oversized ICMP packet. What is the likely attack?","choices":["Ping of Death","Smurf","ICMP Flood","LAND"],"answer":"Ping of Death","explanation":"Ping of Death uses malformed/oversized ICMP packets.","id":"S04Q18"},{"concept_id":"Botnets::Bot purposes crime","variant":2,"category":"Botnets","question":"What non-availability activity appears in the botnet ecosystem?","choices":["Cybercrime operations","Software patching","Network segmentation","Traffic shaping"],"answer":"Cybercrime operations","explanation":"Botnets support many criminal activities beyond DDoS.","id":"S04Q19"},{"concept_id":"DoS/DDoS Attack Techniques::CHARGEN","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which character-generation service is explicitly named in the DRDoS countermeasure?","choices":["CHARGEN","SSH","LDAP","Kerberos"],"answer":"CHARGEN","explanation":"The course recommends disabling CHARGEN to reduce a classic reflection/amplification vector.","id":"S04Q20"},{"concept_id":"DDoS Case Study::Case SYNACK","variant":2,"category":"DDoS Case Study","question":"Large volumes of SYN-ACK packets consume resources without normal sessions. What is this?","choices":["SYN-ACK Flood","SYN Flood","ACK Flood","Fragmentation Attack"],"answer":"SYN-ACK Flood","explanation":"SYN-ACK flood abuses the second stage of the TCP handshake.","id":"S04Q21"},{"concept_id":"DoS/DDoS Attack Techniques::PDoS","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which denial-of-service attack tries to brick hardware with corrupted firmware?","choices":["Permanent DoS (PDoS)","Pulse Wave DDoS","Slowloris","Smurf"],"answer":"Permanent DoS (PDoS)","explanation":"PDoS or phlashing aims to cause irreversible damage through malicious firmware changes.","id":"S04Q22"},{"concept_id":"DoS/DDoS Attack Countermeasures::Assertive timeouts","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which configuration helps remove semi-open or slow connections sooner?","choices":["Assertive connection timeouts","Longer idle sessions","Open keepalive forever","Disabled TCP timers"],"answer":"Assertive connection timeouts","explanation":"Aggressive/appropriate timeouts reduce resource exhaustion from slow or incomplete connections.","id":"S04Q23"},{"concept_id":"Botnets::Bot purposes malware","variant":2,"category":"Botnets","question":"What can infected bots do to grow the malicious ecosystem?","choices":["Spread malware","Issue certificates","Run DHCP securely","Reduce attack surface"],"answer":"Spread malware","explanation":"Botnets can spread malware and infect additional systems.","id":"S04Q24"},{"concept_id":"DoS/DDoS Attack Countermeasures::Update defenses","variant":1,"category":"DoS/DDoS Attack Countermeasures","question":"Which maintenance practice helps secondary victims stay resistant to agents?","choices":["Configure and update them regularly","Disable them permanently","Expose them to the Internet","Share default passwords"],"answer":"Configure and update them regularly","explanation":"The course recommends proper configuration and regular updates of defensive mechanisms.","id":"S04Q25"},{"concept_id":"DoS/DDoS Attack Techniques::NTP amp","variant":1,"category":"DoS/DDoS Attack Techniques","question":"Which protocol is listed as an amplification source besides DNS?","choices":["NTP","SSH","RDP","LDAP"],"answer":"NTP","explanation":"NTP is one of the protocols listed for amplification attacks.","id":"S04Q26"},{"concept_id":"DoS/DDoS Attack Techniques::Random recursive","variant":2,"category":"DoS/DDoS Attack Techniques","question":"Which recursive attack randomizes page targets within a valid range?","choices":["Random Recursive GET Flood","Recursive HTTP GET Flood","Single-Request HTTP Flood","Slow Read"],"answer":"Random Recursive GET Flood","explanation":"Random recursive GET floods vary page numbers to generate repeated valid-looking requests.","id":"S04Q27"},{"concept_id":"DoS/DDoS Concepts::UDP spoofing","variant":1,"category":"DoS/DDoS Concepts","question":"Why is UDP commonly used for amplification?","choices":["No connection handshake","Built-in mutual TLS","Mandatory sequence numbers","Stateful three-way setup"],"answer":"No connection handshake","explanation":"UDP is connectionless, so spoofed source addresses are easier to use.","id":"S04Q28"},{"concept_id":"Botnets::Central control","variant":1,"category":"Botnets","question":"What is the main operational value of C&C to a botnet owner?","choices":["Centralized coordination","Automatic patching","User authentication","Data deduplication"],"answer":"Centralized coordination","explanation":"C&C coordinates bot behavior so many systems can act together.","id":"S04Q29"},{"concept_id":"DDoS Case Study::Case pulse","variant":2,"category":"DDoS Case Study","question":"The attack arrives as periodic pulses rather than one continuous flood. What is it?","choices":["Pulse Wave DDoS","UDP Flood","Slowloris","PDoS"],"answer":"Pulse Wave DDoS","explanation":"Pulse Wave DDoS uses large periodic bursts separated by quieter periods.","id":"S04Q30"},{"concept_id":"DoS/DDoS Attack Countermeasures::Disable echo chargen","variant":2,"category":"DoS/DDoS Attack Countermeasures","question":"What classic services are explicitly named for shutdown in the course?","choices":["Echo and CHARGEN","SSH and HTTPS","LDAP and Kerberos","IMAP and POP3"],"answer":"Echo and CHARGEN","explanation":"The course recommends disabling unnecess
