<head>

<style>
:root {
  --bg:#0f172a; --panel:#111827; --panel2:#172033; --text:#e5e7eb; --muted:#94a3b8;
  --accent:#38bdf8; --good:#22c55e; --bad:#ef4444; --border:#263247; --focus:#facc15;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:linear-gradient(180deg,#0b1220,#0f172a);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%;overflow-x:hidden}
button{font:inherit}
.wrap{width:min(980px,100%);margin:0 auto;padding:22px 16px 40px}
.header{margin-bottom:20px}
h1{font-size:clamp(1.55rem,4vw,2.3rem);margin:.2rem 0 .45rem}
.subtitle{color:var(--muted);line-height:1.5;margin:0}
.card{background:rgba(17,24,39,.96);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.22)}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.series-btn{width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.15s transform,.15s border-color}
.series-btn:hover,.series-btn:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
.series-title{font-weight:800;font-size:1.05rem}
.series-meta{color:var(--muted);font-size:.92rem;margin-top:5px}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.badge{background:#0b1220;border:1px solid var(--border);padding:7px 10px;border-radius:999px}
.progress{height:10px;background:#0b1220;border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:14px 0 22px}
.progress>div{height:100%;background:var(--accent);width:0%;transition:width .2s}
.topic{font-size:.82rem;color:var(--accent);font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin-bottom:10px}
.question{font-size:clamp(1.14rem,2.5vw,1.42rem);font-weight:750;line-height:1.45;margin:0 0 18px}
.answers{display:grid;gap:12px}
.answer{width:100%;text-align:left;background:#121c2e;color:var(--text);border:1px solid var(--border);border-radius:14px;padding:15px 16px;cursor:pointer;line-height:1.4;min-height:54px;touch-action:manipulation}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:var(--accent);outline:none}
.answer:disabled{cursor:default}
.answer.correct{border-color:var(--good);background:rgba(34,197,94,.12)}
.answer.wrong{border-color:var(--bad);background:rgba(239,68,68,.12)}
.key{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;border:1px solid #41506a;color:var(--muted);font-size:.78rem;margin-right:8px;vertical-align:middle}
.feedback{margin-top:18px;border-top:1px solid var(--border);padding-top:16px;display:none}
.feedback.show{display:block}
.result-good{color:var(--good);font-weight:800}
.result-bad{color:var(--bad);font-weight:800}
.explanation{line-height:1.55;color:#d7dee9;margin-top:9px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.primary,.secondary{border-radius:12px;padding:11px 15px;cursor:pointer;border:1px solid var(--border)}
.primary{background:var(--accent);color:#082032;border-color:transparent;font-weight:800}
.secondary{background:#121c2e;color:var(--text)}
.primary:focus-visible,.secondary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.center{text-align:center}
.score-big{font-size:2rem;font-weight:900;margin:6px 0}
.review-item{border:1px solid var(--border);background:#101827;border-radius:14px;padding:16px;margin:12px 0}
.review-q{font-weight:800;line-height:1.45;margin-bottom:10px}
.small{font-size:.9rem;color:var(--muted);line-height:1.45}
.choice-line{margin:5px 0;line-height:1.45}
.footer-note{margin-top:18px;color:var(--muted);font-size:.86rem;line-height:1.5}
@media(max-width:640px){
  .series-grid{grid-template-columns:1fr}
  .wrap{padding:15px 12px 28px}
  .card{padding:16px}
  .answer{padding:14px}
}
</style>
</head>

nation": "`nbtstat -r` displays names resolved by broadcast or WINS.", "topic": "NetBIOS"}, {"question": "Which port is associated with Java RMI registry?", "choices": ["1099", "138", "21", "161"], "correct": 0, "explanation": "Java RMI registry is associated with port 1099.", "topic": "Ports"}, {"question": "Which transport is listed for NetBIOS Datagram Service on port 138?", "choices": ["UDP", "TCP", "TCP/UDP", "ICMP"], "correct": 0, "explanation": "The notes associate NetBIOS Datagram Service on port 138 with UDP.", "topic": "Ports"}, {"question": "Which service is associated with port 135?", "choices": ["Microsoft RPC Endpoint Mapper", "BGP", "SMTP", "NetBIOS Name Service"], "correct": 0, "explanation": "Port 135 is used by Microsoft RPC Endpoint Mapper.", "topic": "Ports"}, {"question": "Which port is associated with LDAP?", "choices": ["389", "161", "21", "22"], "correct": 0, "explanation": "LDAP is associated with port 389.", "topic": "Ports"}, {"question": "Which transport is listed for DNS on port 53?", "choices": ["TCP/UDP", "TCP", "UDP", "ICMP"], "correct": 0, "explanation": "The notes associate DNS on port 53 with TCP/UDP.", "topic": "Ports"}, {"question": "Which transport is listed for ISAKMP/IKE on port 500?", "choices": ["UDP", "TCP", "TCP/UDP", "ICMP"], "correct": 0, "explanation": "The notes associate ISAKMP/IKE on port 500 with UDP.", "topic": "Ports"}, {"question": "Which port is associated with BGP?", "choices": ["179", "25", "53", "2049"], "correct": 0, "explanation": "BGP is associated with port 179.", "topic": "Ports"}, {"question": "Which PsTool is used to terminate processes?", "choices": ["PsKill", "PsInfo", "PsLoggedOn", "PsExec"], "correct": 0, "explanation": "PsKill is used to terminate processes.", "topic": "PsTools"}, {"question": "Which service acts as a directory for Java RMI?", "choices": ["rmiregistry", "rpcbind", "WINS", "DNS"], "correct": 0, "explanation": "rmiregistry stores remote object references.", "topic": "RMI"}, {"question": "Which control protects SMB data integrity?", "choices": ["SMB signing", "DNSSEC", "SPF", "NTP authentication"], "correct": 0, "explanation": "Digital signing protects SMB communications from tampering.", "topic": "SMB"}, {"question": "Which tool is best for broad SMB enumeration on Kali?", "choices": ["enum4linux", "ntpq", "ike-scan", "ldns-walk"], "correct": 0, "explanation": "enum4linux wraps Samba enumeration tools.", "topic": "SMB"}, {"question": "Which Nmap script identifies OS details through SMB?", "choices": ["`smb-os-discovery`", "`smb-protocols`", "`smb-enum-shares`", "`smb-enum-users`"], "correct": 0, "explanation": "`smb-os-discovery` retrieves OS and host details via SMB.", "topic": "SMB"}, {"question": "Which Metasploit module identifies the SMB version?", "choices": ["`auxiliary/scanner/smb/smb_version`", "`auxiliary/scanner/smb/smb_login`", "`auxiliary/scanner/smb/smb_enumshares`", "`auxiliary/scanner/smb/smb_enumusers_domain`"], "correct": 0, "explanation": "`smb_version` identifies SMB/OS version information.", "topic": "SMB"}, {"question": "Which SMTP verb directly validates a username?", "choices": ["VRFY", "EXPN", "DATA", "RESET"], "correct": 0, "explanation": "VRFY directly asks the server to verify a user.", "topic": "SMTP"}, {"question": "Which SMTP command verifies whether a user exists?", "choices": ["`VRFY`", "`EXPN`", "`RCPT TO`", "`EHLO`"], "correct": 0, "explanation": "`VRFY` verifies a user/address.", "topic": "SMTP"}, {"question": "What does `250 Recipient ok` indicate during SMTP enumeration?", "choices": ["The recipient was accepted", "The user is definitely invalid", "The server closed the session", "The zone transfer succeeded"], "correct": 0, "explanation": "250 indicates successful recipient acceptance.", "topic": "SMTP"}, {"question": "Which greeting can return extended server capabilities?", "choices": ["EHLO", "HELO", "VRFY", "RCPT TO"], "correct": 0, "explanation": "EHLO requests ESMTP capabilities.", "topic": "SMTP"}, {"question": "Which MIB focuses on DHCP traffic?", "choices": ["DHCP.MIB", "HOSTMIB.MIB", "WINS.MIB", "LNMIB2.MIB"], "correct": 0, "explanation": "DHCP.MIB monitors DHCP traffic.", "topic": "SNMP"}, {"question": "Which PDU returns the result of a Get request?", "choices": ["Response", "Trap", "Set", "Inform"], "correct": 0, "explanation": "Response carries the agent's reply.", "topic": "SNMP"}, {"question": "Which MIB covers workstation and server service objects?", "choices": ["LNMIB2.MIB", "WINS.MIB", "DHCP.MIB", "HOSTMIB.MIB"], "correct": 0, "explanation": "LNMIB2.MIB contains workstation/server service object types.", "topic": "SNMP"}, {"question": "Which MIB table lists network interfaces?", "choices": ["`ifTable`", "`routeTable`", "`userTable`", "`arpCache`"], "correct": 0, "explanation": "`ifTable` lists interfaces and configuration.", "topic": "SNMP"}, {"question": "Which MIB covers TCP/IP-based Internet management?", "choices": ["MIB_II.MIB", "WINS.MIB", "DHCP.MIB", "HOSTMIB.MIB"], "correct": 0, "explanation": "MIB_II.MIB manages TCP/IP-based Internet objects.", "topic": "SNMP"}, {"question": "Which notation structures SNMP MIBs?", "choices": ["ASN.1", "JSON", "YAML", "XML"], "correct": 0, "explanation": "The notes state MIBs are structured using ASN.1.", "topic": "SNMP"}, {"question": "Which Unix command lists users logged in on local-network hosts?", "choices": ["`rwho`", "`finger`", "`rusers`", "`rpcinfo`"], "correct": 0, "explanation": "`rwho` lists users logged in to local-network hosts.", "topic": "Unix/Linux"}, {"question": "Which social-engineering attack uses voice calls?", "choices": ["Vishing", "SPIT", "Smishing", "DNS snooping"], "correct": 0, "explanation": "Vishing is voice-based phishing.", "topic": "VoIP"}, {"question": "Which VoIP component is commonly discovered by SIP enumeration?", "choices": ["IP-PBX", "NFS export", "SNMP MIB", "DNS zone file"], "correct": 0, "explanation": "SIP enumeration can identify PBX systems and VoIP endpoints.", "topic": "VoIP"}, {"question": "Which web control prevents automatic directory content listing?", "choices": ["Disable directory listing", "Enable verbose banners", "Allow anonymous writes", "Expose server versions"], "correct": 0, "explanation": "Disabling directory listing prevents content listing.", "topic": "Web Enumeration"}]];
const STORAGE_KEY = "ceh_enum_direct_understanding_v1";
let state = null;

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(p){ try{localStorage.setItem(STORAGE_KEY, JSON.stringify(p));}catch(e){} }
function shuffle(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
}

function home(){
  state=null;
  const p=loadProgress();
  const cards=BANK.map((_,i)=>{
    const rec=p[i]||{};
    const best=Number.isInteger(rec.best)?`${rec.best} / 50 — ${Math.round(rec.best*2)}%`:"Not completed";
    return `<button class="series-btn" onclick="startSeries(${i})">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">Best score: ${best}</div>
    </button>`;
  }).join("");
  document.getElementById("app").innerHTML=`
    <div class="header">
      <h1>CEH Enumeration — Direct Concept Practice</h1>
      <p class="subtitle">Short, direct questions. Four plausible answers. No long scenarios and no “objective/constraint” format.</p>
    </div>
    <div class="card">
      <div class="series-grid">${cards}</div>
      <div class="footer-note">Keyboard: press 1–4 to answer. After answering, press Enter for the next question.</div>
    </div>`;
}

function startSeries(index){
  const raw=BANK[index].map((q, qi)=>{
    const choices=q.choices.map((text,idx)=>({text, correct: idx===q.correct}));
    return {...q, originalIndex:qi, shuffled:shuffle(choices)};
  });
  state={series:index, questions:raw, idx:0, correct:0, incorrect:0, answered:false, mistakes:[]};
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.idx];
  const pct=(state.idx/50)*100;
  document.getElementById("app").innerHTML=`
    <div class="topbar">
      <button class="secondary" onclick="home()">← Series Menu</button>
      <div class="stats">
        <span class="badge">Series ${state.series+1}</span>
        <span class="badge">Question ${state.idx+1} / 50</span>
        <span class="badge">✓ ${state.correct}</span>
        <span class="badge">✗ ${state.incorrect}</span>
      </div>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="card">
      <div class="topic">${esc(q.topic)}</div>
      <div class="question">${inline(q.question)}</div>
      <div class="answers">
        ${q.shuffled.map((c,i)=>`<button class="answer" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span>${inline(c.text)}</button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
    </div>`;
}

function answer(i){
  if(!state || state.answered) return;
  const q=state.questions[state.idx], selected=q.shuffled[i];
  state.answered=true;
  const buttons=[...document.querySelectorAll(".answer")];
  buttons.forEach((b,idx)=>{
    b.disabled=true;
    if(q.shuffled[idx].correct) b.classList.add("correct");
  });
  if(selected.correct){
    state.correct++;
  } else {
    state.incorrect++;
    buttons[i].classList.add("wrong");
    state.mistakes.push({
      question:q.question, topic:q.topic, selected:selected.text,
      correct:q.shuffled.find(x=>x.correct).text, explanation:q.explanation
    });
  }
  const fb=document.getElementById("feedback");
  fb.classList.add("show");
  fb.innerHTML=`
    <div class="${selected.correct?'result-good':'result-bad'}">${selected.correct?'Correct ✓':'Incorrect ✗'}</div>
    ${selected.correct?'':`<div class="small" style="margin-top:7px">Correct answer: <strong>${inline(q.shuffled.find(x=>x.correct).text)}</strong></div>`}
    <div class="explanation">${inline(q.explanation)}</div>
    <div class="actions"><button class="primary" onclick="nextQuestion()">${state.idx===49?'Finish Series':'Next Question'}</button></div>`;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.idx>=49) return finish();
  state.idx++;
  state.answered=false;
  renderQuestion();
}

function finish(){
  const p=loadProgress(), score=state.correct;
  const old=(p[state.series]&&Number.isInteger(p[state.series].best))?p[state.series].best:0;
  p[state.series]={best:Math.max(old,score), completed:true};
  saveProgress(p);
  const best=p[state.series].best;
  document.getElementById("app").innerHTML=`
    <div class="header"><h1>Series ${state.series+1} Complete</h1></div>
    <div class="card center">
      <div class="score-big">${score} / 50 — ${Math.round(score*2)}%</div>
      <p>Correct: <strong>${state.correct}</strong> · Incorrect: <strong>${state.incorrect}</strong></p>
      <p>Best score: <strong>${best} / 50</strong></p>
      <div class="actions" style="justify-content:center">
        <button class="primary" onclick="reviewMistakes()">Review Mistakes (${state.mistakes.length})</button>
        <button class="secondary" onclick="startSeries(${state.series})">Retry Series</button>
        <button class="secondary" onclick="home()">Back to Series Menu</button>
      </div>
    </div>`;
}

function reviewMistakes(){
  if(!state.mistakes.length){
    document.getElementById("app").innerHTML=`<div class="card center"><h2>No mistakes to review 🎉</h2><div class="actions" style="justify-content:center"><button class="secondary" onclick="home()">Back to Series Menu</button></div></div>`;
    return;
  }
  document.getElementById("app").innerHTML=`
    <div class="header"><h1>Review Mistakes — Series ${state.series+1}</h1></div>
    ${state.mistakes.map((m,i)=>`
      <div class="review-item">
        <div class="small">${esc(m.topic)} · Mistake ${i+1}</div>
        <div class="review-q">${inline(m.question)}</div>
        <div class="choice-line"><strong>Your answer:</strong> ${inline(m.selected)}</div>
        <div class="choice-line"><strong>Correct answer:</strong> ${inline(m.correct)}</div>
        <div class="explanation">${inline(m.explanation)}</div>
      </div>`).join("")}
    <div class="actions"><button class="secondary" onclick="home()">Back to Series Menu</button><button class="primary" onclick="startSeries(${state.series})">Retry Series</button></div>`;
}

document.addEventListener("keydown",e=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    answer(Number(e.key)-1);
  } else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});
home();
</script>
