 Attack Countermeasures","question":"Which design keeps critical resources separated from less-trusted WLANs?","choices":["Network segmentation","Flat addressing","Open bridging","Shared guest VLAN"],"answer":"Network segmentation","explanation":"Network segmentation limits lateral reach.","id":"S07Q16"},{"concept_id":"Wireless Hacking Methodology:Step2","variant":2,"category":"Wireless Hacking Methodology","question":"Which phase inspects RF and captured traffic before attacks are launched?","choices":["Wi-Fi Discovery","Wireless Traffic Analysis","Launch of Wireless Attacks","Wi-Fi Encryption Cracking"],"answer":"Wireless Traffic Analysis","explanation":"Wireless traffic analysis is the second step.","id":"S07Q17"},{"concept_id":"Wireless Hacking Methodology:APselector","variant":1,"category":"Wireless Hacking Methodology","question":"What does the AP selector identify in the supplied deauthentication syntax?","choices":["BSSID of the AP","Client IP address","RADIUS server IP","DNS server MAC"],"answer":"BSSID of the AP","explanation":"The AP argument identifies the BSSID.","id":"S07Q18"},{"concept_id":"Wireless Concepts:Omni","variant":2,"category":"Wireless Concepts","question":"Which antenna trades focused range for coverage in all directions?","choices":["Omnidirectional antenna","Directional antenna","Parabolic grid antenna","Yagi-only antenna"],"answer":"Omnidirectional antenna","explanation":"Omnidirectional antennas radiate in all horizontal directions.","id":"S07Q19"},{"concept_id":"Wireless Concepts:802.11b","variant":2,"category":"Wireless Concepts","question":"Which Wi-Fi standard is limited to about 11 Mbps?","choices":["802.11a","802.11b","802.11g","802.11n"],"answer":"802.11b","explanation":"802.11b operates at 2.4 GHz, uses DSSS, and reaches about 11 Mbps.","id":"S07Q20"},{"concept_id":"Wireless Encryption Algorithms:hcx","variant":1,"category":"Wireless Encryption Algorithms","question":"Which utility converts a packet capture into the format used by the supplied hashcat workflow?","choices":["hcxpcapngtool","airmon-ng","Reaver","Wireshark"],"answer":"hcxpcapngtool","explanation":"The official workflow uses hcxpcapngtool before hashcat.","id":"S07Q21"},{"concept_id":"Wireless Encryption Algorithms:M1","variant":2,"category":"Wireless Encryption Algorithms","question":"Which step starts the four-message exchange with ANonce?","choices":["Message 1","Message 2","Message 3","Message 4"],"answer":"Message 1","explanation":"Message 1 carries the ANonce.","id":"S07Q22"},{"concept_id":"Wireless Attack Countermeasures:WIDS","variant":1,"category":"Wireless Attack Countermeasures","question":"Which control detects rogue devices by continuously monitoring RF activity?","choices":["WIDS","WIPS","WPS","WPA3"],"answer":"WIDS","explanation":"A WIDS monitors RF activity and alerts.","id":"S07Q23"},{"concept_id":"Wireless Encryption Algorithms:WPAint","variant":2,"category":"Wireless Encryption Algorithms","question":"Which security generation replaced WEP's simple integrity approach with Michael?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA","explanation":"WPA uses Michael plus CRC-32.","id":"S07Q24"},{"concept_id":"Wireless Attack Countermeasures:ConnLayer","variant":2,"category":"Wireless Attack Countermeasures","question":"Which defense layer protects the connection itself?","choices":["Wireless Signal Security","Connection Security","Data Protection","Device Security"],"answer":"Connection Security","explanation":"Connection Security uses per-packet authentication.","id":"S07Q25"},{"concept_id":"Wireless Attack Countermeasures:TxPower","variant":1,"category":"Wireless Attack Countermeasures","question":"Which AP setting should be reduced to keep RF coverage within the premises?","choices":["Transmission power","DHCP lease time","DNS cache size","RADIUS retry count"],"answer":"Transmission power","explanation":"Adjusting transmit power helps limit RF leakage.","id":"S07Q26"},{"concept_id":"Wireless Hacking Metho covery.","id":"S07Q32"},{"concept_id":"Wireless Threats:BitFlip","variant":2,"category":"Wireless Threats","question":"Which attack changes captured ciphertext rather than simply replaying it?","choices":["Bit-flipping attack","Data replay","RADIUS replay","Beacon flood"],"answer":"Bit-flipping attack","explanation":"Bit-flipping modifies bits in captured frames.","id":"S07Q33"},{"concept_id":"Wireless Attack Countermeasures:DoT","variant":2,"category":"Wireless Attack Countermeasures","question":"Which encrypted resolver transports protect DNS outside ordinary plaintext UDP?","choices":["DNS over TLS or DTLS","DNS over FTP or TFTP","DNS over SMB or NFS","DNS over POP3 or IMAP"],"answer":"DNS over TLS or DTLS","explanation":"The course names DNS over TLS and DNS over DTLS.","id":"S07Q34"},{"concept_id":"Wireless Threats:AuthFlood","variant":2,"category":"Wireless Threats","question":"Which flood sends repeated forged authentication attempts rather than disconnects?","choices":["Authenticate Flood","De-authenticate Flood","Beacon Flood","PSK Cracking"],"answer":"Authenticate Flood","explanation":"Authenticate flooding attempts to exhaust AP resources.","id":"S07Q35"},{"concept_id":"Wireless Encryption Algorithms:WEP2","variant":2,"category":"Wireless Encryption Algorithms","question":"Which protocol suffers heavily from short IV reuse?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WEP","explanation":"WEP uses a 24-bit IV.","id":"S07Q36"},{"concept_id":"Wireless Concepts:BSSID","variant":1,"category":"Wireless Concepts","question":"Which identifier usually corresponds to an AP's MAC address?","choices":["BSSID","SSID","ESSID","PMK"],"answer":"BSSID","explanation":"BSSID normally corresponds to the AP MAC address.","id":"S07Q37"},{"concept_id":"Wireless Concepts:802.11i","variant":2,"category":"Wireless Concepts","question":"Which amendment introduced improved WLAN encryption protocols such as AES?","choices":["802.11i","802.11e","802.11d","802.11r"],"answer":"802.1 th IPsec VPN credential attacks?","choices":["ike_scan","Kismet","Reaver","SMAC"],"answer":"ike_scan","explanation":"The course lists ike_scan among VPN cracking tools.","id":"S07Q44"},{"concept_id":"Wireless Concepts:Layers","variant":1,"category":"Wireless Concepts","question":"Which OSI layers are directly specified by 802.11?","choices":["Physical and Data Link","Network and Transport","Session and Presentation","Transport and Application"],"answer":"Physical and Data Link","explanation":"802.11 specifies Physical-layer radio behavior and Data-Link/MAC behavior.","id":"S07Q45"},{"concept_id":"Wireless Attack Countermeasures:AutoConnect","variant":1,"category":"Wireless Attack Countermeasures","question":"Which client behavior should be disabled to reduce rogue-AP risk?","choices":["Automatic Wi-Fi connection","Certificate validation","802.1X","AES encryption"],"answer":"Automatic Wi-Fi connection","explanation":"Disabling auto-connect reduces rogue-AP risk.","id":"S07Q46"},{"concept_id":"Wireless Concepts:Guest","variant":2,"category":"Wireless Concepts","question":"Which SSID is intended for untrusted visitors with restricted access?","choices":["Guest network","Management network","Storage network","Domain-controller network"],"answer":"Guest network","explanation":"Guest wireless should be isolated and restricted.","id":"S07Q47"},{"concept_id":"Wireless Encryption Algorithms:IVreuse","variant":1,"category":"Wireless Encryption Algorithms","question":"What weakness lets enough captured legacy frames reveal the key?","choices":["IV reuse","Nonce randomization","Certificate pinning","Forward secrecy"],"answer":"IV reuse","explanation":"Repeated WEP IVs enable key recovery.","id":"S07Q48"},{"concept_id":"Wireless Encryption Algorithms:WPA3key","variant":2,"category":"Wireless Encryption Algorithms","question":"Which WLAN generation has the largest key length in the supplied table?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA3","explanation":"The official argets associated clients broadly.","id":"S09Q14"},{"concept_id":"Wireless Hacking Methodology:airgeddon","variant":2,"category":"Wireless Hacking Methodology","question":"Which multi-attack wireless framework orchestrates several tools?","choices":["airgeddon","Reaver","Kismet","SMAC"],"answer":"airgeddon","explanation":"airgeddon is a multi-attack wireless framework.","id":"S09Q15"},{"concept_id":"Wireless Threats:Unauthorized","variant":1,"category":"Wireless Threats","question":"Which condition includes accidental neighboring-AP connections or a malicious soft AP?","choices":["Unauthorized association","Beacon flood","WEP injection","Traffic analysis"],"answer":"Unauthorized association","explanation":"Unauthorized association can be accidental or malicious.","id":"S09Q16"},{"concept_id":"Wireless Concepts:8021X","variant":1,"category":"Wireless Concepts","question":"Which standard provides network-level port-based authentication?","choices":["802.1X","802.11i","802.3af","802.1Q"],"answer":"802.1X","explanation":"802.1X provides network access authentication and commonly uses RADIUS.","id":"S09Q17"},{"concept_id":"Wireless Concepts:Wardriving","variant":2,"category":"Wireless Concepts","question":"Which activity identifies nearby WLANs and their boundaries geographically?","choices":["War-driving","War-chalking","Channel hopping","Beacon flooding"],"answer":"War-driving","explanation":"War-driving is wireless footprinting performed while moving through an area.","id":"S09Q18"},{"concept_id":"Wireless Concepts:802.15.4","variant":2,"category":"Wireless Concepts","question":"Which standard covers low-rate wireless PAN technology such as ZigBee?","choices":["802.15.4","802.15.1","802.16","802.11ah"],"answer":"802.15.4","explanation":"The supplied course maps ZigBee to IEEE 802.15.4.","id":"S09Q19"},{"concept_id":"Wireless Encryption Algorithms:KRACKScope","variant":1,"category":"Wireless Encryption Algorithms","question":"Which protected Wi-Fi generations are expli ry":"Wireless Concepts","question":"Which home-style WLAN mode authenticates users with one shared passphrase?","choices":["Personal / PSK mode","Enterprise / 802.1X mode","Open authentication only","RADIUS-only mode"],"answer":"Personal / PSK mode","explanation":"Personal mode uses a pre-shared key.","id":"S09Q37"},{"concept_id":"Wireless Encryption Algorithms:DeauthPurpose","variant":2,"category":"Wireless Encryption Algorithms","question":"What is the main cracking-related reason to trigger reassociation?","choices":["To capture a fresh handshake","To change the AP channel","To disable RADIUS","To obtain a DHCP scope"],"answer":"To capture a fresh handshake","explanation":"Deauthentication forces reconnection and handshake traffic.","id":"S09Q38"},{"concept_id":"Wireless Threats:KRACK","variant":1,"category":"Wireless Threats","question":"Which authentication attack abuses key installation during the four-message exchange?","choices":["KRACK","FMS Attack","KARMA","aLTEr"],"answer":"KRACK","explanation":"KRACK is a key-reinstallation attack.","id":"S09Q39"},{"concept_id":"Wireless Hacking Methodology:MANAUpstream","variant":2,"category":"Wireless Hacking Methodology","question":"Which second interface role gives the fake AP Internet connectivity?","choices":["Upstream Internet interface","RADIUS-only interface","Loopback interface","Bluetooth interface"],"answer":"Upstream Internet interface","explanation":"The MANA script configures a wireless interface and an upstream interface.","id":"S09Q40"},{"concept_id":"Wireless Attack Countermeasures:EAPTLSdef","variant":1,"category":"Wireless Attack Countermeasures","question":"Which enterprise authentication method provides mutual certificate verification?","choices":["EAP-TLS","LEAP","Open authentication","WEP shared key"],"answer":"EAP-TLS","explanation":"EAP-TLS provides mutual certificate-based authentication.","id":"S09Q41"},{"concept_id":"Wireless Hacking Methodology:Fern","variant":2,"category":"Wireless Hacking s:EvilTwin","variant":1,"category":"Wireless Threats","question":"Which confidentiality attack presents a rogue AP as a trusted WLAN?","choices":["Evil Twin AP","Beacon flood","MAC spoofing only","AP theft"],"answer":"Evil Twin AP","explanation":"An evil twin is a rogue AP configured to look legitimate.","id":"S10Q03"},{"concept_id":"Wireless Threats:PSKCrack","variant":2,"category":"Wireless Threats","question":"Which attack commonly uses Cowpatty or Fern after capturing authentication material?","choices":["PSK Cracking","LEAP Cracking","VPN Login Cracking","Password Speculation"],"answer":"PSK Cracking","explanation":"PSK cracking tests candidate passwords against captured handshake material.","id":"S10Q04"},{"concept_id":"Wireless Concepts:PassiveFoot","variant":2,"category":"Wireless Concepts","question":"Which footprinting approach avoids connection attempts and frame injection?","choices":["Passive footprinting","Active footprinting","Association scanning","Authentication probing"],"answer":"Passive footprinting","explanation":"Passive wireless footprinting sniffs without injecting traffic.","id":"S10Q05"},{"concept_id":"Wireless Concepts:Channel","variant":1,"category":"Wireless Concepts","question":"What does a Wi-Fi channel represent?","choices":["A bounded frequency range","A MAC address range","A VLAN identifier","A cipher suite"],"answer":"A bounded frequency range","explanation":"A channel is a bounded range of frequencies used for transmission.","id":"S10Q06"},{"concept_id":"Wireless Attack Countermeasures:ACL","variant":1,"category":"Wireless Attack Countermeasures","question":"Which control limits access to a known set of hardware addresses?","choices":["MAC-address ACL / whitelist","Open authentication","Beacon flooding","Channel bonding"],"answer":"MAC-address ACL / whitelist","explanation":"The course lists ACLs and authorized-MAC whitelists.","id":"S10Q07"},{"concept_id":"Wireless Threats:APTheft","variant":2,"category":"Wireless Threats","quest s interface","Three Ethernet adapters","No wireless interface"],"answer":"Two wireless interfaces","explanation":"The notes say this setup requires two wireless interfaces.","id":"S10Q30"},{"concept_id":"Wireless Encryption Algorithms:KRACKImpact","variant":1,"category":"Wireless Encryption Algorithms","question":"Which result can follow successful key reinstallation?","choices":["Decrypt, replay, or forge packets","Recover only the AP serial","Increase RF power","Change the SSID permanently"],"answer":"Decrypt, replay, or forge packets","explanation":"KRACK can enable decryption, replay, and forgery.","id":"S10Q31"},{"concept_id":"Wireless Attack Countermeasures:ReplaceLegacy","variant":1,"category":"Wireless Attack Countermeasures","question":"What should be done with networks still using the two legacy RC4-based schemes?","choices":["Replace with WPA2/WPA3","Keep WEP for compatibility","Use WPA-TKIP permanently","Disable encryption"],"answer":"Replace with WPA2/WPA3","explanation":"The course recommends replacing WEP/WPA with WPA2/WPA3.","id":"S10Q32"},{"concept_id":"Wireless Hacking Methodology:tcpdump","variant":1,"category":"Wireless Hacking Methodology","question":"Which generic CLI tool can save monitor-mode traffic to a PCAP?","choices":["tcpdump","Reaver","SMAC","Cowpatty"],"answer":"tcpdump","explanation":"tcpdump can capture monitor-mode traffic.","id":"S10Q33"},{"concept_id":"Wireless Attack Countermeasures:RouterPatch","variant":2,"category":"Wireless Attack Countermeasures","question":"Which replacement strategy improves access to timely patches?","choices":["Use a better-patched third-party router","Enable WEP compatibility","Disable all encryption","Keep default firmware forever"],"answer":"Use a better-patched third-party router","explanation":"The course suggests a third-party router if the ISP device lacks patches.","id":"S10Q34"},{"concept_id":"Wireless Attack Countermeasures:NAC","variant":2,"category":"Wireless Attack Countermeasures","questio const STORAGE_KEY = "ceh-v13-wireless-security-direct-v1";

const $ = (sel) => document.querySelector(sel);
const app = $("#app");

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {best:{}}; }
  catch(e){ return {best:{}}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

let state = null;

function renderHome(){
  state=null;
  const cards = SERIES.map((s,i)=>{
    const best=progress.best[i];
    return `<button class="series-card" data-series="${i}">
      <div class="series-title">Series ${i+1} — 50 Questions</div>
      <div class="series-meta">
        <span>Direct concept practice</span>
        <span>${best==null ? "Not completed" : `Best: ${best}/50 — ${Math.round(best*2)}%`}</span>
      </div>
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><div class="brand">CEH v13 · 312-50</div><div class="muted">Offline practice</div></div>
    <section class="card hero">
      <h1>Wireless Security — Direct Understanding</h1>
      <p>Hard, direct concept questions based on the supplied Wireless Security materials and blueprint. Four plausible choices, close distractors, immediate explanations, and no scenario-heavy wording.</p>
      <div class="stats-strip">
        <span class="stat-pill">500 questions</span><span class="stat-pill">10 × 50</span>
        <span class="stat-pill">Mouse + touch</span><span class="stat-pill">Keys 1–4 + Enter</span><span class="stat-pill">5 wireless areas mixed</span>
      </div>
    </section>
    <div class="series-grid">${cards}</div>`;
  document.querySelectorAll("[data-series]").forEach(b=>b.addEventListener("click",()=>startSeries(Number(b.dataset.series))));
}

function startSeries(seriesIndex){
  const qs = SERIES[seriesIndex].map(q=>({...q, displayChoices:shuffle(q.choices)}));
  state={
    seriesIndex,
    questions: qs,
    index:0,
    correct:0,
    incorrect:0,
    answered:false,
    selected:null,
    mistakes:[]
  };
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false; state.selected=null;
  const pct=(state.index/50)*100;
  app.innerHTML=`
    <div class="topbar">
      <div class="brand">Wireless Security</div>
      <button class="small-link" id="homeBtn">Back to Series Menu</button>
    </div>
    <section class="card quiz-shell">
      <div class="quiz-head">
        <div><div class="quiz-title">Series ${state.seriesIndex+1}</div><div class="muted">Question ${state.index+1} / 50</div></div>
        <div class="scorebox">Score: <strong>${state.correct}</strong> · Correct ${state.correct} · Incorrect ${state.incorrect}</div>
      </div>
      <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>
      <div class="card question-card">
        <div class="question-count">Question ${state.index+1} of 50</div>
        <div class="question">${escapeHTML(q.question)}</div>
        <div class="answers">
          ${q.displayChoices.map((c,i)=>`<button class="answer" data-choice="${i}">
            <span class="key">${i+1}</span><span>${escapeHTML(c)}</span>
          </button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="quitBtn">Series Menu</button>
          <button class="btn primary" id="nextBtn" disabled>${state.index===49?"Finish Series":"Next Question"}</button>
        </div>
        <div class="keyboard-note">Keyboard: <strong>1–4</strong> to answer · <strong>Enter</strong> for next question.</div>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#quitBtn").onclick=renderHome;
  $("#nextBtn").onclick=nextQuestion;
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.choice))));
}

function answerQuestion(choiceIndex){
  if(!state || state.answered) return;
  const q=state.questions[state.index];
  const selected=q.displayChoices[choiceIndex];
  state.answered=true;
  state.selected=selected;
  const correct=selected===q.answer;
  if(correct) state.correct++;
  else{
    state.incorrect++;
    state.mistakes.push({question:q.question, selected, answer:q.answer, explanation:q.explanation});
  }

  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    const val=q.displayChoices[i];
    if(val===q.answer) b.classList.add("correct");
    if(i===choiceIndex && !correct) b.classList.add("incorrect");
  });

  const fb=$("#feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-title ${correct?"good":"bad"}">${correct?"Correct ✓":"Incorrect ✗"}</div>
    ${correct ? "" : `<div class="correct-line">Correct answer: ${escapeHTML(q.answer)}</div>`}
    <div class="explanation">${escapeHTML(q.explanation)}</div>`;
  $("#nextBtn").disabled=false;
}

function nextQuestion(){
  if(!state || !state.answered) return;
  if(state.index===49){ finishSeries(); return; }
  state.index++;
  renderQuestion();
}

function finishSeries(){
  const score=state.correct;
  const idx=state.seriesIndex;
  const old=progress.best[idx];
  if(old==null || score>old){ progress.best[idx]=score; saveProgress(progress); }
  const best=progress.best[idx];
  const mistakes=[...state.mistakes];
  app.innerHTML=`
    <div class="topbar"><div class="brand">Wireless Security</div><button class="small-link" id="homeBtn">Series Menu</button></div>
    <section class="card end-card">
      <div class="muted">Series ${idx+1} complete</div>
      <div class="big-score">${score} / 50</div>
      <div style="font-size:20px;font-weight:800">${score*2}%</div>
      <div class="end-grid">
        <div class="end-stat"><strong>${score}</strong><span class="muted">Correct</span></div>
        <div class="end-stat"><strong>${50-score}</strong><span class="muted">Incorrect</span></div>
        <div class="end-stat"><strong>${best}/50</strong><span class="muted">Best score</span></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="reviewBtn" ${mistakes.length?"":"disabled"}>Review Mistakes</button>
        <button class="btn" id="retryBtn">Retry Series</button>
        <button class="btn primary" id="menuBtn">Back to Series Menu</button>
      </div>
    </section>`;
  $("#homeBtn").onclick=renderHome;
  $("#menuBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
  $("#reviewBtn").onclick=()=>renderReview(idx,mistakes,score);
}

function renderReview(idx,mistakes,score){
  app.innerHTML=`
    <div class="topbar"><div class="brand">Review Mistakes</div><button class="small-link" id="menuBtn">Series Menu</button></div>
    <section class="card hero">
      <h1 style="font-size:32px">Series ${idx+1} — Review</h1>
      <p>${mistakes.length} mistake${mistakes.length===1?"":"s"} from a score of ${score}/50.</p>
    </section>
    <div class="review-list">
      ${mistakes.map((m,i)=>`<section class="card review-item">
        <div class="question-count">Mistake ${i+1}</div>
        <div class="review-q">${escapeHTML(m.question)}</div>
        <div class="review-row"><strong>Your answer:</strong> ${escapeHTML(m.selected)}</div>
        <div class="review-row"><strong>Correct answer:</strong> ${escapeHTML(m.answer)}</div>
        <div class="review-exp">${escapeHTML(m.explanation)}</div>
      </section>`).join("")}
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" id="retryBtn">Retry Series</button>
      <button class="btn primary" id="backBtn">Series Menu</button>
    </div>`;
  $("#menuBtn").onclick=renderHome;
  $("#backBtn").onclick=renderHome;
  $("#retryBtn").onclick=()=>startSeries(idx);
}

document.addEventListener("keydown",(e)=>{
  if(!state) return;
  if(!state.answered && ["1","2","3","4"].includes(e.key)){
    e.preventDefault();
    answerQuestion(Number(e.key)-1);
  }else if(state.answered && e.key==="Enter"){
    e.preventDefault();
    nextQuestion();
  }
});

renderHome();
</script>
</body>
</html>
