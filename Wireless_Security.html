<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CEH v13 Wireless Security — Direct Understanding</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --line:#213b57;
  --text:#eef6ff; --muted:#9fb4c9; --accent:#62b0ff; --accent2:#8bcbff;
  --good:#43d17b; --bad:#ff6b75; --warn:#ffc857;
  --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#06101c 0%,#091827 55%,#07111f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}
.card{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:780px}
.stats-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat-pill{border:1px solid var(--line);background:#0a1725;border-radius:999px;padding:8px 12px;color:#cfe5f7;font-size:13px}
.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.series-card{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f2134,#0b1928);border-radius:16px;cursor:pointer;text-align:left;color:var(--text);transition:.18s transform,.18s border-color,.18s background}
.series-card:hover,.series-card:focus-visible{transform:translateY(-2px);border-color:#4f8fc8;outline:none;background:#112941}
.series-title{font-weight:800;font-size:17px}
.series-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.quiz-shell{padding:18px}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:12px}
.quiz-title{font-weight:800}
.scorebox{font-size:13px;color:var(--muted);text-align:right}
.progress-wrap{height:8px;background:#07121d;border-radius:99px;overflow:hidden;margin:12px 0 22px;border:1px solid #18314a}
.progress{height:100%;width:0;background:linear-gradient(90deg,#4ca7ff,#8acbff);transition:width .2s}
.question-card{padding:clamp(18px,4vw,30px)}
.question-count{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
.question{font-size:clamp(19px,3.5vw,25px);line-height:1.42;font-weight:750;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{width:100%;display:flex;align-items:flex-start;gap:13px;padding:15px 16px;border-radius:14px;border:1px solid #29455f;background:#0a1826;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;transition:.15s border-color,.15s background,.15s transform}
.answer:hover:not(:disabled),.answer:focus-visible:not(:disabled){border-color:#5ba7e8;background:#10243a;outline:none;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.key{flex:0 0 28px;height:28px;border-radius:8px;background:#17324c;display:grid;place-items:center;font-weight:900;color:#cfe9ff}
.answer.correct{border-color:rgba(67,209,123,.8);background:rgba(36,121,73,.22)}
.answer.incorrect{border-color:rgba(255,107,117,.85);background:rgba(150,44,53,.2)}
.answer.correct .key{background:#176b3d;color:#eafff1}
.answer.incorrect .key{background:#7b2630;color:#fff}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:#091624}
.feedback.show{display:block}
.feedback-title{font-weight:900;margin-bottom:8px}
.feedback-title.good{color:var(--good)}
.feedback-title.bad{color:var(--bad)}
.correct-line{font-weight:750;margin-bottom:7px}
.explanation{color:#c7d8e7;line-height:1.58}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#10233a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}
.btn:hover,.btn:focus-visible{outline:none;border-color:#5aa3e3;background:#16304b}
.btn.primary{background:#2281d6;border-color:#2281d6}
.btn.primary:hover{background:#2e91e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end-card{padding:30px;text-align:center}
.big-score{font-size:clamp(44px,8vw,72px);font-weight:950;letter-spacing:-.04em;margin:8px 0}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:20px auto}
.end-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#091827}
.end-stat strong{display:block;font-size:22px}
.review-list{display:grid;gap:15px}
.review-item{padding:20px}
.review-q{font-weight:800;line-height:1.45;margin-bottom:12px}
.review-row{margin:6px 0;color:#c9d9e8}
.review-row strong{color:#fff}
.review-exp{margin-top:10px;color:var(--muted);line-height:1.55}
.keyboard-note{margin-top:16px;color:var(--muted);font-size:13px}
.small-link{background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px;font-weight:750}
.small-link:hover{text-decoration:underline}
.hidden{display:none!important}
@media(max-width:680px){
  .app{width:min(100% - 18px,1040px);padding-top:16px}
  .series-grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .quiz-shell{padding:10px}
  .question-card{padding:17px}
  .quiz-head{grid-template-columns:1fr}
  .scorebox{text-align:left}
  .answer{padding:14px 13px}
  .end-grid{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SERIES = [[{"concept_id":"Wireless Attack Countermeasures:SegmentMit","variant":2,"category":"Wireless Attack Countermeasures","question":"What design reduces lateral movement from a compromised wireless client?","choices":["Network segmentation","Flat LAN","Open bridge","Shared admin network"],"answer":"Network segmentation","explanation":"Segmentation limits lateral movement.","id":"S01Q01"},{"concept_id":"Wireless Threats:Routing","variant":1,"category":"Wireless Threats","question":"Which availability threat includes wormhole and sinkhole behavior?","choices":["Routing Attacks","Beacon Flood","Traffic Analysis","MAC Spoofing"],"answer":"Routing Attacks","explanation":"The course lists wormhole/sinkhole behavior under routing attacks.","id":"S01Q02"},{"concept_id":"Wireless Encryption Algorithms:WPA3iv","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses an arbitrary-length IV rather than 24 or 48 bits?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA3","explanation":"The official course lists WPA3 with an arbitrary-length IV.","id":"S01Q03"},{"concept_id":"Wireless Attack Countermeasures:VLANSSID","variant":2,"category":"Wireless Attack Countermeasures","question":"What should isolate guest and corporate traffic logically?","choices":["VLANs or separate SSIDs","One flat SSID","Shared PSK across all networks","Open bridging"],"answer":"VLANs or separate SSIDs","explanation":"The course recommends VLANs or separate SSIDs.","id":"S01Q04"},{"concept_id":"Wireless Concepts:EAPTLS","variant":2,"category":"Wireless Concepts","question":"Which EAP option is the strongest certificate-oriented method in the notes?","choices":["EAP-TLS","PEAP","LEAP","EAP-MD5"],"answer":"EAP-TLS","explanation":"EAP-TLS provides mutual certificate-based authentication.","id":"S01Q05"},{"concept_id":"Wireless Hacking Methodology:Technitium","variant":1,"category":"Wireless Hacking Methodology","question":"Which utility is listed for changing a station's MAC address?","choices":["Technitium MAC Address Changer","Reaver","Cowpatty","Kismet"],"answer":"Technitium MAC Address Changer","explanation":"Technitium MAC Address Changer is listed for MAC spoofing.","id":"S01Q06"},{"concept_id":"Wireless Attack Countermeasures:DoH","variant":1,"category":"Wireless Attack Countermeasures","question":"Which application protocol can carry DNS queries over HTTPS?","choices":["DNS over HTTPS","DNS over FTP","DNS over Telnet","DNS over SNMP"],"answer":"DNS over HTTPS","explanation":"The course recommends resolving DNS through HTTPS.","id":"S01Q07"},{"concept_id":"Wireless Concepts:802.11e","variant":1,"category":"Wireless Concepts","question":"Which amendment adds Layer-2 QoS for voice and video?","choices":["802.11e","802.11i","802.11d","802.11r"],"answer":"802.11e","explanation":"802.11e adds QoS mechanisms at the MAC layer.","id":"S01Q08"},{"concept_id":"Wireless Encryption Algorithms:WPSHalves","variant":1,"category":"Wireless Encryption Algorithms","question":"Why is the setup PIN much easier to brute-force than its apparent length suggests?","choices":["It is validated in two halves","It is sent through DNS","It uses a 24-bit IV","It is always four digits"],"answer":"It is validated in two halves","explanation":"The WPS PIN is checked in two halves.","id":"S01Q09"},{"concept_id":"Wireless Encryption Algorithms:GTK","variant":1,"category":"Wireless Encryption Algorithms","question":"Which key protects broadcast and multicast traffic?","choices":["GTK","PTK","PMK","SNonce"],"answer":"GTK","explanation":"GTK is the Group Temporal Key.","id":"S01Q10"},{"concept_id":"Wireless Encryption Algorithms:FMS","variant":2,"category":"Wireless Encryption Algorithms","question":"Which cryptanalytic attack targets RC4 key-scheduling weaknesses in WLANs?","choices":["FMS attack","KRACK","KARMA","aLTEr"],"answer":"FMS attack","explanation":"FMS exploits weak WEP IVs.","id":"S01Q11"},{"concept_id":"Wireless Threats:RADIUSReplay","variant":2,"category":"Wireless Threats","question":"Which replay technique targets AAA server responses?","choices":["RADIUS replay","EAP replay","Data replay","Beacon flood"],"answer":"RADIUS replay","explanation":"RADIUS replay targets captured RADIUS responses.","id":"S01Q12"},{"concept_id":"Wireless Encryption Algorithms:WPA2iv","variant":2,"category":"Wireless Encryption Algorithms","question":"Which AES-based protocol shares the 48-bit IV size used by its predecessor?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA2","explanation":"The course lists WPA2 with a 48-bit IV.","id":"S01Q13"},{"concept_id":"Wireless Hacking Methodology:Step1","variant":1,"category":"Wireless Hacking Methodology","question":"What is the first step of the five-stage wireless hacking methodology?","choices":["Wi-Fi Discovery","Wireless Traffic Analysis","Launch of Wireless Attacks","Wi-Fi Encryption Cracking"],"answer":"Wi-Fi Discovery","explanation":"The methodology begins with Wi-Fi discovery.","id":"S01Q14"},{"concept_id":"Wireless Encryption Algorithms:WPAhand","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation first introduced 4-way-handshake key management in the comparison?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA","explanation":"The course lists WPA and WPA2 as using a 4-way handshake.","id":"S01Q15"},{"concept_id":"Wireless Attack Countermeasures:BYODVPN","variant":2,"category":"Wireless Attack Countermeasures","question":"Which tunnel keeps the wireless segment treated as untrusted?","choices":["VPN","Open SMB","Telnet","TFTP"],"answer":"VPN","explanation":"The notes recommend requiring a VPN.","id":"S01Q16"},{"concept_id":"Wireless Hacking Methodology:Hashcat","variant":1,"category":"Wireless Hacking Methodology","question":"What tool performs the final wordlist cracking step in the supplied workflow?","choices":["hashcat","airodump-ng","airmon-ng","Reaver"],"answer":"hashcat","explanation":"hashcat performs the final offline cracking step.","id":"S01Q17"},{"concept_id":"Wireless Encryption Algorithms:WEP1","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses RC4 with a static shared key?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WEP","explanation":"WEP uses RC4 and is considered broken.","id":"S01Q18"},{"concept_id":"Wireless Hacking Methodology:RogueSSID","variant":2,"category":"Wireless Hacking Methodology","question":"Which network attribute is presented as something desirable such as 'Free Internet'?","choices":["An SSID","A PMK","A GTK","A DNSSEC key"],"answer":"An SSID","explanation":"A rogue AP broadcasts an SSID to lure users.","id":"S01Q19"},{"concept_id":"Wireless Hacking Methodology:THCLEAP","variant":2,"category":"Wireless Hacking Methodology","question":"Which THC utility targets the weak Cisco EAP method?","choices":["THC-LEAPcracker","THC-Hydra","THC-pptp-bruter","Cowpatty"],"answer":"THC-LEAPcracker","explanation":"THC-LEAPcracker is listed for LEAP cracking.","id":"S01Q20"},{"concept_id":"Wireless Threats:SharedGuess","variant":1,"category":"Wireless Threats","question":"Which authentication attack repeatedly tests vendor defaults or recovered legacy keys?","choices":["Shared Key Guessing","Password Speculation","LEAP Cracking","PSK Cracking"],"answer":"Shared Key Guessing","explanation":"Shared-key guessing attempts default or cracked keys.","id":"S01Q21"},{"concept_id":"Wireless Hacking Methodology:RFExplorer","variant":1,"category":"Wireless Hacking Methodology","question":"Which tool is an RF spectrum analyzer in the methodology?","choices":["RF Explorer 6G","Wifite","Asleap","MANA Toolkit"],"answer":"RF Explorer 6G","explanation":"RF Explorer 6G is listed for RF monitoring.","id":"S01Q22"},{"concept_id":"Wireless Attack Countermeasures:WPA3Mit","variant":1,"category":"Wireless Attack Countermeasures","question":"Which wireless generation is directly recommended in the key-reinstallation mitigation list?","choices":["WPA3","WPA","WEP","Open authentication"],"answer":"WPA3","explanation":"The course recommends WPA3.","id":"S01Q23"},{"concept_id":"Wireless Hacking Methodology:inSSIDer","variant":2,"category":"Wireless Hacking Methodology","question":"Which scanner belongs with NetSurveyor and Sparrow-wifi in the discovery phase?","choices":["inSSIDer","Reaver","Asleap","Cowpatty"],"answer":"inSSIDer","explanation":"inSSIDer is listed for wireless discovery.","id":"S01Q24"},{"concept_id":"Wireless Attack Countermeasures:Fallback","variant":2,"category":"Wireless Attack Countermeasures","question":"Which combination is preferred over legacy WPA or TKIP?","choices":["WPA2 with AES","WPA with TKIP","WEP with RC4","Open authentication"],"answer":"WPA2 with AES","explanation":"The course recommends WPA2 with AES when WPA3 is unavailable.","id":"S01Q25"},{"concept_id":"Wireless Concepts:ActiveFoot","variant":2,"category":"Wireless Concepts","question":"Which footprinting approach actively transmits an SSID probe?","choices":["Active footprinting","Passive footprinting","Traffic analysis","Monitor-only capture"],"answer":"Active footprinting","explanation":"Active footprinting sends probe requests.","id":"S01Q26"},{"concept_id":"Wireless Encryption Algorithms:Hashcat22000","variant":2,"category":"Wireless Encryption Algorithms","question":"Which numeric mode should be selected for the converted wireless capture?","choices":["22000","1000","5600","18200"],"answer":"22000","explanation":"The supplied course uses hashcat mode 22000.","id":"S01Q27"},{"concept_id":"Wireless Encryption Algorithms:SAE","variant":2,"category":"Wireless Encryption Algorithms","question":"Which modern password-authenticated key agreement avoids classic PSK exposure?","choices":["SAE","TKIP","CCMP","WPS"],"answer":"SAE","explanation":"The supplied notes identify SAE as the modern personal key-agreement mechanism.","id":"S01Q28"},{"concept_id":"Wireless Threats:Interchip","variant":2,"category":"Wireless Threats","question":"Which threat leverages one wireless subsystem to access or manipulate another?","choices":["Inter-Chip Privilege Escalation","KRACK","Client Mis-association","RADIUS Replay"],"answer":"Inter-Chip Privilege Escalation","explanation":"Inter-chip attacks exploit vulnerabilities at combo-chip boundaries.","id":"S01Q29"},{"concept_id":"Wireless Attack Countermeasures:Cloak","variant":1,"category":"Wireless Attack Countermeasures","question":"Which SSID setting is recommended in the supplied best-practice list?","choices":["SSID cloaking","WPS enablement","Open authentication","MAC randomization disabled"],"answer":"SSID cloaking","explanation":"The course includes SSID cloaking among best practices.","id":"S01Q30"},{"concept_id":"Wireless Hacking Methodology:aireplay","variant":2,"category":"Wireless Hacking Methodology","question":"Which suite tool actively injects disconnect frames rather than passively capturing?","choices":["airmon-ng","airodump-ng","aireplay-ng","aircrack-ng"],"answer":"aireplay-ng","explanation":"aireplay-ng performs active frame injection including deauthentication.","id":"S01Q31"},{"concept_id":"Wireless Concepts:802.11a","variant":1,"category":"Wireless Concepts","question":"Which standard matches 5 GHz with OFDM?","choices":["802.11a","802.11b","802.11g","802.11n"],"answer":"802.11a","explanation":"802.11a operates at 5 GHz and uses OFDM.","id":"S01Q32"},{"concept_id":"Wireless Threats:Honeypot","variant":1,"category":"Wireless Threats","question":"Which rogue AP strategy advertises the same network name with a stronger signal?","choices":["Honeypot AP","KARMA","AP misconfiguration","WEP injection"],"answer":"Honeypot AP","explanation":"The course describes a honeypot AP as a stronger same-SSID rogue AP.","id":"S01Q33"},{"concept_id":"Wireless Attack Countermeasures:Auth8021X","variant":1,"category":"Wireless Attack Countermeasures","question":"Which authentication technology should strengthen enterprise WLAN access?","choices":["802.1X","WPS","WEP","SSID cloaking"],"answer":"802.1X","explanation":"802.1X strengthens enterprise wireless authentication.","id":"S01Q34"},{"concept_id":"Wireless Threats:CatAccess","variant":1,"category":"Wireless Threats","question":"Which threat category focuses on bypassing WLAN access restrictions?","choices":["Access Control","Integrity","Confidentiality","Availability"],"answer":"Access Control","explanation":"Access-control attacks evade WLAN access controls.","id":"S01Q35"},{"concept_id":"Wireless Concepts:802.11ax","variant":2,"category":"Wireless Concepts","question":"Which standard is known as Wi-Fi 6?","choices":["802.11ax","802.11ac","802.11be","802.11n"],"answer":"802.11ax","explanation":"802.11ax is Wi-Fi 6 and uses OFDMA.","id":"S01Q36"},{"concept_id":"Wireless Hacking Methodology:Kismet","variant":1,"category":"Wireless Hacking Methodology","question":"Which Linux tool is highlighted for wireless footprinting and war-driving?","choices":["Kismet","Reaver","Asleap","MANA Toolkit"],"answer":"Kismet","explanation":"Kismet is listed for wireless footprinting.","id":"S01Q37"},{"concept_id":"Wireless Concepts:SSID","variant":2,"category":"Wireless Concepts","question":"Which value names the wireless network rather than a specific AP?","choices":["SSID","BSSID","BDADDR","PMK"],"answer":"SSID","explanation":"SSID is the wireless network name.","id":"S01Q38"},{"concept_id":"Wireless Threats:LEAPCrack","variant":2,"category":"Wireless Threats","question":"Which attack is associated with Asleap and THC-LEAPcracker?","choices":["LEAP Cracking","PSK Cracking","Domain Login Cracking","Shared Key Guessing"],"answer":"LEAP Cracking","explanation":"LEAP cracking targets captured LEAP material.","id":"S01Q39"},{"concept_id":"Wireless Concepts:Adhoc","variant":1,"category":"Wireless Concepts","question":"Which topology has no central access point?","choices":["Ad hoc","Infrastructure","Enterprise","Monitor"],"answer":"Ad hoc","explanation":"Ad hoc networking has no central AP; peers communicate directly.","id":"S01Q40"},{"concept_id":"Wireless Concepts:IEEE","variant":2,"category":"Wireless Concepts","question":"Who publishes the wireless LAN specifications used by Wi-Fi?","choices":["IEEE","IETF","ISO","3GPP"],"answer":"IEEE","explanation":"Wi-Fi specifications are part of the IEEE 802.11 family.","id":"S01Q41"},{"concept_id":"Wireless Encryption Algorithms:KRACKReplay","variant":2,"category":"Wireless Encryption Algorithms","question":"Which action causes a client to reinstall an already-used encryption key?","choices":["Handshake Message 3","Probe Request","Beacon Frame","Association Request"],"answer":"Handshake Message 3","explanation":"KRACK replays the third handshake message.","id":"S01Q42"},{"concept_id":"Wireless Hacking Methodology:bettercap","variant":2,"category":"Wireless Hacking Methodology","question":"Which multipurpose framework appears beside wifiphisher and airgeddon?","choices":["bettercap","Reaver","Kismet","Asleap"],"answer":"bettercap","explanation":"bettercap is listed for spoofing attacks.","id":"S01Q43"},{"concept_id":"Wireless Threats:Disassoc","variant":2,"category":"Wireless Threats","question":"Which technique tears down an existing wireless association?","choices":["Disassociation Attack","Authenticate Flood","Beacon Flood","RADIUS Replay"],"answer":"Disassociation Attack","explanation":"Disassociation attacks destroy AP-client connectivity.","id":"S01Q44"},{"concept_id":"Wireless Threats:MACSpoof","variant":2,"category":"Wireless Threats","question":"Which technique changes a station address to look like a trusted AP or host?","choices":["MAC spoofing","Beacon flooding","KRACK","Traffic analysis"],"answer":"MAC spoofing","explanation":"MAC spoofing impersonates an authorized system.","id":"S01Q45"},{"concept_id":"Wireless Attack Countermeasures:UserLayer","variant":2,"category":"Wireless Attack Countermeasures","question":"Where does host-based filtering fit in the six-layer model?","choices":["End-user Protection","Connection Security","Wireless Signal Security","Network Protection"],"answer":"End-user Protection","explanation":"End-user Protection includes personal firewalls.","id":"S01Q46"},{"concept_id":"Wireless Concepts:BYOD","variant":1,"category":"Wireless Concepts","question":"Which design treats wireless BYOD users as if they were outside the enterprise?","choices":["Isolated wireless network","Flat corporate LAN","Shared management VLAN","Open bridge to servers"],"answer":"Isolated wireless network","explanation":"The notes recommend isolating BYOD wireless and requiring VPN access.","id":"S01Q47"},{"concept_id":"Wireless Threats:WEPInject","variant":1,"category":"Wireless Threats","question":"Which integrity attack injects forged legacy encrypted traffic?","choices":["WEP injection","Data-frame injection","KRACK","PSK cracking"],"answer":"WEP injection","explanation":"WEP injection sends forged WEP-protected traffic.","id":"S01Q48"},{"concept_id":"Wireless Concepts:Directional","variant":1,"category":"Wireless Concepts","question":"Which antenna concentrates energy mainly in one direction?","choices":["Directional antenna","Omnidirectional antenna","Isotropic antenna","Loopback antenna"],"answer":"Directional antenna","explanation":"Directional antennas focus energy in a specific direction.","id":"S01Q49"},{"concept_id":"Wireless Attack Countermeasures:SignalLayer","variant":1,"category":"Wireless Attack Countermeasures","question":"Which security layer continuously monitors the RF spectrum for unauthorized devices?","choices":["Wireless Signal Security","Connection Security","Data Protection","Device Security"],"answer":"Wireless Signal Security","explanation":"Wireless Signal Security uses RF monitoring and WIDS.","id":"S01Q50"}],[{"concept_id":"Wireless Threats:AuthFlood","variant":1,"category":"Wireless Threats","question":"Which availability attack fills an AP's association table using random MACs?","choices":["Authenticate Flood","De-authenticate Flood","Beacon Flood","PSK Cracking"],"answer":"Authenticate Flood","explanation":"Authenticate flooding attempts to exhaust AP resources.","id":"S02Q01"},{"concept_id":"Wireless Attack Countermeasures:FastRoam","variant":1,"category":"Wireless Attack Countermeasures","question":"Which WLAN features should be disabled temporarily in the supplied mitigation guidance?","choices":["Fast roaming and repeater mode","AES and CCMP","RADIUS and 802.1X","DHCP and DNS"],"answer":"Fast roaming and repeater mode","explanation":"The course recommends disabling fast roaming and repeater mode.","id":"S02Q02"},{"concept_id":"Wireless Hacking Methodology:NetSurveyor","variant":2,"category":"Wireless Hacking Methodology","question":"Which utility appears in the official footprinting-tool list rather than cracking tools?","choices":["NetSurveyor","AirJack","Reaver","THC-Hydra"],"answer":"NetSurveyor","explanation":"NetSurveyor is listed for Wi-Fi discovery.","id":"S02Q03"},{"concept_id":"Wireless Encryption Algorithms:M1","variant":1,"category":"Wireless Encryption Algorithms","question":"Which handshake message carries the AP's initial nonce?","choices":["Message 1","Message 2","Message 3","Message 4"],"answer":"Message 1","explanation":"Message 1 carries the ANonce.","id":"S02Q04"},{"concept_id":"Wireless Concepts:dBm","variant":2,"category":"Wireless Concepts","question":"Which measurement uses negative values such as -67 and -100?","choices":["dBm","dBFS","Mbps","MHz"],"answer":"dBm","explanation":"Wireless signal strength is commonly measured in dBm.","id":"S02Q05"},{"concept_id":"Wireless Concepts:802.11b","variant":1,"category":"Wireless Concepts","question":"Which standard matches 2.4 GHz with DSSS?","choices":["802.11a","802.11b","802.11g","802.11n"],"answer":"802.11b","explanation":"802.11b operates at 2.4 GHz, uses DSSS, and reaches about 11 Mbps.","id":"S02Q06"},{"concept_id":"Wireless Encryption Algorithms:OfflineResistance","variant":2,"category":"Wireless Encryption Algorithms","question":"Which modern benefit frustrates handshake-only dictionary cracking?","choices":["Resistance to offline dictionary attacks","Static-IV reuse","Shared GTK reuse","Open authentication"],"answer":"Resistance to offline dictionary attacks","explanation":"SAE is designed to resist offline dictionary attacks.","id":"S02Q07"},{"concept_id":"Wireless Threats:Eavesdrop","variant":2,"category":"Wireless Threats","question":"Which technique captures data without necessarily modifying the session?","choices":["Eavesdropping","Masquerading","Session hijacking","Beacon flooding"],"answer":"Eavesdropping","explanation":"Eavesdropping passively intercepts traffic.","id":"S02Q08"},{"concept_id":"Wireless Concepts:Guest","variant":1,"category":"Wireless Concepts","question":"Which WLAN should be separated from internal corporate resources?","choices":["Guest network","Management network","Storage network","Domain-controller network"],"answer":"Guest network","explanation":"Guest wireless should be isolated and restricted.","id":"S02Q09"},{"concept_id":"Wireless Threats:CatIntegrity","variant":1,"category":"Wireless Threats","question":"Which threat category sends forged control, management, or data frames?","choices":["Access Control","Integrity","Confidentiality","Availability"],"answer":"Integrity","explanation":"Integrity attacks manipulate or forge wireless frames.","id":"S02Q10"},{"concept_id":"Wireless Attack Countermeasures:AutoConnect","variant":2,"category":"Wireless Attack Countermeasures","question":"What setting prevents a device from joining remembered lookalike networks automatically?","choices":["Automatic Wi-Fi connection","Certificate validation","802.1X","AES encryption"],"answer":"Automatic Wi-Fi connection","explanation":"Disabling auto-connect reduces rogue-AP risk.","id":"S02Q11"},{"concept_id":"Wireless Threats:BitFlip","variant":1,"category":"Wireless Threats","question":"Which integrity attack modifies payload bits and adjusts the integrity field?","choices":["Bit-flipping attack","Data replay","RADIUS replay","Beacon flood"],"answer":"Bit-flipping attack","explanation":"Bit-flipping modifies bits in captured frames.","id":"S02Q12"},{"concept_id":"Wireless Encryption Algorithms:hcx","variant":2,"category":"Wireless Encryption Algorithms","question":"Which tool sits between handshake capture and offline cracking?","choices":["hcxpcapngtool","airmon-ng","Reaver","Wireshark"],"answer":"hcxpcapngtool","explanation":"The official workflow uses hcxpcapngtool before hashcat.","id":"S02Q13"},{"concept_id":"Wireless Encryption Algorithms:WEP2","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses a 24-bit initialization vector?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WEP","explanation":"WEP uses a 24-bit IV.","id":"S02Q14"},{"concept_id":"Wireless Encryption Algorithms:WPAint","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses Michael plus CRC-32?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA","explanation":"WPA uses Michael plus CRC-32.","id":"S02Q15"},{"concept_id":"Wireless Hacking Methodology:mdk4","variant":2,"category":"Wireless Hacking Methodology","question":"Which utility requires monitor mode and supports multiple 802.11 DoS tests?","choices":["mdk4","aircrack-ng","Reaver","Kismet"],"answer":"mdk4","explanation":"mdk4 supports several wireless DoS tests.","id":"S02Q16"},{"concept_id":"Wireless Concepts:Layers","variant":2,"category":"Wireless Concepts","question":"Which layer pair covers wireless modulation and MAC behavior?","choices":["Physical and Data Link","Network and Transport","Session and Presentation","Transport and Application"],"answer":"Physical and Data Link","explanation":"802.11 specifies Physical-layer radio behavior and Data-Link/MAC behavior.","id":"S02Q17"},{"concept_id":"Wireless Attack Countermeasures:WIDS","variant":2,"category":"Wireless Attack Countermeasures","question":"Which system raises alarms for unauthorized wireless behavior without primarily blocking it?","choices":["WIDS","WIPS","WPS","WPA3"],"answer":"WIDS","explanation":"A WIDS monitors RF activity and alerts.","id":"S02Q18"},{"concept_id":"Wireless Threats:EAPFail","variant":2,"category":"Wireless Threats","question":"Which attack terminates authentication by sending a fake failure?","choices":["EAP-Failure","RADIUS Replay","KRACK","PSK Cracking"],"answer":"EAP-Failure","explanation":"EAP-Failure attacks inject forged failure messages.","id":"S02Q19"},{"concept_id":"Wireless Hacking Methodology:APselector","variant":2,"category":"Wireless Hacking Methodology","question":"Which address must identify the access point during targeted disconnects?","choices":["BSSID of the AP","Client IP address","RADIUS server IP","DNS server MAC"],"answer":"BSSID of the AP","explanation":"The AP argument identifies the BSSID.","id":"S02Q20"},{"concept_id":"Wireless Threats:APMisconfig","variant":2,"category":"Wireless Threats","question":"Which problem can be hard to detect because the vulnerable AP itself is authorized?","choices":["AP misconfiguration","Client mis-association","MAC spoofing","KARMA"],"answer":"AP misconfiguration","explanation":"AP misconfiguration exposes the WLAN through legitimate but unsafe settings.","id":"S02Q21"},{"concept_id":"Wireless Hacking Methodology:WiFiExplorer","variant":1,"category":"Wireless Hacking Methodology","question":"Which macOS tool is highlighted for wireless footprinting?","choices":["WiFi Explorer","Kismet","Cowpatty","AirJack"],"answer":"WiFi Explorer","explanation":"WiFi Explorer is listed for macOS discovery.","id":"S02Q22"},{"concept_id":"Wireless Concepts:PEAP","variant":2,"category":"Wireless Concepts","question":"Which EAP choice wraps authentication in TLS?","choices":["PEAP","EAP-TLS","LEAP","PAP"],"answer":"PEAP","explanation":"PEAP wraps EAP authentication inside TLS.","id":"S02Q23"},{"concept_id":"Wireless Encryption Algorithms:Reaver","variant":1,"category":"Wireless Encryption Algorithms","question":"Which tool is specifically used to brute-force router setup PINs?","choices":["Reaver","Cowpatty","Asleap","Kismet"],"answer":"Reaver","explanation":"Reaver is the course tool for WPS PIN cracking.","id":"S02Q24"},{"concept_id":"Wireless Threats:Stronger","variant":2,"category":"Wireless Threats","question":"Which factor is deliberately increased by a honeypot AP to win automatic selection?","choices":["Stronger beacon signal","Longer DHCP lease","Lower DNS TTL","Higher RADIUS timeout"],"answer":"Stronger beacon signal","explanation":"The course describes honeypot APs using stronger beacons.","id":"S02Q25"},{"concept_id":"Wireless Concepts:802.11be","variant":2,"category":"Wireless Concepts","question":"Which standard is known as Wi-Fi 7?","choices":["802.11be","802.11ax","802.11ad","802.11ac"],"answer":"802.11be","explanation":"802.11be is Wi-Fi 7 and the supplied course associates it with MLO.","id":"S02Q26"},{"concept_id":"Wireless Threats:SessionHijack","variant":1,"category":"Wireless Threats","question":"Which confidentiality attack takes over an established user session?","choices":["Session hijacking","Traffic analysis","Beacon flood","WPS cracking"],"answer":"Session hijacking","explanation":"Session hijacking takes control of an established session.","id":"S02Q27"},{"concept_id":"Wireless Encryption Algorithms:Nonce","variant":2,"category":"Wireless Encryption Algorithms","question":"Which reused counter value breaks confidentiality in the attack?","choices":["Nonce","SSID","BSSID","PMK name"],"answer":"Nonce","explanation":"KRACK forces nonce/replay-counter reuse.","id":"S02Q28"},{"concept_id":"Wireless Hacking Methodology:DeauthReason","variant":1,"category":"Wireless Hacking Methodology","question":"What is the methodology purpose of deauth during key cracking?","choices":["Force reconnection and capture authentication","Change the SSID","Disable RADIUS","Increase transmit power"],"answer":"Force reconnection and capture authentication","explanation":"Deauthentication forces a reconnect and capture opportunity.","id":"S02Q29"},{"concept_id":"Wireless Attack Countermeasures:AvoidTKIP","variant":2,"category":"Wireless Attack Countermeasures","question":"Which protocol should not be selected as a fallback to modern AES protection?","choices":["TKIP","AES","CCMP","GCMP"],"answer":"TKIP","explanation":"The course says to avoid WPA/TKIP.","id":"S02Q30"},{"concept_id":"Wireless Encryption Algorithms:WPA2key","variant":2,"category":"Wireless Encryption Algorithms","question":"Which protocol uses 128-bit keys and a 4-way handshake in the course comparison?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA2","explanation":"The course lists WPA2 with 128-bit keys.","id":"S02Q31"},{"concept_id":"Wireless Hacking Methodology:Step2","variant":1,"category":"Wireless Hacking Methodology","question":"What follows Wi-Fi discovery in the five-stage methodology?","choices":["Wi-Fi Discovery","Wireless Traffic Analysis","Launch of Wireless Attacks","Wi-Fi Encryption Cracking"],"answer":"Wireless Traffic Analysis","explanation":"Wireless traffic analysis is the second step.","id":"S02Q32"},{"concept_id":"Wireless Attack Countermeasures:Passphrase","variant":1,"category":"Wireless Attack Countermeasures","question":"What should never be reused inside a wireless passphrase?","choices":["SSID or company name","Random unrelated words","Long passphrase length","MFA tokens"],"answer":"SSID or company name","explanation":"The course says not to use the SSID or company name in passphrases.","id":"S02Q33"},{"concept_id":"Wireless Hacking Methodology:ikescan","variant":2,"category":"Wireless Hacking Methodology","question":"Which tool probes IKE in the VPN login-cracking context?","choices":["ike_scan","Kismet","Reaver","SMAC"],"answer":"ike_scan","explanation":"The course lists ike_scan among VPN cracking tools.","id":"S02Q34"},{"concept_id":"Wireless Threats:PassSpec","variant":1,"category":"Wireless Threats","question":"Which authentication attack repeatedly tries passwords for a captured 802.1X identity?","choices":["Password Speculation","Shared Key Guessing","Domain Login Cracking","PSK Cracking"],"answer":"Password Speculation","explanation":"Password speculation repeatedly attempts authentication using a captured identity.","id":"S02Q35"},{"concept_id":"Wireless Concepts:802.11i","variant":1,"category":"Wireless Concepts","question":"Which amendment formalized stronger WLAN security and WPA2?","choices":["802.11i","802.11e","802.11d","802.11r"],"answer":"802.11i","explanation":"802.11i is the WLAN security amendment associated with WPA2 and AES.","id":"S02Q36"},{"concept_id":"Wireless Encryption Algorithms:IVreuse","variant":2,"category":"Wireless Encryption Algorithms","question":"Which flaw results when the same short initialization values repeat?","choices":["IV reuse","Nonce randomization","Certificate pinning","Forward secrecy"],"answer":"IV reuse","explanation":"Repeated WEP IVs enable key recovery.","id":"S02Q37"},{"concept_id":"Wireless Attack Countermeasures:Segmentation","variant":1,"category":"Wireless Attack Countermeasures","question":"Which architecture limits damage if a wireless client is compromised?","choices":["Network segmentation","Flat addressing","Open bridging","Shared guest VLAN"],"answer":"Network segmentation","explanation":"Network segmentation limits lateral reach.","id":"S02Q38"},{"concept_id":"Wireless Concepts:BSSID","variant":2,"category":"Wireless Concepts","question":"Which value distinguishes APs that may share one network name?","choices":["BSSID","SSID","ESSID","PMK"],"answer":"BSSID","explanation":"BSSID normally corresponds to the AP MAC address.","id":"S02Q39"},{"concept_id":"Wireless Hacking Methodology:SignalDist","variant":2,"category":"Wireless Hacking Methodology","question":"Which value generally weakens as the observer moves farther away?","choices":["Signal strength","DHCP lease time","DNS TTL","RADIUS realm"],"answer":"Signal strength","explanation":"Signal strength helps estimate relative distance.","id":"S02Q40"},{"concept_id":"Wireless Concepts:Infra","variant":1,"category":"Wireless Concepts","question":"Which topology sends wireless traffic through a central AP?","choices":["Infrastructure","Ad hoc","Peer mesh only","Monitor"],"answer":"Infrastructure","explanation":"Infrastructure mode uses a central access point.","id":"S02Q41"},{"concept_id":"Wireless Concepts:Omni","variant":1,"category":"Wireless Concepts","question":"Which antenna radiates across roughly 360 degrees horizontally?","choices":["Omnidirectional antenna","Directional antenna","Parabolic grid antenna","Yagi-only antenna"],"answer":"Omnidirectional antenna","explanation":"Omnidirectional antennas radiate in all horizontal directions.","id":"S02Q42"},{"concept_id":"Wireless Encryption Algorithms:WPA3key","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses a 192-bit key in the official comparison?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA3","explanation":"The official course lists WPA3 with a 192-bit key.","id":"S02Q43"},{"concept_id":"Wireless Hacking Methodology:airmon","variant":1,"category":"Wireless Hacking Methodology","question":"Which Aircrack-ng component enables monitor mode?","choices":["airmon-ng","airodump-ng","aireplay-ng","aircrack-ng"],"answer":"airmon-ng","explanation":"airmon-ng enables monitor mode.","id":"S02Q44"},{"concept_id":"Wireless Hacking Methodology:SMAC","variant":1,"category":"Wireless Hacking Methodology","question":"Which short-named utility is listed for wireless MAC spoofing?","choices":["SMAC","Asleap","Reaver","Kismet"],"answer":"SMAC","explanation":"SMAC is listed for MAC spoofing.","id":"S02Q45"},{"concept_id":"Wireless Attack Countermeasures:DoT","variant":1,"category":"Wireless Attack Countermeasures","question":"Which pair of secure DNS transports is named in the fake-tower countermeasures? Monitor mode captures wireless frames in the air.","id":"S03Q01"},{"concept_id":"Wireless Concepts:StrongdBm","variant":2,"category":"Wireless Concepts","question":"Which reading represents an extremely strong received Wi-Fi signal?","choices":["-10 dBm","-67 dBm","-90 dBm","-100 dBm"],"answer":"-10 dBm","explanation":"The supplied notes list about -10 dBm as best possible.","id":"S03Q02"},{"concept_id":"Wireless Threats:AppLogin","variant":1,"category":"Wireless Threats","question":"Which authentication attack steals credentials from cleartext application protocols?","choices":["Application Login Theft","PSK Cracking","LEAP Cracking","MAC Spoofing"],"answer":"Application Login Theft","explanation":"Application-login theft captures credentials from insecure application protocols.","id":"S03Q03"},{"concept_id":"Wireless Threats:DomainCrack","variant":2,"category":"Wireless Threats","question":"Which attack may use John the Ripper, L0phtCrack, or THC-Hydra?","choices":["Domain Login Cracking","LEAP Cracking","PSK Cracking","Shared Key Guessing"],"answer":"Domain Login Cracking","explanation":"The course places NetBIOS-hash attacks under domain-login cracking.","id":"S03Q04"},{"concept_id":"Wireless Encryption Algorithms:M2","variant":1,"category":"Wireless Encryption Algorithms","question":"Which handshake message returns the station nonce and authentication material?","choices":["Message 2","Message 1","Message 3","Message 4"],"answer":"Message 2","explanation":"Message 2 carries the SNonce and MIC.","id":"S03Q05"},{"concept_id":"Wireless Hacking Methodology:Wifite","variant":2,"category":"Wireless Hacking Methodology","question":"Which automated Wi-Fi tool appears in both auditing and key-guessing contexts?","choices":["Wifite","Asleap","NetSurveyor","AirCheck G3 Pro"],"answer":"Wifite","explanation":"Wifite is listed for wireless auditing and key guessing.","id":"S03Q06"},{"concept_id":"Wireless Threats:KARMA","variant":2,"category":"Wireless Threats","question":"Which rogue-AP technique impersonates many previously known SSIDs dynamically?","choices":["KARMA attack","KRACK","FMS attack","aLTEr attack"],"answer":"KARMA attack","explanation":"KARMA responds to client probes to lure devices.","id":"S03Q07"},{"concept_id":"Wireless Threats:CatConf","variant":1,"category":"Wireless Threats","question":"Which threat category focuses on intercepting protected information?","choices":["Access Control","Integrity","Confidentiality","Availability"],"answer":"Confidentiality","explanation":"Confidentiality attacks expose information.","id":"S03Q08"},{"concept_id":"Wireless Concepts:LEAP","variant":2,"category":"Wireless Concepts","question":"Which legacy Cisco enterprise authentication method is considered weak?","choices":["LEAP","PEAP","EAP-TLS","EAP-TTLS"],"answer":"LEAP","explanation":"LEAP is Cisco-proprietary and considered weak.","id":"S03Q09"},{"concept_id":"Wireless Concepts:ISM","variant":2,"category":"Wireless Concepts","question":"Which frequency allocation is shared by many Wi-Fi and Bluetooth systems?","choices":["ISM band","licensed cellular band","satellite-only band","optical band"],"answer":"ISM band","explanation":"The ISM band is unlicensed spectrum used by Wi-Fi and other technologies.","id":"S03Q10"},{"concept_id":"Wireless Attack Countermeasures:DataLayer","variant":1,"category":"Wireless Attack Countermeasures","question":"Which security layer focuses on strong WLAN encryption?","choices":["Wireless Signal Security","Connection Security","Data Protection","Device Security"],"answer":"Data Protection","explanation":"Data Protection uses strong WLAN encryption.","id":"S03Q11"},{"concept_id":"Wireless Attack Countermeasures:Services","variant":2,"category":"Wireless Attack Countermeasures","question":"What should be done with unnecessary router services and ports?","choices":["Disable unneeded services","Enable every management daemon","Open all ports","Use default accounts"],"answer":"Disable unneeded services","explanation":"Disable unnecessary services and close unused ports.","id":"S03Q12"},{"concept_id":"Wireless Threats:PowerSave","variant":1,"category":"Wireless Threats","question":"Which availability attack spoofs TIM/DTIM behavior against sleeping clients?","choices":["Power Saving Attack","Beacon Flood","KRACK","MAC Spoofing"],"answer":"Power Saving Attack","explanation":"Power-saving attacks manipulate TIM/DTIM signaling.","id":"S03Q13"},{"concept_id":"Wireless Encryption Algorithms:ForwardSecrecy","variant":2,"category":"Wireless Encryption Algorithms","question":"Which security property prevents retrospective decryption of previously captured sessions?","choices":["Forward secrecy","Backward compatibility","Key escrow","Open authentication"],"answer":"Forward secrecy","explanation":"The supplied notes list forward secrecy as a modern benefit.","id":"S03Q14"},{"concept_id":"Wireless Encryption Algorithms:WPA1","variant":2,"category":"Wireless Encryption Algorithms","question":"Which security generation was introduced as a firmware-upgrade stopgap after WEP?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA","explanation":"WPA retained RC4 but added TKIP.","id":"S03Q15"},{"concept_id":"Wireless Concepts:802.11ad","variant":2,"category":"Wireless Concepts","question":"Which Wi-Fi amendment introduced a new 60 GHz physical layer?","choices":["802.11ad","802.11ah","802.11ac","802.11d"],"answer":"802.11ad","explanation":"802.11ad operates in the 60 GHz spectrum.","id":"S03Q16"},{"concept_id":"Wireless Threats:Traffic","variant":2,"category":"Wireless Threats","question":"Which technique derives intelligence even without reading payload content?","choices":["Traffic analysis","Eavesdropping","PSK cracking","MAC spoofing"],"answer":"Traffic analysis","explanation":"Traffic analysis studies communication patterns.","id":"S03Q17"},{"concept_id":"Wireless Encryption Algorithms:WEP3","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses 40/104-bit keys in the course table?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WEP","explanation":"The course lists WEP with 40/104-bit keys.","id":"S03Q18"},{"concept_id":"Wireless Encryption Algorithms:WPA2int","variant":2,"category":"Wireless Encryption Algorithms","question":"Which AES-based WLAN generation pairs CCMP with CBC-MAC?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA2","explanation":"The official course lists WPA2 integrity as CBC-MAC.","id":"S03Q19"},{"concept_id":"Wireless Attack Countermeasures:PMF","variant":2,"category":"Wireless Attack Countermeasures","question":"Which management-frame feature strengthens resistance to disconnect attacks?","choices":["802.11w / Protected Management Frames","WPS","WEP","TKIP"],"answer":"802.11w / Protected Management Frames","explanation":"The notes mention management-frame protection as mitigation.","id":"S03Q20"},{"concept_id":"Wireless Attack Countermeasures:WIPS","variant":2,"category":"Wireless Attack Countermeasures","question":"Which system adds prevention to wireless intrusion monitoring?","choices":["WIPS","WIDS","WPS","RADIUS"],"answer":"WIPS","explanation":"A WIPS can detect and automatically block rogue activity.","id":"S03Q21"},{"concept_id":"Wireless Hacking Methodology:wlan0mon","variant":1,"category":"Wireless Hacking Methodology","question":"What interface name commonly appears after monitor mode is enabled on wlan0?","choices":["wlan0mon","wlan0","eth0","mon0ap"],"answer":"wlan0mon","explanation":"The supplied example changes wlan0 to wlan0mon.","id":"S03Q22"},{"concept_id":"Wireless Hacking Methodology:Step3","variant":1,"category":"Wireless Hacking Methodology","question":"What follows traffic analysis in the five-stage methodology?","choices":["Wi-Fi Discovery","Wireless Traffic Analysis","Launch of Wireless Attacks","Wi-Fi Encryption Cracking"],"answer":"Launch of Wireless Attacks","explanation":"Launching wireless attacks is the third step.","id":"S03Q23"},{"concept_id":"Wireless Hacking Methodology:Cowpatty","variant":1,"category":"Wireless Hacking Methodology","question":"Which tool is associated with pre-shared-key cracking?","choices":["Cowpatty","Asleap","Reaver","Kismet"],"answer":"Cowpatty","explanation":"Cowpatty is listed for WPA PSK cracking.","id":"S03Q24"},{"concept_id":"Wireless Concepts:802.11g","variant":1,"category":"Wireless Concepts","question":"Which standard combines 2.4 GHz with OFDM?","choices":["802.11a","802.11b","802.11g","802.11n"],"answer":"802.11g","explanation":"802.11g uses 2.4 GHz and OFDM.","id":"S03Q25"},{"concept_id":"Wireless Encryption Algorithms:Counters","variant":2,"category":"Wireless Encryption Algorithms","question":"Which counters return to earlier values after malicious key reinstallation?","choices":["Nonce and replay counters","Channel and SSID","PMK and BSSID","DHCP and DNS timers"],"answer":"Nonce and replay counters","explanation":"Key reinstallation can reset nonce and replay counters.","id":"S03Q26"},{"concept_id":"Wireless Threats:EAPReplay","variant":1,"category":"Wireless Threats","question":"Which integrity attack captures 802.1X identity/success/failure messages for reuse?","choices":["Extensible AP replay","RADIUS replay","Data replay","IV replay"],"answer":"Extensible AP replay","explanation":"The course lists Extensible AP replay against EAP messages.","id":"S03Q27"},{"concept_id":"Wireless Hacking Methodology:Wifiphisher","variant":1,"category":"Wireless Hacking Methodology","question":"Which tool automates an evil-twin-style phishing workflow?","choices":["wifiphisher","Reaver","Asleap","SMAC"],"answer":"wifiphisher","explanation":"wifiphisher is used for evil twin/phishing workflows.","id":"S03Q28"},{"concept_id":"Wireless Concepts:802.15.1","variant":1,"category":"Wireless Concepts","question":"Which IEEE family corresponds to Bluetooth?","choices":["802.15.1","802.15.4","802.16","802.11b"],"answer":"802.15.1","explanation":"The supplied course maps Bluetooth to IEEE 802.15.1.","id":"S03Q29"},{"concept_id":"Wireless Concepts:MACfilter","variant":1,"category":"Wireless Concepts","question":"Why is MAC filtering a weak standalone wireless control?","choices":["MAC addresses can be spoofed","MAC addresses are encrypted","MAC addresses expire hourly","MAC addresses require DNS"],"answer":"MAC addresses can be spoofed","explanation":"MAC addresses are observable and spoofable.","id":"S03Q30"},{"concept_id":"Wireless Attack Countermeasures:OpenSSID","variant":1,"category":"Wireless Attack Countermeasures","question":"Which configuration should be disabled according to the rogue-AP defense list?","choices":["Broadcasting open SSIDs","802.1X authentication","AES encryption","RADIUS logging"],"answer":"Broadcasting open SSIDs","explanation":"The course recommends disabling broadcasting of open SSIDs.","id":"S03Q31"},{"concept_id":"Wireless Attack Countermeasures:EnterpriseMit","variant":2,"category":"Wireless Attack Countermeasures","question":"Which authentication framework adds per-user control in enterprise WLANs?","choices":["802.1X","WPS","WEP shared key","Open authentication"],"answer":"802.1X","explanation":"The course recommends 802.1X with RADIUS.","id":"S03Q32"},{"concept_id":"Wireless Threats:Masquerade","variant":1,"category":"Wireless Threats","question":"Which confidentiality attack pretends to be another wireless entity?","choices":["Masquerading","Eavesdropping","Traffic analysis","Beacon flood"],"answer":"Masquerading","explanation":"Masquerading impersonates another entity.","id":"S03Q33"},{"concept_id":"Wireless Encryption Algorithms:HandshakeArtifact","variant":1,"category":"Wireless Encryption Algorithms","question":"What must be captured before an offline password attack can continue away from the AP?","choices":["Authentication handshake","Beacon interval","DHCP lease","ARP cache"],"answer":"Authentication handshake","explanation":"Offline cracking relies on a captured authentication handshake.","id":"S03Q34"},{"concept_id":"Wireless Hacking Methodology:DirRange","variant":2,"category":"Wireless Hacking Methodology","question":"Which antenna sacrifices all-around coverage for greater reach in one direction?","choices":["Directional antenna","Omnidirectional antenna","Loopback antenna","Virtual antenna"],"answer":"Directional antenna","explanation":"Directional antennas focus RF energy.","id":"S03Q35"},{"concept_id":"Wireless Encryption Algorithms:WPA3km","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses ECDH and ECDSA in the official course table?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA3","explanation":"The official course associates WPA3 with ECDH and ECDSA.","id":"S03Q36"},{"concept_id":"Wireless Hacking Methodology:OfflineProx","variant":1,"category":"Wireless Hacking Methodology","question":"How long must an attacker remain near the AP for an offline password attack?","choices":["Only long enough to capture authentication material","For the entire cracking duration","Until the AP reboots","Until the SSID changes"],"answer":"Only long enough to capture authentication material","explanation":"Once captured, cracking can continue offline.","id":"S03Q37"},{"concept_id":"Wireless Hacking Methodology:Clientselector","variant":2,"category":"Wireless Hacking Methodology","question":"Which value limits the attack to one station rather than everyone?","choices":["Target station MAC","AP channel width","WPA key length","DHCP gateway"],"answer":"Target station MAC","explanation":"The client argument identifies the station MAC.","id":"S03Q38"},{"concept_id":"Wireless Encryption Algorithms:CCMP","variant":2,"category":"Wireless Encryption Algorithms","question":"Which block-cipher protection replaced TKIP?","choices":["CCMP","TKIP","WEP","LEAP"],"answer":"CCMP","explanation":"CCMP is the AES-based protection used by WPA2.","id":"S03Q39"},{"concept_id":"Wireless Attack Countermeasures:BoundaryFirewall","variant":1,"category":"Wireless Attack Countermeasures","question":"Where should a firewall or packet filter be placed to protect the corporate network?","choices":["Between the AP and corporate Intranet","Between two client antennas","Inside the SSID string","Between DHCP and DNS only"],"answer":"Between the AP and corporate Intranet","explanation":"A firewall should separate wireless access from the corporate intranet.","id":"S03Q40"},{"concept_id":"Wireless Concepts:Parabolic","variant":1,"category":"Wireless Concepts","question":"Which antenna type supports very long focused wireless links?","choices":["Parabolic grid antenna","Omnidirectional antenna","Dipole antenna","Loop antenna"],"answer":"Parabolic grid antenna","explanation":"Parabolic grid antennas are focused long-distance antennas.","id":"S03Q41"},{"concept_id":"Wireless Threats:ClientMis","variant":2,"category":"Wireless Threats","question":"Which access-control attack combines a rogue AP with client redirection?","choices":["Client mis-association","AP theft","Bit-flipping","RADIUS replay"],"answer":"Client mis-association","explanation":"Client mis-association tricks users into joining a rogue AP.","id":"S03Q42"},{"concept_id":"Wireless Attack Countermeasures:UserPlaneMAC","variant":1,"category":"Wireless Attack Countermeasures","question":"What should be added to user-plane packets to provide integrity?","choices":["Message Authentication Code","Beacon interval","SSID checksum","DHCP lease"],"answer":"Message Authentication Code","explanation":"The course recommends adding a MAC to user-plane packets.","id":"S03Q43"},{"concept_id":"Wireless Concepts:Association","variant":2,"category":"Wireless Concepts","question":"Which step negotiates station capabilities with the AP?","choices":["Association","Discovery","Deauthentication","Key cracking"],"answer":"Association","explanation":"After authentication, the client associates and negotiates capabilities.","id":"S03Q44"},{"concept_id":"Wireless Attack Countermeasures:HTTPS","variant":2,"ca y counter","explanation":"The course recommends enforcing the EAPOL-key replay counter.","id":"S03Q50"}],[{"concept_id":"Wireless Threats:CCADoS","variant":2,"category":"Wireless Threats","question":"Which DoS abuses clear-channel assessment in CSMA/CA?","choices":["Wireless DoS via CCA","Beacon Flood","PSK Cracking","EAP Replay"],"answer":"Wireless DoS via CCA","explanation":"The course describes DoS that exploits clear-channel assessment.","id":"S04Q01"},{"concept_id":"Wireless Concepts:802.15.4","variant":1,"category":"Wireless Concepts","question":"Which IEEE family corresponds to ZigBee?","choices":["802.15.4","802.15.1","802.16","802.11ah"],"answer":"802.15.4","explanation":"The supplied course maps ZigBee to IEEE 802.15.4.","id":"S04Q02"},{"concept_id":"Wireless Attack Countermeasures:DNSCrypt","variant":1,"category":"Wireless Attack Countermeasures","question":"Which protocol is named as another encrypted DNS option?","choices":["DNSCrypt","WPS","TKIP","LEAP"],"answer":"DNSCrypt","explanation":"DNSCrypt is listed as an additional DNS-protection option.","id":"S04Q03"},{"concept_id":"Wireless Hacking Methodology:airodump","variant":1,"category":"Wireless Hacking Methodology","question":"Which Aircrack-ng component captures wireless frames and lists nearby APs?","choices":["airmon-ng","airodump-ng","aireplay-ng","aircrack-ng"],"answer":"airodump-ng","explanation":"airodump-ng performs wireless reconnaissance and capture.","id":"S04Q04"},{"concept_id":"Wireless Threats:DataReplay","variant":1,"category":"Wireless Threats","question":"Which integrity attack resends previously captured 802.11 data frames?","choices":["Data replay","Bit-flipping attack","Beacon flood","PSK cracking"],"answer":"Data replay","explanation":"Data replay resends captured 802.11 frames.","id":"S04Q05"},{"concept_id":"Wireless Encryption Algorithms:WPA3int","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation uses BIP-GMAC-256 for integrity?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA3","explanation":"The official course lists WPA3 integrity as BIP-GMAC-256.","id":"S04Q06"},{"concept_id":"Wireless Concepts:802.11n","variant":1,"category":"Wireless Concepts","question":"Which standard introduced MIMO-OFDM on 2.4 and 5 GHz?","choices":["802.11a","802.11b","802.11g","802.11n"],"answer":"802.11n","explanation":"802.11n uses 2.4/5 GHz and MIMO-OFDM.","id":"S04Q07"},{"concept_id":"Wireless Threats:Unauthorized","variant":2,"category":"Wireless Threats","question":"Which issue covers both accidental and malicious unauthorized connections?","choices":["Unauthorized association","Beacon flood","WEP injection","Traffic analysis"],"answer":"Unauthorized association","explanation":"Unauthorized association can be accidental or malicious.","id":"S04Q08"},{"concept_id":"Wireless Concepts:Personal","variant":1,"category":"Wireless Concepts","question":"Which authentication mode relies on a pre-shared key?","choices":["Personal / PSK mode","Enterprise / 802.1X mode","Open authentication only","RADIUS-only mode"],"answer":"Personal / PSK mode","explanation":"Personal mode uses a pre-shared key.","id":"S04Q09"},{"concept_id":"Wireless Concepts:WPS","variant":2,"category":"Wireless Concepts","question":"Which router feature is weakened because its PIN is validated in halves?","choices":["WPS","WMM","WDS","WPA3-SAE"],"answer":"WPS","explanation":"WPS simplifies setup but its PIN design is vulnerable.","id":"S04Q10"},{"concept_id":"Wireless Threats:TKIPMIC","variant":1,"category":"Wireless Threats","question":"Which availability attack triggers repeated MIC errors to suspend WLAN service?","choices":["TKIP MIC Exploit","KRACK","FMS Attack","WEP Injection"],"answer":"TKIP MIC Exploit","explanation":"TKIP MIC exploitation can trigger protective suspension.","id":"S04Q11"},{"concept_id":"Wireless Attack Countermeasures:EAPTLSdef","variant":2,"category":"Wireless Attack Countermeasures","question":"Which EAP choice most strongly resists simple password guessing and rogue-server impersonation?","choices":["EAP-TLS","LEAP","Open authentication","WEP shared key"],"answer":"EAP-TLS","explanation":"EAP-TLS provides mutual certificate-based authentication.","id":"S04Q12"},{"concept_id":"Wireless Attack Countermeasures:DeviceLayer","variant":1,"category":"Wireless Attack Countermeasures","question":"Which security layer focuses on vulnerabilities and patch management?","choices":["Wireless Signal Security","Connection Security","Data Protection","Device Security"],"answer":"Device Security","explanation":"Device Security addresses vulnerabilities and patching.","id":"S04Q13"},{"concept_id":"Wireless Hacking Methodology:MANAUpstream","variant":1,"category":"Wireless Hacking Methodology","question":"What does the simple rogue-AP script configure besides the wireless interface?","choices":["Upstream Internet interface","RADIUS-only interface","Loopback interface","Bluetooth interface"],"answer":"Upstream Internet interface","explanation":"The MANA script configures a wireless interface and an upstream interface.","id":"S04Q14"},{"concept_id":"Wireless Threats:WEPcrack","variant":2,"category":"Wireless Threats","question":"Which attack is directly enabled by the 24-bit IV weakness?","choices":["Cracking WEP key","KRACK","EAP-Failure","MAC spoofing"],"answer":"Cracking WEP key","explanation":"WEP cracking exploits weak legacy encryption.","id":"S04Q15"},{"concept_id":"Wireless Threats:aLTEr","variant":1,"category":"Wireless Threats","question":"Which attack uses a fake LTE tower to manipulate Layer-2 traffic?","choices":["aLTEr attack","KRACK","KARMA","FMS attack"],"answer":"aLTEr attack","explanation":"aLTEr targets LTE user-plane traffic through a fake tower.","id":"S04Q16"},{"concept_id":"Wireless Concepts:Wardriving","variant":1,"category":"Wireless Concepts","question":"Which term describes mapping wireless networks while moving through an area?","choices":["War-driving","War-chalking","Channel hoppi D"],"answer":"Unique non-default SSID","explanation":"The course recommends a unique non-default SSID.","id":"S04Q22"},{"concept_id":"Wireless Encryption Algorithms:KRACKScope","variant":2,"category":"Wireless Encryption Algorithms","question":"Which pair is named as vulnerable to key-reinstallation variants?","choices":["WPA and WPA2","WEP and WPA3","WPA2 and WPA3 only","WEP only"],"answer":"WPA and WPA2","explanation":"The official course states KRACK variants affect WPA and WPA2.","id":"S04Q23"},{"concept_id":"Wireless Attack Countermeasures:Firewall","variant":2,"category":"Wireless Attack Countermeasures","question":"Which network-control function should be enabled on the wireless gateway?","choices":["Firewall","Beacon repeater","WPS registrar","Probe responder"],"answer":"Firewall","explanation":"The course recommends using the router firewall.","id":"S04Q24"},{"concept_id":"Wireless Hacking Methodology:Step4","variant":1,"category":"Wireless Hacking Methodology","question":"What follows the attack-launch phase in the methodology?","choices":["Wi-Fi Discovery","Wireless Traffic Analysis","Launch of Wireless Attacks","Wi-Fi Encryption Cracking"],"answer":"Wi-Fi Encryption Cracking","explanation":"Wi-Fi encryption cracking is the fourth step.","id":"S04Q25"},{"concept_id":"Wireless Attack Countermeasures:Whitelist","variant":1,"category":"Wireless Attack Countermeasures","question":"Which list should be maintained for approved wireless hardware?","choices":["Authorized MAC whitelist","Default password list","Public SSID list","Open RADIUS realm"],"answer":"Authorized MAC whitelist","explanation":"The course recommends a whitelist of authorized MAC addresses.","id":"S04Q26"},{"concept_id":"Wireless Hacking Methodology:Reaver2","variant":2,"category":"Wireless Hacking Methodology","question":"Which attack tool targets the router convenience pairing feature?","choices":["Reaver","Cowpatty","Asleap","aircrack-ng"],"answer":"Reaver","explanation":"Reaver brute-forces WPS PINs.","id":"S04Q27"},{"concept_id":"Wireless Hacking Methodology:Fern","variant":1,"category":"Wireless Hacking Methodology","question":"Which tool appears in both WEP and WPA cracking references?","choices":["Fern Wifi Cracker","SMAC","Kismet","AirJack"],"answer":"Fern Wifi Cracker","explanation":"Fern Wifi Cracker is listed for WEP and WPA cracking.","id":"S04Q28"},{"concept_id":"Wireless Threats:KRACK","variant":2,"category":"Wireless Threats","question":"Which attack is specifically associated with nonce reuse after key-message replay?","choices":["KRACK","FMS Attack","KARMA","aLTEr"],"answer":"KRACK","explanation":"KRACK is a key-reinstallation attack.","id":"S04Q29"},{"concept_id":"Wireless Encryption Algorithms:DeauthPurpose","variant":1,"category":"Wireless Encryption Algorithms","question":"Why force a connected client to disconnect before key cracking?","choices":["To capture a fresh handshake","To change the AP channel","To disable RADIUS","To obtain a DHCP scope"],"answer":"To capture a fresh handshake","explanation":"Deauthentication forces reconnection and handshake traffic.","id":"S04Q30"},{"concept_id":"Wireless Concepts:Channels1611","variant":2,"category":"Wireless Concepts","question":"Which trio minimizes overlap in a typical 2.4 GHz deployment?","choices":["1, 6, and 11","1, 5, and 9","2, 7, and 12","3, 8, and 13"],"answer":"1, 6, and 11","explanation":"Channels 1, 6, and 11 are the classic non-overlapping 2.4 GHz set.","id":"S04Q31"},{"concept_id":"Wireless Encryption Algorithms:PMK","variant":2,"category":"Wireless Encryption Algorithms","question":"Which key must be protected because transient keys are derived from it?","choices":["PMK","PTK","GTK","MIC"],"answer":"PMK","explanation":"PMK is the Pairwise Master Key.","id":"S04Q32"},{"concept_id":"Wireless Concepts:Beacon","variant":1,"category":"Wireless Concepts","question":"Which frame is periodically transmitted by an AP to announce itself?","choices":["Beacon frame","Probe request","Association response","Deauthentication frame"],"answer":"Beacon frame","explanation":"Access points periodically send beacon frames.","id":"S04Q33"},{"concept_id":"Wireless Hacking Methodology:Chanalyzer","variant":2,"category":"Wireless Hacking Methodology","question":"Which utility belongs to traffic analysis rather than key cracking?","choices":["Chanalyzer","Reaver","aircrack-ng","hostapd-wpe"],"answer":"Chanalyzer","explanation":"Chanalyzer is listed for spectrum analysis.","id":"S04Q34"},{"concept_id":"Wireless Hacking Methodology:MANA","variant":2,"category":"Wireless Hacking Methodology","question":"Which framework is launched with start-nat-simple.sh?","choices":["MANA Toolkit","Kismet","Reaver","Cowpatty"],"answer":"MANA Toolkit","explanation":"The course uses the MANA Toolkit for rogue AP setup.","id":"S04Q35"},{"concept_id":"Wireless Encryption Algorithms:WPA2iv","variant":2,"category":"Wireless Encryption Algorithms","question":"Which RC4-based successor doubled the IV size compared with the broken legacy scheme?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA","explanation":"The course lists WPA with a 48-bit IV.","id":"S04Q36"},{"concept_id":"Wireless Hacking Methodology:JamLegit","variant":2,"category":"Wireless Hacking Methodology","question":"Which tactic disrupts the legitimate AP while the impostor is presented?","choices":["Jamming or disconnecting the legitimate AP","Enabling DNSSEC","Rotating the GTK","Disabling beacons"],"answer":"Jamming or disconnecting the legitimate AP","explanation":"The practical notes describe disrupting the legitimate AP.","id":"S04Q37"},{"concept_id":"Wireless Encryption Algorithms:WPAfs","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation in the notes lacks forward secrecy if the PSK is captured?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA","explanation":"The notes state WPA lacks forward secrecy.","id":"S04Q38"},{"concept_id":"Wireless Hacking Methodology:OmitClient","variant":2,"category":"Wireless Hacking Methodology","question":"Which scope results when no station MAC is specified?","choices":["All associated clients are targeted","Only the AP is rebooted","Only broadcasts are captured","The attack becomes passive"],"answer":"All associated clients are targeted","explanation":"Omitting the client address targets associated clients broadly.","id":"S04Q39"},{"concept_id":"Wireless Encryption Algorithms:TKIP","variant":2,"category":"Wireless Encryption Algorithms","question":"Which transitional mechanism strengthened legacy WLAN encryption without new hardware?","choices":["TKIP","CCMP","SAE","GCMP"],"answer":"TKIP","explanation":"TKIP improved key mixing but still relied on RC4.","id":"S04Q40"},{"concept_id":"Wireless Encryption Algorithms:WPA2krack","variant":2,"category":"Wireless Encryption Algorithms","question":"Which AES-based generation installs session keys during a vulnerable four-message exchange?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WPA2","explanation":"KRACK is classically associated with the WPA2 4-way handshake.","id":"S04Q41"},{"concept_id":"Wireless Encryption Algorithms:WEP4","variant":1,"category":"Wireless Encryption Algorithms","question":"Which generation relies on CRC-32 for integrity?","choices":["WEP","WPA","WPA2","WPA3"],"answer":"WEP","explanation":"WEP uses CRC-32.","id":"S04Q42"},{"concept_id":"Wireless Concepts:WeakdBm","variant":2,"category":"Wireless Concepts","question":"Which reading is at the edge of usable Wi-Fi reception?","choices":["-100 dBm","-10 dBm","-30 dBm","-50 dBm"],"answer":"-100 dBm","explanation":"The supplied notes place about -100 dBm near the lowest detectable level.","id":"S04Q43"},{"concept_id":"Wireless Threats:MITM","variant":1,"category":"Wireless Threats","question":"Which confidentiality attack positions the adversary between two parties?","choices":["Man-in-the-Middle","Traffic analysis","AP theft","Password speculation"],"answer":"Man-in-the-Middle","explanation":"A MITM interposes the attacker between endpoints.","id":"S04Q44"},{"concept_id":"Wireless Hacking Methodology:airgeddon","variant":1,"category":"Wireless Hacking Methodology","question":"Which framework combines evil twin, sniffing, and sslstrip-style attacks?","choices":["airgeddon","Reaver","Kismet","SMAC"],"answer":"airgeddon","explanation":"airgeddon is a multi-attack wireless framework.","id":"S04Q45"},{"concept_id":"Wireless Threats:CatAvail","variant":1,"category":"Wireless Threats","question":"Which threat category obstructs wireless service delivery?","choices":["Access Control","Integrity","Confidentiality","Availability"],"answer":"Availability","explanation":"Availability attacks disrupt wireless service.","id":"S04Q46"},{"concept_id":"Wireless Concepts:802.11ah","variant":2,"category":"Wireless Concepts","question":"Which Wi-Fi amendment is also called Wi-Fi HaLow?","choices":["802.11ah","802.11ad","802.11ax","802.15.4"],"answer":"802.11ah","explanation":"802.11ah, Wi-Fi HaLow, uses sub-GHz spectrum around 900 MHz.","id":"S04Q47"},{"concept_id":"Wireless Attack Countermeasures:2FA","variant":2,"category":"Wireless Attack Countermeasures","question":"Which login control adds a second factor beyond a captured password?","choices":["Two-factor authentication","SSID cloaking","Channel bonding","WPS"],"answer":"Two-factor authentication","explanation":"The course recommends 2FA.","id":"S04Q48"},{"concept_id":"Wireless Encryption Algorithms:M3","variant":1,"category":"Wireless Encryption Algorithms","question":"Which handshake message installs key material and is replayed by KRACK?","choices":["Message 3","Message 1","Message 2","Message 4"],"answer":"Message 3","explanation":"KRACK abuses replay of Message 3.","id":"S04Q49"},{"concept_id":"Wireless Attack Countermeasures:RemoveRogue","variant":2,"category":"Wireless Attack Countermeasures","question":"Which action eliminates the device rather than merely monitoring it?","choices":["Block its switch 3.","id":"S06Q33"},{"concept_id":"Wireless Attack Countermeasures:SegmentMit","variant":1,"category":"Wireless Attack Countermeasures","question":"Which network architecture contains exposure after successful WLAN exploitation?","choices":["Network segmentation","Flat LAN","Open bridge","Shared admin network"],"answer":"Network segmentation","explanation":"Segmentation limits lateral movement.","id":"S06Q34"},{"concept_id":"Wireless Attack Countermeasures:SignalLayer","variant":2,"category":"Wireless Attack Countermeasures","question":"Where does a wireless IDS fit in the six-layer defense model?","choices":["Wireless Signal Security","Connection Security","Data Protection","Device Security"],"answer":"Wireless Signal Security","explanation":"Wireless Signal Security uses RF monitoring and WIDS.","id":"S06Q35"},{"concept_id":"Wireless Hacking Methodology:inSSIDer","variant":1,"category":"Wireless Hacking Methodology","question":"Which tool is listed for Wi-Fi discovery and footprinting?","choices":["inSSIDer","Reaver","Asleap","Cowpatty"],"answer":"inSSIDer","explanation":"inSSIDer is listed for wireless discovery.","id":"S06Q36"},{"concept_id":"Wireless Attack Countermeasures:BYODVPN","variant":1,"category":"Wireless Attack Countermeasures","question":"How should authenticated BYOD users reach internal resources from an isolated WLAN?","choices":["VPN","Open SMB","Telnet","TFTP"],"answer":"VPN","explanation":"The notes recommend requiring a VPN.","id":"S06Q37"},{"concept_id":"Wireless Concepts:BYOD","variant":2,"category":"Wireless Concepts","question":"Which architecture forces personal devices through a VPN before internal access?","choices":["Isolated wireless network","Flat corporate LAN","Shared management VLAN","Open bridge to servers"],"answer":"Isolated wireless network","explanation":"The notes recommend isolating BYOD wireless and requiring VPN access.","id":"S06Q38"},{"concept_id":"Wireless Concepts:802.11ax","variant":1,"category":"Wireless Concepts","q eats","question":"Which technique uses guessed shared keys rather than captured user passwords?","choices":["Shared Key Guessing","Password Speculation","LEAP Cracking","PSK Cracking"],"answer":"Shared Key Guessing","explanation":"Shared-key guessing attempts default or cracked keys.","id":"S06Q50"}],[{"concept_id":"Wireless Concepts:802.11be","variant":1,"category":"Wireless Concepts","question":"Which generation uses Multi-Link Operation and targets very high throughput?","choices":["802.11be","802.11ax","802.11ad","802.11ac"],"answer":"802.11be","explanation":"802.11be is Wi-Fi 7 and the supplied course associates it with MLO.","id":"S07Q01"},{"concept_id":"Wireless Encryption Algorithms:Nonce","variant":1,"category":"Wireless Encryption Algorithms","question":"What cryptographic value is forced to repeat during key reinstallation?","choices":["Nonce","SSID","BSSID","PMK name"],"answer":"Nonce","explanation":"KRACK forces nonce/replay-counter reuse.","id":"S07Q02"},{"concept_id":"Wireless Threats:CatIntegrity","variant":2,"category":"Wireless Threats","question":"Where does bit-flipping belong in the wireless threat model?","choices":["Access Control","Integrity","Confidentiality","Availability"],"answer":"Integrity","explanation":"Integrity attacks manipulate or forge wireless frames.","id":"S07Q03"},{"concept_id":"Wireless Hacking Methodology:DeauthReason","variant":2,"category":"Wireless Hacking Methodology","question":"Why disconnect a legitimate station before offline password testing?","choices":["Force reconnection and capture authentication","Change the SSID","Disable RADIUS","Increase transmit power"],"answer":"Force reconnection and capture authentication","explanation":"Deauthentication forces a reconnect and capture opportunity.","id":"S07Q04"},{"concept_id":"Wireless Threats:Stronger","variant":1,"category":"Wireless Threats","question":"What characteristic makes a rogue same-name AP more attractive to clients?","choices":["Stronger beacon signal","Longer DHCP lease","Lower DNS TTL","Higher RADIUS timeout"],"answer":"Stronger beacon signal","explanation":"The course describes honeypot APs using stronger beacons.","id":"S07Q05"},{"concept_id":"Wireless Threats:Eavesdrop","variant":1,"category":"Wireless Threats","question":"Which confidentiality attack simply listens to wireless communications?","choices":["Eavesdropping","Masquerading","Session hijacking","Beacon flooding"],"answer":"Eavesdropping","explanation":"Eavesdropping passively intercepts traffic.","id":"S07Q06"},{"concept_id":"Wireless Threats:APMisconfig","variant":1,"category":"Wireless Threats","question":"Which access-control weakness comes from legitimate equipment with unsafe settings?","choices":["AP misconfiguration","Client mis-association","MAC spoofing","KARMA"],"answer":"AP misconfiguration","explanation":"AP misconfiguration exposes the WLAN through legitimate but unsafe settings.","id":"S07Q07"},{"concept_id":"Wireless Threats:EAPFail","variant":1,"category":"Wireless Threats","question":"Which availability attack injects a forged failure into a valid 802.1X exchange?","choices":["EAP-Failure","RADIUS Replay","KRACK","PSK Cracking"],"answer":"EAP-Failure","explanation":"EAP-Failure attacks inject forged failure messages.","id":"S07Q08"},{"concept_id":"Wireless Encryption Algorithms:Reaver","variant":2,"category":"Wireless Encryption Algorithms","question":"Which utility is paired with monitor mode and a target BSSID for PIN recovery?","choices":["Reaver","Cowpatty","Asleap","Kismet"],"answer":"Reaver","explanation":"Reaver is the course tool for WPS PIN cracking.","id":"S07Q09"},{"concept_id":"Wireless Encryption Algorithms:OfflineResistance","variant":1,"category":"Wireless Encryption Algorithms","question":"Which property prevents a captured exchange from enabling normal offline password guessing?","choices":["Resistance to offline dictionary attacks","Static-IV reuse","Shared GTK reuse","Open authentication"],"answer":"Resistance to o
